.postTitle {

.commentAndChildren > input:checked ~ .commentList {

}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {

.streamableContainer {

  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    <h2>
      <a class="postTitle" href="https://v.redd.it/0l53xevo1b7h1"><p>Impending Doom.. archmage? one button zoomy build that feels like a poe1 build</p>
</a>
    </h2>

    

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="orntgdy" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>hc6 [OP]</div>
        <div>1 | 34 minutes ago </div>
      </div>
      <label for="orntgdy" class="commentText"><p>POB: <a href="https://pobb.in/XIiCQ6nFrbYQ" target="_blank">https://pobb.in/XIiCQ6nFrbYQ</a></p>

<p>The build concept is based off of despair&rsquo;s alt quality on gemling - 50% reduction in cost per 20% quality, we can achieve 100%+ reduction on cost with quality stacking. Normally archmage builds need to solve for mana cost&hellip; for this build, your main spell is FREE! which means you don&rsquo;t need to pick up any cost efficiency anywhere can scale cast speed as hard as you want!</p>

<p>Gemling has other synergies with archmage, with 40% quality on archmage, we get 2% additional gain as lightning (50% more compared to the baseline 4%), and the additional cost doesn&rsquo;t matter to us since despair is free!</p>

<ul>
<li><p>Alchemist boon&rsquo;s alt quality gives us 40% cast speed which is a huge chunk for only 30 spirit reservation.</p></li>

<li><p>To be mobile, blink&rsquo;s alt quality gives us DOUBLE the blink range</p></li>

<li><p>Virtuous barrier at 20% quality gives 7% inc mana regen and 7% inc life regen per stack - we can get 21 stacks, which is 147% mana/life regen, with the soul core to apply life regen to mana, we&rsquo;re getting almost 300% mana regen for free!</p></li>
</ul>

<p>The reworked vertex this league also gives us an easy +5 levels, scaling any curse spells super easily.</p>

<p>We need to trigger impending doom by making curses expire immediately, and the only way to do so is using the cursed ground support, which removes the cursed ground when you have more than 2 curse grounds up, which spell cascade does by creating 3 cursed grounds. We need to use windscream to have the curse activate immediately otherwise it feels super clunky. I&rsquo;m NOT using doedre&rsquo;s gem here despite it giving more damage because for some reason the doedre&rsquo;s triggered spell gets the added cost from archmage, but isn&rsquo;t affected by the cost reduction on despair quality, which means every time it triggers our mana pool empties.</p>

<p>This build clears super fast, one click and the screen explodes, as well as being able to scale single target to the moon without any CoC shenanigans - definitely the most enjoyable build I&rsquo;ve played so far.</p>
</label>
