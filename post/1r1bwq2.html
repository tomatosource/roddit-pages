

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://www.reddit.com/r/PathOfExile2/comments/1r1bwq2/guilds_to_join/"><p>Guilds to join?</p>
</a>
    </h2>

    
    <div class="selfPostContainer">
      <p>Hello, I am new to POE 2 and the genre. Looking to see if there are any guilds out there with discords to meet people and learn. Wish there was a guild finder added… thank you 🙏</p>

    </div>
    

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="o4ofsbn" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>JohnyAim</div>
        <div>2 | 3 hours ago </div>
      </div>
      <label for="o4ofsbn" class="commentText"><p>Don&rsquo;t want to sound rude or anything but there is absolutely no reason(benefit) to join a random guild&hellip; If you had friends that you trust and play together, ye, maybe - group stash, group conversations(though everyone uses discord for that). Other than that just use GLOBAL chat, there are alot of friendly people there that will help you and even chat with you.</p>

<p>Stay sane, exile.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="o4oxxal" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Unusual-Witness-4717</div>
        <div>1 | 41 minutes ago </div>
      </div>
      <label for="o4oxxal" class="commentText"><p>Normally guilds in any game is how you find people that you can trust and play with.</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="o4oqa37" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>zavorak_eth</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="o4oqa37" class="commentText"><p>There was a way to search on discord, but I think that got changed. You can search this sub for guilds. You can also ask in global for any guilds that are actively recruiting. You can also group up with people in game and see if any of them are in guilds. Guilds are a great way to play poe2, hang out with ppl on vc, and help each other out.</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
