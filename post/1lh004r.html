

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/hhqaoc180b8f1.jpeg"><p>Pricing help please?</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/hhqaoc180b8f1.jpeg" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="mz07zkl" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>jaymo_busch</div>
        <div>6 | an hour ago </div>
      </div>
      <label for="mz07zkl" class="commentText"><p>None, no one is playing shields this season, and anyone who is wants increased block chance on the shield as a prefix</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="mz0ixzy" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>char_tillio</div>
        <div>1 | 19 minutes ago </div>
      </div>
      <label for="mz0ixzy" class="commentText"><p>Ignore this comment, it&rsquo;s a complete lie. Block chance is nice, but completely irrelevant for Warbringer builds. People are still using shields, they&rsquo;re just not the most popular build. The bigger issue is the fact that it&rsquo;s armour/energy shield. A lot of the people using shields want to play with shield charge, which scales off armour. So, those people will be looking for purely armour based shields with as much armour as possible. It would be a very good shield overall if not for this problem with the base item.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="mz0m4cx" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>jaymo_busch</div>
        <div>1 | 2 minutes ago </div>
      </div>
      <label for="mz0m4cx" class="commentText"><p>I saw Kaltorak just put out a shield charge video, maybe price will jump today, but maybe less than 50 people realistically will try the build because the video</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

    
  </div>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="mz0727c" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>ImKeyed</div>
        <div>3 | an hour ago </div>
      </div>
      <label for="mz0727c" class="commentText"><p>1ex</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="mz0ees2" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>zavorak_eth</div>
        <div>1 | 42 minutes ago </div>
      </div>
      <label for="mz0ees2" class="commentText"><p>Not sure, but haven&rsquo;t been able to sell any shields, even with 40% block chance and decent stats for even 10ex. Also, they&rsquo;re super cheap if you want one.</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
