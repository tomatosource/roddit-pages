

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://v.redd.it/7wx87niecyng1"><p>The Rutgers middle infield fakes out the runner on a fly ball to center to get the double play</p>
</a>
    </h2>

    

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="o9fupep" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>NZafe | Toronto Blue Jays</div>
        <div>15 | 2 hours ago </div>
      </div>
      <label for="o9fupep" class="commentText"><p>What base coach waved the guy to run 4/5th of the way to 2nd on a fly ball? The SS didn’t even make the fake until the runner was already at 2nd.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="o9fxxqj" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Craig_the_Intern | San Diego Padres</div>
        <div>6 | an hour ago </div>
      </div>
      <label for="o9fxxqj" class="commentText"><p>He was already stealing 2nd before the pitch. He only hears the crack of the bat when he’s halfway there, and then sees the SS going for the “ground ball” so he panics a bit</p>

<p>it wasn’t perfect base running (should have looked to a coach?) but I think it was a perfect trick play</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="o9fyfdg" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Thrill0728 | Chicago Cubs</div>
        <div>4 | an hour ago </div>
      </div>
      <label for="o9fyfdg" class="commentText"><p>This is why you&rsquo;re taught to look in to see the pitch cross while you&rsquo;re stealing.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="o9g0doq" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>AnnihilatedTyro | Seattle Mariners</div>
        <div>2 | 40 minutes ago </div>
      </div>
      <label for="o9g0doq" class="commentText"><p>2B was just sort of standing on 2B blocking the runner&rsquo;s path when there&rsquo;s no play to be made.  Not sure what that specific rule is for college ball, but I think he&rsquo;s lucky the runner was paying just enough attention to avoid a full-body collision.</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
