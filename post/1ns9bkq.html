

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://youtu.be/dxMWNWcaXdU?si=C9PPblgXFNG45wVT"><p>Mahmoud Abdul-Rauf hits a 55-foot game-winning shot at the buzzer to beat the Clippers in 1992</p>
</a>
    </h2>

    

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="ngk9txr" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>dzgz | Nuggets</div>
        <div>3 | 12 hours ago </div>
      </div>
      <label for="ngk9txr" class="commentText"><p>RAUF! There it is</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="ngkvbcl" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>No_Routine_5862 | Spurs</div>
        <div>1 | 10 hours ago </div>
      </div>
      <label for="ngkvbcl" class="commentText"><p>lol that shot at 48 seconds is fucking absurd. I love how much the 3 ball was neglected. Its so funny after watching todays game</p>

<p>even the commentator said from &ldquo;deep outside&rdquo; even though it wasnt even a 3 attempt</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nglss01" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>whiskey_neat_ | Clippers</div>
        <div>1 | 6 hours ago </div>
      </div>
      <label for="nglss01" class="commentText"><p>Like I know there&rsquo;s degradation over the years for the source material (especially in this one since we see so much tracking), but it&rsquo;s so crazy how watching games on a 19&rdquo; tube TV in the 90&rsquo;s felt so normal and clear, but when we watch old footage nowadays, regardless of how clean the original source was, it still looks like shit.</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
