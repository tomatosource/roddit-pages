

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/38irrbdwxijg1.jpeg"><p>Reforging Unique Gear</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/38irrbdwxijg1.jpeg" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="o5eiwvd" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>ApprehensiveJurors</div>
        <div>5 | 8 hours ago </div>
      </div>
      <label for="o5eiwvd" class="commentText"><p>3x of the same unique will return 1x unidentified - that unid unique does have a chance to drop lvl 19+ yeah</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="o5ek8pq" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>verthros</div>
        <div>4 | 8 hours ago </div>
      </div>
      <label for="o5ek8pq" class="commentText"><p>reforging gives an item of the lowest ilvl item you put in. Skill level is tied to ilvl. The breakpoint is 81 i think? could be 80, but 81 to be sure (i couldnt find an ilvl 80 with lvl 20 life remanents). So you would have to throw in non-corrupted ilvl 81 in there. I dont know what the odds are for it :D.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="o5et0zs" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Poopthunder</div>
        <div>2 | 7 hours ago </div>
      </div>
      <label for="o5et0zs" class="commentText"><p>I’m pretty sure the threshold is ilvl82 and the result will default always to lowest ilvl used so you have to use 3 of them. Percentage wise its a few percent to hit lvl20 so you can gamble if you wish but it likely will take a while.</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="o5f8sza" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>DismalDirection7030</div>
        <div>3 | 6 hours ago </div>
      </div>
      <label for="o5f8sza" class="commentText"><p>yes you can, lowest item level i have reforged is 81, but there are item level 80 items with level 20 skills that you can get from trade so its probaly that. you can also get level 20 skills from  chancing.</p>

<p><a href="https://preview.redd.it/lwhksieopjjg1.png?width=708&amp;format=png&amp;auto=webp&amp;s=e3ae6112a1c05d04a199b03af6b51f232385faf0" target="_blank">https://preview.redd.it/lwhksieopjjg1.png?width=708&amp;format=png&amp;auto=webp&amp;s=e3ae6112a1c05d04a199b03af6b51f232385faf0</a></p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="o5ej13d" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Disastrous_Main_2629</div>
        <div>2 | 8 hours ago </div>
      </div>
      <label for="o5ej13d" class="commentText"><p>Yes it does, but the chances arent exactly high. From my experience higher item level gives you better chances to roll a higher level
*and if you reforge 3 items with different item level it seems to use the lowest as base</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="o5eqdzt" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Poopthunder</div>
        <div>2 | 8 hours ago </div>
      </div>
      <label for="o5eqdzt" class="commentText"><p>You need to put 3x ilvl82 to recombine and it CAN roll lvl20 skill but the chance is around few % per recombine I’d say so it might take a while.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="o5fldki" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Hadiiiiiii</div>
        <div>1 | 5 hours ago </div>
      </div>
      <label for="o5fldki" class="commentText"><p>yes, you can get ones with lvl 20 skill, i did for the covenant rope i few days ago and took me like 12-13 reforges, but i got a little lucky and the avg is higher for sure</p>
</label>

  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="o5g291w" type="checkbox" checked/>

      <div class="commentHeader">
        <div>-Dargs</div>
        <div>1 | 3 hours ago </div>
      </div>
      <label for="o5g291w" class="commentText"><p>Yes. At the start of the league when Choir was popular a lvl 20 went for 85d so some people would buy all of the 18s for 0.5d and 3:1 them. It took around 25 per lvl 20 created. The margins were really good.</p>
