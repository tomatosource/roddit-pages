

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/b2hiqbpfaoog1.jpeg"><p>Help me pls!</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/b2hiqbpfaoog1.jpeg" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="oa59a7u" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Giraffeb8</div>
        <div>1 | 7 hours ago </div>
      </div>
      <label for="oa59a7u" class="commentText"><p>Depends on your funding. If you&rsquo;re set on this item then hitting a fracture before unveiling would be the way. If you hit %phys then you&rsquo;re golden. If not then it&rsquo;s pretty rng/expensive.</p>

<p>If your desecration is on the prefix you can unveil accuracy (or ele %) to block it for the exalt slam. Prefix exalt omen and pray. If you miss then you can Omen of Sinestral Exaltation with Greater essence of Alacrity for onslaught if you want and try again. You can rinse and repeat prefix slams with omen of light and Sinestral Crystallization buuut I really wouldn&rsquo;t do this on an item base like this tbh. T1 crit with a fractured t1/2 %phys is worth the gamba.</p>

<p>Crafted a lot of spears this league and made the mistake of burning through omen of lights without a t1 fractured prefix. Just have to let go of bad fractures and start on a fresh spear if you want to make a gg wep</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="oa3q9x6" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>CaptainAgnarr</div>
        <div>0 | 12 hours ago </div>
      </div>
      <label for="oa3q9x6" class="commentText"><p>Desecrate the prefix until you get lucky</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
