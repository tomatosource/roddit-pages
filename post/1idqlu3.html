      <label for="ma14kvl" class="commentText"><p>From <a href="http://Globe.com" target="_blank">Globe.com</a></p>

<p>By Christopher L. Gasper</p>

<p>Celtics coach Joe Mazzulla would make a great motivational speaker. With his passion, confidence, and cheery view of challenges, Mazzulla is quite convincing. The problem for the Celtics is that Mazzulla is convinced and convincing his charges that their nearly two-month unbroken basketball spell of underachievement is no big deal.</p>

<p>His embrace of this rough spot <a href="https://www.bostonglobe.com/2025/01/17/sports/celtics-joe-mazzulla-recent-struggles/?p1=Article_Inline_Text_Link" target="_blank">as the “fun part” of the season</a> is perpetuating a falsehood and perpetuating a malaise dating to Dec. 1 that should’ve been parked in Boston’s rearview mirror weeks ago. The defending NBA champions started the season a soaring 16-3. Since then, they have authored a blasé 17-12 mark following <a href="https://www.bostonglobe.com/2025/01/29/sports/celtics-bounce-back-beat-bulls/?p1=Article_Inline_Text_Link" target="_blank">Wednesday night’s 122-100 win</a> over the Zach Lavine-less Bulls at TD Garden. The Celtics are 12-10 in their last 22 games.</p>

<p>What’s wrong with the Celtics has become as common a query in Boston as “What’s the deal with all these bike lanes?” The Celtics are on the wrong path, and it’s up to the leader of the pack, Mazzulla, to alter the team’s direction. That starts with altering his message regarding the team’s unacceptable underperformance and some of his strategy.</p>

<p>The insouciant Celtics sleepwalking through the season and their incessant happy talk surrounding a two-month morass have grown tiresome. No more writing off recent losses to the Raptors, Hawks, and Rockets as the other team being the one befitting a mascot named Lucky. No more excusing beatdowns such as the one LeBron and the Lakers put on them on a 3-1 Western road trip as solely products of the schedule. No more citing math as the reason the team’s 3-point shooting will revert to 2023-24 levels of marksmanship.</p>

<p>The Celtics and their commendable coach act like they have the NBA all figured out. You would think they’ve already won multiple championships and weren’t chasing becoming the first team since the Warriors (2017, ‘18) to lift the Larry O’Brien Trophy “The Lion King”-style in consecutive seasons.</p>

<p>As the Honest Abe of Boston basketball, Kristaps Porzingis, said, <a href="https://www.boston.com/sports/boston-celtics/2025/01/25/kristaps-porzingis-celtics-house-cat-lion-quotes-mavericks/" target="_blank">the Celtics have behaved more like house cats</a> this season than the lions they were during a roaring 2024.</p>
