

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://www.youtube.com/watch?v=TM8xYse-1BI"><p>Path of Exile 2 has a UX problem.</p>
</a>
    </h2>

    

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="nuk1ert" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>dont_trust_the_popo</div>
        <div>1 | 40 minutes ago </div>
      </div>
      <label for="nuk1ert" class="commentText"><p>You can tell a developer made the UI. Developers make the worst UI/UX. Got to pass it off to those artsy folk</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nuk1jjr" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>kestononline</div>
        <div>1 | 40 minutes ago </div>
      </div>
      <label for="nuk1jjr" class="commentText"><p>Over 10 years and there still is no inventory or tab <em>&ldquo;sort&rdquo;</em> button for the contents of said tab or inventory. I&rsquo;m a UX oriented person and this is one of my biggest pet peeves.</p>

<p>But I feel it is deliberately designed  inconvenience so that the value of the stash tabs and relevant organization options via Mtx remains high.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nujg19g" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>BioEradication</div>
        <div>2 | 3 hours ago </div>
      </div>
      <label for="nujg19g" class="commentText"><p>Add it to the list of problems.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nuk5nju" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>nsfw_1p2o3i</div>
        <div>1 | 19 minutes ago </div>
      </div>
      <label for="nuk5nju" class="commentText"><p>Clearly, GGG doesn&rsquo;t have any UX staff. It makes perfect sense now why the whole game is so user-unfriendly and barely explains anything.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nuk5xbz" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Ojntoast</div>
        <div>1 | 18 minutes ago </div>
      </div>
      <label for="nuk5xbz" class="commentText"><p>For anyone watching the last 10 years, its been apparent that GGG never staffed a UX department.  The implementation has clearly been done by a developer and not a UX Designer.  Or (like in most companies) - the Developers ignored the UX Designers input - because it was too many story points to do it right.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nujpdqi" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>SignatureForeign4100</div>
        <div>-2 | 2 hours ago </div>
      </div>
      <label for="nujpdqi" class="commentText"><p>It’s PoE(n-&amp;gt;inf). Every game GGG makes will have UI problems and every improvement will be offset by an equally worse new thing. I would be shocked if they even had a single dedicated UX designer</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
