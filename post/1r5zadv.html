    <h2>
      <a class="postTitle" href="https://www.reddit.com/r/PathOfExile2/comments/1r5zadv/crafting_guide/"><p>Crafting guide</p>
</a>
    </h2>

    
    <div class="selfPostContainer">
      <p>I’m currently trying to learn the process to roll for a high evasion and energy shield body armor for my flicker monk</p>

    </div>
    

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="o5msl8g" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>ammenz</div>
        <div>2 | 13 hours ago </div>
      </div>
      <label for="o5msl8g" class="commentText"><ol>
<li><p>Edit your filter to highlight the best bases (normal and magic) to start with. These must have the highest EV/ES possible or a high EV/ES combined with a really good implicit.</p></li>

<li><p>If you want exceptional base, it&rsquo;s best if you buy it from the market.</p></li>

<li><p>Perfect trans and perfect augme.</p></li>

<li><p>Check PoE2DB to see what are the least likely affixes (that you desire). You want these first.</p></li>

<li><p>Check if there&rsquo;s any essence (greater or perfect) that yields a desirable outcome.</p></li>

<li><p>Your budget and goal dictate your crafting strategy. With an infinite budget you can perfect chaos spam, fracture, hinekora and whittle at every step to aim for all desired T1. If you are on a tight budget you must settle for far from perfect affixes and unwanted affixes (perfect trans, perfect augme, perfect regal, non-ancient desecration, omen of greater exaltation + perfect exalt).</p></li>
</ol>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="o5on2sf" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>WhichWolfEats | customflair</div>
        <div>1 | 4 hours ago </div>
      </div>
      <label for="o5on2sf" class="commentText"><p>The easiest way would be to buy a falconers jacket if you want move speed:. Roll it with p aug and anul til you get flat ev/es# and deflection. Add t3 ev/es % with essence, desecrate prefix for hybrid ev/es and yolo suffix. Should be pretty decent if you don’t need spirit</p>
</label>
    </div>
  </label>
  
</div>
