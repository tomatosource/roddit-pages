

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://www.reddit.com/gallery/1nt74cb"><p>FYI this outfit changes your hairstyle - GGG give us hair options!</p>
</a>
    </h2>

<div class="commentAndChildren">

        <div>8 | 3 hours ago </div>
      </div>
      <label for="ngrumde" class="commentText"><p>It&rsquo;s to avoid clipping. I think for each body armor the devs can click a hair version to go with it. It&rsquo;s in PoE 1 too since Witch has super long hair.</p>

      </div>
      <label for="ngrz583" class="commentText"><p>I really wish we had more character customization, especially gender swap or even better using other available variants unrelated to the class. Even as MTX I don&rsquo;t think we will get it, it&rsquo;s not a priority</p>

      </div>

<p>I mean look at my pic they already have alternate hairstyles, letting my monk grow a beard when he is out grinding maps wouldn’t be the end of the world, especially for Chayula monk who has fallen away from the order.</p>
</label>

</div>

    
  </div>
  
</div>

      <div class="commentHeader">
        <div>LadyDalama</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="ngs3p6i" class="commentText"><p>I really wish we could change the genders of the classes. It&rsquo;s such a simple thing for a game that won&rsquo;t have a sequel for.. Hell, 10+ years?</p>

    </div>
  </label>
  
</div>

</div>

      <div class="commentHeader">
        <div>Cornball23</div>
        <div>0 | an hour ago </div>
      </div>
      <label for="ngs2p63" class="commentText"><p>I really wish we could customize the character model it&rsquo;s so lame we are locked in to only one option per class</p>

  <div class="commentList">
    
      
<div class="commentAndChildren">

      <div class="commentHeader">
        <div>Daddy_Stop</div>
        <div>1 | 14 minutes ago </div>

      <label for="ngsa7a1" class="commentText"><p>Agree but the community <em>generally</em> doesn&rsquo;t like this so doubt it&rsquo;ll change. Unsure why but majority rules.</p>

  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="ngsaitq" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>JappoMurcatto</div>
        <div>1 | 11 minutes ago </div>
      </div>
      <label for="ngsaitq" class="commentText"><p>Which I don’t understand. Why can I customize my character with tons of armours and special effects but I can’t change homies hair? Giving the Merc a buzz cut when he is in the desert is not like lore inaccurate, if it was hot enough he would chop it off himself with a knife.</p>

</html>
