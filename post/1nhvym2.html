      <label for="neeh0x4" class="commentText"><ol>
<li><p>Bought ilvl 81 Siphoning wand on Exceptional base with 2 sockets - 12 div</p></li>

<li><p>Spammed Perfect Augments and Annuls. If I got any + levels others than all spells or physical spells, I would put the want up for sale or would craft it for profit. +5 Lightning is the most expensive one, followed by +5 chaos. According to craftofexile it takes about 21 tries to see any of the +5 skills. This is about the same cost or a bit more expensive then spamming chaos orbs, but it has an advantage that you get Magic items with open prefix, so you can slam a Perfect Augment with a good chance of high tier prefix.</p></li>

<li><p>So i slammed Perfect Augment and got extra cold damage which I didn&rsquo;t want,, but it&rsquo;s not a big problem. This is where I got cheap and decided to use an essence for guaranteed T3 cast speed instead of using Homo Perfect regal (which could potentially lead to a necessity of using annul omen on a prefix which costs 500 ex).</p></li>

<li><p>Slammed Homo Perfect suffix and got T1 Crit chance - exactly what I wanted for my build, because I already have a ton of crit damage.</p></li>

<li><p>Used sinistral crystalization to turn extra cold damage into desecrated mod. This is where I used Fracturing Orb, Hoping to hit +4 spell skills (while I have 3 suffixes and veiled prefi), as it would allow me to safely annul other mods instead of burning expensive annul omens. Sadly I hit cast speed. Then I unveiled, and I don&rsquo;t remember what I got, it something with the &ldquo;Damage &rdquo; tag.</p></li>

<li><p>Used Homo + Greater Exaltation + Perfect exalt and got T1 Physical Spell damage and Extra Lightning. For me this was insane luck because it&rsquo;s 2 out of the 3 mods that I want. Only better outcome would be Hitting Spell Damage + Spell Physical. If I&rsquo;d hit some other prefixes, I would either put it for sale if it&rsquo;s good for other builds, or would annul with omen and try again.</p></li>

<li><p>Now I have 5 mods that are exactly what I wanted and a desecrated mod to play with. I burned maybe a dozen Omen of Lights with Ancient Jawbones to try to get at least T2 Spell damage, but in fact I haven&rsquo;t seen that mod at all. So I settled for &ldquo;Spell Damage with Spells that cost life&rdquo; which is equal to T3 Spell Damage.</p></li>

<li><p>Bought Hinekora&rsquo;s (93 div) and applied it to want, checked Vaal Orb - it krangled the item, checked sanctify omen - it failed to produce +5 spells. I got sad that I&rsquo;ll have to grind for another Hinekora if I want to push this want to +7 all spell skills, but then I checked Omen of Corruption with Vaal, and it foresaw extra socket!</p></li>

<li><p>Socketed the want with 3 runes and done. Now I can kill 100% Delirium Azmeri spirited bosses 1 second faster than before.</p></li>
</ol>

<p>Feel free to ask me anything about crafting wands or caster items in general.</p>

<p>In case anyone wonders why I need +4 all spells and not +5 to single spell type: I play with Bone Cage (for mobs) and Bonestorm CoC Comet for bosses, and I kinda want levels of Comet, since it&rsquo;s around half or more of my boss dps. Plus I love the flexibility of having all spell levels as I can use this wand to try any other spell builds like Arc or Fireball. <a href="https://www.youtube.com/watch?v=njzXQ9h8z04" target="_blank">Here&rsquo;s my build in action</a></p>

      <label for="neejlsc" class="commentText"><p>is corrupting for the extra slot safer than sanctifying for +5 spells?</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="neeohnv" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Hatshepsut420</div>
        <div>1 | 9 minutes ago </div>
      </div>
      <label for="neeohnv" class="commentText"><p>When you&rsquo;re dealing with probabilities you should choose the option with the best expected value, so vaal vs sanctify really depends on a lot of factors. For wands, vaaling has 25% (33% with omen) chance to brick the item, 25(33)% of getting socket (so +1 spell level rune) and 25(33%) chance of getting random enchantment, some of which are also +1 skills. Now compare it to santify, for +4 spells it has 18% chance to turn it into +5 and also 18% to brick it by turning +4 into +3. For +5 skills the chances of both promoting or bricking are higher. And sanctify also brings rng to all other mods, which can both reduce or increase the value of item witch equal probability. The only exception is santifying caster amulets, because catalyst affects the calculation, which means you have high chance of getting +4 all spells and tiny chance of bricking it into +2 spells. Which is why I sanctify my crafted caster amulets and make a lot of divs.</p>

<p>In this case I opted for Hinekora&rsquo;s not because the item is worth more than 93 div, but because it&rsquo;s a very rare combination of mods, currently there nothing like that on the market, probably because there&rsquo;s no demand for these specific mods.</p>

<p>TL;DR it depends on item</p>
</label>
