

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://www.youtube.com/watch?v=6pV04Rfg7SA"><p>Blue Jays&rsquo; Pitcher Gausman said he was going to bat in the World Series vs the Dodgers.</p>
</a>
    </h2>

    

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="oc1xmej" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>baribigbird06 | Los Angeles Dodgers • World Baseball Classic</div>
        <div>6 | an hour ago </div>
      </div>
      <label for="oc1xmej" class="commentText"><p>Pitchers are always allowed to bat, the Designated Hitter (DH), however, allows a batter to take the at-bat in place of the pitcher. The most famous, and only pitcher to still regularly hit in the majors right now is Shohei Ohtani who plays as both DH and Starting Pitcher (SP) when he pitches, and a new rule was created for him to remain in the game as the DH when he finishes pitching. The DH was adopted by the American League in 1973, whereas the National League adopted it fairly recently, in 2022.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="oc27r4n" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Jump_Like_A_Willys</div>
        <div>3 | 19 minutes ago </div>
      </div>
      <label for="oc27r4n" class="commentText"><p>Paul Skenes has never batted in the majors, but he was known in college to be a pretty good hitter.  There are a couple other two-way capable players/prospects &ndash; although as you stated, Ohtani is the only one currently doing it.</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="oc25u89" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>ClarkeVice | Toronto Blue Jays</div>
        <div>4 | 28 minutes ago </div>
      </div>
      <label for="oc25u89" class="commentText"><blockquote>
<p> is there any kind of mercy rule in the league</p>
</blockquote>

<p>There isn’t, but I’m also not sure why it would apply in this case? The reason they played so long was that they were tied. A mercy rule wouldn’t solve any issue there.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="oc26dvn" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>stv7 | Toronto Blue Jays</div>
        <div>2 | 26 minutes ago </div>
      </div>
      <label for="oc26dvn" class="commentText"><p>I would support a rule that the opponent has to show mercy on the Blue Jays specifically by just letting them win, however</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

        
      
    </div>
  </body>
</html>
