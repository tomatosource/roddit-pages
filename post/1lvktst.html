    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;

*,
*:before,
*:after {
  box-sizing: border-box;

html {

}

body {
  display: flex;
  flex-direction: column;
  align-items: center;

  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;

  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;

.subName {

.postList {

.post {

.postLink {

  font-size: 42px;
  color: wheat;

  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;

  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {

}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

      <div class="commentHeader">
        <div>Asherogar</div>
        <div>3 | 16 hours ago </div>
      </div>
      <label for="n27aohb" class="commentText"><p>Hm, looks like waaay too many buttons and effort for a simple clear. But it works ig. My most successful attempt with the Spear of Ire was with a Tactician, utilising pin buildup from all projectile damage to get frenzy charges with Combat Frenzy and Cast on crit -&amp;gt; Snipers Mark. A basic Spear Throw is suprisingly good if you&rsquo;re able to generate charges, but you can&rsquo;t. The spear really needs either a rework or a rework to charges system allowing you to generate charges far more easily and consistently. Or well, another unique.</p>

<p>Btw, don&rsquo;t bother with elemental skills. Even a mediocre rare spear is far better with them, since you don&rsquo;t have any way to generate Frenzy Charges with Chaos Damage. Maybe Tactician can make it work, since he makes all projectile damage contribute to pin buildup, but I gave up on the build after a few weeks.</p>
</label>

      </div>
      <label for="n2bjvrf" class="commentText"><p>Personally I have liked very &ldquo;button heavy&rdquo; builds but I do know what you mean ^^</p>

<p>I use Chaotic Freeze in this setup and it generates a steady flow of Frenzy Charges on clear. I did run basic spearthrow earlier and might revert back to it, juicing that up more.</p>

    <div class="comment">
      <div class="commentHeader">
        <div>Deabers</div>
        <div>1 | 14 hours ago </div>
      </div>
      <label for="n280ojq" class="commentText"><p>Agreed just using basic attack to apply wither and also get rage.</p>

<p>You got decent idea here with the leech, but you don&rsquo;t have enough ES to make it worth. Mapping is slow.</p>

<p>I&rsquo;ve been hooked on lich for a while trying to crack it and got lucky enough to get the chaos Sceptre.</p>

<p>I ran with spire for a while, you can practically automate mapping with wind evasion even without new Sceptre by using the herald of plague tech- envenom corrosion + armor explosion and if you run plague fingers you can make your curse aura explosions chain. With new chaos Sceptre all this is unnecessary and just go boop.</p>

<p>Atziris disdain helm really let&rsquo;s you crank up the ES
But losing the glove slot is too much DMG loss for a melee char.</p>

<p>When I ran with spire I would poke bosses until dead but it was slow and agonizing. But it gives you rage and wither</p>

<p>After alot of trouble I found using the 300 % crit dmg gloves tangletongue and atsek to cause crits to poison let me take most advantage of lichs chaos bonus DMG.
If you use impale on blood hunt and rake right after it will scale off each other. Attrition is also a cheap DMG bonus if you need it.</p>

<p>My current setup is voltaxic Mark to shock easier, rake to start bleed, stab until wither is full, hunt, roll back, rake stab hunt and the second hunt does enough poison to oneshot a t16 boss and the third is exponentially stronger if you time your hunt and rake right but the impale can fall off with wind dancer so easiest to turn that off in a boss fight. Always open with rake, stack up the wither, then hunt and the poison will be strong</p>

<p>Ive tried several builds with spire, mjolnir and others on lich as a chaos melee fighter. Let me know if you have some questions I may have answers.</p>
</label>
