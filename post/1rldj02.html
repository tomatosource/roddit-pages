

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/jpgcqp9j77ng1.jpeg"><p>Broken desecration?</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/jpgcqp9j77ng1.jpeg" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="o8r664n" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>PlsExcuseMeThx</div>
        <div>8 | 2 hours ago </div>
      </div>
      <label for="o8r664n" class="commentText"><p>The item level is so low that there are literally no other modifiers you can get</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="o8r6loj" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>roydragoon89</div>
        <div>1 | 2 hours ago </div>
      </div>
      <label for="o8r6loj" class="commentText"><p>Well that’s unfortunate. I had wondered if that was the case. I appreciate the info. I really need a new stick. This one has served me for pretty much the entire life of my character but RNGeesus has not been kind enough to bless me with anything close.</p>
</label>
    </div>
  </label>
  
</div>

    
      
<div class="commentAndChildren">
  <input id="o8r7e5s" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>mindfuckedAngel</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="o8r7e5s" class="commentText"><p>oh wow, would not have thought of that tbh but absolutely correct</p>
</label>
    </div>
  </label>
  
</div>

    
      
<div class="commentAndChildren">
  <input id="o8r881a" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Dysss</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="o8r881a" class="commentText"><p>Shouldn&rsquo;t it at least still show low ilvl non-desecrated mods? +1 lightning is at least ilvl2 so there&rsquo;s more than enough possible mods to fill out 6 affixes. I&rsquo;m guessing it just breaks when trying to generate a desecrated mod, but I would still consider this a bug.</p>
</label>
    </div>
  </label>
  
</div>

    
      
<div class="commentAndChildren">
  <input id="o8r9mh1" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>MisterF2P</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="o8r9mh1" class="commentText"><p>I have made my fair share of low lvl gear and it is correct, the lvl 1-10 desecrate can be broken, it is a bug. I had to make 20 quiver with omen of putifecation to be able to fully roll 12 of them.</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

        
      
    </div>
  </body>
</html>
