

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://www.reddit.com/gallery/1jbprh4"><p>Bow Question</p>
</a>
    </h2>

    

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="mhvytky" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Raizel999</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="mhvytky" class="commentText"><p>Do enemies die faster? if you can answer that, then you have it</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="mhvz4jp" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>alvinlu1</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="mhvz4jp" class="commentText"><p>Did not buy the zealot yet. Was hoping to get insights from lightning deadeye vets with experience using dualstring vs other bows (without additional arrows).</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="mhvzwva" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Over-Bee1126</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="mhvzwva" class="commentText"><p>The extra arrow is nice but not worth losing that much dps imo. Only one arrow can hit a target, so if your fire 3 into 1 enemy it only calcs 1 of the arrows</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="mhw2o84" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Sathrenor</div>
        <div>1 | 18 minutes ago </div>
      </div>
      <label for="mhw2o84" class="commentText"><p>What he said. Unless You are playing Ice Shot Tornado where splinters scatter and ricochet back and forth like a Yondu&rsquo;s arrow, then it would not make <em>that much difference</em> than having over 100 more <em>base</em> DPS.</p>

<p>Although having uneven number of arrows is quite a QoL, because if You shoot only 2 arrows total, they will V-shape and You will miss most of mobs that aren&rsquo;t facehugging You. Even bosses. Been there, trust me.</p>
</label>
    </div>
  </label>
  
</div>

    
      
<div class="commentAndChildren">
  <input id="mhw0b5v" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>alvinlu1</div>
        <div>1 | 44 minutes ago </div>
      </div>
      <label for="mhw0b5v" class="commentText"><p>So, should I pull the trigger on the zealot, is the dps increase worth it? Thx.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="mhw2cj5" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Over-Bee1126</div>
        <div>1 | 21 minutes ago </div>
      </div>
      <label for="mhw2cj5" class="commentText"><p>You gonna go broke getting it?</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

    
  </div>
  
</div>

        
      
    </div>
  </body>
</html>
