

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://poe.ninja/poe2/profile/Silver%20Arrows-6662/character/DeadeyeRanger____"><p>Trying to balance my build, need some advice</p>
</a>
    </h2>

    

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="nkynppt" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Darkdealer</div>
        <div>1 | 4 hours ago </div>
      </div>
      <label for="nkynppt" class="commentText"><p>Tbh, I am fairly confused. You have a really good bow but the rest of your gear looks like it&rsquo;s some failed attempts at crafts.<br>
When I look at it right now, gloves are the last of your problems, your boots/chest/rings are in dire need of upgrade to keep up. You can get some &ldquo;free&rdquo; resists by buying a Headhunter with some resists as well.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="nkyrmen" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>SilverArrows6662</div>
        <div>1 | 3 hours ago </div>
      </div>
      <label for="nkyrmen" class="commentText"><p>I upgraded the bow (gifted from someone) and I&rsquo;m just killing everything now in seconds. I&rsquo;m trying to keep rarity on all gear, that&rsquo;s why the rings are not the best.</p>

<p>But ur comment seems a little ridic. I mean my chest piece (self crafted) has 3 tier1 es/Ev mods, and 2 resists. How is that a failed craft? My rings have double rarity that&rsquo;s why I can&rsquo;t get damage on all prefixes.</p>

<p>I have damage rings with 3 high damage mods, but then I can&rsquo;t get to 150 rarity.</p>

<p>Thanks for ur help, I&rsquo;ll look to upgrade my rings and gloves with either attack speed or crit damage.</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

        
      
    </div>
  </body>
</html>
