

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/cckxgjfawzah1.png"><p>Exalted versions of Chaotic Omens</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/cckxgjfawzah1.png" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="ovaqpb7" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Infinite-Violinist-7</div>
        <div>16 | 2 hours ago </div>
      </div>
      <label for="ovaqpb7" class="commentText"><p>Honestly I’m against it. We already have so many different omens in this game that it’s hard to keep track of them all.</p>

<p>Also this opens up the whole 5 mod 3 omen for max monster rarity and then exalt omen for mod of choice which is even more prep. The price will probably be based around that idea so it wouldn’t necessarily be cost efficient to use for what you intended</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="ovav7uj" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Latter-Clothes4516</div>
        <div>2 | 2 hours ago </div>
      </div>
      <label for="ovav7uj" class="commentText"><p>But hear me out&hellip; Omen of Waystone Annulment.. You can craft your own desired waystone to perfection! Better yet, since we are on the ideas train, why not add jewel sockets to waystones, so we can increase monsters stats additionally?</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="ovb60ha" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>theMuffinmanthe2nd</div>
        <div>1 | 27 minutes ago </div>
      </div>
      <label for="ovb60ha" class="commentText"><p>I&rsquo;ll do you one better, lets give waystone augment sockets, and introduce 100+ new runes to modify the waystones!</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

    
  </div>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="ovau4nk" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>soulcounter6</div>
        <div>2 | 2 hours ago </div>
      </div>
      <label for="ovau4nk" class="commentText"><p>Is it really necessary? you&rsquo;d only be able to add 3 modifiers per map and its just less efficient than the chaos omens. I get its supposed to be weaker/cheaper in concept but those omens already aren&rsquo;t that hard to come by.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="ovb1zis" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Cloud_Motion</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="ovb1zis" class="commentText"><p>If anything, can we just lower it to one omen instead of needing 3? The amount of admin needed before running maps and tablets should be reduced, not increased</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="ovb6c3j" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>El_Wiggler</div>
        <div>1 | 25 minutes ago </div>
      </div>
      <label for="ovb6c3j" class="commentText"><p>Nah, no more bloat please. </p>

<p>I&rsquo;d be behind the idea of &lsquo;exalts add a modifier or chaos rerolls modifiers that aren&rsquo;t x&rsquo;. </p>

<p>But adding yet another group of items to fix a simple issue is not the way to go. </p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
