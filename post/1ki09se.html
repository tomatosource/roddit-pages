

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/4z0zcfciamze1.png"><p>Can someone please help me with gear?</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/4z0zcfciamze1.png" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="mrb3sxq" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Windatar</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="mrb3sxq" class="commentText"><p>Aim for 75% for all resistance.</p>

<p>If your going to focus on ES then you want to have ES % on each item, if you want Evasion then try to have evasion on each item.</p>

<p>You should be aiming for Health on each item.</p>

<p>If your going lightening spear for your damage you want to grab a Tangletongue as it forks crits which essentially means double crit. which should massively boost your damage.</p>

<p>If your primarily lightening for damage then you don&rsquo;t need those chaos/fire+ damage increase %. You want to stream line your stats a bit.</p>

<p>But mostly you just need better resistances and you need each piece of gear to have more ES/Evasion on it as your pretty low on it.</p>

<p>My two cents.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="mrb4hgu" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Windatar</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="mrb4hgu" class="commentText"><p>Also, don&rsquo;t throw away gear if its good but not the stats you want that moment, like resistances are not the kind you want. You might find other gear you can pick up and use that might work better with gear you passed on previously but would only work with another piece.</p>
</label>
    </div>
  </label>
  
</div>

    
      
<div class="commentAndChildren">
  <input id="mrb5ihq" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>k00ba83</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="mrb5ihq" class="commentText"><p>Regarding the spear, I thought I should aim for the highest accuracy for the Penetrate bonus?</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="mrbbyj9" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Windatar</div>
        <div>1 | 15 minutes ago </div>
      </div>
      <label for="mrbbyj9" class="commentText"><p>When it comes to damage, Tangletongue is BIS for lightening spear. It&rsquo;s also BiS for most bleed/rake builds.</p>

<p>Having high accuracy is great, but you can find it on other gear pieces. Emerald rings for example have high explicit accuracy already baked into them if you find yourself already good with resistances.</p>

<p>If your unsure, you can pick up a tangletongue and try it out. If your trade league they&rsquo;re probably cheap with how many there are, if you don&rsquo;t want to buy it then you can gamble spears from the shop or you can find forked spears white base&rsquo;s and use chance orbs. (Think they have a high chance of working.)</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

    
  </div>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="mrb3kei" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>0MrFreckles0</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="mrb3kei" class="commentText"><p>First thing that stood out to me is that your life looks pretty low, you should try hit 2K.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="mrb5s8y" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>taa-1347</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="mrb5s8y" class="commentText"><p>Drop your unique helmet, get a good rare instead. Same for gloves. Unless you think you are <em>really</em> benefitting from those unique mods (enemies on low life / electrocution). Your defences are very low. Aim for 2k+ total life+ES minimum.
Once you reach 2k, you can either keep scaling those life/es, or go more into evasion. 75% ev feels nice, personally speaking.</p>

<p><del>Your spear is bad. As someone else here says Tangletongue can be pretty good, but even outside that you can get a much better rare spear than what you have right now.</del> Edit: nvm, i missed the accuracy part. Should be okay.</p>

<p>The ring at the top is okay, although mostly for resists; the ring at the bottom is pretty bad. Look for +damage modifiers on rings, they tend to be better than +%lighthning damage (the other stats of the stats on your bottom ring are pretty much useless).</p>

<p>Boots with only 25% (and not 30%) movement speed is annoying but not a big deal.</p>

<p>The rest is.. okay.</p>
</label>
    </div>
  </label>

<div class="commentAndChildren">
  <input id="mrbabxk" type="checkbox" checked/>

      <div class="commentHeader">

    </div>
  </label>
  
</div>

    
  </div>
  
</div>

  </body>
</html>
