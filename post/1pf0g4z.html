      <label for="nsgamcv" class="commentText"><p>What Passan has to say about Kyle Schwarber is quite interesting, in my opinion.</p>

<blockquote>
<p><strong>Last year&rsquo;s winter meetings were all about Juan Soto &ndash; is there one free agent or theme on everyone&rsquo;s mind going into the meetings this year?</strong></p>

<p><strong>Passan:</strong> When does the Kyle Schwarber dam break? Several teams&rsquo; fortunes &ndash; from Philadelphia to Cincinnati to Pittsburgh to Boston to Baltimore to the New York Mets &ndash; depend on where Schwarber goes. The belief among teams is that it will take five years to secure the 32-year-old, and once that happens &ndash; perhaps sometime during the meetings &ndash; teams will start pivoting, and the action will pick up demonstrably.</p>
</blockquote>

<p>&hellip;</p>

<blockquote>
<p><strong>Which top free agent hitter is most likely to sign during the winter meetings?</strong></p>

<p><strong>Passan:</strong> Schwarber is the best bet. Tucker isn&rsquo;t close to done yet. Cody Bellinger has a healthy market but is biding his time. Alex Bregman and Bo Bichette are world-class infielders with ample, moneyed suitors. Pete Alonso&rsquo;s signing could go down after Schwarber.</p>
</blockquote>

<p>&hellip;</p>

<blockquote>
<p><strong>Which other hitters could move quickly at the meetings?</strong></p>

<p><strong>Passan:</strong> If Schwarber goes early, everyone is in play.</p>
</blockquote>

<p>It seems like, according to Passan, a lot hinges on when and where Schwarber signs.</p>
