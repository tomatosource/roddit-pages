

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/jxko0o0gjgpf1.png"><p>This layout has to be the worst&hellip;</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/jxko0o0gjgpf1.png" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="neh49v2" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>DrRichardShay</div>
        <div>1 | 18 minutes ago </div>
      </div>
      <label for="neh49v2" class="commentText"><p>This community just wants linear stand maps but when it&rsquo;s a narrow circle they hate it.  I don&rsquo;t get it.  This is just a linear map where you hug the inside.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="neh4cj3" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>BigHatAbe</div>
        <div>1 | 17 minutes ago </div>
      </div>
      <label for="neh4cj3" class="commentText"><p>I also dislike this layout. But just a piece of advice for y&rsquo;all. The entrance to the boss room is <em>always</em> on the &ldquo;inside of the circle.&rdquo; So while clearing just make sure to get vision of the entirety of the inside of the circle, and you&rsquo;ll never miss it.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="neh3m34" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Poopthunder</div>
        <div>1 | 23 minutes ago </div>
      </div>
      <label for="neh3m34" class="commentText"><p>I hate hidden grotto. The entrance point changes so you have to go through every nook in the massive circle. </p>

<p>Atleast it isn’t anywhere near as common as start of 0.2. It used to be around 40% of maps I believe.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="neh47po" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>unsungWombat</div>
        <div>1 | 18 minutes ago </div>
      </div>
      <label for="neh47po" class="commentText"><p>I have had the boss zone map on the outer edge, which sucked. I thought it always spawns on the inner part, thankfully that has only happened once to me.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="neh5h86" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>creamedethcorneth</div>
        <div>1 | 8 minutes ago </div>
      </div>
      <label for="neh5h86" class="commentText"><p>I’m gonna be the odd one out and say that I love the grotto layout. It was my favorite in PoE1 and that has carried over.</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
