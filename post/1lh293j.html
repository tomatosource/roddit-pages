

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://www.reddit.com/r/PathOfExile2/comments/1lh293j/double_unique_jewels/"><p>Double Unique Jewels</p>
</a>
    </h2>

    
    <div class="selfPostContainer">
      <p>Is there a 1 unique jewel max in the skill tree? I have a friend trying to equip two unique jewels in his tree and it&rsquo;s not allowing him to.</p>

    </div>
    

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="mz0r8d2" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>char_tillio</div>
        <div>1 | 6 hours ago </div>
      </div>
      <label for="mz0r8d2" class="commentText"><p>I don&rsquo;t believe it&rsquo;s a &ldquo; can&rsquo;t have two uniques&rdquo; rule, I think it&rsquo;s a &ldquo;two of the same unique jewel&rdquo; rule, because my friend was screensharing his build, tried to equip 2x Prism of Belief jewels, but it wouldn&rsquo;t let him.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="mz0rz3o" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Alternative_Leave_89</div>
        <div>1 | 6 hours ago </div>
      </div>
      <label for="mz0rz3o" class="commentText"><p>1 unique of each type there are multiple</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="mz0tp1h" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>elew21</div>
        <div>1 | 6 hours ago </div>
      </div>
      <label for="mz0tp1h" class="commentText"><p>You can&rsquo;t equip 2 of the same. IE you can&rsquo;t equip 2 megalomaniac jewels. However you can have 1 megalomaniac and one from nothing unique jewel.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="mz0tuta" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Commoble</div>
        <div>2 | 6 hours ago </div>
      </div>
      <label for="mz0tuta" class="commentText"><p>It&rsquo;s not a 1 unique jewel rule or even a &ldquo;can&rsquo;t have two of the same unique&rdquo; rule, it&rsquo;s part of the jewel itself.</p>

<p>Many unique jewels have &ldquo;Limited to: x&rdquo; in the description, usually one, like Prism of Belief: <a href="https://www.poe2wiki.net/wiki/Prism_of_Belief" target="_blank">https://www.poe2wiki.net/wiki/Prism_of_Belief</a></p>

<p>It&rsquo;s not necessarily one, some can have a higher limit, like Grand Spectrum is limited to three: <a href="https://www.poe2wiki.net/wiki/Grand_Spectrum_(Emerald" target="_blank">https://www.poe2wiki.net/wiki/Grand_Spectrum_(Emerald</a>)</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
