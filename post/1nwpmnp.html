

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/dm99r8u4rtsf1.jpeg"><p>Why won’t this craft:(</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/dm99r8u4rtsf1.jpeg" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="nhhqqy9" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>convolutionsimp</div>
        <div>5 | 7 hours ago </div>
      </div>
      <label for="nhhqqy9" class="commentText"><p>Not sure if I understand correctly but you already have 2 suffixes. You can&rsquo;t add two more suffixes. It&rsquo;s 3 prefix, 3 suffix.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nhhsrj5" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>mangoELMAGO</div>
        <div>2 | 7 hours ago </div>
      </div>
      <label for="nhhsrj5" class="commentText"><p>you already have x2 suffixes so you can only get 1 more and given how low weighted gem levels are more likely than not you will get critical hit chance than the gem lvls</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nhhyei0" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>KnzznK</div>
        <div>1 | 6 hours ago </div>
      </div>
      <label for="nhhyei0" class="commentText"><p>It &ldquo;won&rsquo;t go&rdquo; because there are no two modifiers your exalted orb could add which would satisfy homo-omen, meaning adding 2 modifiers of the same type. This cannot be done. You have only caster, damage, and crit tags. There are no available prefixes with these tags. Suffixes yes, but the item has 2 suffixes already, it cannot have 4. It &ldquo;will go&rdquo; if you remove omen of greater exaltation, but you&rsquo;ll hit crit chance unless you&rsquo;re extremely lucky (thanks to crit -tag from crit multi).</p>

<p>If you want to guarantee success (cast speed + critmulti + levels) you need to get rid of the critmulti first one way or another, then slam it and +3 levels back using homo + dextral + greater with a perfect exalted. One way to get rid of critmulti would be to win <sup>50</sup>&frasl;<sub>50</sub> using dextral + perfect enhancement, assuming you want/need global defenses. Or to fool around with essence of the abyss. There is no guaranteed way to save the amulet without spending too much currency considering how easy amulets like these are to craft.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nhi2p9a" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>eugenelkw</div>
        <div>1 | 6 hours ago </div>
      </div>
      <label for="nhi2p9a" class="commentText"><p>The spell damage prefix also has a damage tag which in turn would add a possibility of add crit damage as a suffix. You&rsquo;re better off annuling the amulet down to only cast speed, which in turn would force +3 spells alongside spell damage.</p>

<p>Though I&rsquo;d say u should probably just get a new base&hellip;</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
