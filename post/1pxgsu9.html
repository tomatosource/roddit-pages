<div class="commentAndChildren">
  <input id="nwb2l20" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>mainguide36</div>
        <div>5 | 4 hours ago </div>
      </div>
      <label for="nwb2l20" class="commentText"><p>I&rsquo;m assuming you don&rsquo;t want to run Atziri? Just path to the special rooms as quickly as you can and complete them so they go away. Should take 5-10 runs at most depending on your rng. Then you can start building a loop from the outside. Don&rsquo;t really worry about the middle stuff, it&rsquo;ll naturally go away over time if you focus on your outer loop.</p>

<p>Just be warned that it&rsquo;s a lot of time investment to build a long loop. If you are more casual, just keep running Atziri.</p>
</label>

<div class="commentAndChildren">
  <input id="nwb0egw" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Sosijmonster</div>
        <div>3 | 4 hours ago </div>
      </div>
      <label for="nwb0egw" class="commentText"><p>I&rsquo;d try do a few more runs and try to complete the &ldquo;special&rdquo; rooms you&rsquo;ve put on to remove them (they wont destabilise until you complete them). Then do a few more runs where you just go in and out dont place anything, should (I believe) clear shit off back to near square one.</p>

<p>As someone who plays at most 1-2 hours a day this league mech has been aids. Not being able to steadily &ldquo;progress&rdquo; without getting fudged up the arse with RNG on either not getting right rooms or getting rooms I want to keep destabilised alll the freaking time - really has me tired.</p>

<p>I can defo see why the juicers love it though.</p>

        <div>1 | 5 hours ago </div>
      </div>
      <label for="nway9wz" class="commentText"><p>Hey, any advice on how to fix this would be appreciated. Whole thing is a mess, this is the most poorly designed and explained league mechanic I&rsquo;ve ever experienced, what do I do here to progress this? Can&rsquo;t seem to wipe it and start again?</p>
</label>

<div class="commentAndChildren">
  <input id="nwb4rer" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Evermore3000</div>
        <div>7 | 4 hours ago </div>
      </div>
      <label for="nwb4rer" class="commentText"><p>The worst case scenario for if your temple is truly bricked is you don&rsquo;t place any rooms. The temple will then destabilize or decay at a rapid pace. In around 7 to 8 runs based on the image it should reset. To speed it up even more, put a couple rooms or pathways to the architect for rapid destabilization. Then it can take around maybe 5 runs or so if you get lucky. However, to me your temple isn&rsquo;t unrecoverable.</p>

<p>As for tips, the number one rule you must remember is that destabilization always happens to rooms at the end of your chain. That&rsquo;s unless you have them all together. Then anything can decay.</p>

<p>So people came up with the snake strategy. You essentially go to the left and right sides of the board, creating 1 line of rooms that never connects to anything else. It then goes up like a L shape. The videos below will detail it far better then I ever could. You can definitely do this strategy. Later, try to get spymasters, then do the following setup.</p>

<p>Armory, barracks, spymaster, barracks, armory on repeat. Never do two rooms on repeat or it won&rsquo;t let you place it. You must have a pattern of three. The spymaster will turn the barracks into Legion Barracks. That is huge because that will rapidly increase rare monsters. Spy master also gives a high chance of getting a medallion which prevents a room of your choice from decaying. Put that at the end of the snake, and you start getting rapid growth. This also means any parts of the temple you don&rsquo;t like will probably be forced to decay instead.</p>

<p>If you don&rsquo;t like farming and just want to go after the boss, you do the second strategy. You create 1 pathway in the middle of the board, and then branch out to the left and right near the boss like a tree. The destabilization will target those branches to the left and right, keeping your pathway secure.  This is far simpler.</p>

<p>Lastly, you have an alchemy lab, though in your main branch, which is rare. I&rsquo;m in act three, and I never got one yet. I would keep that line in the middle if possible and improvise the snake.  However, that wouldn&rsquo;t be the recommended location. You got some good bonuses though. It&rsquo;s just the position that&rsquo;s not so good. If you don&rsquo;t want to risk it though, you can decay the temple like I said earlier.</p>

<p><a href="https://preview.redd.it/cen56vvv9v9g1.png?width=320&amp;format=png&amp;auto=webp&amp;s=edf1fb6c88ecfbad28fd371710987a9896199d2e" target="_blank">https://preview.redd.it/cen56vvv9v9g1.png?width=320&amp;format=png&amp;auto=webp&amp;s=edf1fb6c88ecfbad28fd371710987a9896199d2e</a></p>

<p>This image above explains everything that creates room upgrades.</p>

<p>For more in depth information, look at these two videos below. I didn&rsquo;t understand the league really until I watched him.</p>
