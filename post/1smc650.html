.commentAndChildren label .comment .commentText {

.selfPostContainer {

.selfPostImage {

.streamableContainer {

  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

      <label for="ogd14vy" class="commentText"><blockquote>
<p>For as hot as Abrams has been before, he has never been this incandescent to start a season. Through 17 games, his .356 batting average, six homers and 1.121 OPS all rank among the top-five marks in MLB.</p>

<p>“I’m just swinging at better pitches, and spitting on the ones that I don’t want to swing at,” Abrams said. “Just got to keep that going.”</p>

<p>But can he keep it up and free himself from the slumps that tend to follow?</p>

<p>Abrams set out to solve that question over the offseason. Washington’s new hitting coaches met with Abrams’ offseason coach, Tyler Krieger, co-founder of Maven Baseball Lab, an Atlanta-area training facility, to develop a plan that met Abrams’ specific wishes.</p>

<p>That plan required some reverse engineering.</p>

<p>First, the group had to identify what happened when Abrams slumped; he pulled the ball on the ground and chased too much. Then, they had to examine what happened mechanically; his bat entered the zone on too flat of a path, and he rotated too early into the ground. And finally, the hard part: They worked until they found the mental and physical cues Abrams needed to lift himself up.</p>

<p>“We’re not just trying to fix swings to fix swings — we’re trying to fix swings to affect outcomes,” Krieger said. “You can kind of paint a picture back to, ‘This is why the ball is coming off the bat on the ground, or this is why you’re carving balls to left field,’ and then kind of reverse engineer which mechanical adjustments you need to make in the cage to fix that.”</p>
</blockquote>
