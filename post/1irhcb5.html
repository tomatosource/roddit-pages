      <label for="md8b2me" class="commentText"><p>I&rsquo;ve been working on this build for a while. I must&rsquo;ve failed Simulacrum T4 at least 10 times. That was until I met someone who I had told about my build, which helped him complete Simulacrum T4. In return, he kindly helped me by donating me items and giving me a tip on using Passive Youth. I gained about 1000 more energy shield, so I&rsquo;m sitting at 3500, and I&rsquo;m using an Olroth Life Flask. This has given me great survivability, while my damage is great as well. It might seem silly to use this build on Deadeye, but quite frankly it birthed from me not wanting to level my lvl 29 Invoker. It has however turned into something very capable, and the frenzy charges branch in the ascendancy tree of Deadeye synergizes quite well.</p>

<p>It might not be as unique as it could be, but I simply optimized my build to be able to do T4 Simulacrum consistently. I am happy that I could turn my Deadeye into this.</p>
