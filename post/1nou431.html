

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://www.reddit.com/gallery/1nou431"><p>I&rsquo;ve been rewarded for not caring about my gear!</p>

    </h2>

<div class="commentAndChildren">

        <div>0 | 5 hours ago </div>
      </div>
      <label for="nfudxxb" class="commentText"><p>Nice! I love the carefree approach.
Maybe I need to unclench my jaw &amp; relax my furrowed brow long enough to do the same.

      <div class="commentHeader">
        <div>Mindshard</div>
        <div>2 | 5 hours ago </div>
      </div>
      <label for="nfuez6s" class="commentText"><p>To be fair, I take my witch a little more serious, but my witchhunter is basically my &ldquo;isometric view Contra with explosive ammo&rdquo; character.</p>

<p>Sometimes it&rsquo;s frustrating when you&rsquo;re stuck on a boss, other times it feels so rewarding, dodging everything thrown at you, heart racing as you&rsquo;re so close to beating a boss.</p>

<p>I&rsquo;m still trying to decide what to do with my witchhunter. This season has been a wierd one for me. I want to play abyssal lich since it&rsquo;s the first specialized ascendancy, but I like the collecting aspect of using spectres. Witchhunter doesn&rsquo;t have any meta builds, so I just kinda throw points at damage and grenades and wing it. The irony is this is the first season I don&rsquo;t even know if I really need the belt!</p>
</label>

<p>It&rsquo;s fun, but it can sometimes be frustrating. Finishing act 3 was rough because my crossbow was pretty bad at the time.</p>

      <label for="nfvdi5j" class="commentText"><p>Yeah. Only a limited number of times, but you can. Basically, when you see the zone go up in level, he&rsquo;s reset. I don&rsquo;t know what the cap for his zone is, but I get the feeling it&rsquo;s 57.</p>

</html>
