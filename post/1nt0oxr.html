

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://youtu.be/sowMrur1OIM?si=6J_GF17mLPyyzAUa"><p>In 2006, Rip Hamilton scores a career-high 51 points in Madison Square Garden</p>
</a>
    </h2>

    

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="ngq52jz" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Diamond4Hands4Ever | Warriors</div>
        <div>11 | 17 hours ago </div>
      </div>
      <label for="ngq52jz" class="commentText"><p>Rip Hamilton has probably one of the most underappreciated careers of all time. </p>

<p>Unless I’m forgetting someone I believe he is the only HOF eligible basketball player in history to lead both an NCAA and NBA champion in scoring but yet not be in the HOF. </p>

<p>Unfortunately the HOF doesn’t weigh college much these days because he has one of the best college careers in the modern era plus had a very long and good NBA career that his overall basketball accomplishments are quite good despite probably never making the HOF (never even been close as a finalist). </p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="ngslsdo" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>TofuTofu | Knicks</div>
        <div>1 | 7 hours ago </div>
      </div>
      <label for="ngslsdo" class="commentText"><p>UCONN guys love scoring in the Garden (source: I am a st johns fan)</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="ngtwd57" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>aoifhasoifha | NYK</div>
        <div>1 | 22 minutes ago </div>
      </div>
      <label for="ngtwd57" class="commentText"><p>It took him a while to really figure out his game in the NBA, but once he did he was ruthlessly efficient. The Pistons&rsquo; incredibly slow pace really hurts his raw numbers, and their overall depth and Chauncey&rsquo;s heroics have made him underappreciated over the years.</p>

<p>At his peak, he was like Klay Thompson except 3 feet closer to the basket. Best cardio in the league on <em>both</em> ends, and pretty much only took good shots- except he was cutting all over the court for mid range shots instead of 3&rsquo;s. He wasn&rsquo;t on Klay&rsquo;s level as a defender at their peaks, but he was very solid and equally tireless</p>

<p>There were a lot of Pistons games where it seemed like 99% of their points came from Rip cutting for midrange shots (for 20 points), Chauncey hitting pullups (for 20 more points), and offensive boards/fast breaks/Tayshaun playing his role perfectly (plus one Sheed 3, for another 30 points). Final score, 70-60</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
