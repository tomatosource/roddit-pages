

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/3wcrgp0tppeh1.jpeg"><p>WTF second boons today!!</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/3wcrgp0tppeh1.jpeg" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="oz0peib" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Puzzled-Question-156</div>
        <div>2 | an hour ago </div>
      </div>
      <label for="oz0peib" class="commentText"><p>I played expedition for 8 days and got 11 10-slot runes. It&rsquo;s really not that rare if you go through expeditions fast.</p>

<p>Some people claim they ran it for a month without a single one, but they never tell you how many GEs with aldur&rsquo;s mod they really ran.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="oz0prxq" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Serious-Mistake-4171</div>
        <div>-1 | an hour ago </div>
      </div>
      <label for="oz0prxq" class="commentText"><p>I think a lot of people are putting %quantity of items found instead of power rune on remnants. Once I swapped to 25% power rune chance I started seeing a LOT better remnants, with my rerolls as well.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="oz0qui2" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Puzzled-Question-156</div>
        <div>6 | an hour ago </div>
      </div>
      <label for="oz0qui2" class="commentText"><p>That node doesn&rsquo;t give a 25% chance for a remnant to contain a power rune. It gives a 25% chance for a remnant&rsquo;s mods to function as if a power rune exists. It has no impact on what remnant you get. Otherwise you&rsquo;d have a ton of divines/locks/mirrors.</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

    
  </div>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="oz0t66y" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>LeonidSpartanskiy</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="oz0t66y" class="commentText"><p>Can you trade this boon? And what happens if another person joins for it?</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="oz0vtar" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Heavy-Type-2379</div>
        <div>1 | 37 minutes ago </div>
      </div>
      <label for="oz0vtar" class="commentText"><p>can’t and only owner</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

        
      
    </div>
  </body>
</html>
