

<html>

    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>

    <h2>
      <a class="postTitle" href="https://www.reddit.com/gallery/1s6toqf"><p>Thoughts on Shaman Bonded Modifiers?</p>
</a>
    </h2>

    

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="od7suak" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>[deleted]</div>
        <div>5 | 3 hours ago </div>
      </div>
      <label for="od7suak" class="commentText"><p>[removed]</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="od7u4kn" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Earthboundplayer</div>
        <div>5 | 3 hours ago </div>
      </div>
      <label for="od7u4kn" class="commentText"><blockquote>
<p>Also why is the ascendancy node 1% spell dmg per 2 rage</p>
</blockquote>

<p>1% MORE spell damage per 2 rage. So it&rsquo;s multiplicative with everything else.</p>

<blockquote>
<p>but the passive tree node is 2% spell dmg per 1 rage?</p>
</blockquote>

<p>2% INCREASED spell damage per 1 rage. So it&rsquo;s additive with every other source of increased damage.</p>

<p>Depending on how many other sources of increased damage you have, the first one can be stronger than the second. Regardless, you can get both as a shaman and it would be quite powerful.</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="od86v30" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>isaidicanshout_</div>
        <div>1 | 2 hours ago </div>
      </div>
      <label for="od86v30" class="commentText"><p>Ok I have a question about this… I don’t play shaman, I play deadeye. This is my first league using the market and I see bonded items all the time. I have a prejudice against them since I can’t use them, but maybe that is pointless? It just bugs me to think about buying an item that has features I can’t use.</p>

<p>Do Bonded modifiers  count against the limit to the  number of modifiers?</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="od8i1ts" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>RaptorAllah</div>
        <div>1 | 33 minutes ago </div>
      </div>
      <label for="od8i1ts" class="commentText"><p>Bonded items aren&rsquo;t a thing, trade just shows the additional effects you would get as a shaman for some reason. It&rsquo;s an additional line on runes on top of the normal one, if you&rsquo;re not a shaman you just get the regular effect</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="od8c3dy" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>MRxSLEEP</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="od8c3dy" class="commentText"><p>I was very excited about them, until I saw that all armor gets the same, mediocre, bonuses AND like every rune gives the same bonus. It would be instantly more interesting if the runes each had a different bonus or at least a larger pool of bonuses and/or each armor slot should get a different bonus.</p>
</label>
    </div>
  </label>
  
</div>
