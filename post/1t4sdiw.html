

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://v.redd.it/pmabk9gevdzg1"><p>My eyes oh my eyes!</p>
</a>
    </h2>

    

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="ok55lp8" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Katra182</div>
        <div>1 | 28 minutes ago </div>
      </div>
      <label for="ok55lp8" class="commentText"><p>Nice build but I really hope they do something about &ldquo;cast on x&rdquo; skills in .5. This isn&rsquo;t the gameplay I want from PoE 2.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="ok58f4n" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>SilverArrows6662</div>
        <div>1 | 12 minutes ago </div>
      </div>
      <label for="ok58f4n" class="commentText"><p>Naah bro, it&rsquo;s completely trash build. I was just fucking around. I put fireball on CoA and comet on coc.</p>

<p>Honestly I don&rsquo;t know how I feel. On one hand the power fantasy is good, on the other hand it&rsquo;s just fucking screen clutter and can&rsquo;t see shit. I like the idea of cast on (and from the data mine, more cast on stuff is coming), but I would definitely like to see something changed.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="ok59bq1" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Katra182</div>
        <div>1 | 7 minutes ago </div>
      </div>
      <label for="ok59bq1" class="commentText"><p>Yeah I think it&rsquo;s mostly the screen clutter aspect. Like automated abilities chaining into each other and multiple projectile increases to exacerbate the problem. Throw in crazy density and monster abilities (which they did try to tone down in .4 fortunately) and it just ends up looking like Vampire Survivors or some other bullet heaven game. There is probably a way to rebalance &ldquo;cast on&rdquo; abilities but I haven&rsquo;t thought about it enough.</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

    
  </div>
  
</div>

        
      
    </div>
  </body>
</html>
