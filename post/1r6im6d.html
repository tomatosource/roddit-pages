

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://www.reddit.com/gallery/1r6im6d"><p>Disgusting map rendering&hellip;</p>
</a>
    </h2>

    

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="o5qen38" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Siraja</div>
        <div>1 | 25 minutes ago </div>
      </div>
      <label for="o5qen38" class="commentText"><p>The map rendering is perfectly fine, it&rsquo;s the map that&rsquo;s disgusting.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="o5qeu08" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>jNayden</div>
        <div>1 | 24 minutes ago </div>
      </div>
      <label for="o5qeu08" class="commentText"><p>Can&rsquo;t see shit especially when playing on phone</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="o5qg0hg" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>OnceMoreAndAgain</div>
        <div>1 | 18 minutes ago </div>
      </div>
      <label for="o5qg0hg" class="commentText"><p><a href="https://i.imgur.com/tW7fYDl.png" target="_blank">There is a trick to reading this layout. The map always is a square and then the 4 events of the zone are always located in one of the quadrants of the square, like I show here on this image.</a></p>

<p>So once you see one of the events, you know that you are done exploring that quadrant and should go to the next quadrant and go middle out to find the event. Don&rsquo;t leave a quadrant until you find its event. Some times the event of that quadrant spawns quite far from the middle so you might have to go to the outer edge of the map area.</p>

<p>I think red vale often (always?) spawns opposite of the entrance to the area, but I&rsquo;m not 100% sure on that&hellip; Someone please correct me if I&rsquo;m wrong because it&rsquo;d be nice to know.</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
