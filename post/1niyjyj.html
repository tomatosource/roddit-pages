

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://www.reddit.com/r/PathOfExile2/comments/1niyjyj/do_you_remember_post_harvest_nerfs_due_to/"><p>Do you remember post Harvest nerfs due to deterministic crafting?</p>
</a>
    </h2>

    
    <div class="selfPostContainer">
      <p>Pepperidge Farms remembers.</p>

<p>IMHO&hellip;The new crafting introduced this league is more deterministic than Harvest league was.</p>

    </div>
    

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="nemfhd7" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Strungeng | Goblin Troupe Owner</div>
        <div>0 | 3 hours ago </div>
      </div>
      <label for="nemfhd7" class="commentText"><p>Augmentation will be nerfed for sure, it will have same ilvl has exalt.</p>

<p>I guess more affix will get tags. Or maybe more stats to flood the pool.</p>

<p>Omens will be hard nerfed for sure, maybe limiting at 2 max active at a time, or maybe they can hit items hte way they can only be &ldquo;omened&rdquo; X times.</p>

<p>Or maybe they will change the &ldquo;X omen guaranteed Y action&rdquo; to &ldquo;X omen make Z% chance to perform Y action&rdquo;.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="nemhnkf" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>BoltNWheel</div>
        <div>0 | 2 hours ago </div>
      </div>
      <label for="nemhnkf" class="commentText"><p>I hope not. I actually think it&rsquo;s really good for the game. I dont craft, and IMHO some really good but not god teir items im pretty sure I get cheaper because they are failed crafts.</p>

<p>It unironically makes the gg crafter happy being more deterministic, and the &ldquo;failed&rdquo; gg crafts that are 80% as good get thrown on the market cheaper to recoup costs.</p>

<p>Then when something really deter.inistic gets discovered, the price eventually drops because it can saturate, which helps a map spammed Andy like me grab the more gg items cheaper.</p>
</label>
    </div>
  </label>
  
</div>

    
      
<div class="commentAndChildren">
  <input id="nemrjds" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Lumiharu</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="nemrjds" class="commentText"><p>I think a nerf is in order but abyss won&rsquo;t be in each map in the future. Just making homo slamming harder to access and abyss stuff being harder to come by solves most of it. Maybe exalted related omens could be slightly more rare too, so the triple omen slams would actually cost you.</p>

<p>Now I just do it cause I found a nice armor piece that could go for some divs if I hit decently. Problem is, hitting anything below triple t1 on armor for example does not make you all that much. In a few weeks it&rsquo;ll hardly be worth it to go for these kinds of crafts at all I think.</p>

<p>The way I see it, other than armour it&rsquo;s not a huge issue really. On rings it&rsquo;s still quite rng to hit good lines and on weapons yea there are routes for insane ones but those are way less deterministic from what I have seen.</p>

<p>Another thing is though, maybe there could just be another system added on top that modifies the gear in a different way, that is more rng?</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

        
      
    </div>
  </body>
</html>
