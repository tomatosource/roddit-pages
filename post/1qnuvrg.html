

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/09ln2z63qrfg1.jpeg"><p>Crafting help</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/09ln2z63qrfg1.jpeg" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="o1wnj4i" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>ac710</div>
        <div>1 | 6 minutes ago </div>
      </div>
      <label for="o1wnj4i" class="commentText"><p>Im no expert but you could reveal the desecration with abyssal echoes and if it doesn’t hit something you want you could use a global defenses perfect essence and omen of crystallization to take a prefix which will take the desecration. Then re desecrate and try again or omen of catalyzing what ever and a perfect exalt. You can pair that with a dextral or sinistral exalt to target what you want if one of each is open.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="o1wnrjp" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Southern-Piano-955</div>
        <div>1 | 5 minutes ago </div>
      </div>
      <label for="o1wnrjp" class="commentText"><p>Greater Exalt two times</p>

<p>Reveal desacration</p>

<p>Choose option in middle</p>

<p>Use orb of annulment</p>

<p>Exalt one time</p>

<p>Corrupt it</p>

<p>Corrupt it twice</p>

<p>If item still exists, sell it for 6 or 7 mirrors</p>

<p>No need to thank me 😎</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="o1wo3gd" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Shoelooooo</div>
        <div>1 | 3 minutes ago </div>
      </div>
      <label for="o1wo3gd" class="commentText"><p>Pretty bonkers starting point and depends on what you’re looking for, but I’d probably say the most expensive option is a bunch of ES stuff and then crit chance as a suffix so depends on your budget. I’d personally fish for a t1 ES prefix with carapace cata and prefix perfect ex, then take a <sup>50</sup>&frasl;<sub>50</sub> for global defenses so you can save your desecrate for the last suffix to find crit chance. Pretty high budget but you can cycle perfect ex slams with defense catalysts, and then if full and bad and didn’t hit your perfect essence slam you would essence prefix only with the abyss essence, desecrate then omen of light (assuming these 3 pieces are cheaper than prefix annul omen). Just keep cycling that till you get your perfect prefixes and then it’s just desecrate light till crit</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="o1woavx" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Beglenyur</div>
        <div>1 | 2 minutes ago </div>
      </div>
      <label for="o1woavx" class="commentText"><p>Since you have a fractured prefix you could;<br>
- Slam defence catalyst with perfect exalts on the prefixes until you get flat/percent ES or percent armour depending on the build<br>
- Try to get %defences essence paired with the prefix from the step above<br>
(Get rid of desecrated prefix either via step 2 or omen of light/annul)<br>
- Desecrate/reveal a third desired suffix until you get something you like</p>

<p>This is a fairly cheap way to get 2x good defence prefix and a third desired suffix without messing up the other suffixes (basically a decent 6 mod item).</p>

<p>If you wanna get a rarity prefix or something you could keep the desecrated mod on the prefix and keep rerolling for it and just defence catalyst exalt and pray. Could try to catalyst exalt for some res on the suffix but it is really hit and miss, and with already 2 good suffixes you really only get one try.</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
