      <label for="o4nqhup" class="commentText"><p>From NBC Sports Boston:</p>

<p>Jayson Tatum is back. At practice, anyway.</p>

<p>The All-Star forward joined the Boston Celtics for their practice session at the Auerbach Center on Tuesday, one day after he <a href="https://www.nbcsportsboston.com/nba/boston-celtics/jayson-tatum-injury-achilles-rehab-maine/768112/" target="_blank">practiced with the G League affiliate Maine Celtics</a> for the first time.</p>

<p>After Tuesday&rsquo;s practice, Tatum held an impromptu meeting with the media and was asked several questions about when and how he plans to return from the Achilles injury he suffered last May.</p>

<p>Tatum&rsquo;s overall message in response? We&rsquo;ll see.</p>

<p>&ldquo;Today is 39 weeks (since the injury), so it&rsquo;s been a long journey,&rdquo; Tatum told reporters. &ldquo;It&rsquo;s just the progression of rehab, and (returning to practice) is just the next step. It doesn&rsquo;t mean that I&rsquo;m coming back or not. We&rsquo;re just following the plan. So, it&rsquo;s just another step.&rdquo;</p>

<p>Tatum declined to put a timetable on his return or even a percentage on his health, adding, &ldquo;I just know I feel a little better every day.&rdquo;</p>

<p>And while the fact that he&rsquo;s now practicing with the team in early February would seem to indicate he&rsquo;ll return to action at *some point* this season, Tatum insisted he still hasn&rsquo;t made a decision one way or the other.</p>

<p>&ldquo;I&rsquo;m still trying to figure it out,&rdquo; Tatum said. &ldquo;Still just going through the progressions of rehab. I&rsquo;m not saying I&rsquo;m coming back or I&rsquo;m not. It&rsquo;s about being 100 percent healthy and just going through the plan of this protocol.&rdquo;</p>

<p><a href="https://www.youtube.com/watch?v=3d0_kElNTrg&amp;pp=0gcJCZQKAYcqIYzv" target="_blank">Watch Tatum&rsquo;s full interview here.</a></p>
