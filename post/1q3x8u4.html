

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/bn0islbtjdbg1.png"><p>&ldquo;Are ya winning son?&rdquo;</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/bn0islbtjdbg1.png" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="nxo30h4" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>xxBoosted_Bonobo</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="nxo30h4" class="commentText"><p>Get some good life rolls on your gear</p>

<p>Defiance of destiny can&rsquo;t save you with a life pool of 1.9k even if it would work overtime</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nxo0vqm" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>BananaSplit2</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="nxo0vqm" class="commentText"><p>Plainly said, the most obvious issue by far is that your effective health pool is way, way too small. Less than 2k life, no ES. Your phys max hit is only 3k. You can&rsquo;t take any of the bigger hits.</p>

<p>If you want to stay life only, you&rsquo;re going to have get some high life rolls on most of your gear, most of it misses life, and snag some +% life on the tree if you can, there are a few ones lying around (not sure if there&rsquo;s any close to the druid start though, that part of the tree heavily favours es instead).</p>

<p>You can also consider slotting Wisdom of the Maji on your ascendancy (with all your &ldquo;basic&rdquo; runes, you&rsquo;d get a decent amount of life out of it) or Avatar of Evolution (which grants overall 15% phys taken as element, though that only helps for phys damage)</p>

<p>Another option that can be considered is swap to hybrid armour/es. Some have said they struggled with that but my experience hasn&rsquo;t been so. You get less armour which is especially less effective against big hits, but you can get a really big amounts of ES which improves EHP tremendously.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nxo9yep" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Zaorish9</div>
        <div>1 | 25 minutes ago </div>
      </div>
      <label for="nxo9yep" class="commentText"><p>Play hardcore, the maximum times you can die is 0. get life, resistance, optimize armor, layered defenses - smith ascendancy is good</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
