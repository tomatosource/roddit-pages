

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/4jfjant0lv7f1.png"><p>Sell, disenchant or vaal ?</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/4jfjant0lv7f1.png" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">

<p>It might not be the &ldquo;best possible&rdquo; rolls, but without checking the trade website, I bet this could go for at least a couple div. Sure as hell gonna be a great quarterstaff for someone on a budget</p>
</label>
    </div>
  </label>
  
</div>

</div>

      <label for="mymdftb" class="commentText"><p>Do it&hellip;&hellip;. no vaals</p>
</label>

</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="mymffgl" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>elew21</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="mymffgl" class="commentText"><p>This is what I would call a premium second tier item. It&rsquo;s not going to sell for 100s of divines but it should go for several divines. This staff can do all the content in the game, but because it&rsquo;s not &ldquo;perfect&rdquo; (+7 lvls&amp;Crit hit) at this point in the league it&rsquo;s not going to get that 30+ divine price point.</p>

    </div>

</div>

      <div class="commentHeader">
        <div>fckRedditJV</div>
        <div>1 | 33 minutes ago </div>
      </div>
      <label for="mymhq9g" class="commentText"><p>try to change fire/cold damage into Phyisical damage. and/or 15 mana into +4.9 crit chance.</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
