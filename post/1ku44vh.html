

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://www.reddit.com/gallery/1ku44vh"><p>New to crafting how do I lower chances of ruining these.</p>
</a>
    </h2>

    

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="mtysfjy" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Affectionate_Sir3234</div>
        <div>1 | 35 minutes ago </div>
      </div>
      <label for="mtysfjy" class="commentText"><p>Just wear it but don’t use whittling. Dont use anything but exalt for the third prefix. None of your mods are highest tier or what I call tier 1. It will be vendor material soon league is in end</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="mtyumbq" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>garybussy69420</div>
        <div>1 | 14 minutes ago </div>
      </div>
      <label for="mtyumbq" class="commentText"><p>Ex slam and keep as is, no use in “crafting” these as the ilvl is low and you’re only at T9. Better off just buying upgrades</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="mtyvw7g" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>xcaliblur2</div>
        <div>1 | a minute ago </div>
      </div>
      <label for="mtyvw7g" class="commentText"><p>If you only have 1 div to your name, forget about crafting anything.</p>

<p>Omens cost a lot, like 5div each so that&rsquo;s like the starting price <em>per attempt</em>. Crafting a good piece takes many attempts. So you can see how the cost balloons up</p>

<p>Besides which, the item level matters. Your 2 pieces here are only ilvl 70++ which is not worth using as a base to craft on. You&rsquo;d want ilvl 81 and up bases.</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
