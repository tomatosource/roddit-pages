

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://youtu.be/XAfk7j4WmuI?is=wFiBDrMEIvozeUGe"><p>Pain and suffering</p>
</a>
    </h2>

    

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="oe3lbgc" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>oldglassofmilk</div>
        <div>1 | 5 hours ago </div>
      </div>
      <label for="oe3lbgc" class="commentText"><p>It&rsquo;s supposed to be 1in 4 I believe</p>

<p>1 in 4 to brick/chaos it</p>

<p>1 in 4 to enchant</p>

<p>1 in 4 to add socket</p>

<p>1 in 4 to do nothing</p>

<p>If u use omen its 1 in 3 for socket</p>

<p>So you&rsquo;ve been just really unlucky</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="oe48ozs" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Bluegoldfishfood</div>
        <div>1 | 4 hours ago </div>
      </div>
      <label for="oe48ozs" class="commentText"><p>It&rsquo;s hard to shake the feeling that it isn&rsquo;t rigged but it&rsquo;s bound to happen to some people. Harder to rationalize when each attempt is so expensive.</p>

<p>I stopped counting after 20 fracture misses on a 150div base. If I did thousands, I&rsquo;d probably have 10+ streaks of hitting, but stuff is so prohibitively expensive that I&rsquo;ll never see it average out to 33% after missing so many times in a row.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="oe4tg5x" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>SpecialistAd670</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="oe4tg5x" class="commentText"><p>I am making three socketed items for a living (joke) but i use hinekoras lock for it and I can tell you that third socket is pretty common BUT you need to compare outcome with and without omen of corruption. With Hinekoras Lock odds to get third socket is 50% (<sup>1</sup>&frasl;<sub>3</sub> with omen, <sup>1</sup>&frasl;<sub>4</sub> without omen) so two locks on avarage. Once i was giga unlucky and spend 6 locks on one item but usually its 1 or 2-3 rarely</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
