        <div>3 | 10 hours ago </div>
      </div>
      <label for="o7sj54f" class="commentText"><p>I guess first question is what kind of build you want to run. You’d get a substantial damage boost switching to a good staff but you’d have to lose CoEA most likely. I’d bet a good staff could at least double your damage.</p>

<p>If you’re willing to run standard coc comet with spark or ele weakness, 400 div should be enough to clear everything, though T3 fights might still require some skill (i.e. you might not melt them in 0.5 seconds).</p>

<p>Regardless of build I think you should think about switching to a rare body with high (900+, ideally 1000+) ES. Atziri’s splendour is good but you don’t benefit from the skill life cost conversion while you’re taking blood magic, and you’re losing a Lot of EHP using a chest with &amp;lt;500 ES. The really useful splendours have 1000+ ES due to vaal cultivation but they are several thousand div currently.</p>

<p>edit: as the other commenter said if you’re commited to the atziri chest you should at least de-allocate blood magic and take the other 48% cost conversion in the passive tree instead.</p>
</label>
