

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://youtu.be/y6we_Pg0mFY"><p>POE 2&rsquo;s biggest defence problems (from Reedmoorbook)</p>
</a>
    </h2>

    

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="ogb5syt" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Classic_Focus_212</div>
        <div>4 | an hour ago </div>
      </div>
      <label for="ogb5syt" class="commentText"><p>Been playing hc since .20 mainly deadeye and then in .30 have lvled several invoker ice strike monks as alts and league starters. Now mainly playing WH permafrost frag rounds. Monk nails it in the game play but the disadvantage vs range specailly the deadeye is worlds apart. My monks have around 40-50k ehp vs 17k in the DE, but the ability to kill entire packs of screen with one click is worth 100k ehp. WH is also nails its in the gameplay but xbow are 100x more cluncky than bows with only downsides, the range is terrible vs bows. I get that they are shotgun type of weapon but bows achieve the same with multi shot nova proj and fire additional proj plus travel entire maps length.  Then xbow need to be reloaded this to me was developed in a vacuum from the rest of the game maybe it was the same devs that worked in 2x maces. Yes u can work around the reload with lineage gems and one shotting all mobs and permafrost lit freezes everything in one shot but the sheer density in temple for example and high effectivness  u are not one shotting thus reloading. Even while having a 5plus attack skills 13k xbow all t1. On top of that tool tip dmg is bugged for xbows. If spectral ward was not buffed i would say wh had to be the worse class with the clunkiest weapon.</p>
</label>
    </div>
  </label>

</label>

  </label>

        <div>1 | 4 minutes ago </div>
      </div>
      <label for="ogbfjfx" class="commentText"><p>Monk nails its combat fantasy. Were u playing range with monk? I do have to say having shatering palm available so late in the campaing does make it a bit clunky having to hit every single mob, and not having the chain explosion shatering palm gives.</p>

      <div class="commentHeader">
        <div>TwoToadsKick</div>
        <div>1 | 3 minutes ago </div>

      <label for="ogbfp10" class="commentText"><p>Storm wave was just enough range for me. Pure melee was kind of annoying</p>

</div>

  </body>
</html>
