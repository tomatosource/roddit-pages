      <label for="osmjb0s" class="commentText"><p>They don&rsquo;t need scours they just need more focused crafting methods accessible to mid budget that are better than wisdom scroll with extra steps. How they do that without making it into full item editor is the problem they have to solve.</p>

      <div class="commentHeader">
        <div>nmrf1122</div>
        <div>1 | 6 minutes ago </div>
      </div>
      <label for="osmm9ct" class="commentText"><p>Can&rsquo;t be solved. If there is actual mid tier crafting hideout warriors are able to print decent to great items non-stop and everything below that grade of items becomes worthless by day 2. It&rsquo;s a consequence of this game&rsquo;s crafting philosophy, which is nothing but pulling the lever on a slot machine. Some levers are more premium than others but in the end they are all attached to a slot machine. The only way you win is if you have enough levers to pull and beat RNG through sheer numbers (i.e. having enough currency to recover from bad streaks till you hit).</p>

<p>We had it last patch with multiple crafted mods and we had it in 0.3 with homo omens (to one degree or another, but we had it). End result was the same: w/e can be achieved through those methods becomes the new baseline and devalues anything below.</p>
