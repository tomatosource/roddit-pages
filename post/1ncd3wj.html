

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://v.redd.it/1x1qjl1ok3of1"><p>Xbox Series X Performance</p>
</a>
    </h2>

    

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="nd8ixf0" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Term2105</div>
        <div>2 | 3 hours ago </div>
      </div>
      <label for="nd8ixf0" class="commentText"><p>Feel this my warbringer sending out totems, fissures everywhere it nearly crashes my game every time and if it’s on a abyssal map look worse then what your showing here brother</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="nd8jny9" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>nazi_porn_jihad</div>
        <div>2 | 3 hours ago </div>
      </div>
      <label for="nd8jny9" class="commentText"><p>I stopped using fire spells/skills and avoid any map with burning ground as fire seems to tank performance even more. Played a warrior last leage with fire skills that managed to crash the console on screen wide clears. I just hope GGG will look into console performance but I fear the half a dozen console players have very low priority for them.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="nd8k3cf" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Term2105</div>
        <div>2 | 3 hours ago </div>
      </div>
      <label for="nd8k3cf" class="commentText"><p>Another thing you can do is turn dynamic culling on in your settings it helps a little just doesn’t fix the issue but yeah I totally get ya</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

    
  </div>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nd8qcyj" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>KeeperofAbyss</div>
        <div>2 | 2 hours ago </div>
      </div>
      <label for="nd8qcyj" class="commentText"><p>It&rsquo;s worth to mention that hardware is quite outdated. It was already below the performance bar at the time. Console games just have special optimizations.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="nd8suwx" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>nazi_porn_jihad</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="nd8suwx" class="commentText"><p>That&rsquo;s true but on the other hand, they can optimize the game for that particular hardware and don&rsquo;t have to optimize for a wide range of different GPUs. This is why a lot of games look way better on console than their hardware would make you think. Top performance GPUs is not everything. The problem lies more in the fact, that the console market is way to small to make console optimization a priority for GGG. The PC market is way more important for them.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="nd8xtdq" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>KeeperofAbyss</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="nd8xtdq" class="commentText"><p>It&rsquo;s company specific, yes. They use a custom engine, yes. Console market is low, no, they have stated that a really huge number of people play it on console. It is necessary to admit that some things just cannot be optimized and have physical hardware limitations. The game is CPU heavy and it needs to cycle cache fast, they would basically need to rework a core aspect of their engine to try to optimize it. It&rsquo;s just better to wait for a new console generation.</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

    
  </div>
  
</div>

        
      
    </div>
  </body>
</html>
