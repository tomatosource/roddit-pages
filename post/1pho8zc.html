.commentHeader {

.postTitle {

.commentAndChildren > .commentList {

}

.commentAndChildren label .comment .commentText {

  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}
