       * {

*,

html {

.post {
  width: 100%;
}

.postLink {

  color: wheat;

.postLink:visited {

.postHeader {

.commentList {

.commentAndChildren {

.comment {

  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

      <label for="nad8ogd" class="commentText"><p>The only effects we&rsquo;ve seen so far and small passives and notables. Smalls are replaced with +5 Tribute, a resource that empowers the effect of transformed notable passives within the range of the timeless jewel. No info on the keystones or if attribute highway nodes are affected (the border of the node changes like the other ones, but the icon in the middle is the same; unfortunately the only other timeless in poe2 only affects notables, so we don&rsquo;t know how this new one will work) The voice over also says that these will roll with variable radius.</p>

<p>This most closely resembles the <a href="https://www.poewiki.net/wiki/Militant_Faith" target="_blank">Militant Faith Timeless Jewel</a> from poe1, mirroring the devotion mechanic. Unlike Militant Faith, Undying Hate seems like it will change all notables in range, but this is not confirmed as it could just be that the one in the reveal happens to change every notable.</p>
