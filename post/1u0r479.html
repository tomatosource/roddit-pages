

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/y3kydqkvt56h1.png"><p>When I get knocked on my ass out of my sprint</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/y3kydqkvt56h1.png" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="oqk5lvp" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Sigmar_Knutz</div>
        <div>10 | 12 hours ago </div>
      </div>

<p><a href="https://i.redd.it/wzmv7bm8v56h1.gif" target="_blank">https://i.redd.it/wzmv7bm8v56h1.gif</a></p>
</label>
    </div>
  </label>
  
</div>

    <div class="comment">
      <div class="commentHeader">
        <div>thesmallrecreation</div>
        <div>1 | 10 hours ago </div>
      </div>
      <label for="oqktx0p" class="commentText"><p>getting stun locked into oblivion and the entire screen is just flashing red while you&rsquo;re desperately mashing your flask buttons. path of exile really said &ldquo;you will be humbled&rdquo; and meant it. one second you&rsquo;re cruising through a map feeling invincible and the next second some random mob pack decides you need to experience what the ground tastes like. the sprint knockback mechanic is brutal because there&rsquo;s always that split second where you know what&rsquo;s coming and you just can&rsquo;t do anything about it.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="oqlrugm" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>XkrNYFRUYj</div>
        <div>1 | 5 hours ago </div>
      </div>
      <label for="oqlrugm" class="commentText"><p>That&rsquo;s why I like my totem build. Because when I&rsquo;m down at least my totems are trying to save me.</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

  <input id="oqlo9w5" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Belpheegor</div>
        <div>0 | 6 hours ago </div>
      </div>
      <label for="oqlo9w5" class="commentText"><p>I just switched dodge roll to only dodge and not sprint. Figured out lag was turning a simple dodge into a dodge sprint even though i was tapping it because sometimes i now double dodge roll when i tap the button.</p>

    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
