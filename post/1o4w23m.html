

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://v.redd.it/6khkyrcaypuf1"><p>Infernal legion Frozen Mandibles.</p>
</a>
    </h2>

    

    <div class="commentList">
      
        
          
<div class="commentAndChildren">

        <div>1 | an hour ago </div>
      </div>
      <label for="nj56tgx" class="commentText"><p>Ignite damage doesn&rsquo;t stack so only 1 ant is doing the fire damage. The ants are the strongest melee minion we have so you still benefit from having multiple of them.</p>

<p>You could kill him faster I you were building for ant damage instead of focusing on ignite but if you want to keep playing ants and ignite the solution is simple, find a high HP spectre and only use 1 and keep your ants for pure damage.</p>

<p>There&rsquo;s a streamer who was using a spectre with really high HP. His YT name is oscrix and he was using the Bogfelled Commoner spectre.</p>

<p>Another solution would be using a single ignite ant but use the lightning zealots that are pretty popular for boss killing.</p>

<p>For reference, I was using 7 ants doing 250k damage each before buffs. They now deal 205k but I switched my gear to have way more IIR and hybrid for mov. Speed and they can still kill that boss in a few seconds.</p>
</label>
    </div>
  </label>
  
</div>

    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">

    <div class="comment">
      <div class="commentHeader">
        <div>DreamerCheffy</div>
        <div>1 | 11 minutes ago </div>
      </div>
      <label for="nj5fidn" class="commentText"><p>If u really want the fire minion, I highly recommend specter Elephant, it costs me around 60-90 spirit for one of them, but they have like 65k hp, with the skill gem lv 20+1 and all + skills from gears +10-12 something. But they do tons of dmg, ant is for aoe and strong dmg on it attack, it is not worth using them as infernal. I tried but clearing isnt fast as full on dmg. The elephant is big and spreading ignite more fun to see</p>

    </div>

</div>

        
      
    </div>
  </body>
</html>
