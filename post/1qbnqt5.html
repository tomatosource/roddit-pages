    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>

      <label for="nzcnhvr" class="commentText"><p>Tactician is such a good ascendancy. Super under rated imo.</p>

<p>Making your own build work is the most satisfying thing to do in this game.</p>

<p>A little tech you can incorporate is setting up your Herald of Blood for self chains. Normally HoB can&rsquo;t set Bleeding. However if you socket in Poison 3, Plagueburst and Bleed 3 into Herald of Blood what happens is your Herald of Blood explosion sets Poison on enemies who than explode with Plague Burst which then sets Bleed. This perpetuates across the screen in a self chain just like people are doing with Herald of Ice and Armor Explosion. Really good way to add clear to any Bleed build.</p>

      <label for="nzd6jia" class="commentText"><p>This is very nice! I was thinking about making one for myself but using a sceptre and a double blasphemy setup.</p>

<p>Yours looks really cool, if you have the possibility maybe switch the helmet to <a href="https://www.pathofexile.com/trade2/search/poe2/Fate%20of%20the%20Vaal/3w8RmP5U5" target="_blank">constricting command</a> with 4 fewer foes to be surrounded and take the 2 round nodes with all the surrounded bonuses. Iirc it&rsquo;s something like 250+% attack damage and 120% armor/evasion, MS, block chance, deflection&hellip;</p>

<p>It&rsquo;s optimization but if you don&rsquo;t use set 2 try to make something out of it. If I were you I&rsquo;d use set 2 to do some armour break things, with the nodes on your path you can go up to 50% increased effect of armour break for a total of 30% increased physical damage taken. Since it&rsquo;s damage taken it means 30% more damage essentially. I&rsquo;d use the leftovers points to buff the war banner with the 2 12% magnitudes nodes. 25*1.24=31 so if you take into account the attack speed also that&rsquo;s a very noce dmg boost.<br>
So when boss combat start: break armour (bound to set 2) -&amp;gt; banner (set 1 and 2 but since you&rsquo;ll use it just after using set 2 it will use the modifiers from set 2) -&amp;gt; dmg</p>
