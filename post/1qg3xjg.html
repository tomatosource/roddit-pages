      <label for="o09hqwk" class="commentText"><p>Answers can be found <a href="https://lookerstudio.google.com/reporting/34643bd7-f7e7-4b07-a3e6-a5b3f6578e2d" target="_blank">HERE</a>.</p>

<p>Optimized for viewing on phone, it&rsquo;ll be a bit zoomed in for pc screens.</p>

<p>Some findings at the time of posting this comment:</p>

<p><strong>Fun but not profitable strats</strong></p>

<ul>
<li>Abyss (no amanamu pull)</li>
<li>Alch &amp; go</li>
</ul>

<p><strong>Profitable but unfun strats</strong></p>

<ul>
<li>Abyss (Amanamu pull)</li>
<li>Trials of Sekhemas</li>
</ul>

<p><strong>Least popular strat (by vote count)</strong> : bossing. Probably because of the high barrier of entry (strong character, currency to buy frags) and variance.</p>

<p><strong>Fun</strong>: All the most fun strat (aside from Temple) require very little set-up and involve blasting tons of mobs : Breach, no pull Abyss and Twisted Domain. Even alch &amp; go, which apparently sucks for currency, is fairly popular because of how little set-up it requires.</p>

<p>Most disliked strats or mechanics on the other hand, mostly involve&hellip;waiting, or playing the game in a very different way : azmeri spirits, strongboxes, pulling amanamu mobs, Sekhemas, etc. Players obviously want to blast.</p>

<p><strong>Opinion Spread (fun):</strong></p>

<p>Most polarizing strats are : Temple (Snake), Abyss (Amanamu pull), and bossing.</p>

<p><strong>Big winner</strong>: Temple (Snake). Both the most fun AND profitable strat. Unsurprising given that :</p>

<ul>
<li><p>new league mechanic</p></li>

<li><p>most profitable mechanic</p></li>

<li><p>biased poll this late in the league, only entrenched players remains. Those are the most likely to have built a good temple.</p></li>
</ul>
