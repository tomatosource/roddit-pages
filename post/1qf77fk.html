      <label for="o02vfqp" class="commentText"><p>Note: if you dont have a few hundred divs laying around to finish this craft if you hit the fracture, I would sell as is.</p>

<p>Reading the other comments im guessing none of them are profit crafters and have maybe seen one video of someone making a mirror tier weapon as they seem to only be recommending expensive methods to shoot for a perfect craft, which you really dont want to do unless this happens to be a 3 socket, ilvl 82 base - which i doubt.</p>

<p>Unless the ilvl on this is too low for t2 prefixes, i would haste essence, desecrate a prefix, and try to fracture flaring. If that hits, sinistral crystallization + essence of battle to finish suffixes.</p>

<p>Then slam one prefix, and use sinistral crystallization + abyss essence -&amp;gt; desecrate, if you dont hit t3+ phys %  then sinistral crystallization + electricity (or any other &lsquo;gained as xx&rsquo; perfect essence) to remove the desecration and crystallization + abyss to put mark back on it. You can repeat infinitely to cheese repeated empowered desecrations for much cheaper than omen of light.</p>

<p>Then you have to Yolo t3 exalt the last prefix, and if that bricks or hits something you cant whittle away you can omen of sinistral annulment and go back to alternating abyss and perfect essence again if that hits the wrong mod (or omen of light, depending on market prices for crystallization omens//light//sinistral annulment)</p>

<p>I havent been in the talisman market for a couple weeks, so I cant tell you if its worth it at current spiny talisman prices, but I&rsquo;ve made a half dozen mirrors crafting quarterstaves the last couple weeks and talismans before that, and crit suffix + a t1 good prefix is my favorite place to start on a magic item. <sup>1</sup>&frasl;<sub>3</sub> to fracture the prefix and if you do it feels like practically free money because of how easy it is to cheese desecrations for a second good prefix.</p>

<p>This isn&rsquo;t the process you would go through to make a mirror tier weapon, for that you want to fracture crit and chaos spam merciless (and you want an exceptional base as well), but that process is far more expensive. For profit crafting I havent found a method that yields better margins than a fractured prefix on a base like this one. At least for quarterstaves I see these mods and if i fracture the prefix I know im about to make 500-2000 divs depending on the last yolo slam and desecrate rng</p>

<p>If attack speed or crit fractures, I&rsquo;d t3 exalt the other two prefixes and pray. Depending on how many whiff, I might sinistral crystallization+ essence of battle to finish suffixes and possibly sinistral abyss essence//slam another time, depending on what the prefixes look like. But most of the time when I frac a suffix i wind up annulling to one mod and chaos spamming til I hit a t2+ prefix, then yolo&rsquo;ing the other two prefixes and either resetting if i dont hit t2/2/3 or higher, or continuing by doing that same abyss essence + perfect essence cheese to get either attack speed or crit back on the weapon. Then slam and battle for a <sup>50</sup>&frasl;<sub>50</sub> to finish suffs or i go back to abyss cheesing the 2nd suffix again (crystal + abyss then perfect battle and haste until I have desecrate + fractured suff and +5 attack skills. Disable omen for battle and haste here or you waste divs) (or if the prefixes are mid ill finish with perfect haste and perfect battle)</p>

<p>Edit: just some receipts. Every single one i sell for over 1k divine starts as crit + t1 flat phys, flat light, flat cold, or t2 %phys and a prefix fracture with the method above</p>

<p><a href="https://i.postimg.cc/ncFwfh9J/q2.png" target="_blank">https://i.postimg.cc/ncFwfh9J/q2.png</a>
<a href="https://i.postimg.cc/KztsxK5D/q1.png" target="_blank">https://i.postimg.cc/KztsxK5D/q1.png</a></p>

<p>I have a bunch more pages of sales like this. Before that I was doing talismans the same way, but swapped because tri-ele talismans didnt seem as profitable as tri-elemental staves so the profit was more consistent. But you have a phys prefix here, so that&rsquo;s what id do</p>
