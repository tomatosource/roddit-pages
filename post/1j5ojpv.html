

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
}

.selfPostContainer * {
  color: white;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://www.reddit.com/gallery/1j5ojpv"><p>Suggestions on the last two slots - Skeleton Snipers</p>
</a>
    </h2>

    

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="mgifs8w" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>nova_xp</div>
        <div>1 | 19 minutes ago </div>
      </div>
      <label for="mgifs8w" class="commentText"><p>Fork, martial tempo, and scattershot could be options if you’re not using them elsewhere. Also any of the mastery supports are good filler.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="mgig604" type="checkbox" checked/>
    <div class="comment">

        <div>1 | 17 minutes ago </div>
      </div>
      <label for="mgig604" class="commentText"><p>Fork and scattershot it is! Thanks.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="mgihg4r" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Murga787</div>
        <div>1 | 9 minutes ago </div>
      </div>
      <label for="mgihg4r" class="commentText"><p>Won&rsquo;t recommend using both. Your fork damage will be really low after the scattershot. I like fork better because you don&rsquo;t lose dps against bosses/elites because scattershot from snipers only 1 arrow hits per shot with reduced damage/speed.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="mgii4ke" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>AimlessGhoul</div>
        <div>1 | 6 minutes ago </div>
      </div>
      <label for="mgii4ke" class="commentText"><p>Yeah, took off scattershot and left fork and noticed a difference right away between two maps.  Would something like lightning infusion be worth tossing in that last spot for a lil extra dps?</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="mgiizz1" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Murga787</div>
        <div>1 | a few seconds ago </div>
      </div>
      <label for="mgiizz1" class="commentText"><p>No, I use the +fire damage because I also use reavers and need to balance my skills but you should want this.</p>

<p>Heft</p>

<p>The one that makes you take damage but you deal 30% more</p>

<p>Fork</p>

<p>+to skills x2 (Chaos,Minion,Fire,physical all work)</p>

<p>Martial tempo</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

</div>

  </body>
</html>
