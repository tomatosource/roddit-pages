

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>

<div class="commentAndChildren">

      <div class="commentHeader">
        <div>CraftyPercentage3232</div>
        <div>1 | 22 minutes ago </div>
      </div>
      <label for="nf5mjy8" class="commentText"><p>I&rsquo;m sure I&rsquo;m not the only one sick to death of and try to actively avoid the Abyss event, pack size increase mods, etc. as much as possible to avoid dying to air because you can&rsquo;t see shit. I have the best gear I can afford with the currency I&rsquo;ve got and I&rsquo;m running T15&rsquo;s, 2k Life, 4k+ EShield, capped elemental resists, chaos at around 50~ Striders of the Pit on the overworld have become my mortal enemies, not to mention the green kamehamehas.</p>

<p>I have above the recommended specs:</p>

<p>i7-11800H</p>

<p>RTX 3070</p>

<p>I&rsquo;ve tried Vulkan/DX12, Max settings, low settings, everything in between, sound channels low/mid/high, culling/no culling, triple buffering on/off, etc. rolled back display driver to 576.88 tried every snake oil merchant &ldquo;tweaks&rdquo; that can be found: resizeable bar, hardware accel/high prio in Windows settings, updated the game&rsquo;s DLSS to v310.3 and using preset K, delete all shaders, blah blah blah. NONE of it has had made any discernable difference when it comes to encountering lots of ground AoE, large pack sizes, the Abyss event, etc.</p>

<p>I don&rsquo;t know about you all, but when I pay for something I kind of expect it to work ya know? GGG needs to get their priorities straight and start fixing this crap before they dilly dally on more content crap, because none of that matters if people can&rsquo;t even play a stable game. I see the posts here and on the GGG forums, I know I&rsquo;m not the only one having issues with this bull, and there are people having issues with NASA computers far beyond mine.</p>

<p>I can&rsquo;t even imagine what it&rsquo;s like for melee or non-minion classes. At least I have a chance to back off and pray my guys kill everything off screen&hellip;</p>
</label>
