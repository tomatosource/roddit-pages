

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://www.reddit.com/gallery/1k3l7nb"><p>Why is this not Monster Level 82?</p>
</a>
    </h2>

    

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="mo2vo1z" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>slingfox</div>
        <div>1 | 14 minutes ago </div>
      </div>
      <label for="mo2vo1z" class="commentText"><p>Corrupted does not automatically provide +1 level anymore.  You have to look at the corrupted areas and find a mod on that map node that says “+1 monster area” or something like that and also have it irradiated.  You also need a boss icon if you want to get the 7-8 points on the boss passive tree.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="mo2wygl" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>LiLaLoLiPoP</div>
        <div>1 | 4 minutes ago </div>
      </div>
      <label for="mo2wygl" class="commentText"><p>Ok thank you. So then this would be in the blue text somewhere right?</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="mo2vlbx" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>ConcreteSnake</div>
        <div>1 | 15 minutes ago </div>
      </div>
      <label for="mo2vlbx" class="commentText"><p>I think corruption no longer adds +1 to monsters level. I had this same thing happen earlier and didn’t understand it</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="mo2wtfc" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Peekaboo1212</div>
        <div>1 | 5 minutes ago </div>
      </div>
      <label for="mo2wtfc" class="commentText"><p>So you dont progress too fast.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="mo2xbw3" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>MoustacheStreamer</div>
        <div>1 | a minute ago </div>
      </div>
      <label for="mo2xbw3" class="commentText"><p>Corrupted or Cleansed maps can roll +1 to monster level, but if they do it&rsquo;ll show on the list of modifiers</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
