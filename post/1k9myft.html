.commentHeader {

.postTitle {
  text-decoration: none;
  color: #c39429;

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;

.streamableContainer {

  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

      <label for="mpfk5fp" class="commentText"><p>Updated PoB here: <a href="https://poe2.ninja/pob/566d" target="_blank">https://poe2.ninja/pob/566d</a></p>

<p>This is the same build I showcased <a href="https://www.reddit.com/r/PathOfExile2/comments/1k8x7xl/mowing_down_breaches_with_accuracy_stacking_amazon/" target="_blank">here</a></p>

<p>I had difficulty figuring out bossing, but with this setup, which focuses on spear stab, accuracy stacking, and use of blasphemy with vulnerability since most of the damage is physical, bosses are pretty okay now with this build. It&rsquo;s not quite 1 shot like with DE Serpent&rsquo;s Fury or Bloodmage Rake Bleed, but it&rsquo;s definitely pretty fast when it comes to mapping.</p>

<p>This is a T3 Xesht, as I was testing out lots of different combinations of support gems for maximum DPS. I ended on Martial Tempo, Bullseye, Close Combat, Heavy Swing, and Overextend. Being able to stab that quickly is pretty fun.</p>

<p>If there are better combinations that I haven&rsquo;t thought of, please let me know! I want this to kill bosses faster.</p>

<p>Basically the setups are this:</p>

<p>Pinnacle bossing:</p>

<ul>
<li>Swap Martial Tempo and Bullseye from the lvl 20 Whirling Slash into Spear Stab</li>
<li>Swap Precision from Mana Remnants to Blasphemy</li>
<li>Turn off HoT and Mana Remnants and turn on Blasphemy</li>
<li>Put your lightning whirlwind near the boss</li>
<li>Stab the boss over and over</li>
</ul>

<p>Map bossing:</p>

<ul>
<li>Same as above, but only do the Martial Tempo/Bullseye swap. You don&rsquo;t need to do the Blasphemy part</li>
</ul>

<p>Mapping:</p>

<ul>
<li>Use PoB as is, HoT and Mana Remnants are on</li>
</ul>
