      <label for="nyzaqiv" class="commentText"><p>Rule 10:
So this is a bit different we don’t really start with a recomb since we are not really targeting a specific mod, this is more “profit craft oriented”, we just want to make sure to not waste a fracturing orb since they are the most expensive part of the “base making process”</p>

<p>Get yourself a 75+ ilvl magic or normal breach ring, any ilvl is fine, just careful if you have a ilvl82 one laying around because that one would be wasted for this, those go for multiple divines.</p>

<p>I usually use perfect orb of augmentation / orb of annulment combo, until I have t1 rarity as a prefix and either t1 to all elemental resistances or t1 cast speed as suffix. Now grab yourself a greater essence of opulence, slam it on that bad boy and follow up with a preserved collarbone.</p>

<p>Your effort will be repaid soon because whatever your fracturing orb ends up hitting now, will be viable to proceed with this specific craft.</p>

<p>I will assume you hit the opulence mod, which is t1 rarity suffix, just like in this specific case I am presenting to not break rule 10, if you might need help with anything you can always ask in the thread or in dms.</p>

<p>We are going to annul the ring down to the fractured mod + another mod, hopefully it’s t1 rarity as a prefix, otherwise we will just chaos spam for it, unfortunately rarity has no “mod tag” so you can’t deterministically obtain it in any other way and not starting with both as first two mods, means that you will have to fish for either one missing through desecrations (in case your fracturing orbs hits cast speed or all elemental resistances).</p>

<p>Once you have your first two mods, we will use neural catalysts on the ring until you have “quality (mana modifiers): 6%”, we will then activate in our inventory omen of catalysing exaltation and omen of sinistral exaltation by right clicking on them and then we will slam our ring with a perfect exalted orb. If you hit t1 mana you just won, if you haven’t you will have to annul a mod, if your annul hits rarity you go back to chaos spamming, otherwise you go back to the neural catalyst step.</p>

<p>We will just assume you won and got your shiny t1 mana prefix so we can go to the next step: activate omen of dextral exaltation and slam a normal exalted orb on your ring, after that get yourself an omen of dextral crystallisation and use a perfect essence of mind on your item, congratulations, your prefixes are now done.</p>

<p>Next step will have you utilise Sibilant catalysts on the ring until the 6% threshold and slam your perfect exalted orb paired with an “omen of catalysing exaltation” hoping to hit t1 cast speed, in my experience this is the most annoying part of the craft and it’s usually a 1 in 4 to 5 to hit, I had friends not hit in 20 attempts and I have friends that haven’t missed once trying this step, hopefully you are in the latter group. My “secret” in case the first attempt missed has always been to activate an omen of dextral crystallisation and to then use an essence of the abyss on the item, as a very cheap targeted “annul” like item. You might have to annul naturally if you miss more than once and that’s ok, steps up to this point aren’t that expensive and it happens to have to start over, always keep profit in mind and don’t over use expensive currency to skip steps or to avoid doing things over.</p>

<p>Last step is simply to fish with a preserved collarbone + omen of abyssal echoes for all resistances or any other suffix that could work (high res, recover mana on kill, skill speed) if your ring is perfect it might be worth using a couple omen of lights trying to get that last affix because finished product, when I was making this as a profit craft, was around 400 divines!</p>
