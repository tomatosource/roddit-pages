

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/6e0cmb08tgag1.jpeg"><p>How do I not fuck up this upgrade sequence?</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/6e0cmb08tgag1.jpeg" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="nwuyzwz" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Accomplished-Arm6589</div>
        <div>17 | 13 hours ago </div>
      </div>
      <label for="nwuyzwz" class="commentText"><p>I&rsquo;d just use a Greater Essence to bring it to rare then use an Abyss deal on it.  Then go from there.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nwv1hud" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>ALargeCupOfLogic</div>
        <div>5 | 12 hours ago </div>
      </div>
      <label for="nwv1hud" class="commentText"><p>Essence will give you T3 or 4 life. You want to try to get armor hybrid as prefix but there’s no way to do it without spending a ton of currency. I personally would perfect regal. Desecrate whichever one is best (kurgal, etc..) don’t reveal and hit a fracturing orb on it. Hope to hit the chaos res. Perfect exalt the rest tbh. Unless you want to spend a couple hundred divines making a perfect piece.</p>

<p>In a perfect world you hit hybrid armor and flat armor as prefix. All ele res applies to armour, and whatever other mod works for you on suffix</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="nwvc997" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>super-hot-burna</div>
        <div>6 | 11 hours ago </div>
      </div>
      <label for="nwvc997" class="commentText"><p>You cannot Named desecrate armor.</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nwv206y" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>RabbitGreat3341</div>
        <div>6 | 12 hours ago </div>
      </div>
      <label for="nwv206y" class="commentText"><p>Essence another resist like lightning or whatever is needed for your build. Then use suffix omen with an exalt to hopefully get another res and block suffixes. Now last step is to abyss craft, make sure to use abyssal echos and roll if needed for flat armour. Last is exalt slam and pray GL</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nwvdddg" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>productnineteen</div>
        <div>9 | 11 hours ago </div>
      </div>
      <label for="nwvdddg" class="commentText"><p>Also applies to elemental is difficult to roll. It’s best to start with it on the base. With that said, I would greater essence with the resistance of your choice. Then double exalt the prefixes with a greater or perfect exalt and the ritual that only hits prefixes as well as the ritual that makes it hit twice. Just about anything you hit besides thorns will be useful. Alternatively you can dextral desecrate first. You can add an abyssal echoes if you really want on the desecrate and have the currency. I craft armors all the time to sell and this is the method I use. Based on your comments, go buy a T1 life t1 also applies to elemental and craft on that would be a better option.</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
