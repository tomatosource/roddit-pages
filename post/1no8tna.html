

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/lj4kd95sluqf1.jpeg"><p>Daily Discussion Thread - September 23, 2025</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/lj4kd95sluqf1.jpeg" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="nfqzfay" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>alien_from_Europa</div>
        <div>1 | 3 hours ago </div>
      </div>
      <label for="nfqzfay" class="commentText"><p>When is the best time to buy NBA Team Pass? I know they do make promotional offers throughout the year but not sure when I should pull the trigger to buy it.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nfroyc6" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>SquimJim</div>
        <div>1 | 26 minutes ago </div>
      </div>
      <label for="nfroyc6" class="commentText"><p>I just want to throw this out there for next off-season, but we can offer pretty much any player a 4/100mil deal in next year&rsquo;s free agency class because of the KP TPE, (if you are willing to part with Simons and Hauser). A sign and trade would hard cap us at the 1st apron, but the thing is, using the KP TPE in a trade would hard cap us at the 1st apron anyway due to it being a different league year than when we created the TPE. For that reason, sign and trade rules aren&rsquo;t anymore restrictive than we already would have been using the TPE.</p>

<p>If we use the KP TPE this year and create a new one with the Simons contract, (for example using the KP TPE to bring in Nurkic and send Simons to the Jazz), you can actually push the contract we can offer to 4/118mil deal.</p>

<p>The challenge I see is that there are a handful of guys that are worth that much, but most of them are restricted free agents and very few of them are centers. Guys like Dyson Daniels, Tari Eason, Christian Braun, and Walker Kessler are restricted free agents. There is one guy that I&rsquo;ve loved that is a UFA and that&rsquo;s Keon Ellis.</p>

<p>The better UFA centers are Porzingis and Ayton.</p>

<p>Anyway, all that to say, I think it&rsquo;d be beneficial to trade Simons + the KPE TPE this season in order to create a larger TPE for the off-season. This allows you more money to offer a free agent. In order to push this to the limit, you&rsquo;d also have to offload Hauser, (have to stay under the 1st apron), then you can afford the 27mil player and stay under the 1st apron. At next year&rsquo;s deadline, you may even be able to get under the tax.</p>
</label>
    </div>
  </label>
  
</div>

</html>
