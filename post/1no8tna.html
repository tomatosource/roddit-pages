    <h2>
      <a class="postTitle" href="https://i.redd.it/lj4kd95sluqf1.jpeg"><p>Daily Discussion Thread - September 23, 2025</p>
</a>
    </h2>

<div class="commentAndChildren">
  <input id="nfroyc6" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>SquimJim</div>
        <div>2 | 3 days ago </div>
      </div>
      <label for="nfroyc6" class="commentText"><p>I just want to throw this out there for next off-season, but we can offer pretty much any player a 4/100mil deal in next year&rsquo;s free agency class because of the KP TPE, (if you are willing to part with Simons and Hauser). A sign and trade would hard cap us at the 1st apron, but the thing is, using the KP TPE in a trade would hard cap us at the 1st apron anyway due to it being a different league year than when we created the TPE. For that reason, sign and trade rules aren&rsquo;t anymore restrictive than we already would have been using the TPE.</p>

<p>If we use the KP TPE this year and create a new one with the Simons contract, (for example using the KP TPE to bring in Nurkic and send Simons to the Jazz), you can actually push the contract we can offer to 4/118mil deal.</p>

<p>The challenge I see is that there are a handful of guys that are worth that much, but most of them are restricted free agents and very few of them are centers. Guys like Dyson Daniels, Tari Eason, Christian Braun, and Walker Kessler are restricted free agents. There is one guy that I&rsquo;ve loved that is a UFA and that&rsquo;s Keon Ellis.</p>

<p>The better UFA centers are Porzingis and Ayton.</p>

<p>Anyway, all that to say, I think it&rsquo;d be beneficial to trade Simons + the KPE TPE this season in order to create a larger TPE for the off-season. This allows you more money to offer a free agent. In order to push this to the limit, you&rsquo;d also have to offload Hauser, (have to stay under the 1st apron), then you can afford the 27mil player and stay under the 1st apron. At next year&rsquo;s deadline, you may even be able to get under the tax.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="nft4mks" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>TatumBrownWhite | </div>
        <div>2 | 2 days ago </div>
      </div>
      <label for="nft4mks" class="commentText"><p>I have a different path in mind.</p>

<p>A lot has to go right with this plan, but if it worked out, it would see us as having a renewed bright future in and around the top of the league in the late 2020s. Some things that I wrote here sound a lot simpler than they would be in real life. This plan has a &amp;lt; 1% likelihood but it&rsquo;s my (tempered realistic) dream, so just humor me.</p>

<ul>
<li><p>Trade Sam Hauser for (eventually) a 2029 1st round pick and take no salary back. It&rsquo;s unlikely a team that&rsquo;d be trading for Hauser would want to trade a pick so far out into the future, so it would probably have to be done through multiple transactions.</p></li>

<li><p>Extend Anfernee Simons for 1 or 2 more seasons at a lower # and take advantage of the fact that the market for scoring, no defense guards is weak at the moment. This also benefits the player as he doesn&rsquo;t just feel like he&rsquo;s in a waystation this season.</p></li>
</ul>

<p>^ This is the piece that technically unlocks everything as it allows us to duck the luxury tax and unfreeze our pick situation and every pick we have becomes tradeable again allowing for the full Bane, Bridges etc. type haul. This also significantly weakens the present day Celtics and also opens up more developmental minutes in a lost season for Baylor Schierman, Jordan Walsh, Josh Minott, and to a lesser extent Hugo Gonzalez. Which then leads to my next point which is&hellip;</p>

<ul>
<li><p>It is my preferred outcome this season for the Celtics to be in the lottery, particularly within shouting distance of the top 4 in a loaded draft class with a potential Jaylen Brown successor in the draft in the local hometown kid AJ Dybantsa. We&rsquo;re going to rely on the basketball gods assistance for that one, and no can tell me they don&rsquo;t exist after this year&rsquo;s draft lottery&hellip;Let&rsquo;s just allow ourselves to dream for a moment and make our fantasy a reality and we rise to the #3 pick and select Dybantsa.</p></li>

<li><p>Next off-season, trade Simons and significant draft assets to trade for a young, ascending player who may potentially be available, whomever the next Desmond Bane, Mikal Bridges, Derrick White etc. is, personally, I have my eyes squarely set on Trey Murphy III as the Pelicans are a clownshow of a franchise and an NBA graveyard for talent. Their contracts lineup pretty nicely in terms of a 1-to-1 trade. Because we&rsquo;d be trading with a dumbass franchise, we would probably end up trading less picks than anybody would think, like 2-3 as opposed to 4-5.</p></li>

<li><p>Also next off-season or in the summer of 2027 after you&rsquo;ve had a year to assess Dybantsa, the obvious next move after getting these 2 wings is to trade Jaylen Brown whilst he&rsquo;s at the peak of his value. That is probably more likely to be the case next off-season after he&rsquo;s had a chance to show himself off as a #1 option. In this case, I have Atlanta as a potentially vulnerable trade partner next off-season, especially if they have the kind of successful season that I think they may have next year. Jalen Johnson would obviously be the center piece of the deal, and we&rsquo;d need a mid-sized contract back like Okongwu or a NAW in order to make the trade work, with the # of picks thrown in dependent on who the extra is, maybe 1 with OO as opposed to 2 with NAW.</p></li>
</ul>

<p>This would then leave you with a base going into either 2026-27 or 2027-28 of:</p>

<p>Derrick White, age 32 and 33 seasons</p>

<p>Trey Murphy III, age 26 and 27 seasons</p>

<p>Jayson Tatum, age 28 and 29 seasons</p>

<p>Jalen Johnson, age 25 and 26 seasons</p>

<p>Onyeka Okongwu, age 26 and 27 seasons</p>

<p>Payton Pritchard, age 29 and 30 seasons</p>

<p>with ideally hometown hero AJ Dybantsa, or some other high draft pick from the 2026 class in his 1st and 2nd year in a bench role.</p>

<p>Coming out of this, you would maybe be under or around the tax depending on how the cap rises, would be relatively pick neutral (maybe you spend more on Murphy than you get back in the JB trade), and most importantly have 3 good starting level players including 2 who are potentially borderline All-Star level at the scarcest position in the league, about to enter their prime of their career around a recovered Tatum and DWhite in his last truly great years with a blue chip young player as the bridge to the future or a key piece of a big trade down the line. Everybody would probably look at that core as being one of the top 3-5 situations in the NBA at that point.</p>
</label>
