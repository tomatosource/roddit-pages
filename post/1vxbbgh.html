

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/l8tgcg3r9dlh1.png"><p>It&rsquo;s a shame this archetype is not that good</p>

	<div class="selfPostContainer">

<div class="commentAndChildren">

      </div>
      <label for="p5nidjg" class="commentText"><p>Are there any ascendancies that really like high armor? I haven&rsquo;t played enough classes to have experimented much, and it seems like the &ldquo;meta&rdquo; is all EV ES. But that helm seems like it could be really dope on a build that uses armor effectively.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="p5nlwc1" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Quick-Exit-5601</div>
        <div>1 | 7 minutes ago </div>
      </div>
      <label for="p5nlwc1" class="commentText"><p>I don&rsquo;t really recall any ascendancies that would scale off armor. With that being said, armor is in a better place than it was in 0.1.</p>

<p>More health nodes + have armor increase stun threshold and I think we are onto something here</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="p5ninj5" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Scott_Torola</div>
        <div>1 | 20 minutes ago </div>
      </div>
      <label for="p5ninj5" class="commentText"><p>Currently using something nearly identical on my plant druid. Leaves almost every other item slot to srack dmg mods. Just need a prismatic ring with all res and base res is covered. Socket chaos res and gtg.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="p5nisj7" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>azuresnow</div>
        <div>1 | 20 minutes ago </div>
      </div>
      <label for="p5nisj7" class="commentText"><p>I would have used that on my wolf oracle.</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
