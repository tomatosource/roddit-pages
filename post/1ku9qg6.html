

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://www.reddit.com/r/PathOfExile2/comments/1ku9qg6/a_proposal_to_fix_armour/"><p>A Proposal to Fix Armour</p>
</a>
    </h2>

    
    <div class="selfPostContainer">
      <p>Applying physical damage reduction before armour would allow physical damage reduction to scale armour, improving its effectiveness for armour-wearing builds while maintaining its power level for non-armour builds. Thanks.</p>

    </div>
    

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="mu0qzkj" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Romping24</div>
        <div>1 | 13 minutes ago </div>
      </div>
      <label for="mu0qzkj" class="commentText"><p>You just made armor weaker. Sorry in advance for the math</p>

<p>Given damage reduction for armour = armour/(armour + 10 x damage)</p>

<p>Lets assume y = additional physical damage reduction and x = armour value</p>

<p>Original formula for total damage reduction is:
y + [x/(x+10*dmg)] just adding both values together</p>

<p>New formula is:
y + (1-y)* [x)/(x+10*(1-y)*dmg)]</p>

<ul>
<li>you multiple by 1-y cuz your armour is only applying to the part of the hit not negated by physical reduction</li>
</ul>

<p>-you multiply damage by 1-y cuz you armour now got a smaller hit to deal with</p>

<p>Divide fraction by 1-y and now the new formula is</p>

<p>y + [x/((x/1-y)+ 10*dmg)]</p>

<p>Given y is less than 1, the new formula is always going to be weaker than the original</p>
</label>
    </div>
  </label>
  
</div>

</html>
