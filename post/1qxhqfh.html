    <div class="comment">
      <div class="commentHeader">
        <div>raislander</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="o3wfdxx" class="commentText"><p>I screwed my temple due to a loop yesterday, trying to move the architect as it was right in the middle where I needed to build. It takes way too long and after last patch it feels the locks have been nerfed or at least they don’t drop as often. I’m calling it a day and league is finished for me. Have a 3000 div build, 500div in the stash. It’s been a bonkers league. Doubt I will come next one, possibly the one after if it makes sense. I’m sure GGG is going to give us big stick next league, both for drops and skills, so in comparison is going to feel really bad next league. Hope you fix your temple though.</p>

      <label for="o3wfqo9" class="commentText"><p>you either go back to <a href="https://sulozor.github.io/#/atziri-temple?t=ACFIIUghSCFIIUhgAGA5YDlgSCE5MmgyAAA5IUgAAACYAAAySCEAAAAAAABpIUgAAAAAAABwSCEAAAAAAAB6IUgAAABhAHGASCIxOWEIQGkxIg" target="_blank">https://sulozor.github.io/#/atziri-temple?t=ACFIIUghSCFIIUhgAGA5YDlgSCE5MmgyAAA5IUgAAACYAAAySCEAAAAAAABpIUgAAAAAAABwSCEAAAAAAAB6IUgAAABhAHGASCIxOWEIQGkxIg</a></p>

<p>or you just go</p>

<p><a href="https://sulozor.github.io/#/atziri-temple?t=ACFIIUghSCFIIUgxOWA5YDlgSCE5MgAAAAA5IUhgaACYAAAySCE5MgAAAABpIUgAAAAAAABwSCEAAAAAAAB6IUgAAABhAHGASCIxOWEIQGkxIg" target="_blank">https://sulozor.github.io/#/atziri-temple?t=ACFIIUghSCFIIUgxOWA5YDlgSCE5MgAAAAA5IUhgaACYAAAySCE5MgAAAABpIUgAAAAAAABwSCEAAAAAAAB6IUgAAABhAHGASCIxOWEIQGkxIg</a></p>

<p>this what i would do, one golem or less does not break your temple.</p>

<p>anyways best is you farm up 6 locks and always keep 5, the last slot you can use for the next room or all room reoroll. you basicly need 2 locks every round by now, but its sustainable, you will to it later with the same amount of spys an 2 chains anyway.</p>

      <label for="o3whle9" class="commentText"><p>Easiest way I did was roman road. Must have a smithy medallion or sacrifice and smithy at the same round.</p>

<p><a href="https://sulozor.github.io/#/atziri-temple?t=AyJJIkkiSSJJIklhOmE6YTphSSIAAAAAAAA6IklgAACYAAAySSI5CAAAAABqIkkACAgIAABxSSIAAAAIAAB6IkkAAAAIAIFxMSIxOWEIQHpwaaoCAggIICCAIP__Bw4YOHA" target="_blank">https://sulozor.github.io/#/atziri-temple?t=AyJJIkkiSSJJIklhOmE6YTphSSIAAAAAAAA6IklgAACYAAAySSI5CAAAAABqIkkACAgIAABxSSIAAAAIAAB6IkkAAAAIAIFxMSIxOWEIQHpwaaoCAggIICCAIP__Bw4YOHA</a></p>

<p>As explained here.</p>

    <div class="comment">
      <div class="commentHeader">
        <div>75inchTVcasual</div>
        <div>1 | 5 minutes ago </div>
      </div>
      <label for="o3wnt6p" class="commentText"><p>You’re good.</p>

<p>You don’t need to lock the golem in the corner and it’s actually better for it to get deleted since you only need to maintain 1 lock while setting up.</p>

<p>From where you are, just go smithy - golem into the corner. Planner will show it’s not possible (at least when I did it a while back), but it is.</p>

<p><em>you need to place both the smithy and golem in the same turn - so either save a medallion and RNG into one or keep opening and closing and RNG into both</em></p>

<p>Lock both of the smithies coming out of the corner and the corner golem and you’re good. The Alc setup arm will destabilize you’ll have corner golem-smithy-golem-smithy left.</p>

<p>Needs 3 locks, so attempt once you have a good surplus.</p>
