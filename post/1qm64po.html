

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>

  <body>
    <h2>
      <a class="postTitle" href="https://poe.ninja/poe2/profile/Vbomb-6506/character/Vbunker"><p>Can anyone give me advice? I still get one shot</p>
</a>
    </h2>

    

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="o1jmdcz" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>_AUGUSTUS_MAXlMUS_</div>
        <div>2 | 2 hours ago </div>
      </div>
      <label for="o1jmdcz" class="commentText"><p>Ok so from first glance u r not max  ress also since u r using fire robes u want atlest 90% fire ress not 73.  Also amulet, might want rare one with hp ress and maybe some attributes. The HP u got is kind of mid. Dont get me wrong, I got charcters with worse gear but if this is ur main, u want him geared up a bit more in tearms of defences. Good shield good body armor and ascesories can solve that.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="o1jsfok" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Euphoric_Reading_401</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="o1jsfok" class="commentText"><p>Try to get at least 3-3.5k hp and 15-20k armor, although I&rsquo;m not sure how with that many uniques. That being said you&rsquo;ll still get oneshot occasionally because that&rsquo;s just how life is for anyone that doesn&rsquo;t run a million ES</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="o1jzud1" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Sovereign_dota</div>
        <div>1 | 20 minutes ago </div>
      </div>
      <label for="o1jzud1" class="commentText"><p>I will preface this by saying I looked at this for 5 minutes or so, so I may be overlooking some interactions. Ill give some actionable advice rather than vaguely gesturing at arbitrary HP benchmarks.</p>

<ol>
<li>Chaos res is overrated. Not saying ignore it but you really dont need 75%. The only relevant chaos res in maps is it that hates in breaches, the chaos plants, and the chaos cultist archers.  The first two are very deadly but they are also trivially mitigated even with 0 chaos res by paying attention.</li>
<li>Your gloves and helmet have bad/no life on it. You want t1 life at least on every single piece.</li>
<li>Using the amulet, headhunter, and cloak of flames is seriously overextending yourself. Pick 2 of the 3 to keep and drop the 3rd.</li>
<li>Don&rsquo;t sleep on stat rolls. As long as you are getting int/dex from the tree, int/dex/str on gear = 2hp per point.</li>
</ol>

<p>Now that out of the way.</p>

<p>Do the following:</p>

<ol>
<li>Get T1 life on <strong>EVERY SINGLE GEAR PIECE POSSIBLE</strong></li>
<li>Any spare suffixes go to stat rolls, resistances, and armor applies to ele. Forget rarity, until you can do juiced maps without dying you are wasting your time by having rarity anywhere.</li>
<li>I promise you a non-zero percentage reason why you are dying is just playing bad. Can you actually tell me what is killing you? Take the time to learn what it is and it wont kill you anymore. GGG has nerfed baseline map monsters into the ground over the last year, they are laughably trivial.</li>
<li>Run no damage mod maps. Do that until you feel safe and understand what monsters threaten you and what to look for, then you can run single damage mod maps and reevaluate. Also just dont run delirium until you know what you are doing, its like 30% inc damage taken.</li>
</ol>
</label>
    </div>
  </label>
  
</div>
