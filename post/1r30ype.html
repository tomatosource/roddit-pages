

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://www.reddit.com/gallery/1r30ype"><p>I may or may have not bricked my temple and I need help</p>
</a>
    </h2>

    

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="o50xcw4" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>NewManufacturer8102</div>
        <div>3 | 4 hours ago </div>
      </div>
      <label for="o50xcw4" class="commentText"><p>Wow that is interesting! My best guess is that since the russian tech garrison-spy-garrison-spy is technically ‘forbidden’ it disconnected your garrison from the chain when you looped with the flesh surgeon. But someone else may know better. Unfortunately that’s gonna be a big issue… you may be best off starting over or just trying to salvage just the first 5 rooms in your chain. I think the severed end of your chain is likely to be lost unfortunately.</p>

<p>Unfortunately the temple rules are all over the place and the simulator doesn’t seem to be accurate for all edge cases like this (In fact even the preview ingame can be wrong I think, maybe a sign that this whole mechanic needed a bit more time in the oven lol)</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="o511h85" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>mpdjabrailov</div>
        <div>2 | 4 hours ago </div>
      </div>
      <label for="o511h85" class="commentText"><p>It’s not bricked per se, but u need that connection to die out so u can re add the garrison and since ur disconnected from ur main chain u wont get enough locks to lock it so it will destabilize. Keep using the cali no lock tech on the left side by placing random trash rooms to bait the destabilizing. Don’t chain them make it as much possible for the game to randomly choose one of the cali no lock tech rooms. And hope for rngesus to bless u with the rooms to reconnect ur chain</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="o5120rs" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>mpdjabrailov</div>
        <div>1 | 4 hours ago </div>
      </div>
      <label for="o5120rs" class="commentText"><p>Good news is you are still not that far in so even if it reverts back a lot it won’t take u THAT long to rebuild. Sry that happened to u tho first time i see this and i have 2 maxed out full tech temples</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

        
      
    </div>
  </body>
</html>
