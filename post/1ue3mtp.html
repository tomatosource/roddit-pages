

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/r250ja11t59h1.png"><p>Grand Expeditions are amazing</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/r250ja11t59h1.png" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="oti0osa" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>distilledwill</div>
        <div>1 | 3 hours ago </div>
      </div>
      <label for="oti0osa" class="commentText"><p>I&rsquo;ve been putting off heading into the ocean for now because I wanted to get my standard atlas points sorted, but yesterday I started it and I immediately found two- unique maps which both gave me a Flux worth 30d. So I made 60d in about an hour.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="oti5xy3" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>WaferMeister</div>
        <div>2 | 3 hours ago </div>
      </div>
      <label for="oti5xy3" class="commentText"><p>How do you know an expedition is &ldquo;Grand&rdquo;? Is it that the node has a blue star instead of a blue dot, and the whole map is just what a logbooks used to be? Where the whole map is a big version of the league mechanic?</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="otia1u8" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Merquise813</div>
        <div>2 | 2 hours ago </div>
      </div>
      <label for="otia1u8" class="commentText"><p>Maps with the bluish star can either be Grand Expeditions or Boss encounters (medved, vorana, olroth, uthred). So yeah, just focus on those.</p>

<p>While you travel to those blue star nodes, make sure you do the mini expeditions in regular maps. Those almost always give me a logbook.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="otih2qu" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>WaferMeister</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="otih2qu" class="commentText"><p>Oh right thankyou</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

    
  </div>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="otia7nh" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Merquise813</div>
        <div>1 | 2 hours ago </div>
      </div>
      <label for="otia7nh" class="commentText"><p>I just started doing Grand Expeditions using T16 maps with 3x irradiated tablets. Divs have been dropping left and right. I got around 30 raw div drops in around 2-3 hours. I haven&rsquo;t even counted the other loot I got. I&rsquo;ve been getting at least 1 7+ runes/remnants with every map.</p>

<p>I finally encountered the 10 div remnant I&rsquo;ve been seeing getting posted here. lol</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="otiddid" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>TheRisoH</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="otiddid" class="commentText"><p>Which tablet mods are you looking for? Anything specific also on the waystone?</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="otijs8o" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Merquise813</div>
        <div>1 | 37 minutes ago </div>
      </div>
      <label for="otijs8o" class="commentText"><p>Waystone, I just run anything as long as there&rsquo;s no &ldquo;monster has increased crit chance and crit damage bonus&rdquo;.</p>

<p>Tablets, if it has increased rarity, it&rsquo;s good enough for me.</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

    
  </div>
  
</div>

        
      
    </div>
  </body>
</html>
