

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/rajnsyn64dre1.png"><p>It&rsquo;s time to give us a movement speed rune, this should state: &ldquo;Armour: 5% increased movement speed&rdquo;</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/rajnsyn64dre1.png" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="mk4zgav" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Aggravating-Bonus-73</div>
        <div>4 | an hour ago </div>
      </div>
      <label for="mk4zgav" class="commentText"><p>It would be the only rune everybody would use on every peace of gear</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="mk50azh" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>MellowSol</div>
        <div>-1 | an hour ago </div>
      </div>
      <label for="mk50azh" class="commentText"><p>I don&rsquo;t agree at all, just off the top of my head I know that my Invoker would never give up Iron Runes in my Chest Armor due to it turning into Spirit from the Ascendancy node, and there are many builds that don&rsquo;t care about movement speed at all like any Temporalis or Tempest Flurry.</p>

<p>But yes, this is definitely very strong and a lot of builds would like to use these, so the limiting factor should be their rarity, which will obviously increase the price a lot. This is a rare Greater Rune that ONLY comes from the Feral Megaliths map and ONLY has a chance to drop if you beat the full boss rush: <a href="https://youtu.be/J6RGbL4MtBs?t=1415" target="_blank">https://youtu.be/J6RGbL4MtBs?t=1415</a></p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="mk4ypde" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>MellowSol</div>
        <div>-1 | an hour ago </div>
      </div>
      <label for="mk4ypde" class="commentText"><p>No one in their right mind would ever use this rune in any armor piece to gain faster debuff expiration. Give us the chance to make some actual choices around our overall movement speed besides just getting it on boots for those of us who just want to go fast. Keep in mind, this comes at the cost of giving up slot space for Rarity Soulcores, Resistance Runes, ES/Eva/Armor increasing Runes, etc.</p>

<p>Even if you corrupted every armor piece to give your Helm two sockets, Chest three sockets, Gloves two sockets, and Boots two sockets, this would only give 45% increased movement speed, and again, at the cost of a bunch of other beneficial rune/soulcore types. If this was 4% per instead, it would only be 36% MS in total for taking up every socket. Not worth it for a lot of people, but for those of us that are tired of having to play Deadeye if we don&rsquo;t want to feel like we&rsquo;re slogging through mud everywhere we go, it&rsquo;s time to give the people what they want.</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
