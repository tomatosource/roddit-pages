

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>

      <a class="postTitle" href="https://i.redd.it/vopx412e7ajg1.png"><p>In a middle of crafting, need advice</p>

<div class="commentAndChildren">
  <input id="o56k8e1" type="checkbox" checked/>

      <div class="commentHeader">

      </div>
      <label for="o56k8e1" class="commentText"><p>Spell dmg is preferred but Extra is an ok second.</p>

<p>Its better to focus on the suffixes. Get the cast speed and crit chance or bonus.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="o56wth8" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>75inchTVcasual</div>
        <div>3 | 3 hours ago </div>
      </div>
      <label for="o56wth8" class="commentText"><p>Not worth crafting on further without a fracture on a suffix. You’re going to brick suffixes with whittles even if you reveal something good or have a blocker unless extremely lucky.</p>

<p>Best course of action here is to light off the mana suffix and attempt to fracture the +4. If it hits, you can use perfect essence of alacrity + dextral crystallization + mark of the abyss to keep revealing a suffix until one of cast speed or crit for relatively cheap and then toss a couple whittles at it to see if you can land the missing crit (either chance or damage) or cast speed.</p>

<p>But then you’re stuck with a wand you can’t sanctify and no spell damage prefix.</p>

<p>I’d personally not invest much in this. T1 Gains are bait in the sense that you do them last since they’re extremely easy to roll on. You’re better off getting another base with T1 crit or spell damage fractured on, depending on how much currency you have to invest.</p>

<p>If you really want to gamble you can light and reveal until T1 mana regen and then whittle until you hit any decent tier or cast speed or crit and reveal the other. But there’s a very good chance you land T1 mana on kill and have to gamble the all spells (same ilvl).  And even if you win the gamble you&rsquo;re likely stuck with mediocre suffix tiers (after a large investment in whittles and lights) and again, no spell damage prefix.</p>
</label>
    </div>
  </label>
