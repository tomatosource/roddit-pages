

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://youtu.be/MAWQqe3YBFE?si=2MMjk6hCNuHgKPF2"><p>Lance as usual breaking down japanese prospects for us to digest</p>
</a>
    </h2>

    

    <div class="commentList">
      
        
          
<div class="commentAndChildren">

        <div>1 | 38 minutes ago </div>
      </div>
      <label for="nksq7ai" class="commentText"><p>I think he’s too low on Saiki.</p>

<p>The kid is nasty, just needs some polishing.</p>

<p>Def gonna be a bidding war for Imai but Saiki isn’t bad of a consolation prize</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">

    <div class="comment">

        <div>bonkers-joeMama</div>
        <div>1 | 33 minutes ago </div>
      </div>
      <label for="nksr429" class="commentText"><p>I think it&rsquo;s the fastball man, imanaga was lights out early out and almost unhittable when he came but now the league has adjusted to it. If your FB is slow and doesn&rsquo;t does a lot, you would get bad eventually. Like they will start sitting on offspeed/breaking and wait you to throw your below MLB pace FB.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="nksw570" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>EricMasterdebater</div>
        <div>1 | 9 minutes ago </div>
      </div>
      <label for="nksw570" class="commentText"><p>Saiki has elite extension, high arm slot and elite spin. He also dialled it up to 99 mph in the past. He once said that he admired his team mate Fujinami and that he one day hoped to throw 100 mph as well.</p>

<p>Yes, he does not get a lot of whiffs on it anymore, but a team needs to do a 360 analysis on him like they did with Roki Sasaki and help him regain his velo. The guy might actually have one of the nastiest fastballs out there.</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

    
  </div>
  
</div>

        
      
    </div>
  </body>
</html>
