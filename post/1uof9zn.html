

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/f2utx4b3khbh1.png"><p>Can someone help me with my dueling wand?</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/f2utx4b3khbh1.png" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="ovrr6wz" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>MrOgly</div>
        <div>3 | an hour ago </div>
      </div>
      <label for="ovrr6wz" class="commentText"><p>Sry mate but it seems crazy to go for +5 here. What are the odds to ger +5, like <sup>1</sup>&frasl;<sub>700</sub>. its crazy to go this way.</p>

<p>You should always start with +5 fracture and chaos spam for crit chance. Maybe frac crit chance and roll for +5, tho i dont think these odds add up with current chaos value.</p>

<p>Even adding the cast speed should be a prefix remove omen.</p>

<p>I mean you maybe could start with fractured spell damage and get +5 with suffixe and then some whittling to get the last suffix. Seems abit more expnesive but atleast it guarentees the t1 spell dmg, which is rare</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="ovrs458" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>GeorgeHarringtonRed</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="ovrs458" class="commentText"><p>Yeah as others have basically said&hellip; you should probably annul down and chaos spam for plus skills. Then you can add the essence for cast speed and mana and plus skill for free. Then you desecrate crit. And whittle for your last prefix, probably settling on t1 gain instead of increased cold damage. This will he much cheaper than trying to desecrate plus skills. Another way to proceed is to add the cast speed essence now and the desecrate for plus skills but the odds are so low you could easily spend thousands of div on omens of light etc and not hit. So its cheaper to start over with your fractured spell damage and a chaos spam.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="ovrsbzv" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>GeorgeHarringtonRed</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="ovrsbzv" class="commentText"><p>Also if you use cast speed essence last your suffixes are not safe. It will remove a random one. So you add it now.</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="ovrr1y0" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>my-pp-big-</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="ovrr1y0" class="commentText"><p>If looking for + spells on a wand you should start with it, also for wands do suffixes first, prefixes can be done with desecrate mana, double prefect exalt then desecrate for a desired mod.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="ovrv7d4" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>prov119</div>
        <div>1 | 43 minutes ago </div>
      </div>
      <label for="ovrv7d4" class="commentText"><p>To get +5 you’d basically need to start this over. Better off just buying a +5 base and going from there</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="ovs31t8" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>zethras</div>
        <div>1 | a minute ago </div>
      </div>
      <label for="ovs31t8" class="commentText"><p>You could try to desacrate for +5 skills like what you said but it will cost you more than the worth of this wand with the +5. Try it at least once. If you cant get it. Annul and chaos spam if you want.</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
