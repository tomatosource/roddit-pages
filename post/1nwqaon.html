

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/bd7eubapxtsf1.png"><p>need some advice on this breach ring</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/bd7eubapxtsf1.png" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="nhhw4j5" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>averbeg</div>
        <div>4 | 7 hours ago </div>
      </div>
      <label for="nhhw4j5" class="commentText"><p><a href="https://poe2db.tw/Rings#ModifiersCalc" target="_blank">https://poe2db.tw/Rings#ModifiersCalc</a></p>

<p>Check mods, see what you want, figure out if you can get it with less modifiers in the pool like by using desecrated stuff, homogenous crafting and tiered currency. Have fun.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nhhwmbz" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>adam7924adam</div>
        <div>4 | 7 hours ago </div>
      </div>
      <label for="nhhwmbz" class="commentText"><p>Whittle the evasion rating hope it goes onto suffix and become a res or something, then desecrate prefix look for another flat dmg. Then ele quality slam last suffix hope its a res.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nhi6zwx" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>noctis-snow</div>
        <div>3 | 5 hours ago </div>
      </div>
      <label for="nhi6zwx" class="commentText"><p>it costs too much to fix this ring, i would try to recomb rarity and a good attack mod which should be pretty easy, and then use the cheaper omens to try to get resistances and flat damage. It should cost less, if you start using omen of whittling&hellip;etc it will definitely cost way too much</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nhic6fs" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Nexies</div>
        <div>3 | 4 hours ago </div>
      </div>
      <label for="nhic6fs" class="commentText"><p>Rings don’t have a big deterministic craft recipe because the best mods like % defense mods are prefixes and all share the same tag, so getting stuff like flat ES and % ES on one ring is difficult. Double T1 attacks and T1 rarity is a great ring already. At this point you can whittle and desecrate. I would fracture hoping to hit phys, fire is ok, rarity is mid, evasion is bricked and id just slam it raw.</p>

<p>If you’re trying to make this a full T1 ring, whittling evasion to a T1 mod is the next step. This has a chance to brick if you hit something bad like T1 Accuracy. (Alternatively, if you hit a good fracture, you can slam it with a global defense essence and <sup>50</sup>&frasl;<sub>50</sub> to hit evasion with it. This might brick it but you can still whittle evasion after.) We hope you whittle the evasion to a suffix because rarity has no tag and we want a prefix slot to desecrate. You want to get 3 Attack mods so the quality bonus goes crazy</p>

<p>If you get a prefix, you can <sup>2</sup>&frasl;<sub>3</sub> desecrate or you can desecrate suffix for tags to slam homo exalts off of. You can still hit any resistance related to the elemental tag of attack mods.</p>

<p>Since doing that t1 craft for this ring is pretty expensive just on the whittle step, I’d probably just fracture and then desecrate prefix or just slam it with or without homogenizing omen. If you miss it’s a fracture and/or bone loss and you keep using what you have, but if you hit evasion off of the ring at that step it’s pretty juicy no matter what you hit next. That method is gambling your time back to farming though</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nhiiiaq" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Purplestahli</div>
        <div>1 | 3 hours ago </div>
      </div>
      <label for="nhiiiaq" class="commentText"><p>The cheapest way you can clean the ring is just annul slam for the 25% chance to fix the ring. Thats a pretty big gamba but it would be very cheap and that ring would be a lot more valuable if it was cleaned.</p>

<p>More expensive would be of course to whittle it, but that doesnt clean it and is still big RNG.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nhilb8h" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>SnooMuffins4560</div>
        <div>1 | 3 hours ago </div>
      </div>
      <label for="nhilb8h" class="commentText"><p>whittle + good chaos orb then desecrate, omen of homogenising if you roll some res</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>

</html>
