      <label for="no4tdqf" class="commentText"><p>From <a href="http://Globe.com" target="_blank">Globe.com</a></p>

<p>By Adam Himmelsbach</p>

<p>ORLANDO — With the Celtics’ 11-point fourth-quarter lead suddenly down to 2, with the prospect of another discouraging loss mounting, it looked like the Celtics would turn to their All-Star, <a href="https://www.bostonglobe.com/2025/11/08/sports/celtics-jaylen-brown-and-dunking/?p1=Article_Inline_Text_Link" target="_blank">Jaylen Brown</a>, to steady them.</p>

<p>That’s what <a href="https://www.bostonglobe.com/2025/10/07/sports/jordan-walsh-celtics/?p1=Article_Inline_Text_Link" target="_blank">Jordan Walsh</a> thought would happen, at least.</p>

<p>“At first I was thinking, ‘Jaylen is going to shoot this,’ ” he said.</p>

<p>So he started spying angles to crash for an offensive rebound. Then Brown started slicing toward the rim, and it was time for Walsh to recalculate.</p>

<p>Brown kicked the ball to Payton Pritchard, a normally reliable shooter who has been inconsistent this season. Pritchard pump-faked, took two dribbles, and fed the ball to Walsh, who had relocated to the right corner.</p>

<p>The Magic were probably willing to live with this sequence. Walsh is a career 27.8 percent 3-point shooter, and isn’t known for hitting game-clinching shots in tense moments.</p>

<p>But his confidence has swelled thanks to the opportunities he has received over the past week, particularly in this game, in which he had played the entire fourth quarter and helped stake Boston to the 11-point cushion with his frenetic defense.</p>

<p>So he caught the ball and calmly drained a 3-pointer with 12.4 seconds left that stretched the lead to 5 and helped Boston escape with a 111-107 win on Sunday night.</p>

<p>At first he appeared more relieved than thrilled.</p>

<p>“I was like, ‘Oh, my goodness,’ ” said Walsh, who entered the night with just three 3-pointers all season. “I didn’t even celebrate it or anything. I was just in the moment.”</p>

<p>When the Magic called timeout, his teammates took care of the excitement on his behalf, swarming and bumping him, aware that a much-needed win was near.</p>

<p>Walsh’s flurry was just one part of the improbable end for Boston, which also received essential late contributions from rookie spark plug Hugo González and backup center <a href="https://www.bostonglobe.com/2025/07/14/sports/celtics-summer-league-luka-garza-josh-minott/?p1=Article_Inline_Text_Link" target="_blank">Luka Garza</a>, who both received more fourth-quarter playing time than Brown.</p>

<p>Walsh said that when he was paired with González for a crucial stretch in which the Celtics seized control with a 13-0 run, his message was simple.</p>

<p>“Let’s just mess this game up, like, for everybody,” Walsh recalled telling González. “So that’s what we did.”</p>
