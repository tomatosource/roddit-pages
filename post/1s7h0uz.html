.postLink:visited {

.commentText,

      <label for="od9bb5l" class="commentText"><p>If you don&rsquo;t play ssf don&rsquo;t worry just use them. You will have access to plenty of them in the end game. Either follow a guide or just mess around with them. Little tip you can also use ones that are not recommended by the game.</p>

      <label for="odb9jjk" class="commentText"><p>Would be cool if support gems worked a bit like orbs where you R-click it, then click the gem you want to support and then it pulls up the menu with the recommended support gems, their tiers, and a tick-box that enables showing non-recommended gems for that spell.</p>

      </div>
      <label for="od9x5on" class="commentText"><p>At least put them in your stash so your characters inventory has some space to pick up new items!</p>

<p>They ain&rsquo;t that important tho but not bad to save for when you want to experiment some</p>

<div class="commentAndChildren">
  <input id="oda0yyy" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>tonaros</div>
        <div>2 | 7 hours ago </div>
      </div>
      <label for="oda0yyy" class="commentText"><p>Sorry you&rsquo;re getting downvoted, this game is difficult to understand at first. I agree with the other commenters, put the gems into your stash, and experiment as much as you like! You&rsquo;ll always find more, and eventually you&rsquo;ll be able to buy them.</p>
</label>

<div class="commentAndChildren">
  <input id="odanoa9" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Birphon | 0.5</div>
        <div>1 | 3 hours ago </div>
      </div>
      <label for="odanoa9" class="commentText"><p>Firstly, you can stash them in one of the tabs, you can return to the main town of the Act infinite amount of times as there is a button bottom right near your skills, you can also assign a key for this. You most likely wont have spent the money for the Stash Tab, however GGG does have Stash Tab Sales so in roughly 3 Days 12 Hours you might want to snag a Gem Stash Tab as you did get 300 coins for buying the game.</p>

<p>If you do end up using your coins on tabs which imo is the best way to spend the ideal route is: 1x Currency, 1x Gem, 1x Merchant. Currency Tab allows you to store all your currencies (Orbs of Augments etc), Gem Tab is to store gems both Cut and Uncut and Merchant Tab is used once you hit Act 4 as a way to sell your items to other players while you aren&rsquo;t logged in (Async Trading). Rest of the tabs are a vibe for what you want, maybe look at a Quad Tab next</p>

<p>Secondly, I am going to assume you aren&rsquo;t on SSF (Solo Self Found) which means that you can trade with others (unlocked at the start of Act 4) and when you get to maps there should be a decent drop rate of them anyway. So feel free to use them</p>

<p>Thirdly, There is a &ldquo;Recommended&rdquo; check box at the bottom left corner when you go to use the Support Gems, this will show you all the Support Gems in the game</p>

<p>Fourth, Ideally you would be following a guide for your first couple of characters especially if you are new, as it takes away a giant portion of learning away and you can focus on playing the game, <strong>HOWEVER</strong>, its totally fine to home brew your own character and learn and I mean so far you have a pretty good line up of skills, unsure on the supports cause I cant see those. Guides can be found on YouTube (Avoid AI Tumbnails, Fextralife, and general Clickbait titles &ldquo;THE BEST X BUILD FOR Y CHARACTER&rdquo; kinda ones as they all tend to be slop) <a href="https://mobalytics.gg/poe-2" target="_blank">Mobalytics</a> and <a href="https://maxroll.gg/poe2" target="_blank">Maxroll</a> -- Again, I can&rsquo;t stress this is enough, its totally fine to homebrew it up and build your own character and its 1000% not needed to follow a guide</p>

<p>Fifth, It looks like you are a console player so im not gonna bash to hard however Phone Photos :(</p>
