

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/vamzj5wgqmue1.jpeg"><p>Going back to my burning ground map</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/vamzj5wgqmue1.jpeg" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="mmx9irk" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Ok-Coat-2230</div>
        <div>7 | 7 hours ago </div>
      </div>
      <label for="mmx9irk" class="commentText"><p>As a new player who didn’t know temporal chains: I thought it was a bug and quickly turned into my worst map experience by far. Never running again.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="mmyan0k" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>the8bit</div>
        <div>2 | 4 hours ago </div>
      </div>
      <label for="mmyan0k" class="commentText"><p>Back in poe1 this is why things like -%curse effect flasks are valuable, but in poe2 I&rsquo;m not aware of any character way to mitigate curse effect, so we are stuck with it.</p>

<p>Oh also they used OG temp chains which was loathed and changed to be far less awful as the game evolved</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="mmyeuiy" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>MrCinos</div>
        <div>1 | 3 hours ago </div>
      </div>
      <label for="mmyeuiy" class="commentText"><p>I assume passive notables like Unimpeded and other ones with reduced potency of slows/slowed debuffs help? At the very least &ldquo;Unaffected by slows&rdquo; (Relentless Pursuit ascendancy node) just sets temp chain at 0% effectiveness to Pathfinder and you can safely ignore that map mod on the ascendancy. Feels good to have the ability to ignore chilling, shocking (or burning, have to decide on one) grounds as well as temp chains map mods for the price of 2 ascendancy notables.</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

    
  </div>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="mmyj1os" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>sargat</div>
        <div>5 | 3 hours ago </div>
      </div>
      <label for="mmyj1os" class="commentText"><p>I swear 22% temporal chains feel like 80% slower</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
