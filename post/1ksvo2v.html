

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://youtu.be/C3DO4FUOYf0?si=rwAlGCoufYKb7UaA"><p>GGG, you want more interesting builds and combo gameplay? Listen to this</p>
</a>
    </h2>

    

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="mtorjjp" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>PFMISO</div>
        <div>1 | 12 minutes ago </div>
      </div>
      <label for="mtorjjp" class="commentText"><p>I really don&rsquo;t like this talking point that PoE1 doesn&rsquo;t have meaningful impactful combat. I actually think PoE1 capitalizes more on meaningful buttons over rotational combat, and I love it for that. Movement skills, defensives, curses are all examples of meaningful inputs. To me, PoE2 lacks meaningful inputs. To me rotational combat makes me care more about what my character is doing then what the boss I&rsquo;m fighting is doing. I like focusing on the boss, not my character.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="mtou0ge" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>romicide07</div>
        <div>1 | a few seconds ago </div>
      </div>
      <label for="mtou0ge" class="commentText"><p>The way I look at it is you can kind of pick your path. Perfect example is slams in poe1. You can automate all your warcries, but your damage will be decently worse than having 4 manually pressed and getting the benefit from. Players have autonomy in poe1. In poe2 due to the multi skill combo vision it funnels you into paths of intended gameplay. Happy for the people that enjoy it, just not for me and that’s fine</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="mtoqyax" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Kettuklaani</div>
        <div>1 | 15 minutes ago </div>
      </div>
      <label for="mtoqyax" class="commentText"><p>They will not listen to reddit. And game is done for now.</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
