

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/5uwhfflztowg1.jpeg"><p>New to the franchise and I&rsquo;m so happy with my experience so far! What draws you to this game, and why do you play who you play?</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/5uwhfflztowg1.jpeg" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="ohl6b62" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Haldalkin</div>
        <div>1 | 14 minutes ago </div>
      </div>
      <label for="ohl6b62" class="commentText"><p>There are a number of reasons I&rsquo;m drawn to the genre as a whole. For PoE2, in particular, it&rsquo;s the concept of getting in to GGG&rsquo;s mad laboratory on the ground floor. I play PoE1 casually, I found it far too late and cannot really even conceive of closing the knowledge gap. So, I don&rsquo;t have much motivation to pursue it, which is a shame, because everyone who has crossed that gap seems to greatly enjoy themselves. I&rsquo;d like to have that experience with PoE2.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">

        <div>1 | 6 minutes ago </div>
      </div>
      <label for="ohl769f" class="commentText"><p>I will answer those questions with:</p>

<p><a href="https://preview.redd.it/6py77ctdvowg1.png?width=651&amp;format=png&amp;auto=webp&amp;s=e8b6d06240e2c7f61d92b0231b2bb6bc3bb3eb7d" target="_blank">https://preview.redd.it/6py77ctdvowg1.png?width=651&amp;format=png&amp;auto=webp&amp;s=e8b6d06240e2c7f61d92b0231b2bb6bc3bb3eb7d</a></p>

<p>Jokes aside. GGG is a pretty awesome company. POE2 has some pretty great vibes for whatever floats your boat.</p>

<p>If you like dark magic, you should also try Acolyte of Chayula with Blackflame Covenant caster build. Purple flame is pretty sick.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="ohl7ioh" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Void_HighLord</div>
        <div>1 | 3 minutes ago </div>
      </div>
      <label for="ohl7ioh" class="commentText"><p>Playing 1 different class per league. Next league I&rsquo;m gonna play crossbows (probably witchhunter)</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
