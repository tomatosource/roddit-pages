      <label for="m4imzmg" class="commentText"><p>Terrible ideas.</p>

<p>Spurs win every OT game by just putting Wemby out there. Jokic just backs down every defender and gets layups. Anyone who has played 1-on-1 knows that bigger players have a massive advantage and it’s not that fun or interesting.</p>

<p>For the 3-point line, he already made the claim at the end of the video it’s not a problem. So why do we need to change it? This is just encouraging teams to remove the 3-point line and yet again give the massive advantage to big men where every team just looks for the next Shaq. Without 3’s, you can’t beat dominant big men like this because the high 3 point volume is about the math, and the layup is more efficient than any other shot. Enjoy watching the Bucks winning the next 5 championships because no one can stop Giannis. This also doesn’t encourage teams to evolve the game and come up with strategies to combat high volume 3-point attempts, it just encourages teams to build their team 1 way and never advance past that because you’re giving such a massive home court advantage which already exists in the NBA where everything is uniform. We need more competitive games, not less.</p>

<p>In baseball, fans don’t need to understand the field dimensions. They just see the Green Monster and understand righty’s are good. They see Yankee Stadium and know they hit a lot of home runs. It’s a lot easier to visualize the advantage without thinking about it. You’re telling me the average NBA fan, who can’t figure out the Celtics move the ball and get open 3’s and don’t jack them up why the 3-point line is where it is? Can you move it in or only out? They can’t even figure out the most basic info like “why are no games on tonight” or “why isn’t this player playing” or come up with impossible trades because they haven’t read really easy to find salary matching rules.</p>

<p>You think they’re going to be able to figure out why the 3-point line is moved back from one game to the next and why it’s missing entirely sometimes? Absolutely no chance.</p>

<p>Nobody had a problem the other night when the Celtics hit a bunch of their 3’s and blew out the Pacers. But yet again we bring this up when they had a bunch of open 3’s and they didn’t go in.</p>

<p>These suggestions are awful gimmicks and not the answer to whatever issues you personally have with the game.</p>
</label>
