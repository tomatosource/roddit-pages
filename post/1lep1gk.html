

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/o6hi38sudq7f1.png"><p>Please help me craft this beast</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/o6hi38sudq7f1.png" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="myhx245" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>No_Detective4853</div>
        <div>1 | 38 minutes ago </div>
      </div>
      <label for="myhx245" class="commentText"><p>I think with 10 divs the best you can do is slam exalts and pray for a good income.For real crafting you need a lot of currency(i mean a LOT of currency)</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="myhxbqj" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>InconB</div>
        <div>1 | 37 minutes ago </div>
      </div>
      <label for="myhxbqj" class="commentText"><p>There’s nothing left to do realistically with that budget. You can exalt once then fracture hope it doesn’t hit a shit mod then omen roll your suffix a single time. But, that really won’t do anything for you. Ex slam it out then you can whittle the lowest mod but you could get a high tier bad mod and be bricked anyway</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="myhxk95" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>CharleyMCOC</div>
        <div>1 | 36 minutes ago </div>
      </div>
      <label for="myhxk95" class="commentText"><p>Depends what you want out of the boots. With only 10 divs, you aren&rsquo;t going to be doing much of whittling/omens. And using the greater haste means you can&rsquo;t use the essence that doubles the effect of sockets.</p>

<p>So Exalt slam &amp; pray is where you are now. You can try fracturing, to lock in one ofyour decent mods once you put another mod on (need 4 minimum to fracture) but unless it&rsquo;s a good mod, you run the gamble of it fracturing the bad mod.</p>

<p>Are these boots you intend to wear or just to trade?</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="myhzo9d" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>AzSubi</div>
        <div>1 | 26 minutes ago </div>
      </div>
      <label for="myhzo9d" class="commentText"><p>If they rolled well i would have worn them but they turned out kinda shit.
Btw i didnt want to fracture since i already have way to many fracturing projects</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="myi1zr1" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>75inchTVcasual</div>
        <div>1 | 14 minutes ago </div>
      </div>
      <label for="myi1zr1" class="commentText"><p>Ideal would be to slam and hope to fracture one of MS, ES, or Int. Although that ES roll can be divined up further to 60 or close.</p>

<p>It’s a pretty straightforward craft from there if you land the fracture on MS or ES and not on Int or 4th mod if it’s a dud.</p>

<p>Fracture on Int is okay too but makes the prefixes more expensive to craft, which is what’s at biggest risk of bricking and resetting.</p>

<p>But with that budget it’s slam and keep and craft on later or sell as a crafting base now, but not a lot of demand since it doesn’t have 100% socket effect essence on it.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">

      </div>
      <label for="myhx0xz" class="commentText"><p>Simple.. just vaal it or forget it</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="myhx6uh" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Narrow-Rub3596</div>
        <div>1 | 37 minutes ago </div>
      </div>
      <label for="myhx6uh" class="commentText"><p>Well, exalt slam, quality, then Vaal</p>
</label>
    </div>
  </label>

<div class="commentAndChildren">

      <label for="myhyqgp" class="commentText"><p>Well exalt, quality, socket, vaal</p>

</div>

</div>

</html>
