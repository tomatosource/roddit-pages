

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>

</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/ar28xtgv4jbg1.jpeg" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">

        <div>10 | 5 hours ago </div>
      </div>
      <label for="nxt849b" class="commentText"><p>2015: Sorry, Cubs, your lease is up. Guess you have to move.</p>

    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nxtfl6a" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>oogieball | Dumpster Fire • New York Mets</div>
        <div>2 | 4 hours ago </div>
      </div>
      <label for="nxtfl6a" class="commentText"><p>Actually an interesting middle bit left out. Murphy, who also owned a minority stake in the Phillies stadium, actually sold to Phillies owner Charles Taft for a year, before he sold to Weeghman.</p>

    </div>

</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nxuaog8" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>sonofabutch | New York Yankees</div>
        <div>2 | an hour ago </div>
      </div>
      <label for="nxuaog8" class="commentText"><p>Weeghman was known as the &ldquo;Quick Lunch King.&rdquo; His diners served coffee, pie, and ready-made cold sandwiches. They had <a href="https://restaurant-ingthroughhistory.com/wp-content/uploads/2008/09/newarkonearm163.jpg" target="_blank">one-armed chairs</a> so more people could be seated. &ldquo;One-arm diners&rdquo; became a brief fad, with the owners <a href="https://restaurant-ingthroughhistory.com/2012/04/09/eat-and-run-please/" target="_blank">trying to get customers in and out as quickly as possible</a> &ndash; some went out of their way to find uncomfortable chairs, and didn&rsquo;t put out coat racks so diners would keep them on while eating!</p>

<p>The one-arm diner fad died out during the Great Depression as restaurants, struggling to survive, put in booths and other &ldquo;luxuries&rdquo; to lure in the few customers with spending money.</p>

    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
