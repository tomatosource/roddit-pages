

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://www.reddit.com/gallery/1jeog4t"><p>Stats don’t make sense pls help</p>
</a>
    </h2>

    

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="mikakf5" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Sad-Possession7729</div>
        <div>7 | 4 hours ago </div>
      </div>
      <label for="mikakf5" class="commentText"><p>The worse pair gives +5 to STR.  Is it possible that losing that +5 STR causes you to be unable to meet the minimum requirements to equip any of the other armor that you&rsquo;re wearing?</p>

<p>Edit - Try resetting one passive node to give yourself +5 more natural STR.  Then try switching boots again.  You&rsquo;ll have your answer if you don&rsquo;t have the same problem the 2nd time</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="mike4sp" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">

      </div>

</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

        
      
        
          
<div class="commentAndChildren">

        <div>Nars_Bars</div>
        <div>2 | 4 hours ago </div>
      </div>
      <label for="mikaslc" class="commentText"><p>The weaker boots have +5 strength which you probably need to be able to equip your body armor or hat or something.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="mikad9d" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Jazzy_Jaspy</div>
        <div>1 | 4 hours ago </div>
      </div>
      <label for="mikad9d" class="commentText"><p>Is it something related to being at max health?</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="mikascd" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Birobill</div>
        <div>1 | 4 hours ago </div>
      </div>
      <label for="mikascd" class="commentText"><p>Not that I’m aware of</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="mikee3g" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Beast_of_Guanyin</div>
        <div>1 | 3 hours ago </div>
      </div>
      <label for="mikee3g" class="commentText"><p>Your gloves or belt need the strength.</p>

<p>If they&rsquo;re red it means they&rsquo;re on you but not equipped.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="mikgwsd" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Cemgec</div>
        <div>1 | 3 hours ago </div>
      </div>
      <label for="mikgwsd" class="commentText"><p>Don’t hesitate to respec stats based on items you get along the way. It’s all about balancing damage / resistance / armor evasion or energy shield during leveling. Later you will try to increase your dps and add in some rarity if you can while maintaining your capped res and not sacrificing defense too much.
Btw you may consider switching to evasion/energy shield instead of armor/evasion later on. Armor is not very effective currently and evasion seems to work better until they make balance on defense mechanisms</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
