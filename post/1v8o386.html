

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/qhyp5a3hhwfh1.png"><p>Just me or does this happen every league?</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/qhyp5a3hhwfh1.png" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="p07evce" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Elegant_Chocolate546</div>
        <div>2 | 2 hours ago </div>
      </div>
      <label for="p07evce" class="commentText"><p>I literally just dropped a unique amulet I used the entire campaign and was a little sad about it 🤣</p>

<p>Headhunter staying on him tho 😆</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="p07e26r" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>A-Money-Lover</div>
        <div>1 | 2 hours ago </div>
      </div>
      <label for="p07e26r" class="commentText"><p>Uhh,,, yeah. Then you can bling them up with cool runes, corrupt them, upgrade them with the anvil, and so on</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="p07ensi" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Environmental-Map514</div>
        <div>3 | 2 hours ago </div>
      </div>
      <label for="p07ensi" class="commentText"><p>I guess, that was my experience in PoE1, and it hasn&rsquo;t changed in PoE2, or do you pretend to have all the uniques guaranteed from the start?</p>

<p>I play Hardcore, so I don&rsquo;t marry myself to a single build. If you lock yourself into just one character, then of course anything that doesn&rsquo;t benefit your build in time will seem useless and hollow content.</p>

<p>It happened to me tho, that I like a lot the unique effect from some weapons or items, but they&rsquo;re so low level that you can&rsquo;t just dream about building around it :&lsquo;)</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="p07io4w" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>tooncake</div>
        <div>4 | an hour ago </div>
      </div>
      <label for="p07io4w" class="commentText"><p>Opposite happened to me, I started with some decent gears then ends up with almost all uniques in my gear on my current end game run. The only reason I was &ldquo;forced&rdquo; to change my gloves,boots and 2 rings to rare is because most uniques aren&rsquo;t flexible to maximized your defenses, esp for the resis and boosting better runic wards or prioritizing 1 maximized defense (armour / eva / es).</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
