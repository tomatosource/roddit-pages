

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/xsgw9gb65c6g1.jpeg"><p>Don’t sleep on this support on Druid</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/xsgw9gb65c6g1.jpeg" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">

</div>

        <div>1 | 12 minutes ago </div>
      </div>
      <label for="nt9b8k3" class="commentText"><p>I was planning to socket this to a Wrath Scepter&rsquo;s Fulmination but other games got released. If there is a keystone that enables scepter with talisman, I&rsquo;d do it this league FR this time.</p>

</div>

        
      
        
          
<div class="commentAndChildren">

        <div>1 | 8 minutes ago </div>
      </div>
      <label for="nt9bniv" class="commentText"><p>I tried it this league. Wasn&rsquo;t impressed by it tbh. Unless they changed the scaling or smth.</p>

    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nt9c33b" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>LordAlfrey</div>
        <div>1 | 3 minutes ago </div>
      </div>
      <label for="nt9c33b" class="commentText"><p>IF we get the keystone that allows for dual wield of talisman and sceptre and IF wolf minions are good, there might be a build there for temporary summons. Wolves, living lightning, maybe insect swarm, skittering stone and unearth.</p>

<p>From what I remember though there was something buggy about the new passives for temporary summons up in the top left part of the tree, and I don&rsquo;t think there&rsquo;s a particularly strong incentive to use temporary minions over permanent ones really, but we&rsquo;ll see. Wolves and living lightning might have very strong clear potential, as they both seem rather quick and LL can chain.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nt9c3e0" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Rentahamster</div>
        <div>1 | 3 minutes ago </div>
      </div>
      <label for="nt9c3e0" class="commentText"><p>It seemed really hard to scale the damage on these things. They seemed okay to extract impales, but that was about it.</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
