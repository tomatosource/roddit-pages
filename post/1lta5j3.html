       * {

*,

}

html {

body {
  display: flex;

}

  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;

}

blockquote {
  border-left: 10px solid #ccc;

}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>

    <h2>
      <a class="postTitle" href="https://imgur.com/a/RrAcM5L"><p>Gigantic latency spikes randomly, any known fixes?</p>
</a>
    </h2>

    

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="n1orpfd" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>djrob0</div>
        <div>1 | a day ago </div>
      </div>
      <label for="n1orpfd" class="commentText"><p>Sorry if this is asked and answered, I just came back to the game after several months off. I went through some of the common posted fixes on the sub like the /clear thing in chat but none seemed to work.</p>

<p>Everything else seems to be working normally but every 10 mins or so the game randomly had a stroke and goes through these gigantic spiking and falling latency phases for a minute or so before it calms down again. Kinda making the game unplayable.</p>

<p>Anyone know of a fix for this?</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="n1otlbu" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>MellowSol</div>
        <div>1 | a day ago </div>
      </div>
      <label for="n1otlbu" class="commentText"><p>Only thing that fixed it for me was using a VPN and setting it to a city near me. Something about the routing of the connection, possibly connecting to a different server instead of the unstable one you&rsquo;re connected to. Can&rsquo;t say it&rsquo;ll fix it for sure, but it did for me.</p>
</label>
    </div>
  </label>
  
</div>

    
      
<div class="commentAndChildren">
  <input id="n1p1os0" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Royal-Jackfruit-2556</div>
        <div>1 | 21 hours ago </div>
      </div>
      <label for="n1p1os0" class="commentText"><p>Try joining an empty global and trade chat, for eg type in /global 12477 and /trade 12447.</p>

<p>For many people anytime somebody in global or trade send a message it skyrockets your connection.</p>
</label>
    </div>
  </label>
