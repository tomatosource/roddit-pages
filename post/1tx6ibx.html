

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/ljafjhoj7d5h1.jpeg"><p>Still a banger but&hellip;..</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/ljafjhoj7d5h1.jpeg" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="opttxva" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Haldalkin</div>
        <div>7 | an hour ago </div>
      </div>
      <label for="opttxva" class="commentText"><p>They need to do them in batches over a period of time to make sure what they fix sticks. Unless you&rsquo;d like for them to tackle the entire iceberg in one go? To me, that seems rather like how we got here; making big moves. Unprecedented moves. It&rsquo;s just a few hours shy of a week into a 6 month league. If what they&rsquo;ve delivered with 0.5 hasn&rsquo;t granted them the slightest grace with some people, then it may be that those people simply <em>cannot</em> be pleased at all.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="optoqkc" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>PanHiszpan</div>
        <div>4 | 2 hours ago </div>
      </div>
      <label for="optoqkc" class="commentText"><p>They had to start somewhere xd</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="opu1b40" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Local_Food9567</div>
        <div>1 | 33 minutes ago </div>
      </div>
      <label for="opu1b40" class="commentText"><p>Fair, there are alot of bugs. Some of them a pretty impactful as well.</p>

<p>If they are going to make 1.0 I feel they kind of need to go fast and fix fast or they just won&rsquo;t get the thing shipped.</p>

<p>It&rsquo;s a good change of direction instead of prioritising the current or next league.</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
