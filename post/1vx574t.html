

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>

    <h2>
      <a class="postTitle" href="https://youtu.be/cbR8hKCi35g?si=WFNQXxHQuMJ3TzpO"><p>Who is The Druid? (Lore of Exile)</p>
</a>
    </h2>

    

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="p5mijc1" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>veringo</div>
        <div>19 | 3 hours ago </div>
      </div>
      <label for="p5mijc1" class="commentText"><p>I generally like lore videos, especially in games like POE2 where it&rsquo;s somewhat convoluted and hidden. This creator seems to be going a route I don&rsquo;t really like.</p>

<p>Clarity is being sacrificed for overwrought language that mostly just adds length. I also noticed a decent amount of AI tropes in the script (e.g. it&rsquo;s not this it&rsquo;s that), that make me think the wordiness isn&rsquo;t being written by a person.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="p5ncigk" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>bigeyez</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="p5ncigk" class="commentText"><p>He is obviously inspired by Vaati who tends to do the same thing in his souls borne lore videos.</p>

<p>Not sure about the AI accusation. Could he be using it to help draft his scripts? Maybe but I&rsquo;ve also heard plenty of lore videos in a similar style before AI blew up so who knows.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="p5nlcjk" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>veringo</div>
        <div>1 | 9 minutes ago </div>
      </div>
      <label for="p5nlcjk" class="commentText"><p>Yeah, I think that&rsquo;s part of my issue with it. I&rsquo;ve watched Vaati videos before, and it&rsquo;s a little overdone for my taste, but I get it&rsquo;s meant to be cinematic.</p>

<p>I just watched an old Vaati video now and compared to the druid video. It&rsquo;s the same style of thumbnails, the exact same intonation and cadence, and the exact same propensity for interrupting clauses but turned up to 11.</p>

<p>Almost every sentence in this video sounds like it has at least 3-4 em dashes not to mention the AI habit of always using passive voice, but without the same kind of purpose as Vaati. Hearing them side by side, I&rsquo;d be more shocked to hear that this is an original content creator than I would that they fed info from POE2 into an LLM and asked it to make a video in Vaati&rsquo;s style.</p>
</label>
    </div>
  </label>
