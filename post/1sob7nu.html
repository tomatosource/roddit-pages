

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://www.youtube.com/watch?v=o4vkcDlklUQ"><p>MLB Network&rsquo;s instant reaction to the shocking death of Garret Anderson</p>
</a>
    </h2>

    

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="ogrwvbx" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>MusclyArmPaperboy | Toronto Blue Jays</div>
        <div>9 | 3 hours ago </div>
      </div>
      <label for="ogrwvbx" class="commentText"><p>They usually have these obits built and ready to go. I&rsquo;m sure every music mag has one for Phil Collins ready.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="ogs8pg4" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>ContinuumGuy | Major League Baseball</div>
        <div>4 | 2 hours ago </div>
      </div>
      <label for="ogs8pg4" class="commentText"><p>IIRC, Sports Illustrated&rsquo;s ENTIRE ISSUE the week Muhammad Ali died (outside of a few changes to reflect his actual death and some relatively minor articles related to that week&rsquo;s actual sporting events) had existed in one form or another since the late 80s/early 90s, they&rsquo;d just update it every few years. Apparently it was a joke when they&rsquo;d decide what would go on the cover that it was all contingent on Ali not dying that week.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="ogsl73z" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>KinsellaStella | Washington Nationals</div>
        <div>2 | 31 minutes ago </div>
      </div>
      <label for="ogsl73z" class="commentText"><p>New York Times has obits ready to go and frequently updated on an enormous number of people, anyone notable.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="ogsnd90" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>ContinuumGuy | Major League Baseball</div>
        <div>3 | 19 minutes ago </div>
      </div>
      <label for="ogsnd90" class="commentText"><p>Yeah I think in some cases the credited writers for obituaries include people who themselves were deceased.</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

    
  </div>
  
</div>

    
  </div>
  
</div>

        
      
    </div>
  </body>
</html>
