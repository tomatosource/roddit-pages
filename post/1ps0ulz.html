

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/f4jdb9lofi8g1.png"><p>Can I make something good out of this?</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/f4jdb9lofi8g1.png" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="nv600t0" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Cy8r4</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="nv600t0" class="commentText"><p>Desecrate it</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nv61jb5" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>F00zball</div>
        <div>1 | 31 minutes ago </div>
      </div>
      <label for="nv61jb5" class="commentText"><p>Your prefixes are trash unfortunately so this isn&rsquo;t going to be worth much in Trade League. You can desecrate the 6th mod if you want, but a Preserved Collarbone is worth more than the ring itself even if you hit something decent. Your best bet is probably to toss a Chaos Orb at it to try and roll a better prefix (40% chance to hit) and then decide from there if it&rsquo;s worth desecrating. If you&rsquo;re playing SSF &amp; desperately need res just slam the 6th mod &amp; equip it.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="nv64gj4" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Remediassance</div>
        <div>1 | a minute ago </div>
      </div>
      <label for="nv64gj4" class="commentText"><p>Thanks for the advice, guess I&rsquo;ll just slam the 6th mod and see what comes out of it.</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nv5zo7b" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Appropriate_Aerie379</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="nv5zo7b" class="commentText"><p>For a ring like this though just buy something better on trade for way way less than the cost of the crafting mats.  Those prefixes are bad.</p>

<p>Not trying to be elitist or anything like that, just trying to save you the cost of wasting mats since preserved jawbones are expensive and for the cost of one of those you could get a way better ring with good prefixes this late in the league.</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
