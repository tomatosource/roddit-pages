

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://www.reddit.com/gallery/1qkhjhh"><p>Liberator sup pack 2 prices???</p>
</a>
    </h2>

    

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="o16naaq" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Chunstaop</div>
        <div>1 | 39 minutes ago </div>
      </div>
      <label for="o16naaq" class="commentText"><p>Edit: so if i opt for the 100$ upgrade then will i only get that packs items?</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="o16nysy" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Dorky_Gaming_Teach</div>
        <div>1 | 34 minutes ago </div>
      </div>
      <label for="o16nysy" class="commentText"><p>What in the hell is that, and why is it so damn expensive?  Don&rsquo;t get me wrong, I have probably spent that much on storage, currency tabs, etc over the last ten years, but $480.00 for an item?</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="o16oiik" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Krasnytova</div>
        <div>1 | 31 minutes ago </div>
      </div>
      <label for="o16oiik" class="commentText"><p>Its the last tier of Supporter Pack for the Early access. There is 5 tier.  its a bunch of cosmetics, hideout, pets and armors sets themed around every Act in the game.</p>
</label>
    </div>
  </label>
  
</div>

    
      
<div class="commentAndChildren">
  <input id="o16p9o5" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>South-Answer5724</div>
        <div>1 | 26 minutes ago </div>
      </div>
      <label for="o16p9o5" class="commentText"><p>That’s how Poe does their packs. Each pack has multiple tiers to it, each giving their own cosmetics and accessories. This is like the 5th tier. So it’s 480 for 5 gear sets, weapon sets, effects, pets, hideouts/ hideout accessories, and that much in in game currency aswell to then go and buy other cosmetics that are in the shop.</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="o16o7rk" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>tooncake</div>
        <div>1 | 33 minutes ago </div>
      </div>
      <label for="o16o7rk" class="commentText"><p>The Upgrade is supposed to give you the said highlighted items on that tier pack, since you&rsquo;ve already purchased the previous, lower tiers with their respective items.</p>

<p>The FULL price option (480) is if you want a duplicate copy of all the said items for that tier (ie: you already have upgraded but wanted another deliverance weapon skins, and so on on that tier)</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
