      <label for="o261522" class="commentText"><p>You don&rsquo;t really have a snake. I suggest watching more content if you&rsquo;re serious about building one.</p>

<p>2 issues that I see :</p>

<ul>
<li><p>the road connected on top of your snake, + the road going from the middle. Luckily, these should destabilize quickly.</p></li>

<li><p>main issue here : on the left side you have 4 rooms connected as a square, which means any of these 4 could destabilize, including the room between the 2 spymasters.</p></li>
</ul>

<p>I see you have a lot of locks, so you should lock the spymaster on the top left, and the room right under to be sure.</p>

<p>If you have a single line, rooms cannot deatabilize if that would break the line. So you only need to lock the last room of your line, and save locks for the future, cause you may run out, especially when you start building.</p>
