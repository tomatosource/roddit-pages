

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://v.redd.it/doqk1d0tfiwf1"><p>SSF Artillery Ballista/Fortifying Cry Warbringer HC viable</p>
</a>
    </h2>

    

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="nknbvp1" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Bacon-muffin</div>
        <div>2 | 4 hours ago </div>
      </div>
      <label for="nknbvp1" class="commentText"><p>Random question, do you happen to know what all affects the heavy stun bar for when you&rsquo;re holding down resonating shield?</p>

<p>I notice on some warrior builds it barely ever goes up, but I tried playing it on a witch that had like half as much health and the bar almost instantly fills up. Afaik the only thing that affects it is max hp and stun threshold but even if I took the nodes that give ES stun threshold or make it based on ES it seems to do nothing for how fast it builds up.</p>

<p>Basically killed using resonating shield for me and doing a shield build because you have to be constantly staring at your heavy stun bar and sometimes that didn&rsquo;t even matter because it&rsquo;d fill up instantly.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="nkndmi9" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>wizardbison</div>
        <div>1 | 4 hours ago </div>
      </div>
      <label for="nkndmi9" class="commentText"><p>yea it&rsquo;s based on your stun threshold Afik, it takes a lot to stun me, I have a few boosts from the passive tree (ignore pain) and the act 3 reward boosting my %stun threshold and only 200 flat from gear. I believe it&rsquo;s a mix of my armor mitigating phys hits, my health pool and the %stun threshold bonuses</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="nknem7y" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Bacon-muffin</div>
        <div>2 | 4 hours ago </div>
      </div>
      <label for="nknem7y" class="commentText"><p>Yeah its so odd cause you&rsquo;d think it being based on 30% of your ES when you have more than double the ES as you have life here would make a dent in how fast it fills up. I wonder if armor is just playing a massive role or if its another bugged mechanic when it comes to shield skills since they seem to have a lot and it just doesn&rsquo;t take ES stun threshold into consideration or something.</p>

<p>I&rsquo;m tellin ya even with a few jewels and a bunch of points in stun threshold based on ES stuff with a whole lot of ES it would still fill up instantly from a light breeze it was crazy. I was trying to figure out ways to turn off blocking since I didn&rsquo;t actually need the block just to make that mechanic go away but unfortunately there&rsquo;s only the one shield and it doesnt work well if you care about resonating shields damage which I did.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="nknhpl5" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>wizardbison</div>
        <div>1 | 4 hours ago </div>
      </div>
      <label for="nknhpl5" class="commentText"><p>well, if you have 6k es then 30% would be about 2000 going towards stun, 50% would be 3000 and physical melee hits have the highest stun multiplier, I have 3k+ life here 115% increased stun threshold total with about 20-30k armor</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

  </body>
</html>
