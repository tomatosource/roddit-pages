

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://www.reddit.com/r/PathOfExile2/comments/1olq51n/what_do_i_do_with_the_monster_drops/"><p>What do I do with the monster drops?</p>
</a>
    </h2>

    
    <div class="selfPostContainer">
      <p>I&rsquo;m starting fresh today as a completely new player, and I&rsquo;ve never played the first part.Where do I sell the Monster Drops? As far as I know, you can &ldquo;sell&rdquo; them to several people, but I think some give more and others less.</p>

    </div>
    

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="nmnyebg" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>RigorousMortality</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="nmnyebg" class="commentText"><p>Basically all items dropped sell to NPC&rsquo;s for the same price. There are some exceptions but you won&rsquo;t see them likely until at least the interlude chapters(after act 4).</p>

<p>You shouldn&rsquo;t be picking up all or even most of the items, even if short on gold. Rare items you should pick up as they are worth more than magic or normal rarity items. Pick up items you think might be useful to you if they are magic or rare. Don&rsquo;t pick up white items unless you are getting into crafting, gamble on items if your gear is falling behind during campaign as crafting is more of a late game/end game venture.</p>

<p>Pick up new flasks for your level, even if normal quality, as the exception.</p>

<p>Pick up any uniques for trade, either with others or your other characters(or if you just like to collect them).</p>

<p>Pick up any and all currency, at some point you can stop picking up scrolls of wisdom but having them to quick identify is helpful. Everything else has value that doesn&rsquo;t diminish.</p>

<p>Gold shouldn&rsquo;t be so a limiting factor. You shouldn&rsquo;t be running back to town often during the campaign to sell stuff, it&rsquo;ll just slow you down. The campaign is already pretty long, but higher level items sell for more so wasting time to sell low level items huets more than helps.</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
