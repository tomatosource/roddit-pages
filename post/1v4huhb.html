      </div>
      <label for="ozb1pw9" class="commentText"><p>If you&rsquo;re comfortably clearing content for now, I&rsquo;d just accrue currency until you hit a wall.</p>

<p>Looking at your gear, the biggest upgrades would be:
1: Rings. Cast speed is doing nothing for your build. I&rsquo;d swap these out immediately for rings with more Resistances and flat damage.</p>

<p>2: Amulet. +3 to melee skills and %Increased Evasion/Maximum Energy shield would be massive here. If you upgrade this after rings, you might not even need the resistances on it and could get Global Defenses or Crit Chance/Crit Damage bonus as well. Make sure to instill it with a relevant annoint. If you&rsquo;re following the build guide still, I&rsquo;d refer to it for this part.</p>

<p>3: A better Heart of the Well would be good. The Gain as damage is nice, but the +1 max Ele resistances aren&rsquo;t doing much. I&rsquo;d look for Rage on hit and the either % Increased Crit Chance/Damage bonus.</p>

<p>4: Helmet: Getting one with a higher % Increased Crit Chance would be good. Aim for 25% minimum, the more the better.</p>
</label>

      <label for="ozb1rny" class="commentText"><p>In terms of clearing the content required to get <sup>8</sup>&frasl;<sub>8</sub> challenges. I am pretty sure your current character should be fine. You may need to play some of the boss mechanics but you should be able to take them down.
Regarding upgrades for your character. Your weapon is pretty bad. Yes it has + level to melee skills but it has low DPS and no crit suffix. I would look for at least 600 DPS quarter staff with a crit chance suffix - + to melee skills or + attack skills will suffice. Critical damage bonus on the quarterstaff is also really valuable but  might be out of budget.
Both of your rings have dead suffixes - %increased cast speed is doing absolutely nothing for you. You also have some life affixes on your gear while you are running CI.
At the point of progression that your character is at your boots should never have less than 30% movement speed (35% ideally) unless you are moving with an attack skill or blinking all over the place.</p>

<p>Hope this helps!</p>

      <label for="ozb26kl" class="commentText"><p>You need much better prefixes on your staff. Try this search: <a href="https://www.pathofexile.com/trade2/search/poe2/Runes%20of%20Aldur/8rKwEzYGFV" target="_blank">link</a>. Then slam a Perfect Essence of Battle to hopefully not hit the crit bonus (2 in 3). This is a mega budget improvement.</p>

<p>Anoint your amulet.</p>

<p>Otherwise, would suggest a cheap Morior body (1-2 div: <a href="https://www.pathofexile.com/trade2/search/poe2/Runes%20of%20Aldur/JBGk7ORRIl" target="_blank">link</a>) with elemental resistance + spirit and get more deflect nodes on tree to make up for that.</p>

      <label for="ozb3zs5" class="commentText"><p>Yes, it gives you a notable on your amulet. Generally you should pick one that is not one you can easily path to. There are plenty of cheap temporary ones. Best to do your own research on that, you&rsquo;ll need to do the delirium quest to access this anyway.</p>
