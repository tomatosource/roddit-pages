      <label for="o4ksbcv" class="commentText"><p>I thought this was going to be a &ldquo;LOOK AT ME!&rdquo; post, but there are some glaring issues with your spec.</p>

<p>Your sockets on doedre&rsquo;s undoing: Lifetap is completely useless, as almost all of your mana costs are already converted to life. You can actually use a +1 Mastery gem here.</p>

<p>You all also missing Impending Doom and Zone of control, if you are Doedre&rsquo;s. I really have to assume you are not, yet it is socketed. Huxotl&rsquo;s Elimination might serve you better.</p>

<p>I&rsquo;m not sure you have the required 4.9 radius on Doedre&rsquo;s. You may. I see the stat is present on Grip of Kulemak, which I have never seen used before. Seems to work.</p>

<p>If you are indeed Doedre&rsquo;s, why are you using Concentrated Area instead of Rising Tempest? Curse of Elements, being fire/cold/lightning, gives you all three stacks for 36% more damage and no area damage penalty.</p>

<p>your regalia is kinda a write-off.</p>

<p>You have both turn the clock forward and turn the clock back. That&rsquo;s just silly. 5 points for 30% spell damage, considering you can spend 4 points for 70%.</p>

<p>You have Eldritch Battery and Soul Tether, which renders Soul Tether absolutely useless. Switch to HH or something.</p>

<p>You have Dream Catcher with no ES, so it doesn&rsquo;t trigger. Full ES is not the same as 0 ES.</p>

<p>you have Chakra of Elements, but no physical damage. Did you have Bloodletting at some point?</p>

<p>You have two points into Improved Archon, with no way of achieving Archon.</p>

<p>Basically, you have an absolutely ton of wasted skill points and conflicting build choices, but amazing gear.</p>
</label>
