       * {

  box-sizing: border-box;

html {

body {
  display: flex;

input[type="checkbox"] {

.post {

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;

.commentList {
  border-left: none;

  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    <h2>
      <a class="postTitle" href="https://v.redd.it/x7tn6owkiaeh1"><p>Hexblast blood mage mapping showcase</p>
</a>
    </h2>

    

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="oylh4hk" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>jossief1</div>
        <div>3 | 10 hours ago </div>
      </div>
      <label for="oylh4hk" class="commentText"><p>They do need some love, including Hexblast. Having a +7 chaos skills staff for instance means you have a whopping 5 or so skills you can use &ndash; though Blackflame Covenant Detonate Dead is still great because +levels don&rsquo;t make it much stronger.</p>

<p>Have you tried doing Impending Doom instead? You can use Legacy of Cursecarver and optionally a cultivated Vertex to get tons of +levels. You use spell cascade with cursed ground to make the middle curse expire instantly with zero investment in reduced duration, so you can stack cast speed as much as you like. I guess you could use Doedre&rsquo;s for the cursed ground so that the two surviving curses will also damage enemies.</p>

<p>I ultimately gave up on my Hexblast Gemling, although it was pretty effective, because it felt slow only being able to get damage in one area every 0.8 seconds or so. If cast speed was too high, Hexblast would just miss entirely due to the remaining curse duration.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="oylj91r" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>rolling_glacier [OP]</div>
        <div>3 | 9 hours ago </div>
      </div>
      <label for="oylj91r" class="commentText"><p>I never used vertex because I was so determined to make hexblast work lol. This is the first build I&rsquo;ve played that took actually practice to get good at. There is a rythym to hexblasting after every curse and it took a bit to feel like I got the timing down.</p>

<p>But yea it also sucks that the other chaos spells dont even work with crit so my chaos spell skill wand with crit chance is worthless for any other build that isnt using hexblast or impending doom.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="oym2pym" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>jossief1</div>
        <div>1 | 7 hours ago </div>
      </div>
      <label for="oym2pym" class="commentText"><p>I see you also have enough cast speed to run Compressed Duration in Despair, which would definitely feel better than my build that had 0.9s Despair duration. A bit less margin for error but on Blood Mage the backup plan of Impending Doom is still great with 15% base crit.</p>

<p>If you want to stick with Hexblast, CoC Blackflame Detonate Dead is pretty nice since it gives more AoE and different timing of damage going off. Does nothing on most bosses obviously, though it melts bosses that spawn in ritual etc.</p>

<p>I believe Concentrated Area also reduces the &ldquo;target seeking radius&rdquo; of Hexblast, You might consider Vorana&rsquo;s Siege instead.</p>

<p>Khatal&rsquo;s Rejuvenation in Life Remnants would reduce the cooldown on Time of Need and whatever else.</p>
</label>
