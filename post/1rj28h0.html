

<html>

    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>

    <h2>
      <a class="postTitle" href="https://i.redd.it/ezpbo978momg1.jpeg"><p>Am I doing okay with this vaal dungeon layout?</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/ezpbo978momg1.jpeg" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="o8aiswb" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Ill-Mix2748</div>
        <div>1 | 3 hours ago </div>
      </div>
      <label for="o8aiswb" class="commentText"><p>What the stats you gets from that layout? Is there any reason you choose Russian tech for some spymasters and not for others? What is the monster effectiveness, increase rarity and increase in rare / magic monster? I would caution against having 3 chains as most of the time I only get 2 locks per run, sometimes 3 but it’s not as common. I have a fubgun layout, fully min-maxed. Sometimes I don’t get locks, or I only get 1.</p>

<p>I just feel you’re going to have one of your chains destabilise very often and that is going to consume the efficiency of farming your temple, regardless of whether you have 13 spymasters.</p>

<p>You can try it but I promise you, you’re giving RNG a good opportunity to screw you over. I would recommend two chains only sir.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="o8ansi1" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>SlowTortuga</div>
        <div>1 | 3 hours ago </div>
      </div>
      <label for="o8ansi1" class="commentText"><p>This is great advice. I will stick to only two chains. As for why limited russian tech, it is because I get limited time to play so I can’t spend that extra time doing it more. It has taken me like 10 days to get to the marked spymaster on the picture.</p>

<p>As for the stats on the temple, I don’t know because I don’t know how to get the room to fully upgrade on Sulo. Plus I am not sure I will be able to fully upgrade the alchemy labs and corruption chambers. That is because I lack the skill to do it yet. Plus I fear it is going to take more time. I guess I am doing this whole thing just so I can get some experience under my belt.</p>
</label>
    </div>
  </label>
  
</div>

</div>

        <div>1 | 2 hours ago </div>
      </div>
      <label for="o8aye51" class="commentText"><p>I would try and work out something else, your 1st snake you&rsquo;re building is fine but you will struggle to keep a 2nd and 3rd snake locked. Also on your 2nd snake on the left you have a spy master after a commander has been put in the chain, you can&rsquo;t do that.</p>

<p>Try and start off a 2nd snake with golems and then add commanders.</p>
</label>
