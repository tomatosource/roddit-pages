}

.postLink:visited {

.postHeader {

  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;

}

.commentList {

  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {

}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {

}

.selfPostImage {

  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

      <div class="commentHeader">

      </div>
      <label for="nm9cqex" class="commentText"><ol>
<li><p>Citadels always spawn in groups of 3. If you have seen Stone/Copper, then I guarantee you there is an Iron around somewhere near those. Spread out and look.</p></li>

<li><p>Cap your Cold resist. At T16 its also often recommended to over cap your resists by another 30% because of the next advice.</p></li>

<li><p>Avoid waystones that let monsters penetrate your resist. Avoid the mod that lowers your max resist. Avoid the elemental weakness curse. Following this advice will increase the likelihood of beating the Count.</p></li>

<li><p>Maybe get more movespeed. Boots should be at least 30-35%. You can get 50% MS boots (30% from mod, 10% from runes, and then another 10% using the 100% effect of socketed runes) that can be crafted. It might be easier to buy these though. Having more movespeed is pretty strong defense.</p></li>
</ol>

<p>Without seeing your gear or tree I also can&rsquo;t tell a whole lot. I also only know some support gems by sight. One easy thing that can help boost damage is picking up Penetration for the element you use (or just generic &ldquo;Ele Penetration&rdquo;). I believe all of the bosses at end game come with like 60 to 70% resist to all elemental damage; so getting penetration to at least negate that will bring a huge jump in your damage. Getting pen from the tree is usually a bit more impactful than getting small damage clusters (like +10% increased attack/lightning damage&rdquo;).</p>

<p>One other general rule I&rsquo;ve learned to follow in POE is to never split your damage across element types unless you really know what your doing. You can usually only pick up/supplement damage for 1 maybe 2 ele types in a build via your tree. If you are trying to do all 3 then you might be handicapping yourself.</p>

<p>Also +gem levels (ex: +4 to projective skills), are [unfortunately] really strong as you stack more levels on.</p>
