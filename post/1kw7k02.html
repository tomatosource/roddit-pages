  color: wheat;

}

.postLink:visited {
  color: #806a42;

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;

.commentList {

  flex-direction: column;

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {

  width: 100%;

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

      <label for="muf3wtr" class="commentText"><p>Hello everybody and welcome to the Gembillionaire. Have you ever wanted to be a human dragon hoarding wealth on the back of other peoples labor? Do you want to disgust the masses to death with your mere presence? Then this build is for you.</p>

<p>Here is the PoE 2 Ninja for the build, you&rsquo;ll have to forgive the name the character was originally supposed to be a meme about attacking as slow as the game would let me. Budget for the build is ~25 div, not the most expensive but not a league starter. <a href="https://poe2.ninja/profile/character/1dwwdb31zey7/KriegMorgan-9919/ImALittleSlow" target="_blank">https://poe2.ninja/profile/character/1dwwdb31zey7/KriegMorgan-9919/ImALittleSlow</a></p>

<p>Despite what the video says I did end up making a weapon swap setup to make the mapping more efficient with the DPS hammers. If you decide go strength to level use a passive tree similar to what I have in weapon slot 1, you play like a generic leap/rolling slam warrior until you get AoE support. I noticed things dying to Wind Dancer before I hit the ground with leap slam sometime in cruel difficulty.</p>

<p>At it&rsquo;s core the Gembillionaire build is about exploiting the level scaling that Wind Dancer gets while pairing it with some of the hardest hitting weapons in the game, two-handed maces. This is enabled by the fact that the Gemling Legionnaire ascendency allows for the highest attribute to satisfy the requirements of skill gems. Unlike normal, the only dexterity this build needs to run Wind Dancer is the amount needed to wear gear.</p>

<p>The build utilizes wind dancer + poison and bleeding support gems to clear trash automatically. When the dirty masses touch your beautiful skin they are repelled back and eliminated by sheer force of aura. There is a tech with armour explosion, corrosion and envenom that can chain clear off the screen if a good wave hits. Thanks to u/Kalltorak-CG for going public with that.</p>

<p>For bosses and tougher mobs you summon your personal goon squad of Ancestral Warrior Totems to come out and smack the dirty masses back. With the setup I have this is capable of doing 1+ million DPS.</p>

<p>Speaking of the poors, like a good billionaire everyone that is not you is a low life in your presence because of the blinders of wea&hellip; I mean deepest tower helmet. Combined with passive tree support to dunk on low life enemies you have a combination to use your wealth and power to oppress any who get in your way!</p>

<p>Build has been limit tested and destroys T4 Xesht and T4 Mist Man. Haven&rsquo;t even fought Olroth once and I don&rsquo;t have the currency to do Arbiter runs. You can see what it does to Xesht though and extrapolate from there.</p>

<p>Thank you for your time and a quick shout-out to u/Kalltorak-CG who took my Wind Dancer research and got a video out first but in the process clued me into some nice tech with the attrition swap for bosses. He also posted the juicy tech with armour explosion that will likely get patched but it makes the clear very crisp.  Ultimately our builds differ but if you want to run a Titan Wind Dancer build, make sure you check out his work.</p>

<p>Shameless self plug for my twitch goes here: www.twitch.tv/morganururu</p>

<p>I&rsquo;m usually doing some sort of meme build crafting or another. Video version of the Thunderfarter build coming soon</p>
