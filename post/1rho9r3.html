

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/1zjzg71d6dmg1.jpeg"><p>Is it Safe to Kill the Architect?</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/1zjzg71d6dmg1.jpeg" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="o8067of" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>LowPomegranate225</div>
        <div>1 | 35 minutes ago </div>
      </div>
      <label for="o8067of" class="commentText"><p>Just wondering how long did it take you to set this up? I been running my ruins for a while now and have only gotten 2 spy masters so far. Is it all just rng luck?</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="o808qoy" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Diodon</div>
        <div>1 | 16 minutes ago </div>
      </div>
      <label for="o808qoy" class="commentText"><p>Hmm, hard to say at this point.  Each 10 runs (60 crystals) probably netted me a few rooms at a time.  Occasionally I&rsquo;d get lucky and have the chance to lay down more at once.  Starting out it was indeed not pleasant to keep locks up.  I went in with a pile of locks and had a bunch of throwaway rooms in the middle to reduce likelihood that the rooms I wanted would be lost.  I don&rsquo;t think I even locked anything till I had a spymaster down.  From there I had to rely on luck and turning that first corner was the hardest part.  From there I&rsquo;ve had plenty of locks - so far.  RNG being what it is, there&rsquo;s no way to guarantee my locks will always sustain.</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="o806b15" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Wasatcher</div>
        <div>1 | 35 minutes ago </div>
      </div>
      <label for="o806b15" class="commentText"><p>He&rsquo;s in the perfect spot right now and with those tiles occupied so close to him he&rsquo;ll fuck off to the left or right. I&rsquo;d just leave him alone if I were you and kill it on another character.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="o809r7h" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Diodon</div>
        <div>1 | 9 minutes ago </div>
      </div>
      <label for="o809r7h" class="commentText"><p>So the game will allow an island to be created in this scenario? Note that the garrison to his northwest would become detached if he moved.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="o80a1wh" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Wasatcher</div>
        <div>1 | 6 minutes ago </div>
      </div>
      <label for="o80a1wh" class="commentText"><p>I can&rsquo;t say for sure but you can lock it and find out. Then bang your head against the wall trying to center him again. You got really lucky moving him there first try even with the corral. Sometimes he just fucks off outside the corral.</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

    
  </div>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="o807aln" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>RobertoVerge</div>
        <div>1 | 27 minutes ago </div>
      </div>
      <label for="o807aln" class="commentText"><p>Hes actually in the perfect position which can take 50 temples to get if unlucky.</p>

<p>I wouldn&rsquo;t touch him.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="o80896h" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Diodon</div>
        <div>1 | 20 minutes ago </div>
      </div>
      <label for="o80896h" class="commentText"><p>Well, I corralled him in there earlier by building throwaway rooms to stack the odds in my favor.  Once I did that he moved there on the first try.</p>

<p>What I&rsquo;m trying to figure out is that if I apply the steps I described, I don&rsquo;t think the game can legally move him without creating an island.  If that is true, then I should be able to kill him and be able to attempt Atziri.</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

        
      
    </div>
  </body>
</html>
