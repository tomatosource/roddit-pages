<div class="commentAndChildren">

    <div class="comment">
      <div class="commentHeader">

        <div>1 | 4 hours ago </div>
      </div>
      <label for="o10sodp" class="commentText"><p>Irongrasp Armour +Crown of Eyes + Staggering Palm + either Flicker or Whirling Assault (possibly both) + (optional 3-4 socketed Pillar with flat damage if you&rsquo;re really committed to the bit) + Heroic Tragedy (Vorana) for ES, which you&rsquo;re gonna need every last bit of, since our body armour and helmet are both trashy stat-wise. Get as much flat damage from the rings as you can if you go the pillar route.</p>

<p>Stack strength, stack stun buildup, stack power charges in whatever ways your heart wants to, watch funny air bullets tossing mobs around, as you sommersault through to get everything ready for a big flicker. Wind blast - or whatever it&rsquo;s called - it a good setup skill for triggering Staggering Palm.</p>

<p>You&rsquo;re gonna need four buttons at the minimum, possibly more if you aren&rsquo;t lazy about the whole power charge thing. You&rsquo;re also gonna have quite a bit of spell damage from the hat, so you can do something with that, too (like invoking phys spells with Ritual Cadence, for example).</p>

<p>The best ascendancy for that sort of tomfoolery is probably Oracle (that&rsquo;s what I did, anyway), because he has an Unseen Path node that boosts our strength scaling even further and free crits are always helpful in a bunch of ways.</p>

<p>Incidentally, this setup is really powerful for Falling Thunder too, but it&rsquo;s supremely lazy and you&rsquo;ll have to replace some passives for your weapon set 2</p>
</label>

  </label>

      </div>
      <label for="o11121f" class="commentText"><p>Right now I&rsquo;m doing Thunderstorm, Frost Bomb, Orb of Storms, Contagion, Essence Drain, Vulnerability, Profane Ritual, Summon Zombie, each as buttons and then 2 Spectres and 3 Skeletons.  My spectres are Blackblood Elites, so they&rsquo;re throwing cold projectiles.  That ties in very nicely with Thunderstorm which drenches enemies.</p>

<p>I only just hit level 50 last night so I&rsquo;m mostly messing around and having fun.  I don&rsquo;t care about clear speeds.  It&rsquo;s fun against hordes of enemies.</p>

<p>Any enemies that don&rsquo;t shatter are used as corpse fuel for the ritual and spawn empowered zombies.</p>

<p>Very satisfying when the enemy I hit with Contagion goes down and it jumps, and just sets off a wave of enemies freezing and shattering and getting hit with increasing chaos DoT</p>
