

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>

	<div class="selfPostContainer">

<p>edit: its phys explode</p>

<div class="commentAndChildren">
  <input id="na9adpk" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Icaros083</div>
        <div>1 | 21 minutes ago </div>
      </div>
      <label for="na9adpk" class="commentText"><p>I tried Sundering in 0.2 with a Trinity LS /Storm Lance. Even while freezing,shocking,igniting bosses consistently, the damage on Sundering was very inconsistent. I&rsquo;m not sure what was going on but sometimes it would delete half their health, sometimes it would do less than a basic Attack. I was using all the strong supports on it, like Elemental Focus And rising tempest (it counts as all 3).</p>

<p>There&rsquo;s also 3 animation delays on the skill. Animation for stabbing the ground, animation of the effect spreading, then another animation of &ldquo;consuming&rdquo; the elements. In true PoE2 fashion, all of that takes somewhere between 1-2 full seconds which sometimes means your ailments expire between pressing the button and the skill going off.</p>

<p>Maybe it&rsquo;s fixed, maybe your version is better, maybe I missed something obvious. But if you actually plan on building around it, I&rsquo;d recommend logging in to try the skill first.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="na9dj2d" type="checkbox" checked/>

      <div class="commentHeader">
        <div>levyb</div>
        <div>1 | 4 minutes ago </div>
      </div>
      <label for="na9dj2d" class="commentText"><p>Default ailment duration is much longer in 0.3, which should help fix that clunkiness at least.</p>
</label>
    </div>
  </label>
  
</div>

  <input id="na9asr4" type="checkbox" checked/>

      <div class="commentHeader">
        <div>investorcaptain</div>
        <div>1 | 19 minutes ago </div>
      </div>
      <label for="na9asr4" class="commentText"><p>Realistically you’d just have this on a weapon swap to one shot a boss, and you’d have a better skill for clearing.</p>

</div>

  </body>
</html>
