

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/7ydmzy6ldb1f1.png"><p>Crafting Help - What should I do with this</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/7ydmzy6ldb1f1.png" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="msrqfu2" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Fine_Act47</div>
        <div>1 | 3 hours ago </div>
      </div>
      <label for="msrqfu2" class="commentText"><p>I wouldn&rsquo;t worry too much, just slam it. Only a lvl65 item anyways ;)</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="msrq8wu" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Decadent88</div>
        <div>1 | 3 hours ago </div>
      </div>
      <label for="msrq8wu" class="commentText"><p>From my limited knowledge it&rsquo;s slam and pray.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="msrr870" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>xcaliblur2</div>
        <div>1 | 3 hours ago </div>
      </div>
      <label for="msrr870" class="commentText"><p>It&rsquo;s already rare quality . Crafting at this stage involves a combination of slamming exalts, praying, using omen of whittling, praying and did I mention that a lot of praying is involved?</p>

<p>There&rsquo;s also omens that can make it so that your orb of annulment will only remove prefixes or only suffixes. But it&rsquo;s too big a gamba given that you now have 1 prefix and 2 suffixes that you don&rsquo;t want to lose.</p>

<p>If you don&rsquo;t want to RNG craft, one option is to use one exalt, and then use a fractured orb to lock in and hopefully retain one of the juicy affixes before you sell</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="msrsu4g" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Electric4ce</div>
        <div>0 | 3 hours ago </div>
      </div>
      <label for="msrsu4g" class="commentText"><p>Ex and recombob if shit, you have atleast 2 chances</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="msrwhfy" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>_Augie</div>
        <div>1 | 2 hours ago </div>
      </div>
      <label for="msrwhfy" class="commentText"><p>Just pray for 3rd res at a minimum</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="msrzf3h" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>velkhar</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="msrzf3h" class="commentText"><p>That base, despite being level 84, isn’t worth the currency investment to craft it. You want the +5% movement base. Also the higher Evasion and Energy Shield base values. Crafting in PoE2 costs tens to hundreds of divines. People with that kind of wealth will want the best base.</p>

<p>Is that the top tier prefix? If so, and you really want to invest the currency, you’d slam again so you can Fracture and pray to hit the top tier prefix. Then use a combination of annuls/omens and chaos/whittles to land the perfect affixes.</p>

<p>Slam it 3 more times and pray for high tier flat Evasion/ES and hybrid Eva/ES/Life prefixes.</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
