      <label for="nawil7k" class="commentText"><p>I mean yeah, but you have ways to lower the number of buttons as you upgrade.</p>

<p>All damage shocks gets rid of lightning spells, weapon swap firestorm fireball for big ignite and clear with solar orb as well for snaps. Then you can go cold staff for far clear with comet on freeze and preparing infusions.</p>

<p>Then you get rakiata support and no longer you need any exposure or curses for DPS.</p>

<p>The bigger question is what to replace them with and wtf is on the tree to scale.</p>

<p>At the end especially with multiple supports i believe i can go to this rotation:
Gelid staff juiced up for default attack with arcane tempo glaciation chain etc for across map clear as it procs comets.
Weapon swap into solar orb firestorm for packs with rares or blues or area mechanics like expedition, abyss once you collect infusions.
And maybe fireball for boss DMG which i don&rsquo;t think will be necessary until pinnacles.</p>

<p>So that&rsquo;s 4 buttons counting the swap.</p>

<p>If aoe gems and tree isn&rsquo;t hard to get maybe even switch to far casting nova and snaps for clear then you can use that with solar orb on the swap as well.</p>

<p>I believe sw will be insane especially if the tree is interesting. I just hope i don&rsquo;t gamble too much so i can respec constantly to try stuff.</p>

<p>Spirit is gonna be weird but we can solve that with amulet.</p>

<p>Overall it just means we have a lot of things to try and probably everything will work to some degree.</p>

<p>If not maybe i roll infernalist with the doggo to do some shenanigans with snap. Or even just go Chrono and do a collection run to reverse time then big firestorm and freeze when necessary.</p>

<p>Instant swap means we can also curse really easily so don&rsquo;t forget to use temp chains since it&rsquo;s buffed to the gills. Maybe even go despair for some black flame setup.</p>
</label>

    <div class="comment">

      <label for="nawk23k" class="commentText"><p>Lol, and i already figured out how to do 1 button press setup.</p>

<p>For generating infusions, casting firestorm, snapping&hellip;</p>

<p>Elemental Invocation: Snap. + new notable (automates snap)
Cast on Elemental Ailment: firestorm (new cast on being introduced) [automated firestorms]
Double shock from ascendancy + all elemental contributes to shock. (Ascendancy)
50% chance to gain an additional infusion of a different type when you pick up an infusion. (Ascendancy)</p>

<p>MANUAL cast a spell that has a chance to ignite and support it with a chance to shock, ensuring that it is a spell that doesn&rsquo;t consume lightning or cold infusions. Consuming fire infusion is fine. ☆I&rsquo;ll explain this further down.</p>

<p>Your manual casted spell ignites and shocks generating energy for both your invocation AND your cast on. When enough energy is generated, you automatically cast both snap and Firestorm.</p>

<p>Snaps consume ailments on enemies to cause explosions and generate infusions. Your ascendancy helps keep you stocked with cold infusions. (As you&rsquo;re not generating these naturally). Firestorm consumes your cold+lightning to generate additional projectiles in the respective element. Firestorm cant ignite, BUT theoretically, it should be able to shock. (Its probably safe to assume that the lightning bolts cant shock but can ignite) Neither snap NOR firestorm can generate energy for your cast on or Invocation. BUT IF (big if depending on previous parenthesis) if firestorm can inflict shock/ignite respectively using the different infusions. Then your automated snaps should provide additional damage in the form of chaining explosions.</p>

<p>☆ why we dont care about fire infusions being consumed by firestorm.</p>

<p>Fire Infusion doubles the base radius and triples the total number of projectiles. Each projectile has an impact radius of 1m. The base radius of firestorm has been changed to 2.6. Which means youll get more overlaps by NOT doubling the radius. You&rsquo;re clear should be fine since Snap is providing a supplementary explosion that also chains.</p>

<p>In summary:</p>

<p>You only have 1 button press while still gaining all the infusions.</p>
</label>
