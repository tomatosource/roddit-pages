

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/bed4pnqj9ddg1.png"><p>How to craft from here? I&rsquo;m playing an Ice Werewolf Druid in the endgame.</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/bed4pnqj9ddg1.png" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="nzli3zd" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>M8J8-Atremic</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="nzli3zd" class="commentText"><p>I had the exact same start but on a desolate xbow.</p>

<ol>
<li>I double prefix slammed perfect exalts (to randomly try to hit god mods)</li>
<li>Missed ex slams (expected) so i double prefix crystallisation slammed perf haste and battle to fill suffixes with +5 atk and onslaught</li>
<li>Focus on prefixes with:
3.1 perfect exalt slam - if miss continue
3.2 prefix crystall with essence of abyss
3.3 echo and unveil
3.4 if miss t1 phys, pick any
3.5 omen of light off the desecration and repeat from 3.1 until you hit a desired desecration / perf exalt slam</li>
</ol>

<p>If you hit a good random perf exalt slam, just desecrate + light until you hit what you want.</p>

<p>For me, I hit t1 +lightning (playing galv shards) so now I desecrate + light until i hit t1 phys. Might be a while</p>

<p>After that i’d either hinekora + sanc for +6 attack if you have the funds or just vaal infusor spam for high quality.</p>

<p>After you make the god item, vaal or no balls. Hope I could be of help!</p>

<p>Disclaimer: there might be a cheaper way to craft this but i’m unaware of any. Also afaik, talismans don’t want +7 melee because calamity is not a melee attack&hellip; But since you are wolf you might want it. If you need +7 melee the craft is completely different and MUCH more expensive.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nzlksga" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>BeginningEqual5533</div>
        <div>1 | 33 minutes ago </div>
      </div>
      <label for="nzlksga" class="commentText"><p>You have to fracture crit to be able to get good attack speed, so just make essence prefixes via exalting prefixes. Then desecrate prefix, reveal either T1 flat or T1 hybrid, if no - reveal accuracy to block it.</p>

<p>Perfect exalt prefix, if got T1 - redesecrate until third prefix is done, if failed - lucky annul without omens.</p>

<p>If annul it erases crit chance - chaos spam it again, weight is good and its cheaper than a single purple omen in average. Repeat.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="nzlpl6q" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>ArcBlamer</div>
        <div>1 | 11 minutes ago </div>
      </div>
      <label for="nzlpl6q" class="commentText"><p>Stupid question, what do people mean by using accuracy to block it? Just need how this works explained to me and why accuracy</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="nzlqwke" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Woolyplayer</div>
        <div>1 | 5 minutes ago </div>
      </div>
      <label for="nzlqwke" class="commentText"><p>High weight so you&rsquo;ll get a better slam with it removed from the pool.</p>

<p>And since it&rsquo;s descecrated you can omen of light it.</p>
</label>
    </div>
  </label>
  
</div>

    
      
<div class="commentAndChildren">
  <input id="nzlr85l" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>BeginningEqual5533</div>
        <div>1 | 4 minutes ago </div>
      </div>
      <label for="nzlr85l" class="commentText"><p>Because accuracy is the only really useless prefix and if you desecrated it - exalt orb can&rsquo;t roll it again. Weight of useful affixes increases.</p>

<p>Desecration can (and should) be removed later deterministically by omen of light.</p>
</label>
    </div>
  </label>
  
</div>

</div>
