<div class="commentAndChildren">

      <div class="commentHeader">
        <div>Mileena_Sai</div>
        <div>2 | 6 hours ago </div>
      </div>
      <label for="o6umzg4" class="commentText"><p>Watch fubguns temple guide. Its a good start.</p>

<p>Your architect isnt even placed correctly and do you have 6 medallion slots unlocked ? Foolproof start is kill the architect over and over again until you get 6 medallion slots. After that you have to place the architect correctly before you start building anything. Watch <a href="https://youtu.be/H_r1w4lKCxg" target="_blank">fubgoons</a> video.</p>

<p>Temple isnt hard since there are many guides already. But its easy to fuck up. Learn the basic rules and especially that you are not allowed to create a loop with your main chain.</p>

<p>The temple will only destroy rooms from the end of the chain. Think of it like a branch: Only from the ends you will lose rooms if you have a one room width chain that is not looping. Looping means death and will fuck up your temple. You can loop chains which you dont care about but NOT your main chain.</p>

<p>Another advice: Some medallions are simply random rooms which you can place like regular rooms. However: THE GAME WONT SHOW YOU HOW THE ROOMS PLACED BY MEDALLIONS REALLY CONNECT LIKE THE WAY IT SHOWS WHEN YOU PLACE ROOMS THE NORMAL WAY FROM THE LEFT UI. This is important to know since you can fuck up your entire Temple later.</p>

<p>One more: Destroy Medallions which you dont need. <del>If your slots are full (<sup>6</sup>&frasl;<sub>6</sub>) then the medallions you pick up will simply disappear.</del> Most of them are useless. You only care about a handful of medallion types. Certain rooms have a chance (not 100%) to drop a single medallion from a fixed variety of medallion pool (Press alt and read what rooms do or drop or google). Edit: Its fixed.</p>

<p>And if you want to trim the temple you can start the run without placing any rooms (Press CTRL) and th,en leave &amp; close it. Architect &amp; Atziri kills destroy WAY more rooms. Killing the architect will reposition him randomly but he will always prefer spots where nothing is around him. Watch fubguns video or any guide.</p>
</label>
