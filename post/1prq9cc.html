

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://v.redd.it/mhzzauizmf8g1"><p>GunterBloodandThunder showcase</p>
</a>
    </h2>

    

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="nv3p5vf" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Dog-head</div>
        <div>1 | 12 minutes ago </div>
      </div>
      <label for="nv3p5vf" class="commentText"><p>This is my &ldquo;Blood and Thunder&rdquo; cast on melee hit Smith of Kitava.</p>

<p>Pros:</p>

<p>-low budget with high investment potential</p>

<p>-tanky</p>

<p>-fun, satisfying, looks cool</p>

<p>Cons:</p>

<p>-difficult to play</p>

<p>-not fast</p>

<p>-single target problems before you get legacy supports</p>

<p>-no visual clarity</p>

<p>-fries your GPU</p>

<p>This build is probably outclassed by shield wall titan but I&rsquo;ve had a ton of fun building and playing it anyway. It excels against mechanics with dense monster packs such as expedition or ritual, can easily kill juiced essences, and runs all map mods besides -max resist and elemental pen. I&rsquo;ve found that abyss is a bad idea as some of the rare mods are too oppressive for melee. I wouldn&rsquo;t recommend this build for beginners as it&rsquo;s difficult to set up and to play; there are a lot of buttons, you need to learn which attacks can be parried, and also be able to time perfect strike with no visual clarity.</p>

<p>Changes that made this a good idea in 0.4: ascendancy buffs, lightning coil buffs, constricting command nerfs (which excluded ranged builds and made the item cheaper for melee), new gems, old gem buffs, parry buffs.</p>

<p>Budget for starting t15 6-mod waystones was about 600 ex and it can come online quite early by using Vertex, Astramentis, or attribute-heavy rings to cover Mjolner&rsquo;s requirements. Tankiness is provided by Lightning Coil combined with 90% elemental resistances and some block and armor.</p>

<p>If enough people are interested I&rsquo;ll try making a guide video.</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
