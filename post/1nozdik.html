      <label for="nfvgsp2" class="commentText"><p>mapping idea came to me after accidentally running a map with chilled ground and temp chains<br>
pob: <a href="https://poe.ninja/poe2/pob/e3ef" target="_blank">https://poe.ninja/poe2/pob/e3ef</a></p>

<p>Also finally freed this build from undying hate t*crod and atalui&rsquo;s bloodletting, guide should come soon and should be quite easy to spec into. shameless plug here: <a href="https://www.youtube.com/@awesomegi0178" target="_blank">https://www.youtube.com/@awesomegi0178</a></p>

<p>a short explanation of bomba oneshot:</p>

<p>If you cast a spell with burden of shadows / atalui&rsquo;s bloodletting, it gains damage based on life spent on it. If the cost of the spell goes up later before it connects, it will deal damage as if it cost that new cost. Indigon also works similarly, if you gain spell damage from indigon after a spell has been cast, the spells already cast gets that spell damage as well. Indigon also has the side effect of increasing cost of skills, which allows for massive gain as damage ramp up with burden of shadows / atalui&rsquo;s bloodletting. This results in massive exponential damage gain on mana dumping after a spell is cast.</p>

<p>The exact rotation I am doing is this:</p>

<p>sigil -&amp;gt; time freeze -&amp;gt; 3x potions -&amp;gt; living bomb -&amp;gt; living bomb -&amp;gt; temporal rift -&amp;gt; frost bomb -&amp;gt; despair -&amp;gt; temporal rift -&amp;gt; snap</p>

<p>Mapping:</p>

<p>Doedre&rsquo;s undoing curse explosion. This is not a new concept there are other builds already doing it. These are the following tweaks for how I built it.<br>
-Rather than spam curses, I just want one clean explosion (this will always be lower dps than with spell cascade / echo / unleash but i really like the visual clarity)<br>
-I use archmage with embitter to give it 200% damage gained as cold, this allows for the shatters<br>
-Elemental weakness is the best curse to use since it does <sup>2</sup>&frasl;<sub>3</sub> ele damage<br>
-I use lifetap to prevent the archmage cost from decimating my mana costs with indigon<br>
-Instead of relying on t*crod for regen, I can just take eternal youth for life recharge and take ES recharge nodes on the tree. It&rsquo;s not like i need to spam this so a steady 300 life per sec with % life on kill is more than enough to sustain mapping</p>

<p>Mega slow aura:<br>
Also not a new concept for chronomancers but I realized I can push it farther with whispering ice.<br>
-Temp chains, apex of the moment with aura magnitude will already make enemies very slow<br>
-Whispering ice chill aura can additionally apply 50% chill because why not<br>
-The staff itself isn&rsquo;t amazing stat wise but in the context of an int stacking build that doesn&rsquo;t care about lvl to spell skills or crit, its actually not too bad.</p>
