

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://www.reddit.com/gallery/1ku44ym"><p>New to crafting how do I lower chances of ruining these.</p>
</a>
    </h2>

    

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="mtyq431" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>maxspeed301</div>
        <div>5 | 6 hours ago </div>
      </div>
      <label for="mtyq431" class="commentText"><p>They’re item lvl 72 and 73, so for the base they have really good rolls, but you can’t turn it into an amazing item since that would require a higher base lvl, crafting on it with omens isn’t worth it. I’d say just exalt slam the Honour Coat and call it a day!</p>

<p>If it lands something good, either use it, sell it, maybe even vaal it if it doesn’t go for more than you’re willing to risk!</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="mtyqcge" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Twosteppindepression</div>
        <div>2 | 6 hours ago </div>
      </div>
      <label for="mtyqcge" class="commentText"><p>I was wondering about this thanks. Running into a bit of a survivability wall in t10 so trying to get some better armor</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="mtz70uu" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>ThunderboltDragon</div>
        <div>1 | 4 hours ago </div>
      </div>
      <label for="mtz70uu" class="commentText"><p>Aim for something around 1k Eva/ES</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

    
  </div>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="mtza7pd" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>laeriel_c</div>
        <div>1 | 3 hours ago </div>
      </div>
      <label for="mtza7pd" class="commentText"><p>All you can really do is slam another exalt and hope for the best. For the ilvl the first one is really decent. Then quality socket and Vaal if you&rsquo;re feeling brave. The benefit of hitting good flat rather than % is if you get a 3rd socket it can still get very high EV/es. The second one might not be worth slamming because it&rsquo;s not a good base - you could try to recomb with a high flat and hope the base switches</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
