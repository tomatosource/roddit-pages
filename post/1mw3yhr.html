

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>

    <h2>
      <a class="postTitle" href="https://i.redd.it/uxcpee5xnbkf1.jpeg"><p>Best change this patch!</p>

<div class="commentAndChildren">
  <input id="n9uqd5t" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Spencer1K</div>
        <div>8 | 3 hours ago </div>
      </div>
      <label for="n9uqd5t" class="commentText"><p>How does this change harm scalpers? It helps them actually because now when someone posts an underpriced item, the scalpers with there live search will be able to tp in, buy the item, and the seller cant reprice it. Scalpers are about to make bank. This will 100% get botted eventually as well.</p>

<div class="commentAndChildren">

        <div>1 | 3 hours ago </div>
      </div>
      <label for="n9urmaz" class="commentText"><p>THANK YOU, that&rsquo;s what I was thinking about the whole time!! This is getting botted 100%</p>
</label>

<div class="commentAndChildren">
  <input id="n9uvch0" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>JannousGr</div>
        <div>1 | 2 hours ago </div>
      </div>
      <label for="n9uvch0" class="commentText"><p>I was thinking that maybe because the community will start use the new trading system more frequently new or clueless players might be able to price their items easily?</p>

<p>Instead now you got tons of price fixers and some time ppl getting confused about the price and getting scummed.</p>

<p>Am I getting this the wrong way?</p>
</label>

  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="n9uy2hn" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Spencer1K</div>
        <div>2 | an hour ago </div>
      </div>
      <label for="n9uy2hn" class="commentText"><p>you are overestimating a couple things.</p>

<p>First, the amount of price fixers that exist. Most &ldquo;price fixers&rdquo; people see are just people who price and dont sell the item because that person got spammed and realized the item needs to be repriced. There are price fixers and it is a big problem but its overestimated how many due to this situation. Although price fixing is an issue and will hopefully be reduced which would be a big positive.</p>

<p>Second, you overestimate the impact that price fixers have on new players ability to accurately price items and underestimate how useful being able to back out of a pricing has for a new player. New players have more trouble with the learning curve of what mods are valuable and what to look out for then anything having to do with price fixers. It might mildly affect it, but that gigantic learning curve will still exist, and now scalpers will have full rain to snipe everything since the new players wont be able to reprice something when spammed and learn from mistakes of misspriced items. Now the item will simple get instasold and they wont be any wiser, which will likely make it more difficult for new players to accurately find out WHEN they misspriced something, which could cause more items to get misspriced over time.</p>

<p>But that double edge sword of being able to back out of a price is also what causes so much negative friction in trade. It has pros and cons overall, but this is far from a negative thing for scalpers and soon to be botters alike. It might be overall more enjoyable which would make it a positive, but it will likely increase the amount of scalpers and make it more difficult for new players to learn when they made an error when pricing.</p>

<p>Also it seemed that GGG showed the ability to price things the old way or have the new instasell way? In which case, price fixers could still flood the trade site using the old method and just search for instasellers to buy from. Unsure of this will be the case though.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">

      <label for="n9uz6u3" class="commentText"><p>Very good points let&rsquo;s see how it will play out on the game with the actual new players, something that I dont agree with you 100% is the learning curve, it&rsquo;s poe 2 it&rsquo;s not that hard( I&rsquo;m not saying there isn&rsquo;t any learning curve, I&rsquo;m just saying that I believe it&rsquo;s not that hard to make players get lost )</p>
