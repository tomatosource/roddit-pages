

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://www.youtube.com/watch?v=PKfE-Vi7pAc"><p>Is group play dying ? - Empyrian Gaming</p>
</a>
    </h2>

    

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="nv8jqfw" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>MacGregor1337</div>
        <div>12 | 3 hours ago </div>
      </div>
      <label for="nv8jqfw" class="commentText"><p>Why is this being downvoted? They sound like they are having a blast playing the game.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="nv8qm7u" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Falling_Snake</div>
        <div>11 | an hour ago </div>
      </div>
      <label for="nv8qm7u" class="commentText"><p>bceause it doesnt feed in to the narrative that group play is 100x better and totally not about the same after splitting costs and being locked into the one thing they can farm together.</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nv8i5zr" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Zaorish9</div>
        <div>6 | 3 hours ago </div>
      </div>
      <label for="nv8i5zr" class="commentText"><p>I&rsquo;ve tried it in poe1 and 2 but the problem is the visual mess when rainbow explosions are covering the screen you can&rsquo;t see anything that might kill you</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="nv91xaj" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>romicide07</div>
        <div>1 | 29 minutes ago </div>
      </div>
      <label for="nv91xaj" class="commentText"><p>With proper group setup nothing should really be able to kill you. The main thing that kills it for me is a bunch of my buddies are across the pond and the lag for whoever isn’t the host is absolutely awful</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nv965v2" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>robintysken</div>
        <div>1 | 7 minutes ago </div>
      </div>
      <label for="nv965v2" class="commentText"><p>In a setting like PoE I don&rsquo;t really mind group play being more effective. The loot isn&rsquo;t personal after all and the value has to be split over everyone in the party.</p>

<p>I personally don&rsquo;t enjoy group play in PoE because I like to set and keep my own pace and also be able to pause the game when I want.</p>

<p>I remember group play in Diablo 3 though, where you HAD to play as a group to be competitive on leaderboards since everyone was farming paragon levels which provided infinite stat points for your character. This I had a problem with, because if I didn&rsquo;t do it I would literally have no chance to make my character as powerful as those who played in a group.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nv96lpn" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>tewmtoo</div>
        <div>1 | 5 minutes ago </div>
      </div>
      <label for="nv96lpn" class="commentText"><p>Casual group play is pretty rough. Player collision, significant increase in boss difficulty, and visual clutter being the main three pain points</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nv89xjm" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>PackRadiant5277</div>
        <div>-3 | 3 hours ago </div>
      </div>
      <label for="nv89xjm" class="commentText"><p>I guess people have their own ways of making things fun&hellip;  I never found group play to be fun because it takes away any sense of accomplishment in the game.</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
