

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://v.redd.it/qbx2t9ipbu1g1"><p>Where are the top 10 picks of 2017?</p>
</a>
    </h2>

    

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="npc3qwb" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>elarabellini | New York Yankees</div>
        <div>8 | 21 minutes ago </div>
      </div>
      <label for="npc3qwb" class="commentText"><p>It’s crazy how many top prospects just fade out over a few years. We really have no idea how to predict kids’ development Jesus.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="npc69i8" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Sosa_FPS</div>
        <div>1 | 9 minutes ago </div>
      </div>
      <label for="npc69i8" class="commentText"><p>One common thread amongst the players who faded out is injuries. I think it&rsquo;s something that fans take for a granted a lot of times is just how hard it is to be and stay healthy at the highest levels.</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

        
      
        
          
<div class="commentAndChildren">

      <div class="commentHeader">
        <div>OSRS-MLB | Los Angeles Dodgers</div>
        <div>2 | 15 minutes ago </div>
      </div>
      <label for="npc54nh" class="commentText"><p>Much better than 2016</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="npc6fy6" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>chief1555 | New York Mets</div>
        <div>2 | 8 minutes ago </div>
      </div>
      <label for="npc6fy6" class="commentText"><p>Good chance Brent Rooker ends up being the most valuable player in the entire class, depending on how Gore and Greene’s arms hold up</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="npc7sbe" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>nashdiesel | Los Angeles Angels</div>
        <div>1 | a minute ago </div>
      </div>
      <label for="npc7sbe" class="commentText"><p>If you told me 2 years ago that Adell would one of the better MLB performers on this list I wouldn’t believe you.</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
