*,

.commentText,

  color: wheat;

.commentHeader {

  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
}

.selfPostContainer * {

}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

      <label for="mfu41d3" class="commentText"><p>Passive tree is focused on increased skill effect duration, fire damage, increased AoE for sells (Blasphemy scales together), cast speed and curse effect/range. A few energy shield nodes here and there. Don&rsquo;t waste your time with ignite.</p>

<p>The ascendancy points go to slow enemies on presence, temporal rift skill, time freeze skill and cooldown reductions.</p>

<p>On gear you must have a very high block chance shield with an annointed amulet with increased block chance. It&rsquo;s non negotiable. Aim for 45%+ block chance (I&rsquo;m sitting at 49% with a 2div shield)</p>

<p>With this setup, melee enemies will be so slow that they won&rsquo;t be able to hit you before you kill them and the ranged enemies will also likely get slowed but if they manage to fire projectiles, you have almost 50% chance to block. You basically only have to worry about AoE damage but your high ES will get you covered.</p>

<p>Currently, enemies in range have 40% debuff from temporal chains and 23% from my ascendancy. So they have 63% slow debuff close to me. My next 4 passive tree upgrades will raise this even further.</p>

<p>I invested about 25div on this setup but I overpaid on the gear because I didn&rsquo;t want to bother farming XP when I finished the campaign so I needed a lot of stuff with low level requirements. You can have a similar setup for less.</p>
</label>
