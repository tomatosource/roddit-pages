

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://v.redd.it/ppug16nr6wof1"><p>Softlock after abyss encounter, can&rsquo;t attack, roll or use portal (flasks saved me, relog fixed it)</p>
</a>
    </h2>

    

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="ndymvgx" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>RollOfBones</div>
        <div>1 | 2 hours ago </div>
      </div>
      <label for="ndymvgx" class="commentText"><p>Did anyone else encounter this? I was mid-abyss fight, opened the box, and then couldn&rsquo;t use literally anything except for movement keys and flasks. I had similar softlock in campaign where it would restrict only one skill, and  getting it out and in socket helped, but thats the first time I actually can&rsquo;t use anything<br>
edit: i wanted to show it with button overlay, but obs would not increase video quality for some reason, so i just left example from cutting steam vods</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="ndyo5yq" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Ourszor</div>
        <div>1 | 2 hours ago </div>
      </div>
      <label for="ndyo5yq" class="commentText"><p>Happened to me a couple of times. Back to character select fixes it, and you restart exactly where you were. A bit frustrating but no harm done</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="ndyojv7" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>RollOfBones</div>
        <div>1 | 2 hours ago </div>
      </div>
      <label for="ndyojv7" class="commentText"><p>It could get me off-guard really hard if monster had a desecrated ground mod, i barely have time to roll out of it before i get nuked, if roll gets blocked like this its just gg<br>
At least it happened only twice so far, i can trace this lock to opening abyss boxes or killing abyss rares and be ready</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="ndyoqbl" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Ourszor</div>
        <div>1 | 2 hours ago </div>
      </div>
      <label for="ndyoqbl" class="commentText"><p>I mean don&rsquo;t get me wrong, it&rsquo;s definitely a bug and should be fixed! I hadn&rsquo;t noticed a pattern until you pointed it out, but I think you may be right and it is somehow connected to abyss boxes</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

    
  </div>
  
</div>

        
      
    </div>
  </body>
</html>
