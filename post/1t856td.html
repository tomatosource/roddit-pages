

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/42v5md51740h1.jpeg"><p>me, after reveal: Woah all that for free?</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/42v5md51740h1.jpeg" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">

    <div class="comment">
      <div class="commentHeader">

        <div>1 | 6 minutes ago </div>
      </div>
      <label for="oktmaup" class="commentText"><p>Exactly. So many of us here tend to be so hung-up on swords being there or not being there that we start forgetting what it actually is that GGG is providing here: Insane content and value for a game that delivers every contentpatch/expansion etc. for free. Think about how insane that is.</p>

<p>I like how LoH in D4 plays right now but don&rsquo;t think for a second that Blizzard would even give you one of those features they did just announce free of charge.</p>

  <div class="commentList">
    
      
<div class="commentAndChildren">

      <div class="commentHeader">

        <div>1 | 4 minutes ago </div>
      </div>
      <label for="oktmneg" class="commentText"><p>This is blizz&rsquo;s strategy every time. Build a base game, put amazing qol fixes behind an expansion. Game is good.</p>

<p>Release a new title, it&rsquo;s missing the nice qol of the previous expansion. 2 years later, they release another expansion and include the qol.</p>

<p>Cube was in d3:ros, then missing in d4, now released 2 xpacs later.</p>

<p>Followers were in base d3 game. Missing from d4, released in second xpac.</p>

<p>No free meal there.</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

        <div>FlossedUp</div>
        <div>1 | 6 minutes ago </div>

      <label for="oktmfob" class="commentText"><p>I pay them enough with all these shiny MTX 😂 but they&rsquo;re the only company I care to spend for MTX and it&rsquo;s deserved</p>

</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="oktn3d1" type="checkbox" checked/>

      <div class="commentHeader">
        <div>ObiWanKokobi</div>
        <div>1 | a minute ago </div>
      </div>
      <label for="oktn3d1" class="commentText"><p>Seeing 0.5, i&rsquo;m definitely getting the top tier supporter pack.</p>

<p>Things cost money, and GGG doesn&rsquo;t force anyone to pay them anything, you literally get everything for free. Then drop a $20 which is a standard price for a cheap indie title and you got enough for stashes to never have to worry about stash space, if you do some inventory management.</p>

<p>Since they don&rsquo;t do any scummy p2w shit or lock features behind a paywall, i&rsquo;ll choose to voluntarily buy a supporter pack to support good and consumer-friendly tactics.</p>

  </label>
  
</div>

        
      
    </div>
  </body>
</html>
