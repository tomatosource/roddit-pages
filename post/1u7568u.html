

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/256trz025l7h1.png"><p>Tablet loadouts concept</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/256trz025l7h1.png" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="orxnhcc" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Handris18</div>
        <div>1 | 8 minutes ago </div>
      </div>
      <label for="orxnhcc" class="commentText"><p>Pretty good concept</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="orxnivg" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>convolutionsimp</div>
        <div>1 | 8 minutes ago </div>
      </div>
      <label for="orxnivg" class="commentText"><p>I agree with the problem but I don&rsquo;t think this is the solution. Often times you want to just switch out a single tablet, switch based on biomes, switch out a master, the type of map you&rsquo;re running, etc. There is a lot of micromanagement, and this is just a small part of it. Switching <em>only</em> tablets without switching masters or the type of waystone usually isn&rsquo;t what you want.</p>

<p>And another huge problem with tablet is that it&rsquo;s annoying to roll (or buy on trade if you want to min-max) them, not so much that it&rsquo;s hard to put them into the map device. And by having loadouts we&rsquo;re basically back to having something like separate atlas trees from PoE1, which is explicitly what they said they wanted to avoid. Because 3 is just some arbitrary number, why not 5? or 10? And then the systems break down.</p>

<p>The first and simplest step to at least somewhat improving tablets is to turn them into scarabs you can trade on the exchange, and give us the storage inside the map device like we have in PoE1.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="orxo4zg" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>BulusB</div>
        <div>1 | 3 minutes ago </div>
      </div>
      <label for="orxo4zg" class="commentText"><p>Also, we need access to tablets tab on the left or/and pocket for map device like Poe 1</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
