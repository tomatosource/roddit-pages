      <label for="njab0jr" class="commentText"><p>From Chris Forsberg:</p>

<p>An often exasperated Joe Mazzulla spent much of his Sunday night pointing down the bench for subs each time his team failed to secure a defensive rebound <a href="https://www.nbcsportsboston.com/nba/boston-celtics/live-updates-cavaliers-preseason-highlights-analysis/738090/" target="_blank">against the star-less Cleveland Cavaliers</a>.</p>

<p>During one sequence midway through the second quarter, Mazzulla called for three subs in less than 20 seconds as his team gave up three consecutive offensive rebounds before a 24-second violation mercifully ended the possession.</p>

<p>Anfernee Simons got caught out of position and Mazzulla pointed to Derrick White to replace him. Neemias Queta couldn’t corral the next misfire and Mazzulla called for Josh Minott to sub in. When rookie Hugo Gonzalez failed to secure the next rebound opportunity, Sam Hauser joined the growing cluster at the scorer’s table.</p>

<p>It felt like a bit <a href="https://clip.cafe/national-lampoons-christmas-vacation-1989/get-somebody/" target="_blank">the scene in *Christmas Vacation* where Clark Griswold brings a gift to his boss</a>, Frank Shirley. An annoyed Shirley doesn’t have time for small talk and picks up his office phone and tells his secretary, “Get me somebody. Anybody. And get me someone while I’m waiting!”</p>

<p>Boston’s defensive rebound rate this preseason is 64.3 percent. That’s 7.4 percent below the team&rsquo;s 71.7 defensive rebound rate last season, which ranked seventh in the NBA. The Celtics&rsquo; current 64.3 percent mark would have been 3.5 percent worse than last-place Philadelphia for the entirety of the 2024-25 season.</p>

<p><a href="https://www.nbcsportsboston.com/nba/boston-celtics/joe-mazzulla-press-conference-rebounding/738469/" target="_blank">Read more here</a>.</p>
