}

.postLink:visited {

.postHeader {

  font-size: 24px;
  font-weight: bold;

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {

}

.selfPostImage {

  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>

      <label for="p3xc1t3" class="commentText"><p>This is not a good place to get a deterministic or high level craft. If you don&rsquo;t mind tiers of rolls you can try perfect exalt slams and then whittle from there, but you will pretty quickly run into the fact that T1 flat es is level 60, so whittle will pick it up often. And then desecration is ilvl 65, so a lot of rolls on suffixes will be higher level too, like for example if you hit T1-T3 Intelligence, that&rsquo;s it.</p>

<p>If you are looking for deterministic craft from here, you will need to annul down to 1 mod and chaos spam for T1 res.</p>

<p>From there exalt suffix and whittle for another res.</p>

<p>Then you will need to desecrate suffix with any mod that is higher than ilvl 78, so T1 int or T1 res.</p>

<p>Move on to whittling prefixes. Whittle until you got T1% es or T1 flat es.</p>

<p>Second mod is tricky. Slam exalt. Whittle. You can run into bricks here. Like T1 accuracy. In that case you will need yolo sinistral annulment and if it removes good mod then start from previous step.</p>
