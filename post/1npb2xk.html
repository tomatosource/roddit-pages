

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/vnkifq1ey3rf1.png"><p>How can I get increased crit chance on here?</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/vnkifq1ey3rf1.png" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="nfxtt9a" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Alternative_Goat300</div>
        <div>1 | 40 minutes ago </div>
      </div>
      <label for="nfxtt9a" class="commentText"><p>You have mods with attack, so any attack mod can roll. Omen of light/jawbone is completely safe, you can&rsquo;t brick your item. You have a decent chance with abyssal echoes, it took me 2 ancient jawbones to hit t1 crit the other day from a similar spot</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="nfxucum" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>WickedPunk</div>
        <div>1 | 36 minutes ago </div>
      </div>
      <label for="nfxucum" class="commentText"><p>Thank you. This was the more expensive option I was balancing! Thank you for confirming</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nfxvbf1" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>CaptainAgnarr</div>
        <div>1 | 31 minutes ago </div>
      </div>
      <label for="nfxvbf1" class="commentText"><p>Can I just ask, that&rsquo;s a good %phys roll, but that&rsquo;s kinda the only good thing on the item. The flat phys is a mid roll. I don&rsquo;t know if I&rsquo;d invest a bunch of omens into trying to get crit chance here.
Also if you don&rsquo;t want the leech, get that off first. You can always put +attack back on easily if you miss the annul, then work on the crit chance.</p>

<p>I would look for a bow that has a decent prefix fracture and already has crit in the suffix. You can desecrate for a 2nd good prefix pretty cheaply at that point.</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
