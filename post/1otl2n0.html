      <label for="no57u9n" class="commentText"><p>From Chris Forsberg:</p>

<p>The entire Boston Celtics’ roster spilled onto the court in celebration after J<a href="https://www.nbcsportsboston.com/nba/boston-celtics/live-updates-magic-highlights-analysis-orlando-rematch/745692/" target="_blank">ordan Walsh sealed Sunday’s win in Orlando</a> with a late-game, corner 3-pointer.</p>

<p>But it felt notable that the first person to reach him near half court was rookie Hugo Gonzalez.</p>

<p>Walsh and Gonzalez are two young players fighting for the same, sometimes-limited batch of wing minutes. And yet the two seemingly have bonded over their similar skillsets, and apparently have pledged to crank up the chaos factor whenever they touch the floor.</p>

<p>“The standard is to come in and play that hard, try to affect the game,” Walsh told reporters after Sunday’s win in Orlando.</p>

<p>Over the past three games, there’s been a noticeable shift in gears for the 21-year-old Walsh. He’s been relentless in attacking the glass for a Celtics team in desperate need of rebounding aid, and he’s been flying around on the defensive side, generating a whole bunch of deflections while playing steady defense.</p>

<p>The 19-year-old Gonzalez already has carved out his own defense-first role, and the Celtics continue to dispatch him against top-tier talent.</p>

<p>In a season where one of the top priorities should be developing young talent and identifying which of those players can fill rotational roles on Boston’s next title team, the early emergence of Walsh and Gonzalez feels as important as the Celtics being able to <a href="https://www.nbcsportsboston.com/nba/boston-celtics/neemias-queta-josh-minott-stats-frontcourt/745238/" target="_blank">lean on the likes of Neemias Queta and Josh Minott in starting roles</a>.</p>

<p>It’s clear how impactful Gonzalez eventually might be, even as coaches spend timeouts screaming at him about rookie mistakes. Walsh has had encouraging stretches during his first two seasons in green, but the last three games feel like the first time he’s really tapped into his full havoc potential.</p>
