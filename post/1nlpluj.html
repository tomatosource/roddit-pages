      <a class="postTitle" href="https://youtu.be/twYhG7GGr1k?si=LhXvMpoqlpoZHdZv"><p>Why does this craft fail?</p>
</a>
    </h2>

<div class="commentAndChildren">
  <input id="nf7dmtw" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Ecte1ion</div>
        <div>3 | 3 hours ago </div>
      </div>
      <label for="nf7dmtw" class="commentText"><p>Here&rsquo;s what I think happened.<br>
You use the omen of greater homogenisation together with greater exaltation.<br>
You only have 1 free prefix (descration takes one spot, armor the other)<br>
the game rolls for what affix it should add based on what is already on the item.<br>
It picks the %physical damage reduction -&amp;gt; it will attempt to add another <strong>physical</strong> affix<br>
It sees that there&rsquo;s one open prefix, it looks up what <strong>physical</strong> prefixes there are that it can add. -&amp;gt; <strong>There&rsquo;s only thorns.</strong><br>
It adds thorns, filling up the prefixes.<br>
It can&rsquo;t add a prefix so it looks into adding a suffix.<br>
It looks up what <strong>physical</strong> suffix it can add to the item through homogenising omen.<br>
There&rsquo;s nothing (because %phys reduction is already on the item) -&amp;gt; it just adds a random suffix.</p>

<p>tl;dr: you got unlucky because the homogenising omen picked physical and not defence.</p>
</label>
    </div>
  </label>

      </div>
      <label for="nf7jtnk" class="commentText"><p>Thank you for that explanation. Through that logic, what would happen if I try to force it two add two prefix modifiers with a sinistral exaltation? Will that guarantee that I get both the defense modifiers?</p>
</label>
    </div>
  </label>

<div class="commentAndChildren">
  <input id="nf7nkuj" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Ecte1ion</div>
        <div>1 | 32 minutes ago </div>
      </div>
      <label for="nf7nkuj" class="commentText"><p>I&rsquo;ll correct what I said a bit because the wiki states that it rolled the type of mod each time with greater exaltation which means that what happened was that on the second roll, when it checked again it odds were<br>
50% phys(thorns, pdr) it picked either of these, which resulted in no other phys mod being found so it added a random one<br>
25% defence, which would have resulted in armor to ele<br>
25% chaos res, which would have resulted in max chaos res</p>

<p>So basically rolling thorns on the first roll, just made things worse on the second.</p>

<p>I think the best strat is probably (assuming the same item you started with) to reveal the desecrated mod hoping for one more armor modifier<br>
which would in turn raise your odds of hitting defence with the homogenising.</p>

<p>from that point onward it would be using dextral+ homogenising for 50% chance of hitting defence and guaranteeing you&rsquo;ll add a suffix.</p>

<p>Apparantly +armor%stun isn&rsquo;t considered a defence mod.<br>
-&mdash;&mdash;&mdash;&mdash;&mdash;&mdash;&mdash;&mdash;&mdash;&mdash;&mdash;&mdash;&mdash;-<br>
<strong>if it was the case</strong> it would probably best to homo + greater exalt after having a shield with 2 defence prefixes so you can hope for third defence which brings your odds for defense to be picked on second roll to 60% and with full prefixes, it would guarantee suffix.<br>
-&mdash;&mdash;&mdash;&mdash;&mdash;&mdash;&mdash;&mdash;&mdash;&mdash;&mdash;&mdash;&mdash;-</p>

<p>two def prefixes + dextral + homogenising gives you these odds<br>
50% to get what you want (as opposed to 33% in your attempt)<br>
then you can proceed from there independantly.</p>

<p>if you do two def prefixes + dextral + homogenising + greater exaltation<br>
it&rsquo;s 50% the first try<br>
then either you get armor to ele and from that point second roll will be<br>
either maximum chaos res or something random<br>
or<br>
you have 40% chance to get armor to ele<br>
40% chance to get something ele or chaos related(either another resist or max red)<br>
20% chance to get something random(from hitting the pdr)</p>

<p>I&rsquo;d say the safest bet is probably to get a white base and trans + aug until you hit a defence prefix + a resistance you want or something that has no mod (like reduced attributes requirement or flat stun threshold)<br>
then use a defence essence<br>
then you do the dextral+ homogenising for 66% chance of hitting armor to ele which is the highest you&rsquo;ll get I believe.<br>
(if you do it with a greater exaltation and your suffix has no mod, it&rsquo;s 66% then 50% but you have slightly less control over the craft)</p>

<p>EDIT: to answer your question, I believe that sinistral would prioritize landing 2 suffixes, which means that by all logic the second suffix would be random.</p>

<p>If you were to have an item that is like this:</p>

<p>pref:<br>
armor<br>
%armor<br>
[empty]</p>

<p>suff:<br>
something<br>
[unrevealed desecration]<br>
[empty]</p>

<p>and used greater exaltation + homogenising + dextral, I&rsquo;m not sure if it would add the suffix first then prefix anyway or it would error telling you it&rsquo;s not possible.</p>

<p>on the flip side using greater exaltation + homogenising alone could add the prefix first, which then would reduce the odds of the second homogenising roll hitting one of the armor mod.</p>

<p>EDIT2: if you only really care about having armor to ele, just transmute a white item with flat armor then essence of enhancement then dextral + homogenising for 100% chance.</p>

<p>EDIT3: I mixed up sinistral and dextral in some places, corrected</p>
