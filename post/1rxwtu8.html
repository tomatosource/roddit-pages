

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>

    <h2>
      <a class="postTitle" href="https://www.sponichi.co.jp/baseball/news/2026/03/19/articles/20260319s00001007088000c.html"><p>Shohei Ohtani said that if NPB wants to win the WBC, it should introduce a pitch clock, but also added, “If we want to play our own style of baseball, there’s no need to introduce it.”</p>
</a>
    </h2>

      <label for="oba38z4" class="commentText"><p>Regarding the use of data in Japan, he commented, “I wouldn’t necessarily say it was behind, but there was a sense that managers and coaches weren’t using it on a daily basis, so there was definitely a gap in that area. I think they’ll catch up over time.”</p>

<p>Ohtani was asked about the current situation in which some players have been subjected to abusive comments on social media following the WBC. He said, “Personally, I don’t really mind being criticized. However, things like attacks on someone’s character are completely unrelated to baseball, so I don’t think that’s good.”</p>

<p>He continued, “As a professional, when my performance is poor, I’m prepared to accept whatever is said about me personally. But not everyone is necessarily that mentally strong, and treating others with consideration is something that shouldn’t change no matter where you are. I think it ultimately comes down to that.”</p>

      <label for="oba9qew" class="commentText"><p>NPB, led by the commissioner, had been considering its introduction since July 2023. However, in Japan, teams rely in part on revenue from food, beverages, and merchandise, and many have resisted because they want fans to stay longer in the stadium. Citing a cultural emphasis on valuing the “pause” between pitcher and batter, the introduction has been postponed.</p>

<p>At the February training camp, Yu Darvish offered advice to the media “off the record.” Over seven practice days excluding games, as many as three were devoted to countermeasures. Despite spending significant time on it, in the quarterfinal Hiromi Itoh fell behind in the count due to a pitch clock violation, creating a dangerous situation. The next batter then hit a go-ahead three-run homer.</p>
