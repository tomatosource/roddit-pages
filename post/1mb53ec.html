

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/c4co7heg4jff1.png"><p>Don&rsquo;t get excited/distracted while crafting</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/c4co7heg4jff1.png" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="n5kikdn" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Mysterious-Basket870</div>
        <div>2 | 19 hours ago </div>
      </div>
      <label for="n5kikdn" class="commentText"><p>Felt this pain in my soul. Definitely done this more than once.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="n5ldlvk" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>CyrainSSBM</div>
        <div>1 | 15 hours ago </div>
      </div>
      <label for="n5ldlvk" class="commentText"><p>Haha yea knowing im not alone made me feel like less of a goober. I claim I&rsquo;ll never make that mistake again, but we&rsquo;ll have to see about that in the long run =p</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="n5mckpr" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>75inchTVcasual</div>
        <div>2 | 11 hours ago </div>
      </div>
      <label for="n5mckpr" class="commentText"><p>It happens.  I&rsquo;ve made that mistake with T1 Crit / T1 AS gloves (got on a roll whittling the top that kept hitting lower ilvl prefix mods and wasn&rsquo;t paying attention to turn on my sinistral erasures).  Next thing I know my T1 Crit turns into T4 Rarity.  Those gloves also already had 2 T1 attack rolls, so I was on my last line to finish what could have been a mirror+ pair if I hit the socket corrupt.</p>

<p>However, I do wish we had an option to turn on some prompt where we had to confirm what&rsquo;s being rolled off.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="n5mggis" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>CyrainSSBM</div>
        <div>1 | 11 hours ago </div>
      </div>
      <label for="n5mggis" class="commentText"><p>Oh lord, losing it that late in a craft on a legitimately crazy valuable item is a terrible thought. Even at my level, not aiming for anything nuts, hitting two useful t2 suffixes off of two exalts, a chaos and a whittle seems insanely lucky lol I could&rsquo;ve been way deeper into the attempt when i bricked it. It&rsquo;s always a funny shock when your eyes catch <em>the bad thing</em> happening, but your brain registers it a millisecond too late lol. Still, nothing compared to mirror territory though. Maybe one day!</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="n5mnrii" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>75inchTVcasual</div>
        <div>1 | 10 hours ago </div>
      </div>
      <label for="n5mnrii" class="commentText"><p>Haha, yup, it was rough and similar experience with noticing it after.  The irony is that I&rsquo;ve crafted a ton of items this league and never fumbled a whittling until then, but of course luck would have it that it had to be on my most GG craft.</p>

<p>The only saving grace was that I got extremely, extremely lucky with making the fractured suffix base (sub 40 divs; the average paper cost to craft on some combo of T1 CD/AS/+2 Skills for 2nd and 3rd suffix is north of 1K divs) and landed the first two prefixes for relatively cheap.  I did land T2 phys after the fumble and hit the second socket, so ended up breaking even on them.</p>

<p>I now have a rule where I put on a 10-20 second timer between each whittle attempt.</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

    
  </div>
  
</div>

        
      
    </div>
  </body>
</html>
