

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/34iq93c367jh1.jpeg"><p>Best way to Craft these?</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/34iq93c367jh1.jpeg" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="p3ifcfy" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Earthboundplayer</div>
        <div>5 | 7 hours ago </div>
      </div>
      <label for="p3ifcfy" class="commentText"><p>One idea:</p>

<p>Buy a LVL 75 base, chaos spam and fracture +2 melee. Chaos spam for a T1 flat damage. Use whittles until you get a second T1 flat damage, use whittles again until you get a third flat damage of whatever tier you&rsquo;re willing to settle for. Then add two suffixes and cycle essence of hysteria and desecration until you have both of them as your suffixes. Reroll the desecration until you get armour applies to elemental damage.</p>

<p>You wouldn&rsquo;t be able to be selective with the type of your flat damages though, other than when you chaos spam for the first flat. I am also not sure massive mitts in particular drop at level 75 but level 75 ensures you can&rsquo;t whittle T1 flat.</p>

<p>Edit: I guess if you really want to not have flat phys you could:</p>

<ul>
<li>chaos spam for one T1 non-phys flat</li>
<li>Whittle spam for the second non phys flat. It&rsquo;s a <sup>50</sup>&frasl;<sub>50</sub> on whether you land on T1 flat phys first though, and in that case you have to chaos with a <sup>50</sup>&frasl;<sub>50</sub> to remove the flat phys</li>
<li>desecrate for your third non phys flat</li>
<li>whittle or dextral erasure/annulment for your armour applies to elemental</li>
<li>add a suffix and <sup>50</sup>&frasl;<sub>50</sub> for the essence of hysteria</li>
</ul>
</label>
    </div>
  </label>
  
</div>

  </body>
</html>
