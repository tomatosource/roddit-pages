      <label for="ocww3wu" class="commentText"><p>To clarify the math.</p>

<p>The increase applies to your base damage. So +27% does linearly mean +27% of base damage. But the total impact, if you already have X increase, and add on Y, then the functional increase on your <strong>previous damage</strong> is Y/(1+X) (where 1 = 100%) which would be 13.5% in the case of Y=27% and X=100%</p>

        <div>7 | 17 hours ago </div>
      </div>
      <label for="ocwtw9j" class="commentText"><p>Imagine you have 100 damage as base and you already have 706% increased damage bringing it up to 806 damage. Now you add your 27% increased damage giving you 27 more from your base 100 damage (806+27). This is how &ldquo;increased damage&rdquo; works. If it was 27% &ldquo;more damage&rdquo; it would be 806*1.27.</p>

<p>Increased = additive. More= multiplicative.</p>

<p>Or two sources of 10% increased equals 1.1+1.1=1.2=20%.
Two sources of 10% more damage equals 1.1*1.1=1.21=21%</p>
