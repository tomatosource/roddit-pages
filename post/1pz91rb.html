

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>

    <h2>
      <a class="postTitle" href="https://v.redd.it/8ykmcs1hr9ag1"><p>Mirage Archer is the most underrated bow skill</p>
</a>
    </h2>

    

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="nwoitp9" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>SheriffOfValentine</div>
        <div>2 | 3 hours ago </div>
      </div>
      <label for="nwoitp9" class="commentText"><p>I tried it out the other day and was surprised its not used more. its a huge dps increase since i put it on I feel like im never taking it off mine pummels with toxic growth and together we obliterate bosses before the cooldown is up. if anything most builds should imo have this to at least swap to for a bosses. drop the herald swap in mirage archer for bossing at minimum. I just like having it on constantly now its just fun to watch my ethereal clone wreck stuff while i walk around just collecting loot.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nwosl2o" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>xiko</div>
        <div>2 | an hour ago </div>
      </div>
      <label for="nwosl2o" class="commentText"><p>Works with spear skills too. </p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nwotsl1" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>MakataDoji</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="nwotsl1" class="commentText"><p>I think the issue more is the existence of much more required other spirit skills for archers.</p>

<p>Ghost Dance is an irreplaceable defensive tool that can recover ~1k ES when hit up to 3 times which comes out to having an extra 3k ES for most fights. I would never take it off for any reason.</p>

<p>Wind Dancer is theoretically replaceable in some scenarios but losing out on 30% <strong>more</strong> (not increased) evasion would not only be a hit to your baseline survivability but Ghost Dance as well.</p>

<p>Herald of choice is also replaceable on a boss fight and between the 2 you&rsquo;re freeing up 60 spirit. So it can be done, you&rsquo;re just going to have to be a bit more careful with lower evasion.</p>

<p>I think the real biggest issue is activating it for bosses. You&rsquo;d say weapon swap, and sure, you can, but I imagine many of us are using Rigwald&rsquo;s and going from a 30% more damage multiplier to a 15% less (which would be a 35% damage loss, before factoring in AS, so maybe more like 20%) means you&rsquo;re already starting at a deficit in damage the mirage has to make up for and then do more on top of that to justify using it. Also, dodge rolling cannot trigger the swap so you&rsquo;d have to manually swap every 7 seconds to re-trigger if that&rsquo;s what you&rsquo;re going for.</p>
</label>
    </div>
  </label>
  
</div>
