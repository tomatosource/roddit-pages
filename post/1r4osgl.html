

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/su85c887khjg1.png"><p>PSA: For those lamenting the loss of &ldquo;Walker of the Wilds&rdquo;&hellip;</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/su85c887khjg1.png" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="o5d3ytq" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Forsaken-Simple-4429</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="o5d3ytq" class="commentText"><p>Yeah they shouted this out when they removed walker of the wilds. Its ass just cuz you can only tie it to one skill and burns a gem slot AND can only be gottem post lvl 65. </p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="o5d4604" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>PrintDapper5676</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="o5d4604" class="commentText"><p>It feels strange to remove a passive key stone and replace it as a support gem is such an obvious play by GGG to lower the power of elemental attack builds. It just felt mean-spirited. Especially as without this support mana becomes a boring thing to solve.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="o5d4ojm" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>MTosti92</div>
        <div>1 | 42 minutes ago </div>
      </div>
      <label for="o5d4ojm" class="commentText"><p>Throw it on Herald of Thunder and you don’t have to use a support on your main DPS skil</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="o5d47m9" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>trueforce1</div>
        <div>1 | 44 minutes ago </div>
      </div>
      <label for="o5d47m9" class="commentText"><p>I think they should rework it into “leech % Mana from supported skills based on Elemental damage” would be pretty great</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
