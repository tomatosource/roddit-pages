      <label for="mmnsqkf" class="commentText"><p>Currently (0.2.0e patch), several Delirium atlas passives are bugged or useless. I&rsquo;ve tested them so you don&rsquo;t waste your passive points. Here are details on the 4 that I wouldn&rsquo;t recommend taking:</p>

<p><strong>Would you like to see my face?</strong><br>
- mobs drop 1 splinter by default<br>
- you need 100% splinter stack size total to make a difference<br>
- this passive only helps if you stack a bunch of precursor tablets with % stack size and/or use maps with distilled emotions applied to increase stack size up to a total of 100%</p>

<p><strong>They&rsquo;re coming to get you&hellip;</strong><br>
- your delirium will never end (literally)<br>
- when you go to click &ldquo;end delirium encounter&rdquo;, you need to wait 4 seconds per rare you&rsquo;ve killed until the delirium ends and your rewards drop</p>

<p><strong>The mirrors&hellip; the mirrors!</strong><br>
- &hellip; were removed at some point (probably due to them being tied to the invulnerable mobs running out and pushing you around)<br>
- until they return, this one does nothing</p>

<p><strong>Isn&rsquo;t it tempting?</strong><br>
- only one reward type (distilled emotions) exists, this does nothing</p>

      <label for="mmnxxa8" class="commentText"><p>There are only 4 other nodes to take.</p>

<p>The 20% chance for waystones to drop with distilled emotions is nice because they are randomly applied (not weighted by their rarity), so you can get things like chance for rares to have additional modifiers applied to your maps for &lsquo;free&rsquo;.</p>
