      </div>
      <label for="o3b65jc" class="commentText"><p>i crafted alot of these and its mainly easy due to low cost of chaos and anulls this league</p>

<p>quiver bonus is quite a rare mod compared to other jewel mods so:</p>

<ul>
<li>buy or self chaos jewels till you get quiver bonus and div to 3%</li>
<li>add 2 mods + desecrate</li>
<li>fracture</li>
<li>on fractured quiver bonus continue</li>
<li>anull to 1 mod besides the fracture</li>
<li>chaos till you hit crit chance, crit damage or large</li>
<li>ex anull for a 2nd mod</li>
<li>desecrate for last mod</li>
</ul>

<p>crafting cost per jewel can be between 100-600 divines, mostly depending on how many omen of light you need</p>

<p>ive sold like 30+ of these for 800-1.1k divs the past 2-3 weeks</p>

<p><a href="https://preview.redd.it/chnhavaqp8hg1.jpeg?width=750&amp;format=pjpg&amp;auto=webp&amp;s=b49f46be8b511551996e75c83a4752384d248d99" target="_blank">https://preview.redd.it/chnhavaqp8hg1.jpeg?width=750&amp;format=pjpg&amp;auto=webp&amp;s=b49f46be8b511551996e75c83a4752384d248d99</a></p>

<p>since im done with league, good luck to you :) these jewels have been my biggest divine print this league</p>
