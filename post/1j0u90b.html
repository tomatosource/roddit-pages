    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
}

.selfPostContainer * {
  color: white;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>

    <h2>
      <a class="postTitle" href="https://www.reddit.com/gallery/1j0u90b"><p>Original Sin Ring</p>
</a>
    </h2>

    

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="mfeeof8" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Causener</div>
        <div>1 | 36 minutes ago </div>
      </div>
      <label for="mfeeof8" class="commentText"><ol>
<li>You misunderstand conversion. This ring will convert all of your elemental damage to chaos, in your example you would deal 500 chaos damage unless you had modifiers that apply to chaos damage that wouldn&rsquo;t have previously applied to your elemental damage. You&rsquo;re not &ldquo;gaining&rdquo; any damage, it&rsquo;s being converted to a different element. Mods like &ldquo;gain x as added damage&rdquo; would operate closer to what you described.</li>
<li>In the 2nd picture it just means that it&rsquo;s a standard conversion, not a skill-based conversion. Skill gems that convert damage inherently, such as Lightning Arrow converting 50% phys to lightning, take priority over other conversions. This should only matter if your damage conversions are in excess of 100% as the game will scale down the excess conversion from non-skill based sources such as this ring.</li>
</ol>

<p>EDIT: Because I initially missed the mention of quality and Ingenuity belt. The only benefit of increasing the effect of this ring would be a boost to the chaos resistance. Increasing the conversion won&rsquo;t have any benefit.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="mfefmfc" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Plastic-Nothing2994</div>
        <div>1 | 27 minutes ago </div>
      </div>
      <label for="mfefmfc" class="commentText"><p>Thanks for your reply. Although I understood it as converts 100% into chaos. Yet ingenuity belt gives 80% increased effect effect of equipped rings so that would be 180%, no? (Add 20% chaos quality to it comes out around ca 215%)
Oh and while we are at it.. 👉👈.. I also use trampletoes and I read that I need to have % extra fire dmg on my wand for them to work. I never understood why because I didn’t find anything when I searched for it but I just went with it. So would using this ring „disable“ trampletoes.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="mfegnjs" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Causener</div>
        <div>1 | 16 minutes ago </div>
      </div>
      <label for="mfegnjs" class="commentText"><p>Although something like &ldquo;converts 300% of your elemental damage to chaos&rdquo; makes it seem like you should gain 200%, it doesn&rsquo;t. The game scales the conversion down to 100%.</p>

<p>I&rsquo;m not sure you need the &ldquo;% extra fire&rdquo; for them to &ldquo;work&rdquo; it just makes it stronger. Added damage is handled before conversion. So lets say you deal 500 phys damage, and your wand has &ldquo;gain 30% physical damage as fire&rdquo;. Your hit would start with 500 phys, you would gain 150 as fire, then that fire would be converted to chaos because of Original Sin. At the end your hit would be 500 phys:150 chaos.</p>
</label>
    </div>
  </label>
