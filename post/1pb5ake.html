

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>

<div class="commentAndChildren">

      <div class="commentHeader">

        <div>2 | 3 hours ago </div>
      </div>
      <label for="nro5u1x" class="commentText"><p>Definitely possible with that fracture. I can’t tell if you have an abyss mod or not. If you don’t, then you can use  prefix only essence abyssal essence for mark of the lord and then try to get it that way. Otherwise whittling or annulling the prefixes is gonna be really low odds, unless you can exalt homogeneous for physical mods?</p>

<p>The dex is definitely the harder mod to remove though, if the other mods aren’t jsut essence suffixes than can be redone.</p>

<p>Edit: since the hybrid phys is the abyss mod, then you can prefix perfect essence until it gets removed which is prob cheaper than a light omen. Then use the abyss essence prefix only omen</p>
</label>

      </div>
      <label for="nrobxvq" class="commentText"><p>No way to guarantee remove the Dex. You can <sup>1</sup>&frasl;<sub>3</sub> the Onslaught essence and if you get lucky remove Dex you can omen of light + annul the T7 prefix. If you don’t get lucky you’ll need to annul it all and start from the base</p>

        <div>1 | 26 minutes ago </div>
      </div>
      <label for="nrofvms" class="commentText"><p>Not sure if you really want these mods generally. My understanding is that is a budget +levels mod where bows I imagine could get +7 to all gems. I also think weapons especially have a great damage range prefixes, so taking &ldquo;gain 20%&rdquo; is probably a huge downgrade on the bow.</p>

<p>It&rsquo;s also important to note, as of right now, corrupting in poe2 is insanely valuable. There is a soulcore that gives gain 5% of ea element, so you could have 3 sockets in a bow or just gain 13% as extra chaos dmg, which is much more competitive compared to &ldquo;18% inc phys&rdquo; for a core rather than an entire prefix.</p>
</label>
