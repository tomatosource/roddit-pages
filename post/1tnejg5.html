

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/jh6d09prab3h1.jpeg"><p>I miss Abyss league crafting&hellip;</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/jh6d09prab3h1.jpeg" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="ontbta1" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>titiop870</div>
        <div>1 | 20 minutes ago </div>
      </div>
      <label for="ontbta1" class="commentText"><p>Did I miss something in the patch? There&rsquo;s no more abyssal crafting???</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="ontd0s5" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Silver-Mechanic-7654</div>
        <div>1 | 14 minutes ago </div>
      </div>
      <label for="ontd0s5" class="commentText"><p>The op is talking about homogeneous crafting specifically which was both fun to do and ridiculously overpowered.</p>

<p>GGG did nerf crafting recently though. They removed the ability to have multiple &ldquo;crafted&rdquo; modifiers on an items. I.e. you won&rsquo;t be able to guarantee a craft with essences.
Like you could buy any magic martial weapon with good phys% and finish it to +level, onslaught, attack speed, phys flat.</p>

<p>Honestly, ut might be a good change. We will see with the new crafting mechanics</p>
</label>
    </div>
  </label>
  
</div>

    
      
<div class="commentAndChildren">
  <input id="ontexo9" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Personal-Smile-3322</div>
        <div>1 | 5 minutes ago </div>
      </div>
      <label for="ontexo9" class="commentText"><p>no its still here, but its not as easy to get abyss orbs for crafting now that its core.</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="ontcijr" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Earthboundplayer</div>
        <div>1 | 16 minutes ago </div>
      </div>
      <label for="ontcijr" class="commentText"><p>I think it would have been cool if they just made it function like a catalysing exalt where it increased the weights of mods with tags that already exist on the item.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="ontbf8p" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>CaptainAgnarr</div>
        <div>1 | 21 minutes ago </div>
      </div>
      <label for="ontbf8p" class="commentText"><p>Ah those were the days. At least Standard exists.</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
