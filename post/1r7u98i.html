

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/cd20rxc5t6kg1.png"><p>Weakest PoE2 Map (wtf is &ldquo;15 additional modifiers&rdquo;):</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/cd20rxc5t6kg1.png" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="o604ejf" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Slightly_Mungus</div>
        <div>1 | 27 minutes ago </div>
      </div>
      <label for="o604ejf" class="commentText"><p>Anyone done any testing on +map mods? I&rsquo;ve had great success just running +effectiveness and +2 map mod tablets and getting sometimes 2-3+ raw divs on a map. Feels like poe1 risk scarab at home. Nothing near temple (number-wise?), but a lot of fun for standard mapping!</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="o605zgl" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Tweedlol</div>
        <div>1 | 15 minutes ago </div>
      </div>
      <label for="o605zgl" class="commentText"><p>Dmg dealt by mobs is so much higher in maps than temple, and 0 revives. Risk vs reward is so off.</p>

<p>I can take a lot of hits in maps, but I’m fairly positive this set of mods would fuck me up real quick.  😂</p>

<p>It’s funny to me how many raw div I pick up in mas with my 300% rarity I’ve built for temple. And that’s just a bland 6mod. You’re nuts</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="o606hwf" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Slightly_Mungus</div>
        <div>1 | 12 minutes ago </div>
      </div>
      <label for="o606hwf" class="commentText"><p>It&rsquo;s kinda funky. I&rsquo;ve been playing poe1 recently where the meta has been to stack more map mod effect, so I figured why not try the same in poe2 now that tablets give us the option? It works really well, like ~1-2 raw div per map + several breach/abyss opportunities, but defintely a bit dangerous.</p>

<p>This is probably my best poe2 build so far at 3k life 7k ES base with all 75% res (including chaos and +3% max res cold, and I still get OHKO&rsquo;d from unfortunate circumstances lol). Escalating difficulty + delirium on an abyss overrun map seems like utter insanity to me.</p>

<p>Edit: Also just starting to build my temple after a lot of experimentation with the architect, so I&rsquo;m excited to see how mind-bending endgame looting end up being in poe2!</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

    
  </div>
  
</div>

        
      
    </div>
  </body>
</html>
