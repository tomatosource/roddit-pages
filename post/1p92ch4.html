<div class="commentAndChildren">
  <input id="nr989js" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Beenrak</div>
        <div>1 | 7 hours ago </div>
      </div>
      <label for="nr989js" class="commentText"><p>Like most of you, I have used FilterBlade for years. Its amazing and the tool I&rsquo;ve created here pales in comparison. That being said, the longer I play poe, the more control I like to have over my filter. Recently (in poe2 especially) I&rsquo;ve been heavily customizing my filter.</p>

<p>While FilterBlade is great if you want to leverage Neversink&rsquo;s general philosophy for filters, it is in my opinion rather cumbersome to customize outside of moving things up/down a few tiers.</p>

<p>I made this tool as a compromise. I found myself editing filters manually in text editors, which is an awful experience. This is more or less a literal wrapper to that process. You build the rules in top down order, with continue blocks etc. to make the filter you want &ndash; but with the benefit of auto-completed types, preview renders, and most excitingly the simulator.</p>

<p>The simulator will take an item as you specify it, and run it through all of your filters rules. It will show you all rules that have been applied to your item as well as which fields actually matter for the given rules. I&rsquo;m pretty happy with this and plan to use it in the upcoming poe2 league. Wanted to show it off and get feedback/impressions.</p>
</label>

        <div>2 | 6 hours ago </div>
      </div>
      <label for="nr9dt7j" class="commentText"><p>I have, I find poe2filter to be a very very clean way to make a filter &ndash; but again it sorta expects that you are going to follow a &lsquo;style&rsquo; of filter.</p>

<p>For example, the test filter I load here tints the background color of all equipment based on the attribute type (so red for strength, green for dex, blue for int).  Doing something like that in filterblade or poe2filter is a real pain.</p>

<p>If all you are really looking for is a: Should I pick this up because its valuable &ndash; poe2filter (or neversink) is great. This is more for if you want to do something totally different.  You want all intelligence boots to have a red border unless they are corrupted &ndash; or some shenanigans like that.</p>

<p>Its really made more for the fiddler who wants the level of control that direct filter modification has, but without having to use a text editor</p>
