.commentText,

.commentHeader {

  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {

}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

        <div>2 | 5 hours ago </div>
      </div>
      <label for="oco2wpv" class="commentText"><p>not a meme, get enough spirit and int, get blasphemy temporal chains, I always find this combo to be the most op defense wise no matter what class / weapon i&rsquo;m playing lol esp when mapping. like a lvl 20 blasphemy temporal chains slows everything down by 60% not just movement but their attack speeds as well, mobs could barely move before you kill them. this will solve your &ldquo;i&rsquo;m surrounded&rdquo; problems.</p>

<p>But in general, I always disliked half armor builds, it just never feels very tanky, and for good reason, armour is really bad until you stack a ton. I either go full energy shield and get a few ES recharged delay starts faster to get below 2s, or go full armour and stack HP and armour also applies to elemental damage as much as possible. that&rsquo;s for the Left side of the tree anyway. on the right side of the tree, obviously either full ES or half evasion half energy shield tend to be the best. full evasion w/ a decent amount of deflection stacking HP can also be good as well, just not as good as half evasion half energy shield in my opinion. you can tell Monk starting area and side of the tree is my favorite haha</p>
