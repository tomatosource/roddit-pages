      <label for="ny7mspe" class="commentText"><p>Have you googled or looked up simulacrum builds? It looks like you&rsquo;re just taking a random choir of the storms mapper into highest end simul and face planting.
There are builds that can breeze all the top content , but are extremely expensive , generally to specialize in hard content you have to build and spec for it.
How nobody is just casually farming sekhemas without a very special build, or how people remove headhunters and skill gems for basic pinnacle or map bosses you need to think about and google what makes simulacrum challenging on a character and build to defend it.</p>

<p>Your build has amazing amounts of getting damage out , chaos resistance and lots of great things that are pointless for simulacrum.
You need nearly full stun immunity , or roll % of max energy shield to stun threshold on all those jewels with a cpl or cm energy shield build.
You need ways to get damage out passively as the mobs will spawn continually and hit you before you hit them there are many moves that linger for many seconds or create ground effects , this helps kill all the smaller mobs instantly that are gathering up before you can touch them.</p>

<p>Honestly you have very good gear and a high end budget , what you need is the motivation to look up simulacrum specific builds and watch some videos. 
A few small tweaks could probably make farming t3 easy for you, but you&rsquo;re going to have to understand what to change , you have the budget you need to spend time learning. The ways to get around what&rsquo;s killing you can be dealt with in a variety of ways so it comes down to what you can afford or prefer to change , do you want to buy all new gear pieces or just swap gems or simply as jewel swapping or trading a few passives , it&rsquo;s all personal preference and budget , you have to solve for getting damage out passively, you need more if not full stun immunity, you also have a large hit pool ehp but extremely low recoup / regen of those defenses which is never a problem for most mapping unless your grouped however for simulacrum you need ways to passively recover your es whether life regen tech or leech, or however you decide to spend currency.</p>

<p>Or do what many do any buy 150 splinters and pay a carry, most will literally run it free to get you your 2 pts and will just take all the loot. Early season some people charge a div to get you all 8 atlas points in any tree you choose, or even get your ascendancy points.
Sometimes rather than spend many divs to change an entire build so you can finish something to get 2 points , it&rsquo;s worth it to just spend a single div and get the carry if you don&rsquo;t plan on farming the content anyhow and only doing it for your atlas it&rsquo;s a viable strategy to finish things up. 
If you really want to push your char to do it , it will probably be more time and currency than paying someone to do it.</p>
