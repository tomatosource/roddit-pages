

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/wttrfpbq6gxf1.png"><p>Crafting help for Bloodmage resistance ring</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/wttrfpbq6gxf1.png" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="nlgyoj5" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Few-Manufacturer7109</div>
        <div>1 | 7 hours ago </div>
      </div>
      <label for="nlgyoj5" class="commentText"><p>I&rsquo;d say your best bet is to either buy it from trade or buy rings that e.g. have desecrate mod and cast speed missing and then slam cast speed with the omen that consumes catalysts and then desecrate trying to hit the 1:3 prefix</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nlhpk7l" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>GizamalukeTT</div>
        <div>1 | 4 hours ago </div>
      </div>
      <label for="nlhpk7l" class="commentText"><p>You buy a base with T1 Prefix Rarity and a Base with T1 Suffix Rarity and Recombinate them using Omen of Recombination. Be patient, my worst streak was 17 fails but it should roughly be 36% chance to succeed with the omen.</p>

<ul>
<li>desecrate with Omen of Kurgal and sinistral necromancy and unveil % inc spell DMG on ful ES</li>
<li>Homogenizing exalt + Dextral exalt with a greater exalt orb for T1 cast speed</li>
<li>omen of light to remove Kurgal</li>
<li>desecrate + Dextral necromancy + Ulaman omen for Recover life on kill</li>
<li>Homogenizing, sinistral exalt and perfect exalt for T1 life</li>
<li>omen of light to remove Ulaman</li>
<li>catalyse omen + cheapest element/resist you need quality + Dextral exalt + perfect exalt = higher chance of hitting a resistance, even all res</li>
<li>desecrate Kurgal to for % incr spell DMG on full energy shield</li>
</ul>

<p>Not sure what the material costs are like now but all of the above cost me 15d or so a try when I was making them</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nlhuurh" type="checkbox" checked/>

      <div class="commentHeader">
        <div>prokenny</div>
        <div>1 | 4 hours ago </div>
      </div>

</label>
    </div>
  </label>
  
</div>

</div>

        
      
    </div>
  </body>
</html>
