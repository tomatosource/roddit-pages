      <label for="nqot6uo" class="commentText"><p>It always happens if you respec points that were mandatory for the rest of the path you skilled. Even if you connect the rest of the skill tree with other points the skill tree will keep the points that were mandatory before. It is an annoying bug.</p>

<p>What you have to do:</p>

<p>Respec some points at the end of the tree where they are not mandatory for the rest.</p>

<p>Skill your new way of connecting the later parts, so you have 2 path that connect to the rest of the tree.</p>

<p>Respec the one you don&rsquo;t want.</p>

<p>And don&rsquo;t respec and skill at once.
First respec and save.
Then skill the new stuff.</p>
