.commentAndChildren label .comment .commentText {

.commentAndChildren input:checked ~ label .comment .commentText {

.selfPostContainer {

  color: white;
  word-break: break-word;

.selfPostImage {

.streamableContainer {

  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}
