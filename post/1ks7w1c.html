

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://maxroll.gg/poe2/pob/2w8i300u"><p>Build Help Lich Witch</p>
</a>
    </h2>

    

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="mtjlsjd" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>mymourningwood</div>
        <div>1 | 18 minutes ago </div>
      </div>
      <label for="mtjlsjd" class="commentText"><p>Contagion / essence drain lich felt very slow to me. It’s two casts and then you just roll for your life. If you’re lucky while mapping you’ll get a good spread as mobs die.</p>

<p>Your gear isn’t great. Your gloves are doing almost nothing for you. Spells aren’t attacks so that’s a dead stat on this build. Your rings aren’t providing much help either. Strength and accuracy don’t do much of anything for you.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="mtjmeoe" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>A9Carlos</div>
        <div>1 | 15 minutes ago </div>
      </div>
      <label for="mtjmeoe" class="commentText"><p>Me too.</p>

<p>Dropped it despite all the YouTubers going off about how great it is.</p>

<p>Slow and underwhelming imo</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="mtjmsmm" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>MrFunBuddy</div>
        <div>1 | 13 minutes ago </div>
      </div>
      <label for="mtjmsmm" class="commentText"><p>I would definitely look into getting max chaos resistance because that might be whats killing you most of the time. Then maybe take a look into similar builds on Poe 2 ninja to fix your passives.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="mtjn0i6" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>beardown1019</div>
        <div>1 | 12 minutes ago </div>
      </div>
      <label for="mtjn0i6" class="commentText"><p>You also have no chaos res and you&rsquo;re an energy shield build. In end game chaos damage hits for double against energy shield. Do you have the withering presence skill turned on?  Get your + spell skills maxed. You get 5 on wand 3 on amulet and 2 on focus. Switch rings out for rings with added chaos spell damage. Its good you maxed out resistance but I would focus on offense, get more currency then upgrade defense.</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
