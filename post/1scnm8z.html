*,

html {

body {

.postLink:visited {

.postHeader {

.commentList {

.commentAndChildren {

.comment {
  padding: 16px 0;

}

.commentText,
.commentText * {
  font-size: 38px;

  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;

  word-break: break-word;

.selfPostImage {

.streamableContainer {

  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

      </div>
      <label for="oecnubj" class="commentText"><p>The widely used The Covenant robe does it for spells.
But I assume you mean attacks. There isn&rsquo;t much. The only thing I can think of u/Q_elle didn&rsquo;t cover is the Atziri spear&rsquo;s special ability. It&rsquo;s not really good either though. </p>

<p>First of all you have to hit something 10 times before triggering it to leach. Second, you lose a lot of damage compared to a good rare weapon. 
It works pretty well when you&rsquo;re still punching up, wear them down a bit, then explode them and get a big heal, but the goal is obviously to kill stuff faster.</p>

<p>It&rsquo;s not a terrible weapon. It took me to doing t15 maps. But when I switched to my next weapon ( T1 Phys, T3 lightning and fire, T2 crit, +5 projectile skills), the difference was night and day </p>
</label>

      <div class="commentHeader">
        <div>Q_elle</div>
        <div>1 | 13 hours ago </div>
      </div>
      <label for="oecamxc" class="commentText"><p>I assume you mean general application of leech. In which case, nvm &ldquo;good&rdquo; options, there simply aren&rsquo;t any. (Almost 100% sure) Mystic Harvest is the only thing currently in the game that will allow life leech with ele damage *generally*. The only thing is the Mark of Siphoning support gem that allows *all* attack dmg to leech, but only against the marked target. Thus, it is not practically applicable to mapping, which I imagine you are also wanting.</p>

        <div>1 | 6 hours ago </div>
      </div>
      <label for="oedx1mx" class="commentText"><p>My starter had issues with sustain especially using grenades as main skills, surprisingly Oisins Oath helped a lot when it came to sustain with leech, only problem thought since it&rsquo;s a lineage you can only slot it into one skill unless you use that helmet unique that let&rsquo;s you slot two. Either way you still need to have gear with Physical damage leech to pair with Oisins Oath, it&rsquo;s good for early game and early mapping but gets overshadowed later but it is a cheap option I used.</p>
