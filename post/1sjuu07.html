    <h2>
      <a class="postTitle" href="https://youtu.be/PidjGxqUfMo"><p>Rethinking the Balance of Global Defenses</p>
</a>
    </h2>

    

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="ofvtuvf" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Spiritual_Comfort511</div>
        <div>7 | 11 hours ago </div>
      </div>
      <label for="ofvtuvf" class="commentText"><p>Every video like this makes the same mistake. It criticizes global defenses as if they exist in isolation. But no truly tanky build in this game is built by simply stacking a single stat. It&rsquo;s always the interaction of multiple mechanics that complement and amplify each other.</p>

<p>With this <a href="https://www.reddit.com/r/pathofexile2builds/comments/1sivd4g/2700_life_shaman_tank_no_esevarmourblock_stacking/" target="_blank">small example</a>, I wanted to prove to myself and to others that you don&rsquo;t need a massive health pool to be practically immortal in this game.</p>

<p>The developers will most likely make changes or add new defensive layers. But that&rsquo;s no reason to complain—it&rsquo;s a reason to adapt again and come up with something new under the new conditions.</p>
</label>
    </div>
  </label>

<div class="commentAndChildren">
  <input id="ofvkk91" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>keener91</div>
        <div>2 | 13 hours ago </div>
      </div>
      <label for="ofvkk91" class="commentText"><p>It&rsquo;s a rehash of the same tired discussion of armour sucks because it doesn&rsquo;t prevent big hit, evasion sucks because it&rsquo;s all or nothing RNG, and energy shield is too good because it&rsquo;s easy to stack for casters and reliable and that&rsquo;s not fair for STR and DEX classes who can&rsquo;t path to those nodes easily.</p>

<p>The suggested solutions are also the same ones players wanted: more life, less RNG on one shot (reduce enemy critical damage)</p>

<p>I am surprised Block is never once mentioned in this video.</p>

<p>Anyways I was hoping for more insights on a 20min video.</p>

<p>EDIT: don&rsquo;t want to be seen as just a complainer, I&rsquo;ll contribute my own thoughts.</p>

<blockquote></blockquote>

<ol>
<li><p>Have combat log to show the hit and damage  which killed you. This way at least there is no false sense of security on what can and cannot be mitigated. GGG has repeatedly said they want one-shot / Dark Soul like mechanics to &ldquo;engage&rdquo; players to be on their toes. So seeing you die from 80K damage is a relief knowing whatever your defense can improve won&rsquo;t make a difference.</p></li>

<li><p>Having Active Block to be a separate skill like Sprint. This way you add engagement and agency to players who want to mitigate damage without penalize them for expending a Defense skill slot strictly for that purpose. Of course you should complement this with skills to add damage (like Parry).</p></li>
</ol>
</label>
