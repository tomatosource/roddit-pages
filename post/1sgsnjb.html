      <label for="of7dipe" class="commentText"><p>Great article.  He deserves a ton of credit for the team playing as well as it did without another all-star.  Yes, Derrick White is a borderline all-star, Payton Pritchard consistently stepped up and averaged 26+ in games he missed, and Neemias Queta surprisingly ended up a legitimate starting center who lead the team in win shares, defensive rating, and finished top 3 in plus minus along with White/Pritchard.  Yes, guys like Walsh, Hugo, Baylor and Garza proved to be capable role players when many expected nothing from them.  Yes, these guys proved they could beat good teams even when Brown was out.  But at the end of the day, this was still Jaylen Brown leading the team to a 50 win pace without a star sidekick which you arguably can&rsquo;t even say Scottie Pippen did in 1994 on the 55 win Bulls given Horace Grant made the all-star team that season.</p>

<p>Yes at this point you can say a quarter of our wins came with Tatum playing, but prior to that Brown ended up going 35-22 without JT alongside him.</p>

<p>Compare it to the other ALL-NBA candidates:</p>

<p>- Brown - 35-22 (50 win pace)</p>

<p>- Edwards - 36-24 (50 win pace)</p>

<p>- Shai - 56-12 (68 win pace)</p>

<p>- Luka - 43-21 (55 win pace)</p>

<p>- Wemby - 49-14 (64 win pace)</p>

<p>- Jokic - 42-22 (54 win pace)</p>

<p>- Brunson - 48-24 (55 win pace)</p>

<p>- Mitchell - 45-25 (53 win pace)</p>

<p>- Cunningham - 45-17 (60 win pace)</p>

<p>All those players had a secondary all-star alongside them.  Pistons had Duren.  Thunder had Chet.  Spurs had Fox.  Lakers had LeBron.  Nuggets had Murray.  Knicks had Towns. Cavs and Timberwolves only had 1 all-star this year, but Mobley and Randle made all-star teams previously.</p>

<p>Then when you consider Brown finished top 4 in ppg, top 15 in counting stats, had his team 2nd in the East prior to Tatum&rsquo;s return, etc he&rsquo;d get my vote for MVP, because of the degree of difficulty, the level of adversity, and the leadership intangibles.  You can easily say Jokic, Doncic, Wemby, Shai and Cade put up better numbers, but numbers aren&rsquo;t everything.  It didn&rsquo;t matter that Tatum lead the team in points, rebounds, and assists during the NBA Finals (or likewise when Steph was the obvious statistical choice over Iguodala), the media sometimes just needs to vote with their hearts and if their heart is telling them Jaylen deserves love after 9 seasons of being overlooked (only 1 all-nba and getting snubbed from the Olympics), or that elevating Jaylen&rsquo;s voice on social issues is important, their hearts should do the voting.</p>
</label>
