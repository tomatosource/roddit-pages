.postTitle {

.commentAndChildren > .commentList {
  display: none;

.commentAndChildren label .comment .commentText {

.commentAndChildren input:checked ~ label .comment .commentText {

  overflow: auto;

.selfPostContainer {

.selfPostContainer * {

.streamableContainer {

  background: #111;

.tweetContainer {

  display: flex;
  justify-content: center;
}
