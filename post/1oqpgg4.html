

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/640afz4guszf1.png"><p>Need help with pricing.</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/640afz4guszf1.png" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="nnki295" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>bascher123</div>
        <div>2 | 7 hours ago </div>
      </div>
      <label for="nnki295" class="commentText"><p>It’s easy to check on the market. Just put in the mods you have and check with lower numbers on each mod.
A worse one is going for 7 Div (listed 6 days ago) and a better one for 15 DIV (listed a day ago).</p>

<p>The market is pretty saturated at this point of the season. Which doesn’t mean that your quiver is not worth anything, but it might not be as much as you think. Start with a higher price and lower it day by day if you want to slow sell or hour by hour if you want to sell fast. Should get at least some divs out of this.</p>

<p>Quivers which are more preferable have “Adds Lightning Damage to Attacks”. Phys is ok tho :)</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nnkjos5" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Frangipane33</div>
        <div>2 | 6 hours ago </div>
      </div>
      <label for="nnkjos5" class="commentText"><p>10-20 divs</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nnl70oh" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>stav_the_man</div>
        <div>2 | 3 hours ago </div>
      </div>
      <label for="nnl70oh" class="commentText"><p>Unfortunately you won&rsquo;t get more than <sup>3</sup>&frasl;<sub>5</sub> div if you are lucky, this has low crit, low physical damage, no lightning damage. You can deterministicly make a quiver much better for a few divs.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nnln39f" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>linecrabbing</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="nnln39f" class="commentText"><p>You shoud post this price check question in daily thread, more appropriate.</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
