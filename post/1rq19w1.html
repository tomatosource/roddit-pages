      <label for="o9q8hwy" class="commentText"><p>Only parts of the chain in the loop destabilize, if not locked.  So.. the two rooms will go poof.</p>

<p>Your chain is safe if you lock the end, because it has to keep all the rooms that lead from the start to the lock &ndash; as long as there is only one path to the lock.</p>

<p>A loop is bad because it can now choose to destabilise either side of the loop.  And if you have spymasters _in_ the loop, they all kill each other (only one survives), because the game now thinks these are no longer locked.</p>

<p>Another way to think about it is when you have a loop, the loop is in danger.  Your loop is tiny, and two parts of it are not in danger because they are locked to chains.    A big loop, is big danger; when people loop their two main chains together by accident, the whole thing just blows up unless you can use a sac chamber to unloop it before the turn ends.</p>

<p>The big risk for you is if you get a room medallion, and place it in one of those two spots, and forget that that room will loop to your big chain &ndash; because placing medallions does not preview the room links.   For example if you put an alchemy, thaumaturge, sac chamber, or barracks on the wrong spot on one of those two you&rsquo;ll blow up your whole temple.   Make sure you know very well what the safe things to put there are.   Your choices to place in these two spots are not all that great.    Treasure vault is your safe bet.  Armoury doesn&rsquo;t add much juice, especially at level 1. Alchemy or corruption chambers are OK but potentially dangerous, same with barracks.  You already have a generator for your golem works on that road, so a second one doesn&rsquo;t do much, spymaster might be useful only to level up your other ones if they aren&rsquo;t leveled yet (don&rsquo;t lock it before the run).</p>

<p>There isn&rsquo;t a whole lot to do with those spaces.   You won&rsquo;t be able to consistently lock it,  you should prioritize having the long chains locked and ONLY lock that one if you are overflowing with locks &ndash; dry spells happen and the juice you&rsquo;re adding with these is small.</p>

<p>If you consistently sustain 3 locks for some reason, stick a corruption chamber or alchemy lab in the one closest to the entrance, upgrade it, and lock it.  Leave the other one empty and put treasure vaults there when they show up.   But you won&rsquo;t consistently sustain 3 locks, so most of the time these will not be leveled up rooms and won&rsquo;t do much.</p>
</label>
    </div>
