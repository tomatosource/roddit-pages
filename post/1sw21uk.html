

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/2i2472npxhxg1.gif"><p>The miller can miss?</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/2i2472npxhxg1.gif" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="oicffva" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Tsunamie101</div>
        <div>17 | 14 hours ago </div>
      </div>
      <label for="oicffva" class="commentText"><p>Maybe only the ground effect of that attack actually has a hitbox/damage zone, and since he&rsquo;s really close to the wall it basically either never spawned because of the lack of room, or just instantly disappeared because it hit terrain.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="oicfksm" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Neat_Reception_5824</div>
        <div>10 | 14 hours ago </div>
      </div>
      <label for="oicfksm" class="commentText"><p>Prob lack of room, kinda like Lachlaan when you stay between him and statue at the start of the fight</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="oici2ee" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Justincbzz</div>
        <div>7 | 14 hours ago </div>
      </div>
      <label for="oici2ee" class="commentText"><p>If you&rsquo;re too close to a wall many skills don&rsquo;t hit basically, this is both a thing for mobs and players</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="oifld1x" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Nearby_Squash_6605</div>
        <div>1 | 3 hours ago </div>
      </div>
      <label for="oifld1x" class="commentText"><p>you can also active block his red slams</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
