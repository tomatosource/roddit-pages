    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>

      <label for="o3mngg4" class="commentText"><p>Yeah actually my bad, I forgot I didn&rsquo;t follow Fubgun on that part but musti&rsquo;s design instead, which didn&rsquo;t require any tech in that part of the snake:</p>

<p><a href="https://sulozor.github.io/#/atziri-temple?t=ACFIIUghSCFIIUhgOWA5YDlgSCE5ESkRKRE5IUhgKQCYACkySCE5EjEAeRFpIUhgcGl6cClwSCE5eXpwMRJ6IUgyaXBhOXGASCIxOWEIQGkxIg" target="_blank">https://sulozor.github.io/#/atziri-temple?t=ACFIIUghSCFIIUhgOWA5YDlgSCE5ESkRKRE5IUhgKQCYACkySCE5EjEAeRFpIUhgcGl6cClwSCE5eXpwMRJ6IUgyaXBhOXGASCIxOWEIQGkxIg</a></p>

<p>The strat fubgun goes through should in fact not work and it makes sense that it doesn&rsquo;t. What should in theory work (and does at least in the planner, but I haven&rsquo;t tried it in-game) is to put the two thaumaturges first and then the corruption chamber, like so:</p>

<p><a href="https://sulozor.github.io/#/atziri-temple?t=ACFIIUghSCFIIUgAAAAAAAAASCEAAAAAAAAAIUgAAACYAAAASCEAAAAAAAAAIUgAAAAAAAAASCEAAAAAAHEAIkgAAAAAAIBxMSIxOWEIQHpwaQ" target="_blank">https://sulozor.github.io/#/atziri-temple?t=ACFIIUghSCFIIUgAAAAAAAAASCEAAAAAAAAAIUgAAACYAAAASCEAAAAAAAAAIUgAAAAAAAAASCEAAAAAAHEAIkgAAAAAAIBxMSIxOWEIQHpwaQ</a></p>

<p>into:</p>

<p><a href="https://sulozor.github.io/#/atziri-temple?t=ACFIIUghSCFIIUgAAAAAAAAASCEAAAAAAAAAIUgAAACYAAAASCEAAAAAAAAAIUgAAAAAAAAASCEAAAAAAHF6IkgAAAAAAIBxMSIxOWEIQHpwaQ" target="_blank">https://sulozor.github.io/#/atziri-temple?t=ACFIIUghSCFIIUgAAAAAAAAASCEAAAAAAAAAIUgAAACYAAAASCEAAAAAAAAAIUgAAAAAAAAASCEAAAAAAHF6IkgAAAAAAIBxMSIxOWEIQHpwaQ</a></p>

<p>Then it should let you continue with the alchemy&amp;gt;thaumaturge roman tech:</p>

<p><a href="https://sulozor.github.io/#/atziri-temple?t=ACFIIUghSCFIIUgAAAAAAAAASCEAAAAAAAAAIUgAAACYAAAASCEAAAAAAAAAIUgAAAAAAGpwSCEAAAAAAHF6IkgAAAAAAIBxMSIxOWEIQHpwaQ" target="_blank">https://sulozor.github.io/#/atziri-temple?t=ACFIIUghSCFIIUgAAAAAAAAASCEAAAAAAAAAIUgAAACYAAAASCEAAAAAAAAAIUgAAAAAAGpwSCEAAAAAAHF6IkgAAAAAAIBxMSIxOWEIQHpwaQ</a></p>

<p>but keep in mind your corner thaumaturge will be in constant danger so you will go through a lot of locks, if you follow that route.</p>

<p>My overall suggestion would be to take the small hit and just go with an alchemy lab instead of that corruption chamber, which would be straightforward and require no tech, unless you can find an easier strategy that I can&rsquo;t think of at the moment.</p>
