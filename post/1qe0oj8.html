

<html>
  <head>

    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>

  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/9ln2dqsysldg1.png"><p>How do stat rolls and tiers work on items in PoE?</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/9ln2dqsysldg1.png" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="nztw57t" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>seubbgg</div>
        <div>4 | 9 hours ago </div>
      </div>
      <label for="nztw57t" class="commentText"><p>Its a  hybrid stat. Its a prefix that adds both mana and spell damage, instead of just spell damage. Different type of stat.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nztxeio" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>AwayOG</div>
        <div>3 | 9 hours ago </div>
      </div>
      <label for="nztxeio" class="commentText"><p>Thanks everyone for the replies, I wasn’t aware of the existence of hybrid rolls! I’ll leave the post here in case anyone else, like me, runs into the same doubt :)</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="nzu0rjm" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Im_a_rahtard</div>
        <div>1 | 8 hours ago </div>
      </div>
      <label for="nzu0rjm" class="commentText"><p>If you really want to understand how rolls work a little better. Open craft of exile. Choose any item. Then look at all the available mods for that item. Then you can see what&rsquo;s possible, what item level is required for an item to have a certain mod or mod tier. And what the weight is for each mod.</p>

<p>Then after that just remember that everything in the game is essentially a slot machine.</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nztw7u1" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Turtvaiz</div>
        <div>2 | 9 hours ago </div>
      </div>
      <label for="nztw7u1" class="commentText"><p>It&rsquo;s a different mod. Hybrid mana spell dmg</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nztwsdo" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>LupisSolitarius</div>
        <div>2 | 9 hours ago </div>
      </div>
      <label for="nztwsdo" class="commentText"><p>The roll of your ilvl 11 is a straight spell damage roll. The roll on the ilvl 43 is a Hybrid spell damage/mana roll.</p>

<p>If you want to see most of the possible things that can roll on an item, what item level it needs to be for certain tiers, and how likely you are to get that roll if you used an orb to add a stat, I would recommend taking a look at Craft of Exile for PoE2</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nzu40uf" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>StarkSaus</div>
        <div>2 | 8 hours ago </div>
      </div>
      <label for="nzu40uf" class="commentText"><p>I would recommend using <a href="https://poe2db.tw/us/Modifiers" target="_blank">Poe 2 database</a> to check for what mods are available for each type of gear. Helped me a lot when crafting my own gear :)</p>
</label>
    </div>
  </label>
  
</div>
