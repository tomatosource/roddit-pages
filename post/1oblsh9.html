      <div class="commentHeader">

        <div>6 | 8 hours ago </div>
      </div>
      <label for="nki0u85" class="commentText"><p>Regarding step 1. It&rsquo;s not insanely hard or expensive to get +2 Level of Melee and Attack Speed on a single pair of SINGLE SOCKET Gloves. If you are starting off with Exceptional 2 Sockets then yes, 48 Div for base is probably a fair price.</p>

<p>But I&rsquo;m going to tell anyone who wanders into this thread of how you might get to this screenshotted endpoint a much cheaper way, via corrupting at the very end to get an Extra Socket. </p>

<p>If you acquire ANY gloves with +2 Melee affix and ANY gloves with 16% Attack Speed affix, you can attempt to Recombine them with only those two affixes at a ~4.5% success. Right now, these gloves are going for 1-4 Exalts each via async trade, so let&rsquo;s say each attempt is 10 Exalt total. You&rsquo;ll get one success every ~23 attempts on average. That&rsquo;s 230 exalts to get you to a pair of gloves with one socket and 16% Attack Speed and +2 Melee. </p>

<p>Then, you slam any PREFIX via Exalt with Omen to guarantee a Prefix. This is a sacrificial affix.
Next, you buy the Essence of Horror (whatever that price is at now) and an Omen to target only Prefixes, and now you have all 3 Suffixes done with one Socket, basically getting you to your Step 1 (with one Socket) for essentially the cost of Essence of Horror. </p>

<p>Then follow your steps to whatever Tiers are satisfactory.</p>

<p>Before putting in the expensive Attack Speed socketables, 🙏 and Vaal Slam with Corruption Omen to ideally get a second Socket. </p>

<p>I did this myself and crafted my own Gloves as well as sustained some profits from selling what I considered &ldquo;fails&rdquo; as well as &ldquo;midpoint crafts&rdquo;. Basically, it seems like no one wants to actually go and do the buying and recombining, even though that step is <strong>drastically</strong> sped up due to async trade.</p>
</label>
