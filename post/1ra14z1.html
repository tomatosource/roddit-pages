

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/mx3sosy7iokg1.jpeg"><p>a bit of beta feedback</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/mx3sosy7iokg1.jpeg" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="o6hydo9" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Xyst__</div>
        <div>9 | 15 hours ago </div>
      </div>
      <label for="o6hydo9" class="commentText"><p>Scenery obstructing the view is a bigger problem than it seemed in previous patches. Not sure what caused the change but it only used to feel like cliffs, caves and larger scenery like that would obstruct your view at times. Now its trees like this that cover the entire ritual zone, or in Mire the circular huts that have a roof only hide the roof in 1 specific spot. Had a ritual spawn in one of those and I either had to stand still in that specific spot, or zoom my camera all the way in and stay near the bottom of the hut so i could see.</p>

<p>So same situation you mentioned, i was just blind hoping for the best during that one. No idea what mods the rare enemies that spawned had.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="o6h2ri2" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Suthsein</div>
        <div>6 | 18 hours ago </div>
      </div>
      <label for="o6h2ri2" class="commentText"><ul>
<li><p>EU servers are dogshit this season during prime time. It’s a big lag fiesta and I am concerned that GGG is so silent on the issue.</p></li>

<li><p>Loottables in T 16 maps: I don’t understand why the loot in T16 maps doesn’t feel any better than in T 15 maps. Especially items that grant a skill should at least grant lvl 19 of said skill.</p></li>
</ul>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="o6ii2bf" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Dustttttttttt</div>
        <div>1 | 14 hours ago </div>
      </div>
      <label for="o6ii2bf" class="commentText"><p>Not sure why but i got a massive latency spikes and it only happen after the launch of poe 1 3.27. It really pissing me of because i like the games so bad but i don’t think i can continue to play it with these states. It only happen with poe btw.</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
