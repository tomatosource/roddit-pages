

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/k63gw6rr5aye1.png"><p>Vendor rare items are very overpriced in campaign early game.</p>
</a>
    </h2>

    
	<div class="selfPostContainer">

    <div class="commentList">
      
        
          
<div class="commentAndChildren">

      </div>
      <label for="mq4s28u" class="commentText"><p>I <a href="https://www.reddit.com/r/PathOfExile2/comments/1k3mwmn/inadequate_prices_for_items_from_npc_in_acts_12/" target="_blank">talk about this</a> earlier. This is really stupid</p>

      <div class="commentHeader">
        <div>champ4281</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="mq4sj1v" class="commentText"><p>Yeah, it&rsquo;s a big problem for sure.</p>
</label>

  </label>
  
</div>

    
  </div>
  
</div>

        
      
        
          
<div class="commentAndChildren">

    <div class="comment">
      <div class="commentHeader">
        <div>Grider95</div>
        <div>1 | 37 minutes ago </div>
      </div>
      <label for="mq4uepp" class="commentText"><p>That is also an amulet spot, the most expensive slot they sell.  Most people don&rsquo;t get an amulet in act 1 and you don&rsquo;t really need it.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="mq4wh76" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>GL1TCH3D</div>
        <div>1 | 24 minutes ago </div>
      </div>
      <label for="mq4wh76" class="commentText"><p>I mean, that&rsquo;s not the point. The point is that vendors have items that are more expensive than players would reasonably achieve. It&rsquo;s really weird as vendor items don&rsquo;t get <em>significantly</em> more expensive but the items you vendor will scale from like, 50 gold to 5000 gold in the later parts of the game based on ilvl.</p>

<p>Suddenly after a few acts it becomes almost trivial to buy any rares you want even on your first chara.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="mq4x81a" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>a8bmiles</div>
        <div>1 | 19 minutes ago </div>
      </div>
      <label for="mq4x81a" class="commentText"><p>Yeah. It feels like the Act 1 prices are intended for you when gearing out 2nd and later chars, not your 1st char.</p>

<p>That being said, other than amulets I bought most of the rares for my first char this league just fine.</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

    
  </div>
  
</div>

    <div class="comment">
      <div class="commentHeader">
        <div>sdk5P4RK4</div>
        <div>1 | 44 minutes ago </div>
      </div>
      <label for="mq4td1m" class="commentText"><p>it evens out pretty quickly. you just arent supposed to get rares from vendors at levels they will barely even drop. Any jewlery in act 1 is lucky, a rare is an absolute blessing.</p>

  </label>
  
</div>

</html>
