

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>

    <h2>
      <a class="postTitle" href="https://v.redd.it/0icyb7ser4cg1"><p>Anti-Burst Protection has left the chat.</p>
</a>
    </h2>

    

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="nyen6hl" type="checkbox" checked/>
    <div class="comment">

</label>

</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nyeop7h" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>boomboss81</div>
        <div>1 | 33 minutes ago </div>
      </div>
      <label for="nyeop7h" class="commentText"><p>Why on earth is anti-burst even a thing. That is literally punishment for creating a proper build. It is quite a bit of work to get to a point where one-shotting bosses becomes a thing. Introducing bullshit mechanics like anti-burst is just ridiculous.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="nyerts0" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>cervantesrvd</div>
        <div>1 | 19 minutes ago </div>
      </div>
      <label for="nyerts0" class="commentText"><p>Fully agree. If I want to build to bonk hard I should be able to bonk hard.</p>

<p>I feel the same way about forced intermissions / invuln phases. Why do I have to chase that boss to grab the bell and then chase again while at 10% life. Once during campaign is interesting, after that is such a hassle.</p>
</label>
    </div>
  </label>
  
</div>

    
      
<div class="commentAndChildren">
  <input id="nyesqz0" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>shadowclone515</div>
        <div>1 | 14 minutes ago </div>
      </div>
      <label for="nyesqz0" class="commentText"><p>I agree it&rsquo;s horrible in early mapping. I even suspect that the burst protection for stationary bosses like Jamanra even in the campaign are not decaying properly, he seems so tanky and very hard to stun/freeze for a long time during the start of combat, since stunning or freezing is directly tied to damage dealt after damage mitigations.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="nyev0re" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Biflosaurus</div>
        <div>1 | 4 minutes ago </div>
      </div>
      <label for="nyev0re" class="commentText"><p>Jamanra has always been an oddity with how tanky he his relative your power level at the time you face him.</p>
</label>
    </div>
  </label>
  
</div>

</div>

  </body>
</html>
