

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>

    <h2>
      <a class="postTitle" href="https://v.redd.it/pv7zbbjavpve1"><p>Frozen Locus crit build is pretty cool</p>
</a>
    </h2>

    

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="mnvo3ux" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>tooncake</div>
        <div>4 | 12 hours ago </div>
      </div>
      <label for="mnvo3ux" class="commentText"><p>Frozen Locust is actually powerful as heck since 0.1. My only wished is that it could have been a biiiit bigger as sometimes, the mobs are still able to ignore it despite using the skill against them upfront</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="mnvrw4r" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Dimencia</div>
        <div>2 | 12 hours ago </div>
      </div>
      <label for="mnvrw4r" class="commentText"><p>Yeah, I think that comes down to accuracy rating?  Cuz every now and then there&rsquo;s one lone survivor out of nowhere, and sometimes it just does no damage point blank.  Even though I don&rsquo;t think accuracy rating usually matters against AOE?  Not sure though</p>

<p>I definitely spent a lot of my skill tree going out of my way for AOE for a while, but it didn&rsquo;t really help</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="mnvw55f" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>MildStallion</div>
        <div>1 | 11 hours ago </div>
      </div>
      <label for="mnvw55f" class="commentText"><p>Evasion is different between players and monsters. Monsters can evade any attack, but no spells, so accuracy matters against them when using slams and aoes if you&rsquo;re using an attack. Players can evade only projectiles and strikes, but can do so against both attacks and spells.</p>

<p>There are some player aoes that can&rsquo;t be evaded, but it lists as such explicitly on the skill. The heralds are an example of such.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="mnvxrvp" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>tooncake</div>
        <div>1 | 11 hours ago </div>
      </div>
      <label for="mnvxrvp" class="commentText"><p>What troubles me is that, since 0,1 and now on 0.2, still playing a monk, I suspect that the object collision of the Frozen Locust might be the culprit as you can try to precisely aim it at monster head on but most of them would be able to just ignore it passed by - I even tested it on that Snake lady on Act 2 that keeps on spinning 360 degrees and despite her spinning animation, my frozen locust at some point is still just right there idling.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="mnxjscp" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Dimencia</div>
        <div>2 | 3 hours ago </div>
      </div>
      <label for="mnxjscp" class="commentText"><p>I think it happens specifically on non-blocking mobs, the ones with a hitbox you can dash through so you don&rsquo;t get boxed in, and if you place it right ontop of them, it just moves them instead of blowing up - undead summons, swarm units, and a few of the more annoying ranged units.  They can still be hit by the blast, they just can&rsquo;t trigger it</p>

<p>&hellip; and yeah, that one snake lady, I think she might be the only boss that it seems completely impossible to break the crystal on.  I think they made her hitbox non-blocking because her arena is very small.  The titan and the bone monster in the pit are both pretty rough too, but on those there&rsquo;s still a random edge somewhere that will work</p>

<p>I doubt they&rsquo;ll ever &ldquo;fix&rdquo; that, though, making it blow up instantly isn&rsquo;t really intended gameplay, you&rsquo;re supposed to have to combo with the skill that blows it up</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="mnxndcj" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>tooncake</div>
        <div>1 | 2 hours ago </div>
      </div>
      <label for="mnxndcj" class="commentText"><p>I actually enjoy the part where you really have to engage the FL onto the enemy to make an interaction and an actual result at the same time, it&rsquo;s just that I really am just a bit disappointed on how small the room for object collision that they&rsquo;ve given to the FL skill, considering that the other spells have as wide as possible contact to trigger with the enemies.</p>
</label>
    </div>
  </label>
