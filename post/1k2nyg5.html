

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://v.redd.it/pv7zbbjavpve1"><p>Frozen Locus crit build is pretty cool</p>
</a>
    </h2>

    

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="mnvo3ux" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>tooncake</div>
        <div>1 | 5 hours ago </div>
      </div>
      <label for="mnvo3ux" class="commentText"><p>Frozen Locust is actually powerful as heck since 0.1. My only wished is that it could have been a biiiit bigger as sometimes, the mobs are still able to ignore it despite using the skill against them upfront</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="mnvrw4r" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Dimencia</div>
        <div>2 | 5 hours ago </div>
      </div>
      <label for="mnvrw4r" class="commentText"><p>Yeah, I think that comes down to accuracy rating?  Cuz every now and then there&rsquo;s one lone survivor out of nowhere, and sometimes it just does no damage point blank.  Even though I don&rsquo;t think accuracy rating usually matters against AOE?  Not sure though</p>

<p>I definitely spent a lot of my skill tree going out of my way for AOE for a while, but it didn&rsquo;t really help</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="mnvw55f" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>MildStallion</div>
        <div>1 | 4 hours ago </div>
      </div>
      <label for="mnvw55f" class="commentText"><p>Evasion is different between players and monsters. Monsters can evade any attack, but no spells, so accuracy matters against them when using slams and aoes if you&rsquo;re using an attack. Players can evade only projectiles and strikes, but can do so against both attacks and spells.</p>

<p>There are some player aoes that can&rsquo;t be evaded, but it lists as such explicitly on the skill. The heralds are an example of such.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="mnvxrvp" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>tooncake</div>
        <div>1 | 4 hours ago </div>
      </div>
      <label for="mnvxrvp" class="commentText"><p>What troubles me is that, since 0,1 and now on 0.2, still playing a monk, I suspect that the object collision of the Frozen Locust might be the culprit as you can try to precisely aim it at monster head on but most of them would be able to just ignore it passed by - I even tested it on that Snake lady on Act 2 that keeps on spinning 360 degrees and despite her spinning animation, my frozen locust at some point is still just right there idling.</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

</div>

</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="mnwf8hh" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>DerFigger123</div>
        <div>1 | 17 minutes ago </div>
      </div>
      <label for="mnwf8hh" class="commentText"><p>i wish it would work like disengage. just throw you back a bit further and should give a powercharge if the ice breaks. would make some really nice and fluid combos with flicker/falling thunder.</p>
</label>
    </div>
  </label>
  
</div>

  </body>
</html>
