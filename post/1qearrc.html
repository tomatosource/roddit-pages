  justify-content: center;

      <label for="nzw422k" class="commentText"><p>Pretty much this. In an ideal world (also very costly)</p>

<p>Step by step would be</p>

<p>Perfect Aug + Annul spam until you get +3 spell + T1 rarity on prefix, then essence of Rarity the suffix.</p>

<p>Sometimes i buy already double T1 rarity and +3 spells and try annuling off the unwanted mods.</p>

<p>Once are left with 3 mods you desecrate the prefix the try and fracture the prefix rarity (this is super important), if you don&rsquo;t hit you can carry on crafting and just sell.</p>

<p>Assume you hit Prefix rarity, you would need to add speed or caster catalysts + perfect exalt to try hit T1 cast speed (its actually higher odds than you think because +skills and rarity are blocked essentially)  you hit cast speed about 30% on this slam, with a perfect exalt its a <sup>1</sup>&frasl;<sub>4</sub> chance the cast speed you hit is T1.</p>

<p>If you hit T1 cast speed then congrats you can deterministically hit all 6 desirable mods. From this point you reveal desecration + echoes to block mana (since it is the most common).</p>

<p>Then you caster catalyst + omen of catalysing exaltation to try hit T1 spell damage. If you fail use omen of sinistral erasure (since all 3 suffixes are already complete T1 rarity, T1 spell skills T1 cast speed, and your prefix rarity is fractured). You can hope to hit the unwanted mod (if you hit the desecrated mana, just annul with the omen again, then reapply desecration and block mana). Do this process until you hit T1 spell damage or T1 spirit.</p>

<p>Then use omen of light spam on the final to get the mod you didnt hit (spirit or spell damage).</p>

<p>This gives you double rarity on a gold amulet (maximum 57% rarity) + spell damage and cast speed both boosted by sibilant catalyst, Spirit and +3 spell skills for your 6 T1 mods.</p>

<p>At this point you divine until perfect rolls (don&rsquo;t forget to annoint) then Hinekora&rsquo;s lock for sanctification until you find +4 to all spells skills.</p>
