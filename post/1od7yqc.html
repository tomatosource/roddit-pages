

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://www.reddit.com/r/bostonceltics/comments/1od7yqc/what_time_should_i_get_to_a_celtics_game/"><p>What time should I get to a Celtics game?</p>
</a>
    </h2>

    
    <div class="selfPostContainer">
      <p>I’m going to my first Celtics game tonight. What time would you aim to get there? I’m going solo.</p>

    </div>
    

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="nkrvgva" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>vegan_lifter</div>
        <div>3 | 13 minutes ago </div>
      </div>
      <label for="nkrvgva" class="commentText"><p>Last year, we got in an hour early. I’m not sure if they’ve changed that this year, but let me tell you, even an hour before the game starts, the place is buzzing with excitement! People were everywhere.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nkrx024" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>BostonPhillip</div>
        <div>1 | 5 minutes ago </div>
      </div>
      <label for="nkrx024" class="commentText"><p>I would look to be out of your transportation method (either parked your car or off the T) an hour before tip. You have time to walk around and just enjoy the energy.</p>

<p>I&rsquo;ve gone solo a few times and had a great time. Enjoy the game!</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="nkrxent" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>LOTR_is_awesome</div>
        <div>1 | 2 minutes ago </div>
      </div>
      <label for="nkrxent" class="commentText"><p>Is parking free?</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nkrx6hp" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>archerarcher0</div>
        <div>1 | 4 minutes ago </div>
      </div>
      <label for="nkrx6hp" class="commentText"><p>From what I remember you can’t actually get into the arena until an hour prior</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
