

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://v.redd.it/rtd64z07qfih1"><p>Anyone know how to fix this weird stuttering thing im getting?</p>
</a>
    </h2>

    

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="p2qmgb1" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>ConfessorKahlan</div>
        <div>3 | 16 hours ago </div>
      </div>
      <label for="p2qmgb1" class="commentText"><p>if you hit f1, you can see performance data. can help you figure out if it&rsquo;s network/cpu/gpu.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="p2qmhbn" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>lxnch50</div>
        <div>2 | 16 hours ago </div>
      </div>
      <label for="p2qmhbn" class="commentText"><p>My guess is network related, are you on WiFi? You can edit the config file and change the network setting from auto to predictive. You&rsquo;ll know right away if it fixes it. If it doesn&rsquo;t, change it back. Making a lot of random changes to fix an issue is a good way to create a problem.</p>

<p>%USERPROFILE%\Documents\My Games\Path of Exile 2\poe2_production_Config.ini</p>

<pre><code>[NETWORKING]
networking_type=predictive
</code></pre>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="p2qm0r9" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>ShadesBlack</div>
        <div>1 | 16 hours ago </div>
      </div>
      <label for="p2qm0r9" class="commentText"><p>Are you using Vulkan or DX12? Try switching that first. If that doesn&rsquo;t solve it, go through whatever optimization NVidia has for POE2 in their app, and then adjust from there if you&rsquo;re still struggling.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="p2qmkko" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>marslo</div>
        <div>1 | 16 hours ago </div>
      </div>
      <label for="p2qmkko" class="commentText"><p>Check the refresh rate of your moniter, does it match up with in-game settings.</p>

<p>Had the same issue after installing a new driver. Kept adjusting all the settings, switching between Vulkan and dx12. Shader. Etc. Then I checked my refresh rate in Windows settings. It was set a 60 instead of 180.</p>

<p>Runs like butter now.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="p2qznf1" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Rubbermonk</div>
        <div>1 | 15 hours ago </div>
      </div>
      <label for="p2qznf1" class="commentText"><p>I get that in the very first area too, usually seems network related. Hit f1 and watch the green bar, the stutters usually coincide with spikes in the network.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="p2r1ngk" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Sarcastic_San</div>
        <div>1 | 15 hours ago </div>
      </div>
      <label for="p2r1ngk" class="commentText"><p>I’ve been getting that stutter too! It seems like it’s network related but nothing has changed in my end.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="p2t0ua8" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>SheepherderKey4849</div>
        <div>1 | 6 hours ago </div>
      </div>
      <label for="p2t0ua8" class="commentText"><p>Looks like network related issues to me. I experience the same symptoms from tiem to time. Sometimes it helps switching to another gateway and/or opening the instance again with ctrl+click (on the waypoint or the entrance of an area). I have to repeat it multiple times occasionally but it almost always helps.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">

      <div class="commentHeader">

at least this is how the game behaves for me when that happens</p>
