      <a class="postTitle" href="https://i.redd.it/yh90tvwdzpyf1.jpeg"><p>What am I doing wrong in this game?</p>
</a>
    </h2>

<div class="commentAndChildren">
  <input id="nmnuopb" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>CounterStrikeRuski</div>
        <div>5 | an hour ago </div>
      </div>
      <label for="nmnuopb" class="commentText"><p>Your best bet is going to be watching a 30 minute video on how the game works. From the image and description, you are misunderstanding fundamental aspects of the game (not that they are explained very well).</p>

<p>Items come in a few different tiers: Normal (0 Affixes), Magic (1-2 Affixes), Rare (3+ Affixes), and Uniques (They are unique).</p>

<p>Items have an item level and a required level. The item level determines the affix tiers and combined they determine the required level.</p>

<p>Items can have a large number of different affixes, both offensive and defensive.</p>

<p>Your resistances decrease as you level up, with a final result of -60% to all elemental resistances. Your main defensive priority will be to reach 75% elemental resistances, so you will need to stack a total of 135% elemental resistances.</p>

<p>After getting your resistances capped, you will want to focus on two sources of defense. You are playing a deadeye so a combination of evasion and energy shield is your best bet.</p>

<p>For damage, you will want to focus on one damage type. Pick a main skill, see what type of damage it does, and stack that damage type and physical damage.</p>

<p>You can use runes on your gear to help patch holes in your build. If you are low on damage, add a rune to your weapon for more damage. If you are low on lightning resistance, add a lightning rune to your armour, etc.</p>

<p>Hope this helps!</p>
</label>
    </div>
  </label>

<div class="commentAndChildren">
  <input id="nmnzgng" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Berko_O7</div>
        <div>1 | 42 minutes ago </div>
      </div>
      <label for="nmnzgng" class="commentText"><p>First of all, thanks for the help. There&rsquo;s no problem with any of this; everything is clear. The only problem is the items. I&rsquo;ve only gotten a very limited number of uniques since the beginning of the game. I&rsquo;d like to use Diablo as an example, as I think they have a similar concept and I&rsquo;m more familiar with it. The most unique item drops can be obtained with aggressive play, as you know, in about 2-3 hours at most. But I&rsquo;ve been playing for 80 hours and haven&rsquo;t been able to get equipment I can really call a good build. I&rsquo;m actually looking for a way to do this. Even if I did, resistances would be a big problem. I&rsquo;m either too fragile, or the bosses hit hard. I&rsquo;m sure something&rsquo;s wrong, but I can&rsquo;t figure out what. Someone I played with recently destroyed the entire screen with a single skill. I liked that, but I don&rsquo;t have a single clue how to do it.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="nmo26u2" type="checkbox" checked/>
    <div class="comment">

        <div>Phleep99</div>
        <div>1 | 14 minutes ago </div>
      </div>
      <label for="nmo26u2" class="commentText"><p>Uniques can be thought of as &ldquo;Odds&rdquo; as they do strange things.  What you&rsquo;re after is the yellow rare gear.  Play around with the orbs you&rsquo;ve gathered to see if you can coax some resistances and other bonuses out of them.  As others have said - learn how to do it.  I am getting the impression you&rsquo;re reluctant to understand what you need to do.</p>
</label>
    </div>
  </label>
  
</div>

    
      
<div class="commentAndChildren">
  <input id="nmo1qmf" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>CounterStrikeRuski</div>
        <div>1 | 18 minutes ago </div>
      </div>
      <label for="nmo1qmf" class="commentText"><p>An item being unique does not mean it&rsquo;s good. Unique items are just that, unique. They can be good, bad, OP, or useless. Rarely will a build use more than 2-3 uniques, and some uniques don&rsquo;t drop for hundreds or even thousands of hours.</p>

<p>Rare items are typically much more powerful and useful than unique items. Rare items can be crafted and can be much more powerful than unique items. Good rare items are more often than not crafted using currency items, and the very best items will cost hundreds of divine orbs.</p>

<p>Good rare items will rarely, if ever drop. I have 800 hours and have only seen a handful rare items that are worth a couple divine orbs.</p>

<p>This late in the league you should be able to trade some of your currency for some half decent rare items, this will be the easiest path forward.</p>
</label>
