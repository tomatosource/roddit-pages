

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>

    <h2>
      <a class="postTitle" href="https://i.redd.it/yh90tvwdzpyf1.jpeg"><p>What am I doing wrong in this game?</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/yh90tvwdzpyf1.jpeg" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="nmnuopb" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>CounterStrikeRuski</div>
        <div>1 | 33 minutes ago </div>
      </div>
      <label for="nmnuopb" class="commentText"><p>Your best bet is going to be watching a 30 minute video on how the game works. From the image and description, you are misunderstanding fundamental aspects of the game (not that they are explained very well).</p>

<p>Items come in a few different tiers: Normal (0 Affixes), Magic (1-2 Affixes), Rare (3+ Affixes), and Uniques (They are unique).</p>

<p>Items have an item level and a required level. The item level determines the affix tiers and combined they determine the required level.</p>

<p>Items can have a large number of different affixes, both offensive and defensive.</p>

<p>Your resistances decrease as you level up, with a final result of -60% to all elemental resistances. Your main defensive priority will be to reach 75% elemental resistances, so you will need to stack a total of 135% elemental resistances.</p>

<p>After getting your resistances capped, you will want to focus on two sources of defense. You are playing a deadeye so a combination of evasion and energy shield is your best bet.</p>

<p>For damage, you will want to focus on one damage type. Pick a main skill, see what type of damage it does, and stack that damage type and physical damage.</p>

<p>You can use runes on your gear to help patch holes in your build. If you are low on damage, add a rune to your weapon for more damage. If you are low on lightning resistance, add a lightning rune to your armour, etc.</p>

<p>Hope this helps!</p>
</label>
    </div>
  </label>
  
</div>

</html>
