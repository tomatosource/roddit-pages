

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/lq0igdicywzg1.jpeg"><p>we’ll get ‘em next patch i guess</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/lq0igdicywzg1.jpeg" />

    <div class="commentList">
      
        
          
<div class="commentAndChildren">

    <div class="comment">
      <div class="commentHeader">

        <div>10 | 2 hours ago </div>
      </div>
      <label for="okmw14a" class="commentText"><p>They&rsquo;re both in the game already,  as trial of Sekhemas(sanctum) and trial of chaos(Ultimatum).</p>

<p>The thing is that they are methods of ascendancies in PoE, not endgame mechanics on the atlas, so they&rsquo;re not going to get the league mechanic reworks the others did.</p>

<p>I expect they&rsquo;ll probably get touched up whenever they get around to adding that mythical third ascendancy method we were supposed to get 3 leagues ago.</p>
</label>

<div class="commentAndChildren">

    <div class="comment">
      <div class="commentHeader">

        <div>1 | 12 minutes ago </div>
      </div>
      <label for="okndsup" class="commentText"><p>They said in the Q&amp; A portion of the livestream that they want to get those feeling awesome before they add in the 3rd one. The 3rd one apparently needs a lot of work to make it feel better so they may not get it in by 1.0 unfortunately because of time constraints.</p>

</div>

        <div>1 | 10 minutes ago </div>
      </div>
      <label for="okneebs" class="commentText"><p>They said they want them to be endgame activities too in the q and a</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="okmx7yv" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>True-Atheist</div>
        <div>4 | an hour ago </div>
      </div>
      <label for="okmx7yv" class="commentText"><p>Or ultimatum…. All I was hoping for is a third way to ascend. I am always scratching my head to why they chose these mechanics and force all of us to interact with sanctum and or ultimatum.</p>

<p>My personal bingo card is : Sanctum and ultimatum replaced with other mechanics for ascension.</p>

    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="okmy66s" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>hohobe</div>
        <div>2 | an hour ago </div>
      </div>
      <label for="okmy66s" class="commentText"><p>In Q&amp;A at the end of stream they said they didnt like how the trials currently are and are planning on improving them before 1.0, but they are not sure if a third trial will be added along with 1.0. They might add it and might not, apperiently its a big chunk work and they will have sacrifice other stuff if they wanted a third trial. But Sekhemas and Chaos Trials are deffinitly getting improved for 1.0.</p>

  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="okn4j3t" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>SprinklesLivid5332</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="okn4j3t" class="commentText"><p>they mentioned in the q&amp;a that the trials are lackluster and will be upgraded between .5 and 1.0</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="okn6bfj" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>TobyTheTuna</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="okn6bfj" class="commentText"><p>Issue i have with both of these systems is that the overarching strategy for both boils down to the same shit, pray to not get buried by excessive debuffs. Old lab was the opposite. You could go out of your way to and get rewarded with buffs but nothing was gonna potentially brick your run. From a psychological standpoint the former just feels bad. No amount of player agency or mechanical complexity can change that basic paradigm. I&rsquo;ll be very interested to see what they can come up with. Im willing to bet they will sit make minor changes to band aid but the underlying issue and the main reason why so many people hate it will remain the same unfortunately.</p>
</label>

  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="okmx6ww" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Gilith</div>
        <div>0 | an hour ago </div>
      </div>
      <label for="okmx6ww" class="commentText"><p>I&rsquo;m with her i absolutely hate both those mechanic you can guess how livid i was when i learnt it would be how to ascend in PoE 2, i didn&rsquo;t love but didn&rsquo;t hate the lab either, NOW I LOVE IT. Ascending in PoE 1 new leagues is a breath of fresh air compared to doing it in PoE 2. I hope the third way to do it will be something i like for now i just pay people to skip it.</p>

</div>

        
      
    </div>
  </body>
</html>
