      <label for="nc7c3rx" class="commentText"><p>From Chris Forsberg:</p>

<p>Here’s the situation: Brad Stevens went away on a week’s vacation and he left you the keys to the Celtics&rsquo; brand-new roster. Would he mind a deal? Well, of course not.</p>

<p>For Day 3 of <a href="https://www.nbcsportsboston.com/tag/ramp-to-camp/" target="_blank">our *Ramp to Camp* series</a>, we asked our panel to channel their inner Stevens and consider if there’s one more move they’d make for the Celtics before the season starts. Are our Armchair Brads comfortable with the team’s frontcourt depth chart? Do our Virtual Brads see Anfernee Simons as a long-term fit for this roster?</p>

<p>&hellip; Since no one ever knows what exactly the Bulls are doing, we’re calling them to see if they think Simons can help in their annual quest to land a play-in berth. Even after the Bulls sign Josh Giddey to a long-term deal, Chicago has ample room to take on salary. Would they take on Simons&rsquo; money for a package that includes something like Ayo Dosunmu, Jalen Smith, and Dalen Terry?</p>

<p><a href="https://www.nbcsportsboston.com/nba/boston-celtics/ramp-to-camp-trade-ideas-brad-stevens-anfernee-simons/729218/" target="_blank">Read more here.</a></p>

      <label for="nc7d7wp" class="commentText"><p>Not a trade but I think we should give omax a shot</p>

<p>Nobody on the roster who is a natural 4 and I actually still like his upside and think he just kinda got buried in an impossible frontcourt rotation in Dallas</p>

<p>I say waive Tillman and sign omax to a min, and give him 10-20 mins a night.  Worst case Dallas was right and we lose more games because of it and get a good pick, best case Dallas was dumb(wouldn’t be the first time) and there was something there and he would fill a valuable role for us</p>
