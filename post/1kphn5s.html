

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://v.redd.it/vlgwq00jyi1f1"><p>Omen of Bullshit and Lies</p>
</a>
    </h2>

    

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="msxths6" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Traditional_Dark_514</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="msxths6" class="commentText"><p>This has been happening to me too. Brand new instance, 100% the only omen I’ve used, and boom nothing happens. (Your title has me cracking up)</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="msxsv3q" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Skaitavia</div>
        <div>4 | an hour ago </div>
      </div>
      <label for="msxsv3q" class="commentText"><p>Did you already die once on that map and consumed an omen before? Omens are limited to once per map instance, despite us having multiple revives. Most likely an oversight.</p>

<p>And it’s one omen, period. So if you die and use an amelioration, you can’t use a resurgence when you revive.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="msxv74t" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>xadiant</div>
        <div>1 | 43 minutes ago </div>
      </div>
      <label for="msxv74t" class="commentText"><p>I am aware it doesn&rsquo;t trigger twice. This was a fresh instance, but hmm it does make sense in some cases. For some reason I thought each omen is unique, so I can trigger amelio and resurgence in one instance. Also true for reinforcement and other instance omens as well then.</p>

<p>Still I&rsquo;m 99% sure there are cases where the first omen doesn&rsquo;t trigger while it should. Thanks</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="msxsegj" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Flying_Mage</div>
        <div>3 | an hour ago </div>
      </div>
      <label for="msxsegj" class="commentText"><p>AFAIK, only one omen per instance can be used.</p>

<p>Having more than one active makes no sense.</p>

<p>And if you used up one already, none will trigger.</p>

<p>Personally I have Resurgence for pinnacle bosses and other high investment shit, and Amelioration for regular mapping. I don&rsquo;t think they ever failed me. I mean, Resurgence can fail if you get big hit and just die, but this is expected.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="msxugm9" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>gregy666</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="msxugm9" class="commentText"><p>i died with a single omen of amelioration in my inventory 3 times yesterday without it getting used</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="msxscl0" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>KislorodOzonovich</div>
        <div>-1 | an hour ago </div>
      </div>
      <label for="msxscl0" class="commentText"><p>&ldquo;Only one omen can be triggered from combat in each instance&rdquo;.</p>

<p>Probably, you already used an omen in this instance.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="msxss35" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>xadiant</div>
        <div>0 | an hour ago </div>
      </div>
      <label for="msxss35" class="commentText"><p>I know, this was a fresh instance. frequently it just doesn&rsquo;t trigger randomly, especially in one shots. Sometimes it triggers just before I hit 0 hp. I really need to record maps from start to finish. I wonder if some things aren&rsquo;t considered combat damage</p>
</label>
