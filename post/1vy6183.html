

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://www.reddit.com/r/PathOfExile2/comments/1vy6183/i_died_in_a_ge/"><p>I died in a GE..</p>
</a>
    </h2>

    
    <div class="selfPostContainer">
      <p>Am i screwed? I died during an aldurs saga GE. My friend has joined and helped but cant open the renmants, is it bricked?</p>

    </div>
    

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="p5u9dlb" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>-mors-</div>
        <div>1 | 3 hours ago </div>
      </div>
      <label for="p5u9dlb" class="commentText"><p>That map and it&rsquo;s rewards are gone, yes. Not all aldurs effected maps</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="p5u9zx0" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>ExistingMouse5595</div>
        <div>1 | 3 hours ago </div>
      </div>
      <label for="p5u9zx0" class="commentText"><p>The map is perma bricked.</p>

<p>Your friend can join the map and kill mobs but won’t be able to open any of the remnants.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="p5ucgup" type="checkbox" checked/>

      <div class="commentHeader">
        <div>TasteOfChaos52</div>
        <div>1 | 3 hours ago </div>
      </div>
      <label for="p5ucgup" class="commentText"><p>Dumb question, what does an aldurs saga do to the maps?</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="p5ug2ap" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>gennciiq</div>
        <div>1 | 3 hours ago </div>
      </div>
      <label for="p5ug2ap" class="commentText"><p>Adds some unique expedition modifiers to Grand Expeditions, the most sought after are &ldquo;all remnants have +x minimum sockets&rdquo; which can roll 5, 6, or 7. If you get that you would reroll every shit remnant and hope for something good</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="p5ugdbi" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>TasteOfChaos52</div>
        <div>1 | 3 hours ago </div>
      </div>
      <label for="p5ugdbi" class="commentText"><p>That makes sense! Thanks.</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

    
  </div>
  
</div>

        
      
    </div>
  </body>
</html>
