       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;

}

h2 {

  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;

.subName {
  text-decoration: none;

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
}

.selfPostContainer * {
  color: white;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

<div class="commentAndChildren">

        <div>2 | 2 hours ago </div>
      </div>
      <label for="mcrjfdd" class="commentText"><p>That&rsquo;s very cool, I&rsquo;m curious how much you can do in this game with how little gear and deaths, if you were a great player. To me that&rsquo;s what makes the challenge of dark souls so cool, of you&rsquo;re godlike you can just survive to eventually wear things down. I&rsquo;m glad I didn&rsquo;t see any enrage timers in this game while playing.</p>

<div class="commentAndChildren">
  <input id="mcrhgdi" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>isfooTM</div>
        <div>3 | 2 hours ago </div>
      </div>
      <label for="mcrhgdi" class="commentText"><p>Rules of the self-made challenge:</p>

<ul>
<li>play as warrior</li>
<li>no stash at start</li>
<li>no trade</li>
<li>no weapons, armour, jewellery, flasks</li>
<li>no jewels</li>
<li>no offensive skills from &ldquo;Elemental&rdquo; or &ldquo;Occult&rdquo; tabs</li>
</ul>

<p>The magicless rule is needed, because otherwise the best strategy would be to just play a worse Sorceress.</p>

<p>Raw footage of the whole Act 1: <a href="https://youtu.be/PQFFDeoeA6k" target="_blank">https://youtu.be/PQFFDeoeA6k</a></p>

<p>Passive tree: <a href="https://maxroll.gg/poe2/passive-tree/dr48y005" target="_blank">https://maxroll.gg/poe2/passive-tree/dr48y005</a></p>

<p>Gems:</p>

<ul>
<li>Killing Palm (lvl 4) - Concentrated Effect + Lightning Infusion (Weapon set 1)</li>
<li>Shockwave Totem (lvl 5) - Brutality + Martial Tempo (Weapon set 2)</li>
<li>Shockwave Totem (lvl 5) - Overabundance + Persistance (Weapon set 2)</li>
<li>Staggering Palm (lvl 3) - Fire Infusion (Weapon set 1)</li>
<li>War Banner (lvl 4) - Magnified Effect</li>
</ul>

<p>The fight actually ended up being easier than I expected initially. Ofc it still was very hard and took 2 hours, but I had a couple of close attempts and actually only before the very last try I realized I was playing it wrong with only using one totem for single target boss damage.</p>

<p>I didn&rsquo;t theorycraft further acts yet so I have no idea how hard will it be, but I think it will be very doable.</p>
