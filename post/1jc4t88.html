

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://www.reddit.com/gallery/1jc4t88"><p>Lvl to skill doesnt add?</p>
</a>
    </h2>

    

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="mhzcjns" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>fotank</div>
        <div>3 | 2 hours ago </div>
      </div>
      <label for="mhzcjns" class="commentText"><p>Does it not have to be your primary weapon for the effect?</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="mhzde3k" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>lndestroyer</div>
        <div>2 | 2 hours ago </div>
      </div>
      <label for="mhzde3k" class="commentText"><p>It does.</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="mhzdgah" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>The_Jeester</div>
        <div>3 | 2 hours ago </div>
      </div>
      <label for="mhzdgah" class="commentText"><p>Because you equipped it on Slot 2.</p>

<p>You don&rsquo;t get benefits for weapons that you are not using but you can assign different skills to different weapon slots.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="mhzcmm5" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>MrZwink</div>
        <div>1 | 2 hours ago </div>
      </div>
      <label for="mhzcmm5" class="commentText"><p>if you hover over the skill, youll see it does add a + to the skill, unequipping will also make your dps change.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="mhzd9uv" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Hugzo</div>
        <div>1 | 2 hours ago </div>
      </div>
      <label for="mhzd9uv" class="commentText"><p>I see that, but only if i put the weapon at slot 2. Then i have to put spark at slot 2 and hold L2 every time i attack?</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="mhzdvpj" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>MrZwink</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="mhzdvpj" class="commentText"><p>On the details pane there&rsquo;s a little button where you can set which weapon set to use with this spell.</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

    
  </div>
  
</div>

        
      
    </div>
  </body>
</html>
