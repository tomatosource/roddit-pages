      <label for="nyay9zk" class="commentText"><p>Crafting steps</p>

<p>Step 1: buy +3 spell base to fracture, ideally with 3 mods+desecrated mod for 1 in 3 chance but any amount of mods can work, depends on price</p>

<p>Step 2: annul until 2 mods then chaos spam for t1 cast speed</p>

<p>Step 3: omen of dextral exaltation+perfect exalt looking for either t2+ crit chance/damage or rarity, if fail <sup>50</sup>&frasl;<sub>50</sub> annul to try again otherwise go back to step 2</p>

<p>Step 4: add defence quality then use omen of catalysing exaltation and perfect exalt looking for t2+ increased energy shield</p>

<p>Step 5: plain exalt into omen of sinistral crystallisation+perfect essence of enhancement, if step 4 failed skip the exalt, then try step 4 again for a 2nd prefix</p>

<p>Step 6: if step 5 was a success and we now have global defences/increased es do omen of the blackblooded+preserved collarbone with omen of abyssal echoes looking for increased es from equipped body armor and craft is done. if failure or looking for different mod then omen of light and try again.</p>

<p>Step 7: if step 5 failed and you have a dead prefix and global defences use omen of sinistral crystallisation+essence of the abyss to try and overwrite the dead mod. if you hit the global defences then omen of sinistral crystallisation+perfect essence of enhancement to try and get the two essence mods and an open prefix, alternating them until its done.</p>

<p>Step 8: one final cheap chance at hitting increased es by doing step 4 again, if that fails its time to annul</p>

<p>Step 9: omen of sinnistral annulment trying to 1 in 3 hit the dead prefix, if it misses do step 7 again until theres two essence mods and an open prefix, then do step 4 again. if success then back to step 6.</p>

<p>Step 10: quality and divine a few times</p>
