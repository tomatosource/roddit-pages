.commentText,
.commentText * {

  color: wheat;

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

<p>I released a video earlier today for my wind dancer titan. I was playing a bleed style originally. One of the commenters told me to check out this armour explosion / corrosion tech inside wind dancer. When combined with Herald of Plague as you can see&hellip;its absolutely insane!!!</p>

<p>It&rsquo;s fairly easy getting gem skill level 40 with wind dancer. Dual wielding 2 handed maces with melee skills makes this really reasonable on a budget. Add on The Vertex Helmet and you dont have to worry about the insane cost of stat stacking. I&rsquo;ve cleared Arbiter+2 with the budget I had and it def can clear +4.</p>

<p>I&rsquo;ve updated my mobalytics if you are interested in trying this out. The video guide is out dated but the written guide has been changed. This poison spread armour explosion technique should work in a lot of different skills though :)</p>
