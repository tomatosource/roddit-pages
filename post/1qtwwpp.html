

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/8niaqtbyf3hg1.jpeg"><p>Is my staff good or…?</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/8niaqtbyf3hg1.jpeg" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="o35wdkp" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>DashOfSalt84</div>
        <div>1 | 40 minutes ago </div>
      </div>
      <label for="o35wdkp" class="commentText"><p>I mean, you don&rsquo;t need to min-max every single thing and if you&rsquo;re blasting T15s then you probably don&rsquo;t need to upgrade even more. I&rsquo;m guessing, depending on your setup, a &lsquo;gain as X dmg&rsquo; setup will yield higher dmg with the same +levels. But so what?</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="o35wg14" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Dear-Fuel-2706</div>
        <div>1 | 40 minutes ago </div>
      </div>
      <label for="o35wg14" class="commentText"><p>I think most oracles prefer wand rn and the fact you used a whittling on a 20 div staff makes me question your ability to judge items.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="o35x2i2" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Dear-Fuel-2706</div>
        <div>1 | 36 minutes ago </div>
      </div>
      <label for="o35x2i2" class="commentText"><p>Gain damage would be a better prefix and suffixes need crit chance / cast speed / crit damage</p>
</label>
    </div>
  </label>
  
</div>

    
      
<div class="commentAndChildren">
  <input id="o361ccn" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>diezel78</div>
        <div>1 | 15 minutes ago </div>
      </div>
      <label for="o361ccn" class="commentText"><p>as much as i love poe… im not good at the game…</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="o35wooh" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>BeefarmRich</div>
        <div>1 | 38 minutes ago </div>
      </div>
      <label for="o35wooh" class="commentText"><p>Here is all possible  staff modifiers for you <a href="https://poe2db.tw/us/Staves#ModifiersCalc" target="_blank">https://poe2db.tw/us/Staves#ModifiersCalc</a>  . The best staff will have spell dmg , and no + mana on prefix, and suffixes - level spells, cast speed and crit. The rest are trash.</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
