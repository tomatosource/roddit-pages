

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://www.twitch.tv/videos/2536955202"><p>Build showcase for my meme 1 shot infernalist build</p>
</a>
    </h2>

    

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="n827xed" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>nilsh1985</div>
        <div>2 | 8 hours ago </div>
      </div>
      <label for="n827xed" class="commentText"><p>Thanks for sharing 😊</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="n83fk6j" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>sps41</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="n83fk6j" class="commentText"><p>Awesome build, and great crafting. Some questions/suggestions (you&rsquo;ve probably already thought of these and have good reasons they wouldn&rsquo;t work, so keen to avoid wasting time if so!):</p>

<p>For crit weakness application would Frost Wall not be more optimal than embers? On decent sized bosses you&rsquo;ll hit with well over the 20 crystals needed to cap it, and it makes the timing somewhat less finely balanced as it can be pre-cast along with the temp curse. Wall could also be supported with font of rage for an extra 15-20% more damage boost.</p>

<p>Is there any way you could add a war banner in? You&rsquo;re in the boss presence for long enough to build valour, so could probably squeeze another 30% more multiplier from that.</p>

<p>Having switched to Frost Wall you could add scattershot to the PB instead of hourglass. 3 beams at 35% less damage == 3x0.65 damage which is a 95% more boost. You need to be close enough to shotgun them all, but that&rsquo;s probably going to be the case anyway here.</p>

<p>The above together should almost triple damage on the shot I think.</p>

<p>Love the meme build though, and thanks so much for sharing the process as well as the outcome!</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
