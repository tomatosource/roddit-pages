

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>

<div class="commentAndChildren">

<div class="commentAndChildren">

      <label for="n2b8rl0" class="commentText"><p>Nope, it does only one of four things, change values, add an affix, add a socket or do nothing</p>
</label>

</div>

    
      
<div class="commentAndChildren">
  <input id="n2ae686" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>jcready92</div>
        <div>1 | 8 hours ago </div>
      </div>
      <label for="n2ae686" class="commentText"><p>I know for a fact it has the capability of changing any of the values, I just don&rsquo;t know if it can do that AND give you the physical % like it did.  If I had to guess I would say no.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="n2bao73" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Whytefang</div>
        <div>1 | 5 hours ago </div>
      </div>
      <label for="n2bao73" class="commentText"><p>The wiki has a full breakdown here:</p>

<p><a href="https://www.poe2wiki.net/wiki/Corrupted#Corruption_outcomes" target="_blank">https://www.poe2wiki.net/wiki/Corrupted#Corruption_outcomes</a></p>

<p>But basically for unique items like this there are four options:</p>

<ol>
<li>Nothing happens</li>
<li>Add a special enchantment</li>
<li>Add a socket</li>
<li>Divine the item to roll the values of all the rollable mods on it, then apply a random multiplier between 0.78x-1.22x (and I think this is on an individual mod level, but not sure).</li>
</ol>

<p>The vaal picks one of these outcome, so getting the enchant means you can&rsquo;t get the divine option.</p>
</label>

      <label for="n2aelwz" class="commentText"><p>For uniques, Vaal orbs can do one of 4 things. 1) enchant, which is what you got with the physical damage. 2) add an additional rune socket. 3) Act as a divine orb that can modify things outside its max or minimum numbers by 20%. And lastly, 4) nothing. Using an omen of corruption can make sure the 4th doesn’t happen. You got an enchantment damage mod added.</p>
