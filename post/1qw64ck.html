

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://www.reddit.com/gallery/1qw64ck"><p>I ran 144 Sekhemas, so you do not have to do it.</p>
</a>
    </h2>

    

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="o3oijv4" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>sps41</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="o3oijv4" class="commentText"><p>This is wonderful data collection, many thanks for sharing with the community.</p>

<p>The relic drop rates are consistent with my own observations over this league (though I have not been as rigorous in my data collection as you!).</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="o3ojrxz" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Earthboundplayer</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="o3ojrxz" class="commentText"><blockquote>
<p>I don&rsquo;t quite understand why desperate is 2x as common than the changing</p>
</blockquote>

<p>Because you can use vase relics to get against the darkness, which are quite powerful. Every other unique relic reward is pretty shit other than temporalis. I guess the devs have more important things to do than balancing these terrible sekhema uniques.</p>

<p>Which is why the best way to farm sekhemas is with desperate alliances to acquire those against the darknesses. It&rsquo;s about 35 div of guaranteed profit per run as of right now. But you have a chance of dropping desperate alliance (especially if you run relic quant) and the profits soar to 75 div per run. Not to mention the chance of dropping multiple vases.</p>

<p>On top of that, you will, with reasonable frequency, find against the darknesses that are worth 10s or 100s of times more divines than typical. Usually if they have the spirit mod or two gain as extra mods.</p>

<p>It&rsquo;s one of the best farming methods in the game and it&rsquo;s going to remain that way (largely because most people seem to really dislike it).</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
