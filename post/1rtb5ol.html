

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://www.reddit.com/gallery/1rtb5ol"><p>What am I missing here?</p>
</a>
    </h2>

    

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="oacwa7z" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>El_Bito2</div>
        <div>6 | 2 hours ago </div>
      </div>
      <label for="oacwa7z" class="commentText"><p>And all &ldquo;increase physical damage&rdquo; are also applied after conversion. Not sure about increased attack damage, is it applied before or after conversion?</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="oacxjdz" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>MixPlan</div>
        <div>3 | 2 hours ago </div>
      </div>
      <label for="oacxjdz" class="commentText"><p>If it&rsquo;s in a weapon then those are local modifiers, which means it applied to base damage of the weapon.</p>

<p>If it&rsquo;s in a passive tree or jewel (global physical attacks) then it applied after conversion.</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="oacwg85" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Stupendasaur</div>
        <div>8 | 2 hours ago </div>
      </div>
      <label for="oacwg85" class="commentText"><p>Added extra damage happens before any multipliers are done to prevent you from double dipping on them. Getting 21% extra chaos from your multiplied phys / ele and then adding any chaos multipliers on top would get really nutty really fast.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="oacwplb" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>VarianArdell</div>
        <div>-1 | 2 hours ago </div>
      </div>
      <label for="oacwplb" class="commentText"><p>and yet that&rsquo;s how it works in PoE1</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="oacx1vj" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>not_bloonpauper</div>
        <div>-3 | 2 hours ago </div>
      </div>
      <label for="oacx1vj" class="commentText"><p>no, that&rsquo;s not how it works in poe1. if you have 100 phys -&amp;gt; 100 chaos and 100% global inc phys and 100% global inc chaos, you deal 200 chaos. you don&rsquo;t ever double dip except specifically &ldquo;gain ele as chaos&rdquo; which is a very rare mod.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="oacydw4" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>SaltEngineer455</div>
        <div>7 | an hour ago </div>
      </div>
      <label for="oacydw4" class="commentText"><p>Except you do.</p>

<p>100 phys -&amp;gt; 100 chaos and 100% phys and 100% inc chaos brings you to 300 chaos.</p>

<p>When the 100 phys gets converted to chaos, you get 100 tagged as both phys AND chaos, so mods apply to both.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="oacyw36" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Adghar</div>
        <div>6 | an hour ago </div>
      </div>
      <label for="oacyw36" class="commentText"><p>Well, that&rsquo;s not double dipping, though. That&rsquo;s just permissive bonus application.</p>

<p>EDIT: For whatever reason, the original commenter only posed a hypothetical about double dipping, e.g. for your example it would be 400 chaos instead of 300 chaos. Perhaps he didn&rsquo;t play POE1 so isn&rsquo;t aware that there&rsquo;s a middle ground between &ldquo;only destination type applies&rdquo; and &ldquo;bonuses apply multiple times&rdquo;.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="oad1le1" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>SaltEngineer455</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="oad1le1" class="commentText"><p>After the removal of divergent Boneshatter, I don&rsquo;t think there is any double-dipping left in the game. IIRC, double-dipping is when X influenced Y, and Y influences X up to convergence.</p>

<p>In all games I played - LE, GD, PoE1, PoE2 - only the flat damage gets converted/extra-ed. But only in PoE1 you actually keep the old damage types until the very end of the calculations, and it&rsquo;s why I think the PoE1 system is the best. If I deal 20% of phys as extra fire, it should mean that I actually deal 20% of my total phys damage as extra fire.</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

</div>

</div>

</div>

</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="oacvhex" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Material_Exercise_10</div>
        <div>3 | 2 hours ago </div>
      </div>
      <label for="oacvhex" class="commentText"><p>21% of damage before all modifiers!!! If all your modifiers increase elemental damage, chaos damage doesnt get benefit from them!</p>
</label>
    </div>
  </label>
