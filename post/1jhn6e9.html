

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/gn77myqd5cqe1.jpeg"><p>Nifty little charm</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/gn77myqd5cqe1.jpeg" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="mj8j1ky" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>CE94</div>
        <div>22 | 12 hours ago </div>
      </div>
      <label for="mj8j1ky" class="commentText"><p>It&rsquo;s bad. You don&rsquo;t actually get any more IR from the monster you kill to trigger it, only subsequent monsters in the short time after it triggers</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">

        <div>3613robert</div>
        <div>1 | 12 hours ago </div>
      </div>

    </div>
  </label>
  
</div>

    
      
<div class="commentAndChildren">
  <input id="mj8mjb7" type="checkbox" checked/>

      <div class="commentHeader">
        <div>NaturalCard</div>
        <div>-6 | 12 hours ago </div>
      </div>
      <label for="mj8mjb7" class="commentText"><p>Got a source on that?</p>

<p>From personal experience it certainly seems to effect the first drop as well.</p>

    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="mj8nhxt" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>DependentUnlikely149</div>
        <div>5 | 12 hours ago </div>
      </div>
      <label for="mj8nhxt" class="commentText"><p>Theres a video on it on YouTube,  unless at some point it got patched it doesn&rsquo;t work on the first kill / drop</p>
</label>
    </div>
  </label>
  
</div>

    
      
<div class="commentAndChildren">
  <input id="mj8ped9" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>vid_23</div>
        <div>1 | 12 hours ago </div>
      </div>
      <label for="mj8ped9" class="commentText"><p>Every charm works like that. Effects activate when conditions met and only work after that, but not with what activated the effect. Exceptions happen like the freeze immunity, but the stun one does not prevent you from getting stunned for the first time for example. It only prevents subsequent stuns</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

    
  </div>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="mj8iv3h" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>CMDRDrazik</div>
        <div>10 | 12 hours ago </div>
      </div>
      <label for="mj8iv3h" class="commentText"><p>Use one of the blue orbs on it.  It has another attribute you can unlock.</p>

<p>The best ones refill charges when you kill a monster. So the charm refills constantly all map.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="mj8jf9g" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>ladylegion1</div>
        <div>2 | 12 hours ago </div>
      </div>
      <label for="mj8jf9g" class="commentText"><p>Thanks I will try that</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="mj8pryn" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Greyh4m</div>
        <div>2 | 12 hours ago </div>
      </div>
      <label for="mj8pryn" class="commentText"><p>I&rsquo;m wearing three of them. They only proc one at a time, in case anyone was wondering.</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
