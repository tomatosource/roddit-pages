

<html>

    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {

}

.postList {

.post {

}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;

}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;

  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {

}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;

}

  left: 0;

  background: #111;

}

.tweetContainer {

    <h2>
      <a class="postTitle" href="https://i.redd.it/kccods94urlh1.jpeg"><p>Help crafting higher +1 to level of all phyysical spells skills</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/kccods94urlh1.jpeg" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="p62mld5" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>KiefScoop</div>
        <div>2 | 5 hours ago </div>
      </div>
      <label for="p62mld5" class="commentText"><p>Divines only reroll value ranges within a given modfier tier. That +1 modifier is T5 and there is no roll range so divine would do nothing to that modifier. I&rsquo;m not a crafter so I don&rsquo;t know if there&rsquo;s a way to do it, but if there is it would likely be expensive enough to warrant starting a craft on a completely different staff instead.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="p62kmcd" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>PoE_Acronym_Bot</div>
        <div>1 | 5 hours ago </div>
      </div>
      <label for="p62kmcd" class="commentText"><p>I noticed some Path of Exile keywords in this post:</p>

<ul>
<li><strong>SSF</strong> - Solo Self-Found (<a href="https://www.poe2wiki.net/wiki/Solo_Self-Found" target="_blank">Wiki</a>)</li>
</ul>

<hr>

<p>^(I am a bot.) ^| <a href="https://acronym.sidia.net/acronyms/pathofexile2" target="_blank">^(All acronyms)</a> ^| <a href="https://acronym.sidia.net/suggest/pathofexile2" target="_blank">^(Suggest)</a></p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="p62m5bq" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>FartTheClown316</div>
        <div>1 | 5 hours ago </div>
      </div>
      <label for="p62m5bq" class="commentText"><p>The tier of the modifier is too low, so if you divine it, it&rsquo;ll just reroll the other modifier values on the item.</p>

<p>I have no idea if there is a reliable way to increase the tier, so I would recommend using a different item with a higher tier modifier. iirc ilvl 81 has an opportunity +6 or +7 to spell skills.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="p62n7vn" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>CheeseLoverMax</div>
        <div>2 | 4 hours ago </div>
      </div>
      <label for="p62n7vn" class="commentText"><p>Not possible to increase the all physical spell levels mod, best bet would be find the essence that gives +5 level of all spell skills and try to annul (by gamble slamming or using suffix annul omens) the current +1 off so you can use the essence or just start a new craft completely and find a better base</p>

<p><a href="https://poe2db.tw/Perfect_Essence_of_Sorcery#PerfectEssenceofSorceryCurrencyPerfectEssenceCaster" target="_blank">https://poe2db.tw/Perfect_Essence_of_Sorcery#PerfectEssenceofSorceryCurrencyPerfectEssenceCaster</a></p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="p62ocer" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>ScandyAndy</div>
        <div>1 | 4 hours ago </div>
      </div>
      <label for="p62ocer" class="commentText"><p>There is no way to change the tier.  The only way to do it would be to chaos/anull/fracture it out.  There are omens you can use to make it more likely to get either a prefix or a suffix.  None of this is reccomended as it is still based on RNG and you&rsquo;re more likely to take out the desireable modifiers as you are the undesireable ones.  Then you&rsquo;d have to get a higher lever of phsyical spell skills or use an expensive essence</p>

<p>TLDR - it&rsquo;s better to craft from a base that already has the most desireable rare roll on it and multiple prefix and suffix open modifier slots still available.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="p62omf0" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Sulleyy</div>
        <div>1 | 4 hours ago </div>
      </div>
      <label for="p62omf0" class="commentText"><p>Sadly the same mods with different tiers are essentially completely different modifiers. You have tier 5 and there is no way to reliably change it to tier 1.</p>

<p>In SSF the perfect essence of sorcery is your best bet. Or find a staff that already has a good tier of spell skills</p>
</label>
    </div>
  </label>
  
</div>
