       * {
  margin: 0;
  padding: 0;

*,

  box-sizing: border-box;

html {

body {

  padding: 32px;

  padding: 32px;
  color: #c39429;
}

h2 {

}

input[type="checkbox"] {

.subName {

.postList {
  display: flex;

  align-items: center;

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

      <label for="n6vfmhk" class="commentText"><p>Ideally, it would have been great to keep them all, but realistically, I don&rsquo;t think think Harden develops into the MVP caliber player he became if he continued to play with both Durant &amp; Westbrook.</p>

<p>At their peaks, for a stretch of like 5 years, those 3 guys were all like top 5 in the league in usage rate. There&rsquo;s only 1 ball to go around &amp; when so much of your game relies on the ball being in your hand, it&rsquo;s hard to maximize your effectiveness when playing with 2 other guys who also need the ball in their hand &amp; are already superstars.</p>

<p>Like I said, ideally, it would have been best to keep everybody, but even though Harden went on to become a much better player, I believe keeping Ibaka as the 3rd guy was more important than keeping Harden.</p>

<p>Harden was the better talent, but Ibaka was the much better fit &amp; was more in line with what they needed. They didn&rsquo;t win a chip with that core, but I still think that was more due to injury instead of roster construction.</p>

<ul>
<li>2012: make the finals</li>
<li>2013: Westbrook injured in playoffs</li>
<li>2014: Ibaka injured in playoffs. Expected to miss the rest of the postseason. Misses 1st 2 games of conference finals. Without him, okc gets blown out. He manages to come back early (not at 100%) and okc manages to win the next 2 games, but proceed to lose the series. Who&rsquo;s to say how that series could have gone if he was at 100% the whole series? Even coming back before he was fully healthy, the team played much better than without him.</li>
<li>2015: KD injured most of the year. OKC big 3 misses a combined 88 games, and they narrowly miss the playoffs by 1 game.</li>
<li>2016: Manage to get a 3-1 lead against the defending champs and the team that just set the regular season win record right after defeating the 67-15 spurs. Then, they managed to choke that lead away. They didn&rsquo;t win a championship this year, but based off that performance, there&rsquo;s no way you can say they weren&rsquo;t capable of doing so.</li>
<li>2017: They core gets blown up after KD joined the warriors.</li>
</ul>
</label>
