.commentText,

.commentHeader {

  justify-content: space-between;
  color: #c39429;

.postTitle {
  text-decoration: none;

.commentAndChildren > .commentList {

.commentAndChildren label .comment .commentText {

.selfPostContainer {

  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}
