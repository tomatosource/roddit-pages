    <h2>
      <a class="postTitle" href="https://i.redd.it/g7x0q4o5rb1g1.png"><p>Quiver Craft Help</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/g7x0q4o5rb1g1.png" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="nox03lw" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>MechBlitz</div>
        <div>5 | 4 hours ago </div>
      </div>
      <label for="nox03lw" class="commentText"><p>Crit Quiver Craft: ilvl 75 Visceral Quiver - (Cheap method)</p>

<p>Step 1: pickup or buy white quivers. Perfect Transtemute+Aug. You&rsquo;re looking for any t1 flat or t2 bow dmg/proj speed with a good suffix (crit dmg, crit chance, +2 lvl or attack speed).</p>

<p>Step 2: Once you obtain your 2 mod magic quiver, perfect regal with Omen of homogenising coronation. You&rsquo;re hoping it hits a prefix, flat damage or bow damage or projectile speed. If it hits a suffix, you&rsquo;ll have to greater exalt orb the prefix and see if the craft is still worth finishing (would only finish if it hits t3 or better flat or proj speed/bow dmg).</p>

<p>Step 3: Omen of Sinistral necromance + preserved jawbone and also have an abyssal echoes.
You&rsquo;re looking to unveil high flat, bow dmg or projectile speed (if you fail to get anything good I would try to annul, this step can brick the crafting process, not worth using omen of light).</p>

<p>Step 4: Use omen of homogenising exaltation + omen of Greater exaltation + Greater exalted orb. If your quiver is all t1 mods, you can also opt to use perfect exalted orb instead.
Quiver is now done with 6 good modifiers.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nowzv9o" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Mirosworld</div>
        <div>1 | 4 hours ago </div>
      </div>
      <label for="nowzv9o" class="commentText"><p>Damage with bow skills gives you the &lsquo;damage&rsquo; tag, so homogenizing can roll any of the 4 damage types, no clue how to avoid that, and each of them has 4 tiers over ilvl 50 which is pretty meh. The other prefix should be desecrated, ideal would be t1 lightning dmg+t1 bow skill dmg+t1 proj speed(which you can&rsquo;t get cause it&rsquo;s ilvl 82) for prefixes. Suffixes however are easy, double slam homo perf exalt to get <sup>2</sup>&frasl;<sub>3</sub> crit/critdmg/attackspeed, if you wanna super-optimize, can suffix annul till you got both crit rolls at t1.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nox2kdp" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Fit_Humor_3269</div>
        <div>1 | 4 hours ago </div>
      </div>
      <label for="nox2kdp" class="commentText"><p>You got the +2 fractured ✅</p>

<p>Look for the attack tag any tier, any mod.
perfect exalt+sinistral+greater exaltation look for critical damage bonus and critical hit chance(may take a few attempts, annul and repeat until you get the 2 crit mods t1.
Afterwards you got all your suffixes done (double T1 + fractured)
You whittle the 1 prefix until you get either T1 lightning-T1 bow skills or T1 projectile speed.
Exalt again and repeat the whittling when you get the 2nd t1 prefix you ancient rib and look for the 3 prefix.
Done ✅</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nox3axb" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Real-Entrepreneur990</div>
        <div>1 | 4 hours ago </div>
      </div>
      <label for="nox3axb" class="commentText"><p>I&rsquo;m no expert on quivers but I think what you&rsquo;re after here is crit tags on the suffixes and adds damage on the prefix?</p>

<p>You could maybe:</p>

<ol>
<li>exalt + dextral</li>
<li>essence of the abyss + dextral (reveal/repeat/remove till you force the crit tag, about a 1 in 5 chance to see crit tag I think)</li>
<li>perfect exalt + dextral + homo (you have a <sup>50</sup>&frasl;<sub>50</sub> chance to roll attack speed or one of the two other crit mods)</li>
<li>perfect exalt + homo + greater omen (pray you dodge the accuracy, decent chance tbh)</li>
</ol>

<p>I just looked up Fubgun&rsquo;s mobalytics LA DE and tried to craft that bow, but projectile speed seems like too much of a crap shoot.  Might have been better to take the hit and roll T2 damage with bow skills via essence of horror somewhere along that craft path.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="noxcdkh" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>zedd300</div>
        <div>1 | 3 hours ago </div>
      </div>
      <label for="noxcdkh" class="commentText"><p>This is the ideal base combo.</p>

<p>Homo perfect great ex suffix = 2 of 3 Crit/Crit/Attack Speed. All are good.</p>

<p>Then you can Homo Perfect Greater for double Flat.</p>

<p>Cheap way to guarantee pretty solid. If you want to fish for T1 flats, you can desecrate/light spam before you add prefixes. Only down side is adding 1 flat leaves you open to Accuracy on the homo.</p>
</label>
    </div>
  </label>
  
</div>
