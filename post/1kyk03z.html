

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/m2hwnr54xr3f1.png"><p>Fixed this useless notable</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/m2hwnr54xr3f1.png" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="muxy6dj" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Bewarden</div>
        <div>1 | 36 minutes ago </div>
      </div>
      <label for="muxy6dj" class="commentText"><p>I still don&rsquo;t understand why they added a downside to this keystone. Or to a lot of passives. I rather have them create a new function. Instead of rolling, charge forward with no iframe. I don&rsquo;t know, anything better this.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="muxzg0m" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>K-J-</div>
        <div>1 | 30 minutes ago </div>
      </div>
      <label for="muxzg0m" class="commentText"><p>This downside is fine. The issue is movement speed is too low and slow effects / body blocking is too common.</p>

<p>It&rsquo;s a great node later on when you&rsquo;ve got high ms boots and enough dps/aps to clear the trash, but it&rsquo;s a trap early on</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="muxw7mt" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>warmachine237</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="muxw7mt" class="commentText"><p>Really? That could be a notable with 8% movement speed for the same effect. It doesn&rsquo;t inherently change how your character functions.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="muxxbr5" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>zangor</div>
        <div>1 | 40 minutes ago </div>
      </div>
      <label for="muxxbr5" class="commentText"><p>Pshhh. 8% movement speed. Expect 12 “increases light radius by 0.000005%” regular nodes to get to that node. In the shape of a dick.</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="muxz62t" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>TheAscentic</div>
        <div>1 | 31 minutes ago </div>
      </div>
      <label for="muxz62t" class="commentText"><p>This should 100% be in game. Lots of little fixes like this could be made.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="muy0g15" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Sunny_Beam</div>
        <div>1 | 25 minutes ago </div>
      </div>
      <label for="muy0g15" class="commentText"><p>I use this notable and I love it personally. Dodge rolling is useless after a certain point of character power (assuming dodge isn&rsquo;t part of your build itself)</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
