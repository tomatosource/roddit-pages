      <label for="mx9taj4" class="commentText"><p>Notable Excerpts:</p>

<blockquote>
<p>Celtics star Jaylen Brown on Wednesday underwent an arthroscopic debridement procedure on his right knee and is expected to participate in training camp without limitation.</p>

<p><strong>A league source said that the procedure was done to alleviate pain in the partially torn meniscus that slowed Brown during the final few months of the season. A debridement procedure is a minimally invasive surgery in which the damaged part of the meniscus is trimmed or smoothed, with a shorter recovery time than a full repair.</strong></p>

<p><strong>The source said that Brown waited nearly a month to have the procedure after the Celtics’ conference semifinal loss to the Knicks because he wanted to consult with doctors about his options.</strong></p>

<p>Brown missed four games in March because of a bone bruise in his right knee and played through pain for the rest of the season. In May, it was revealed that Brown had a partially torn meniscus in the knee, an injury president of basketball operations Brad Stevens said the team had been aware of “for a long time,” but he continued to play through the playoffs.</p>
