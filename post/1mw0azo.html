

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/utp1dob1nakf1.png"><p>No way they forgot about Witch Hunter</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/utp1dob1nakf1.png" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="n9uc4si" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>chadssworthington</div>
        <div>11 | 3 hours ago </div>
      </div>
      <label for="n9uc4si" class="commentText"><p>Benefited from a lot of broad changes. Crossbow buffs, no weapon swap time, and deflect and elemental armour work well with the buffs that Sorcery Ward got last league.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="n9u7oku" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Sage_sanchez_</div>
        <div>3 | 4 hours ago </div>
      </div>
      <label for="n9u7oku" class="commentText"><p>There’s always 0.4 when we’re all too distracted by Druid and/or Shadow to notice the Witchhunter overhaul</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="n9up4cr" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>tooncake</div>
        <div>1 | 32 minutes ago </div>
      </div>
      <label for="n9up4cr" class="commentText"><p>Currently running my last toon as a WH. Really haven&rsquo;t seen some hard hitting nerfs for it specifically for 0.3, and with all the additional changes esp for the gems, WH might even be a potential for some good homebrew builds this next major league</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="n9uqetv" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Jedahaw92 | &#34;Don&#39;t eat anything colourful.&#34; / Titan</div>
        <div>1 | 19 minutes ago </div>
      </div>
      <label for="n9uqetv" class="commentText"><p>Titan too. 😥</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
