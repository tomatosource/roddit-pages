

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://www.reddit.com/r/PathOfExile2/comments/1r3b6uo/i_wanna_make_divs/"><p>I wanna make divs</p>
</a>
    </h2>

    
    <div class="selfPostContainer">
      <p>Is there any way to see the worth of certain crafted items for consoles (I’m on PS)</p>

    </div>
    

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="o538hsc" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Imaginary-Initial315</div>
        <div>3 | 5 hours ago </div>
      </div>
      <label for="o538hsc" class="commentText"><p>You can use poe.scout to see the rates for items in the currency market. You can use the market when you get Ange, or by visiting another player&rsquo;s hideout to use their Ange. You can look for items similar to yours using the Path of Exile 2 trade website to estimate their value.</p>

<p>When you are shopping on PS5, you can still shop with a phone or laptop and teleport in-game to purchase by clicking &lsquo;teleport to hideout,&rsquo; this is more efficient than searching in-game</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="o53noq5" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>heresdustin</div>
        <div>1 | 3 hours ago </div>
      </div>
      <label for="o53noq5" class="commentText"><p>I play on PS5, and this is what I do. I have a laptop open next to me to look for items or check prices. Not ideal, but it’s better than trying to type with a controller.</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="o535ik1" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>bemer1984</div>
        <div>1 | 5 hours ago </div>
      </div>
      <label for="o535ik1" class="commentText"><p>Look at trade market for similar items.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="o53d865" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>SilverArrows6662</div>
        <div>1 | 4 hours ago </div>
      </div>
      <label for="o53d865" class="commentText"><p>There&rsquo;s phone apps (search ur respective app store), where u can take picture of the equipment card and it searches the trade site for similar items.</p>

<p>The issue for me was, I&rsquo;m far enough away from my tv, that the pictures weren&rsquo;t clear enough to parse the data correctly, so it never worked well.</p>

<p>Eventually I gave up and just rando guess price and either sell shit too cheap or never sell it cause it&rsquo;s priced too high. If u are closer to ur tv, ur experience might be better.</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
