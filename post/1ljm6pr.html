      <label for="mzkt691" class="commentText"><p>From <a href="http://Globe.com" target="_blank">Globe.com</a></p>

<p>By Adam Himmelsbach</p>

<p>The Celtics’ summer following last season’s championship was unusually calm. Jayson Tatum, Derrick White, and Jrue Holiday went to Paris to help the United States win an Olympic gold medal, and back in Boston, president of basketball operations Brad Stevens mostly just kept the roster intact.</p>

<p>This summer figures to be much busier, however. The Celtics ended this season facing a combined salary and luxury-tax bill of about $500 million next season, which would have shattered the NBA record. Also, they sit above the second apron line that puts several roster-building restrictions in place. Tatum’s Achilles’ injury that could keep him out next season will likely factor into Stevens’s approach, too.</p>

<p>The Celtics made their first significant move Monday night, agreeing to trade <a href="https://www.bostonglobe.com/2025/06/24/sports/report-celtics-trading-jrue-holiday-trail-blazers-anfernee-simons-two-second-round-picks/?p1=Article_Inline_Text_Link" target="_blank">Holiday to the Portland Trail Blazers in exchange for 26-year-old shooting guard Anfernee Simons and a pair of future second-round picks</a>, according to league sources.</p>

<p>Simons will make <span class="math inline">\(27.7 million next season in the final year of a four-year, \)</span>100 million contract. Holiday, 35, inked a four-year, <span class="math inline">\(135 million extension with the Celtics in April 2024 and will make \)</span>32.4 million next season.</p>

<p>In the short term, the Celtics inched about <span class="math inline">\(4.7 million closer to dipping below the second apron — they remain about \)</span>18 million above — and they are projected to save about $40 million in luxury-tax payments next year.</p>

<p>But they also freed up long-term money, with Simons on an expiring deal and Holiday under contract for three more seasons.</p>

<p>A league source stressed late Monday night that the Celtics acquired Simons because they believe he can bolster the roster, but the source added that the team will “remain engaged on all fronts” in the coming days and weeks. So, there is certainly a chance the Celtics will soon flip Simons in another cost-cutting move.</p>

<p><a href="https://www.bostonglobe.com/2025/06/24/sports/celtics-trade-jrue-holiday-anfernee-simons/?p1=Article_Inline_Text_Link" target="_blank">Simons, who is eligible to sign an extension, is a dangerous scorer</a>. He is a career 38.1 percent 3-point shooter on high volume and averaged a career-high 22.6 points for Portland in 2023-24. But he is a below-average defender, and he is replacing one of the most capable defensive menaces the NBA has seen in the last 25 years.</p>

<p>Pairing the 6-foot-3-inch, 180-pound Simons in the backcourt with, say, Payton Pritchard could leave the Celtics vulnerable. But Simons is nine years younger than Holiday and would help refresh what was becoming a rapidly aging core.</p>

<p>Regardless of whether Simons is in Boston’s long-term plans, other notable moves figure to follow in the coming days.</p>

<p>Center Kristaps Porzingis, who will make $30.7 million on an expiring contract next season, is a trade candidate. He was an essential piece of the Celtics’ title team, but his inability to stay healthy was glaring over the past two seasons, most recently when the effects of a March respiratory illness limited him severely over this season’s final three months.</p>

<p>On Tuesday, Porzingis shared a brief health update on Instagram. He thanked supporters and added, “I’ve been feeling excellent all offseason and looking forward to a healthy and strong European championship tournament with [the Latvian national team].”</p>

<p>Porzingis’s expiring contract and his ability to help a team looking to make a title push should make him an attractive option to potential suitors.</p>
