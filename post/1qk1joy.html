      <label for="o14l10s" class="commentText"><p>Dark orb and white orb always spawn at same time. The first orb touched by yourself or Arbiter will determine what happens to the ground. Dark orb creates dark ground that disables regen and has a weak damage over time effect. White orb creates white ground that chills.</p>

<p>To remove the current ground effect, touch the remaining orb. I know you know that since you did it in this clip but I&rsquo;m just being thorough for others who don&rsquo;t know.</p>

<p>Arbiter has a somewhat rare ability where he teleports to an orb and activates it and has his weapon empowered. In your clip he picks up the dark orb and his sword is empowered purple. When he hits you with the purple empower, it applies a DoT that disables regen.</p>

<p>So it can be a good idea to touch the first orb before Arbiter gets a chance to. This way you avoid him empowering his sword. But it also means you want to turn go touch the second orb as well to remove the ground effect that you just created.</p>
