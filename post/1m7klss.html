

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://www.reddit.com/gallery/1m7klss"><p>Someone explain this?</p>
</a>
    </h2>

    

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="n4s5j3x" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Spumping_Jiders</div>
        <div>5 | 13 hours ago </div>
      </div>
      <label for="n4s5j3x" class="commentText"><p>The +2 Levels to all Spell Skills increases your damage more than the extra spell damage does</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="n4s5unv" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Miles_Adamson</div>
        <div>2 | 13 hours ago </div>
      </div>
      <label for="n4s5unv" class="commentText"><p>You lost 2 levels to skill gems and the 16% as extra fire in exchange for around 50% increased spell damage. What you lost was more than what you gained</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="n4s5wnk" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>SuperUltraMegaNice</div>
        <div>2 | 13 hours ago </div>
      </div>
      <label for="n4s5wnk" class="commentText"><p>Because you are losing the +2 spell levels on it which is massive. Spells scale off level very well in PoE2.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="n4s5zw6" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Status_kos_1964</div>
        <div>1 | 13 hours ago </div>
      </div>
      <label for="n4s5zw6" class="commentText"><p>Gems, especially spells, gain a lot of damage thanks to level, although a weapon with less spell damage and the +2 to the gem compensates for that.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="n4s60il" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>kingbetadad</div>
        <div>1 | 13 hours ago </div>
      </div>
      <label for="n4s60il" class="commentText"><p>+2 level to all skills while still getting spell DMG and extra fire DMG would be my guess.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="n4s686s" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>kimlok0</div>
        <div>1 | 13 hours ago </div>
      </div>
      <label for="n4s686s" class="commentText"><p>+2 levels its massive for spells</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="n4sbr79" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>BoomZhakaLaka</div>
        <div>1 | 13 hours ago </div>
      </div>
      <label for="n4sbr79" class="commentText"><p>Increases are cumulative, not local. So let&rsquo;s say your character already has 200% increase from various sources, you&rsquo;re doing 300% spark damage. Add the 100% staff, now you&rsquo;re doing 400% spark damage.</p>

<p>With spark each level gives you about 12% more but it multiplies with the increase. So, your 50% staff: 350% spark damage. Times 1.12, times 1.12 again (+2 levels). Times 1.16 (damage added as). Over 500% spark damage.</p>

<p>I am sure I messed up some detail, but that&rsquo;s the basics of additive vs multiplicative. The end point is that: the other staff is possibly better, unless mana is really a problem.</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
