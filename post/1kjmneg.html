

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://www.reddit.com/gallery/1kjmneg"><p>Another campaign run tracking gear and currency progression (0.2.0g)</p>
</a>
    </h2>

    

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="mro44ni" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>d4Bad_poe2Good</div>
        <div>2 | 8 hours ago </div>
      </div>
      <label for="mro44ni" class="commentText"><p>Personally, Gas Arrow is only a good leveling skill when combined with the unique ignite helmet. Otherwise it&rsquo;s too delayed/clunky imo. Also looking only for +1 bases (which you are forced to use now after scattershot nerfs) makes gearing rly hard. In my runs, xbows outperformed la und ga.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="mro5jj1" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>isoNastai</div>
        <div>1 | 8 hours ago </div>
      </div>
      <label for="mro5jj1" class="commentText"><p>Yep. To add to this, I think bows are difficult on a SSF/leaguestart because damage is also dependent on finding a decent quiver.</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="mrodja8" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>InsPoE</div>
        <div>1 | 7 hours ago </div>
      </div>
      <label for="mrodja8" class="commentText"><p>Good showcase! I haven&rsquo;t done the campaign since the loot patch but by the looks of it the improvements are noticeable.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="mrppzvj" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Askariot124</div>
        <div>1 | 12 minutes ago </div>
      </div>
      <label for="mrppzvj" class="commentText"><p>&ldquo;Gear upgrades feel too infrequent, especially in the later acts. Having the same item for 20, or in some cases 40 levels feels really bad. I avoided spending exalts on low ilvl items because I expected to find upgrades, but in some cases I never did. Even when trans, aug, regaling decent bases.&rdquo;</p>

<p>I think it has the advantage that you actually CAN find gear that lasts and spend exalted on your gears because chances are you keep items for a while. The extreme counterexample would be D3 for me where every item you find gets bad so quickly because the stats scale with your level. This makes finding items very bland and boring.</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
