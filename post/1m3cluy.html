    <style>
       * {

}

  padding: 24px;

}

}

.subName {

}

}

.postLink:visited {

.postHeader {

  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {

}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;

}

    <h2>
      <a class="postTitle" href="https://www.reddit.com/r/PathOfExile2/comments/1m3cluy/despair_and_decaying_hex/"><p>Despair and Decaying Hex</p>
</a>
    </h2>

    
    <div class="selfPostContainer">
      <p>It is confirmed that the Decaying Hex support gem that does the chaos DoT when put on Despair triggers AFTER Despair lowers their chaos resist?</p>

<p>I would think so but if not this wouldn&rsquo;t be the first disappointing interaction.</p>

    </div>
    

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="n3vonlh" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>NugNugJuice</div>
        <div>1 | 8 minutes ago </div>
      </div>
      <label for="n3vonlh" class="commentText"><p>Assuming PoE1 logic still applies to PoE2 then it should work that way (or at least shouldn’t matter). DoTs are damage dealt in multiple instances (very quick in PoE). In PoE1, if a DoT lasts 8 seconds, and you apply despair 3 seconds into it, then the remaining 5 seconds will deal more damage due to despair. Same with wither.</p>

<p>This is how decaying hex should work and likely works. Due to the server tick rate, it shouldn’t matter which applies first, because they’ll be applied on the same tick, and each tick the DoT will do damage taking Despair into account. Even if Despair applies after the DoT, it doesn’t matter because, at worst, the increased damage from despair will apply to all ticks after the first (and a single tick missing out on the boost, if it even does, would be negligible).</p>

<p>For reference, “a tick” in PoE is 33 milliseconds.</p>
</label>
    </div>
  </label>
  
</div>
