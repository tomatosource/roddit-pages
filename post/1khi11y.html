      <label for="mr74kpj" class="commentText"><p>Was doing the trials of Chaos and I end up failing the trials because the thunderbird is a piece of shit boss who loves to shit on my dreams in the last room.</p>

<p>After a lengthy rant about the finer points of design relating to things such as invulnerability phases, negation of DoT damage during those phases and how fast the transition from one phase of invulnerability to the next without a meaningful window to punish is bullshit I open my inventory to see what I pulled for my troubles.</p>

<p>Some currency and a lone blue ruby ring. Woo-hoo.</p>

<p>ID The Ruby Ring: +40% lightning resistance.</p>

<p>Okay, hold up, that&rsquo;s not bad at all. It&rsquo;s not the max roll, but it&rsquo;s the max value for the second best roll. Definitely worth an augment because why not.</p>

<p>+13-22 Cold Damage to Attacks</p>

<p>Well this just went from 0-100 real fast. That&rsquo;s two mods that are almost top quality. At this point I know that if I throw a greater lightning essence at it two of the 3 remaining lightning mods will be great (resist all and attack damage) and the last one wouldn&rsquo;t brick the ring.</p>

<p>1 to 39 lightning damage to attacks.</p>

<p>Oh. My.</p>

<p>At this point I know I have gold in my hands and I have little else to do but slam exalts and hope RNGesus doesn&rsquo;t have me on the naughty list.</p>

<p>14 Dexterity</p>

<p>It&rsquo;s nothing to be excited about and at this point between the implicit and explicit resistances and damage the item can&rsquo;t be bricked.</p>

<p>13 to 17 Fire damage to attacks</p>

<p>SWEET JUMPIN JAHOSAFAT WE DUNNIT BOYS!</p>

<p>At this point I&rsquo;m hoping and praying to land a resist all or another fat single resistance roll</p>

<p>22% Increased Rarity of Items Found</p>

<p>Nevermind, that&rsquo;s super cool too!</p>

<p>My buddies price checker had it in the 30-50 div range which makes it the best thing I&rsquo;ve made so far.</p>

<p>Unpictured: Finished the craft off with reaver catalysts. Final estimated average DPS from  added damage =61.5</p>

<p>Item went into personal use on my Thunderfart Ritualist for a nice 20+ item DPS upgrade over what I previously had in the slot.</p>

<p>That fat 22% magic find and all that damage is getting amped by Ritualist and an Ingenuity</p>
