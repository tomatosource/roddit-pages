

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>

    <h2>

    </h2>

    

    <div class="commentList">
      
        
          
<div class="commentAndChildren">

      <label for="movwncc" class="commentText"><p>You have a point, but people posting these clips have got to stop showing us a build with 3k combined hp and es with no other context. If you&rsquo;re a huntress I assume you&rsquo;re using ev and block as well. Do you have ghost dance? Acrobatics? Do you heal on block?</p>

<p>With 2 rng defensive layers and a low hp pool sometimes a crit slam 1 taps you or a swarm shreds you like paper. You deserve to die in simulacrum with 3k hp unless you&rsquo;ve got 90% max res and 10k armor I&rsquo;m not seeing.</p>
</label>

  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">

      </div>
      <label for="movy017" class="commentText"><p>Yeah rocking mostly ev, 75% res on everything not 90 but also not nothing, and ghost dance+wind dancer+tailwind to boost survivability. I’m fine with being crit one shot knowing that I’m squishier than other builds but this isn’t really about that scenerio. It’s more being swarmed by hyper twitchy monsters much faster than I can ever be and the devs expecting people to want to play anything other than 1 button builds. This character is level 92, but I have another 90 lich with 10k+ ES and the issue still persists. You get swarmed and it’s over if you try anything that’s slow or takes a longer combo/buildup</p>
</label>

  </label>
  
</div>

      </div>
      <label for="movyx3n" class="commentText"><p>As much as I agree with you about the EHP comment, i think this post was more to highlight how the respawn point needs to be moved, since they are basically relying on Iframing their defenses to get out of an IMMEDIATE surround.</p>

<p>I agree with OP that the checkpoint needs to be evaluated, and i also agree with you that people are basically complaining, in many topics that get posted, about their glass cannons shattering. Both are true.</p>

    </div>

</div>

  </body>
</html>
