      <label for="o0pbmbc" class="commentText"><p>From Chris Forsberg:</p>

<p>In his four full seasons since joining the Celtics, Derrick White has routinely slumped his way through January. It might have cost him an All-Star nod during the 2024 title season. On Monday night, in a showdown of Eastern Conference titans, White missed 10 of the 11 shots he hoisted against the Pistons and turned hesitant during the fourth-quarter moments where he typically thrives.</p>

<p>White was field-goal-less when he stepped to the free throw line early in the fourth quarter to shoot a technical freebie. He missed that one, too &ndash; in <a href="https://www.nbcsportsboston.com/nba/boston-celtics/live-updates-highlights-score-pistons/761558/" target="_blank">a game the Celtics would lose by a point, 104-103</a>.</p>

<p>The numbers confirm what’s been hiding in plain sight: January is White’s toughest month. In his four full seasons since joining Boston, White’s scoring plummets to his lowest output of the seven regular-season months. It’s the only month in that span that he’s shooting under 40 percent from the field overall, and his January 3-point percentage is the worst of the seven months as well.</p>

<p>&hellip; The good news: History suggests White typically rebounds well in February. That has been both his highest scoring month — and best shooting month, by far — over the past four seasons. White is averaging 17.3 points per game in the month of February the past four years, while shooting 49.6 percent overall and 43 percent beyond the arc.</p>
