

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://www.reddit.com/r/PathOfExile2/comments/1nqmqp7/incredible_news_for_031/"><p>Incredible news for 0.3.1</p>
</a>
    </h2>

    
    <div class="selfPostContainer">
      <p>But for a second i thought they were going to add the option to remove the delirium fog :(</p>

    </div>
    

    <div class="commentList">
      
        
          
<div class="commentAndChildren">

  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">

        <div>6piryt</div>
        <div>4 | 2 hours ago </div>
      </div>
      <label for="ng7z5p2" class="commentText"><p>I just wish that &ldquo;Alongside the changes mentioned above, the patch contains various improvements and fixes to a plethora of issues.&rdquo; will have something to do with delirium. I hate fog and music. I want to see and hear the real game already</p>

  <div class="commentList">
    
      
<div class="commentAndChildren">

    <div class="comment">
      <div class="commentHeader">

      </div>
      <label for="ng8366q" class="commentText"><p>The music is really good though.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="ng87tyx" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Bxk__</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="ng87tyx" class="commentText"><p>I&rsquo;ve been running all my juiced T15 corrupted upgrade duds alongside the double corrupt atlas passive and I&rsquo;ve basically been conditioned to stare at my ES numbers when I hear this music because there&rsquo;s usually ignited ground hiding underneath the temporal chains.</p>

<p>Also, popping a corrupted 4 mod waystone and hearing a single swoosh from one entrance portal instead of three.  Guess we&rsquo;re going on an adventure</p>
</label>
    </div>
  </label>
  
</div>

    
      
<div class="commentAndChildren">
  <input id="ng85eag" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>6piryt</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="ng85eag" class="commentText"><p>I felt it for the first 50 maps maybe, The real issue with music I have is it replaces the map music and even if I happen to run the map I like if I want to have benefits of deli there I cant listen to it. Fog doesnt completely change the map look even if its annoying.</p>

<p>There was a guy in other deli hatethread saying it affects his mood after few maps and I kinda agree the swing from many different vibes in the campaign to the spiral of depression in the endgame is noticable.</p>

<p>Some people dont listen to music in the endgame, but I do and I love what Kamil and the sound team have created. All the work they put in is overshadowed by 1 mechanic with few deli tracks.</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

    
  </div>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="ng81k9m" type="checkbox" checked/>

      <div class="commentHeader">
        <div>chiefballsy</div>
        <div>4 | 2 hours ago </div>
      </div>
      <label for="ng81k9m" class="commentText"><p>I think this issue will jump up in priority (if not already fixed), now that we&rsquo;ll be able to carry our juice around with us. Most endgame players are likely going to be running at least pack size delirium on 99% of maps</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="ng85qsp" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>bigace1116</div>
        <div>0 | an hour ago </div>
      </div>
      <label for="ng85qsp" class="commentText"><p>Hopefully they address loot drops a bit after these changes. Especially for ritual. I know we have crafting which is a bit better. But it would be nice to see more wanted loot drop in maps or even boss fights. Slow and steady maybe in a year or two when EA ends it can be something they take an extra peak at.</p>
