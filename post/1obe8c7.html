

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>

    <h2>
      <a class="postTitle" href="https://www.youtube.com/watch?v=NLeOTPLTDKk"><p>Let´s talk about punisment</p>
</a>
    </h2>

    

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="nkg6ary" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Acheroo</div>
        <div>5 | 6 hours ago </div>
      </div>
      <label for="nkg6ary" class="commentText"><p>You think that&rsquo;s bad? Yesterday I did my first citadel run. Didn&rsquo;t juice the map so it would be easy. Max resistances, mana build (damage from mana before life) with 4k mana and 1,5k health and over 1k mana regen per second so I am fine unless I get one shotted. Guess what, I got one shotted, from full mana and health. Failed the map. I have 200h+ in the game and that is the only citadel that I found.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="nkg8up7" type="checkbox" checked/>
    <div class="comment">

      </div>
      <label for="nkg8up7" class="commentText"><p>yep man this is I am talking about, I have 800+hours in game I like it, I run my own builds and see where I can get with them, but still the punishment is way too high</p>

  <div class="commentList">
    
      
<div class="commentAndChildren">

    <div class="comment">

        <div>Secane</div>

      </div>
      <label for="nkgvdd3" class="commentText"><p>best part you wont have any idea what actually killed you and how to improve</p>

  </label>
  
</div>

    
  </div>
  
</div>

    
  </div>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nkh6q3e" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Bacon-muffin</div>
        <div>1 | 3 minutes ago </div>
      </div>
      <label for="nkh6q3e" class="commentText"><p>Bahlak&rsquo;s one of the few bugged map bosses since they did the update. This one stays in that tornado for like a full minute before he leaves it and melee characters get an opportunity to attack him again. There&rsquo;s also that fungus guy in the cave and he always ports to the back corner behind the mushrooms and then gets stuck and stays there forever bugged out.</p>

<p>On the topic of how punishing maps are, I tried to make a feedback post to start a discussion about this but the mods nuke it every single time cause someone has a vendetta against me or something&hellip;</p>

<p>My idea is instead of mods lowering the number of revives we get, instead when we die we lose a map mod. I think this is a better happy medium because you still have some of the risk / reward but if your build can&rsquo;t handle it you start to lose mods and the juice that comes with them and you could lose all the way down to a white map.</p>

<p>This would make the map less rewarding if you kept dying, but you&rsquo;d keep the ability to go back into the map and pick up anything you&rsquo;ve already dropped and you&rsquo;d still be able to finish the map so you don&rsquo;t have to go through the frustration of running a blank map just because random off screen mob 1 tapped you before you could humanly react.</p>

<p>I think it&rsquo;d also be nice in that it also regulates the difficulty because if you&rsquo;re out of your depth its lowering the difficulty via the removed mod.</p>
</label>
    </div>
  </label>
  
</div>
