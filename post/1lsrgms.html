

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://www.reddit.com/r/PathOfExile2/comments/1lsrgms/on_kill_effects_stack/"><p>On Kill Effects stack?</p>
</a>
    </h2>

    
    <div class="selfPostContainer">

<p>Namely:</p>

<p>Shatter via <a href="https://poe2db.tw/us/Herald_of_Ice" target="_blank">Herald of Ice</a></p>

<p><a href="https://poe2db.tw/us/Bone_Shrapnel" target="_blank">Bone Shrapnel</a></p>

<p><a href="https://poe2db.tw/us/Fiery_Death" target="_blank">Fiery Death</a></p>

    </div>
    

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="n1l1bet" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>MustangxD2</div>
        <div>1 | 10 hours ago </div>
      </div>
      <label for="n1l1bet" class="commentText"><p>Yes</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="n1l3h2o" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>ravenrawen</div>
        <div>1 | 9 hours ago </div>
      </div>
      <label for="n1l3h2o" class="commentText"><p>Even when Shatter destroys the corpse?</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="n1l4bbj" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>MustangxD2</div>
        <div>1 | 9 hours ago </div>
      </div>
      <label for="n1l4bbj" class="commentText"><p>Yep, the corpse only matters if something specifies the Effect comes from corpse</p>

<p>If Effect is on-death then if enemy gets shattered it doesn&rsquo;t affect on-death. All on-death effects will trigger</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

    
  </div>
  
</div>

        
      
    </div>
  </body>
</html>
