

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://media.discordapp.net/attachments/884980933038571560/1505334223932882954/image.png?ex=6a0a3f3e&amp;amp;is=6a08edbe&amp;amp;hm=da5b41087443eff720ba7fd2d33e59ee8834b4241e1544cff8e7a600c573ecbd&amp;amp;=&amp;amp;format=webp&amp;amp;quality=lossless"><p>Could the in-game build planner allow us to put notes on passives where relevant?</p>
</a>
    </h2>

    

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="om7i1on" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>gojlus</div>
        <div>1 | 9 minutes ago </div>
      </div>
      <label for="om7i1on" class="commentText"><p>As an aside, I get we could just import 12 trees and have the whole thing there as a drop down menu for progression, similar to how people already do for current build guides in PoB, but I figured since this is a fully integrated system that there would be a less clunky way to display passive progression, rather than swapping trees every 10~20 passives/2 ascendancies.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="om7iln7" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>astral23</div>
        <div>1 | 5 minutes ago </div>
      </div>
      <label for="om7iln7" class="commentText"><p>they already said you can set level ranges and have it change over time</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="om7ijlf" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>gertsferds</div>
        <div>1 | 6 minutes ago </div>
      </div>
      <label for="om7ijlf" class="commentText"><p>They’ve said you can notate damn near everything on a character, so I think we can safely assume there’s some way to achieve that functionality.</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
