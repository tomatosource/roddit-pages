

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://www.reddit.com/gallery/1ue8xjv"><p>Taking this delirium node completely bricks your liquid farm. It is not %20 chance to convert like it says. Its more like 50% chance.</p>
</a>
    </h2>

    

    <div class="commentList">
      
        
          
<div class="commentAndChildren">

        <div>zidicck</div>
        <div>7 | an hour ago </div>
      </div>
      <label for="othxg7t" class="commentText"><p>I hade simillar feeling about this node, it not being a choice node is bad. I feel like in general the idea of not being able to unallocate nodes on the tree is a mistake. I understand that they want impactful nodes to be a choice nodes but before they are able to do that in next patch we are stuck with nodes that literally make our life harder for no apparent reason. Being able to unallocate lessens the burden on them to balance/fix it quickly since I can just unspec it. Rant over, thanks</p>
</label>
    </div>
  </label>
  
</div>

      <label for="othwguu" class="commentText"><p>I would guess that the ancients are almost the same in amount as the normal liquids, which shouldn&rsquo;t really be possible with just a 20% increase statistically.</p>

    </div>
  </label>
  
</div>

    
      
<div class="commentAndChildren">
  <input id="othywe7" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Glamdring26WasTaken [OP]</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="othywe7" class="commentText"><p>Yeah exactly what cryxis said, if it was 20%, it wouldnt be that kind of a distribution.</p>

    </div>
  </label>
  
</div>

    
  </div>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="oti0bmw" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Volitar</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="oti0bmw" class="commentText"><p>Can&rsquo;t wait for next league. So many nodes I&rsquo;m not gonna take on the Atlas Tree.</p>

    </div>

</div>

        
      
    </div>
  </body>
</html>
