

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/exu6a3n9irdg1.png"><p>Desecration advice on this thing</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/exu6a3n9irdg1.png" />

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="nzz82z3" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>_Table_</div>
        <div>3 | 4 hours ago </div>
      </div>
      <label for="nzz82z3" class="commentText"><p>I think skill speed is not a great mod to desecrate since the values are so low. I don&rsquo;t know what your build needs but if it were me I&rsquo;d prefer a lot of other options. Rarity, ele/chaos res, crit chance/crit damage, CDR. Of the available suffixes I think skill speed would be more or less at the bottom of the mods I&rsquo;m looking for.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nzz6qni" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Dj11785</div>
        <div>1 | 4 hours ago </div>
      </div>
      <label for="nzz6qni" class="commentText"><p>Depends entirely on if your build will use it or not, or if it’s up for sale. Crit chance/damage bonus would be better though, if you can stomach rerolling lights until you hit desired mod</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="nzz7m37" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>BeginningEqual5533</div>
        <div>0 | 4 hours ago </div>
      </div>
      <label for="nzz7m37" class="commentText"><p>It&rsquo;s for sale, i don&rsquo;t need spirit but it rolled when i was looking for ES mods and now i cant ignore it.</p>

<p>I guess Crit mods are just too low weight to be rolled even via 10-20 omen of lights.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="nzz8q2x" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>_Table_</div>
        <div>1 | 4 hours ago </div>
      </div>
      <label for="nzz8q2x" class="commentText"><p>If you&rsquo;re selling it, desecrate it with an echo and throw on ele/chaos res if you don&rsquo;t get lucky with a crit mod. Pretty much no one is going to be searching for skill speed so that won&rsquo;t help you sell it</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="nzz97x2" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>BeginningEqual5533</div>
        <div>1 | 4 hours ago </div>
      </div>
      <label for="nzz97x2" class="commentText"><p>Got 19% crit chance among options, i guess it is too low to settle? Ele/chaos is still better?</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="nzz9fvy" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>_Table_</div>
        <div>1 | 4 hours ago </div>
      </div>
      <label for="nzz9fvy" class="commentText"><p>Yeah that&rsquo;s T5, kind of a bummer. Would go for res over that</p>

    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">

    <div class="comment">
      <div class="commentHeader">
        <div>BeginningEqual5533</div>
        <div>2 | 4 hours ago </div>
      </div>
      <label for="nzz9u06" class="commentText"><p>thanks, settled on 26% Lighning so will not spend even a single omen.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">

        <div>2 | 4 hours ago </div>
      </div>
