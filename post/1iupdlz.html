.postTitle {

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;

.selfPostContainer {

.streamableContainer {

  left: 0;

  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

      <label for="mdz7dtp" class="commentText"><p>Long story short: Had 10mil gold laying around so decided to spend some of it gambling focuses. I rolled until I got 6 good bases to inventory with 2 good rolls for each (in this focus it was 27% cast speed and 84% spell dmg) - Then I went to stash and started rolling them with regals and exalts. This was only one left that had valuable rolls after fifth stat. Went to check trade side and found 2 similiar, one priced 36div and other one was 1 mirror. Slammed last exalt to it and BAM! My spark dps with old focus was around 288k and with this it went up to 327k. That cast speed is making some mana problems for me tho so I think I will sell it and use that money to upgrade my other gear.</p>

      <label for="mdzt0ey" class="commentText"><p>Total mana recovery per second 1k and total mana 6147. Problem is combination of cast on shock - lightning conduit with that cast speed. It just swallows <sup>2</sup>&frasl;<sub>3</sub> of my mana in a flash if there is more than 5 mobs. Without cast speed my mana regen can keep up pretty much what I use, but with cast speed it gives me same kind of jump scares when something almost one shots your mana to 0 and you just spam melting maelstrom in panic and hope you hit it on time. Ofcourse if I just use spark by clicking it and taking breaks, then my mana keeps up, but then again that cast speed goes to waste imo. I could change my jewels so that cast on shock wouldn&rsquo;t hit so frequently, but now I pretty much melt every boss already in 5 seconds with lightning conduit crits so it feels like waste to change it just to get dps numbers up. I might be wrong also and there can be something off with my build, but atleast it works how it should now and also I think someone has more use for this focus than me.</p>

      <label for="me0643z" class="commentText"><p>I had the same problem and ended up changing to manually casting lightning conduit on bosses.</p>

<p>Also, anything past 100k spark is pretty much not needed for mobs and rares. If you stack gems to where your exposure is 70% or so for each stack, then pretty much all bosses die in one hit. On top of that, when you remove it from cast on shock, it frees up another gem a lot on lightning conduit, which increases its end damage enough that you can have less shock stacks and still one shot most bosses.</p>

<p>I was pretty invested in getting my tool tip up for awhile, but after 125k dps for spark, it’s not much use because it clears everything on screen and your boss damage is going to be coming from conduit</p>
