

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/m02uw62wq48h1.png"><p>With 15 Explosives you may not get 8 runes in Moor of Fallen Skies</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/m02uw62wq48h1.png" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">

    </div>
  </label>
  
</div>

</label>

  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">

      </div>
      <label for="oshlujy" class="commentText"><p>Definitly feels like they cut the corners on that change. They should at least fix it for that specific map. I encourage you to post it on their bug forum as im sure its not intended and could get fixed.</p>

    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="oshmufg" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>certavi3797</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="oshmufg" class="commentText"><p>I was curious about this when I read the patch notes. Ive done a bunch of expedition and on the rare occasion you get a lot of good rune combos(aldurs saga node where all remnants have at least 7 runes) 20 was already pushing it if you wanted everything.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="oshnsog" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>sh_ghost_ell [OP]</div>
        <div>1 | 40 minutes ago </div>
      </div>
      <label for="oshnsog" class="commentText"><p>The same thing might happen to the three towers in EXHUMED RUINS; I&rsquo;m not doing it with my best sagas, which is the whole point of that node.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="oshqrj6" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>GamingVyce</div>
        <div>1 | 23 minutes ago </div>
      </div>
      <label for="oshqrj6" class="commentText"><p>I&rsquo;m surprised they didn&rsquo;t increase the placement range a little bit. </p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
