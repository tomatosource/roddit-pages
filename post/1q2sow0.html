

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/9bn2k4kog4bg1.jpeg"><p>The Legendary Boston Celtics squad of the 2000s</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/9bn2k4kog4bg1.jpeg" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="nxffo20" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>MundaneExtension3195</div>
        <div>4 | 3 hours ago </div>
      </div>
      <label for="nxffo20" class="commentText"><p>I know it&rsquo;s only been 20 yrs but you look at this team and how clearly delineated the positions were, just a clear and prototypical point guard, shooting guard, small forward, power forward, &amp; center and wow, this seems like a different era in basketball&hellip; but I love it, loved this team</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nxfdenv" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>sstphnn | Derrick White</div>
        <div>2 | 4 hours ago </div>
      </div>
      <label for="nxfdenv" class="commentText"><p>This team was crazy good despite the age. The Big 3 were the stars of their own team (KG with the Wolves, Ray with the Bucks and Supersonics, and of course The Truth with the Celtics) but together they played to win. Sacrifice personal stats for the team. No ego, unless you count the funny anecdotes of KG about Rondo lmao</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nxg1kh1" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>dddfgggggdddfff | Tommy</div>
        <div>1 | 44 minutes ago </div>
      </div>
      <label for="nxg1kh1" class="commentText"><p>I truly love this team, but no one’s made more of a meal out of a snack then the 2008 championship team</p>

<p>they won one championship, which is impressive. But You would think the way they talk about it they had a 10 year dynasty.</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
