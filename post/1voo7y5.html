

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://www.reddit.com/r/PathOfExile2/comments/1voo7y5/why_wolf_pack/"><p>Why wolf pack?</p>
</a>
    </h2>

    
    <div class="selfPostContainer">
      <p>I&rsquo;ve seen some non minion builds use this amulet. Does it add a defensive layer or something?</p>

    </div>
    

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="p3r5w32" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>ArthurDentsTea</div>
        <div>4 | 7 hours ago </div>
      </div>
      <label for="p3r5w32" class="commentText"><p>You can have a support gem where minions take damage before you. You can also use amamamus tithe and with infernal legion so you get a constant 3 stacks of random abyss mods. Pretty useful can easy for any given character to utilize </p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="p3r9c6r" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Ashrial</div>
        <div>2 | 7 hours ago </div>
      </div>
      <label for="p3r9c6r" class="commentText"><p>Are you sure you are not noticing the free wolves you get from pounce?</p>

<p>I use Brutus brain on pounce so my wolves never die and they just soak random hits for me. I assume you can do the same for wolf pack.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="p3rg96s" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>c_phoenix0</div>
        <div>1 | 6 hours ago </div>
      </div>
      <label for="p3rg96s" class="commentText"><p>There&rsquo;s some effects in the game that scale with the number of nearby minions/allies. Predator&rsquo;s Mark makes enemies deal more damage the more of their enemies (your allies) are nearby. Pack Encouragement on the tree makes you deal more damage the more minions you have in your presence.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="p3rtjbk" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>bigclipslildiks</div>
        <div>2 | 5 hours ago </div>
      </div>
      <label for="p3rtjbk" class="commentText"><p>There is also a cool interaction with wolf pack +cast on minion death w/ profane ritual for power charge generation but would be kind of wasteful on a ammy</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
