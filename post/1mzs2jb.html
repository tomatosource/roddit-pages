

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/r4gexpire6lf1.png"><p>Please give raise zombie a cast time so that it can be used with Meta skills.</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/r4gexpire6lf1.png" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="nalwswp" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Faythz</div>
        <div>2 | 6 hours ago </div>
      </div>
      <label for="nalwswp" class="commentText"><p>There are so many things holding the zombies back.</p>

<p>Unless you use sacrifice support its not really possible to use them on bosses.</p>

<p>When mapping they just fall behind and just despawn.</p>

<p>The biggest thing holding zombies back is their mana cost. When you scale their level, the mana cost of zombies goes up INSANELY fast.</p>

<p>Level 30 zombie has a whopping mana cost of 402 WITHOUT ANY SUPPORT GEMS.</p>

<p>Level 37 costs 957 MANA WITHOUT ANY SUPPORTS.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="namtdoo" type="checkbox" checked/>
    <div class="comment">

      </div>
      <label for="namtdoo" class="commentText"><p>Didnt they say that this patch they were doing a serious pass on upper gem level mana costs?</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="nan0zuh" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Faythz</div>
        <div>1 | 3 hours ago </div>
      </div>
      <label for="nan0zuh" class="commentText"><p>Lets hope that they did not forget zombies then! :)</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="nanlwfc" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>drubin</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="nanlwfc" class="commentText"><p>Wouldnt mind it. Honestly zombies was the first build I &ldquo;wanted&rdquo; to play when poe2 first came out. But it was dissapointing. I really wanted to use the lingering essence and dodge roll for clones like a gw2 mesmer to generate power charges then use them to summon enhanced zombies.</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

    
  </div>
  
</div>

    
  </div>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nalg01t" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Murga787</div>
        <div>1 | 8 hours ago </div>
      </div>
      <label for="nalg01t" class="commentText"><p>I was hoping for a 0.3 zombie rework. With the changes to Unearth, you can raise all of them really easily right before or during boss fights.</p>

<p>My plan, run reavers and use their rage to create Unearth corpses. I can&rsquo;t do that with zombies so it&rsquo;s a dead skill against bosses or a slow process creating power charges.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="naljojs" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Confident-Milk8107</div>
        <div>1 | 8 hours ago </div>
      </div>
      <label for="naljojs" class="commentText"><p>I had a really fun empowered autobomber zombie build where you use sacrifice to get power charges in 0.1 then did cast on minion death with bone cage and ice walls but they kind of changed some interactions and made infernalist survivability bad in .2 so I didn&rsquo;t try it again</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

        
      
    </div>
  </body>
</html>
