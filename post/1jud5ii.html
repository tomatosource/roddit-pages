

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/bbvin26c1mte1.png"><p>What We&rsquo;re Working On</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/bbvin26c1mte1.png" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="mm11gnm" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Overlord3456</div>
        <div>4 | 3 hours ago </div>
      </div>
      <label for="mm11gnm" class="commentText"><p>I did see they&rsquo;re updating Act 3 areas, and that&rsquo;s a move in the right direction at least!</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="mm1eh81" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Odd-Consequence9464</div>
        <div>0 | an hour ago </div>
      </div>
      <label for="mm1eh81" class="commentText"><p>To be fair, more checkpoints will mean being able to teleport and save time traversing those super big maps more easily.</p>

<p>But still, it doesn’t change the fact that they are slow and not fun to explore. Hope whatever the actual change they implement will help</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="mm1lta1" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Zeania</div>
        <div>1 | 30 minutes ago </div>
      </div>
      <label for="mm1lta1" class="commentText"><p>Checkpoints are just a band-aid fix to the bigger problem of huge maps. I always thought that was kinda of a red flag for them to add them in the first place and not address areas being too big. You shouldn&rsquo;t need them in the first place IMO, they only make sense for points of interest (such as before bosses) but when you add random ones that&rsquo;s where I fail to see how this fixes the problem</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="mm1mpnc" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Odd-Consequence9464</div>
        <div>1 | 26 minutes ago </div>
      </div>
      <label for="mm1mpnc" class="commentText"><p>It’s just frustrating checking the massive map, thinking “oh there is something in this path” only to find a dead end, then you open the map and there is a massive walk back…..</p>

<p>I’ve never been so eager to pay 3 divines for 20% movement speed on boots for my witch because holy shit I noticed the difference right away…..and it’s still slow.</p>

<p>I wouldn’t mind if the map was big AND there was stuff to find, but it’s just not rewarding</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="mm1nuhx" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Zeania</div>
        <div>1 | 20 minutes ago </div>
      </div>
      <label for="mm1nuhx" class="commentText"><p>I loved doing the campaign the first time around when it launched few months ago because it was all new and fresh, even though everybody still noticed how absurdly large the areas were in Act 2 and 3, but man doing it every single league is not going to be fun. Act 1 is so so so close to perfection in terms of length and area sizes, they should use that as a template for future acts</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

    
  </div>
  
</div>

    
      
<div class="commentAndChildren">
  <input id="mm1m82o" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Barolt</div>
        <div>1 | 28 minutes ago </div>
      </div>
      <label for="mm1m82o" class="commentText"><p>More checkpoints helps with some things, but a lot of my frustrations are the gameplay in between checkpoints, which more of those doesn&rsquo;t really help.</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="mm1mhfq" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>SirVampyr</div>
        <div>1 | 27 minutes ago </div>
      </div>
      <label for="mm1mhfq" class="commentText"><p>I love that Scott looks a little like Quin here, lol</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
