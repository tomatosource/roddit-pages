

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/pews1pkt4fbf1.png"><p>I wonder if this will still be the case for the druid. (Footage from 2023)</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/pews1pkt4fbf1.png" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="n1s2seb" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Background-Dress-641</div>
        <div>15 | an hour ago </div>
      </div>
      <label for="n1s2seb" class="commentText"><p>This is already how demon form works so I don&rsquo;t see why they would change it.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="n1s2u8v" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Elligos_</div>
        <div>6 | an hour ago </div>
      </div>
      <label for="n1s2u8v" class="commentText"><p>im afraid so, It works the same for demon form for the infernalist.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="n1s437f" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>LordAlfrey</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="n1s437f" class="commentText"><p>Demonform does this too, right? I at least would appreciate it if they are consistent on the matter.</p>

<p>Personally, I think it&rsquo;s interesting, it&rsquo;s a downside to mitigate in order to gain a different power, or maybe you use some abilities before shifting to take advantage of longer duration skills while shifted. Or perhaps you shapeshift for bosses and mapclear with other abilities. It almost creates a third weaponswap, in a sense.</p>

<p>But balance will be difficult, likely shapeshifts will rather naturally be strong in the early parts of a league, and getting worse and worse as people get better gear. To compensate for this rather natural &lsquo;inflation&rsquo;, shapeshifts will probably need additional item scaling in some way.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="n1s51yd" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>EnjoyerOfBeans</div>
        <div>1 | 41 minutes ago </div>
      </div>
      <label for="n1s51yd" class="commentText"><p>I strongly disagree, I think it&rsquo;s extremely boring. The weapon is one of the most interesting and coolest item slots in the game, and if you want to play a shape shifter, you&rsquo;ll just lose that entirely. Why? That&rsquo;s extremely lame and makes all shapeshifters less diverse. Just make the skill weaker. If it&rsquo;s flavor they&rsquo;re worried about, make shapeshifted attacks ignore weapon DPS, but weapons should still provide stats.</p>
</label>
    </div>
  </label>
  
</div>

    
      
<div class="commentAndChildren">
  <input id="n1s5p5u" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>DecoupledPilot</div>
        <div>1 | 34 minutes ago </div>
      </div>
      <label for="n1s5p5u" class="commentText"><p>Oh, I never tried demon form and did not know this.</p>

<p>I must admit that my hype for shapeshifting now received a major blow&hellip;..</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

        
      
    </div>
  </body>
</html>
