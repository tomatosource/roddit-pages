

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://youtu.be/PwBmzi9zuqU?si=QpzsRAPHBHPc02EG"><p>let’s take a second to appreciate how far poe has come</p>
</a>
    </h2>

    

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="nvoxkpz" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>ProctoBlast</div>
        <div>4 | 3 hours ago </div>
      </div>
      <label for="nvoxkpz" class="commentText"><p>I can actually see what&rsquo;s going on the screen.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nvp3y17" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>CardboardWinkers</div>
        <div>-1 | an hour ago </div>
      </div>
      <label for="nvp3y17" class="commentText"><p>I don&rsquo;t know if you can compare the two games; they&rsquo;re so different it almost feels wrong to call PoE 2 a sequel. But from the standpoint of the developer growth? Absolutely, Chris turned a nothing into the monolith John/Mark inherited, and it continues to provide excellence that sets the standard for the genre.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="nvp7n6c" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Deqnkata</div>
        <div>1 | 28 minutes ago </div>
      </div>
      <label for="nvp7n6c" class="commentText"><p>I havent played 1 so i`m curious on veterans reaction on 2. Obviously we don`t have numbers but seems many are more or less disappointed with 2 for now and the popularity of the game is exploding with newer players that havent played the first game. Again i`m just generalizing and there are plenty of people that also jump between the games as well (which doesnt exclude them being not quite excited with 2). Do you think the difference between 1 and 2 is comparable with what Diablo went through between 2 and 3 for example? I think their philosophy(amongst many other things) really changed there while i feel PoE is still mostly sticking to its guns with some friction, customization, difficulty for example. Again havent played 1 so i could obv be wrong :D</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="nvp9993" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Gimatria</div>
        <div>1 | 12 minutes ago </div>
      </div>
      <label for="nvp9993" class="commentText"><p>I&rsquo;ve played PoE1 for 2500 hours and I think PoE2 is superior in almost every way. Obviously it&rsquo;s still missing a lot; classes, skills, weapons, support gems, ascendancies, mechanics. So it will only get better.</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

    
  </div>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nvp0dwe" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Shimazu_Maru</div>
        <div>-5 | 2 hours ago </div>
      </div>
      <label for="nvp0dwe" class="commentText"><p>Always funny to See people say Poe2 is worse than poe1. Well If you compare the Alpha/early Access footage it does seem its slightly ahead</p>

    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="nvp7zqn" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Impressive_Award_679</div>
        <div>1 | 24 minutes ago </div>
      </div>
      <label for="nvp7zqn" class="commentText"><p>Yeah i mean this argument makes no sense. While poe1 was early funded by GGG themselfs in those staged mostly, Poe2 is funded by the Poe1 supporters and millions of dollars. Also having just a small team with still mostly not that experienced developers compared to a full triple a like studio with over 100 of employees and tons of experiences is a slighty different process no? So comparing the early stages of Poe1 and Poe2 doesnt sound like anything usefull no?</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

        
      
    </div>
  </body>
</html>
