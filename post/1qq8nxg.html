    <h2>
      <a class="postTitle" href="/r/Poe2BudgetCraftGuide/comments/1qq8mqa/is_it_mathematically_cheaper_to_craft_your_own_4/"><p>Is it mathematically cheaper to craft your own +4 amulets?</p>
</a>
    </h2>

    

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="o2esgau" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Grovington_III</div>
        <div>1 | 2 hours ago </div>
      </div>
      <label for="o2esgau" class="commentText"><p>I can&rsquo;t say for sure about this craft because I haven&rsquo;t done it, but imo it&rsquo;s almost always cheaper to craft your own stuff. You can definitely strike out and end up spending more don&rsquo;t get me wrong, but people profit craft for a reason.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="o2esjst" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Serious-Ebb-4669</div>
        <div>2 | 2 hours ago </div>
      </div>
      <label for="o2esjst" class="commentText"><p>If your math is correct- the margin seems reasonable enough to buy one instead so you’re not risking the variance.</p>

<p>It might be cheaper <em>on average</em> but mathematically 25% of samples you will go 15 in a row and not hit a single one, leaving you with no +4s after a massive investment.</p>

<p>So I think bankroll is the main factor here- sure you could get lucky but there’s a solid chance you don’t and end up spending more than if you just bought one.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="o2evb77" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Exoskeleton78</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="o2evb77" class="commentText"><p>the math already accounts for the unlucky 14% percentile.</p>

<p>any lower and you are among the top 14% unluckiest player in poe2 lol</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="o2exh2a" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Serious-Ebb-4669</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="o2exh2a" class="commentText"><p>Yeah my math runs the base chances.</p>

<p>Just want to clarify that you don’t have an 87% chance of that outcome happening- that outcome will occur 87% of the time in the long run. They seem equivalent, but variance can kill you in the short run.</p>

<p>This is becuase if you have 20 amulets your chances of missing your first 6 is still greater than 50%. If that occurs, your chances of hitting one is significantly lower than 87%.</p>

<p>So yeah I think you’re right- but I wouldn’t recommend investing into this strategy if all someone has is 500 divs.</p>
</label>
    </div>
  </label>

      </div>

  </label>

<div class="commentAndChildren">

      </div>

<p>With 100 attempts you would average 10 hits with a standard deviation of 3.</p>

<p>So a “normal” outcome would be between 6-14 hits.</p>

<p>So yeah, if your math shows that 5 hits is profitable, then I would say if you are able to increase the sample size you’re good here.</p>
