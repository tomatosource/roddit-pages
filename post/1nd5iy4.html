      <label for="ndeacou" class="commentText"><p>EDIT: Imgur compression sucks, <a href="https://imgur.com/a/wrnN54Y" target="_blank">so here are the Realms in higher resolution.</a></p>

<p>Building on the well received idea of the Interludes, I propose replacing the endless Atlas with Realms - themed mini-acts with unique flavour, mechanics, and rewards, with space for end-game lore, narrative, and gameplay variety. They can be empowered like Tablets, which apply to the entire Realm - no more tower stacking!</p>

<p>Once entered, Realms function as a limited Atlas, with a number of nodes rolled based on the size. There is a themed distribution of biomes and encounters, but they are still ultimately random.</p>

<p>The first two tan lines describe the areas of interest and the special enemies you will encounter. The blue lines are Realm specific mechanics that you can interact with directly. The unique-coloured line describes what the Finale will be.</p>

<p>In every Realm, there is a Finale - the final boss encounter, and usually one or two Points of Interest relating to the Realm mechanic. Precursor towers remain, but function differently. They are now exit points for the Realm, connecting to other fragments of time and space. To complete the Realm, you need to finish the Finale encounter and complete a Tower map. (In any order, it activates a UI button)</p>

<p>For quality of life you can reroll your options at an escalating cost to gold (providing an end game gold sink), lock an option, and earn free rerolls if you complete 100% of a Realm. As a system this can be easily expanded with future updates adding more Realms. To balance Tablets, there would need to be a &lsquo;Tablet Magnitude&rsquo; effect that inherently applies to undersized Realms, and negative to oversized Realms.</p>

<p>It’s a lot of fun coming up with Realm ideas. A quick description of some my realm ideas:</p>

<ul>
<li><strong>Karui Achipelago:</strong> Every Karui stronghold will roll a tribe chieftain, and a type of loot or currency they drop. Each one you kill upgrades the surviving chieftans. The last chieftain left will be the strongest, with the best rewards. You’ll be able to mouse over the stronghold to see the item type they drop as a tooltip/modifier.</li>
<li><strong>Forgotten Phaaryl:</strong> Somewhere in the Realm will be a Lightless Well zone, which is like the Act 2 Abyss zone, with Lightless Depths and a Well side area at the end. Clicking this Well doesn’t Desecrate an item, but destroys the Untainted Paradise and replaces it with an Abyssal Depths area. So you have a choice between two finales that are good for different reasons.</li>
<li><strong>Cuachic Contingency:</strong> The Cuachic Vault’s side vaults have <em>much</em> better loot, but are also locked. You get keys from clearing out Vaal Outpost areas.</li>
<li><strong>The Last to Die:</strong> A Softcore Only option, it generates a huge Realm, which is rapidly destroyed by The Scourge as you clear it. There are no Towers in this one, and the Finale is just one endless Scourge that invades your map, and rapidly grows in power and reward. Because people will of course devise OP builds, at some point it’ll just instakill you, to kick you out of the Realm and stop infinite farming cheese.</li>
<li><strong>Yaomac’s Nightmare:</strong> Not too much mechanically going on here, Chaotic just means the biomes and layouts will be super highly randomised, as fitting for a Trialmaster themed Realm.</li>
<li><strong>Vastiri Archives:</strong> ‘Secrets’ is a Realm only currency (That gets destroyed when you finish) used for interactions that you can do any time on the screen. In this case, it opens a shop menu where you can spend it on either currency or jewellery. Some other ideas could include direct crafting on items, or modifying the map, or quest items dropped by mobs.</li>
</ul>

<p>I used a div card editor, If you want to create some of your own, <a href="https://pastebin.com/pw4R4BEf" target="_blank">you can save this pastebin as HTML</a>, and <a href="https://www.poewiki.net/images/e/ec/Divination_card_frame.png" target="_blank">save the frame image locally</a>. If you want the PoE font, its Fontin-SmallCaps which is available free online.</p>
