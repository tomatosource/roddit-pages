

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>

<div class="commentAndChildren">

    <div class="comment">
      <div class="commentHeader">

        <div>1 | 3 minutes ago </div>
      </div>
      <label for="nt6v5o5" class="commentText"><p>If they were to do this, they would probably need to do something like change the power charge line to 100% more damage per power charge consumed&rdquo;, and add a &ldquo;70% less damage&rdquo; line, to make actually consuming charges have a point. And something equivalent for the endurance charge line.</p>
</label>

</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nt6umhu" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>40kguy69</div>
        <div>1 | 6 minutes ago </div>
      </div>
      <label for="nt6umhu" class="commentText"><p>Already pretty strong without &ldquo;fixing anything&rdquo;. You get endurance charges for spending rage in bear mode and breaking armour also nets you a ton which bear also has skills for. At higher gem levels its equiv to another you casting spells where poe1 its like basline <sup>1</sup>&frasl;<sub>4</sub> of a you.</p>

<p>You might not like the mechanic which is fair enough but one can easily see why they choose this approach rather then having it be a skill where you put 8 of them down every fight is rapid succession like poe1.</p>
</label>
    </div>
  </label>

<div class="commentAndChildren">
  <input id="nt6uyqz" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>patrincs</div>
        <div>1 | 4 minutes ago </div>
      </div>
      <label for="nt6uyqz" class="commentText"><p>i don&rsquo;t think totems are really functional if you can&rsquo;t drop 4-5 of them within like 3 seconds.  If your plan is, go into bear, generate and spend rage then leave bear form and drop 1 totem, then repeat, your timeline for dropping 5 totems is going to be like 40 seconds lol.</p>
</label>

  <input id="nt6vao1" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>40kguy69</div>
        <div>1 | 2 minutes ago </div>
      </div>
      <label for="nt6vao1" class="commentText"><p>Again, its casts like another you self casting. 4 of them casting spark is lik 4 of you self casting spark. The comparison to spell totem support is that the totem baseline stats is <sup>1</sup>&frasl;<sub>4</sub> of a you.</p>

<p>You get the poe2 less and have less but its way stronger. This was the intentional design choice.</p>

<p>They only want a very dedicated totem build to walk up and drop 4 in succession.</p>

</html>
