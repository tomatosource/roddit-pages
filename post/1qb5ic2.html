

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://www.youtube.com/watch?v=TEETMpy25b4"><p>[Nuggets] Jamal Murray Should Be An ALL-STAR 📢 Here’s Why!</p>
</a>
    </h2>

    

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="nz83d0p" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Icy_Rich_6076</div>
        <div>5 | an hour ago </div>
      </div>
      <label for="nz83d0p" class="commentText"><p>He came into the season fully in shape for the first time. That&rsquo;s the entire difference in an all star vs a streaky talent with nagging injuries. I was so mad at his contract extension, but he has fully earned it this season. The 1-2 combo with Jokic is back to where it was during their title run</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nz8fgv3" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>definitelynotagay | Raptors</div>
        <div>1 | 16 minutes ago </div>
      </div>
      <label for="nz8fgv3" class="commentText"><p>The whole &ldquo;Jokic never had an All Star teamate&rdquo; rhetoric is in bad faith.</p>

<p>It may be technically correct, but Jamal would have 100 percent been an all-star after the bubble and after the championship if it weren&rsquo;t for injuries.</p>

<p>He&rsquo;s put up better playoff performances than a lot of perennial all stars.</p>

<p>He&rsquo;s the first player I know where people were like &ldquo;oh cool, you can do that when the stakes are the highest? Prove it when the games don&rsquo;t matter!&rdquo;</p>

<p>Like Jesus, the guy had a 34 pt triple double in the finals and people think he&rsquo;s not good enough for Kevin Hart to talk over him in a meaningless game.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nz8i1qh" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>pacifismisevil | Grizzlies</div>
        <div>1 | 4 minutes ago </div>
      </div>
      <label for="nz8i1qh" class="commentText"><p>Nice video but I dont think he&rsquo;s going to make it. Stats wise he&rsquo;s around the 25th best player this season and he was 15th in the west in the latest fan vote behind Kawhi, Harden &amp; AD. He had a chance to step up with Jokic being out, but now he&rsquo;s missing games so it&rsquo;s a harder sell, especially with how deep the west is.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nz857vv" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>ElGalloAzucarado</div>
        <div>-5 | an hour ago </div>
      </div>
      <label for="nz857vv" class="commentText"><p>Certainly not for that haircut on the left.</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
