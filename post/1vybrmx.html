

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/8hstgvht0llh1.jpeg"><p>ward stack crafting boots</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/8hstgvht0llh1.jpeg" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="p5vlxzo" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>BastianHS</div>
        <div>1 | 10 minutes ago </div>
      </div>
      <label for="p5vlxzo" class="commentText"><p>Try to get t1 life on the prefixes.  Olroths flask guard caps out at 200% of your max life so you want t1 life on everything</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="p5vm2cv" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>CaptainAgnarr | We that get Baited</div>
        <div>1 | 10 minutes ago </div>
      </div>
      <label for="p5vm2cv" class="commentText"><p>This is tricky, there are many branching options for how to proceed based on what you hit along the way. Also some extra work cause of +1 suffix. The pivotal part is that you&rsquo;ll want to use the increased runic ward alloy, but it has a super low ilvl.</p>

<p>First I&rsquo;d get a 3rd resistance (if that&rsquo;s what you want) in the suffix. Then you&rsquo;ll whittle for 1 good prefix, then exalt prefix, then <sup>50</sup>&frasl;<sub>50</sub> the runic ward alloy, then desecrate the skill dur if you win.</p>

<p>If during this the whittle mod goes to the suffix, unless you get lucky and hit your skill effect duration, in which case switch to sinistral erasures until you hit 1 good prefix, then again exalt and <sup>50</sup>&frasl;<sub>50</sub> the alloy.</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
