      <label for="nb72f8e" class="commentText"><p><strong>Anfernee Simons’ Future With Celtics Remains Uncertain: NBA Executives</strong></p>

<p>By Steve Bulpett</p>

<p>There’s a very good reason Anfernee Simons Celtic jerseys aren’t exactly a hot item at the NBA Store.</p>

<p>Because he may never get to wear one.</p>

<p>The 26-year-old scoring guard (a level up from shooting guard) was acquired from Portland for Jrue Holiday in what was essentially a bookkeeping move to help get Boston under the insidious second apron. From the moment the transaction was announced on July 7, his Celtic Life Expectancy became wholly uncertain — and remains so with training camp a month away.</p>

<p><strong>A General Manager Told Heavy on Celtics That Boston Is ‘Still Very Much Willing to Talk About’ an Anfernee Simons Trade</strong></p>

<p>In terms of trade possibilities, one general manager told Heavy on Celtics flatly, “They’re still very much willing to talk about Simons.”</p>

<p>There’s also the huge matter of whether Boston would be able to re-sign him if he does stay the year, but that’s a bridge off which the club may never have to jump.</p>

<p>There is, however, another point of view in some NBA circles.</p>

<p>One veteran (and quite accomplished) personnel executive wonders whether the Celts should be so quick to break up with the new guy. The caveat here would obviously be another club knocking Brad Stevens’ absorbent white athletic socks off with an unrefusable offer.</p>

<p>But, though he acknowledges Simons’ defensive issues, the aforementioned exec is high on the 6-foot-3 collector of points.</p>

<p>“I don’t know what the Celtics are thinking, but other than Jaylen Brown, there’s not a better scorer than Simons on that roster,” he said.</p>

<p>“I mean, they obviously aren’t going to play the same way they played when they had (Kristaps) Porzingis and (Al) Horford and Holiday. Joe Mazzulla’s going to have to completely change the style of play. And Simons… nobody can score like him on that team other than Brown. He’s the second-best scorer, and it’s not even close.”</p>

<p>Nodding to the other end of the floor, the exec said, “You know, the whole idea of having a guard who can defend like Jrue Holiday — who the hell defends like Jrue Holiday? There isn’t one out there. That guy’s unbelievable. I just think Mazzulla changes their style of play, and if Simons is there, they figure it out.”</p>

<p>Read More From Heavy</p>

<p>Parity or Pain? NBA Decision-Makers Tell All on the Second Apron</p>

<p><strong>If Anfernee Simons Stays With the Celtics, a Front Office Source Says, ‘I Bet You He’s Their Leading Scorer’</strong></p>

<p>After a brief discussion of how some of those changes might look as they transition from theory to real NBA life, the front office guy doubled down on Celtic Simons.</p>

<p>“I bet you he’s their leading scorer,” he said. “Even with Jaylen. He’s going to have the ball a lot, and that dude can really score. That offense is going to have to change to accommodate him, and, on the last year of his contract, he’s going to let it fly.</p>

<p>“As the kids say, he’s a bucket. He is. That dude is a bucket. He can really fill it up. And remember, he was averaging around 20 in the West. What do you think he’s going to do in the Eastern Conference, which is a LOT less competitive? How’s he not going to score and score big?”</p>

<p><strong>A Trade Could Take Awhile</strong></p>

<p>Be that as it may, another rival front office granted that Simons could be traded before the ink on this online story dries. But he talked up the possibility that a move could take a while.</p>

<p>“Anfernee Simons makes $27-plus million,” he said. “Who’s got room to put that in their cap? And he’s up after this year, so the Celtics aren’t going to want to take back anything that would load in more salary of less flexibility.</p>

<p>“I think, unless they are presented with some sweetheart situation, the most likely time for Simons to get moved — again, if he even does — would be at the trade deadline.</p>

<p>“I could see Boston being out of it and another team thinking they need a scorer like Simons to put them over the top. I could see another team that’s close wanting to add that kind of firepower down the stretch and into the playoffs. Even if it’s a rental, a team might go for him, because what we’re seeing now with the second apron and all that, if you win, it’s hard to keep a team with high-priced guys together. An expiring deal is so valuable.”</p>

<p>Whether it comes now or later.</p>
