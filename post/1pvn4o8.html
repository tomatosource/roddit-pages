.postLink:visited {

.commentAndChildren {

.commentText,
.commentText * {

  color: #c39429;

.postTitle {

  color: #c39429;

.commentAndChildren > .commentList {
  display: none;

.commentAndChildren > input:checked ~ .commentList {

.commentAndChildren label .comment .commentText {
  white-space: nowrap;

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;

.selfPostContainer {

.streamableContainer {

  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

<p>4.) juice is anything that buffs loot. so tablets with either monster effectiveness, rarity, or rare mobs. you want <sup>2</sup>&frasl;<sub>3</sub> of those prefixes but early on you wont have these as you need to kill the arbiter of ash to unlock rare tablets. once you get to this point peep a youtube video for the strat you’re doing and they’ll talk about good tablet suffixes.</p>

<p>also if you do get deeper into the endgame, don’t run any extra swamp/water maps if you can manage. you want to save all these and bookmark them to come back to later on with the “Local Knowledge” atlas node on. don’t ever use that node on non swamp and water maps as it straight up lowers your currency drops.</p>
