

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/beigpor60ceg1.png"><p>milkybk hard temple</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/beigpor60ceg1.png" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="o0i42ls" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>shiny_gallade_91</div>
        <div>1 | 3 hours ago </div>
      </div>
      <label for="o0i42ls" class="commentText"><p>I think u should finish the main chain before working on the 2nd</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="o0ilrlw" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>___Worm__</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="o0ilrlw" class="commentText"><p>I would also say keep building the 1st while adding to the 2nd when you can. Also try to get you a generator down on your roads when it comes available, it will give you more +1 medallions.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="o0it5pz" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>the_booox_ghost</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="o0it5pz" class="commentText"><p>I&rsquo;m at about the same place as you but I&rsquo;m doing the Russian tech with the garrison and spymaster. What kind of loot are you getting per run with yours?</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="o0j2id1" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>LetztesWort</div>
        <div>1 | 11 minutes ago </div>
      </div>
      <label for="o0j2id1" class="commentText"><p>You will need 1 sac room charge (roman road) to get golem chain started and it will be a pathing tile adjacent to your starting golem in your golem chain. I wouldn&rsquo;t use sac room for any other purpose until you are certain golem chain will survive forever, despite you losing ~9d per run because of cultivation orb.</p>

<p>You should never break into golem chain development until you have the lock economy to support it. I&rsquo;d say 4 banked locks before you consider this. You can pocket a golem and smithy medallion to expedite the development but you would never pocket them over additional locks, ever. So with that in mind, continuing on to get your last spies down in main chain is not insane.</p>

<p>Golem road is a grind, it requires 2 &ldquo;American sandwiches&rdquo; (look up tech) to complete and is pretty taxing on locks because it often requires 2 at key moments to get the development right. So again, you should never sacrifice lock economy for progression, with the exception maybe being spymasters but I hesitate to even say that with confidence.</p>

<p>For those wondering what this layout returns fully upgraded and with 3 chains, it&rsquo;s between 65-93 raw d/run. I would say average is 70-ish raw d. 1 t0 per run (fully upgraded) is not uncommon. I&rsquo;ve had runs with 3 t0s.</p>

<p>EDIT: Important to mention my character rarity is ~150%</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
