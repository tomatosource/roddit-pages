.commentHeader {

  font-size: 24px;

  color: #c39429;

.postTitle {
  text-decoration: none;
  color: #c39429;

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {

.selfPostImage {

}

.streamableContainer {

  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}
