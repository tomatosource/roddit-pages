<p>Today, we’re kicking off our annual <em>Ramp to Camp</em> series, where we ponder a new Celtics topic every weekday in September. We cobbled together some of NBC Sports Boston’s finest behind-the-scenes hoops savants &ndash; the people who make our shows and content shine &ndash; and peppered them with questions about the 2025-26 Celtics. </p>

<p>To kick things off, we gave them a very open-ended query: What do you most want to learn about this team during the 2025-26 season?</p>

<p>Regardless of how competitive the Celtics are this season &ndash; we’re <a href="https://www.nbcsportsboston.com/nba/boston-celtics/jayson-tatum-timeline-no-ceilings-brad-stevens/724373/" target="_blank">more bullish about their potential than most</a>, despite the talent drain brought upon by the second apron &ndash; we’re going to learn an awful lot about this team. That questions that have lingered, even during the march to Banner 18, will be answered.</p>

<p>How does Jaylen Brown fare in the 1A role while Jayson Tatum rehabs from Achilles surgery? How will Payton Pritchard respond if he&rsquo;s thrust into a starter role? Which of the younger players on this roster can blossom and show they can be key pieces of Boston’s next title contender?</p>
