

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://www.reddit.com/r/bostonceltics/comments/1qm3pve/how_many_wins_are_they_on_pace_for/"><p>How many wins are they on pace for?</p>
</a>
    </h2>

    
    <div class="selfPostContainer">
      <p>It feels pretty guaranteed to make the playoffs, but how close will the race for 2nd and 1st be?</p>

    </div>
    

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="o1j1y4g" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>primepierce34</div>
        <div>3 | an hour ago </div>
      </div>
      <label for="o1j1y4g" class="commentText"><p>52 if our win percentage stays the same</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="o1j26aw" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Limp_Custard6943 | JB FOR THREEEEEEE</div>
        <div>0 | an hour ago </div>
      </div>
      <label for="o1j26aw" class="commentText"><p>66</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="o1jawc9" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Sm0k3inth3tr33s | Your favorite teammate&#39;s favorite teammate</div>
        <div>2 | 40 minutes ago </div>
      </div>
      <label for="o1jawc9" class="commentText"><p>So there&rsquo;s a fairly simple formula to figure this out -</p>

<p>Find the total # of games played (28+16=44)</p>

<p>Divide the wins by the total # of games played (28÷44) to find current win percentage (.636)</p>

<p>Multiply current win % by total games played for the entire season (.636 x 82) which leaves you with your current pace (~52)</p>

<p>I&rsquo;ve never been any good at math, so there might be an easier way, but this is how I got there lol. Hope this helps!</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
