

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/srn7ac07vwcg1.png"><p>Is this map juicy enough?</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/srn7ac07vwcg1.png" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="nz5hnhf" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>scotcheggfan</div>
        <div>2 | 2 hours ago </div>
      </div>
      <label for="nz5hnhf" class="commentText"><p>how do people even get this much stuff?</p>

<p>I get my t15 maps up to 0 revives available and it basically only has like 7 modifiers max</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="nz5iaqs" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>dehsael</div>
        <div>1 | 2 hours ago </div>
      </div>
      <label for="nz5iaqs" class="commentText"><p>Corruption can get up to 8 mods, and then it&rsquo;s two things: 3 4-mod tablets, and an atlas tree which increases effect of tablets &amp; waystone modifiers.</p>

<p>If you read through OP&rsquo;s modifiers, all the &ldquo;abyss&rdquo; ones are on abyss tablets, for instance &amp; the last 6 seem like tablet mods for sure, too.</p>

<p>I think the atlas node which double-corrupts maps can get you up to a 10-modifier map too but prevailing opinion is that it&rsquo;s not worth it due to downside potential as I understand it.</p>
</label>
    </div>
  </label>
  
</div>

    
      
<div class="commentAndChildren">
  <input id="nz5kk2e" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>deathlordd</div>
        <div>1 | 2 hours ago </div>
      </div>
      <label for="nz5kk2e" class="commentText"><p>This map has 14 modifiers. Corrupted added 2 and then 6 modifiers from tablets.</p>

<p>Still didnt drop anything valuable though . ;))</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="nz5vp72" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>ateuatoa</div>
        <div>1 | 28 minutes ago </div>
      </div>
      <label for="nz5vp72" class="commentText"><p>91% rarity itens found on the map, if you doesn&rsquo;t have at least 60% on your gear, it will be hard to drop something valuable</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

    
  </div>
  
</div>

        
      
    </div>
  </body>
</html>
