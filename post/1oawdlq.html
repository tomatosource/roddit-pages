

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>

        <div>Antithesys | Minnesota Twins • MVPoster</div>
        <div>2 | 38 minutes ago </div>
      </div>
      <label for="nkcp0ru" class="commentText"><p>This was <a href="https://www.baseball-reference.com/boxes/LAN/LAN196210030.shtml" target="_blank">October 3, 1962</a>, in the deciding game of the three-game playoff between the Dodgers and Giants to determine the National League pennant. It was Wills&rsquo; 104th stolen base of the season, then the high mark of the modern era; it was not itself the record-breaker, as Cobb&rsquo;s total was 96 (and multiple 19th-century players had surpassed 100 SB in their time). No one would best Wills for another twelve years.</p>

<p>This game did, however, give Wills a different record which still stands (and perhaps always will): he was the lone Dodger to appear in every game of the season, and as tiebreaker playoff games count as part of the regular season, it gave him 165 games played that year. The three-game tiebreaker format was never used again.</p>

<p>The Giants&rsquo; catcher, Ed Bailey, threw wild in an attempt to stop Wills at third, and Wills came in to score. The Dodgers were now up by two runs in the seventh inning. However, the Giants came back with four runs in the top of the ninth and turned the tide, winning the game and thus their first pennant in San Francisco. They lost the World Series to the Yankees (Game 1 was <em>the day after</em> this game) in what would be the final glory of the classic Bronx dynasty. The day the World Series ended, the Cuban Missile Crisis began.</p>

<p>Despite this ad&rsquo;s optimistic prophecy, Maury Wills did not reach the Hall of Fame, nor did the pictured third baseman Jim Davenport. But the first baseman in the background, Orlando Cepeda, was elected in 1999.</p>
</label>

</html>
