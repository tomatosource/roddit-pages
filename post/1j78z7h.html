

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
}

.selfPostContainer * {
  color: white;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/szolit1aeone1.png"><p>Iron rune or Soul core of Citaqualotl?</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img src="https://i.redd.it/szolit1aeone1.png" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="mguyzsf" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>palbajim</div>
        <div>1 | 27 minutes ago </div>
      </div>
      <label for="mguyzsf" class="commentText"><p>Vaal</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="mgv005z" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>A9Carlos</div>
        <div>1 | 21 minutes ago </div>
      </div>
      <label for="mgv005z" class="commentText"><p>I mean,why not just socket the iron rune, then the soul core and Check your tooltip DPS?  Yes, you risk the physical being better but it&rsquo;s unlikely to be if you&rsquo;re running an ele damage build.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="mgv0zlf" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Fragment7</div>
        <div>1 | 15 minutes ago </div>
      </div>
      <label for="mgv0zlf" class="commentText"><p>I thought I couldn&rsquo;t remove runes once they are socketed? How can I compare the 2?</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="mgv23zr" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>gesteratops</div>
        <div>1 | 9 minutes ago </div>
      </div>
      <label for="mgv23zr" class="commentText"><p>You can’t remove runes, BUT you can overwrite them with new ones as many times as you want</p>
</label>
    </div>
  </label>
  
</div>

    
      
<div class="commentAndChildren">
  <input id="mgv2ake" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Leading-Mousse9326</div>
        <div>1 | 8 minutes ago </div>
      </div>
      <label for="mgv2ake" class="commentText"><p>You can but they&rsquo;ll be destroyed. So, socket the iron rune, then the soul core (destroys iron rune) and then decide whether to keep the core or destroy it for a rune again.</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

    
  </div>
  
</div>

        
      
    </div>
  </body>
</html>
