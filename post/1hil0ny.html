      <label for="m2zih3d" class="commentText"><p>From <a href="http://Globe.com" target="_blank">Globe.com</a></p>

<p>By Adam Himmelsbach</p>

<p>Celtics forward Jaylen Brown stepped to the dais after going 1 for 8 from the 3-point line and picking up a costly technical foul in the fourth quarter of Boston’s <a href="https://www.bostonglobe.com/2024/12/19/sports/celtics-zach-lavine-bulls/?p1=Article_Inline_Text_Link" target="_blank">surprising 117-108 loss to the Bulls</a> on Thursday night, but he would be forgiven if that result was not at the front of his mind.</p>

<p>The homes of Brown’s mother, Mechalle, and Celtics assistant coach Amile Jefferson were broken into this week. Mechalle Brown was at home at the time of the <a href="https://www.bostonglobe.com/2024/12/18/sports/jaylen-brown-celtics/?p1=Article_Inline_Text_Link" target="_blank">attempted burglary Sunday</a>, while the Celtics were facing the Wizards in Washington.</p>

<p>“We’re all right,” Jaylen Brown said. “We’ll deal with situations accordingly. Thank God nothing serious or physical or threatening happened, but the fact that it could have kind of lingers in your mind.”</p>

<p>At approximately 8:21 p.m. Sunday, Wellesley Police responded to a call at Brown’s mother’s home and later confirmed there was an attempted break-in when they found a broken window. Police said it did not appear anything had been disturbed inside the residence, nor did it appear anything was taken. There were no injuries, and the investigation is ongoing.</p>

<p>“It’s been a tough week,” Brown said. “Obviously, my mother’s security is of utmost importance to me and has been compromised, and so it’s been a tough week. We’ve had media members and reporters outside our house trying to get an inside scoop, but have some respect. It’s been a tough week; I’m not going to lie.”</p>

<p>On Monday, league sources said, a break-in was reported at the Newton home of Jefferson, whose 2024 NBA championship ring was stolen. Jefferson, who was not home at the time of the burglary, declined comment prior to Thursday’s game. He just smiled and gave a thumbs-up gesture to indicate that he is fine.</p>

<p>Celtics coach Joe Mazzulla said Thursday that he is most relieved that both men and their families were unharmed.</p>

<p>“They’re healthy, which is good, so they’re safe,” Mazzulla said. “It’s a scary thing, I think, for people. You see it happen around different sports and you’re obviously aware of it. But when it happens to you, you have an understanding of the risk there. We’re just happy that they’re safe.”</p>

<p>In a statement issued to the Globe on Thursday, the NBA said it was “deeply concerned” about the burglaries in Boston and that its security representatives have been in touch with the Celtics and law enforcement to offer assistance. In a separate statement, the Celtics said they are working with authorities following the incidents.</p>

<p>Over the past two months, the homes of Chiefs stars Patrick Mahomes and Travis Kelce, Bengals quarterback Joe Burrow, Timberwolves guard Mike Conley Jr., and Bucks forward Bobby Portis Jr. have all been burglarized while the players were participating in games.</p>

<p>“Hopefully anybody who it hasn’t happened to yet, make sure you have things in place to make sure that it doesn’t,” Brown said. “But obviously to go through that experience, people still in there, and still in the crib, it just makes you think about some things differently.”</p>
