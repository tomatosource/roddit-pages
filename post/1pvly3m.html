      <label for="nvx36ki" class="commentText"><p>PoB (fixed export): <a href="https://poe.ninja/poe2/pob/141b6" target="_blank">https://poe.ninja/poe2/pob/141b6</a></p>

<p>Edit: <del>Note: I do not yet have the Heart of the Well and Sapphire jewel. I fill out my templates as I aquire the items.</del> I have now. PoB updated. :)</p>

<hr>

<p>To make it a little easier for myself, here&rsquo;s a snippet from the description:</p>

<blockquote>
<p>This level 91 Titan character ignites the ground it walks on and deals Fire Damage to nearby monsters, based on a percentage of maximum Life. Simply by moving, you can vaporize bosses in seconds and decimate entire packs of monsters, including stacked T16 Abyss rares.</p>

<p>The magic combo here is made up of Birth of Fury, Pragmatism and Beira&rsquo;s Anguish, paired with Blackflame and Cracklecreep. The entire build functions solely with the reflection of ignites you inflict, enabled by the passive Self Immolation. Pragmatism is essentially poor man&rsquo;s Mageblood, enabling the charm to be used indefinitely.</p>

<p>Because the charm makes you immune to Ignite, you do not need to pick up any reduced Ignite magnitude passives. Furthermore, the build is essentially immune to Bleed and Poison, and can also be made Freeze immune by simply swapping in a charm you can carry around in your Titan&rsquo;s backpack.</p>

<p>Despair and Withering Presence, Thunderstorm and Shock Conduction II are used to amplify the damage enemies take. This method with Blackflame feels overall better in my opinion, because enemies have a lower base Chaos Resistance than Elemental, and it&rsquo;s less annoying to actually play with.</p>

<p>The character is also completely immune to slows due to 100% reduced slow magnitude passives. A little bit of Block (32%) and Armour (~3.5k), paired with up to 4.4k Life, prevents being bursted down even in rippy tier 15 and tier 16 maps.</p>

<p>So far, I have defeated level 81 Atziri, level 82 Vessel of Kulemak, level 78 Xesht, level 78 Simulacrum, level 78 King in the Mists, and many other endgame map bosses on the first try.</p>

<p>This build feels incredibly strong, despite its rather mediocre clear speed. Let me know your thoughts! I hope you enjoy this build.</p>
</blockquote>

<hr>

<p>I would love some feedback on this, as I actually, seriously, have no real idea if this is as good as I think it is, mediocre clear speed aside. I do not watch PoE 2 content other than one specific streamer. Thanks! :)</p>

      <label for="nvy1anw" class="commentText"><p>It&rsquo;s a fun idea, but the techs are actually well known (and even were meta-ish for a few days in 0.2, before a very strong interaction was patched). The boss dps is quite impressive for that kind of build, but I feel like it&rsquo;s not a very good version of the build just because it&rsquo;s so unbalanced towards single target damage. You can achieve about half of your single target dps while being tankier and having a better clear with others setups (on Ritualists for example).</p>

<p>So good idea, always fun to see that kind of interactions, but I really think the build is too unbalanced to be considered &ldquo;good&rdquo; in a game like PoE2 where it&rsquo;s a bit difficult to just do bossing. However, I think you could come up with something between this version and something more clear oriented.</p>

<p>In that scenario, you could compensate a fair bit of the lost single target dps with two very simple changes: a weapon swap with Saitha&rsquo;s Spear, and change your wand for an Unborn Lich with block chance and ignite-related mods. Just with a good Unborn Lich, you&rsquo;ll get about 20% more dps.</p>
