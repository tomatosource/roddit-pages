

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://www.youtube.com/watch?v=rNnVjFj7MeA"><p>Never forget when Bob Davidson robbed Japan in the 2006 WBC.</p>
</a>
    </h2>

    

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="o80zfnp" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Fun-Raise-3120</div>
        <div>9 | 7 hours ago </div>
      </div>
      <label for="o80zfnp" class="commentText"><p>Bod Davidson was not a good umpire period.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="o813f71" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>oogieball | Dumpster Fire • New York Mets</div>
        <div>8 | 6 hours ago </div>
      </div>
      <label for="o813f71" class="commentText"><p>&ldquo;The Greatest Calling Mistake of the Century&rdquo;</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="o828n9z" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>kami232 | San Diego Padres</div>
        <div>2 | 24 minutes ago </div>
      </div>
      <label for="o828n9z" class="commentText"><p>Context: the runner tagged up, making the play a sac fly. Home plate ump Bob Davidson ruled he left the bag before the ball was caught, negating the run. Team USA would go on to win that game. Slow motion apparently suggests the runner correctly tagged up. (But this clip doesn’t have that angle.)</p>

<p>Team USA would shortly be eliminated from the tournament, since they were in the group stage and they did not have enough points to advance. Japan would advance and ultimately win the whole tournament. So fortunately for Japan, Bob’s call was moot.</p>

<p>(I had to look it up since I do not remember this controversy and I don’t speak Japanese.)</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="o81b86u" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>ajockmacabre | Boston Red Sox</div>
        <div>-7 | 5 hours ago </div>
      </div>
      <label for="o81b86u" class="commentText"><p>Having an American umpiring a game involving the U.S is, at best, tinpot as fuck. Does that shit still go on?</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="o81hcje" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Timpa87 | Philadelphia Phillies</div>
        <div>3 | 4 hours ago </div>
      </div>
      <label for="o81hcje" class="commentText"><p>Sorta like all the Canadian referees at the Olympics including games that Canada played.</p>

<p>2006 WBC looks like it used minor league umpires who were almost all US and then had a token umpire from other countries. So each umpire crew had US umps on it.</p>

<p>They certainly could have done a better job of making sure to avoid any perceived favoritism by not allowing umps from the country to handle games involving that country, but they didn&rsquo;t care.</p>

<p>(again, much like the recent Olympic hockey) there were international officials there. They worked games. It&rsquo;s just the &lsquo;bulk&rsquo; was NHL refs.</p>

<p>I don&rsquo;t think any international sporting events in any kind of tournament should have officials/refs deciding the game who are from one of the countries playing.</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

        
      
    </div>
  </body>
</html>
