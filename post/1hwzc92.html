.commentText,

.commentHeader {

  justify-content: space-between;
  color: #c39429;

.postTitle {

.commentAndChildren > .commentList {
  display: none;

.commentAndChildren > input:checked ~ .commentList {

}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;

  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;

.selfPostContainer {
  font-size: 38px;

  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

<div class="commentAndChildren">

        <div>rabid89 | Boston Celtics</div>
        <div>2 | 20 minutes ago </div>
      </div>
      <label for="m6555lr" class="commentText"><p>Honestly, the bigger problem has been our team is just settling for too many 3pt shots early in the shot clock. Especially ones that are off the dribble, above the break, contested, or in isolation.</p>

<p>Celtics offense is strong because of:</p>

<ul>
<li><p>Spacing, having 4 or 5 shooters at all times</p></li>

<li><p>Ball movement, with every player that can make passes</p></li>

<li><p>Multiple guys that can attack closeouts and drive to the rim, generating layups, FTs or passing to create advantages and getting better shots. Mostly Tatum, Brown, White, Jrue, but even Hauser, Horford and Pritchard do this well enough.</p></li>
</ul>

<p>We&rsquo;ve been not doing a great job of the 2nd and 3rd points above. Too many times we settle for an early shot because they could get a shot off. Or guys chucking up pull up 3s for no reason.</p>

<p>Porzingis is a singular force by himself on our offense because he can generate mismatches in the post and get good looks. Something no one else on the team can do like him.</p>

<p>JT&rsquo;s iso game is no doubt elite. But that&rsquo;s not what makes us our offense so great. We need ball movement and guys to drive and kick.</p>
</label>
