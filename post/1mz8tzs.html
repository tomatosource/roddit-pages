

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/l8gj6yplg1lf1.png"><p>Guard as a legitimate defensive layer?</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/l8gj6yplg1lf1.png" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="nahjoic" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>ShelbyGT350R1</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="nahjoic" class="commentText"><p>Doesnt sound like it from just that. Was there any other changes with guard?</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="nahkrmt" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>yourmomophobe</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="nahkrmt" class="commentText"><p>They added fortifying cry, which we don&rsquo;t know the max values yet. They buffed warcaller&rsquo;s bellow so that it only requires 2 points to get no cooldowns on warcries. Jade Heritage was buffed so we don&rsquo;t lose stacks on being hit.</p>

<p>A big hope for this is that there are some guard related nodes added to the new passive tree. Any way to increase the duration could potentially make this all much more painless. If extending warcry duration also extends the duration of the guard granted by fortifying cry it will also make it more functional.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="nahldea" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>ShelbyGT350R1</div>
        <div>2 | an hour ago </div>
      </div>
      <label for="nahldea" class="commentText"><p>Ah I could definitely see that being the case.  Sounds like they are kinda re-making fortify from PoE1 as guard.  I would bet there will be duration nodes on the tree or maybe even a way to generate guard based on heavy stuns or something similar.</p>
</label>
    </div>
  </label>
  
</div>

    
      
<div class="commentAndChildren">
  <input id="nahrl44" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>dryxxxa</div>
        <div>1 | 25 minutes ago </div>
      </div>
      <label for="nahrl44" class="commentText"><p>I was interested in Fortifying Cry as a means to somehow make a Shield Wall Warbringer a thing, but absolutely missed that it grants Guard. It might end up pretty interesting. </p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

    
  </div>
  
</div>

        
      
    </div>
  </body>
</html>
