<p><strong>T15</strong>: A Tier 15 map, accessed with a tier 15 waystone.  The tier of a map increases from 1-15 and goes along with increased difficulty of monsters but also increased quantity of rewards as well as better TYPES of rewards (more rare currencies)</p>

<p><strong>Market</strong>: Can refer to either the commodities exchange where stackable/consumable items can be automatically traded with other players OR the brand new market for instantly trading ANY item with other players even if they are offline.  <strong>Both are accessed through the NPC called Ange.</strong>  This is superior to the old trade system because it doesnt require the seller to respond or even be around, AND it cuts out annoying people who falsely listed items for low prices never intending to actually sell, just to manipulate the market.</p>

<p><strong>Currency Exchange</strong>: The stackable/consumable side of the &ldquo;market&rdquo; described above.</p>
