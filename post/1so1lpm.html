      <label for="ogppamp" class="commentText"><p>From <a href="http://Globe.com" target="_blank">Globe.com</a></p>

<p>By Chad Finn</p>

<p>I had ‘em for 44 wins and the play-in. You?</p>

<p>Be honest now. Save for the random eternally-hopeful diehard, the only people who thought the Celtics could approach *this* — winning 56 games, <a href="https://www.bostonglobe.com/sports/nba/standings/?p1=SectionFront_Utility&amp;p1=Article_Inline_Text_Link" target="_blank">earning the second seed in the Eastern Conference</a>, and <a href="https://www.bostonglobe.com/2026/04/15/sports/celtics-nba-playoffs-expectations/?p1=Article_Inline_Text_Link" target="_blank">having a small but legitimate chance of collecting Banner 19</a> come June — were the people who went out and made it happen.</p>

<p>After all, the Celtics were coming off a season that ended with <a href="https://www.bostonglobe.com/2025/05/16/sports/celtics-knicks-game-6/?p1=Article_Inline_Text_Link" target="_blank">a six-game loss to the Knicks in the second round</a>, a series in which they lost so much more.</p>

<p>Superstar Jayson Tatum suffered a torn right Achilles tendon in Game 5 while lunging for the ball. Their hopes of repeating as champion ended with agonizing abruptness, and it seemed their chances of winning a title in the near future did too.</p>

<p>Suddenly, the recurring term of the offseason was “gap year.” With Tatum certain to be sidelined for months, if not the entire season, Celtics management took the logical step of resetting their luxury tax repeater penalties, which meant resetting a chunk of the roster.</p>

<p>Al Horford, Jrue Holiday, Kristaps Porzingis, and Luke Kornet — important and beloved members of the ’24 champs — moved on. The less accomplished Anfernee Simons, Luka Garza, Josh Minott, and 19-year-old first-round pick Hugo Gonzalez came aboard.</p>

<p>A gap year. Sure looked that way, especially when it didn’t start well. The Celtics lost their first three games, <a href="https://www.bostonglobe.com/2025/10/22/sports/celtics-76ers-season-opener-setback/?p1=Article_Inline_Text_Link" target="_blank">including an opening-night loss to the 76ers</a> when they blew a late 9-point lead and rookie VJ Edgecombe dropped 34 points on their heads in his NBA debut.</p>

<p>Those first three games? Who knew then that they would be the low point, and that most of the issues that ailed the Celtics early — especially rebounding — would become strengths?</p>

<p>Which brings us back to the people who went out and made it happen.</p>

<p>They include president of basketball operations Brad Stevens, <a href="https://www.bostonglobe.com/2026/03/25/sports/celtics-brad-stevens/?p1=Article_Inline_Text_Link" target="_blank">who certainly is appreciated for his extraordinary work</a> in finding the ideal, often unheralded players to fit the Celtics’ close-knit, team-first culture, yet is somehow underrated given the degree of difficulty of building and maintaining a competitive roster.</p>

<p>Remember this for the offseason, whenever it comes: When Stevens signs a player, try to figure out what the front office likes about him and how he might fit. Because there’s an excellent chance that player will become a fan favorite before you know it. Even Simons and Minott, both of whom are playing elsewhere now, won over Celtics fans during their time here, <a href="https://www.bostonglobe.com/2026/01/31/sports/anfernee-simons-celtics/?p1=Article_Inline_Text_Link" target="_blank">especially the former</a>.</p>

<p>Other people who believed? Of course that includes coach Joe Mazzulla, who was giddy in his endearingly odd way at the chance to shut up doubters. Derrick White told a story on his “White Noise” podcast about Mazzulla calling him over the summer, wishing him happy birthday, telling him “everyone thinks we’re going to [stink],’’ and immediately hanging up.</p>

<p><a href="https://www.bostonglobe.com/2026/04/01/sports/joe-mazzulla-celtics-coach/?p1=Article_Inline_Text_Link" target="_blank">Mazzulla may not want the Coach of the Year award</a>, but had better win the thing. One of this Celtic team’s superpowers is how every player right on down the bench — from Garza to Jordan Walsh to Ron Harper Jr. — is ready for his opportunity, even if he hasn’t seen meaningful minutes in a few games, or even weeks. Having players prepared and ready to contribute — or even thrive — when their moment comes is the ultimate reflection of a coach.</p>
