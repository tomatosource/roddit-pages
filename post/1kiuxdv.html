

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://www.reddit.com/gallery/1kiuxdv"><p>Help me figure out what items to upgrade for my cold converted javazon.</p>
</a>
    </h2>

    

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="mrhvb8k" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>AnxietyScale</div>
        <div>1 | 3 minutes ago </div>
      </div>
      <label for="mrhvb8k" class="commentText"><p>Emerald ring and gloves could have more flat dmg. The belt is also kinda meh, but it does it&rsquo;s job if you use it for the res.</p>

<p>Download path of building. That&rsquo;s the most reliable way to check if an item from trading is an upgrade and how significant the power increase is</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="mrhvbom" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Niguard54</div>
        <div>1 | 3 minutes ago </div>
      </div>
      <label for="mrhvbom" class="commentText"><p>Probably your right ring and gloves, base damage of tangletongue is really low so you need the rings and glove to compensate for it. Also get a pair of 35% movement speed boots, the ones you have rn are ass. For the ring you can get a very good one with around 2 div that you won’t need to upgrade for a long time, gloves like 40-50 exalt should give you way better ones and boots you’ll probably get better ones for like 10 exalts</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="mrhviww" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>RyanpB2021</div>
        <div>1 | a minute ago </div>
      </div>
      <label for="mrhviww" class="commentText"><p>I tried doing a ice javelin Amazon then I saw a deadeye version being meta so I went to that then for some reason I can’t seem to get the barrage to shoot out multiple copies so I gave up on that and now I just have a cold deadeye with snipe</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="mrhvk5p" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Ill-Objective-5037</div>
        <div>1 | a minute ago </div>
      </div>
      <label for="mrhvk5p" class="commentText"><p>Belts and gloves are the first two to upgrade. Idk what your evasion is but if its high enough stack damage on gloves. For belt go for resistances and life</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
