

<html>
  <head>

    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>

    <h2>
      <a class="postTitle" href="/r/pathofexile/comments/1mebzxe/poe_1_vs_poe_2/"><p>PoE 1 vs PoE 2</p>
</a>
    </h2>

    

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="n687gsn" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>bigeyez</div>
        <div>1 | 11 hours ago </div>
      </div>
      <label for="n687gsn" class="commentText"><p>I would honestly say 2 first since it is currently the less complicated game. If you play 2 and enjoy it then next time a league starts in 1 try it. Having played 2 first will ironically sort of be a tutorial for 1 which has way more mechanics and systems being a fully complete game while 2 is still early access.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="n6aow6s" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Absolonium</div>
        <div>1 | 2 hours ago </div>
      </div>
      <label for="n6aow6s" class="commentText"><p>Why are you downvoted when you are correct for the most part.</p>

<p>There are some elements of PoE2 that is note directly translatable to PoE1, true.<br>
Leech for example being one of them.</p>

<p>But in terms of general game knowledge, PoE2 is far more approachable.</p>

<p>Try PoE2 first and see what you really like about the game. Do you just enjoy the feel / moment to moment gameplay of an ARPG? Stick to PoE2.</p>

<p>Do you enjoy the meta progression, making characters powerful, theorizing crazy builds, crafting items, chasing powerful uniques, etc? Try PoE1.</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="n69ksyd" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>After-Onion-5900</div>
        <div>1 | 7 hours ago </div>
      </div>
      <label for="n69ksyd" class="commentText"><p>Id say poe 1. Poe 2 needs way more time to cook whereas poe 1 is a fully fleshed out amazing game (the greatest arpg ever made). Poe 2 literally doesnt even have SWORDS in the game yet. The classes and campaign arent finished yet either and its still very rough around the edges. Do yourself a favor and wait until its further along (i wish i had just waited).</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="n69vqo0" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>BraveBrowserFTW</div>
        <div>1 | 5 hours ago </div>
      </div>
      <label for="n69vqo0" class="commentText"><p>Poe 2 for sure, PoE 1 is not new player friendly, I was able to get my older brothers (46 and 43) to try it and they love it compared to PoE 1</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="n6atwvl" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>AutomaticAir3777</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="n6atwvl" class="commentText"><p>what I absolutely like in poe2 in comparison to 1 is the allowance to respec everything I want. passive skills with gold surprised me a lot. next best thing are the skill gems that also can be adjusted with their supports any time you want.</p>

<p>I play poe2 now nonstop since a few weeks and have lots and lots of fun. I always play ssf and brought already three chars to mapping, which I also like a lot.</p>

<p>I would say the real and hurtful optimisation process begins in mapping maybe around t10. I haven&rsquo;t reached that yet. but until then I really, really enjoy to adapt passive tree and gems to the experience and learnings I have during mapping.</p>

<p>only thing I don&rsquo;t like is campaign. but one has to understand that there are currently only two acts done, so the concept can be understood. one fact remains: campaigns take too long. even with my lightning ranger who somehow went full glas canon and ignored everything concerning defenses until mapping. she melted everything in the third of the time my sorceress and monk needed.</p>

<p>aaaaand: ascension. I really, really don&rsquo;t like this crap. it&rsquo;s just tedious.</p>
</label>

  </label>
