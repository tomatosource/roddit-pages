

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://www.reddit.com/gallery/1tpwfar"><p>Do PC controller players like the current button layout?</p>
</a>
    </h2>

    

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="oobvabd" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>BladeJFrank</div>
        <div>1 | 8 minutes ago </div>
      </div>
      <label for="oobvabd" class="commentText"><p>I do like it. It&rsquo;s a nice compromise in order to fit so many buttons. I tend to assign my ALT (LT) to a d-pad and just assign noncombat functions to the alt versions (besides A and B). It leaves room for 6-7 moves which is similar to what mouse and keyboard players get. I do not like how I can&rsquo;t really use my mouse and keyboard for much though, that irks me. Inventory management on controller sucks donkey dicks.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="oobvdw0" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Vaxxvirus_NA</div>
        <div>1 | 7 minutes ago </div>
      </div>
      <label for="oobvdw0" class="commentText"><p>I like the layout a lot more, I feel it would help me quickly identify the buttons to press, but I don&rsquo;t like them floating without a background in the HUD. <sup>9</sup>&frasl;<sub>10</sub> would use this over the current setup.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="oobvgyk" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>GaIIick</div>
        <div>1 | 6 minutes ago </div>
      </div>
      <label for="oobvgyk" class="commentText"><p>The default layout sucks. I re-map every reroll because we don’t have a user-defined preset yet.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="oobvskb" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Superb_Investment206</div>
        <div>1 | 3 minutes ago </div>
      </div>
      <label for="oobvskb" class="commentText"><p>all i want is to switch between Keyboard and Controller immediately</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
