

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/1xwoo9fn9tkf1.png"><p>Infernalist changes</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/1xwoo9fn9tkf1.png" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="nabih4q" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Earthboundplayer</div>
        <div>5 | 8 hours ago </div>
      </div>
      <label for="nabih4q" class="commentText"><p>I&rsquo;m pretty sure looping builds got gutted in 0.2.</p>

<blockquote>
<p>Barrier Invocation now only builds energy from enemy hits to Energy Shield rather than all hits to Energy Shield.</p>
</blockquote>

<p>You can&rsquo;t use pyromantic pact to build up BI Energy. Given this fact, I&rsquo;m pretty sure increases to your infernal flame capacity are purely a good thing.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="naceems" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Notsomebeans</div>
        <div>5 | 4 hours ago </div>
      </div>
      <label for="naceems" class="commentText"><p>this seems straightforwardly good?</p>

<p>you no longer get +6 from demonform because demonform disabled your weapon slot. You can get +7 on a staff, along with 5 other mods.</p>

<p>and barrier invocation doesn&rsquo;t even work on self damage so i don&rsquo;t understand what the downside you&rsquo;re concerned about is. this change doubles your effective mana pool.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nabcrr9" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>xtremepsionic</div>
        <div>1 | 8 hours ago </div>
      </div>
      <label for="nabcrr9" class="commentText"><blockquote>
<p>With the new pyromantic pact granting infernal flame equal to twice the mana, wouldn&rsquo;t that make it harder for looping builds to gain energy with barrier invocation?</p>
</blockquote>

<p>Yep, that&rsquo;s a straight up 50% less energy gained for that specific mechanic. However it would make it a bit easier to keep Infernal Flame at an optimal level for &ldquo;Seething body&rdquo; for the gained damage (not that anyone was really playing that way before)</p>

<p>Demon Form is better for sure&hellip; if you could somehow sustain the life loss. I had a build with tons of life recoup that barely got it to sustain at like 50 stacks in 0.2. Not entirely sure if it&rsquo;s strong enough to build around still. It takes a long time to build up enough stacks for it to feel amazing, and before then you&rsquo;re still giving up all those tree points and gear slots just to enable the possibilities of sustaining demon form&rsquo;s life drain.</p>

<p>Overall I don&rsquo;t think the Infernalist changes are enough to make it competitive.</p>
</label>
    </div>
  </label>

<div class="commentAndChildren">

      </div>
      <label for="nacdsza" class="commentText"><blockquote>
<p>barrier invocation</p>
</blockquote>

<p>this already did not work with self damage so i don&rsquo;t really understand OP at all</p>

<p>&ldquo;While active, gains Energy when your Energy Shield is damaged by Enemy Hits&rdquo;</p>
</label>
    </div>
  </label>
  
</div>

    
      
<div class="commentAndChildren">
  <input id="nac1oio" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>chimericWilder</div>
        <div>0 | 6 hours ago </div>
      </div>
      <label for="nac1oio" class="commentText"><p>Mana costs are also reduced heavily, so the looping stuff gets hit by that too.</p>

<p>Which is good, really.</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nacfefd" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>pedronii</div>
        <div>0 | 4 hours ago </div>
      </div>
      <label for="nacfefd" class="commentText"><p>Buff, self damage loops got heavily nerfed anyway</p>

    </div>

</div>

        
      
    </div>
  </body>
</html>
