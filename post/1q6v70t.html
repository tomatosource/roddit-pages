

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/p5tkpb41g0cg1.png"><p>I Need An Adult (Crafting Help Please)</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/p5tkpb41g0cg1.png" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="nyaoz4j" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Exoskeleton78</div>
        <div>6 | an hour ago </div>
      </div>
      <label for="nyaoz4j" class="commentText"><p>Chaos to T1 spell</p>

<p>Nvm no essence to gain for staffs here</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nyarvvw" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>doctormonty326</div>
        <div>5 | an hour ago </div>
      </div>
      <label for="nyarvvw" class="commentText"><p>-Chaos spam until spell dmg or cold dmg
-prefix desecrate
-unveil mana
-prefix perfect exalt
-if good prefix then you can double perf exalt (with omen of greater exaltation) for hopefully 2 good suffix’s.
-if everything is good besides mana, then omen of light and reroll until good third prefix. If you hit all high level prefixes you can also whittle until cast speed.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nyartzd" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>tenshosei</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="nyartzd" class="commentText"><p>Not sure if this is the best method, but i would annul down to just the fracture, then prefix desecrate mana, then prefix greater exaltation omen with perfect exalt.</p>

<p>Repeat until you get t1 spell and cold.</p>

<p>Slam prefix for extra gain. (Omen light to remove mana here)</p>

<p>Slam suffix, whittle until t1 cast speed then desecrate for crit</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nyaspm2" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>captainduck0</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="nyaspm2" class="commentText"><p>Depending on what mods you need I would look at something like this:</p>

<ol>
<li>Chaos to t1 spell damage</li>
<li>Greater Exalt a random suffix
2a. If it’s good (high crit or cast speed) then re-assess</li>
<li>Use gain as cold essence with the omen that removed a suffix for second prefix</li>
<li>Desecrate third prefix</li>
<li>Close (and I can’t stress this enough) your eyes and hit the perfect exalt and pray</li>
</ol>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
