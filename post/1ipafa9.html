.post {

.postLink {

  text-decoration: none;

  color: wheat;
  display: block;

}

.postLink:visited {
  color: #806a42;

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;

.commentList {

  padding-left: 32px;

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
}

.selfPostContainer * {
  color: white;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

<div class="commentAndChildren">
  <input id="mcq7e88" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>justaRndy</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="mcq7e88" class="commentText"><p>So Omen are almost sold out by now, and 1 single random prefix - whittling - reroll costs 50 D +.</p>

<p>This is the only somewhat targeted crafting we have, the only way to create decent endgame items, and it can still go horribly wrong and cause MASSIVE losses when you are NOT lucky for once. It was already bad when Omen were half the price, but now crafting doesn&rsquo;t make sense in 99%+ cases.</p>

<p>Meanwhile even 99%+ gg items are losing value incredibly fast as around <sup>3</sup>&frasl;<sub>4</sub> of all endgame items will survive the vaal and there is no other &ldquo;item sink&rdquo; in the game, and way too few mods to not have the market become completely flooded.</p>

<p>I have crafted, flipped and moved stuff worth 50+ mirrors this early access (not kidding) and the state of it all has become unacceptable within the last 2 weeks. This is with 80k! players still playing. PoE1 late league economy has not been NEARLY as bad.</p>

<p>Needed:</p>

<p>-Huge buffs to Omen drop rates</p>

<p>-Many more crafting options via different mechanics</p>

<p>-Actual dangerous ways to gamble high end gear for further upgrades to remove market supply</p>

<p>-Probably a lot more prefix and suffix options to not have 1000s of identical items circulating after a while, and to compensate for cheaper more targeted crafting</p>

<p>Just some examples that come to mind after 800 hours EA :)</p>

<p>Investment advice: Long Omen</p>
</label>

      <label for="mcqfiqc" class="commentText"><p>It&rsquo;s fine for insane items to have insane cost to make. You don&rsquo;t need Omen-crafted gear to tackle any content in the game currently.</p>

<p>I really don&rsquo;t want crafting in PoE 2 to be anything like the boring, convoluted cooking recipes that existed in PoE 1. It&rsquo;s a lot more fun to find decent or half-decent items and tinker with them a little than farm 500 kwargloids and 250 ybzloshards and get a boring, near-guaranteed result.</p>
