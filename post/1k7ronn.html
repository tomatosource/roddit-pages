

<html>

    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>

    <h2>
      <a class="postTitle" href="https://i.redd.it/0ijm1io7u0xe1.png"><p>does &ldquo;increased elemental damage with attacks&rdquo; do more after empowered twister?</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/0ijm1io7u0xe1.png" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="mp0gzae" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Methodic_</div>
        <div>1 | 10 minutes ago </div>
      </div>
      <label for="mp0gzae" class="commentText"><p>Take a solid round 100 damage as an example here.</p>

<p>100 damage, with 20% increased physical damage, comes up to 120 damage. When going over an elemental ground damage source, this adds 50% of that element, so an extra 60 elemental damage, for a total of 180 damage (120 phys, 60 elemental)</p>

<p>100 damage with 20% increased elemental damage with attacks, instead, will do 100 physical damage base, and when going over elemental ground pick up 50 damage(50% of that element), plus an extra 20% added into that 50, which is an extra 10 damage total acquired(10 being an extra 20% of the 50 elemental damage being acquired). Total damage of 160(100 physical, 60 elemental)</p>

<p>This is the math, as i understand it, to show why the physical damage node, if equivilant to the 20% shown here, is giving you &ldquo;more damage&rdquo; than the elemental one is.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="mp0epbg" type="checkbox" checked/>

      <div class="commentHeader">

        <div>1 | 21 minutes ago </div>
      </div>
      <label for="mp0epbg" class="commentText"><p>sorry i meant to say &ldquo;attack damage&rdquo; not &ldquo;physical damage&rdquo;</p>

<p>for example, &ldquo;blinding strike&rdquo; passive node, does 24% increased attack damage, so 4% &ldquo;difference&rdquo; but substantially more damage on my twister stats, but thats just in the skill tab.</p>

<p>not in the game with combos etc</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">

        <div>1 | 8 minutes ago </div>
      </div>
      <label for="mp0hego" class="commentText"><p>The tooltip does not calculate conditionals like gaining damage from ground effects. It is only showing what your damage is if you use the skill on its own with none of the other effects. This is why everyone uses PoB to see actual simulated damage numbers.</p>
</label>
    </div>
  </label>
