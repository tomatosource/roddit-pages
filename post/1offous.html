

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>

<div class="commentAndChildren">

      </div>
      <label for="nl8tv03" class="commentText"><p>Ok, so if I were you I would dexteal anul armor to guarantee spell damage on your next homo ex with dectral to guarantee spell damage. Now you have 3  caster and 1 crit. I would then homo exalt for your 3rd suffix which is crit, or cast speed. Any is good. Now you should have t1 spell, 3 good suffix but one high tier. There’s not much you can do here other than pray. You can fracture hoping to lock in +3 and not fully brick if unlucky. Crit is super low but still desirable. You can also whittle but expensive and super random.</p>

<p>If you do decide to fracture I’d leave crit for now. Next you want to maybe either add a prefix and hope you can sinister crystal the added prefix with the 30% increased defenses or desecrate and hope for a IIR or defense tag like es. You can also yolo dextral crystallize the global defense as is and pray it removes the low tier crit. Whatever you do a fracture will help you up your odds if a good one. Then if you get the defense tag, you can homo exalt a prefix to get flat es, es% armor or evade. Then if you essence a suffix for defense you can target farm IIR on a prefix through desecration. I would not bother going for 2 IIR and probably wouldn’t want to burden you with the cost going for it without homogenizing tags.</p>

<p>If I were you, I would add a suffix now homo style, prefix crystallize global defense then fracture at defense 3 all and crit id you can roll cast speed t1. That way you don’t have to worry as much and your prefix can be more targetable.</p>

<p>Please play around on craft of exile first. Crafting is like a 25% success rate on these for the perfect 6</p>
