      </div>
      <label for="ooufe9w" class="commentText"><p>I&rsquo;ve talked to a few younger fans that didn&rsquo;t seem to know how good he was. They just thought he was a shooter, so I guess this is for them.</p>
</label>

  </label>

    <div class="comment">
      <div class="commentHeader">
        <div>Pain_Monster | Boston Celtics</div>
        <div>5 | 5 days ago </div>
      </div>
      <label for="oouh8c3" class="commentText"><p>Larry and Magic could pass like no one else. Eyes in the back of their head, immense creativity and offensive awareness that has not been equaled since.</p>

<p>Jordan was great as a pure scorer but honestly have you ever seen him make as good of a pass as your average Bird/ Magic clip? No.</p>

<div class="commentAndChildren">
  <input id="op0xuq6" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>jd451</div>
        <div>3 | 4 days ago </div>
      </div>
      <label for="op0xuq6" class="commentText"><p>Gonna chime in to drop my piece about my favourite players.</p>

<p>Bird was considered to be one of the toughest motherfuckers of all time. All of his contemporaries have said this about him and he himself proved it during his career. He would trade blows with other all-time greats like Dr.J and Kareem and then proceed to body their teammates so hard, they&rsquo;d get pulled out of the game.</p>

<p>He also played through gruelling injuries, including his back injury that would genuinely put anyone else in a wheelchair. He would fling his body about like a ragdoll chasing loose balls often hurting himself in the process and then get up like it was nothing. He continued this even with the injuries.</p>

<p>He was a master of shit talking and psychological damage. This is a guy who on a whim decided to play entire portions of games with his weaker hand only, to make the game fun for himself. He would routinely get people worked up, allow himself to be hard fouled by them and then laugh as they were subbed before they could foul out of the game.</p>

<p>He was one of the greatest shooters in the sport. He dominated the 3 point contest and was the founding member of the 50/40/90 club, both of which were achieved while he had a broken back.</p>

<p>Sure, he didn&rsquo;t have the strength and measureables of someone like Shaq. But what he had instead was an incredible insight into how to play the game that allowed him to dominate in one of the most talent-laden eras of the game. He could battle bigs in the post and handle perimeter duties against smaller players using his intelligence and knowledge of the game. He was an offensive menace with a crazy bag of moves and an eye for passes equalled only by Magic. He had an unreal engine that was core to his success as a player.</p>

<p>In my opinion, Bird was the most complete player of his time. Sure, one can look at LeBron and say this guy can do everything and that&rsquo;s fair. But it took LeBron years to figure out the different aspects of the game and hone his craft and he didn&rsquo;t have a broken back during his prime.</p>
</label>
