

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://v.redd.it/q85ffwrpfk8f1"><p>Stormcloud Sniper Pathfinder homebrew</p>
</a>
    </h2>

    

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="mzb44mk" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>ego_tripped</div>
        <div>2 | 16 hours ago </div>
      </div>
      <label for="mzb44mk" class="commentText"><p>Dude!</p>

<p>I too recently found this helmet and incorporated it into my poison build using the gas arrow as a flame thrower!  Granted, I lose ES and EV because of the lack of stats on the helmet, but I slotted two elemental resistance runes and I can easily do breach and twisted domain. (I still need to swap to bossing set for &ldquo;bosses&rdquo; though)</p>

<p>What I love about yours is the incorporation of the heralds because I&rsquo;m going to tinker with The Coming Calamity + Voltaxic + beyond reach quiver + the helmet + plague finger&hellip;so I can cause every damaging ailment with two bow shots&hellip;and (hopefully) begin a never ending chain of events with the three heralds.</p>

<p>Then there&rsquo;s the ring that converts fire to chaos DMG&hellip;</p>

<p>So many options.</p>

<p>Very cool build.  It&rsquo;s definitely inspiring.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="mzburfu" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>digital-ultra</div>
        <div>2 | 14 hours ago </div>
      </div>
      <label for="mzburfu" class="commentText"><p>Totally. All the uniques are like different components you can add to your flamethrower to make it do different things. Bit of a hassle at first to change your loadout since stats and resistances are so tied to gear, but once you’ve got it you’ve got it and it’s fun to have the options.</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

        
      
    </div>
  </body>
</html>
