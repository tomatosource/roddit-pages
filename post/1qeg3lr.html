

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://forms.gle/HuWwx6bZegww3qh59"><p>Poe2: Farming strategy poll</p>
</a>
    </h2>

    

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="nzy71bs" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Ynead</div>
        <div>1 | 4 hours ago </div>
      </div>
      <label for="nzy71bs" class="commentText"><p>Edit : Answers can be found <a href="https://docs.google.com/spreadsheets/d/15U4IXe18vj5Vmr1DaY8YT7YZFJ-5qltjxc1cBoyPIDo/edit?usp=sharing" target="_blank">HERE</a>.</p>

<p>Still few answers so accuracy is very low but :</p>

<p>I&rsquo;m surprised that the most fun strat (Breach, in map) only rates 6.9.</p>

<p>Apparently the strats which people like the most are Breach (6.9), Abyss without pulling Amanamu mobs (6.8) and Snake Temple (6.7). So kill lots of mobs without set-up or the new league mechanic, that tracks.</p>

<p>Fourth is Breach (Twisted Domain, 6.4), which follows the trend of kill lots of stuff.</p>

<p>Significant drop for the fifth mechanic (Ritual, 5.5).</p>

<p>Players seem to really dislike mechanic which ask to tailor their speed to the mechanic like Azmeri Spirits (2.5) or Strongboxes (2.6). May have something to do with those two being seen as some of the least profitable as well.</p>

<p>Other surprise : apparently people dislike Sekhemas (3.4) slightly less than Chaos (3.2).</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
