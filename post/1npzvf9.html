

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://www.reddit.com/r/PathOfExile2/comments/1npzvf9/abyssal_monsters/"><p>Abyssal Monsters</p>
</a>
    </h2>

    
    <div class="selfPostContainer">
      <p>What is the anti-heal and huge area DOT with some abyssal monsters? How do I even fight those?</p>

    </div>
    

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="ng35tkm" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>BongoChimp</div>
        <div>3 | 3 hours ago </div>
      </div>
      <label for="ng35tkm" class="commentText"><p>So they are pretty annoying for melee.  One thing to note is when they teleport is when the dot pool forms under them, but they can walk out of it and the pool doesnt move.  You can try to bait them out of it and walk towards you so you can do damage.  If you have a balanced character usually they don&rsquo;t have very many other ways of damaging you so you can kind of wait it out until you find a time to kill them.</p>

<p>Its awful design though and definitely needs to be changed in future patches imo.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="ng37nma" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Raythleith</div>
        <div>1 | 2 hours ago </div>
      </div>
      <label for="ng37nma" class="commentText"><p>aight thanks for the insight.</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="ng357hp" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>TuttHulken</div>
        <div>2 | 3 hours ago </div>
      </div>
      <label for="ng357hp" class="commentText"><p>Kill it before it kills you is the solution for me as a warrior</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="ng384nd" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>MildStallion</div>
        <div>1 | 2 hours ago </div>
      </div>
      <label for="ng384nd" class="commentText"><p>Another alternative I saw suggested elsewhere, if it&rsquo;s the only foe left, is to move off when it teleports, go behind an obstacle, and start charging supercharged slam. When it teleports to you again, release and dodge roll out and watch it melt.</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

        
      
    </div>
  </body>
</html>
