

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://www.youtube.com/watch?v=_3_kLmhO3Wk"><p>Sharing my experiences with crafting for money</p>
</a>
    </h2>

    

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="nwozn5g" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>wondermayo</div>
        <div>4 | an hour ago </div>
      </div>
      <label for="nwozn5g" class="commentText"><p>Haven&rsquo;t watched the video yet but I don&rsquo;t think you should have labeled it as content for children, it disables a ton of stuff on youtube and will probably limit its reach.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="nwp68oj" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Oki_bgd</div>
        <div>1 | 5 minutes ago </div>
      </div>
      <label for="nwp68oj" class="commentText"><p>And comments are disabled ? a bit off approach honestly, I am clearly missing a point.</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nwp1362" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>apcrol</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="nwp1362" class="commentText"><p>I hate crafting in this league. I dont know is it because of homogenizing orb, its all too random and expansive, nerfed drops or major exploits running. Most of my gear in 0.3 was handcrafted but here I just cant enjoy it.</p>

<p>For example, I want golden amulet with +2\3 proj, 30-40 spirit and global defences. So to try that I need base for 40+ div or base with spirit, fracture it for 2 div, chaos spam 1000 times to get +3 proj and only after that the craft starts&hellip; Or I can just buy it for 15-40 div</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="nwp2zog" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>bubby95</div>
        <div>1 | 35 minutes ago </div>
      </div>
      <label for="nwp2zog" class="commentText"><p>You are overcomplicating it.
Use the recomb. Its really good this season. Since you are okay with +2, its even easier.
Dm me i can help you.</p>
</label>
    </div>
  </label>
  
</div>

    
      
<div class="commentAndChildren">
  <input id="nwp4ge3" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Chiffre</div>
        <div>1 | 22 minutes ago </div>
      </div>
      <label for="nwp4ge3" class="commentText"><p>How is it any different from last league? Proj is untagged so you couldn’t force either it or spirit with homogenizing exalt. I agree that the crafting process after hitting both mods is a bit more random but it’s not that painful.</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

        
      
    </div>
  </body>
</html>
