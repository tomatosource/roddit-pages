

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://www.reddit.com/gallery/1vao9oj"><p>Bring up your keys. I&rsquo;ll show you genocide.</p>
</a>
    </h2>

    

    <div class="commentList">
      
        
          
<div class="commentAndChildren">

<p>Specifically, I was trying to open strongboxes that I had exploded, but which rolled the chance to be openable again. Yet no amount of clicking, begging, or animal sacrifices would trigger them.</p>
</label>
    </div>

  <div class="commentList">

I preventively buy lot of keys 2-3 pcs per div.</p>

<p>Mobs inherit all the runes you opened.

  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="p0ndjxi" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Streetwind</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="p0ndjxi" class="commentText"><p>&hellip;Ah. Well, I suppose I could buy some. I&rsquo;ve only ever dropped a single key all league long, and it was off of the 1% chance from a unique monster. The 5% chance from strongbox rares has never once triggered yet x_x</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="p0nh8l9" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>FreedSteeds [OP]</div>
        <div>1 | 25 minutes ago </div>
      </div>
      <label for="p0nh8l9" class="commentText"><p>Never seen keys dropping too )</p>

<p>I also walked a lot with atlas master perk. And it seems to be broken.<br>
The point is — if your Atoll has great layout, you may free thousands of juicy mobs* using keys! Usually It takes 10-15 pcs for me.</p>

<p>And even if they won&rsquo;t bring you profit, still that&rsquo;s a huge amount of XP and LOT OF FUN!</p>

<p>*the strategy here is to use keys after you build a good sequence of runes. I mostly hunt for XP rune, because I want lvl100, but other are good too.</p>

<p>Improved strategy would look like: opening even more chests before you blow them up, after you&rsquo;ve collected critical mass.</p>
</label>
    </div>
  </label>
  
</div>

  </body>
</html>
