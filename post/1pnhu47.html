

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://streamable.com/y57jay"><p>Armor breaking monsters feel a bit overtuned</p>
</a>
    </h2>

    
    <div class="streamableContainer">
      <iframe
        src="https://streamable.com/e/y57jay?loop=0"
        frameborder="0"
        width="100%!"(MISSING)
        height="100%!"(MISSING)
        allowfullscreen
        style="
          width: 100%!;(MISSING)
          position: absolute;
          left: 0px;
          top: 0px;
          right: 0px;
          margin: 0;
          overflow: hidden;
        "></iframe>
      </div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="nu7rdte" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Tyrannosaurus_flex</div>
        <div>2 | 3 hours ago </div>
      </div>
      <label for="nu7rdte" class="commentText"><p>I lost 10k armor in what seems to be two hits (or four if the armor breaking mobs hit at the exact same time). It&rsquo;s a T8 map with only one damage mod. Feels a bit odd that my whole defensive layer can be shredded in 2-4 hits from blue monsters. I&rsquo;m not mad or anything (I was playing a bit haphazardly seeing as I got heavy stunned), just surprised that it happened because I felt super tanky before this. 2900 HP for context.</p>

<p>What do you think?</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="nu8amzi" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Drakore4</div>
        <div>1 | 34 minutes ago </div>
      </div>
      <label for="nu8amzi" class="commentText"><p>I agree. Tbh I coulda swore I remember them saying they made it so monsters can’t break player armor anymore. Maybe I misremembered. It just seems like something overly punishing to players that should be solely for use by players. That’s like magic monsters having a mod that guarantees they hit through evasion, or a mod that guarantees all damage penetrates ES. Having a mod that completely deletes a primary defensive layer in a game that already has such few choices is just bad.</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nu7s867" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Stravix8</div>
        <div>1 | 3 hours ago </div>
      </div>
      <label for="nu7s867" class="commentText"><p>I know it sounds stupid, but having more armour helps a ton.</p>

<p>Since they armour break based on physical damage dealt, your armour would end up preventing the armour break from being as bad.  Also, convert damage taken off phys and it won&rsquo;t break armour.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="nu89mj1" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Tyrannosaurus_flex</div>
        <div>1 | 39 minutes ago </div>
      </div>
      <label for="nu89mj1" class="commentText"><p>It just went so fast, I&rsquo;m not necessarily convinced I would have survived even with 20k armour here.</p>

<blockquote>
<p>Also, convert damage taken off phys and it won&rsquo;t break armour.</p>
</blockquote>

<p>Yes you&rsquo;re right. I hadn&rsquo;t thought of the possibility that armour breaking mobs existed so I leaned too heavily into one type of defense.</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

</html>
