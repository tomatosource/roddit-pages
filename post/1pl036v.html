

<html>

    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>

      <label for="ntozzc2" class="commentText"><ol>
<li>Short, common, or clickbait content</li>
</ol>

<p>We receive a lot of posts of mildly (but not exceptionally) rare random events, novelties, and ideas in Path of Exile. Unfortunately, these often feel repetitive to frequent visitors, so we&rsquo;ve chosen to be somewhat strict about restricting these kinds of content.</p>

<p>The following are allowed at all times:</p>

<p>Rare currency outcomes (e.g. Mirrors)
Rare item drops or outcomes (e.g. Headhunter, good Watcher&rsquo;s Eyes, optimal Double Corrupt outcomes)
Day 1 BIS Uniques (e.g. Act 1 Tabulas, 6 Link Uniques)
Near-RIP clips
Unlikely Divination Card outcomes
Examples of regularly seen low effort content that is likely to be removed typically, but may be okay to post during Lazy Sunday, include:</p>

<p>Rare Items or Currency
Boss dropping multiple uniques, maps, currency, etc. unless it is a bug or incredibly improbable
Lunaris-Touched or other Archnemesis conversion loot that is expected
Corruption results
Maximum or minimum rolled Unique Items
Regular 6 links
Keepers of the Trove or related screenshots (i.e. Multiple of the same rare item)
Blood Crucible/Krangle results that nullify each other/the item&rsquo;s stats
Blood Crucible/Krangle results that are random or on random gear
Text or UI
Stinkstink, Blackface, and other such &ldquo;humorous&rdquo; rare monster or item names
&ldquo;Satisfying&rdquo; UI numbers (i.e. &ldquo;10,000&rdquo; Energy Shield, etc.)
MTX Set Item discount differences
In-game typos or text errors (e.g. &ldquo;Harbinger&rdquo; garbled text)
Random in-game chat screenshots
Funny shapes on the minimap (e.g. &ldquo;this terrain looks like a face&rdquo;)
Passive Tree Art
AI-generated content, such as AI art or chatbot output
The following will be considered Low Effort at all times:</p>

<p>Meta &amp; Clickbait
Clickbait titles (including &ldquo;don&rsquo;t upvote&rdquo;, &ldquo;unpopular opinion&rdquo;, etc.)
Clickbait regarding moderators (e.g. inb4 mods remove this, mods are employed by GGG, etc.)
Sensationalist or exaggerated titles (including &ldquo;WTF is this shit&rdquo;, &ldquo;X takes 100+ hours&rdquo;)
All-caps titles
Unclear or misleading titles that don&rsquo;t give a good idea of the content within
Misleading titles
&ldquo;Diablo 4 Bad&rdquo;
Copypasta
Low-content posts
One liner posts, empty body text posts, and other short posts
Posts with missing, low-quality, or illegible images
5a. Incorrect flair</p>

<p>Certain flairs (e.g. Information) have specific requirements and posts may be removed if they fail to meet them or appear to be used incorrectly.</p>

<p>Crafting Showcase/Lucky Showcase: For crafted items or rare drops and outcomes. These must also follow Rule 10.
Data: Drop-rate, crafting probability, or other data relating to probabilities or statistics in the game.
Fan art: For artworks or cosplay inspired by the game.
GGG Feedback: Feedback to the developers (GGG) about Path of Exile.
Giveaway: Giveaways of items must obey Rule 8b
Hot Topic: Used for temporary issues that are hot topics to the community. We will aggressively remove similar threads. See Rule 7d for more information.
Information: Facts about the game that users may not know about.
Lazy Sunday: Posts without a Lazy Sunday flair during Lazy Sunday will be moderated as usual. Posts that have a Lazy Sunday flair outside of Lazy Sunday will be removed.
Negative Behaviour: Rude or undesirable in-game behaviour by other players.
Ruthless: For all Ruthless-related posts. This prevents confusion in questions and discussions due to different drop-rates and mechanics.
Subreddit Feedback: Discussion about the moderation or behavior of users on the subreddit.
Unique item idea: Used for proposals of new unique items</p>
