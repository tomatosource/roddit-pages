

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/in0xuz35f1kh1.png"><p>How should I craft this caster ring?</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/in0xuz35f1kh1.png" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="p4dexru" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>steelballsafury</div>
        <div>3 | 13 hours ago </div>
      </div>
      <label for="p4dexru" class="commentText"><p>I would price check this before you spend too much money on it since it is t2 crit chance and t3 crit damage bonus.</p>

<p>If it is a profit craft, I would sell it as is as these are more valuable as a fracturable base.</p>

<p>Otherwise I would fracture and hope to hit spell damage. Assuming you dont care about arcane surge, then you can essence of breach quality to 40%. Whittle until you hit mana or a brick. If you brick on whittle, you can use an annulment omen and perfect exalt slam until you hit a mod you like.</p>

<p>Last step which can be done if you miss the fracture or if you dont fracture is to use the breach collarbone. You would be looking for gain as extra, but in my experience those can be hard to hit. Omen of light spam until you are happy</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="p4g4lx0" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>BatmanImpersonator [OP]</div>
        <div>1 | 4 hours ago </div>
      </div>
      <label for="p4g4lx0" class="commentText"><p>I bought it for 100 div to try and fit it into my lightning bolt autobomber build, but the next best ring to have these stats is &amp;gt; 1000 div. Any chance I could make a profit flipping it?</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="p4cutc6" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Scaridium</div>
        <div>2 | 16 hours ago </div>
      </div>
      <label for="p4cutc6" class="commentText"><p>Its missing increased mana cost efficiency, and afaik that is only a breach mod, there&rsquo;s no way to chaos or craft your way to adding it on, so there&rsquo;s nothing more you can do. Add a desecrate and hope for increased spell damage while on full energy shield and hope someone naive that doesn&rsquo;t know you need mana cost efficiency buys it.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="p4g16jn" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Sulleyy</div>
        <div>1 | 4 hours ago </div>
      </div>
      <label for="p4g16jn" class="commentText"><p>Doesn&rsquo;t this have 4 caster mods you can&rsquo;t normally get? Spell damage, double crit mods, and arcane surge. That&rsquo;s gotta be really good for someone thats solved their mana issues, efficiency has diminishing returns anyways</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="p4dct8e" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>MossThrow</div>
        <div>-2 | 13 hours ago </div>
      </div>
      <label for="p4dct8e" class="commentText"><p>Fart on it</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
