

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/s0y9fb8wl6we1.png"><p>Does POE2 use the same block recovery time as POE1? Do I understand it correctly that, without any recovery nodes, you can block up to ~3 hits per second? The POE2 wiki doesn&rsquo;t mention any formular.</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/s0y9fb8wl6we1.png" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="mo8vx4u" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Prace_Ace</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="mo8vx4u" class="commentText"><p>Also, let&rsquo;s say you have +40% faster block recovery. Is the duration formular then</p>

<pre><code>350 / (1 + 0.4) = 250
</code></pre>

<p>? So you can block up to 1000 / 250 = 4 hits per second?</p>

<p>Because intuitively, I&rsquo;d assume it to be</p>

<pre><code>350 * (1 - 0.4) = 350 * 0.6 = 210
</code></pre>

<p>so almost 5 hits per second. Or how does it apply?</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="mo90l9y" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>deadbeef_enc0de</div>
        <div>1 | 29 minutes ago </div>
      </div>
      <label for="mo90l9y" class="commentText"><p>The reason it isn&rsquo;t the second equation is two fold</p>

<ol>
<li>To not have block recovery go to zero when you get 100%</li>
<li>Apply diminishing returns on the stat</li>
</ol>

<p>This is the same as cooldown recovery as well and from PoE 1 mana reservation efficiency</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="mo92lx3" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>akadiablo</div>
        <div>1 | 16 minutes ago </div>
      </div>
      <label for="mo92lx3" class="commentText"><p>You can block unlimited amount of hits per second. This mechanic only for blocking stunning hits with different animation and other way to reduce it other that usual stun recovery.</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
