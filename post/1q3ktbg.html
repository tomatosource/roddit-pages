<div class="commentAndChildren">
  <input id="nxlpt6w" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Camellia_fanboi</div>
        <div>35 | 3 hours ago </div>
      </div>
      <label for="nxlpt6w" class="commentText"><p>Greater essence of opulent for T1 rarity or Greater essence of Grounding/Thawing/Insulation for T3 resistance.</p>

<p>Preserved collarbone onto either prefix or suffix. If you desecrate a prefix use<br>
Omen of the Blackblooded for Kurgal modifiers to guarantee &ldquo;#% increased Energy Shield from Equipped Body Armour&rdquo; later this is also what i would do. Do not unveil, keep the mod veiled.</p>

<p>Farm a fracturing orb and throw at this amulet. Its worth farming one for such base as it would not come again. Hopefully win the <sup>1</sup>&frasl;<sub>3</sub> to fracture % increased Maximum Energy Shield.</p>

<p>If you win the amulet is pretty much set. You can use Omen of Sinistral Crystallization + Perfect Essence of Enhancement to get Global Defences%. You re-desecrate a prefix with Omen of the Blackblooded to get the es% from body armour modifier.</p>

<p>If you lose, you have some options to fill the prefixes.<br>
(1) Omen of Sinistral Crystallization + Perfect Essence of Enhancement and hope you win the <sup>1</sup>&frasl;<sub>2</sub> to eat the desecration modifier. If you lose it is not totally bricked, you can Omen of Catalysing Exaltation + defence catalyst + Greater/Perfect Exalted for another chance at %Energy shield or something usable, then unveil.<br>
(2) Omen of Catalysing Exaltation + defence catalyst + Greater/Perfect Exalted to target Evasion/Armour/Flat es or life catalyst to target life, then unveil.<br>
(3) Omen of Light annul to remove the Desecration, then redesecrate with Omen of the liege. Back to (2).</p>

<p>Alternatively for prefixes, you can also just preserved collar bone with Omen of the liege and unveil Amanamu Global Defence% and dont have to go through the gamble fracture orb. Then Omen of Catalysing Exaltation + defence catalyst + Greater/Perfect Exalted to target a defence modifier. Its just this will result in a lower es total for an amulet as you wont have both %Global Defences and %Energy shield from body armour, but costs less resources.</p>

<p>For the last suffix, it is probably Omen of Catalysing Exaltation + fire/cold/lightning catalyst + Greater/Perfect Exalted depends on what resistance you need. You have high odds to hit a resistance here. If you miss, you might be able to also whittle it off if the fracture orb gamba hit the rarity instead. Happy crafting.</p>
</label>
    </div>
  </label>
