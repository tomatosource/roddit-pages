

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/ypz5c9su83kg1.png"><p>Life + intelligence combo is good or drop?</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/ypz5c9su83kg1.png" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="o5wbeux" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>lionheart832</div>
        <div>1 | 19 minutes ago </div>
      </div>
      <label for="o5wbeux" class="commentText"><p>Use perfect essence for global def, or prefix desecrate essence, no one generally wants life</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="o5wbxax" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>imtreibos</div>
        <div>1 | 17 minutes ago </div>
      </div>
      <label for="o5wbxax" class="commentText"><p>Lmao yeah surely no one wants T1 life xd</p>
</label>
    </div>
  </label>
  
</div>

    
      
<div class="commentAndChildren">
  <input id="o5wc5vw" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Best-Sympathy-6327</div>
        <div>1 | 16 minutes ago </div>
      </div>
      <label for="o5wc5vw" class="commentText"><p>As a blood mage (most popular class in the game right now) with 10 mirrors of gear, I can tell you this is not true, life is wanted. Endgame bm uses both max life and max mana to scale rathpith. Spirit, flat mana, mana %, and spell damage may be slightly better, but flat T1 life is up there in terms of importance</p>

<p>In fact, once you transition to eldritch battery (what most BM do endgame), global defense becomes worthless, as the conversion is only base ES to mana, so T1 life is infinitely better</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="o5wcsx4" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>BeginningEqual5533</div>
        <div>1 | 13 minutes ago </div>
      </div>
      <label for="o5wcsx4" class="commentText"><p>And increased intelligence is good in this case or its used by pure manastakers only?</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="o5wdb0g" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>blankest</div>
        <div>1 | 10 minutes ago </div>
      </div>
      <label for="o5wdb0g" class="commentText"><p>Int is not used in this case. Gear/gem requirements are met through the passive tree travel nodes.</p>
</label>
    </div>
  </label>
  
</div>

    
      
<div class="commentAndChildren">
  <input id="o5wecto" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Best-Sympathy-6327</div>
        <div>1 | 5 minutes ago </div>
      </div>
      <label for="o5wecto" class="commentText"><p>Its not bad, pro prefer crit damage or all resist (most endgame BM runs Atziri&rsquo;s Splendour with all %mana soul cores or temp so we lack resists) for perfect amulet, but 10% mana is like 30-40 int which is great</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

    
  </div>
  
</div>

    
  </div>
  
</div>

        
      
    </div>
  </body>
</html>
