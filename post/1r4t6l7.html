

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/08hp3kp1fijg1.jpeg"><p>PSA: if you&rsquo;re broke in the new league check if you have a Level 8 spirit gem</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/08hp3kp1fijg1.jpeg" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="o5dyzyz" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>DamnedDoom</div>
        <div>1 | 10 minutes ago </div>
      </div>
      <label for="o5dyzyz" class="commentText"><p>wtf?</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">

        <div>Red_Fyre</div>

      </div>
      <label for="o5dzc8j" class="commentText"><p>Those spirit gems are always over priced every league. Always keep a stash full once I&rsquo;m in end game</p>

    </div>
  </label>
  
</div>

      <div class="commentHeader">
        <div>Extraaltodeus</div>
        <div>1 | 5 minutes ago </div>
      </div>
      <label for="o5dzt39" class="commentText"><p>During the previous league already I had noticed they practically never drop. And so I suppose as a consequence they are worth a fortune. This has been going on since a while.</p>
</label>
    </div>
  </label>
  
</div>

    
      
<div class="commentAndChildren">
  <input id="o5e091a" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>oldglassofmilk</div>
        <div>1 | 3 minutes ago </div>
      </div>
      <label for="o5e091a" class="commentText"><p>They drop rarely and people with enough money that they don&rsquo;t care about the cost buy them for levelling so the price inflates quickly</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="o5e0ixt" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>AppropriateSpring194</div>
        <div>1 | a minute ago </div>
      </div>
      <label for="o5e0ixt" class="commentText"><p>What is the reason for this? I know the supply and demand part, but is there a reason why someone would like to have level 8 instead of whatever higher level that is cheaper? I also know about level requirement, but if there is another reason for this?</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
