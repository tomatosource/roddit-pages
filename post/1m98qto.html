      <div class="commentHeader">

      </div>
      <label for="n55edky" class="commentText"><p>Eh - not exactly how stats works but you&rsquo;re not too far off in practical terms.</p>

<p>For the real math, you just multiply the odds of something NOT happening (in this case, 0.95) by itself a number of times equal to the number of attempts - so 0.95^N - to get the odds of it NOT happening by attempt N, and then the &ldquo;inverse&rdquo; of that number are the odds you would have &ldquo;hit&rdquo; by then.</p>

<p>Example - 5% chance of something occurring &ndash;&amp;gt; 95% chance of it NOT occurring, repeat for 10 attempts:</p>

<p>0.95^10 = .6 &ndash;&amp;gt; 60% chance that it does NOT occur by attempt number 10, and therefore a 40% chance that it does.</p>

<p>20 attempts yields a 64% chance for success. 13 tries is the coinflip number - half of everyone attempting will get it within 13 tries.</p>

<p>This also means that 1% people attempting this will be be unsuccessful after 100 attempts.</p>

<p>Which has been my personal experience, so everyone should thank me for taking this bullet for them lmao.</p>
</label>
