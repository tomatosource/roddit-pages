    <h2>
      <a class="postTitle" href="https://i.redd.it/j8riux86ygrg1.jpeg"><p>Where are the god damn locks?</p>
</a>
    </h2>

    
	<div class="selfPostContainer">

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="oco9x57" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>gagelish</div>
        <div>3 | 15 hours ago </div>
      </div>
      <label for="oco9x57" class="commentText"><p>I&rsquo;ve heard some people claim that lock (and medallion drops more generally) can bug out, and that you should reset your instance if you have a run with no locks/very few medallions in general.</p>

<p>I don&rsquo;t know if that&rsquo;s true (it could easily just be unfortunate RNG) but any time that&rsquo;s happened to me, I&rsquo;ve exited the game, opened it back up, and then entered the Vaal Ruins through a new Waystone. That&rsquo;s gotten me out of any sticky situations I&rsquo;ve found myself in thus far (knock on wood). A few other things that you may or may not find helpful:</p>

<ol>
<li><p>I try to avoid the impulse to stock up on too many room/reroll medallions at the expense of locks. It can be super tempting to pick up the next 3-4 rooms you&rsquo;ll need after your current target (especially when you have a bunch of runs in a row where you&rsquo;re getting 4+ locks), but I don&rsquo;t ever let myself have fewer than 4 locks in the bank (assuming that&rsquo;s an option).</p></li>

<li><p>Once I&rsquo;m down to 2 locks, I only lock my main chain, and just accept that I&rsquo;m gonna have to do a little rebuilding on my second one. Yeah, it sucks, but not as much as losing progress on my main chain that required a bunch of tech to build.</p></li>
</ol>

<p>On the plus side, you&rsquo;ve got a fair number of rooms in your second chain, so the likelihood that your main chain will destabilize past where you used your second sacrifice (and therefore seriously set you back) is pretty slim.</p>

<p>Fingers crossed, and good luck!</p>
</label>
    </div>
  </label>

<p>But next time I don’t get locks, I’ll know what to do!</p>
</label>

      <label for="ocoy63u" class="commentText"><p>I just quit out of the game, restart it, use a new Waystone, and then find the Vaal Ruins entrance from inside the map, but I imagine there&rsquo;s a much faster/easier way to do it.</p>

<p>You might even be able to do it like any other instance where you go to a waypoint, then I think you hold Ctrl and left click on Vaal Ruins and it&rsquo;ll ask if you want to enter your existing instance or create a new one. Not sure about that though, just guessing.</p>

      <label for="ocoash6" class="commentText"><p>Are you dropping generators as often as you can at the spot right beside start? Generators give you 2x tier 3 golems, which give another extra chance for medallions. That might help. you don&rsquo;t have to lock them, but everytime you get a generator you should always place them.</p>
