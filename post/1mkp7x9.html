      <label for="n7kegct" class="commentText"><p>EDIT: Okay, after digging into that Complete Lore Compilation by POE Loremaster (v3.26.0c &amp; II v0.2.1), re-evaluating my own theories:</p>

<p>Here&rsquo;s what we know for sure from the lore PDF:</p>

<p>The Lightless were &ldquo;created, not born.&rdquo; This means their origin is an event, not a natural process.</p>

<p>The timeline is very specific that the Winter of the World begins immediately after the Primeval tyrant Ahn falls. This suggests his empire, tyrannical or not, might have been acting as a seal or some form of protection, and his fall is what triggered their release.</p>

<p>The note under one glyph has &ldquo;noble/highborn/king&rdquo; all crossed out. Since the lore names a key Lightless leader &ldquo;Ulaman, Sovereign of the Well,&rdquo; it&rsquo;s a very strong deduction that this glyph means Sovereign.
Based on this, my best take is that the text is an ancient record describing the full origin and consequence of the Lightless:
The Beginning was the Birth (the unnatural &ldquo;creation&rdquo; event) of the Lightless Sovereigns from the Well. The catastrophic result of their eventual unleashing was the Winter of the World.</p>

<p>As for the beginning and birth at the end, might suggest renewal/rebirth of the world after 1000 years of war or a cycle repeat.</p>

<p>I expect Abyss to appear in 0.3, since we already have the Maraketh act, and there’s extensive lore about their battles against the Lightless during the Winter War.</p>
