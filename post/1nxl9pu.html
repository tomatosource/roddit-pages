

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/jcxp670y21tf1.png"><p>How can I finish this Mana-Stacker/Archmage Breach Ring?</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/jcxp670y21tf1.png" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="nho5ub3" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>rogueyoshi</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="nho5ub3" class="commentText"><p>Looking for any deterministic crafts I can do to get some combination of Int/Mana-Regen/MF on the remaining affixes.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nho6ke8" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>uramis</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="nho6ke8" class="commentText"><p>How did you get here? Was the mana and cast speed there then 1 mod which got replaced by abyss and anothet mod which got replaced by the mana percent? </p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nho7kg5" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>averbeg</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="nho7kg5" class="commentText"><p>This is really easy to do yourself by just checking the tags of the affixes. Have a look, check the affixes you want, the tags for homogenous, the levels for tiered currency etc.</p>

<p><a href="https://poe2db.tw/Rings#ModifiersCalc" target="_blank">https://poe2db.tw/Rings#ModifiersCalc</a></p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nho7lcm" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Methyl_Lysine</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="nho7lcm" class="commentText"><p>I can help you with your suffixes.</p>

<p>1- activate the omen that deletes a suffix when you use a perfect or corrupted essence to delete mark of the abyssal lord
2- use the essence of hysteria to get t1 % mana Regen on your suffix
3- add mark of the abyssal lord again on your suffix
4- use omen of light + the omen that guarantees you a Kugral mod then Unveil to get either &ldquo;Recover (2–3)% of maximum Mana on Kill&rdquo; which is the perfect suffix to get or &ldquo;(12–20)% increased amount of Mana Leeched&rdquo; which you can reroll if you don&rsquo;t want it. Both of them have equal weights so it&rsquo;s <sup>50</sup>&frasl;<sub>50</sub> to get one of them.</p>

<p>For the prefix I don&rsquo;t know how you can guarantee an int mod. Tbh I don&rsquo;t think you can but you can look further from other comments if they can help you to get it. If not then just blind slam perfect exalted orb and hope for the best.</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
