    <style>
       * {

    <h2>
      <a class="postTitle" href="https://youtu.be/UypSZxSn9t0"><p>[Samson Folk] We don&rsquo;t understand passing or assists</p>
</a>
    </h2>

    

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="nb28u25" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>foofighter1351 | Raptors</div>
        <div>7 | 3 hours ago </div>
      </div>
      <label for="nb28u25" class="commentText"><p>Yes it&rsquo;s a Raptors thumbnail and centric channel but this is just a great general analysis on the way we value assists and can overrate them when we see larger assist numbers and very pass happy teams contrasting that to their actual success, very relevant to the Raptors because that&rsquo;s exactly what we saw from them last year. And if you don&rsquo;t know Samson Folk plays second to Caitlin Cooper on her channel and writes articles for her, he is wonderful.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nb2fmrq" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>nba2k11er | Warriors</div>
        <div>4 | 2 hours ago </div>
      </div>
      <label for="nb2fmrq" class="commentText"><p>Correct that assists are overrated and don&rsquo;t really evaluate passing correctly.</p>

<p>The video of Draymond triggered me into watching the rest of the video. If that was on purpose, it definitely worked. And to say Draymond has a lot of low value assists is comical. Curry is the one providing the creation&hellip; but Draymond is a necessary piece to the team system. And the team system is necessary to get the value out of Curry. Which led to team offensive efficiency and championships.</p>

<p>Mark Jackson had Curry on the ball. Like most stars, who play a different style. Bigger, stronger, faster. And can&rsquo;t shoot nearly as well. That had the team stuck in the first and second round.</p>

<p>You want real low value assists? Domantas Sabonis handoffs. They would get basically identical action with a pick and roll, no assist credited. The screen matters but the pass is irrelevant. I don&rsquo;t see any way the Warriors could play and get the same results without assists being there.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="nb2j1gh" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Mother-Cold1196</div>
        <div>6 | an hour ago </div>
      </div>
      <label for="nb2j1gh" class="commentText"><p>Doesn&rsquo;t the handoff put the decision making in domas hands literally?  I get what you&rsquo;re saying but the reason the dho works is cause the big has various options and can react to the defense &hellip;</p>

<p>Edit.. there&rsquo;s a reason they dont just run a screen for the shooter there</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="nb2lbbd" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>nba2k11er | Warriors</div>
        <div>3 | an hour ago </div>
      </div>
      <label for="nb2lbbd" class="commentText"><p>I think the main point is assists don&rsquo;t necessarily go to the guy who created the play or broke down the defense. The handoffs are a way to get some action out of his LACK of pressure, because his defender is sagging off. The decision-making is in his hands, in that he can wait and re-screen the other direction, or have someone else come off it. Quicker than on-ball. So that&rsquo;s something.</p>

<p>In other situations he is actually a good passer. He finds cutters and shooters. I just don&rsquo;t think the act of handing the ball off breaks down a defense. Not more than a screen (good screens are good, but we don&rsquo;t give Rudy Gobert assists for them).</p>

<p>Plus they will still award the assist even if the guy he hands it off to makes multiple dribbles and moves.</p>

<p>Here&rsquo;s a video, two highlights back to back. <a href="https://youtu.be/flU1Ejq7ldU?si=gAqX8kmh1-55Tb2X&amp;t=87" target="_blank">BS handoff screen assist, then a real dime.</a></p>
</label>
    </div>
  </label>
  
</div>

    
      
<div class="commentAndChildren">
  <input id="nb2k7hl" type="checkbox" checked/>
    <div class="comment">

        <div>syp2207</div>
        <div>0 | an hour ago </div>
      </div>
      <label for="nb2k7hl" class="commentText"><p>ironically, draymond himself has his iconic fake dho play which nowadays is one of his more reliable ways to score</p>
</label>
    </div>
  </label>
  
</div>
