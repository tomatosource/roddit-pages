      <label for="o822rji" class="commentText"><p>You started with tech, if you want your monies worth - continue with tech and follow somenes guide on a 77room.</p>

<p>Every empty slot is lost div per run.  Spy &amp;gt; legion &amp;gt; commander/Sac/smithy(these 3 can go 0-5d+ solo)… in my opinion of raw divine drops in a finished temple. Not in reference to their IMPACT on divine, just how much divine they typically drop.</p>

<p>Don’t shoot yourself in the foot because you want your own temple design this late in the league, get your times worth.</p>

<p>To answer question, you need golems. But making golem/smithy in a 2nd chain is very hard due to the now limited extra space to do the tech. The effectiveness increase per commander is HUGE with enough golems. Where your arch is prevents the tech. Move your arch! ❤️ With just 6 commanders you have over 600% rare mob effectiveness. With your number of spy masters, you’ll be over 4000% rare mob quantity.  Your second chain is more of a “fill in with max commanders now” since your main chain does golem/smithy before running in to connectivity issues.</p>

<p>While I understand wanting to do your own temple for your own divine per run being your own creation. I would not run this temple you have laid out. You are missing too golems and have essentially no corruption chambers. A low mod rare is not going to perform well drop rise compared to the 8-10mod rares we cookie cutter temple runners kill.  Get back to the drawing board, you have your spy master chain, so you have the baseline to do a lot. Now it’s a matter of finding where the best place for arch is, along with what you can create with max golem, commanders and corruption chambers. (While alchemy seem super awesome, you don’t need many due to how many spy masters we have and I can promise you on a finished temple adding one in our generator spot, has far less of an impact than generator(duh), commander, or corruption chamber.</p>

<p>Hope this was helpful, no hate on making your own temple. You’re just gimping yourself with so many empty spots while still have almost no golems.</p>
</label>

      <label for="o8387qj" class="commentText"><p>Moving arch, just make a fodder chain that blocks spaces around it. So like an L shape from
Center off to the left that’s one tile away from the left side of spy masters. Leaving only a 2 tile option to move. Where he currently is, and one below it.</p>

<p>Arch will not move to touch another room if there is an option to move that would not touch any room.</p>

<p>If your goal is to finish something, then maybe just go without tech and have some extra armories. It will lower your dig per run, but you’ll still have somewhat decent effectiveness and rare quantity.</p>

<p>You can speed up time to completion by leaving as soon as you hit 6 locks as well. Then reset for new cards. Although I typically finished spy area for reroll cards. Which I would keep max of 2 with 4 locks <strong>going in to next run</strong> (so after I have locked the chain).  And I never ran out. I went down to 1 when I began 2nd chain.</p>

<p>But for you, if you don’t do rerolls for speed sake should be just hitting1 lock per run, most runs. But sometimes 2 and if really bad luck of 0 locks, 3. Since you only need to use 1 lock per run. Two when your arch block gets closer to success to keep that chain until you move him but there isn’t a huge rush. Just needs to move before your smithy/golem would reach the area. 😀</p>
