

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>

        <div>Odd-Peace-5124</div>
        <div>3 | 4 hours ago </div>
      </div>
      <label for="mpgoyzi" class="commentText"><p>Tbh, I didnt play LS and havent even looked into it as everyone else is already playing it but I wanted to try spears in general. Glacial Lance itself is not super good for clear, it&rsquo;s about the explosion it does when consuming a frenzy charge. So, first you deal damage with the projectile and after that you hit a second time with the explosion which does more damage. Im scaling AoE for clear and and HoI also helps with that. It&rsquo;s a one button playstyle build, dont need to do anything besides running and spamming Glacial Lance</p>
</label>
    </div>
  </label>

      <div class="commentHeader">
        <div>TonnyKrain</div>
        <div>0 | 4 hours ago </div>
      </div>
      <label for="mpgrlz2" class="commentText"><p>And then you look at this, and you close your eyes, and travel back in time to the first days of 0.2 launch</p>

<p>Remember thousands of comments &ldquo;GGG NERFED ALL THE BUILDS, THE GAME IS UNPPLAYABLE&rdquo;</p>

<p>And all it took was to wait for like 5 days, for people to discover new OP builds that clear things as good as 0.1<br>
The problem there, was that Last Epoch dropped at the perfect timing for LE, and worst timing for PoE 2<br>
All the people who didnt want to wait the 5 day period to find new builds , just jumped over to a more casual friendly - Epoch.</p>

<p>Streamers are also to blame for a massive exaggeration of the situation, in the chase of clout and &ldquo;love&rdquo; from their viewers, and kept screaming &ldquo;poe 2 bad&rdquo; everywhere.</p>

<p>I think 0.3 will be an amazing recovery for GGG, not even much because of GGG, but because they wont have anything like the drastic switch from 0.1 to 0.2 anymore<br>
