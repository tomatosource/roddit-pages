      <div class="commentHeader">
        <div>lefebrave | a full team effort</div>
        <div>3 | 31 minutes ago </div>
      </div>
      <label for="n11fewb" class="commentText"><p>So there are not much to gain for trading or cutting the minumum guys just to replace them for others if we don&rsquo;t especially want to add some minimum contract player from free agency, summer league or somewhere. No need to discuss last 8 players in this list, we&rsquo;ll just wait and see. (I am very high Gonzalez personally.)</p>

<p>The first three is our core and I don&rsquo;t think we hit a direction to trade any of them. I would add Pritchard to that core, as Brad himself mentioned his name with those three as &ldquo;our core&rdquo; just before the free agency and it makes perfect sense with that contract and his role.</p>

<p>So all our moves will be really around Simons, Niang and Hauser.</p>

<p>As many already mentioned, it is really really hard to think we are keeping Simons in any case. That is the contract that a) can let us go under tax for this season b) open up enough space for adding talent, especially in the center position. Trade deadline is the expiring date of that contract unless he both plays well in our system AND ok with Pritchard level team friendly new contract. It is not going to happen.</p>

<p>If Niang is gone, it won&rsquo;t be a loss but we won&rsquo;t gain any asset back either. So, it will be side move in any case, we can dump his salary for going under tax at some point if needed. Or we can keep him as a shooter in a position of need until Tatum returns and let him walk after that. Whatever.</p>

<p>Hauser is the bargaining chip if we want someone or if some team knocks on the door to get a sharp shooter.</p>

<p>Being patient for a good opportunity to get a starting big in the long-term seems like the essence right now. I know, no news&hellip;</p>
</label>

      <label for="n11hp5y" class="commentText"><p>I&rsquo;ve been playing with the idea of dumping salary while somehow adding to our front court</p>

<p>I think there&rsquo;s a deal with our old buddies in Utah. It sounds like they are having a hard time trying to find a place for John Collins and they just got rid of 2 guards, so maybe there&rsquo;s something there?</p>

<ul>
<li>Jazz get Simons + Niang + 2nd rounder</li>
<li>Celtics get Collins + Springer</li>
</ul>

<p>As part of the deal, Hauser is traded into the Jazz MLE.</p>
