

<html>

    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>

    <h2>
      <a class="postTitle" href="https://youtu.be/O6Vq-muZhuw?si=7LiXFCayo_Sy9z3G"><p>Path of Exile 2&rsquo;s Crafting System Hates You | Design Delve</p>

<div class="commentAndChildren">

        <div>1 | 36 minutes ago </div>
      </div>
      <label for="o39vtcn" class="commentText"><p>I don&rsquo;t even have to watch this, poe2 doesn&rsquo;t have crafting it just has gambling for rich people.</p>

<p>crafting would imply gathering material, learning recipes and putting those together to form new items. None of that happens in poe2. You just take a shitty item, apply expensive orbs and hope for the best!</p>

      <div class="commentHeader">
        <div>Junyongmantou1</div>
        <div>1 | 26 minutes ago </div>
      </div>
      <label for="o39xinh" class="commentText"><p>if we take metacrafting away (10-60d omen vs 2d bench in poe1), crafting in poe2 is often as simple as vision crafting attribute stacking clusters in poe1 (which is one of the most tedious crafting, not often done manually): alt, add 3 mods, fracture, then alt-aug-regal-exalt for 4t1. attribute stacking simplex amulet since 3.27 is similar (<sup>1</sup>&frasl;<sub>3</sub> annul gamble, <sup>1</sup>&frasl;<sub>8</sub> or lower reforge influence gamble, each try requires half an hour of farming). people in general dislike this kind of crafting since it&rsquo;s indeed gambling. I&rsquo;d say poe2 still has a long way to go in terms of crafting methods and affix pool depth.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="o3a09hs" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>OnceMoreAndAgain</div>
        <div>1 | 10 minutes ago </div>
      </div>
      <label for="o3a09hs" class="commentText"><p>I just miss scouring orbs. I don&rsquo;t like having to loot so many bases every map. It&rsquo;s too much inventory management.</p>

<p>I&rsquo;d prefer we do league mechanics in map that give us an automatically looted resource that we can spend on crafting services. I like how new Breach in PoE1 does it. Do breach event. Get graftblood autolooted. Manually loot some wombgifts.</p>

<p>I also dislike the omen system but I can&rsquo;t put my finger on why.</p>
</label>

        <div>1 | 5 minutes ago </div>
      </div>
      <label for="o3a16zu" class="commentText"><p>Tbh I don&rsquo;t even want to imagine how disastrous crafting in 0.4 after removing Homogenization would be if not for massive influx of temple currency which let&rsquo;s you use Perfect Exalted Orbs a lot more freely.</p>

<p>I hope that they have something planned for 0.5 cuz current crafting with &ldquo;normal league drop rates&rdquo; simply won&rsquo;t do.</p>

<p>Also this league has been really nice example of what happens if we give players more currency and tbh I am absolutely convinced that for any further league Perfect Exalts and Annulment Orbs should have their drop rates massively buffed.</p>
