       * {

*,

  box-sizing: border-box;

html {

body {

}

h2 {

  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;

.subName {
  text-decoration: none;

.postList {
  display: flex;
  flex-direction: column;

}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
}

.selfPostContainer * {
  color: white;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>

    <h2>
      <a class="postTitle" href="https://i.redd.it/ky9osezu4pje1.png"><p>Just noticed the act 1 storyline around Count Geonor is being foreshadowed in a PoE 1 heist contract.</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img src="https://i.redd.it/ky9osezu4pje1.png" />

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="md8o316" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>LunarVortexLoL</div>
        <div>1 | 34 minutes ago </div>
      </div>
      <label for="md8o316" class="commentText"><p>I know most people probably don&rsquo;t care much about lore, but as a bit of a lore nerd, I thought this was very cool.</p>

<p>Count Geonor seems to have this obsession with proving his &ldquo;pure bloodline&rdquo; in act 1, which, according to this heist contract from PoE 1, seems to have been going on for a few decades already (which also makes me wonder how old Geonor is in PoE 2, if PoE 2 is set 20 years after PoE 1 and he&rsquo;s already a count in PoE 1).</p>

<p>And now I&rsquo;m wondering whether there&rsquo;s more foreshadowing to the events of PoE 2 in PoE 1 that I&rsquo;ve never noticed.</p>
</label>

        <div>1 | 4 minutes ago </div>
      </div>
      <label for="md8sdgs" class="commentText"><p>The developers said that the events of poe2 take place 20 years after the events of poe1, but it is not specified what events exactly. Most likely, they mean the murder of Kitava, since a lot is connected with the creation of the artifact - the seed of corruption. Several years pass after the murder of Kitava in poe1 (in the fall of Oriath we seem to see the celebration of the anniversary of the murder of Kitava), and the events of the last league seem to me somewhat closer to the events of poe2. More interesting is the personality of Orianna and her role in all this. Especially considering that everything points to her involvement in Geonor&rsquo;s madness.</p>
</label>
