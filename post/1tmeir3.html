      <label for="onm7t5t" class="commentText"><p>Cavs have nothing to be ashamed of. Neither do their fans. For the entire season, the Knicks have been disrespected and dismissed by the media and fans. The Knicks main issues for years was not having enough ball-handlers and turning over the ball entirely too much in the playoffs. The Heat and Pacers built the blueprint to beat them. Funny thing happened this season, however. Towns and the Knicks went through one of the worst stretches in Knicks history. It was then Towns got it. He was ordered to do more than score. In the playoffs, when games go to halfcourt predominantly, he turned into a team player. He facilitated, opening up the game for Mikal and OG. That took weight off Brunson’s shoulders. It kept KAT out of foul trouble. He began rebounding at a higher clip, generating assists, and getting easier shots closer to the hoop. The result? Knicks dominance in the halfcourt ball during the playoffs. The defense got better because Towns actually committed to playing defense like a C. He’s actually closing out on threes. He’s playing physical defense on anyone in the paint. He’s challenging people in the paint. This ain’t the same Towns from his Minnesota days.</p>

<p>Had Coach Brown not foolishly defended CJ McCollum with Jalen Brunson Games 1-3 vs the Hawks, the Knicks sweep the Hawks as well. This ain’t a fluke, fellas. Respects to the Cavs, but the Knicks are not going to be easy to beat in the playoffs.</p>

<p>OKC/Spurs fans who think they are going to have a cakewalk in the Finals against the Knicks have a RUUUUUUUUUUDE AWAKENING coming to them. Knicks are too physical for the Spurs and when push comes to shove, the Knicks will SHUTDOWN SGA in halfcourt sets just like the Pacers did last year. Pacers beat OKC had Haliburton not blown his Achilles. Knicks are going to be BIGGER and STRONGER than OKC on the blocks and will generate the type of hellacious perimeter defense required to minimize OKC’s offense.</p>
</label>
