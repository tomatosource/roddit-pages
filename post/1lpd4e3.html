

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>

<div class="commentAndChildren">

      <label for="n0ucpd1" class="commentText"><p>My buddy just started an incinerate alt.  He might be interested.  I just sent him this.</p>

<div class="commentAndChildren">

        <div>1 | 11 hours ago </div>
      </div>
      <label for="n0uy5dm" class="commentText"><p>I have many builds including an incinerate, this is a good want but the cast speed is undesirable unfortunately because the cast speed wont affect it, besides what you are looking for with incinerate is really the ignite damage, not really the damage of the skill itself most of the time</p>

<div class="commentAndChildren">

      </div>
      <label for="n0vkum4" class="commentText"><p>Cast speed increases the rate of fire exposure stacks, ya?</p>
</label>

<div class="commentAndChildren">

        <div>Dylan_M_Sanderson</div>
        <div>1 | 9 hours ago </div>
      </div>
      <label for="n0vnirc" class="commentText"><p>Not quite, fire exposure get inflicted once incinerate reaches 8 stacks (max) the exposure will apply at the same speed although reaching the 8 stacks will be slightly faster, but its already fast as it is so I personally don’t see cast speed being very useful unless your stun threshold is non existant, but better off getting stun threshold to be able to keep stacking the exposure instead of resetting every time slowly afflicting it and in the end that exposure should only be useful on unique enemies, my incinerate doesn’t need to reach 8 stacks to kill a rare enemy, just invest into magnitude of ignite over fire damage, incinerate is not like other fire spells in that sense, unless running cast on ignite with firestorm or any other spell i dont see the point, also keep in mind it not very good for bossing, i’m curious to know tho which class is he running</p>
</label>
