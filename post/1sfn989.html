

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://www.reddit.com/r/PathOfExile2/comments/1sfn989/new_player/"><p>New player</p>
</a>
    </h2>

    
    <div class="selfPostContainer">
      <p>Guys i wanted to play this game for so long do we know when it will be free to play? and is it possible to get keys from here or just bots that takes them?</p>

    </div>
    

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="oeyn8s6" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>callmemarcel</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="oeyn8s6" class="commentText"><p>Free to play is most likely going to be with 1.0 release..If we get an update every 3-4 months, I estimate the full release somewhere in the first quarter of 2027.</p>

<p>Not going to tell you how to spend your money, but $30 for this game is a steal imo</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="oeymbzs" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Deqnkata</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="oeymbzs" class="commentText"><p>There is no official info on release/f2p. We are expecting announcement of an announcement soon-ish. I guess there is none 0 chance that would be release just as there is none 0 chance you can win a key - some do get offered here from time to time. Likely we will have another patch/league (0.5) next month.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="oeypeuf" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Dawq</div>
        <div>1 | 24 minutes ago </div>
      </div>
      <label for="oeypeuf" class="commentText"><p>Next content update is coming early next month and usually starts with a free weekend.<br>
You can give it a try and see if it&rsquo;s worth your 30$.</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
