    <h2>
      <a class="postTitle" href="https://www.reddit.com/gallery/1qqged2"><p>[TEMPLE] How to rarity bot temple with wolf druid</p>
</a>
    </h2>

    

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="o2gfece" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Glittering_Leader689</div>
        <div>1 | 3 hours ago </div>
      </div>
      <label for="o2gfece" class="commentText"><p>I would recommend just communicating with your rarity bot and telling them to hang back a room or however big their presence radius is until you get a couple headhunter stacks. And if you need to refresh then tell them you’re low on buffs and to hang back again.</p>

<p>There’s sadly no ways that I know of other than that to stop the rarity bot from stealing the kills that would provide you with buffs because of the unique gravebinds</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="o2glemn" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>BeginningEqual5533</div>
        <div>2 | 2 hours ago </div>
      </div>
      <label for="o2glemn" class="commentText"><p>I&rsquo;ve made a homemade 400% rarity bot to run temple with my friend. Had to pull off gloves for a 10-20 secs every couple of minutes to allow him leech mods from rares.
Eventually clearing speed dropped anyway and we decided that div/hour ratio even lower with bot.
Maybe 1 rarity and 2+ carries would be fine though.</p>

<p>Also wolf (i main shaman with similar dps as OP) is actually not a great temple farmer, i spend too much time clearing corners with sleeping mobs.</p>
</label>
    </div>
  </label>
  
</div>

    
      
<div class="commentAndChildren">
  <input id="o2glvtc" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>CriFerr</div>
        <div>1 | 2 hours ago </div>
      </div>
      <label for="o2glvtc" class="commentText"><p>he tried to take in hands the gravebinds when i need hh buff , but too tricky&hellip;
So, you suggest let him a room behind just in time to do some rares and refreshing hh buffs?</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="o2gnevp" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Traditional_Pea_6532</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="o2gnevp" class="commentText"><p>Unfortunately, Aurabot isn&rsquo;t very good in the temple because the real star of the temple is the Headhunter, keeping you constantly up to 61 buffs&hellip; it&rsquo;s much better to play solo and fill your group with leechers, and put some rarity into your own build, something between 150 and 300. If the Aurabot is a friend of yours and you don&rsquo;t want to play with him, ask him to use a DPS and call the rest of the party with leechers, and have them stay one room ahead to avoid the risk of someone stealing a Kalandra.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="o2gx1p0" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Ukkoclap</div>
        <div>1 | 44 minutes ago </div>
      </div>
      <label for="o2gx1p0" class="commentText"><p>Aurabot is actually good can triple / quadruple your DPS. It&rsquo;s just the gravebinds rarity bot that&rsquo;s not great in temple. There&rsquo;s also a pure aurabot build thats pretty good if you wanna play with friends.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="o2gz3q1" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Traditional_Pea_6532</div>
        <div>1 | 34 minutes ago </div>
      </div>
      <label for="o2gz3q1" class="commentText"><p>I&rsquo;m missing this type of Aurabot in this league, the Lich Aurabots that cast area curses and greatly increase damage.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="o2h4psj" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Ukkoclap</div>
        <div>1 | 7 minutes ago </div>
      </div>
      <label for="o2h4psj" class="commentText"><p>Pure aurabot is basically just items that give buff to the carry. There&rsquo;s actually not really any aura&rsquo;s in the game that directly give damage in form of aura&rsquo;s like in PoE1. So we basically just use Fixation of Yix ammy and 3x Evergrasping Ring with a good roll 25-30% and a good rare sceptre with good damage rolls. You can also use the lightning Chest for minus res. There&rsquo;s also some cool cast on minion death stuff you can do. Also temp chain/enfeeble as a little bonus not like you really need it but its just an extra.</p>

<p>It&rsquo;s not super popular because rarity bot steals the spot light but it feels greatly dimnished as I as carry already am running 160+ % IR. We have both tries gravebinds and pure aurabot and couldn&rsquo;t tell a difference in a fully juiced temple.</p>
</label>
