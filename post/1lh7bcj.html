

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>

    <h2>
      <a class="postTitle" href="https://www.reddit.com/r/PathOfExile2/comments/1lh7bcj/sacred_flame_shrine_sceptre_help/"><p>Sacred flame shrine sceptre help.</p>
</a>
    </h2>

    
    <div class="selfPostContainer">
      <p>Can somebody help me get this sceptre, I only have 2 Div&rsquo;s and am struggling to manage to get one.</p>

    </div>
    

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="mz1wgo7" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Mic_Ultra</div>
        <div>2 | 2 hours ago </div>
      </div>
      <label for="mz1wgo7" class="commentText"><p>I’ll help. First you’ll want to optimize you build by looking up some low budget variants. Next, farm currency, either by three tower setups or selling drops from trail of chaos will work. Lastly continue to seek favorable trades for non-currency drops, even on for people buying bulk items. This should help you get your 2 divine to the market rate of this spectre</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="mz1zr8p" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>zavorak_eth</div>
        <div>1 | 2 hours ago </div>
      </div>
      <label for="mz1zr8p" class="commentText"><p>I ran with a regular scepter for a while until I was able to get mine. I picked up a lot of items to sell. Just make sure to sell lots of stuff, even if it sits for a while. I just sold a belt I had listed for 5divs then 4 divs for weeks. Weekends are best time to be on to sell. Run chaos or sekhemas for decent currency and drops. I like chaos cause theyre quicker. Juiced maps also drop decent stuff and many more orbs now.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="mz218j4" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>BanginNLeavin</div>
        <div>0 | an hour ago </div>
      </div>
      <label for="mz218j4" class="commentText"><p>If you want to punch above you&rsquo;re weight class then set your atlas to shrines and learn boss fights so you can use 2 overseer tablet + 1 irradiation tablet to get juicy bosses.</p>

<p>Clear maps but leave the shrines as much as you can*. Then circle back and pick up the shrines to go fuck up the boss.</p>

<p>*If you already have a good offensive shrine and see another just take it. Always save the damage negation shrine for the boss of you find one. And taking accel shrine is <sup>50</sup>&frasl;<sub>50</sub> whether you want to save or take.</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
