      <label for="njmshms" class="commentText"><p>From Chris Forsberg:</p>

<p>The fact that Neemias Queta has played just 25 total minutes in two appearances might suggest that the team is both <a href="https://www.nbcsportsboston.com/nba/boston-celtics/neemias-queta-eurobasket-highlights-portugal/728217/" target="_blank">pacing him after a busy summer at EuroBasket</a>, and that Boston&rsquo;s decision-makers prefer to use these game reps to get longer looks at the team’s new bigs.</p>

<p>But Queta hasn’t looked nearly as crisp against a bunch of second-stringers as he did against elite-caliber big men in FIBA play. His defensive rebound rate has been alarmingly low and his turnover rate has been too high. Queta needs to settle in and let his talents take over. The Celtics dominated his preseason minutes last year (+47.3 net rating in 74 minutes of floor time) and his rebounding was excellent. </p>

<p>Queta seemingly was steamrolling toward the starting center role given the overhaul to Boston’s frontcourt. And maybe he still is. But the departures at that position have only thrown a harsher spotlight on the preseason frontcourt play, and Queta can help erase any consternation about Boston’s bigs with a solid showing before the real games arrive.</p>

<p>Newcomers Chris Boucher and Luka Garza have been excellent in their preseason minutes.</p>

<p><a href="https://www.nbcsportsboston.com/nba/boston-celtics/preseason-neemias-queta-hugo-gonzalez/738824/" target="_blank">Read more here</a>.</p>
</label>
