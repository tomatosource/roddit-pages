

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://www.reddit.com/gallery/1ju13l1"><p>The massive step backward in waypoint map design</p>
</a>
    </h2>

    

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="mlykj7o" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Piplups7thEvolution</div>
        <div>8 | 3 hours ago </div>
      </div>
      <label for="mlykj7o" class="commentText"><p>I also hate the layered map. It&rsquo;s jarring searching for the right zone you want to go to but then get taken to the &ldquo;underground&rdquo; layer of the map and have to click on the zone again to get teleported there.</p>

<p>Edit: And when you want to go to the town from the underground layer using a waypoint you have to press the layer button first. At that point it&rsquo;s just faster to town portal next to the waypoint.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="mlykj96" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>InsPoE</div>
        <div>7 | 3 hours ago </div>
      </div>
      <label for="mlykj96" class="commentText"><p>Maybe it&rsquo;s an IRL INT issue but it always takes me a minute to figure out where I am going in Act 2. I grow weary of GGG prioritizing form over function.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="mlynl4b" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>mykevelli</div>
        <div>3 | 3 hours ago </div>
      </div>
      <label for="mlynl4b" class="commentText"><p>Yeah this act in particular is a mess.  I get that they want to show the caravan parking lot as diamonds but that shit is confusing.  There is just too much stuff going on here.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="mlz0q1f" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>RedsManRick</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="mlz0q1f" class="commentText"><p>They were so busy thinking about whether they could that they failed to consider whether they should.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="mlyxvf2" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Impossible-Radio-720</div>
        <div>2 | an hour ago </div>
      </div>
      <label for="mlyxvf2" class="commentText"><p>I feel the same.</p>

<p>it&rsquo;s like they make the backward just for the difference from POE1.</p>

<p>Also the new atlas is way worse than poe1 atlas which has been evoluted for over a decade.</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
