

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://www.reddit.com/r/PathOfExile2/comments/1qsghp1/does_character_rarity_affect_your_drop_rates_for/"><p>Does character rarity affect your drop rates for the last flame relic or the adorn jewel?</p>
</a>
    </h2>

    
    <div class="selfPostContainer">
      <p>Trying to decide which one to farm lol last flame being 3 mirrors is very enticing</p>

    </div>
    

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="o2vcz4h" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>ConsiderationLoud663</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="o2vcz4h" class="commentText"><p>Im pretty sure the only thing that helps with chances of getting a last flame is the mod on relics that increases the % of relics dropped. If you get it to a certain amnt % increased then he’ll drop 3. Rarity can’t hurt though but I’m pretty sure “more relics dropped” is more important.</p>

<p>Can’t speak for adorned.</p>

<p>Edit: for last flame please temper expectations as I farmed the fuck out of it last league and didn’t drop one, some people have farmed it &amp;gt;500 times and haven’t. It’s pretty rare hence the 3mirror price tag. However you can profit running sekhemas along the way regardless.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="o2vg5de" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>TasteOfChaos52</div>
        <div>1 | 35 minutes ago </div>
      </div>
      <label for="o2vg5de" class="commentText"><p>Adorned is ~<sup>1</sup>&frasl;<sub>50</sub>. Last flame is like ~<sup>1</sup>&frasl;<sub>1000</sub> (maybe not exactly but you get the point haha)</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="o2vg18n" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>SGSpec</div>
        <div>1 | 35 minutes ago </div>
      </div>
      <label for="o2vg18n" class="commentText"><p>You wont get a last flame. Farm adorned but you need a lot of divs to be able to run it</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
