

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>

<div class="commentAndChildren">

<div class="commentAndChildren">

    <div class="comment">

        <div>MTosti92</div>
        <div>1 | 37 minutes ago </div>
      </div>
      <label for="n0l4kur" class="commentText"><p>Screenshot button, save to captures, download pictures from PS App for upload on mobile. PS5 has a workaround for good screenshots, just a couple of extra steps :/</p>

<div class="commentAndChildren">
  <input id="n0l7k3o" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>guitarheroprodigy</div>
        <div>1 | 22 minutes ago </div>
      </div>
      <label for="n0l7k3o" class="commentText"><p>Replace pure evasion body Armour with evasion energy shield. Also olroths life flask (put lifetap gem on volt skill then after volt use life flask to put up health buffer)</p>
</label>

  </label>

<div class="commentAndChildren">
  <input id="n0l7pg7" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Cyknis</div>
        <div>1 | 22 minutes ago </div>
      </div>
      <label for="n0l7pg7" class="commentText"><p>Your build looks extremely similar to mine. Full evasion build which is extremely unpopular. My lightning arrow does 137k dps unbuffed in the skills tab, POB says 190k which isnt entirely accurate because POB does not account for &ldquo;Inspiring Ally&rdquo; which applies companion damage to your damage. Getting one shot can be inevitable sometimes. To really lessen it you would have to completely change your build to have energy shield, New tree and new gear. I just play more carefully and i do okay, but sometimes i do die. Maybe next league ill try an energy shield build. As for increasing your damage, your biggest boost will be getting a new bow. Overall its good, but something with more increased physical damage and more crit hit chance will help alot. My bow is 570 dps overall, and i think the increased physical damage modifier is 230%. Secondly, getting +2 Projectile Skills on your quiver, and +3 Projectile Skills on your amulet also helps alot. Unfortunately with it being so far into the league, and the current status of the league, prices are severely inflated and getting good gear for a good price is very difficult</p>

<p>Edit: Getting a heavy belt with an additional +xxx Stun threshold modifier can help alot also if you&rsquo;re getting knocked off your rhoa. Mine is 24% + 300ish</p>
</label>
    </div>
  </label>
  
  <div class="commentList">

    <div class="comment">
      <div class="commentHeader">
        <div>Quick_Daikon6988</div>
        <div>1 | 13 minutes ago </div>
      </div>
      <label for="n0l9hbv" class="commentText"><p>Thanks mate i will try and look for a new bow and quiver, but still a long way from 50k to 137k dps, but damage is protection. Do you use any fancy unique stuff like an against the darkness? I just have a hard time seeing my damage double from bow and quiver upgrade alone or at least not a 50 div upgrade.</p>
</label>
