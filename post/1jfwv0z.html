      <label for="miugib0" class="commentText"><p>There are a lot of salient quotes in this. Especially the part about the plans that Wyc and Brad have laid out to Chisholm, he seems to be in alignment with them in order to &ldquo;extend the window&rdquo;.</p>

<p>Notable Excerpts:</p>

<blockquote>
<p><strong>&ldquo;This process to buy the team started just under 50 years ago when I had my 7th birthday and attended a game at the old Boston Garden,&rdquo; Chisholm told Charania. &ldquo;I was hooked ever since. I&rsquo;ve been a rabid fan ever since. I bleed green. I love the Celtics. When this opportunity came up, I couldn&rsquo;t pass it up. Wyc has done an incredible job running this franchise. So why would you mess that up? The team is in a great place right now, and I&rsquo;m very sensitive to that. Wyc, Brad (Stevens) and Joe (Mazzulla) have done amazing jobs and that&rsquo;s all goodness that we want to continue.&rdquo;</strong></p>

<p><strong>&ldquo;We hoped from the beginning to find the right person with the resources and commitment to win banners, and being a great person,&rdquo; Grousbeck told Charania. &ldquo;Bill checks every box for us. I have always been a consultant and have had final say here with the Celtics since the family bought into the team, and that will continue for the next three years and we will transition.&rdquo;</strong></p>

<p><strong>&ldquo;My approach is to win and raise banners,&rdquo; Chisholm told Charania. &ldquo;That&rsquo;s in the near term and the long term. I&rsquo;ve had a couple of sit-downs with Brad and it&rsquo;s been about aligning our goals, and extending the window of this team. The plans that Wyc and Brad have laid out make perfect sense to me.&rdquo;</strong></p>

<p><strong>Sources told Charania that Grousbeck and Pagliuca exchanged &ldquo;warm&rdquo; texts on Thursday.</strong></p>

<p><strong>During a conference call with reporters in November after Boston visited the White House to celebrate its title, Grousbeck reiterated the plan for him to remain in charge after the sale, and through 2028.</strong></p>

<p><strong>&ldquo;With the new collective bargaining agreement, it puts all of the basketball issues at a premium,&rdquo; Grousbeck told Charania. &ldquo;You have to be brilliant and lucky to run a team successfully. We have that in Brad. Brad is the executive of the year.&rdquo;</strong></p>

<p><strong>Chisholm will attend games with his wife in April.</strong></p>

<p><strong>&ldquo;It&rsquo;s been emotional for me since we got this done,&rdquo; Chisholm told Charania. &ldquo;As a family, we listened to Johnny Most, the old voice of Celtics, describing the Celtics and one of his calls. &hellip; We just listened to him and had a great dinner (Wednesday) night. It&rsquo;s a dream come true. I have had to pinch myself. This is the best sports franchise in the world &ndash; not just the United States and not just basketball. It&rsquo;s the winningest team in the U.S. and the quality of what&rsquo;s here is unmatched. I think about the potential and the legacy here, and I personally feel like I got a bargain.</strong></p>

<p><strong>&ldquo;I&rsquo;m a fan. That&rsquo;s the most important thing. I bleed green. I&rsquo;m up for the challenge.&rdquo;</strong></p>
</blockquote>
