

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
}

.selfPostContainer * {
  color: white;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/elqppgphqxle1.png"><p>Crafting advice pls</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img src="https://i.redd.it/elqppgphqxle1.png" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">

    <div class="comment">
      <div class="commentHeader">
        <div>Giraffeb8</div>
        <div>4 | an hour ago </div>
      </div>
      <label for="mfb5n7i" class="commentText"><p>Greater essence of Lightning. Too many bad mana mods it can hit ex mana on kill, leech, light radius. With lightning ess only brick is added light damage to attacks but stackers are using that so you can sell still.
PoE2 crafting is a volume numbers game unlike PoE1. Hit it and may the rng gods be with you exile.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">

    <div class="comment">
      <div class="commentHeader">
        <div>JulesDeathwish</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="mfb87l4" class="commentText"><p>Do we know if the Exalt omens that add multiple mods roll mod tier separately or as a group?  I&rsquo;d use them more if it was grabing multiple mods from a single tier roll.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="mfblndr" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>SuViSaK</div>
        <div>1 | 7 minutes ago </div>
      </div>
      <label for="mfblndr" class="commentText"><p>They sell for cheap on the currency exchange. Doubt they are useful other than saving 1 ex on a slam.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="mfbmyea" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>JulesDeathwish</div>
        <div>1 | a few seconds ago </div>
      </div>
      <label for="mfbmyea" class="commentText"><p>Adds up in map rolling.  EFFICIENCY!</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

    
  </div>
  
</div>

        
      
    </div>
  </body>
</html>
