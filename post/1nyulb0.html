      </div>
      <label for="nhxw95j" class="commentText"><p>Ignited ground doesn&rsquo;t really do enough damage to threaten the energy shield with the capped fire res, but the shade walker affix is easily the most threatening damage the build faces, was actually the last thing to kill me when I wasn&rsquo;t paying enough attention!</p>

<p>Just have to pay serious attention and you should be fine, it has to burn through over 10k combined health pool in good gear without you noticing and getting away. And unlike most other builds with the sheer amount you slow even rare enemies, you <em>can</em> still get away from the offending enemy.</p>

<p>I&rsquo;d like to look at alternate offensive setups for sure, but ignite has been hard for me to get away from because of how easy it is to scale the incinerate damage with many different more damage multipliers without needing to deviate far from the ES/recoup nodes you want to be tanky. The ignite nodes really are in a fantastic position for an ES recoup stacker.</p>

<p>Easy crit damage scaling, Saitha&rsquo;s aggravation, ignite/ailment magnitude, all three are over 100% individual more &ldquo;damage buckets&rdquo; that other build archetypes won&rsquo;t be able to access. Lightning spells get shock, sure, but that requires decent investment to get good shock magnitudes to even start to compare to just one of those damage buckets.</p>

      <label for="ni0wy7h" class="commentText"><p>This was grand, Swedge. The editing + chaptering made it super easy to follow (the Defensive Layering at ~3:00, then the clean split between bossing and mapping setups was chef’s kiss). Off-meta Chronomancer that can AFK Uber Simulacum on ~10d and still push ~4M ignite DPS on pinnacles is exactly the kind of &ldquo;why does this work so well?&rdquo; content I crave and live for.</p>

<p>What sold me is the why behind it: stacking ES recoup with constant hit intake to self-fuel sustain, then using Chrono slows to keep rares glued in chromodynamic molasses so you can actually walk away from the scary stuff. Your note about DoTs tracked with my experience too—ignited ground = meh at capped fire res/ES, but Abyss Shade Walker phys DoT being the real &ldquo;pay attention&rdquo; check is spot on. A 10k+ effective pool buys a lot of reaction time, but not if we face-tank it while admiring our own orb balls. 😅</p>

<p>On offense, the reasoning to stay ignite over chaos conversion answers the Blackflame-Covenant curiosity nicely: the pathing puts ignite/ailment magnitude, easy crit scaling for ignite, and Saitha’s Aggravation into play—each basically its own &ldquo;more&rdquo; bucket—so even if monsters trend lower chaos res, the fire side’s stacking multipliers + promxcuity to ES/recoup nodes is just cleaner. Mapping with Fireball &ldquo;suns&rdquo; looked better than I expected too; the swap back to Incinerate for bossing keeps the single-target silly without wrecking keybind sanity.</p>

<p>Couple questions if you’re still around in the cyberswamp:</p>

<p>Either way, great guide. Time to &ldquo;AFK&rdquo; Simu while I AFK my coffee—see you all when the 10 div budget mysteriously becomes 100 div by tomorrow. 🔥🕰️</p>
