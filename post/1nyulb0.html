      <label for="nhxurtn" class="commentText"><p>Pretty nice setup, I dig it.</p>

<p>How do you handle DoT&rsquo;s tho? You mention that bleed and poison don&rsquo;t really pose a threat because they are tied to hits, but what about ignited ground and more importantly the phys dot from the abyss shade walker affix? I assume those eat you up really fast, especially if there are no incoming hits to fuel the recoup.</p>

    <div class="comment">

      </div>
      <label for="nhxw95j" class="commentText"><p>Ignited ground doesn&rsquo;t really do enough damage to threaten the energy shield with the capped fire res, but the shade walker affix is easily the most threatening damage the build faces, was actually the last thing to kill me when I wasn&rsquo;t paying enough attention!</p>

<p>Just have to pay serious attention and you should be fine, it has to burn through over 10k combined health pool in good gear without you noticing and getting away. And unlike most other builds with the sheer amount you slow even rare enemies, you <em>can</em> still get away from the offending enemy.</p>

<p>I&rsquo;d like to look at alternate offensive setups for sure, but ignite has been hard for me to get away from because of how easy it is to scale the incinerate damage with many different more damage multipliers without needing to deviate far from the ES/recoup nodes you want to be tanky. The ignite nodes really are in a fantastic position for an ES recoup stacker.</p>

<p>Easy crit damage scaling, Saitha&rsquo;s aggravation, ignite/ailment magnitude, all three are over 100% individual more &ldquo;damage buckets&rdquo; that other build archetypes won&rsquo;t be able to access. Lightning spells get shock, sure, but that requires decent investment to get good shock magnitudes to even start to compare to just one of those damage buckets.</p>
