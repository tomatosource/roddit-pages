<div class="commentAndChildren">

    <div class="comment">
      <div class="commentHeader">
        <div>AutoModerator</div>
        <div>1 | 8 hours ago </div>
      </div>
      <label for="myfsutu" class="commentText"><p>Thanks for sharing your crafted item! This is a reminder to include the story of how (and optionally, why) you made the item; otherwise, we may have to remove your post. See our <a href="https://www.reddit.com/r/PathOfExile2/wiki/rules/#wiki_10a._crafting_showcases" target="_blank">Rule 10</a> for more details and some potential questions to answer. If you&rsquo;ve already done that, thank you! You can ignore this message in that case.</p>

<p><em>I am a bot, and this action was performed automatically. Please <a href="/message/compose/?to=/r/PathOfExile2">contact the moderators of this subreddit</a> if you have any questions or concerns.</em></p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="myfu0ki" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Emrick_Von_Pyre</div>
        <div>1 | 8 hours ago </div>
      </div>
      <label for="myfu0ki" class="commentText"><p>I don’t know how to edit the post, but should also include whittling away the reduced attributes</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="mygbi8m" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>chaos-spawn91</div>
        <div>2 | 7 hours ago </div>
      </div>
      <label for="mygbi8m" class="commentText"><p>Life is usually undesirable in these kind of armors, that&rsquo;s probably why you didn&rsquo;t find something similar to what you want - if someone has such a good armor, they probably whittled to have triple defense prefixes.</p>

<p>I don&rsquo;t think there&rsquo;s such a thing as mirror-worthy armor though. Maybe the ones that were made with the essence that allocates a notable. But to get as close to a mirror as you can, you&rsquo;d have to change the 3 mods to ideal T1 mods.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="myh6v1s" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Emrick_Von_Pyre</div>
        <div>1 | 4 hours ago </div>
      </div>
      <label for="myh6v1s" class="commentText"><p>Awesome, thank you! I didn’t realize life wasn’t a priority on these. Instead I’d be looking for more es/ev? Or more resist?</p>

<p>It was a pretty big boost from what I had so I’ll probably just keep it but I may spend some money to whittle if I ever feel like I have enough. Tough thing to do though when it would eat up <sup>1</sup>&frasl;<sub>3</sub> of my total divines just to rerole once</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="myhe3ax" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>chaos-spawn91</div>
        <div>1 | 4 hours ago </div>
      </div>
      <label for="myhe3ax" class="commentText"><p>Yeah, the ideal would be more ES/EV. There are I think 3 or 4 possible mods for ES/EV (%, full flat, flat + life, % + something else). You can look at the ones with the most of the attribute to get a feeling of the best mods.</p>

<p>In your case it wouldn&rsquo;t be worth it to do it now if you have other points in your build that you can improve and you don&rsquo;t have much currency.</p>

<p>Most of the possible mods (like 90%) will be downgrade from your life roll, so keep that in mind. It may get expensive and I haven&rsquo;t taken a time to check the pricing of your current armor and the ones on the market. If I&rsquo;d have to guess I&rsquo;d say it&rsquo;s not worth it to spend that amount of currency on your armor.</p>

<p>Most of the hybrid builds depends on ES for the bulk of the eHP, and HP gets a secondary role on your survivability. Depending on your build, you can get like 50~200% (or more) increased maximum ES, so a 100 ES improvement is equal to 300 life for example.</p>

<p>I for instance have like 1.5k HP and 3.5k ES in my hybrid build (something like 80% evasion). There are items where it&rsquo;s worth it to get life on, but the improvement of eHP on armor for a hybrid mod is usually way bigger than just life.</p>

<p>PS.: defenses always roll on prefixes (life, evasion, ES, armor), and resists, attributes and others go on the sufixes. So you have 3 slots for defense, and 3 for the other stuff (life regen and reduced attributes could be replaced with resist).</p>
</label>
