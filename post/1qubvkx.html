      <label for="o39kd40" class="commentText"><p>Yeah, I had a peek at the NZ housing market last time it came up, and wondered if it would be enough if I sold my place and bought a house without a mortgage, if a CS role would pay enough.</p>

      <label for="o39nyt9" class="commentText"><p>NZ is one of the lowest wages in the &ldquo;first world&rdquo; (if you subscribe to that categorization anyway). Even if you consider yourself a creme of the crop super genius c++ programmer type, you would make x10 more in wages in the US, UK, EU&hellip;heck, even Japan will probably pay you 2x, and Japan&rsquo;s wages have been stagnant for over a decade.</p>

<p>You are only going to apply for GGG from abroad if you have a deep passion and long term vision for your career, you don&rsquo;t care about the wages to a certain extent, and/or you just like suffering. Also, GGG has to do legal paperwork to ship you over, so it certainly costs them to hire you.</p>
