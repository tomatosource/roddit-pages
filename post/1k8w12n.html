

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>

    <h2>
      <a class="postTitle" href="https://www.youtube.com/watch?v=U957WEadFAA"><p>I turned Ember Fusillade into a machine gun!</p>
</a>
    </h2>

    

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="mp9med7" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>tommy_mooo</div>
        <div>3 | 6 hours ago </div>
      </div>
      <label for="mp9med7" class="commentText"><p>This pretty cool, not a fan of how the skill play personally mostly due to very linear targeting, great for boss as long as they don&rsquo;t move too much but the base damage is there.</p>

<p>Either way cool setup and the staff a good find.</p>

<p>Side note, hope they don&rsquo;t nerf the recoup chest next league &amp;gt;_&amp;gt;</p>

<p>Edit: could also use the passives on the tree that give a chance of 2 extra proj, can hit 50% without scattershot downside instead of the staff, not be as good but it could be an option.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="mp9nuwi" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Caliath</div>
        <div>2 | 6 hours ago </div>
      </div>
      <label for="mp9nuwi" class="commentText"><p>They are indeed a very good option for hit-and-run mapping but on bosses I generally try to cast each ember twice so they accumulate to their maximum of +12 and +11 embers for the most amount of damage. And since the staff gives +5 proj I&rsquo;m already maxing them out in 2 casts so the 2 extra projectiles from the tree seemed redundant. But if you don&rsquo;t plan to use the staff and decide to go for a regular rare wand+focus setup with scattershot and wildshards, then they become an extremely good option.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="mp9oohm" type="checkbox" checked/>

        <div>2 | 6 hours ago </div>
      </div>
      <label for="mp9oohm" class="commentText"><p>Yeah that make sense, didn&rsquo;t try to push the skill that much but with all those extra proj and maxing in 2 click it probably fix most of the mechanical issues I had with it.</p>
</label>

</label>

  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="mp9wpx0" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Caliath</div>
        <div>1 | 4 hours ago </div>
      </div>
      <label for="mp9wpx0" class="commentText"><p>Because I personally like the Soulless Form ascendancy passive. It gives a ton of mana regen based on your max life and also allows 10% of damage to bypass energy shield. The reason I want that is because I&rsquo;m using around 65% Damage taken Recouped as Life and since I&rsquo;m also wearing the Sacrosanctum body armour that means I get 65% ES recoup too so I get to double dip from both of those which makes me very tanky. Alternatively I was also considering a crit variant as a Bloodmage. The damage numbers on that variant were tripple what my current are, but I had survivability issues with it so I decided to leave that problem for another day.</p>
</label>

<div class="commentAndChildren">
  <input id="mp9umbv" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Caliath</div>
        <div>3 | 5 hours ago </div>
      </div>
      <label for="mp9umbv" class="commentText"><p>Actually, all you need is the staff and the helmet which cost 1ex each and you can instantly get into early t15 maps and t0 bosses. The rest of the gear is completely replaceable or transformable into something else. Also the only expensive things in the build are the jewel with +3 levels of ember fusillade skills (5div), the snakepit ring (9div) and the 6links. But none of those are necessary, it&rsquo;s just a bit extra damage if u have higher levels on your embers with more gems supporting them. And snakepit ring is purely for a nicer and faster map clearspeed because of the +1 chain that it provides.</p>
