

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/ogyvahqnf6vf1.png"><p>Any 1-handed mace users out there? Question below.</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/ogyvahqnf6vf1.png" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="njjtzug" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>ButterflyPutrid6054</div>
        <div>3 | 6 hours ago </div>
      </div>
      <label for="njjtzug" class="commentText"><p>As someone that used one-handed maces on a Warbringer up until endgame before switching to 2-handers/Giant’s Blood, I would say that I don’t think it is worth investing a whole lot of money into one-handers.</p>

<p>There’s a lot of decent enough ones available that you’d have to get it damn near perfect to make good money on, and any build that needs that high end of a mace could likely have the currency to make Giant’s Blood work and switching to 2-handers. There’s also a lot of good 2-handers available (600-800 dps range) for not that much Div.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="njkd6yc" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>c-lati</div>
        <div>1 | 4 hours ago </div>
      </div>
      <label for="njkd6yc" class="commentText"><p>Ok, thanks for the advice.</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="njju2kv" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Fine_Act47</div>
        <div>2 | 6 hours ago </div>
      </div>
      <label for="njju2kv" class="commentText"><p>People use 1 handed maces??</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="njjy4pd" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>MaskerLVQ</div>
        <div>1 | 6 hours ago </div>
      </div>
      <label for="njjy4pd" class="commentText"><p>No one knows. Checking market means your similar item that couldn’t sell for the minimum listed. It might be way far lower price, but can’t be higher than that price if it’s buy out. Your 1-hand mace is not worth even 10 divs to craft.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="njklsq5" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>rLce</div>
        <div>1 | 3 hours ago </div>
      </div>
      <label for="njklsq5" class="commentText"><p>only one handers i see used are for warbringer shouts but they still swap to two handers so they dont really need phys % on them just stuff like str and extra damage as phys and life on kill</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="njkq1ww" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Ralek27</div>
        <div>1 | 2 hours ago </div>
      </div>
      <label for="njkq1ww" class="commentText"><p>I would check the price of blue mace or what ever with T1 % physical. If they are plenty maces on market with a low price , just reveal and pray and sell it like it is.</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
