

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/rzooafd6he6h1.png"><p>QoL feature request for queuing tablets</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/rzooafd6he6h1.png" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="oqsj2aa" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Ynead</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="oqsj2aa" class="commentText"><p>Alternative: make tablets generic, max 5 to 6 tablets per map, stacked up to 20 per slot. Perhaps change their form to something cooler, like an insect or something&hellip;</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="oqshynm" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>LordAlfrey</div>
        <div>6 | an hour ago </div>
      </div>
      <label for="oqshynm" class="commentText"><p>Tabs usually last 10 maps, waystones are one per map, I think a waystone queue would be more of a priority if they even want to implement something like this.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="oqsjnfv" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Volitar</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="oqsjnfv" class="commentText"><p>Just give me the POE1 map pouch pls.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="oqsh139" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Bodyash</div>
        <div>2 | an hour ago </div>
      </div>
      <label for="oqsh139" class="commentText"><p>Yes please</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="oqskzrz" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>HellionHagrid</div>
        <div>1 | 36 minutes ago </div>
      </div>
      <label for="oqskzrz" class="commentText"><p>i admire your urge to play the game, but i think this is a little bit too much exile</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="oqsl8x8" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Aclow</div>
        <div>1 | 34 minutes ago </div>
      </div>
      <label for="oqsl8x8" class="commentText"><p>What about queuing tablets for queuing tablet slots?</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
