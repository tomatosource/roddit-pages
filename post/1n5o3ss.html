

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/j9v9kf26wjmf1.jpeg"><p>I can hardly tell the difference between the color for weapon passives.</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/j9v9kf26wjmf1.jpeg" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="nbtydjz" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>HappyTreeFrients</div>
        <div>10 | an hour ago </div>
      </div>
      <label for="nbtydjz" class="commentText"><p>Typical case of GGG UI.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nbu2s7h" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>BulusB</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="nbu2s7h" class="commentText"><p>Yeah, ggg is known for this. You hardly can tell in Poe 1, if it’s rare or blue plant in harvest and I personally don’t understand why they can’t or don’t it to be more clear</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nbu1j16" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Vaeryn1976</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="nbu1j16" class="commentText"><p>In PoE1 it&rsquo;s the same unfortunately with that kind of stuff. Someone there thinks it&rsquo;s &lsquo;not needed&rsquo; eg. to highlight your searches in a very meaningful, standing out way to not force people to search for almost invisible highlight after they alfeady made a search. It&rsquo;s like that with skill tree, atlas, etc. Only  place where it works is stash. In general, &lsquo;vision clarity&rsquo;, in PoE, in many places is - straight out - an oxymoron.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nbtytnm" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>bledschaedl</div>
        <div>2 | an hour ago </div>
      </div>
      <label for="nbtytnm" class="commentText"><p>The green looks fine to me, im guessing the red path is active? How does it look, when the green one is active?</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nbu2igt" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>No_Log_7440</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="nbu2igt" class="commentText"><p>Cranky old man here…this wasn’t an issue for me 10 years ago, but it’s becoming increasingly difficult as my eyesight (which has always been pretty good) naturally degrades.</p>

<p>It doesn’t break immersion to create a good highly visible UI…in fact, it keeps me playing in game more than wasting time in menus/skill trees.  Hell - give me an option or toggle if they are worried about it.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nbu3imf" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>respectbroccoli</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="nbu3imf" class="commentText"><p>Definitely needs that! and I wish you could toggle the weapon/skills and it would display a small version of them. And when you search for a hide it should zoom you to it if you hit enter twice.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nbu8wdx" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>MakeDiabloGreatAgain</div>
        <div>1 | 19 minutes ago </div>
      </div>
      <label for="nbu8wdx" class="commentText"><p>I&rsquo;m colorblind too :(</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
