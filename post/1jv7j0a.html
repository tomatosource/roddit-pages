

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/pwj223ojntte1.png"><p>KP and JT hit some huge shots at MSG, sending us to our franchise-record 33rd road win of the season.</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/pwj223ojntte1.png" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="mm7yuwc" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>SquimJim</div>
        <div>12 | 6 hours ago </div>
      </div>
      <label for="mm7yuwc" class="commentText"><p>We&rsquo;ve, at the very least, tied the 4th best road record in NBA history and can tie best record tonight</p>

<p>Imagine doing that in a year where you weren&rsquo;t playing your best bball and were dealing with injuries</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="mm8310w" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>TheJaylenBrownNote</div>
        <div>3 | 6 hours ago </div>
      </div>
      <label for="mm8310w" class="commentText"><p>We still have the net rating of a <sup>65</sup>&frasl;<sub>66</sub> win team, we’ve just gotten kind of unlucky with injuries/close games.</p>
</label>
    </div>
  </label>
  
</div>

    
      
<div class="commentAndChildren">
  <input id="mm8jfxw" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Nepiton</div>
        <div>3 | 4 hours ago </div>
      </div>
      <label for="mm8jfxw" class="commentText"><p>I think it’s more fair to say we weren’t playing our best <em>because</em> of injuries.</p>

<p>But we’ve been the best team in the NBA since March and hopefully JB is able to be the best version of himself come the postseason. Will be tough to repeat with him hobbled playing limited minutes</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="mm93jlt" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>TOMA_TAN | Open for the Stock Exchange</div>
        <div>1 | 3 hours ago </div>
      </div>
      <label for="mm93jlt" class="commentText"><p>Not solely because of injuries. Like Dwhite had that 1 month funk that wasnt because of an injury. But obviously, injury is a large factor in our lack of consistency this season</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

    
  </div>
  
</div>

        
      
    </div>
  </body>
</html>
