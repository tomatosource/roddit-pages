<div class="commentAndChildren">

      <div class="commentHeader">

      <label for="oyev2a4" class="commentText"><p>If u ever change build away from hollow form, i would do below:</p>

<p>Greater haste essence to get t2 attack speed.</p>

<p>Desecrate prefix, and fracture hope u hit t1 flat phys (cheapest method for ssf).</p>

<p>Then reveal desecrate, if junk (very likely) use perfect battle essence with sinistral crystallisation to remove desecrate mod for +attack skills. Suffix complete.</p>

<p>Prefix slam and whittle until u get t2+ phys%, t1 hybrid phys or flat fire/lightning dmg.</p>

<p>Desecrate for phys% if u didnt get it from previous step or the others if hit the phys%.</p>

<p>Craft will be very different if u hit crit or attack speed.</p>

<p>/edit: forgot to mention u need astrids creation augment for +1craft modifier, but can be after suffixes are done.</p>

    <div class="comment">
      <div class="commentHeader">
        <div>maxspeed301</div>
        <div>2 | 3 hours ago </div>
      </div>
      <label for="oyfi8aw" class="commentText"><p>The big problem is the flat phys is bait. %phys is by far the lowest weighting so it would realistically be impossible to roll in SSF and too expensive even in trade. Next to that a full phys staff is actually worse for hollow form whirling assault because of rakiatas since whirling assault has no inherent conversion.</p>

<p>Realistically you would perfect regal hoping to hit a GG prefix, desecrate prefix and fracture hoping to hit crit chance.</p>

<p>If you hit crit chance and have a gg prefix you perfect exalt greater exaltation 2 suffixes and use perfect essence of battle hoping to replace a bad one then just fish desecrations for the last prefix.</p>

<p>If you hit the crit chance and don’t have another GG prefix you should go for ele prefixes. Chaos until T1 flat or WED, perfect exalt hoping for another T2+ flat then desecrate prefix for the last. Perfect exalt + greater exaltation for suffixes and finish with perfect essence of battle.</p>

<p>The latter is how I crafted my quarterstaff in SSF and has a way higher chance of working since there are 4 ele prefixes that all have reasonably high weighting.</p>
</label>

      </div>
      <label for="oyfj60b" class="commentText"><p>What do you mean by no inherent conversion? Is my understanding correct that the skill doesnt have any convert damage into element, or is it that gain damage as mods dont work on it?</p>
</label>
    </div>

  <input id="oyfjyl0" type="checkbox" checked/>

        <div>1 | 3 hours ago </div>
      </div>
      <label for="oyfjyl0" class="commentText"><p>Inherent conversion is the conversion inherent to the skill gem itself. E.g. the falling thunder skill converts 60% of phys to lightning.</p>

<p>Because of this rakiatas is good because most of your damage is already elemental and increasing your weapon phys increases the lightning damage of the skill</p>

<p>Whirling assault does not have this so adding flat ele is a must because rakiatas is just that powerful that a 3xT1 phys weapon still loses out</p>
</label>
    </div>
