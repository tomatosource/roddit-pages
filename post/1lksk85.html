

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>

      <label for="mzv0riq" class="commentText"><blockquote>
<p>don’t let his Real Madrid stats fool you</p>
</blockquote>

<p>The only stat that matters is minutes played (earned). RM - like the Celtics - are ‘contenders’ and don’t have the (playing) time to develop guys while trying to win.</p>

<p>That said, Gonzalez earned 10 mpg for a contender. His effort is obviously impressive.</p>

<p>Scouting reports emphasize that to develop, Gonzalez needs lots of playing time. He cannot shoot - mechanically it’s a problem, but the bigger issue is reportedly confidence. Gonzalez is streaky and when he misses, he keeps on missing. “This kid cannot come off the bench cold and be expected to hit a three. And if he doesn’t make the shot, his confidence crashes and it affects the rest of his minutes.” VERY COMMON YOUNG PLAYER ISSUE! Can be “fixed”.</p>

<p>Give him an entire season in Maine, playing 30+ mpg and working on his shooting/confidence. Paul Pressey’s main job is to keep Hugo’s confidence up and to keep feeding him opportunities to improve.</p>

<p>Hugo is NOT helping the Celtics in 2026. He could be a very useful piece in the future but he’s worse than useless if he sits on the bench and plays less than 10 mpg.</p>

<p>He need to play to develop. He cannot play and develop in Boston. It’ll be done in Maine.</p>

<p>But WOW, do I like the defensive upside. Hugo has the tools to be an excellent defender and glue guy if he can make 33% of his 3s.</p>
