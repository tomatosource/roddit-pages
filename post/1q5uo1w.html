

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/uhweoih1lsbg1.jpeg"><p>Dose total energy shield on item matter the most?</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/uhweoih1lsbg1.jpeg" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="ny2rlfl" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Important_Ad_3204</div>
        <div>1 | 34 minutes ago </div>
      </div>
      <label for="ny2rlfl" class="commentText"><p>This is the actual value that will increase your energy shield , if you have modifier with 300% but base item has 100ES , another item with 300 Es and no %bonus will do the same.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="ny2ryzz" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>allersoothe</div>
        <div>1 | 32 minutes ago </div>
      </div>
      <label for="ny2ryzz" class="commentText"><p>The number you have circled is after all of the bonuses from mods is applied.</p>

<p>A normal quality item will still have that number but it is the base ES. As you add ES mods you&rsquo;ll see it increase.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="ny2rxzb" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>falko1987</div>
        <div>1 | 32 minutes ago </div>
      </div>
      <label for="ny2rxzb" class="commentText"><p>Base stat for normal item and all the %and maximum shield add up to total up top.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="ny2sb9v" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>HiItsMeGuy</div>
        <div>1 | 31 minutes ago </div>
      </div>
      <label for="ny2sb9v" class="commentText"><p>The modifiers are already applied to the base ES of the item for the number at the top. Normally the Jungle Tiara has 78 ES. 78 + 43 (from first modifier) = 121. 121 x 1.75 (Second modifier) = 211.75 which gets rounded up to 212.</p>

<p>There are modifiers which increase Total Maximum ES, found on things like medallions or in the talent tree. Note that these are all additive, so having +100% total on a medallion and +100% total in talents ends up multiplying your ES by 3 (100% [base value] + 100% [medallion] + 100% [talents] = 300%). </p>

<p>Some modifiers are &ldquo;local&rdquo; like in the first case and others are &ldquo;global&rdquo; like in the second. Sometimes you can tell by the wording of the modifier (as in the case of +% increased maximum energy shield) but in a lot of cases its more ambiguous (a medallion with +% increased evasion is also a global increase to evasion but the wording is the exact same as the local modifier on armour). Usually if an item gives a certain stat as a base then if a modifier increases that stat it will be local.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="ny2vcga" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>RuMuxD</div>
        <div>1 | 17 minutes ago </div>
      </div>
      <label for="ny2vcga" class="commentText"><p>So those stats only buff item itself and have no effect outside of it like buffing other peace of equipment you wear with energy shield stat</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="ny2vrg2" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>HiItsMeGuy</div>
        <div>1 | 15 minutes ago </div>
      </div>
      <label for="ny2vrg2" class="commentText"><p>In the example you posted yep. Only the base ES on the item itself gets those buffs.</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

    
  </div>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="ny2vhrb" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>wanderingagainst</div>
        <div>1 | 16 minutes ago </div>
      </div>
      <label for="ny2vhrb" class="commentText"><p>Those two ES mods are local modifiers.</p>

<p>The base item has an ES value. The + to maximum energy shield adds to that value. The % increased energy shield is a local mod that only affects the energy shield on this item. So that amount is multiplied and added to the final result which is what you have circled.</p>

<p>The global mod (affecting all your energy shield) is % increased maximum energy shield. This is found on the skill tree, uniques, and jewels.</p>

<p>For purposes of increasing your total energy shield, the number you circled is what matters for rare items.</p>

<p>For crafting or evaluating an items potential, then you&rsquo;ll want to understand these distinctions.</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
