

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/i434oqn6fqig1.jpeg"><p>what to do next?</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/i434oqn6fqig1.jpeg" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="o4opwl2" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>RobertoVerge</div>
        <div>2 | 9 hours ago </div>
      </div>
      <label for="o4opwl2" class="commentText"><p>Crit is just vital for end game scaling</p>

<p>Imo always start with crit fracture, spam for IPD, then decide on cheap vs expensive suffixes</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="o4ookog" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>lols1295</div>
        <div>1 | 9 hours ago </div>
      </div>
      <label for="o4ookog" class="commentText"><p>I would Take crit over 2 arrows, If you want the Budget Version your plan is Solid otherwise.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="o4ox5tb" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>infrequents</div>
        <div>1 | 9 hours ago </div>
      </div>
      <label for="o4ox5tb" class="commentText"><p>If you want giga bow, you’re just gonna have to perf exalt slam and whittle (fishing for t1/2 crit or +<sup>5</sup>&frasl;<sub>4</sub> projectile). I agree with the other commenters, you kinda need crit (if trying to scale for endgame).</p>

<p>Starting with crit fracture and chaos rolling for phys is overall better, but I do think it’s fine where you’re at (it just may exceed your budget if going for crit)</p>

<p>If you get crit in whittles, prefix exalt and battle essence + prefix omen, desecrate for flat phys.</p>

<p>If you get +5, perf exalt slam and start whittling again for phys/crit, desecrate for the other</p>

<p>If you whittle into flat phys, you can try finishing it off with battle essence and desecrate for crit, but you’ll risk a mod when using the battle essence.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="o4p216a" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>lebenitoo</div>
        <div>1 | 8 hours ago </div>
      </div>
      <label for="o4p216a" class="commentText"><p>ok so crit &amp;gt; surpassing. then im going to spam chaos again for crit and start from there</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="o4p977s" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Eaklony</div>
        <div>1 | 8 hours ago </div>
      </div>
      <label for="o4p977s" class="commentText"><p>Crit is lowest level so if you are rich whittling for crit last is the way. If you are poor start with crit and use haste and battle essence for suffix then desecrate for phys</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

        
      
    </div>
  </body>
</html>
