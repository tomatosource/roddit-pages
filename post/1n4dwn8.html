

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/m6e92qunb8mf1.png"><p>Noob question, what is the point of these icons if I can&rsquo;t even hoverover the mouse to know what they do?</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/m6e92qunb8mf1.png" />

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="nbkd4az" type="checkbox" checked/>
    <div class="comment">

        <div>8 | 4 hours ago </div>
      </div>
      <label for="nbkd4az" class="commentText"><p>the longer you play the more you’ll intuit it. displays the current resistances, so this one’s weak to lightning, not bad on cold, and is both armoured and evasive. these change in real-time with resistance debuffs/armour breaks/daze etc</p>
</label>

</label>

  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">

        <div>5 | 4 hours ago </div>
      </div>
      <label for="nbkf6t1" class="commentText"><p>there’s probably a place but i’m also fairly new and just figured it out cus i was using armour breaker and i saw the yellow chest piece icon go to red. generally yellow means very high resistance, white means some but not much, and red means extra vulnerability. i think the icons themselves only have cold, lightning, fire, chaos, armour, and evasion, and most of those are somewhat straightforward, but chaos is symbolized as a swirl, and that took me some time to figure out.</p>
</label>

  </label>
  
</div>

        <div>1 | 4 hours ago </div>
      </div>
      <label for="nbkh25c" class="commentText"><p>guess and testing are two different things. i noticed the armour token. i noticed it break when i broke their armour. i noticed my lightning did nothing and my ice did more. this game is for scientists, not gamblers.</p>

</div>

</div>
