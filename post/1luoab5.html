

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/9qxx653nhnbf1.png"><p>Is 25% Damage vs Fully Broken Armour on Ruby Jewels a Sleeper Stat? +150% from Tabula Tech?</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/9qxx653nhnbf1.png" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="n1zbmdt" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>DrDongSquarePants</div>
        <div>1 | 15 minutes ago </div>
      </div>
      <label for="n1zbmdt" class="commentText"><p>The keyword here is <em>increased</em>. Not <em>more</em> or <em>takes increased</em></p>

<p>Increased is not a multiplier</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="n1zczwu" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Turbulent-House-8713</div>
        <div>1 | 7 minutes ago </div>
      </div>
      <label for="n1zczwu" class="commentText"><blockquote>
<p>Increased is not a multiplier</p>
</blockquote>

<p>Increased is obviously a multiplier?</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="n1zdc1h" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>UsagiRed</div>
        <div>1 | 6 minutes ago </div>
      </div>
      <label for="n1zdc1h" class="commentText"><p>nah in PoE rules increased is additive and &ldquo;more&rdquo; is the multiplier.</p>
</label>
    </div>
  </label>
  
</div>

    
      
<div class="commentAndChildren">
  <input id="n1zdmri" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Beneficial_Matter251</div>
        <div>1 | 4 minutes ago </div>
      </div>
      <label for="n1zdmri" class="commentText"><p>He means it&rsquo;s an additive multiplier, not multiplicative.</p>

<p>All sources of increased are added together first and then applied to base damage.</p>

<p>More/less damage is multiplicative with all damage sources</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

    
      
<div class="commentAndChildren">
  <input id="n1zdkck" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Own_Helicopter1956</div>
        <div>1 | 4 minutes ago </div>
      </div>
      <label for="n1zdkck" class="commentText"><p>Got it, thanks for the clarification. So the 25% increased damage is additive with other “increased” sources like passive tree nodes, gear mods, and tower buffs — not multiplicative like “more” damage. Still solid stacking potential, especially with 6 Ruby Jewels in Tabula. Appreciate the feedback</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

        
      
    </div>
  </body>
</html>
