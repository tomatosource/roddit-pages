      <label for="ngtuirw" class="commentText"><p>From Chris Forsberg:</p>

<p>Eighteen shamrocks.</p>

<p>That’s how we’ll always remember Al Horford’s time in Boston. Nine years ago, that was how he declared his intention to join the Celtics on social media. It was both a celebration and a promise. For the first real time in team history, a big-time free agent was choosing to come to Boston and, with him came true hope of raising the franchise’s next banner.</p>

<p>It took almost another decade &ndash; and two different stints in green &ndash; but Horford delivered on that promise. He nurtured a young team, twice delivered them to the championship stage, and finally secured that elusive Banner 18 in 2024. He helped restored Celtics Pride while ensuring the team was a title threat in nearly every season he wore green.</p>
