    </h2>

      <label for="lvlblov" class="commentText"><p>From <a href="http://Globe.com" target="_blank">Globe.com</a></p>

<p>By Gary Washburn</p>

<p>ATLANTA — As he walked back to the Celtics bench less than five minutes into <a href="https://www.bostonglobe.com/2024/11/04/sports/celtics-hawks-jayson-tatum/?p1=Article_Inline_Text_Link" target="_blank">Monday’s game against the Hawks</a>, Neemias Queta was stopped by coach Joe Mazzulla, who had some forceful words for his young center despite his having already scored two buckets with a rebound.</p>

<p>On the previous play, Jrue Holiday had grabbed a rebound of a Trae Young miss and found that Queta hadn’t gotten back down the floor on defense, so he tossed a lead pass that would have resulted in an easy dunk if Queta gathered the ball.</p>

<p>He didn’t. The ball sailed out of bounds, and Mazzulla had a message for Queta about his energy: If he wants to continue to play productive minutes, to carve out a valuable role in the Celtics’ frontcourt, he has to hustle, play with constant passion and vigor. That wasn’t present early in Atlanta, and Mazzulla made sure Queta knew about it.</p>

<p>For Mazzulla, it was more complex than just chewing out a player for lack of hustle. It was a teaching moment. The first step to elevating Queta into being a difference-making player, perhaps the Celtics’ center of the future, is to get him to realize he’s capable of it.</p>

<p>“He’s just grown a lot as a player but also he doesn’t know how good he can be,” Mazzulla said. “He’s got a great ceiling, so the standards are very high, and I thought he did some great things for us tonight.</p>

<p>“But when you’re as good as he can be, we’ve all got to hold him to that standard every single night. So it’s a credit to him for allowing us to coach him.</p>

<p>“It’s a credit to [his teammates] for supporting him. But you see what he’s capable of when he’s at his best, so he can be a real asset for us. He works really hard. He cares. He wants to be coached. He’s starting to realize how good he can be, and he’s working at it.”</p>

<p>Queta was a second-round pick by Sacramento in 2021 out of Utah State and spent two years in the Kings’ system, mostly in the G-League. Sacramento waived him in September 2023 to make room to sign aging center JaVale McGee, and the Celtics signed the big man to a two-way contract five days later.</p>

<p>He has worked his way up the Celtics ladder, earning spot minutes last season, then having his contract converted to a standard NBA deal, making him playoff-eligible.</p>

<p>This season, his role has expanded, especially with the absence of Kristaps Porzingis, so much so that Mazzulla decided to give Queta his first NBA start Monday. He finished with 10 points, 7 rebounds, 1 steal, and 1 block in 23 minutes — and also got an important lesson about remaining engaged.</p>

<p>Queta is a laidback dude, a whisper-quiet talker, but he can’t lack passion on the floor. He has to play with a certain vigor and nastiness.</p>

<p>“He was just trying to hold me accountable,” Queta said. “I felt like I was always a step behind in the first few plays. I don’t know. You listen to what they have to say and you try to do better the next play.</p>

<p>“Maybe it was the nerves for the first start. You can never really know, but I just tried to fix it with being used to being in that position.”</p>

<p>The Celtics are hoping Queta develops for the long-term, because he is an inexpensive center option who won’t demand significant money for another two years. The Celtics are in the second apron because they rewarded their core with long-term contracts. They desperately need to cultivate cheaper talent from within.</p>

<p>Queta is one of their projects. It’s unclear why other clubs didn’t sign Queta when he was out of work for a few day, because he has an intriguing physicality and skill set. At 7 feet, 245 pounds, he can soar above the rim for alley-oops and rebounds, and he has shot-blocking ability.</p>
