

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/5sr2w38pabze1.png"><p>do i save this till i get a T15</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/5sr2w38pabze1.png" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">

    <div class="comment">
      <div class="commentHeader">

<div class="commentAndChildren">

        <div>2 | 2 hours ago </div>
      </div>
      <label for="mr11mio" class="commentText"><p>I mean, at a point when you have bunch of T15s you&rsquo;ll also have bunch of tablets, so you can easily populate your atlas with nodes like this at any point. Even before T15 I had a lot of tablets that I didn&rsquo;t know what to do with.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="mr11p21" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>ArmOk4720</div>
        <div>1 | 2 hours ago </div>
      </div>
      <label for="mr11p21" class="commentText"><p>Well you want to do the maps that say +1 level with t16 map</p>
</label>
    </div>
  </label>

<div class="commentAndChildren">
  <input id="mr15k19" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Saalipei</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="mr15k19" class="commentText"><p>You shouldn&rsquo;t really have to worry about saving map like that. But I think you have the right idea:<br>
Some maps have &ldquo;+1 monster level&rdquo; (corrupted or cleansed maps only), and for those you want to also have irratiated which gives +1 level also and then you want to use T16 map for that (T16 maps you only get if you corrupt T15 maps, and it has like maybe ~10% success rate or something).</p>

<p>So don&rsquo;t worry about maps like your screenshot, you can do it whenever, but +1 monster level maps are rare and those you want to save only for T16 maps and don&rsquo;t forget the irradiation and possibly other juicing also if you have towers nearby.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="mr17ly2" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Rubsy</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="mr17ly2" class="commentText"><p>Dont worry about these things, the map is infinite and there is no shortage of spots like these as you progress and get more stuff. Imo this is just too much micromanagement on top of a already complex game.
What I recommend you do is just focus of rolling ok packsize maps and separating the unrunnable ones (like temp chains). Do fun efficiently by eliminating tedious micromanagement + unfun map mods.</p>
</label>
    </div>
  </label>
  
</div>

  </body>
</html>
