

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/6d66jirwj2ze1.png"><p>Is a quad res belt good?</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/6d66jirwj2ze1.png" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="mqtfrng" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Nihilistic__Optimist</div>
        <div>2 | an hour ago </div>
      </div>
      <label for="mqtfrng" class="commentText"><p>I&rsquo;d be happy with a belt with four resists. One charm slot is kind of a bummer though ..is there any way to increase that?</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="mqtfw8r" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Free_Dome_Lover</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="mqtfw8r" class="commentText"><p>I don&rsquo;t think so, but definitely not now that it&rsquo;s corrupted</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="mqtjc54" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Various_Swimming5745</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="mqtjc54" class="commentText"><p>If by stats you mean stuff like attributes they are suffixes which is where your resistance lines are.</p>

<p>It&rsquo;s a good mid game belt! The rolls aren&rsquo;t very high but it&rsquo;s fine to use. Probably wouldn&rsquo;t be able to sell for much.</p>

<p>ETA: Realistically, you could keep using it until you upgrade to ingenuity. I doubt you&rsquo;ll find much better. It&rsquo;s pretty nice with the life too, just depends on how many uniques you&rsquo;re using and where you can get away with no resistance! It might not be worth running the belt if you already have lots of res everywhere else. But I&rsquo;d use it as an opportunity to take an extra line or two that isn&rsquo;t res on your jewelry or gloves.</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
