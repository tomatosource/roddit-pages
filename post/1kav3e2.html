

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/n2v4c1pygtxe1.png"><p>Is this abnormally high for rarity?</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/n2v4c1pygtxe1.png" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="mppbims" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>bukem89</div>
        <div>1 | 5 minutes ago </div>
      </div>
      <label for="mppbims" class="commentText"><p>It comes with -56% quant, it&rsquo;s nowhere near as good as you think</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="mppbl3q" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>soumisseau</div>
        <div>1 | 5 minutes ago </div>
      </div>
      <label for="mppbl3q" class="commentText"><p>Still gonna get 2 exalt and nothing more sadly</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="mppc68h" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Pretend_Equivalent22</div>
        <div>1 | a minute ago </div>
      </div>
      <label for="mppc68h" class="commentText"><p>Its cleansed so yes thats actually kinda common, but the reduced quant makes it meh, ya might get like 1-2 “big” drops but mostly just regal shard and a few exalts</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="mppc893" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Skabonious</div>
        <div>1 | a minute ago </div>
      </div>
      <label for="mppc893" class="commentText"><p>Paired with reduced quantity it doesn&rsquo;t seem too high. I&rsquo;m not sure what&rsquo;s causing that reduction since I am sure tablets don&rsquo;t give that, but maybe I&rsquo;m wrong?</p>

<p>Honestly while people talk about super juiced maps being the best returns (I don&rsquo;t disagree necessarily) the map <em>events</em> are what really pay out in a noticeable manner (e.g. breach, expedition, delirium mirror, rituals)</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="mppcarx" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Titsona-Bullmoose</div>
        <div>1 | a few seconds ago </div>
      </div>
      <label for="mppcarx" class="commentText"><p>Just ran a map with similar stats, on top of my 130% player rarity and I got a few exalts and regals, it was a complete let down. I figured with that high of rarity nothing less than chaos orbs should be dropping but nope not even close.</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
