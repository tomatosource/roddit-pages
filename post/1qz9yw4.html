

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/uc9omy3v3aig1.png"><p>Temple expert. Can i modify this to run atziri?</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/uc9omy3v3aig1.png" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="o4aihoq" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Skaitavia</div>
        <div>2 | 3 hours ago </div>
      </div>
      <label for="o4aihoq" class="commentText"><p>In theory, you can. This is what your finished temple would look like if you wanted to farm atziri along with it, as long as you have 2 locks to maintain both of your chains:</p>

<p><a href="https://sulozor.github.io/#/atziri-temple?t=ADAiSCIwIkgiMCIiMCJIAJgAIkhIAAAiMAAASCIiAIgAIkgiIjAwKBEpESkxMCIicGpweRJpIkhIaQAAOTFxSCIiMQAIYHqAIjFpcGkIAHBpMQ" target="_blank">https://sulozor.github.io/#/atziri-temple?t=ADAiSCIwIkgiMCIiMCJIAJgAIkhIAAAiMAAASCIiAIgAIkgiIjAwKBEpESkxMCIicGpweRJpIkhIaQAAOTFxSCIiMQAIYHqAIjFpcGkIAHBpMQ</a></p>

<p>Refer this <a href="https://www.reddit.com/r/pathofexile2builds/comments/1qq0rtf/controllerfriendly_coccoea_bloodmage_showcase_on/o2ghbwv/" target="_blank">this comment I made</a> in regards to how the Architect moves when it comes to prioritization.</p>

<p>Essentially when you beat Architect and place the RAC where I put the reward room, he will stay in the same place because there are no other squares in his spawnable area that fit under the &ldquo;adjacent to only 1 room&rdquo; category.</p>

<p>When you beat Atziri, her RAC will destabilize, so if you beat the Architect in the same run as beating her, there is a <sup>50</sup>&frasl;<sub>50</sub> chance your Architect will move to where you put the RAC. If that happens, then you would simply put the RAC where he was.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">

        <div>1 | 3 minutes ago </div>
      </div>
      <label for="o4b9qwg" class="commentText"><p>Amazing explanation thanks so much. So I just need 2 more rooms then he will ping pong between those 2 locations</p>

  </label>
  
</div>

    
  </div>
  
</div>

  </body>
</html>
