      <label for="o6gry6h" class="commentText"><p>From Chris Forsberg:</p>

<p>Jaylen Brown continues to compile evidence for his case as the best two-way player in the NBA.</p>

<p>Brown generated season highs in rebounds (15) and assists (13) to go along with 23 points Thursday night as the Celtics built a big early cushion then skidded to the finish line of a 121-110 triumph over the Golden State Warriors.</p>

<p>Brown’s points + rebounds + assists (PRA) total of 51 was tied for his third-highest output of the season. He’s now averaging 41 PRA for the 2025-26 season, the seventh-highest mark in the NBA.</p>

<p>With the Celtics facing off against two core members of the 2024 title team in Kristaps Porzingis and Al Horford, Brown showcased why the Celtics sit 17 games above .500 despite last offseason&rsquo;s roster overhaul. Brown set an unselfish tone early as the Celtics blitzed the Warriors for 74 first-half points.</p>

<p>Brown generated a season-high 33 assist points, with more than half of his helpers leading to 3-pointers for teammates. No one benefited from Brown’s passing more than Payton Pritchard, who turned 12 passes from Brown into 11 points on 4-of-7 shooting.</p>

<p>With Jayson Tatum rehabbing from Achilles surgery to start the 2025-26 season, it was obvious that Brown’s PRA was going to climb this year. But he has firmly positioned himself among the MVP frontrunners with his spike in PRA output this season.</p>

<p>Brown posted his third triple-double of the season. No one is expecting him to be Nikola Jokic on a nightly basis, but combine his PRA output with his willingness to routinely defend the best offensive player on the opposing team, and it further accentuates Brown’s case to be regarded as the best two-way player in the league. </p>

<p><a href="https://www.nbcsportsboston.com/nba/boston-celtics/jaylen-brown-stats-impact-warriors/771631/" target="_blank">Read more here</a>.</p>
