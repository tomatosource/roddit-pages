      <label for="o23m9ma" class="commentText"><p>You need more ES. Get a good Vile Robe. Use the recombinator for flat and % ES then desecrate prefix. Fill out suffixes and slap a Perfect Essence of Seeking for crit mitigation. If another shitty suffix exists, you can try to Whittle or use Perfect Essence of Ruin to gamble-replace it. ES Robes are really easy to make so don&rsquo;t overspend here. You can use recomb for helm too.</p>

<p>That amulet isn&rsquo;t worth using more currency on as it&rsquo;s only +2 and it&rsquo;s also low ilvl. Gamble for amulets. +3 Spell skills is fairly common. If the resulting amulet has too much garbage on it, you can &ldquo;scour&rdquo; it by recombinating with a common affix like T8 resistances or something. You pick a common affix so the recomb chance is higher. Keep Lapis/Jade/Amber amulets because one of each reforges into Pearlescent Amulets which is really good for SSF.</p>

<p>Important note: Recombinating almost always picks the base with the rarer mod. So you can use T1 flat ES on a Vile Robe, then use T2 %ES on a shitty base, and it will basically always pick the Vile Robe as the base.</p>
</label>
