      <label for="n0whiqt" class="commentText"><p>Hey Guys xD</p>

<p><a href="https://poe2.ninja/profile/Zoia-0314/character/KallThornfernalist" target="_blank">https://poe2.ninja/profile/Zoia-0314/character/KallThornfernalist</a></p>

<p>Back again having fun with Arctic Armour. Build is still a work in progress but its performing better than I expected. Was surprised at how high I could scale its damage despite how much of a budget I am on. Spent about 6 div total.</p>

<p>Scaling Arctic Armour a few ways. The first obvious one being bloodmage and crit. Add on Rathpith Globe which does scale arctic armour which is pretty standard for blood mage builds. Big dps increase along side Archmage. Archmage does boost the damage on arctic armour so another easy way to scale our damage.</p>

<p>Since we aren&rsquo;t really using mana Zenith is great for scaling arctic armours damage. Also running elemental focus to avoid freezing but also amp the damage. Then cold penetration, execute, and cold mastery for the extra gem level. Gem level is pretty big for arctic armours damage so I am also running a +3 prism of belief for it.</p>

<p>Mapping we use trampletoe. Yeah I know, another trample toe build. I tried really REALLY hard to make ignite prolif work. I was trying way too hard to force three dragons haha. It worked to an extent but was too inconsistent and was about half the damage. So yeah trampletoe for aoe clear.</p>

<p>I use frost bomb for exposure but also for the rares and bosses that don&rsquo;t melee strike often. Again the build is still a work in progress but so far its pretty fun&hellip;for how silly it is lol.</p>
