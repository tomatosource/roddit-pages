    <h2>
      <a class="postTitle" href="https://www.pathofexile.com/forum/view-thread/3880953"><p>TIL +1 Limit applies to skills that DONT SAY LIMIT</p>
</a>
    </h2>

    

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="nqfgf6q" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Gareth274</div>
        <div>9 | 2 hours ago </div>
      </div>
      <label for="nqfgf6q" class="commentText"><p>What does this mean in practice?</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="nqfnz5u" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>SomethingNotOriginal</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="nqfnz5u" class="commentText"><p>PoE2 is often specific with its wording. e.g More =/= Increased =/= additional. Some skills that are listed as having &ldquo;Maximum&rdquo; and no reference to &ldquo;Limit&rdquo; would not be expected to interact with something that only references &ldquo;Limit&rdquo; using previously learned game logic.</p>

<p>Ideally, it would simply mean a localization update, rather than updating the coding. For example; Earthquake creates 2-4 Maximum Jagged Ground Patches - however, this would now be more consistent and understandable that to have a Limit 2-4 Jagged Ground Patches.</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nqfinoz" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>legato_gelato</div>
        <div>4 | an hour ago </div>
      </div>
      <label for="nqfinoz" class="commentText"><p>Seems rather intuitive enough though, and like they should just reword the Lotus text. Some of these skills are from 2019 and are probably just using outdated wording</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nqfiprq" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Squidgyxom</div>
        <div>2 | an hour ago </div>
      </div>
      <label for="nqfiprq" class="commentText"><p>From a post I made when trying Frozen Locus and Detonating Spear on Stormbringer, note that Frozen Locus is a &ldquo;limit&rdquo; under the hood, like the other post points out:</p>

<p>From checking the terminology between Limit and Maximum, seem like Maximum is for buffs and stages&hellip; and Frozen Locus, Earthquake, Earthshatter, Rain of Arrows (literally same functionality as Firestorm), Ice Shards, Lightning Rod, Spearfield.</p>

<p>Limit is used for Totems, Marks, Fissures, Payload Arrows/Spears (including lodged Rapid Assault spears), Temporary Minions, Offerings, Orbs, Firestorm, and Living Bomb.</p>

<p>Maybe Frozen Locus and the other outliers are remnants from a time before a distinction was made? Also it seems with Lightning Rod and Spearfield, it&rsquo;s just using maximum to say, &ldquo;Hey, +1 limit would do nothing to the already high limit, just call it a maximum so you don&rsquo;t even bother try to raise the number.&rdquo; Sidenote: upping the limit of Vine Arrow doesn&rsquo;t up the limit of vine arrow debuffs able to affect. Would be neat if it went all the way, and you could +limit other one-of debuffs like Essence Drain, but I could see that being a can of worms.</p>

<p>And then Shield Wall and Ember Fusillade are neither. &ldquo;Can have 2 Shield Walls active at a time.&rdquo; &ldquo;Can accumulate X embers.&rdquo;</p>

<p>Hoping for some distinct terminology use, to make things more intuitive.</p>
</label>
    </div>
  </label>
  
</div>
