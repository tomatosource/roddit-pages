      <label for="oe34pso" class="commentText"><p>Jaylen Brown recently sat down with NBC Sports Boston analyst and ex-Celtics champion Brian Scalabrine to watch film from his dominant 2025-26 season to date. Brown discussed the criticism around his left hand, his growth as a playmaker and much more.</p>

<p>&ldquo;I think I&rsquo;ve definitely been more patient,&rdquo; Brown told Scalabrine. &ldquo;I&rsquo;ve slowed down in certain areas where you still see me use my athleticism and explosion in certain areas, but then you&rsquo;ll notice I&rsquo;ll get real slow, almost like I&rsquo;m going at a casual pace. Because the slower you go, the easier it is to read everything. The faster you go, the harder those reads are.</p>

<p>&ldquo;If you slow down where you&rsquo;re going two miles per hour, you can see the stop signs, you can see the dog, you can see the mailman putting stuff in the mail. You see everything when you slow down. When you&rsquo;re going too fast, you&rsquo;re driving full speed, you&rsquo;re not seeing nothing. Everything is a blur.</p>

<p>&rdquo;&hellip; I know certain spots on the floor where, no matter who&rsquo;s guarding me, I have a good chance of getting a good shot up. So, I&rsquo;m just identifying those spaces, and then as the flow of our offense goes, I&rsquo;ve always got my eye on where those spaces are. &hellip; When I get there is when I try to slow down and focus on my footwork.&rdquo;</p>
