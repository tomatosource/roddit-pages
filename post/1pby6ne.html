

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/oypyfx3hpp4g1.png"><p>I wish we had other ways to spend infusions.</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/oypyfx3hpp4g1.png" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="nrtzyte" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>RedmundJBeard</div>
        <div>14 | 3 hours ago </div>
      </div>
      <label for="nrtzyte" class="commentText"><p>I feel like an old grandpa saying this, but I wish infusions were just deleted from the game. We already had charges which you gained and spend. I don&rsquo;t see why infusions add something to the game. Just another resource i guess. It feels more restrictive the more are added. Pick one charges or infusions, now pick the ascendancy that works for that, pick the few skills that give bonuses for them, bam builds done, just as the devs planned out.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="nru7cj3" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>cryptiiix</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="nru7cj3" class="commentText"><p>Actually, I like infusions. I just hate that I have to pick them up. If it was granted to me like a charge, then there would be so many ways to make it interesting.</p>
</label>
    </div>
  </label>
  
</div>

    
      
<div class="commentAndChildren">
  <input id="nru05zd" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>rockfroszz</div>
        <div>0 | 3 hours ago </div>
      </div>
      <label for="nru05zd" class="commentText"><p>I see them as a band-aid fix because there aren&rsquo;t enough spells in the game yet.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="nru5o1x" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Appropriate_Time_774</div>
        <div>2 | an hour ago </div>
      </div>
      <label for="nru5o1x" class="commentText"><p>a band-aid for what? further restricting skill synergy of our already limited selection was supposed to be a fix for something?</p>
</label>
    </div>
  </label>
  
</div>

    
      
<div class="commentAndChildren">
  <input id="nru8aa1" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>potatoshulk</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="nru8aa1" class="commentText"><p>How many more spells are we getting though? Druid will have a solid amount but that&rsquo;s the last big chunk. Templar and assassin might have a couple</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

    
  </div>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nru7rqa" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Wind_Best_1440</div>
        <div>2 | an hour ago </div>
      </div>
      <label for="nru7rqa" class="commentText"><p>Infusions can be fine, but having them be a resource you pick up off the ground is just annoying. Would be better if they just stayed on the character and you can store them to use and they didn&rsquo;t go away.</p>

<p>The system I really dislike is the glory system however, having a resource that spawns in such isolated times to use abilities and it vanishes if you don&rsquo;t use it right away is such a mood killer. Moves that use Glory I just consider dead moves.</p>

<p>I like friction in the game, but making moves literally unfun to use will just have no one use them.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nrud20v" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Ambitious-Call-7565</div>
        <div>1 | 28 minutes ago </div>
      </div>
      <label for="nrud20v" class="commentText"><p>Nah, infusions just ain&rsquo;t it, they need to scrap it and find something else that&rsquo;s interesting</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nruff5p" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Nolanbrolan</div>
        <div>1 | 8 minutes ago </div>
      </div>
      <label for="nruff5p" class="commentText"><p>All I can see is delirium fog</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
