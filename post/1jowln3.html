

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://www.reddit.com/r/PathOfExile2/comments/1jowln3/new_player_inquiry/"><p>New player inquiry</p>
</a>
    </h2>

    
    <div class="selfPostContainer">
      <p>After the update(down of the hunt) is released, will the game become free to play or will it remain a paid Early Access version?</p>

    </div>
    

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="mkuxl3k" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>beardgrinder</div>
        <div>6 | an hour ago </div>
      </div>
      <label for="mkuxl3k" class="commentText"><p>The game won&rsquo;t be free to play until it hits 1.0 and leaves early access.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="mkuxwy9" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>NotCoolFool</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="mkuxwy9" class="commentText"><p>Most likely at least a year yet before it’s free I’m afraid, this is only the first major update in early access of which there will likely be many.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="mkuy76h" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Euphoric_Blood_4865</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="mkuy76h" class="commentText"><p>yea when its not early access it will be free</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="mkuy8kz" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>oldglassofmilk</div>
        <div>2 | an hour ago </div>
      </div>
      <label for="mkuy8kz" class="commentText"><p>Nope, that will happen at full launch of 1.0</p>

<p>They said 1.0 could launch end of this year but its more likely to be early 2026 since they are already late with updates to poe2 and poe1</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
