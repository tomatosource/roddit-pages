

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/djitvqd45wvf1.jpeg"><p>From young dreamers to franchise cornerstones, I hope they both end their careers together in Boston. Their careers are both set but they are still one ring away from being legendary.</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/djitvqd45wvf1.jpeg" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="nk5qh0j" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Gandalf_from_3</div>
        <div>5 | 29 minutes ago </div>
      </div>
      <label for="nk5qh0j" class="commentText"><p>Tatum I could see being a lifer. He doesnt seem to care about his image and is a more sentimental person.</p>

<p>Brown i could see having a solid 3rd act on another team. Maybe back home in Atlanta, maybe a big market NY or CA team as a one final big contract before he&rsquo;s 35.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nk5pe9f" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>LarBrd33</div>
        <div>-6 | 35 minutes ago </div>
      </div>
      <label for="nk5pe9f" class="commentText"><p>As is they are basically the inverse of the KG Celtics.  That team was front loaded with a title and then had sustained success for another 4 seasons until the Knicks effectively ended them in 2013 sweep.  </p>

<p>This team had sustained success up front and finally won a title in 2024 until the Knicks effectively ended them in a historically humiliating way in 2025. </p>

<p>Tatum’s injury puts their entire future in doubt.  It’s hard to see any route where we reload this roster without tanking. Would love for them to change that narrative and get back on top again.  We are gonna need a miraculous Tatum recovery and some significant transaction wins from Brad despite a lack of tradeable assets and cap space. </p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
