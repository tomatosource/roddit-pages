

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/kms9ntekgvmf1.png"><p>When using an uncut skill gem, please add the supportable skills tooltip when hovering skill.</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/kms9ntekgvmf1.png" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="nc5xbqc" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Darkusoid</div>
        <div>2 | 6 hours ago </div>
      </div>
      <label for="nc5xbqc" class="commentText"><p>I may be wrong but you can see which gems can be supported with controller UI.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nc7e6mu" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>FrederickWillem</div>
        <div>1 | 22 minutes ago </div>
      </div>
      <label for="nc7e6mu" class="commentText"><p>I&rsquo;m confused. Do you mean when you use an uncut support gem you want to see whether it will work with one of your equipped gems? Because that&rsquo;s exactly what the window does when you right click the uncut gem. To the left you select a skill which you want to add a support gem to, the middle then shows you all options. Just make sure to uncheck &lsquo;show recommendations&rsquo; and you&rsquo;re good. Maybe I&rsquo;m misunderstanding though, so please let me know if that is the case.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nc5bhgm" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Thalant</div>
        <div>1 | 10 hours ago </div>
      </div>
      <label for="nc5bhgm" class="commentText"><p>That list would get out of hand really quick as we get more and more skills. I don&rsquo;t really understand what the problem is, support gems clearly state what kind of gems it can support (in the case of brutality, any skill that deals damage). The list you show doesn&rsquo;t even cover a third of the list of all the skills it can support lol how would it fit within the tooltip?</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="nc5l2cu" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Jay_Stranger</div>
        <div>9 | 8 hours ago </div>
      </div>
      <label for="nc5l2cu" class="commentText"><p>That’s because the list of skills is specifically the ones you own/have equipped. It is intended to help players get a better grasp on what skills can be supported by other skills. But the only time you see it is if you already cut the gem. This feature has been in the game since Poe 1, it’s nothing new…</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

        
      
    </div>
  </body>
</html>
