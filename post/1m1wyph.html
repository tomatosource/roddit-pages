    <h2>
      <a class="postTitle" href="/r/pathofexile/comments/1m1wyde/im_getting_the_idea_that_one_shotting_is_worse_in/"><p>I’m getting the idea that one shotting is worse in POE 1.</p>
</a>
    </h2>

    

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="n3kiz4d" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>WarpedNation</div>
        <div>4 | 18 hours ago </div>
      </div>
      <label for="n3kiz4d" class="commentText"><p>That&rsquo;s because it is.  They specifically designed poe2 to be slower more methodical gameplay, with less 1 shot mechanics(the main 1shot mechanic in poe2 feels like its just ondeath effects), with the majority of the deaths being just getting overwhelmed and dying from multiple hits.  The rares are less lethal as well as there arent as many things like map mods that you need to worry about.  There are also less secondary negative effects that you need to worry about in poe2 where as in poe1 you have things like monsters removing charges(which are power stats/defenses in poe1), flasks(a core part of defenses for the vast majority of builds), various parts of your offense/defense, damage overwhelms ontop of the mapmods being more lethal especially when combod with rare monster mods etc.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">

</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="n3kk6in" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>WarpedNation</div>
        <div>2 | 18 hours ago </div>
      </div>
      <label for="n3kk6in" class="commentText"><p>That, and the ability to scale map effect which also makes maps significantly rippier.</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

    
      
<div class="commentAndChildren">

    <div class="comment">

        <div>dimboostank</div>
        <div>1 | 17 hours ago </div>
      </div>
      <label for="n3kpwhf" class="commentText"><p>Yeah I think I’m learning that I’m more of a Poe 2 gamer because of these reasons. Seems like Poe 1 is more of a numbers game which is cool but I wanna get a little sweaty with the combat like Poe 2.</p>

    </div>

<div class="commentAndChildren">
  <input id="n3ktply" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>BIGDICKRUNESCAPER</div>
        <div>2 | 17 hours ago </div>
      </div>
      <label for="n3ktply" class="commentText"><p>the damage variance from monsters is far more severe in PoE1, but I think thats part of the charm with all other game mechanics in context.<br>
Personally, I like softcore in Poe1 more but enjoy HC gameplay in Poe2 more.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="n3lshnv" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Popeda</div>
        <div>2 | 12 hours ago </div>
      </div>
      <label for="n3lshnv" class="commentText"><p>It is way worse, people just don&rsquo;t complain about it because the consequences for dying are so insignificant. Although it&rsquo;s also much easier to build a much tankier character, though this can lead to a false sense of security. For example, you could basically take almost no damage for a couple of acts, and then suddenly get bursted down by a rare with some ridiculous mechanics. The difficulty curve and balance of enemy damage &amp; player defences are generally so much better in PoE 2 than 1, and it&rsquo;s one of the biggest reasons I prefer it.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="n3nhd6k" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Xeiom</div>
        <div>1 | 6 hours ago </div>
      </div>
      <label for="n3nhd6k" class="commentText"><p>Yes one shotting in PoE1 is extremely common.</p>

<p>PoE2 trends back toward PoE1 habits the later in the game but never reaches PoE1 levels so far.</p>

<p>Most of the mobs in PoE1 are sort of configured to assume you can one-shot them and have tons of movement speed so they have quite a bit of damage and movement speed in the hopes that they will hit you one time before they die.</p>

<p>It basically means every map has a hard defence stat check somewhere inside it. So the experience tends to be you either get oneshot / burst frequently or you usually pass the stat check reliably and don&rsquo;t even really feel like you can die until you scale it up.</p>
</label>

  </label>
