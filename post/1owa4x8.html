      <label for="nook5hl" class="commentText"><p>From Chris Forsberg:</p>

<p>With this three-day break, we’re taking a step back and offering 13 thoughts and 13 notable stats from the 13 roster players who have touched the floor for Boston so far this season through 13 games. </p>

<p>In Part 1 of our three-part series, we&rsquo;ll focus on the Celtics&rsquo; core four starters. Next up Friday will be the team&rsquo;s key reserves.</p>

<p><strong>Derrick White</strong></p>

<p><em>One number: 29.2</em></p>

<p>That’s White’s 3-point percentage this season, down 9.2 percent from last season and 10.4 percent from Boston’s title campaign. His shot-making woes extend to other portions of the court &ndash; including at the rim (down 14 percent from last season) and in the short midrange (down 24 percent from last season).</p>

<p><em>One thought</em></p>

<p>Would it be oversimplifying things to suggest that much of Boston’s woes can be traced solely to White’s shot-making? It probably would.</p>

<p>White has still been elite at generating &ldquo;Stocks&rdquo; (steals plus blocks) and ranks eighth in the NBA with 2.85 Stocks per game. His assist percentage is up and his turnover percentage is way down. The Celtics still have a solid +4.2 net rating in his team-high 422 minutes of floor time.</p>

<p>Still, we can’t help but wonder if White making 3s more consistently would mask some of the team’s missteps. We don’t suspect those shooting woes will persist, and White should eventually thrive, even with additional attention this season.</p>
