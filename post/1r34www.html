

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/aetqcx6fl4jg1.jpeg"><p>Crafting help pls.</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/aetqcx6fl4jg1.jpeg" />

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="o51qukq" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>ReflexLuthor</div>
        <div>1 | 3 hours ago </div>
      </div>
      <label for="o51qukq" class="commentText"><p>The problem is that mana was a prefix and to intelligence is a suffix&hellip; I am lost</p>

<p><a href="https://preview.redd.it/t6gh9ek2n4jg1.jpeg?width=3072&amp;format=pjpg&amp;auto=webp&amp;s=afd9ed5d8fe58956d7196b7b1301770cb0ab4d11" target="_blank">https://preview.redd.it/t6gh9ek2n4jg1.jpeg?width=3072&amp;format=pjpg&amp;auto=webp&amp;s=afd9ed5d8fe58956d7196b7b1301770cb0ab4d11</a></p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="o51qw4m" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Adghar</div>
        <div>1 | 3 hours ago </div>
      </div>
      <label for="o51qw4m" class="commentText"><p>You can save a whittle by using Omen of Dextral Crystallisation + Essence of the Abyss to force remove the intelligence. You follow up with a jawbone and then probably Light it (Alternatively, if you hit a junk suffix, you can repeat this step until you desecrate something good, for cost savings now)</p>

<p>EDIT: currently, Omen of Light is also <sup>1</sup>&frasl;<sub>4</sub> the price of a whittle (i guess Ritual farmers went on vacation), which means you can also save a whittle on junk prefix simply by using Omen of Light. I believe you would follow up with a prefix perfect exalt, but then if that also misses, you&rsquo;ll be back to whittles (assuming you want 6xT1 or close)</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="o51slnu" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>ReflexLuthor</div>
        <div>1 | 3 hours ago </div>
      </div>
      <label for="o51slnu" class="commentText"><p>Ok, so I should be doing this step untill I get prefix that is a lower tier than 80, right? Those can be mana (lvl 70) and spell damage &amp; mana hibrid (lvl 79). Am I getting this right?</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="o51usab" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Adghar</div>
        <div>2 | 3 hours ago </div>
      </div>
      <label for="o51usab" class="commentText"><p>I&rsquo;m actually not a pro on crafting, but with current currency prices and assuming you want 6xt1 or close, and added cold instead of intelligence, then no, that mana and spell damage hybrid is not useful here (it was likely to block some prefix weights, but you&rsquo;re already on your last prefix). If I were in your shoes, I would use Omen of Light to 3 mods (spell damage, extra lightning, frac spell levels) and perfect prefix exalt to try straight for the T1 extra. Then on a miss, whittle. If the result of the whittle is a suffix, then you can repeat the cost saving step I wrote above. If it&rsquo;s a prefix, it will just eat more whittles.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">

</label>

  </label>
  
</div>

</div>
