.comment {

.commentText,
.commentText * {

  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

      <label for="n982dib" class="commentText"><p>It&rsquo;s unfortunately pure gambling.  There are some nuances depending on what you&rsquo;re going for that help to slightly shift the odds in your favor but the basic steps are generally all the same:</p>

<p>- fracture a high or max roll of the mod that&rsquo;s most at risk (lowest ilvl);</p>

<p>- chaos spam for 2nd mod;</p>

<p>- then depending on the type of craft, you either go straight to using the expensive purple omens or use sinistral/dextral exalts and annuls to gamble the 2nd mod and hope to slam the 3rd mod you need [this generally ends up being cheaper than using purple omens right away&hellip; the only exception are weapons or amulets, IMO]</p>

<p>- then turn to using purple omens, if you finish either all the prefixes or all the suffixes via the above steps, you start using sinistral/dextral annuls + greater annuls for the 1st prefix or suffix [this ends up being cheaper than using a single whittling]</p>

<p>- finish with whittlings [sometimes requiring you to use sinistral or dextral erasures in case the undesired thing you roll is higher ilvl than the finished prefixes or suffixes that you want to keep]</p>

<p>That&rsquo;s really it and the rest is RNG.  All you hope for along the way is that you don&rsquo;t brick with an undesirable high ilvl mod once you get into the purple omen stage (requiring you to reset either the prefixes or suffixes) or that the craft doesn&rsquo;t end up being more expensive vs. buying outright.</p>
