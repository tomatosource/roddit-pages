

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://www.reddit.com/r/PathOfExile2/comments/1ppmnu1/my_map_resets_because_i_was_to_long_in_the_vaal/"><p>My map resets because i was to long in the Vaal Temple.</p>
</a>
    </h2>

    
    <div class="selfPostContainer">
      <p>Title, wtf.</p>

    </div>
    

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="nunstyn" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>green1t</div>
        <div>5 | 5 hours ago </div>
      </div>
      <label for="nunstyn" class="commentText"><p>To be fair, the loading screen says pretty often that map-instances you&rsquo;ve left via portal or otherwise reset after 8-15 minutes.</p>

<p>Doesn&rsquo;t mean I like that it does this or that I&rsquo;m fully ok with it, but I&rsquo;m prepared that my map resets if i&rsquo;m too long in the temple. That&rsquo;s why I rarely enter the temple via the Vaal portal from one of the beacons and only after finishing the map I use the waypoint to get there.</p>

<p>Not optimal, but at least I have no stress to get back to the map instance.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nunwob4" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>-xX--Xx-</div>
        <div>5 | 4 hours ago </div>
      </div>
      <label for="nunwob4" class="commentText"><p>Just complete the map and then go to the temple from a waypoint afterwards. There&rsquo;s absolutely no need to use the portal that pops up from the beacon.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nunyrwp" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>ledrif</div>
        <div>1 | 4 hours ago </div>
      </div>
      <label for="nunyrwp" class="commentText"><p>You dont need to instantly enter the portal and clear the temple.<br>
Once you enter the zone you can take a wp there and progress as you desire.<br>
Once you populate the 6 rooms to be placed it acrually consumes the energy and you will see 0/6 energy banked on the bottom- place rooms or not- just back out of the screen and move on. So even pre architect kill you can do 12 zones qithout actually entering the temple. You just need to load the room placement in the middle.<br>
Once you clear architect you can bank 12 energy. So i did 3 rounds of temple last night before bed. Woke up to patch notes.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nunzmxr" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>BananaSplit2</div>
        <div>1 | 3 hours ago </div>
      </div>
      <label for="nunzmxr" class="commentText"><p>Don&rsquo;t enter temple in the map.</p>

<p>Also you should know that zones do reset if you stay out of them long enough.</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
