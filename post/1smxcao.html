    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>

      <label for="ogk43df" class="commentText"><p>I feel like we might have different interpretations of the word &ldquo;intuitive&rdquo;.</p>

<p>The ring literally says &ldquo;steal a lich&rsquo;s power OR take the finger&rdquo;. And steal a power isn&rsquo;t clickable, so the only other clickable objects being the liches, the names of which you have absolutely seen by the time you can physically access this location, so you know the three of them as liches by name.</p>

<p>Sure it doesn&rsquo;t tell you which mods come from which lich, which is pretty standard PoE, but again, you&rsquo;ve experienced Abyss by the time you get to this so you&rsquo;ve got a good idea that the 3 have seperate pools, and have almost certainly experienced their crafting mats (with their specific pools of mods).</p>

<p>I&rsquo;d sort of understand the confusion here if this was like&hellip; the very first Abyss thing a player could run across, but it isn&rsquo;t, you&rsquo;ve already experienced a fair chunk of it before this is ever accessible.</p>

      </div>
      <label for="ogkzziv" class="commentText"><p>Yup I would agree with your first line. Literally nothing you said later helped support your own claim that it&rsquo;s &ldquo;easy&rdquo;. I mean, you started out strong, lots of conviction, then in the next two paragraphs you backtracked. Clearly not intuitive if you&rsquo;re finding counter arguments against yourself.</p>

      <label for="ogl9fzf" class="commentText"><p>I think you are mistaking &ldquo;intuitive&rdquo;  for &ldquo;tutorialized&rdquo;.</p>

<p>It is intuitive to look at buttons on screen, especially by the point you have gotten to in the game. The game presents you with two options directly on the ring, to take it, or to &ldquo;steal a liches power&rdquo;. It is intuitive that the &ldquo;OR&rdquo; means something. You can clearly see that there&rsquo;s option buttons, so you having played the game for likely tens if not hundreds of hours by the time you reach this, know you can press those buttons.</p>

<p>You are for some reason thinking knowing the &amp;lt;outcome&amp;gt; of those results is the same as it not being intuitive to take the path. Those aren&rsquo;t the same thing.</p>

<p>If i am blindfolded, taken and placed in an empty room, then the blindfold is removed. I am in a room with 3 doors. I know i can attempt to use those 3 doors, even if i do not know the results of them.</p>

<p>It is intuitive to use the doors, even if i do not know which door will lead me to what outcome.</p>
</label>

<p>Trying to pass it off as the game not being &ldquo;intuitive&rdquo; isn&rsquo;t great when you are trying to make videos on things. I had a look through your other videos, and people have tried to give you feedback on things in other videos that you&rsquo;ve completely ignored as well (like frontloading actual footage instead of immediately into long descriptions).</p>
