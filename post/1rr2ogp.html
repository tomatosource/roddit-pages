

<html>

    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>

      <label for="o9wizcs" class="commentText"><p>Thanks, that was my other question, would it be easier to just start a new build and get a fresh blank temple</p>

<div class="commentAndChildren">

      <div class="commentHeader">
        <div>trueforce1</div>
        <div>3 | 12 hours ago </div>
      </div>
      <label for="o9wkxxs" class="commentText"><p>yes, thats how I did it. You would be &ldquo;wasting&rdquo; alot of runs and cryrstals just to deleted everything, so if you arent opposed to the idea of starting a new build, go for the new build. It was alot of fun starting new, building temple and reaching lvl 100 while building temple</p>

</div>

    
      
<div class="commentAndChildren">
  <input id="o9wosbi" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>gagelish</div>
        <div>2 | 12 hours ago </div>
      </div>
      <label for="o9wosbi" class="commentText"><p>It really depends on how long it would take you to run the entire campaign, but I can&rsquo;t imagine it being faster.</p>

<p>I had a Temple with about as many rooms as yours and was able to fully delete it in one set of 60 crystals by just repeatedly defeating the Architect and not locking anything. You&rsquo;ll destabilize 5+ rooms each time you do.</p>

        <div>Drucifer403</div>

      </div>

</label>

</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="o9x6ws4" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Skaitavia</div>
        <div>2 | 10 hours ago </div>
      </div>
      <label for="o9x6ws4" class="commentText"><ul>
<li>Since you&rsquo;re close to the architect, path to him via your chain on the left that ends in Smithy, and beat the architect. This will destabilize roughly 30% of the rooms in your temple</li>
<li>Afterwards, you can keep pathing to him to try to move him to the best min-max spot, which is 4 spots away from Atziri near the middle.</li>
<li>Otherwise, don&rsquo;t place any other rooms, and complete rooms that can give you medallions for assistance in building when you finish nuking your temple. On your current temple, this includes GW, Smithy, Legion Barracks, Spymaster, Commander, and Alchemy Labs. You&rsquo;ll want to keep an eye out for Lock Medallions (can drop from Spymaster, t3 Legion Barracks, and t3 Smithy from what you have) and Room Medallions (t3 Spymaster, t3 Legion Barracks, Commander, Smithy, and Alch Labs can drop these from what you have)</li>
<li>If you don&rsquo;t have any of the above rooms left, have full useful medallions, or don&rsquo;t feel like putting in any time to clear your temple as-is, then you can simply open a temple, enter, leave, and close it. It will destabilize roughtly 10% of your rooms when you close it. Keep in mind this means as you get closer to finishing nuking your temple and have less than 10 rooms, you will only destabilize 1 room at a time</li>
</ul>
</label>

      </div>
      <label for="o9xueht" class="commentText"><p>Yeah surprisingly it takes a LOT of crystals to destroy a temple hahah but no rng. If you ever have any questions feel free to reply to any of my comments. I’ve build 4 75+ room temples this league, 3 of them being fully min-maxed with all of the techs, so I know a bit too much about temples. Will gladly help anyone out that’s trying to build.</p>

        <div>1 | 5 hours ago </div>
      </div>
      <label for="o9yy1so" class="commentText"><p>My first one I just built on my own to experience it. But the other 3 I followed a layout but learned the techs on my own.</p>

<p><a href="https://sulozor.github.io/#/atziri-temple?t=ACFIIUghSCFIIUhgOWA5YDlgSCE5ESkRKRI5IUgyKQCYADFgSCFpEXkAiGk5IUhwKXB6AHBgSCJ6EjFwenk5ITFxgDlgcGkySGlwegAIYDkxIg" target="_blank">The first one (basically reverse fubgun)</a></p>

<p><a href="https://sulozor.github.io/#/atziri-temple?t=AEghSCFIIUghSCERKREpESkSIUgpYDlgOWAxSCIROQCYADlpITEpYDkAaTJwSGkRcGA5cHp6IXApenBgOXGASHoSMWkAMSJIIXB6cEEIAABIiA" target="_blank">The second one (giga snake + permanent atziri)</a></p>

<p>The second layout contains a LOT of techs that aren&rsquo;t shown in the layout, but it was the most fun temple to build this season so far in my opinion. It gives roughly 10% less drops from the first layout, but it more than makes up for it with the permanent atziri + relatively safety of lock management.</p>
