

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/dfy94sqmez2f1.png"><p>Raise Shield only has four support gem slots?</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/dfy94sqmez2f1.png" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="mu841sn" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>icantswim2</div>
        <div>1 | 40 minutes ago </div>
      </div>
      <label for="mu841sn" class="commentText"><p>I believe the number of slots is based on the ilvl of the item providing the skill. </p>

<p>So a higher level shield will have more support gems slots. </p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="mu84ihg" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>apophyxia</div>
        <div>1 | 38 minutes ago </div>
      </div>
      <label for="mu84ihg" class="commentText"><p>My shield ilvl is 82, I equipped an ilvl 79 mace to see if that were the issue. Still had 5 slots for mace strike.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="mu85745" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>icantswim2</div>
        <div>1 | 34 minutes ago </div>
      </div>
      <label for="mu85745" class="commentText"><p>Weird, I wonder if it&rsquo;s related to the base type?  What type of shield are you using?</p>
</label>
    </div>
  </label>
  
</div>

    
      
<div class="commentAndChildren">
  <input id="mu86pf2" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>ERZO420</div>
        <div>1 | 26 minutes ago </div>
      </div>
      <label for="mu86pf2" class="commentText"><p>Some built-in skills on items like wands and shields depend on item level (ilvl). You&rsquo;d need an ilvl 90 item to get 6 sockets for those built-in skills, which is unobtanium in POE2 currently.</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

    
      
<div class="commentAndChildren">
  <input id="mu88ajv" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>jy3</div>
        <div>1 | 18 minutes ago </div>
      </div>
      <label for="mu88ajv" class="commentText"><p>TIL</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="mu860kw" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>DoomBoat</div>
        <div>1 | 30 minutes ago </div>
      </div>
      <label for="mu860kw" class="commentText"><p>Weapon and ascendancy skills are tied to character lvl, maxing at lvl 90.</p>

<p>For some reason, shields, wands, and staves have sockets tied to item lvl&hellip; Which can&rsquo;t get to that 90. This is why you don&rsquo;t see a natty lvl20 Sigil of power, bone blast, chaos bolt, etc.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="mu86z62" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>apophyxia</div>
        <div>1 | 25 minutes ago </div>
      </div>
      <label for="mu86z62" class="commentText"><p>Thank you. I didn&rsquo;t realize it was like wands and staves.</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="mu84ril" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>LargeHandsBigGloves</div>
        <div>1 | 37 minutes ago </div>
      </div>
      <label for="mu84ril" class="commentText"><p>Perfect jewellers orb..?</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
