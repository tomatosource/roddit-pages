    <h2>
      <a class="postTitle" href="/r/pathofexile2builds/comments/1p46r16/help_with_hollow_palm_build/"><p>Help with Hollow Palm Build</p>
</a>
    </h2>

    

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="nq9tl5z" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>rimworldjunkie</div>
        <div>1 | 14 hours ago </div>
      </div>
      <label for="nq9tl5z" class="commentText"><p>I&rsquo;m not really into knowing how builds work but I checked this one out before because it was interesting.  With just a cursory glance I can see two issues.</p>

<p>First your helmet gives you 4 fewer enemies to be surrounded instead of 5.  Surrounded occurs when you have 5 enemies in your presence so the idea is the helmet completely voids that requirement making you &ldquo;surrounded&rdquo; at all times.  This probably isn&rsquo;t such an issue when playing since you&rsquo;ll only need one enemy near you but I imagine it&rsquo;ll probably mess up the stat reporting outside of combat.</p>

<p>Secondly your passive tree is missing a large section of the surrounded nodes which include 40% increased evasion when surrounded and 100% increased attack damage when surrounded.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="nq9u8gx" type="checkbox" checked/>

      <div class="commentHeader">

        <div>1 | 13 hours ago </div>
      </div>
      <label for="nq9u8gx" class="commentText"><p>Really appreciate the reply!</p>

<p>I&rsquo;m not sure if I&rsquo;m stupid but I couldn&rsquo;t understand where he got all the extra passive points from, I didn&rsquo;t see a clear distinction on anything weapon set related within the passive tree section in mobalytics</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="nq9wsfx" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>rimworldjunkie</div>
        <div>1 | 13 hours ago </div>
      </div>
      <label for="nq9wsfx" class="commentText"><p>Well the passive tree from your build has a lot of wasted points.  You have a huge section pathing through attribute nodes which are connected via another path.  Those could easily be refunded assuming the stats aren&rsquo;t needed.  There&rsquo;s also a section right at the start where you took both branches instead of a single branch.  If you refunded all those passives you&rsquo;d probably have enough to hit all the missing surrounded nodes.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="nq9z9ty" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Anisjohir</div>
        <div>1 | 13 hours ago </div>
      </div>
      <label for="nq9z9ty" class="commentText"><p>Holy shit I didn&rsquo;t even see that lmao, what a noob.</p>

<p>I&rsquo;ve fixed it now, did gain me about 5 passive points, got a couple more surrounded nodes with it. Updated the POB. <a href="https://maxroll.gg/poe2/pob/65tl90yg" target="_blank">https://maxroll.gg/poe2/pob/65tl90yg</a></p>

<p>Still only really gives me like 1% more evasion chance though, so I still feel like there is something big missing defensively that I just can&rsquo;t see.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="nqa3ma4" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>rimworldjunkie</div>
        <div>3 | 13 hours ago </div>
      </div>
      <label for="nqa3ma4" class="commentText"><p>If that&rsquo;s properly updated you still managed to miss the nodes I mentioned.  On the bottom left of the tree near the jewel is a surrounded node section which contains the evasion and damage nodes.</p>

<p>Also you&rsquo;ve got one too many points on the far right with the blue crit nodes.  You have one too many points on the bottom near the attack speed nodes.  You also have two extra points in the bottom left for the red rage nodes.</p>

<p>If you&rsquo;re lacking passive points due to level to do the whole tree I&rsquo;d suggest checking over the passives and prioritising the most important ones.</p>

<p>Also as I mentioned the modifier for surrounded on your helmet is 4 instead of 5 which will likely throw off stat reporting out of combat.  Assuming the game reports it correctly you could try standing near some mobs to ensure you are &ldquo;surrounded&rdquo; then check your char panel.  If the game reports it correctly you should have much higher evasion with mobs nearby if you have those surrounded evasion passives.</p>
</label>
