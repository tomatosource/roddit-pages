

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/sfakvmyjupjg1.png"><p>What&rsquo;s the logic behind forced name changes?</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/sfakvmyjupjg1.png" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="o5keirp" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>RegularStrong3057</div>
        <div>17 | an hour ago </div>
      </div>
      <label for="o5keirp" class="commentText"><p>With how alt heavy the game is it can be hard to find a decent name, or at least it was in POE1. Opening up names that have been inactive for over a year just clears up a lot of clutter.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="o5kdvt5" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Lumpy-Try-5600</div>
        <div>3 | an hour ago </div>
      </div>
      <label for="o5kdvt5" class="commentText"><p>Hmm&hellip;never had this happen. Id like to know too.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="o5ke1fh" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>LiYBeL</div>
        <div>2 | an hour ago </div>
      </div>
      <label for="o5ke1fh" class="commentText"><p>I think it depends on if the name is flagged for rename vs if it just expires.</p>

<p>I had a couple joke names that had the words &ldquo;Biden&rdquo; and &ldquo;Trump&rdquo; in them that got manually expired and those names are blocked now. But if a name expires I think it just becomes available again</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="o5kmvif" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Eastern_Manager_5286</div>
        <div>1 | 26 minutes ago </div>
      </div>
      <label for="o5kmvif" class="commentText"><p>I just don&rsquo;t get why character names have to be unique to begin with. What are the odds of me running into another player with the same name? And even if I do just append a random number like so many platforms do. (Same thing for any high scores tracking or whatever)</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
