

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>

</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/wvd6nlvjl06g1.png" />
	</div>
  

    <div class="commentList">

</div>

        
      
        
          
<div class="commentAndChildren">

      <div class="commentHeader">

        <div>1 | 9 minutes ago </div>
      </div>
      <label for="nsz623q" class="commentText"><p>Overabundance III is only datamined. It is not in the game nor has it ever been confirmed. I doubt it will ever be in the game because even with the curse downside getting double limit on skills is op.</p>

<div class="commentAndChildren">
  <input id="nsz6fju" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>xJVIayhem</div>
        <div>1 | 7 minutes ago </div>
      </div>
      <label for="nsz6fju" class="commentText"><p>Why are so many builds/concepts thinking Overabundance 3 is a thing? That&rsquo;s been on POE2DB forever, but doesn&rsquo;t exist.</p>

<p>Please always check the [actual wiki list of support gems](<a href="https://www.poe2wiki.net/wiki/List_of_support_gems" target="_blank">https://www.poe2wiki.net/wiki/List_of_support_gems</a>). If it&rsquo;s not there or in the patch notes, it has not been confirmed to be in the game.</p>

<p>I wish POE2DB would clearly state this for items that don&rsquo;t exist or haven&rsquo;t been confirmed to be added, because seeing it everywhere just shows how much it misleads people.</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
