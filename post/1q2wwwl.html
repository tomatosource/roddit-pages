    <div class="comment">
      <div class="commentHeader">

        <div>3 | an hour ago </div>
      </div>
      <label for="nxhm0ex" class="commentText"><p>I think the biggest issue is finding chains with +2s that you can +1 and lock.  I haven&rsquo;t gone through all of the permutations yet, but it&rsquo;s A LOT of RNG on first glance between having specific room medallions, RNG at open, and a +1.</p>

<p>I was able to rebuild my Spy-Gar-Arm-Alc-Th-Corruption end of my 1st snake this morning (back to 50+ rooms).</p>

<p>Basically it required for me to RNG a +1, a Corruption medallion, a Th medallion, and a Armory medallion.  Then I had to keep resetting until I was able to get one of either Garrison/Armory (to upgrade the Garrison to +3 and lock it and hope I get a Alc lab on the next reset) or Garrison/Alc Lab.  That&rsquo;s sort of the permutations you&rsquo;re going to need to keep track of all while managing locks.</p>

<p>THAT was hard with 40+ rooms (incl. 11 spies) in my chain.  I can&rsquo;t imagine starting from scratch or even 10-20 rooms.</p>

<p>Which also leads me to my next point - it is going to be virtually impossible to replicate the amount of Corruption chambers that legacy setups have, and that&rsquo;s probably the best loot multiplier after the nerfs (unless I overlooked something?).  The biggest problem is that unless I overlooked something it&rsquo;s insane RNG to start a second chain with a Corruption chamber and keep it going (at that point you would still only have 3 in your setup - two from the first chain incl. the end and the start of the second chain).</p>

<p>And by the time you have your first snake done, the destabilization benefit from the hotfix is nonexistent (at least for me and I think many that were snaking around the 4 walls).  You can only place so many feeder rooms from the start before potentially looping with your first chain if you went around.</p>
