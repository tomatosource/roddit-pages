

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://bsky.app/profile/timbritton.bsky.social/post/3molo3gok3s2v"><p>[Britton] Francisco Lindor and Tyrone Taylor will start rehab assignments tomorrow with Binghamton.</p>
</a>
    </h2>

    

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="osh32rg" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>James-K-Polka | Atlanta Braves</div>
        <div>2 | an hour ago </div>
      </div>
      <label for="osh32rg" class="commentText"><p>Lindor should visit some of the great sights Binghamton has to offer while he’s there. Like the site of the original Dick’s Sporting Goods (now closed) or the high school Rod Serling went to (now dead). Or he could go to the Wegmans in nearby Johnson City, but make sure not to laugh when he tells people he wants to “go to Johnson City.”</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="osh0ur3" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>False_Concept1300 | New York Mets</div>
        <div>-1 | an hour ago </div>
      </div>
      <label for="osh0ur3" class="commentText"><p>Taylor is legitimately one of the worst players in baseball. He will however, provide decent OF defense and good enough base running.</p>

<p>Lindor is still a franchise legend but at 32 years old, I can’t expect him to be much of anything - especially coming off of an injury that historically zaps your power. I’d be surprised if he was anything better than a league average hitter for the rest of this year. Still, having him at short is an upgrade over Bichette, and Bichette is an upgrade over Baty.</p>

<p>They are good reinforcements but I hope Mets fans temper their expectations for them being some sort of saviors.</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
