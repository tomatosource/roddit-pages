<div class="commentAndChildren">

    <div class="comment">
      <div class="commentHeader">
        <div>Confident-Milk8107</div>
        <div>1 | 15 minutes ago </div>
      </div>
      <label for="o6pzskr" class="commentText"><p>If you are not worried about being able to sanctify the easiest method to crafting a good +4 or +5 wand cheaply is like this:</p>

<ol>
<li>Fracture spell levels and annul to fracture and +1 mod</li>
<li>Chaos spam until t2+ crit chance or t2+ cast speed, once you hit you have Suffix Exalt Omen active in inventory and perfect exalt. If you get crit chance or cast speed proceed to step 3, if not annul and try again until you have spell skills/crit chance/cast speed</li>
<li>Desecrate prefix to block mana. Double exalt slam, if its 2 prefixes you can live with continue</li>
<li>Omen of light and desecrate til you get a 3rd prefix you can live with</li>
</ol>

<p>crafted atleast a hundred staffs/wands like this, very low investment and its a good profit craft as well for fairly good results. most expensive part is generally the base, if you miss a few fractures in a row it starts to feel very painful</p>
</label>

    <div class="comment">
      <div class="commentHeader">
        <div>ImTheTractorbeam</div>
        <div>1 | 13 minutes ago </div>
      </div>
      <label for="o6q00z8" class="commentText"><p>I would desecrate (don’t reveal) and fracture next. The hope would be to hit +5 levels to make the craft a bit easier but that also means you can’t Sanc for +6. Which may be fine if this is for you, and not for sale. If you hit the fracture you can annul down to 2 mods and chaos spam for T1 Increased Spell Damage. Being ilvl 81 means you can roll Tier 1 “Increased X Damage”. So depending on your build you may or may not want that. That’s why I always crafted ilvl 80
Wands. Made the prefixes a bit easier to hit. After you have the prefixes sorted out, Cast speed is what I’d do next. T1 is Ilvl 80 so you won’t roll off it with whittle. Hopefully at that point you should have:</p>

<p>T1 Increased Spell Damage ilvl 80</p>

<p>T1 damage as X ilvl 80</p>

<p>T1 damage as X ilvl 80</p>

<p>T1 Spell Skills  Fractured</p>

<p>T1 Cast speed ilvl 80</p>

<p>The last mod you could either roll desecrate for (if you don’t desecrate for 3rd prefix), or you can whittle until Crit chance (since you won’t whittle off anything else, there are no ilvl 81 suffixes since your blocked the other + Skills).</p>

<p>Good luck OP!</p>
</label>

      <label for="o6pwv8g" class="commentText"><p>Desecrate next. Depends on what you need. Mana for prefix is the most common when slamming normally so you may want to desecrate prefix to prevent that.</p>

<p>However, suffix has a crit chance and crit damage bonus so you may want to desecrate suffix to have a chance of getting either of those.</p>

<p>After you decide, the rest is RNG slam. Then you can spend more currency to clear bad rolls.</p>

<p>Also, make sure to check craft of exile to determine the iLevel of the mods that you want. Item level of this wand is just 81, some tier 1 mods will only show up with iLevel 82 and up.</p>

<p>You can also do fractures, but I&rsquo;m not familiar with that crafting route yet.</p>
