

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://www.youtube.com/watch?v=0ahpsPpChlk"><p>Patch review by Kripp. Crafting good, Life poop, ES OP</p>
</a>
    </h2>

    

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="nekce8g" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>moal09</div>
        <div>1 | 29 minutes ago </div>
      </div>
      <label for="nekce8g" class="commentText"><p>The fact that 2-3k life is the average for endgame, while ES is 10k+ is insane.</p>

<p>No amount of armor can make up for that, especially with leech being in a much weaker state in PoE 2 vs 1.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="nekepvm" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>RDandersen</div>
        <div>1 | 17 minutes ago </div>
      </div>
      <label for="nekepvm" class="commentText"><p>At 80k armour, I am feeling pretty immortal at 3k life&hellip;<br>
Until I feel <em>too</em> immortal and forget that there is that one ability on that one boss I should <em>not</em> facetank.</p>

<p>I&rsquo;m still going to, of course. For the culture.</p>
</label>
    </div>
  </label>
  
</div>

    
      
<div class="commentAndChildren">
  <input id="nekh46w" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>TheNoon44</div>
        <div>1 | 6 minutes ago </div>
      </div>
      <label for="nekh46w" class="commentText"><p>Whatt i have tried i can say that im will rather have 50k armour and 2500 life. With that and some life regen we can do absurd shit. With 12k es you still have to play carefully.</p>
</label>
    </div>
  </label>
  
</div>

    
      
<div class="commentAndChildren">
  <input id="nekh5nb" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Ixziga</div>
        <div>1 | 6 minutes ago </div>
      </div>
      <label for="nekh5nb" class="commentText"><p>Idk, my warrior this patch feels tankier than my 10k es monk that I played at launch. Yeah maybe theoretically I don&rsquo;t survive the same kind of slam, but my monk was rarely at full es. But my warrior is literally always full HP, because leech plus armor effectively makes you immune to attrition which whittles down es. I think the changes to block and armor applying to elemental damage help. If the slam isn&rsquo;t pure phys (most aren&rsquo;t) you get to double dip armour and elemental resistance to mitigate the damage, and you can get some very high armor values this patch</p>
</label>
    </div>
  </label>
  
</div>

    
      
<div class="commentAndChildren">
  <input id="nekh7q4" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>yvrev</div>
        <div>1 | 5 minutes ago </div>
      </div>
      <label for="nekh7q4" class="commentText"><p>It felt weird playing an ES build foe the first time. The ES nodes even while levelling feel so good. Made me miss life nodes, seeing the most tangible defensive number go up is just nice.</p>
</label>
    </div>
  </label>
  
</div>

    
      
<div class="commentAndChildren">
  <input id="nekhfew" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>BenjaCarmona</div>
        <div>1 | 4 minutes ago </div>
      </div>
      <label for="nekhfew" class="commentText"><p>You need around 80% damage reduction to match 10k+ ES (assuming it has no mitigation) if you have 2k life, it is kinda crazy</p>
</label>
    </div>
  </label>
  
</div>

    
      
<div class="commentAndChildren">
  <input id="neki0yn" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>RamenArchon</div>
        <div>1 | a minute ago </div>
      </div>
      <label for="neki0yn" class="commentText"><p>Agreed. Though I gotta say that armour feels a LOT better this time. I almost feel like it&rsquo;s a placebo. Just a smidge more life in the forsaken part of the passive tree, then we&rsquo;re golden.</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

        
      
    </div>
  </body>
</html>
