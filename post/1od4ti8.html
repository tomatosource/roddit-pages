

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/mdqiyje27nwf1.jpeg"><p>What am I doing wrong? Crafting help needed</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/mdqiyje27nwf1.jpeg" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="nkr9sr4" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>amiskala</div>
        <div>2 | 2 hours ago </div>
      </div>
      <label for="nkr9sr4" class="commentText"><p>You should check the website for crossbow modifiers: <a href="https://poe2db.tw/us/Crossbows#ModifiersCalc" target="_blank">https://poe2db.tw/us/Crossbows#ModifiersCalc</a></p>

<p>Increased phys % is not a kurgal mod and u shouldn&rsquo;t use omen for that. And u don&rsquo;t need to use prefix omen if there&rsquo;s only prefix to be added after light+annul.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="nkrcv29" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Faithlessforever</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="nkrcv29" class="commentText"><p>Thanks for the comment.
Well, I used Kurgal to get the 27% Increased Physical Damage + 49 Accuracy, which is a T6.</p>

<p>I also used Kurgal to get 85% Increased Physical Damage on my other crossbow, which is a T5 only.</p>

<p>I took note about the useless prefix omen you mentioned. Thanks</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="nkrdfv2" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>amiskala</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="nkrdfv2" class="commentText"><p>There&rsquo;s only two kurgal mods in the prefix pool so there&rsquo;s gonna be one prefix from normal prefixes each time you roll.</p>

<p>So instead of six options for phys% u get only two since four of those are always gonna be kurgal mods.</p>

<p>Edit: not actually sure if there&rsquo;s gonna be both kurgals at the same time but atleast there&rsquo;s gonna be one of the two and it will block one option from being the phys %</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="nkrdm1p" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Faithlessforever</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="nkrdm1p" class="commentText"><p>Ooooo. It makes sense now. To hell with this kurgal then. Thanks a lot!</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

</div>

</div>

  <input id="nkrciuq" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Then811</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="nkrciuq" class="commentText"><p>buy/find a crossbow that already has t2+ %phys, trying to find it from a desecration is too expensive</p>

  </body>
</html>
