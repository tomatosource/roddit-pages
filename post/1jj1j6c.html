<p>Hang around the Boston Celtics long enough and you’ll invariably hear some barking.</p>

<p>Maybe it’ll occur when Kristaps Porzingis huddles up the team pregame and asks, “Where my doggies at?” Maybe it’ll happen when Luke Kornet skies for a tip in, and Derrick White gets all the dogs on Boston’s roster riled up by barking in the middle of the lane.</p>

<p>The Celtics&rsquo; affinity for pups is longstanding. During last year’s title run, Jaylen Brown routinely asked teammates, “Where my road dogs at?” and it became a locker room query for a Boston team that thrived away from home.</p>

<p>These Celtics are still road dogs. They are an NBA-best 28-7 away from home this season. What’s more, that .800 winning percentage is tied for the best mark in team history, matching the 1972-73 squad that finished 32-8 away from home.</p>
