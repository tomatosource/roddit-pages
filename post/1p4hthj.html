

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>

    <h2>
      <a class="postTitle" href="/r/LegionGo/comments/1p4ht9m/poe_2_optimization_issue/"><p>PoE 2 optimization issue</p>
</a>
    </h2>

    

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="nqbwgh2" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Debibule</div>
        <div>4 | 2 hours ago </div>
      </div>
      <label for="nqbwgh2" class="commentText"><p>Its in early access, they will only fix framerate issues that stop the majority from play testing the game.</p>

<p>Proper optimisation will most likely, if at all, come with or after 1.0.0.</p>

<p>For now, they are constantly changing and adding stuff that would undo any optimisation they try.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="nqbxlk2" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>NoZookeepergame9799</div>
        <div>1 | 2 hours ago </div>
      </div>
      <label for="nqbxlk2" class="commentText"><p>Damn, sad to hear. So us on more ”weak” devices wont have a chance to actually enjoy the game during early access, even tho the hardware specs exceeds those listed on steams minimum requirement.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="nqby33a" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Debibule</div>
        <div>2 | an hour ago </div>
      </div>
      <label for="nqby33a" class="commentText"><p>Unfortunately yes. Think of it from a dev point of view. They want to add feature x, which will cost 8 weeks of dev time.</p>

<p>Optimisation for that feature would cost an additional 3 weeks.</p>

<p>There is a chance players reject the feature and they need remove or change it after its been released. Changing it would mean reoptimising it. Is it worth optimising before players provide feedback?</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="nqc0z5n" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>NoZookeepergame9799</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="nqc0z5n" class="commentText"><p>Sure I get that, but with many of us hardly being able to play, I as a dev, would see so that atleast the minimum requirements are met if I decide to release in early access with a payment wall.</p>

<p>Titan Quest II is playable, even tho it is in early access and development started later then PoE 2.</p>

<p>Last Epoch is playable, even tho smaller dev team.</p>

<p>Even tho I understand your argument, I don’t see it as an excuse. How am I an many others able to give our feedback if the optimisation is a total mess.</p>

<p>I am not here to argue, I just would like to know, when am I, and many others be able to actually start playing the game.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="nqc1k5w" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Debibule</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="nqc1k5w" class="commentText"><p>I get it, and I&rsquo;m lucky to have hardware that can scrape by with (only just) a playable framerate. I&rsquo;d hate to be in a position where I didn&rsquo;t. I&rsquo;m sympathetic and would be really frustrated in your position.</p>

<p>Every dev is different and will prioritise different stuff. Its unfortunately quite common that games run like crap during early access (even afterwards in some cases.)</p>

<p>The only advice I can give you really is avoid games in early access where what you have only just meets minimum requirements. Minimum requirements aren&rsquo;t binding and are basically just a promise (for the future) when it comes to early access.</p>

<p>Just checked and for AMD GGG say the minimum is an rx 470, which is in fact faster than the 780m in the Z1 extreme. Unfortunately the Z1 extreme doesn&rsquo;t meet minimum requirements anyway. It might never run well.</p>
</label>
    </div>
  </label>
  
</div>
