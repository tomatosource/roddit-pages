.postLink:visited {

.commentList {

.commentAndChildren {

.comment {

  border-bottom: 1px solid #555;

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>

<p>Personally i crafted something very similar last night on a solar amulet base, so after chaosing the t1 spirit i just slammed on a suffix with exalt and removed it with the essence, then desecrated prefix and my prefixes were done. Then i just double perf exalt slammed suffixes and hit double res which is fine, I would have wanted cast speed but I can still try to whittle and since I have spell skills fractured even if I was to hit something useless like T1 life regen which could not be whittled I could still use chaos/annul suffix omen and remove it and try again, so I do believe its a safer option to do so, with basically 0 chance of completely bricking the amulet like you potentially could here. Also, if you are hunting for spell dmg/cast speed, might as well get that quality up to 40% after the breach essence. :)</p>
