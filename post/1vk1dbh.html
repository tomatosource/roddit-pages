

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://youtu.be/NuMTBV7XkA8?si=lCFxprjJ1PcUv9li"><p>Don Nelson leads the We Believe Warriors to a historic playoff upset over his former team</p>
</a>
    </h2>

    

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="p2q0ay0" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>justgotpregnant | Warriors</div>
        <div>5 | an hour ago </div>
      </div>
      <label for="p2q0ay0" class="commentText"><p>Im a warriors fan. The Curry era has been the best thing to ever happen to me as a sports fan. An embarrassment of riches, memory after memory.</p>

<p>But this 07 run is still the most intense pop of adrenaline I’ve ever felt watching basketball, it was pure crack.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="p2pukfw" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>willpelts | OKC</div>
        <div>5 | 2 hours ago </div>
      </div>
      <label for="p2pukfw" class="commentText"><p>I remember that I had grown a little bored of basketball around this time, but watching this series and how batshit electric Warriors fans were watching their team beat the title favorites got me reinvested. This series made me a Baron Davis fan for life.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="p2q5bx0" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>BeardedRiker</div>
        <div>3 | an hour ago </div>
      </div>
      <label for="p2q5bx0" class="commentText"><p>My dad and I went to a Mavs/Warriors game early that year. GS beat Dallas that game and I remember both my dad and I leaving the game saying that everyone needed to watch out for Baron Davis.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="p2q5i15" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>ContinuingAnyway</div>
        <div>2 | 44 minutes ago </div>
      </div>
      <label for="p2q5i15" class="commentText"><p>Chuck hadn&rsquo;t yet said San Francisco needed to clean up them dirty ass streets</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
