

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/lcqjyoza43re1.jpeg"><p>Couldn&rsquo;t find on trade site</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/lcqjyoza43re1.jpeg" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="mjvxcmw" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Miles_Adamson</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="mjvxcmw" class="commentText"><p>When you can&rsquo;t find something on the trade site, change the filter to include offline listings. You can sometimes find a similar item listed a while ago which never sold so you know it&rsquo;s probably worth less than that. Then look at the value of each mod individually as it should be more expensive than 1 of the mods plus a useless one, as these 2 are both good and good together. This gives you a range to work with, in this case 1 div to 10 div.</p>

<p>You could list it at 10 div and bump it down over time or just start at 5 and see if it sells there. Realistically it will probably not sell for much with everyone offline and waiting for the patch</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="mjw8ke1" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Binzenjo</div>
        <div>1 | 4 minutes ago </div>
      </div>
      <label for="mjw8ke1" class="commentText"><p>What&rsquo;s even the point in having offline listing&rsquo;s when the person playing isn&rsquo;t there to make the trade?  They should definitely have an instant buyout option.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="mjw90al" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Miles_Adamson</div>
        <div>1 | 2 minutes ago </div>
      </div>
      <label for="mjw90al" class="commentText"><p>I guess the point is just to price check or maybe as a buyer you might want a very specific expensive item and wait till they are online</p>

<p>For sure most everyone wants instant buyout at this point but at least you can see the listings at all</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

    
      
<div class="commentAndChildren">
  <input id="mjvxnmc" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>snarkly_gent</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="mjvxnmc" class="commentText"><p>I&rsquo;m trying to get a really good wand to finish off my last character so all currency helps lol. But thanks for the tip</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="mjvwwkm" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Bluegoldfishfood</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="mjvwwkm" class="commentText"><p>There are so many combinations that it isn&rsquo;t unusual for there to be no others. I&rsquo;d start by searching for diamonds that have one of those two nodes. You can get an idea of whether either or both nodes are sought after. Then consider what builds are looking for. Can also find similar nodes on the tree to the ones you have and search for those diamonds.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">

        <div>1 | an hour ago </div>
      </div>
      <label for="mjvx9cx" class="commentText"><p>Seems so obvious,but I wouldn&rsquo;t have thought about it on a million years lol. Thanks bud</p>

    </div>
  </label>
  
</div>

    
  </div>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="mjvz0f2" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Beast_of_Guanyin</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="mjvz0f2" class="commentText"><p>Depends entirely on how desireable those nodes are.</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
