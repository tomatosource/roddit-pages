

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/uychzwhweevf1.jpeg"><p>Value of this ilvl82 shield with all t1 rolls?</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/uychzwhweevf1.jpeg" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="njqq695" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>emulicker</div>
        <div>1 | 21 minutes ago </div>
      </div>
      <label for="njqq695" class="commentText"><p>Seems pretty good for thorns but don’t think many people are playing that so not worth much</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="njqr4wt" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Blicktar</div>
        <div>1 | 14 minutes ago </div>
      </div>
      <label for="njqr4wt" class="commentText"><p>Not much. Builds that utilize a shield for damage want pure armour bases, not hybrid armour/eva bases, since the damage of shield skills scales off armour.</p>

<p>Most people at this point in a league want an exceptional base for 2 sockets by default and 3 with a lucky corruption.</p>

<p>The stats on this shield are for a life based thorns build. There aren&rsquo;t really that many of those this league.</p>

<p>Not a bad shield by any means, but not extremely valuable due to stats that cater to a relatively unpopular build, and being on a non-exceptional base (at least as far as I can tell).</p>

<p>I&rsquo;d estimate a price of somewhere between <sup>1</sup>&frasl;<sub>2</sub> a div and 2-3 div, depending if you catch the right buyer on the right day.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="njqsey0" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>ThisSteakDoesntExist</div>
        <div>1 | 3 minutes ago </div>
      </div>
      <label for="njqsey0" class="commentText"><p>Thanks for the detailed insights, much appreciated.</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="njqrrk5" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>lvcas206</div>
        <div>1 | 8 minutes ago </div>
      </div>
      <label for="njqrrk5" class="commentText"><p>25x</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
