

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/l1qtkpozzf9g1.png"><p>Crafting Help - Whittling + Sinistral Erasure Omens</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/l1qtkpozzf9g1.png" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="nvy6nfm" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>halexh</div>
        <div>1 | 12 minutes ago </div>
      </div>
      <label for="nvy6nfm" class="commentText"><p>I am trying to target remove the mana modifier. The T3 All Resist is technically the lowest item level modifier on the item (ilvl 40), and the t6 mana is ilvl 46 (<a href="https://poe2db.tw/us/Rings#ModifiersCalc" target="_blank">poe2db ring modifier link</a>). A few questions:</p>

<ul>
<li>Am I understanding the <a href="https://www.poe2wiki.net/wiki/Omen_of_Sinistral_Erasure" target="_blank">Omen of Sinistral Erasure</a> and <a href="https://www.poe2wiki.net/wiki/Omen_of_Whittling" target="_blank">Omen of Whittling</a> correctly and that this should target and remove the mana modifier?</li>
<li>I thought if I enable only the whittling and hover over the item, it should highlight the modifier orange that will get removed. I would expect this to be the all resist, but nothing gets highlighted. Someone mentioned its because there are two modifiers that could possibly be removed, but I dont see how thats the case with this item. The All resist is the lowest level modifier.</li>
<li>If I enable both omens, nothing gets highlighted still?</li>
</ul>

<p>I suppose its debatable as to whether or not I should use the ~6 div in omens on this ring, but I would like to. If I can get another high damage to attacks tier its a pretty good ring likely worth the 6 div cost (plus potential cost to reroll desecration).</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="nvy82sq" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>pitzzah</div>
        <div>1 | 3 minutes ago </div>
      </div>
      <label for="nvy82sq" class="commentText"><p>Odds of u hitting it are low. Mana , life , accuracy have higher weight , I wouldn&rsquo;t use u less ring was near perfect</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

        
      
    </div>
  </body>
</html>
