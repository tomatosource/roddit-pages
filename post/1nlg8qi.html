        <div>StabShot</div>
        <div>7 | 6 hours ago </div>
      </div>
      <label for="nf57u2y" class="commentText"><p>Despite this being the League of LA Deadeye I&rsquo;m really happy with how spells turned out when you figure out a good combination, atleast in the case of Blood Mage. Getting 100% crit with 100% Ele to Chaos conversion scales really really well. Not having to care about any resistances on enemies and extra damage from withered on bosses. The clear is exceptional too, killing everything offscreen with spark (and tankier mobs with CoC Comet).</p>

<p>Adding the new metagems with Chaos Damage to Freeze on Spark gives a huge defensive layer with keeping everything frozen and allowing for a second source of &ldquo;Cast on X&rdquo; with Cast on Elemental Ailment giving you even better clear.</p>

<p>Crafted most of the gear myself (except for the Uniques) using the new Omens which are amazing, huge W from GGG.</p>

  <input id="nf6opok" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>StabShot</div>
        <div>1 | 28 minutes ago </div>
      </div>
      <label for="nf6opok" class="commentText"><p>I couldn&rsquo;t quite make the loop go infinite, but I have stacked a lot of energy refund/energy gain. So while having 100% crit chance on all spells (due to stacking crit together with the 15% Blood Mage base crit chance) together with spark hitting and destroying all Frost Walls I manage to get a huge surge of crits on the boss which triggers comet over and over again. I am not sure if the comets themselves trigger their own energy gain (from their own crits).</p>

<p>The damage scales exponentially with more damage. More damage -&amp;gt; more energy gain on crit -&amp;gt; more comets = More damage. And yes, while this build has about 30-50 divines worth of gear to reach this stage, someone spending a mirror would probably do around 5 times the DPS output just due to how CoC scales with damage.</p>

<p>The most expensive piece to make this build absolutely take off would be a Prism of Belief with +3 Levels to Comet, or a 3-socket wand with 3 runes of +1 to level of all spells. But if you&rsquo;re essentially able to oneshot all content in the game at the highest difficulty already, do you really need more damage?</p>
