

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/yjjrp2fwd99h1.gif"><p>Too much to do in endgame quests?</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/yjjrp2fwd99h1.gif" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="otk4y1j" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>TheSuperJohn</div>
        <div>1 | 7 minutes ago </div>
      </div>
      <label for="otk4y1j" class="commentText"><p>You don&rsquo;t have to do every quest.</p>

<p>Ideally you&rsquo;ll just do one or two based on what you want to farm</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="otk4zl5" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>EffectiveTonight</div>
        <div>1 | 7 minutes ago </div>
      </div>
      <label for="otk4zl5" class="commentText"><p>So, my quick answer to this is, I started with a mech I enjoy (breach) got most of the points the normal way. When I went to do any of the other content I bought the points VIA the boss encounters, 6 points per boss. You of course need to unlock the boss by getting to the main hub and maybe a few more maps but you can continue to farm your main content as you go or just spam white maps. It does feel like a lot but once I got past it, I realized how many more maps I ended up doing beyond the ones to unlock points lol.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="otk5163" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>The-Root-Word</div>
        <div>1 | 7 minutes ago </div>
      </div>
      <label for="otk5163" class="commentText"><p>Look at it this way. You can pick the quests you want to do now, then pick different ones next league (presumably all future leagues will add a quest, but some will roll into existing league content). In this way, you never run out of stuff to do in any league.</p>

<p>Honestly, while it can feel overwhelming when you&rsquo;re strapped for time, you stand to benefit the most over those who optimize the fun out of the game because there will ALWAYS be some new experience awaiting you in the next league. You can even make divs by doing this, because the people who <em>have</em> optimized the game as much as possible still need stuff like tablets and so on to juice the crap out of their maps. They&rsquo;re digging for the absolute pinnacle of POE2 power, which is great for them! And you&rsquo;re there selling the shovels they use to dig.</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
