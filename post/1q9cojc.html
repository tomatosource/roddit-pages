

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/dzgmrcjdlkcg1.png"><p>Is this infitite Loading screen common?</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/dzgmrcjdlkcg1.png" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="nyv3dl4" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>GravLab6262</div>
        <div>2 | 5 hours ago </div>
      </div>
      <label for="nyv3dl4" class="commentText"><p>On ps5, happens anytime I’m playing in a group. Usually when I go in/out of inventory. It’s killed me a few times.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nyuq2xs" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>OmeBoon</div>
        <div>1 | 6 hours ago </div>
      </div>
      <label for="nyuq2xs" class="commentText"><p>I&rsquo;ve got the same problem, just posing to see if someone has a fix. 16gb ddr4 Ryzen 5 3600, 3080, 400MB/s ssd.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nyuqye3" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>altercube</div>
        <div>1 | 6 hours ago </div>
      </div>
      <label for="nyuqye3" class="commentText"><p>I’ve found that deleting shader cache helps. This problem seems to reoccur after some patches for me, maybe someone has a permanent solution.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nyv3un7" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>anuj_sabhlok</div>
        <div>1 | 5 hours ago </div>
      </div>
      <label for="nyv3un7" class="commentText"><p>I just got fed up of this on my 3070, tried shaders reset, driver roll back and everything.</p>

<p>What I noticed in the F1 first graph was that when this happened my VRAM would repopulate and get to around 4 GB before the game resumed.</p>

<p>I have then lowered all the graphic settings except resolution which I kept at 1440. That lowered the number of times this happened but would still happen every day once or twice.</p>

<p>My friends who are running 16 GB + gfx cards didn&rsquo;t have this issue.
Now, I have upgraded 4 days ago to 5070Ti and have not had the issue yet.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nyv9wfv" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Recent-Education3780</div>
        <div>1 | 5 hours ago </div>
      </div>
      <label for="nyv9wfv" class="commentText"><p>Switching from Vulkan to dx12 stopped it for me</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nyvg22m" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Osteinum</div>
        <div>1 | 4 hours ago </div>
      </div>
      <label for="nyvg22m" class="commentText"><p>It happens around 5 times in a 35 map temple for me, always when I enter a room with a big boss or intense fight. Everything in the F1 window goes apeshit, shades, vram, cpu, GPU, then it resets after 20 sek.
Its better now than last league though, then you lost the oversight and old checkpoints. I walked so many maps a second time over because I didn&rsquo;t remember when I had been before on the map</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
