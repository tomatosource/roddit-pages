

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/wbe83jlksuqg1.jpeg"><p>What do the yellow or grey ones at the bottom mean</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/wbe83jlksuqg1.jpeg" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="oc2z2fm" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>liceyano</div>
        <div>4 | 7 hours ago </div>
      </div>
      <label for="oc2z2fm" class="commentText"><p>That should be reflecting the total of the stats above it. For ex the 27% fire resistance + 16% to all elements equals 43% Total fire resistance and so on.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="oc2z9s4" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>TheTuf</div>
        <div>4 | 7 hours ago </div>
      </div>
      <label for="oc2z9s4" class="commentText"><p>As you are searching for &ldquo;+% total elemental resistance&rdquo;, it shows you how much of that search parameter that item has.</p>

<p>That shows total ele resistance you can easily see and sort by it. It is the sum of resistances on the item</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="oc311wt" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Prestigious-Oven3465</div>
        <div>3 | 7 hours ago </div>
      </div>
      <label for="oc311wt" class="commentText"><p>Like the others said, it’s basically a summary of what you searched for. You’re searching as ‘pseudo’ instead of ‘explicit’. The pseudo search shows the total amounts of what you’re searching for, in this case resistances. Scroll down past all those and it’ll show the explicit lines you can search for. “Explicit, +X% to all resistances” or “explicit plus X to Fire resistance”, etc</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="oc2za9g" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>_plusone</div>
        <div>2 | 7 hours ago </div>
      </div>
      <label for="oc2za9g" class="commentText"><p>They’re summaries. For example the bottom on has 16% all resist -&amp;gt; 16% fire + 16% cold + 16% lightning = 48% resistances total from that ring.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="oc34h5g" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Jango519</div>
        <div>1 | 7 hours ago </div>
      </div>
      <label for="oc34h5g" class="commentText"><p>Insert those are the same things meme</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
