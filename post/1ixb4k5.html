    <h2>
      <a class="postTitle" href="https://imgur.com/nmzSZDC"><p>Finally had enough boons to finish Zarokh! Including my takeaways from finally finishing floor 4 of Trial of Sekhemas</p>
</a>
    </h2>

    

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="mekqwgi" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>bstyledevi</div>
        <div>1 | 23 minutes ago </div>
      </div>
      <label for="mekqwgi" class="commentText"><p>I&rsquo;ve struggled with floor 4 of Trial of Sekhemas for over a month now. I can beat the first three floors almost at will, but my level 85 Warrior Titan just couldn&rsquo;t beat the 4th floor. I could barely make it through a few stages without dying. This was the run that finally succeeded. Here&rsquo;s some tips on what made this run work:</p>

<ol>
<li>75% Honor Resistance. This is first and foremost, and I&rsquo;ve never been able to get much further than floor 2 without having this.</li>
<li>Reduced merchant prices. I had two relics that gave 10% and 7% reduced prices respectively.</li>
<li>Chance for Double Water from Fountains - this is the lynchpin of the whole run.</li>
</ol>

<p>The key is targeting fountains for water, getting some doubled when RNG allows, then either going for merchants mid-run or just hitting them up at the end of each floor. Once I was able to get Reduced Merchant Prices, I could buy out the merchant every time I visited him.</p>

<p>The other main factor was staying away from merchant-reduction afflictions as much as possible. As a Warrior Titan, I rely on Armor, so losing Energy Shield and Evasion are basically free passes for Afflictions.</p>

<p>I actually picked up one more Boon after this, 50% added defenses. With all those stacked together, Zarokh wasn&rsquo;t doing much damage to me or making me lose Honor.</p>

<p>I know there&rsquo;s other strategies, but this is what worked for me. Finally got my last two Ascendency points!</p>
</label>
    </div>
  </label>
