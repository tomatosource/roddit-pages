

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://youtu.be/yuLIXITF5f8?si=41txKPS_H782eS3u"><p>Jordan drops 32 points &amp; a career-high 18 rebounds on Seattle in 1997.</p>
</a>
    </h2>

    

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="nkbayg4" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>heat_fan_ | Raptors</div>
        <div>3 | an hour ago </div>
      </div>
      <label for="nkbayg4" class="commentText"><p>3 people fouling out in one game woah 😳 </p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nkbazm7" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>maxithepittsP | Lakers</div>
        <div>2 | an hour ago </div>
      </div>
      <label for="nkbazm7" class="commentText"><blockquote>
<p>Jordan shot <sup>10</sup>&frasl;<sub>28</sub> but finished 32 points, tied his career-high with 18 rebounds &amp; 2 assists with 8 turnovers.</p>
</blockquote>

<p>The 18 rebounds was impressive, but any other facet, this is a horrible performance.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nkbbu23" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Makaveli84 | Lakers</div>
        <div>1 | 41 minutes ago </div>
      </div>
      <label for="nkbbu23" class="commentText"><p>Jordan had to change his jersey midgame, remember watching the game back than</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nkbiynp" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>mbravens20</div>
        <div>1 | 3 minutes ago </div>
      </div>
      <label for="nkbiynp" class="commentText"><p>Context</p>

<p><a href="https://www.basketball-reference.com/boxscores/199703180CHI.html" target="_blank">https://www.basketball-reference.com/boxscores/199703180CHI.html</a></p>

<p>Then the match-up earlier in the season:</p>

<p><a href="https://www.basketball-reference.com/boxscores/199702020SEA.html" target="_blank">https://www.basketball-reference.com/boxscores/199702020SEA.html</a></p>

<p>Gary Payton did better in the second match up defensively, but the game was a classic &lsquo;90s physical rock fight and he struggled offensively. MJ basically single handedly won the 1st match up scoring nearly half his team&rsquo;s points and no one else scored in double figures.</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
