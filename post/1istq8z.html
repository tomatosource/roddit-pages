      <label for="mdkcl7b" class="commentText"><p>A rough guide to get you started if you want an easy setup flicker strike build. This is in no particular order.</p>

<p>Pivot your to build to use Resonance when you can.</p>

<p>Then, replace your auto attack or charged staff to use electrocute support gem. You can also run it using tempest or ice strike (I prefer auto attack as it is enough).</p>

<p>It&rsquo;s important you run the thunder/ice herald combo to ensure max clearing potential</p>

<p>Pick up a decent staff, preferably one that can do high ele dmg so you can either electrocute or freeze mobs faster.</p>

<p>Run Combat Frenzy to convert frenzy charges to power charges</p>

<p>Run Hand of Chayula with Sniper&rsquo;s mark as meta gem. Put profusion either here or combat frenzy. Sniper&rsquo;s mark generates a frenzy charge if you crit.</p>

<p>Your combo then goes:</p>

<p>hand of chayula -&amp;gt; auto attack for crit -&amp;gt; charged staff -&amp;gt; hand of chayula -&amp;gt; flicker strike</p>

<p>Enjoy spamming flicker strike!</p>

<p>Adjust your build accordingly if you need more crit, ele dmg, or atk spd.</p>

<p>If you are after automated power charges, that requires more setup. I recommend checking CrazyMrPipz on YouTube as he has done a really good breakdown of how to do it.</p>

<p>Edit: added more context for clarity.</p>
