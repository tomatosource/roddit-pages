    <h2>
      <a class="postTitle" href="https://www.nbcsportsboston.com/nba/boston-celtics/brad-stevens-trades-jayson-tatum-return-bold-predictions/740018/"><p>[Forsberg] A big Brad move, an early Tatum return and more bold Celtics predictions</p>
</a>
    </h2>

    

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="nkh7exa" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>SquimJim</div>
        <div>14 | a day ago </div>
      </div>
      <label for="nkh7exa" class="commentText"><p>I agree with pretty much all of these, except the steals and Minott thing. I&rsquo;m not convinced we make that massive of a leap in terms of steals. Minott I do think will be much improved and C&rsquo;s fans will be very happy with what he produces, but I&rsquo;m not sure if it&rsquo;s MIP votes level. I don&rsquo;t necessarily see him scoring enough to get that kind of recognition.</p>

<ul>
<li>JB to All-NBA team seems more attainable for him this year than most</li>
<li>White to block 100+ shots seems reasonable considering we have very little paint protection elsewhere</li>
<li><sup>40</sup>&frasl;<sub>40</sub> seems like it can be a by-product of PP/White both being able to launch 3&rsquo;s</li>
<li>Trade is most certainly likely by the trade deadline</li>
<li>Tatum returning at the end of February would be on the conservative end of his original return timetable</li>
</ul>

<p>The steals and MIP thing seem like the boldest predictions, but I the rest seem reasonable.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="nkhmxs9" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>downeastsun</div>
        <div>2 | 21 hours ago </div>
      </div>
      <label for="nkhmxs9" class="commentText"><p>14 guys have gotten MIP votes each of the last two years so I guess it&rsquo;s not impossible for Minott to get a vote or two if he really hits, but you&rsquo;re right that it&rsquo;s mostly a much higher level of player/scorer. He&rsquo;d probably have to win a starting job pretty quick here and play a ton to have any chance, Pritchard was the only guy on ballots last year who played fewer than 30 minutes a game.</p>

<p>I&rsquo;m not sure about Brown making All-NBA just because I&rsquo;m not sure how good the Celtics will end up being, and I assume they&rsquo;ll be pretty judicious resting him if he&rsquo;s dealing with an injury. Every All-NBA player the last two seasons except Curry, LeBron and Sabonis was a top 6 seed and those guys won 46-48 games. Cade last year had the team with the lowest win total at 44. The Celtics could wind up winning in the mid 40s and if they do JB would have a decent chance of getting rewarded, but I think the 41.5 over/under is fair and if they&rsquo;re around .500 he won&rsquo;t have much of a shot</p>
</label>
    </div>
  </label>
  
</div>

    
      
<div class="commentAndChildren">
  <input id="nkljn06" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>PebblyJackGlasscock | Second Round Pick Enthusiast</div>
        <div>2 | 3 hours ago </div>
      </div>
      <label for="nkljn06" class="commentText"><p>Xavier Tillman getting Comeback votes seems much more likely to me than Minott, after reading u/downeastsun post. Tillman’s gonna play a lot if healthy and might put up double-double numbers while filling out lots of “no one saw this coming” media takes.</p>

<p>Heck, if Queta gets one MIP vote this season will have been a wild success.</p>

<p>The <sup>40</sup>&frasl;<sub>40</sub> thing seems most likely if things have gone badly and a mid January game turns into a Pritchard-Simons shooting contest.</p>
</label>

<div class="commentAndChildren">
  <input id="nkhvrqu" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>CarBallAlex</div>
        <div>5 | 20 hours ago </div>
      </div>
      <label for="nkhvrqu" class="commentText"><p>I’m still sticking with Feb 8 for Tatum’s return. He’s publicly stated he wants to come back for a home game, it’s nationally televised on Super Bowl Sunday; a day where the NBA gets higher ratings (more viewers) than usual, and would be a huge statement if they beat the Knicks, who are one of the favorites in the East this year and beat the Celtics these past playoffs. Tatum returning and the Celtics winning the game would be a big part of the NBA media cycle heading into the All Star break.</p>

<p>If he cares about the optics of this like I think he might, he’s going to circle that date as the date he wants to return.</p>

<p>If the home game thing has any weight, the Celtics only home game in late February is a Friday locally broadcasted game against the Nets, which doesn’t really strike me as significant.</p>

<p>An Achilles is obviously a serious injury and shouldn’t be rushed, but I have a hard time believing there’s a significant difference between 9 months and 9 months and 2 weeks for his return.</p>

<p>If you want to argue his return should be pushed back to mid or late March, I think that may hold a lot more weight with being cautious.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nklbwgj" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>burner_for_celtics | \/\/ I CELTICS</div>
        <div>2 | 4 hours ago </div>
      </div>
      <label for="nklbwgj" class="commentText"><p>I think that Pritchard is going to hit ~25% usage and play more than 2500 minutes this season.</p>

<p>My boldest prediction, though, is not that he will do this. Health permitting, he will definitely do this&hellip; and he&rsquo;s a great health bet. The bold prediction is that in doing so he&rsquo;s going to be a top-10 vote getter for the east backcourt and a strong bet for all-star reserve, MIP, or both.</p>

<p>Right now, everyone knows Payton Pritchard is a good player but I don&rsquo;t think anyone would dream of putting him on a tier with the East&rsquo;s best guards. That tier is probably Brunson, Young, Mitchell, Garland, and Cunningham, with Maxey, White, and Herro at the fringe and Lamelo Ball a wildcard.</p>

<p>The difference between Pritchard and those guys is usage. He played as many minutes as most of them last season and he was right up there with them, statistically, in all of the ways that usually matter. The difference is he was a 20% usage guy and they are 30% usage guys.</p>

<p>A skeptic would say that you can&rsquo;t just scale up production like what Pritchard did last year. It seems unlikely, but go find me a guard that put up a vorp=3 season who <em>didn&rsquo;t</em> go on to make an all-star game in his career. I&rsquo;m here on bball ref thumbing through the last decade-plus and Eric Bledsoe is the only exception I&rsquo;ve found so far</p>
</label>
