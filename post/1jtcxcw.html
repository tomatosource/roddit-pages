

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/rbvbnfizacte1.png"><p>Let them eat cake</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/rbvbnfizacte1.png" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="mltbfaj" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>NihilHS</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="mltbfaj" class="commentText"><p>People want the maps to be smaller so they can trivialize the campaign as much as possible. They just want to be through it as fast as possible.</p>

<p>Ggg is set on making the campaign more challenging and imo therefore more interesting. To that end map size is not a problem. It’s only really a problem to folks who are Poe 1 brained and view the campaign as essentially skippable.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="mltbkqp" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Itchy_Training_88</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="mltbkqp" class="commentText"><p>Tedium ≠ challenging</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="mltbvdg" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>NihilHS</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="mltbvdg" class="commentText"><p>They didn’t merely make the poe 2 campaign more tedious. It’s harder than Poe 1’s - significantly so. Frankly I got bored from poe 1’s campaign because the combat loop was identical from nearly the start to finish.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="mltch3q" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Fun-Asparagus4784</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="mltch3q" class="commentText"><p>It&rsquo;s not why do you guys say this? There&rsquo;s a massive difference between when you kill merveil with galvanic arrow, get tailwind, have to readjust res after Kitava 5, get your 4 links and high MS boots in mid acts, and when you get ascendancy 2 and 3. And also, what&rsquo;s your POE 1 a10 time on leaguestart if its so easy for you?</p>
</label>
    </div>
  </label>
  
</div>

    
      
<div class="commentAndChildren">
  <input id="mltcfwp" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>FuzzyDyce</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="mltcfwp" class="commentText"><p>If you don&rsquo;t find it hard it&rsquo;s because you&rsquo;re going too slowly.</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

    
  </div>
  
</div>

    
      
<div class="commentAndChildren">
  <input id="mltg8jr" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Nubbynubbow</div>
        <div>1 | 16 minutes ago </div>
      </div>
      <label for="mltg8jr" class="commentText"><p>When map are too large you introduce things like backtracking. If you miss an objective you are now punish with 1-2min of just running.</p>

<p>To illustrate, there is a map in act 3 where you are suppose to get 2 medium soul core put them in two generatot and then come back to the beginning of the map to fight the boss.</p>

<p>This can easily be split into 3 map. The map itself is design to look like a maze. Navigating through 3 small maze is way less tedious than 1 giant map. To make matter worst the soul core are put at strange location to make backtracking even worst.</p>

<p>On release no checkpoint is annoying as hell. Putting checkpoint break immersion of the game and make running the map pathing involved move around the checkpoint.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="mltgluk" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>NihilHS</div>
        <div>1 | 13 minutes ago </div>
      </div>
      <label for="mltgluk" class="commentText"><p>Checkpoints solve this issue.</p>

<blockquote>
<p>To illustrate, there is a map in act 3 where you are suppose to get 2 medium soul core put them in two generatot and then come back to the beginning of the map to fight the boss.</p>
</blockquote>

<p>Though I agree this specific area can be obnoxious even with checkpoints.</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

    
      
<div class="commentAndChildren">
  <input id="mltgrb7" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>ldierk</div>
        <div>1 | 11 minutes ago </div>
      </div>
      <label for="mltgrb7" class="commentText"><p>Calling the PoE1 campaign skippable is a bit of a stretch.</p>
</label>
    </div>
  </label>
  
</div>

    
      
<div class="commentAndChildren">
  <input id="mlthnrj" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>DuckSlapper69</div>
        <div>1 | 3 minutes ago </div>
      </div>
      <label for="mlthnrj" class="commentText"><p>The campaign sucks ass. No one wants to repeat it. That&rsquo;s not what the game is or ever has been. The only reason POE1 forces you to redo the God damn campaign each time is because GGG thinks they want to remake D2. If I wanted to play fucking D2, then I&rsquo;d play D2.</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

        
      
    </div>
  </body>
</html>
