.postTitle {

.commentAndChildren > .commentList {

}

}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;

}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;

.selfPostContainer {

.tweetContainer {

  justify-content: center;

<div class="commentAndChildren">

      </div>
      <label for="m1y5s7m" class="commentText"><p>Article on Clippers defense, with thoughts from Derrick Jones Jr. Excerpt:</p>

<blockquote>
<p>Baked into the Clippers’ defensive formula is finishing possessions the right way — not allowing second and third opportunities for the opponent. When any team is missing a shot creator (and cheat code) of Leonard’s caliber, they have to win the possession battle. It creates a friendlier margin for error, giving their offense enough bites at the apple to make up for the talent disparity in some matchups.</p>

<p>Collecting <a href="https://www.nba.com/stats/teams/advanced?DateTo=12/10/2024&amp;dir=A&amp;sort=DREB_PCT" target="_blank">nearly 74% of opponents’ misses</a>, LA is the best defensive rebounding unit in the league. With Zubac having a career year in many respects — which makes sense considering he’s squarely in his prime at age 27 — his increased impact as a rebounder has paid dividends for the team’s defense. Among all 169 players to average at least 25 minutes of playing time, Zubac <a href="https://www.nba.com/stats/players/advanced?CF=MIN*GE*25&amp;DateTo=12/11/2024&amp;dir=A&amp;sort=DREB_PCT" target="_blank">ranks fifth</a> in defensive rebound rate.</p>
</blockquote>
</label>

      <label for="m1y7ccz" class="commentText"><p>It&rsquo;s been mostly very good so far, but we&rsquo;re going to struggle on the defensive end now with both DJJ and Mann being out.  </p>

<p>Amir Coffey is alright on defense, but the other guys seeing a bump in minutes (KPJ, Jordan Miller, Bones Hyland) are offense-only players.</p>
