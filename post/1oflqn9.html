

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://v.redd.it/mwlgd8jjm7xf1"><p>I really think everyone was exaggerating, abyss mobs aren&rsquo;t that bad on melee&hellip; oh what, what the hell plz stop I&rsquo;m not even armed!</p>
</a>
    </h2>

    

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="nl9x3yv" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>abhinav21</div>
        <div>1 | 38 minutes ago </div>
      </div>
      <label for="nl9x3yv" class="commentText"><p>Use falling thunder with the support gem which gives it combo + the support gem which give 100% crit and builds stages.</p>

<p>Super useful in these scenarios</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nl9y8tu" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Osteinum</div>
        <div>1 | 27 minutes ago </div>
      </div>
      <label for="nl9y8tu" class="commentText"><p>I think the abyss bosses are 15% overturned, also for my sorc. I have to sneak up onto them, attack and then run as he&rsquo;ll. Some of those attacks eat through my 8,5 ES as it was candy, and the dot damage makes it take forever before my ES start recharging. I don&rsquo;t like abyss</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nl9z0z0" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>jossief1</div>
        <div>1 | 19 minutes ago </div>
      </div>
      <label for="nl9z0z0" class="commentText"><p>Abyss is a bit of a fun challenge for experienced players, and would probably just make absolute beginners quit the game and never come back, compared to my experience starting off in 0.1.</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
