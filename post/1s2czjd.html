

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://blogs.fangraphs.com/effectively-wild-is-going-freemium/"><p>Effectively Wild is Going Freemium</p>
</a>
    </h2>

    

    <div class="commentList">
      
        
      
        
          
<div class="commentAndChildren">
  <input id="oc7as6i" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Electrical_Yard_284 | MLB Pride</div>
        <div>3 | 13 minutes ago </div>
      </div>
      <label for="oc7as6i" class="commentText"><p>It seems like a mistake to not make this part of a FanGraphs paid membership, but what do I know? I find both the FanGraphs written content and Effectively Wild to have drifted pretty far in tone from what I loved about the whole undertaking for years, but fair enough, times change. </p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="oc77nte" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>SoftcastIeMcCormick | Chicago Cubs</div>
        <div>3 | 29 minutes ago </div>
      </div>
      <label for="oc77nte" class="commentText"><p>Still two free pods a week, you just need to be a subscriber for the third each week and the monthly off topic pod. Ben has to pay for all those eggs somehow.</p>

<p>I listened for free for years and years. Finally starting contributing last year.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="oc7bxxy" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>GKRForever | New York Mets</div>
        <div>1 | 7 minutes ago </div>
      </div>
      <label for="oc7bxxy" class="commentText"><p>They are the only sports podcast I listen to that doesn’t do ads, and particularly shuns sports betting ads.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="oc7cib7" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Old_Condition_8250 | Brooklyn Cyclones</div>
        <div>3 | 4 minutes ago </div>
      </div>
      <label for="oc7cib7" class="commentText"><p>This is fair, it makes sense, and as someone who already struggles to pay the bills, well, enjoy folks. I want creators to get what they deserve, and I genuinely don’t oppose this change, but I also hope people can see that monthly subscriptions add up fast and a $10/month lowest tier is financially prohibitive for an awful lot of us. </p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
