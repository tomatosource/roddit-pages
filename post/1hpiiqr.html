      </div>
      <label for="m4hxj0p" class="commentText"><p>I said earlier in the year that we needed to address the big depth and that Kornet and Queta weren&rsquo;t going to be sufficient and I was absolutely roasted for it.</p>

<p>That&rsquo;s starting to show up now, especially playing some better teams. We have no paint protection whatsoever without Porzingis and that was a problem during the playoffs too.</p>

<p>Our guards aren&rsquo;t fast, pretty much everyone in the NBA knows that they can blow right by our players, including our wings and its a free lane to the rim. When Porzingis is in the game, the gameplan is to get him as far away from the rim as possible and get him on skates, which is also how he keeps getting hurt.</p>

<p>Joe needs to adjust and Brad needs to bring in more big depth.</p>

<p>We&rsquo;re also now in our longest sustained shooting slump since our big 5 was put together.  And it&rsquo;s weird that we constantly go away from players who are in rhythm. Pritchard and Hauser were nailing 3s, but for some reason we kept feeding Horford, just as we kept feeding Holiday. We let specific players shoot out of games rather than to adjust. And just hope that they get hot eventually and it&rsquo;s never the natural 3pt shooters.</p>

<p>If Kornet can&rsquo;t/won&rsquo;t shoot open 3s, he&rsquo;s pretty much useless offensively. He has terrible hands and is a poor finisher at the rim. Queta is a massive liability on defense.</p>

<p>Horford is really good at some things but he isn&rsquo;t a rim protector. And if his 3s aren&rsquo;t falling he gives us very little on offense.</p>

<p>As a result the bigs are giving us close to nothing right now except a huge hole in our offense and defense.</p>
</label>
