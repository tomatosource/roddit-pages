

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>

    <div class="commentList">

</div>

        
      
        
          
<div class="commentAndChildren">

        <div>1 | 32 minutes ago </div>

      <label for="nfrzzw0" class="commentText"><p>VERY IMPORTANT NOTICE TO THOSE WHO CANT READ, SUCH AS ME.</p>

<p>I was running a map with the Amelioration Omen active, as I died one to many times at lvl 90 and could not bear losing more exp.</p>

<p>Well, I got a map where I had the fire candle head boss, and as you know he has a move where he shoots like 50 fire projectiles from his head. Well this map had + extra chaos damage and +2 projectiles for monsters. Needless to say, he used the 50 fire projectiles move, which became a 50000 projectiles chaos ass storm, my 2k hp and 8k ES literally instantly disappeared and I died in a tenth of a second to said ass storm.</p>

<p>&ldquo;No biggie&rdquo; I thought to myself, I had my omen on, just a happy accident as Bob Ross would say. 2.5% exp is all i lost. I slapped on a fresh omen and went back in, and he then obliterated me with the same move almost instantly.</p>

<p>Well what do you know, I lost full exp, 10%.</p>

<p>The omen only works once per map. If you die in a map, purchase another, and go back in, IT WILL NOT reduce your exp loss again. Once. Per. Map. You get 1 proc per instance.</p>
</label>
    </div>
  </label>
  
</div>

        <div>1 | 20 minutes ago </div>
      </div>
      <label for="nfs2hgl" class="commentText"><p>omen of emilia watson</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
