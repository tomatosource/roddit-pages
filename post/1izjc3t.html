

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
}

.selfPostContainer * {
  color: white;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/jbkum4t6hple1.jpeg"><p>Need help with Heroic Tragedy Timeless Jewl</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img src="https://i.redd.it/jbkum4t6hple1.jpeg" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="mf3bctz" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>morbel__</div>
        <div>2 | 3 hours ago </div>
      </div>
      <label for="mf3bctz" class="commentText"><p>if you’re chasing nodes that are ones that come from converting notables with heroic jewel it’s pure gamble. you have to check all your jewel slots and see if any of the notables change to the one you want. if you need it in a specific area it’s gonna be hard. because the number of song worthy deeds is a seed that is directly linked to your characters passive tree. If i took your exact same jewel, exact same song worthy deeds and put it in the same slot, the changed notables would be completely different. the one i use provides 2 40% minion dmg nodes in one spot but if you put it there it’s more than likely that neither of those minion nodes will show. so that being said you have to div it and keep checking the nodes if you need it in this specific slot. divving it will change the song worthy deeds and with it the seed of the jewel</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="mf3hwzb" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Binzenjo</div>
        <div>3 | 2 hours ago </div>
      </div>
      <label for="mf3hwzb" class="commentText"><p>This game is absolutely mental with how rng it is and the almost limitless variety of builds on offer.  Seems like you could never really balance a game like this, and that&rsquo;s what I really like about it.  I&rsquo;m amazed that I never gave the original PoE a shot, I was always very sceptical of free to play games and just saw them as microtransaction farms.
I was wrong.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="mf3i84y" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>morbel__</div>
        <div>1 | 2 hours ago </div>
      </div>
      <label for="mf3i84y" class="commentText"><p>exactly !!! neither can i. i remember middle school home room one of my other pc gaming homies told me poe was the game to play but i didn’t touch it til the second release and i’m so addicted. limitless build options obviously the more currency you have /make just throw money at problems mix it with experienced players advice and see where. gets you</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="mf3fv0f" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Kale1803</div>
        <div>2 | 2 hours ago </div>
      </div>
      <label for="mf3fv0f" class="commentText"><p>My understanding is that you need the gem with &ldquo;Vorana&rdquo; in the description for the node to change to circular teachings the number doesn&rsquo;t matter. That worked for me at least.</p>

    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="mf40l3l" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>TheTuf</div>
        <div>1 | 10 minutes ago </div>
      </div>
      <label for="mf40l3l" class="commentText"><p>The big node is always the same with the same name jewel. The numbers only affect the passive nodes randomized. If you only care about circular teachings, any number with the correct name (Borna in this case) would work for you.</p>

    </div>
  </body>
</html>
