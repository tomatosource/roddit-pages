

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>

		<img class="selfPostImage" src="https://i.redd.it/nuvh35bw231g1.png" />

<div class="commentAndChildren">

<div class="commentAndChildren">

    <div class="comment">
      <div class="commentHeader">
        <div>RigorousMortality</div>
        <div>1 | 37 minutes ago </div>
      </div>
      <label for="noq2n8g" class="commentText"><p>Based on your total Honour, I&rsquo;d say you attempted this early.</p>

<p>I typically don&rsquo;t attempt my first trial until just before the act 2 boss, or The Dreadnaught unless I feel my character is fairly strong. There are gear level requirement breakpoints that means you could get a higher level for overall better access to gear by waiting a little further into the campaign. For the most part the first two ascendancy points aren&rsquo;t going to give you a massive power spike early game, waiting won&rsquo;t hurt your ability to clear content.</p>

<p>I say this because the area(monster) level of the first quest trial is 22, and it is far easier to stomp on stuff 5+ levels lower than trying to push through at an equal or lower level. As I said, I&rsquo;ll usually do the first trial at 28+. The second, Trial of Chaos, I tend to do mid to late 40&rsquo;s when it has a level of 38.</p>

<p>Also if this is one of your first overall attempts it will seem hard as you do not have any relics to improve your chances except the first one given. You likely don&rsquo;t know all of the enemies, challenges or other basics to surviving that will make it easier as you do learn them.</p>

<p>Keep trying or just hold off for more gear, as better defenses mean more honour, and you&rsquo;ll eventually succeed.</p>
</label>
    </div>
  </label>

  </body>
</html>
