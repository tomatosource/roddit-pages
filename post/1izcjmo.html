

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
}

.selfPostContainer * {
  color: white;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/d87hl0yypnle1.jpeg"><p>What happens to standard after leagues are over? (Had to repost because I typed the G word..)</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img src="https://i.redd.it/d87hl0yypnle1.jpeg" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="mf1q6s3" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Scaridium</div>
        <div>1 | 11 minutes ago </div>
      </div>
      <label for="mf1q6s3" class="commentText"><p>the vast majority of players just let their characters rot, or delete them outright to save space, once moved to standard. There&rsquo;s a much much much smaller economy on standard and even fewer people to actively play with. If you want an active playerbase you play on seasonal leagues.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="mf1r70c" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Environmental_Ad9017</div>
        <div>1 | a few seconds ago </div>
      </div>
      <label for="mf1r70c" class="commentText"><p>So if i am playing SSF, this doesnt matter right?</p>

<p>Do league mechanics transfer to standard after they end? Or is standard the forever base game?</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="mf1r5sv" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Exoskeleton78</div>
        <div>1 | a minute ago </div>
      </div>
      <label for="mf1r5sv" class="commentText"><p>Most likely the hardcore players will move to the league and delete characters to save character slots.</p>

<p>There definitely will be a smaller trade economy on standard non league and builds nerfed. Not sure if new content will get added to standard non league</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
