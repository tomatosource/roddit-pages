        <div>Edge4o7</div>
        <div>1 | 40 minutes ago </div>
      </div>
      <label for="o0qtowh" class="commentText"><p>Archmage damage scales with max mana and they usually run spark so t1 +mana +% mana and the lightning damage plus the all resist is really nice for that build, so that&rsquo;s why it&rsquo;s worth so much. You undercut a similar ring by 100 div so yeah obviously you undervalued it a bit. I haven&rsquo;t played in a few weeks so I don&rsquo;t know the prices of similar rings to give it an actual value, but there&rsquo;s no penalty for putting things up that don&rsquo;t sell. So in the future just undercut by like 1 div if you&rsquo;re looking for a quick sale, or if you think your ring is better than similar on the market, go higher (amount varies, but when you have something like this and in this crazy economy you might as well go up 100 or 200 divs) and you can slowly lower the price every day or whatever. Depends on how fast you want to sell it.</p>
</label>
