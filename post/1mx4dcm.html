

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://www.reddit.com/gallery/1mx4dcm"><p>Wanna make &ldquo;blackflame chayula&rdquo;, but im so noob(1 month-played)</p>
</a>
    </h2>

    

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="na2bfp8" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>LampIsLoveLampIsLife</div>
        <div>1 | 2 hours ago </div>
      </div>
      <label for="na2bfp8" class="commentText"><p>I had a similar idea but until we see all the new support gem changes/additions, the only way to gain stacks of volatility are through empowered attacks or crits, and I don’t think a spell based chonk can do either reliably enough to stack volatility well enough to make this viable</p>

<p>My thoughts are that if we get a way to stack volatility on hit instead of on crit, ember fusillade + orb of storms has potential</p>

<p>Ember fusillade’s multiple hits will then be good at both stacking volatility and triggering the 8 hits needed for the lightning infusion from orb of storms, and we can put catharsis on orb of storms to detonate our volatility for a simple two button combo that feeds into one another</p>

<p>Not sure what would be best for CoEA yet, but I was thinking snap for the additional damage + faster infusion procs from orb of storms</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="na2edcb" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Baerchna</div>
        <div>1 | 2 hours ago </div>
      </div>
      <label for="na2edcb" class="commentText"><p>Well we do know that Chonk can gather volatility by applying elemental ailments.</p>

<p>You can scale how many ailments you can apply by</p>

<ol>
<li>applying lots of different ailments<br>
</li>
<li>shorten the duration of ailments so they can be reapplied (though that will be harder with the longer ailment times on the new patch)<br>
</li>
<li>consume ailments so they get reapplied fast.</li>
</ol>

<p>A trigger setup where one spell applies ignites and the other consumes them (like firestorm) comes to mind.</p>

<p>The &lsquo;elemental discharge support&rsquo; also consumes elemental ailments, which enables this on any spell that hits enemies.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="na2mv54" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>rohithkun</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="na2mv54" class="commentText"><p>There is also snap. which consumes elemental ailments and triggers an explosion</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

    
      
<div class="commentAndChildren">
  <input id="na2satq" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>tokyo__driftwood</div>
        <div>1 | 22 minutes ago </div>
      </div>
      <label for="na2satq" class="commentText"><blockquote>
<p>are through empowered attacks or crits,</p>
</blockquote>

<p>Doesn&rsquo;t need to be attacks. You can empower spells with mana tempest and then spam ember fusillade for very fast and reliable volatility stacking</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

        
      
    </div>
  </body>
</html>
