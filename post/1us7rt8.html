      <label for="owne7z3" class="commentText"><p>Heres the Pob: <a href="https://maxroll.gg/poe2/pob/cw84lz0x" target="_blank">https://maxroll.gg/poe2/pob/cw84lz0x</a></p>

<p>To expand a bit, it uses Arctic howl as a main damage dealer, but since theres so few options to increase its damage i opted for a cast on crit frost dart with a Eventide Petal setup. With our warcry speed, combined with the massive number of frost darts we can generate, we trigger a lot of Crystals from the Eventide amulet, which in turn we always explode with warcries.</p>

<p>Basically that setup is to increase single target damage.</p>

<p>It used self hit from infernalist to trigger reverse chill.</p>

<p>For defense we use a 7% recover per warcry coupled with recoup. As long as you keep crying you dont die because we recover ~110% of life each second and we have a ton of recoup because of the constant self hits we inflict. Plus this helmet&rsquo;s rune which gives 10% of life as guard each time we take a savage hit, which we always do, so its always up.</p>

<p>Made a vid a while back, it since got improved but it shows what it can do: <a href="https://www.reddit.com/r/PathOfExile2/s/SRMew6i7c2" target="_blank">https://www.reddit.com/r/PathOfExile2/s/SRMew6i7c2</a></p>

<p>However, its pretty much a meme build. Some very intricate interactions. Not cheap. The poe ninja numbers are absolute garbage, as so much of the offense and defense works by windup. The recoup for example, and the passive notable 8% increased damage per warcry recently. Rage generation as well. It cant dodge roll because we need unwavering stance, because being stunned for even 0.2 second means we lose massive life recovery and our max hit is very low, plus we have no other defenses whatsoever.</p>
