

<html>

    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>

edit: and flat lightning (because higher base compare to chaos)</p>

  </label>

      <label for="ogh1ivr" class="commentText"><p>He is right the only exception is The Note (black flame) it only counts as chaos dmg and since chaos res is rare it will deal more in most cases but still scales with fire dmg</p>

<p>But if it says convert you have to stack the type of dmg it gets converted too</p>

<div class="commentAndChildren">

    <div class="comment">
      <div class="commentHeader">
        <div>PipSqu3ak95</div>
        <div>1 | 7 hours ago </div>
      </div>
      <label for="ogjbgin" class="commentText"><p>Basically: Base damage &amp;gt; Conversion &amp;gt; addative multipliers &amp;gt; multiplicative multipliers.</p>

<p>Most builds have at least these 3 axis of scaling damage.</p>

<ol>
<li>Base damage<br>
</li>
<li>Addative increases<br>
</li>
<li>Multiplicative increases</li>
</ol>

<p>In your case, you are unable to scale lightning damage since you are converting it to chaos.</p>

<ol>
<li>Base damage of any type (physical, elemental or chaos) will still increase your damage, but lightning and chaos are the most efficient. Because a single set of additive or multiplicative modifiers can scale both damage types at once after conversion.<br>
2 &amp; 3. Lightning damage addative/multiplicative multipliers do not work since you are converting lightning &amp;gt; chaos. You r unable to modify damage type after conversion.</li>
</ol>

<p>Base damage &amp;gt; Conversion &amp;gt; addative multipliers &amp;gt; multiplicative multipliers.</p>
</label>

  </label>
  
</div>

      <label for="ogh83kb" class="commentText"><p>Not just bow, flat damage from rings/gloves is also converted.</p>
</label>
    </div>

<div class="commentAndChildren">
  <input id="oghymwd" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>MildStallion</div>
        <div>2 | 11 hours ago </div>
      </div>
      <label for="oghymwd" class="commentText"><p>It&rsquo;s annoying cause weapons can <em>also</em> have local conversion (which is how the elemental/chaos base types are made, the modifier is just hidden). This gives us three potential layers of conversion: weapon (local), skill, and global. The weapon local conversion also happens before its local damage mods so it doesn&rsquo;t really look or behave any different from the base just having two different flat damage types from the start.</p>

<p>The conversion on this unique is global though, yes, so all damage from all sources is converted (except &ldquo;As Extra&rdquo;, which is as usual doesn&rsquo;t convert). In fact, it should even convert spell damage for spells used while the weapon is equipped.</p>
</label>
