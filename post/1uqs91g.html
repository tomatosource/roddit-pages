

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/b0gbmp1w80ch1.png"><p>Dropped thing right now from genesis tree. What do I do with this?</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/b0gbmp1w80ch1.png" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="owa8kko" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Past_Departure_4850</div>
        <div>3 | 4 hours ago </div>
      </div>
      <label for="owa8kko" class="commentText"><p>You can desecrate one mod and have 6 options to choose from ( 3 and another 3 if you use omen of echoes ) and the last one is pretty much rng greater exalt slam.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="owagc8v" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Nihilistic__Optimist</div>
        <div>2 | 3 hours ago </div>
      </div>
      <label for="owagc8v" class="commentText"><p>Check here: <a href="https://poe2db.tw/us/Rings#ModifiersCalc" target="_blank">https://poe2db.tw/us/Rings#ModifiersCalc</a></p>

<p>This lists all the potential modifiers you can roll. It helps give you an idea of what you can shoot for. In this case, you already have  3 suffixes on the ring, so your last 2 rolls are only going to be prefixes. But if you are shooting for a certain abyssal prefix, you can try to get that with the correct omen (kurgal, amanamu, etc).</p>

<p>Otherwise, as mentioned here, just desecrate/reveal a modifier and slam a greater/perfect exalt and hope for the best.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="owbh3sd" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Alienclapper | Buff Bows</div>
        <div>1 | 19 minutes ago </div>
      </div>
      <label for="owbh3sd" class="commentText"><p><img src="giphy|08y87EiwDZjjB0d6WJ" alt="gif" /></p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
