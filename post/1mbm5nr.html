

<html>

    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>

    <h2>
      <a class="postTitle" href="https://i.redd.it/cc3uehxzdnff1.png"><p>We&rsquo;re missing 2 very obvious/thematic designs for a &ldquo;chase&rdquo; Helmet/Shield-only Rune</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/cc3uehxzdnff1.png" />

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="n5n3kh5" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>StalksYouEverywhere</div>
        <div>1 | 15 minutes ago </div>
      </div>
      <label for="n5n3kh5" class="commentText"><p>Remember you cannot equip 10 of these, since they are equipment-type bound (like many existing runes) you can only get a maximum off:</p>

<p>Helmet 1x rune (or 2x on a corrupted +1 socket)</p>

<p>Shield: 2x runes (or 3x on a corrupted +1 socket)</p>

<p>So at most you would be able to get 1-2 extra skillpoints from the helmet, or for the shield 4%-6% extra maximum block (which is similar to the already existing unique &ldquo;the anvil&rdquo;)</p>

<hr>

<p><strong>Rune of Secrets</strong></p>

<p>Helmet slot only: +1 Passive Skill Point</p>

<p>Its a helmet rune/talisman ** since you wear it on your head, it makes you more knowledgeable (+1 skill point)**, totally thematic, it&rsquo;s a no brainer that it would give +1 skill point.</p>

<p>It&rsquo;s powerful enough to be a chase drop and have a valid use-case, but not too powerful, it&rsquo;s flavorful and makes sense in universe that a rune/talisman on your head would make you more knowledgeable.</p>

<hr>

<p><strong>Rune of Endurance</strong></p>

<p>Shield slot only: +2% to maximum block chance</p>

<p>If you&rsquo;re wearing a shield you probably want block chance. Currently most shields have some block chance already on them or roll increased % block chance, but there isn&rsquo;t really many sources of <strong>maximum</strong> block at all. This gives a way to gain some maximum block chance, while making sure it&rsquo;s not too powerful since you&rsquo;re only limited to this rune/talisman in the shield slot.</p>
</label>
