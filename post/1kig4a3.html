

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://v.redd.it/ky5i07z1rqze1"><p>Stuttering, Lag Spikes and delays</p>
</a>
    </h2>

    

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="mrehmlz" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Pure_Quail_1210</div>
        <div>2 | 3 hours ago </div>
      </div>
      <label for="mrehmlz" class="commentText"><p>This happens when I am on the London server.</p>

<p>Go to character selection, then go to settings&amp;gt;general. And change &lsquo;auto&rsquo; to Amsterdam for example.</p>

<p>London server always does this to me, same counts for Moscow</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="mrej66m" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>EnglishGamerTag</div>
        <div>1 | 3 hours ago </div>
      </div>
      <label for="mrej66m" class="commentText"><p>I use London a lot, I can have really good night&rsquo;s and then I can have really bad night&rsquo;s.</p>

<p>Definitely something that GGG needs to look at</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="mrekevr" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Ghostyfear</div>
        <div>1 | 3 hours ago </div>
      </div>
      <label for="mrekevr" class="commentText"><p>I feel like this is server side, but if you want to try something different other then what other people suggested try switching chat channels, use /trade /global and a random big number after. I had micro stutter every time someone linked a lot of items in global or trade chats and that helped.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="mrev3ny" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>B-unit79</div>
        <div>1 | 2 hours ago </div>
      </div>
      <label for="mrev3ny" class="commentText"><p>Mine has been like this since the loot patch.  Feels like my machine is struggling but its working fine in a lot of other more modern games.  Makes the game feel clunky and unplayable for me.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="mrey8j8" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Tarcun</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="mrey8j8" class="commentText"><p>Same issue here</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
