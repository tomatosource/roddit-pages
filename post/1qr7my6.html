      <label for="o2m3hgi" class="commentText"><p>Mathematically speaking it would cost more to make them if you intended to with the vaal being 1 in 24, or if you want to try to hit it on the Architect Orb its <sup>1</sup>&frasl;<sub>28</sub>. If you were to craft the gloves and use locks it would cost more than 2 mirrors. You&rsquo;d also go for %es and flat es rather than flat and hybrid, probably, so yours aren&rsquo;t &ldquo;the best&rdquo; base before the corruptions. Plus its not perfectly divined.</p>
