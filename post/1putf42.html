    <div class="commentList">
      
        
          
<div class="commentAndChildren">

      <label for="nvr3odv" class="commentText"><p>From Chris Forsberg:</p>

<p>Merry Christmas, Celtics fans. Boston doesn&rsquo;t have a game on the NBA’s marquee day for the first time in a decade, but we suspect it will only be a one-year holiday hiatus. Heck, if the league could flex the Celtics into the Cavaliers&rsquo; spot on Thursday, they probably would.</p>

<p>Instead, you can spend the 25th savoring the strides these Celtics have made since a jarring summer overhaul. Think about how hazy the future appeared after all the summer changes, and contrast that with <a href="https://www.nbcsportsboston.com/nba/boston-celtics/brad-stevens-press-conference-takeaways-jayson-tatum/754592/" target="_blank">the optimism that flows about where this team is headed</a>.</p>

<p>It’s easy to get caught up in the wins and losses &ndash; the fact that Boston sits seven games over .500 and in third place in the Eastern Conference with a third of the season in the rearview is encouraging on its own &ndash; but the real victory here is just how bright the future appears.</p>

<p>Jaylen Brown has muscled himself into the MVP conversation while <a href="https://www.nbcsportsboston.com/nba/boston-celtics/live-updates-pacers-highlights-score/755736/" target="_blank">making 30-point nights seem routine</a>. <a href="https://www.nbcsportsboston.com/nba/boston-celtics/brad-stevens-jayson-tatum-injury-update-return-timeline/754490/" target="_blank">Jayson Tatum has attacked his rehab</a> from Achilles surgery and has a chance to at least ponder a return in a season most thought he’d miss entirely. Boston’s entire cluster of young wings, including recent draftees Jordan Walsh, Baylor Scheierman, and Hugo Gonzalez, <a href="https://www.nbcsportsboston.com/nba/boston-celtics/hugo-gonzalez-stats-highlights-rookies/755653/" target="_blank">have all impacted winning</a> far more than anyone could have expected to this point.</p>

<p>Joe Mazzulla is pushing all the right buttons, and while he’d be the first to suggest that <a href="https://www.instagram.com/nbcsboston/reel/C8KyvrwCZtN/" target="_blank">nobody cares</a>, he deserves to be in the way-too-early conversation for Coach of the Year. And if they keep their foot on the accelerator heading into calendar year 2026, the Celtics could give president of basketball operations Brad Stevens <a href="https://www.nbcsportsboston.com/nba/boston-celtics/brad-stevens-nba-trade-deadline-approach/752889/" target="_blank">even more motivation to seek big man help</a> that would bolster the roster for a stretch run.</p>

<p>&hellip; The longer-term future is even more tantalizing. It’s fair to daydream about what a Tatum/Brown combo is capable of when, 1) Tatum has fully shaken rust from his Achilles rehab and 2) Teams can’t load up on Brown again with Tatum back on the floor.</p>

<p><a href="https://www.nbcsportsboston.com/nba/boston-celtics/storylines-jaylen-brown-hugo-gonzalez-potential/756043/" target="_blank">Read more here</a>.</p>
