

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/3iu81j0ltpfg1.png"><p>2H Mace Crafting Help</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/3iu81j0ltpfg1.png" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="o1ub376" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>GeorgeHarringtonRed</div>
        <div>1 | 15 minutes ago </div>
      </div>
      <label for="o1ub376" class="commentText"><p>Desecrate a prefix now and reveal with out an echo and pray you hit %phys. When you dont. Annul down. Continue chaos spamming until you hit t1-t3 %phys. Hybrid with accuracy is not very desirable. Then add a shitter suffix and remove with dextral crystallization + perfect essence of gain as phys. Then slam 3 suffixes and rotate perf essence of battle, perfect essence of haste, essence of the abyss with a dextral crystallization until all 3 are on as suffixes. Then jawbone and reveal with echo. You can omen of light this last stat forever. This gives you t1 flat, t1-t3 %phys, about 30% gain as phys, +5 all attack skills, onslaught on kill, and a desecrate effectively guaranteed. This is basically the way for all none crit martial weapons.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="o1ub9pr" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>MTosti92</div>
        <div>1 | 14 minutes ago </div>
      </div>
      <label for="o1ub9pr" class="commentText"><p>I’d say it’s nice to see the T1 hybrid mod, but in terms of total cost, it’s much more beneficial to get the T1 phys roll through chaos (will probably take your 4K+ chaos orbs on average). The T1 phys % mod has a weight of <sup>25</sup>&frasl;<sub>114</sub>,305 (or 1:4,572 odds). So hoping to get this through another slam, whittle, or desecrate is negative EV.</p>

<p>I’d chaos to T1 phys %, save your desecration for T1 fire damage or T1 phys hybrid.</p>

<p>Not sure what you want on suffixes, but using essence of battle/haste loop at least guarantees your attack skills and onslaught.</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
