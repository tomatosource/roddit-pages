<div class="commentAndChildren">
  <input id="nh8mkkb" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Blicktar</div>
        <div>6 | an hour ago </div>
      </div>
      <label for="nh8mkkb" class="commentText"><p>Light is the only 100% way to get it done. If you whittle, you could hit T1 accuracy and then you&rsquo;re operating off an expensive <sup>1</sup>&frasl;<sub>3</sub> annul to remove it.</p>

<p>You&rsquo;re super unlikely to hit a high tier of % phys - Very low weight. T3+ flat fire is 750 weight total, T3+ %phys is 175 weight total.</p>

<p>The math on ancient jawbone vs. normal jawbone is gonna depend on the prices for both lights and ancient jawbones. Personally I&rsquo;d probably ancient - As light get more expensive (I expect this to be the trend forever), ancient jawbones are more and more worth paying for, because every miss costs you more.</p>

<p>Edit: Some quick sim results - About a 26% chance of hitting T3+ flat fire or % phys with ancient jawbone, per reveal. With normal jawbone, you&rsquo;re looking at about a 6.5% chance per reveal.</p>

<p>If you want T2+, ancient goes to a ~12.5% chance, normal to ~3.5%.</p>

<p>Using ancient saves you ~4x the expected rolls compared to normal. So just work out what&rsquo;s cheapest in the long run - 4x omen of light with free jawbones and 4x echoes, or 1x omen of light with an expensive ancient jawbone and 1x echo.</p>
</label>
    </div>
  </label>
