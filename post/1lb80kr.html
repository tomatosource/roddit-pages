

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/lnnh4vjo3w6f1.png"><p>Is this as good as I think it is, and how much would it be worth?</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/lnnh4vjo3w6f1.png" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="mxqfxox" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Serious-Ebb-4669</div>
        <div>3 | 2 hours ago </div>
      </div>
      <label for="mxqfxox" class="commentText"><p>Vaal it and pray for spirit or +1 minions.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="mxqfuvh" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>gardengrower24</div>
        <div>2 | 2 hours ago </div>
      </div>
      <label for="mxqfuvh" class="commentText"><p>It would be a lot better if you chaosed off the crit hit chance for res or something useful for a minion build</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="mxqgca2" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>BanginNLeavin</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="mxqgca2" class="commentText"><p>You may be able to whittle it and I think it&rsquo;s a great idea if you have the currency to burn.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="mxqiki6" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Lisky27</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="mxqiki6" class="commentText"><p>It does seem like whittle would hit the crit chance but my question would be is it worth it and is the expected value gain higher or lower if I whittle</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="mxqmldx" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>BanginNLeavin</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="mxqmldx" class="commentText"><p>I played minion last league and the crit chance is a dead stat so if the intended buyer is a minion player the value can only go up.</p>

<p>However you should know that a single whittle might not hit the state you want so there&rsquo;s definitely risk but I think it&rsquo;s quite low IF the crit chance is the selected mod</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

    
  </div>
  
</div>

    
  </div>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="mxqgb3w" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Coldru13</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="mxqgb3w" class="commentText"><p>It’s very very good</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="mxqs8x6" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>75inchTVcasual</div>
        <div>1 | 15 minutes ago </div>
      </div>
      <label for="mxqs8x6" class="commentText"><p>I&rsquo;d almost argue that&rsquo;s a better LS helm than a minion helm (which there&rsquo;s very little demand for).  Crit, Int, and a Resist (or Crit and 2 Resists) are the ideal suffixes.</p>

<p>But it&rsquo;s tough to use omens on this since you only have a couple attempts before you roll off crit chance.  Ideally you&rsquo;d omen the +2 into a resist and the life into a hybrid ES mod.  Can try fracturing the crit but probably not worth over investing in it since it&rsquo;s T2.</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
