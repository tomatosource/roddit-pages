

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://www.reddit.com/r/PathOfExile2/comments/1q7mdux/anyone_else_feel_like_the_poe_2_passive_skill/"><p>anyone else feel like the poe 2 passive skill tree is so much worse then poe1</p>
</a>
    </h2>

    
    <div class="selfPostContainer">
      <p>looking to discuss</p>

    </div>
    

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="nygrdal" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Lephus-</div>
        <div>1 | 4 minutes ago </div>
      </div>
      <label for="nygrdal" class="commentText"><p>If they halved the pure ES value on nodes and doubled the points we have it might be interesting.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nygnbj4" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Mediocre_Father1478</div>
        <div>1 | 22 minutes ago </div>
      </div>
      <label for="nygnbj4" class="commentText"><p>Definitely, especially when you compare the left side to the right side.</p>

<p>Tbf to POE 2, though, the first game has redesigned the passive tree a ton.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nygrvp8" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>van_lioko</div>
        <div>1 | a minute ago </div>
      </div>
      <label for="nygrvp8" class="commentText"><p>Given that there&rsquo;s still 4 unreleased classes (Marauder, Duelist, Shadow, and Templar), yes, the skill tree is still under development and not optimized as much as the one in PoE1.</p>

<p>There&rsquo;s a lot of other things that are not yet released, like basetypes for weapons, armour, jewellery, and uniques that would bridge a lot of gaps that the skill tree has and allow for additional synergies.</p>

<p>There are some notable differences though, like several nodes having downsides, that people don&rsquo;t seem to like. I think it&rsquo;s ok to have some as long as they allow for cool interactions. A good example is the synergy between the damage bypasses energy shield node and the lich life cannot change while you have energy shield. More stuff like that would be great.</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
