

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/8mneyk4e80ag1.png"><p>Others build insane temples, and then there is me</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/8mneyk4e80ag1.png" />
	</div>

<div class="commentAndChildren">

      </div>
      <label for="nwf9nmt" class="commentText"><p>What people don&rsquo;t mention often enough is how rare it is to get the rooms you need in one temple.</p>

<p>Place a new spymaster, run temple, don&rsquo;t drop lock, lose it immediately.</p>

    </div>

        <div>1 | 36 minutes ago </div>
      </div>
      <label for="nwfdfno" class="commentText"><p>That doesn&rsquo;t work, spymaster only connects to garrison. So, if you get a spymaster and no garrison, you just have to pray.</p>

  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">

        <div>Glittering_Leader689</div>
        <div>1 | 35 minutes ago </div>
      </div>
      <label for="nwfdqq6" class="commentText"><p>I was just listing workshop as an example of a tile you wouldn’t care about losing.</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

</div>

    <div class="comment">
      <div class="commentHeader">
        <div>NipplesOfPeace</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="nwf9c7u" class="commentText"><p>Gotta workshop your temple start</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nwfhqrj" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>AlphaAron1014</div>
        <div>1 | 15 minutes ago </div>
      </div>
      <label for="nwfhqrj" class="commentText"><p>Is because they’re exploiting.</p>

  </body>
</html>
