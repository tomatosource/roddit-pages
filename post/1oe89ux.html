<div class="commentAndChildren">

      <div class="commentHeader">

      <label for="nkzg7bz" class="commentText"><p>From Chris Forsberg:</p>

<p>Brown played a composed game, quietly generating 25 points on efficient 9-of-18 shooting to go along with six rebounds, four assists, and only two turnovers in 36 minutes and 14 seconds of floor time. Brown attacked the basket with purpose and routinely tried to set up teammates with the attention he drew.</p>

<p>The Celtics simply did not make shots.</p>

<p>Brown finished with 15 potential assists, <a href="https://www.nba.com/stats/players/passing?TeamID=1610612738" target="_blank">per NBA tracking</a>. That was tied for the eighth-highest total across the NBA’s full slate of opening night games. That mark also nearly doubled his season average from last season (8.3 per game).</p>

<p>But the Celtics generated just 10 points off Brown’s four assists, an alarmingly low output when you consider that, as an example, Chicago’s Josh Giddey generated 28 assist points off his 15 potential assists (11 actual assists) in the Bulls&rsquo; opening-night upset of Detroit.</p>

<p>The NBA’s advanced tracking suggests that Brown’s passes led to 19 total shot attempts Wednesday night. The Celtics made just seven of those attempts (36.8 percent). What’s more, the trio of White, Payton Pritchard, and Anfernee Simons were just 4-of-15 shooting (26.7 percent) off of Brown&rsquo;s feeds, and accounted for just one of his four assists overall.</p>

<p><a href="https://www.nbcsportsboston.com/nba/boston-celtics/jaylen-brown-playmaking-potential-assists-76ers/741375/" target="_blank">Read more here</a>.</p>
