    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>

      </div>
      <label for="mj353gm" class="commentText"><p><a href="https://www.poe2wiki.net/wiki/Orb_of_Transmutation" target="_blank">Orb of Transmutation</a> are common and can be used anytime, but during the campaign its not likely to improve over a rare you find, and its gonna take a <a href="https://www.poe2wiki.net/wiki/Regal_Orb" target="_blank">Regal Orb</a> to make it rare, and those are (unfortunately) pretty rare during the campaign.</p>

<p>Not sure what you mean by duplicate items. Just about any rare (or lesser) items you find during the campaign that you don&rsquo;t equip are worthless and you should sell (or just not pickup when you have enough gold). If you&rsquo;re talking about unique items, there are apps you can use to price them, like <a href="https://kvan7.github.io/Exiled-Exchange-2/download" target="_blank">https://kvan7.github.io/Exiled-Exchange-2/download</a>. They are most likely not worth anything.</p>

<p>There are no important items in the early game. The only thing that matters in the early game is getting to the mid game.</p>

<p>From the wiki&hellip; <a href="https://www.poe2wiki.net/wiki/Item_socket" target="_blank">https://www.poe2wiki.net/wiki/Item_socket</a></p>

<blockquote>
<p>Sockets can be increased through the use of an <a href="https://www.poe2wiki.net/wiki/Artificer%27s_Orb" target="_blank">Artificer&rsquo;s Orb</a>. <a href="https://www.poe2wiki.net/wiki/Body_armour" target="_blank">Body armours</a> and <a href="https://www.poe2wiki.net/wiki/Two-handed_weapon" target="_blank">two-handed weapons</a> can have up to 2 maximum sockets, while other types of armour and martial weapons can have up to 1. Some unique items have additional sockets beyond the normal limit.</p>
</blockquote>

      <label for="mj35e64" class="commentText"><p>Salvage items at the salvage bench with a quality stat or rune sockets and it gives you a currency to add quality and rune sockets to any item.</p>

<p>Use the orbs, you are learning it’s fine to “waste” when you are learning, I would completely avoid using <em>Divine orbs and only occasionally using exalted orbs</em>. Pretty much anything else you get early game go crazy with experimenting.</p>

<p>Don’t keep duplicate uniques, make sure to use the disenchant option over selling items to create orbs for crafting. Keep duplicate normal items of bases you like or have good stat rolls to craft with.</p>

<p>By end game pretty much anything you get early game is useless other than a few choice items. Have fun and most importantly, stay sane exile.</p>
