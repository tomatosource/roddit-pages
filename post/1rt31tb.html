

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://youtu.be/GXiYFgC2YB8"><p>Comparing Defenses in PoE2 - A Thought Exercise</p>
</a>
    </h2>

    

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="oacwruz" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>gatsu01</div>
        <div>2 | 4 hours ago </div>
      </div>
      <label for="oacwruz" class="commentText"><p>armour should provide % damage reduction to everything. As well as minimal damage flat dmg reduction to physical. Dot and elemental damage should not be affected by armour&rsquo;s minimal damage reduction.</p>

<p>This way, it would make stacking armour as viable, as well as making the downside of armour slowing down your character more reasonable as a tradeoff. Setting something like every 1k armour provides 5-7% DMG reduction could go a long way. Diminish return for armour stacking wouldn&rsquo;t feel as bad if we make the minimum damage reduction more effective via % DMG reduction up to a max of 70% or something.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="oad7ytj" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Eustia_Astraea</div>
        <div>1 | 2 hours ago </div>
      </div>
      <label for="oad7ytj" class="commentText"><p>While I agree that meeting certain armour stack threshold should give damage reduction, allowing it affect elemental damage will be detrimental as the game. It makes elemental resistance lose its identity and a balance hell for GGG as you lose the baseline of 75% res. You now create a situation where you can just stack some armour and meet the easier achievable threshold, and causing all build to spec into it just to not miss out. It create a situation of the “5th resistance” to be capped instead. Amour mechanics is the same include the mob. Any end game boss or rare monster would be insanely tanky even with elemental build. It probably should only give extra PDR when meeting certain threshold only.</p>

<p>Also, unable to scale life on passive skill tree is just making this issue even prevalent.</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="oad76ke" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Freschu</div>
        <div>2 | 3 hours ago </div>
      </div>
      <label for="oad76ke" class="commentText"><p>Defenses work largely the same for players and enemies. Now think about which enemy modifiers make you worry (beyond proxtang) most.</p>

<ul>
<li>Enemies are armored: don&rsquo;t care</li>
<li>Enemies are evasive: don&rsquo;t care</li>
<li>Enemies have xx% more life: I&rsquo;d rather not</li>
<li>Enemies have energy shield: somewhat worried</li>
<li>Enemies regenerate life: I&rsquo;d rather not</li>
</ul>

<p>As long as defenses work the same for players and enemies: Until &ldquo;Enemies are armored&rdquo; makes you worry even a little, armor is a bad defense.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="oabjdfw" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Ikarus_Falling</div>
        <div>1 | 10 hours ago </div>
      </div>
      <label for="oabjdfw" class="commentText"><p>Armour should give a minimum guaranteed reduction relative to the amount of armour you have regardless of the hit size and everything above works like at the moment </p>

<p>that or make armour breakable so that big hits still get the normal reduction (regardless of hit size) but lower your armour for a while so that you can tank bigger hits better but you need to be careful after the hit till your armour recovered its full reduction again.</p>

<p>At the moment armour feels bad because while small hits get reduced well and they basically get reduced beyond notice that doesn&rsquo;t feel good because there is already a shit ton of ways to make small continuous hits barrely matter 
and against big hits armour does basically nothing even though that should be where it shines within reason oh and ofcourse that it does jack shit against DoT is a fucking travesty </p>
</label>
    </div>
  </label>
  
</div>
