

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://v.redd.it/8c18b5jx0qte1"><p>My POE2 loot experience</p>
</a>
    </h2>

    

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="mm5fctz" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>rSingaporeModsAreBad</div>
        <div>4 | 7 hours ago </div>
      </div>
      <label for="mm5fctz" class="commentText"><p>Wait till you open a unique strongbox that gives 5 white wands.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="mm6elf6" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>MildStallion</div>
        <div>2 | an hour ago </div>
      </div>
      <label for="mm6elf6" class="commentText"><p>My favorite is when strongboxes say things like &ldquo;Contains identified items&rdquo;. Then they drop no items. Happened to me earlier today. And no, they weren&rsquo;t filtered out; I wasn&rsquo;t using a filter at all.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="mm6bidn" type="checkbox" checked/>

        <div>Only_Magician5607</div>
        <div>1 | 2 hours ago </div>
      </div>
      <label for="mm6bidn" class="commentText"><p>U must just disenchant rares</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="mm6k7o6" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Biopain</div>
        <div>1 | 24 minutes ago </div>
      </div>
      <label for="mm6k7o6" class="commentText"><p>That&rsquo;s bugged quest box, drops nothing</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="mm6l99w" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>XIII-Moon</div>
        <div>1 | 13 minutes ago </div>
      </div>
      <label for="mm6l99w" class="commentText"><p>its just whole poe 2 experience</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
