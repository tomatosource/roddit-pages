

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://v.redd.it/n5dnveklyq8g1"><p>Iron Ward ignite poison bleed build t15 boss damage</p>
</a>
    </h2>

    

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="nvd2h40" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>DianKali</div>
        <div>1 | 2 hours ago </div>
      </div>
      <label for="nvd2h40" class="commentText"><p>Very nice build, I also made an iron ward build this season but went full ignite instead of mixing the dots.</p>

<p>Btw, we are passing by some juicy extra effect of armour break nodes (one that also allows it to boost fire DMG from hits as well and helps solve Res for that set), it makes sense to have one weapon set for breaking armour and one for the DoT (break should snapshot the weapon set, same as curses). Iirc we get a total of 24% extra DMG taken from those nodes besides some other benefits (20% extra -&amp;gt; 44% extra).</p>

<p>Also, thunderstorm + guaranteed shock against wet targets is a simple one button 30% shock when fully supported, don&rsquo;t see you have shock anywhere yet, so feel free to add that, duration is long enough that it often isn&rsquo;t in the way of your other abilities.</p>

<p>Feel free to take inspiration from whatever the fuck I am doing: <a href="https://poe.ninja/poe2/builds/vaal/character/MikuIsBestGirl-4210/TheMinionButcher" target="_blank">https://poe.ninja/poe2/builds/vaal/character/MikuIsBestGirl-4210/TheMinionButcher</a></p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="nvd45vp" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>VVitcel | Chain Hook Enjoyer</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="nvd45vp" class="commentText"><p>the iron ward itself shocks, but i&rsquo;m too lazy to weapon swap setup, will check it out!</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

        
      
    </div>
  </body>
</html>
