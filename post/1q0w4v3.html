

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>

      <label for="nx1mldk" class="commentText"><p>well&hellip; you have to make some brain gymnastics to make wisps work. but you are basically right. The only good wisp you want is the Sacred one (Orange) paired with overrun abyss maps the others are quite okay too, cause it just needs to touch the area of an abyss and every rare is automatically possessed. But back to the sacred wisp. There is a node called merging worlds on the atlas , turns out the random possession it claims can happen multiple times at once on one monster or the 25% release spirits from the shining trail node triggers as many times as it wants to trigger 25% not sure about that one yet. Resulting in something crazy like one rare with 8 different Possessions , if you have a omen of the hunt ready just in case you get a sacred wisp you get multiple chances also + the chance that the sacred wisps will move over an abyss meaning even more chances. On a proc like that you are basically guaranteed to get one of the charms. Which makes me think that the mechanic might be decent after all , cause those charms are quite insane and it shouldnt be easy to acquire them, i guess&hellip; but yea alot of rng involved. 6 Man groupplay abbusers should make decent currency on full overrun abyss maps this league with wisps in there. I will test this tomorrow again, since 3 additional wisp tablets are quite cheap it sucks tho that they removed quant on tablets , cause thats the mod you wanted for this strat. Cause rarity aint doing much there so i advise to just to your normal abyss thing + wisps on atlas and see wisps more as that random chance to get a 200+ div item</p>

<p>If you want a example type in youtube &ldquo;When the Azmeri Spirit RNG hits!&rdquo; its not my video , but this is basically what happened to me on a essence monster when they introduced them. You dont really see whats going on at all there , but the first wisp that goes into the essence was a sacred wisp , this one influenced the whole abyss , than the crazy possession happened where one mob had multiple possession , those fractured on death cause of the 25% chance to fracture on death. The guy in the Video didnt even have omen of the Hunt active , meaning there was even more juice there.</p>

<p>Edit: I think Essences are somehow important for the crazy proc too , cause when it happened to me back in 0.2 it started on a essence mob too , the essence monster suddenly had 8 colours and dropped a charm also. Idk nothing is really explained as always.. but i kinda enjoy the process of &ldquo;finding out&rdquo;. Frustrating at times. You could also do some lighting radius abusing and rush for all checkpoints + boss on the map so you actually see where all wisps are on the map , so you can maybe influence them even more. Cause the mechanic itself is still so weird and has so many flaws. Cause sometimes the spawnpoints of them are so bad that on most maps you are just screwed , same with rogue exile / abyss interaction , fixed spawnpoints.. so yea&hellip; do this at your own risk :D + sacred wisps are really not common id say <sup>1</sup>&frasl;<sub>5</sub>-8 maps. And idk how this is interacting with the abyss rares that you are supposed to drag out of the mist. You might get screwed if you get a giga proc on one of those but you dont drag it out or some shit&hellip;</p>
