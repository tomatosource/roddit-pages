

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/ijha5uxfrlig1.jpeg"><p>Is it fine to follow a completed build with no guide?</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/ijha5uxfrlig1.jpeg" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="o4kg7vv" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>XoHHa</div>
        <div>3 | an hour ago </div>
      </div>
      <label for="o4kg7vv" class="commentText"><p>In my experience, yes, if you know how the build works, what are the damage sources, the defence layers, etc. Better to have several examples of the same build, which can be easily find on poe.ninja</p>

<p>If you dont know the specifics of the build, you may have some issues with it, like when there are versions of the build depending on a specific unique. If you don&rsquo;t have it, the passive tree is different, the gearing might be different, etc.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="o4kgpnv" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Additional_Brief_937</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="o4kgpnv" class="commentText"><p>Pretty simple build just have a shit ton of summons. From the one guide it seems like the sniper is primary damage but maybe that’s different as thus build uses different summons</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="o4kgvha" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>beatitmate</div>
        <div>3 | an hour ago </div>
      </div>
      <label for="o4kgvha" class="commentText"><p>I do this with most builds, scan for key keystones and follow paths based on what i need at the time rather than a specific order. But I also play SC and gauge dying a lot as a time to re asses my skill tree so maybe not a good example</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="o4kjjeu" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>CE94 | ggnoobz</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="o4kjjeu" class="commentText"><p>Yes, but it&rsquo;s definitely harder if you are new to the game.</p>

<p>Most players can get through the campaign just playing blind, but after that point it would be a good idea to look up guides/YouTube videos about the game and find a good build that would be easy to respec to as you go through low-tier maps.</p>

<p>For HC idk lol</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="o4kjsbh" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Additional_Brief_937</div>
        <div>1 | 43 minutes ago </div>
      </div>
      <label for="o4kjsbh" class="commentText"><p>Ik this is a stupid question but does highlighting red or green mean they deprioritized those passives?</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="o4knrrh" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>zavorak_eth</div>
        <div>1 | 9 minutes ago </div>
      </div>
      <label for="o4knrrh" class="commentText"><p>No, those are the passive points for weapon sets. Red is set 1 and green 2. Make sure to have 24 passives available, then you click on set I arrow at top right and allocate, then same for set II. Then you assign different skills to different weapon sets and can have different weapons in the sets.</p>
</label>
    </div>
  </label>
  
</div>

    
      
<div class="commentAndChildren">
  <input id="o4ko5gx" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Mirosworld</div>
        <div>1 | 5 minutes ago </div>
      </div>
      <label for="o4ko5gx" class="commentText"><p>no, highlighting red or green mean these nodes are either weapon slot 1(red) or weapon slot 2(green)</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

    
  </div>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="o4kokn3" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>zavorak_eth</div>
        <div>1 | a minute ago </div>
      </div>
      <label for="o4kokn3" class="commentText"><p>Absolutely. You just need to known which passives to prioritize early on and when to swap to weapon set passives and which defenses to take first, etc. Once you do a couple builds it becomes much easier. Also, not all skills are available early on, so that&rsquo;s why you have to make some choices before the build fully matures.</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
