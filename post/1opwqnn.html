

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/htlt3n7sjmzf1.jpeg"><p>Is there a way to guarantee a desired outcome? Or do I just have to slam and prey?</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/htlt3n7sjmzf1.jpeg" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="nnej4vv" type="checkbox" checked/>

        <div>3 | 6 hours ago </div>
      </div>
      <label for="nnej4vv" class="commentText"><p>I would just slam a couple greater exalts and roll with it. Getting a good roll of crit chance back would be very expensive</p>
</label>
    </div>
  </label>
  
</div>

      <label for="nnej4oz" class="commentText"><p>Nothing particularly special about this base. Much harder to make a good bow from this opposed to a good fracture or something.</p>

</div>

  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nnepybi" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Informal-Picture-909</div>
        <div>1 | 5 hours ago </div>
      </div>
      <label for="nnepybi" class="commentText"><p>At that point just greater/perfect exalt with a homogenize should give you atk or ele</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nnf5jp1" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>ConsistentAide8156</div>
        <div>1 | 4 hours ago </div>
      </div>
      <label for="nnf5jp1" class="commentText"><p>Slam and pray only noobs craft</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nnfx2og" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Deabers</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="nnfx2og" class="commentText"><p>Starting with 170 % phys is much easier than finding it. You can homog phys/accuracy combo then homog for phys % or added phys at decent odds</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
