

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/ayf2l8f7rktf1.jpeg"><p>Is there a cheapest/meta way to get around to ALL the minion skills?</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/ayf2l8f7rktf1.jpeg" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="ni5mctn" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>emulicker</div>
        <div>1 | 7 minutes ago </div>
      </div>
      <label for="ni5mctn" class="commentText"><p>go to poe ninja, filter on minion builds, and look at the passive tree</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">

      <div class="commentHeader">
        <div>IamJashin</div>
        <div>1 | 6 minutes ago </div>
      </div>
      <label for="ni5mimg" class="commentText"><ol>
<li>It&rsquo;s impossible and not worth it there are better things on the tree like Spirit Reservation Efficiency and Defensive nodes which you have to pick.</li>
<li>You would probably be better looking for some good Minion Based Undying Hate.</li>
<li>Overall the cluster on the far left on your screenshot is something that only worth getting if you get one of the nodes on Megalomaniac. The nodes while good have to high travel cost.</li>
<li>Minion Command cluster (the one on the upper left) is something worth considering while levelling/early gear building. Once you stack enough minion levels commands become to expensive to run efficiently (mana cost) and your minions clear really well without them.</li>
</ol>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">

      <div class="commentHeader">
        <div>TheRedd_Reign</div>
        <div>1 | 5 minutes ago </div>
      </div>
      <label for="ni5mly9" class="commentText"><p>Not what I asked but ty.</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="ni5n1eb" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>yepterrr</div>
        <div>1 | 3 minutes ago </div>
      </div>
      <label for="ni5n1eb" class="commentText"><p>All of them? I dont see a reason why, but if youre willing to sacrifice your own defenses it shouldn&rsquo;t be that difficult. Most minion defense nodes aren&rsquo;t worth it though, only a few have large enough values to be worth investing into.</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
