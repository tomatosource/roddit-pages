      <label for="p18ilhg" class="commentText"><p>Adonia with +1 charges on weapon set 2 is mandatory. Then you get 8 charges instead of 7.</p>

<p>You have so much ES yet you didn&rsquo;t take Eldritch Battery? +6k mana is a big dps boost with Archmage and Arcane Intensity. And also no Archmage?</p>

<p>Rakiata and Sacred Flame is a bad combo, Sacred Flame applies first and pretty much negates Rakiata effect. Also try test Rakiata in CoC or CoA gems, to me it feels like a much better option that Rakiata in Spark. Instead of Sacred Flame you can get Stoic Sceptre or Shrine Sceptre with lots of Spirit allowing you to use Archmage etc (Stoic doesn&rsquo;t let you insert support gems for 0 spirit, Shrine does).</p>

<p>Megalomaniac with Blessing of the Moon and something else would save you some points.</p>

<p>Time-Lost Sapphire in right upper jewel node can give you lots of stats you want (e.g. crit chance, crit chance for spells, max mana, mana per kill, skill effect duration etc, Skill effect duration is a big QoL for Adonia builds).</p>

<p>Headhunter imo outperforms Mageblood on juiced maps by a mile (but they you would need blink, yea).</p>

<p>Spirit of the Cat is not mandatory for this build? Stag gives you 30% ele res (so you can lower you ele res on gear), same 15% movespeed, same 30% skill speed and 20% extra lightning damage instead of crit chance.</p>

<p>You can make another rare jewel socket in Maligaro. Buy non-corrupted with 1 socket or 0 sockets and use Cadigan&rsquo;s Epiphany.</p>

<p>Mana Tempest and and Sigil of Power are imo unnecessary.</p>
