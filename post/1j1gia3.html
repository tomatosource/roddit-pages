

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
}

.selfPostContainer * {
  color: white;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/54iex4zut6me1.png"><p>Is it worth divining ?</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img src="https://i.redd.it/54iex4zut6me1.png" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="mfjh8k1" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>NewManufacturer8102</div>
        <div>1 | 8 minutes ago </div>
      </div>
      <label for="mfjh8k1" class="commentText"><p>The divine won’t change the tier of the affix, e.g. it’ll only ever reroll damage in the  8-12 and 15-22 range. Something worth divining would have higher tier affixes I suspect</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="mfjgre4" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>jossief1</div>
        <div>1 | 11 minutes ago </div>
      </div>
      <label for="mfjgre4" class="commentText"><p>It&rsquo;s basically just bad. Chaos Orbs are the cheap way to maybe make it better</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="mfjhcc7" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>sktz0</div>
        <div>1 | 8 minutes ago </div>
      </div>
      <label for="mfjhcc7" class="commentText"><p>I guess it&rsquo;s bad because of the tier rolls, right ? The values are low everywhere and I was wondering if there was a way to increase the tier rolls with divs</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="mfjhj27" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>jossief1</div>
        <div>1 | 7 minutes ago </div>
      </div>
      <label for="mfjhj27" class="commentText"><p>Divs only rerolls the numbers within the same tier.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="mfji4u7" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>sktz0</div>
        <div>1 | 3 minutes ago </div>
      </div>
      <label for="mfji4u7" class="commentText"><p>Well noted, thanks!</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

    
  </div>
  
</div>

    
  </div>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="mfjgwuy" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>MyBowazon</div>
        <div>1 | 10 minutes ago </div>
      </div>
      <label for="mfjgwuy" class="commentText"><p>If you can buy better with 1 div. Don’t dice roll it</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="mfjhjzp" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>TwoManaTwoTwo</div>
        <div>1 | 7 minutes ago </div>
      </div>
      <label for="mfjhjzp" class="commentText"><p>Using a divine will only reroll between the numbers in the brackets, not take the mods into new tiers. It’s not worth using.</p>

<p>I bought a 700 dps quarterstaff with 14% Crit for a div. Use the currency to buy an upgrade (unless you are SSF of course….)</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="mfji1eu" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>sktz0</div>
        <div>1 | 4 minutes ago </div>
      </div>
      <label for="mfji1eu" class="commentText"><p>Yeah that&rsquo;s what I wanted to know, thanks !</p>

<p>I&rsquo;m not SSF, but I just wanted to see if I could make it worth some currency or not.</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

        
      
    </div>
  </body>
</html>
