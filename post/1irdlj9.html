    <h2>
      <a class="postTitle" href="https://i.redd.it/a4sog45e8nje1.png"><p>Tip - Several sources of ignite is useless</p>
</a>

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="md7jzlx" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>TheDeathCrafter</div>
        <div>3 | 4 hours ago </div>
      </div>
      <label for="md7jzlx" class="commentText"><p>I was tinkering with my Witch Infernalist, going for max HP with my hellhound who inflicts Ignite on everything around him, damaging them based on his max HP. Then i thought about increasing my ignite chance with my other minions and spells, but before i waste alot of gold in respeccing and using my gemstones i thought i should look up how Ignite works.</p>

<p><a href="https://pathofexile2.wiki.fextralife.com/Ignite" target="_blank">Here </a>it is stated that &ldquo;<em>The Ignite Ailment does not stack, but multiple instances can be present on a unit, each one having its own duration.</em> <strong><em>However, only the highest damage instance will deal damage</em></strong><em>.&rsquo;</em>&lsquo;</p>

<p>Therefore if you want to maximize your fire-build, i suggest leaning into Magnitude instead of Ignite Chance if you have a Hellhound or a high damaging spell with high ignite chance.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="md7l60p" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>snorri_redbeard</div>
        <div>2 | 4 hours ago </div>
      </div>
      <label for="md7l60p" class="commentText"><p>Ignites not stacking is obvious for poe1 folks.</p>

<p>From my experience you either:</p>

<p>go for guaranteed ignites from flame wall\incinerate\solar orb\hound since you can at low investment get increased damage to ignited\burning enemies + damage if you ignited recently and and do your other elemental build</p>

<p>or</p>

<p>invest heavily on ignite chance\magnitude and underperform</p>

<p>Probably even frostfire \  bringer of flame comet interaction with sucks</p>
</label>

    <div class="comment">
      <div class="commentHeader">
        <div>PoGD1337</div>
        <div>1 | 24 minutes ago </div>
      </div>
      <label for="md8558s" class="commentText"><p>To be fair i dont understand how to make ignite viable damage source. Cos its 20% of that damage hit in 4 seconds. First of all we need to increase magnitude by 400% to make it at least 100%, now we are doing 25% of that hit IN A SECOND, next lets say we somehow increased damaging ailments speed by 100%. Now we are doing 50% of that hit in a second. Just after so much invested we having +-50%dps of that spell as ignite damage, while it had to be 1 strong hit, Isnt its just too much investment ? And there is no but 1 spell with high hit damage, or comes in mind to convert lightning conduit or comet to fire</p>
</label>
