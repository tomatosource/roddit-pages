

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
}

.selfPostContainer * {
  color: white;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/ffla4sm6anne1.jpeg"><p>Numbers look nice but how to make this staff useful?</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img src="https://i.redd.it/ffla4sm6anne1.jpeg" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="mgu3292" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>FartsMallory</div>
        <div>1 | 3 hours ago </div>
      </div>
      <label for="mgu3292" class="commentText"><p>With a dead mod in the prefix and no attack speed or crit chance in suffix you’d really just have to either get lucky with a chaos orb, vendor, or use it as a secondary weapon set to cast charged staff and tempest bell.</p>

<p>Outside of that it just doesn’t work for most meta monk builds.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="mgu4uku" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>kalechii</div>
        <div>1 | 3 hours ago </div>
      </div>
      <label for="mgu4uku" class="commentText"><p>I figured as much. Too bad about the high rolls for phys and ele damage since they looked really promising. Will rune and quality it further and keep it for fun and testing.</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="mgu37ee" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>kalechii</div>
        <div>1 | 3 hours ago </div>
      </div>
      <label for="mgu37ee" class="commentText"><p>My current state stacker wannabe build currently uses a pillar of the caged gods so I&rsquo;m not sure how a staff without physical damage could become useful&hellip; Perhaps inject flat phys damage with some gloves?</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="mgu67p5" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>SEPHYtw</div>
        <div>1 | 2 hours ago </div>
      </div>
      <label for="mgu67p5" class="commentText"><p>«Currently using Pillar» as a stat stacker equals always using Pillar. There is no other weapon.</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="mgucsnx" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>charliekunkel</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="mgucsnx" class="commentText"><p>Pretty sure you&rsquo;re best use for it would be giving it to me.  :)</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
