

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://www.reddit.com/gallery/1kny773"><p>How do I price my items correctly</p>
</a>
    </h2>

    

    <div class="commentList">
      
        
          
<div class="commentAndChildren">

      <label for="mslul4t" class="commentText"><p>The quarterstaff isn’t worth even 1ex. The damage numbers there would need to be at least ~300-500 to go for 2 div. The boots won’t sell either. 35% ms with those stats, maybe 1 div.</p>

<p>You will need to learn the economy before being able to estimate stuff. I would suggest logging into the store on your phone to quickly compare items you want to sell.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">

      </div>
      <label for="msluy6f" class="commentText"><p>Is there an app or am I just using the website?</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">

      </div>
      <label for="mslvb8q" class="commentText"><p>Just the website. I believe it is mobile optimized. If you log in there you can also initiate trades from it</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

    
      
<div class="commentAndChildren">
  <input id="msluzc4" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Significant-Fan-9008</div>
        <div>1 | 4 minutes ago </div>
      </div>
      <label for="msluzc4" class="commentText"><p>And thank you for the advice</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="msluovz" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Kinggooniez</div>
        <div>1 | 6 minutes ago </div>
      </div>
      <label for="msluovz" class="commentText"><p>Also lvl will probably effect the prices</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="mslveni" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Foreign_Sleep137</div>
        <div>1 | a few seconds ago </div>
      </div>
      <label for="mslveni" class="commentText"><p>I think maybe 1 div might be reasonable. The 5% missing movementspeed makes a big price diff.. thats why I bought 30% MS last league. :)</p>

    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
