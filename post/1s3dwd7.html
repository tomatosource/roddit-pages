      <label for="ocepitp" class="commentText"><p>From Chris Forsberg:</p>

<p>Take what you will from Wednesday night’s Celtics-Thunder matchup, a glitzy showdown of the last two NBA champions. And while Boston could surely benefit &ndash; at least in the court of public opinion &ndash; from a signature win, the team’s priority must remain building toward being the best version of itself when the games truly matter most. </p>

<p>By almost any of the preferred metrics, the Celtics have established themselves as legitimate contenders in the Eastern Conference. Boston has the third best net rating in basketball (+7.8), trailing only conference leaders Oklahoma City and Detroit, while ranking second in the NBA in offensive rating and fourth in defensive rating.</p>

<p>The Celtics are on pace to win 54 games despite navigating much of the season without All-NBA wing Jayson Tatum, whose <a href="https://www.nbcsportsboston.com/nba/boston-celtics/jayson-tatum-neemias-queta-nba-standings-playoffs/776371/" target="_blank">ability to shake rust from a nine-month absence</a> could be vital to Boston’s postseason hopes.</p>

<p>&hellip; The only thing that might give the pundits pause about Boston’s title chances is the team’s performance this year against the best of the best.</p>

<p>The Celtics have posted a 6-14 record against the other nine teams in the NBA’s top 10 in point differential. What’s more, Boston has a minus-5.4 point differential in those games, the worst among the top 10 teams in games played against each other.</p>

<p>Team			Season PtDiff		BOS vs.		vs. Top 10	PtDiff vs. Top 10</p>

<ol>
<li><p>Oklahoma City	+11.9			0-1			13-9			+1.1</p></li>

<li><p>Detroit			+8.4				1-3			14-6			+4.5</p></li>

<li><p>San Antonio	+8.3				0-2			15-9			+2.2</p></li>

<li><p>Boston			+7.8				—			6-14			-5.4</p></li>

<li><p>New York		+6.6				1-2			11-8			+2.0</p></li>

<li><p>Houston		+5.2				1-1			9-12			-0.6</p></li>

<li><p>Charlotte		+4.7				0-1			6-12			-3.9</p></li>

<li><p>Minnesota		+4.4				0-2			10-9			+1.6</p></li>

<li><p>Cleveland		+4.4				3-0			11-13		-0.8</p></li>

<li><p>Denver		+4.1				0-2			10-13		-1.4</p></li>
</ol>

<p>On Wednesday night, a full-health Thunder squad brings its title-defending team to TD Garden for Boston’s final true interconference showdown of the 2025-26 regular season. The Celtics have posted a 3-8 record against the top six teams in the West, with two of those three wins coming against the rival Lakers. (The other was a Jays-less triumph in Houston.)</p>
