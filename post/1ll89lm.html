

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/rjba24tcib9f1.jpeg"><p>No atlas points from corrupted nexus</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/rjba24tcib9f1.jpeg" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="mzxm6mg" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>name_it_goku</div>
        <div>4 | 2 hours ago </div>
      </div>
      <label for="mzxm6mg" class="commentText"><p>learn how to take a screenshot and maybe you will figure out how the game works too</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="mzxkvuh" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Syranight264</div>
        <div>2 | 2 hours ago </div>
      </div>
      <label for="mzxkvuh" class="commentText"><p>Check the quest to the right. Was the waystone a high enough tier?</p>

<p>It goes up, so you do the first nexus, and then the next waystone you need will be 3 tiers up.</p>

<p>I made that mistake.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="mzxlrxn" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Constant-Jello1366</div>
        <div>0 | 2 hours ago </div>
      </div>
      <label for="mzxlrxn" class="commentText"><p>The quest to the right does say complete a corrupted nexus using a tier 3 waystone. Would that be the problem ? If that s the case, are the points lost forever ? Why can t i rerun the map using the correct waystone later ?</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="mzxs6pl" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Syranight264</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="mzxs6pl" class="commentText"><p>Yes, you need to play the map with a level 3 stone.</p>

<p>Also, yes, if you complete the map you cannot redo it. The points are not lost as you never actually fulfilled the quest objective.</p>

<p>The nexus is lost but there&rsquo;s plenty more.</p>

<p>My advice:</p>

<p>Don&rsquo;t worry about maps, towers too much.</p>

<p>Just explore the map and go for distance. It&rsquo;s huge and you&rsquo;ll soon find another nexus.</p>

<p>Just go for boss maps to get the next waystone up from the one you do it on. If that makes sense.</p>

<p>But don&rsquo;t worry too much about doing each map in a small area, just spread out and explore.</p>

<p>Once your like level 80 and/or above T12 then start to do towers and all the rest.</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

    
  </div>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="mzxndki" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Own_Chicken_8606</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="mzxndki" class="commentText"><p>Higher waystones for more points, you just gotta find another corrupted zone and beat the nexus there with whatever waystone level your quest says you need.</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
