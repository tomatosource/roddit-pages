

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/o0znu88k66eg1.png"><p>Has GGG given up on the chackpoint system ?</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/o0znu88k66eg1.png" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="o0d4p64" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Vamyra</div>
        <div>11 | 2 hours ago </div>
      </div>
      <label for="o0d4p64" class="commentText"><p>The checkpoint system is a bandaid solution, and a terrible one at that. I hope they get removed.</p>

<p>Better map layouts should be the goal.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="o0d6rl3" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>ZephGG_</div>
        <div>5 | an hour ago </div>
      </div>
      <label for="o0d6rl3" class="commentText"><p>Honestly call me crazy but maps don’t need to have crazy RNG generation, they could have 5 hand crafted layouts and the game would immediately be more fun to play</p>

<p>Who cares if someone can memorize the layouts and clear each one in less than two minutes, GGG has all the levers they need to adjust drop rates and mob density to compensate, but less RNG in layouts would improve the flow of every map and probably make a lot of map dependent skills work better on a lot of maps as well</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="o0doolx" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>beepboopz123</div>
        <div>1 | 2 minutes ago </div>
      </div>
      <label for="o0doolx" class="commentText"><p>People still manage to memorize general layouts in the current system so I&rsquo;d say its a win win</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

    
  </div>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="o0dfh3k" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>nbherd</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="o0dfh3k" class="commentText"><p>Or the checkpoints just don’t work (looking at you temple)</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="o0ctt5o" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>MyNamesucks123</div>
        <div>-4 | 3 hours ago </div>
      </div>
      <label for="o0ctt5o" class="commentText"><p>It shouldn&rsquo;t have happened in the first place.</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
