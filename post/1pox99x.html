      <label for="nuigx5q" class="commentText"><p>From <a href="http://Globe.com" target="_blank">Globe.com</a></p>

<p>By Adam HImmelsbach</p>

<p>Earlier this year, Bill Chisholm spent several agonizing months finalizing his $6.1 billion bid to purchase the Boston Celtics.</p>

<p>If he was unable to raise the necessary funds by year’s end, the dream of owning his boyhood team would collapse and he would have to pay several hundred million dollars in penalties.</p>

<p>But in June, the private equity executive faced a more urgent issue while hiking through Virginia’s Blue Ridge Mountains: Are these rat snakes dangerous?</p>

<p>They moved slowly, and he was careful not to agitate them as he found an opening to maneuver by and continue north, never looking back.</p>

<p>For the last three years, Chisholm has spent weeks hiking sections of the Appalachian Trail alone, cooking on a portable stove and sleeping in a tent.</p>

<p>He has avoided bears in the Smoky Mountains, was once laid out by a tree limb while rushing to camp before sundown, and chased down a hiker who took his backpack. In the wilderness, he goes only by his trail name, “Skittles,” for the bag of the colorful candy he once brought to a group campfire.</p>

<p>Those close to Chisholm sometimes wonder why he puts himself through it. He is a 56-year-old billionaire with a wife and three children in their 20s who now owns one of the most prestigious sports franchises in the world.</p>

<p>But his days of playing soccer for Dartmouth have long passed, and, like most men his age, he often wakes up sore now. So, in addition to the freedom and breathtaking views, he goes back every year because this unforgiving 2,200-mile tract that winds from Georgia to Maine provides an outlet for his competitive drive.</p>

<p>“I like to test myself,” Chisholm said, “and do things that are hard.”</p>

<p>That was part of his calculus when he called old soccer teammate and BDT &amp; MSD Partners executive Gregg Lemkau in the summer of 2024 after his bank was hired to advise the controlling stakeholders, the Grousbeck family, on the sale of the Celtics.</p>

<p>Suddenly, it felt as if they were back in a Dartmouth dorm.</p>

<p>“Hey, Lem, I saw you were hired to sell the Celtics,” Chisholm recalled saying.</p>

<p>“Yeah, pretty cool, right?” Lemkau responded.</p>

<p>Chisholm agreed, and added that he wanted to buy the team that had coursed through his veins since he was a child. Lemkau thought Chisholm was making a joke.</p>

<p>“Dude,” he said, “you don’t have that kind of scratch.”</p>
