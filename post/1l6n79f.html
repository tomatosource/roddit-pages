

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://www.youtube.com/watch?v=d3ndN8AlV_I"><p>Bannerbot Support Titan Guide - x5 Ally Attack Damage</p>
</a>
    </h2>

    

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="mwrzjh9" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>DefinitelyNiko</div>
        <div>2 | 12 hours ago </div>
      </div>
      <label for="mwrzjh9" class="commentText"><p>REALLY cool, my friend. My brother and I have been trying to run support ally. He really just wants to complement my damage or sustain so we have more synergy instead of both of us running around claiming kills.</p>

<p>I have a few questions:</p>

<ul>
<li>We can&rsquo;t get the gloves to work. Initially, we were hoping that he could claim kills and therefore stack up valor, but it doesn&rsquo;t seem to work for us, how did you get them to work?</li>
<li>Does the companion give buff to allies as well?</li>
</ul>

<p>Thank you SO much for putting this together.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="mwsiupf" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>char_tillio</div>
        <div>1 | 9 hours ago </div>
      </div>
      <label for="mwsiupf" class="commentText"><p>The gloves don’t work for gaining valour, it’s really disappointing. Because valour is gained by “killing enemies with attacks” and not just “killing enemies”, so you have to actually kill enemies with your attacks. That’s why this unique chestpiece feels necessary for the build. And yeah, companions give buffs to nearby allies with their auras too</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="mwqcsvj" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>ShowBorn3970</div>
        <div>1 | 18 hours ago </div>
      </div>
      <label for="mwqcsvj" class="commentText"><p>Skipped cuz no 2x chaos DMG rings</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
