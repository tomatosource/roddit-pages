

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/uy6y1ix70leg1.png"><p>Noob question - Do i have the red suffixes active or not?</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/uy6y1ix70leg1.png" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="o0r41yr" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>KiefScoop</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="o0r41yr" class="commentText"><p>Yes, they are active.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="o0r4kpo" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Xeratas</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="o0r4kpo" class="commentText"><p>First of all, Uniques don&rsquo;t have suffixes or prefixes. They just have affixes.</p>

<p>Only Magic and rare items make a difference between Suffix and prefix mods</p>

<p>And yes those are active. You can&rsquo;t disable affixes on a unique. all mods do always apply.</p>

<p>The red affixes are cultivated affixes made with a specific currency Item. It removes some affixes from a unique and replaces them with random new affixes from a specific affix pool (the affix pool is tied to the item).</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="o0r51j6" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>heyman93</div>
        <div>1 | 44 minutes ago </div>
      </div>
      <label for="o0r51j6" class="commentText"><p>thank you so much for your explanation, still have a lot to learn. I saw that the affixes were from vaal orbs but I was not sure red meant active or not.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="o0r5h22" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Xeratas</div>
        <div>1 | 41 minutes ago </div>
      </div>
      <label for="o0r5h22" class="commentText"><p>You are welcome and its not exactly a vaal orb but more specific a vaal cultivation orb. Those are two different orbs with different effects.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="o0r5sxg" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>heyman93</div>
        <div>1 | 40 minutes ago </div>
      </div>
      <label for="o0r5sxg" class="commentText"><p>jeez thank you for giving me more to research, I had no idea lol</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

  </body>
</html>
