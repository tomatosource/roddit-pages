

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/84qt3h2av04h1.gif"><p>My newbie experience of playing this game for the first time vs. what&rsquo;s going on in Streams and Subreddits</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/84qt3h2av04h1.gif" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="ooitzt8" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Top-Toe3200</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="ooitzt8" class="commentText"><p>and thats the whole point, learning from mistakes!</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="ooivhcl" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>RichardTheVane | SSFBTW</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="ooivhcl" class="commentText"><p>It&rsquo;s more fun this way.</p>

<p>Most streamers have played thousands of hours, so you shouldn&rsquo;t compare your day1 to someone&rsquo;s 14hr *6days/week for 2 years.</p>

<p>Following guides is fine, but it robs you the joy of discovery if you think of POE as a 50% puzzle solving + 50% monster slaying and looting. (In truth it&rsquo;s probably more like 70% puzzle solving and 30% monster slaying)</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="ooivkid" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Loampudl</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="ooivkid" class="commentText"><p>play what playstyle looks interesting. Meta builds are often clunky to play.</p>

<p>i stopped playing in the campaign last league, because i felt for the twister bait&hellip;</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="ooiygk3" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Budget-Mango9119</div>
        <div>1 | 22 minutes ago </div>
      </div>
      <label for="ooiygk3" class="commentText"><p>You will get there. You learn the most by trying out lots of different homebrew builds and comparing them to better builds with the same idea. That way you will learn what makes them work, and can use that knowledge for later homebrew shenanigans.</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
