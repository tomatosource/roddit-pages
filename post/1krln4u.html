

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://www.youtube.com/watch?v=lzgXJCy1TnQ"><p>lil DPS meter proof of concept</p>
</a>
    </h2>

    

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="mtereai" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>goddog_</div>
        <div>7 | 13 hours ago </div>
      </div>
      <label for="mtereai" class="commentText"><p>This is just a little Python script I worked on today. It OCRs (Tesseract OCR) the DMG display and does the DPS calc over a window of time. It does its best to reset when the boss display fades and tries to exclude any background noise that might get mistaken for a number.</p>

<p>If anyone finds it valuable I&rsquo;ll put it on GitHub after working on it a bit more. It&rsquo;s a lil janky but kind of fun to use.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="mteiez4" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>theOriginalH1GH3R</div>
        <div>2 | 14 hours ago </div>
      </div>
      <label for="mteiez4" class="commentText"><p>yes please</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="mtevg88" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>smb3d</div>
        <div>1 | 13 hours ago </div>
      </div>
      <label for="mtevg88" class="commentText"><p>Awesome! I was just thinking whether a mod like this could be possible.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="mtf4fai" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Trajan_Hunter</div>
        <div>1 | 12 hours ago </div>
      </div>
      <label for="mtf4fai" class="commentText"><p>Looks dope! Would GGG have any issues with this kind of thing? I know some overlay mods have been allowed before, but I&rsquo;m not sure where they draw the line, exactly. If there&rsquo;s no problem then it would be awesome to have that.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="mtg04lk" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Warwipf2</div>
        <div>3 | 7 hours ago </div>
      </div>
      <label for="mtg04lk" class="commentText"><p>I think the line is drawn by reading out memory to obtain information you normally don&rsquo;t have and by making your overlay do something with a single click that would normally take more than one input.</p>
</label>
    </div>
  </label>
  
</div>

    
      
<div class="commentAndChildren">
  <input id="mth7e7l" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>goddog_</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="mth7e7l" class="commentText"><p>Nah, no memory reading or sending any inputs. OCR is essentially taking a screenshot at a certain part of the window and converting that to text. The DPS display is just an overlay. It&rsquo;s the same way a bunch of other POE tools work.</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

        
      
    </div>
  </body>
</html>
