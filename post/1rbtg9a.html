        <div>1 | 24 minutes ago </div>
      </div>
      <label for="o6tlhj1" class="commentText"><p>That’s exactly my point about the Broken Synergy. Even with no other enemies nearby, the projectiles tend to spread out instead of focusing the target. If you invest into Area of Effect (to use the quality bonus), it gets even worse — the explosions spread so far that you lose all Overlap damage on bosses.</p>

<p>As for Mortars, you are right, but that&rsquo;s the tragedy. Why should a &lsquo;Sovereign-tier&rsquo; invested Siege Ballista feel worse than a basic Mortar setup? We shouldn&rsquo;t be forced to swap skills just because the core targeting AI and projectile logic of Ballistas are working against the player.</p>
