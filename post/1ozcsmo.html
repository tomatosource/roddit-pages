       * {

*,

}

html {

  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;

  width: 100%;
  padding: 32px;

h1 {

}

h2 {

}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;

.subName {

.postList {

  flex-direction: column;

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>

      <label for="npawrwi" class="commentText"><p>a perfect quiver for Crit LA Deadeye:<br>

<p>my way to craft this:</p>

<ol>
<li><p>buy base Visceral Quiver with 2 or 3 mods:<br>
must have: Projectile Speed &amp; +2 Projectile Skills<br>
the remaining mod can be suffix or prefix<br>
</p></li>

<li><p>use Omen Sinistral/Dexteral Crystallisation + Essence of Hysteria<br>
to turn that remaining mod* into + increased Damage with Bow Skills<br>
by this step, you must have 3 mods:<br>
+ increased Damage with Bow Skills<br>
+ Projectile Speed<br>
+ 2 projectile Skills</p></li>

<li><p>Add prefix mod abyssal by Jawbone + Omen Sinistral Necromancy<br>
reveal it (turn on Omen of Echoes)<br>
you want to find highest flat lightning damage<br>
but sometimes it will be revealed with other type of flat dmg&hellip;it&rsquo;s fine.<br>
just pick any highest flat dmg.</p></li>

<li><p>on Quiver now you have tags: Attack, Damage, Speed&hellip;<br>
use combo Omen of Homogenising Exaltation + Greater Exalted Orb (or Perfect Ex Orb, depends on how rich you are)<br>
result will be 2 in 3 mods: Attack Speed/ Crit chance/Crit dmg bonus.</p></li>
</ol>

<p>Now you already have a very good quiver.<br>
The only yolo step is step no. 2. now it&rsquo;s cheap already.<br>
and the step 3, kinda costly, you will delete/reveal again until you satify with the result, if you did not hit the mod you want at the beginning.</p>

<p>That&rsquo;s it!<br>
I crafted and sold many quiver with this way (and got rich lolol)</p>
