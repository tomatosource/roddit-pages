

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/xw21lkld0qgg1.png"><p>Seeking Help With This Craft</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/xw21lkld0qgg1.png" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="o2tpyv3" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Acrobatic-Event1812</div>
        <div>2 | 13 hours ago </div>
      </div>
      <label for="o2tpyv3" class="commentText"><p>Its not worth to invest more currency into this staff. I suggest you just use it until have more currency to craft a +6 all spell or +7 lightning/cold skill level with more deterministic.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="o2u42ff" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>WhichWolfEats | customflair</div>
        <div>2 | 12 hours ago </div>
      </div>
      <label for="o2u42ff" class="commentText"><p>Not much you can do here without tons of divs. If you want to make something similar and cheaply what I would do is this:</p>

<p>Buy a blue base with spell damage and crit chance. Add cast speed with greater alacrity essence. Add a dextral necromancy for suffix and desecrate. Reveal the desecration with echo for rare chance at +6 or +7 (don’t count on it) then  Use dextral crystalization and p sorc essence to roll off desecration for +5. This is 1:3. I’d stop if it hits something else. If you now have crit, cast speed, +5 and spell damage, if fracture, then desecrate regular jawbone to block mana, take any tier. Then p exalt hoping for gain as. If you get gain as or spell ele % that’s good too. Then omen of light and finish your desecration for last mod.</p>

<p>A cheaper way to start this would be gain as on the blue. The lower tiers of these roll reduce cost a lot: I bet you could hit something with all these mods in less than 200 divs. If fracture hits +5 then don’t sanctify. It it hits spell damage that’s best. I’d sanctify and hope for +6. Gl</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
