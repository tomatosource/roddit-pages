

<html>

    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>

<p><a href="https://maxroll.gg/poe2/build-guides/storm-mage-lich-build-guide" target="_blank">https://maxroll.gg/poe2/build-guides/storm-mage-lich-build-guide</a></p>

<p>The one thing I miss is the Mandibles attack first and keep mobs off me, here the Zealots are next to me and once we are within range they start attacking or anyone that attacks me within range.</p>

<p>They do melt the bosses rather quickly then the ants. But again I haven’t maxed out their dps as I’m sure they are a lot better.</p>

      <label for="npmwmzj" class="commentText"><p>You’re right dude I didn’t realize till now but the ice sound and animation seemed to really bother me &amp;gt;.&amp;lt;</p>

<p>Do you think just 1 ant could provide the tank you’re looking for? I had a pretty good toon before I swapped I think I had 11 ants 2 zealots and 1 brute, frost, storm, cleric, and maybe a sniper at my best with all the reductions? How many zealots do you get could you link your pob?</p>

      <label for="npmxlx1" class="commentText"><p>I have 10 power zealots and all other minions are locked due to the Abyss Ascendancy I swapped over to. So I can’t use them to utilize their moves. However they give me a huge boost when I ascended to abyss.</p>

<p>I never thought of using 1 ant and the rest Zealots. Could be beneficial, but again I can’t stand their sound and honestly I wanted to divert from using them altogether. Plus their cost is a lot of spirit if I’m not mistaken. The Zealots I believe is 55 spirit.</p>

<p>With all 10 Zealots and once they start attacking, their spark just melts any mobs inside. I dance around their spark in case any mobs I aggro and they simply melt inside.</p>

<p>When fighting a boss I stand close to it and once their animation of attacks start, my Zealots just melts them away.</p>
