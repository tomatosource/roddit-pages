      <label for="myn4s2n" class="commentText"><p>From Chris Forsberg:</p>

<p>Brad Stevens didn’t make a first-round pick in his first three years at the helm, preferring to utilize those assets to reshape the complementary pieces around the superstar tandem of Jayson Tatum and Jaylen Brown. That strategy delivered Boston to two NBA Finals appearances in three years, and helped the team raise Banner 18 in 2024. </p>

<p>But a new collective bargaining agreement is forcing teams to prioritize drafting and developing in order to piece together the complicated financial puzzle that comes with building around two big-ticket stars. Hitting on first-round picks has never felt more important for contending teams.</p>

      <label for="myn9r23" class="commentText"><p>Jake Issenberg had a Twitter poll recently, “would you trade Hauser for the 14th pick?” 80% of respondents said yes.</p>

<p>Then he tweeted a list of the last 25 #14 picks, Hauser was among the best players on the list. Hauser is already a playoff rotation caliber player, in his prime right now, on the same timeline as Tatum, and on a good value contract.  You only save $5m taking a shot with that rookie, and it’s guaranteed money on a player not guaranteed to ever be good.</p>

<p>The only way this move makes sense is if you somehow already have all the other deals basically worked out, and this is the last $5m you need to save in order to fill out the roster and remain under the 2nd apron. Or, if there’s a guy our scouting team <em>really</em> likes, and they fall to a position where trading Hauser on draft night allows us to move in and take him. Otherwise it’s just not a move maximize value.</p>
