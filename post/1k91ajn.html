

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>

<p>Life stacking spark blood mage is like a niche within a niche build, but this is all I got right now. I think it&rsquo;s actually very flexible, but it doesn&rsquo;t really come online as ez clear level dps without Rathpith.</p>

<div class="commentAndChildren">

    <div class="comment">

        <div>0 | 3 hours ago </div>
      </div>
      <label for="mpanwsn" class="commentText"><p>In general, people saying builds, classes, or items are “dead” lacks fundamental understanding of theory crafting and depends heavily on other people to craft their builds, as their minds completely shut down when balance changes comes in.</p>

        <div>0 | 2 hours ago </div>
      </div>
      <label for="mpap395" class="commentText"><p>hrmmm&hellip; low ES, low mana, high life&hellip;. is this a spark thorns build or something?</p>

  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="mpar2kg" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>levyb</div>
        <div>2 | 2 hours ago </div>
      </div>
      <label for="mpar2kg" class="commentText"><p>Spark life stacker. Rathpith is a unique focus that makes health grant crit rate and spell damage - blood mage already gets a health to crit damage bonus node. All up, it makes health the ur-stat - all you need for more damage, more survivability is .. more health.</p>

<p>Also the hat disables resistances in exchange for health, and the body disables spirit in exchange for giga flat health, so it really is truly locked in on health stacking. I could probably swap the cataclysm seed out for another few hundred health, and even the trampletoe boots are just for super clean mapping - those could be even more health.</p>
