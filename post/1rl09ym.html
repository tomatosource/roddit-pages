

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/s6wuurkix3ng1.png"><p>Question about bowcrafting</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/s6wuurkix3ng1.png" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="o8oxyp4" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>RubyR4wd</div>
        <div>1 | 5 hours ago </div>
      </div>
      <label for="o8oxyp4" class="commentText"><p>Uh&hellip;. Wouldn&rsquo;t you just des crate a suffix&hellip; You already won&rsquo;t get accuracy on your prefix.  You can have a 50% chance for +3 and then omen of light until t1 crit chance?</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="o8pr4g2" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Initial_Butterfly547</div>
        <div>1 | 2 hours ago </div>
      </div>
      <label for="o8pr4g2" class="commentText"><p>Maybe try desecrate attack speed then perfect exalt suffix and keep essence of abyssing it off with jawbone that is targetting a t1 flat phys prefix (omens of light are the costly part). If the suffix is desecrate you can just replace with random essence suffix. if you hit flat phys you can always skip until you hit the crit. But the issue is this is an expensive craft so you&rsquo;ll have 1 dead suffix but you can <sup>50</sup>&frasl;<sub>50</sub> skills once you get crit. If you are open to surpassing or crit bonus it&rsquo;s probably <sup>1</sup>&frasl;<sub>40</sub>. If omens of lights were 10 div again it would cost 1200-1500 divinge.</p>

<p>fracture attack speed (<sup>1</sup>&frasl;<sub>3</sub>)</p>

<p>crit by exalt suffix/abyss/light (<sup>1</sup>&frasl;<sub>100</sub>) - 8500 divines</p>

<p>attack skills essence (<sup>1</sup>&frasl;<sub>2</sub>)</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="o8okcpc" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>HappyHopping</div>
        <div>-1 | 6 hours ago </div>
      </div>
      <label for="o8okcpc" class="commentText"><p>It doesn&rsquo;t matter. You are going to annul down to one mod anyways if you hit % phys and chaos spam for crit. But I would of started with a 30% quality base.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="o8omwkz" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>SelectionOpening5445</div>
        <div>3 | 6 hours ago </div>
      </div>
      <label for="o8omwkz" class="commentText"><p>Thank you. It hit speed but I will try again after I find some more bases in temple</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

        
      
    </div>
  </body>
</html>
