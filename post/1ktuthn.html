

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/jmwviyy8ll2f1.png"><p>should this not have double the lightning damage? (10-198)</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/jmwviyy8ll2f1.png" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="mtwnd3d" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>whatisagoodnamefort</div>
        <div>11 | an hour ago </div>
      </div>
      <label for="mtwnd3d" class="commentText"><p>Increased elemental is global, not local</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="mtwo0of" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>zentim</div>
        <div>0 | an hour ago </div>
      </div>
      <label for="mtwo0of" class="commentText"><p>got it. thanks.</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="mtwnc84" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>dvolper</div>
        <div>2 | an hour ago </div>
      </div>
      <label for="mtwnc84" class="commentText"><p>Inc ele damage is global. Inc phys is local. Don&rsquo;t ask me why.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="mtwomgt" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Fysiksven</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="mtwomgt" class="commentText"><p>Conditional mods are always global. &ldquo;with attacks&rdquo; makes it a conditional mod.</p>

<p>You could argue that it they could just remove the conditional part and let it be local as it would still the only apply to attacks, since the weapons damage only affects attacks with that weapon, but this difference is one of the big differences between physical and elemental scaling and everything doesnt need to be the same as long as its consistent, which it is in this case. In POE1 the settlers enchant &ldquo;has #% increased elemental damage&rdquo; on two handed swords is indeed local which is why its so strong.</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="mtwqwyw" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>micopwns</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="mtwqwyw" class="commentText"><p>Good question. Unfortunately this is something that could use some better clarification in the game. Items can have both &ldquo;local&rdquo; and &ldquo;global&rdquo; modifiers.</p>

<p>Local modifiers scale stats specific to that item, and will be visible in the resulting stats on the item. Global modifiers don&rsquo;t show in item stats, but affect your character (i.e, affect the combined values across all of your gear and passives). For example, % energy shield on some boots will increase the base energy shield value of those boots. Whereas &ldquo;increased maximum energy shield&rdquo; on an amulet will scale the combined total energy shield across your gear. It&rsquo;s a little more clear in that example because amulets do not have local modifiers, but weapons can roll either.</p>

<p>% elemental damage with attacks is a global modifier, so it will not show on the weapon, but it will be added to your overall pool of % increased damage.</p>

<p>The +% crit chance is local, and so is the added flat lighting damage. You can tell the crit is local because it changes the color of the base crit chance on the weapon to blue. If you had % phyical damage, that is also a local mod, and would scale your 40-83 phys to something higher and be blue as well.</p>

<p>You can read more about it on poe2wiki if you search &ldquo;modifiers.&rdquo;</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="mtwmpyy" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>KayserFuzz</div>
        <div>0 | an hour ago </div>
      </div>
      <label for="mtwmpyy" class="commentText"><p>Im a noob at item stat stuff but if Im right the damage increase wont be reflected in the item but the actual attack gem/auto attack</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="mtwmp8f" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>menteto</div>
        <div>-2 | an hour ago </div>
      </div>
      <label for="mtwmp8f" class="commentText"><p>Why would it?</p>
</label>
    </div>
  </label>
  
</div>

</html>
