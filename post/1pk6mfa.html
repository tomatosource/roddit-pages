<div class="commentAndChildren">
  <input id="ntins4s" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>swedg3</div>
        <div>8 | 7 hours ago </div>
      </div>
      <label for="ntins4s" class="commentText"><p>Incinerate is getting big changes in 0.4 with Last of the Druids. The skill loses its stages, and instead now accumulates ignites as you channel.</p>

<p>This makes the damage of the skill heavily dependent on the channel period and also your crit strike chance and multiplier. We get into those in this vid.</p>

<p>tl;dw: it&rsquo;s a nerf almost across the board but for really high crit chance builds, the full channel duration is a big buff.</p>
</label>

        <div>3 | 6 hours ago </div>
      </div>
      <label for="ntj2j3i" class="commentText"><p>Amazing video the damage numbers are insane to understand, i will be using <a href="https://mobalytics.gg/poe-2/profile/c2f876b5-4295-489a-b0d7-37a18afb440d/builds/34e731cf-c8ed-48b1-8d15-9ba6c8d2a223" target="_blank">incinerate</a> on maps/bosses, i dont think that you are obligated to go with high crit chance since you will be socketing Eternal Flame III and Total Incineration to refresh ignites. These changes make duration on ignites waaaaaay more important now, if you get stunned with low crit chance your damage will falloff, but with decent increase duration of ailment + temporal chains this might not be so bad.</p>

<p>CoEA nerf on this build might not be so bad, you will still be killing white mobs with incinerate, tough monsters will acelerate the energy with more ignites on it, since we will get a lot of flammability buffs and cast speed doesnt matter since incinerate doesnt have stages considerate casting is amazing for it</p>
