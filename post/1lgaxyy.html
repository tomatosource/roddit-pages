.commentList {

body > .commentList {

}

.commentAndChildren {

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>

      <label for="myv4nkg" class="commentText"><p>That accuracy roll is crazy! Big damage with Amazon.</p>

<p>The Quarterstaffs for Flicker are actually pretty flexible in the prefixes. It has high base damage, hits quick, and doesn’t convert phys damage to an element like elemental skills would, meaning it is just all your weapon + rings + glove damage added straight to the skill. So the QS can have a ton of phys and be good, or no phys like the Bolting with 3 elemental prefixes and also be just as good for flickering. The suffixes are what really matter and you got all the right ones there too, the numbers could just be bigger with higher tier affixes. The +melee skills is an interesting one, it adds great damage, but I have a +7 that I don’t even use because it is so mana heavy. I think +3-5 melee skills is a good spot, but also attack speed could be good in that spot</p>
