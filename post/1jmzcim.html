

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://v.redd.it/csydihyprpre1"><p>KP ready to go</p>
</a>
    </h2>

    

    <div class="commentList">
      
        
          
<div class="commentAndChildren">

      </div>
      <label for="mkfqq00" class="commentText"><p>Nice wish I was on the court side but I&rsquo;m up higher. The hype is real.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="mkfz40x" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>davidasc22</div>
        <div>9 | 19 hours ago </div>
      </div>
      <label for="mkfz40x" class="commentText"><p>Dudes a true shooter. 3 level scorer. His 3pt percentage this year is on par with Hauser and Pritchard which is borderline ridiculous.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="mkfvfsc" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>deets23_ | Jayson Tatum</div>
        <div>4 | 20 hours ago </div>
      </div>
      <label for="mkfvfsc" class="commentText"><p>He hit corner 3s!!</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="mkitvpu" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>TodayAdmirable3869</div>
        <div>3 | 5 hours ago </div>
      </div>
      <label for="mkitvpu" class="commentText"><p>I&rsquo;m getting pretty tired of the recent stoking of trade rumors involving KP. Yes, he misses games, this is nothing we didn&rsquo;t know when we traded for him. I don&rsquo;t think people realize how important KP truly is to this team. Without him, the C&rsquo;s are still an elite contender, but with KP on the floor this team becomes virtually unguardable.</p>

<p>I guess it&rsquo;s really contingent upon whether he can survive an entire post season run. If he can do that, then I do not give a single fuck if he misses 40 meaningless regular season games a year, he&rsquo;s worth it. God forbid he fails to do that two years in a row, maybe then we have to have this conversation.</p>

<p>Either way, I&rsquo;m going to be devastated if this team parts ways with Porzingis.</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
