

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>

    <h2>

</a>

    <div class="commentList">

        <div>2 | 7 hours ago </div>
      </div>
      <label for="mjr65d8" class="commentText"><p>Need to see a POB to have any idea at all of what you need to fix. Need to see your skill tree/all your gear/actually accurate calculations (in game tooltips are all awful basically)</p>

<p>Only thing I can see from this info is:</p>

<p>-Your life/ES are terribly low
-Your evasion is very low; even if you’re using Acrobatics.
-You have no ele scaling on your weapon, and I’m assuming you’re using shockburst rounds.
-It sounds like you also have no ele scaling on your other gear.
-You need elemental damage to scale Ailments. Shock specifically is an enormous multiplicative modifier to your damage; more Lightning damage = higher shock.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">

      </div>
      <label for="mjr8mt6" class="commentText"><p>Are your rocking acrobatics?  Your evasion is a little low.  I just beat him with 2.3k life, 700 ES but I have 81% evasion with acrobatics.</p>

<p>My pathfinder could take a hit and not insta die and I&rsquo;d recover with health pots</p>

<p>Gas arrow build Pathfinder lvl 88</p>
</label>
    </div>
  </label>
  
</div>

      <div class="commentHeader">
        <div>Narrow-Rub3596</div>
        <div>1 | 7 hours ago </div>
      </div>
      <label for="mjra0rh" class="commentText"><p>Dunno what your talents look like. But probably worth reevaluating those, maybe a bit more focused around your main ability. Your weapon looks fine enough, I’m sure someone on here will say it’s low compared to their 200div crossbow but the fight itself should be more than doable.</p>

<p>Also, check out other builds and see what support gems they use. It’s a pretty good way to get ideas at least even if you want to avoid build guides. That’s what I do anyways</p>

</html>
