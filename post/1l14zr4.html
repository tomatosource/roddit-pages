

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://www.xbox.com/play/media/cZ6SHsQeE4"><p>What&rsquo;s the word for this death?</p>
</a>
    </h2>

    

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="mvih5ww" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>TrinityKilla82</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="mvih5ww" class="commentText"><p>🤔 Fucked</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="mviknzc" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Cypher1643</div>
        <div>1 | 32 minutes ago </div>
      </div>
      <label for="mviknzc" class="commentText"><p>The more important context for me would be what map mods you were running, and what your resistances are like. Your HP+es is only 3k. Lightning conduits from rare mods could hit for that much, especially if you either don&rsquo;t have full res or you are running extra monster DMG, gain as extra DMG, ele pen, crit, etc.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="mvilezx" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>SilverArrows6662</div>
        <div>1 | 27 minutes ago </div>
      </div>
      <label for="mvilezx" class="commentText"><p>There&rsquo;s always ppl who will defend this.</p>

<p>Full res for everything except chaos. But regardless, even if all my reses were -100 and I had 1 hp and 1 es, I shouldn&rsquo;t die on entry. Players should be given time to react. There&rsquo;s zero time to react, I enter, there&rsquo;s a transition screen, and my wind dancer procs and the chaos ball explodes in my face.</p>
</label>
    </div>
  </label>
  
</div>

    
      
<div class="commentAndChildren">
  <input id="mvim9ir" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>SilverArrows6662</div>
        <div>1 | 22 minutes ago </div>
      </div>
      <label for="mvim9ir" class="commentText"><p>The point I&rsquo;m trying to make here, you can make a tanky build, tank tons of damage and that&rsquo;s one way to play.
The game should also allow players to rely on their skill and if they feel like they have the dexterity to telegraph and escape damage then that&rsquo;s a viable strat too. But if damage is unavoidable, then that&rsquo;s a problem. The purple balls can&rsquo;t be exploding as u reenter the arena, that&rsquo;s just lame.</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="mvigers" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>boratkitajama</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="mvigers" class="commentText"><p>suicidal</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
