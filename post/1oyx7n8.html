}

.postLink:visited {

.postHeader {

  font-size: 24px;
  font-weight: bold;

.commentList {

  flex-direction: column;

  padding-left: 32px;

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

      <label for="npahjrn" class="commentText"><p>I just said a wand video because you want the same rolls as a staff and it&rsquo;s the same process, but not many people use staffs instead of a wand, so there&rsquo;s not many, if any, videos.</p>

<p>If a staff is working for you on your unique spark build, that&rsquo;s great. It&rsquo;s nice to see people doing their own thing. If you want the meta blasting build, a wand with rathpith is the way to go.</p>

<p>The following crafting knowledge is only applicable to this league and may very well change in 0.4. Most modifiers on an item have a corresponding tag to them as you can see on <a href="https://poe2db.tw/us/Staves#ModifiersCalc" target="_blank">this list</a>. Certain highly desired modifiers like +skills and rarity have no tags. You typically want to fracture those mods since they cannot be deterministically added to an item and attempts to add them become pure RNG.</p>

<p>The two cornerstones of crafting this league are omens of exaltation (homogenous, dextral, and sinistral) and the abyss system. The omens use the tags on the mods to give you either guaranteed or highly likely outcomes. Abyss crafting serves as both an RNG buffer and another tool to manipulate outcomes in conjunction with omens.</p>
</label>
