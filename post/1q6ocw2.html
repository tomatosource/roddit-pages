

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://v.redd.it/ht8gqo4g4zbg1"><p>Got my first double spectrum cache while farming sekhemas</p>
</a>
    </h2>

    

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="ny93lca" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Most_Human</div>
        <div>3 | 6 hours ago </div>
      </div>
      <label for="ny93lca" class="commentText"><p>Oh man the feeling and the sound on getting those. Gz!</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="nyaw8fa" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Neuy_</div>
        <div>1 | 42 minutes ago </div>
      </div>
      <label for="nyaw8fa" class="commentText"><p>Yup, it definitely made up for the bad relic drops from the boss!</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nyadtbz" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Eldahos</div>
        <div>2 | 3 hours ago </div>
      </div>
      <label for="nyadtbz" class="commentText"><p>Noob question: Do you keep your keys until the last chests when farming?</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="nyas78h" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Neuy_</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="nyas78h" class="commentText"><p>Yes, the best chests are the ones at the end (prime caches). I don’t bother with bronze keys or chests. Spectrum cache &amp;gt; Time-lost cache &amp;gt; Arcanist’s cache &amp;gt; Royal cache/Mysterious cache is how I usually prioritize them.</p>

<p>But many times I just go for spectrum, time-lost, arcanist’s and skip the rest (takes way too much time to go through all of the jewel drops otherwise).</p>

<p>My main goal is always to get the vase relic drops (and hopefully also the incense relic). Everything else is just a bonus.</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

        
      
    </div>
  </body>
</html>
