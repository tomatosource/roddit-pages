      <label for="nmwpj44" class="commentText"><p>From Chris Forsberg:</p>

<p>The Boston Celtics just wrapped up a blizzard of early season basketball, logging five games in seven nights with matchups against some of the top teams in each conference. But amid that 240-minute blur, one play is seared in our brains more than any other. </p>

<p>Late in the third quarter in Philadelphia on Friday night, as Boston&rsquo;s double-digit lead evaporated in an NBA Cup tilt with the 76ers, Quentin Grimes collected a Celtics turnover and broke out in transition for what should have been a breezy breakaway dunk. Even with the swat-happy Derrick White in pursuit, Grimes coasted toward the basket, only to get unexpectedly met at the rim by a full-throttle Hugo González. </p>

<p>The Celtics’ rookie had covered 80 feet from the opposite side of the floor before brazenly trying to contest at the rim. He succeeded in denying the dunk, though a foul was whistled, and Gonzalez crashed hard into the stanchion beyond the basket for his troubles. </p>

<p>It’s the sort of hustle play that can endear you quickly to the Celtics fan base. Gonzalez could have been forgiven if he elected to linger near the midcourt stripe given that a Grimes dunk seemed inevitable. Instead, he put his head down and sprinted, then launched himself like a SCUD missile trying to intercept Grimes at the basket. Teammates rushed off Boston’s bench to pry him off the floor for his effort. </p>

<p>Gonzalez has played just 76 minutes over the first five games of his NBA career (15.2 per game). He got a surprise start against Cade Cunningham and the Detroit Pistons, then logged a DNP in New Orleans the very next night. That about sums up the life of a rookie under Joe Mazzulla.</p>

<p>But even in small doses, Mazzulla has displayed solid trust in Gonzalez, or at least what he hopes Gonzalez might eventually be.</p>

</label>
