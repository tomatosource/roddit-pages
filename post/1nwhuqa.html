

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/l91rfoyiwrsf1.png"><p>My experience running 3x additional rogue exiles&hellip;</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/l91rfoyiwrsf1.png" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="nhg0vr8" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>OutHereRunnin</div>
        <div>5 | 3 hours ago </div>
      </div>
      <label for="nhg0vr8" class="commentText"><p>They&rsquo;re also sick of getting 1 shot by abyss rares.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nhg4ct3" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Skaugy</div>
        <div>3 | 2 hours ago </div>
      </div>
      <label for="nhg4ct3" class="commentText"><p>I have a feeling that running the tablets 1 at a time is going to work a lot better. Seems like they tend to spawn in clumps, so if they miss they are likely to all miss.</p>

<p>I was running this strat with triple tower setups pre patch and it was wildly inconsistent. Even when they spawn close to the abyss, they aren&rsquo;t influenced by it most of the time.</p>

<p>It might be a better experience to make them spawn in the abyss every time and then just have a % to drop the diamond. Instead of having a % to spawn in as abyss influenced and always drop the diamond.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="nhg5ewa" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>SuViSaK</div>
        <div>1 | 2 hours ago </div>
      </div>
      <label for="nhg5ewa" class="commentText"><p>Are the influenced by abyss if they walk in proximity of a crater and cracks as opposed to already spawning around one?</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="nhg7osi" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Skaugy</div>
        <div>3 | 2 hours ago </div>
      </div>
      <label for="nhg7osi" class="commentText"><p>No, you can&rsquo;t kite them into the abyss. They need to spawn in and be influenced. It&rsquo;s similar to how you can&rsquo;t kite normal mobs into the abyss.</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

    
      
<div class="commentAndChildren">
  <input id="nhgc4xn" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>ihasamoose</div>
        <div>2 | an hour ago </div>
      </div>
      <label for="nhgc4xn" class="commentText"><p>Have you tried running the one tablet? Do you supplement it with chance to spawn rogues vs. Additional?</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nhgf4hc" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>gswth</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="nhgf4hc" class="commentText"><p>Narrow maps but not to narrow ftw</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nhggmre" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Slarenon</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="nhggmre" class="commentText"><p>Ran 9 maps overrun by abyssal with one guaranteed rogue exile and all 9 spawned next to the abyss, might be bugged might be unlucky</p>
</label>
    </div>

</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nhgh4cy" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Chaunskey</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="nhgh4cy" class="commentText"><p>Damn dude share some with the rest of us!</p>

</div>

        
      
    </div>
  </body>
</html>
