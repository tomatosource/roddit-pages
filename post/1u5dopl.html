

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/9eecsaek077h1.jpeg"><p>Spirit Walker is a Druid</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/9eecsaek077h1.jpeg" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="orjzhiz" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Methodic_</div>
        <div>8 | an hour ago </div>
      </div>
      <label for="orjzhiz" class="commentText"><p>Did you know the bear&rsquo;s name is Apollousa?</p>

<p>Pretty crazy.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="ork1c4b" type="checkbox" checked/>

        <div>Admirable_Guidance52</div>
        <div>2 | an hour ago </div>
      </div>
      <label for="ork1c4b" class="commentText"><p>the optimal summoner spirit walker is still going to have you travel to the top of tree for the minion stuff because there aren&rsquo;t enough companion nodes. druid can just do rage stacking for big minion bonuses and you&rsquo;re closer to all the minion damage</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="ork3vly" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Neckworn [OP]</div>
        <div>1 | 43 minutes ago </div>
      </div>
      <label for="ork3vly" class="commentText"><p>Yeah right, if you play full on summoner you are probably right.</p>

<p>Personally I play a hybrid build since sacrificing a single ring slot for the taming + companion damage scaling and some clever weapon set skill points will still give you good twister DPS in addition.</p>

<p>I love this Playstile quite a bit, specced into the 3 spirits + all in on the bear for the weapon damage scaling, with a high level wolf pack</p>
</label>
    </div>
  </label>
  
</div>

    
      
<div class="commentAndChildren">
  <input id="ork6ejb" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>TheSinhound</div>
        <div>1 | 23 minutes ago </div>
      </div>
      <label for="ork6ejb" class="commentText"><p>Is there a Witch Split Personality? That would be pretty great tbh.</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="ork1u30" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>igniz13</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="ork1u30" class="commentText"><p>Druid has more minion nodes, which also work for companions.</p>

<p>The werewolf side also lets you run with a pack, but I really hope they have a third ascendancy that gives a big companion.</p>

<p>Maybe have a talisman counts as spears node.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="ork2xmh" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Aiona_C</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="ork2xmh" class="commentText"><p>Yeah too bad druid can&rsquo;t tame big bosses. You can still  make use of Pr3vies Infernal minion since druid is close to a lot of minion health and damage nodes.</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
