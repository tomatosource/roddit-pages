

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/41qc15fb1mih1.png"><p>newbie question  about charms</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/41qc15fb1mih1.png" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="p2wta9x" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>k_mf_W</div>
        <div>1 | 13 minutes ago </div>
      </div>
      <label for="p2wta9x" class="commentText"><p>Yea bro whatever you want</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="p2wtora" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>damon-030 [OP]</div>
        <div>1 | 12 minutes ago </div>
      </div>
      <label for="p2wtora" class="commentText"><p>gotcha, thx &amp;lt;3</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="p2wtve4" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>ffsine</div>
        <div>1 | 11 minutes ago </div>
      </div>
      <label for="p2wtve4" class="commentText"><p>Yes, but also no. Campaign you should prioritize resistance and at act 4 you should have a feel for which ones you want to run. Later in your characters progression youll have max resistances so most people run some combo of utility. I use freeze stun and slow charms for the endgame.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="p2wu4g8" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>donuthead36</div>
        <div>1 | 10 minutes ago </div>
      </div>
      <label for="p2wu4g8" class="commentText"><p>That’s pretty much it. I tend to run the fire/lightning/cold resist ones early in the campaign when I’m nowhere near maxing out my resists. Mostly use freeze, stun, slow charms in endgame but will swap based on content (e.g., I’ll use a poison charm if I know I’ll be encountering a lot of that or golden if I’m running easier content)</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="p2wua1h" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>IAmXlxx</div>
        <div>1 | 9 minutes ago </div>
      </div>
      <label for="p2wua1h" class="commentText"><p>yeah, sure, preference. I use charms as a crutch for whatever weaknesses my build has at a given moment. prior to capping your resistances at 75%, I&rsquo;d use whichever charm to support your lowest value resistance.</p>

<p>ln early endgame, the stone and thawing charms were huge for preventing a ton of stupid deaths, before I was able to really build up my defensive layers like evasion and energy shield.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="p2wuo48" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Tkmisere</div>
        <div>1 | 7 minutes ago </div>
      </div>
      <label for="p2wuo48" class="commentText"><p>Use the one that protects you against the most annoying thing for you. Maybe its bleed or ignite. Maybe its slows or freeze/stun.</p>

<p>You could also forsaken them for unique charms that gives some effects like the power/endurance/frenzy charges charms</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="p2wuveg" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>sendnukes_</div>
        <div>1 | 6 minutes ago </div>
      </div>
      <label for="p2wuveg" class="commentText"><p>Only hyper specific builds might need a specific set of charms. Or if you&rsquo;re playing a low life + energy shield build, then YOU NEED a bleed charm (or some other way to get immunity, but charms are the easiest)</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="p2wvfdd" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>xkibagamigenjurox</div>
        <div>1 | 4 minutes ago </div>
      </div>
      <label for="p2wvfdd" class="commentText"><p>Freeze charm could be the most important one but other than that, whatever your character is most lacking for</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
