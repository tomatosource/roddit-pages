

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/mdiein9f1leh1.jpeg"><p>Looking for Crafting direction and help on these gloves that I found</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/mdiein9f1leh1.jpeg" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="oyv8kxo" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>ExistingMouse5595</div>
        <div>5 | 4 hours ago </div>
      </div>
      <label for="oyv8kxo" class="commentText"><p>Those would be nice as martial artist stone fist gloves.</p>

<p>If you can get a flat damage on these and preferably remove the max life you’re looking at a really nice pair. As to how to do that, I have no clue. Would likely be very rng heavy</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="oyv9i24" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>bennyrosso</div>
        <div>2 | 4 hours ago </div>
      </div>
      <label for="oyv9i24" class="commentText"><p>I guess you put the flat with the abyssal item to dessecrate, the expensive one for T1.</p>

<p>Use it with echoes to reroll if you don&rsquo;t get the flat, use the omen of light and another dessecration if you don&rsquo;t get it with the second roll, repeat until you get the flat.</p>

<p>Then you can try activate a omen of whittling to see what it would remove with the chaos orb to see if maybe it&rsquo;s life.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="oyvbogd" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>SilvarioGospel [OP]</div>
        <div>3 | 4 hours ago </div>
      </div>
      <label for="oyvbogd" class="commentText"><p>Well I think I can socket Astrid’s to have two crafted mods and then cycle between desecration and essence of abyss but seeing if the there’s a good way to get at least one more better prefix (which I assume it’s just t1 flat damage)</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

    
  </div>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="oyv9e05" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>ComprehensivePea4988</div>
        <div>2 | 4 hours ago </div>
      </div>
      <label for="oyv9e05" class="commentText"><p>You want the prefix flat armor + es, and then the increased arm+es mod. You can yolo slam a perfect exalt with the double exalt omen, for the cheapest option.</p>

<p>Alternatively, you slam exalts and use prefix omens to annul and get at least one of the above mods, and then desecrate/omen of light for the second. But that would be quite expensive, and I don’t know if it’s even worth doing at this point in the league.</p>

<p>I wouldn’t call these gloves build defining by any means.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="oyvb2m9" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>I-N-V-A-L-I-D</div>
        <div>2 | 4 hours ago </div>
      </div>
      <label for="oyvb2m9" class="commentText"><p>These have no desecrated mod, as long as you’re willing to go to omen of light jail you’re (eventually) guaranteed to get what you want</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="oyvskjw" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>lordofthehomeless</div>
        <div>1 | 2 hours ago </div>
      </div>
      <label for="oyvskjw" class="commentText"><p>Omen for essence only prefix, use abyss essence to remove current prefix, hit it with bone. Abyss roll with reroll omen. Perfect exalt with double omen.</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
