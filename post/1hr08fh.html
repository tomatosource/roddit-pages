      <label for="m4tyxfx" class="commentText"><p>So Springer needs to go because he doesn’t fit this team BBIQ requirements. Like I can see he is a better individual defender than Drew Peterson, for example, yet Peterson is a better overall defender because he can use his brain to stay grounded whereas Springer can’t.</p>

<p>Now, for easy mathematics I’m assuming the vet min is 2.9M, if we were to dump Springer and sign both Lonnie Walker and Oshae Brisset it would cost us 3.465M so that’s a 584k saved from Springer salary alone (meaning probably 2-3 ish total with taxes?). If you only get one of them you save an extra 1.8M or so in salary.</p>

      <label for="m4u4met" class="commentText"><blockquote>
<p>So Springer needs to go because he doesn’t fit this team BBIQ requirements.</p>
</blockquote>

<p>It&rsquo;s so interesting because Springer was very comfortably the highest IQ guy we had during Summer League.</p>

<blockquote>
<p>Now, for easy mathematics I’m assuming the vet min is 2.9M,</p>
</blockquote>

<p>It&rsquo;s functionally less.</p>

<p>There are two key points when looking at this sort of cap management:</p>

<ol>
<li><p>If you trade someone away before the end of the season, they don&rsquo;t affect your cap at all.</p></li>

<li><p>If you sign someone midseason, you only pay for the time they were with the club.</p></li>
</ol>

<p>Let&rsquo;s say you&rsquo;ve got a 2m vet min player. Right after G41, you trade him away and you sign another 2m vet min player to take his place. Your cap/tax hit for both those guys over the full season is only 1m.</p>

<p>It&rsquo;s a little more complex in terms of their actual paycheck, but that&rsquo;s why the cap/tax hit for Queta last year was only ~81k, His vet min was ~2.4m but he was only on the team for 3 games.</p>

<p>So the cap hit was: (2.4m / 82) x 3 = 81k = 3 games worth of salary.</p>

<blockquote>
<p>both Lonnie Walker and Oshae Brisset it would cost us 3.465M so that’s a 584k saved from Springer salary alone (meaning probably 2-3 ish total with taxes?). If you only get one of them you save an extra 1.8M or so in salary.</p>
</blockquote>

<ul>
<li><p>Lonnie Walker would be a 7th year vet. His vet min would be ~2.8m.</p></li>

<li><p>Oshae Brissett would be a 6th year vet. His vet min would be ~2.6m.</p></li>
</ul>

<p>However, that&rsquo;s if we signed them in the offseason. If we signed them middle of the season (just to keep the math easy) that&rsquo;s ~2.7m combined for the two.</p>

<p>You&rsquo;d actually be saving 1.3m (before taxes) by trading Springer and signing those two.</p>

<p>Although realistically, Peterson is likely signed right at the end of the season, similar to what we did with Queta.</p>

<p>It would look something like this:</p>

<ul>
<li><p>Trade Springer&rsquo;s 4m contract</p></li>

<li><p>Sign Lonnie Walker for 2.8m (but he only costs 1.4m)</p></li>

<li><p>Keep playing Peterson as a 2-way, then sign him right at the end of the year for &amp;lt;100k.</p></li>

<li><p>Total savings ≈ 2.5m before tax</p></li>
</ul>

<p>And instead of Lonnie Walker you can swap in basically anyone. Lamar Stevens, Oshae Brissett&hellip; etc etc.</p>

<p>Even if you went the most expensive option (like Dwight Howard as a +10 year vet), you&rsquo;re still saving around 2-2.5m.</p>
</label>
