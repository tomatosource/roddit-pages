

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/rmr4xz8eacwg1.jpeg"><p>Lots of cool, old baseball references in new game &lsquo;Mouse, P.I. For Hire&rsquo;</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/rmr4xz8eacwg1.jpeg" />

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="oh8z18s" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>shotgun_shaun | Cleveland Guardians</div>
        <div>54 | an hour ago </div>
      </div>
      <label for="oh8z18s" class="commentText"><p>The game is awesome (think Mickey Mouse meets Bioshock meets Chinatown) but one of the neater things I was <em>not</em> expecting was the baseball card mini-game which has a ton of references/winks to real former players from the deadball era.</p>

<p>First one I noticed was &lsquo;Charlie Pepper&rsquo; whose bio is almost beat for beat &lsquo;Old Hoss Radbourn&rsquo;s&rsquo; but then as I have played some more, I have also found &lsquo;Rube Sharp&rsquo; (referencing Rube Waddell&rsquo;s offseason gator wrestling) and &lsquo;Josef Bunz-Konicky&rsquo; for Len Koenecke (which I only know of from some random thread on crazy baseball stories from this subreddit)</p>
</label>
    </div>
  </label>

    </div>
  </label>
  
</div>

    
  </div>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="oh91uus" type="checkbox" checked/>

      <div class="commentHeader">
        <div>oogieball | Dumpster Fire • New York Mets</div>
        <div>6 | an hour ago </div>
      </div>
      <label for="oh91uus" class="commentText"><p>Never heard of this game before, but now I am interested.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="oh9620q" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>shotgun_shaun | Cleveland Guardians</div>
        <div>5 | an hour ago </div>
      </div>
      <label for="oh9620q" class="commentText"><p>If you like old school FPS shooter story based games, you will love it. Even more if you are a classic cartoon fan. It has a bit of Roger Rabbit feels too.</p>

  </label>
  
</div>

    
  </div>
  
</div>

  </body>
</html>
