

<html>

    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>

<div class="commentAndChildren">

      <label for="nw5sbzl" class="commentText"><p>I know it’s not a new class, but I am enjoying my lightning spear Amazon. Classic but goodie.</p>

      <div class="commentHeader">

        <div>1 | an hour ago </div>
      </div>
      <label for="nw5sglc" class="commentText"><p>Rage Wizard. Ie, using Rage (Shaman) to power Sorc spells. I am in end game, comfortably doing juiced T15. With 55 points of Rage, you are adding a generic 3.38 multiplier to any and all spell damage as base. Max possible Rage is 61 points for 3.69 spell damage multiplier. This is without taking into account the support gem that uses Rage for 35% more dmg.</p>

<p>I am still figuring other things out. Death in juiced map is very much possible, and empowered bosses can one shot me. So now I am trying to figure out survivability without hurting the high mana reg needed for this build.</p>
</label>
    </div>
  </label>

      </div>
      <label for="nw603xj" class="commentText"><p>What are you using for spells? I leveled a rage based shaman spell caster for plants and i just kinda&hellip; dont like the plants. Its just not my playstyle. I just cant think of anything neat to transition it into</p>
</label>

<div class="commentAndChildren">

    <div class="comment">
      <div class="commentHeader">

        <div>1 | 24 minutes ago </div>
      </div>
      <label for="nw5xtd0" class="commentText"><p>Im doing a tactician atm that uses Mirage Archer to essentially &ldquo;dual cast&rdquo; Hailstorm Rounds, i changed em from time to time but that was the gist of it(theres no meta Ballista totem yet). The Mirage starts at full ammo and we can like unload both of our ammo(40-50 each) into a mob pack or boss, add in emergency Reload for another payload of hailstorm. Boss will be Freeze + Pinned + Stun for the most of the fight and you are far away enough to kite them down with little to no retaliation.</p>

<p><a href="https://youtu.be/ASH01XxfNtk?si=HPeVXlsi8B2GTR7O" target="_blank">https://youtu.be/ASH01XxfNtk?si=HPeVXlsi8B2GTR7O</a></p>
