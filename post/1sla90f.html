      <div class="commentHeader">

      <label for="og5cbs8" class="commentText"><p>Ok so.</p>

<ol>
<li>Presence Area of Effect</li>
</ol>

<p>It&rsquo;s not that important. You can get a lot of presence from Warlords Leader and Nodes leading up to Inc Spirit on a tree. Also Jewels can have very substantial amount of it - as long as you are not pure aura bot that mod is mid on a Sceptre as there are better alternatives.</p>

<ol>
<li>Desired Suffixes =&amp;gt; depends on what you want to play as. So here is the kicker =&amp;gt; if you want to play infernal legion the problem is that Rattling is the wrong base. You should have went for Omen Sceptre as it allows for Ignite to Crit which snapshots it and makes ignite insanely strong with sufficiently stacked Critical Bonus. That path however is kind of closed due to base being rattling (unless you would do something like Eggify of Cruelty and use maybe thunderstorm for stacks of critical weakness). I highly recommend seeking on Youtube 1HundredGrade with his videos about this.</li>
</ol>

<p>Usually for BiS you would want something like:</p>

<p>+4/Attack Speed/Minion Life<br>
+4/Attack Speed/Critical Chance<br>
+4/Cast Speed/Critical Chance<br>
+4/Attack Speed/Critical Bonus<br>
+4/Critical Bonus/Minion Life (for pure infernal legion build but that&rsquo;s on Omen Sceptre).</p>

<p>You have to ask yourself first what your minions actually are going to be than decide on suffixes.</p>

<ol>
<li>As for approach to finishing suffixes:<br>
The problem with Suffixes on Sceptre is that you have two/three undesired suffixes which are of higher level than 78 (+4 is 78) which means they can duck you during the whittling process. Those suffixes are T1 Mana Reg/T1 Elemental Res/T1 Minion Life.</li>
</ol>

<p>On avg each of them is 10 times more likely to appear than +4.</p>

<p>Now about crit suffixes =&amp;gt; they are almost as rare as +4. (8 times less likely than minion T1 minion life).</p>

<p>So a lot will depend on does your final desired suffix combination contain crit/crit bonus as it makes things more complicated.</p>

<ol>
<li>Normally what you do is you spam Dextral Erasure until hitting first one of your desired affixes (unless it&rsquo;s speed affix =&amp;gt; those need to be always picked in 2nd or 3rd step as they are to low level).</li>
<li>Than you whittle (sometimes with dextral erasure to protect Spirit Hybrid) and pray to hit 2nd affix before hitting one of the tree brickers (T1 mana reg/t1 ele res/t1 minion life (unless it&rsquo;s desired).</li>
<li>If you hit a bricker which means whittle would target your 1st prefix:</li>
<li>If your desired affixes do not contain crit/crit bonus and step 1 did not result in +4 =&amp;gt; Use Dextral Annulment and gamble annul. Price wise it even if you lose getting back the 1st affix should be cheaper than cost of Hinekora Lock.</li>
<li>If your first affix was Crit/Crit Bonus/+4 than it&rsquo;s worth using Hinekora Lock in order to deterministically (about 98% chance) remove bricking affix. Peek each tier of chaos orb, annul orb, each tier chaos orbs with erasure omen, annul orb with dextral annul omen, Perfect Essence of Command and Perfect Essence of Command with Dextral Crystallization Omen. You have 98% chance for at least one of them to hit the affix you want to remove just remember to peek all combinations of chaos omen first as one of them may not only remove bricker but also change it to desired affix.</li>
<li>Finish with desecration (this most likely will be +4 which requries on avg 41 attempts with reroll and ancient jawbone or 89 with normal jawbone and reroll).</li>
</ol>
</label>
