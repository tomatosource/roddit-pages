<p>But for me, he&rsquo;s also one of the top <em>&lsquo;next Derrick White&rsquo;</em> candidates around the league. 6&rsquo;5 combo guard who can play both sides of the ball, although he&rsquo;s shown more offensive promise than defensive promise. He&rsquo;d help give us a lot of size and versatility in the backcourt.</p>
