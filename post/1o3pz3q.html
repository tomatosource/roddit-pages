

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://www.reddit.com/gallery/1o3pz3q"><p>Why is the Recombinator behaving like this?</p>
</a>
    </h2>

    

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="niwrrcm" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>kzarif</div>
        <div>1 | 14 minutes ago </div>
      </div>
      <label for="niwrrcm" class="commentText"><p>looked up volatile wands with spell physical damage mod on trade and none showed up. Guess that mod can&rsquo;t roll on that base?</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="niwsmsq" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>poscet</div>
        <div>1 | 5 minutes ago </div>
      </div>
      <label for="niwsmsq" class="commentText"><p>Damn, you&rsquo;re right. Poe2db actually shows it has a <em>no_physical_spell_mods</em> tag. Had no idea that was a thing</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="niwsfsp" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Far-Wallaby689</div>
        <div>1 | 7 minutes ago </div>
      </div>
      <label for="niwsfsp" class="commentText"><p>Volatile Wand can&rsquo;t roll %spell phys damage and Siphoning Wand can&rsquo;t roll +# to fire spells. You can&rsquo;t recombine a mod onto an item that can&rsquo;t have it naturally.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="niwsg8b" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>International_Gate49</div>
        <div>1 | 7 minutes ago </div>
      </div>
      <label for="niwsg8b" class="commentText"><p>Spell physical can only roll on physical/generic wands. Volatile is a fire wand base so cannot roll that mod. So you cannot transfer it to that base.</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
