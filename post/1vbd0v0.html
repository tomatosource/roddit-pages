

<html>

    <style>
       * {
  margin: 0;

}

*,

}

body {

}

.commentText,

.commentHeader {

.postTitle {
  text-decoration: none;

.commentAndChildren > input:checked ~ .commentList {

}

  display: flex;
  justify-content: center;

    <h2>
      <a class="postTitle" href="https://v.redd.it/iagek01uyggh1"><p>Why did my poison damage slowed like that?</p>
</a>
    </h2>

    

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="p0siqyb" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>boofking420</div>
        <div>1 | 11 hours ago </div>
      </div>
      <label for="p0siqyb" class="commentText"><p>Does this happen on bosses that don’t have phases?</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="p0sko9t" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Current_Royal6472 [OP]</div>
        <div>1 | 11 hours ago </div>
      </div>
      <label for="p0sko9t" class="commentText"><p>Regular mapping feels ok - including bosses - everything dies really fast. So I assume regular bosses are ok</p>

<p>I think it does happen in juiced expeditions - still hard to be sure because I never tracked their health bars, but my struggle with survivability sometimes might be because of this - they should die faster</p>

<p>And I got something similar with the simulacrum pinnacle boss, second phase start super slow - or get slow suddenly, and then goes fast and the boss dies</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="p0so0hz" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Tkmisere</div>
        <div>3 | 10 hours ago </div>
      </div>
      <label for="p0so0hz" class="commentText"><p>I think it&rsquo;s the boss phase damage reduction happening.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="p0sxytm" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>shadowclone515</div>
        <div>2 | 9 hours ago </div>
      </div>
      <label for="p0sxytm" class="commentText"><p>I had my suspicions that the 2nd phase damage reduction for arbiter is delayed. I&rsquo;m pretty sure 2nd phase bosses have a dmg reduction phase since tavakai is always really tank on his final form. But i always am able to one-shot arbiter immediately after he finishes his 2nd phase animation.</p>

<p>I always thought he didn&rsquo;t have one with how consistently easy he is to finish off during the start of the 2nd phase, but your vid shows that he does have a really short dmg reduction window a few seconds in.</p>

<p>Edit: upon closer inspection, and based on my experience target farming arbiter, i think he was beginning to cast his bull shit laser attack, but was delayed by temporal chains. The windup to his laser attack grants him increased stun reduction, which perhaps also grants him ailment effect reduction, but you slowed and killed him before it became visible.</p>

<p>Tldr, he got momentary superarmor while attempting his laser trap skill, but was slowed by temp chains and the animation got delayed before the superarmor ended. I could be wrong, but I&rsquo;m pretty confident.</p>
</label>
    </div>
  </label>
  
</div>
