

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/vhoewar5d1cg1.jpeg"><p>First time playing and got this</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/vhoewar5d1cg1.jpeg" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">

      </div>
      <label for="nycowqg" class="commentText"><p>Man! Last season, I really tried to use this both, spent tons and even got a lv 20 one! Lol but it didnt really work out, the time for the arrow to explode was 2-3 seconds, it takes a bit, and cant even have more than 8 arrows on the floor (if im not wrong)! I wish this bow gets some big update and upgrade</p>
</label>
    </div>

<div class="commentAndChildren">

    <div class="comment">
      <div class="commentHeader">
        <div>ArmageddonAsh</div>
        <div>2 | 9 hours ago </div>
      </div>
      <label for="nyd7n8e" class="commentText"><p>I never really bothered with using phantasmal arrow myself. I used mostly the Poison burst skill. I do wish that Bow had Fire focused skills. It has Cold and Lightening but no Fire :( I ran it with a quiver that gave it 100% chance to pierce and it was very cool. Not broken levels of &ldquo;my god this is nuts&rdquo; but was still fun to play around with - Granted im a Varashta Djinn Minion build using Chober Chaber but i have the helm that gives equipment no stat requirements so had fun playing around with it for a bit. Think if i changed my build, dropped some/all of the minion focused skills it would be better but Chaber Chober is just so cool of a design to drop Lol</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nyd7gbr" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>ArmageddonAsh</div>
        <div>2 | 9 hours ago </div>
      </div>
      <label for="nyd7gbr" class="commentText"><p>Its such a cool bow! i played with it for a while and its so cool. Really like uniques like this.</p>

    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
