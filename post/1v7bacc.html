      <a class="postTitle" href="https://i.redd.it/m3141m5n6mfh1.jpeg"><p>Noob Maps Question</p>
</a>
    </h2>

    
	<div class="selfPostContainer">

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="ozwvxb0" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>SubjectiveCertainty</div>
        <div>7 | 10 hours ago </div>
      </div>
      <label for="ozwvxb0" class="commentText"><p>You need to fill out the atlus passive tree, do all the quests for whatever end game mechanic content you want to focus to unlock all the atlus passive points for that content.</p>

<p>Once you do that, stack tablets, and pick a direction to explore.</p>

<p>Towers inside the citadel walls give bonus passive points to make it easier to fill out the tree and reveal a large chunk of the maps around them.</p>

<p>Otherwise you can buy the boss fragments to get 6 points per kill.</p>

<p>Towers outside the citadel don&rsquo;t give passive, but they do reveal the area around them on the map.</p>

<p>You want to find cities, after you get the relevant atlus passive, cities get 4 tablet slots.</p>

<p>Max out your t15 way stones, then vaal them. They have a chance to turn into t16 maps.</p>

<p>It&rsquo;s also helpful to aways run an irradiated tablet to boost the area level of the node your running.</p>

<p>Stack monster rarity, item rarity, and as much monster effectiveness as you can comfortably do safely without dying.</p>

<p>Remember that waystone modifiers and tablets should always be fully exalted, each additional modifier on them adds a significant amount to the chances to drop better currency and higher rarity gear or uniques.</p>

<p>Most of the end game mechanics also have semi meta progression mechanics that reward you for doing that specific content.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="ozwye58" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>SubjectiveCertainty</div>
        <div>1 | 10 hours ago </div>
      </div>
      <label for="ozwye58" class="commentText"><p>Oh, and don&rsquo;t try to go full juice on every map you run, navigating to decent areas that have the content you want to do is a better investment for your better way stones and tablets.</p>

<p>Until you get the atlus decently filled out, your drops are going to be really inconsistent.</p>

<p>For grinding out the citadel, I ran the minimum T-waystones needed, and rushed the area boss without worry about doing anything else other than pickup up decent currency and whatever waystones/tablets that dropped.</p>

<p>From my experience, every node in the citadel kinda sucked as far as drops goes, partly because the passive tree not being filled out, and partly because it seems like the citadel nodes are supposed to be a bit watered down to make it easier for new players.</p>
</label>
