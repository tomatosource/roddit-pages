      <label for="o6foani" class="commentText"><p>Why fracture cast speed? You still crafted it under the cost given where you fracture is.</p>

<p>I know it&rsquo;s mod level 56 but it&rsquo;s fine.</p>

<p>Why not fracture Crit Bonus (probably best fracture here).</p>

<ol>
<li>Fracture Crit Bonus</li>
<li>2 Chaos spam T1 spirit or allies damage.</li>
<li>=&amp;gt; fill in suffixes with level 75+ affixes (one with desecration) the other one via whittling of next step (you are aiming for T1 allies res, T1 minion life, T1 mana reg, (eventually +4 minions/t1 crit chance but unlikely to happen). - So what you do during this step is spam suffix desecration until hitting level 76+ mod than add one more suffix using perfect exalt - that suffix will turn into level 76+ mod during whittling process of prefixes later.</li>
<li>Use Perfect Exalt to fill prefixes to full (reducing mod pool). (your item should not have any open affix after that so you slam suffix here as well)</li>
<li>Whittle until missing T1 Allies Dmg/Spirit (somewhere during that step non desecrated suffix should turn into level 76+ affix) which completely disables whittles targeting suffixes for now.</li>
<li>Whittle until T1 Spirit/Hybrid.</li>
<li>Remove desecration (this step may be different if by some miracle your desecration is T1 Crit Chance).</li>
<li>Dextral Erasure for cast speed or t1 crit (likely cast speed).</li>
<li>Desecrate final mod (likely t1 crit).</li>
</ol>

<p>This way your craft is fully deterministic.</p>

<p>There is possibility to craft it by fracturing T1 Spirit or Allies Damage but we are kind of gambling here. You would have to dextral erasure either T1 Crit Chance (prefered) or Crit Bonus and try whittling cast speed while protecting the 1st suffix using Hinekora Locks in case higher level suffix appears which can get quite expensive depending on luck (a specially with Crit Bonus since it has double the pool of problematic affixes vs Crit Chance).</p>
</label>
