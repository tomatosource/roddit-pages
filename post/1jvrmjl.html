

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/mtco0kwveyte1.png"><p>Opinions on current Tabula Rasa?</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/mtco0kwveyte1.png" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="mmclyz3" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>faszmacska</div>
        <div>1 | 25 minutes ago </div>
      </div>
      <label for="mmclyz3" class="commentText"><p>Too much shitty support gems and can&rsquo;t use more then one from a type.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="mmcl07e" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Ruskii_NyOx</div>
        <div>1 | 35 minutes ago </div>
      </div>
      <label for="mmcl07e" class="commentText"><p>Holy</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="mmcl1gs" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Elit3Nuk3r</div>
        <div>1 | 35 minutes ago </div>
      </div>
      <label for="mmcl1gs" class="commentText"><p>Sorry, my head is still too much in PoE1. By 5 sockets I mean a Gem with 4 Support Gems. So a limit of 4 or 3 support gems would make sense in my opinion.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="mmcm8tj" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>xxshadowflare</div>
        <div>1 | 23 minutes ago </div>
      </div>
      <label for="mmcm8tj" class="commentText"><p>Given how items like unset ring exist (+1 skill slot), I&rsquo;d actually argue it&rsquo;d make more sense for it to give you one skill slot with max supports unlocked for that skill slot.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="mmcnfd8" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>EffedUpInGrade3</div>
        <div>1 | 10 minutes ago </div>
      </div>
      <label for="mmcnfd8" class="commentText"><p>Give live Tabula additional line that says &ldquo;socketed runes/talismans/Soul cores can be reclaimed&rdquo;</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="mmcnv52" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Various_Necessary_45</div>
        <div>1 | 6 minutes ago </div>
      </div>
      <label for="mmcnv52" class="commentText"><p>Seems like it&rsquo;d still be pretty terrible without a line that increases the power of sockets</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="mmcnqbq" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Bigboysama</div>
        <div>1 | 7 minutes ago </div>
      </div>
      <label for="mmcnqbq" class="commentText"><p>I thought the goal of a tabula rasa was to have access to the full extent of your power in your gems, not having more than usual.</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
