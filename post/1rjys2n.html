

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>

    <h2>
      <a class="postTitle" href="https://i.redd.it/cz2dm7tasvmg1.jpeg"><p>Can´t upgrade spymasters</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/cz2dm7tasvmg1.jpeg" />

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="o8gpqil" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>NewManufacturer8102</div>
        <div>10 | 10 hours ago </div>
      </div>
      <label for="o8gpqil" class="commentText"><p>Yes to reach level 3 they need to kill another spymaster. You can look up the specifics in a bunch of places but the gist is you need to put a spymaster in a different chain (just attached to your entrance is fine) then they’ll cause it to destabilize and level up. If you have spare locks you can lock the sacrifical spymaster and they’ll ‘kill’ it and level but not actually destroy the room (so you can level multiple spymasters consecutively without needing to get lucky finding more).</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="o8gpl7c" type="checkbox" checked/>

      </div>
      <label for="o8gpl7c" class="commentText"><p>Don’t they upgrade by killing the spymasters at the end of your snake?</p>
</label>
    </div>
  </label>

      <div class="commentHeader">
        <div>freileal</div>
        <div>3 | 8 hours ago </div>
      </div>
      <label for="o8h9m2i" class="commentText"><p>They do&hellip; But you can&rsquo;t put a room ahead of the spymaster in the edge of the chain.</p>

<p>To upgrade the previous spymaster you need a new spy being the last room in the edge of the chain.</p>

<p>Also, If you have a spy in the middle chain, like someone suggested, it will be killed by the nearest spy regardless of the level. In the picture of the post this means he will be killed by the first spymaster of the chain.</p>
</label>
    </div>
  </label>
  
</div>

      </div>
      <label for="o8h37gi" class="commentText"><p>The spymaster has the be the last room in a chain, plus you cannot pre lock them in order for them to get assassinated. That last spymaster is blocked off by the garrison so it doesn’t meet the requirement to get assassinated</p>

      </div>
      <label for="o8gxt44" class="commentText"><p>You really should watch some youtube videos about the temple mate otherwise you will screwup something later. Spymasters upgrade by killing other spymasters, also having a lvl <sup>1</sup>&frasl;<sub>2</sub> spymaster towards the end of the chain increases the odds of getting another spymaster which speeds up your progress</p>
</label>

<div class="commentAndChildren">

      <div class="commentHeader">
        <div>hiIaNotSam</div>
        <div>2 | 9 hours ago </div>
      </div>
      <label for="o8h3lzx" class="commentText"><p>Medallion will only upgrade a room once.
You need to have a spymaster at the end of your chain for it to be assassinated by another spymaster in your chain.
You can lock it before closing the temple so the easy thing to do is open the temple, enter the temple, come out and then lock the last spymaster.
