

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/kv64ayzjpvxe1.jpeg"><p>Do we know why they gutted the Pathfinder ascendancy?</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/kv64ayzjpvxe1.jpeg" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="mprtw6i" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>kobo1d</div>
        <div>1 | 30 minutes ago </div>
      </div>
      <label for="mprtw6i" class="commentText"><p>GGG made it sound like they were excited about <em>buffing</em> Pathfinder in 0.2.</p>

<p>That didn’t work out as well as they imagined, obviously.</p>

<p>But I do think the ascendancy will actually be in a very good spot if they revert some of the massive concoction nerf.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="mprumix" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Sugar-Roll</div>
        <div>1 | 25 minutes ago </div>
      </div>
      <label for="mprumix" class="commentText"><p>Probably just a result of the nerf everything vision. I don&rsquo;t think they gave much thought on every single nerf. They just went, yeah let&rsquo;s tone down everything across the board.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="mprv74n" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Nubbynubbow</div>
        <div>1 | 22 minutes ago </div>
      </div>
      <label for="mprv74n" class="commentText"><p>They want the game to be more player friendly. If pf was good new player will have a hard time deciding between deadeye and pf. The only reason you would want to pick pf is poison.</p>

<p>To do this they incentivize player by</p>

<ol>
<li><p>make sure herald of poison is stronger than the ascendency. This way if you want to play poison you will want to use the herald even when you pick this node making it a point with zero benefit.</p></li>

<li><p>Make sure concoction is bad to use.</p></li>

<li><p>give a 4 point passive (for poison) a downside</p></li>

<li><p>movement speed penalty node can easily be replace by riding rhoa. In 0.1 they notice that they couldn&rsquo;t finish the rhoa thing yet and it was a 2point ascendency. This league they make sure to turn this into a 4 point to incentivize player to use rhoa.</p></li>
</ol>

<p>Clearly, this shows us that they are providing a clear option that push player to play deadeye.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="mprwdb3" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>ddhuynh</div>
        <div>1 | 15 minutes ago </div>
      </div>
      <label for="mprwdb3" class="commentText"><p>Actually widowhail interacts with Concoction was a bugged, it never intended to have that interact at the beginning. Pathfinder live by a bug and it&rsquo;s die after bug is fixed. Entire Ascendency design around flask and poison; but when flask gone poison part has to be super strong to carry whole Ascendency. Sadly Poison node is not strong enough.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="mprsaui" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>YamiDes1403</div>
        <div>1 | 39 minutes ago </div>
      </div>
      <label for="mprsaui" class="commentText"><p>because it was built with flask in mind. if that gone, the entire class is gutted</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
