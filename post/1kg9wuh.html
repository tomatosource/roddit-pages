

<html>
  <head>

    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {

  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;

}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;

  color: white;
}

}

  <body>
    <h2>
      <a class="postTitle" href="https://www.reddit.com/r/PathOfExile2/comments/1kg9wuh/what_does_overabundance_do_for_explosive_spear/"><p>what does overabundance do for explosive spear</p>
</a>
    </h2>

    
    <div class="selfPostContainer">
      <p>started a huntress and i wanna try the explosive spear build but i dont actually know what this support gem does or what the limit thing means</p>

    </div>
    

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="mqx3227" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>HeavyMetalGerbil</div>
        <div>3 | 2 hours ago </div>
      </div>
      <label for="mqx3227" class="commentText"><p>You can only throw one explosive spear at a time initially. If you throw another it will delete the first before it explodes and start the explode timer over. With overabundance you can throw two spears at a time and have them both explode.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="mqx4l4a" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Causener</div>
        <div>2 | 2 hours ago </div>
      </div>
      <label for="mqx4l4a" class="commentText"><p>Whenever a skill says there&rsquo;s a Limit, overabundance will add +1 to that limit. Explosive Spear for example has 1 Limit for the spear, Overabundance will allow 2 spears to be out.</p>

<p>The wording is very specific though, Overabundance only affects skills which have a Limit. Skills that have a maximum aren&rsquo;t included.</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
