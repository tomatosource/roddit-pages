

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://www.youtube.com/watch?v=Z75C_nSuFcg"><p>Armour Is The Best Defensive Mechanic in Patch 0.5</p>
</a>
    </h2>

    

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="onokfi0" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Raine_Live</div>
        <div>1 | 27 minutes ago </div>
      </div>
      <label for="onokfi0" class="commentText"><p>I just want to point this out in the video. I agree with him that armour is the best. Ive always been an armour main. that said at 1:55 where he&rsquo;s commenting on the &ldquo;well you have mirror tier gear&hellip;yadda yadda. He doesn&rsquo;t mention the fact he is using ENFEEBLE + Intimadate. that&rsquo;s 14.5% (enfeeble level 20 vs unique monster) and 10% (intimadate) for a total less damage dealt of  23.5%. That&rsquo;s without looking at his gear or other factors.</p>

<p>He wants to say Armour is the best, but he really means Armour + other LAYERS is the best. because he ignores his layers</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="ononqzi" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Rehtimustalainen</div>
        <div>1 | 8 minutes ago </div>
      </div>
      <label for="ononqzi" class="commentText"><p>Armour was already really strong in endgame last league. I can see it becoming the strongest now unless evasion with deflect brings out some insane numbers.</p>

<p>With shaman ascendancy stacking tons of armour and it applying to elemental/chaos damage, cloak of flames and goregirdle I could literally stand still when fully juiced abyss encounter emerged from the ground and I just had 3k life, yet my HP bar was barely moving. Gl doing that with evasion or energy shield.</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
