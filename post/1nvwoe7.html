

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://www.reddit.com/r/PathOfExile2/comments/1nvwoe7/easy_fix_for_balancing_life_vs_es/"><p>Easy fix for balancing Life vs ES</p>
</a>
    </h2>

    
    <div class="selfPostContainer">
      <p>Introduce &ldquo;#% increased life&rdquo; mods on gear (non-weapons) as a suffix, which cannot be rolled on anything that has ES.</p>

    </div>
    

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="nhbwjd8" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Xeratas</div>
        <div>1 | 20 minutes ago </div>
      </div>
      <label for="nhbwjd8" class="commentText"><p>The problem with this is that currently hyprid gear is worse than non hyprid gear. which means if you are a hyprid ES/EV character that also has life you are better of by using pure EV boots and pure ES helmet instead of 2 hyprid bases. Which, with your change, would mean this gets even stronger because you could have % life on your pure EV boots for example. it would drive people even more away from hyprid gear.</p>

<p>Not saying i don&rsquo;t like your idea, just pointing that out.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nhbws9i" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Consistent-Plum6995</div>
        <div>1 | 17 minutes ago </div>
      </div>
      <label for="nhbws9i" class="commentText"><p>As warrior you are already suffix starved. This isn&rsquo;t a easy fix.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nhbx04a" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>TheBellHunter</div>
        <div>1 | 15 minutes ago </div>
      </div>
      <label for="nhbx04a" class="commentText"><p>Not a fantastic idea, instead make the intrinsic method of gaining life stronger, make strength grant 3 or even 4 life per point. (Add softcaps? down to 3 or 2 life per point at 400 strength?)</p>

<p>I appreciate attempting to come up with solutions for this pretty legit problem, but this still goes about it in the wrong way, because it dilutes the mod pool with even more things to need on armour (% armour for ele dam + this idea means you get ONE resistance per armour piece, no bueno imho).</p>

<p>What&rsquo;s more if you can&rsquo;t get ES and this mod, then when the str/int characters drop, they&rsquo;re gonna have to choose one or the other, when they should be getting both just at a lesser rate.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nhbx2ul" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>moikka434</div>
        <div>1 | 14 minutes ago </div>
      </div>
      <label for="nhbx2ul" class="commentText"><p>just add increased hp as innate trait to all armour, could pepercentual or fixed, balanced around the ermour base level and if it is pure ES/evasion/armor or hybrid</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
