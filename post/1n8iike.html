

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/fgk5i7ux07nf1.png"><p>Fragments Tab, When?</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/fgk5i7ux07nf1.png" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="ncfbfis" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>DiligentIndustry6461</div>
        <div>10 | an hour ago </div>
      </div>
      <label for="ncfbfis" class="commentText"><p>They’ll make an abyss tab when it’s fully integrated into the game. If you watched the interview, they basically introduce the mechanic as a league and make it in every zone/map then make tweaks and add it to base game if it goes well. This would mean abyss tablets like other mechanics, likely an abyss tab, possibly an abyss tree and boss?</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="ncfig6r" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Scaryloss | We need Maven!</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="ncfig6r" class="commentText"><p>Abyss tree and boss, probably yes, but Abyss doesn’t have enough items to justify a whole tab just for them.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="ncfkdu5" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>aeclasik</div>
        <div>1 | 36 minutes ago </div>
      </div>
      <label for="ncfkdu5" class="commentText"><p>Only justification they need is profit from tab sales, and I’m dumb enough to buy it instantly.</p>
</label>
    </div>
  </label>
  
</div>

    
      
<div class="commentAndChildren">
  <input id="ncfn5gt" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>hottestpancake</div>
        <div>1 | 22 minutes ago </div>
      </div>
      <label for="ncfn5gt" class="commentText"><p>It could fit into a fragments tab pretty well. We already have omens that are fragment affinity so any fragment tab could hold omens, abyss omens, abyss body parts, etc</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

    
  </div>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="ncfipyc" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>AskTurtle</div>
        <div>1 | 44 minutes ago </div>
      </div>
      <label for="ncfipyc" class="commentText"><p>You can affinity other tabs for fragments to separate out your catalysts and shards.  It will automatically include trial invitations too.</p>

<p>The abyss stuff still does have no affinity but should be able to fit most into your main currency tab extra slots.</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
