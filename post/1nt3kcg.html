

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/km1iqfh4vzrf1.jpeg"><p>So, um, I could use a little bit of advice.</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/km1iqfh4vzrf1.jpeg" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="ngqscva" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Reixdid</div>
        <div>1 | 32 minutes ago </div>
      </div>
      <label for="ngqscva" class="commentText"><p>You can combine 3 of each same rarity to get 1, just kinda rerolling them. If you have a good one you can corrupt them aswell since they give something decent if you are lucky. I once got an immunity to maim on my normal jewel. Also you&rsquo;d want Crit Rate, critical damage and global damage/attack speed for emeralds. For sapphire you want max ES, regenerate 2% mana each kill. For ruby you&rsquo;d want melee damage and elemental damage.</p>

<p>(This are the stats on the jewel i use)
Also some sell for a decent price but its if you are lucky enough.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="ngqujb1" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Dreamcatcher_2point0</div>
        <div>1 | 18 minutes ago </div>
      </div>
      <label for="ngqujb1" class="commentText"><p>Thank you. This answer about sums up what I needed. I&rsquo;m a relatively long time PoE player, but I just haven&rsquo;t been super present for watching league meta and piecing together what is worth selling in terms of jewels. Amulets, gloves, and exceptional bases have made me enough that I wasn&rsquo;t too concerned with anything else, but I&rsquo;ve got nearly a whole page of ilvl 79+ jewels and got frustrated with looking through the trade pages to match up what people find valuable.</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="ngqtpb6" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>ImTheTractorbeam</div>
        <div>1 | 23 minutes ago </div>
      </div>
      <label for="ngqtpb6" class="commentText"><p>Just look at what can roll on each gem. It’s not vague at all what’s good and what’s not. If nothing else, just do a quick price check. Mainly you’re looking for synergy on the gem.</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
