

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://v.redd.it/ouf7t7e36gte1"><p>Average white mob encounter</p>
</a>
    </h2>

    

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="mlw916u" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>joadsturtle</div>
        <div>0 | 3 hours ago </div>
      </div>
      <label for="mlw916u" class="commentText"><p>I’ve been absolutely fine with white mobs. Breezing through act 1 act 2 and even most of act3 normal. Places that were tough on last patch didn’t bother me this time. Black chamber and utzaal felt very over tuned before. Mobs and groups of them fine.
For me it’s the bosses in act3. Way way way harder than before. Been trying Doryani for several hours. The viper boss before that took me about an hour to kill where previous I one shotted her. Doryani was never this difficult. I barely scratch him. I kill mobs easily with lightning spear or whirlwind. No single target damage. Forced to just use spear stab and spear throw. Mental.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="mlwh20r" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>bigmac22077</div>
        <div>4 | 3 hours ago </div>
      </div>
      <label for="mlwh20r" class="commentText"><p>Honestly though, if you were one shotting the viper boss I think it’s a good thing they made skills a little weaker and bosses a little harder. I like this patch</p>
</label>
    </div>
  </label>
  
</div>

    
      
<div class="commentAndChildren">
  <input id="mlwpw4c" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>MotherWolfmoon | Top 1% Clearfell luck</div>
        <div>1 | 2 hours ago </div>
      </div>
      <label for="mlwpw4c" class="commentText"><p>I&rsquo;m in Act 3 using Spear Thrust to clear mobs.</p>

<p>Rake started falling off in damage (probably because I foolishly started taking spear damage nodes instead of more strength for Stomping Grounds). Storm Lance/Lightning Spear do not do enough damage to thin packs out before they overrun me.</p>

<p>Meanwhile, Spear Thrust does massive damage and stun buildup to the one or two closest enemies to me. It&rsquo;s highly effective at actually thinning out packs. It comes out incredibly fast, which makes it key tech in the light stun meta.</p>

<p>It feels like ass to toothpick poke one or two enemies at a time.</p>

<p>I&rsquo;ve been trying to use PoB to figure out a way forward, but it consistently says my damage is about 95% lower than my sheet DPS in-game. In-game it says Spear Thrust is something like 1700 DPS, while PoB says it is 75.</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

        <div>0 | 3 hours ago </div>
      </div>
      <label for="mlwdys3" class="commentText"><p>💯🔥</p>

    </div>
  </body>
</html>
