

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/ssoopoie4d3g1.jpeg"><p>On This Day in Baseball History - November 25</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/ssoopoie4d3g1.jpeg" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="nqoz9z5" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>SwAeromotion | Chicago Cubs</div>
        <div>8 | 7 hours ago </div>
      </div>
      <label for="nqoz9z5" class="commentText"><p>Team success was too valuable for MVP voting for so long, unfortunately.</p>

<p>This is why Ted Williams hit for the Triple Crown twice, but didn&rsquo;t win MVP in either of those years.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="nqqej8i" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>danthemjfan23</div>
        <div>2 | an hour ago </div>
      </div>
      <label for="nqqej8i" class="commentText"><p>He also didn&rsquo;t win MVP in 1941, when he hit .406 (the last player to hit .400+ for an entire season), because 1941 was also the year Joe DiMaggio had his 56-game hitting streak and lots of people voted for him over Ted. Another reason for Ted&rsquo;s lack of MVPs was his refusal to give the media what they wanted. His relationship with the media - or lack thereof - absolutely cost him some hardware throughout the course of his career.</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nqp4gyy" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>1990Buscemi | St. Louis Cardinals</div>
        <div>3 | 6 hours ago </div>
      </div>
      <label for="nqp4gyy" class="commentText"><p>Ted Williams must have hated George Kell in the same way Shaq hates JaVale McGee.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nqqdl9g" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>factionssharpy | San Francisco Giants</div>
        <div>6 | an hour ago </div>
      </div>
      <label for="nqqdl9g" class="commentText"><p>Kell&rsquo;s OBP was &ldquo;only .424.&rdquo;</p>

<p>That was fourth-best in the league and a very good total!</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="nqqduf6" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>danthemjfan23</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="nqqduf6" class="commentText"><p>You could say the same thing about my use of &ldquo;only&rdquo; in reference to his 71 walks. In a vacuum, those are both really good numbers.</p>

<p>But when Ted has 91 more walks, gets on base 106 more times, and has an OBP 66 points higher, I think it&rsquo;s justified.</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

        
      
    </div>
  </body>
</html>
