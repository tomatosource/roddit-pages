

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/i3vppmrqpikf1.jpeg"><p>Just my little take on Warrior &ldquo;changes&rdquo;</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/i3vppmrqpikf1.jpeg" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="na16oeh" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>DecoupledPilot</div>
        <div>1 | 37 minutes ago </div>
      </div>
      <label for="na16oeh" class="commentText"><p>I think you will have to elaborate more on how you regard it as gutted.</p>

<p>I&rsquo;ve seen too many posts where people simply were not mathing and just glancing at their current builds and then seeing how individual parts no longer fit their puzzle, while they actually have an entirely new puzzle.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="na17qbm" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Curious_Weekend6458</div>
        <div>1 | 27 minutes ago </div>
      </div>
      <label for="na17qbm" class="commentText"><p>Yeah the warrior is going to be somewhere between a bit different to a whole new build style, so people immediately saying it was ruined is odd to me. I like a lot of what I&rsquo;m seeing but I&rsquo;m going to withhold judgement until I see the passive tree and new supports. Even then I&rsquo;d be hesitant to say anything until after I&rsquo;ve seen it in play a bit</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="na1a5fd" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>TheNoon44</div>
        <div>1 | 4 minutes ago </div>
      </div>
      <label for="na1a5fd" class="commentText"><p>Evasion got straight 40% damage reduction from deflect if 100 is fairly achievable. Armour goes to elemebts but it goes before resists so it cant even compete. Giant blood not gives you -1 health per strenght so going 600 str for 2 hand and shield nets you -600hp. Block got gutted on values and max block. Armour from runes got lowered.</p>

<p>Shield skills are now almost unusable during leveling and my guess is it will suck in endgame due to low damage.</p>

<p>We need to see whole tree and all gem info but as a warrior i guess its really bad.</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
