      <a class="postTitle" href="https://v.redd.it/8otnu55dkh9g1"><p>Was it my fault? Or did the game simply not want me to have that item?</p>

        <div>3 | an hour ago </div>
      </div>
      <label for="nvzi034" class="commentText"><p>I ran into a monster like this recently also. It was touched by every spirit in the game. Melee builds will struggle with monsters like this pretty often. It sucks but I&rsquo;m going to just quit to menu when I run into another monster like this. Sometimes it&rsquo;s not worth the stress of missing out on dropped loot or experience loss.</p>

        <div>3 | an hour ago </div>
      </div>
      <label for="nvzi9eq" class="commentText"><p>Not gonna lie, besides game definitely making a decision &ldquo;You die&rdquo; in a form of multi-wisp rare that you can&rsquo;t outrun, fear of losing that charm made you make questionable moves. Pressing Calamity, a skill with wind-up animation, after said rare appeared on your screen, not before, pointless direction changes, suboptimal dodge-rolling. You could&rsquo;ve made it. At least to the charm.</p>

    <div class="comment">
      <div class="commentHeader">

        <div>2 | an hour ago </div>
      </div>
      <label for="nvzj5dj" class="commentText"><p>Based on the footage I&rsquo;m inclined to say it was a combination of your biting off more than you can chew and a likely panic/skill issue.</p>

<p>Specifically:<br>
Rampage and Walking Calamity have pretty long windups &ldquo;out of the box&rdquo; so they aren&rsquo;t great to be casting when you have a fast rare chasing you unless you know for certain you won&rsquo;t get stunned out of them<br>
On the stun note: Your HP is on the low side for a bear doing that content, though with only 100 spirit I&rsquo;m guessing you&rsquo;ve only just recently hit endgame.<br>
You were sprinting while being chased - just lunge on bear (aka dodge roll), it&rsquo;s faster than walking by a lot (turn off the auto-sprint thing if you have it enabled)</p>
