

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://www.youtube.com/watch?v=JTX9fQLEDEQ"><p>Something that really resonated with me</p>
</a>
    </h2>

    

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="olczdb3" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Queen__Natalie</div>
        <div>1 | 30 minutes ago </div>
      </div>
      <label for="olczdb3" class="commentText"><p>There&rsquo;s people out there who when act 4 came out for the first time instead of enjoying it they blasted through it to get to endgame faster, and that tells you everything you need to know about poe players, especialy the efficiency slaves</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="olczaf2" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Shoddy_Nectarine4738</div>
        <div>1 | 30 minutes ago </div>
      </div>
      <label for="olczaf2" class="commentText"><p>Min-maxers miss so much in their desire to be the best, or to join the best. As someone who loves Path of Exile (one and two), but has never been &lsquo;good&rsquo;, I just enjoy playing the game without the best gear or following the meta. This video gives people like me a voice.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="old2p9e" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Selthdomain</div>
        <div>1 | 12 minutes ago </div>
      </div>
      <label for="old2p9e" class="commentText"><p>It is not just a PoE issue, it is human issue, as many choose to look only at the end goal instead of enjoying the whole path</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="old4eyr" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Bon_Djorno</div>
        <div>1 | 3 minutes ago </div>
      </div>
      <label for="old4eyr" class="commentText"><p>You can experience a game anyway you want and no single way is necessarily the best or &ldquo;healthiest&rdquo;. You can have unhealthy casual gamers in the same way you can have unhealthy mega end-gamers. But I am seeing a trend in online pve games where there&rsquo;s a divide between the hyper-end game focused players (the top ~1-5%) and everyone else, especially when forums are active with player feedback. It&rsquo;s happening in WoW&rsquo;s latest expansion as well, where some content has become significantly easier to accomplish because gearing is more accessible, and of course is becoming more of thing for PoE since it&rsquo;s fairly mainstream at this point.</p>

<p>I agree with everything this video says, but that doesn&rsquo;t mean I think it&rsquo;s wrong to play efficiently and with end-game focus trumping everything (not saying this YouTuber is saying this). If any top 1-5%ers are reading this, please understand that your opinion on how the game should be balanced and what&rsquo;s important may be valid, but that doesn&rsquo;t mean it&rsquo;s relevant. GGG, in the same way as Blizzard, want to keep the lights on. Both PoE 2 and WoW are enormous games with incredible production value and constant updates. Both studios will focus on designing and balancing their cash cows around the population that brings in the cash, which the more astute among you will have realized is likely the 95-99%.</p>

<p><strong>TLDR: Valid opinions ≠ relevant opinions.</strong></p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
