      <label for="ofxkc47" class="commentText"><p>From <a href="http://Globe.com" target="_blank">Globe.com</a></p>

<p>By Chad Finn</p>

<p>Hosting a podcast has become something of an emblem of success for NBA players, as well as way to pass the city-to-city drudgery of the long season.</p>

<p>It might require fewer words to list the prominent players that *don’t* have their own pods than those that do, the latter an ever-growing list that includes LeBron James, Draymond Green, Tyrese Maxey, Knicks/Villanova pals Jalen Brunson and Josh Hart, Trae Young, Paul George, and CJ McCollum, and on and on, right on down the depth chart.</p>

<p>When Derrick White was acquired in an Auerbachian heist by Celtics president of basketball operations Brad Stevens from the Spurs in February 2022, he came across as uncommonly shy for an NBA player. He was just about the last Celtic you’d think someday would have his own podcast.</p>

<p>Yet here he is now, four seasons later, an NBA champion, Olympic gold medalist, and quintessential Celtic — one with a remarkably high approval rating among the fan base. And not only does he have a podcast, but it’s as illuminating and entertaining as any of the other player pods.</p>

<p>“He says, ‘I think I’ve come a long way,’ ” says Alex Welsh, White’s best friend and former college teammate, who co-hosts the podcast titled “White Noise.”</p>

<p>“We did a crossover episode with Tommy Alter, who’s one of the co-hosts of ‘Old Man and the Three,’ which he started with JJ Redick back in the day. He asked Derrick, ‘I’ve known you for a while, and I would have never really thought you’d have your own podcast.’ And Derrick’s like, ‘Man, [expletive], me either.’ ”</p>

<p>“Welsh is much more outgoing than I am,” says White. “I’ve always been the quiet guy, the shy guy, and he can and will talk to anybody. It’s a good little back and forth between the two of us. He has good energy, and it gives me a chance to show people who I really am.”</p>

<p>“White Noise,” which launched last June, has 27 episodes so far, and usually features a Celtics player as a guest. It’s usually recorded in the basement studio of White’s Lexington home, which is equipped with a set reminiscent of the memorabilia-covered walls at the late, great Canal Street sports bar The Fours.</p>

<p>White and Welsh also sometimes record at the Auerbach Center, and Welsh — who in his day job works remotely in tech sales — will sometimes travel from his home in Colorado to meet White on the road.</p>

<p>The podcast is superb on a couple of levels. It offers insight on the Celtics. Many of the morsels of behind-the-scenes anecdotes that end up getting aggregated or generating social media traction have come from the “White Noise” pod. A couple of the zanier stories about Joe Mazzulla’s methods have come from the casually candid White, including the Celtics coach playing machine-gun sounds during practice, and emboldening the players to determine which players would start a game.</p>

<p>The other reason “White Noise” is such a worthwhile listen? The easy chemistry between White and Welsh.</p>

<p>The most important aspect of any audio sports program is that the hosts sound like they are genuine friends, with a dialogue that the listener yearns to be part of. It’s rarer than one would think.</p>

<p>White and Welsh, who met as freshmen basketball players at Division 2 University of Colorado Colorado Springs in 2012, don’t require any guise of being pals. They are best friends, and it’s their superpower as hosts.</p>
