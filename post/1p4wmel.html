

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/6k73geold23g1.jpeg"><p>Crafting help please</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/6k73geold23g1.jpeg" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="nqex31b" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Accomplished-Ad6447</div>
        <div>2 | 10 hours ago </div>
      </div>
      <label for="nqex31b" class="commentText"><p>Prefix desecrate before unveiling fracture for a one in three to lock the critical hit chance. If you hit critical hit chance unveil desecration and reroll for T1 Phys Accuracy hybrid or T1 lightning then slam with two regular exalts and battle and haste essence till you get plus 4 skills and onslaught. If you don’t hit the critical hit chance you just gotta gamble and pray to god you don’t take off something good for those essences.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="nqf826k" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>redrascallyreddit</div>
        <div>1 | 9 hours ago </div>
      </div>
      <label for="nqf826k" class="commentText"><p>Thanks, fortunately was able to fracture in the crit chance and the desecrated mod was the increased companion damage. I should have been more specific, I’m playing the lightning spear build - so projectile. I guess the +4 proj skills, critical dmg bonus and attack speed would be my goal but not sure if their odds can be improved? And is the companion dmg buff mediocre?</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="nqf93kv" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>LionPuzzleheaded3985</div>
        <div>1 | 9 hours ago </div>
      </div>
      <label for="nqf93kv" class="commentText"><p>You would still benefit from the attack skills.</p>

<p>Anything else isn’t really worth it on that base.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="nqfh6ui" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>redrascallyreddit</div>
        <div>1 | 8 hours ago </div>
      </div>
      <label for="nqfh6ui" class="commentText"><p>Oh, good to know about + attack!
I’ll go for that for sure. Not sure I understand the plan for the third prefix though. I can remove the desecrated mod then sinistral exalt hoping for the hybrid PD or Lightning damage but if I get cold or elemental won’t I be worse off that the companion damage buff? And no way the reroll that, right?</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

    
  </div>
  
</div>

    
  </div>
  
</div>

        
      
    </div>
  </body>
</html>
