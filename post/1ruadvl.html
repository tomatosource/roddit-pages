

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/zld7s75qo6pg1.jpeg"><p>Amulet crafting, what next?</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/zld7s75qo6pg1.jpeg" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="oajw62n" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Guilty_Swimming9414</div>
        <div>10 | 11 hours ago </div>
      </div>
      <label for="oajw62n" class="commentText"><p>Next league.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="oajy2h5" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>beerus333</div>
        <div>5 | 11 hours ago </div>
      </div>
      <label for="oajy2h5" class="commentText"><p>What do you need? You can try to get crit or cast speed too I think? I don’t really rate the mana regen</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="oaky59p" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>IVLimitless</div>
        <div>1 | 7 hours ago </div>
      </div>
      <label for="oaky59p" class="commentText"><p>First of all the base is wrong, even if you manage to roll everything perfectly the value will be much much lower because of it. Do not waste currency on this one</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="oal0kp7" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>throwawaymycareer93</div>
        <div>2 | 7 hours ago </div>
      </div>
      <label for="oal0kp7" class="commentText"><p>Pretty terrible base to invest a lot of money.</p>

<p>If you wish to continue then you can desecrate with abyssal echoes for last suffix and look for what you need like crit chance, crit dmg, all res, chaos res, etc. If you miss then you can omen of light annul and reroll.</p>

<p>Desecrated suffixes aren’t worth much, that is why you rarely see them on amulet suffixes in builds.</p>

<p>Also mana regen is not what people usually look for on amulet suffixes. Consider whittling, but first check prices if it is worth it.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="oam7cgj" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>WhichWolfEats | customflair</div>
        <div>1 | 3 hours ago </div>
      </div>
      <label for="oam7cgj" class="commentText"><p>I’d essence of abyss with dextral crystalization and hope it hits mana, if it does, use caster catalyst try for cast speed then add crit on desecration</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
