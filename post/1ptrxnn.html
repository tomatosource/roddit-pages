

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://youtu.be/FOAstHrY4KE"><p>Fire Bear Smith of Kitava, 0* button endurance charge consumption loop build</p>
</a>
    </h2>

    

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="nvj3dl6" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>RTheCon</div>
        <div>1 | 43 minutes ago </div>
      </div>
      <label for="nvj3dl6" class="commentText"><p>Wanted to post my build that I finalized a couple days back, the one that used the tech of consuming endurance charges rapidly to get absurds amount of life recovery and fire damage. <a href="https://www.reddit.com/r/PathOfExile2/comments/1pnnbtc/endurance_charges_are_broken_op/" target="_blank">https://www.reddit.com/r/PathOfExile2/comments/1pnnbtc/endurance_charges_are_broken_op/</a></p>

<p>Primal Hunger keystone, Rageforged in walking calamity so that each meteor consumes rage. Jagged ground 1 in ancestral cry ferocious roar so that each step consumes an endurance charge. Take all the consume endurance charge passives on the tree (30%+ life recovery per second, 100+ fire damage, 20+ damage as extra fire)</p>

<p>Build deals damage via fire spell on hit living bomb that triggers from both Molten crash fissures and ancestral cry steps, as well as ignites which trigger fire-infused comets. Since it&rsquo;s spells, we also don&rsquo;t care to much about losing the damage bonus from rage</p>

<p>*Other than maintaining buffs, no buttons are required.</p>

<p>Full written build guide: <a href="https://mobalytics.gg/poe-2/builds/balrog-fire-bear-smith" target="_blank">https://mobalytics.gg/poe-2/builds/balrog-fire-bear-smith</a></p>

<p>Very rough PoB of current character (dps calculation incorrect): <a href="https://pobb.in/Ui4Pc7MWfKDH" target="_blank">https://pobb.in/Ui4Pc7MWfKDH</a></p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
