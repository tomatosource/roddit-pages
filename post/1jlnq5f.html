

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://www.reddit.com/gallery/1jlnq5f"><p>Why are you doing this GGG?</p>
</a>
    </h2>

    

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="mk51md7" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Marrakesch</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="mk51md7" class="commentText"><p>Twitch drops are a sin of modern streaming culture. They exist purely so Twitch can milk even more money. Dont worship the twitch drops, renounce the false gods today! No one needs them anyway.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="mk50ezf" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Daddy_Stop</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="mk50ezf" class="commentText"><p>I got it in the end but twitch randomly stopped tracking progress for a couple of hours there. Was watching on my second monitor. Occasionally, if another tab is active, Twitch (at least for me) can stop tracking progress. Can usually be avoided by unmuting and putting at 1% volume. But probably the first time it stopped tracking with volume on for me.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="mk51vlc" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>DarkBiCin</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="mk51vlc" class="commentText"><p>I finally got mine 2 hours after the live stream. Also Twitch mobile is the most dogshit platform in existence. On 1GB wifi and the thing couldnt even load a steady 144p stream and I almost missed out on the drops. Honestly if it doesnt give it to you just send the screen shot to support and ask nicely for it. They are pretty chill</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="mk530j3" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>MacAtry</div>
        <div>1 | 43 minutes ago </div>
      </div>
      <label for="mk530j3" class="commentText"><p>Jap didn&rsquo;t get it in the end, progress reset in the middle, flipped around like crazy, and I needed to go to bed after 2,5h. It&rsquo;s called &ldquo;middle of the night with work day afterwards&rdquo;. Not happy at all.</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
