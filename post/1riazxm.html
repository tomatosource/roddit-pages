       * {
  margin: 0;
  padding: 0;

*,

  box-sizing: border-box;
}

html {

  color: #ddd;

body {
  display: flex;

h1 {

  padding: 32px;
  color: #c39429;
}

h2 {

}

input[type="checkbox"] {
  position: absolute;

}

blockquote {

.subName {

.postList {

.post {

}

.postLink {

  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {

  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;

}

.commentList {
  border-left: none;

  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>

      <label for="o865lzy" class="commentText"><p>This is correct. It’s essentially useless until fractured - unless the next perf Aug, and regal land 2 really great mods worth continuing at risk of completely bricking due to no fracture. But chaos spamming for a mod if you miss after 3 good mods fails, going back to getting a mod to fracture isn’t really too bad this season. Greater chaos can typically hit what you want just as fast - perf Aug just benefit from being able to selectively Aug a prefix or suffix specifically more often after annul removes the right one. Also better weights being a perfect. But they’re really not a super cheap combo compared to just using greater chaos.</p>

<p>It’s essentially due to us temple runners ruining div conversions. And the fact that perf aug drop less often than greater chaos and annuls in temple. So the augs value has remained pretty high imho.</p>

<p>It’s so ingrained to start with aug and annuls I really only just made the swap recently to buying dirt cheap rares instead of normal/magic bases since I can just annul and chaos and they’re fuckin cheaper to start on sometimes since the seller thinks the mods make it worthless.</p>

<p>Not sure why I went on this tangent. But meh possibly helpful info for people crafting on a budget.</p>
