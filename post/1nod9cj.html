    <h2>
      <a class="postTitle" href="https://poe.ninja/poe2/profile/Me%C5%A6aph%C7%BEr-5626/character/AArrowDynamic"><p>Why is my sheet LA damage so low at $12k - what can I do to improve it?</p>
</a>

<div class="commentAndChildren">
  <input id="nfqqhis" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Zaliacks</div>
        <div>3 | 3 hours ago </div>
      </div>
      <label for="nfqqhis" class="commentText"><p>For starters, your missing +3 proj on amulet. You also don&rsquo;t have has many &ldquo;more&rdquo; multipliers in your gems they do. They also have significantly more attack speed, flat damage and lightning damage scaling on their rings. Your gear is a low budget LA but it&rsquo;s trying to follow a high budget build so it just won&rsquo;t work out.</p>

<p>Imo, you should dump the defy tech and nova projectiles (-40% multiplier) until you&rsquo;ve got a headhunter and a good proj 3+ amulet at the very least.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">

        <div>2 | an hour ago </div>
      </div>
      <label for="nfqz0qv" class="commentText"><p>Looks like you&rsquo;re running the unique viper cap &lsquo;surrounded&rsquo; build but don&rsquo;t have said cap, which is a waste.</p>

<p>Crit is a high end build.  Whilst your bow and quiver are good, they&rsquo;re not fantastic and you have extra fire damage everywhere instead of physical or lightning.</p>

<p>I&rsquo;d change out to fubguns hybrid build and I bet you do better.  The +3 skill amulet is Uber higher end, a reply above makes it sound like this is mandatory, it&rsquo;s not.</p>

<p>If I&rsquo;ve seen more queries of any type lately it&rsquo;s this.  I changed to crit too early, why isn&rsquo;t this working.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">

      </div>

      </div>
      <label for="nfqoasd" class="commentText"><p>Especially compared to a character like this: <a href="https://poe.ninja/poe2/builds/abyss/character/Attackdie-1253/attackdie_tte?i=0&amp;search=class%3DDeadeye%26items%3DConstricting%2BCommand" target="_blank">https://poe.ninja/poe2/builds/abyss/character/Attackdie-1253/attackdie_tte?i=0&amp;search=class%3DDeadeye%26items%3DConstricting%2BCommand</a></p>

      <label for="nfqvpkf" class="commentText"><p>Spend another $12k on RMT divs then the damage will be better. /s</p>

<p>Seriously though:</p>

<ul>
<li>Swap to flat lightning damage runes on your bow</li>
<li>That unique quiver is a meme; a well rolled crit quiver would more than double your damage</li>
<li>Missing +3 projectile skills on amulet</li>
<li>Attack speed runes on 2 socket gloves with 100% socket effect would be a huge (but costly) upgrade</li>
<li>You are running Lightning Arrow with 0% penetration and no Rakiatas; this bricks your damage</li>
<li>You take a bunch of crit nodes in the tree in favour of damage nodes, all whilst running low base crit on gear (mid roll on bow, no crit on quiver); this bricks your damage; you&rsquo;d be better off with generic damage nodes - I suggest you import your build into POB for a proper visualisation of this</li>
