

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://www.reddit.com/gallery/1pr9h3t"><p>Endgame World Map - Design Refresh</p>
</a>
    </h2>

    

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="nv0p09k" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>LordAlfrey</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="nv0p09k" class="commentText"><p>You touch on an idea I&rsquo;ve had before, here, but I think you bring it up for a different reason than I do.</p>

<p>One of the core issues for the endgame design, which I think will be difficult to combat, is that every time you exit a map, you need to select a new map, and you are shown more information to act on. This acts as a mental shift, going from blasting to decision making, and interrupts flow. It&rsquo;s a relatively minor thing, but I think it&rsquo;s quite noticeable when you just want to knock out a few dozen maps.</p>

<p>An idea I&rsquo;ve had to try to stem this issue, is to do some type of &lsquo;map squence&rsquo; or path, so that you can plan out a series of maps you want to run, and then the next node simply gets automatically highlighted when you open the atlas after completing the previous in the series, all you need to do is slot the waystone. No decision necessary.</p>

<p>It&rsquo;s not perfect, since as the fog moves and you discover more, you&rsquo;ll want to act on the new information every time, which then breaks the flow since you&rsquo;d make decisions after every map.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nv0crm3" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Hardyyz</div>
        <div>1 | 3 hours ago </div>
      </div>
      <label for="nv0crm3" class="commentText"><p>out of all the stats I dont want the big red number reminding me of all the maps I have failed. I would prefer a seperate stat page that had things like how many breaches you have completed etc.</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
