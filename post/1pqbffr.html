

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/rj871brf438g1.png"><p>New update bricked my temple, can&rsquo;t reach Atziri</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/rj871brf438g1.png" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="nut6zla" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>DangerG</div>
        <div>6 | 2 hours ago </div>
      </div>
      <label for="nut6zla" class="commentText"><p>Same thing happened here. I am going to try to fight an architect and try all over again.</p>

<p>Honestly, the most frustrating part of this league mechanic is all the bugs and very little being explained at all. Had so many temple rooms, just bug out and not let me out, even though every monster is dead.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nut80f0" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>ItIsNotFine</div>
        <div>2 | 2 hours ago </div>
      </div>
      <label for="nut80f0" class="commentText"><p>Same thing happened to me, i had Atziri room connected and 3 of those currency rooms but couldnt access any of them. I closed the temple and half the temple is gone now.</p>

<p>Idk if i am doing something wrong or if that was a bug, but i am level 90 and still havent been able to fight Atziri once.</p>

<p>Either way going from juicy pack size from Abyss mechanic + all the new omens for crafting in 0.3.0 to this, is extremly underwhelming. Now we get like 10 extra mobs per map, and after 6 maps we get to do a temple</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nutdrfm" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Ok-Signature2832</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="nutdrfm" class="commentText"><p>You don’t have the key to open the door.</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
