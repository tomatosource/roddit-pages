      <label for="ozjt74q" class="commentText"><p>Thanks for reply. I definitely learned some more about the mechanics of crafting from doing this and it works well for my build. I think I would have been devastated if the corrupt went south after buying and using the whittle. I&rsquo;ll spend some more time looking into the trade filters and see if I can get better at that.</p>

        <div>1 | 7 minutes ago </div>
      </div>
      <label for="ozjtkjp" class="commentText"><p>Weighted sum v2 is the goat. Learn that for armour.<br>
Learn when to use the «Not» Stat filter when you absolutely don’t want to see items with something (this can be good for Vaal Cultivated item searches, for instance).</p>

<p>Learn when to use «And» stat filter when you absolutely must have it on the item.</p>

<p>Weighted sum is great when you for instance need either crit chance or crit damage. Or you if you need attributes too free up passive points in passive tree but you don’t care which attribute the item rolls. If some affixes are more important than others you weight them more and sort items by weight (and always set a currency ceiling on your searches, its easy to find good items when you dont care what stuff costs, lol).</p>

<p>Weapons is easy, just type in the dps you are looking for and a few key affixes that ur build needs.</p>
