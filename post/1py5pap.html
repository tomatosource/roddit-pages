       * {
  margin: 0;
  padding: 0;

*,

html {

body {

h1 {

}

h2 {

}

input[type="checkbox"] {

}

blockquote {

.subName {

.postList {

  color: wheat;
  display: block;

}

.postLink:visited {
  color: #806a42;
  top: 100px;

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;

.commentList {

  padding-left: 32px;

body > .commentList {

.commentAndChildren {
  margin-top: 40px;
  width: 100%;

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

      <label for="nwg8cqy" class="commentText"><p>I doubt it&rsquo;s viable for end-game grinding:<br>
The base stats on the talisman itself are too bad for your own damage, the increased damage for every minion doesn&rsquo;t make up for the low base damage/ skill lvl scaling. same issue as the Chober Chaber.</p>

<p>As for the minion part, hyenas are almost identical to wolves from the wolfpack and pounce gem, so they&rsquo;re pretty bad unless you can scale their level really high, which you can&rsquo;t really do on wolfpack, and even less so on hyenas.</p>

<p>I think it&rsquo;s a perfectly serviceable unique while leveling on a werewolf, I know used it for some time in act 2 to 3, saving spirit for usefull buffs and before I had access to the wolfpack. But once you have lunar blessing and start looting some + melee lvl talismans, the unique can&rsquo;t keep up sadly.</p>
