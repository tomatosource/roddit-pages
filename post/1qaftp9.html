

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/te8f3ond7tcg1.png"><p>Don&rsquo;t skip out on heroic tragedy jewel with entwined realities ascendancy for Oracle</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/te8f3ond7tcg1.png" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="nz2ohav" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Primary_Impact_2130</div>
        <div>1 | 3 hours ago </div>
      </div>
      <label for="nz2ohav" class="commentText"><p>Ohh, nice find!</p>

<p>Do I just need &ldquo;Conquered by Kallgur&rdquo; or is the number important?</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="nz2yqay" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>-Sten</div>
        <div>5 | 2 hours ago </div>
      </div>
      <label for="nz2yqay" class="commentText"><p>The number is just the seed. Every jewel is different and the seed decides how the passives change. For example, one seed might give +40% lightning damage, another one might turn the same node into max ES.</p>

<p>Because of that, people usually buy a bunch of them, socket them one by one, check what they get, keep the good rolls and resell the rest. Since basically everyone does this, it’s easy to sell them back for around the same price.</p>

<p>The important part is the Vorana / Medved / Olroth name. That’s what changes the <strong>keystones</strong> in the jewel’s radius:</p>

<ul>
<li><strong>Vorana</strong>: you get no bonus from Strength, but gain 1% more Energy Shield per 2 Strength</li>
<li><strong>Medved</strong>: no bonus from Dexterity, 1% more Armour per 2 Dexterity</li>
<li><strong>Olroth</strong>: no bonus from Intelligence, 1% more Evasion per 2 Intelligence</li>
</ul>
</label>
    </div>
  </label>
  
</div>

    
      
<div class="commentAndChildren">
  <input id="nz2pgiv" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>EffectiveTonight</div>
        <div>1 | 3 hours ago </div>
      </div>
      <label for="nz2pgiv" class="commentText"><p>If timeless jewels work the same way in this game as 1, the number decides what passives you get changed. The name is only deciding what keystone you get.</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nz30reg" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Gallieg444</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="nz30reg" class="commentText"><p>I couldn&rsquo;t afford it lol</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
