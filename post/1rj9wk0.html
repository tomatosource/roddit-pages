

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/lwyhmmne1qmg1.jpeg"><p>How much are they worth?</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/lwyhmmne1qmg1.jpeg" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="o8bqvth" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>PoePlayerbf</div>
        <div>3 | 2 hours ago </div>
      </div>
      <label for="o8bqvth" class="commentText"><p>Not much at this stage of the league.</p>

<p>The wand on the right has 3 dead mods. The wand on the left the mod tiers are just too low. If they’re all T1 I would say big money but T3 is bad. T2 fractured spell skills is a death sentence. You basically guaranteed it’s worthless.</p>

<p>There’s a lot of crafting guides for wands on youtube, you can take a look at how they craft.</p>

<p>Usually to get a base, people buy a rare wand(ivl 82) with 2 good mods, essence a third and desecrate then fracture a mod. Then you go from there.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="o8bq0fv" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>CaptainAgnarr</div>
        <div>2 | 2 hours ago </div>
      </div>
      <label for="o8bq0fv" class="commentText"><p>First one, probably not much, even though it&rsquo;s fractured, and with lvl 20 spellslinger, +3 is just an essence mod. Second one, not much. Mana, mana regen, mana on kill, isnt desired.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="o8byjzj" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>bigace1116</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="o8byjzj" class="commentText"><p>The are both not good andnprobably wont sell for more than a couple div. The first one being lvl 20 would&rsquo;ve been ok if it was +4 fracture. Since its not its prrtty much dead.  And the second has a bad fracture so it was doa the second the fracture hit mana per. Sadly worth nothing.</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
