      <label for="nlizib0" class="commentText"><p>Not sure where the text went but here:</p>

<p>Hey guys on I am standard; to get to this point took three major
patches in the making - my take on the ultimate mace warrior.</p>

<p>Ever since I cut stampede and went Giant&rsquo;s Blood at Level 47 in 0.1 I was hooked and was determined to push this skill to the limit.</p>

<p>0% Armour 0% Evasion 0% Block - just some life/es/res and importantly wind dancing away with Olroth&rsquo;s Flask.</p>

<p>Is this bullet dodge hell? Offscreen 1 shot or be 1 shot? Taking a decent skill and slapping on meta items/skills? Blinkporalis / Dreamer / Heralds etc?</p>

<p>What are your thoughts on the state of the game?</p>

<p>For me, the journey of slowly mowing through campaign with mace strike to leapslam/boneshatter to my clear of choice of stampede was a lot of fun. The learning was always the best part with the struggles along the way, and always new stuff with each new patch addition, buffs and nerfs. (passives/gear/mods/juicing/crafting/theorycrafting/trading etc)</p>

<p>Lots of struggles in the sense of gaining the knowledge to know how the systems interacted, but at the end PoE2 has good depth but is not overly complex. Never played PoE1, just D1-D4.
I feel like the time is decently rewarded, and if in trade with just some legwork (research/knowledge) anyone can get to T15s without going hyper meta.</p>

<p>Made good friends that helped me get to this point, and I just wanted to share with you guys the end result.</p>

<p>For a Time when I was able, Auto Bomber on Titan was fun, but I feel this amount of speed and clear is just right, for me at least - fun visual clutter aside.</p>

<p>Campaign is great and all for the more methodical gameplay but I am of the take for a grindy game such as this and in the genre - this is fine, there is faster and you can always take it slower, for fun in maps. Currency &ndash;&amp;gt; Trade, or forget it all and enjoy progression at one&rsquo;s pace in SSF.</p>
