      <label for="o5dy293" class="commentText"><p>Don’t listen to the people who will tell you this isn’t a good stat - it’s a great affix. It can make huge differences with certain skills. Especially given that we’re in a league that allows for 23% quality skill gems and also 5% quality socketables that using just one in gear brings 23% quality skills to 25%.</p>

<p>People have already pointed out Falling Thunder as a skill that benefits major from quality - another one is Lunar Blessing. Quality massively increases the damage as cold buff that it gives the player. This type of thing goes for a lot of skills.</p>

<p>In addition we have skills that we can’t innately apply quality to so it has to come from gear and supports - such as Shred (quality gives a good attack-speed boost) or any skill that comes from a weapon or ascendancy.</p>
