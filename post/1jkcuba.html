

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://www.reddit.com/gallery/1jkcuba"><p>Need advice to optimize build</p>
</a>
    </h2>

    

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="mju5197" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>teecuedee</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="mju5197" class="commentText"><p>Understanding that I&rsquo;m using HOWA for added lightning damage (with Ice Strike as main skill), that I have Chaos inoculation (therefor no added stun threshold from life), and all other stats differences being negligible - of these scenarios,  is there a clear overall best for end game content? (including simulacrums in which my 1E setup failed for 2 out of 4 attempts)</p>

<p>&hellip;&hellip;. 1E has:  </p>

<p>● Dmg per use @ 50,168 (209,055 dps)  </p>

<p>● Stun Threshold @ 587  </p>

<p>● Attack speed +2%</p>

<p>● Lightning res penetration +9%</p>

<p>&hellip;&hellip;. 1S has:  </p>

<p>● Dmg per use @ 50,410 (205,672dps)  </p>

<p>● Stun Threshold @ 1,177  </p>

<p>&hellip;&hellip;. 2E has:  </p>

<p>● Dmg per use @ 50,207 (207,358dps)  </p>

<p>● Stun Threshold @ 930  </p>

<p>● Movement speed +5%  </p>

<p>● Attack speed +2%</p>

<p>● Lightning res penetration +9%  </p>

<p>&hellip;&hellip;. 2S has:  </p>

<p>● Dmg per use @ 49,996 (203,985dps)  </p>

<p>● Stun Threshold @ 1,518  </p>

<p>● Movement speed +5%</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="mju7efe" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Illustrious-Cat-2114</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="mju7efe" class="commentText"><p>I suggest you do one of the runs with a Good anti stun charm, not to actually use it. It would be to just verify that stun is happening to you and locking you down. If you can record the run you can then count it&rsquo;s triggers. IF you are absolutely sure then stun is locking you down then it&rsquo;s obvious run the two pieces of kit with stun threshold.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="mju7nb5" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>teecuedee</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="mju7nb5" class="commentText"><p>Is anti stun charm generally preferable to anti freeze? I started using anti freeze because that kept killing me. </p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="mju871s" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Illustrious-Cat-2114</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="mju871s" class="commentText"><p>No, I suggested a stun charm because from what I see you are asking if you need the stun threshold. If the charm is triggering which it will when u become stunned then u need stun threshold.</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

    
      
<div class="commentAndChildren">
  <input id="mju8r30" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Shit-is-Weak</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="mju8r30" class="commentText"><p>I run triple hybrid caster, 2700health, 10k grim feast ES. Briney Carapace node and few ES stun jewels and I have 5300 stun threshold. That&rsquo;s what it took to stop stun locks, I can get occasional stun but it&rsquo;s not debilitating (1-2 DMG suffix juiced up is when stun shows up). Freeze can happen still, so I reuse freeze thawing charm.</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

    
      
<div class="commentAndChildren">
  <input id="mju70nl" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Inkwalk</div>
        <div>0 | an hour ago </div>
      </div>
      <label for="mju70nl" class="commentText"><p>Have you used PoB? If not, take an hour and figure it out and set up your character. I did this and was able to shoot my sheet DPS from 50k to over 100k. It’s a great tool to use to see how different gear will affect your character.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="mju7e5i" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">

        <div>1 | an hour ago </div>
      </div>
      <label for="mju7e5i" class="commentText"><p>Thanks</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="mjuh2ov" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Sevr022</div>
        <div>1 | 10 minutes ago </div>
      </div>
      <label for="mjuh2ov" class="commentText"><p>Do yourself a favor and swap into tempest flurry w/ cast on shock. Much better clear speed and is great for cast on shock for single target. I played around the past couple days with both skills and if you set it up correctly tempest flurry just performs better.</p>
</label>
    </div>
  </label>
  
</div>
