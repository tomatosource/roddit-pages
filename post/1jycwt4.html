.postLink:visited {

.commentList {

.commentAndChildren {

.commentText,
.commentText * {

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;

}

.selfPostContainer * {

}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

      </div>
      <label for="mn8qbvr" class="commentText"><p>I think the biggest thing speed-wise going from the G League to the NBA is how <em>slow</em> the NBA is in comparison, which is not intuitive.</p>

<p>The G League is played at an incredibly high pace, and you can see JD struggle at times when the game slows down and he needs to execute in the half court, particularly on shallow PnR sets that are initiated on the wing as opposed to the pseudo fast break high PnR looks he can get into early in Maine.</p>

<p>JD’s a guy that was quite literally “2 years away from being 2 years away” when he was drafted, on the latter end of that growth curve now. He’s the same age as Pritchard was when he came into the league.</p>

<p>Also shout out to the clowns who ragged on him for air balling a floater against the Magic coming in cold off a grueling G League playoff run. Went <sup>2</sup>&frasl;<sub>2</sub> on Sunday on those floaters.</p>

<p>Give the kid a break people. Imagine being judged like that by random people as a 22yo? By people who could never do your job to begin with? Hilarious.</p>
