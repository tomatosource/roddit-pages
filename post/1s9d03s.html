

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>

    <h2>
      <a class="postTitle" href="https://i.redd.it/tjjan86j0jsg1.png"><p>Temple question</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/tjjan86j0jsg1.png" />

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="odngjys" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>charr3</div>
        <div>1 | a day ago </div>
      </div>
      <label for="odngjys" class="commentText"><p>no you can&rsquo;t. Look up roman road on how to do it easily (you can also do it without sac chamber, it&rsquo;s just much more lock intensive).</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="odnsz1k" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Yashi80</div>
        <div>1 | a day ago </div>
      </div>
      <label for="odnsz1k" class="commentText"><p>Are you sure? I did this corner exactly like OP, except that I placed Golemworks in the same placement round, locked the Golem and the last Smithy, and then proceeded with Roman Road. If he locks the last Smithy, then armoury and alch lab should destabilize and then he should still be able to place the Golem later, in my opinion. Maybe you need also the last armoury to place the golemworks, im not sure about that. but generally it should work.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="odq6wvd" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Bluegoldfishfood</div>
        <div>1 | 16 hours ago </div>
      </div>
      <label for="odq6wvd" class="commentText"><p>You definitely can place golem in the spot OP shows as-is. The problem is that once he gets the next golem down, the smithy will upgrade to level 2 and he will no longer be able to put golem in that corner. Need to do corner first then continue to build out.</p>

<p>After multiple temple builds I found that it was much easier to build it out like this instead of Russian road. The first sac can be used to ensure corner golem stays and not as many locks are needed.</p>

<p>*edit as the tech isn&rsquo;t super clear. The main restriction on placing golem is that there must be at least one level 1 smithy next to it. The first golem in chain is never an issue because if it destabilizes or is placed later, the first smithy will be level 1 (assuming you didn&rsquo;t upgrade with medallion). After that, if you skip or destabilize a middle golem, then both smithies around them will be level 2 (each will have a golem next to it). Need to place and secure golems in order of the snake so you don&rsquo;t end up with a gap and surrounding level 2 smithies.</p>
</label>
    </div>
  </label>
  
</div>
