

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/d4hzhmscua8f1.png"><p>Please help on how to craft this bow</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/d4hzhmscua8f1.png" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="mz063yv" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>jaymo_busch</div>
        <div>1 | 9 hours ago </div>
      </div>
      <label for="mz063yv" class="commentText"><p>+2 arrows is likely better than +5 levels. +2 arrows is like 2 free extra attacks every time</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="mz1nbp8" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>75inchTVcasual</div>
        <div>1 | 4 hours ago </div>
      </div>
      <label for="mz1nbp8" class="commentText"><p>Agreed. Not worth ever fully crafting on a +5 fracture. It’s actually a very easy mod to hit because all +proj are equally weighted between the tiers and already have a high weight (1000 weight per tier). Plus it’s also ilvl81, so you would save it to ladder on with another suffix fracture before going for your last suffix.</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="mz0jgj9" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>norielukas</div>
        <div>1 | 8 hours ago </div>
      </div>
      <label for="mz0jgj9" class="commentText"><p>So there are 2 options here.</p>

<p>Annul down and chaos slam until t1-2 phys% or until 2 extra arrows.</p>

<p>After that you ”have to” hit crit chance, high flat phys and either hybrid phys% elementa dmg with attacks or high flat lightning.</p>

<p>Assuming you want to craft something worth more than the ones you can buy around the 75-100d range.</p>

<p>Warning: crafting high end bows is the most expensive thing you can craft, because you need either 2 crit rolls and +2 arrows or +5 and crit chance and +2 arrows for it to be worth anything.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="mz0m05r" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Bxk__</div>
        <div>1 | 8 hours ago </div>
      </div>
      <label for="mz0m05r" class="commentText"><p>Easiest way is to stockpile any and all lvl 81+ Gemini bows you find, if they&rsquo;re duds recombinate two of them and choose bad stats so you have &amp;gt;50% chance of success, then you wind up with a 2 affix level 81 bow that you can slam 4 exalts on and hopefully see a +5 projectile.</p>

<p>If you get a +5 projectile bow with 1 other bad stat, throw exactly 2 exalts on it and fracture it.  If it winds up with 3 other bad stats and you fractured +5 projectile, you hit the lotto - you can annul all of the other affixes, use 1 exalt to give it a 2nd prefix, and then just throw Chaos Orbs at it until you get a T1 crit chance (both that and projectile are suffix), then use another couple exalts until you get a prefix, then use the sinistral annulment omen to remove horrible prefixes, hopefully you land a T3 or better Physical affix within 1 sinistral omen</p>
</label>
    </div>
  </label>
  
</div>

</html>
