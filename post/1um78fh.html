

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/br05zq2dryah1.jpeg"><p>First “craft”. Nothing fancy but I’m trying.</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/br05zq2dryah1.jpeg" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="ov9vkip" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>butv | poison enjoyer</div>
        <div>1 | 34 minutes ago </div>
      </div>
      <label for="ov9vkip" class="commentText"><p>sell for gold</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="ov9vkqn" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Maulboy</div>
        <div>1 | 34 minutes ago </div>
      </div>
      <label for="ov9vkqn" class="commentText"><p>The cast speed is meh, but the rest looks decent. Not worth a div but some exalts for an attack build looking to cap resistances after interlude.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="ov9vob8" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Jurzy</div>
        <div>1 | 33 minutes ago </div>
      </div>
      <label for="ov9vob8" class="commentText"><p>Cast speed  doesnt synergize with added attack mods, as they don&rsquo;t count towards spell damage, other than that it has good res, some mana if you need it and okay-ish attack mods, it&rsquo;d be fine if you need it for personal use, but for selling it won&rsquo;t be worth much.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="ov9w4sp" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Big_Tension_6464</div>
        <div>1 | 29 minutes ago </div>
      </div>
      <label for="ov9w4sp" class="commentText"><p>Depends on what you need for your build, cast speed is a dead mod for twisters. Fire atk is a bit low tier. Just experiment bit more with items as you build currency. you could prob buy a similar ring for quiet cheap. (exalts)</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
