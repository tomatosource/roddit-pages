    <h2>
      <a class="postTitle" href="https://www.reddit.com/r/PathOfExile2/comments/1lrj75o/worth_crafting/"><p>worth crafting?</p>

    <div class="selfPostContainer">
      <p><a href="https://preview.redd.it/7bwbyapv3vaf1.png?width=327&amp;format=png&amp;auto=webp&amp;s=e3e53ed14a106d2f3cfab02ca8a5896c8d7af34e" target="_blank">https://preview.redd.it/7bwbyapv3vaf1.png?width=327&amp;format=png&amp;auto=webp&amp;s=e3e53ed14a106d2f3cfab02ca8a5896c8d7af34e</a></p>

<p>.</p>

    </div>
    

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="n1b467f" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Bxk__</div>
        <div>1 | 4 hours ago </div>
      </div>
      <label for="n1b467f" class="commentText"><p>I&rsquo;m not too familiar with melee stuff but if the consensus is &lsquo;no&rsquo;, one cool budget thing to do is recombinate that +7 along with the most garbage junk stat from another to keep the odds at or above 50% and then you can exalt slam it again</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="n1boegy" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>myst3r10us_str4ng3r</div>
        <div>1 | 2 hours ago </div>
      </div>
      <label for="n1boegy" class="commentText"><p>Oh so I should be trying to recombine a high tier, high iLvl mod along with a low tier one for the best odds? Interesting. I&rsquo;ve only tried it a few times but I was attempting to recombine 2 nice mods and had very low success odds</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="n1bxt8c" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Bxk__</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="n1bxt8c" class="commentText"><p>Yeah, the success rate is based on the affixes you choose on both sides, and it seems multiplicative.  You can select 1 T1 stat on each and the odds will be pretty low, but you can select 2 T1 stats on one piece and something terrible like 6% fire resist on the other and somehow the odds will be pretty decent, considering.</p>

<p>But like I said, you should only do this if the other stats are kinda bad or not worth whittling.  I mean, the alternative is usually trying to hit that affix with a fracturing orb so this is kind of an alternative to that gamble</p>
</label>
