

<html>

    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    <h2>
      <a class="postTitle" href="https://i.redd.it/3rwrcpa5ridh1.jpeg"><p>Fire wand natural drop - how best to craft from here if even worth it?</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/3rwrcpa5ridh1.jpeg" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="oxtqv1q" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Scoelscoult</div>
        <div>4 | 6 hours ago </div>
      </div>
      <label for="oxtqv1q" class="commentText"><p>Id go for a fracture hoping for skill level. If you hit use astrids creativity to double crafted mod removing from suffix with transcendent and sovereign alloys. Then desecrate for crit chance. If it doesnt hit, id sovereign alloy with sinistral crystallization, then ex slam prefix since mana will be blocked. Then either desecrate suffix for crit, or transcendent alloy taking from prefix again.</p>

<p>No crit chance makes this rough, esp since it has 2 suffixes already. And fire skill levels is not very desirable</p>

<p>Can maybe whittle the mana regen. But yeah I dont think this is worth crafting on with current prices</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="oxtqxi6" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Silent-Island</div>
        <div>3 | 6 hours ago </div>
      </div>
      <label for="oxtqxi6" class="commentText"><p>I can see you have 95 divines. You probably arent eixh enough to do what needs to be done to make this worth crafting yourself. Id sell as is.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="oxtr9nh" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Equanimous_Ape</div>
        <div>1 | 5 hours ago </div>
      </div>
      <label for="oxtr9nh" class="commentText"><p>It probably won’t be worth much because Wanda are easy to make, mana regen is not a good stat and it doesn’t have the key prefixes.</p>

<p>I wouldn’t want to spend much coin trying to craft it (it just start from a better base).</p>

<p>If you wanted to, you could rawdog an annul orb and see if it removes mana regen. If it hits skills, throw it on the ground.</p>

<p>If you rip the mana regen, you can prefix crystal omen to out fcr (transcendent alloy) on the suffix. You can then either exalt the suffix or desecrate it. I think I’d just perfect exalt the suffix and pray. If it hits something good, now you have a base that you can work with. Id still wanna keep it cheap cos I don’t think it’s super likely to sell for much. I’d put Astrid’s in, essence into mana+skill targeting prefix again, then P exalt prefix. If all steps have landed well I would then ancient jawbone to try and lock in a good prefix combo. Ideally finishing with the essence mod and 2 of: fire spell damage, spell damage, damage as extra fire.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">

</label>

</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="oxu5j2o" type="checkbox" checked/>

      <div class="commentHeader">

        <div>1 | 4 hours ago </div>
      </div>
      <label for="oxu5j2o" class="commentText"><p>weird having cold and lightning extra damage on a fire wand but +5 fire skills is the actual value here</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="oxuehzx" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>bkgn | tooldev</div>
        <div>1 | 2 hours ago </div>
      </div>
      <label for="oxuehzx" class="commentText"><p>Go ahead and price check it with EE2, you&rsquo;ll find it&rsquo;s almost worthless I expect.</p>

<p>Unfortunately damage as extra is less valuable than % damage. And only one of yours is even t1.</p>

<p>Don&rsquo;t fracture it, since fracturing orbs are priced around 3 mods, not 4. Fractured t1 as extra is not worth anything. You could potentially yolo annul and then fracture but you should probably do the math first on whether that&rsquo;s worth it. It might be since Dueling Wand is the best wand base.</p>

<p>I haven&rsquo;t played in a couple weeks so I have no idea where prices have gone.</p>
</label>
    </div>
  </label>
  
</div>
