

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>

<div class="commentAndChildren">

<div class="commentAndChildren">
  <input id="nlbvner" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Krydax</div>
        <div>9 | 3 hours ago </div>
      </div>
      <label for="nlbvner" class="commentText"><p>Sigh. This is one of my biggest gripes with POE2. I&rsquo;ve got 450 hours in it already, it&rsquo;s already my favorite ARPG of all time, but geez is there a LOT of lacking information in tooltips. Or lacking descriptions when you highlight things. They need to add more &ldquo;here&rsquo;s how this thing interacts with this other [common thing it would interact with]&rdquo;.</p>

<p>I realize that listing every possible interaction of every possible thing is too much data for tooltips [yet another reason we need an in-game &ldquo;compendium&rdquo; or &ldquo;wiki&rdquo; or &ldquo;book&rdquo; of some sort, that CAN list every interaction&hellip;]. But at least the most common things. I find myself having to google search, reddit hunt, and wiki poke, just to see if my basic idea for a build will even WORK.</p>

<p>The worst part is we have no good tools to test things either. no training dummies. No &ldquo;high health but not dangerous boss&rdquo; to test status effects on.</p>

<p>Not to mention POB2 is missing metric tons of interactions, currently, so everywhere I look there&rsquo;s a &ldquo;not supported in POB2 yet&rdquo; symbol&hellip; (not angry about it, it&rsquo;s a free thing made by people in their free time, so I&rsquo;m not entitled. It&rsquo;s just that another tool that&rsquo;s meant to help me figure things out isn&rsquo;t necessarily working at full speed yet!)</p>
</label>
