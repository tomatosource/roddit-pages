

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>

      <label for="njr5b1h" class="commentText"><p>I haven&rsquo;t seen exact numbers for catalysing, but +3 spell has a weight of 100, your chance to hit that with anything while also having other mods in the pool is very small, catalyzing omen or not. If it was this easy everyone would be running around with 6 mod perfect amulets.</p>

      </div>
      <label for="njrxy01" class="commentText"><p>I would probably do the suffixes first to guarantee the +3 and cast speed, then do the prefixes.</p>

<p>Too many things can go wrong on the suffixes if you do prefixes first and the catalyzing omen isn&rsquo;t reliable by any means, especially on low weighting mods. 20% increased chance on a 100 weight mod is nothing</p>

      </div>
      <label for="njs7o7x" class="commentText"><p>Catlysing Omens aren&rsquo;t that Strong. What I think they do is multiply the weight of a each modifier with a tag by 1.Quality</p>

<p>Under no circumstances you can get life first on item. Life is far to broad of a modifier to have and it&rsquo;s going to completely fucked up your +3 due to</p>

<p>% of Damage taken Recouped as Mana #</p>

<p>% of Damage taken Recouped as Life<br>
# Life Regeneration per second</p>

<p>Desecrate a prefix with Kurgal Omen to get Invocated Spells have (10–20)% chance to consume half as much Energy for a Caster Tag</p>

<p>Slam a Perfect Exalt on Suffixes with a Suffix + Two Modifiers Exalt Omen (this should give you guaranteed +3 and T1 Cast Speed.</p>

<p>Now remove desecration via Omen of Light (or perfect essence if you are going with prefix desecration spam). You&rsquo;re left with 1 Open Suffix and 2 Open Prefixes.</p>

<p>You&rsquo;ve to decide what final desecration prefix you want.</p>

<p>I would probably try desecrating T1 Life or T1 Maximum Life onto Prefix. Once you have that you can Perfect Homogenize the other Suffix for a <sup>50</sup>&frasl;<sub>50</sub> between T1/T2 the other. (If you go that route you can first try quality up the with Life, Slam Perfect Exalt with Prefix Omen). If you hit - great you slam another with prefix omen for a 2nd mod. If you don&rsquo;t use Abyss Essence with Prefix Essence Targeting Omen to remove that mod and turn it into a mart (sometimes you have to click multiple times it&rsquo;s buggy so don&rsquo;t be discouraged if the game shows you you can&rsquo;t do it ). [Note instead of using Omen of Light to remove a desecration what you can do instead is Use <a href="https://poe2db.tw/us/Perfect_Essence_of_Enhancement" target="_blank">Perfect Essence of Enhancement</a> with Prefix Essence Targeting Omen to turn failed Desecration into Global Defences which you than turn into a Mark using Abyss Essence with Prefix Targeting Omen. This allows you to spam desecrations on prefixes on budget.</p>

<p>Final Homo would add either</p>

<p>#% of Damage taken Recouped as Life<br>
% of Damage taken Recouped as Mana</p>

<p>An alternative would be trying to get T1 Life/%max Life via some kind of whittling/sinestral erasure spam on prefixes (but you would need to lock temporary last suffix with some high level desecration so whittlings wouldn&rsquo;t target suffixes otherwise you would have to use Sinestral INSTEAD of whittling (Keep in mind your other prefix is fractured) but this is going to be expensive =&amp;gt; once you hit homo other prefix for t1 or t2 and spam desecrations on suffixes until you get something you want (recoup?)</p>

<p>I can tell you with absolute certainty that <strong>YOU DO NOT WANT TO INTRODUCE ANY OTHER TAG TO THE POOL  BEFORE GETTING</strong> +3 otherwise you just won&rsquo;t be able to hit cast speed/+3 using Homo.</p>

<p>*note if you are going for absolute perfection and recoup is your final third suffix what you should likely do is get +3 get cast speed, turn prefix desecration into any life tagged prefix (any tier). Then you perfect homo onto suffixes and pray for recoup T1. If you miss Yolo Annul praying for the failed homo to be removed. If either Cast Speed or +3 get removed you annul down to 1 mod and start from the beginning.</p>

<p>Once you hit hit recoup t1 and finish your suffixes you get back to crating routine described above probably spamming desecrations (using Perfect Essence of Enhancement and Abyss to fish for T1 MAX LIFE %). Then you homo perfect exalt praying hit T1 of Life. If you miss you Yolo Annul with Sinestral Annulement Omen <sup>50</sup>&frasl;<sub>50</sub> to hit your miss. If you remove T2 life just homo again. If you remove desecration go back to spamming desecrations for T1 Max Life  %.</p>
</label>
