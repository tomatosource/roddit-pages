

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://www.youtube.com/watch?v=7aBRbEKKA5A"><p>r/baseball&rsquo;s Greatest Moments in MLB History #42: Randy Johnson Throws a Perfect Game at Age 40</p>
</a>
    </h2>

    

    <div class="commentList">
      
        
          
<div class="commentAndChildren">

      <div class="commentHeader">
        <div>BUSean | Boston Red Sox</div>
        <div>4 | 28 minutes ago </div>
      </div>
      <label for="nqwp8px" class="commentText"><p>It&rsquo;s redundant and boring to say he was unhittable, but he was unhittable that day. Probably his last incredible moment; it was his last career shutout. He was pretty decent on the &lsquo;05 Yankees but a clear step down from that DBacks run.</p>

<p>Based on the year I was born and the flair that I have, you probably have a guess who I feel was the best pitcher I&rsquo;ve ever seen. There is a key difference. At 5&rsquo;11&rdquo;, I was always thinking that Pedro Martinez would make me look an uncoordinated fool. At 6&rsquo;10&rdquo;, I was always thinking that Randy Johnson could purposefully or accidentally kill me, or anyone else.</p>
</label>
    </div>
  </label>
  
</div>

</div>

        <div>1 | a few seconds ago </div>
      </div>
      <label for="nqwul3j" class="commentText"><p>i was at this game. i was 15 and was with a friend who&rsquo;s dad brought us to the game.</p>

<p>he made us leave in the 7th. we protested and said Randy had a perfect game going. his response was that he wasnt going to finish it, and he didnt want to stay any later because he had to work in the morning and the braves were losing.</p>

<p>turns out Randy finished it. we never let his dad live that one down.</p>

    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
