

<html>
  <head>

    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>

<div class="commentAndChildren">

        <div>3 | 14 hours ago </div>
      </div>
      <label for="o7jznbe" class="commentText"><p>I&rsquo;d suggest getting a rare sceptre with spirit, mana and int, rare full E/S boots and glooves, and a +3 skills amulet (you can probably get rid of the spirit on it and compensate with the sceptre)</p>

<p>Also if you&rsquo;re playing E/W put those weapon 2 passives on your main weapon since you need the curse stuff</p>

<p>We have the same build, you can have a look at mine <a href="https://poe.ninja/poe2/profile/deadsoup-5293/character/soupedepipi" target="_blank">https://poe.ninja/poe2/profile/deadsoup-5293/character/soupedepipi</a></p>
</label>

</div>

        
      
        
          
<div class="commentAndChildren">

<div class="commentAndChildren">

    <div class="comment">
      <div class="commentHeader">
        <div>SavingsAlternative51</div>
        <div>3 | 14 hours ago </div>
      </div>
      <label for="o7k1rm5" class="commentText"><p>I see your problem; you need to significantly increase your mana. On the other hand, I would switch to a ring with % mana + flat mana + 16 all resist + 24% cast speed, and then a Kalandra Ring. That improves things considerably.</p>

<p>I would also change the scepter to a Rathpit; this increases damage since you&rsquo;re using Bloodmage with Lifetap. Spirit is excellent; you don&rsquo;t need CoEa or Siphon Elements, CoC + Archmage + Mana Remnants = 230 Spirit.</p>

<p>65 for a Solar Amulet with a cap (I&rsquo;m using one with +3 all spells)</p>

<p>100 base</p>

<p>55 between Efficiency from the skill tree and Vertex; you can also use a Jewell.</p>

<p>To use EW, you need two gems with 14 curse activation speed + two passives from the skill tree that help with size and activation.</p>

<p>I&rsquo;ll leave my <a href="https://poe.ninja/poe2/profile/fisheyesc-7208/character/FelipeAndroideCasualhc" target="_blank">Poeninja </a>here; you can get an idea.</p>
</label>

</label>

</div>
