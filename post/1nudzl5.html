<div class="commentAndChildren">

      <div class="commentHeader">
        <div>kiuyt856</div>
        <div>1 | 20 minutes ago </div>
      </div>
      <label for="nh0d2l9" class="commentText"><p>I just spoke to someone about this I’ll paste my comment. Do NOT use curses with rakiatas, curses are applied independently to an enemy, penetration and inversion happen at the moment of a hit. Curses and exposure determine the enemy resistance value your inversion/penetration will be applied against</p>

<p>If you use that gem make sure you’re NOT using a curse or exposure with it, because if you curse an enemy down from 30% res to 10%, then when you hit that gets flipped to -10%, meaning they take 10% more ele damage. But if you did nothing and hit them at their original 30% res, it would get flipped to -30% res, meaning they take 30% more ele damage. Do NOT curse or expose enemies while using rakiatas because that actually lowers your damage.</p>
</label>
