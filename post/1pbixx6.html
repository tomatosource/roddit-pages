      <label for="nrqp60w" class="commentText"><p>Coming off his first real dud since elevating to the starting lineup when he struggled to make a positive impact in <a href="https://www.nbcsportsboston.com/nba/boston-celtics/live-updates-celtics-timberwolves-highlights-anthony-edwards/750231/" target="_blank">Saturday’s loss in Minnesota</a>, Jordan Walsh posted career highs on Sunday night while piling up 14 points and 11 rebounds.</p>

<p>But it’s Walsh&rsquo;s defense that continues to distinguish him.</p>

<p>Before the Celtics selected Walsh with the 38th pick in the 2023 NBA Draft, Arkansas coach Eric Musselman routinely described his teenage forward as a &ldquo;violent defender.&rdquo;</p>

<p><a href="https://www.nbcsportsboston.com/nba/boston-celtics/jordan-walsh-scouting-report-celtics-rookie-violent-defender/540228/" target="_blank">Musselman later told NBC Sports Boston</a>: &ldquo;It’s about violently jumping in passing lanes, violently going after rebounds, and rebounding the ball outside of his area. He can crash into bodies, he&rsquo;s not afraid of contact. And hence the phrase, &lsquo;Violent defender.’&rdquo;</p>

<p>With Walsh finally breaking down the door to consistent playing time this season, we’re starting to see the violence that was promised. Walsh has been an elite defender &hellip; and he’s routinely embraced the challenges of defending the opposing team’s top offensive threat.</p>

<p>On Sunday, Walsh logged six minutes, 47 seconds of matchup time against Donovan Mitchell, defending the Cavs star for a game-high 43 total possessions. Mitchell scored four points on 2-of-8 shooting with two turnovers when Walsh was his primary defender, per NBA tracking data.</p>

<p>Walsh’s defensive metrics have been excellent, even as Joe Mazzulla dispatches him against some of the NBA’s elite. Among the 78 players 6-foot-7 and under who have defended at least nine shots per game with 10-plus games played, Walsh ranks second in the NBA while holding opponents to 7.2 percent below expected output.</p>

<p>Opponents are shooting just 40.2 percent against Walsh (47.4 percent expected). He sits one spot ahead of All-Defense stalwart Draymond Green (-7.1 percent), and only Derrick Jones Jr. (-10.8 percent) has a better mark from that group.</p>

<p><a href="https://www.nbcsportsboston.com/nba/boston-celtics/jordan-walsh-defense-stats-cavaliers/750590/" target="_blank">Read more here</a>.</p>
