  <body>
    <h2>
      <a class="postTitle" href="https://v.redd.it/4bx15lgglpeg1"><p>CI + % degen + &ldquo;Prevents Recovery Above 50%&rdquo; = death (regardless of flat regen)</p>
</a>
    </h2>

    

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="o0vu238" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>HoldMySoda</div>
        <div>1 | 4 hours ago </div>
      </div>
      <label for="o0vu238" class="commentText"><p>I think what&rsquo;s most peculiar about this isn&rsquo;t <em>that</em> you died, but <em>how long it took</em> you to do so. I read the title and was expecting you to get wrecked the moment the aura touches you, but it took like 10 seconds. I wonder if that has anything to do with DoTs being stored as &ldquo;per minute&rdquo; and then divided into damage per second, as maybe they do a similar thing for regen. Meaning, it could be possible you get a rounding error after some time and it can no longer round up but instead rounds down, resulting in &amp;lt;1 on the server tick, or simply put: death. Just a hunch, nothing more.</p>

<p>Edit: Can you try this again with more regen? If the time it takes increases, the above mentioned may be what&rsquo;s happening.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="o0w3c5w" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>kokemei</div>
        <div>1 | 3 hours ago </div>
      </div>
      <label for="o0w3c5w" class="commentText"><p>I&rsquo;m pretty sure (from what I read) that -in my case 10%- life degen/s from 1 life doesn&rsquo;t get rounded down to 0, but is stored internally. So after 1 second I had effectively &ldquo;0.9&rdquo; health, after 2 seconds &ldquo;0.8&rdquo; and so on. And that fits very well with 10 seconds till death, since 10*10% = 100% of life. And I died because all flat regen was prevented.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="o0w5g18" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>HoldMySoda</div>
        <div>1 | 3 hours ago </div>
      </div>
      <label for="o0w5g18" class="commentText"><p>Well, can you try again with more regen? Because if what you claim is true, then you shouldn&rsquo;t be dying, as the aura itself doesn&rsquo;t prevent regen. If it is indeed stored as decimals, then you can functionally have 0.5 HP and the flat regen would still be a multitude higher to balance out the loss.</p>

<p>If it prevented your regen entirely and life percentage can be decimals, then adding more regen wouldn&rsquo;t matter as the TTK (time to kill) would remain the same. That&rsquo;s why I asked. If it were to then increase, something else would be the cause, i.e. rounding errors.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="o0w9xxq" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>kokemei</div>
        <div>2 | 3 hours ago </div>
      </div>
      <label for="o0w9xxq" class="commentText"><p><a href="https://imgur.com/a/OScI2qW" target="_blank">https://imgur.com/a/OScI2qW</a>
You were right, nice hunch! That were ~20 seconds. I thought due to some weird interaction with CI all regen would be prevented. But admittedly I&rsquo;m not much smarter now.</p>

<p>*edit: This time it says I have been slain, the first time it was suicide. Weird.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="o0wcop2" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>HoldMySoda</div>
        <div>1 | 3 hours ago </div>
      </div>
      <label for="o0wcop2" class="commentText"><p>Very interesting. So, it just might be a rounding thing. As I do not know the code GGG is running for such things, I can&rsquo;t provide a definitive solution, but at least we now know we are heading in the right direction. It hints at something working differently than expected, maybe even that whole per minute thing I mentioned earlier. Makes me wonder what the breakpoint is. Thanks for giving it a try.</p>

<p>Edit: After looking at it some more, your time approximately doubled (a little over 20 seconds), with approximately double the regen. That, at least so far, gives us somewhat linear scaling to work off from.</p>
</label>
    </div>

<p>Again 20 seconds ¯_(ツ)_/¯</p>
</label>
