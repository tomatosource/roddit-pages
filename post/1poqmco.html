

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>

    <h2>
      <a class="postTitle" href="https://i.redd.it/7lv15irdwp7g1.png"><p>This mechanic can be really frustrating.</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/7lv15irdwp7g1.png" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="nuh9pt0" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Impossible-Act9030</div>
        <div>18 | 7 hours ago </div>
      </div>
      <label for="nuh9pt0" class="commentText"><p>I love poe1. I love PoE2. I love ggg. but I absolutely don&rsquo;t love this regular, half-assed development. it&rsquo;s a shame and one has to really want to take part in all this.</p>

<p>this has nothing to do with early access. with 0.4 they obviously changed a lot around the render engine. troubles and bugs - I get it. but this there is just bad. and unnecessary. it&rsquo;s unnecessarily bad. that&rsquo;s what it is.</p>

<p>abyss introduced lots of performance problems. at some point in time they fixed a lot of that mid-season. let&rsquo;s wait and see. but: I reached mapping just yesterday and already have lost any interest in the current season mechanics. sorry.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nuhi12w" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>BrettHitmanHart</div>
        <div>3 | 5 hours ago </div>
      </div>
      <label for="nuhi12w" class="commentText"><p>I was really hyped for the new league, loved abyss league. But after playing 3 temple runs in the campaign I feel exhausted. I fight the same boss in the same spot every time. Haven&rsquo;t reached maps yet but I think I will pass on this league mechanic in endgame. Maybe it is just me but abyssal felt different and I was more exited about it when I jumped down to the depth or when I revealed something at the well.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nui03bp" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Selvon</div>
        <div>3 | 3 hours ago </div>
      </div>
      <label for="nui03bp" class="commentText"><p>You converted your barracks to the transcendent version, which isn&rsquo;t supported by the armoury.</p>

<p>.so those rooms are now orphaned. The barracks does not connect to the spymasters room (because they don&rsquo;t affect each other) and same with the armoury.</p>

<p>And the prosthetics lab doesn&rsquo;t connect to the vault (nothing does put paths).</p>

<p>Rooms only connect to each other if they support each other in some way (Upgrading or transforming) or they are a path.</p>

<p>It&rsquo;s not a bug or anything, and it didn&rsquo;t &ldquo;try to connect the rooms&rdquo;.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="nui1r6n" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>oltronn</div>
        <div>6 | 3 hours ago </div>
      </div>
      <label for="nui1r6n" class="commentText"><p>It is still complete bullshit of a user experience, for the connection to disappear between two rooms just because you connected a new one, it’s just bad design.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="nui2gbo" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Selvon</div>
        <div>-6 | 2 hours ago </div>
      </div>
      <label for="nui2gbo" class="commentText"><p>Having failure states, or punishments isn&rsquo;t bad design. Having a situation where the user can make a mistake, isn&rsquo;t bad design.</p>

<p>There&rsquo;s plenty of examples of bad design in PoE2 without having to use &ldquo;I made a mistake and learned a lesson&rdquo; as one. You&rsquo;d only ever make this mistake once, then you&rsquo;d know not to orphan your rooms in future (unless you plan on putting a path to reconnect)</p>
</label>
    </div>
