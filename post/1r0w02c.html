</a>
    </h2>

    

    <div class="commentList">
      
        
          
<div class="commentAndChildren">

  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="o4l5ghn" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>link-notzelda</div>
        <div>1 | 17 minutes ago </div>
      </div>
      <label for="o4l5ghn" class="commentText"><p>Pretty much 1100 divs and an afternoon farming the spinters.</p>

<p>All these logbooks were farming while pathing to towers for corrupted nexuses, citadels and anomaly bosses. Turns out with all the tech in the game, you just need a very basic atlas expedition tree and the unique expedition tablet to drop logbooks in your maps. I’ve even dropped four (!!) logbooks in a single map. When pathing, I just chuck one with 2 breach tablets or with a grand project for the tower maps and there you go. Quite surprising the tablets are only like a couple chaos or a single anul when the actual spinters are currently at 3:1 div. And most people selling logbooks are overpricing them while they still only have 2 mods when my tree setup makes them at least have +1 level and four mods.</p>

<p>[also dropped a rakiata’s which means I’ve gotten at least one big drop from each anomaly boss this league and around 8 fragments at 14-15 divs a piece].</p>
</label>

      <div class="commentHeader">
        <div>link-notzelda</div>
        <div>1 | 14 minutes ago </div>
      </div>
      <label for="o4l5t0b" class="commentText"><p>The entire bottom row is from level 80 logbooks and the top 2 were from 81. The lowest I got in an expedition was 23 splinters which is still 7 divs but on average, 70-100 splinters seemed average if you know what you’re doing. The key is your at last tree giving you +1 level logbooks and your logbooks dropping with 4 mods instead of 2</p>
</label>

        <div>1 | 3 minutes ago </div>
      </div>
      <label for="o4l6x6b" class="commentText"><p>Good luck! The logbooks drop from runic monsters in your maps so try to hit as many runic monster markers (double red flags) with your 5 explosives as possible. Here’s how the atlas tree looks with all 8 points.</p>

<p><a href="https://preview.redd.it/7wfrx80uzmig1.jpeg?width=1963&amp;format=pjpg&amp;auto=webp&amp;s=2725895006c146af56960488ef3e952f968fa347" target="_blank">https://preview.redd.it/7wfrx80uzmig1.jpeg?width=1963&amp;format=pjpg&amp;auto=webp&amp;s=2725895006c146af56960488ef3e952f968fa347</a></p>

<p>Min-maxing the logbooks takes more effort but you literally only care about runic splinters (black flag with squirly symbol) so in practice, explosion placement range and additional chest markers are really good implicits, with number of explosives and explosion radius secondary, and trying to hit as many “20% quantity of items in escavated chests” runic markers <em>and</em> all the runic chest markers as possible</p>
