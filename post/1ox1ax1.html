      <label for="notzloh" class="commentText"><p>From Chris Forsberg:</p>

<p>While some of Boston&rsquo;s younger players are still on a quest for individual consistency, the bench has given the Celtics steady output to start the season. The Celtics rank 11th in the NBA in bench scoring (38.1 points per game) but are getting a league-best 6.8 bench 3-pointers per game, while the reserve group has often provided energy and grit. </p>

<p>For Part 2 of our &ldquo;13 for 13&rdquo; series, we’re putting the spotlight on some of the team&rsquo;s top role players.</p>

<p><strong>Josh Minott</strong></p>

<p><strong>One number: 5.0</strong></p>

<p>That’s Minott’s foul percentage this season, which ranks in the highest fifth of the league, per Cleaning the Glass data. His propensity to pick up early fouls has hindered his ability to lock down the starting role that he elevated to early in the season.</p>

<p><strong>One thought</strong></p>

<p>The Lawn Mower’s ability to impact the game with his energy is undeniable. When the Celtics were getting battered on the glass to start the season, he <a href="https://www.nbcsportsboston.com/nba/boston-celtics/josh-minott-nickname-impact-starting-lineup/743284/" target="_blank">injected some much-needed height and athleticism</a> into Boston’s starting frontcourt. His offense emerged, too, as he started knocking down above-the-break 3s and finishing loud alley-oops in transition.</p>

<p>But the 22-year-old Minott is still searching for consistency &ndash; and the coaching staff seems to be imploring him to play without fouling. Minott has all the physical abilities to be a consistent presence for this team, and being laser-focused will ensure he stays on the floor.</p>
