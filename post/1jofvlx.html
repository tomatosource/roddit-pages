

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://www.reddit.com/r/PathOfExile2/comments/1jofvlx/how_hard_is_it/"><p>How hard is it ?</p>
</a>
    </h2>

    
    <div class="selfPostContainer">
      <p>Just bought the game and I’m very excited but a little concerned about the difficulty. Can you give me your feedback based on your experience.</p>

    </div>
    

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="mkrgp19" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Positive-Builder-807</div>
        <div>1 | 8 minutes ago </div>
      </div>
      <label for="mkrgp19" class="commentText"><p>Depends on your skill level I guess. Some say it’s very hard, some say it’s easy. I found the first play through to be a fun challenge but didn’t find it as hard as some people make it out to be. There were times I needed to grind a level or two to beat a boss, but never found myself stuck on a boss for hours and hours. It also depends what you play and how you build your character. I’d say if this is your very first time playing POE, follow a build guide for a better levelling experience.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="mkrgt9q" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>gui4455</div>
        <div>1 | 7 minutes ago </div>
      </div>
      <label for="mkrgt9q" class="commentText"><p>its hard, like you get one shot all the time, but is also rewarding, you can make your character so powerfull you one shot enemies before they one shot you</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="mkrh4i2" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>BloodOmen36</div>
        <div>1 | 6 minutes ago </div>
      </div>
      <label for="mkrh4i2" class="commentText"><p>The game is hard but you are able to make it. If you get stuck, there are many of sources in order to progress. I would say, try it out and see how far you get. Just a few tips:</p>

<p>Restistences and life are nice in the beginning, armor is bullshit.</p>

<p>Attacks usually scale their damage with your weapondamage and spells with spellevel.</p>

<p>Don&rsquo;t forget to have fun. I would love to experience the acts for the first time again. You can do it!</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
