        <div>Wonderful_Eagle_6547</div>
        <div>9 | 7 days ago </div>
      </div>
      <label for="n9di5mx" class="commentText"><p>The Rockets beat the brakes off the Lakers in the WCF that season. The Lakers weren&rsquo;t overly unhealthy for a team late in the playoffs. Houston was just too much for them. They had big guards to throw at Magic, Sampson and Olajuwon made it difficult to score inside, and Akeem (at the time) started to show his potential top 10 all time guy output. The biggest factor in the series is that the Rockets had guys to throw at Magic and Worthy, Olajuwon outplayed Kareem by a fair bit and Mo Lucas and Rambis couldn&rsquo;t do anything with Sampson. The Rockets were the better team. They don&rsquo;t get enough credit all time, because the team unravelled with Sampson struggling with injuries and everyone else struggling with cocaine. But if the Rockets had taken a different path and contended for a decade around Hakeem, nobody would think twice about them being a tough finals opponent.</p>
