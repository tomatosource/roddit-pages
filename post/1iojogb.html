

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
}

.selfPostContainer * {
  color: white;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/n5pxay5gxwie1.png"><p>Just burned all my luck: All 3 citadels on one screen!</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img src="https://i.redd.it/n5pxay5gxwie1.png" />
	</div>
  

    <div class="commentList">

  </label>
  
</div>

    
  </div>
  
</div>

<p>They seem to have some sort of logic that seems to make citadels spawn near citadels you&rsquo;re setting up when you get the towers.</p>

</div>

        
      
        
          
<div class="commentAndChildren">

      <div class="commentHeader">
        <div>WarhammerChaos</div>
        <div>1 | 4 minutes ago </div>
      </div>
      <label for="mcjxbmn" class="commentText"><p>Some advice, use the highest waystone % drop chance you can find.</p>

<p>I use 500-600% + Tablet + Atlas tree potential multiplier and sometimes get 900-1200% waystone drop chance in map.</p>

<p>Higher your waystone the more fragments you&rsquo;ll drop.</p>

    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="mcjxtkb" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Saint-Leon</div>
        <div>1 | a minute ago </div>
      </div>
      <label for="mcjxtkb" class="commentText"><p>This happens a ton. I have like 5 or 6 on the same screen where I’m at on the atlas right now. It’s pretty dope. I ran arbiter 3 or 4 times last night all with self procured keys.</p>

<p>It’s toobad arbiter is such a dumb easy boss and the loot either super sucks or is pretty good really no in between.</p>

    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
