      <label for="ohnpge2" class="commentText"><p>From Chris Forsberg:</p>

<p>The Curse of Game 2 continues to haunt the Celtics. Boston fell to 3-5 in its last eight home Game 2 playoff tilts after <a href="https://www.nbcsportsboston.com/nba/boston-celtics/live-updates-76ers-game-2-highlights-score/783077/" target="_blank">falling to the Philadelphia 76ers on Tuesday night</a>.</p>

<p>The positive spin: Boston dropped early round Game 2s against both Miami and Cleveland in 2024, then finished both series in five games en route to Banner 18.</p>

<p>The harsh reality: The Celtics shot themselves in the foot throughout Tuesday’s loss and activated a Sixers team that ought to feel confident as the series shifts back to Philadelphia. </p>

<p>The Celtics have some obvious defensive issues to shore up after watching &ldquo;VJ Maxx&rdquo; get way too comfortable on the parquet. But here are five more things the Celtics might need to tidy up ahead of Game 3 in Philly on Friday night:</p>

<p><strong>1. Limit the live-ball turnovers</strong></p>

<p>After giving up just three points off three live-ball turnovers in Game 1, the Celtics had a handful of ill-timed live-ball giveaways Tuesday that helped activate Tyrese Maxey and VJ Edgecombe.</p>

<p>The one that sticks in our mind was late first quarter, with the 76ers already walking down an early double-digit deficit, when Payton Pritchard got trapped above the 3-point line.</p>

<p>Maxey looked like a cornerback jumping a comeback route when he peeled off from Derrick White and jumped in front of Pritchard’s haphazard pitch intended for Nikola Vucevic. Maxey waltzed in for a dunk that made it a one-possession game.</p>

<p>The Celtics finished with six live-ball turnovers leading to nine points. They had 13 turnovers overall leading to 15 points. None of those numbers are egregiously bad, but when the offense is sputtering and every possession feels important, the Celtics certainly complicated their lives.</p>

<p><a href="https://www.nbcsportsboston.com/nba/boston-celtics/76ers-game-2-takeaways-game-3-keys/783484/" target="_blank">Read more here</a>.</p>
