      <label for="mh0v5bm" class="commentText"><p>From <a href="http://Globe.com" target="_blank">Globe.com</a></p>

<p>By Chad Finn</p>

<p>Beat L.A.?</p>

<p>Oh, the Celtics did, by a <a href="https://www.bostonglobe.com/2025/03/08/sports/jayson-tatum-jaylen-brown-celtics-lakers/?p1=Article_Inline_Text_Link" target="_blank">111-101 score Saturday night</a> in a regular-season matchup that had so much buzz that you would have thought it came with a trophy presentation at the end.</p>

<p>And they would, without a doubt, should ABC and the NBA’s daydream of a Celtics-Lakers duel in the NBA Finals somehow come to fruition in June.</p>

<p>That’s the biggest of many takeaways from the Celtics’ emboldening victory at TD Garden, just the third loss for the Lakers in 15 games — and first in their last eight — since they were gifted Luka Doncic by the punch-line Mavericks on February 1.</p>

<p>The Lakers, even with Doncic and LeBron James working as a dynamic duo, are not in the class of the defending champs. Not in the same phylum, either.</p>

<p>They do not have the team — talented, selfless, well-rounded players who thrive within their particular roles — to match the Celtics, and I’m not even sure their duo is more dynamic than Boston’s.</p>

<p>Should the Celtics advance to the Finals — and we’re not dismissing the legit-as-legit-can-be Cavaliers here, but merely daydreaming on what a championship matchup might look like — they will not have to worry about the team they took down Saturday night.</p>

<p>The upcoming heavyweight bout at the Garden on Wednesday versus the Western Conference-leading Oklahoma City Thunder will be far more telling, and we’ll touch on them more a few paragraphs from now.</p>

<p>This victory over the Lakers is worth savoring for many reasons, not the least of which being that it should at least temporarily thwart the national media’s anointment of LeBron, Luka, and an Assortment of Decent but Mismatched Parts as the team to beat.</p>

<p>(I suppose it should be noted somewhere that there was a decent contingent of Lakers fans at the Garden Saturday night. But they were mostly seated in the upper bowl, with 18 banners in their sightlines.)</p>
