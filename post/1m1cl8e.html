      <label for="n3fyw9l" class="commentText"><p>From <a href="http://Globe.com" target="_blank">Globe.com</a></p>

<p>Caitlin Clark wants to make very clear: She’s a Pacers fan.</p>

<p>That said, the Indiana Fever star had plenty of kind things to say about the Celtics — and Boston — before <a href="https://www.bostonglobe.com/2025/07/15/sports/wnba-indiana-fever-connecticut-sun-game-score-caitlin-clark/?p1=Article_Inline_Text_Link" target="_blank">Tuesday’s game against the Connecticut Sun at TD Garden</a> upon her first visit to the city.</p>

<p>“Obviously, if you’re a basketball fan, if you grow up a fan, you love the Celtics.</p>

<p>“Well, maybe, I guess you could hate ‘em,” she said to laughs.</p>

<p>“I think, for myself, the Celtics [are] one of the premier organizations of the NBA. You always grow up knowing what the Celtics are about, and obviously, having won a championship two years ago now, it’s kind of cool to just be in this building and … surround yourself with the greatness that has played in this arena.”</p>

<p>Clark shouted out a few players — Jayson Tatum, Derrick White, and Jaylen Brown, the latter of whom was among the sold-out crowd of 19,156.</p>

<p>“They shoot a lot of threes, which, maybe people make an argument against, but for myself, I think that’s fun,” she said. (Sounds like Joe Mazzulla would be a Clark fan.)</p>

<p>“I enjoy that, I think it’s a great style of basketball. So, I think anytime you come into an arena and there’s just so much history hanging from the rafters, you certainly look up and soak it in.”</p>

<p>Clark and the Fever flew into Boston after their win Sunday over the Wings in Dallas, so she didn’t have much time to explore the city before preparing for Indiana’s eventual 85-77 win over Connecticut. She and teammate Lexi Hull ate at Earl’s Kitchen + Bar near their hotel in the Back Bay, but Clark “didn’t really get to do a ton.”</p>
