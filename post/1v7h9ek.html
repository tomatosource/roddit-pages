      <label for="ozy4657" class="commentText"><p>I&rsquo;m assuming you want to keep that suffix?</p>

<p>Both T1 ES are high weight mods. What I do in these situations is chaos spam for one and try to perfect exalt with sinistral exaltation the other. If I miss I raw annul. Either I hit the bad mod and get to perfect exalt again or I have to chaos spam to get back one of the ES mods.</p>

<p>In your case you can chaos spam until you hit either ES mod or that charge consumption mod and then sinistral exalt. Once you have <sup>2</sup>&frasl;<sub>3</sub> mods you want you use desecration to get the third.</p>

<p>So from the pic you posted, slam that perfect exalt. Raw annul and perfect exalt to try to remove and replace the bad mod. If you miss the annul, chaos spam until you land on one of the three mods you want.</p>
