       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;

}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>

<div class="commentAndChildren">

    <div class="comment">
      <div class="commentHeader">
        <div>PobvalniTarakan</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="nwi03xk" class="commentText"><p>If this is a veiled hint at nerfing the temple, then I will respond as follows.</p>

<p>There is no point in destroying the temple of Baal.</p>

<p>Let me explain.</p>

<p>Firstly, exalts are always useless after the first week. This is because there is nowhere to physically use them except for waystones. And if there is no demand for a product, you understand what happens.</p>

<p>Second, the construction of the Baal temple brought back half of the players who left the league in the first week because there is literally no endgame in the game.</p>

<p>Third, by destroying the ability to build the Baal temple, GGG will achieve an obvious result: 50% of players will immediately leave the league because they have nothing to do in the game (including me). No one will farm the league mechanics they made because there is literally nothing to do there except for Atziri.</p>

<p>Fourth, this is a PLUS for NEWBIES. Because items from other league mechanics, such as bosses, rituals, and other items that can only be obtained on maps, will become much more expensive. And their sale will also bring huge profits.</p>

<p>Therefore, nothing will happen to the economy.</p>

<p>Building a temple is very difficult. A good temple takes 1-3 days to build, depending on your luck, while playing 16 hours a day. Do you think every player can afford that?</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="nwi3hd6" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>khalid_rakesh</div>
        <div>1 | 18 minutes ago </div>
      </div>
      <label for="nwi3hd6" class="commentText"><p>First point: The temple printing currency deflates all basic currency, not just exalts</p>

<p>Second point: No evidence of 50% doing this. Sure, it is nice that the temple is more rewarding than it was. However, unless you are doing the large snake strat, its rewards are meaningless compared to what others are getting.</p>

<p>Third point: Again, no evidence that 50% are doing this. Instead, I would bet lots of people are upset at it. I don&rsquo;t want to run the temple over and over. Yet if I do not, I am essentially wasting my time.</p>

<p>Fourth point: No, newbies never benefit when everything gets inflated to the moon. The players farming snakes can switch to do other things if for some reason those end up more profitable. Meanwhile, the players not doing snakes cannot just switch to snake to farm divines in any reasonable timeframe.</p>

<p>Summary: A strat that takes days to set up, but at that point prints divines 10 times what even highend other strats are able to do (check Fubgun&rsquo;s video on this), is just absurd on its face. To pretend that it won&rsquo;t have an effect on the economy is just bizarre.</p>
</label>
