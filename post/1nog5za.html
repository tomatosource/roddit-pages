    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>

    <div class="comment">
      <div class="commentHeader">
        <div>omfghi2utwo</div>
        <div>1 | 31 minutes ago </div>
      </div>
      <label for="nfrnvrc" class="commentText"><p>Ah OK, that&rsquo;s about what I was predicting. Its a common mistake for newer players. The issue you&rsquo;ve got is that your damage stats on this bow don&rsquo;t really apply to LA. You&rsquo;re pretty severely gimped in the damage department.</p>

<p>The way LA works is that it converts physical damage into lighting. In your case, the flat lightning and flat fire aren&rsquo;t doing much at all, since they don&rsquo;t convert for LA. This bow only has 93.15 base physical dps, which is not very much at all.</p>

<p>I 100% guarantee that if you get a bow with even <em>decent</em> %physical and flat physical, you&rsquo;ll immediately like double or triple your tooltip damage output.</p>

<p>Edit: I just took a quick look on trade and you can easily get a bow with ~300 physical dps for 1ex or less. I see some for a regal.</p>

      </div>
      <label for="nfrbcfv" class="commentText"><p>I&rsquo;m not sure what &ldquo;demon&rdquo; is (probably just creature type), but elemental resistance nerfs your attacks pretty hard, you need either lightning penetration or elemental weakness (not sure about exposure, but it may help too). Other than that, be careful, keep distance, avoid its attacks and ground effects (it&rsquo;s hp degen iirc). Check your resistances (should be 75+) and switch charms (resistance ones are pretty useless). Update your gear to get more damage and kill such things faster. If SSF, then avoid abyssal depths until you find better gear.</p>
</label>
