.postHeader {

.commentList {

.commentAndChildren {

.comment {

  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {

}

.selfPostImage {

  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

      </div>
      <label for="nbap75t" class="commentText"><p>I&rsquo;ve answered this question on a few other occasions. For instance this is what I wrote <a href="https://www.reddit.com/r/pathofexile/comments/1mexdaz/comment/n6d0y6h/" target="_blank">here</a>:</p>

<blockquote>
<p>I can tell you the gripes I always had with other filters &amp; why I created this alternative. I also try to lay them out in the &lsquo;Filter Philosophy&rsquo; section on the tool&rsquo;s website. Most importantly:</p>

<p>- It&rsquo;s probably because I&rsquo;m a D2 nostalgic, but I&rsquo;m quite attached to the game&rsquo;s loot aesthetics. I never liked how many filters completely change the game&rsquo;s beautiful and dark atmosphere. My heart bleeds a bit every time I see a screenshot of this beautiful game, without seeing the actual game underneath the huge, flashy, out-of-theme labels. I don&rsquo;t change the original iconic label styles, except (optionally) for top-tier currency, and then I try to do so in a way more consistent with the game&rsquo;s aesthetics. All the while making it easy and fun to tweak the aesthetics for those who want to!</p>

<p>- I never liked how I felt like I needed to learn dozens of opinionated color codes to understand what was being shown. Other filters need this because they adopt a &lsquo;one-size-fits-all&rsquo; approach. They can&rsquo;t hide anything, and so they must change the styles, so the player can decide &lsquo;at play-time&rsquo; whether they need the item or not. I use a different approach: I think the tool should hide everything the player doesn&rsquo;t need, beforehand. For instance, you decide whether boss-only uniques are being shown at all; how good gear has to be to still be shown; which currency you want to see. And at league start, the filter hides all the gear not for your character, making the experience so much more enjoyable.</p>

<p>- I&rsquo;m quite sensitive to UI/UX, and, well, one could argue that other website are a bit&hellip; outdated in that regard, to put it euphemistically :). I&rsquo;m trying to create a website &amp; experience that fits well with the game &ndash; using the trade website&rsquo;s well known style; and is easy, intuitive and fun to use and tweak.</p>
</blockquote>
</label>
