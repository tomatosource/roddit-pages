

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/69dh1jwk48ye1.png"><p>LS Appreciation Post</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/69dh1jwk48ye1.png" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="mq2sc0q" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Stunning_Rub_6624</div>
        <div>1 | 26 minutes ago </div>
      </div>
      <label for="mq2sc0q" class="commentText"><p>How do you get such insane AOE? Mine is decent but I’ve never had my screen look like this lol</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="mq2sdgw" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Collguydev</div>
        <div>1 | 26 minutes ago </div>
      </div>
      <label for="mq2sdgw" class="commentText"><p>feels great</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="mq2twa0" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>WritingisWaiting</div>
        <div>1 | 19 minutes ago </div>
      </div>
      <label for="mq2twa0" class="commentText"><p>It&rsquo;s exactly what an end game build should feel like, though it admittedly needs a much higher barrier of entry. Maybe if a tangletongue was required to make it work, plus a certain ascendancy.  Honestly, there should be 50x builds that feel like LS, where you can build up to them with the right combo of uniques and ascendancies.</p>

<p>As it is, it&rsquo;s so much better than everything else that almost any class is better off picking up a spear and going LS than actually trying to build something new. Of course, this isn&rsquo;t surprising, since there is no evidence that GGG actually play tests anything (that&rsquo;s what we&rsquo;re for) and any build that stands out as too powerful will be nerfed into the ground (every four months of course, we wouldn&rsquo;t want to try and balance the game during EA!)</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
