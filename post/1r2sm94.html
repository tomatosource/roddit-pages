.commentHeader {

.postTitle {

}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;

.selfPostContainer {

.streamableContainer {

  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

      <a class="postTitle" href="https://i.redd.it/sawd33u392jg1.jpeg"><p>Non-Mana Amulett Crafting advice</p>
</a>
    </h2>

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="o4z4qkq" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>-Dargs</div>
        <div>1 | 8 hours ago </div>
      </div>
      <label for="o4z4qkq" class="commentText"><p>You can&rsquo;t really guarantee any of these in poe2 crafting. The best thing to do would be to get a base and annul it down to just 1 mod and chaos orb for all spells or spirit. Fracture and hope you hit one. Then you chaos orb for the other, since they&rsquo;re both super low weighting rolls and you&rsquo;re not going to reliably hit them any other way within any budget under mirrors. I think ideally you fracture spirit because you would much rather sanctify for +4 spells than changing spirit, and getting even just a bit less spirit can brick an amulet. If you know you&rsquo;re not reselling or sanctifying then go for either, fracture, go for the other. You could also just buy a fractured amulet for probably cheaper. It&rsquo;ll take thousands of chaos and the fracturing orbs so its probably going to run you more unless lucky.</p>

<p>Now you&rsquo;ve got 2 mods. Depending on which mod is not fractured you&rsquo;re going to catalyst for life qual and then prefix or suffix catalyst perf exalt for life. If it hits, great. If it doesn&rsquo;t then you can omen annul the failed mod away. If +3 spells was your non-fractured mod then this is repeatable for t1 life. If it wasn&rsquo;t, then maybe consider just life qual omen double perf exalt and hope for both mods. You are on a budget after all&hellip;</p>

<p>Then you gamble for your 5th mod&hellip; and then descrate for your 6th. Or the other way around if you don&rsquo;t care as much for the last modifier. I&rsquo;d recommend just toying around with crafting in the simulator on <a href="https://www.craftofexile.com/?game=poe2" target="_blank">https://www.craftofexile.com/?game=poe2</a> before you go spending hundreds of divines on a craft you probably can&rsquo;t finish.</p>
</label>
    </div>
