

<html>

    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;

}

body {
  display: flex;
  flex-direction: column;
  align-items: center;

  padding: 32px;

}

h2 {

  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;

}

blockquote {
  border-left: 10px solid #ccc;

  margin-bottom: 32px;

.subName {
  text-decoration: none;
}

.postList {
  display: flex;

  align-items: center;

}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>

    <h2>
      <a class="postTitle" href="https://www.reddit.com/r/PathOfExile2/comments/1o69704/holy_eyegasm/"><p>Holy Eyegasm.</p>
</a>
    </h2>

    
    <div class="selfPostContainer">
      <p>Forgot to distill a map, totally forgot how nice it is to play games in colour over black and white.</p>

    </div>
    

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="njh067j" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Neither-Goat-6844</div>
        <div>21 | 19 hours ago </div>
      </div>
      <label for="njh067j" class="commentText"><p>i dont understand how the devs thought its ok to have perma fogs in end game and ruin the beautiful art and colors of the game</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="njhd49u" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Krydax</div>
        <div>11 | 18 hours ago </div>
      </div>
      <label for="njhd49u" class="commentText"><p>ignore the &ldquo;beautiful art and color&rdquo; arguments for a moment. (though they&rsquo;re accurate too)</p>

<p>There&rsquo;s an even simpler reason. It&rsquo;s annoying. The music is annoying. The fog is annoying. It&rsquo;s visual clutter in a game that already MASSIVELY struggles with visual clarity even without a delirium map. It&rsquo;s just NOT A GOOD THING to have on the game <sup>24</sup>&frasl;<sub>7</sub>, for a million reasons. I honestly cannot comprehend how it&rsquo;s still what we&rsquo;re dealing with in the third league when everyone already knew it was a huge problem in league 1.</p>

<p>It&rsquo;s cool for one map, or three. But for HUNDREDS????? No. Please. It&rsquo;s the same issue with some of the A4 bosses. They&rsquo;re great bosses for the campaign, but TERRIBLE bosses for mapping, their mechanics are so annoying to face over and over again.</p>

<p>This is the sort of issue where I (and many others, I know) start asking the &ldquo;do they even play their own game?&rdquo; question. I know the answer is, of course, yes. But does this NOT bother the hell out of the devs too? Like, are they just like &ldquo;oh yeah, cool, every map is gray, the music is one track forever, the visual clarity is even worse, this is peak gameplay&rdquo;?</p>

<p>Or do they NOT juice every lategame map? Like are they just not minmaxing like so many of their players are?</p>

<p>It&rsquo;s confusing because they&rsquo;ve made other changes that make it clear that:</p>

<ol>
<li>They are playing their own game.</li>
<li>They understand how late game players are minmaxing&hellip;</li>
</ol>

<p>SO WHY IS DELIRIUM FOG ON EVERY MAP STILL A THING.</p>
</label>
    </div>
  </label>
  
</div>
