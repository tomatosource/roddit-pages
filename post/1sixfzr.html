

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://www.reddit.com/r/PathOfExile2/comments/1sixfzr/a_reminder_to_ggg_couch_coop_exists_and_needs_to/"><p>A reminder to GGG: Couch Co-Op exists and needs to be tested!</p>
</a>
    </h2>

    
    <div class="selfPostContainer">
      <p>Dear GGG, please tests league mechanics with Couch Co-Op before releasing, we had terrible time trying to do temple in couch co-up in 0.4.</p>

    </div>
    

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="ofnjmf0" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>relicx74</div>
        <div>1 | 34 minutes ago </div>
      </div>
      <label for="ofnjmf0" class="commentText"><p>Just the incentive they need to remember they should release a bug free experience.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="ofnjyj9" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Useful_Ad7939</div>
        <div>1 | 32 minutes ago </div>
      </div>
      <label for="ofnjyj9" class="commentText"><p>I&rsquo;ve sadly given up on couch coop for the time being with my future wife after playing 0.1 together and experiencing so many couch coop only glitches.</p>

<p>She doesn&rsquo;t have patience for that carry on, but she will join me again when they finish the campaign.</p>

<p>So my hope is they get put some focus on couch coop once they go for full release. My advice is either wait too or be mindful it&rsquo;s not fully ready.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="ofnp6x1" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>hodor137</div>
        <div>1 | 3 minutes ago </div>
      </div>
      <label for="ofnp6x1" class="commentText"><p>Maybe it shouldn&rsquo;t exist.  Having to ensure everything about the game also facilitates couch coop sounds horrible, and it shouldn&rsquo;t be allowed to affect the 99% of the playerbase.</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
