

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/km272dof0nre1.png"><p>Theory question about Smith of Kitava</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/km272dof0nre1.png" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="mkd0zjm" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Tsunamie101</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="mkd0zjm" class="commentText"><p>I feel like it&rsquo;d be best to go armour resistances nodes early (using normal body armours and not having to worry about mods is pretty neat for leveling), but later on you&rsquo;ll transition into an actual rare/unique body armour and just use the &ldquo;fire (max) res also affects other (max) res&rdquo; nodes.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="mkd1dlg" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Necessary_Concept_78</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="mkd1dlg" class="commentText"><p>I mean the body armour res nodes aren’t even the strong points? Stuff like 5% max res, 20% strength, armor affects chaos damage etc..those are the strong ones but yea I’m sure there will be use cases where you want to use a rare or unique armour</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="mkd1v50" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Reniath</div>
        <div>1 | 43 minutes ago </div>
      </div>
      <label for="mkd1v50" class="commentText"><p>Im not sure about benefits but my original thought was using the notable on tree that gives 2% max fire res per 40 uncapped fire res. This and the other ascendancy node where you gain 50% of your fire res as the ther elemental resistances says you can more or less just get fire resist and you gain all max ele res, and capped ele res (or close to).</p>

<p>I would probably run fire resist/max fire resist early, swap both to increasing max hp and convert physical damage taken to fire or regen (id only probably run 2 armor points so i can use my last ascendancy points for dmg. im unsure what id do on this build however).</p>

<p>Honestly it looks very tanky and budget friendly so very very good for HC and SSF especially.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="mkd720l" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>lurkervidyaenjoyer</div>
        <div>1 | 15 minutes ago </div>
      </div>
      <label for="mkd720l" class="commentText"><p>We&rsquo;ll have to see where they go with it, but those armor-crafting options are going to be a weird design space because you&rsquo;re giving up both the ascendancy points and any/all affixes on your chestplate to get them, when you could instead have a chestplate with affixes and spend those ascendancy points you would&rsquo;ve dumped into armorcrafting into bonuses that stack on TOP of what you get from the armor, without making any sacrifices. Basically if they&rsquo;re going to stick with requiring you wear a white chestplate with this ascendancy, they need to make sure the bonuses you&rsquo;re getting are competitive with a BiS chestplate + this or other ascendancies&rsquo; notables combined.</p>

<p>If not, then I do think this could still have a niche use. I know you can&rsquo;t respec to a different ascendancy and they&rsquo;re pretty committted to that, but if you&rsquo;re intending on playing this one anyway, you can use the armorcrafting options while levelling and getting into endgame, then respec the points to the other picks once you find a good enough lategame chestpiece.</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
