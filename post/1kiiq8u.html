      <label for="mrf6x7x" class="commentText"><p>It&rsquo;s a good effort, and critiquing is based on personal style a bit. Personally, it&rsquo;s a bit busy; such as flashes of images that are so short you can&rsquo;t really see them&hellip;.drag them out a few frames longer and maybe they are identifiable, or strip them out. There&rsquo;s a little bit of fluctuating in style for such a short clip&hellip;I think it&rsquo;s really easy the first few times of doing editing to try a few different things to see what they look like. As time goes on you start developing more intention and reach a better consistentcy. I started at around that age too (although software on people&rsquo;s phones nowadays out does software I had available to me at that time, and render times were horrifically slow).<br>
For the length of the clip, check out the Celtics intro video&hellip;it kind of shows what I mean about intention and style. There&rsquo;s obviously extra clips you can&rsquo;t do without having direct access to players, but it maintains style throughout. To create something similar you have to add subtle filters (think Doloris Claiborne where everything is blue/grayed to show consistent atmosphere) but that&rsquo;s a way you can pull it all together as one piece.<br>
To throw back to the good&hellip;.this is how everyone gets started that has any amount of skill and they are certainly on their way. Keep at it, over time they&rsquo;ll find their style. In some respects they&rsquo;re creating an identity from scratch, and its hard to rind what they like that resonates. They are certainly on the path.</p>
</label>

      </div>
      <label for="mrgb3le" class="commentText"><p>i also do video professionally and don&rsquo;t really have much to add beyond what u/raycyca82 said.</p>

<p>OP, I think the editor has a good sense of musicality on display, but I would have leaned towards less of the cheesey graphics/effects/clips and just put more focus on the full-screen clips being selected and what they were driving the eye towards seeing.  You could have had the same impact by rapid-firing off full-screen clips to that beat without all this busy stuff on top of your main edit.</p>

<p>I will say, though, &ldquo;cheesy&rdquo; can be an aesthetic and it&rsquo;s entirely subjective.  It veers towards comical and if that was the intention, it can be fully acceptable.  There&rsquo;s a genre of over-the-top youtube/tiktok videos that add obnoxious sound effects, ridiculous graphics, and messiness on top that young people in that age group gravitate towards and if that&rsquo;s what they wanted to accomplish, they might have nailed it.  For an older person like myself that strives for clean/polished edits in my professional work, it&rsquo;s very different stylistically from &ldquo;intentional chaos&rdquo;, but I&rsquo;ve definitely seen stuff like this in how influencers edit content for the attention spans of kids.  Just as long as the editor understands why they are doing what they are doing, I think it&rsquo;s totally fine.</p>
</label>
