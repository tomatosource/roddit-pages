

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://v.redd.it/o1v9604lppig1"><p>Payton Pritchard Is Having The Best ISO Season Among Any Player In The Last 10 Years!</p>
</a>
    </h2>

    

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="o4nuoqa" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>duggyfresh88</div>
        <div>6 | an hour ago </div>
      </div>
      <label for="o4nuoqa" class="commentText"><p>Definitely matches the eye test. Playground P/ISO P has a deep bag</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="o4nw8br" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Historical_Use_2629</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="o4nw8br" class="commentText"><p>Feels like last year was the first time we could’ve seen him meaningfully contribute in the playoffs (he did in game 3 Knicks), but this year his role is way bigger and he’s genuinely a way better scorer inside the paint. Excited to see what comes in April!</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="o4nwt2k" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Jdawg_mck1996</div>
        <div>-2 | 44 minutes ago </div>
      </div>
      <label for="o4nwt2k" class="commentText"><p>The kid isn&rsquo;t very athletic. He&rsquo;s not unbelievably quick. He&rsquo;s not even as tall as he&rsquo;s listed, which isn&rsquo;t very tall anyway.</p>

<p>When you get a player like that, you have to learn a million different ways to score. 2 feet, 1 foot, catch and shoot, off the dribble, etc. When you get someone who excels at that, they become impossible to guard, especially with his conditioning.</p>

<p>I had to chase this little fucker around in high school and believe me when I say defending him was more akin to a damn track meet than it was traditional half court defense. So fun to watch but so aggravating to try and stay in front of.</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
