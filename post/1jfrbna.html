      <label for="mit4g0n" class="commentText"><p>From <a href="http://Globe.com" target="_blank">Globe.com</a></p>

<p>By Amin Touri</p>

<p>The Celtics ownership group has agreed to sell the franchise <a href="https://www.bostonglobe.com/2025/03/20/sports/boston-celtics-team-sale-william-chisholm/?p1=Article_Inline_Text_Link" target="_blank">to a consortium led by William Chisholm</a>, managing director and co-founder of Symphony Technology Group, for $6.1 billion.</p>

<p>Chisholm is a Dartmouth grad and a native of Georgetown, Mass. He co-founded the California-based STG in 2002.</p>

<p>Chisholm played soccer at Dartmouth — his son, Will, attended his father’s alma mater and played soccer from the Big Green from 2016-2019 — and graduated in 1991. Chisholm received his MBA from the Wharton School, the acclaimed business school at the University of Pennsylvania.</p>

<p>According to the Globe’s Adam Himmelsbach, Chisholm is a lifelong Celtics fan with an “encyclopedic knowledge” of the team. Though STG is based on Menlo Park, Calif., Chisholm owns a home on Nantucket and intends to buy a home in Boston.</p>

<p>Chisholm’s early business career was centered around early-stage technology investing as well as investment banking before moving into private equity.</p>

<p>Related: <a href="https://www.bostonglobe.com/2025/03/20/sports/boston-celtics-team-sale-william-chisholm/?p1=Article_Inline_Related_Link" target="_blank">Celtics sold to William Chisholm, California private-equity director, for $6.1 billion</a></p>

<p>Before co-founding STG, Chisholm was a co-founder of the Valent Group, a venture capital and risk consulting firm. He also spent time with Boston-based Bain &amp; Company, one of the “Big Three” management consulting companies.</p>

<p>STG manages over <span class="math inline">\(10 billion in total assets. In 2023, STG closed on its seventh (and largest) fund, raising \)</span>4.2 billion.</p>

<p>Chisholm also sits on the board of a number of companies, including Dodge Data, Cadmium, CAI software, and others.</p>

<p>Chisholm’s group would be the 15th to own the Celtics.</p>
