      <label for="mum4eu5" class="commentText"><p>PoB: <a href="https://poe2db.tw/pob/oENNRTCBIO" target="_blank">https://poe2db.tw/pob/oENNRTCBIO</a></p>

<p>Mobalytics Guide: <a href="https://mobalytics.gg/poe-2/profile/c66fbca2-6929-4511-a935-6c25fe5617cf/builds/bd004be3-28b3-4f3b-bc3b-dbc58cfb130f" target="_blank">https://mobalytics.gg/poe-2/profile/c66fbca2-6929-4511-a935-6c25fe5617cf/builds/bd004be3-28b3-4f3b-bc3b-dbc58cfb130f</a></p>

<p>A followup to <a href="https://www.reddit.com/r/PathOfExile2/comments/1jzv6wh/build_guide_t15_fireflower_chrono_with/" target="_blank">my previous Fireflower Chrono build</a>, this is an endgame dual-incinerate chronomancer build that exploits dual ES/life recoup to become almost unkillable while mapping. Capable of hitting 2m+ ignite dps with low investment, and with a ceiling of around 5m dps, it&rsquo;s capable of farming pinnacle bosses with ease.</p>

<p>We scale our damage via ignite aggravation and via critical weakness letting us stack huge amounts of crit damage bonus, the high crit roll rate of incinerate letting us ignore investment in critical strike chance. A huge Flammability Curse and massive fire exposure round out the damage scaling, letting our ignites hit huge levels.</p>

<p>Against pinnacle bosses, Total Incineration and Ball Lightning let you easily reset your ignite, burning down 10s of millions of HP with a single huge ignite.</p>

<p>A secondary Incinerate built around ignite proliferation and corpse explosions, and a spammable blink for mobility, makes for a satisfying and quick mapper that&rsquo;s reminiscent of Essence Drain/Contagion chaos builds.</p>

<p>Soul Bloom and ES bypass let you apply a 1.39 multiplier on your effective ES recoup, with effective recoup rates of over 160% possible without overinvestment on the passive tree. With a total recoup time of 3.2s from The Rapid River and Pliable Flesh, you can recoup incoming hit damage in under 2 seconds, with the remainder being positive recovery that doesn&rsquo;t stop when your life/ES is full.
Dual ES/life recoup protects your life incredibly well; whenever something gets through your energy shield, it&rsquo;s battling a combined recoup rate that&rsquo;s over 260% from your life and ES, making your life very hard to chip down. This makes you incredibly tanky while mapping, only really vulnerable to being burst down fast; something that doesn&rsquo;t happen often with almost 7k combined life and ES.</p>

<p>Temporal Chains and Chrono&rsquo;s Apex of the Moment keep enemies moving and attacking at a snail&rsquo;s pace, letting you burn through maps and soak damage with ease.</p>

<p>The build doesn&rsquo;t rely on any expensive uniques, and can use relatively unwanted armour/ES bases very effectively, letting you gear cheaply. Fire skills are far less meta on this patch, letting you pick up good wands at a steal.
It&rsquo;s off-meta, it&rsquo;s smooth to play, and it&rsquo;s one of the tankiest builds I&rsquo;ve ever played in PoE 1 or 2 while also clearing content smoothly. If you have any questions about it, let me know in the comments!</p>
