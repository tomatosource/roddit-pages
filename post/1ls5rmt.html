

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/r33hey1yv0bf1.jpeg"><p>Chayula Monk Ascendancy Idea - Embracing the Darkness</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/r33hey1yv0bf1.jpeg" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="n1g02at" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Dr_Zevil665</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="n1g02at" class="commentText"><p>Update: after posting, I now realize that gloomform is 100% anti-synergy for this idea… (unless you choose not to go all the way on it) 🤷🏼‍♂️</p>

<p>Still an idea to make chayula monk better and light radius not totally suck though</p>

<p>This is also just a rough idea, but even so, I still think all the pieces are there to make it good.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="n1g2jqc" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>raiunax</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="n1g2jqc" class="commentText"><p>Light radius is already in a bad place in poe2 you won&rsquo;t want to make it worse</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="n1g2u42" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Dr_Zevil665</div>
        <div>1 | 43 minutes ago </div>
      </div>
      <label for="n1g2u42" class="commentText"><p>It would be a scaling chaos DPS buff that incentivizes players to stack light radius… How is that bad or making it worse?</p>

<p>Reversing the effect of light radius would flip the baseline stat of 100% light radius to -100% but still allow the player to see the minimap because the effect is inverted (the darker it is, the more you see) and would add extra chaos dps for every -10% light radius.</p>

<p>Adding a positive integer for light radius in this case is actually a good thing cause the effect is invented. It would be the minor nodes that decrease it that would be bad.</p>

<p>This would give Chonk players a way to literally “embrace the darkness”</p>
</label>
    </div>
  </label>
  
</div>

    
      
<div class="commentAndChildren">
  <input id="n1g3gln" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Ironmeen</div>
        <div>1 | 37 minutes ago </div>
      </div>
      <label for="n1g3gln" class="commentText"><p>Light radius should be revealing monsters on the minimap. Finding the last monsters in infinite open breaches is painful.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="n1g52kf" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Dr_Zevil665</div>
        <div>1 | 20 minutes ago </div>
      </div>
      <label for="n1g52kf" class="commentText"><p>But the chayula monks have fully embraced madness… so the idea is that the darker it is, the more they see. So you would still be able to see/use the minimap with no issue.</p>

<p>Reductions to light radius with an inverted effect would add light radius, which would still be bad and remove the extra chaos DPS.</p>

<p>Increases to light radius with an inverted effect would make it darker, which would reveal more on the minimap and add chaos dps.</p>

<p>In this case, should you choose to take all 4 nodes, it’s the reductions in light radius that would actually be bad.</p>

<p>It’s also a bit non-sensical, but that’s also partially the point. It plays into the chaos idea a bit more</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

    
  </div>
  
</div>

        
      
    </div>
  </body>
</html>
