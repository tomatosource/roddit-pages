.commentAndChildren {

.comment {

.commentText,
.commentText * {
  font-size: 38px;

  color: wheat;

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

      <label for="n54cnha" class="commentText"><p>From Chris Forsberg:</p>

<p>You have to go back to the 2016-17 season to find the last time the Celtics were this devoid of expectations.</p>

<p>That year, the Celtics jumped on the back of Isaiah Thomas, got a boost from the veteran addition of Al Horford, and watched a ragtag collection of role players pile up an Eastern Conference-best 53 wins before advancing to the Eastern Conference Finals.</p>

<p>It remains one of our favorite seasons, jockeying with the 2024 title team in terms of sheer enjoyment.</p>

<p>Thomas blossoming from a Sixth Man into a top-five MVP candidate certainly injected joy, but so did watching how the likes of Jae Crowder and Kelly Olynyk thrived in their roles, all while Brad Stevens pushed the right buttons to get the most from a team that trekked to the East Finals against a peak-of-his-powers LeBron James.</p>

<p>Could the 2025-26 Celtics have a similar glow up?</p>
