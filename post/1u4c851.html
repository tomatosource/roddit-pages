

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://www.reddit.com/gallery/1u4c851"><p>Appreciation post for the Bodach Fight</p>
</a>
    </h2>

    

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="orbyfct" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Worldeditorful</div>
        <div>6 | 6 hours ago </div>
      </div>
      <label for="orbyfct" class="commentText"><p>Yeah, Bodach is my favourite pinnacle so far.</p>

<p>Unfortunately - even as being the toughest boss so far - she still is pretty damn weak compared to juiced content. Cant wait for GGG releasing Uber versions of current pinnacles, so geared up characters can have some goals to achieve in terms of bosses.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">

      </div>
      <label for="orbxvm1" class="commentText"><p>I&rsquo;d agree but boss itself doesnt do anything, i know most boss fights are easy rn, but bodach was on another level of nothing happening for me, the only phase that is remotely dangerous is interphase.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="orc08qg" type="checkbox" checked/>

      <div class="commentHeader">
        <div>Federal_Tip_4660</div>
        <div>7 | 6 hours ago </div>
      </div>
      <label for="orc08qg" class="commentText"><p>He most certainly does if you don&rsquo;t insta phase him (was watching a friend on ice shot deadeye, which can&rsquo;t freeze the boss in phase 1) he died and saw multiple things I didn&rsquo;t with my character.</p>

<p>As is always with any boss in PoE2, good offense is the best defense.</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

        
      
        
          
<div class="commentAndChildren">

      <div class="commentHeader">
        <div>LouKthu</div>
        <div>2 | 5 hours ago </div>
      </div>
      <label for="orc4wj8" class="commentText"><p>As a huge dark souls fan, this has got to be an ode to high lord wolnir and it&rsquo;s cool as fuck. Def my favorite boss fight when it comes to how they executed it.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="orc6ohl" type="checkbox" checked/>

      <div class="commentHeader">
        <div>ExpAdvent</div>
        <div>1 | 5 hours ago </div>
      </div>
      <label for="orc6ohl" class="commentText"><p>Also this boss reminded me the beast boss from the first hellblade. Good stuff</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="orcw1ds" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Marsdreamer</div>
        <div>1 | 2 hours ago </div>
      </div>
      <label for="orcw1ds" class="commentText"><p>One of the most cinematically cool ARPG fights I&rsquo;ve ever done. Absolute hats off to GGG for the design on this one.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="ord0aay" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Boldee</div>
        <div>0 | an hour ago </div>
      </div>
      <label for="ord0aay" class="commentText"><p>It&rsquo;s cool, I just really don&rsquo;t understand why it has to be so damn loud? Everything in my game is on a good volume, but when the Bodach speaks it rips my eardrums out every single time.</p>
</label>
    </div>
  </label>
  
</div>

</html>
