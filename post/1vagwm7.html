    <style>
       * {

  padding: 0;

*,

html {

}

}

input[type="checkbox"] {

blockquote {

.subName {

.postLink:visited {

.postHeader {

.commentAndChildren {

.commentText,

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {

.commentAndChildren label .comment .commentText {

    <h2>
      <a class="postTitle" href="/r/PcBuild/comments/1vagw4j/5800x3d_rx_9060_xt_16gb_8gb_ram_is_upgrading_to/"><p>5800X3D + RX 9060 XT 16GB + 8GB RAM - Is upgrading to 32GB worth it for PoE2 juiced maps?</p>
</a>
    </h2>

    

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="p0liu8w" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Weary-Magician9283</div>
        <div>1 | 38 minutes ago </div>
      </div>
      <label for="p0liu8w" class="commentText"><p>A single memory stick has a pretty hefty performance loss in a lot of games and can cause frametime pacing issues for a couple as well. 8GB on top of that takes the cake, but it&rsquo;s theoretically manageable however I advice against it. It&rsquo;s insanely lopsided with your build. I understand the memory market isn&rsquo;t exactly great right now though. (Loss can be up to around 30%, and you can have more frequent moments of choppy framerate.)</p>

<p>I would at least get another 8GB stick, Ideally get the same one as you got, but one at the same speed or faster, and same latency or shorter, should be fine.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="p0lk03e" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>ImChimkenNuggets [OP]</div>
        <div>1 | 31 minutes ago </div>
      </div>
      <label for="p0lk03e" class="commentText"><p>Thanks! Just wanted to ask, if I buy 2×8GB RAM with the same MHz, do you think I&rsquo;ll actually get more FPS in PoE2, or will it mostly just make the game feel smoother? Sorry if it&rsquo;s a dumb question, I&rsquo;m still learning about PC hardware.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="p0ln5c0" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>SelectionOpening5445</div>
        <div>1 | 11 minutes ago </div>
      </div>
      <label for="p0ln5c0" class="commentText"><p>You&rsquo;ll want two 16s, (or 8s if you can&rsquo;t afford it). When slotting in a lot of motherboards, for whatever reason, using more than 2 slots for ram doesn&rsquo;t give as much of an upgrade as you&rsquo;d like.</p>
</label>
    </div>
  </label>
  
</div>

    
      
<div class="commentAndChildren">
  <input id="p0lo06j" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Tsunamie101</div>
        <div>1 | 6 minutes ago </div>
      </div>
      <label for="p0lo06j" class="commentText"><p>Even outside of PoE 2, having 16gb is somewhat of a minimum for gaming nowadays. That said, i haven&rsquo;t seen PoE 2 use more than 11gb of ram yet, so 16gb should be fine for PoE 2 specifically.<br>
You&rsquo;d probably see some performance increase simply by having two ram sticks and by having some more overhead, though i couldn&rsquo;t say how large said increase would be.</p>

<p>Hope you find some good ones regardless, ram prices are absolutely criminal atm.</p>
</label>
    </div>
  </label>
