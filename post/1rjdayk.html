

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://www.reddit.com/gallery/1rjdayk"><p>POB Oracle Druid help</p>
</a>
    </h2>

    

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="o8cq955" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Chargebladedw</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="o8cq955" class="commentText"><p>The Jade talisman has a way, way higher physical damage range. The low end damage on it is close to the top end of the Wildwood. So much so the extra crit and attack speed on Wildwood doesn&rsquo;t keep up on your build I guess?</p>

<p>min plus max dmg, divide by two, multiply by attacks per sec, there&rsquo;s the weapon&rsquo;s dps</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="o8crz8j" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Medvenger21</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="o8crz8j" class="commentText"><p>Yeah see that’s what I thought but the wildwood showed higher dps while equipped</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="o8cthsm" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Chargebladedw</div>
        <div>1 | 41 minutes ago </div>
      </div>
      <label for="o8cthsm" class="commentText"><p>I&rsquo;m confused. Your pob there says Wildwood is 58% weaker than Jade right?</p>

<p>In game skill tooltip damage doesn&rsquo;t take a bunch of stuff into account, I&rsquo;d just trust pob</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="o8cxbgz" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Medvenger21</div>
        <div>1 | 14 minutes ago </div>
      </div>
      <label for="o8cxbgz" class="commentText"><p>Yeah it does. Just was wondering why dps from in game skill tab was wildly different</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="o8cxk6l" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Chargebladedw</div>
        <div>1 | 13 minutes ago </div>
      </div>
      <label for="o8cxk6l" class="commentText"><p>In-game dps doesn&rsquo;t take into account anything with a condition. Like, bonus damage if you&rsquo;ve hit recently, increase damage for ailments on target, debuffs and curses etc etc. That&rsquo;s why you want to set up pob to have your conditionals active</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

</div>

</div>

</div>

        
      
    </div>
  </body>
</html>
