

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/8pzr28scpvqf1.png"><p>Raw drop as per the GGG vision. Is there any way to save this and remove accuracy?</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/8pzr28scpvqf1.png" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="nfqjaf1" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>zeekim</div>
        <div>6 | an hour ago </div>
      </div>
      <label for="nfqjaf1" class="commentText"><p>Omen of whittling should do the trick. Not sure if it&rsquo;s worth though, mods are kinda mid.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="nfqjcpy" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Missbunocu08</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="nfqjcpy" class="commentText"><p>Tried it and it targets the t3 phys as it&rsquo;s lower level mod.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="nfqo0qx" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>manchagnu</div>
        <div>1 | 32 minutes ago </div>
      </div>
      <label for="nfqo0qx" class="commentText"><p>Yeah whittling will change the lower level affixes, and unfortunately accuracy is the highest level sitting at 82 along with %phys dmg.  it is a terrible when crafting gear.</p>

<p>here is a link that should help you understand the levels each affix has <a href="https://poe2db.tw/us/Bows#ModifiersCalc" target="_blank">https://poe2db.tw/us/Bows#ModifiersCalc</a></p>

<p>Your best bet is to desecrate that prefix.  Make sure you use a omen of sinistral necromancy.  You would improve your chance of desecrating if you fractured either of the phys prefixes; it brings your odds to <sup>50</sup>&frasl;<sub>5</sub> that you desecrate the right item.</p>

<p>good luck!</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

    
  </div>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nfqjhcm" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Exoskeleton78</div>
        <div>5 | an hour ago </div>
      </div>
      <label for="nfqjhcm" class="commentText"><p>Prefix desecrate then if fail to hit accuracy, try whittling before reveal</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="nfqkoyy" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Missbunocu08</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="nfqkoyy" class="commentText"><p>That might be the way.</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

        
      
    </div>
  </body>
</html>
