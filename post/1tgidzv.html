

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://www.reddit.com/r/PathOfExile2/comments/1tgidzv/kalandras_portal/"><p>Kalandra&rsquo;s Portal?</p>
</a>
    </h2>

    
    <div class="selfPostContainer">
      <p>PoE1&rsquo;s logo is Kalandra&rsquo;s Mirror. PoE2&rsquo;s logo is still same object but mirror is no longer present making it a portal or a window. Do you think it has any significance for the lore?</p>

    </div>
    

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="omgjlfz" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Erradium</div>
        <div>4 | an hour ago </div>
      </div>
      <label for="omgjlfz" class="commentText"><p>In the Kalandra map in the endgame, you can see a broken mirror and Kalandra&rsquo;s bird body hanging dead, and presumably, she escaped her prison in the lake. The effect of this on the story remain to be seen. But that&rsquo;s the only guess I have as to why the logo appears hollow.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="omgmdlv" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>chimericWilder</div>
        <div>1 | 40 minutes ago </div>
      </div>
      <label for="omgmdlv" class="commentText"><p>I believe that Kalandra masterminded the entire series of events which would lead to Oriana deploying the Beast and fumbling it to cause a Cataclysm. Kalandra seems to believe that it will shatter her prison&hellip; and lo and behold, she is absent from her Lake by the time we get to the endgame.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="omgnwum" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Erradium</div>
        <div>1 | 29 minutes ago </div>
      </div>
      <label for="omgnwum" class="commentText"><p>But what stopped her leaving in previous cycles of Time, or in the Vaal Cataclysm?</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

    
  </div>
  
</div>

        
      
    </div>
  </body>
</html>
