

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/fb567wh84qsf1.png"><p>Anfernee Simons&rsquo; No. 1 goal as a Celtic?</p>

<p>&ldquo;To impact winning.&rdquo;</p>

<p>Our new high-scoring guard elaborates on his excitement in coming to Boston ⤵️</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/fb567wh84qsf1.png" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="nhee3ag" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>fearofaflatplanet | - Plan J -</div>
        <div>6 | 10 hours ago </div>
      </div>
      <label for="nhee3ag" class="commentText"><p>I for one am excited to see what Simons can do with the change of scenery in a contract year. He’s got enormous incentive to change the narrative on defense. He’s never played with anyone as good as JB or DWhite let alone a healthy Tatum. 
Obv we’ll see but I’d rather have him than a washed Jrue (not washed washed but def at the elite level washed)</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="nhejuao" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>B_Sox | Len Bias</div>
        <div>4 | 9 hours ago </div>
      </div>
      <label for="nhejuao" class="commentText"><p>Jrue had a massive dropoff on both ends of the court from the championship season to last year. 8% worse from 3, 4% from the field, less off dribble creation, and noticeably worse defensively.</p>

<p>Simons is just entering his prime years and seemingly has a chip on his shoulder to prove he&rsquo;s better than what some folks seem to think. He&rsquo;s a perfect addition to this Tatum-less version of the team, and IMO would slot in very nicely as a 3rd/4th option when he returns.</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nhgylv2" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Eisenhorn76 | 11-1 is far superior to 4-6 in the Finals</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="nhgylv2" class="commentText"><p>I get excited whenever I read new Celtics players embrace these Brad-isms. That means they’ve bought in. Excited to see this team play.</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
