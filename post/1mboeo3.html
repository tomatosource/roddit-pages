

<html>

    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>

<div class="commentAndChildren">

    <div class="comment">
      <div class="commentHeader">
        <div>75inchTVcasual</div>
        <div>1 | 37 minutes ago </div>
      </div>
      <label for="n5nol1n" class="commentText"><p>Not worth it for a lvl80 base with the suffixes you have on there.</p>

<p>You risk rolling off the res and then having to gamble T1 Crit Chance, which is a low ilvl mod.  It&rsquo;s arguably the most valuable suffix on a helm, so I&rsquo;d keep as is and sell.  You can maybe divine the ES mods a bit to get it to 550ish with a ES rune in there.</p>

<p>Make sure you&rsquo;re filtering for 520ish+ min. ES (on the left side of the page) when comparing prices.  I&rsquo;d say it&rsquo;s worth quiet a bit more than ~20 divs even with mid resist rolls.</p>
</label>
    </div>
  </label>

      </div>
      <label for="n5np7av" class="commentText"><p>Oh wicked thank you! I&rsquo;ll definitely keep that in mind and I may div it then. Honestly havent gotten to an item where I wanted to div the mods yet so that&rsquo;s sweet!</p>
</label>
    </div>
  </label>

        <div>1 | 32 minutes ago </div>
      </div>
      <label for="n5npizr" class="commentText"><p>Ya, it&rsquo;s worth it for helm prefixes as the roll range isn&rsquo;t crazy (with hybrid only having 4 increments) and will get you past certain cutoff filters as there&rsquo;s no way to currently search for T1s of the mods individually.</p>

<p>Edit - Also, make sure you also search for uncorrupted helms.  This has the potential to hit ~600 ES with a second socket, so you want to price in that option.</p>

      <label for="n5nrbv4" class="commentText"><p>It depends on what you’re after when picking the ilvl of the base.</p>

<p>If you want crit chance on there with 2 max resists or just 3 max resists and potentially Int, you want a 82 base.</p>

<p>The only time you want an 81 base is if going for chaos res / int as those are both 81 and can’t brick (if crit is fractured, for example). But that craft is so expensive that you’re better off getting lucky with a 82 base.</p>
