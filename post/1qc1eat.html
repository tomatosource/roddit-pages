        <div>2 | 7 hours ago </div>
      </div>
      <label for="nzew51e" class="commentText"><p>Exalt slam doesn’t look to be in your favor. I’m not a super well versed crafter but I’m thinking maybe: omen of light and annul the mana, then dextral crystallization and essence of the abyss as the + skills cannot be removed to get a better suffix pool to choose from with a jawbone (hopefully crit or something), then perfect slam and hope for gain damage prefix and not mana. Followed by another for a yolo on the last suffix. Not too sure how well that would work but slamming both suffixes sounds like light radius and reduced attribute requirements waiting to happen.</p>

      <label for="nzf5gi0" class="commentText"><p>Annul down to 2 mods, chaos spam for any decent t1 suffix(cast speed, ceit chance or multi), perfect ex the last suffix. Desecrate mana and double slam prefix until decent mods( which there are many)</p>

<div class="commentAndChildren">
  <input id="nzfb5sj" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>WhichWolfEats | customflair</div>
        <div>1 | 6 hours ago </div>
      </div>
      <label for="nzfb5sj" class="commentText"><p>Well I’d use my desecration for suffix. Max mana is a brick so def shouldn’t be your desecration. I’ve found that staffs with full suffix +skill, crit chance, cast speed will almost always sell, even with mana prefix. Anything without that combination of suffix won’t sell. So I start all mine from blue +6-7 and add t3 crit chance with essence then I desecrate for cast speed. When adding my prefix I always assume I’ll hit mana so I use greater ex til I see mana then perfect for the rest for 1 more shot at not mana if it rolls lower tier by using a whittle on it.</p>

<p>But I found this league that you can’t chase perfection without blowing your bank. The trick to churn out quantity were 2:10 hit gg rolls instead of mana. Once you get into omen of light cycling, whittles, and anul omens you pretty much need to roll gg to make anything back. I’m making about 3k divs a day churning out staffs and Wands exactly like I explained above. I also have tons of decent fails I usually give away in global.</p>
</label>
