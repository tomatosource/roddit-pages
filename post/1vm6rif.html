.commentList {

.commentAndChildren > input:checked ~ .commentList {

.commentAndChildren label .comment .commentText {
  white-space: nowrap;

}

.commentAndChildren input:checked ~ label .comment .commentText {

  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;

.selfPostContainer * {

.selfPostImage {

.streamableContainer {

  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    <h2>
      <a class="postTitle" href="https://youtu.be/Kl_gcuNHM2s?si=RRFxkfFdUZMQkKvP"><p>The Gaelic roots of Path Of Exile 2</p>
</a>
    </h2>

    

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="p371zfb" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>BendicantMias [OP]</div>
        <div>4 | 4 hours ago </div>
      </div>
      <label for="p371zfb" class="commentText"><p>I have to say that I never expected Ritual to come so far, certainly not lore-wise. When Ritual was first added to PoE 1 all the way back in patch 3.13, it honestly just seemed like another throwaway &lsquo;<em>kill monsters in a circle</em>&rsquo; league mechanic, with a cute bit of decision making after for your rewards. This impression was made worse when it was followed up by Ultimatum league right after, which did the same thing with more intensity, and the choice shifted to the modifiers on the combat encounter itself rather than the rewards. To me both seemed more interesting only in terms of what items they added to the game rather than their mechanics or story.</p>

<p>While Ritual wasn&rsquo;t as barebones as, say, Sentinel league, it still didn&rsquo;t seem a very promising foundation upon which to build the games&rsquo; world lore. Well, now look at it! Ritual is now in serious contention for having the best lore of any the games&rsquo; league content, and delivered with such a taste for style and presentation too. As the vid explains, the nature of the Nameless and the Bodach are not just drawn from real world mythology, but also carefully interleaved into its items and the structure of its questline. The Bodach also might not be the hardest fight in the game, but by the Catha is he the most atmospheric!</p>

<p>I also really love how they&rsquo;ve finally started to bring the many disparate dangling threads of PoE from over a decade of leagues together at last. The Wildwood isn&rsquo;t just tied to Ritual league after, but also to the later PoE 1 Affliction league. Although knowing that connection isn&rsquo;t new, it&rsquo;s only in PoE 2 that it&rsquo;s properly formalized.</p>

<p>People argue over which PoE is the better to play, but I feel in terms of which is the more epic experience, the more cohesive lore tie-ins and delivery and its incorporation into the nature of the quests themselves, PoE 2 definitely stands above its predecessor.</p>
</label>
    </div>
  </label>

      <label for="p37krg1" class="commentText"><p>For me, delirium has the most interesting lore. I genuinely think the voice has the most potential to be setup as a huge endgame story ender boss since he plays with your mind and being sane/insane is a crucial part of the atlas storyline in 1. Will be interesting to see what hes up to now that we accidentally freed him from that cage in act 4.</p>
