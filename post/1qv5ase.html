    <style>
       * {

  padding: 0;

}

*,

}

html {

body {

}

}

.subName {

.postList {

.postLink {
  border-bottom: 1px solid #555;

  color: wheat;

}

.postLink:visited {

}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;

.commentList {

.commentAndChildren {

.comment {

  border-bottom: 1px solid #555;
}

.commentText,

.postTitle {
  text-decoration: none;
  color: #c39429;

.commentAndChildren > .commentList {

}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;

  overflow: visible;
}

    <h2>
      <a class="postTitle" href="https://i.redd.it/hs2aktysnchg1.png"><p>How to proceed with this craft? Also is hybrid phys better or gain dmg as extra phys?</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/hs2aktysnchg1.png" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="o3f32d3" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>SuViSaK</div>
        <div>1 | 5 hours ago </div>
      </div>
      <label for="o3f32d3" class="commentText"><p>Didnt you already post this in the question channel?</p>

<p>Extra.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="o3f6xp9" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Morbu</div>
        <div>1 | 4 hours ago </div>
      </div>
      <label for="o3f6xp9" class="commentText"><p>Hybrid phys is better. A quick way to tell is to see what mirror crafters put on their weapons. They always go for triple phys prefixes. You can also just POB it. That being said, phys as extra is deterministic to get, so most people just go with that.</p>

<p>The way that I would proceed is to use an omen of dextral exaltation, omen of greater exaltation, and a perfect exalt. This will give two suffixes. You use a perfect exalt because you could get something good. Then use Omen of Dextral Crystallisation and Perfect Essence of Abrasion to add phys as extra.</p>

<p>Once prefixes are done, you use Omen of Dextral Crystallisation with Perfect Essence of Haste and Perfect Essence of Battle. This will give Onslaught and +attack levels. Then desecrate your last suffix and hope for something good. Best case would be +crit chance, but you can go with whatever and reroll later if you want.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="o3fisph" type="checkbox" checked/>

      <div class="commentHeader">

        <div>1 | 3 hours ago </div>
      </div>
      <label for="o3fisph" class="commentText"><p>how would I go about it If I tried for a hybrid phys? I still have 6000 divs and some items I can sell.</p>
</label>

  </label>
  
</div>

    
  </div>
  
</div>

        <div>nbriles2000</div>
        <div>1 | 4 hours ago </div>
      </div>
      <label for="o3f9gy2" class="commentText"><p>Hybrid is better, but unless you&rsquo;re intending to go for a mirror tier craft and gained will carry you through all content just as well</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="o3fxhhc" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Eaklony</div>
        <div>1 | 2 hours ago </div>
      </div>
      <label for="o3fxhhc" class="commentText"><p>No reason to go for extra physics unless you are playing pure phys build on spear as it won’t be converted (is there even one?). Go for hybrid if you don’t need this spear to improve and just want to craft a perfect spear this league and willing to continue farming to sink more currency on this if rng is bad. If you want an improvement desperately just go for cheap essence crafting and you can always resume later.</p>
</label>
