

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://www.reddit.com/gallery/1vjj30z"><p>I Messed Up. How Do I Reset Temple??</p>
</a>
    </h2>

    

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="p2lrlgs" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Weissekaiser</div>
        <div>1 | 6 minutes ago </div>
      </div>
      <label for="p2lrlgs" class="commentText"><p>I dont quite understand whats wrong with your setup. you can just add the garrison aand spymaster to connect to architect and then do the architect to add restricted rooms at the edge of chamber</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="p2ls05z" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>MrRazorlike</div>
        <div>1 | 3 minutes ago </div>
      </div>
      <label for="p2ls05z" class="commentText"><p>The next time you clear the Architect it&rsquo;s going to move anyway. You&rsquo;re worrying too much, what you have now is perfectly fine.</p>

<p>The specials rooms on the side not being actually on the edge is also totally irrelevant</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="p2ls5tg" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>gennciiq</div>
        <div>1 | a minute ago </div>
      </div>
      <label for="p2ls5tg" class="commentText"><p>You didnt mess up, for how few rooms you have you van at least rush Atziri once. Your priority should be to rush Atziri whenever you can and beat the Architect every try (if you can).</p>

<p>The whole strategy is rushing atziri so for this run just connext the toyal access chamber and the Architect and do both. The point of beating the architect is to place the rooms on the sides so you can block them.</p>

<p>Also, before placing any rooms inspect it first and check which rooms it upgrades and by which rooms it gets upgraded itself. Note that only those rooms can be connected to the room you want to place, no others. Then place all available rooms as bait rooms, try to form as many &ldquo;bait legs&rdquo; as possible to lower the chance of the main road being destabilized</p>

<p>I hope this makes sense. Temple takes time to set up, but just beat Atziri and the Architect as many times as you can until you fill the sides.</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
