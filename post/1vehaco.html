

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/b0i5mlhml6hh1.png"><p>I bricked my Temple somehow - Cannot place pathways - Any help?</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/b0i5mlhml6hh1.png" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="p1gx89l" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Serious-Mistake-4171</div>
        <div>4 | 12 hours ago </div>
      </div>
      <label for="p1gx89l" class="commentText"><p>Happens to everyone. You either connect rooms, like armouries, garrisons, etc or you let the whole thing destabilise back to the starting area. It will eventually bug out again if you do destabilise it.</p>

<p>😒</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="p1gzmz7" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Designer_Throat_8125</div>
        <div>3 | 12 hours ago </div>
      </div>
      <label for="p1gzmz7" class="commentText"><p>When you have the pathway bug that far down you just gotta bite the bullet and let it destabilize or it&rsquo;s too much effort to atziri rush and it&rsquo;s less reliable without the main highway.</p>

<p>To avoid the bug only use locks near the entrance and try not to place restricted rooms directly connected to another room you&rsquo;re completing in that current temple. Sometimes if the room that the restricted room was placed next to destabilizes it&rsquo;ll turn into a fake path and sometimes that propagates to your main highway which is really bad as you can see.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="p1gzr4w" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Kaine_X</div>
        <div>1 | 12 hours ago </div>
      </div>
      <label for="p1gzr4w" class="commentText"><p>You can place a commander, spymaster, armory, or prosthetic research lab on that garrison to the right of your trouble tile (the one that won&rsquo;t connect anything), and it should let you reach your architect at least. Just run your architect a few times until he clears that tile for you and you should be able to build a new path straight up to Atziri.</p>

<p>You can also use that altar of sacrifice (place it somewhere very early in your chain) to sacrifice a room or two in the left and right chains that are dependent on your bugged tile to speed up this process.</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
