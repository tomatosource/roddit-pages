      <label for="nx8n4a8" class="commentText"><p>As to your question what to do with THIS weapon you are showcasing.</p>

<p>That weapon has a bad rolls. You don&rsquo;t craft by polishing trash.</p>

<p>I would use echo and reveal the prefix. Get flat phys. If you don&rsquo;t get flat phys, this weapon is pretty much ruined. You can try to save it by one or two chaos orbs, but the odds are bad.</p>

<p>After that go for suffix, if the weapon turned decent. Use greater or simple exalt. If you hit bad thing, and you probably do, because there is 3109239 bad suffixes, you can try to use essence for onslaught. It is 33% chance it will remove your +3 tho.</p>

<p>This base is not worth omen of light, or any more pricy currency. Blue or white weapon you find on the ground will be better base than this.</p>

      <label for="nx8mhhr" class="commentText"><p>start by opening this table, <a href="https://poe2db.tw/us/Crossbows#ModifiersCalc" target="_blank">https://poe2db.tw/us/Crossbows#ModifiersCalc</a> (always start by that when crafting)</p>

<p>you will figure out few interesting things, such as, there is a lot of bad suffixes for weapon, but quite decent prefixes for weapon.</p>

<p>While the phys damage weapon has possibly the highest damage outcome, it only applies if you have a reasonably high rolls. For lower rolls, elemental flat damage or extra damage might be better. Also you should notice rolling high % phys is the lowest chance compared to other mods.</p>

<p>Crafting, if you insist on phys weapon,</p>

<ol>
<li>you would start by looking at white and blue bases and using greater transmute/augment on those. Nice suffix would be nice, but not mandatory. Trying to get decent % phys roll, such as T4 or T3.</li>
<li>Then you immidiately have options, either use greater essence for attack speed (risky), or greater essence for flat physical damage, to ensure your weapon will come out useful</li>
<li>Continue by filling the suffix with either greater exalted (or exalted if you do not have a choice) or desecrating modifier (DO NOT REVEAL). Depends on previous step, do it once or twice.</li>
<li>The reason to do that is to have full suffixes. Because once they are full, if perfect essence of battle is used, or the one for onslaught, it must remove the suffix, leaving the prefixes same. Remember, if one or both of these essences are used, one or two suffixes will be removed anyway. And that is why suffixes do not matter that much.</li>
<li>The last step is dependent on how the weapon turned out so far.

<ol>
<li>pretty much any weapon need attack speed, which is suffix. Now if you have that suffix now, you dont need to worry and can desecrate prefix. Preferably using the echo for desecration. Fish for good damage mod.</li>
<li>If you do not have attack speed on a weapon, but desecration modifier has survived the essence of battle, try to get attack speed there. Again, you can use echo. Then the prefix will be blind smash of exalt or greater exalt.</li>
</ol></li>
<li>Extra step if the weapon prefix didnt turn good. While you do SSF, you will have to do multiple attempts. Some weapons turn good, some turn worse. Assuming you have one weapon already and you craft other weapon which is worse now, you can always try to gamble it. If it has one bad prefix, you can try perfect essence for extra damage. If you hit a bad prefix, you can turn the weapon good. Similar with chaos orb. Or desecrate. Or essence of battle or for onslaught.</li>
</ol>
</label>
