

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://youtu.be/nzDYHIlWtb8"><p>I did the funny - a bunch of wisps on an Amanamu rare</p>
</a>
    </h2>

    

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="o4ghsca" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>noza2003</div>
        <div>14 | a day ago </div>
      </div>
      <label for="o4ghsca" class="commentText"><p>It&rsquo;s satisfying to load them up with multiple wisps but the juice just isn&rsquo;t worth the squeeze. You have to spend a good 5-10 min clearing, making sure you <em>don&rsquo;t</em> kill the Rare you want to juice, then run back and get the wisps.</p>

<p>I&rsquo;d rather move onto next activity.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="o4h3gmc" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>TeamLaw</div>
        <div>2 | a day ago </div>
      </div>
      <label for="o4h3gmc" class="commentText"><p>Yeah. I took the atlas nodes for wisps but just skip the content most of the time now.</p>
</label>
    </div>
  </label>
  
</div>

    
      
<div class="commentAndChildren">
  <input id="o4lezu5" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>buttflakes27</div>
        <div>2 | 7 hours ago </div>
      </div>
      <label for="o4lezu5" class="commentText"><p>I wish they would change the wisp mechanic entirely because chasing them sucks. Just infect random rares in a map or something. Terribly tedious to follow this glowing ball around that I will eventually outpace and have to stop and wait for just&hellip;. AAAAAAGH</p>
</label>
    </div>
  </label>
  
</div>

</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="o4h0qki" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Aracadian</div>
        <div>1 | a day ago </div>
      </div>
      <label for="o4h0qki" class="commentText"><p>Is there any way to get omen of light , without having to drag the boss out of the cloud?, for me its either they are always in the cloud when i try to kill them after dragging for solid 2-3 mins or they just die before they are even out.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="o4h846d" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>CallMehBigPapa</div>
        <div>2 | a day ago </div>
      </div>
      <label for="o4h846d" class="commentText"><p>Key is to try and burst them in those 2-4 seconds as you are kiting them out of the cloud. You should note that they will follow you in a straight line and that it takes a good while for the smoke to teleport back on them if they just put it down. So just have them follow you after they freshly place down the smoke and you should have a good window to burst them down</p>
</label>
    </div>
  </label>
  
</div>

</div>

        <div>Thymeafterthyme10</div>
        <div>1 | a day ago </div>
      </div>
      <label for="o4hmvbz" class="commentText"><p>Try with spring hare wisp and omen of the hunt, make sure at least 2 amamanu void rares so they can bounce.</p>

  </label>
  
</div>

      </div>
