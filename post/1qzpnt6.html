<div class="commentAndChildren">

    <div class="comment">
      <div class="commentHeader">
        <div>GoatSlow7673</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="o4d60q5" class="commentText"><p>It&rsquo;s not a bug, it&rsquo;s intentional. Once you reach a certain number of rooms in your temple, these things start happening. My temple didn&rsquo;t have these problems until I reached the Golem area. At that point, it randomly started happening that when I left, the temple would close on its own without me having to do everything, just because I went out to use medallions to expand rooms, to level up rooms, or to secure them with locks when they weren&rsquo;t locked when I entered.</p>

<p>I call it the moment when GGG decides it wants its players to abandon the game and go to another one, so they don&rsquo;t need staff in this one to fix things on the fly. Besides, they can&rsquo;t find any more problems to add to the ever-growing roadmap of pending fixes, which at this rate will be longer than the workload for a new league patch. It&rsquo;s sad, but many problems have been around for several leagues and remain unfixed. Even something as simple as the choices in acts should be modifiable, but they aren&rsquo;t. A fully equipped character might not be able to find a replacement for a choice that seems minor, but in the end, it could be the one that makes everything work for damage and survivability.</p>

<p>And let&rsquo;s not even talk about how boring it is to create secondary characters when you&rsquo;re not interested in playing the campaign again. Would it be so difficult for a character to advance to Ziggurat and only be forced to make certain choices with Alva from the campaign mode? This would allow players who create one or two characters to choose to create several to try different builds, and the change in act choices would allow for better adaptation of created characters to new builds. These are several details that would make many players spend money to expand the character limit to try even two characters whose only change is their ancestry, allowing them to explore more options.</p>
</label>
