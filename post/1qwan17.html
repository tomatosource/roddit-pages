

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/d340v5rhhlhg1.png"><p>This feels wrong</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/d340v5rhhlhg1.png" />

    <div class="commentList">
      
        
          
<div class="commentAndChildren">

    <div class="comment">

      </div>
      <label for="o3npx8x" class="commentText"><p>When the jewels give more dmg, u dont need those nodes but more jewel. Simple math</p>

<div class="commentAndChildren">

      <div class="commentHeader">
        <div>yhcjo1992</div>
        <div>1 | 7 minutes ago </div>
      </div>
      <label for="o3nqgdw" class="commentText"><p>I feel like the passive tree doesn’t provide enough benefit in super endgame. And mainly because there isn’t much that scales well to endgame except for skill levels for minions and spells and crit.
So many of my builds always take the same nodes. There’s no real variety because most nodes don’t provide enough power boost per points it takes to get there.
Like %increase damage nodes are practically useless in fully kitted characters.
Good solution would be to retune the other scaling methods (ele/chaos dmg, melee/proj dmg) to be more meaningful, making them more attractive in endgame scaling, instead of crit being the only end game scaling options for lotta builds.</p>

<p>That being said, most contents out now can be comfortably cleared even with these “poor” scaling builds so at some point it’s kinda myte</p>
</label>
    </div>
  </label>
  
</div>

      </div>
      <label for="o3npy7o" class="commentText"><p>I haven&rsquo;t played much poe2 since it first launched, but it&rsquo;s nice to see how much it&rsquo;s taking after poe1.</p>
</label>
    </div>
  </label>
  
</div>

</html>
