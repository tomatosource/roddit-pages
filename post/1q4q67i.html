      <label for="nxu9w9k" class="commentText"><p>From Chris Forsberg:</p>

<p>Fresh off matching his career high in scoring with <a href="https://www.nbcsportsboston.com/nba/boston-celtics/live-updates-clippers-highlights-jaylen-brown-kawhi-leonard/757691/" target="_blank">a 50-point outburst against the Los Angeles Clippers</a> on Saturday night, Jaylen Brown boldly declared his belief that he is the best two-way player in the world.</p>

<p>Brown is now averaging 30.1 points per game for the Boston Celtics this season, ranking fourth in the NBA in scoring. Few would quibble with any suggestion that he&rsquo;s among the very elite at scoring the basketball. </p>

<p>And with all due respect to the 500 NBA players lingering down the list of the league’s leading scorers (and to all the recreational hoopers worldwide still waiting for their call-ups), it seems fair to suggest that Brown simply needs to be the best defender among the NBA’s other top bucket-getters to lay claim to the &ldquo;best two-way player in the world&rdquo; championship belt.</p>

<p>For the purposes of this exercise, we’re narrowing our field to Brown’s chief competition for another lofty NBA honor: Most Valuable Player. We’re crunching his defensive metrics compared to Oklahoma City’s Shai Gilgeous-Alexander, the Los Angeles Lakers’ Luka Doncic, Detroit’s Cade Cunningham, New York’s Jalen Brunson, and Philadelphia’s Tyrese Maxey. </p>

<p>Squeezed out here are Giannis Antetokounmpo, Nikola Jokic, and Victor Wembanyama, who are all uncertain to reach the NBA’s 65-game threshold for award voting due to injuries. All three could make strong cases as the best two-way players in the world based on their overall impacts, but the top two-way player has to hit 65 games for this debate.</p>

<p>The case for Brown centers on the caliber of opponent he frequently defends. His declaration came Saturday night after he logged a game-high in matchup time against a previously white-hot Kawhi Leonard, and limited him to nine points on 3-of-7 shooting over seven minutes of matchup time. </p>

<p>Over at the stat-crunching site BBall Index, they group players into six tiers based on usage to monitor how much time players spend defending various tiers of talent. A high usage rate doesn’t immediately confirm superstar talent, but <a href="https://www.nba.com/stats/players/usage?CF=GP*GE*20" target="_blank">if you look at this year’s usage leaders</a>, there are very few outliers among the stars who dominate the top of the list. </p>

<p>Brown not only logs the highest percentage of Tier 1 matchups compared to our field, but nearly 57 percent of his total defensive time is spent against players in Tiers 1-3. By comparison, that number sits just south of 36 percent for someone like Brunson (the worst among our candidates).</p>
