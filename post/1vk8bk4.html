

<html>

    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>

    <h2>
      <a class="postTitle" href="https://i.redd.it/lvhuil7gigih1.png"><p>Misclicked a Neural catalyst onto my 40% caster amulet — lost the +4 spell skills. Sanity-check my road back to 40%?</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/lvhuil7gigih1.png" />

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="p2reubs" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Hylus9029</div>
        <div>1 | 10 minutes ago </div>
      </div>
      <label for="p2reubs" class="commentText"><p>Infusers will not work. They cap at an additional 10% above the normal cap. In your case, that&rsquo;s 30%, and you need 34% for +4 I believe.</p>

<p>As for your other question, going all the way to 30 is I believe a 10% chance overall. Somewhere in that ballpark. Slightly higher if you don&rsquo;t mind the corruption on the very last usage. Obviously won&rsquo;t help you now, but future reference. When it does corrupt, it&rsquo;s a safe corrupt. Will not touch anything. Just adds the corrupt tag.</p>

<p>To get it back to 40 would be difficult. You&rsquo;d have to use an essence of breach and that&rsquo;s a lot of work. You&rsquo;re better off buying probably.</p>

<p>If you do use essence of breach, you pose a prefix, and then go into whittling territory. Depends on your funds, I guess.</p>
</label>
    </div>
  </label>
  
</div>

    <div class="comment">

        <div>1 | 13 minutes ago </div>
      </div>
      <label for="p2reabg" class="commentText"><p>You can target prefix the 20 qual and pray it hits mana, qual it up then target prefix whittle until you hit what mods you want (mana should be easy to get back but spell damage will cost you</p>

<p>I don’t know the exact odds but hitting 34 qual off infusers is impossible because it caps at 30, 21 is 5% to corrupt 22 is 10% then each time it rises by 5% more according to older threads, and yes it just locks the items once it fails not change anything</p>
</label>
    </div>
  </label>

<div class="commentAndChildren">
  <input id="p2rfojb" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>dutchMasta4</div>
        <div>1 | 5 minutes ago </div>
      </div>
      <label for="p2rfojb" class="commentText"><p>You&rsquo;re lucky the spirit is fractured. This is an expensive mistake though. I&rsquo;m no expert crafter but I think these are the steps:</p>

<ol>
<li>Use an Essence of Breach to add the +20% quality prefix, you will lose spell damage or max mana</li>
<li>Quality to at least 34% (might as well 40%)</li>
<li>Use Omen of Whittling and at least Greater Chaos until you hit a desired mod but <strong>make sure it&rsquo;s targeting that prefix</strong> (it will highlight in orange). You can look at <a href="https://poe2db.tw/us/Amulets#ModifiersCalc" target="_blank">poe2db amulets</a> for a sanity check, by checking the level of whatever mod replaces the +20% quality mode. I guess if it hits level 65, then you&rsquo;re going to have to settle. e.g. T2 increased armour = level 65 = same level as % quality desecrated suffix</li>
<li>(even more expensive) You can use the Omen of Sinistral Erasure in combination with Whittling if you hit a level 65 mod</li>
</ol>

<p>You&rsquo;re probably going to need to watch a video on this before fully understanding the above, you could brick your item even more.</p>
</label>
