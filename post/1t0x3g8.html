      <a class="postTitle" href="https://www.nbcsportsboston.com/nba/boston-celtics/76ers-game-7-adjustments-mazzulla-tatum/786461/"><p>[Forsberg] Can Celtics steady themselves? What needs to change as Game 7 looms</p>

    <div class="commentList">
      
        
          
<div class="commentAndChildren">

      <label for="ojc7hrm" class="commentText"><p>From Chris Forsberg:</p>

<p>Good news, bad news time for the Boston Celtics.</p>

<p>The bad news: A team that so endearingly knew exactly what it was for much of the 82-game regular season has lost its way at the worst possible moment. The Celtics have been pushed to a Game 7 of what was trending toward a breezy first-round series by a revitalized Philadelphia 76ers squad.</p>

<p>Boston put together two of the most unsightly and embarrassing offensive quarters of the season while punting away each of the past two games, then <a href="https://www.nbcsportsboston.com/nba/boston-celtics/live-updates-76ers-game-6-highlights-score/786205/" target="_blank">put its starters on ice at the end of Game 6</a> while basically resigning themselves to their Game 7 fate.</p>

<p>The good news: Most of this will be forgotten &ndash; or can at least be temporarily ignored &ndash; if Boston can get out of its own way on <a href="https://www.instagram.com/p/DXyFJ1KlSa8/" target="_blank">Saturday evening at TD Garden</a> (7:30 p.m. ET on NBC).</p>

<p>But the Celtics will be walking a tightrope in Game 7. They absolutely cannot just show up Saturday with an expectation that things will be different. Boston has to commit to changing its ways, and if things continue to go awry, head coach Joe Mazzulla has to be quicker with the changes to scheme and/or personnel that will give Boston the best chance to get back to its roots.</p>

<p>&hellip; The Celtics’ starting five has a minus-9.4 net rating in 58 minutes together this postseason. Most damning: Boston’s offensive rating is an unsightly 96.5 in that span. That same group with Vucevic in place of foul-stricken Queta has a minus-19.9 net rating in 27 minutes together.</p>

<p>Mazzulla has given his starters a lot of rope despite their uneven play. Derrick White couldn’t have had a worse start to Game 6, smoking a couple layups and losing his shoe while being called for a double dribble. He steadied himself in the aftermath but still lacks his typical confidence.</p>

<p>White impossibly owns a team-worst net rating, with the Celtics&rsquo; net rating at minus-5.6 in his floor time. Sam Hauser is right behind him with Boston owning a minus-5.2 net rating over 134 minutes.</p>

<p>Typically in the playoffs, rotations crunch down and teams lean into their core players. But the Celtics’ bench has been one of its superpowers all season long and the team seemingly needs to continue to embrace that energy.</p>

<p><a href="https://www.nbcsportsboston.com/nba/boston-celtics/76ers-game-7-adjustments-mazzulla-tatum/786461/" target="_blank">Read more here</a>.</p>
