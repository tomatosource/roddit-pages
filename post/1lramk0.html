

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://www.twitch.tv/boolawa/clip/AntediluvianObservantHorseRuleFive-QywMK1EmwrOZXtzt"><p>How do i stop this from being this bad.. i have a 9070xt - 7800xd3 &hellip; even just a little bit..</p>
</a>
    </h2>

    

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="n19bxbz" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Background_Brick994</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="n19bxbz" class="commentText"><p>Type /cls in the chat window and turn off local chat, the game currently has a memory leak with chat and /cls clears it</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="n19b39b" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>thiros101</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="n19b39b" class="commentText"><p>It would help to have a screenshot of your graphics settings. One of them is probably not playing nice.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="n19c6jm" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>zshift</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="n19c6jm" class="commentText"><p>This is an engine/optimization problem with POE that needs to be fixed by ggg. Heavily juiced maps can create a massive amount of effects on-screen, at which point the CPU can become a bottleneck feeding enough data to the GPU. You can see this in your charts with the red line becoming much larger relative the blue line, which represents cpu and gpu respectively. Even 9800X3D with 5090 are running into this.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="n19djdp" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Fyric</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="n19djdp" class="commentText"><p>I fixed this issue by enabling vsync on my 9070xt.</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
