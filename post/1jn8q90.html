       * {

*,

html {

body {

h1 {

}

h2 {

  font-weight: bold;
}

input[type="checkbox"] {

blockquote {

.commentText,

  color: #c39429;
}

.postTitle {

  color: #c39429;

}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;

  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;

    <h2>
      <a class="postTitle" href="https://i.redd.it/0izsm8hoosre1.png"><p>Is paint builds a thing here too? Anyways, my thoughts for League Starter (then go Minions later).</p>

<div class="commentAndChildren">
  <input id="mkhso85" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Ash-2449</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="mkhso85" class="commentText"><p>I have played enough yugioh to know that conditions have to be first met before an effect takes place, so we better wait to see how things actually interact with eternal life.</p>

<p>Those gloves would be ridiculously OP but what is more likely is that either:</p>

<p>-because life doesnt change, you dont receive the 2nd part of the effect since the first condition never went through<br>
-You gain 0 energy shield since life didnt change at all and remained the same so nothing was &ldquo;sacrificed&rdquo;</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="mkhtmpi" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Maladaptivism</div>
        <div>1 | 43 minutes ago </div>
      </div>
      <label for="mkhtmpi" class="commentText"><p>It&rsquo;s absolutely possible that this will be the case and I actually kind of expect it to be the case. That said, paint-builds are about the dreams and hopes we have *before* we fully see patch-notes. Another way to think of them is the crazy guy with the vision board and a lot of red threads pulled between them, it&rsquo;s meant to be a bit whack and unlikely. At least that&rsquo;s my interpretation.</p>
</label>
    </div>
  </label>
  
</div>

</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="mkht1m2" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Excaidium</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="mkht1m2" class="commentText"><p>You&rsquo;re going to use Archmage while relying on mana regeneration based on life, and at the same time, you&rsquo;re cutting off 50% of your life to ES with Ghostwrithe. This means you&rsquo;ll need significantly more investemnt in life than mana to get enough mana regeneration, which makes the entire Archmage setup (likely to be numerically nerfed as well) not worth your 100 Spirit.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="mkhvu3m" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Maladaptivism</div>
        <div>1 | 20 minutes ago </div>
      </div>
      <label for="mkhvu3m" class="commentText"><p>Oh, heaven&rsquo;s no. The inherent mana regen just is going to have to be non-existent, I plan on relying on the Recombinator to get a couple of decent things on a few pieces of gear and a Jewel that gives me 4% of my max mana every time I kill something (and mana flask where needed). The Idea there being combining the use of Archmage and Rupture the oul and Necromantic Conduit (possibly even Blackened Heart) to scale whatever flat damage I can add of whatever element and use the Max Mana damage scaling from Archmage in conjuction with Exploding corpses and Eldritch Empowerment. It&rsquo;s a League Starter, not a main build.</p>

<p>Step 1. Floortank every part of the story that&rsquo;s remotely difficult, just get through it.<br>
Step 2. Build as much offense as possible, so things *never* get close to you.<br>
Step 3. Do whatever content has the highest minion density, so you sustain mana.<br>
Step 4. Buy carries for bosses, to get points, because you sure as shit ain&rsquo;t killing them with this.<br>
Step 5. Exponentially increase your wealth through killing a fuckton of monsters, whether that&rsquo;s breach, ritual, delirium or something else we&rsquo;ll have to see and sell whatever drops. Quantity over quality, you can buy maps worst case.<br>
Step 6. You&rsquo;re now affluent enough to make literally any build work.</p>

<p>This build will absolutely fall over when something touches it, but, with the changes to how portals work. It&rsquo;s a lot more OK to die a few times in your maps, because let&rsquo;s face it, we&rsquo;re not very likely to be Exalting our maps early on and if I understood it correctly a 4 moded map would have 3 entires per person (this is off memory, I might *absolutely* be wrong, I was a bit distracted during the stream).</p>

<p>To be honest, the Eternal Life node was just a funny afterthought I added at the end because it seemed like a cool way to literally disable 25% (or more, with the right corrupt) of incoming damage. Obviously when we get patch notes these ideas might change.</p>
</label>
