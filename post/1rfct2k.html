      <label for="o7iz95k" class="commentText"><p>From Chris Forsberg:</p>

<p>One of the biggest questions surrounding an overhauled Boston Celtics roster entering the 2025-26 season was how much coach Joe Mazzulla could lean on a fleet of inexperienced wings. </p>

<p>Jordan Walsh, Baylor Scheierman and Hugo Gonzalez &ndash; the three most prominent picks in Brad Stevens’ tenure as president of basketball operations &ndash; were all in line for increased opportunity with Jayson Tatum rehabbing from Achilles surgery. But all of them needed to earn Mazzulla’s trust with a mere 870 total minutes of NBA experience between them. </p>

<p>Maybe the biggest surprise as Boston has outkicked outsider expectations this season has been that all three of have emerged as reliable rotation presences. Meanwhile, fellow wing Ron Harper Jr. is working his way toward a roster spot with the parent club given his strong play on both ends as a two-way player.</p>

<p>The team’s four-game road trip out West might have produced one of our favorite moments of the season, and it was a perfect encapsulation of the defensive production the team has received from its fleet of young wings.</p>

<p>A rare Payton Pritchard turnover allowed Jamaree Bouyea to break out in transition late in the third quarter of <a href="https://www.nbcsportsboston.com/nba/boston-celtics/live-updates-highlights-score-suns/772701/" target="_blank">Boston’s dominant win in Phoenix</a> on Tuesday night. Scheierman sprinted back to prevent an easy layup and, showing incredible discipline, he timed his leap to go straight up with a foul-free contest near the basket. Scheierman’s outstretched arms forced Bouyea to hold the ball just long enough for a sprinting Harper Jr. to come from behind and volleyball spike the ball off the backboard.</p>

<p>Gonzalez, who also hustled back, was in position to clean up the rebound on the baseline and then made another full-court trek &ndash; aided by a midcourt screen from newcomer Nikola Vucevic &ndash; before Eurostepping his way to a layup that put Boston out front by 23.</p>

<p>One game earlier, the Celtics dispatched the trio of Scheierman, Gonzalez, and Walsh to hound Luka Doncic in a win over the Lakers. Boston’s young guards so thoroughly attached themselves to Doncic that he looked exhausted by the second quarter.</p>

<p>About the only downside of Tatum&rsquo;s eventual return would be that some of the minutes available to Boston’s young wings will diminish. That was inevitable as the playoffs neared given how role players&rsquo; minutes tend to evaporate as rotations tighten.</p>

<p>But the glimpses showcased by Boston’s four-headed monster of young wings is a super encouraging sign, particularly as the Celtics try to build an economical roster around a core headlined by Tatum and Jaylen Brown.</p>
