    <h2>
      <a class="postTitle" href="/r/pathofexile/comments/1sepxnl/how_do_you_estimate_demand_when_you_can_only_see/"><p>How do you estimate demand when you can only see listings, not sales?</p>

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="oeryynn" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">

        <div>2 | 11 hours ago </div>
      </div>
      <label for="oeryynn" class="commentText"><p>The more short terms items are listed, the bigger the amount of sales.</p>

<p>As for knowing what to craft, the best is to look at poeninja for the most played build and crosscheck it with available items.</p>

<p>Bigger player base = more sales. But also more crafters in competition.</p>

<p>In the end it&rsquo;s just about finding a good sized market AND items that are overpriced and that you can craft for cheaper than what&rsquo;s available.</p>

<p>Honestly the hardest part of crafting to find a good niche. Following other people recipes is the easy mode but kind of a bad idea, especially if it&rsquo;s streamers with a large audience.</p>
</label>
    </div>
  </label>

      <label for="oes3u4b" class="commentText"><p>The hardest part of crafting is not only finding a niche, but as well understanding pricing within this niche and evaluating each step of the crafting proces regarding invest and risk vs. reward.</p>
