

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://www.reddit.com/r/PathOfExile2/comments/1knvt15/best_eva_after_acrobatics/"><p>Best eva % after acrobatics</p>
</a>
    </h2>

    
    <div class="selfPostContainer">
      <p>I am a Deadeye with 2K hp / 2.7 Es</p>

<p>Had an evasion of 84% and 88% after tailwind Try acrobatic and i has 51 and 61 after tailwind</p>

<p>And oh my god its not better, i can see every hit lower my ES now</p>

    </div>
    

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="mslf3hz" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>E1ectricJ3sus</div>
        <div>1 | 31 minutes ago </div>
      </div>
      <label for="mslf3hz" class="commentText"><p>When you click acrobatics you want your EV % to be like 70-75% min. Achieving that with hybrid gear is hard, especially w/o a pure evasion chest.</p>

<p>Accro and wind dancer got nerfed in the massive wave of last patch. Kind of makes the node unappealing since you need much more evasion investment, when you can just go ES instead. If you really want accro you&rsquo;re probably just better off wearing a Hyris Ire.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="mslgvu8" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>japhar</div>
        <div>1 | 12 minutes ago </div>
      </div>
      <label for="mslgvu8" class="commentText"><p>I was just wondering the same if 60% with acrobatics make sense, gonna test that today. I think I don&rsquo;t mind getting hit from time to time and proc. Wind Dancer. Wish it wouldn&rsquo;t 75% less ES.</p>

    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
