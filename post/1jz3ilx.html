

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/6u49oh07vtue1.png"><p>Just found out you can&rsquo;t &ldquo;finish&rdquo; the campaign before level 50</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/6u49oh07vtue1.png" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="mn36fwl" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Sremmos80</div>
        <div>1 | 38 minutes ago </div>
      </div>
      <label for="mn36fwl" class="commentText"><p>Bro how? did you skip anything and everything extra??</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="mn37cmk" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>lloyd3486</div>
        <div>1 | 34 minutes ago </div>
      </div>
      <label for="mn37cmk" class="commentText"><p>Yeah lol i skipped everything out of the way including stuff like Freythorn, Azak Bog, Venom Crypts, etc. Figured to just go back and do them after the campaign. Tbh was still at a decent level until the map exceeded 10 levels and i suddenly started barely getting any exp, so i believe i was lv44 throughout cruel act 3 (i gained 1 at least).</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="mn389hz" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>waplet</div>
        <div>1 | 29 minutes ago </div>
      </div>
      <label for="mn389hz" class="commentText"><p>Sp there is xp penalty for overleveling and underleveling?</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="mn39a1k" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>lloyd3486</div>
        <div>1 | 24 minutes ago </div>
      </div>
      <label for="mn39a1k" class="commentText"><p>Yeah, i&rsquo;m guessing it&rsquo;s to prevent people from being carried and powerlevelled, and tbh won&rsquo;t really affect unless rushing and skipping areas/mobs.</p>

<p>I&rsquo;m not sure if it&rsquo;s the same as poe1 but they have the formula here <a href="https://www.poewiki.net/wiki/Experience#Experience_penalties" target="_blank">https://www.poewiki.net/wiki/Experience#Experience_penalties</a></p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

    
  </div>
  
</div>

    
  </div>
  
</div>

        
      
    </div>
  </body>
</html>
