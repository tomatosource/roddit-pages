

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/bwfapexr7k0f1.jpeg"><p>Sad</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/bwfapexr7k0f1.jpeg" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">

    </div>
  </label>
  
</div>

      </div>
      <label for="ms3sudg" class="commentText"><p>Unfortunately I think we are going to have another drop once people start to realize Tatum, even if he makes a full recovery, isn’t going to return to the same (or better) roster in 2026-27.   Our window might be closed for a while </p>

<div class="commentAndChildren">

        <div>iAm-Tyson</div>
        <div>0 | 31 minutes ago </div>
      </div>
      <label for="ms5e37y" class="commentText"><p>Then you have to look at the depressing buisness aspect of it, do you deal Tatum in the same way we did IT knowing he may never be the same when he returns and we are due to pay him top dollar despite a lower ceiling</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="ms5gtbb" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Ndlburner</div>
        <div>1 | 18 minutes ago </div>
      </div>
      <label for="ms5gtbb" class="commentText"><p>No, you can&rsquo;t deal Tatum. Most people in front offices are expecting him to drop off a lot, so you&rsquo;d be getting close to worst-case value for him. The only way you get burned by not moving him is if it turns out he can&rsquo;t play anymore.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="ms5jt7t" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>iAm-Tyson</div>
        <div>1 | 4 minutes ago </div>
      </div>
      <label for="ms5jt7t" class="commentText"><p>Paying the supermax for a guy who declines out of the top 10-15 players in the league will effectively remove us from title contention until we are off the books for him</p>
</label>
    </div>
  </label>
  
</div>

  </body>
</html>
