

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://youtu.be/eLm9HG2X9FQ"><p>Path of Exile 2 Build Showcase - &lsquo;Reflect&rsquo; Pathfinder by KallTorak</p>
</a>
    </h2>

    

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="mivhyb0" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Kalltorak-CG</div>
        <div>1 | 13 minutes ago </div>
      </div>
      <label for="mivhyb0" class="commentText"><p>Wow so awesome to see one of my builds featured by the developers of the game! Sometimes when I&rsquo;m making a build I wonder if someone internally ever messed around with the concept. Glad the devs found it as silly as I did :)</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="mivfgsd" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Sarm_Kahel</div>
        <div>1 | 26 minutes ago </div>
      </div>
      <label for="mivfgsd" class="commentText"><p>The funniest part is that &ldquo;Thorns damage&rdquo; would still be a dead mod for this reflect build.</p>

<p>Still really cool.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="mivhb8e" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>zombieslore</div>
        <div>1 | 16 minutes ago </div>
      </div>
      <label for="mivhb8e" class="commentText"><p>It seems like GGG wants to support thorns more in PoE2 compared to 1 where it&rsquo;s just a dead mod. I was kind of disappointed resonating shield doesn&rsquo;t scale or splash thorns.</p>

<p>But we still have druid, flails, and maybe traps which might have built in thorns synergies.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="mivj3hq" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Sarm_Kahel</div>
        <div>1 | 6 minutes ago </div>
      </div>
      <label for="mivj3hq" class="commentText"><p>Yeah it&rsquo;s certainly a lot more useful in PoE2 than in the first game - it&rsquo;s just funny that this ES + pathfinder tech seems much stronger than actual thorns. I do suspect we&rsquo;ll see more support for it in the future that might change things. Honestly what thorns needs more than anything is an offensive ability that scales with it so that you can still function in situations where you don&rsquo;t want to be hit without needing to dedicate a huge portion of your build to scaling non-thorns damage.</p>
</label>
    </div>
  </label>
  
</div>

    
      
<div class="commentAndChildren">
  <input id="mivjugw" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Neonsea1234</div>
        <div>1 | 3 minutes ago </div>
      </div>
      <label for="mivjugw" class="commentText"><p>Sounds like more of a flails thing thematically, you know with self flagellation and all that.</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

    
  </div>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="mivgsg9" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Sathrenor</div>
        <div>1 | 19 minutes ago </div>
      </div>
      <label for="mivgsg9" class="commentText"><p>Can&rsquo;t wait to use it in Trials of Sekhema!</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
