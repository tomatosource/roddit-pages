

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://www.reddit.com/gallery/1kd74fq"><p>Voltaxic Rift - Fantastic Bow (Best Use?)</p>
</a>
    </h2>

    

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="mq8nwqg" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Lhaete</div>
        <div>1 | 9 minutes ago </div>
      </div>
      <label for="mq8nwqg" class="commentText"><p>It scales with %Chaos, where %Lightning would do nothing and depending on the Skill Gem it would also scale with Flat Damage ( Added Physical Damage to Attacks, etc ).</p>

<p>Since it has no Attack Damage its very hard to scale with Attack Gems and the Added Lightning Damage does not affect Spell Gems, so you basically just trade your weapon for &ldquo;Converts Lightning to Chaos&rdquo; and the &ldquo;Chaos can Shock&rdquo;.</p>

<p>It is an absurd damage loss compared to a Rare Weapon/Wand/Staff.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="mq8hvf2" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>ihatewebdesign101</div>
        <div>1 | 37 minutes ago </div>
      </div>
      <label for="mq8hvf2" class="commentText"><p>This actually made me think about some cool tech since the bow itself gives an unreasonable amount of flat lightning, if you add to it hits are lucky the dps will be astronomical,from this alone, especially if you have high int and wisdom gloves. And then just spec into like chaos damage and shock magnitude, as there are insane dps nodes with reduced cast speed for which we don’t care about.</p>

<p>Good tech would also be generating power charges instead of frenzy and get like 15% crit multi per power charge.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="mq8ocl2" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>VoidNoodle</div>
        <div>1 | 6 minutes ago </div>
      </div>
      <label for="mq8ocl2" class="commentText"><p>You will want &ldquo;increase chaos damage&rdquo; to scale it.</p>

<p>I&rsquo;ve tried this on a poison pathfinder&hellip;and it wasn&rsquo;t really any better than a normal phys bow. I was probably better off running plaguefinger so I could scale poison better.</p>

<p>I was gonna try it out on Lich but I&rsquo;ve moved on to LE.</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
