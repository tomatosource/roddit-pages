

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://bsky.app/profile/baseballhall.org/post/3mb7mlqjocs2j"><p>[National Baseball Hall of Fame and Museum] Join us in wishing Sandy Koufax a happy 90th birthday!</p>
</a>
    </h2>

    

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="nwr3mro" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Bobson-_Dugnutt2 | Chicago Cubs</div>
        <div>4 | 8 minutes ago </div>
      </div>
      <label for="nwr3mro" class="commentText"><p>the minor plot line about Sandy in Entourage is even more hilarious in retrospect. Dude is still alive 20 years later.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nwr3pu7" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Michael__Pemulis | Major League Baseball</div>
        <div>3 | 8 minutes ago </div>
      </div>
      <label for="nwr3pu7" class="commentText"><p>Happy 90th Sandy!</p>

<p>There is this funny little phenomenon where if you watch a decent amount of baseball (or almost <em>any</em> Dodger home games) you obviously see Sandy a lot.</p>

<p>But I have found that more casual fans are <em>always</em> somewhat shocked to learn that he is still alive. I have had the exact same experience with at least 5-10 people where I’ve said <em>’no I promise you I am 100% sure that Sandy Koufax is still around…’</em></p>

<p>I guess it is because even though he left the game so young, he pitched in an era where virtually every one of his peers have passed? It’s just particularly funny <em>because</em> he is so present at games &amp; gets shown on broadcasts so often.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nwr3txo" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>_Cratos | Los Angeles Dodgers</div>
        <div>2 | 7 minutes ago </div>
      </div>
      <label for="nwr3txo" class="commentText"><p>Imagine being so amazing as a pitcher 60 years ago that if you google “the left arm of god” right now, google takes you directly to your name.</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
