

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://www.nba.com/news/kia-mvp-ladder-jan-9-2026"><p>JB is climbing the ladder</p>
</a>
    </h2>

    

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="nylxgtv" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>FartrelCluggins | FTL</div>
        <div>4 | 13 minutes ago </div>
      </div>
      <label for="nylxgtv" class="commentText"><p>Wemby shouldn&rsquo;t even be on this list. I know the media is so quick to crown him as the next best player in the league, but you aren&rsquo;t in the mvp conversation when you&rsquo;ve played damn near half the minutes of the other candidates, it doesn&rsquo;t matter how good you are at that point. Get on the court and play.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nylxlr1" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Nicko_G758</div>
        <div>3 | 13 minutes ago </div>
      </div>
      <label for="nylxlr1" class="commentText"><p>Well deserved. I we get top 2 seed in the east he deserves MVP. Because we were supposed to be terrible this year</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="nylzviu" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>not_your_avg_blow</div>
        <div>1 | 2 minutes ago </div>
      </div>
      <label for="nylzviu" class="commentText"><p>I mean, if Jokic continues at his pace and hits the 65 game minimum I think that&rsquo;s for him. But I do believe it we hit top 2 in the east JB should get it over Shai or Doncic.</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nyly4fc" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>atlassoundx74</div>
        <div>2 | 10 minutes ago </div>
      </div>
      <label for="nyly4fc" class="commentText"><p>Amazing ascension - half of the polling population would have voted him outside of the top 20 at start of the year.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nylyxwt" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>InGeorgeWeTrust</div>
        <div>1 | 7 minutes ago </div>
      </div>
      <label for="nylyxwt" class="commentText"><p>That’s funny I just read on r/nbadiscussion how he isn’t even a top 20 player</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
