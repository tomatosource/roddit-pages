      <label for="mites3f" class="commentText"><p>Hello everyone,</p>

<p>I would like to ask for help regarding my build&rsquo;s next steps. Currently, while I am loving Deadeye, I&rsquo;m pretty much destroying T15 maps which is nice. However, I&rsquo;ve been trying to get into bossing, and I feel like my build is falling off, and I&rsquo;m not sure why.</p>

<p>To give a simple rundown, for maps I just use lightning arrow and sometimes Lightning Rod on rares with grim feast. For bosses I swap to Thief&rsquo;s Torment, and spam lightning rod with cast on shock active, which casts a bunch of lighting balls and deletes map bosses. While I like this build, and I&rsquo;ve pretty much used it for the entirety of my Deadeye run (other than leveling, where I did gas arrow), I feel like it&rsquo;s starting to fall off in terms of DPS. Not only that, but the amount of balls that I spawn on bosses like Xesht lags the crap outta my computer and it&rsquo;s a little hard to actually dodge anything. Again, map bosses are fine, they get deleted anyway. But if I&rsquo;m not gonna have any frames, I might as well kill pinnacle bosses quick as well, which I&rsquo;m not doing.</p>

<p>To give you a better understanding of how I came to this conclusion, I was playing with a friend watching (he&rsquo;s a stat stacking monk) and he told me to start doing pinnacle bosses cause they are fun. I agreed, I just hadn&rsquo;t gotten the chance to. We did the first Xesht together, but he didn&rsquo;t help on purpose so we could see if I could do it. The first few kills were easy, I dropped all points on Xesht and then I started feeling my build fall off and not do well, and with Xesht&rsquo;s overlapping attack patterns I felt it more. One thing I should mention is my chaos resistance is cooked and I don&rsquo;t know what to do about it.</p>

<p>So, my question: For any people out there who would be willing to help, what do you think should be done? From the video provided, which gear could be the reason behind the low boss DPS? Any specific upgrades that could really help? Please note that due to my somewhat limited playtime I cannot farm divs like crazy, like I just have 10 divs sitting right now, so nothing much. But if I could find an easy way to farm divs I&rsquo;d definitely try to do it. And last question, is there a BETTER Lightning arrow build, that revolves around different skills/gems, that would be a DPS increase? I am open to suggestions for a build change as well.</p>
</label>
