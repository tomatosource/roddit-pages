

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/q8sm4k9l2nkf1.jpeg"><p>Hey GGG, could you convert Exile Pilfering Ring and Exile&rsquo;s Pedometer Ring to Tracking Scrolls please?</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/q8sm4k9l2nkf1.jpeg" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="na58ysh" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>loganluther</div>
        <div>6 | 7 hours ago </div>
      </div>
      <label for="na58ysh" class="commentText"><p>When the rings were first released, we didn&rsquo;t have an extra microtransactions tab yet. It would be super nice if I could use these to track currency/footsteps while using other ring microtransactions with actual cosmetic features. I don&rsquo;t think anyone would mind this change as we don&rsquo;t use them for their 2D art that is only ever shown on the microtransactions page.</p>

<p>Also, please don&rsquo;t forget to add all the new types of currencies to the Pilfering Ring! Thank you :)</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="na5ga24" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>FrequentLake8355</div>
        <div>5 | 6 hours ago </div>
      </div>
      <label for="na5ga24" class="commentText"><p>While we&rsquo;re at it, also import scrolls in PoE1 please. </p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="na5qu3w" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Classic_Key8075</div>
        <div>3 | 5 hours ago </div>
      </div>
      <label for="na5qu3w" class="commentText"><p>I hate having to make sure I move it between chars when I&rsquo;m playing more than one character.  Phew, there&rsquo;s hardly any info online about that tracking scroll even.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="na6cy10" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>bilalakil</div>
        <div>1 | 3 hours ago </div>
      </div>
      <label for="na6cy10" class="commentText"><p>Oo I missed the tracking scrolls 😮</p>

<p>I wish all these stat trackers could track your stat on current league, and then pool them all together back on standard. I’d buy two of each if I had to to enable that 😂</p>

<p>But resetting the tracker every league doesn’t do it for me.</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
