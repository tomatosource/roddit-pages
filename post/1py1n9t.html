

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://www.reddit.com/r/PathOfExile2/comments/1py1n9t/performance_sucks/"><p>Performance Sucks</p>
</a>
    </h2>

    
    <div class="selfPostContainer">
      <p>Fuck the league mechanic, this needs to be your main focus. I can&rsquo;t even make it through most maps the stuttering is so bad.</p>

    </div>
    

    <div class="commentList">
      
        
          
<div class="commentAndChildren">

        <div>Blackout88</div>
        <div>1 | 9 minutes ago </div>
      </div>
      <label for="nwfiz5z" class="commentText"><p>I play on PS5, by far the best league performance-vise. Even on juiced as F maps, it&rsquo;s really good,  0.3was bad but it was manageable, 0.2 was so, so bad..</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nwfjwqg" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>cryalote</div>
        <div>1 | 4 minutes ago </div>
      </div>
      <label for="nwfjwqg" class="commentText"><p>Performance got a really good boost in 0.4</p>

<p>Runs completely smooth on a pretty old rig for me. Did you check ping? Drivers? SSD? Vulkan or DX? Did you clear shader cache?</p>

    </div>
  </label>
  
</div>

  <input id="nwf9nua" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Able_Act_1398</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="nwf9nua" class="commentText"><p>See you next league</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
