

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>

    <h2>
      <a class="postTitle" href="https://www.reddit.com/gallery/1tkn2wz"><p>Didn’t see that coming.</p>
</a>
    </h2>

    

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="on9xb17" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>RichardTheVane | SSFBTW</div>
        <div>12 | 6 hours ago </div>
      </div>
      <label for="on9xb17" class="commentText"><p>Corruption values will be the same:</p>

<p>if the mode is 75 (65 - 90), your corruption can go to 91.5 (1.22x), but if you div it to get to 89, the corruption can go to 108.6.</p>

<p>It will be a new div sink.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="ona1i1q" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>-Zavenoa-</div>
        <div>10 | 6 hours ago </div>
      </div>
      <label for="ona1i1q" class="commentText"><p>This is comparing corrupting and sanctify which is only possible on rare items, what you&rsquo;re talking about is a corruption outcome on unique items, which is an entirely different conversation.</p>

<p>Removing the Omen of Corruption reduces your odds of a good outcome by re-introducing the nothing happens outcome.</p>

<p>Additionally, the odds of getting a good outcome on Sanctification just got MASSIVELY buffed. Having to hit 2 rolls in the past made your odds substantially worse.  Yes, this is a div sink. However, when you&rsquo;re talking about GG crafts we&rsquo;re looking at pennies on the dollar in terms of cost to craft so the ability to now have control over one of those rolls is huge.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="onbf9rh" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>tokyo__driftwood</div>
        <div>1 | 2 hours ago </div>
      </div>
      <label for="onbf9rh" class="commentText"><p>Even without the omen of corruption, in many cases the change is a buff to the odds of good corruptions. It entirely depends on the roll range of the item. The higher the roll range, the more the new corruption is a buff, and the tighter the roll range, the closer to a nerf it is</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="onbquhn" type="checkbox" checked/>
    <div class="comment">

        <div>-Zavenoa-</div>
        <div>1 | 40 minutes ago </div>
      </div>
      <label for="onbquhn" class="commentText"><p>Again, you’re talking about a unique item corruption outcome, and you can’t Sanctify unique items.</p>

<p>Loss of Omen of Corruption was a straight nerf for Rare Items, where you have a choice between Sanctification and Corruption.</p>
</label>
    </div>
  </label>
  
</div>

</div>

</div>

    
      
<div class="commentAndChildren">
  <input id="ona3srx" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Endermenminer</div>
        <div>3 | 6 hours ago </div>
      </div>
      <label for="ona3srx" class="commentText"><p>I think they just mean that corrupting is less reliable without omen to force something to happen, since &ldquo;nothing&rdquo; is a valid outcome normally.</p>

<div class="commentAndChildren">
  <input id="onbrmg4" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>-Zavenoa-</div>
        <div>1 | 36 minutes ago </div>
      </div>
      <label for="onbrmg4" class="commentText"><p>Yes, and the buff people are referring to is unrelated to the meme. The only items that both of these can be used on corruption got nerfed and sanctification got massively buffed.</p>

<p>Edit: Because I&rsquo;m tired of trying to explain it: <a href="https://www.poe2wiki.net/wiki/Corrupted" target="_blank">https://www.poe2wiki.net/wiki/Corrupted</a></p>

<p>Non-unique <a href="https://www.poe2wiki.net/wiki/Equipment" target="_blank">equipment</a></p>

<ul>
<li>(25%) No change.</li>
<li>(25%) Reroll up to three modifiers into new modifiers.</li>
<li>(25%) Adds a special Vaal enchantment to the item.</li>
<li>(25%) Adds an <a href="https://www.poe2wiki.net/wiki/Item_socket" target="_blank">item socket</a> to <a href="https://www.poe2wiki.net/wiki/Weapon" target="_blank">weapons</a> (including <a href="https://www.poe2wiki.net/wiki/Sceptre" target="_blank">sceptres</a>) and <a href="https://www.poe2wiki.net/wiki/Armour_(equipment)" target="_blank">armour</a>, ignoring socket limits.</li>
</ul>

<p><a href="https://preview.redd.it/fpusj5sxir2h1.png?width=794&amp;format=png&amp;auto=webp&amp;s=ff15c800c8a3cf3c7b63e1340362d5fac512aac8" target="_blank">https://preview.redd.it/fpusj5sxir2h1.png?width=794&amp;format=png&amp;auto=webp&amp;s=ff15c800c8a3cf3c7b63e1340362d5fac512aac8</a></p>
</label>
