

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://www.reddit.com/gallery/1tkn2wz"><p>Didn’t see that coming.</p>
</a>
    </h2>

    

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="on9xb17" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>RichardTheVane | SSFBTW</div>
        <div>9 | 5 hours ago </div>
      </div>
      <label for="on9xb17" class="commentText"><p>Corruption values will be the same:</p>

<p>if the mode is 75 (65 - 90), your corruption can go to 91.5 (1.22x), but if you div it to get to 89, the corruption can go to 108.6.</p>

<p>It will be a new div sink.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="ona1i1q" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>-Zavenoa-</div>
        <div>10 | 4 hours ago </div>
      </div>
      <label for="ona1i1q" class="commentText"><p>This is comparing corrupting and sanctify which is only possible on rare items, what you&rsquo;re talking about is a corruption outcome on unique items, which is an entirely different conversation.</p>

<p>Removing the Omen of Corruption reduces your odds of a good outcome by re-introducing the nothing happens outcome.</p>

<p>Additionally, the odds of getting a good outcome on Sanctification just got MASSIVELY buffed. Having to hit 2 rolls in the past made your odds substantially worse.  Yes, this is a div sink. However, when you&rsquo;re talking about GG crafts we&rsquo;re looking at pennies on the dollar in terms of cost to craft so the ability to now have control over one of those rolls is huge.</p>
</label>
    </div>
  </label>
  
</div>

    
      
<div class="commentAndChildren">
  <input id="ona3srx" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Endermenminer</div>
        <div>3 | 4 hours ago </div>
      </div>
      <label for="ona3srx" class="commentText"><p>I think they just mean that corrupting is less reliable without omen to force something to happen, since &ldquo;nothing&rdquo; is a valid outcome normally.</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

        
      
    </div>
  </body>
</html>
