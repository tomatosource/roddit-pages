

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/ojczcu3p6zdh1.png"><p>There goes my Aldur&rsquo;s Saga. On a 3x Perfect Chaos remnant, no less&hellip;</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/ojczcu3p6zdh1.png" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">

      <div class="commentHeader">
        <div>Jankat7</div>
        <div>1 | 9 minutes ago </div>
      </div>
      <label for="oy9wg02" class="commentText"><p>I genuinely don&rsquo;t understand why they haven&rsquo;t disabled these immortal mobs yet. If the modifier is bugged even 1% of the time (and I feel like it&rsquo;s much higher than that) they should just disable it and move on</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">

      <div class="commentHeader">
        <div>Brehe</div>
        <div>1 | 4 minutes ago </div>
      </div>
      <label for="oy9x9ne" class="commentText"><p>Every time I encounter this there’s always some other mob that hasn’t died yet and once I kill that mob the “immortal” one becomes killable.</p>

    </div>
  </label>
  
</div>

    <div class="comment">
      <div class="commentHeader">
        <div>DarkSabbaths</div>
        <div>1 | 2 minutes ago </div>
      </div>
      <label for="oy9xjo1" class="commentText"><p>Yeah I missed a saga yesterday same thing, craggy peninsula , I&rsquo;m done with it until a bug fix, back to rituals</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="oy9vxmf" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Vegetable-Prize9904</div>
        <div>1 | 13 minutes ago </div>
      </div>
      <label for="oy9vxmf" class="commentText"><p>Okay.</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
