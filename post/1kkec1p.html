

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/oxijcs2pl80f1.jpeg"><p>Can We Talk About This?</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/oxijcs2pl80f1.jpeg" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="mrue4of" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>CamBlapBlap</div>
        <div>1 | 28 minutes ago </div>
      </div>
      <label for="mrue4of" class="commentText"><p>I&rsquo;m glad it was discussed in the last stream, but man they need to act on it quickly. Either resolve the need to use low level gems or give us a way to down level them.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="mruezyd" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Nymandis</div>
        <div>1 | 22 minutes ago </div>
      </div>
      <label for="mruezyd" class="commentText"><p>A smart way they could do it is make it a button like they use to add/subtract minions, with the upper limit based on the actual level of the gem.</p>

<p>That way, say you get a level 16 spirit gem.   It can be used to cut a spirit gem skill of levels between 4 and 16, but selecting a level lower than 13 greys out the third tier, and a level lower than 8 greys out the second tier.</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="mru95dx" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>IFightWhales</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="mru95dx" class="commentText"><p>Kind of a bad idea, economy-wise.</p>

<p>This is a grindy game. If you&rsquo;re against farming stuff, I&rsquo;m not sure what to tell you.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="mrub9qy" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Nymandis</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="mrub9qy" class="commentText"><p>You&rsquo;re defending not adding a mechanic they had in place for PoE1?</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="mrucjrp" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>IFightWhales</div>
        <div>1 | 38 minutes ago </div>
      </div>
      <label for="mrucjrp" class="commentText"><p>What does that have to do with anything?</p>

<p>Not everything from PoE1 should be in the game. Racing with movement skills through maps while several trigger skills off-screen entire hordes of mobs, for instance, is in PoE1.</p>

<p>As it is, this would make all the Jewellers much less desirable (since you can reuse those from your other characters). With the freshly buffed drop rates, I&rsquo;m against this. The campaign is too easy the second time around during the season as is.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="mrud8t2" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Nymandis</div>
        <div>1 | 34 minutes ago </div>
      </div>
      <label for="mrud8t2" class="commentText"><p>40+ exalts for an item dropped in the campaign is absolute idiocy, and let&rsquo;s not even get into the fact they&rsquo;re priced in DIVINES in Graveyard League.</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

    
  </div>
  
</div>

    
      
<div class="commentAndChildren">
  <input id="mrudwi9" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>CamBlapBlap</div>
        <div>1 | 29 minutes ago </div>
      </div>
      <label for="mrudwi9" class="commentText"><p>Absolutely not. They&rsquo;ve said on stream that it wouldn&rsquo;t be a problem. Theres no reason a level 8 spirit gem should ever be a chase.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="mruep6e" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>IFightWhales</div>
        <div>1 | 24 minutes ago </div>
      </div>
      <label for="mruep6e" class="commentText"><p>Chase?<br>
We probably have different definitions of what a chase item is.</p>

<p>Either way, it&rsquo;s not like I&rsquo;m going to be storming the barricades should they implement it. I just think there are other things that warrant a look first.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="mrug2tc" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Nymandis</div>
        <div>1 | 15 minutes ago </div>
      </div>
      <label for="mrug2tc" class="commentText"><p>This can be interpreted as a &ldquo;quit moment&rdquo; for players new to the game.   The campaign needs to have as little punishment for experimentation as possible, and to be punished because you don&rsquo;t have the stats to use a higher level sprit gem for the aura/meta you want to use at their lower levels feels absolutely terrible.</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

    
  </div>
  
</div>

    
  </div>
  
</div>

        
      
    </div>
  </body>
</html>
