

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/qu42e6tr7q2g1.jpeg"><p>Is this bow valuable?</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/qu42e6tr7q2g1.jpeg" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="nq4v7kt" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Satanel01</div>
        <div>4 | 3 hours ago </div>
      </div>
      <label for="nq4v7kt" class="commentText"><p>No. Would be good for leveling for a bit. But it would not really be worth much or anything probably.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nq4vefi" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>edewunisib</div>
        <div>4 | 3 hours ago </div>
      </div>
      <label for="nq4vefi" class="commentText"><p>Its campaign valuable. Im guessing you can beat the whole campaign with it. And then you have to upgrade once you&rsquo;re doing maps.</p>

<p>However, since we&rsquo;re getting a new league in a few weeks, no one would probably buy that bow.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="nq4zobk" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Necessary-Peanut2491</div>
        <div>1 | 2 hours ago </div>
      </div>
      <label for="nq4zobk" class="commentText"><p>Widowhail probably beats this by mid-late campaign.</p>

<p>At item level 33 a triple flat prefix quiver gives you up to 36.5 average flat and +1 level. +200% from a mid-rolled Widowhail and you&rsquo;re at a total of 117 flat (with base damage) and +3 levels compared to this thing&rsquo;s ~105 flat and +3 levels (when paired with the same quiver). So it depends on how much your build likes +1 arrow versus more flat. But at item level 46 the Widowhail+Quiver setup is up to 133.5 flat and +6 levels while this bow only came up to about 113 flat and +4 levels so Widowhail is ahead by miles.</p>

<p>That item level 46 quiver won&rsquo;t be cheap, but it&rsquo;s not really out of the budget for twink gear.</p>

<p>Edit: Goofed the math, forgot the lightning flat. So +9.5 flat damage on this bow, makes it the clear winner at item level 33, but still well behind at 46.</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nq4wqj1" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>KsaKsa42</div>
        <div>1 | 2 hours ago </div>
      </div>
      <label for="nq4wqj1" class="commentText"><p>Completely useless after day 2-3 of the league, and now is like day 90+</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nq4xyyy" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Didtheyreallytry</div>
        <div>1 | 2 hours ago </div>
      </div>
      <label for="nq4xyyy" class="commentText"><p>No it&rsquo;s not valuable. </p>

<p>It might be a good item at a point in the campaign but I think most people just vendor their levelling gear to save on stash space. </p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
