      <label for="o4mdmcp" class="commentText"><p>From <a href="http://Globe.com" target="_blank">Globe.com</a></p>

<p>By Adam Himmelsbach</p>

<p>Celtics forward Jayson Tatum on Monday took the latest step in his recovery process when he was assigned to take part in portions of the Maine Celtics’ practice at the Auerbach Center.</p>

<p>The team said that at the conclusion of practice, which would also include guard Hugo Gonzalez and center Amari Williams, Tatum would be recalled to the Celtics to continue rehabbing his Achilles injury.</p>

<p>Tatum ruptured his right Achilles tendon during the Celtics’ Eastern Conference semifinal loss to the Knicks last May, and his training since has mostly taken place behind closed doors.</p>

<p>ESPN reported Sunday that Tatum has been taking part in controlled five-on-five scrimmages with the Celtics’ coaching staff.</p>

<p>Tatum has made it clear that he would like to return this season, but neither he nor the Celtics have stated whether that will happen. During an appearance on “The Pivot Podcast” last month, Tatum for the first time cast doubt on the possibility of a return, sharing some wariness about the possibility of disturbing a Celtics team that has pushed into second place in the East.</p>

<p>But last Friday, <a href="https://www.bostonglobe.com/2026/02/06/sports/brad-stevens-celtics/?p1=Article_Inline_Text_Link" target="_blank">Celtics president of basketball operations Brad Stevens made it clear</a> that if Tatum is completely healthy and comfortable, there is no doubt his return would be a positive development for the team.</p>

<p>“The best time for Jayson Tatum to come back is when he’s 110 percent healthy, he’s fully cleared by everybody that matters in that decision, and he’s got great peace of mind and he’s ready to do it,” Stevens said. “That’s it. That’s the objective and that’s what we’re going to stick with.”</p>

<p>The Celtics face the Bulls on Wednesday before taking a week off for the All-Star break. The team will then depart for a four-game Western Conference road trip. Near the start of this season, Tatum said that if he does return this year, his first game back will be at TD Garden.</p>
