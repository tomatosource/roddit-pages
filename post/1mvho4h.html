

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/iwyhzqxjy6kf1.jpeg"><p>Spear damage question</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/iwyhzqxjy6kf1.jpeg" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="n9q5q3i" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Interesting-North-86</div>
        <div>9 | 7 hours ago </div>
      </div>
      <label for="n9q5q3i" class="commentText"><p>Base crit is the foundation of crit scaling.  So 1.5% there doesn&rsquo;t seem like much till you add in modifiers and that turns to 5-10% chance to crit depending on your crit multi, that&rsquo;s a VERY significant amount of tooltip damage.  The mind edge also has more attack speed to scale from, especially if you&rsquo;re acc stacking.  That&rsquo;s why.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="n9q5tko" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>MightyMorp</div>
        <div>4 | 7 hours ago </div>
      </div>
      <label for="n9q5tko" class="commentText"><p>Crit chance is almost certainly the difference maker. 30% more crit on mind edge.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="n9qeean" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>HotTruth8845</div>
        <div>2 | 6 hours ago </div>
      </div>
      <label for="n9qeean" class="commentText"><p>Attack speed even at a 0.05% difference can amount to bigger differences as the tooltip is based on damage per second. Although I would say the main difference is the crit chance % in the base weapon.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="n9r04uq" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>truongdzuy</div>
        <div>2 | 4 hours ago </div>
      </div>
      <label for="n9r04uq" class="commentText"><p>Higher base crit chance and attack speed makes a big different</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="n9q5u98" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Professional_Ear6033</div>
        <div>1 | 7 hours ago </div>
      </div>
      <label for="n9q5u98" class="commentText"><p>Do you invest into crit?</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="n9qul8q" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>synochrome</div>
        <div>1 | 5 hours ago </div>
      </div>
      <label for="n9qul8q" class="commentText"><p>Heavily</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="n9r05l5" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>jesus_the_fish</div>
        <div>3 | 4 hours ago </div>
      </div>
      <label for="n9r05l5" class="commentText"><p>It&rsquo;s the Crit - all your crit chance multipliers are based off the base of the weapon.</p>

<p>For example, if you have +500% crit chance then:</p>

<ul>
<li>Spear 1 = 5% base * 5.00 = 25% crit</li>
<li>Spear 2 = 6.5% base * 5.00 =  32.5% crit</li>
</ul>

<p>Layer in crit multi and you&rsquo;ll have exponential scaling off the crit stat</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

    
  </div>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="n9qbx4f" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>thedroidslayer</div>
        <div>-1 | 6 hours ago </div>
      </div>
      <label for="n9qbx4f" class="commentText"><p>It&rsquo;s the attack speed more than the crit lol it&rsquo;s an inflated ass number, don&rsquo;t use it just use your noggin</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="n9qkhc5" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>MightyMorp</div>
        <div>4 | 5 hours ago </div>
      </div>
      <label for="n9qkhc5" class="commentText"><p>The difference in attack speed is 3%, the difference in crit is 30%.</p>

<p>Sure it’s the attack speed chief?</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

        
      
    </div>
  </body>
</html>
