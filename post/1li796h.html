

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/1i6vg3e2rl8f1.jpeg"><p>Recombination failure shouldn’t destroy the items</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/1i6vg3e2rl8f1.jpeg" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="mz9x2i1" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>HOLY_TERRA_TRUTH</div>
        <div>1 | 8 minutes ago </div>
      </div>
      <label for="mz9x2i1" class="commentText"><p>My guess is GGG won&rsquo;t do this tho - it&rsquo;ll severely trivialize loot if you need to find just a few random T1 mods and recombine them using 6k-12k artifacts. Especially if you can use the result of one recombine and another.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="mz9xuv2" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Dense_Independence21</div>
        <div>1 | 2 minutes ago </div>
      </div>
      <label for="mz9xuv2" class="commentText"><p>Or else they could just copy the poe1 method and randomly mix the mods of both items with a chance of the desired mods to show up on the new item.</p>

<p>They want to destroy the item to not trivialize the ground loot. Unlike poe1 , ground loot has a lot more value in poe2 since scours don&rsquo;t exist by design.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="mz9wp26" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Fine_Act47</div>
        <div>1 | 11 minutes ago </div>
      </div>
      <label for="mz9wp26" class="commentText"><p>You know what, I fucking love this idea</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="mz9x4sn" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>happy111475</div>
        <div>1 | 8 minutes ago </div>
      </div>
      <label for="mz9x4sn" class="commentText"><p>Personally, after decades of gaming, including before there were home consoles, PCs, and such, I&rsquo;m pretty worn out on RNG being, &ldquo;The Thing.&rdquo;  The cult of RNGesus is out of control, imo.</p>

<p>So I basically like your idea, but with a twist that you should be able to essentially pay enough artifacts to make the combination a guarantee or something close to it, like over 95 percent.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="mz9xzlc" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Chuperb</div>
        <div>1 | a few seconds ago </div>
      </div>
      <label for="mz9xzlc" class="commentText"><p>Yeah I’m also frustrated because its just rng on rng. I pick up all the tiered rares and I’m barely finding t1 mods to recombine in the first place. Then it just deletes them</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

        
      
    </div>
  </body>
</html>
