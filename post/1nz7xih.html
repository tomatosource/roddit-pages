      <label for="ni0z1r8" class="commentText"><p>You need 100% chance for 2 additional projectiles, trust me. Right now you are mostly shooting a couple of bones per cast. With 100% for additional projectiles and enough cast speed 1 click of bonestorm will shoot the full 20 bones.</p>

<p>T3 Xesht on my bonestorm deadeye:</p>

    <div class="comment">
      <div class="commentHeader">
        <div>vil-in-us</div>
        <div>2 | 5 hours ago </div>
      </div>
      <label for="ni123zl" class="commentText"><p>It&rsquo;s certainly a thought, but I don&rsquo;t think I can fit it in.</p>

<p>You don&rsquo;t want to use a staff with this build since wand + focus is 8 spell levels where a staff is 7 max</p>

<p>Proj chance is a Desecrated suffix on a Focus, but only up to 16%, and it&rsquo;s competing with other things you really want, like +3 Spell skills (mandatory), resists, cast speed, and crit chance/bonus</p>

<p>There is the rune for 25% for a wand or staff, and I could get a 2-socket wand for 50% right there, but&hellip; that&rsquo;s just 50%. I&rsquo;d have to get the other 50% from the tree which is 15 points I&rsquo;d have to scrounge up from somewhere.</p>

<p>On top of that, a full volley ends up missing a bunch of the bones except on very large targets so I don&rsquo;t think it&rsquo;s that worthwhile.</p>

<p><em>Also</em> also, I was missing a bunch of cast speed in that video since I&rsquo;m supposed to be on Low Life, but I was on FULL Life instead, so I had 30% LESS Crit Bonus (instead of 30% MORE from Pain Attunement) and 10% REDUCED Cast Speed (instead of 20% Increased from Final Barrage)</p>
</label>

      </div>
      <label for="ni09hcs" class="commentText"><p>Here&rsquo;s the build if you want to give it a look:</p>

<p><a href="https://pobb.in/E4vcSMan-YCX" target="_blank">https://pobb.in/E4vcSMan-YCX</a></p>

<p>The current gear cost is around 20 div but you can get the build to a state where it&rsquo;s crushing lvl <sup>81</sup>&frasl;<sub>82</sub> content for MUCH cheaper than that</p>

<p>Video shows the single-target damage and tankiness, for clearing you mostly use Bone Cage and Detonate Dead with Bonestorm for stubborn rares and map bosses</p>

<p>The only content this build kinda struggles with is the Simulacrum. Delirium monsters don&rsquo;t leave corpses so DD just straight-up doesn&rsquo;t work, and that&rsquo;s your bread and butter for quickly clearing. I was able to clear the 1st and 2nd Simulacrum by clearing with just Bone Cage, which sucked, but the 3rd was just not happening. However, if you have a summoner buddy running the crack ants this build synergizes VERY well with it as you get the bonuses from the more typical summoner build and you excel at single-target while the ants mop up all the trash. We did the 3rd Simulacrum together and it was a breeze.</p>

<p>Ritual, Breach, and Expedition content is ezpz.</p>

  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="ni0y116" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>vil-in-us</div>
        <div>3 | 6 hours ago </div>
      </div>
      <label for="ni0y116" class="commentText"><p>Living Lightning is Extracting the Impales inflicted by Bonestorm</p>

<p>One of the issues with Bonestorm is that a big chunk of its damage comes from the BIG Impale magnitude built-in to the spell, but you need an Attack in order to extract those Impales and take advantage of it. So your options are to attack things yourself (bad) or have minions to attack things (likely the intended solution).</p>

<p>Something else about Bonestorm is that it gets BIG benefits from skill levels, but if you&rsquo;re running minions you need Spirit, which means you&rsquo;ll probably need to run a Sceptre and miss out on the spell levels you can get from a Focus. Well, Living Lightning comes to the rescue by providing Minions that won&rsquo;t die before they do their job and cost no Spirit at all, letting you pick up a Focus - and the 3 levels you can get on a Focus makes a HUGE difference - about 50% higher base damage!</p>

<p>You can scale the Impale damage even harder since sources of Allies/Minions gain Extra Damage as X (like Unholy Might or Evergrasping Ring) actually includes the Impale in that calculation!</p>

<p>It&rsquo;s also nice that just because of the way Impale works in POE2, the strongest Impales are given priority to Extract, and this build stacks up a good amount of crit, so those little lightning boys are doing WORK</p>
</label>
    </div>
