

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://youtu.be/IXRzWE2-lEs"><p>First Uber Arbiter kill with my Bonestorm / Living Lightning Lich!</p>
</a>
    </h2>

    

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="ni09hcs" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>vil-in-us</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="ni09hcs" class="commentText"><p>Here&rsquo;s the build if you want to give it a look:</p>

<p><a href="https://pobb.in/E4vcSMan-YCX" target="_blank">https://pobb.in/E4vcSMan-YCX</a></p>

<p>The current gear cost is around 20 div but you can get the build to a state where it&rsquo;s crushing lvl <sup>81</sup>&frasl;<sub>82</sub> content for MUCH cheaper than that</p>

<p>Video shows the single-target damage and tankiness, for clearing you mostly use Bone Cage and Detonate Dead with Bonestorm for stubborn rares and map bosses</p>

<p>The only content this build kinda struggles with is the Simulacrum. Delirium monsters don&rsquo;t leave corpses so DD just straight-up doesn&rsquo;t work, and that&rsquo;s your bread and butter for quickly clearing. I was able to clear the 1st and 2nd Simulacrum by clearing with just Bone Cage, which sucked, but the 3rd was just not happening. However, if you have a summoner buddy running the crack ants this build synergizes VERY well with it as you get the bonuses from the more typical summoner build and you excel at single-target while the ants mop up all the trash. We did the 3rd Simulacrum together and it was a breeze.</p>

<p>Ritual, Breach, and Expedition content is ezpz.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="ni0hqiu" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>vil-in-us</div>
        <div>1 | 29 minutes ago </div>
      </div>
      <label for="ni0hqiu" class="commentText"><p>Wow, I JUST realized that I did that fight on full life since I had died to something earlier and forgot to reset my life to Low Life. It would have gone much better if I had been on Low Life like the build is supposed to be.</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
