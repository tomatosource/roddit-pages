

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://www.tiktok.com/t/ZThcvVNrB/"><p>My Top 15 Greatest Celtics of All-Time. Thoughts?</p>
</a>
    </h2>

    

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="oa6pvgq" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>LarBrd33</div>
        <div>2 | an hour ago </div>
      </div>
      <label for="oa6pvgq" class="commentText"><p>Tatum over Pierce.  You can move Brown higher as well.</p>

<p>Here&rsquo;s the thing&hellip; you&rsquo;re either ranking based on ability or you&rsquo;re ranking based on accolades.  I don&rsquo;t think you can really have it both ways.  You can&rsquo;t justify Pierce and KG that high unless you&rsquo;re claiming it&rsquo;s a ranking of abilities and acknowledging that the game is constantly evolving and players are constantly improving.  But if that&rsquo;s the methodology you&rsquo;re using, then you can rank prime Tatum as high as 2nd behind Bird and might have KG 3rd with Brown in the top 5.</p>

<p>If you&rsquo;re purely doing accolades, then it&rsquo;s an entirely different ranking and guys like Pierce have no business being top 5 when several players are multi-time champions with higher all-nba selections or literally league MVP awards like Cowens.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="oa6qnl3" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>detray1</div>
        <div>2 | an hour ago </div>
      </div>
      <label for="oa6qnl3" class="commentText"><p>Tatum has better accolades but Pierce’s FMVP and longevity made it hard for me to put Tatum over him. Another championship and more longevity will surely put him over Pierce.</p>

<p>Brown’s FMVP made me consider moving him higher, but I felt that he just doesn’t have enough All-NBAs yet.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="oa6r07v" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>FreeWillyBird</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="oa6r07v" class="commentText"><p>I feel like Dave Cowens is this lost Celtic who somehow gets lost in the forgotten 70’s in between the early dynasty and the 80’s NBA resurgence with Bird and Magic. He did win two titles and was the bridge between the two biggest eras.</p>
</label>
    </div>
  </label>
  
</div>

    
      
<div class="commentAndChildren">
  <input id="oa6rhko" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>LarBrd33</div>
        <div>1 | 43 minutes ago </div>
      </div>
      <label for="oa6rhko" class="commentText"><p>I don&rsquo;t put much stock in FMVP, because it&rsquo;s kinda a silly media award just selected by 11 randos based on vibes, but if you&rsquo;re putting stock in FMVP, move Brown higher.</p>

<p>Interesting thing about FMVP is that had it existed as an award in the 50s-60s, there would probably be dispersed amongst multiple of those old Celtic legends since that award quite often doesn&rsquo;t actually go to a team&rsquo;s best player, but instead goes to a sidekick like Cedric Maxwell over Bird, Joe Dumars over Isaiah, James Worthy over Magic, Iggy over Steph, etc.  It&rsquo;s kinda arbitrary without any real consistency as to how they vote on it.   But it didn&rsquo;t exist as an award until 1969 and by then the Celtics had 10 banners without any FMVP awards.</p>

<p>Seems to generally favor top scorer instead of defense (hence Pierce over KG) so like, Tom Heinsohn probably ends up winning at least one FMVP (he lead the team in scoring in 1957 Finals, 1959 Finals, 1960 Finals, 1961 Finals) and then when you&rsquo;re looking at his 8 titles, 4 all-nba selection, 2 titles as a coach, and entire broadcast career, it&rsquo;s almost insulting to rank Pierce ahead of him just because FMVP didn&rsquo;t exist yet.</p>

<p>Then at some point you&rsquo;d have Sam Jones (leading Finals scorer in 63, 64, 65) followed by a couple extra FMVP awards for Havlicek closing out the 60s.</p>
</label>
    </div>
  </label>
  
</div>

</div>

</div>
