.commentText,

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>

      <label for="o4sadrp" class="commentText"><p>You health is critically low, you have no &ldquo;armour applies to epemental damage&rdquo; mods on any piece of armour(except body), and the overall armour is so low it doesnt make a difference</p>

<p>I recommend going full pure armour with at least t2 rolls and &ldquo;armour applies to elemental damage&rdquo; mods as much as you can, the boots need to go asap, they are  bottlenecking you, a unique that honestly saved my ass (when i built a druid) too many times than i can count is defience of destiny amulet but its not worth it if you dont get health on all equipement and at least <sup>2</sup>&frasl;<sub>3</sub> of em with &ldquo;armour applies to ele dmg&rdquo;</p>

<p>Btw i would buy defienve of destiny after all other equipement is updated&hellip;try to reach at least 2600 hp</p>

<p>I would go for:</p>

<p>1.helmet - %armour with flat armour and hp then resistances and possibly armour applies to ele dmg</p>

<p>2.body armour -best one i thin would be %armour with flat armour and hp with double res and armour applies to ele dmg</p>

<p>3.gloves - i would go for %armour/life with double flat with resistances and armour applies to ele dmg</p>

<p>4.boots- ms with %armour and life and armour applies tonele dmg anf resistances if possible</p>

<p>5.either one or both rings with life and 2 flat dmg and resistances</p>

<p>6.belt - flat armour with life abd resistances</p>

<p>Only then i would go for defience of destiny</p>
