    <div class="commentList">
      
        
          
<div class="commentAndChildren">

    <div class="comment">
      <div class="commentHeader">

        <div>1 | 21 minutes ago </div>
      </div>
      <label for="ok34gi8" class="commentText"><p>Nah. Hot take, but destroying everything with cheap leveling uniques is actually really fun, and allows you to get through the campaign pretty dam fast.</p>

  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="ok368mv" type="checkbox" checked/>

        <div>Ok-Skin-3699</div>
        <div>1 | 13 minutes ago </div>
      </div>
      <label for="ok368mv" class="commentText"><p>If others haven&rsquo;t done this, you need to. Unironically if you just wear the level appropriate 2h Mace unique, you stomp the game flat.</p>
</label>
    </div>

</div>

    
      
<div class="commentAndChildren">
  <input id="ok363bs" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Skovosity</div>
        <div>1 | 13 minutes ago </div>
      </div>
      <label for="ok363bs" class="commentText"><p>I agree, and the campaign is done for me in a day on either game, but I&rsquo;m aiming more towards alleviating the pressure and time investment for some of my friends who either work a ton of hours, aren&rsquo;t very knowledgeable about the game, or simply can&rsquo;t be bothered to do the campaign <strong>again</strong> if that makes sense. I have a few that probably won&rsquo;t even play POE2&rsquo;s next expansion simply because they felt burned by leveling a character last league and ended up wanting a different playstyle/build despite offering to &ldquo;rush&rdquo; them through everything.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="ok37m9e" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>twoFlex404</div>
        <div>1 | 7 minutes ago </div>
      </div>
      <label for="ok37m9e" class="commentText"><p>If they get burned out by the campaign then PoE 2 isn&rsquo;t for them and that&rsquo;s fine.</p>

<p>PoE requires a certain level of investment to feel comfortable. Part of the joy of the game is taking the time to build and improve a character. It&rsquo;s cool if that&rsquo;s not your jam or your friend&rsquo;s jam, but it&rsquo;s a core component of the game.</p>
</label>
    </div>
  </label>
  
</div>

    
      
<div class="commentAndChildren">

    <div class="comment">

      </div>
      <label for="ok38g3i" class="commentText"><p>Have you considered that this game may not be for them?</p>
</label>

  </label>

<div class="commentAndChildren">
  <input id="ok365vi" type="checkbox" checked/>
    <div class="comment">

        <div>TrashPocketz</div>
        <div>1 | 13 minutes ago </div>
      </div>
      <label for="ok365vi" class="commentText"><p>I’m against anything that just hands out a high level character. It feels like one of those MMOs where you use a token or whatever and your new character is in end game. No thanks. It undermines the value of characters and the connection we have to them.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="ok376l4" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Skovosity</div>
        <div>1 | 9 minutes ago </div>
      </div>
      <label for="ok376l4" class="commentText"><p>Mapping in POE2 starts around 60-65 or so, do you feel that&rsquo;s too high of a level?</p>

<p>What if the characters that are added to the camp (using existing examples I have in the post) start at level 1? Then you need to either do missions for the character/camp or complete additional steps, or they slowly level to a cap of, say, 60 with shared XP for the character you&rsquo;re &ldquo;mentoring.&rdquo; This way it still takes time and an investment; nothing is being handed to you, and by the time the alt is level 60, you&rsquo;ve already invested a fair amount of time, at minimum, comparable to the length of the campaign, allowing this to be an option rather than feeling necessary?</p>

<blockquote>
<p>Edit: Updated the following to include this perspective as well. Good feedback imo.<br>
<strong>1a)</strong> Select a disciple to passively gain a percentage of your experience. The shared experience of getting an alt to entry-level maps could be comparable to the time it takes to complete the campaign, allowing this to be an option rather than feeling mandatory. This way nothing is being &ldquo;handed&rdquo; to people, and it allows you to still slap some OP low-level uniques on a character and blast through.</p>
</blockquote>
</label>
    </div>

  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="ok3893i" type="checkbox" checked/>
    <div class="comment">

        <div>TrashPocketz</div>
        <div>1 | 4 minutes ago </div>
      </div>
      <label for="ok3893i" class="commentText"><p>I think I’m against anything character being awarded levels by any means other than playing with that character. If there was some alternate leveling system that you could play through I wouldn’t hate it, though I don’t know that I feel we need that either. I also have friends we bounced off of PoE2 when they found out they had to replay the campaign, but I get the feeling these types of players would  never have stuck with this type of game long term anyway. Just my 2 cents.</p>
</label>
