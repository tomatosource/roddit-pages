      <label for="n83sc43" class="commentText"><p>edit: -to*</p>

<p>At this point, I do not care about the hundreds of dollars I&rsquo;ve spent on stash tabs and member slots for my original PoE1 guild.</p>

<p>I do however care about my Atlas Hideout and PvP Arena, which I would very much like to use for my PoE2 guild when they are ported over.</p>

<p>&ldquo;Players who received Hideouts or exclusive hideout decorations in their Supporter Packs can gift a guild version of these microtransactions to a guild that they are a leader of. This can only be done once per transaction.&rdquo;</p>

<p>The problem is Path of Exile 2 was only supposed to be an expansion when these microtransactions were gifted. Many people, including myself went all in on our guilds prepping them for PoE2. I personally wasted hundreds of dollars in stash tabs, but I&rsquo;m willing to let that go. All I want are the things that can&rsquo;t be repurchased.</p>
</label>

      <label for="n83zrc2" class="commentText"><p>Of course. But we have been bringing up this issue every few months and when we do get a response from support, it&rsquo;s a generic &ldquo;You can only gift these microtransactions one time. Sorry!&rdquo; which disregards all the facts.</p>

<p>All I&rsquo;m asking is a proper answer from a developer stating that they intend on making things right, or telling us we&rsquo;re screwed and then at least we can stop getting our hopes up. I know guild leaders are a minority in the community, but we need an answer.</p>

<p>Also I believe part of the reason for the lack of caring is that Jonathan is under the assumption that not many people actually enjoy guilds and that is the reason for the lack of guild features. It is actually the lack of guild features being the reason more people don&rsquo;t join guilds.</p>

      <label for="n87yiod" class="commentText"><p>Yes, please thought I was the only one being annoyed by this. I did raise a ticket about the topic when POE2 early access went live. It was quite sad/funny after the early access announcement I prepared a new hideout in my POE1 guild, gifted the last few things I had, and even bought a new map device in preparation. A few weeks later, news gets out. Nothing is transferred to a POE2 guild, and you can&rsquo;t even gift it again.</p>

<p>Their response to the ticket was simply that the game is not live yet, so they are not sure what will happen. I guess that&rsquo;s fair from a support agent perspective as not all MTX are ready for POE2. However, an official stance on this matter from GGG would be great&hellip;. Too bad none of the streamers care about guilds, so these questions are never asked in the interviews.
I really loved it when they added the guild HO and stash it caused my friends and me to play a lot more. There is so much untapped potential there, the guild stash is also still an absolute disaster when it comes to all the new QoL features.</p>
