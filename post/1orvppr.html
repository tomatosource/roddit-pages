

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/cz3wto8sm20g1.jpeg"><p>What was your best bargain buy this league?</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/cz3wto8sm20g1.jpeg" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="nnst7cm" type="checkbox" checked/>

      </div>
      <label for="nnst7cm" class="commentText"><p>I&rsquo;m curious. What are the best glove stats for thorns-build?</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">

    <div class="comment">
      <div class="commentHeader">
        <div>pH0u57</div>
        <div>1 | 31 minutes ago </div>
      </div>
      <label for="nnstjk5" class="commentText"><p>Bought 30 % MS boots with around 150 life, chaos res, 2 sockets &amp; 100 % socket bonus for 9 div. Then I found out I don&rsquo;t have enough dex to wear them. Had to buy others for around 14-15 div. 😞</p>
</label>
    </div>

  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="nnsv9gz" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>frostfeint3</div>
        <div>1 | 22 minutes ago </div>
      </div>
      <label for="nnsv9gz" class="commentText"><p>Just swap some of your stats on the passive to dex or wear a headhunter lol</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nnsxt5p" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Skaitavia</div>
        <div>1 | 9 minutes ago </div>
      </div>
      <label for="nnsxt5p" class="commentText"><p>A 2 socket thunderfist glove for 3d. I think the person miss-listed it since the next cheapest was 25-30d at that time. And it was listed for 2 minutes.</p>

<p>After I bought it I used 1 divine and it rolled almost max rolls for every line, which if you don’t know have a huge range, like 1-111% increased evasion and energy shield, 1-11% attack speed, 1-33% lightning res, and 77-111 lightning damage to attacks. It rolled basically max for almost all.</p>

<p>I corrupted it right after qualitying it and got a 3rd socket, and it sold for a mirror in a week. This was 2 weeks into the league. It set me up for the rest of the league and has snowballed since then.</p>

<p>I got it because I was looking for an upgrade for my hollow palm monk, and when I hit the 3rd socket I knew I hit something massive. The “improvement” was more min-max like some more attack speed overall, and my build was not at a point of min-maxing that early in the league, so I listed it instead.</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
