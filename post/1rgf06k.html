      <a class="postTitle" href="https://i.redd.it/689tr9pwz2mg1.png"><p>Wand Crafting Help</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/689tr9pwz2mg1.png" />

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="o7r4nqa" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>75inchTVcasual</div>
        <div>2 | an hour ago </div>
      </div>
      <label for="o7r4nqa" class="commentText"><p>Is this a 1 socket or 2 socket base?</p>

<p>Regardless, I wouldn’t fracture. If you hit the skills it’s kind of pointless to invest currency in it since it can’t be sanctified. Reveal T1 mana regen or mana per enemy killed (lower ilvl) and whittle on your gains. Only issue here is that you may hit fire and will then be forced to take that with only one of cold or lightning. Then light off the blocker and reveal cast speed.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="o7qx36j" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>smekksi</div>
        <div>1 | 2 hours ago </div>
      </div>
      <label for="o7qx36j" class="commentText"><p>You have the right idea. I also like desecrating the Kurgal mod for cast speed while on full mana, so you could:</p>

<ol>
<li>Desecrate prefix</li>
<li>Fracture</li>
<li>Reveal mana.</li>
<li>Perfect ex prefix, hope for gain</li>
<li>Omen of light the mana off</li>
<li>Desecrate suffix Kurgal for cast speed</li>
<li>Perfect ex last prefix</li>
</ol>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="o7r98ti" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Tweedlol</div>
        <div>1 | 44 minutes ago </div>
      </div>
      <label for="o7r98ti" class="commentText"><p>No point to reveal mana when there’s already spell dmg. 2x slams, one will be mana or one will not with a double slam. You end up whittling almost regardless unless you slam 2x t1 gains. Even then, you slam as final step which results in mana being right back in the pool. 😵‍💫</p>

<p>This specific wand would benefit most from just desecrate suffix no reveal to the fracture fracturing crit. If the desecrate reveal after hits cast speed t1 dope otherwise omen of light. Slam 2ex prefix and whittling t1 gains. Remaining prefix and Mana is irrelevant iLvls for whittle until gains. Then just desecrate for cast speed if it was not cast speed and unless you’re always max mana, live on the edge and go for t1 cast speed 😎</p>

<p>If the fracture hits spell or skills, then the iLvl of crit will make whittling gains more difficult and possibly requiring erasures + whittle. Which could still be worth it if their goal is perfect t1’s and getting these 3 mods didn’t already cost them a lot.</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="o7rccqh" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Personal_Street2280</div>
        <div>1 | 29 minutes ago </div>
      </div>
      <label for="o7rccqh" class="commentText"><p>If it’s a +5 wand fracture spell dmg an if it’s a +4 fracture crit hit chance.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="o7rdlye" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>CaptainAgnarr</div>
        <div>1 | 22 minutes ago </div>
      </div>
      <label for="o7rdlye" class="commentText"><p>You&rsquo;ll want to desecrate cast speed, there are a few whittle bricks for crit chance I believe. And whittle and pray you don&rsquo;t hit T1 hybrid mana spell damage in the prefix. You can try fracturing, many people who plan on sanctifying wouldn&rsquo;t want to hit the +lvl which you&rsquo;re risking if you try. But if you hit the spell dmg it&rsquo;s at least safe.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="o7qz1dd" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>topsen-</div>
        <div>-5 | 2 hours ago </div>
      </div>
      <label for="o7qz1dd" class="commentText"><p>The fastest and most reliable way I found to get top tier wands (not the cheapest probably):</p>

<ol>
<li>Roll T1 spell damage: Divine to 119% and fracture it</li>
<li>Add full affixes with exalts</li>
<li><strong>Perfect</strong> chaos spam: Get T1 Skills + Cast speed (it takes me about 1k-1.5k perfects)</li>
<li>Use Abyss Essence + Prefix crystallization + Omen of Lights to roll prefixes (Essence &amp;gt; Jaw (not ancient) &amp;gt; Reveal mana (to block) &amp;gt; Perfect Exalt &amp;gt; Repeat if not extra dmg or the element damage you need)</li>
<li>Whittle last suffix to crit (I just keep whichever T1 crit I get first)</li>
</ol>

<p>As you may guess the most annoying is step 3. Step 5 can be the most expensive.</p>

<p><a href="https://preview.redd.it/j3urqij243mg1.png?width=774&amp;format=png&amp;auto=webp&amp;s=7a8119522842bbc2b514685f6b070b43f72bfb26" target="_blank">https://preview.redd.it/j3urqij243mg1.png?width=774&amp;format=png&amp;auto=webp&amp;s=7a8119522842bbc2b514685f6b070b43f72bfb26</a></p>
</label>
    </div>
  </label>
