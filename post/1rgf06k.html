

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>

    <h2>
      <a class="postTitle" href="https://i.redd.it/689tr9pwz2mg1.png"><p>Wand Crafting Help</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/689tr9pwz2mg1.png" />

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="o7qx36j" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>smekksi</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="o7qx36j" class="commentText"><p>You have the right idea. I also like desecrating the Kurgal mod for cast speed while on full mana, so you could:</p>

<ol>
<li>Desecrate prefix</li>
<li>Fracture</li>
<li>Reveal mana.</li>
<li>Perfect ex prefix, hope for gain</li>
<li>Omen of light the mana off</li>
<li>Desecrate suffix Kurgal for cast speed</li>
<li>Perfect ex last prefix</li>
</ol>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="o7r4nqa" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>75inchTVcasual</div>
        <div>1 | 8 minutes ago </div>
      </div>
      <label for="o7r4nqa" class="commentText"><p>Is this a 1 socket or 2 socket base?</p>

<p>Regardless, I wouldn’t fracture. If you hit the skills it’s kind of pointless to invest currency in it since it can’t be sanctified. Reveal T1 mana regen or mana per enemy killed (lower ilvl) and whittle on your gains. Only issue here is that you may hit fire and will then be forced to take that with only one of cold or lightning. Then light off the blocker and reveal cast speed.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="o7qz1dd" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>topsen-</div>
        <div>1 | 36 minutes ago </div>
      </div>
      <label for="o7qz1dd" class="commentText"><p>The fastest and most reliable way I found to get top tier wands (not the cheapest probably):</p>

<ol>
<li>Roll T1 spell damage: Divine to 119% and fracture it</li>
<li>Add full affixes with exalts</li>
<li><strong>Perfect</strong> chaos spam: Get T1 Skills + Cast speed (it takes me about 1k-1.5k perfects)</li>
<li>Use Abyss Essence + Prefix crystallization + Omen of Lights to roll prefixes (Essence &amp;gt; Jaw (not ancient) &amp;gt; Reveal mana (to block) &amp;gt; Perfect Exalt &amp;gt; Repeat if not extra dmg or the element damage you need)</li>
<li>Whittle last suffix to crit (I just keep whichever T1 crit I get first)</li>
</ol>

<p>As you may guess the most annoying is step 3. Step 5 can be the most expensive.</p>

<p><a href="https://preview.redd.it/j3urqij243mg1.png?width=774&amp;format=png&amp;auto=webp&amp;s=7a8119522842bbc2b514685f6b070b43f72bfb26" target="_blank">https://preview.redd.it/j3urqij243mg1.png?width=774&amp;format=png&amp;auto=webp&amp;s=7a8119522842bbc2b514685f6b070b43f72bfb26</a></p>
</label>
    </div>

<div class="commentAndChildren">

        <div>1 | a minute ago </div>
      </div>
      <label for="o7r62zg" class="commentText"><p>1.5k perfect chaos spam sounds nasty</p>

</div>
