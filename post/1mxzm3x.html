

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://www.reddit.com/r/PathOfExile2/comments/1mxzm3x/warbringer_03/"><p>Warbringer 0.3</p>
</a>
    </h2>

    
    <div class="selfPostContainer">
      <p>Thinking of going totem warbringer for the new league, how would you rate the changes?</p>

    </div>
    

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="na8ipo6" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>RTheCon</div>
        <div>1 | 10 minutes ago </div>
      </div>
      <label for="na8ipo6" class="commentText"><p>We have literally no idea how the damage might work now due to the changes in scaling.</p>

<p>If it’s truly just your weapon stats instead of their own base damage it’s way worse.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="na8i9u6" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Aubie</div>
        <div>1 | 12 minutes ago </div>
      </div>
      <label for="na8i9u6" class="commentText"><p>Start with shockwave totems. You know that&rsquo;ll do work as it&rsquo;s tried and tested. Slot in ancestor when you can and see how it goes!</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="na8jnwa" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Vol-Vaetern</div>
        <div>1 | 3 minutes ago </div>
      </div>
      <label for="na8jnwa" class="commentText"><p>Which totem? Ancestral is a big question, since we need to generate Endurance charges somehow. There is no Enduring Cry. Plus now it scales off weapon, you can get amazing mirror tier mace. But you can&rsquo;t scale it well with 1Div weapon.</p>

<p>Giant&rsquo;s blood is in a weird spot. I want to take it, but I will lose 600 hps, which is ~15% of my HP pool.</p>

<p>Shield changes is meh. I had 90% block with Svalin and still was in a rough spot when doing Expedition logbooks or Simulacrum. Now I will take 30% damage from blocked hits. Have some doubts.</p>

<p>Armor applies to elemental is a marketing porn. Armor works very well against small hits - 100-200 hp. I don&rsquo;t have problem with those hits even without armor. The way armor works it is much more valuable to go 75%-&amp;gt;80% resists, then 100% Armor applies to elemental. Even with 20k armor.</p>

<p>Shockwave totem possibly viable, but there is no Jagged ground available for it.</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
