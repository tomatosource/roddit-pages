

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/ai2aixz4p3of1.jpeg"><p>Crafting help/advice is</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/ai2aixz4p3of1.jpeg" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="nd8eenn" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>convolutionsimp</div>
        <div>2 | 2 hours ago </div>
      </div>
      <label for="nd8eenn" class="commentText"><blockquote>
<p>My first thought was omen of homogenous with a double suffix omen. My understanding would be I would either get resistances or leach? Am I right in thinking that or is there more to it?</p>
</blockquote>

<p>Yes, no way to guarantee resists. You can combine that omen with the omen that consumes catalyst quality and apply e.g. cold or lightning qual. That&rsquo;d give you higher chance to hit resists. Depending on how much you want to spend you could do that twice without double exalt omen, but perfect exalt is expensive.</p>

<p>You could always clean up a suffix with the dex essence omen + abyss essence +  omen of light, but that&rsquo;s quite expensive and not sure how much you want to spend (probably not worth it).</p>

<p>Another thing you could do is block one of the leech mods using abyss and then slam the resist, and then remove the abyss mod again with omen of light.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nd8elfl" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Socrasteezy</div>
        <div>1 | 2 hours ago </div>
      </div>
      <label for="nd8elfl" class="commentText"><p>Couldn&rsquo;t you collarbone a suffix res onto it (could be expensive if unlucky) and guarantee triple res with a homo double suffix slam?</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nd8lsy6" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>PipSqu3ak95</div>
        <div>1 | 20 minutes ago </div>
      </div>
      <label for="nd8lsy6" class="commentText"><p>Use omen to desecrate suffix. Reveal until resist or hybrid resist (very high chance to hit, 40%+) and u can increase the chances with x2 reroll omen<br>
Then Homogenous omen + double exalt omen + suffix omen + slam greater exalt. You will guarantee 2 resist suffixes.</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
