}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
    font-size: 38px;
    line-height: 1.5;

.selfPostContainer * {

.streamableContainer {

  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

      <label for="lwpgw97" class="commentText"><p>They would&rsquo;ve been fine running it back with a healthy OG, Randle &amp; Robinson - or even + Mikal.
He could&rsquo;ve focused on defense while Brunson/DD/OG/Randle/Robinson shared the offensive burden.</p>

<p>Losing their best perimeter weapon (DD) &amp; best interior scorer (Randle) really exposes the Knicks offensive attack. Now all you have to do is cut Brunson off, stay home on their &ldquo;shooters&rdquo; and frustrate KAT. They don&rsquo;t have nearly the same fire or dynamic shot creation as before. KAT is a better shooter, but he&rsquo;s not as tough of an ISO scorer as Randle imo.</p>

<p>They have more spacing at the 5, but less on the wing. Brunson isn&rsquo;t meeting bigs in the paint, but he&rsquo;s getting hounded by wings who can regroup to their man. He can&rsquo;t bait fouls on bigs if they&rsquo;re not in the paint. This also messes up their &ldquo;crash the boards&rdquo; tactic, losing the speed advantage and either give up points in transition or aren&rsquo;t getting buckets outside of half court sets. This makes them fall behind and unable to close deficits. Brunson is simply a much better PG with a big that mainly works in the post.</p>

<p>They might still be scary if they get Robinson back, slide KAT to the 4, OG at the 3 and Hart or Bridges off the bench. This would maximize Brunson&rsquo;s impact on both ends, allow them to have 2 great shooters at Forward, a lob threat/roller down low and Hart/Mikal as a simple glue guy or cutter. Robinson also makes McBride, Kolek more viable in any lineup and allows Dadiet to have a longer leash. Precious could change things a bit. It&rsquo;s definitely fun to dunk on them rn tho.</p>

<p>TLDR; unless they can trade Bridges &amp; Mitch for Giannis - they&rsquo;re probably a 2nd round bounce house.</p>
