

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://v.redd.it/12uwakcgg4qf1"><p>Maybe it&rsquo;s time I go full Energy Shield.</p>
</a>
    </h2>

    

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="nf2gl4b" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Vanidyr</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="nf2gl4b" class="commentText"><p>When was it not the time ? Lol
Edit : you have 2k life ( like many of us do ) and no matter how much evasion and deflection you have if deflect is not 100% you will probably die at some moment.  Es works everytime.
You know its like a doctor giving you medicine to stop the pain but the down side is every time you sneeze there is 30-50% chance you shit your pants</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="nf2hofm" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>crippy6000</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="nf2hofm" class="commentText"><p>The fool in me thinks that if I just farm for a couple more days, I&rsquo;ll be able to afford a head hunter and wont have to worry. But then again, i&rsquo;ll just die once more to some random BS haha. Might be time to go Atziri, CI ES recoup.</p>
</label>
    </div>
  </label>
  
</div>

    
      
<div class="commentAndChildren">
  <input id="nf2o0n5" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Probably_Fishing</div>
        <div>1 | 20 minutes ago </div>
      </div>
      <label for="nf2o0n5" class="commentText"><p>Saw an 11k ES guy get 1 shot the other day on stream.</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nf2ozmn" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Striker_977</div>
        <div>1 | 15 minutes ago </div>
      </div>
      <label for="nf2ozmn" class="commentText"><p>Can you link your build?</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nf2qdkn" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Valharja</div>
        <div>1 | 8 minutes ago </div>
      </div>
      <label for="nf2qdkn" class="commentText"><p>Fully boosted damage eventually kills everyone but Evasion + Deflection is always just rng if you will survive or not. Unlike ES it&rsquo;s always online though as nothing ever drains away but flip your Evasion and deflect percentages, multiply them together and that&rsquo;s the chance an enemy has to just wreck your stuff. Still in hypothetical scenarios where 1-shots happen completely regardless (like if something does something insane like 20K damage) then evading it would again be better than eating it with a less than 20K shield + HP though that&rsquo;s a bit unlikely.</p>

<p>I&rsquo;m running 2 companions with with 30% of hits going to companions first, no idea if that stacks additively when you have 2 or not but at least it&rsquo;s something, also kept the buckler with extra block for 25% additional rng despite scepter being able to boost companions further </p>

<p>It feels quite tanky until it suddenly isn&rsquo;t though admittedly it usually goes south after a companion or 2 bites the dust.</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
