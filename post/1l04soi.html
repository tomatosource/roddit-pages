

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>

      </div>
      <label for="mvat8lt" class="commentText"><p>In case you weren’t aware, you can decrease the wall opacity of your map overly down to 0%, if you want better visibility between overlay and actual game.</p>

<div class="commentAndChildren">
  <input id="mvat082" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Cypher1643</div>
        <div>2 | 4 hours ago </div>
      </div>
      <label for="mvat082" class="commentText"><p>It&rsquo;s your opinion, yet you state everything as objective truth.</p>

<p>If all campaign layouts are made smaller, then there&rsquo;s going to be an issue with getting people leveled to the right place so they can handle the next zone. You could increase monster density to make up for less area, but then you&rsquo;d have to change how monsters get aggrod on you so you don&rsquo;t get overwhelmed. If monster aggro range is reduced then you can sit on the edge of screen and spam ranged attacks at monsters with them not even noticing you, trivializing everything. There&rsquo;s a consequence to every one of these changes, it&rsquo;s not just a cut and dry decision. There&rsquo;s a domino effect. Plus the more time you spend in a zone the more you get to practice with the new skills you&rsquo;re using and understanding how mob types move and attack which prepares you for more dangerous content down the line.</p>

<p>Speaking about this zone in particular, I look for the checkpoint to the boss, then I look for sisters of garukan. Once I get to sisters I don&rsquo;t even fight the doll mobs I just checkpoint back to the boss and then fight him. I just try to run as far away as possible from the entry into the zone, always choosing the fork that goes further away instead of sideways and I usually find it pretty fast. Then sisters of garukan is usually close-ish to where the boss checkpoint is.</p>
</label>
    </div>
  </label>
  
</div>

      </div>
      <label for="mvbox57" class="commentText"><p>Each map needs a clue that tells you if you are close to something important. Like a map detail</p>

</div>

        
      
    </div>
  </body>
</html>
