      <label for="nqng4ha" class="commentText"><p>Yea, if intention was to vaal, you’re almost better off making it on a 80 base (80 2 socket dueling is much, much, cheaper than 81) and go for the frac on all spells; get a new base if you miss. You can’t really whittle ladder with it (ilvl 78) and slamming it with homogenise is a nightmare.</p>

<p>Also, if going for +5 lightning, you just need to chaos on any tier of incr. lightning dmg for the slam.  Then you abyss it off and slam until T1 cast speed is on there. Can then whittle a lower tier crit miss into a prefix and mark it off and re-slam. But with how easy +5 is to slam on and how cheap perfect ex is now, I just anulled/slammed my last craft until T1 cast and T1 crit. Whittling off a crit miss can get expensive if you get a bad rng chain (keeps hitting suffix). Basically, anything is bait to invest omens in until you have +5 and T1 cast speed on there.</p>
</label>

        <div>1 | 7 hours ago </div>
      </div>
      <label for="nqr4hpd" class="commentText"><p>Yeah if I ever go for this craft again I would definitely use an ilvl 80 base. Doing this so late in the league was already going to cost way too much and return too little, because there&rsquo;s no one left to buy sub-par crafts. And as tempting an idea of a perfect wand with t1 spell dmg, t1 lightning dmg, +5 lightning was, I really screwed myself over fracturing with that rather than going for a more deterministic craft. All in all it was an expensive lesson in crafting and I&rsquo;m just glad I finished it.</p>
