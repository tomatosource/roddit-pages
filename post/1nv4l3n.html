

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://v.redd.it/vft976dz8hsf1"><p>Never had any connection issues in PoE2, now after the update I get severe freezes.</p>
</a>
    </h2>

    

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="nh5zaip" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>apcrol</div>
        <div>0 | an hour ago </div>
      </div>
      <label for="nh5zaip" class="commentText"><p>its your internet. Try another server or ask provider</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="nh5zior" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>tiahx</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="nh5zior" class="commentText"><p>I didn&rsquo;t change a provider in the last 24 hours, and up until this morning everything was working perfectly.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="nh62f5i" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Caillend</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="nh62f5i" class="commentText"><p>Restart your router/modem fully, by keeping it off power for a few mins and let your ISP link up again and see if that helps.</p>

<p>It&rsquo;s probably a routing issue from your ISP as a VPN fixes it for you. The VPN uses a different route to connect to the server.</p>

<p>This means that if there is one connection issue at a node your ISP uses, that the whole connection is that messy.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="nh658wa" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>tiahx</div>
        <div>1 | 41 minutes ago </div>
      </div>
      <label for="nh658wa" class="commentText"><p>I thought about it, yes, thank you. Tried that earlier, but probably didn&rsquo;t wait long enough (turned it back on after ~20 seconds) for the dynamic ip to reset.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="nh65mep" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Caillend</div>
        <div>1 | 38 minutes ago </div>
      </div>
      <label for="nh65mep" class="commentText"><p>If it doesn&rsquo;t help, then the only way is to contact your isp and have them do a full reset of the connection.</p>

<p>But yeah routing is a bitch, like I can&rsquo;t play with some friends because they are on servers that I have bad routing to and the ones I can get on, they have issues with.</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

  </body>
</html>
