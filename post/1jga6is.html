

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/cwpce5b0hzpe1.png"><p>Possible 0.2 Inspiration: Einhar&rsquo;s Memory of Crystal Prisons</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/cwpce5b0hzpe1.png" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">

    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">

    <div class="comment">

        <div>kobo1d</div>
        <div>19 | 2 days ago </div>
      </div>
      <label for="mixjp7n" class="commentText"><p>Background: POE1 has &ldquo;memories&rdquo;, sets of unusual, connected maps. Each is associated with a certain NPC.</p>

<p>One &ldquo;memory&rdquo; associated with Einhar (the NPC associated with Bestiary, already another POE1 mechanic getting a lot of speculative talk right now for POE2) is called Einhar&rsquo;s Memory of Crystal Prisons. In it, you visit a series of maps with &ldquo;rogue exiles&rdquo; (another POE1 mechanic) buffed to hell with essence mods. Einhar? Unique essence mobs? Could easily be inspiration for some 0.2 content given what&rsquo;s known so far.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="mixu6cm" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>lepsek9</div>
        <div>5 | 2 days ago </div>
      </div>
      <label for="mixu6cm" class="commentText"><p>Essences could definitely use some love in PoE2.</p>

<p>I&rsquo;m not a big fan of beast crafting, but I think it could fit PoE2&rsquo;s toolkit with some limited options. I&rsquo;d love to see Aspects reworked and brought back, such a fun concept but they never really got the opportunity to shine with all the auras you&rsquo;d rather reserve.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="miybikc" type="checkbox" checked/>

        <div>6 | 2 days ago </div>
      </div>
      <label for="miybikc" class="commentText"><p>Just doing exactly like Poe 1 does and having a node that guarantee an essence in your map, and another one that give it a chance to be a greater (like maybe 10% or something)</p>

<p>Essences shouldn&rsquo;t be rare.</p>
</label>
    </div>
  </label>
  
</div>

        <div>jpylol</div>
        <div>3 | 2 days ago </div>

      <label for="miy4u8s" class="commentText"><p>Ooo good connection</p>

  </body>
</html>
