

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/pi465odsnzeg1.png"><p>Crafting help please</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/pi465odsnzeg1.png" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="o15be5q" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Turtvaiz</div>
        <div>1 | 28 minutes ago </div>
      </div>
      <label for="o15be5q" class="commentText"><p>You don&rsquo;t want to start from elemental %. Get one with T1 flat (preferably cold imo) and that crit dam bonus. Then crit essence, prefix desecrate.</p>

<p>You have a 50% chance in not removing either suffix. If you fractured the prefix, add battle essence and then slam + perfect essence if it&rsquo;s bad. Lastly get elemental % from the prefix. It&rsquo;s 5 omen of lights on average, if you want to spend the divs.</p>

<p>If you missed the fracture then you add perfect essences (battle+ice) using the suffixes. If the wrong one gets removed just add onslaught so you have something useful</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="o15cyc9" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Emotional_Squash_895</div>
        <div>1 | 20 minutes ago </div>
      </div>
      <label for="o15cyc9" class="commentText"><p>Okay I ended up buying an open prefix magic base with crit bonus. Lucked into T1 Lightning with a perfect augment.</p>

<p>Seeking essenced for crit chance.</p>

<p>Desecrated then fractured the crit bonus unluckily</p>

<p>Revealed T1 Cold damage</p>

<p>added a suffix then used perfect ice essence</p>

<p>added another suffix (it was mana per hit)</p>

<p>Essence of Battle removed the crit chance</p>

<p>Essence of Haste for the onslaught</p>

<p>I have a pretty good staff now. All I&rsquo;m left guessing on now is which runes to go with. Should I go crit bonus or ele damage?</p>

<p><a href="https://preview.redd.it/rz6dlggptzeg1.png?width=1165&amp;format=png&amp;auto=webp&amp;s=fe5383585d6dca7b04d4bcfae20b69e440f52ea4" target="_blank">https://preview.redd.it/rz6dlggptzeg1.png?width=1165&amp;format=png&amp;auto=webp&amp;s=fe5383585d6dca7b04d4bcfae20b69e440f52ea4</a></p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="o15ezle" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Turtvaiz</div>
        <div>1 | 9 minutes ago </div>
      </div>
      <label for="o15ezle" class="commentText"><p>Double T1 gz that&rsquo;s not bad</p>

<p>You can check runes in pob. I always used the 50% rare/boss dmg and gain 5% as all elements runes. If you use the ice herald armour break thing you need a gain as chaos damage rune</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="o15fylv" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Emotional_Squash_895</div>
        <div>1 | 4 minutes ago </div>
      </div>
      <label for="o15fylv" class="commentText"><p>I do use the ice herald. Why the chaos damage rune?</p>
</label>
    </div>
  </label>
  
</div>

</div>

</html>
