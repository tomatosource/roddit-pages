      <label for="p5rxdiv" class="commentText"><p>There are two alloys you want to add here ideally: transcendent alloy for cast speed and extra cold damage on the suffix, and Celestial Alloy on the prefix for spell levels and mana.</p>

<p>To do both, you need an Astrid&rsquo;s Creativity augment that you later overwrite with something like Hedgewitch for +1 spell level.</p>

<p>Given that you&rsquo;re SSF the chances you have any, are slim.</p>

<p>The wand already has cast speed so to apply the trans alloy you&rsquo;d need to remove it, making this even more difficult.  As someone else said, we need to know what materials you have already.</p>

<p>Personally I think you&rsquo;re just going to end up exalt slamming once, and desecrating the final prefix.  If you do have a Celestial Alloy, it&rsquo;s a gamble on the prefix.  Either use it first, and remove the good prefix you already have, or exalt slam once and hope you don&rsquo;t hit mana (or it&rsquo;s mana locked and you cant use the alloy)</p>
