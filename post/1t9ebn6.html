

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://imgur.com/a/oDxXXE8"><p>Quick mock-up of the biome map selection idea</p>
</a>
    </h2>

    

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="ol1ftp6" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>HelicopterOk4418</div>
        <div>2 | 3 hours ago </div>
      </div>
      <label for="ol1ftp6" class="commentText"><p>I would much rather allow players a way to create new nodes in a biome with maps of their choice than let them change maps of existing nodes.<br>
Probably the best thing about the atlas is that sometimes you need to get through a challenging, less desirable node in order to access the the more desirable nodes (from an ease and efficiency of farm perspective) behind it. Allowing players to simply change any map node to the &ldquo;best&rdquo; (easiest and most efficient) map of its group kind of detracts from one of the handful of things PoE 2&rsquo;s atlas has going for it over PoE 1&rsquo;s system, which is that it presents these ups and downs.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="ol1gloc" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>GazingatyourStar</div>
        <div>2 | 3 hours ago </div>
      </div>
      <label for="ol1gloc" class="commentText"><p>Yeh exactly this, surely the point of the POE2 atlas is the whole exploration and discovery component. You are actually traversing through space rather than just booting up a specific map. I think the undesirable in-between maps are by design.</p>
</label>
    </div>
  </label>
  
</div>

    
      
<div class="commentAndChildren">
  <input id="ol1garm" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>raphyr</div>
        <div>0 | 3 hours ago </div>
      </div>
      <label for="ol1garm" class="commentText"><p>By only offering three options, you can still provide a challenge based on rng. You might just get three shitty options, considering how many &ldquo;bad&rdquo; maps there are. Also watch Ziz&rsquo;s video on it, there&rsquo;s plenty of ways you can still make undesirable maps attractive to run (target farming for example).</p>

<p>I agree the worst thing to do would be to let players choose literally any map.</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="ol1v5jr" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Freeedo</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="ol1v5jr" class="commentText"><p>I&rsquo;m not a huge fan of the current way we are forced to run bad layouts. I also don&rsquo;t think this is the solution.  PoE2 is going heavy on the immersion with the Atlas, having a multi-choice for layouts on a node doesn&rsquo;t fit with the design imo.</p>

<p>I was thinking it would be cool to have some kind of terraforming mechanic where you discover a terraforming station or something.  Then a number of nodes around that mechanic turn it into a biome of your choosing.  You would still have to explore and it can be worked into the Atlas Tree in someway.</p>

<p>This would make it so you can avoid biomes that have maps you really dislike but not directly have it so it&rsquo;s &ldquo;Put in waystone and run the map you want&rdquo; feeling to it. Ideally, there should also be a way to skip or hop over nodes sometimes.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="ol1dpvn" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>raphyr</div>
        <div>-4 | 3 hours ago </div>
      </div>
      <label for="ol1dpvn" class="commentText"><p>Plenty of people including myself have had the idea of replacing locked-in maps with map selection based on the biome. With Ziz recently uploading a video iterating on this idea, I decided to try and visualize a basic version of this. Could include more information within the map selection button, but the UI is already big enough.</p>

<p>It&rsquo;s just one extra click before entering a map and adds agency, easily worth it to me. Could probably made to be searchable as well, so you can still light up any map you want to run on the atlas.</p>

<p>I find it amusing that this puts the name of the game to an in-game use.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="ol1jxg2" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Hardyyz</div>
        <div>0 | 2 hours ago </div>
      </div>
      <label for="ol1jxg2" class="commentText"><p>I think his video was kind of poorly timed. GGG just announced their new atlas rework and all the cool changes to their infinite atlas. He posts a video &ldquo;I dont like the infinite atlas.. so I tried to fix it&rdquo; like cmon.<br>
There&rsquo;s also 2 new ways to dodge maps you hate in 0.5 You can go to a random layout instead with the Atlas Mastery, or you can turn a node into a simulacrum instead</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="ol1l3d6" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>raphyr</div>
        <div>1 | 2 hours ago </div>
      </div>
      <label for="ol1l3d6" class="commentText"><p>With the new update you can refer to &ldquo;infinite atlas&rdquo; as the part of the end-game that opens up after you finish the &ldquo;story atlas&rdquo;. I can&rsquo;t speak for him but I&rsquo;m not personally dunking on the new endgame expansion at all, I love what they&rsquo;ve presented. It doesn&rsquo;t fix the &ldquo;infinite atlas&rdquo; portion of the endgame which comes after though, which is what I&rsquo;d love to see improved as well.</p>
</label>
    </div>
  </label>
  
</div>

    
      
<div class="commentAndChildren">
  <input id="ol1rmuy" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Spyned</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="ol1rmuy" class="commentText"><p>Tbh the new fortress before the infinite atlas looks cool and interesting but once they said you go back to the regular infinite atlas for me personally I was a little disappointed. The new changes to the actual infinite atlas don&rsquo;t seem to hit the core problem of:</p>

<ol>
<li>needing to check nodes to see what they actually are</li>
<li>not getting layouts you want/getting ones you hate.</li>
<li>bad feeling of being gated away from content you want to do now due to travel nodes.</li>
</ol>

<p>Going to another random layout(which can just be another shitty one) or turning it into simulacrum are bandaid solutions to these problems. Maybe they cooked and near the top of the new atlas tree there is some node that gives us more control.</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

</div>
