  color: #c39429;

.postTitle {
  text-decoration: none;

}

.commentAndChildren > .commentList {

}

.commentAndChildren > input:checked ~ .commentList {

}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {

  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

36% from the total tablets.<br>
32% inc from tree (the 20% chance to double didnt trigger)</p>

<p>You then get an extra 8% quant from the tablets you put in for a total of 10 + 36 + 8 which is 54% as shown.</p>
