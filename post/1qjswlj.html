       * {

*,

html {

}

input[type="checkbox"] {

blockquote {

.post {

.postLink {

}

.postLink:visited {

.postHeader {

  font-size: 24px;

.commentList {

.commentAndChildren {

.comment {

.commentText,
.commentText * {
  font-size: 38px;

  color: wheat;

.commentHeader {

  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;

.selfPostContainer * {

.selfPostImage {

}

.streamableContainer {

  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

      <label for="o1197kt" class="commentText"><p>Best in Slot for the other 2 prefixes are probably Spell damage and Global defences OR mana and INC Mana.<br>
For Suffixes Cast speed/Crit DMG.</p>

<p>Slam A perfext ex prefix with omen of catalysing and Caster Quality and hope for Spell DMG</p>

      <label for="o119apr" class="commentText"><p>Yeah. Catalyst spam. You could also desecrate if you hit cast speed/damage. But imo you&rsquo;re better off with crit chance or damage on your amulet, rather than spell damage</p>

        <div>1 | 9 minutes ago </div>
      </div>
      <label for="o119fzt" class="commentText"><p>It’s Rare, so your only currency options are Desecrates which you can only use one of, Perfect Essences, and Exalted orbs where your best option probably always is the Perfect one.</p>

<p>Your best first step is to choose what you want from Essences, which probably is Global Defence. To get this, apply a prefix targeting exalted orb, and then use a perfect Essence with the omen that makes it target prefixes. Since Spirit is fractured, the random prefix stat will change to Global Defence.</p>

<p>The only real way forward afterwards is with Breach Carapaces for consuming with Omen of Catalysation, but as you said, I have both read and experienced that Greater Exaltation does not seem to apply Catalysing to both Exalt rolls. You therefore need to go one affix at a time, and if your wanted affix cannot be qualitied, then you have either the option of rnging your way towards your wanted affixes, or choose some other stat that you can catalyze. Remember to use the suffix/prefix targeting omens for your Catalysing Exalt slams.</p>

<p>Decide what your most wanted affix is, and apply Desecrated to that (either prefix or suffix) first, but don’t reveal until last, and then you can reroll with Omen of Light + Annul until you hit</p>

<p>Glgl</p>
