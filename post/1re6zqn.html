      <label for="o7ag8rx" class="commentText"><p>Hey guys!</p>

<p><a href="https://mobalytics.gg/poe-2/profile/kalltorak/builds/bleed-werewolf-titan" target="_blank">https://mobalytics.gg/poe-2/profile/kalltorak/builds/bleed-werewolf-titan</a></p>

<p><a href="https://poe.ninja/poe2/profile/Zoia-0314/character/KallLegacyWereWolf" target="_blank">https://poe.ninja/poe2/profile/Zoia-0314/character/KallLegacyWereWolf</a></p>

<p>Shoutout to Victor for the youtube comment that inspired the build. I had quit the league but this inspired me to come back for one more build. Yes, that was a real comment that <a href="https://www.youtube.com/@Jazzarus_" target="_blank">Jazzarus </a>was narrating. Shoutout to him for the silly collab. The goal of the build was making a bleed werewolf, obvious. One of the problems with Bleed is that you normally want one big hit. Wolf attacks are fast and frequent, so we are using Crimson Assault. This makes our bleed mag 50% increased, all our bleeding is aggravated, and importantly our bleeding is 1 second duration. This makes the faster attacks of wolf actually work really well with bleed, especially pounce and cross slash. Cross Slash ends up being our main ability for delivering a big crit for bleed every 1.5 seconds.</p>

<p>I took the bleed theme a step further by making it a super fun life stacker with couture of crimson. Couture of Crimson makes your life leech overflow your life which is why it is so high. Every single piece of gear has strength and max life on it. Currently at level 98 I get over 10,000 life in maps. In sanctum I push 20k. Using instant leech with vaal pact makes me pretty damn hard to kill. By far the tankiest life stacker I&rsquo;ve played yet. For aoe we are using the standard herald of blood / herald of plague tech. All bleed builds use it because its amazing :). For mobility we are using Pounce. Weapon set 2 is loaded with Cooldown Reduction and attack and skill speed. This allows me to fly around maps with ease.</p>

<p>The most fun thing for me with the build is sanctum. Wolf dodge roll is amazing in sanctum. When you have a lot of movespeed combined with increased dodgeroll distance relics you go insanely fast, like with demon form. Currently getting 15 minute against the darkness runs and they are super easy. My small relics are all 25% increased max life and .7 increased dodgeroll distance. Since we are life stacking it puts me over 15k life making me pretty damn unkillable. Since honour scales off max life we end up with close to 20k honour. Even if you are the worst player you should be able to fart your way through sanctum runs!</p>

<p>For leveling it was good using good leveling gear xD. Can&rsquo;t promise how well it would go on league start. In terms of cost it started pretty cheap. I was clearing red maps on a 20 divine budget. It gets expensive when you do the crit swap. Getting a good phys crit talisman can be pricey. My current setup is around 2000 divine. It aint cheap getting this much life xD. It&rsquo;s pretty min max too. All my jewels are double corrupted.</p>

<p>Super fun build and the theme felt great. If you are looking for a bleed werewolf, give this one a shot!</p>

<p>Cheers!</p>
