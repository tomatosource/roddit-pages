}

.postLink:visited {
  color: #806a42;

}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;

}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

      <label for="o227wzn" class="commentText"><p>Perfect exalt for third mod and then most likely prefix desecrate, do not reveal and then fracture and pray you get the +7. From there it’s just annulment spam for t1 physical flat/percentage</p>

      <label for="o22asea" class="commentText"><p>I&rsquo;m only posting here because I try to understand it myself so let someone verify it tbh.</p>

<p>The way I understand it, it is sort of hard to make great use of this because you can not fish easily for prefixes. Also T2 attack speed is an ilvl60 mod from what I can see so whittling is kind of a non factor. I don&rsquo;t think there&rsquo;s any good way to roll for the high %phys with this, and high phys is the one mod you absolutely want it to have. The kicker is probably that you want to fracture the +7 melee skills, and that&rsquo;s best case a 33% chance. If it can go to the trash on a miss just exalt + desecreate, then fracture, if you want to still get a useful outcome then I think it goes something like this(?):</p>

<p>Sinistral necromancy + desecrate to add a prefix desecration, destral crystallization + perfect essence of haste to add last suffix and remove desecration, redo desecration (optional liege/blackblooded/sovereign depending on build). Fracture and pray it hits the +7 melee skills, 33% chance. If it does you can annul down and exalt/annul for high phys prefix.</p>

<p>If it misses I don&rsquo;t think there&rsquo;s much else to do but perfect exalt and see what happens. You can go fish with sinistral erasure/sinistral annulment but those are super expensive for a 1.5% chance to roll %phys, can easily run into thousands of divs worth of materials here. And no offense, someone who can afford that &amp; the mirror tier craft like that probably doesn&rsquo;t need to ask for help. Depending on how bad you miss / how much you need this item, you can then also just say fuck it here and chaos/annul &amp; pray until you remove the +skills, similar to the fishing above only without omens. When you&rsquo;re happy enough (maybe 1 of hybrid or flat phys) abyssal echo + reveal for a final chance to hit something good.</p>

<p>As I said I am not super experienced but there is sadly I don&rsquo;t think there is a good way to make this even a high chance craft. There is a good reason people craft these things with high %phys through perfect augs + annuls and then essence the +levels on.</p>
</label>
