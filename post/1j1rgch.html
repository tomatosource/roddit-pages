.postHeader {

.commentList {

.comment {

.commentText,

  white-space: break-spaces;

      <label for="mflsrz4" class="commentText"><p>Build link: <a href="https://maxroll.gg/poe2/pob/kd2j90ez" target="_blank">https://maxroll.gg/poe2/pob/kd2j90ez</a></p>

<p>Here is the latest incarnation of the ailments threshhold reduction Titan. Turns out you can go full meme when you get to 99% enermy ailment threshold reduction. Please note you do NOT need an Andorned for this build to work. I am using one just to skip levelling. You can get to 99% using 15 jewel slots without Adorned.</p>

<p>This build features all stars Frostbreath and Volcanic Fissure. For mapping volcanic fissure with upheaval will freeze and ignite anything it touches, triggering cast on ignite to drop comets on their head, and then explode their corpses. While the comets look flashy I think the heavy lifting is actually done by detonate dead. Comet kills the trash mobs and then DD wipes the rares. Mana sustain is solved by elemental invocation with invocated efficiency. I actually found a great video by Doth exploiting Overwhelming Presence the same way with a caster and spark, and I stole this idea from him. Please see Doth&rsquo;s excellent video for an in depth explanation of the mechanics: <a href="https://www.youtube.com/watch?v=j2g0H6QGJOY" target="_blank">https://www.youtube.com/watch?v=j2g0H6QGJOY</a></p>

<p>This build is not nearly as mana hungry as his, and you don&rsquo;t need to spam invocation. You can also solve mana by having 2% mana on kill jewels, but those magic jewels with +10% aura effects are 10+ divs each. You are probably also OK with just the maelstrom flask. I honestly forgot I had it and never used it.</p>

<p>For bossing we drop all the CoI stuff and turn into a time freeze one-shot hammer build. Change upheaval to glaciation on volcanic fissure. Lay down as many fissures as we can before the boss spawns, we can then activate all of them at once using earthquake. This allows us to almost instant freeze Xesht with a couple of hits. Now we can safely do the war cry hammer thing at our leisure. Also we get to proc frostfire, which is an insane support, probably the single biggest damage multiplier gem. We are also running +110% temporal chains aura, so the freeze will last 8+ seconds and the ignite over 20.</p>

<p>This is actually a budget build. To get to 99% ailment reduction without Adorned, use a timeloss sapphire for +24%, 13 rare jewels for +130%, 56% from Titan tree, corrupt overwelming presence to level 21, +3 prism of belief (this costs 50ex), and a +1 all skills amulet corrupt (or crown of the victor, but you lose alpha&rsquo;s howl which is huge). This will give you 32% base reduction and 210% increased for 99%. The only other expensive item is the 77% ingenuity. Honest you don&rsquo;t need it that high, I just have it from previous builds. I put this build together over the last week, alpha&rsquo;s howl was 3 divs, the amulet was 2, and then everything else 1 div or less.</p>
