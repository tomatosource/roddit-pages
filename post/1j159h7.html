      <label for="mfgy4gj" class="commentText"><p>*Not sure why the text part was not submitted but here it is again. Build utilizes the keystones of Giant&rsquo;s Blood, Blood Magic and Zealot&rsquo;s Oath.</p>

<p>Giant&rsquo;s Blood allows for the use of a 2H weapon for dmg scaling along with the use of a shield for defense, Blood Magic to not worry about mana and Zealot&rsquo;s Oath makes it so ES is semi-effectively part of of total EHP, scaling life regen &amp; using a high level grim feast along with shock siphon for sustain.</p>

<p>Life on Kill/Life leech helps to top life, so life regen is effective on regening ES. My weapon does not have life leech, just life on kill, so I wanted a ring with life leech for sustain and cast speed for temporalis; this meant in order to use max level auras I had to use an astramentis for attributes and reduced attribute requirements for my weapons.</p>

<p>For spirit I use an ATD with Cold/Spirit, to have the needed spirit for the auras I wanted to run and for damage.
Herald of ash isnt needed, more for visual flair, so Berserk, Time of Need, Herbalism &amp; Vitality or a regen Atziri can be used Instead.</p>

<p>I wanted to use Atiziri for eHP vs an Alpha Howl/Oaksworn to solve spirit, alongside a machination for resistances and rarity.</p>

<p>I have a time lost ruby @offensive stance to generate rage, life regen and for some dmg. 3x sapphires to scale ES for mapping with more eHP and for utility with chance for ailments and curse area support.</p>

<p>Build is meant to have fun during mapping and zip around but is still able to tackle pinnacle bosses. Usually bosses are down with 2 rotations of hotg ( scaled with bleed ailment), 2x casts with second wind and 1x more cast if sunder shotgunning with upheavel doesn&rsquo;t kill T4 bosses outright before 3rd hotg is up. I wanted to still have fun with bosses, so for me this is fine. Currently shield wall &amp; trampletoe with a hotg will one shot bosses if one wants to do so. Or having an ancestral warrior totem to help generate rage, armor break and stun to get a boss down in 1 rotation.</p>

<p>Build doesn&rsquo;t need temporalis or astramentis. An invictus with attributes/life or attributes res will work just fine (or a life/resistances one if just starting out, just use lower level auras) depending on what suffixes you want on the non-polci ring along with a rare amulet having melee skills, spirit, increased max ES and attributes. I like using an unset ring for the flexibility, but a breach ring for more attributes or prismatic for resistances are great as well.</p>

<p>To Zip around use shield charge and blink, both on swap set 2 to ease spirit requirements. Key factor is to use from nothing resolute technique to pick up a massive 11 notables for set 1,9 on set 2 to scale your time-lost against the darkness needs. Strength if you need attributes for conversion and weapon, Spirit if you want to use more auras, Cold for more damage, and chaos for even more damage; if one wants less auras.</p>

<p>Cold damage gained is to allow Herald of thunder to proc Herald of ice, with HoI having lightning support to start the chain recursion with herald of thunder; since stampede is used as main clear with cold infusion to start the chaining of heralds and explosions utilizing polcikern ring.</p>

<p>I do not have a PoB updated for a long time, since I am on console, short on time and just finished putting all of this together. -&amp;gt; <a href="https://www.youtube.com/watch?v=eO6iiG7-Kts" target="_blank">https://www.youtube.com/watch?v=eO6iiG7-Kts</a> example without the chase uniques, machination isnt needed either and a rare shield will work just great</p>

<p>and -&amp;gt; <a href="https://www.youtube.com/watch?v=QeMltK3lkjs&amp;t=173s" target="_blank">https://www.youtube.com/watch?v=QeMltK3lkjs&amp;t=173s</a> a build video, a general outline of what
I am doing.</p>

<p>Have fun &amp; stay sane Exiles! See you all in 0.2 ;)</p>

<p>*** p.s I always roll a warrior for any ARPG I start, the time and currency investment would be effective elsewhere on other builds (auto bomber, gemling/invoker stat stacker, etc) That said I optimized fun for me, since I fell in love with stampede since unlocking it and was rocking Giant&rsquo;s Blood at 47.</p>

<p>Warrior, and the left side of the passive tree definitely needs an overhaul along with life and armor rework. Also
why do mace skills have flat attack time and the dmg nodes are tied with reduced attack speed? The AoE from the left side passives and warrior starting area are the seemingly only positives - the ability to SLAM with mace skills and screen wipe is a trade off I suppose, but it feels imo too much given what other builds/ascendancies can do.
Hopefully when Swords and Axes are added they will have fun skills to use, Maces are slow I get it, but do they have to be that slow with the trade off on skills?</p>

<p>I&rsquo;m new to PoE and I think the heralds are cool, even if they are the only thing scaling attack builds at the moment, hopefully more auras and cool different ways are added to scale attack builds beyond the heralds and usage of HoWA.</p>
