  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/hxgkrteiuk9g1.jpeg"><p>Feedback on Minions in PoE 2: Terrain Issues and Ascendancy Fit</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/hxgkrteiuk9g1.jpeg" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="nw1tfvx" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>DrawDiscardDredge</div>
        <div>5 | 4 hours ago </div>
      </div>
      <label for="nw1tfvx" class="commentText"><p>My biggest gripe about minions is that they are continually nerfed even though they are fairly tiny part of the meta. Minions is a fun playstyle that a lot of people like and lets them relax during maps and let the minions do the killing.</p>

<p>Also, I agree the ascendancies do not work correctly. Infernalist arguably the best choice for minions should be doing fire/demon magic, which it does have but almost seems a side thing. Lich is focused on chaos damage and energy shield, this should be the minion ascendancy, and it does have someone minion nodes, but the chaos ones are just much better. Blood mage should be blood magic correctly and it is.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nw1vrp5" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Natehz</div>
        <div>3 | 4 hours ago </div>
      </div>
      <label for="nw1vrp5" class="commentText"><p>Yeah, I&rsquo;m consistently disappointed by the Lich being, clearly, intended to be <strong><em>the</em></strong> minion summoner, and yet constantly it gets outperformed in nearly every metric by numerous other ascendencies, most notably Infernalist.</p>

<p>Infernalist was my first go in 2.0 and I thought it was phenomenal, then they made all the changes to skill gems, Solar Orb became a weapon skill exclusive, minions specifically got turbo-fucked into the ground for damage and life, Raging Spirits fell off entirely, and it just kind of felt like &ldquo;Okay but why?? This was an edge niche build that barely survived in harder content.&rdquo;</p>

<p>Meanwhile LA Deadeye is sitting right there, still top tier meta-defining in every way from day 1; untouched.</p>

<p>It just feels like one more of the many reasons why players get the impression that GGG actively hates them.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nw28aia" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>5BPvPGolemGuy</div>
        <div>3 | 3 hours ago </div>
      </div>
      <label for="nw28aia" class="commentText"><p>I think that the overall problem of poe2 is that ascendancies have very little specific bonuses as well as lack a more specific identity.</p>

<p>On one hand ggg said that they dont want powerful ascendancies that sort of lock you into a type of build. On the other hand it then feels that most ascendancies have a very diminished impact on your build.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nw1zlih" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Deadedge112</div>
        <div>2 | 3 hours ago </div>
      </div>
      <label for="nw1zlih" class="commentText"><p>Not even using minions and the terrain is still the most dangerous enemy to me. I&rsquo;m using storm wave and it gets blocked by every little piece of fucking anything it&rsquo;s so hard to actually hit the mobs around abysses or essences or strong boxes&hellip; They have to fix this shit.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nw2p0ui" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>FDM_lvl</div>
        <div>1 | 33 minutes ago </div>
      </div>
      <label for="nw2p0ui" class="commentText"><p>One more thing about powerful zealots is about their thinking time before cast.</p>

<p>Every time they see enemies or get teleported to you, they need to think about 1-2 seconds before starting their casts. It feels so bad when you start ritual you need to dodge roll a few times to not being swarmed because they just don&rsquo;t start their casts.</p>

<p>Minions in general have inconsistent aggression parameter and if some of spectres would attack enemies immediately, other spectres just watching you die.</p>

<p>P.S. Elephant RF with weapon swap spam is a great build if you miss RF from Poe 1, here&rsquo;s an example <a href="https://youtu.be/_8DuXvlNL0E?si=DxwF-LiUlm3rO1on" target="_blank">link</a>. I play oracle version of it, but lich will have more dps and defence I think</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nw2rkxr" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>_Zealant_</div>
        <div>1 | 19 minutes ago </div>
      </div>
      <label for="nw2rkxr" class="commentText"><p>Lich&rsquo;s chaos explosions node is much better than you think. Enemies don&rsquo;t have to be in the presence radius, only your minions. With selfcast curses it&rsquo;s a good boost to clear speed.</p>

<p>Also, 2x jewel socket node is great, because it allows to stack extra attack speed, which is a premium stat for minion builds.</p>
</label>
    </div>
  </label>
  
</div>
