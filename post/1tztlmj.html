

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/4csbxj69ky5h1.png"><p>What in the name of god is this league performance?</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/4csbxj69ky5h1.png" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="oqdcokd" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>LG03</div>
        <div>3 | 3 hours ago </div>
      </div>
      <label for="oqdcokd" class="commentText"><p>There are like 5 posts a day about this here and as far as I&rsquo;m concerned it should be even more than that.</p>

<p>The shader problem is very significant and still needs to even be acknowledged by GGG.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="oqdb23j" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>iConcy</div>
        <div>2 | 3 hours ago </div>
      </div>
      <label for="oqdb23j" class="commentText"><p>I&rsquo;m just constantly DCing today; nothing else having issues, rebooted PC, rebooted router. Other games are fine, internet is fine. Definitely on their end, making it such a slog to play.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="oqdbtzx" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>GlazedSpam</div>
        <div>2 | 3 hours ago </div>
      </div>
      <label for="oqdbtzx" class="commentText"><p>I&rsquo;ve personally had a lot of frame drops this league, often seemingly having nothing to do with what&rsquo;s going on in the game. Fps will drop down to like 30 with no enemies on screen and stay within 10 frames of that unless I go back to character select. I could have perfect FPS in a big fight and then drop down to 10 on a boss in a separate room with no adds.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="oqdp1ur" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>ThatsALovelyShirt</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="oqdp1ur" class="commentText"><p>Enable shader caching and set it to unlimited size with Nvidia Profile Inspector Revamped and then just wait for it to finish compiling the shaders (shader bar goes down to 0). Performance should be fine after that.</p>

<p>Shader compilation takes up most of the CPU, but if you enable caching, it should only do it once (per zone, they have different shaders), and then won&rsquo;t have to do it again, even between launches. It will just quickly load the cached compiled shaders.</p>

<p>Also, disable dynamic resolution.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="oqdw2eh" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>75inchTVcasual</div>
        <div>1 | 4 minutes ago </div>
      </div>
      <label for="oqdw2eh" class="commentText"><p>Have a recommendation for best driver version? Latest ones are a disaster for me.</p>

<p>Also, is there some advantage to doing this in Inspector to do this vs the NV control panel?</p>

<p>Thanks</p>
</label>
    </div>
  </label>
  
</div>

    
      
<div class="commentAndChildren">
  <input id="oqdwcga" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>pIasticflowers | Demon Form Enthusiast</div>
        <div>1 | 2 minutes ago </div>
      </div>
      <label for="oqdwcga" class="commentText"><p>I did this already, honestly, after dying 3 times in a map and losing all experience I got today because of stupid freezes like this, I am giving up this league, screw this game.</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

        
      
    </div>
  </body>
</html>
