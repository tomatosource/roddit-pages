      <label for="owsoh6v" class="commentText"><p>Quality can be applied to rings/amulets, similar to armour/weapon quality. Quality on jewelry applies to specific stats since there&rsquo;s no base stats (like damage or armour/es) to apply to. So you use catalysts instead of an armourers scrap and you get a specific type of quality. On this ring, he&rsquo;s got mana quality, which means any mana mods get 40% increase to their value. That&rsquo;s how he&rsquo;s got over 200 mana when the top tier is like 180 max.</p>
