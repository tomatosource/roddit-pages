}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;

  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;

.selfPostContainer {

  background: #111;
  padding-bottom: 24px;
  overflow: visible;

  justify-content: center;
