

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/9avx9i81f21h1.png"><p>0.5 and companion stuff looming in the horizon, I wish wolf pack was already accessible in act 1.</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/9avx9i81f21h1.png" />

    <div class="commentList">
      
        
          
<div class="commentAndChildren">

      <label for="olqfv02" class="commentText"><p>I&rsquo;m not sold yet on spirit walker companion build. I just feel Lich minion build is still vastly superior as of now.  We&rsquo;ll see when 0.5 hits, but doing the math right now Lich just seems better, and the Raven staff won&rsquo;t add anything to it either.. maybe if they made it a sceptre.</p>

<div class="commentAndChildren">

        <div>1 | 2 hours ago </div>
      </div>
      <label for="olqgrsn" class="commentText"><p>They did say they massively buffed companion damage not sure if it will be comparable or not but catha&rsquo;s node could potentially be a big deal depending on exactly how their stats work out.</p>

<p>They&rsquo;ve also mentioned more support on the tree which can also be a big help.</p>
</label>

  </label>
  
</div>

    
      
<div class="commentAndChildren">

      <div class="commentHeader">
        <div>Only_One_Kenobi</div>
        <div>1 | 2 hours ago </div>
      </div>
      <label for="olqh4wy" class="commentText"><p>I&rsquo;m also leaning hard toward a lich minion build again. Tried shaman and djinn disciple in 0.4 and neither really impressed me.</p>

<p>I do like the idea of wolf pack though, if it isn&rsquo;t totally useless. Might pair it with cold spectres. Will see what Helmbreaker comes out with, I like his playstyle.</p>

<p>I still suspect RF staff is going to be massively disappointing.</p>
</label>
    </div>
  </label>
  
</div>

    
      
<div class="commentAndChildren">
  <input id="olqh6yn" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Faythz</div>
        <div>1 | 2 hours ago </div>
      </div>
      <label for="olqh6yn" class="commentText"><p>I have played infernalist/lich minions every patch now so I am willing to try something else.</p>

<p>If it sucks I&rsquo;ll just reroll.</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

  <input id="olqig3r" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>silversurfer022</div>
        <div>0 | an hour ago </div>
      </div>
      <label for="olqig3r" class="commentText"><p>You don&rsquo;t really have the spirit in act 1</p>
</label>
    </div>

</div>

        
      
    </div>
  </body>
</html>
