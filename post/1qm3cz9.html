

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/bx595pn0ydfg1.png"><p>Crash, crash and another crash</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/bx595pn0ydfg1.png" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="o1j1t3c" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Atomicmooseofcheese</div>
        <div>1 | 10 hours ago </div>
      </div>
      <label for="o1j1t3c" class="commentText"><p>Based on what youve said, it sounds like there is a memory leak. Do the crashes occur after you have been in session for some time or has it crashed within seconds of booting up?</p>

<p>Do you experience this with any other games?</p>

<p>You can also try changing graphics settings. My wife has a really powerful pc but experienced stutters. After she changed just a few graphics settings, the stutters vanished and she hasnt had issues.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="o1k5y47" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>EmergencyTemporary59</div>
        <div>1 | 7 hours ago </div>
      </div>
      <label for="o1k5y47" class="commentText"><p>I had the same issue with 5080. Try DDU then reinstall the graphic driver.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="o1klwi5" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Cthulhar</div>
        <div>1 | 5 hours ago </div>
      </div>
      <label for="o1klwi5" class="commentText"><p>9900X3D + 5080 @ 4k. 1000+ hours and this has never once happened to me</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="o1kqj1l" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>sips_white_monster</div>
        <div>1 | 4 hours ago </div>
      </div>
      <label for="o1kqj1l" class="commentText"><p>I have an RTX 5080 + 9800X3D and had an issue on one particular driver version where the game would constantly close to desktop (without error) especially when interacting with certain UI elements (notably the gem setup UI). I&rsquo;m no longer having these crashes on the latest driver from NVIDIA however (591.74 game-ready version). I&rsquo;m also on Vulkan since DirectX will always crash with the cogwheel screen.</p>

<p>I should also mention I used DDU to uninstall the old driver in Windows Safe Mode (which is what DDU recommends) and enabled the option that prevents Windows from auto-installing a new driver, so that I could immediately install the latest driver manually on reboot. I later also disabled my 9800X3D&rsquo;s iGPU in the BIOS but I don&rsquo;t think that was necessary (but I did it anyway).</p>

<p>You could potentially also try deleting all the game cache as it may be corrupted, it should be located at:</p>

<p><em>C:\Users\xxxxxx\AppData\Roaming\Path of Exile 2</em></p>

<p>Look for &ldquo;ShaderCacheVulkan&rdquo; and &ldquo;ShaderCacheDirectX&rdquo; and delete them. Note that deleting the cache means your load screens will be longer for a while, and your CPU will be working hard to rebuild the cache while you&rsquo;re playing which will cause FPS lag and high CPU utilization. This will go away over time as cache is rebuilt.</p>

<p>Also what is the Windows Event Viewer (just type &ldquo;Event Viewer&rdquo; in search and you&rsquo;ll find it) saying after a crash?</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
