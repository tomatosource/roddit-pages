

<html>

    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>

<div class="commentAndChildren">

      <div class="commentHeader">
        <div>Used-Equal749</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="nux95gv" class="commentText"><p>Sekhema is a knowledge mechanic. If you understand the mechanic, you&rsquo;ll be able to do it easily on just about any archetype. Melee/ranged/minion, doesn&rsquo;t really matter.</p>

<ul>
<li>You should ideally be comfortable in any room type, but gauntlet is typically the most difficult for newer players to tackle as there&rsquo;s just more things you need to pay attention to.</li>
<li>You want to make sure you avoid any paths that force you into a single room. That can often screw you up, especially as you&rsquo;re gearing up still.</li>
<li>You want to focus on Sacred Water for the first 2 floors (3 if you&rsquo;re run isn&rsquo;t going great). Everything else is secondary.</li>
<li>You want to avoid any affliction that removes control from you. So anything that &ldquo;Gives you a random affliction when you X&rdquo; &ldquo;Takes you to a room you may not select&rdquo; &ldquo;Afflictions are unknown&rdquo;. The room type and rewards one is less serious but can be annoying for players still learning the mechanic.</li>
<li>You can dodge roll through all the fire traps.</li>
<li>As you push floors 3 and above, you&rsquo;ll want to get at least 75% honour resistance in your relics. This isn&rsquo;t necessary for the first floor, and will help you on the second floor. Melee already has a built-in honour resistance and this will be in addition to that inherent honour resistance.</li>
</ul>
</label>
