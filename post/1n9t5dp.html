

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/pnap17r7vhnf1.png"><p>Okay GGG, can we fix this already?</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/pnap17r7vhnf1.png" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="ncp4g4i" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>OldBay-Szn</div>
        <div>5 | 3 hours ago </div>
      </div>
      <label for="ncp4g4i" class="commentText"><p>I’ve never died from the gears but I had the gears so much It puts me off from playing it. Anyone reading this know what causes this? I noticed it will randomly freeze ONLY poe2 and I can move my mouse, click on other programs with 0 issue and then it’ll unfreeze and show the gears.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="ncpfs5e" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>FrederickWillem</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="ncpfs5e" class="commentText"><p>It&rsquo;s an NVidia only issue that has haunted them from the start. In 0.<sup>1</sup>&frasl;<sub>0</sub>.2 the game had a lot of crashes which they were unable to solve in these cases. Their fix was to start up a new client in the background which takes over when the first one crashes. The result is this, preventing an all out crash but causing a loss of map data and taking quite some time. Sometimes even killing the player. It&rsquo;s most likely related to the game overloading shaders and the GPU not being able to handle it.</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="ncp5cr8" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>MindTrix91</div>
        <div>3 | 3 hours ago </div>
      </div>
      <label for="ncp5cr8" class="commentText"><p>Just let us go back into an area after we die there.</p>

<ol>
<li><p>To get revenge on what killed you (satisfying)</p></li>

<li><p>To collect loot you EARNED for a several-minute boss fight</p></li>
</ol>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="ncp90lc" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Vagaqt</div>
        <div>3 | 3 hours ago </div>
      </div>
      <label for="ncp90lc" class="commentText"><p>Fix what exactly? You run out of portals.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="ncp9o0x" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Send_Pupper_Pics_Pls</div>
        <div>4 | 3 hours ago </div>
      </div>
      <label for="ncp9o0x" class="commentText"><p>The game will freeze for a couple seconds and bring up the gears spinning but the map will still be active. I died to something I couldn’t even see and pausing did not pause the game. This happens on a regular basis.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="ncpaa5v" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Vagaqt</div>
        <div>1 | 2 hours ago </div>
      </div>
      <label for="ncpaa5v" class="commentText"><p>Please forgive my ignorance, I haven’t noticed the cogwheels and the red background first.
This happened to me a few times when I ported from
checkpoint to checkpoint. I just alt+f4 out every time this happens. I don’t mind the deaths, but these loading screens could take up to a couple minutes.
I run the game on GeForceNOW, so decently good pc specs as well.</p>
</label>
    </div>
  </label>
  
</div>

    
      
<div class="commentAndChildren">
  <input id="ncpc5xc" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>jgraae</div>
        <div>1 | 2 hours ago </div>
      </div>
      <label for="ncpc5xc" class="commentText"><p>Had this skit, but haven’t since switching to vulkan renderer. Heard people having success switching either way, maybe try and change whatever you currently have</p>
</label>
    </div>
  </label>
  
</div>

    
      
<div class="commentAndChildren">
  <input id="ncpfvmv" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Bear_Unlucky</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="ncpfvmv" class="commentText"><p>Strange when that happens the game pauses for me until I can interact with the game again. In general they need to fix the performance issues</p>

    </div>
  </label>
  
</div>

    
  </div>
  
</div>

</div>

  </body>
</html>
