      <label for="oqur17p" class="commentText"><p>From Chris Forsberg:</p>

<p>It’s not even officially summer and Boston Celtics coach Joe Mazzulla is piling up the frequent flier miles in his relentless offseason quest to be near his players.</p>

<p>During the first week of June, Mazzulla was spotted in both Omaha, Nebraska, and Lisbon, Portugal, while supporting Baylor Scheierman and Neemias Queta, respectively. That’s roughly 4,400 air miles between the two spots &ndash; with no direct flights &ndash; and is only the start of Mazzulla&rsquo;s worldwide travels aimed at nurturing relationships. </p>

<p>For Mazzulla, that shared time is key to getting the Celtics where they want to go next. And that wild itinerary reminded us of something poignant that president of basketball operations Brad Stevens told us right before the 2025-26 season. </p>

<p>&ldquo;I had a guy that has been around [Mazzulla] working out &ndash; he&rsquo;s been here doing individual work and small group work for a couple of weeks &ndash; and he just said, ‘That guy can say anything to me because of the amount of time he spends with me,&lsquo;&rdquo; Stevens said. &ldquo;And I think that that speaks to &ndash; you have to build a relationship, you have to get to know people. </p>

<p>&ldquo;You just don&rsquo;t get to throw a whistle around your neck and wear a shirt that says, ‘Coach&rsquo; and just be able to coach people. You have to really learn to meet them where they are and then hopefully motivate them, or find the intrinsic motivation and motivate them to use their strengths.&rdquo;</p>

<p>For Mazzulla, that trust begins with trying to find out what makes a player tick and often examining the roots of their NBA journeys.</p>

<p>In previous summers, Al Horford marveled at Mazzulla’s willingness to <a href="https://www.nbcsportsboston.com/nba/boston-celtics/joe-mazzulla-motivation-killer-whales/659477/" target="_blank">trek to the Dominican Republic</a> to help run basketball camps after Boston’s championship season. When offseason signee Chris Boucher mentioned last year that he was returning to Montreal to be baptized, Mazzulla excitedly asked if he could attend.</p>

<p>While the outside world tends to focus on Mazzulla’s unique personality and the odd ways he choses to motivate himself and his team, his players have bought in largely because of his old-fashioned relationship building.</p>
