    <h2>
      <a class="postTitle" href="https://blogs.fangraphs.com/what-are-teams-paying-for-a-win-in-free-agency-2026-edition/"><p>What Are Teams Paying For A Win In Free Agency? 2026 Edition</p>
</a>
    </h2>

    

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="o7591on" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>futhatsy | New York Mets • Durham Bulls</div>
        <div>4 | 3 hours ago </div>
      </div>
      <label for="o7591on" class="commentText"><p>TL;DR: in 2026, teams paid <span class="math inline">\(11.23M per WAR. But when you look at it split out by bench players (projected for 0-1 WAR), role players (projected for 1-2 WAR), and everyday starters (projected for 2+ WAR), bench players were paid \)</span>6.74M per WAR, role players were paid $8.51M per WAR, and everyday starters were paid 12.84M per WAR. And the gap between these tiers has been widening over time.</p>

<p>This suggests that teams to not believe the relationship between salary and WAR is linear, which I think is important to keep in mind moving forward when analyzing free agent contracts. I saw a lot of takes out there this off-season that the Dodgers and Mets &ldquo;overpaid&rdquo; for Tucker and Bichette based on a linear $/WAR framework, but it&rsquo;s clear that isn&rsquo;t how teams actually value these players and contracts.</p>
</label>
    </div>
  </label>
