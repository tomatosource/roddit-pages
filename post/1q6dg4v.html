

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/bdxdu2e12xbg1.jpeg"><p>How should I proceed with this quarterstaff ?</p>
</a>

        <div>1 | 4 hours ago </div>
      </div>
      <label for="ny75xr0" class="commentText"><p>If it doesn’t hit the plus 7, it either hit a dead affix or the lightning, assuming you desecrated so you have a <sup>1</sup>&frasl;<sub>3</sub> chance to hit skills.</p>

<p>If it hits lightning, it would be way too expensive to try and craft.</p>

<div class="commentAndChildren">
  <input id="ny76oyv" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>croupstont</div>
        <div>1 | 4 hours ago </div>
      </div>
      <label for="ny76oyv" class="commentText"><p>I see. And to make it rare, is it better to use attack speed essence or crit ?</p>

      <div class="commentHeader">
        <div>Double_Phase_4448</div>
        <div>2 | 4 hours ago </div>
      </div>
      <label for="ny78yy2" class="commentText"><p>In my opinion? You should use crit essence. I believe you can suffix desecrate Amanamu into getting attack speed. That then leaves you though with Yolo prefix perfect exalt slamming and pray.</p>

</div>

</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="ny8954k" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>emulicker</div>
        <div>1 | 33 minutes ago </div>
      </div>
      <label for="ny8954k" class="commentText"><p>With +7 it’s harder to deterministically craft since you don’t use perfect essence of battle. But you can use greater essence of abrasion to get flat phys. Desecrate suffix and fracture. If you hit +7 you can use perfect essence of abrasion or perfect essence of haste with sinistral crystallization for gain phys or onslaught which removes the desecration. Then desecrate prefix or suffix depending on what you are targeting and roll for the mod you want (may get expensive). Last 2 slam sis a yolo slam. You can also use both abrasion and haste for one exalt slam but you lose the ability to get % phys</p>

</div>

        
      
    </div>
  </body>
</html>
