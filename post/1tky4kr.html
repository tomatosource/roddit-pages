

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/ilfd9egbmr2h1.png"><p>I&rsquo;m on to you GGG</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/ilfd9egbmr2h1.png" />

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="onbx8zy" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Im_a_rahtard</div>
        <div>4 | an hour ago </div>
      </div>
      <label for="onbx8zy" class="commentText"><p>How does making it faster nerf Hollow Form?</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="onby97u" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Able-Corgi-3985</div>
        <div>9 | an hour ago </div>
      </div>
      <label for="onby97u" class="commentText"><p>Hollow Form ignores +added attack time modifiers which is why you can summon more clones before the clone finishes the long attack animations. </p>

<p>Basically you can abuse the high damage multipliers on slow skills that you&rsquo;d never use yourself. Lowering the +attack time doesn&rsquo;t change how fast you summon clones, and you just take the damage nerf.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="onc08hf" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Santi-Emite | Acolyte of Xesht copium</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="onc08hf" class="commentText"><p>I don;t think it is like that.<br>
If + attack time would be skipped, the Vaulting Impacts and Whirling Assaults would be near instantaneous .<br>
More Clones summon is costing Power Charges and that;s it.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="onc1i2k" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Able-Corgi-3985</div>
        <div>1 | 43 minutes ago </div>
      </div>
      <label for="onc1i2k" class="commentText"><p>Why would it be instantaneous? Whirling assault has a .85 penalty on top of the .7 penalty from Hollow Form. Even with a GG 1.9 aps weapon and +100% attack speed you are only summoning clones every 0.44 seconds. </p>

<p>Look at the video again and watch how fast 9 clones doing whirling assault comes out on a boss. It makes no sense unless the +1 second isn&rsquo;t being applied to the summon interval.</p>

<p>Ignoring the +added attack time for clone summons doesn&rsquo;t mean you ignore the baseline attack time. You can see this difference extremely clearly when they show it being used with Lunar Assault.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">

        <div>1 | 20 minutes ago </div>

      <label for="onc5cq8" class="commentText"><p>Ok i misunderstood what you meant then, we&rsquo;re cool brother!</p>

  </label>
  
</div>
