

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/us0jat78pi7f1.png"><p>Feels like I got hella lucky with this one&hellip;</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/us0jat78pi7f1.png" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="myalcli" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Grunvagr</div>
        <div>1 | 27 minutes ago </div>
      </div>
      <label for="myalcli" class="commentText"><p>Please show the range stats can roll (holding Alt or whatever it is on console).  For the average player, we don’t know just how nasty this is.</p>

<p>Nice drop!</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="myamj2t" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Chewfeather</div>
        <div>1 | 22 minutes ago </div>
      </div>
      <label for="myamj2t" class="commentText"><p>Morior Invictus drops with three &ldquo;+# ______ per socket filled&rdquo; traits, but they&rsquo;re not always the same ones. They can be stuff like reduced critical damage bonus against you or loge regen or stun threshold. Then on top of that they can have low rolls.</p>

<p><a href="https://poe2db.tw/us/Morior_Invictus#MoriorInvictusModifiers" target="_blank">https://poe2db.tw/us/Morior_Invictus#MoriorInvictusModifiers</a></p>

<p>So it&rsquo;s the combination of decent traits and decent rolls.</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="myanbwn" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Obvious-Jacket-3770</div>
        <div>1 | 19 minutes ago </div>
      </div>
      <label for="myanbwn" class="commentText"><p>By the Lord&rsquo;s of Kobol&hellip; That global defense would make me a cylon sympathiser.</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
