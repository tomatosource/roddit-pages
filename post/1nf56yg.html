

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://www.reddit.com/r/PathOfExile2/comments/1nf56yg/can_we_get_rid_of_delirium_fog_and_music_now_its/"><p>Can we get rid of Delirium fog and music now ? It&rsquo;s getting old</p>
</a>
    </h2>

    
    <div class="selfPostContainer">
      <p>Delirium mechanic and juicing is fine. Just let us see the real game and listen to other music.</p>

    </div>
    

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="ndtrpbw" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Blackbird_V</div>
        <div>1 | 35 minutes ago </div>
      </div>
      <label for="ndtrpbw" class="commentText"><p>Honestly I may sound entitled, but I do not want to wait until next league for this to be even potentially addressed. This should be changed ASAP.</p>

<p>They made a beautiful game with amazing graphics, all to be wasted by grey fog and DO DO DO DO DO DO DO DO DOOOO, DUN DUN DUN DUN DUN DUN DUN DUUUN <em>WHISPER</em> <em>WHISPER</em> <em>KILL THEM</em> DUN DUN DUNG DUN DUN DUN DUN DUUN&hellip;</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="ndtylyl" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>ProfessionalCheese41</div>
        <div>1 | 3 minutes ago </div>
      </div>
      <label for="ndtylyl" class="commentText"><p>Yeah, the new beautiful maps are actually really nice, to bad they are covered in gray ooze most of the time.</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="ndtrqqs" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>WhiteLanternDarkClaw</div>
        <div>1 | 35 minutes ago </div>
      </div>
      <label for="ndtrqqs" class="commentText"><p>I kind of like it, but it does get old. I think this will naturally be less of a problem as more ways to juice are introduced, but I suppose there&rsquo;s an argument that giga-juicing will always also include delirium unless the strategy explicitly blocks it, so maybe they do need to do something about the visuals/music.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="ndtwnd9" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>_Vastus_</div>
        <div>1 | 12 minutes ago </div>
      </div>
      <label for="ndtwnd9" class="commentText"><p>I might be in the minority here, but I kind of like the creepy vibe it gives. I&rsquo;ll instill waystones for non-delirium maps too.</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
