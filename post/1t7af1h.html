

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/k02r05awgxzg1.jpeg"><p>My Favorite Part of the Livestream</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/k02r05awgxzg1.jpeg" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">

    <div class="comment">
      <div class="commentHeader">
        <div>GulliasTurtle</div>
        <div>1 | 33 minutes ago </div>
      </div>
      <label for="oknlc6z" class="commentText"><p>I suspect that is going to be the biggest bait of the league. People love RF and are going to want to do it, but this thing is an endgame boss drop. You cannot start expecting to have this until people have the late game bosses on farm. Especially if we don&rsquo;t know the drop rate.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="oknot0p" type="checkbox" checked/>

      <div class="commentHeader">
        <div>SeaSharpModHer</div>

      </div>
      <label for="oknot0p" class="commentText"><p>I&rsquo;ll just get carried by my big boss gorilla and farm it myself :3</p>
</label>
    </div>
  </label>
  
</div>

    
      
<div class="commentAndChildren">
  <input id="oknre7s" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Nekrofancy</div>
        <div>1 | 6 minutes ago </div>
      </div>
      <label for="oknre7s" class="commentText"><p>I&rsquo;m still excited to try it regardless! But it&rsquo;s a pretty rough tradeoff from using Scepter+shield for minions.</p>

<p>You miss out on +minion levels from a scepter, and defenses from a shield, and even despite the spirit reservation efficiency the lack of spirit from a scepter will hit hard.</p>

<p>So the staff needs to be good enough to justify all that, which is a hard ask.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="oknseu2" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>GulliasTurtle</div>
        <div>1 | a minute ago </div>
      </div>
      <label for="oknseu2" class="commentText"><p>I need to stop playing it literally every league, but it seems perfect for Unearth. You aren&rsquo;t super spirit hungry since you want the cheapest minions you can (losing skelly warriors hurts but you should still be able to get enough reavers). Then you&rsquo;re in aoe range to be casting Unearth anyway and can double dip on the minion damage.</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

</div>

      <div class="commentHeader">
        <div>thechosenone8</div>
        <div>1 | 14 minutes ago </div>
      </div>
      <label for="oknpicw" class="commentText"><p>cant wait to get to lv 84 to try this</p>

    </div>

</div>

        
      
    </div>
  </body>
</html>
