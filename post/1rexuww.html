      </div>
      <label for="o7hg18b" class="commentText"><p>Just extremely bad luck. As some people recommended, try placing as many commanders as possible in the middle. I might be wrong, because after all it&rsquo;s all rng, but in my experience commanders have the highest chance to drop room medallions.</p>

<p>Just don&rsquo;t give up. I was building my temple for almost two weeks of extreme grinding, and yesterday I finally placed the last room. It was extremely satisfying.</p>

<p>I also recommend that you try to kill the architect and atziri as often as possible for some extra div&rsquo;s. (Make sure you have the locks to protect your main chains and ignore the rest). The architect ALWAYS drops a medallion even if it&rsquo;s not always the one you need. (I think I dropped the exceptional sacrificial regalia 5 times while building the temple)</p>

<p>You can always put him in his place later, just make sure not to build loops because of him. I literally killed him and atziri up to the point where I had 70+ rooms. At that point he had nowhere else to go except the spot in the middle.</p>

<p>Edit: hint: make sure to upgrade all your legion barracks, smithies, and later the alchemy labs to lvl 3 before you upgrade all the rest, because at lvl 3 they all get a chance to drop locks as well. Spymasters can drop locks at any level.</p>
