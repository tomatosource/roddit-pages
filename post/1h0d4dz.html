      <label for="lz2uaeb" class="commentText"><p>From <a href="http://Globe.com" target="_blank">Globe.com</a></p>

<p>By Gary Washburn</p>

<p>In the opening minute Monday at TD Garden, Jayson Tatum dribbled left, sucked in two defenders, and then flipped a behind-the-back pass to Kristaps Porzingis, just standing there beyond the 3-point line.</p>

<p>From about 26 feet, Porzingis flipped a jumper that swished through the hoop for his first basket of the season.</p>

<p>The Celtics have been playing shorthanded and limited through the first 17 games, their offense running on six of eight cylinders. But Porzingis’s return unlocks so many aspects of their offense.</p>

<p>He gives them more of a defensive presence and the Celtics are now whole. A team that was top 2 without Porzingis is now No. 1 with him, and the Los Angeles Clippers never stood a chance <a href="https://www.bostonglobe.com/2024/11/25/sports/celtics-kristaps-porzingis-returns/?p1=Article_Inline_Text_Link" target="_blank">in a 126-94 Boston win at TD Garden</a>.</p>

<p>Not only were the Celtics running plays they hadn’t all season, they were playing with a freeness and comfort not seen since last season.</p>

<p>Without Porzingis, the Celtics are still good enough to win the East and reach the Finals. With him, they are the favorites.</p>

<p>Porzingis scored 16 points with 6 rebounds and 2 blocked shots in 22 minutes, 37 seconds. His season debut after missing the first 17 games because of ankle surgery couldn’t have transpired any better.</p>

<p>He protected the rim. Took some shots — and gave some also — against Clippers burly center Ivica Zubac, and his floor-spreading brought another element to the Boston offense.</p>

<p>The Celtics’ second period was a masterpiece. They scored 51 points with a record 12 3-pointers and 70.8 percent shooting, building a 29-point halftime lead against a team that had beaten the Philadelphia 76ers by 26 points the night before.</p>

<p>All of those threes weren’t a byproduct of Porzingis’s presence, but there is no coincidence that one of the Celtics’ most dominant offensive performances occurred with him on the floor.</p>

<p>“When I’m out there, I can create more space; this is the obvious stuff,” he said. “My shooting ability creates more space. Rim protection, I wanted to bring that and make sure we’re at a good level there.</p>

<p>“Honestly just play my game. These guys were looking for me early to try to get me going as they always are. Just grateful to be back out there.”</p>

<p>Porzingis scored six buckets — a 3-pointer, putback, two lobs, a midrange jumper, and a driving dunk. His teammates were constantly seeking him for easy baskets or using his spacing ability to score on their own.</p>
