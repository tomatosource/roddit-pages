

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/gujqe1mau8ve1.png"><p>Atlas progression too grindy</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/gujqe1mau8ve1.png" />

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="mngjvt5" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>DragonflyThen4398</div>
        <div>4 | 3 hours ago </div>
      </div>
      <label for="mngjvt5" class="commentText"><p>Agreed, to grindy and boring, by the time I get to a few maps I decide to start a new build because of the process to even get to t15s lol, endgame is not cutting it for Poe 2, guess I’m trying to say map progression is terrible, I prefer the Poe 1 map progression</p>
</label>

  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="mngo1ab" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>k1ck_DarkAngel</div>
        <div>0 | 2 hours ago </div>
      </div>
      <label for="mngo1ab" class="commentText"><p>And its not a build problem, i&rsquo;ve been doing T15/16 maps since day 3-4  with my 1st character cause i did Amazon poison Crossbows for league start and then swapped to Lightning Spear when was found it was OP.</p>

<p>Was able to do T15 while i had 2-4 points on my atlas, and thats just makes it feel BAD, farming 8-10 maps to get 1-2 exalts maybe, even with some rarity on gear, 30-50%</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="mngq55e" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>DragonflyThen4398</div>
        <div>2 | 2 hours ago </div>
      </div>
      <label for="mngq55e" class="commentText"><p>In short they have to increase loot rates…. One thing I never understand about game which are sequels to their best are why change up the entire game when people are already happy with the original, like all the devs and the “vision” should have copy/pasted the original code and mechanics we had, revamp the mobs with new textures and such and release the game but nooo lets input all ideas players hated from Poe 1 and put them into this game, and we’ll see how many players like these new mechanics. They are doing a 1 step forward 2 steps in the wrong direction or however you want to put it…. Poe 2 will be getting dropped by me likely they fully release it</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="mngr9mo" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>k1ck_DarkAngel</div>
        <div>2 | 2 hours ago </div>
      </div>
      <label for="mngr9mo" class="commentText"><p>There&rsquo;s still loads of time to pivot from jonathan&rsquo;s slow/grindy/combo vision and maybe let Mark take the reigns because clearly there&rsquo;s great bones in the game it just needs to be made for having fun instead of being made to make players feel pain mostly, since everything a struggle to progress.</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

        <div>1 | an hour ago </div>
      </div>
      <label for="mngspa0" class="commentText"><p>well you jumped to t15 and skipped all the tiers with an op build, you have to do a bit of catching up, you got 144 hrs in and can&rsquo;t spend 10 hrs to progress through the entire atlas map skill tree? that&rsquo;s assuming 15 maps per corruption node at 2-3 mins per map which if you just go for the corruption nodes it&rsquo;s definitely less then that.</p>

</div>
