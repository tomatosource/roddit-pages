

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/ivmxg36n139g1.jpeg"><p>Anybody else having problems with abyss not spawning the monsters to finish activating the abyss?</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/ivmxg36n139g1.jpeg" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="nvo3p7c" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Fury_Fury_Fury</div>
        <div>1 | 35 minutes ago </div>
      </div>
      <label for="nvo3p7c" class="commentText"><p>That happens to me too, albeit rarely. Maybe one of ten abysses fails to activate.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="nvo602b" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>IMDENVER</div>
        <div>1 | 18 minutes ago </div>
      </div>
      <label for="nvo602b" class="commentText"><p>Same</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nvo57d3" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>No_Raisin_8387</div>
        <div>1 | 24 minutes ago </div>
      </div>
      <label for="nvo57d3" class="commentText"><p>Welcome to the infamous abyss bug, it exists in poe1 aswell but you notice it way less since you can choose what maps you play. TLDR is that the spawn logic bugs out because they are close to the wall on one side and then have no more spawnable &ldquo;space&rdquo; around as there is already cracks in the vicinity.</p>

<p>In poe1 you generally run quite open maps or maps were the abyss cant overlap itself, however in a certain kind of endgame content (valdo maps) you cant choose map which makes the abyss mod quite revered as it can bug out if you are unlucky, i have lost many divines from it bugging out in a map. (Valdo maps are maps with special mods that can become insanely hard that grant unique item like headhunter upon completion, one for example is &ldquo;complete all the abysses&rdquo; which makes you unable to claim the reward if it bugs out.)</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
