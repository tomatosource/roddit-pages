

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://youtu.be/HQqyN6HIMho?si=nEZ4AJ4claeAH3vq"><p>Wilt Chamberlain vs Arnold Schwarzenegger in the 1984 film “Conan the Destroyer”</p>
</a>
    </h2>

    

    <div class="commentList">
      
        
          
<div class="commentAndChildren">

    <div class="comment">
      <div class="commentHeader">
        <div>Horns8585 | Mavericks</div>
        <div>5 | 3 hours ago </div>
      </div>
      <label for="niszth0" class="commentText"><p>It&rsquo;s funny how they handled the editing in the scenes with Wilt and Arnold. Arnold was supposed to be the imposing and dominant hero, but he is only 6&rsquo;2&rdquo;, and Wilt was 7&rsquo;1&rdquo;. They used some careful camera angles and editing, so that they didn&rsquo;t make Arnold look tiny compared to Wilt. To give you an idea of how big Wilt actually was, compared to Arnold, here is a picture. This was on the set of the movie&hellip;..Oh, and Andre the Giant was in the movie, too!</p>

<p><a href="https://imgur.com/a/HcEmycL" target="_blank">https://imgur.com/a/HcEmycL</a></p>
</label>

      </div>
      <label for="nit93nc" class="commentText"><p>I don&rsquo;t care what anyone says about eras. Wilt Chamberlin was probably the best athlete to ever play in the NBA. His feats of strength are legendary and he was 7&rsquo;2 300 pounds but could run like a deer. He also had some crafty moves around the basket. Definitely not the plumber type. He could dominate in any era.</p>
</label>
    </div>
  </label>

  <input id="nit9ym5" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Horns8585 | Mavericks</div>
        <div>2 | an hour ago </div>
      </div>
      <label for="nit9ym5" class="commentText"><p>I agree. He was so physically dominant and he had elite basketball talent. He could have done that in any era.</p>

    </div>
  </label>
  
</div>

    
  </div>
  
</div>

</div>

  <input id="nitecu8" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>BandOfDonkeys | Pistons</div>
        <div>4 | an hour ago </div>
      </div>

    </div>

  </body>
</html>
