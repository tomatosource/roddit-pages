

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>

<div class="commentAndChildren">

      <div class="commentHeader">
        <div>Jimbob3498 | Bucks</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="o6ooaw3" class="commentText"><p>These are the kinds of plays we&rsquo;ll need to see more of if Paolo is gonna become elite - driving hard to the rim. He has the skill and strength to do this (which is part of people&rsquo;s frustrations with him taking so many midrangers, he&rsquo;s not a good shooter). Lack of spacing on the Magic has hurt this part of his game though tbf.</p>

<p>He&rsquo;s taking 15.7 shots a game this year, with <a href="https://www.nba.com/stats/players/shooting?DistanceRange=By%20Zone&amp;dir=D&amp;sort=Restricted%20Area%20FGA" target="_blank">5.3 in the restricted area</a>. Giannis leads the league at 10.9 shots in the restricted area for context, on 16.2 shots per game. Tbf to Paolo the proportion of shots he&rsquo;s taking there has improved this year, but I&rsquo;d love to see him get up to 7 shots in the restricted area per game, like Jalen Duren. I think he has the tools for that.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">

        <div>1 | 43 minutes ago </div>
      </div>
      <label for="o6oul1v" class="commentText"><p>Look at the way he made this shot. Nobody makes shots like these consistently. He simply doesn’t have the explosiveness to get easy shots at the rim and he’s a poor shooter.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">

    <div class="comment">
      <div class="commentHeader">
        <div>Jimbob3498 | Bucks</div>
        <div>1 | 27 minutes ago </div>
      </div>
      <label for="o6ox3db" class="commentText"><p>I’m more thinking about the pressure rather than a shot like this specifically, but yeah he can’t do this all the time.  I do worry about his lack of explosiveness coupled with his shot though. </p>

<p>Might just need to completely reinvent himself if he can’t improve on either his rim pressure or his shooting. He does have some tools that could become useful in a secondary role (rebounding, passing). Needs to become a better defender too though.</p>
</label>
