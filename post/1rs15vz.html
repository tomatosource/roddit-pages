      <label for="oa3jset" class="commentText"><p>From Chris Forsberg:</p>

<p>A few minutes before the ejection that stole the spotlight of the Celtics-Spurs showdown, Jaylen Brown calmly dribbled out of an impending corner trap with Victor Wembanyama racing his way, then patiently examined the floor before feeding Sam Hauser for a straightaway 3-pointer.</p>

<p>It was Brown’s seventh assist in little more than 10 minutes of floor time. Brown had fed five different teammates with those helpers and was fueling Boston’s early offense with his combination of scoring and playmaking.</p>

<p>Overshadowed by his scoring output in the absence of Jayson Tatum, Brown has leveled up as a playmaker in recent weeks and is confidently making all the right reads on the floor.</p>

<p>For all the consternation about shot distribution and how the offense would run upon Tatum’s return from a nine-plus-month absence, Brown’s playmaking numbers have spiked both before and after Tatum’s season debut. Over the two-and-a-half games he’s been available with Tatum back in the lineup, Brown is averaging 7.3 assists per game leading to 19.3 assist points created per game.</p>

<p>If maintained for the season, that potential assists mark would rank just outside the top 20 in the entire NBA, while the assist points created would slot in the top 10. For a comp: Luka Doncic generates 21.2 assists points per game on 8.5 assists (and 14.0 potential assists) this season.</p>

<p>Teammates&rsquo; shooting percentages off Brown feeds over the last three games are rather astounding: Boston players are shooting 58.1 percent off Brown passes in that span. The biggest beneficiary has been Derrick White, who is 5-for-7 (71.4 percent) off Brown feeds in those games.</p>

<p>Take out Tatum (1-4 FG off Brown passes) and Payton Pritchard (4-10 FG on Brown passes) and the rest of Boston’s roster is shooting 69 percent (20-for-29) off Brown feeds in those games.</p>

<p><a href="https://www.nbcsportsboston.com/nba/boston-celtics/jaylen-brown-passing-stats-jayson-tatum-return/775804/" target="_blank">Read more here</a>.</p>
