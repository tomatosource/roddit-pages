      <label for="neqfuq6" class="commentText"><p>Derrick White defending the 3:</p>

<ul>
<li>DFGA: 5.5 per 36</li>
<li>Opponents shot 5.3% worse on 3&rsquo;s defended by White (14th in the NBA)</li>
</ul>

<p>Payton Pritchard defending the 3:</p>

<ul>
<li>DFGA: 4.5 per 36</li>
<li>Opponents shot 4.9% worse on 3&rsquo;s defended by Pritchard (19th in the NBA)</li>
</ul>

<p>Jaylen Brown defending the 3:</p>

<ul>
<li>DFGA: 5.6 per 36</li>
<li>Opponents shot 3.8% worse on 3&rsquo;s defended by Brown (31st in the NBA)</li>
</ul>

<p>The good news for our defense is that these were our 3 best players at defending the 3 point line last year. We may have lost a lot of our paint protection and rebounding, but hope remains on the perimeter.</p>

<p>Good news in terms of paint protection is that Queta defended more shots per 36 within 6 feet of the basket than Kornet and Porzingis. However, Kornet and Porzingis were the best in the league at making players shoot worse against them. Queta is good, but not elite like they were.</p>
</label>
