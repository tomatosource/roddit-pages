

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://youtube.com/watch?v=PiAJ5Lz1Vfk"><p>Windhorst ranks the Partizan - Red Star game experience as his top 3 of all time.</p>
</a>
    </h2>

    

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="nu8a7fv" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>sewsgup</div>
        <div>10 | 3 hours ago </div>
      </div>
      <label for="nu8a7fv" class="commentText"><p>so i caught the end of this game after the post on this subreddit letting us know it was getting streamed for free</p>

<p>and Jordan Nwora actually blew this game for Red Star. they had a 1 pt lead in the final minute, but then Duane Washington Jr just freezes him on a crossover pullup that Nwora doesnt even get a hand up to contest.</p>

<p>then Nwora misses a 3, it goes off Partizan so they have another shot. but Nwora does a behind the back dribble move into traffic and just turns over the ball. so he then he&rsquo;s forced to intentionally foul and now Red Star go from up 1, to down 3. and eventually lose the game.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nu8js0g" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>kostajepaosmosta</div>
        <div>7 | 3 hours ago </div>
      </div>
      <label for="nu8js0g" class="commentText"><p>We Europeans know that Euroleague will probably never be NBA by talent not even close  but we love it diffrently, to us it doesnt metter. Its the culture, the rivalies that go beyond the court or press conferences.</p>

<p>Partizan v Crvena Zvezda is called an &ldquo;eternal derby&rdquo;because since the beggining they have been competing in every sport possible, every year for 80+ years. </p>

<p>You know when uncles have those weird questions about women when you are younger. Well in Serbia the first question they would ask are not those it is &ldquo;Partizan or Zvezda?&rdquo;. </p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nu8uggv" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>greatGoD67 | Spurs</div>
        <div>4 | an hour ago </div>
      </div>
      <label for="nu8uggv" class="commentText"><p>I dont even think he is exaggerating. That was probably like stepping on the surface of Mars and theres a damn martian civil war going on full tilt. Must have been a blast.</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
