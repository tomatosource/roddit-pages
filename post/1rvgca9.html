      <label for="oasa59l" class="commentText"><p>From Chris Forsberg:</p>

<p>There are 27 days remaining in the 2025-26 NBA regular season. The Boston Celtics have 15 more games to prep for the postseason. So, what should be near the top of their to-do list before the playoffs arrive?</p>

<p>Here are five storylines we&rsquo;ll be watching:</p>

<p><strong>Does the rotation shrink in the playoffs?</strong></p>

<p>One question that we likely won’t get a true answer to until the postseason arrives: How deep will head coach Joe Mazzulla dip into his available rotation when the games matter most?</p>

<p>Over the past two seasons, the Celtics leaned heavily on an eight-man playoff rotation, with one other player’s minutes typically fluctuating depending on health and availability. Last week, despite playing three games against elite competition, we didn’t get too many hints about playoff-like rotation, especially when Boston rested two starters against Oklahoma City. </p>

<p>Last Sunday’s tilt in Cleveland did see Boston rely mostly on eight players, with Hugo Gonzalez making a seven-minute cameo as the ninth rotation body. That day, Jordan Walsh and Ron Harper Jr. did not muscle into the wing rotation. </p>

<p>Boston’s wing players have a month left for final auditions.</p>

<p>Baylor Scheierman has clearly won Mazzulla’s trust, first thriving as a starter and now shuffling to a hefty bench role after Tatum’s return. Will Mazzulla lean on rookie Gonzalez as a chaos-infusing, X-factor in the postseason? Can Walsh or Harper Jr. make a case for minutes? How does a healthy Vucevic impact Garza’s minutes and the split at the big-man position?</p>

<p>As the Celtics pace core players to the finish line of the season, there will be opportunities for those without guaranteed playoff roles to make a final case for playing time.</p>
