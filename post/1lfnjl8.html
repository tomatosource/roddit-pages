

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/1agpvicmjy7f1.jpeg"><p>Sold my first Divine Orb for 800 exalts..</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/1agpvicmjy7f1.jpeg" />

    <div class="commentList">
      
        
          
<div class="commentAndChildren">

      </div>
      <label for="mypjumq" class="commentText"><p>Honestly this is a great move - those exalts can buy you good enough beginner gear to comfortably farm T15 with a good build. From there you just farm divs and items sellable for divs and just continue building.</p>

<p>It’s kinda cool how the endgame works in phases. Later, exalts will become less of a currency for you and more of a utility item - you’ll be using them on waystones and rares constantly, you might not even bother picking them all up, and you’ll probably keep a reserve of thousands to use either intentionally or by accident. But right now, use that stack to buy great gear (and join some T15 leech runs and get your level up quickly so you don’t have to worry about level requirements on gear)</p>

<p>Edit: if this is a lightning spear Amazon (looks like it?) I also probably have a lot of gear I’m happy to give you - each time I blow a bunch of divs on new gear I keep all my old stuff (probably a waste, but I’m just like that) so I’ve likely got full gear sets somewhere in my million tabs</p>
</label>
    </div>
  </label>
  
</div>

      <div class="commentHeader">
        <div>OGMoze</div>
        <div>1 | 14 minutes ago </div>
      </div>
      <label for="mypjvcm" class="commentText"><p>Do you need some free gear? Add me I’ve got plenty of stuff that would be an upgrade for you, especially if you need exalts to upgrade your rares. Characters name is Immortaa.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="mypkpo3" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>apple713</div>
        <div>1 | 9 minutes ago </div>
      </div>
      <label for="mypkpo3" class="commentText"><p>You should have got close to 1,000 expats for it. Next time use Alva for exchanging your currency.</p>

<p>If you need some free stuff lmk.</p>

    </div>

</div>

        
      
    </div>
  </body>
</html>
