

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/f7k6s0o9y5ze1.png"><p>My number one problem with the campaign</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/f7k6s0o9y5ze1.png" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="mqvr52z" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>previts</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="mqvr52z" class="commentText"><p>This is not the only zone where this happens either, another notable one is act 1 hunting grounds, where somehow the freythorn is top right on the map but in reality it spawns at the bottom. The map being useless makes searching for zones annoying, results in needless backtracking and makes the low movement speed feel bad. The zones genuinely wouldnt feel to large if I could trust the game to tell me where things are.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="mqvsce1" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Matsu54</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="mqvsce1" class="commentText"><p>Yeah, it may be something they need to factor in when they rearrange maps each season. I believe the map layouts we play in vary by season and game mode (e.g. software, hardcore, ssf all have different map layouts from one another and they are also unique from the last league). Not sure how easy it is to also update the game overworld/waypoint map too 🧐</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="mqvt2mf" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>previts</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="mqvt2mf" class="commentText"><p>The map does change, but it doesnt do it correctly as its completely different from 0.1 For example, act 1 in 0.1 had the town on the bottom, and the forest and cemetery top right, and now act 1 is center top with the forest and cemetery to the left. It seems that either the map isnt changing correctly or the instances arent changing correctly, something is wrong.</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="mqvwila" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Tsunamie101</div>
        <div>1 | 29 minutes ago </div>
      </div>
      <label for="mqvwila" class="commentText"><p>The instance exits don&rsquo;t always allign with the map directions on account of the instance being randomly generated to reduce predictability. It&rsquo;s something they apparently leaned more into coming from PoE 1, where the exits were mostly in the same direction regardless of instance generation.</p>

<p>Maybe the map will change more often (not just every league) once they implemented more of the missing acts, or maybe it&rsquo;s a deliberate move, since predictability in that regard just adds to the feeling that the campaign is just to be run through.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="mqvx8ak" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>tiberiusbrazil</div>
        <div>1 | 26 minutes ago </div>
      </div>
      <label for="mqvx8ak" class="commentText"><p>I think diablo 3 solved this 15 years ago</p>

<p>The Campaign areas should always be similar in location and its &ldquo;fillings&rdquo; made randomly</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
