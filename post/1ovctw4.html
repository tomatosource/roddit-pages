

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>

</a>
    </h2>

    

    <div class="commentList">

    <div class="comment">
      <div class="commentHeader">
        <div>Stock412 | Umpire</div>
        <div>3 | 4 hours ago </div>
      </div>
      <label for="nohvnkm" class="commentText"><p>This was the Sox Prospects writeup when he was drafted</p>

<blockquote>
<p><strong>Scouting Report</strong>: Local product was one of the top New England high school players in 2008.  A true five-tool talent with tremendous upside. Sturdy, athletic build with the ability to add strength.  Open stance. Keeps his hands high around his helmet and goes into a bit of a crouch as the ball approaches. Smooth and quick swing. Patient and selective - waits for his pitch. Above average power potential with a terrific approach. Hits to all fields.  Elite speed with excellent base-running skills. Strong arm with excellent outfield range. Very intelligent.  Passed up a full ride at Vanderbilt to sign with the Sox.  Also a great pitcher in high school, he pitched a perfect game in April 2008, striking out 19 of 21 batters. Had surgery on a partially torn labrum in November 2008. Missed the end of the 2009 season with a broken collarbone after running into an outfield wall. In March 2010, Westmoreland underwent surgery to remove a cavernous malformation from his brain stem, and at this point there has been no official word when and if he will return to baseball.</p>
</blockquote>

<p><a href="https://www.soxprospects.com/players/westmoreland-ryan.htm" target="_blank">https://www.soxprospects.com/players/westmoreland-ryan.htm</a></p>

    </div>
  </label>
  
</div>

  </body>
</html>
