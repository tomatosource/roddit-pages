    <h2>
      <a class="postTitle" href="https://i.redd.it/5tdey188j0jh1.jpeg"><p>How to finish this bad boy?</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/5tdey188j0jh1.jpeg" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="p3bpqld" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>GeorgeHarringtonRed</div>
        <div>9 | an hour ago </div>
      </div>
      <label for="p3bpqld" class="commentText"><p>You&rsquo;re not gonna like the answer. But it&rsquo;s start over with fractures crit chance. Poe2db is a website that shows the weights and item level of modifiers. There are fancy crafting materials like an omen of whittling which target the lowest item level modifier on a item with a chaos orb. Crit chance has a very low ilvl so in your process of trying to get the other mods you will be forced to risk/remove/pay wayyyy more than you should to keep the crit chance. Fracture crit. Chaos spam for levels or %phys then go from there. Familiarize yourself with poe2db its your Bible for crafting  ans modifier info</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="p3bpyvn" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>weixyz2</div>
        <div>3 | an hour ago </div>
      </div>
      <label for="p3bpyvn" class="commentText"><p>Also get an exceptional 3 socket</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="p3bpqwr" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Seajayy__</div>
        <div>5 | an hour ago </div>
      </div>
      <label for="p3bpqwr" class="commentText"><p>Simply put it&rsquo;s not worth the cost, this is a good base but no matter going for t1 phys flat etc is not worth it on this craft</p>

<p>If youre determined to do a mirror tier crossbow craft start with an exceptional base (3 sockets) and a different fracture</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="p3btta3" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>xkibagamigenjurox</div>
        <div>5 | an hour ago </div>
      </div>
      <label for="p3btta3" class="commentText"><p>I know people will tell you to fart on it since you didn&rsquo;t fracture the crit chance but you don&rsquo;t have to abandon this item especially if you are in SSF or you have limited resources.</p>

<p>Desecrate prefix and if u dont get t1/2 %phys, pick accuracy to block it</p>

<p>Sinistral exaltation + greater exaltation and slam with perfect exalt to get 2 prefix.</p>

<p>If u get 2 workable prefixes, omen of light and desecrate suffix with ancient jawbone. Reveal for attack speed or crit dmg, pick highest ilvl suffix if u dont get either (t1 mana/life per kill is ideal).</p>

<p>Slam last prefix, and whittle until u get t1 %pyhs or + flat. Once prefix settles, omen light spam until u get crit dmg or attack speed.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="p3buj9l" type="checkbox" checked/>

</label>

<div class="commentAndChildren">
  <input id="p3bywue" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>MarvelPQplayer</div>
        <div>1 | 43 minutes ago </div>
      </div>
      <label for="p3bywue" class="commentText"><p>This is me on crafting. Even then I don&rsquo;t get it. I don&rsquo;t understand what that rune is he is using either. I apparently wasted one earlier because I thought it meant I got a 7th stat.</p>
</label>

<div class="commentAndChildren">
  <input id="p3bqwzt" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Kriptonyte</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="p3bqwzt" class="commentText"><p>My crossbow was like this. I chaos spammed and got lucky with some t1, t2 ele damage to attacks. Used that item I can&rsquo;t remember the name of to change cold/fire to lightning so it has 3x lightning affixes. I lost my crit when I crafted onslaught though.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="p3bv98d" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>c-lati</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="p3bv98d" class="commentText"><p>You probably just want to essence cycle a prefix (high tier phys %), slam and pray on the second and third prefix. Possibly a couple whittles on the prefixes to see if you can end up with decent tiers of phys flat, phys % and phys hybrid. And yolo slam on the last suffix (you cant add onslaught in advance if you want to essence cycle prefix).</p>

<p>You might be able to get a decent crossbow with decent DPS without spending too much. If you get lucky on slams and/or whittles you could potentially get a 1000+ DPS Xbow worth 500+ divs for less than 100. I’ve done many profit crafts like this. (Edit: but be aware that sometimes you lose money. So dont do this if you don’t have money to lose or aren’t willing to lose it.)</p>

<p>And depending on how well prefixes turn out you could choose to whittle the final suffix a few times hoping to get like crit bonus or attack speed before you get a high level of mana or life on kill or attributes which ends your whittling because it will start to target the crit %. This is a gamble of course; but all of crafting in POE2 is a gamble. It’s all about making decisions based on how much it’s worth spending based on the chance of a potential upside and the expected value of said upside. Like what are your chances to hit crit dmg or attack speed, how many whittles does it take, vs how likely is it to hit bad suffixes like T1 attributes or mana/life on kill. And what is the difference of expected sale price if you hit a good mod. then you can decide if it’s worth it (spoiler: it’s almost never worth it in cases like this— it’s usually only worth it if you’ve got mirrors to spend and have the craft meticulously planned out and want to do a mirror level craft— but sometimes you get lucky).</p>

<p>As others already said, it is 100% not worth spending a lot on this. Dont go chasing T1 prefixes or spending hundreds of divs in whittles. If you can get decent prefixes cheaply, take them and be happy. It’s 100% not worth chasing an extremely expensive craft on a non-exceptional 2-socketed base with 20% quality and fractured proj skills. You want crit fractured on these types of crafts. They become waaaay too expensive and easily get bricked suffixes otherwise.</p>
</label>
    </div>
  </label>
  
</div>
