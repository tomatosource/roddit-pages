

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
}

.selfPostContainer * {
  color: white;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/h6k31vy8kxke1.png"><p>How much is this worth?</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img src="https://i.redd.it/h6k31vy8kxke1.png" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="medoox8" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Kyraxxon</div>
        <div>1 | 13 minutes ago </div>
      </div>
      <label for="medoox8" class="commentText"><p>I am kind of new to the game and still have a hard time telling if items are really good.<br>
Also I barely know anything about crafting so I&rsquo;m not sure if this staff maybe can be easily improved.</p>

<p>I know the phys roll is solid. But I am not sure if the lack of + to skills is important as you might want to have lower skill level for mana management.</p>

<p>How much would you pay / list this for?</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="medpltj" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Kage_noir</div>
        <div>1 | 8 minutes ago </div>
      </div>
      <label for="medpltj" class="commentText"><p>Not much, the game has been out for a long time now. Builds are super optimized and people have weapons in the range of 500-700 damage</p>

    </div>

</div>

  <input id="medqu6f" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Livid_Shallot5701</div>
        <div>1 | 2 minutes ago </div>
      </div>
      <label for="medqu6f" class="commentText"><p>1 ex, and only because noone bothers trading with less money</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
