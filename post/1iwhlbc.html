      <label for="mee1l9s" class="commentText"><p>The Skin Transfer System in PoE1 is abysmal. It&rsquo;ll come, but it&rsquo;s just bad.</p>

<p>One thing Diablo 4 does WAY BETTER than PoE is the skin system there. I would love to see something like it in PoE2. Here&rsquo;s an idea from awhile back:</p>

<p>- You start new leagues with 0 skins unlocked. When you equip or disenchant something, you unlock that skin in your wardrobe. When the league ends, your progress adds to your Standard progress and wardrobe, but you start the new league with nothing unlocked again.</p>

<p>- This helps with &ldquo;visual progress&rdquo;, meaning people cannot wear skins of incredible uniques unless they&rsquo;ve actually found them.</p>

<p>- This could be monetized, perhaps a one-time purchase like the Music Box in Hideouts that allows you to play any piece of music in the OST in your hideout (this is not yet in PoE2). I would easily snatch that up for a good chunk of points!</p>
