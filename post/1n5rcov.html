

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>

	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/vrxbaz3nkkmf1.png" />
	</div>

<div class="commentAndChildren">

      <label for="nbur7wk" class="commentText"><p>Really fun there is an abyss mod that is just &ldquo;im invulnerable 30 secs every 15 secs&rdquo;</p>

</div>

      <label for="nbum06j" class="commentText"><p>Seems accurate. </p>
</label>

</div>

        
      
        
          
<div class="commentAndChildren">

        <div>4 | 3 hours ago </div>
      </div>
      <label for="nbwa9zx" class="commentText"><p>Can someone explain why they are immortal half the time? Is it the soul eater mod or what am i missing?</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="nbwffc5" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Metaljac</div>
        <div>3 | 2 hours ago </div>
      </div>
      <label for="nbwffc5" class="commentText"><p><strong><em>Tl;dr:</em></strong> If a snake-like monster is immortal, then they will not be damaged until they finish their attack/animation. Move to an open area, and stand still until they finish the animation.</p>

<p>Long verison:</p>

<p>If you&rsquo;re talking about the snake-like things in the abyssal depths: They&rsquo;re trying to use a move on you but, due to the cramped spaces, they just keep walking around you trying to start a move. They&rsquo;re immortal during this, and just walk around you/towards you until they finish their attack. They will only become damageable after they finish this specific attack/animation.</p>

<p>The only way I found to kill them is to lure them into a more open space when I can no longer damage them, moving away from any walls, and standing still until they finish their animation. The finished move should be a spiral tail whip AoE attack. They will then be kill-able again until that skill comes off cooldown (About 5-10 seconds)</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

        
      
    </div>
  </body>
</html>
