

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://www.youtube.com/watch?v=CQwqSOwTAys"><p>Expedition to potentially have a PROPER league mechanic improvement</p>
</a>
    </h2>

    

    <div class="commentList">
      
        
          
<div class="commentAndChildren">

    <div class="comment">
      <div class="commentHeader">
        <div>LancingLash</div>
        <div>7 | 9 hours ago </div>
      </div>
      <label for="oio9f08" class="commentText"><p>While I hope they overhaul all the original leagues they picked to port to poe2, I really want ritual to be completely changed. I dislike most things about it. The tiny arena that does not work in maps with walls. Picking rewards out of a UI. The music annoys me for some reason. The boss is copy pasted from poe1. You have to do it 4 times in a map. You cannot see shit because it spams out effects.</p>
</label>
    </div>
  </label>

<div class="commentAndChildren">

      </div>

</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

        
      
        
          
<div class="commentAndChildren">

      </div>
      <label for="oionwbz" class="commentText"><p>I got so rich off logbooks last league. Now we get more?</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="oio8lc2" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>MyriadSloths</div>
        <div>1 | 9 hours ago </div>
      </div>
      <label for="oio8lc2" class="commentText"><p>God i hope so. Idk if this is unpopular opinion but i always hated expedition. Its just miserable to run in maps. Logbooks are cool but shouldn&rsquo;t be the only part of the mechanic that feels good to play, i blocked expedition first in poe1 even when it was strong</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="oioev0w" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>[deleted]</div>
        <div>-1 | 9 hours ago </div>
      </div>
      <label for="oioev0w" class="commentText"><p>[removed]</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="oioo4fg" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>tooncake</div>
        <div>1 | 8 hours ago </div>
      </div>
      <label for="oioo4fg" class="commentText"><p>Huh? PoE2 has its own thriving community, and are positively so, just like any arpg games to date (and that includes d4).</p>

<p>If you happen to dislike it then that&rsquo;s understandable, and just a kind reminder that poe1 took 10 years before it got polished - and tbh in comparison with PoE2, they are actually ramping it faster than how it went with PoE1&rsquo;s game development progression.</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

        
      
    </div>
  </body>
</html>
