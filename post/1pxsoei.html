

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/un60hulzfy9g1.png"><p>How to continue this craft?</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/un60hulzfy9g1.png" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="nwd9mmb" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Gachaman785</div>
        <div>8 | 4 hours ago </div>
      </div>
      <label for="nwd9mmb" class="commentText"><p>To be honest i wouldn&rsquo;t even risk touching the prefixes, you obviously can still desecrate to try to get a higher flat ES but i would probably do that for the suffix pool. Perfect essence runs the risk of deleting mods. Overall crafting with a yellow base can get real expensive real quick, and that is before trying to fix a craft via omens. If you have a high budget you can continue and try to fix the prefixes to your liking, but i would just desecrate a suffix and slam to perfect exalts and pray. Either way the best you can do with a reasonable budget is a <sup>4</sup>&frasl;<sub>6</sub> item, going for <sup>6</sup>&frasl;<sub>6</sub> or even just <sup>5</sup>&frasl;<sub>6</sub> will greatly inflate the crafting cost</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="nwdpqnt" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>mcbuckets21</div>
        <div>5 | 3 hours ago </div>
      </div>
      <label for="nwdpqnt" class="commentText"><p>There is 0 risk to using perfect essences in this case. You can guarantee a suffix with an omen and then guarantee the perfect essence removes a suffix with another omen. Though not sure if there is a desirable essence to use in this case.</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nwdc5a4" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Cloud7050</div>
        <div>4 | 4 hours ago </div>
      </div>
      <label for="nwdc5a4" class="commentText"><p>Maybe omen slam a suffix, then desecrate prefix without unveil and fracture? Then double slam suffixes and finally unveil prefix and hope for more ES.</p>

<p>If you hit fracture on the suffix and said suffix was good, it opens up your options for improving the suffixes overall if your budget is higher.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="nwdgx93" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>PreposterisG</div>
        <div>2 | 4 hours ago </div>
      </div>
      <label for="nwdgx93" class="commentText"><p>What do you do if you hit the fracture on the suffix? Omen to anul suffix and then exalt until you get a good one then slam the last? Or is it omen to chaos spam?</p>

<p>I&rsquo;m new and I understand the finish prefix/suffix and go for the 1 in 3 on the fracture. But then I don&rsquo;t get what&rsquo;s next if you hit the fracture.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="nwdjspq" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Cloud7050</div>
        <div>1 | 3 hours ago </div>
      </div>
      <label for="nwdjspq" class="commentText"><p>I&rsquo;m not thinking in terms of a GG craft because the omens to gamble for that over and over are insanely expensive. This base is a sacramental robe (vs something like vile robe) and only ilvl 81. So we rule out the expensive erasure/annulment omens. It&rsquo;d probably be cheaper to restart at the recomb step.</p>

<p>The fracture can be used for its interactions with essences in flexible ways I reckon (we won&rsquo;t do a full annul into chaos spam restart). Maybe you want to perfect or corrupted essence something on, and can essence/crystallisation omen without risking that (good) fractured suffix. Or maybe you instead want to replace one of the slammed suffixes via crystallisation omen + essence of abyss into desecrate. Could even invest an omen of light at that point if you want, as a cheaper way to wipe a suffix than an annulment omen. Just spitballing here.</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

    
  </div>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nwdbyy9" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Maladaptivism</div>
        <div>3 | 4 hours ago </div>
      </div>
      <label for="nwdbyy9" class="commentText"><p>I made a few similar pieces last league, my general approach was:</p>

<ol>
<li>Recomb two T1 prefixes.<br>
</li>
<li>Desecrate prefix and use Echoes.<br>
</li>
<li>If T1/T2 last prefix I&rsquo;d slam Greater Exalt (one with Greater Exaltation), if not I&rsquo;d use it for recomb fodder.</li>
</ol>

<p>No idea what the cost of these are thing league as I finished what I wanted to a while back, but I felt it was the best way to do it and that&rsquo;s it.</p>
</label>
    </div>
  </label>
  
</div>
