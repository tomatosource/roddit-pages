

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
}

.selfPostContainer * {
  color: white;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/cedsfrvaznme1.jpeg"><p>I got this from Alva, Seems decent but is it?</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img src="https://i.redd.it/cedsfrvaznme1.jpeg" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="mfy521y" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Plebasaurus1402</div>
        <div>1 | 18 minutes ago </div>
      </div>
      <label for="mfy521y" class="commentText"><p>If you can whittle the life regen for cast speed this would be in the hundreds divine imo. Still worth a ton without it.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="mfy5e9z" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>BlessedMist</div>
        <div>1 | 16 minutes ago </div>
      </div>
      <label for="mfy5e9z" class="commentText"><p>With Omen of Dextral Erasure i could get rid of both Crit chance and Life Regen. I guess it could be worth it since Crit chance is only 13%?</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="mfy5ruv" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>BlessedMist</div>
        <div>1 | 13 minutes ago </div>
      </div>
      <label for="mfy5ruv" class="commentText"><p>Just realized i could lose my +3 on all spells with that so i guess thats a nono, has to be omen of whittling but i risk losing the Max mana since its also T1</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="mfy6asa" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>lepsek9</div>
        <div>1 | 9 minutes ago </div>
      </div>
      <label for="mfy6asa" class="commentText"><p>Whittling is based on the lvl req for the mod, not the tier. I&rsquo;m 99% sure life regen is the lowest, but check poedb.</p>
</label>
    </div>
  </label>
  
</div>

    
      
<div class="commentAndChildren">
  <input id="mfy6j77" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>SoySauceSovereign</div>
        <div>1 | 8 minutes ago </div>
      </div>
      <label for="mfy6j77" class="commentText"><p>Whittling doesn&rsquo;t remove the lowest tier modifier. It removes the lowest level modifier (minimum item level at which that tier of that mod may appear). The way to check mod level is to look it up on PoE2db.tw</p>
</label>
    </div>
  </label>
  
</div>

    
      
<div class="commentAndChildren">
  <input id="mfy792u" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>TheKerui</div>
        <div>1 | 2 minutes ago </div>
      </div>
      <label for="mfy792u" class="commentText"><p>I don&rsquo;t know if everyone talking about lowest level vs lowest tier is right about the whittling, but I do know it highlights the mod to be removed in orange so you will know for sure when you do it.</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

    
  </div>
  
</div>

    
  </div>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="mfy6kjl" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>PRND432</div>
        <div>1 | 7 minutes ago </div>
      </div>
      <label for="mfy6kjl" class="commentText"><p>This is a very solid roll. The +3 is amazing,the spell damage is solid, the max mana is strong and the crit chance isn&rsquo;t bad. Is it a 50 div min/maxers dream? No. Is it worth a hand full of divs, yes.</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
