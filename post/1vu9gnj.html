

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://www.reddit.com/r/PathOfExile2/comments/1vu9gnj/tips_for_news/"><p>Tips for news</p>
</a>
    </h2>

    
    <div class="selfPostContainer">
      <p>Hello guys i just started few days ago playin monk martial artist. What items should I keep or what should i need to be careful.<br>
Gimme any tips about game and class pls</p>

    </div>
    

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="p4ze8ct" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>AwesomeXav</div>
        <div>1 | 4 hours ago </div>
      </div>
      <label for="p4ze8ct" class="commentText"><p>Only once you get to level 80 will you really start coming across items that others would want to buy.<br>
Until then you will mainly pick up all &ldquo;currency&rdquo; items.</p>

<p>Alteration Orbs, Augmentation Orbs, Exalted Orbs, Chaos Orbs, Divine Orbs, etc.<br>
(Those last two are worth a lot and will be mainly used for trading with other players to purchase better gear for yourself)</p>

<p>This will generally be all you need to know until you understand the game better.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">

        <div>1 | 7 minutes ago </div>
      </div>

    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="p4zgccx" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Gullible-Respect7778</div>
        <div>-1 | 4 hours ago </div>
      </div>
      <label for="p4zgccx" class="commentText"><p>The most effective monk build takes the way of the open hand subclass and the tavern brawler feat. Once you have both, you&rsquo;ll be able to chug a Hill Giant Elixir each day and deal insane amounts of damage</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
