html {

input[type="checkbox"] {

}

.postLink:visited {
  color: #806a42;

.postHeader {

  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;

}

.commentList {

  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {

}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

        <div>2 | 3 hours ago </div>
      </div>
      <label for="o0uz6s6" class="commentText"><p>Onslaught is fine. Provide slightly reduced attack speed but nothing gamebreaking. You lose a bit of boss dps, but that&rsquo;s usually not too much of a problem for flame breath and you gain movespeed for the rest of the map which is great. The only time you don&rsquo;t want onslaught is if you have fall of the axe charm but it&rsquo;s pretty unreliable except for ritualist.</p>

<p>Abrasion is not great for dps but it is great for herald of ice.</p>

<p>So do as you said, exalt pre*2, haste, battle, exalt, abrasion with the proper omens. Good luck on desecrate roll at the end, that&rsquo;s the rough part.</p>

<p>Don&rsquo;t reroll that crit, if you don&rsquo;t like crit, finish the item and sell it. A decent amount of talisman users want crit.</p>

        <div>1 | an hour ago </div>
      </div>
      <label for="o0veuej" class="commentText"><p>That’s exactly what I’d do. Since crit is unprotected, and whittles won’t work, I’d yolo p ex your prefix 3x times. First youll cycle with sinister crystalization for onslaught and +5. I wouldn’t go for anything else. Once your suffix are done I’d yolo one more and if bad, do gain as % prefix. Then desecrate for flat.</p>

<p>If any of your yolo ex hit flat # or good hybrid I may leave off gain and try for pure phys. Most importantly though I would only roll against your prefix as crit being unfractured means the rerolls would be whittle+erasure. +5 is also super solid. If by chance you hit with a yolo exalt I would leave off onslaught and desecrate for attack speed. Good luck!</p>
