.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {

}

.commentAndChildren label .comment .commentText {

.streamableContainer {

  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}
