

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://www.reddit.com/gallery/1vala9y"><p>1st time picking up loot with a T1 modifier</p>
</a>
    </h2>

    

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="p0mbgtm" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>SunnyvaleSupervisor</div>
        <div>1 | 26 minutes ago </div>
      </div>
      <label for="p0mbgtm" class="commentText"><p>It probably will not sell for anything, 1 transmute at best. T1 spell damage is nice but it’s not a high item level exceptional over quality/multi-socket base - at this point in the league it really needs to be an absolutely “perfect” crafting base to be worth someone’s time.</p>

<p>You could attempt to craft on it yourself, but with only 5 divines you’re limited essentially to a combination of essence and greater/perfect exalt slamming + desecration. And you’re stuck with what you get on the first roll of each.</p>

<p>Crafting is just not really accessible without a few hundred to a few thousand divine investment, and this late in the league, 5 divines could likely buy you several  staffs with nearly perfect rolls.</p>

<p>My take is: slam an essence and a few orbs on it because it’s fairly cheap. Get somewhat of a feel for using currencies. But don’t waste perfect orbs if you have them. If it’s not what you want just vendor it and buy something better with your divs.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="p0maykg" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>NaturalCard</div>
        <div>1 | 30 minutes ago </div>
      </div>
      <label for="p0maykg" class="commentText"><p>Sell it, no clue how much it is worth tho.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="p0mbqqs" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Exoskeleton78</div>
        <div>1 | 24 minutes ago </div>
      </div>
      <label for="p0mbqqs" class="commentText"><p>5 div&hellip; sell..</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
