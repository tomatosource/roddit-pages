

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
}

.selfPostContainer * {
  color: white;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/jadodom7r5ne1.png"><p>Lightning only Invoker build</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img src="https://i.redd.it/jadodom7r5ne1.png" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="mgfdt1u" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>SpyreScope</div>
        <div>4 | 4 hours ago </div>
      </div>
      <label for="mgfdt1u" class="commentText"><p>Id recommend getting falcon technique that you are one away from. Then heading north towards lightning quick and pure power</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="mgfhzpu" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>xcaliblur2</div>
        <div>2 | 3 hours ago </div>
      </div>
      <label for="mgfhzpu" class="commentText"><p>If you care about DPS at all it should go crit chance + crit damage bonus &amp;gt; attack speed &amp;gt; lightning damage</p>

<p>At end game, % lightning damage actually adds VERY little to DPS. It&rsquo;s also the reason why most people generally opt for flat damage on rings vs % added damage.</p>

<p>For example. I have 850 int and I took Pure Power, which gives me 170% added lightning damage. Guess how much DPS my tempest flurry increases by, in terms of percentage. (And I have HOWA, and flat lightning damage on my rings and wild storm passive already)</p>

<p>Hint: it&rsquo;s not a lot</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="mgg0l53" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>eseerian_knight03</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="mgg0l53" class="commentText"><p>So what do you recommend I seek? Any crit areas that are particularly good for what I&rsquo;m building</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="mgg7prc" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>xcaliblur2</div>
        <div>1 | 7 minutes ago </div>
      </div>
      <label for="mgg7prc" class="commentText"><p>There are crit nodes all around the monk&rsquo;s tree. Also good if your weapon has a + crit chance affix.</p>

<p>Crit is a great foundation to build your DPS on. Try it out: aim to get 40-50% crit chance and about 500% crit damage bonus</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

    
  </div>
  
</div>

        
      
    </div>
  </body>
</html>
