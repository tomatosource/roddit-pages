

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/ozgfa3qbvmtf1.png"><p>Crafting Question</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/ozgfa3qbvmtf1.png" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="ni7dmh8" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>EmiliuzDK</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="ni7dmh8" class="commentText"><p>It&rsquo;s described as &ldquo;same type&rdquo;.</p>

<p>If we look at what sort of types you have so far</p>

<p>Intelligence, Phys, Rarity (full), Lightning</p>

<p>The most common outcomes as a suffix would be physical attack leech or mana regen due to int.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="ni7edci" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>PipSqu3ak95</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="ni7edci" class="commentText"><p>no. The chances of getting mana regen is 0%.</p>

<p>There are no mana modifiers on the ring.<br>
Int is clasified as attribute = Attribute Tag<br>
Phys damage to attacks = Attack and Physical tags<br>
Rarity = no tag<br>
Lightning Resistance = Lightning and Resistance tags<br>
Minions = minion tag</p>

<p>The outcome comes down to %. Each of those modifiers are weighted and not all have same % chance  for hit.<br>
Chaos resistance being the least possible outcome on OPs ring.</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="ni7e5e5" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>PipSqu3ak95</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="ni7e5e5" class="commentText"><p>It will only add modifiers of existing types of modifiers.<br>
The ring currently has (attack,physical,lightning,resist,attribute,minion) modifiers.</p>

<p>If you use homog exalt, you have a chance to roll modifiers who have those tags.</p>

<p>The modifiers are weighted, so not all have same % chance of rolling.</p>

<p>The best bet to get the last suffix as resostance is to add fire or cold catalysts and use Omen of Catalysation to addition to your homog. omen.</p>

<p>This will increase the chances to get fire/cold/all resistances.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">

</label>

      </div>
      <label for="ni7fa9y" class="commentText"><p><a href="https://preview.redd.it/g3lwnyerymtf1.png?width=1429&amp;format=png&amp;auto=webp&amp;s=9d3354fce9e0f7f79c900485f7bc6db3cdc7ec91" target="_blank">https://preview.redd.it/g3lwnyerymtf1.png?width=1429&amp;format=png&amp;auto=webp&amp;s=9d3354fce9e0f7f79c900485f7bc6db3cdc7ec91</a></p>

<p><a href="https://poe2db.tw/us/Rings#ModifiersCalc" target="_blank">https://poe2db.tw/us/Rings#ModifiersCalc</a></p>

<p>Here ya go. For future crafts, you can use this as a reference when crafting. You have the tags above and the weights (chance to hit) to the right.</p>

<p>You can also add ilvl in case you are using greater/perfect exalts to manipulate the odds.</p>
</label>
