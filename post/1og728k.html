

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/5g8jw0dwocxf1.png"><p>How should I continue crafting this?</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/5g8jw0dwocxf1.png" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="nlefvqw" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Studweiser21</div>
        <div>1 | 10 minutes ago </div>
      </div>
      <label for="nlefvqw" class="commentText"><p>If you’re just looking to craft, then there are some perfect essences that are great. Attack speed, +4 attack skills plus a good Desecration would be probably the best this goes without editing your prefixes. Then Vaal and pray!</p>

<p>For the currency spent, you’d most likely get way more value out of something bought this late in the league.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nleg2o5" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>hottestpancake</div>
        <div>1 | 8 minutes ago </div>
      </div>
      <label for="nleg2o5" class="commentText"><p>jawbone, ex slam then perfect battle perfect haste and repeat the last two until you get both mods. you might lose whatever you get from the jawbone but it&rsquo;s w/e</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nlegcqj" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>FatPandaz</div>
        <div>1 | 7 minutes ago </div>
      </div>
      <label for="nlegcqj" class="commentText"><p>What are the tiers of each roll? If mana per enemy killed is lowest, whittle that off, then you could always grab a perfect exalt and try to get a # to projectile skills, crit chance, attack speed, or crit damage bonus. You could also end up getting an additional arrow fired. These five are what you&rsquo;re generally looking for, and you&rsquo;d have fairly decent odds of getting one of them using a perfect exalt orb.</p>

<p>If it doesn&rsquo;t brick, slot it with some Saqawal&rsquo;s Rune of the Sky for the Gain % damage as all elements effect, as that&rsquo;s definitely in the meta rn.</p>

<p>If you roll it well and are feeling extra gambler, you could sanctify it to try and get a better roll on the # to projectile skills, or you could corrupt it (use an Omen of Corruption if you do) to try and get the three sockets.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nlegebf" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>NiceguyLucifer</div>
        <div>1 | 6 minutes ago </div>
      </div>
      <label for="nlegebf" class="commentText"><p><img src="giphy|3oKIPlLZEbEbacWqOc" alt="gif" /></p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
