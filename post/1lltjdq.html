

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/yagxy3wzyg9f1.jpeg"><blockquote>
<p>100% conversion, how does that work?</p>
</blockquote>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/yagxy3wzyg9f1.jpeg" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="n02680y" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>gramineous</div>
        <div>1 | 15 minutes ago </div>
      </div>
      <label for="n02680y" class="commentText"><p>&amp;gt;100% conversion is scaled down to its equivalent at 100%. This is more relevant info when you have different types of conversion. For example, 40% phys to fire and 80% phys to cold wouldn&rsquo;t be 120%, it would instead become 33.33% phys to fire and 66.67% phys to cold.</p>

<p><a href="https://www.poe2wiki.net/wiki/Conversion" target="_blank">https://www.poe2wiki.net/wiki/Conversion</a></p>

<p>Here, Overconversion paragraph.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="n028oxr" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>AggressiveAd69x</div>
        <div>1 | a minute ago </div>
      </div>
      <label for="n028oxr" class="commentText"><p>Someone posted some gloves that convert all damage dealt into the three elements 33% for all three. He then vaaled it, and all 3 33%&rsquo;s went over 33% and total % was like 150%. Are you saying this had no impact?</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="n025rpb" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>[deleted]</div>
        <div>1 | 18 minutes ago </div>
      </div>
      <label for="n025rpb" class="commentText"><p>[deleted]</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="n027kss" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>FledglingLeader</div>
        <div>1 | 8 minutes ago </div>
      </div>
      <label for="n027kss" class="commentText"><p>Nope. Conversion caps at 100%.</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

        
      
    </div>
  </body>
</html>
