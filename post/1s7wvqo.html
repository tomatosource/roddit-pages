

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>

    <h2>
      <a class="postTitle" href="https://i.redd.it/o0716nxht7sg1.png"><p>Need a bit of help with my temple</p>

<div class="commentAndChildren">
  <input id="odck2ht" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>TheAnimeProtaganist</div>
        <div>1 | 7 hours ago </div>
      </div>
      <label for="odck2ht" class="commentText"><p>From what I understand (which isnt much, this is just what i did) id lock your smithy golem chain and fight him to hopefully move him into the 3rd row and just keep building your chain out. The more you close in around him the more likely he is to go where you want him too eventually, it takes a while but its safe just dont start the corruption thalmaturge part until you get him to that center spot. Let your second chain die honestly, because the golem smithy chain requires SO many locks to build.</p>

<p>Edit: that is if your doing the fubgun temple, in which case you already messed up by using your sacrifice rooms</p>
</label>
    </div>
  </label>

<p>Thanks for the tips! So what I was thinking then: if I build a few more rooms like this, he&rsquo;d be forced into the right spot, correct? Also, I was following the uppermost preset, which was then used by Fubgun I think? <a href="https://sulozor.github.io/#/atziri-temple" target="_blank">Sulo - PoE Tools</a></p>
</label>
    </div>
  </label>
  
</div>

<div class="commentAndChildren">

    <div class="comment">
      <div class="commentHeader">
        <div>charr3</div>
        <div>0 | 7 hours ago </div>
      </div>
      <label for="odcjn90" class="commentText"><p>Just lock the ends and nothing will get deleted.</p>

<p>A few things though:</p>

<p>- You should probably re-place the sac chamber, you already used both sacrifices (you don&rsquo;t strictly need them, but it&rsquo;s much easier building with sacrifices).</p>

<p>- You shouldn&rsquo;t bother building the second chain until later</p>

      <div class="commentHeader">
        <div>DsyyR</div>
        <div>0 | 6 hours ago </div>
      </div>
      <label for="odckrrv" class="commentText"><p>Ah that&rsquo;s fantastic, good to hear! I thought I&rsquo;d just build the second chain since I&rsquo;m getting a lot of lock medallions. Could you please elaborate a bit more on the sacrificial chambers part? Do you only get two sacrifices?</p>

<div class="commentAndChildren">
  <input id="odcop6y" type="checkbox" checked/>
    <div class="comment">

        <div>charr3</div>
        <div>1 | 6 hours ago </div>
      </div>
      <label for="odcop6y" class="commentText"><p>Each sacrifice levels up your sac chamber. Once you use two sacrifices, you won’t get anymore. I would just recommend destabilizing the sac chamber and replace it, that way you get your sacrifices back. Look up a guide on when to use them, don’t just use them randomly (you don’t have to use it when it shows up, it will come back). </p>
