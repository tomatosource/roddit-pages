    <h2>
      <a class="postTitle" href="https://www.mlbtraderumors.com/2025/11/latest-on-red-soxs-payroll-flexibility.html"><p>Latest On Red Sox&rsquo;s Payroll Flexibility</p>

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="nrq02ra" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Traditional_Half842 | Boston Red Sox</div>
        <div>2 | 6 minutes ago </div>
      </div>
      <label for="nrq02ra" class="commentText"><p>John Henry has been incredibly consistent about his approach for the entire 23 years he has owned the team (2023-2024 being notable exceptions after they fucked up their tax situation in 2022).  He treats the CBT threshold like a salary cap.  When he has a great roster on his hands he is willing to spend past the first threshold but has shown an unwillingness to go past the second (the only time he has ever done this was when the Red Sox acquired Eovaldi mid-season in 2018 - adding a starter to what is likely the best Red Sox roster we will see in our lifetimes).  That 2018 Red Sox team was the most expensive Red Sox team ever (relative to the CBT), and it is like the 30th-highest tax bill ever.  The Red Sox have never ever blown way deep into the luxury tax the way the Yankees always have and the way the Mets/Dodgers have in recent years.  They didn&rsquo;t in &lsquo;04, they didn&rsquo;t in &lsquo;07, they didn&rsquo;t in &lsquo;13, and they didn&rsquo;t really in &lsquo;18.</p>

<p>I don&rsquo;t see it changing anytime soon considering he is the owner with the most rings in baseball, and probably thinks his philosophy is better than everyone else&rsquo;s.  The Red Sox  haven&rsquo;t really changed in recent years despite so many fans thinking so; it&rsquo;s really just that there are now other teams who spend around the Red Sox tier, and a couple teams that spend around the Yankees tier.  But the Red Sox have always been a clear tier below what the Yankees/Dodgers/Mets all show a willingness to do.</p>
</label>

  </label>

<p>The good news is there’s more wild cards now. Having a 90win ceiling isn’t as frustratingly stupid a plan as it was in 2005.</p>

      <label for="nrq0a3w" class="commentText"><p>I’m generally prepared to be disappointed but right now it’s pretty impossible to draw anything from this information. The range of “below the second threshold” is vast. Advertising budgetary constraints is also a classic negotiation maneuver. Like the article points out, certain trade scenarios and deferrals will widen the range of possible spending limits. So we’ll just need to wait and see.</p>
