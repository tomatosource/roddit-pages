    <h2>
      <a class="postTitle" href="https://v.redd.it/95uaw9detrve1"><p>Here&rsquo;s my lightning Spear for clear, Bleeds for single target, Spearfield for CC lightning/bleed weapon swap Amazon</p>
</a>
    </h2>

    

    <div class="commentList">
      
        
          
<div class="commentAndChildren">

    <div class="comment">
      <div class="commentHeader">

      </div>
      <label for="mnwo4ua" class="commentText"><p>just a blue t15 waystone, so relatively safe. Map boss difficulty was +4</p>

<p>&amp;nbsp;</p>

<p>hopefully the video is self explanatory but basic skill breakdown:</p>

<ul>
<li>lightning spear for comfy clear, we also use to shock bosses</li>
<li>barrage to empower lightning spear, we generally do this in between packs</li>
<li>spearfield to get starting frenzy charges and for cc to prevent getting overwhelmed (also good for ritual)</li>
<li>disengage has good damage scaling base, we stick impale into it to boost our bleeds</li>
<li>rake for inflicting biggest bleed, generally follows disengage</li>
<li>spear throw for breaking armor and fully hobbling, this generally starts the boss fight after bloodhound&rsquo;s mark</li>
<li>blood hunt for gap closing, executing</li>
<li>thunder leap for escaping bad situations</li>
<li>combat frenzy to get frenzy charges</li>
<li>herald of thunder with electrocutes to maintain frenzies when we&rsquo;re running and clearing</li>
<li>wind dancer for survivability</li>
<li>bloodhounds mark to generate stun and allow us to break armor on bosses</li>
</ul>

<p>&amp;nbsp;</p>

<p>so clearing we just run around lightning spearing like your general lightning spear build.. for higher hp mobs we bloodhunt in to gap close, then disengage and rake, or just spear throw it to death. can also spearfield to aggravate bleeds and pin it down</p>

<p>&amp;nbsp;</p>

<p><strong>Boss Fights</strong></p>

<p>&amp;nbsp;</p>

<ul>
<li><p>open with bloodhound&rsquo;s mark to enable armor breaking, and stun from bleed</p></li>

<li><p>spear throw to fully hobble, maxing out our crit bonus from chance to hit in our ascendancy</p></li>

<li><p>once fully hobbled, throw some lightning spears to shock</p></li>

<li><p>go back to spear throw until fully armor broken, improving the hit damage, and thus the bleed magnitude of our rake</p></li>

<li><p>go into rake&amp;gt;disengage we want to do this at least twice to get our best bleed (disengage to impale, rake to bleed off of that impale)</p></li>

<li><p>if i remember to, now would be a good time to spearfield spam, trying to get crit hits to aggravate the bleed</p></li>

<li><p>generally keep this going, keeping the debuffs up (reshocking, marking, breaking armor, etc)</p></li>

<li><p>blood hunt when in the revealed weakness portions of boss bar</p></li>
</ul>

<p>&amp;nbsp;</p>

<p><strong>Jewels</strong></p>

<p>&amp;nbsp;</p>

<p>One downside to this playstyle is it feels pretty clunky weapon swapping without any bonus to weapon swap speed. I have it on all three of my jewels, and am currently at 71% increased swap speed and .15s swap time. luckily, this mod is relatively cheap in trade</p>
