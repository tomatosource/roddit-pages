

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/a0antofsi8oe1.png"><p>How I envision POE2&rsquo;s endgame Atlas should be (explanation in comments)</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/a0antofsi8oe1.png" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="mhd10sh" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>InfiniteNexus</div>
        <div>1 | 7 minutes ago </div>
      </div>
      <label for="mhd10sh" class="commentText"><p>My proposal is that the POE2 Atlas should be an actual map of the whole of Wraeclast, and the maps are real locations and tilesets from real areas on the continent and islands. It could even remain as the current 3D top down view we have, (as my image is in Paint and resembles POE1&rsquo;s campaign waypoints) but not be random, as that looks good, although is ultimately meaningless in the long term. In POE2&rsquo;s current atlas, you dont get attached to locations, you dont particularly care about the places you visit other than a point on your way towards something more meaningful.</p>

<p>In POE1&rsquo;s atlas you at least get rewards if completed, and can have favourites you like to run even if they&rsquo;re not T16/17s.</p>

<p>-</p>

<p>Story wise, if we&rsquo;re to save locations on the atlas from corruption that are in the world and not otherworldly memories like the maps in POE1, then it makes no sense that there is random terrain and endless mountains, lakes and meadows in a place that should resemble the world we love and want to save.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="mhd1ayw" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Penguin_Poacher</div>
        <div>1 | 4 minutes ago </div>
      </div>
      <label for="mhd1ayw" class="commentText"><p>So basically warbands league?</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
