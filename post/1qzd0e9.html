      <label for="o49w7lj" class="commentText"><p>(edit - ignore below bad info)<br>
Personally I desecrate it with a preserved jawbone and use 1x abyssal echoes when you go to the well of souls and pray you hit something decent on the reveals.</p>

<p>I honestly don&rsquo;t think its worth removing the accuracy, if its possible at all (not sure on the tiers on these mods).</p>

<p>If you want to do it cheaper just yolo slam a perf exalt :)<br>
(edit - ignore above bad info)</p>

<p>Fubgun posted a guide on his mobalytics explaining quiver crafts.</p>

<p>&ldquo;<strong>Quiver - ilvl 75</strong>: The quiver craft is mostly RNG but there&rsquo;s some steps you can take to improve your odds of success, just keep in mind most crafts will end up being mediocre when it comes to the quiver.</p>

<ol>
<li>Perfect trans/aug quiver until 2 good affixes (flat dmg or inc bow dmg on prefix and +2, crit or atk speed on suffix).</li>
<li>Perfect regal and hope for a 3rd good affix (suffix is the ideal scenario here).</li>
<li>If it hit a bad affix, you can use a greater chaos orb and try to replace the bad affix, <sup>2</sup>&frasl;<sub>3</sub> to brick here.</li>
<li>Dextral necromancy + jawbone on the quiver, if it&rsquo;s 3 gg mods you should use an abyssal echoes</li>
<li>If you hit a good suffix, you should consider using perfect exalt+double exalt omen to finish the craft</li>
<li>This is the cheapest way to make a GG quiver, lots of rng steps but eventually you will hit. More expensive methods will require omen of lights, fracture and/or whittles.</li>
<li><strong>Quiver - ilvl75</strong>: More expensive method</li>
<li>If you hit +2 lvls/crit on the suffix with t1 Flat on the prefix, you can jawbone the suffix and go for a <sup>1</sup>&frasl;<sub>3</sub> fracture (if you miss the fracture it&rsquo;s fine, just do the same steps as above) - If you fracture flat dmg, you can exalt 1 mod on the prefix and than use Essence of hysteria + essence of sinistral crystal to have 100% chance of adding bow dmg onto your prefix. The last prefix you will slam with a perfect exalt and hope to not hit accuracy. If the quiver is 5 GG mods, than you should echoes/omen of light your last suffix until you hit crit or attack speed.&rdquo;</li>
</ol>

<p>link - <a href="https://mobalytics.gg/poe-2/profile/fubgun/builds/0-4-fubgun-poisonburst-pathfinder" target="_blank">https://mobalytics.gg/poe-2/profile/fubgun/builds/0-4-fubgun-poisonburst-pathfinder</a></p>

<p>edit - didn&rsquo;t notice all mods filled, not easy when tiers not showing apologies but glad the craft didn&rsquo;t brick for you in the end :)</p>
