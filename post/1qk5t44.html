      <label for="o142l3h" class="commentText"><p>From Chris Forsberg:</p>

<p>We’re struggling to remember the last time a Sam Hauser 3-pointer touched anything but the net. It certainly didn’t happen on Wednesday night against Indiana, with all five of Hauser’s triples finding nothing but twine.</p>

<p>Hauser nearly matched the Celtics’ single-game record for 3-pointers last Saturday in Atlanta before hilariously getting snagged on 10 makes, and misfiring on six energy-drained attempts before coach Joe Mazzulla mercifully ended his night in a lopsided win.</p>

<p>Hauser has made 25 3-pointers in his last five games. Consider this: There are 279 players in the NBA who haven’t made 25 3-pointers <em>all season</em>. Yes, Hauser has more 3-pointers in a week than half the league has made in half of the season.</p>

<p>Still, it’s been a bit of a roller coaster for Hauser in 2025-26. He came into the new campaign as a starter on a robust $10 million per year extension, but got shuffled to the bench after three games due in large part to Boston’s rebounding woes. Hauser’s shot was off at times to start the season, and his minutes dipped below even his average on Boston&rsquo;s recent talent-surplus teams.</p>

<p>Even in those moments, Hauser was a positive for the Celtics when he was on the court. But now his shot is falling, and he’s given an already-potent offense another jolt while shuffling back to the starting role.</p>
