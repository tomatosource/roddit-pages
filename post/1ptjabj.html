

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/1ef36j97gv8g1.png"><p>How do I not fuck this up?</p>
</a>
    </h2>

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="nvhfrs8" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">

      </div>
      <label for="nvhfrs8" class="commentText"><p>Well you can try to fracture and hit the evasion rating and that would essentially give you a save state on the prefixes and then you can solve the craft from there but it can get really expensive if you don’t hit what you want easily.</p>
</label>
    </div>

<div class="commentAndChildren">
  <input id="nvhg70d" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>thatreallycoolguy</div>
        <div>-7 | 4 hours ago </div>
      </div>
      <label for="nvhg70d" class="commentText"><p>So option #1 is to take the 25% chance to fracture evasion rating. If not I can throw two exalts at it. Doesnt seem like a bad idea.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="nvhgnsx" type="checkbox" checked/>
    <div class="comment">

        <div>Maladaptivism</div>
        <div>6 | 4 hours ago </div>
      </div>
      <label for="nvhgnsx" class="commentText"><p>Don&rsquo;t throw two exalts at it, you can get the third prefix from a Desecration which means 3 options at base, then 6 with Echoes and <em>however many times you can afford</em> with Omen of Light.</p>

  </div>

</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nvhgf79" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>UhJoker | Not playing Deadeye</div>
        <div>4 | 4 hours ago </div>
      </div>
      <label for="nvhgf79" class="commentText"><p>Personally I’d abyss and then if the abyss roll is good maybe hit with a tier 2 or 3 exalt but I’m not an expert crafter.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nvhotpt" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>iNhab</div>
        <div>5 | 3 hours ago </div>
      </div>
      <label for="nvhotpt" class="commentText"><p>If I&rsquo;m not mistaken, this is one of the most guaranteed ways to craft it:</p>

<p>If you really, really want to go for the perfect for whatever reason, you use desecrate, choose max life so that you&rsquo;d block it, then slam perfect or greater exalt, and if you get what you don&rsquo;t want, you whittle it until you hit a mod that&rsquo;s of higher ilvl or you hit the desired mod. IF you hit another higher ilvl mod that you don&rsquo;t want, you&rsquo;re basically &ldquo;stuck&rdquo; or if you fracturated evasion previously, then you can &ldquo;safely&rdquo; remove that mod via mark of abyss or annulment of prefixes I believe.</p>

<p>Keep in mind that all of this is really, really costly and it doesn&rsquo;t seem like you&rsquo;d want to invest this much. But wanted to share this so that you&rsquo;d be aware of this option.</p>

<p>Another option is to desecrate right now while using abyss echo (that allows you an additional roll of mods), see if you hit the desired mod. If you do, then you can choose if you want to perfect exalt slam it or not.</p>
</label>
