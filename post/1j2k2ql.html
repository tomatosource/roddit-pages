

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
}

.selfPostContainer * {
  color: white;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/631fsxunkhme1.jpeg"><p>Need some help figuring out where the DPS boost is coming from on this bow</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img src="https://i.redd.it/631fsxunkhme1.jpeg" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="mfsaw5m" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Kkoder</div>
        <div>3 | 2 hours ago </div>
      </div>
      <label for="mfsaw5m" class="commentText"><p>That early in the game the 64% physical damage is huge, and the +1 to projectile levels is also rather significant as well. Maybe even more so than the 64% physical damage.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="mfsbmnz" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>WolfColaKid</div>
        <div>1 | 2 hours ago </div>
      </div>
      <label for="mfsbmnz" class="commentText"><p>+ 1 level is pretty good</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="mfsmemq" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>averycoolpencil</div>
        <div>1 | 43 minutes ago </div>
      </div>
      <label for="mfsmemq" class="commentText"><p>If your mana can handle it, plus project skill will always give you a good boost. Depending on your build, crit is going to be huge. Crit, attack speed, project skills, and then either flat physical damage or cold/lighting damage depending on your build is what you should keep an eye out for.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="mfsqoi9" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>SleepyNymeria</div>
        <div>1 | 22 minutes ago </div>
      </div>
      <label for="mfsqoi9" class="commentText"><p>I mean&hellip; What are you comparing it to is the question.
It has 2 flat mods, and % increase and + lvl. Its a good set of starting mods, especially early on where any damage is good.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="mfsd8cz" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Youre_my_hero</div>
        <div>-1 | 2 hours ago </div>
      </div>
      <label for="mfsd8cz" class="commentText"><p>Wait until late game when you don’t want too many pluses to projectiles. Such a weird thing that as a caster you are constantly looking for items with pluses…especially a minion build. But as a ranger you can’t because you run into so many issues with mana.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="mfsswnt" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>muffinology</div>
        <div>1 | 12 minutes ago </div>
      </div>
      <label for="mfsswnt" class="commentText"><p>It’s really not that bad. Inspiration + a 2% mana on kill jewel solves mana issues for mapping. Thief’s torment for bosses.</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="mfsqidn" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>whenwillthealtsstop</div>
        <div>1 | 23 minutes ago </div>
      </div>
      <label for="mfsqidn" class="commentText"><p>That&rsquo;s nothing special. At this point you&rsquo;re just looking for adds # to # [whatever] damage and % increased physical damage. Proj skills are good but not huge. If you&rsquo;re playing those poison skills then phys damage will do more for you than elemental</p>

<p>If you get a decent piece of gear early on it can be a while until an upgrade drops. My sorc finished the campaign with an act 1 staff</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
