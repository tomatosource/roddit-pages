

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/op06qw3i80bg1.jpeg"><p>Crafting Question</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/op06qw3i80bg1.jpeg" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="nxbssb4" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>van_lioko</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="nxbssb4" class="commentText"><p>Just for a future time, when posting an item screenshot press ALT on the item so we can see the full details.  Also tell us what type of caster you&rsquo;re building as it may influence the prefixes you want (e.g. archmage needs mana, fire caster needs fire dmg, etc.).</p>

<p>For a caster ring, it&rsquo;s always best to have a good cast speed roll to start with. I like rolling white items until I get Cast Speed + Damage (e.g. Chaos Dmg). A decent tier of rarity can be added with a greater essence later if you really need it but most people will opt for resistances.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="nxbwimg" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>toatsblooby</div>
        <div>1 | 29 minutes ago </div>
      </div>
      <label for="nxbwimg" class="commentText"><p>Those are both t1 rarity btw.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="nxc1lwn" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>van_lioko</div>
        <div>1 | 3 minutes ago </div>
      </div>
      <label for="nxc1lwn" class="commentText"><p>Thx edited</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

    
  </div>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nxbvd9t" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>WhichWolfEats | customflair</div>
        <div>1 | 34 minutes ago </div>
      </div>
      <label for="nxbvd9t" class="commentText"><p>Depends on your desired mods. Is this a caster ring? Attack ring? Pure profit ring? What I would do is guarantee a res on it at the very least with an essence. Then catalyze exalt for 5x more chance. This looks like a good roll but with opulence you can guarantee t1 suffix rarity so it actually would be better to start with another suffix. Without knowing your direction though we cannot assist with directing the craft.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nxbt0d3" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Ryurain2</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="nxbt0d3" class="commentText"><p>Greater essence whatever stat you value most, mana/res than desecrate a prefix/suffix of what else you value most so you can reroll that. than catalyst ex slam the rest</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
