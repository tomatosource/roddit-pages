    <h2>
      <a class="postTitle" href="https://www.reddit.com/r/PathOfExile2/comments/1nnkc20/can_we_get_an_advice_on_crafting_mega_thread/"><p>Can we get an &ldquo;advice on crafting&rdquo; mega thread?</p>
</a>
    </h2>

    
    <div class="selfPostContainer">
      <p>Love the game, love this sub, but cut me a big slice o&rsquo; cheese with the endless &ldquo;what should I do?&rdquo; crafting posts.</p>

    </div>
    

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="nfl2uzf" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>pribnow</div>
        <div>1 | 26 minutes ago </div>
      </div>
      <label for="nfl2uzf" class="commentText"><p>There have been a lot of posts about it that is for sure, though I can&rsquo;t help but feel that&rsquo;s more a reflection on &ldquo;high end&rdquo; crafting being unavailable or maybe just too risky for 90% of players. Someone here is smart, this should be something someone should make an LLM do lol</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="nfl6aoe" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>MiniMik</div>
        <div>1 | 4 minutes ago </div>
      </div>
      <label for="nfl6aoe" class="commentText"><p>You&rsquo;re right, it&rsquo;s a multilayered issue.</p>

<ol>
<li>Crafting currency&rsquo;s description is straight up bad. The tiered currency doesn&rsquo;t even tell you what it does, so many people don&rsquo;t know that Perfect exalts remove everything below lvl 50. Then some people don&rsquo;t even know what the level 50 means or that modifiers have levels, because you can&rsquo;t see those in game. You see tiers, and that&rsquo;s only if you alt click. The amount of dependency on poe2db is insane. I literally cannot do anything in the game without it.</li>
<li>Essences are really weird. They don&rsquo;t tell you if the modifiers will be a suffix/prefix, and you have to manually search through them because they apply only to specific bases.</li>
<li>Desecration doesn&rsquo;t even bother to tell you the tier of the mod.</li>
<li>Some people don&rsquo;t even know about the existence of some crafting omens because they&rsquo;re rare, and they&rsquo;ve never seen them.</li>
<li>Some modifiers cannot be rolled on certain bases but can be rolled on others. No information about this anywhere.</li>
<li>And some people are simply lazy. Instead of searching a similar post or even googling the craft, they come here and post the item without showing the mod tiers and ask &ldquo;help pls noob here&rdquo; with 0 information about the craft. I remember having to ignore the poe1 subs a few months ago because it devolved into &ldquo;fross build help pls&rdquo; that were getting posted at the rate of several per hour, and no one bothered to search anything. Something similar is starting to happen here.</li>
</ol>
</label>
    </div>
  </label>
  
</div>
