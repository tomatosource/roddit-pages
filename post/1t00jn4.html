      <label for="oj5j834" class="commentText"><p>From Chris Forsberg:</p>

<p>It’s late March when Jordan Walsh plops down in a director’s chair in a theater where we are taping interviews with the members of the Celtics. It’s one day before Walsh, who at times earlier in the 2025-26 season felt like he was finally on the path to consistent playing time, will log his sixth consecutive DNP.</p>

<p>Walsh started 20 consecutive games from Nov. 12 to Jan. 1, raising eyebrows around the league <a href="https://www.nbcsportsboston.com/nba/boston-celtics/jordan-walsh-defense-stats-cavaliers/750590/" target="_blank">with his relentless energy and defensive potential</a>. But his playing time slowly evaporated, culminating with this late-March dry spell.</p>

<p>As Walsh waited his turn in our chair, he was punching away at his phone. On the other end was former Celtics forward Xavier Tillman, who played sparingly here over two-plus seasons but never let a lack of floor time dictate his attitude and approach. Tillman was ready whenever called upon, including in key spots during the team’s 2024 NBA Finals triumph over the Dallas Mavericks.</p>

<p>Walsh learned a lot about what it means to be an elite teammate and a true professional by watching the way Tillman carried himself in Boston. Tillman got dealt to Charlotte in a series of cost-cutting moves at the February trade deadline.</p>

<p>But Walsh continues to lean on Tillman’s wisdom in the aftermath.</p>

<p>“We talk all the time, even if it&rsquo;s not basketball-related,” said Walsh. “Sometimes it&rsquo;s just me sending him Instagram reels of funny stuff and him sending something back. Or like food &ndash; we talk about food a lot, too. It&rsquo;s just random stuff but I think that&rsquo;s a big part, too.</p>

<p>“[Tillman is] a guy who&rsquo;s removed from our organization and is technically competing against us now, [but he’s] still looking out for the best for me and trying to give his help as a vet. I think it&rsquo;s huge.”</p>

<p>How ironic, then, that just a couple days after our chat, Walsh returned to the lineup, making a spot start against Tillman’s Hornets. In fact, Walsh made 10 straight appearances to close out the regular season (including five starts) while reaffirming his ability to help Boston with his defensive tenacity and energetic rebounding.</p>

<p>Being ready for the moment helped Walsh state a case for postseason playing time. He’s appeared in all five games for Boston in these playoffs, often being an early sub tasked with chasing All-Star guard Tyrese Maxey through a never-ending gauntlet of screens. But Walsh dutifully fights through every Andre Drummond and Joel Embiid pick as if staying attached to Maxey is the key to his survival.</p>

<p>Entering Game 6 of an <a href="https://www.nbcsportsboston.com/nba/boston-celtics/live-updates-76ers-game-5-highlights-score/785614/" target="_blank">Eastern Conference first-round series against the Philadelphia 76ers</a>, and with the Celtics facing a second chance to close out an Atlantic Division rival Thursday night, Walsh leads Boston&rsquo;s playoff regulars in defensive field goal percentage differential, holding his opponents to 9.5 percent below expected output.</p>

<p>Opponents are shooting 36.4 percent when Walsh is the primary defender, per NBA tracking. Chasing Maxey is a thankless and nearly impossible task. Maxey has generated 15 points on 6-of-13 shooting with two turnovers and a blocked shot while defended by Walsh. All other Sixers players are 2-of-9 shooting with four points when Walsh is the primary defender.</p>
