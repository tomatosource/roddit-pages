    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;

}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>

      <div class="commentHeader">

        <div>1 | 2 hours ago </div>
      </div>
      <label for="nd8oima" class="commentText"><p>Little twist to Bleed/Poison builds. Just starting maps, build is in progress and gear is lacking, but wanted to showcase a proof of concept.</p>

<p>With Witch Hunter I built around the weapon set passive points by allocating Bleed and Poison nodes separately to get most out of them.</p>

<p>Clear: Gas Grenade with Bursting Plague that bleeds which then triggers Herald of Bloods that also has Bursting Plague. Rake-Disengage provides mobility and singling out tankier mobs. Plague Bearer works as a nuke that surprise surprise, also bleeds! (Given how epilepsy inducing builds out there are these explosions save from eyestrain quite well)</p>

<p>Bossing: Swap Bursting Plague out of Gas Grenade and add Corrosion to provide armour break for HVR, which then adds Riven Armour and Impale for Rake which has Exploit Weakness swapped in for rinse and repeating until Blood Hunt. (Shark boss was quite annoying for this)</p>

<p>I&rsquo;m pretty happy with current setup, but some issues to solve are more crit for bleeds and intense mana usage. Gas Grenades are also funky, Detonation time seems bugged since Short Fuse and Volatile Grenades node won&rsquo;t affect it. Former changes the tooltip, but takes the same time while latter won&rsquo;t even change the tooltip.</p>

<p>Anyways, hope this inspires further iterations, save your eyes and fart blood!</p>
</label>
