

<html>

    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>

      <label for="nou884l" class="commentText"><p>Pritchard’s come up is no joke. I grew up playing against the dude. Just to give you a sort of rough outline on what it was like in the area he grew up, read this harrowing narrative from Chael Sonnen:</p>

<p><em>“I don&rsquo;t know that I&rsquo;m a &lsquo;self-proclaimed&rsquo; gangster. I&rsquo;m from the mean streets of West Linn, Oregon, and I&rsquo;ve seen things and been through things that somebody like you, in your little pearly loft, couldn&rsquo;t even relate to,&rdquo; said Sonnen.</em></p>

<p><em>In fact, Sonnen seems emotional at first, as if he is going to share some dark stories from his childhood with the interviewer.</em></p>

<p><em>&ldquo;If you&rsquo;re asking me to share stories with you, that are frankly none of your business, maybe I&rsquo;ll give you a couple and maybe you&rsquo;ll take that little smug look off your face.&rdquo;</em></p>

<p><em>&ldquo;I can date back to when I was 11-years-old. I&rsquo;m minding my own business and I&rsquo;m in a park. This guy, a stranger to me, takes a piece of gum out of his pocket. He puts it in his mouth and then he just throws the wrapper on the ground. He publicly litters. And I saw that! I had to see these things at a young age. Sure somebody came along, picked it up, and threw it in a trash can, but for the few moments where that sat on the ground and the law was violated in my neighborhood&hellip;&rdquo;</em></p>

<p><em>&ldquo;We have chaos. We have anarchy at times in West Linn. There was years when my father didn&rsquo;t even make a-hundred-grand—or barely made a-hundred-grand—and sure we had a maid, but she only came twice a week. What do you think happened the other five days? You think those dishes washed themselves? You think those clothes got themselves in the hamper?&rdquo;</em></p>
