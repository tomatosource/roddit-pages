

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/93vw92ln6xpf1.jpeg"><p>Wisps be like</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/93vw92ln6xpf1.jpeg" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="nevo4x1" type="checkbox" checked/>

      <div class="commentHeader">
        <div>Straikkeri</div>
        <div>18 | 4 hours ago </div>
      </div>
      <label for="nevo4x1" class="commentText"><p>This is actually what you want, as wisps gather drop % based on monsters they touch and you kill along the path to the possessed rare, as far as I know. So, more the better.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">

        <div>maleks45110</div>
        <div>11 | 2 hours ago </div>
      </div>
      <label for="new9hy3" class="commentText"><p>The wisp should attach to your body, like a circle spinning around you, possessing monsters near you… and as the time goes on, the possessions are harder.. monsters are stronger, you somehow have to release it to the first rare monster you encounter.. You must either greed and corrupt as much monsters as possible at the risk of dying but get more loot, or go as fast as possible to the nearest rare for no risk.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">

      </div>

</div>

      </div>
      <label for="new3vkx" class="commentText"><p>Stops moving if you get ahead , have to wait for it to actually get inside the mob .
Just make it pick a mob and go there automatically in your sprint speed and if you dont follow up in some time then it goes away.
It should be the hunt of the spirit not the escort of an old lady across the street</p>
</label>

  <div class="commentList">

        <div>1 | an hour ago </div>
      </div>
      <label for="newlg53" class="commentText"><p>At least it speeds up when you sprint, I suppose, but yeah. Escorts quest in an ARPG map is a tad counter-intuitive. </p>

  </label>
  
</div>

    
  </div>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nevptwo" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Zenniester</div>
        <div>4 | 4 hours ago </div>
      </div>
      <label for="nevptwo" class="commentText"><p>I hate the whisps I wish I could remove them.  The rewards suck and they take me off my path.  I do them if they are going my way and keep up otherwise they can go kick rocks.  Same with Dwight, that&rsquo;s what we call the dude.</p>

</div>

    <div class="comment">
      <div class="commentHeader">
        <div>triplesix7777</div>
        <div>1 | 2 hours ago </div>
      </div>
      <label for="new9au1" class="commentText"><p>Don&rsquo;t forget to be careful to not kill the mob before it gets possesed</p>

    </div>

</div>

</div>

        
      
    </div>
  </body>
</html>
