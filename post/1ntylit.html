

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://v.redd.it/cm22uz2t27sf1"><p>I&rsquo;m gonna miss leveling with Quill Rain</p>
</a>
    </h2>

    

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="ngx9s3i" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>projectwar</div>
        <div>5 | 5 hours ago </div>
      </div>
      <label for="ngx9s3i" class="commentText"><p>would kill faster with just a good rare at that level for 2-5ex.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="ngxcxao" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Jslcboi</div>
        <div>8 | 4 hours ago </div>
      </div>
      <label for="ngxcxao" class="commentText"><p>Yeah some powerful rare bow would would be optimal and I tried a few of them but Quill Rain&rsquo;s attack speed had me addicted and I didn&rsquo;t want to switch out.</p>
</label>
    </div>
  </label>
  
</div>

    
      
<div class="commentAndChildren">
  <input id="ngxa5sy" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>arsonist_firefighter</div>
        <div>6 | 5 hours ago </div>
      </div>
      <label for="ngxa5sy" class="commentText"><p>Indeed. Would it be as fun as having a machine gun as a bow? I don&rsquo;t think so.</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="ngxbaon" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Oonz1337</div>
        <div>2 | 5 hours ago </div>
      </div>
      <label for="ngxbaon" class="commentText"><p>Yeah that’s fun to watch but a decent slower bow could easily output 5x more damage for like 1 ex every 8 or so levels lol</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="ngycjl1" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Caeyll</div>
        <div>1 | 4 minutes ago </div>
      </div>
      <label for="ngycjl1" class="commentText"><p>I wanted to make this work so bad while levelling. Ended up with Splinterheart Recurve Bow, which splits projectiles towards +2 targets.</p>

<p>Ice shot was unparalleled on mobs - I’d be 1-tapping the screen, compared to a rare bow with 5x more dps it just wasn’t able to keep up (except for bosses).</p>

<p>But yeah, never got round to finding something viable for Quill Rain that didn’t take much investment. There was those gloves that give Lightning damage to attacks per INT threshold or something, but was more a late game build for it, among other silly nodes that required you to be standing on top of the boss to enable the damage.</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
