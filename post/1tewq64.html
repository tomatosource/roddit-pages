

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/y0hgt8c2pi1h1.jpeg"><p>I know all about How Retrosheet Saved Baseball History so AMA</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/y0hgt8c2pi1h1.jpeg" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="om5hdd3" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>lpomahony | Los Angeles Dodgers</div>
        <div>7 | 8 hours ago </div>
      </div>
      <label for="om5hdd3" class="commentText"><p>This looks awesome, can’t wait to read the book. </p>

<p>What do we take for granted as part of baseball history that was only uncovered because of retrosheet? It’s crazy to think about all the things that could have been lost to time. </p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="om5bl2n" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>No_Movie5136</div>
        <div>4 | 9 hours ago </div>
      </div>
      <label for="om5bl2n" class="commentText"><p>I had no idea how much work went into preserving all that historical data we take for granted when diving into baseball stats. Been using those sites for years without thinking about where all those box scores from the 1940s actually came from. The volunteer aspect is what gets me - people just dedicating their time to make sure we dont lose decades of baseball history. As someone who manages projects for work I can only imagine the coordination nightmare of getting all that data collected and verified across so many volunteers. What was the biggest challenge you encountered while researching how they pulled this whole thing together? The logistics alone must have been insane back in the pre-internet days.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="om6akdf" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Ok_Context_8200</div>
        <div>3 | 6 hours ago </div>
      </div>
      <label for="om6akdf" class="commentText"><p>What one stat is lost to history that would be your holy grail to find? And what is a known statistic that you personally doubt the validity of?</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
