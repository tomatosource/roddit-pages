    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {

}

blockquote {

.subName {

.postList {
  display: flex;

}

.post {

.postLink {

}

.postLink:visited {

.postHeader {

  font-size: 24px;
  font-weight: bold;

}

.commentList {

  flex-direction: column;

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;

}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {

  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;

    <h2>
      <a class="postTitle" href="https://www.reddit.com/r/PathOfExile2/comments/1s861t0/at_what_point_do_you_decide_a_build_is_not_viable/"><p>At what point do you decide a build is not viable anymore?</p>
</a>
    </h2>

    
    <div class="selfPostContainer">
      <p>Early mapping? Endgame? Bossing?</p>

    </div>
    

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="odeg65a" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>ElMuchoQueso</div>
        <div>1 | 36 minutes ago </div>
      </div>
      <label for="odeg65a" class="commentText"><p>You can pretty well tell in early mapping. I personally hate most caster builds. I’m just not good at building the and they often require way too much investment. Skimp on any of it and the build sucks. I give up on them immediately once it feels like a pain in the ass.</p>

<p>Also, boredom. Gave up on poison pf and shield wall titan out of sheer boredom.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="odehj52" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>shy_catwoman</div>
        <div>1 | 28 minutes ago </div>
      </div>
      <label for="odehj52" class="commentText"><p>Poison pf is so boring!  Very strong but couldn&rsquo;t handle the slowness of shooting the arrows and that was basically all you did.</p>
</label>
    </div>
  </label>
  
</div>

    
      
<div class="commentAndChildren">
  <input id="odem5yi" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>wowitssprayonbutter</div>
        <div>1 | 3 minutes ago </div>
      </div>
      <label for="odem5yi" class="commentText"><p>Same, I can tell my build is trash when I struggle with mid tier maps.  </p>

<p>Your point of <em>no longer fun</em> being the main build bricker is incredibly overlooked</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="odejf55" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Dazzling_Vanilla3082</div>
        <div>1 | 18 minutes ago </div>
      </div>
      <label for="odejf55" class="commentText"><p>As a new player I&rsquo;ve been wondering this too. I&rsquo;ve been playing a warp sorceress build as my first character the last two weeks and was able to get pretty solid gear for a couple divs when I hit maps. With that I pretty much cruised my way to 15s, where I got some lucky drops and managed to spend another 1300 divs or so on more higher end gear. Now I&rsquo;m left wondering if this is pretty much the ceiling of this build and its time to swap. Maps arent too tough; I spike a death once in a while on 16s even with the 10k+ ES, but that&rsquo;s more user error with positioning than the build I think. I do struggle a bit on boss damage though- the boss fights are pretty slow, and I&rsquo;m not sure how standard that is for other builds. Normal Arbiter of Ash took me like 15 attempts, and I still die 1-3 times on every Atziri attempt. I might just be done with the this season already since I don&rsquo;t think I want to invest time into farming for a different build, and I&rsquo;m not sure how much this one will improve even if I grind for mirror tier gear.</p>

<p>I also never really looked into building the temple so if I wanted to spend time on that content, I&rsquo;d be starting from scratch haha.</p>
</label>
    </div>
  </label>
  
</div>
