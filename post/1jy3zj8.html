

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>

<div class="commentAndChildren">

<div class="commentAndChildren">

    <div class="comment">
      <div class="commentHeader">
        <div>Worldeditorful</div>
        <div>1 | 12 minutes ago </div>
      </div>
      <label for="mmvh8zy" class="commentText"><p>On builds I experienced in 0.2.0 (Fire Crossbow Witch Hunter and Boneshatter Smith of Kitava) it was a BIG step into right direction. Thats the first league that I have full skillbar of active skills and there is reason to use all of them constantly and put some strategy and thinking into it.</p>

<p>I aknowledge that tons of skills were a total fuckup on GGGs side and they became that worthless, that they basically dont exist, BUT its much easier to buff them to viable level, than build a system in ARPG, that works in those 2 builds I played. So my hopes and expectations went up by a mile.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="mmvg1rs" type="checkbox" checked/>
    <div class="comment">

        <div>MatyeusA</div>
        <div>1 | 25 minutes ago </div>
      </div>
      <label for="mmvg1rs" class="commentText"><p>I feel like scaling should be as such:</p>

<p>Story:<br>
- White - No Combo<br>
- Blue - 1 AoE Combo<br>
- Yellow - 1 Single Target Combo<br>
- Orange - Multiple Single Target Combos</p>

<p>Maps:<br>
- White - No Combo<br>
- Blue - No Combo<br>
- Yellow - 1 Half-Combo to No Combo<br>
- Orange - 1 Single Target Combo<br>
- Pinnacle Bosses - Multiple Single Target Combo</p>

<p>But to be honest, for that combos need to become more effective.</p>
</label>

  </label>
  
</div>

      </div>
      <label for="mmvhsxq" class="commentText"><p>I think a big problem with the combo gameplay is also how limited we are on skill slots.</p>

<p>I&rsquo;m playing a combo build right now, and it&rsquo;s really rough fitting in everything. One button builds don&rsquo;t need to fit a bunch of combo pieces they just spam their one skill with a few extra things.</p>
