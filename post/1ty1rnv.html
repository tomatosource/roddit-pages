

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/wbuis1qvyj5h1.jpeg"><p>Suggestion : Nodes with multiple options should include a negative option specifically for that content</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/wbuis1qvyj5h1.jpeg" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="oq05jqw" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>shawnkfox</div>
        <div>8 | 4 hours ago </div>
      </div>
      <label for="oq05jqw" class="commentText"><p>What they really need is just some buttons out to the side which allow you to completely disable any of the content that is part of the main atlas tree.  This is especially important for when you have a 2nd character which isn&rsquo;t prepared to deal with juiced maps yet.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="oq0omt0" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Laggo</div>
        <div>3 | an hour ago </div>
      </div>
      <label for="oq0omt0" class="commentText"><p>The whole reason they are doing the &lsquo;no respec&rsquo; atlas is so you aren&rsquo;t pressured to constantly change your atlas based on the content you are trying to run.</p>

<p>If you add this, are you not just bringing back this problem as it&rsquo;d be optimal to turn off the mechanics that aren&rsquo;t relevant for your strategy / map area at the time?</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="oq0z4hc" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Lou2013</div>
        <div>1 | 13 minutes ago </div>
      </div>
      <label for="oq0z4hc" class="commentText"><p>The atlas currently gives more content that&rsquo;s kinda of &lsquo;free juice&rsquo; if it shows up, but if you&rsquo;re trying a janky new build thats weak or leveling an alt or just want less crap in the map/hate specific content it&rsquo;d be great to be able to turn this stuff off.</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="oq0jlki" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Hardyyz</div>
        <div>2 | 2 hours ago </div>
      </div>
      <label for="oq0jlki" class="commentText"><p>Yeah I was thinking that too, but even at the start you could have a choice node of 50% increased rogue exiles / no rogue exiles at all etc.<br>
Then you could easily always turn things on or off</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="oq0rguk" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Brave_Willow3047</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="oq0rguk" class="commentText"><p>What they really should do is redu ce Atlas points by half so people will think about the strategy and not just use Atlas as a coloring book</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
