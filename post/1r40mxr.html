}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {

.selfPostImage {

.streamableContainer {

  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

      <label for="o58bcgz" class="commentText"><p>Forgot the description. so here it is:</p>

<p>After finalising my Poison Doedre build (which i posted here: <a href="https://www.reddit.com/r/PathOfExile2/comments/1qw4dgy/shadow_at_home_poison_doedres_undoing_blood_mage/" target="_blank">https://www.reddit.com/r/PathOfExile2/comments/1qw4dgy/shadow_at_home_poison_doedres_undoing_blood_mage/</a>) i wanted to quit this league but got sick (and then bored). So i tried a melee cast on ailment Elemental Tornado build (favorite spell in poe1). But that didn&rsquo;t work out. Before quitting the league for good i decided to salvage the gear from my last build and switched to a Doedre setup. The result is a extremly fun, punchy and fast mapper that can also handle pinnacle bosses quiet well.</p>

<p>The concept: stack some damage as extra elemental damage, cast ele weakness + doedre + tuls stillness + burning inscription to apply ele ailments thats trigger tornados and  also create ground effects in interaction with the invoker ascendancy notes that boost the damage of the tornados.</p>

<p>Mostly an 1-button build but you don&rsquo;t have to spam Doedre except in boss fights.</p>

<p>In +ailment treshold maps (or with not enough doedre damage) you have to alternate between ele weakness and thunderstorm to generate enough energy. for bossing cast an infuesed ice nova for chilled ground because you won&rsquo;t freeze the boss and and switch from effieceny to conc area in COA.</p>
