

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/z7cm8lax3jkh1.jpeg"><p>Someone just gave me this stuff</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/z7cm8lax3jkh1.jpeg" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="p4tg0vt" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Keithrake</div>
        <div>1 | 5 minutes ago </div>
      </div>
      <label for="p4tg0vt" class="commentText"><p>In the bottom middle, the 10 divines you have are worth more than everything else by a good amount. I would just sit on those until you are further along in the game. Eventually you&rsquo;ll know how to work faustus and be able to trade those in for more of the chaos/exalted orbs, or directly for gear on trade.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="p4tgao3" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>oldglassofmilk</div>
        <div>1 | 4 minutes ago </div>
      </div>
      <label for="p4tgao3" class="commentText"><p>He gave you a pretty good ammout</p>

<p>Use the exalt orbs, the chaos and divine keep for later to trade, they re expensive</p>

<p>The cubes are also worth a few div each</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="p4tgdhn" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Azaai</div>
        <div>1 | 3 minutes ago </div>
      </div>
      <label for="p4tgdhn" class="commentText"><p>Those are used for crafting and are the main currency in the game. You can use them to trade for all different kinds of gear.<br>
When you play a little longer you will unlock currency exchange. There you can change for the different kinds of currency.<br>
Use that currency to fund your story / leveling gear and later your starter gear for mapping on the trade website or the ingame tradehouse.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="p4tgeav" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Xeratas</div>
        <div>1 | 3 minutes ago </div>
      </div>
      <label for="p4tgeav" class="commentText"><p>You could play for 30+ hours and will not make this much currency.</p>

<p>For high end players its not that much but if you&rsquo;re just starting out its a Shit load of currency.</p>

<p>But be aware, you might spoil yourself by spending it too early. Maybe just keep most of it in stash and only spend some if you done with campaign or feel like you are stuck.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="p4tfn4l" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>HiroYui</div>
        <div>1 | 7 minutes ago </div>
      </div>
      <label for="p4tfn4l" class="commentText"><p>Yes it’s good for leveling go on poe2 trade (the official trade store of the game) and for 1 ex you can get really good gear!</p>

<p>Have fun!</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
