    <h2>
      <a class="postTitle" href="https://www.youtube.com/watch?v=KsVVpfxB0Lw"><p>As a Chonk Main I am laughing and crying watching this.</p>
</a>
    </h2>

    

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="nczqxxo" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>ZerioctheTank</div>
        <div>3 | 4 hours ago </div>
      </div>
      <label for="nczqxxo" class="commentText"><p>It feels like monk was made with invoker in mind, and chonk was just an afterthought. One can argue that original sin helps chonk greatly, but there&rsquo;s been a lot of talk about it being a downgrade in damage. Also, why does one ascendancy have to rely solely on one unique? Darkness is still subpar at best. Who wants to lose all of their spirit buffs for a shield? Then to top it off we have a notable that allows chaos damage to contribute to freeze, shock &amp; flamability, but you can&rsquo;t control it in anyway. Luckily this is an early access game, so things can change. So there&rsquo;s time for our sith lord acoylte of chihuahua to get the love it absolutely deserves. We need actual chaos skills with monk in mind. Darkness needs to either take half your spirit away or be reworked again. Or how about have our elemental damage converted to chaos, but have it maintain the corresponding elemental ailment of the element it was converted to?</p>
</label>
    </div>
  </label>
  
</div>

<div class="commentAndChildren">

<div class="commentAndChildren">
  <input id="nd08s2f" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>RombyStormbringer</div>
        <div>1 | 2 hours ago </div>
      </div>
      <label for="nd08s2f" class="commentText"><p>It&rsquo;s obvious to me that people at GGG are well intended but the focus was on too many things at the same time</p>

<p>While I hate the fact that even with 90% phys and elemental reductions to damage and no extra damage from crits still get you one shotted, making defenses rather useless really, I have realized that the design of the abyss boss is not thought through either</p>

<p>While the support gems are awesome to work with and the in game info about most things is really there and helping one out with a handmade build, the monsters design team somehow thought that releasing a boss that can insta kill you with where you also have  a 3 meters wide encounter area was okay</p>

<p>I mean fun stuff, today I died like ~100 times to beat the abyss boss at the lowest difficulty because even though I have 90% everything as stated above, I get deleted in less than 2 seconds by anything that the boss can do, except for simple melee attacks that still deal half hp damage</p>

<p>I mean the fact that these things happen, the monk only having one ascendancy class viable and the fact that melee is not meant survive in any way shows that we are far from a game with normal experiences</p>

<p>It&rsquo;s always going to be survival with the fittest with whatever build we can find</p>

<p>And imagine this is the best aRPG out there and still there&rsquo;s so many things to be changed for it to be actual action and not mechanical pressing of buttons</p>

<p>While much has changed from PoE1, little has changed and it&rsquo;s gonna take years still</p>

<p>One thing at a time</p>

<p>I think they over extended their priorities and the league mechanic has been rushed through which means many other aspects of the game may have suffered the same</p>

<p>What we can do is do the most out of what we have, really</p>
</label>

</div>

      </div>
      <label for="nd0nl0h" class="commentText"><p>As funny as this is there are some misconceptions. You didn’t need Atziris to sustain last season, Voracious in a Megalomaniac or instil was more than enough. Scale your levels up to 34+ and it also sustained easily.</p>

<p>Second, you can stack volatility easily. I run around with 100% constantly. There’s a node tha my refunds volatility on detonation and you can chain them over and over using a fast detonator. I run Siphoning strike as my detonator and loaded it with attack speed so I can spam it over and over (it has 7 attacks per second) to blow up my volatility.</p>

<p>Chaos leech isn’t bad. I’m using hybrid gear with EB and T1 mana on everything, I have just over 3k mana and I run damage to mana first at a <sup>72</sup>&frasl;<sub>28</sub>% ratio (28% to life).</p>

<p>I’m unbelievably tanky and I can one hit wallop T4 Xesht using the same culmination strategy as last season.</p>

<p>Chayula is very VERY fucking good right now. With the right build you clear super fast and are extremely hard to kill.</p>
