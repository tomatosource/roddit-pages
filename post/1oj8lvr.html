      <label for="nm1358l" class="commentText"><p>From Chris Forsberg:</p>

<p>Payton Pritchard ranks second on the Celtics while generating 10 drives per game. He’s shooting 73.3 percent off drives and is generating 7.5 drive points per game, which ranks just outside the top 30 in the NBA. </p>

<p>Even as Pritchard’s long-range shot defies him early in the season, he’s thriving when venturing inside the arc. One of the best rim-finishing guards in the NBA in recent years, Pritchard has connected on 10 of 13 attempts in the short midrange (4-14 feet) and is 12 for 18 on all mid-range attempts this season. That ranks No. 1 among all point guards in both shot zones, per Cleaning the Glass data. </p>

<p>Even with increased touches in a starter role, Pritchard is taking care of the basketball, finding creative ways to generate points, getting others involved, and consistently attacking the offensive glass. Now he just needs that familiar 3-point shot to settle in.</p>

<p>The Celtics still have a glossy 117.4 offensive rating in Pritchard’s team-high 138 minutes. Boston is outscoring opponents by 7.8 points per 100 possessions with Pritchard on the court. </p>

<p><a href="https://www.nbcsportsboston.com/nba/boston-celtics/key-stats-pritchard-queta-jaylen-brown/743032/" target="_blank">Read more here</a>.</p>
