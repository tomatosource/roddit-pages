

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://www.reddit.com/gallery/1nhbdlj"><p>Mace Craft - 2 Hander DPS in 1 Hand</p>
</a>
    </h2>

    

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="neayv6l" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>apfelicious</div>
        <div>1 | 5 hours ago </div>
      </div>
      <label for="neayv6l" class="commentText"><p>Why did you start with flat phys + % phys and desecrate the hybrid?</p>

<p>It appears that flat phys would have the highest weighting to desecrate, or are the other steps just even worse so it is better to &ldquo;spend&rdquo; your high weighted mods there?</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="nebr06o" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>PoEpoPO</div>
        <div>1 | 18 minutes ago </div>
      </div>
      <label for="nebr06o" class="commentText"><p>Because this is an exceptional base so I didn&rsquo;t have the luxery of straight up buying a base with T1 mod on it. Had to Chaos Spam, and I stopped if I had T1 Added Phys or T1 Phys % to try to fracture either one.</p>

<p>While Flat would be easier to desecrate, as I mentioned, the odds of divine a flat roll to something acceptable are very low, so having an acceptable flat roll that&rsquo;s fractured saves a lot on the backend when you have to divine the rolls.</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nebd5rv" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Vulperffs</div>
        <div>1 | 3 hours ago </div>
      </div>
      <label for="nebd5rv" class="commentText"><p>One handed maces are obviously better than 2handed with Giant’s Blood once you get a good DPS with one handed. The HP loss is too much!</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nebg763" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>FrontBackground3611</div>
        <div>1 | 2 hours ago </div>
      </div>
      <label for="nebg763" class="commentText"><p>Try Sunder, if you get enough attack speed you can practically skip the jump animation and make it feel incredibly good. With that weapon also you can basically one shoot everything anyway.<br>

</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
