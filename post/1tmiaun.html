

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/5gzsgd99d43h1.jpeg"><p>GGG: Please reveal „Embrace the Fall“ data</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/5gzsgd99d43h1.jpeg" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="onn0dv3" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Xilarch</div>
        <div>1 | 9 minutes ago </div>
      </div>
      <label for="onn0dv3" class="commentText"><p>The shield is a high level unique drop. By the time you can get it, you&rsquo;ll have had time to plan a build around it.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="onn1dch" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Wiceradon</div>
        <div>1 | 4 minutes ago </div>
      </div>
      <label for="onn1dch" class="commentText"><p>Well yeah but if you start as a resonating shield/shield wall build with this shield in mind and you get first data from leagues first drop, it could waste your starting plans. At best its kinda forcing you to have a backup plan.</p>

<p>And what even is the argument for not sharing it? We have seen the skill &amp; how it works mate, just need the numbers.</p>
</label>
    </div>
  </label>
  
</div>

    
      
<div class="commentAndChildren">
  <input id="onn1gvq" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>SirSabza</div>
        <div>1 | 4 minutes ago </div>
      </div>
      <label for="onn1gvq" class="commentText"><p>But he&rsquo;ll probably want to play a usable build with limited respeccing to get it.</p>

<p>Presumably you can get this shield from your first leutenant tutorial fight. As its not the chase unique of breach.</p>
</label>
    </div>
  </label>
  
</div>

    
      
<div class="commentAndChildren">
  <input id="onn1rre" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Snarfsicle</div>
        <div>1 | 2 minutes ago </div>
      </div>
      <label for="onn1rre" class="commentText"><p>I low key hate how so many of the really fun uniques are locked behind levels where you won&rsquo;t get to play with them for the majority of most players playtime during the league</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

        
      
    </div>
  </body>
</html>
