

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/bmsl7iuo8hdf1.jpeg"><p>Is it normal to use low level gear into endgame?</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/bmsl7iuo8hdf1.jpeg" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="n3of3gv" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>AgoAndAnon</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="n3of3gv" class="commentText"><p>Unfortunately. This is because the affix pool for items gets larger and more polluted with useless stuff as you get higher level.</p>

<p>Both this league and last league, I found a +2 phys wand in an act 2 or 3 shop, checked shops any time I went back to town, and never found something better.</p>

<p>Found equivalent things a few times, but never better things.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="n3ohhq1" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Speaker4theDead8</div>
        <div>1 | 43 minutes ago </div>
      </div>
      <label for="n3ohhq1" class="commentText"><p>I&rsquo;ve done a tier 3 waystone pretty easy, but I don&rsquo;t think I will be able to go much higher. My essence drain says it&rsquo;s doing 4k DPS, but I don&rsquo;t know how accurate that is (or if it&rsquo;s good). I&rsquo;ve unlocked all the +chaos DMG passives and working on energy shield now, but I feel like I need something to give me a boost to the &ldquo;next level&rdquo; so to speak.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="n3oiedq" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>xenaga</div>
        <div>1 | 39 minutes ago </div>
      </div>
      <label for="n3oiedq" class="commentText"><p>Are you ssf? Else i can give you some divs and i think i had a wand eith +4 chaos spells.</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

    
      
<div class="commentAndChildren">
  <input id="n3op5jg" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>yawgmoth88</div>
        <div>1 | 7 minutes ago </div>
      </div>
      <label for="n3op5jg" class="commentText"><p>So goddamn backwards. One of my personal issues with PoE in general.</p>

<p>We all made fun of Elon (“only lvl 82, could be better”). But item levels <em>should</em> be both easier and more relevant.</p>

<p>What I mean by this is that most vets know that certain affixes/tiers can only roll on higher level items. This is fine. But to keep low rolls just sucks up currency trying to craft the item to be better.</p>

<p>In my (very) humble opinion, lesser tiers should fall off of items as they increase in level so that it 1) incentivizes crafting at lower levels and 2) allows players to get excited when a higher level item drops even if it is unoptimized.</p>

<p>I also think that top tiers should roll at level 80- full stop. Any item leveled above 80 just has the roll weights adjusted to hit the good affixes easier. If you have two identical wands to craft, but one is level 80 vs a level 82, you should still feel good about trying to craft the level 80 even though you will most likely try the level 82 first.</p>

<p>Idk, my $.02 on this. Items, filters, etc are already challenging for newer players, too. But I am unsure if this would help or hinder them.</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="n3of158" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>elew21</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="n3of158" class="commentText"><p>My new lvl 75 monk is wearing gloves I got in act 3 because they have triple flat and fire and cold resist. I&rsquo;m in a private league which is basically SSF and nothing has dropped that has had the equivalent of flat damage or more resistance.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="n3okdju" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>VulpesVulpix</div>
        <div>1 | 30 minutes ago </div>
      </div>
      <label for="n3okdju" class="commentText"><p>remember to check out vendors but yeah, same experience here, my first playthrough i used my lvl 24 wand until endgame because it had high +to level of spells</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="n3onfes" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Xeiom</div>
        <div>1 | 15 minutes ago </div>
      </div>
      <label for="n3onfes" class="commentText"><p>This is especially the case for spells when you are not using the granted skill. They scale generally off the skill level so when you have a few good stats it is harder to replace them.</p>

<p>If you were using melee weapons then you are more likely to replace them because you do need that higher base damage on the weapon itself.</p>

<p>Usually the result of getting a nice item early on is that you will take absolutely forever to replace it because they have no system of reliable improvement. In PoE1 if you go too long with something low level you usually craft something to replace it even ssf but PoE2 crafting is as unreliable as the ground loot.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="n3ofkeh" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>CamBlapBlap</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="n3ofkeh" class="commentText"><p>Pretty normal for the ssf experience, use  the beat available.</p>
</label>
    </div>
  </label>
  
</div>
