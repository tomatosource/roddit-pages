      <label for="nsyljbq" class="commentText"><p>From Chris Forsberg:</p>

<p>Derrick White’s shot regularly defied him as the Celtics limped to a 5-7 start. But part of the reason the team has gotten itself on track has been White getting himself - and his shot - going again. </p>

<p>Maybe the most striking number in Boston’s recent five-game winning streak is the confidence White is oozing in his pull-up jumper. Over that span, White is averaging 14.8 points per game off pull-up jumpers, well above his season average of 8.1 pull-up points per game. He’s shooting 53.7 percent overall from the field and 46.9 percent from beyond the arc on pull-up attempts.</p>

<p>On Sunday, White didn’t just make pull-up shots, he made ridiculous pull-up shots. Scrambling in front of the Raptors bench early in the fourth quarter, White pirouetted into Boston’s toughest make of the day (the NBA’s stats tracking gave it a 30.1 percent expected make rate). A 32-footer he threw in from just outside the midcourt logo a short time after &ndash; which felt like it got launched from nearby Mississauga &ndash; was only slightly easier (31.4 expected make rate).</p>

<p>White ranks 17th in the NBA in pull-up shooting at 8.1 points per game this season. Since late November, White has spiked to fifth in the NBA at a team-best 13 pull-up points per game. Only Jamal Murray, Luka Doncic, Shai Gilgeous-Alexander, and Kawhi Leonard sit ahead of him in that span.</p>

<p><a href="https://www.nbcsportsboston.com/nba/boston-celtics/derrick-white-shooting-stats-raptors/752398/" target="_blank">Read more here</a>.</p>
