

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://www.reddit.com/r/PathOfExile2/comments/1ph4mox/do_you_think_werewolf_will_have_any_poison_skills/"><p>Do you think Werewolf will have any poison skills?</p>
</a>
    </h2>

    
    <div class="selfPostContainer">
      <p>Some “rabies” themed poison or chaos skills would be nice.</p>

    </div>
    

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="nsw6gde" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Nesciuss</div>
        <div>1 | 41 minutes ago </div>
      </div>
      <label for="nsw6gde" class="commentText"><p>I think we gotta wait for shadow for actual poison support, or maybe duelist might have one or two skills?</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nsw7bpy" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Queen__Natalie</div>
        <div>1 | 34 minutes ago </div>
      </div>
      <label for="nsw7bpy" class="commentText"><p>No. We know all the wolf skills and none have poison</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nswa9wx" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>EarthBounder</div>
        <div>1 | 8 minutes ago </div>
      </div>
      <label for="nswa9wx" class="commentText"><p>The wolf does cold damage and is aligned with the moon. (Bear fire, Wyvern lightning) </p>

<p>Of course, you can make poison work, but the tree placement is rather awkward.</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
