      <label for="msz15e9" class="commentText"><p>On the top right corner of the screen you should have </p>

<p>Skill Points X </p>

<p>I Weapon Set Y(Z) </p>

<p>II Weapon Set Y(Z)</p>

<p>If you select &ldquo;I Weapon Set&rdquo; you&rsquo;re going to be assigning points for weapon set 1</p>

<p>Weapon Set points are <em>not</em> extra points, they&rsquo;re a different way to assign the regular skill points</p>

<p>When you assign a weapon set point you&rsquo;re taking a regular skill points and splitting it in half basically</p>

<p>Passives allocated with weapon set 1 points will only be active when you&rsquo;re using the weapon set 1, they&rsquo;ll show as red/orange on your tree</p>

<p>Passives allocated with weapon set 2 points are only active when using the weapon set 2, they&rsquo;re green on the tree</p>

<p>Passives allocated with normal skills points are active at all times and are yellow</p>

<p>When you make a path using normal skills points you can branch off using weapon set points</p>

<p>But when you make a path using weapon set points you can&rsquo;t progress that path using normal passive points, nor using weapon set points from the other weapon set</p>

<p>I <em>think</em> that&rsquo;s what&rsquo;s messing you up but I can&rsquo;t be 100% sure because of the color</p>
