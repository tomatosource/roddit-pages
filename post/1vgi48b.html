

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/5wso85d83mhh1.jpeg"><p>Loreweave Question</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/5wso85d83mhh1.jpeg" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="p1yrbfp" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Pretend-Guide-8664</div>
        <div>2 | 10 hours ago </div>
      </div>
      <label for="p1yrbfp" class="commentText"><p>I think a practical answer is try it out for like 20 maps and keep the rest of your gear the same. Switch back if those 20 maps are dookie</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="p1yylhz" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Meismarc</div>
        <div>2 | 9 hours ago </div>
      </div>
      <label for="p1yylhz" class="commentText"><p>I&rsquo;ve been using Loreweave for a long time now. Haven&rsquo;t really looked back in changing to Rare body armor.</p>

<p>Although I&rsquo;m more of Alc &amp; Go kinda player but all my maps are either T15/T16 Corrupted and sometimes dip on 200% deli if I chance upon it. Haven&rsquo;t really died ever since.</p>

<p>Although my main carry would probably Mageblood giving me free 2k Evasion to work off from. The main reason I went with Loreweave though is the Maximum Resistances being set to 79~80% which give a good chunk of Dmg Reduction. Quality of skills too since I&rsquo;m a Gemling and the final QoL for me being &ldquo;You Cannot be Chilled or Frozen&rdquo;.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="p1z1dyf" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>initiald-ejavu</div>
        <div>2 | 9 hours ago </div>
      </div>
      <label for="p1z1dyf" class="commentText"><p>Definitely switch. 30% of an already massive hitpool isn&rsquo;t worth too much next to 84% rarity, open ring slot, more damage on weapon, and slightly increased max res.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="p1yux9r" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Chmona</div>
        <div>1 | 10 hours ago </div>
      </div>
      <label for="p1yux9r" class="commentText"><p>It is fun to use. Try it out. If you die too much, swap back.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="p1zqo1x" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>xcannibalrabbit</div>
        <div>1 | 7 hours ago </div>
      </div>
      <label for="p1zqo1x" class="commentText"><p>It makes you immune to -max res modifiers which is nice (including the 20 all res rune)</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="p20ilrl" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Remarkable-Peach-524</div>
        <div>0 | 3 hours ago </div>
      </div>
      <label for="p20ilrl" class="commentText"><p>&ldquo;Your other rarity modifier do not apply&rdquo; kinda bad. If you can, try other loreweave like onslaught, cannot be chilled. Thats definitely worth losing 3k es.</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
