

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
}

.selfPostContainer * {
  color: white;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/bexl7pqkc1me1.png"><p>Call of the brotherhood on deadeye ranger</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img src="https://i.redd.it/bexl7pqkc1me1.png" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="mff7ndq" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>GuitunScarfin</div>
        <div>2 | 2 hours ago </div>
      </div>
      <label for="mff7ndq" class="commentText"><p>Just to add something, dunno if it&rsquo;ll help, but if this ring works anything like the original sin ring (converts 100% elemental damage into chaos), it will only affect damage type added by items, not damage type added on the passive tree (i.e. passive node or time-lost diamond) or skill support gems.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="mfehtij" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Nikutan</div>
        <div>1 | 7 hours ago </div>
      </div>
      <label for="mfehtij" class="commentText"><p>I was playing gemling LA and happened to have this drop for me around lvl 50. Here are my quick notes on interactions as I leveled with it from there on to 88ish.</p>

<p>Abandon lightning% bonuses, covet cold% instead. Because conversion is 100%, you&rsquo;ll never inflict shock via damage so cast on shock is dead. Polcirkeln is probably the other ring you want given that you freeze everything in hopefully a handful of shots. Chilled ground effects help keep up against freeze bonuses from polcirkeln. </p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="mfeih8r" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>No_Ambition_8558</div>
        <div>1 | 6 hours ago </div>
      </div>
      <label for="mfeih8r" class="commentText"><p>So bonus to lightning/cold damage is calculated after damage is done? What I mean is, bonus to lightning damage doesn&rsquo;t apply as once the damage hits, it deals cold damage? That&rsquo;s a very useful information as I didn&rsquo;t know how damage bonuses are being applied and at which moment in a damage calculation they get added! Thank you sir.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="mfejedd" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Nikutan</div>
        <div>1 | 6 hours ago </div>
      </div>
      <label for="mfejedd" class="commentText"><p>Damage type -&amp;gt; converted damage type(s) -&amp;gt; appropriate multipliers</p>

<p>Is what I&rsquo;ve read and what at least 100 hours of gameplay have shown me.</p>

<p>The interesting interactions are that lightning skills still trigger lightning rod even though it&rsquo;s all triggering cold damage. The big trade off is you&rsquo;re totally passive dependent on &ldquo;vs freeze bonuses&rdquo; because you can&rsquo;t cash in on double herald use but you mapping potential is incredibly safe assuming you&rsquo;re patient via mass freeze.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="mfelaxp" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>No_Ambition_8558</div>
        <div>1 | 6 hours ago </div>
      </div>
      <label for="mfelaxp" class="commentText"><p>Would that mean that if I had to choose only one, herald of ice would be superior to herald of thunder in this specific case of mine?</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="mfendcv" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Nikutan</div>
        <div>1 | 6 hours ago </div>
      </div>
      <label for="mfendcv" class="commentText"><p>Without this devolving too much into hyperbolics, yes.</p>

<p>While it&rsquo;s not impossible to trigger shock via damage, it is definitely the easiest. Triggering it by causing shocked ground is probably the easiest way to inflict it over a large scale.</p>

<p>I guess I&rsquo;m not sure what shock up-time would need to be to maximize Herald of Thunder when a normal LA rotation can no longer shock passively. Best suggestion is to see how complicated it is to maintain the rotation in a T15+ waystone.</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

    
  </div>
  
</div>

    
  </div>
  
</div>

    
  </div>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="mffb7pq" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>velkhar</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="mffb7pq" class="commentText"><p>I tried that ring for a while on my LA Deadeye. It guarantees freezes and Herald of Ice chain shatter-splosions of everything on screen. However, you won’t get long range, off-screen destruction from Herald of Thunder. And your single target damage is tanked because you no longer shock. You effectively reduce your DPS by 40-50% when removing shock (with magnitude).</p>

<p>Get some Adds # to # Cold Damage rings, Quiver, and on your bow. Use Polcirken until you get those things. I found the breakpoint for me was around 50 average (e.g., 25-75) added Cold damage from all sources. You also need a fair bit of Freeze buildup (at least 50%).</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="mffbif9" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>No_Ambition_8558</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="mffbif9" class="commentText"><p>But for campaign it can work I assume? In late game I would explore a bit more into what an ideal setup is of course</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="mffcawv" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>velkhar</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="mffcawv" class="commentText"><p>Sure, in campaign it could work. Although, honestly, if you’re going to use Uniques, I’d recommend Death’s Harp, Radiant Grief, and Gas Arrow. Spec into damage nodes. That’ll take you to maps. Before Death’s Harp, use Splinterheart or Widowhail with Asphyxia/Blackgleam and Lightning Arrow. You can buy all that stuff for a handful of exalts.</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

    
  </div>
  
</div>

        
      
    </div>
  </body>
</html>
