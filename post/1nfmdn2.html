

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/2e245quuiuof1.jpeg"><p>Anfernee Simons is officially in Boston</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/2e245quuiuof1.jpeg" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="ndxjml0" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>chivestheconqueror | Bill</div>
        <div>11 | 33 minutes ago </div>
      </div>
      <label for="ndxjml0" class="commentText"><p>I, for one, am excited to see him ball out for us.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="ndxluk1" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Cheeriofun</div>
        <div>3 | 18 minutes ago </div>
      </div>
      <label for="ndxluk1" class="commentText"><p>He’s a fun guy to watch when his offense is clicking. Looking forward to the highlights, might even take a big step forward this year. A change in environment is sometimes the only thing you need</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="ndxlvqv" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>BleedGreen4Boston</div>
        <div>2 | 18 minutes ago </div>
      </div>
      <label for="ndxlvqv" class="commentText"><p>He’s gonna surprise people, but not me</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="ndxm4tn" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>King_Of_Pants | Sam Howitzer!</div>
        <div>3 | 16 minutes ago </div>
      </div>
      <label for="ndxm4tn" class="commentText"><p>I&rsquo;m disappointed he&rsquo;s not starting, coming off the bench basically puts a hard cap on any idea of him having a massive breakout in Boston.</p>

<p>He&rsquo;s a 25-year-old who can comfortably put up ~22ppg, and that&rsquo;s right around the age where guards start to take their next steps. It&rsquo;s right around the age where Isaiah Thomas and Jalen Brunson moved to new teams and thrived in a new environment, for example.</p>

<p>There was a slim chance he&rsquo;d have a big offseason, average 25-26ppg and breakout as a star&hellip; but the most a 6th man has ever averaged is like 23ppg, and it&rsquo;s unlikely he&rsquo;ll get any breakout opportunities in a reduced role in Boston.</p>

<p>But I&rsquo;m still excited to play. He&rsquo;s a lot better than people realise.</p>

<p>Really crafty with the ball, he learnt a lot from Dame and CJ. Also has elite shooting touch, the %&rsquo;s don&rsquo;t do him justice, he&rsquo;ll compete to be the best shooter on our team.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="ndxnxgj" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>YewEhVeeInbound | LET THE 🦄AND 🐃 ROAM</div>
        <div>1 | 4 minutes ago </div>
      </div>
      <label for="ndxnxgj" class="commentText"><p>I&rsquo;m glad he&rsquo;s not starting tbh, we get to reward Payton for his work and dedication to the organization. He&rsquo;s still going to get his minutes regardless. Payton averaged 28 MPG last season as the 6th man.</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

        
      
    </div>
  </body>
</html>
