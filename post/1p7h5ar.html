      <label for="nqxmkds" class="commentText"><p>crossbow leveling is super easy, you dont really even need good gear to clear the acts, just spam grenades and everything melts.</p>

<div class="commentAndChildren">
  <input id="nqxwg1b" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Paradoxmoose</div>
        <div>1 | 3 hours ago </div>
      </div>
      <label for="nqxwg1b" class="commentText"><p>Grenades is easier with keyboard/mouse than with controller.  With keyboard/mouse you can shoot the grenades in front of you, where you&rsquo;re running, and the monsters behind you can run into them.  With controller, you shoot at the monsters behind you while running away from them, and then the grenades explode behind them.  The exception is during boss battles or in confined arenas.</p>

<p>With controller I had better luck just sticking with galvanic shards for clear, and just buying a 1 ex crossbow upgrade every 6 or so levels.</p>
</label>

<div class="commentAndChildren">
  <input id="nqxrszi" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Thulvex</div>
        <div>1 | 4 hours ago </div>
      </div>
      <label for="nqxrszi" class="commentText"><p>I&rsquo;ve been doing crossbow leveling for a while as it&rsquo;s my favourite starter. Go to Mud Borrows asap for support to add multishot, helps a lot. As soon you you get lvl2 supports, add the one that speeds detonation time. Then third I&rsquo;d recommend magnified area.</p>

<p>You want to upgrade crossbows at level 6, 10, 16 and then there&rsquo;s a massive one at 33 which gives you implicit with additional grenades - you want to craft on this base ideally.</p>

<p>Playstyle isn&rsquo;t for everyone, but it&rsquo;s a lot of fun and unless they change it, it&rsquo;s very powerful for campaign.</p>
</label>
    </div>
  </label>

      </div>
      <label for="nqxtkny" class="commentText"><p>What would you change (with gear/supports) if you were going to go full twink from the start (this is for an alt, not a league starter). I&rsquo;ll be able to 6 link from level 2, so anything is fair game</p>
</label>
    </div>

<div class="commentAndChildren">
  <input id="nqy010c" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Thulvex</div>
        <div>1 | 3 hours ago </div>
      </div>
      <label for="nqy010c" class="commentText"><p>Uh haven&rsquo;t thought about this too much ever before as I only level with gear I find on that specific character. Things that come to my mind:</p>

<p>- 6link with short fuse II, AoE, damage gems<br>
- pre-buy Weapons with high damage for certain levels<br>
- I&rsquo;d suggest adding StormBlast Bolts to pre-cast arrows during boss encounters and then the first grenade will explode it. Usually they have long animations/talk for long and this give huge damage boost<br>
- you may consider unique gloves that convert fire damage to cold and adding herald of ice. This gives nice AoE options and I think you can start wearing that around level 30<br>
- movement speed boots</p>

<p>Just some initial thoughts</p>
</label>
