       * {

*,

*:after {
  box-sizing: border-box;
}

html {

body {
  display: flex;

h1 {

}

h2 {

}

input[type="checkbox"] {

blockquote {

.subName {

.postList {

.post {

}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>

      </div>
      <label for="okr0hnf" class="commentText"><p>I will definitely play this, though I am playing SSF/Group Found and have to see how easy I can get this. (We don&rsquo;t know yet from which of the Expedition/LEague Bosses) it comes. So it will not be my first char.</p>

<p>I think the biggest unknown yet is the actually Unique Skill Starborn Onslaught. We only know its a Glory skill and in the showcase the character generated Glory from hitting, killing, chilling or freezing small white monsters.</p>

<p>The skill looks amazing and I will defintiely build around it, but if the Unique Active skill doesn&rsquo;t do a whole lot I think all the effort will not be worth building around it.</p>

<p>I personally care more for a cool theme than objective power, so I will try making it as good as I can anyway, but on first glance the item itself looks mediocre and just the theme and visuals are amazing.</p>

<p>The Starborn Onsalught seem to create fissures itself, so I feel like the main source of damage will be retriggering fissures, but Acestral Cry will not be converted to Fire, which kills the whole Cold theme for me, because its such a good Combo skill for fissure builds and we would need to jump through a lot more hops to relaibly get Ancestral Call up (because it gains Glory by igniting enemies).</p>

<p>My main instict when I saw it was Lich with Unholy Might Node + Embitter Support (any extra damage is added as Cold) or maybe the Tul Linage Support, but when looking at the numbers the maximum mana scaling we can get will not really majorly impact our damage. So I hope there will be more support for Melee Mana Stackign Archetype through the new Augments (Runes) and the Kalguran skills (they only showcased spell support, defensive and a stun support so far, hopefulyl there will be a mroe generically useful attack support for the new Kalguran skills).</p>

<p>If the Starborn Onslaught is actually really good and the mana stacking turns out to be a waste of investment I could still see Titan or Smith of Kitava variant mostly ignoring the maximum mana scaling and just get enough mana recovery to not get oom through the Damage Taken from Mana.</p>
