

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/ur5v7as6n2zf1.jpeg"><p>This Untainted Paradise will ever remain untainted</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/ur5v7as6n2zf1.jpeg" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="nmwqkyb" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Grunvagr</div>
        <div>1 | 20 minutes ago </div>
      </div>
      <label for="nmwqkyb" class="commentText"><p>They should add a feature where you can add a path that doesn’t exist but make it take 3 real days for it to connect to the zone.</p>

<p>That way people cannot take advantage of it but it allows a way to not have bad random generation mess things up.  Probably easier than finding a bug in a haystack.</p>

<p>Same thing with items in maps.  If a divine orb falls on the other side of a wall and is impossible to reach, I should be able to pick it up by clicking and holding to channel a pickup.  I don’t care if it takes 4 minutes to charge up.  Give the option.  Losing a divine or amazing loot to a bug is infuriating.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="nmwsnaw" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Bxk__</div>
        <div>1 | 10 minutes ago </div>
      </div>
      <label for="nmwsnaw" class="commentText"><p>They could just add a line to the table, &lsquo;isconnected&rsquo;, 0/1.  We&rsquo;ll probably see a fix next decently large patch.  I&rsquo;m suspecting adding the new special maps broke something</p>

<p>Edit: a lot of those special maps don&rsquo;t have any path to adjacent nodes until some conditions are met (such as following that wisp thing from map to map or hunting for hedgestones) and this became a big issue only after those maps were introduced so I&rsquo;d bet money they did have some sort of check on map generation but broke it in order to allow for those new maps implemented as they are</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nmwr8ze" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Bxk__</div>
        <div>1 | 17 minutes ago </div>
      </div>
      <label for="nmwr8ze" class="commentText"><p>I don&rsquo;t always use a Grand Project precursor tablet when unlocking a Tower, but when I do, it&rsquo;s usually because of something like this (you might have some luck if you can bump into one)</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nmws55k" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>d-crow</div>
        <div>1 | 12 minutes ago </div>
      </div>
      <label for="nmws55k" class="commentText"><p>ununtaintable</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
