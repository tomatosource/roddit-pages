

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://www.reddit.com/r/bostonceltics/comments/1p5vkiq/buy_now_or_wait/"><p>Buy now or wait?</p>
</a>
    </h2>

    
    <div class="selfPostContainer">
      <p>Need two tix to Wednesdays game against the Pistons. Plenty available. Should I buy now or wait? Are ticket prices falling closer to game time these days?</p>

    </div>
    

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="nqlzslw" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>eggrollz4dayz</div>
        <div>5 | 2 hours ago </div>
      </div>
      <label for="nqlzslw" class="commentText"><p>Think it can be a hit or a miss. Best bet is to just keep checking and when you see a deal you&rsquo;re happy with jump on it.</p>

<p>Edit: I would say generally they tend to fall the closer you get to start time but not always..</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nqm47c6" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>LarBrd33</div>
        <div>2 | an hour ago </div>
      </div>
      <label for="nqm47c6" class="commentText"><p>i never had too much trouble waiting day-of to buy tickets when the team was actually good.  Every time I&rsquo;ve tried tickets would drop closer to game time as people got desperate to unload.  I would think this year with the team being pretty mediocre, I&rsquo;d think it would be even easier.  Pistons are winning a lot, but I don&rsquo;t know that Cade is really a huge draw yet like some other NBA stars.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nqm94lo" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>jbpats0823</div>
        <div>2 | an hour ago </div>
      </div>
      <label for="nqm94lo" class="commentText"><p>I think tomorrow will be the sweet spot. Gonna be a lot of college kids home looking for something to do, and it’s supposed to be 60 degrees out so I think prices increase day of</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nqma1ri" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Swarthykins</div>
        <div>2 | an hour ago </div>
      </div>
      <label for="nqma1ri" class="commentText"><p>Lately, I’ve found them to fall a lot a day or two before the games.  People aren’t clamoring for tickets, and I’m guessing a lot of people are selling at a loss.  That said - you never know.</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
