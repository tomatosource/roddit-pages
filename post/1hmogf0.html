        <div>13 | 32 minutes ago </div>
      </div>
      <label for="m3vhpz7" class="commentText"><p>I’m not worried about this team… we just gotta get to the playoffs. So many other teams that look like juggernauts right now will crumble under the pressure of the playoffs. This team has been there and done that. No one will remember a regular season loss to the sixers one year from now.</p>

        <div>2 | 6 minutes ago </div>
      </div>
      <label for="m3vl5q3" class="commentText"><p>KP isn’t trying to be a hero this regular season. They are much better off if he sits with any kind of ankle issue. I am sure the training/coaching staff want him playing when he feels good, but they have no interest in taxing that ankle. When he tweaked it, he clearly stopped going all out.</p>

<p>Embiid got a super friendly whistle and probably will in a Christmas game because they don’t want to take him off the court. The Sixers still barely pulled out a win. That was not close to the Celtics best shot. Brown was rough. Pritchard was rough. Al was incredible. Hauser is still working through the injury. It looked like a pretty lazy effort where they just tried to shoot their way to win without having to put in the work. I think if they were dialed in the results would have been a fair bit different.</p>
