

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/ewysj3n5r16g1.png"><p>Could there be a better way to trigger an update rather than forcing an unnecessary verification of game files?</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/ewysj3n5r16g1.png" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="nt05jgr" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>TravUK</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="nt05jgr" class="commentText"><p>Just restart Steam. Did it for me.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nt06zqv" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>legato_gelato</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="nt06zqv" class="commentText"><p>Isn&rsquo;t it normal that steam checks on startup and then on intervals once started? I always just restart steam to update</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nt09i76" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>DewRat</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="nt09i76" class="commentText"><p>Need to be a little more patient.  If you try to login without the update, steam thinks your game is broken and auto starts the repair tool.</p>

<p>Always restart steam after the amount of time ggg says and verify that your game has updated before trying to log in.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="nt0gelj" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>WordsWellSalted</div>
        <div>1 | 15 minutes ago </div>
      </div>
      <label for="nt0gelj" class="commentText"><p>But based on these logs, the game is marking the game files as corrupt to FORCE steam to recheck them for the patch. This isn&rsquo;t actual corrupt game files.</p>

<p>He&rsquo;s asking if that is necessary.</p>

<p>I don&rsquo;t know if that is a normal practice or what, but it seems pretty bonkers to me.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="nt0i5xq" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>DewRat</div>
        <div>1 | 5 minutes ago </div>
      </div>
      <label for="nt0i5xq" class="commentText"><p>If you try to login without the update steam gives you an unknown version error and closes the game.</p>

<p>If you try more than twice getting the same error steam starts the verification.</p>

<p>I know because I was that impatient person and this was happening to me regularly before always verifying through the steam downloads tab that the game had in fact been updated.</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

    
  </div>
  
</div>

        
      
    </div>
  </body>
</html>
