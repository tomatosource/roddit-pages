

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/whagi1ukhvmf1.png"><p>I think my brain might melt</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/whagi1ukhvmf1.png" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="nc4xyhb" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>aTypingKat</div>
        <div>4 | 3 hours ago </div>
      </div>
      <label for="nc4xyhb" class="commentText"><p>Bottom line: The more you hit with fire damage the higher the chance it&rsquo;ll ignite the target. Each hits increases the chance up to 100%.<br>
Flammability is just putting a name to how their system of chance to ignite works, it is based on your damage vs the target&rsquo;s ailment defence but hitting a bunch of times also works.<br>
Instead of you having a stat like +25% chance to ignite and thus having to stack that mod until u reach 100% for consistant ignites, your base chance is relative to your hit which hitting more times or bigger hits will raise that chance.<br>
So if you hit with a big ass fire damage attack it could set the chance to 85% which will be checked not on the next hit but on the initial one. But if you hit mildly hard with fire damage, you could have 50% to ignite, if u get unlucky, the next  hit if it is just as large could raise it to 100% which will guarantee an ignite.</p>

<p>Hit small gives 5% chance to ignite, the dice roll is done, you got unlucky no ignite.<br>
Second hit is also small at 6% which now adds tot he previous hit&rsquo;s 5% making it 11%. You can unlucky again, no ignite.<br>
You then choose to hit with a different spell or attack, one that hits much harder adding 50% chance to ignite tot he target making it 61% (5%[small hit 1]+ 6%[small hit 2] +50%[big hit 1]). The RNG is rolled and with the 61% chance it h its and ignite applies immediately rather than on the next hit.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nc4wizd" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Exosolar_King</div>
        <div>2 | 3 hours ago </div>
      </div>
      <label for="nc4wizd" class="commentText"><p>Not sure if they ever discussed the new ignite/flammability stuff at length anywhere (particularly why they made this change and what the goal of the change is), but its very alien coming from years of PoE1</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nc4ytyv" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>iv_is</div>
        <div>1 | 3 hours ago </div>
      </div>
      <label for="nc4ytyv" class="commentText"><p>It&rsquo;s not quite as complex as the text makes it sound.</p>

<p>0.2.0: each time you hit an enemy, 1% chance to ignite per 4% of ailment threshold (or equip a single unique and ignite everything in your presence).</p>

<p>0.3.0: each time you hit an enemy, 1% chance to ignite per 5% of ailment threshold. This chance to ignite is called flammability and stays on the target, increasing ignite chance for subsequent hits. Radiant Grief can no longer ignite anything on its own.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nc4zkao" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>cheechlabeech</div>
        <div>1 | 3 hours ago </div>
      </div>
      <label for="nc4zkao" class="commentText"><p>don’t worry, as long as it’s not flammabilitied you should be fine</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
