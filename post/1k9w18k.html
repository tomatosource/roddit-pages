

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://www.reddit.com/gallery/1k9w18k"><p>Quantity of monsters &amp;gt; quantity of items in 0.2</p>
</a>
    </h2>

    

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="mphhbjw" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Holovoid</div>
        <div>2 | an hour ago </div>
      </div>
      <label for="mphhbjw" class="commentText"><p>I think this run is an insane outlier tbh but quantity of monsters seems interesting. I might have to start throwing more of that in the mix. Can you post your atlas configuration?</p>

<p>Personally, I just seem to get literally nothing from magic packs anymore even in juicy T15/16 maps.</p>

<p>At the end of the day I think that the floor for currency drop is the problem, because you <em>can</em> have good runs - I had a run where I got 9 exalts and like 3 chaos orbs which is pretty okay, but I have also have strings of maps where I have quant/rarity on the nodes and waystones and gotten zero exalts, which IMO is not acceptable.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="mphkmhc" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Nemorga</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="mphkmhc" class="commentText"><p>do you have rarity on gear? because 0 exalt happens to me soo rarely even on map with no quant and rarity when i&rsquo;m farming ritual.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="mphls8k" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Holovoid</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="mphls8k" class="commentText"><p>Yeah I have like ~100% rarity on my gear, I try to get it on every slot possible</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

    
  </div>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="mphkojs" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>PoodlePirate</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="mphkojs" class="commentText"><p>I like maxing pack size so my siege cascade perpetually rains down wherever I aim and lowering my frames that I move in slow motion.</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
