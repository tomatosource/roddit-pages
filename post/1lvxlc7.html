

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/bvkz3fz0nxbf1.jpeg"><p>Look I found us.</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/bvkz3fz0nxbf1.jpeg" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="n29s25w" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Wind_Best_1440</div>
        <div>2 | an hour ago </div>
      </div>
      <label for="n29s25w" class="commentText"><p>This is the problem of having a trade based economy, the over performers need to be balanced and often its the top 5% that figure out the broken builds.</p>

<p>Abilities get nerfed and those that were using those abilities but not optimally get hit with the nerf bat.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="n29tbvy" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>beardedtomato971</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="n29tbvy" class="commentText"><p>There was an interview with Jonathan a while back, i think it was with ziz, with the dawn of the hunt, and it was obvious Jonathan kept coming back to balancing around top percentage of players. That&rsquo;s where I stopped playing.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="n29xmv9" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Lash_Ashes</div>
        <div>1 | 33 minutes ago </div>
      </div>
      <label for="n29xmv9" class="commentText"><p>PoE1 has been balanced around the top players for its entire existence. Not sure why they would stop for poe2</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="n29zc2s" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>beardedtomato971</div>
        <div>1 | 23 minutes ago </div>
      </div>
      <label for="n29zc2s" class="commentText"><p>I didn&rsquo;t play poe1, so my opinion is more from the perspective of a &ldquo;casual&rdquo; bad player. Which there are a lot of, since poe2 appears to have appealed to a lot of new players.
The way I&rsquo;m thinking of it is to imagine if fromsoft changed elden ring to balance for those doing no hit runs, and changed the whole game for everyone else because those players weren&rsquo;t having &lsquo;engaging&rsquo; combat.</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

    
  </div>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="n29yse3" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Inner-Professional76</div>
        <div>1 | 26 minutes ago </div>
      </div>
      <label for="n29yse3" class="commentText"><p>That&rsquo;s kinda how GGG have always done it unfortunately. Wish it was different but it&rsquo;s what we&rsquo;ve got. I do see this game turning out just like POE 1 though where it&rsquo;s balanced around the top 5-10% of people who, those who can play all day long, and then just toss aside those who can&rsquo;t. If it&rsquo;s not a one button build that can clear maps as fast as possible it&rsquo;s not gonna be a playable option.</p>

<p>They have the opportunity to do something different, and it looked like it might be at first but after playing it you realize that balance is terrible, comboing skills is pretty much useless outside of certain set ups and can get you killed more times than not because they slowed you as the player way down but kept the enemies moving the same speed, and speed is one of the most important stats in terms of defense in Poe 1. Defenses are another thing that should&rsquo;ve been Reworked rather than copy and pasted over. And I think it shows the glaring flaws with certain defense mechanics like armor.</p>

<p>Armor is a convoluted dumpster fire of a skill even in POE 1. Like if you took just the concept and explanation of how armor works in these games to anywhere else, they&rsquo;d be like &lsquo;That&rsquo;s the dumbest thing I&rsquo;ve ever heard.&rsquo;</p>

<p>The only reason armor can be useful in POE 1 is because you can stack massive amounts of it and then convert elemental to physical. Then you can add in fortification, passive effects from endurance charges, and stacking massive amounts of health via  the passive tree, and end up pretty tanky. Guess what POE2 doesn&rsquo;t have? Fortification, passive effects from endurance charges, and stacking massive amounts of health from the passive trees. Like if we&rsquo;re getting rid of all that stuff and changing the way things work, why keep armor the same?? We&rsquo;re removing health passive nodes but keeping ES nodes? We&rsquo;re slowing your action and movement speed down, but we&rsquo;re keeping enemies the same speed. Like none of it makes sense.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">

    </div>

</div>

</html>
