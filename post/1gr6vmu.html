    </h2>

      <label for="lx3hb4m" class="commentText"><p>From <a href="http://Globe.com" target="_blank">Globe.com</a></p>

<p>By Adam Himmelsbach</p>

<p>NEW YORK — Late in the opening quarter of the Celtics’ game against the Nets on Wednesday night, Jayson Tatum barreled down the lane on a fast break and discarded Jalen Wilson, sending the Brooklyn forward tumbling to the ground.</p>

<p>Tatum probably could have been called for an offensive foul, but he wasn’t, and the play felt like Tatum’s way of showing the Nets that the Celtics would not be pushed around this time.</p>

<p>One night after coach Joe Mazzulla lamented his team’s failure to match the <a href="https://www.bostonglobe.com/2024/11/13/sports/celtics-nba-cup-loss-loss-hawks/?p1=Article_Inline_Text_Link" target="_blank">Hawks’ physicality in a surprising loss</a>, the Celtics shook off another sluggish start and fought back, eventually rolling to a 139-114 win.</p>

<p>After falling behind by 13 points late in the first quarter, the Celtics outscored the Nets by 38 the rest of the way.</p>

<p>“We’re all professionals and knew we could’ve played better, and we dropped the ball on some things,” Tatum said. “But the sign of a really good team is how you respond … and I think we responded in a great way.”</p>

<p>The Celtics had 20 turnovers and surrendered 20 offensive rebounds against Atlanta, and on Wednesday they lowered those figures to eight and three. When Mazzulla was asked about how his team had quickly corrected those issues, he said that nothing is ever broken and nothing is ever fixed. He stressed that it is all a process.</p>

<p>“Just because you do it one day doesn’t mean you’re going to do it tomorrow,” Mazzulla said. “So we’ve got to work at that every day. But as far as our attitude and our bounce-back, I thought that was important. There’s going to be ebbs and flows throughout the season. I care more about how we respond to things when they don’t go our way.”</p>

<p>However it is classified, everything looked better against the Nets, and escalating angst surrounding a team that is now 10-3 and on pace to have a record that is nearly identical to last season’s was subdued for at least one night.</p>

<p>Tatum had 36 points, 10 assists, and 9 rebounds to lead Boston, and Jaylen Brown added 24 points and 12 rebounds. The Celtics hit 22 of 46 3-pointers, but their initial rally from an early 13-point deficit was mostly crafted with powerful, determined drives by the two stars.</p>

<p>“I think that just opens up the game for us, making the defense converge,” Brown said. “And a lot of the time that’s me putting pressure on the rim, putting pressure in the paint, attacking seals, attacking matchups.”</p>

<p>Brown and Tatum remained in control of their attack, too. Mazzulla credited them for finding the shots that they wanted, and Brown pointed out that one game after combining for 11 turnovers, he and Tatum totaled just one.</p>

<p>Payton Pritchard, meanwhile, continued to be essential, with 23 points, 8 assists, and 6 rebounds off the bench. He checked in with 8:30 left in the first quarter after Derrick White committed three early turnovers, and did not sit again in the half. Stints of more than 20 minutes are usually reserved for superstars during tense playoff games, not backups in regular-season matchups in Brooklyn. But White’s third foul combined with Pritchard’s noticeable impact led to an extended run.</p>
