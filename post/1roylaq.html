  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

      <label for="o9h84ct" class="commentText"><p>Use a greater essence of abrasion to add flat physical damage t3.</p>

<p>Remove the bad suffix and replace it with perfect essence of abrasion and the omen of crystallization that removes suffixes.</p>

<p>From here, either desecrate + fracture and come back later to get t1 flat phys or shuffle perfect essence of haste and battle using the suffix crystallization omen again until you have both. To shuffle the essences you need to use 2 exalted orbs first. Since this is not an exceptional base and you don’t seem to have a lot of funds, the fracture might not be worth it.</p>

<p>Once you have both essence suffixes, use a preserved jawbone with the amanamu desecration omen. This should guarantee attack speed and a relatively cheap 6 mod craft.</p>
