

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/um7r97zdohag1.jpeg"><p>POE2 maps in a nutshell</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/um7r97zdohag1.jpeg" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="nwvsqiy" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>MindTrix91</div>
        <div>7 | 13 hours ago </div>
      </div>
      <label for="nwvsqiy" class="commentText"><p>Yeah the maps are too much. A whole lot&hellip;. of nothing. A small mob here and there, on an oversized, difficult to navigate map.</p>

<p>Really wish they would revise their map generation to be a little more compact somehow</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nwvu1uk" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>i_love_weed_</div>
        <div>3 | 12 hours ago </div>
      </div>
      <label for="nwvu1uk" class="commentText"><p>Yeah. I always thought that it was a non issue when people complained about map size and structure. But after sweating and hunting the temple crystals I can agree. A lot of dead space and dead ends with a whole lot of nothing</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nwwx8ff" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>PepeLiciousness</div>
        <div>1 | 7 hours ago </div>
      </div>
      <label for="nwwx8ff" class="commentText"><p>To be fair, it gets better with rare tablets and all points in the tree. Which is easy after beating Arbiter one time,so you can make the tablets rare yourself.</p>

<p>That said, I only run Abyss, Ritual and Breach.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nwz0y13" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>tetrex</div>
        <div>1 | 3 minutes ago </div>
      </div>
      <label for="nwz0y13" class="commentText"><p>The temple location is often in a very similar location every time. Take a screenshot of your mini map and use it to help you find the location next time you run the map to speed things up</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
