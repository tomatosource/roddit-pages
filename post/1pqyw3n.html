

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://m.youtube.com/watch?v=whKZHGXepzY&amp;amp;pp=ygUWdHlsZXIgc2thZ2dzIG5vIGhpdHRlcg%3D%3D"><p>The Angels toss a no-hitter to honor Tyler Skaggs</p>
</a>
    </h2>

    

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="nuy0p3j" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Sandwich_Crust | Boston Red Sox</div>
        <div>27 | 17 hours ago </div>
      </div>
      <label for="nuy0p3j" class="commentText"><p>This game was so wild. I thought the Dee Gordon Home Run was crazy, but a combined no-hitter just felt something surreal right after his death. Total team effort to make it happen and it truly felt like it was for him.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nuzp7vy" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>majorcdj | New York Yankees</div>
        <div>1 | 10 hours ago </div>
      </div>
      <label for="nuzp7vy" class="commentText"><p>I loved this so much. I only played ball through HS and two years on a D3 bench. Still cherish my teammates from that time. Can’t imagine how it feels to lose a brother on this level. baseball is beautiful</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nuzy7yq" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Angelsfan14 | Los Angeles Angels</div>
        <div>2 | 9 hours ago </div>
      </div>
      <label for="nuzy7yq" class="commentText"><p>Still one of the best games I&rsquo;ve been to. Just about everyone still in the stadium (obviously) in the 9th, and then so many people that went to the memorial outside of the stadium behind home plate to either drop something off or pay their respects. Was quite the rollercoaster of emotions that day.</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
