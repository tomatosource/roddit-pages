

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/dip4xcsid5zg1.png"><p>Seems like people are hyped for Swords - Personally, I can&rsquo;t wait for the Huntress Ascendancy</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/dip4xcsid5zg1.png" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="ojwa3rs" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Volitar</div>
        <div>1 | 9 minutes ago </div>
      </div>
      <label for="ojwa3rs" class="commentText"><p>I&rsquo;m very cautiously optimistic. In other ARPG I&rsquo;ve tried I always felt the &lsquo;one single big minion&rsquo; builds never really work out as much as I like.</p>

<p>but yeah it does seem like a cool concept, not sure if they will lean fully into companion or maybe like &lsquo;wisp assisted attacks&rsquo; or something in that vein where each color wisp gets there own branch in the ascendancy.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="ojwautt" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>SomethingNotOriginal</div>
        <div>1 | 6 minutes ago </div>
      </div>
      <label for="ojwautt" class="commentText"><p>Having it relegated to an RF Aura becomes a bit boring even if it&rsquo;s kinda strong and funny to just have an oversize elephant wandering around and setting the world on fire. The &ldquo;cool&rdquo; thing about making minions out of enemies is that you can use the skills that previous wreck you and I hope this leans into that fantasy more than spectres with cheerleader skeletons plays out.</p>
</label>
    </div>
  </label>
  
</div>

    
      
<div class="commentAndChildren">
  <input id="ojwaxj6" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Temporary_Virus9302</div>
        <div>1 | 6 minutes ago </div>
      </div>
      <label for="ojwaxj6" class="commentText"><p>I just hope it will work somewhat similar to Lone Druid from Dota 2. Minus separate equipment.</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="ojwapnp" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Traditional_Pea_6532</div>
        <div>1 | 7 minutes ago </div>
      </div>
      <label for="ojwapnp" class="commentText"><p>My expectations for patch 0.5 are &amp;gt; Shadow, Duelist, and about 4 new Ascensions. Why so many? Because the Druid delayed the new classes due to transformation problems, so they had plenty of time to adjust two more.</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
