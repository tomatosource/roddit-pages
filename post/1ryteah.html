

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>

<div class="commentAndChildren">
  <input id="obhpep9" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>funoface</div>
        <div>2 | a day ago </div>
      </div>
      <label for="obhpep9" class="commentText"><p>iLVL 79-81 base with 3 sockets about 6-8 div.</p>

<p>1.Spam anul+Perfect augmentation orb until you get T2 %Phys (155-169)</p>

<p>2.Add Greater Essence of Abrasion</p>

<ol>
<li><p>Fill all other slots with perfect Exalts</p></li>

<li><p>Use Perfect Essence Of Battle and Perfect Essence Of Haste +  jawbone to sufixes with  Omen of the Liege</p></li>
</ol>

<p>Only random mod you will get is 3rd prefix (if you want you can deterministically add +extra phys/ele dmg there).</p>

<p>OPTIONAL instead of previous step 3 only if want to fracture and try crafting better more expensive bow (Phys 880-950dps) could cost additional 100-500 div, add Perfect Essence of Battle with Omen of Dextral Crystallisation , add jawbone to sufixes with  Omen of the Liege</p>

<ol>
<li>Divine to 169% phys dmg, if fractured phys damage , anul to 2 mods and chaos spam until you get T1 flat phys. Depending on the amount of currency you have you can try spamming perfect Ex+Anul to add Phys mix or crit at this step.</li>
</ol>

<p>P.S. Can always start before step 1 with % quality , if you willing to lose few bases. I try to quality to at least 25-28% before starting.</p>

<p>If you have questions you can hit me up.</p>
</label>
