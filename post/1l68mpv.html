

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://www.youtube.com/watch?v=5fqZUYHYlBk"><p>A little late, but regarding the entire attack &amp; movement speed discussion in poe2, it&rsquo;s important to remember where poe1 started. Notice the words &ldquo;super fast&rdquo; being used.</p>
</a>
    </h2>

    

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="mwmtpk3" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Click-To-Save</div>
        <div>1 | 15 minutes ago </div>
      </div>
      <label for="mwmtpk3" class="commentText"><p>Here’s the thing. I agree. POE 2 needs to start somewhere, it can’t be perfect from the start. It’s Early Access after all. But, they have 13 years of experience on POE 1, they know what sticks and what doesn’t. Even when the ‘vision’ for POE 2 is different, why go through the same road, the same bumps, the same mistakes, when you already know how it’s going to turn out…</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="mwmu3gd" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Neon17</div>
        <div>1 | 11 minutes ago </div>
      </div>
      <label for="mwmu3gd" class="commentText"><p>The base comparison is alright but the difference is what the builds are up against. Current endgame in both games have fast, tanky, lethat and unfair mods sometimes and bosses have mechanics that are simply unfair. Looking at zakoh, maven, TOTA bosses. Its not about being fast, its about the relative perspective of what is needed for the character to be able to kill, survive, and be fun.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="mwmuec4" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>biuhwiuh</div>
        <div>1 | 9 minutes ago </div>
      </div>
      <label for="mwmuec4" class="commentText"><p>good ´ol times ;)</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
