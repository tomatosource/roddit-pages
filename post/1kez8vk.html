.commentText,

.commentHeader {

  font-size: 24px;

  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

      <label for="mqmvr1k" class="commentText"><p>It&rsquo;s fairly simple once you know what each line means.</p>

<p>Main hand crit chance, this is your baseline crit chance without anything external affecting it.</p>

<p>Effective chance for crit and twice crit is only related to tangletongue, which basically let&rsquo;s you roll the dice twice, if one of them crit then you have a crit hit and if both of them crit then your one hit becomes two critical hits. </p>

<p>Estimated crit chance from hit chance, this is only from your ascendancy and the reason you see a range, is because you have different hit chance depending how close the enemy is. This value is added to your baseline crit chance. Which means your chance to crit is 75% + (43% to 84%, depending where the enemy is). </p>

<p>To summarise, your crit chance vs close enemy is 75+84= 159% and vs furthest enemy is 118%. So yes you have guaranteed chance to crit and because you have +100% chance to crit, the 2 dice rolls from tangletonge always crit hit and your one attack hits enemy twic critically. Ideally you want to be just at 100% chance to crit since the extra% doesn&rsquo;t do anything. </p>
</label>
