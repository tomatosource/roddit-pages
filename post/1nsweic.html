

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/h9klff5jcyrf1.png"><p>Is the His Grave Command skill not in the game?</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/h9klff5jcyrf1.png" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="ngp97p8" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>r4ns0m</div>
        <div>7 | 5 hours ago </div>
      </div>
      <label for="ngp97p8" class="commentText"><blockquote>
<p>Could this be an error in Poe2DB, or has someone actually obtained this skill?</p>
</blockquote>

<p>Yeah could&rsquo;ve been data mined but then they didn&rsquo;t put it in. According to PoE2 Wiki there is only 4 skills: <a href="https://www.poe2wiki.net/wiki/The_Unborn_Lich#Mechanics" target="_blank">https://www.poe2wiki.net/wiki/The_Unborn_Lich#Mechanics</a></p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="ngp9bsd" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Xeratas</div>
        <div>7 | 5 hours ago </div>
      </div>
      <label for="ngp9bsd" class="commentText"><p>Idk about that one but poedb sometimes has unreleased versions of skills listed, because they are in the sourcecode but are not actually optainable.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="ngpamuz" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Kall0p</div>
        <div>4 | 4 hours ago </div>
      </div>
      <label for="ngpamuz" class="commentText"><p>Poedb contains datamined information. So basically if this skill was found in the files, but isn&rsquo;t actually dropping, then it is still on Poedb.</p>

<p>For example we know Exsanguinate is a skill in PoE 2, but there is currently no way of obtaining it, because the wand base is not in the loot table.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="ngpjuiv" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>SingleInfinity</div>
        <div>3 | 4 hours ago </div>
      </div>
      <label for="ngpjuiv" class="commentText"><p>DNT means &ldquo;do not translate&rdquo;. You&rsquo;ll typically see it on things that are works in progress or scrapped ideas that still exist in the game files.</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
