

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>

    <h2>
      <a class="postTitle" href="https://v.redd.it/4w45kou4ao3f1"><p>Bleed Mace T4 Xesht</p>
</a>
    </h2>

    

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="muuqxyj" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>_InnerBlaze_</div>
        <div>3 | 20 hours ago </div>
      </div>
      <label for="muuqxyj" class="commentText"><p>Main problem with your build is the bleed is not even aggravated, plus ryslatha is a bad choice if you have low attack speed.</p>

<p>If bleed was aggravated with a bit more bleed duration i m pretty sure you would kill him in one hit of bleed.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="muwf6c2" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>looseslot</div>
        <div>1 | 13 hours ago </div>
      </div>
      <label for="muwf6c2" class="commentText"><p>Yeah there is some luck involved with the build. Some chance to aggravate through Aggravate node and Internal Bleeding. The hits are also lucky through stars aligned, so the average hit is more but still a dice roll with the belt.</p>

<p>I&rsquo;ll try throwing on Beetlebite and a resist belt and check out the difference.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="muwp71w" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>_InnerBlaze_</div>
        <div>2 | 13 hours ago </div>
      </div>
      <label for="muwp71w" class="commentText"><p>You cannot aggravate the bleed with the hit that inflicts it so 30% is not much that too for 1 hit, increase your bleed duration to ten seconds and take deep wounds notable which will aggravate any bleed you inflict after 4 secs, so its a guaranteed 6 secs aggravated bleed.</p>

<p>My build is pretty similar to yours, atleast in case of mechanics.</p>

<p><a href="https://poe2.ninja/builds/dawn/character/inner_blaze-0890/SirBonksAlot_TheFourth" target="_blank">https://poe2.ninja/builds/dawn/character/inner_blaze-0890/SirBonksAlot_TheFourth</a></p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="muwr16p" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>looseslot</div>
        <div>2 | 12 hours ago </div>
      </div>
      <label for="muwr16p" class="commentText"><p>Ahhhh that makes sense. That is the next node I want but this tells me to grab that now thank you!</p>

<p>That time lost you have is awesome. Your build is looking really strong nice work.</p>
</label>
    </div>
  </label>

<div class="commentAndChildren">

      <div class="commentHeader">
        <div>_InnerBlaze_</div>
        <div>1 | 12 hours ago </div>
      </div>

<p>If you wanna take a look at a budget version of it: <a href="https://www.youtube.com/watch?v=VYk-utKy5OE&amp;t" target="_blank">https://www.youtube.com/watch?v=VYk-utKy5OE&amp;t</a></p>

<p>Heres a demo of boss killing in end game: <a href="https://sh.reddit.com/r/PathOfExile2/comments/1kseu40/finally_completed_all_content_on_my_ethical_build/" target="_blank">https://sh.reddit.com/r/PathOfExile2/comments/1kseu40/finally_completed_all_content_on_my_ethical_build/</a></p>
