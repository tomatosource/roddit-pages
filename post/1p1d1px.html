.postLink:visited {

.postHeader {

.commentList {

body > .commentList {

.commentAndChildren {

.comment {

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;

  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {

}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

<div class="commentAndChildren">

    <div class="comment">
      <div class="commentHeader">
        <div>pikpikcarrotmon</div>
        <div>2 | an hour ago </div>
      </div>
      <label for="npp5862" class="commentText"><p>Not just about farming raw divines, it&rsquo;s about farming things that other people will buy for divines.  In a world with currency exchange and asynchronous trade you should basically just be selling everything you aren&rsquo;t planning to use in the short to medium term.  Even if you think you have something that could be useful much later, the money is worth more now and can get you farming that more difficult content quicker, accelerating profits and making you more likely to be able to afford it again later.</p>

<p>Basically it&rsquo;s a game of slots but because there are no real stakes you can just keep pulling the lever until you win.  That means efficiency is key.  Don&rsquo;t mope around in your hideout, go do content and do a lot of it as quickly as you can in the time that you have available.  If you have a 1% chance to get something good and you try once, you won&rsquo;t get it. If you try several hundred times you&rsquo;ll almost certainly get it and statistically more than once.</p>
</label>

<p>I was a rampant hoarder in previous leagues and decided to not do that this season and I think it really paid off.  This was really only possible because of the asynchronous trade.</p>

      <label for="nppbr0b" class="commentText"><p>Only factions of the overall wealth is from raw drops. Wealth comes from trading. This involves researching what sells and what builds look for in gear. For example: a 20% experience gain affix on a breach tablet sell for a minimum of 4 divines.</p>

<p>The first way to gain wealth is to set your item filter to filter out less desirable items or currency. The more time sorting through useless rares, means less time blasting maps. Setting Filter blade to &ldquo;uber strict&rdquo; is the first step.</p>

<p>(Edit): When people say they are averaging 30+ div, they usually mean the average combined overall drops (Raw drops + sellable items). Sometimes I got an hour without finding anything useful but then a good unique drops that sell for 4 div on hour 3.</p>
