    </h2>

      <label for="mgc0hb3" class="commentText"><p>From <a href="http://Globe.com" target="_blank">Globe.com</a></p>

<p>By Adam Himmelsbach</p>

<p>As Al Horford completed a postgame interview that was broadcast on the TD Garden video board Wednesday night, he could not stop smiling. There was a question about the Celtics&rsquo; 128-118 win over the Trail Blazers, and Horford mostly just repeated two names.</p>

<p>“Payton Pritchard and Derrick White,” he said.</p>

<p>Another question led to a similar response.</p>

<p>“Payton Pritchard and Derrick White,” Horford said, still smiling. “That’s all you need to know tonight.”</p>

<p>While <a href="https://www.bostonglobe.com/2024/12/17/sports/payton-pritchard-celtics/?p1=Article_Inline_Text_Link" target="_blank">Pritchard</a> conducted a television interview nearby, Horford and other teammates slithered behind him and dumped cups of cold water on his head. In the locker room later, White was ambushed with a much larger water bath, with <a href="https://www.bostonglobe.com/2025/03/01/sports/celtics-jaylen-brown/?p1=Article_Inline_Text_Link" target="_blank">Jaylen Brown</a> even tossing a sneaker at him for good measure.</p>

<p>The Celtics are one of the most historic franchises in professional sports, and the championship banners and retired numbers that hang above the parquet floor are reminders of how difficult it is to find space in a record book anymore.</p>

<p>But Pritchard and <a href="https://www.bostonglobe.com/2025/01/18/sports/derrick-white-celtics/?p1=Article_Inline_Text_Link" target="_blank">White</a> submitted improbable, riveting, and unforgettable scoring performances.</p>

<p>Pritchard erupted for 43 points and White poured in 41, career highs for both, and they became the first Celtics teammates to reach the 40-point mark in the same game, and the first duo in NBA history to connect on at least nine 3-pointers apiece. And less than a week after <a href="https://www.bostonglobe.com/2025/03/01/sports/jayson-ntatum-jaylen-brown-celtics/?p1=Article_Inline_Text_Link" target="_blank">Brown and Jayson Tatum combined for 83 points against the Cavaliers</a> to set the franchise record for a duo, Pritchard and White broke that record, too.</p>

<p>“Me and P were talking about it, and it was kind of crazy like, we weren’t even hitting the rim, just swishes,” White said.</p>

<p>Pritchard was 14 for 20 from the field and 10 for 16 from the 3-point line, and he was serenaded with “MVP” chants when he put the finishing touches on the win at the foul line. White made 14 of 26 overall and 9 of 17 3-pointers.</p>

<p>After the game, White scanned the stat sheet and said that Pritchard should have fired up a few more shots.</p>

<p>Both players received expanded opportunities with Tatum (rest), Kristaps Porzingis (illness) and Jrue Holiday (finger) all sidelined. But their explosive play gave the NBA a reminder of this team’s unusual depth, and ability to puncture a defense from so many angles.</p>

<p>“The way those two played showed a lot about who they are,” Celtics coach Joe Mazzulla said. “They do a lot of the dirty stuff when we’re fully healthy. They do a lot of things for the team, and to have a night like this where those two can show what they are capable of was big for us. So we’re lucky to have them, and it was a lot of fun to watch them do that.”</p>

<p>The record-breaking performances of Pritchard and White were unique, in part, because they were so efficient and simultaneous. They were not hunting shots. In fact, Pritchard attempted just three in the fourth quarter.</p>
