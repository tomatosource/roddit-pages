

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://v.redd.it/bxcppv7rzwdf1"><p>True Damage Flickerwitch | Solves the typical Flickerstrike build problem of getting oneshot</p>
</a>
    </h2>

    

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="n42top6" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Gizmosticks</div>
        <div>1 | 4 minutes ago </div>
      </div>
      <label for="n42top6" class="commentText"><p>The video is T15 map and lvl 81 Xesht (about 8 million hp). This build solves the problem with Flickerstrike builds where you insta-die when you stop flickering which is beyond frustrating. I have tried many ascendancies and classes for Flickerstrike and this feels the most reliable and fun to play. The Witch Ascendancy allows you to double your HP pool while flickering and defers 25% of damage from hits over 4 seconds giving you time to pot, recover and flicker some more!</p>

<p>The Coming Calamity ignores elemental resists and Witch ascendancy ignores armour so you deal true damage. I oneshot that Xesht without even using Infernal Cry and Powertread which would have massively increased my damage, I also have around 175% rarity in my build right now.</p>

<p><strong>Build Guide:</strong> <a href="https://mobalytics.gg/poe-2/profile/07718827-eccc-4fcc-bf43-bca6c0a736e2/builds/16bee020-8cdc-45d1-a51c-fbc7b8700978" target="_blank">https://mobalytics.gg/poe-2/profile/07718827-eccc-4fcc-bf43-bca6c0a736e2/builds/16bee020-8cdc-45d1-a51c-fbc7b8700978</a></p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
