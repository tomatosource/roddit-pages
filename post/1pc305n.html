

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/2ig4gqee1r4g1.jpeg"><p>On This Day in Baseball History - December 2</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/2ig4gqee1r4g1.jpeg" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="nrurh9r" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Ranger5951 | New York Mets</div>
        <div>7 | 6 hours ago </div>
      </div>
      <label for="nrurh9r" class="commentText"><p>The O’Malley ruse that had been rebranded as Robert Moses fault by the O’Malley apologists. The true loss was the Giants who were in a loose loose situation with an owner who didn’t know what he was doing and a true financial nightmare situation. I always wonder what the outcome would’ve been if the PCL had actually gained ML status as was their goal from 1946 on, or if the NL/AL continued its anti expansion stance and the Continental League was forced into fruition. I could see a scenario where the AL/NL/CL race to expand to potential markets, even plopping another team in the NY tri state area just because.</p>

<p>The CL overall would have pushed baseball to innovate similar to the ABA/AFL in the face of competition, the lack of competition in the 60’s allows baseball to rest on laurels and not innovate the way all other major American Sports Leagues had to.</p>
</label>
    </div>
  </label>

      <label for="nrurmw0" class="commentText"><p>Truly one of the great &ldquo;what if&rdquo; butterfly effects in baseball history.</p>
</label>
    </div>
  </label>

<div class="commentAndChildren">

        <div>1 | 6 hours ago </div>
      </div>
      <label for="nrurtcu" class="commentText"><p>It literally is, especially with O’Malley being the defacto voice of the NL at the time, a lot of branches stem from that tree.</p>
</label>
    </div>
  </label>
  
</div>

  </body>
</html>
