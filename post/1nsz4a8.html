    </h2>

      <p>Who here enjoys the chayuga monk? I can&rsquo;t seem to feel we got robbed on this patch. Chaos should be op over any element. Involker still dominates</p>

      </div>
      <label for="ngq3f15" class="commentText"><p>When league started I was excited to try the chayula monk,the changes sounded good. I have changed to invoker after some time, it feels weak and weird to play</p>

<div class="commentAndChildren">
  <input id="ngq94og" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Koozer</div>
        <div>1 | 10 minutes ago </div>
      </div>
      <label for="ngq94og" class="commentText"><p>I can&rsquo;t seem to make Chaos damage work in any way. There&rsquo;s no intuitive setup for the ascendancy because each part of the tree is so jarring for a build. For example, Darkness deleting spirit makes me not want to use it primarily because I lose charge generation with Combat Frenzy.</p>

<p>The dodge is neat but feels like such a waste of points to take. It should be built into one of the other nodes as it&rsquo;s not worth the investment imo. Having a random elemental buff feels like it should be in Invoker not HoC. And the remnants are kinda cool but very underwhelming from what I&rsquo;ve tried. The tree appears to want me to run leech but i can&rsquo;t build enough HP to even consider supporting it?</p>

<p>Volatility <strong>feels</strong> like it could be awesome, but all the supporting passives and support gems are so lacking. Especially the gem that requires volatility to use a skill, this needs to be usable on things like Tempest Bell. I want to be able to make a build that ramps up Volatility and then unleashes it with Bell.</p>

<p>Chaos skills in general are disappointing, I&rsquo;d like to see GGG add skills on par with the frost skill gems such as Ice Strike and Charged Staff. And I wish the new node to turn fire damage into Chaos should work for all abilities or even other abilities. The thought of this working on a Monk build and converting all your elemental damage to Chaos would be awesome.</p>

<p>Even the micro transactions support the idea of a Chaos monk with the bell being replaced with a beach hand.</p>

<p>There&rsquo;s a ton of potential, and cool ideas but nothing works and it needs a lot of attention from GGG to make it feel interesting.</p>

<p>For now, I&rsquo;ve built heavily into freezer build up and use the Volatility and Remnants for extra damage that ramps up as I clear. It&rsquo;s a fun build out works really well. But it doesn&rsquo;t feel like a chaos build in any way and would probably work way better if it was on the Invoker tree.</p>
</label>

  </label>
  
</div>
