      <label for="o5prfp9" class="commentText"><p>From Chris Forsberg:</p>

<p>When the playoffs arrive, it seems fair to suggest that Jayson Tatum, Jaylen Brown, Derrick White, Payton Pritchard, Neemias Queta, Sam Hauser, and newcomer Nikola Vucevic are going to see the majority of minutes. Joe Mazzulla must determine how to deploy that talent, and that includes continuing to integrate Vucevic after his acquisition. The team got immediate returns in shuffling Pritchard back to the bench, and we’re intrigued to see what becomes of the team’s end-of-game lineups. </p>

<p>The real question might simply be which of Boston’s young wings will emerge as consistent postseason presences. Jordan Walsh, Baylor Scheierman, and Hugo Gonzalez have each gotten long auditions (and departed Josh Minott did as well earlier in the year, while two-way wing Ron Harper Jr. has provided strong minutes in recent opportunities). </p>

<p>Scheierman has clearly won Mazzulla’s trust, as emphasized by starting four of the five games before the All-Star break. His blend of defensive versatility and 3-point shot-making has been accentuated in bigger minutes. Jordan Walsh had a stretch earlier this season where his defense and energy had opponents raving about his potential, and he tapped into that energy in the first-half finale against the Bulls on Wednesday. Gonzalez has the best net rating (+17.0) among all players with 40+ appearances this season and brings a positive chaos each time he touches the floor.</p>

<p>Players have thrived in Mazzulla’s “ready when called upon” strategy, and maybe that’s how it will remain into the postseason. But that each of those young wings can make a strong case for minutes emphasizes again just how good and how deep this group has been.</p>
