</a>
    </h2>

    

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="mzp03u5" type="checkbox" checked/>

      <label for="mzp03u5" class="commentText"><p>From <a href="http://Globe.com" target="_blank">Globe.com</a></p>

<p>By Christopher L. Gasper</p>

<p>It turns out the Celtics’ greatest threat isn’t another basketball team. It’s not the newly-minted NBA champion Oklahoma City Thunder or Kevin Durant joining forces with old friend Ime Udoka’s Houston Rockets or some ascendant Eastern Conference foe. It’s not even the bête noire of Jayson Tatum’s Achilles’ injury.</p>

<p>Nope, their undoing is the NBA’s collective bargaining agreement. That’s what broke up this era of Green good feelings with <a href="https://www.bostonglobe.com/2025/06/24/sports/report-celtics-trading-jrue-holiday-trail-blazers-anfernee-simons-two-second-round-picks/?p1=Article_Inline&amp;p1=Article_Inline_Text_Link" target="_blank">the trade of Jrue Holiday to the Portland Trail Blazers</a> on Monday night for Anfernee Simons, two future second-round picks, and precious luxury tax bill savings. Then word broke Tuesday night that <a href="https://www.bostonglobe.com/2025/06/24/sports/celtics-kristaps-porzingis-traded/?p1=Article_Inline_Text_Link" target="_blank">Kristaps Porziņģis and his expiring contract were the latest to go</a> in the Parquet Purge.</p>

<p>The Celtics are the canary in the coal mine for this CBA and its prohibitive luxury tax penalties. Can a team field two supermax players (Tatum and Jaylen Brown) and build a perennial title contender with those salaries on the books? Or are they fated to face the hoops Hobson’s choice of sacrificing one of those superstars or the quality of the supporting cast around them?</p>

<p>Celtics president of basketball operations Brad Stevens is running this beta test for the rest of the league. Even if Tatum hadn’t crumpled to the court at Madison Square Garden in May, the Celtics were entering belt-tightening/breakup mode this summer. They faced a potential <span class="math inline">\(500 million bill between player salaries and luxury tax payments for being north of the second apron, which in NBA parlance is like being north of the Arctic. In addition, the team’s 2032 first-round pick is frozen; it can’t be traded because Boston exceeded [the dreaded second apron](https://www.boston.com/sports/boston-celtics/2025/05/20/celtics-second-apron-nba-salary-cap-second-apron-jrue-holiday-kristaps-porzingis/) of \)</span>188.9 million last season while chasing a repeat.</p>

<p>Like a certain Marvel villain who culled half the universe with a snap of his fingers, this NBA CBA, approved in 2023, is inevitable — as are the changes it compels.</p>

<p>The Celtics are caught square in its cross-hairs. Thus, their championship window with this crew was a porthole. It could get worse. Ultimately, the Celtics could be compelled to part with Brown, who is due salaries of <span class="math inline">\(53.1, \)</span>57, <span class="math inline">\(61, and \)</span>64.95 million over the next four seasons of his five-year, <span class="math inline">\(304 million deal. Those run concurrent to Tatum’s NBA-record five-year, \)</span>314 million supermax extension, which kicks in next season.</p>

<p>The best version of the Celtics features the Jays. They’re the best duo in the league, ideal complements. It’s anathema that the Celtics even have to ponder breaking them up a mere season-plus after they broke through as champions.</p>

<p>Rather than punishing teams such as the Celtics, who drafted two All-NBA players with the No. 3 pick in back-to-back drafts in 2016 and 2017, the NBA should be celebrating them — the teams that construct winners organically, through adept drafting and shrewd trades, and retain their homegrown stars.</p>

<p>Instead, the Celtics are being punished for putting together a roster that’s too talented and having ownership that was willing to foot the bill in pursuit of banners. Wyc Grousbeck and his family <a href="https://www.bostonglobe.com/2025/03/20/sports/boston-celtics-team-sale-william-chisholm/?p1=Article_Inline_Text_Link" target="_blank">sold the franchise to Bill Chisholm</a> in March for an evaluation projected to be $7.3 billion when both tranches of the sale are complete. (Wyc will remain governor through 2028.)</p>
