

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/67j40cdchq7g1.png"><p>IMO swapping these nodes positions would make a lot more sense</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/67j40cdchq7g1.png" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="nuhs3rj" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>bigeyez</div>
        <div>6 | 9 hours ago </div>
      </div>
      <label for="nuhs3rj" class="commentText"><p>Yeah there are a few other clusters with this same design and it&rsquo;s weird. I think its due to them wanting clusters to fill certain shapes but not always having real choices in power they want to give it.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nuig0ez" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>ZePample</div>
        <div>3 | 6 hours ago </div>
      </div>
      <label for="nuig0ez" class="commentText"><p>I&rsquo;m pretty sure its because usually Penetration has way higher value than 6% damage so they wanted to separate them to make the opportunity cost of taking both bigger.</p>

<p>In your case it&rsquo;s ironic that you don&rsquo;t want fire pen.</p>

<p>Edit : in poe2, since Resistances can only be Penetrated down to a minimum of 0% by default. There&rsquo;s no real reason to value penetration over ignoring the resist.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="nuigpe6" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>doctor-omie</div>
        <div>1 | 6 hours ago </div>
      </div>
      <label for="nuigpe6" class="commentText"><p>fire pen II support gem makes skill hits completely negate enemy fire res so I dont think the nodes are as valuable as you think</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="nuihrfb" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>ZePample</div>
        <div>1 | 6 hours ago </div>
      </div>
      <label for="nuihrfb" class="commentText"><p>That&rsquo;s what i said &ldquo;In your case it&rsquo;s ironic that you don&rsquo;t want fire pen.&rdquo; but you&rsquo;re the marginal one here. Most build will prefer stacking penetration from other sources and having a 30% more damage support gem instead.</p>

<p>You decided that Firepen II was worth more than trying to get pen and it might very well be. (Especially if you don&rsquo;t &ldquo;hit&rdquo;.) but i don&rsquo;t think that&rsquo;s the majority of users.</p>

<p>Regardless, i&rsquo;m pretty sure that&rsquo;s the reason for this design, they do this when there&rsquo;s a big difference in value between the 2 different small nodes.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="nuijl9m" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>doctor-omie</div>
        <div>1 | 6 hours ago </div>
      </div>
      <label for="nuijl9m" class="commentText"><p>I think you missed the part where i said im running avatar of fire so half the &ldquo;more damage&rdquo; attack supports, particularly those which boost physical damage, lose value because you do no physical damage. making fire pen II one of the best choices alongside the 2-3 viable more elemental/unconditional damage supports. so yea, i still stick to my view on the design and i believe it counters build specialization and variety</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

</div>

</div>

        
      
    </div>
  </body>
</html>
