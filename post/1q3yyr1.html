

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://www.reddit.com/gallery/1q3yyr1"><p>Some Neemias Queta numbers.</p>
</a>
    </h2>

    

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="nxogw9p" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>DonkeyKongDominatri</div>
        <div>4 | an hour ago </div>
      </div>
      <label for="nxogw9p" class="commentText"><p>Neemia&rsquo;s numbers are so efficient, I bet he calculates his grocery bill in points per possession.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nxonzb4" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>not_Brendan</div>
        <div>3 | 26 minutes ago </div>
      </div>
      <label for="nxonzb4" class="commentText"><p>And to think he was the third or fourth string guy last year&hellip;</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nxorm4q" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>ChickenWhiskers | GINO TIME</div>
        <div>1 | 9 minutes ago </div>
      </div>
      <label for="nxorm4q" class="commentText"><p>I honestly haven’t even thought of Queta a whole lot during games recently — and I mean that as a great thing. Screens have gotten smarter, puts the ball in the bucket when he’s inside, makes guys he’s up against kick the ball out….just sound basketball from a 7-footer. Can’t ask for much more. </p>

<p>It’s funny that the Celtics have kind of single-handedly re-affirmed the importance of a conventional big in the last bunch of years. Everybody wanted a 5 that could stretch and now it feels like we’re purposely anchoring our guys inside after a tight pick and roll. Very old school style of play and it’s working. </p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
