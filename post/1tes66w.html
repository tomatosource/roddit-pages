      <label for="om4c5h5" class="commentText"><blockquote>
<p>Nice to see my fellow parry enjoyers!</p>

<p>I didn&rsquo;t know that the hitbox is skewed that way, very interesting.</p>

<p>Also didn&rsquo;t know about the Wand tech, really cool!</p>

<p>I also fully agree that it&rsquo;s slept on because people never try to invest into Stun Threshold, but also because the first cluster sucks (%block are dead nodes because of low base, and enemy crit isn&rsquo;t a problem at that stage).</p>

<p>A few notes from my journey with Parry:</p>

<p>- Scaling pure stun in endgame falls off a cliff even with investment, but Pin Support works perfectly as you said. Not sure why.</p>

<p>- Dazing Blocks notable works for Parry, but I&rsquo;m pretty sure it only applies to the enemy whose hit you blocked. Sadly.</p>

<p>- Someone else already mentioned the Splash tech with Tribal Fury or Tyranny&rsquo;s Grip</p>

<p>- The Stun Empty if Parried Recently notable line does nothing. Defender&rsquo;s Resolve however works.</p>

<p>- I used Pathfinder + Mobility Support to constantly parry while moving through the map. You never have to let go of parry, you can just press a skill button using your damage weapon set and your will switch to that weapon for the duration of the attack, before instantly going back to parrying. But this doesn&rsquo;t work if your Parry is on RMB and the attack is on LMB. Parry is also an excellent way to instantly stop sprinting on demand.</p>

<p>- Xesht is the worst boss in the game for parrying, none of his direct moves are parriable.</p>

<p>- You really want to roll maps with monster speed, because otherwise they will miss you a lot more unless you stand perfectly still and wait. Inc Stun Buildup really sucks though.</p>

<p>- The best early support gems imo are Steadfast I and Blind I (Tier 2). If you have another source of blind, Pin or Stun I are the best ofc.</p>

<p>- Swift Interruption is an amazing bit expensive node to anoint. Keep an eye out for Megalomaniacs that have it during the first weeks of the league! Because you want it on both weapon sets, taking it with just your dedicated Parry set nodes is a bit of a waste.</p>

<p>- Pin and Run is also a really cool notable to get that way since it&rsquo;s so out of the way otherwise</p>

<p>- The easy application of Pin allows for some Culling Threshold shenanigans with Finish Them. If you use an empty hand in your buckler setup or a quarterstaff in your main that way you can make use of the Killing Palm very easily (don&rsquo;t forget Ancestral Call on it as well)</p>

<p>- Eroding Chains is really interesting if you can make use of Armour Break somehow, like for endurance charge generation for Charge Regulation with the Armour Break II support gem on e.g. Wind Dancer or Disengage</p>

<p>- For Bleed Builds Rusted Pins allows you to easily inflict aggravated bleeding, which combined with the debuff can be really nutty</p>

<p>- If you are not starting Huntress but e.g. Deadeye, you really miss out on the early Parry nodes. That hurts a lot.</p>
</blockquote>

<p>- Nagelfar</p>

<blockquote>
<p>For endgame purposes, it also bears mentioning that Parry benefits from Tribal Fury for some reason and can splash the parried debuff onto a massive amount of enemies (especially with a little investment into attack area of effect). This allows Fangs of Frost to essentially chain its cold explosions to a frankly ridiculous amount of enemies and pop entire screens at the same time.</p>
</blockquote>

<p>- xanthopoe</p>
