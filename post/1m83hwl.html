

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://www.reddit.com/gallery/1m83hwl"><p>Cache Issue?</p>
</a>
    </h2>

    

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="n4w763t" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>4rkarium</div>
        <div>4 | 18 hours ago </div>
      </div>
      <label for="n4w763t" class="commentText"><p>Maybe &ldquo;verify files&rdquo; on steam?</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="n4xzqgq" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>deimophobias</div>
        <div>1 | 13 hours ago </div>
      </div>
      <label for="n4xzqgq" class="commentText"><p>You wouldn&rsquo;t necessarily find the files that are causing the crash if the game uses a virtual file system. Your best bet is verify files or reinstall, as it seems the file is corrupted in a way that the game is trying to allocate an invalid amount of memory, perhaps more than the OS is allowing due to some file or memory corruption error.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="n4ynzfl" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>BakiSaN</div>
        <div>1 | 11 hours ago </div>
      </div>
      <label for="n4ynzfl" class="commentText"><p>Check the space on your C disk</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="n4zl9cw" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>impii</div>
        <div>2 | 8 hours ago </div>
      </div>
      <label for="n4zl9cw" class="commentText"><p>that error means you are out of memory, make sure you have the page file enabled (let windows manage the pagefile, just dont mess with it) and enough space on C. Also you should have at least 16GB of RAM or you may have a bad time.</p>

<p>in case its nothing above it could also be a corrupted file with a bad header and it tries to allocate too much memory because of that, so verify files in that case</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
