

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/xu7t29e19s1g1.png"><p>Need help crafting mace</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/xu7t29e19s1g1.png" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="npagge6" type="checkbox" checked/>

      <div class="commentHeader">
        <div>Corruptshun</div>
        <div>1 | a day ago </div>
      </div>
      <label for="npagge6" class="commentText"><p>You want to get flat phys as your last prefix (probably omen of homogenisation)</p>

<p>And want to use perfect essence of battle to upgrade the melee skills to attack skills</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="npaim1m" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>ThicCcCccCCCCW</div>
        <div>1 | 21 hours ago </div>
      </div>
      <label for="npaim1m" class="commentText"><p>Wouldn&rsquo;t using essence of battle give +4 to attack vs the +5 the melee currently? Or are attack skills more general so its still better.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="npamwm6" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>sps41</div>
        <div>1 | 21 hours ago </div>
      </div>
      <label for="npamwm6" class="commentText"><p>I think the skills question depends on your build. How many non-melee attack skills do you rely on? If not many, keep the +5 (it&rsquo;s much better for me that +attacks for instance, but if you run heralds the opposite may be true!).</p>
</label>
    </div>
  </label>
  
</div>

    
      
<div class="commentAndChildren">
  <input id="npaunng" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Corruptshun</div>
        <div>1 | 19 hours ago </div>
      </div>
      <label for="npaunng" class="commentText"><p>Battle would give +6 and attack skills applies to more than just melee skills (herald for example)</p>

<p>+4 is for bows</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="npb6n65" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>SushimuffinZ</div>
        <div>1 | 18 hours ago </div>
      </div>
      <label for="npb6n65" class="commentText"><p>+6 on two handed, +4 on one handed.</p>

<p>Correct choice would be to keep the +5 melee even if there are heralds that are affected by it.</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

    
  </div>
  
</div>

    
  </div>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="npcrtxe" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>WhichWolfEats | customflair</div>
        <div>1 | 13 hours ago </div>
      </div>
      <label for="npcrtxe" class="commentText"><p>You cannot have reduced attack speed hybrid it makes it like t5 phys. Your suffix are full so just continue omen of light and jawbone for t1 phys # or t2 phys % (max with your ilvl) also can lock accuracy on desecrate to sinister erasure and whittle to one of those phys. Then omen of light and hit with jawbones till you get the other. Could be pricey in the end</p>

  </label>
  
</div>

        
      
    </div>
  </body>
</html>
