    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>

      <label for="oq1nwqh" class="commentText"><p><a href="https://poe.ninja/poe2/profile/Misha-0597/runesofaldur/character/Alomos" target="_blank">https://poe.ninja/poe2/profile/Misha-0597/runesofaldur/character/Alomos</a></p>

<p>I&rsquo;m having tons of fun blasting with Infernal Cry Paquate&rsquo;s Pact this league! Here&rsquo;s a video doing a 7-mod T15 map in a few minutes. Each warcry covers the whole screen.</p>

<p>Single target is a struggle, so I used several layers of general damage bonuses (namely Marked for Sickness, Thousand Cuts, and Her Declaration) with Blood Hunt to reliably topple bosses.</p>

<p>Defensively, Reverie with Shavronne&rsquo;s Satchel means we gain 1500 combined life/energy shield per second. Combined with over 50% block, critical hit immunity, oodles of movement speed, and the ability to kill at 10 meters, the build is has insane sustain. Physical max hit is unfortunately not a strong suit.</p>

<p>The companion is a physical damage aura/trail of lightning Fleshpierce, providing additional damage and the only reliable way to shock bosses on this build.</p>

<p>The timeless jewel has x2 War Tactics (40% physical damage) and x1 Sensible Precautions (6% block, 40% life flask recovery) in its radius. I tried over 100 jewels and it was the best one I found.</p>

<p>Note that there&rsquo;s currently a bug where the corrupted +1/-1 gem level does not affect Paquate&rsquo;s Pact damage, so save yourself the trouble and just use a <sup>20</sup>&frasl;<sub>20</sub> (or <sup>20</sup>&frasl;<sub>23</sub>!) Infernal Cry. I have reported the bug on the GGG forums <a href="https://www.pathofexile.com/forum/view-thread/3949913" target="_blank">here</a>.</p>
