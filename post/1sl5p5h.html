    <h2>
      <a class="postTitle" href="https://www.reddit.com/r/PathOfExile2/comments/1sl5p5h/great_analysis_of_defenses/"><p>Great analysis of defenses.</p>
</a>
    </h2>

    
    <div class="selfPostContainer">
      <p><a href="https://www.youtube.com/watch?v=PidjGxqUfMo" target="_blank">https://www.youtube.com/watch?v=PidjGxqUfMo</a></p>

<p>(not my video, not affiliated in anyway)</p>

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="og43ckj" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>schnudercheib</div>
        <div>9 | an hour ago </div>
      </div>
      <label for="og43ckj" class="commentText"><p>I took at the look at the talking points and don&rsquo;t think this videos highlights the core issue armour (in my opinion) suffers from.</p>

<p>I disagree on the points that armour is bad against elemental mitigation. It used to be, yes. But it is now <strong>very</strong> effective against ele mitigation*.</p>

<p>The issues with armour, I feel, are the following two (or three if we include the bonus point):</p>

<ul>
<li><strong>Armour is inherently bad against large single hits.</strong> Since by scaling content you will always tend to face enemies that hit harder and harder, it is an unavoidable problem that you will reach a point where the mitgation armour alone provides will start to fall off. We can now discuss however, if that is a problem that needs fixing, since some hits are probably just intended to kill a character outright, and I personally think that is okay.</li>
<li><strong>Armour is useless against damage over time.</strong> The same problem emerges with pure Evasion builds, so this is not armour specific. It&rsquo;s just kinda crazy how much ES is allowed to ignore dots, while the other defense types have to find a way to somehow patch that hole. Here it would be interesting to learn if GGG intend defenses to be layered like in poe1, or if a single layer should be able to cover everything.</li>
<li><strong>Bonus point: Armour only gets good with high investment.</strong> It&rsquo;s insane how big the difference is between medium investment in armour and high investment in armour. Armour feels kinda shit for a pretty long time, until you suddenly become giga tanky. I personally enjoy building that way, but if defenses are meant to be layered, armour probably needs some tweaking in the lower investment ranges.</li>
</ul>
</label>
    </div>
  </label>

</label>
