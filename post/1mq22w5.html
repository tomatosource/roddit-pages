

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/abg7jg66vzif1.jpeg"><p>Why are most skill gems only level 14–15?</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/abg7jg66vzif1.jpeg" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="n8nnaw0" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>GL1TCH3D</div>
        <div>35 | an hour ago </div>
      </div>
      <label for="n8nnaw0" class="commentText"><p>Because you&rsquo;re probably doing tier 1 maps</p>

<p>They drop based on the ilvl (monster level)</p>

<p>Your level 20 probably came from a ventors strongbox</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="n8npzdu" type="checkbox" checked/>

        <div>1 | an hour ago </div>
      </div>
      <label for="n8npzdu" class="commentText"><p>Ah, got it. Thank you so much</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="n8nnjv1" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>suburbcoupleRR</div>
        <div>4 | an hour ago </div>
      </div>
      <label for="n8nnjv1" class="commentText"><p>The higher the tier, the more rare they are. What level maps are you running? T16S with increased rarity/quant can help your odds of finding higher ones.</p>

<p>Keep in mind the requirements increase with skill gem tier too, so many skills you don&rsquo;t need at level 20.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="n8nolwy" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>JiDi_GD</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="n8nolwy" class="commentText"><p>I’ve just gotten into the endgame and I’m running T1 maps.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="n8np12u" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>suburbcoupleRR</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="n8np12u" class="commentText"><p>Yeah, keep doing higher and higher tier maps, the higher gems will drop the higher you go.</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

    
  </div>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="n8nyp72" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>BenjaminRaule</div>
        <div>1 | 12 minutes ago </div>
      </div>
      <label for="n8nyp72" class="commentText"><p>Because poe2&rsquo;s gem and socket system sucks</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="n8o0q1i" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>keener91</div>
        <div>1 | a minute ago </div>
      </div>
      <label for="n8o0q1i" class="commentText"><p>It can be improved for sure. The very least give us a gem menu without having to right click on a gem. So often I click a gem trying to figure out why my skills aren&rsquo;t there then I realize it was a spirit gem I selected - they all look the same!</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

        
      
    </div>
  </body>
</html>
