

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/1kubxp8oar7h1.jpeg"><p>Every single time</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/1kubxp8oar7h1.jpeg" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="os443is" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>JellyfitzDMT</div>
        <div>1 | 21 minutes ago </div>
      </div>
      <label for="os443is" class="commentText"><p>“Crafting”</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="os44edb" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Shiznoz222</div>
        <div>1 | 20 minutes ago </div>
      </div>
      <label for="os44edb" class="commentText"><p>So in order for crafting to be really good you either need to be incredibly lucky, or use extremely expensive currency to fine tune the affixes. (Omens of light, crystallizations, erasures, etc)</p>

<p>And then you need to use that currency to make something that&rsquo;s in demand</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="os46beq" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>No_Atmosphere777</div>
        <div>1 | 8 minutes ago </div>
      </div>
      <label for="os46beq" class="commentText"><p>If you are trying to make &ldquo;good enough&rdquo; items, crafting works and works well. If you are trying to make really good items, crafting is expensive, hard to access, and generally frustrating.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="os45q64" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Micro_mint</div>
        <div>1 | 11 minutes ago </div>
      </div>
      <label for="os45q64" class="commentText"><p>There are two barriers to crafting successfully. First, you can’t craft stuff following guides on youtube or you’ll pay a huge premium for getting there second. Second, you need a pretty expansive understanding of every other meta build’s needs so you can sell all your bricks.</p>

<p>I don’t know any crafters that dump 100d into a single item, they dump 100d attempting to make a dozen items and resell all but the one that pops off to turn a profit.</p>

<p>So when a youtuber says “if you miss you’re fucked go back to step 2,” you have to be able to recognize when you missed for what you wanted, but hit for a good item for someone else. Then you can start from scratch, not from step 2.</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
