

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/kuvbcfimmwtf1.png"><p>Rarity viewed by someone who has nearly 16 days playtime in 0.3 SSF</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/kuvbcfimmwtf1.png" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="nifzoeg" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Narrow-Rub3596</div>
        <div>1 | 17 minutes ago </div>
      </div>
      <label for="nifzoeg" class="commentText"><p>While I don’t necessarily like/enjoy rarity on gear, I do believe people put way too much emphasis on it. Sure, it might help with juicing maps to get currency drops; but once you have reached the point where you make this game a div/hour simulator you’re making the game as un-fun as possible.</p>

<p>I have more fun slamming perfect alch/trans on white bases than I do farming currency.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nig1pn6" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Miles_Adamson</div>
        <div>1 | 7 minutes ago </div>
      </div>
      <label for="nig1pn6" class="commentText"><p>In PoE1 player rarity/quant does not affect boss specific drops (it does affect their generic loot but that&rsquo;s not very useful), chests or generated rewards like those from essence mobs, ultimatum or the ritual window. While they changed player IIR a bit for poe2 I don&rsquo;t think they changed how it works for any of those</p>

<p>I generally agree with you, there just needs to be more ways to farm stuff that IIR doesn&rsquo;t affect and then it won&rsquo;t feel as mandatory. Like for example if they add blight and you&rsquo;re just opening blight chests, player IIR won&rsquo;t matter for that so it would just be another thing you can skip it for</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nig1zxm" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Kevlar917_</div>
        <div>1 | 6 minutes ago </div>
      </div>
      <label for="nig1zxm" class="commentText"><p>People will say that you literally can not play the game without 150% rarity.  It&rsquo;s always nice to see a reasonable post about it.</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
