

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/nfcis57tolvf1.jpeg"><p>Where to go from here?</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/nfcis57tolvf1.jpeg" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="njx7yuo" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Exoskeleton78</div>
        <div>8 | 5 hours ago </div>
      </div>
      <label for="njx7yuo" class="commentText"><p>usually people start with lighting damage T1, then homogenizing suffix slam into +5&hellip;</p>

<p>if I were in your shoes, I will do all suffix homogenizing slam first, then attempt to desecrate the lightning damage</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="njxuff4" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Kaylesse</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="njxuff4" class="commentText"><p>This is one of the ways only to get +5, generally it doesn&rsquo;t matter if it is spell dmg or lightning dmg if you already have +5 on it. Spell dmg gives caster tag (with attack) which is nice for all the suffixes such as cast speed or crits</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="njxm5rx" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>zethras</div>
        <div>6 | 3 hours ago </div>
      </div>
      <label for="njxm5rx" class="commentText"><p>You want to do first homo suffix-only double greater or perfect exalt. You will garantee to get 2 of the following: crit multi, cast speed and crit chance. If you are using Maligaro Virtoursity like everyone going Lightning, then you want to hit Crit chance and cast speed for the best outcome. <sup>2</sup>&frasl;<sub>3</sub> chance.</p>

<p>For the two prefix left, you can also double homo greater or prefect exalt for it. The only not so great mod will be spell dmg with maximum mana. You can also desacrate amunamu (for 74-89% elemental dmg) and then go for homo exalt (you want lightning gain or lightning spell dmg).</p>

<p>Good luck.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="njxxy6w" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Eternal59</div>
        <div>1 | 19 minutes ago </div>
      </div>
      <label for="njxxy6w" class="commentText"><p>Lightning spell dmg cannot coexist with the desecrated ele dmg</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="njx82me" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>OkWin1634</div>
        <div>1 | 5 hours ago </div>
      </div>
      <label for="njx82me" class="commentText"><p>depends on how cheap you want to go, good thing about wands is besides mana, all the mods are pretty much good this league. there are plenty of wand craft videos on YT though that go step by step</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="njx84ma" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>SimpleNovelty</div>
        <div>1 | 5 hours ago </div>
      </div>
      <label for="njx84ma" class="commentText"><p>I believe it&rsquo;s double homo ex suffixes (which I believe is guaranteed cast speed/spell crit/crit damage), homo ex a prefix (ritual annul prefix if it sucks), then desecrate the last prefix and omen it til it&rsquo;s good. But there might be a more efficient way and it also depends on your budget since if you really want you can just double homo exalt the prefixes too for the guaranteed ilvl 50+ (though I wouldn&rsquo;t). I&rsquo;d wait for one more person to confirm this method and don&rsquo;t take my word.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="njxflpi" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>GIMMIDAL00T</div>
        <div>1 | 4 hours ago </div>
      </div>
      <label for="njxflpi" class="commentText"><p>At the very least You want to homo/suffix/ x2 omen for cast speed and a crit. Then desecrate a gain and  homo slam another.</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
