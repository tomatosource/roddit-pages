

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://youtu.be/G7YeDsu_v0M?si=RJFeNPB9uLHpYDxr"><p>Game 7 of the 2006 Conference Semifinals: Dirk finally beats Duncan; Manu regrets costly mistake.</p>
</a>
    </h2>

    

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="ngmjqrz" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Malemansam | Spurs</div>
        <div>1 | 20 minutes ago </div>
      </div>
      <label for="ngmjqrz" class="commentText"><p>Manu fouling Dirk sent me into a serious &ldquo;sports depression&rdquo;. I didn&rsquo;t watch ball till at least half way through the next season because that shit ruined me, I&rsquo;ve lost children and it didn&rsquo;t hurt that bad.</p>

<p>Manu was our darling and the moniker &ldquo;Manu giveth, Manu taketh&rdquo; was already well established by his wild variance in play at times (e.g. the &lsquo;05 finals) prior to this but this moment was just such a knife into my heart, chaos is ripping my world apart experience that took the air out of my lungs through sheer disbelief it was happening..</p>

<p>And no not even the Ray Allen shot comes close to this moment for me, that was sheer luck, skill and timing all coming into a perfect execution in 1 of 81999 chances in a timeline. Yes we had time to win the game, yes we failed in ways after it but Manu&rsquo;s foul was completely nonsensical, like a trained dog that just decides to rip your childs face apart one sunday morning..</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="ngmjdpq" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Mav_Rixx | Mavericks</div>
        <div>1 | 23 minutes ago </div>
      </div>
      <label for="ngmjdpq" class="commentText"><p>I can never forget this game. I went to school in my Mavs jersey. While just about everybody else was in their Spurs gear. The following day, I felt pretty darn happy! This is still one of the craziest game I&rsquo;ve seen. I hope this rivalry makes a comeback.</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
