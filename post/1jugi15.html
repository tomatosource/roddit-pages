      <label for="mm1vgs1" class="commentText"><p>It&rsquo;s also just mathematics of the shot diet. Like you gotta be crazy if you think 1996 Bulls can keep up with the Steph Warriors, who are screening, switching making a bunch of crazy open 3s at high volume just because Jordan could iso through the crowd for a middy.</p>

      <label for="mm211sc" class="commentText"><p>That&rsquo;s true. That&rsquo;s why I don&rsquo;t think I brought up that Jordan wasn&rsquo;t a great 3pt shooter because he would&rsquo;ve been if he was born today and had the chance to adapt to it.</p>
