    <h2>
      <a class="postTitle" href="https://i.redd.it/dfrgbpug0lgh1.png"><p>[NOOB] How exactly does Split work? My arrows never split (75% + 25% chance)</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/dfrgbpug0lgh1.png" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="p0w3sq7" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>igniz13</div>
        <div>1 | 12 minutes ago </div>
      </div>
      <label for="p0w3sq7" class="commentText"><p>I&rsquo;m not sure why you think you have 75% chance to split from the picture you shared. Split shot does not provide splitting, says nothing about splitting projectiles. Fork and split are different.</p>

<p>Pierce, Fork, Split and Chain all happen at different times in a projectiles lifetime. Split occurs first, followed by Pierce, Fork then Chain.</p>

<p>See here for more info.</p>

<p><a href="https://www.poe2wiki.net/wiki/Projectile" target="_blank">https://www.poe2wiki.net/wiki/Projectile</a></p>
</label>

        <div>1 | 13 minutes ago </div>
      </div>
      <label for="p0w3ofr" class="commentText"><p>You don’t have a 75% chance to split you have a 75% chance for an additional proj when forking they’re seperate things. If you want to benefit from that 75% extra fork proj you need a fork support gem or some other source of it.</p>

<div class="commentAndChildren">
  <input id="p0w3otz" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>SlayerII</div>
        <div>1 | 13 minutes ago </div>
      </div>
      <label for="p0w3otz" class="commentText"><p>your projectiles have  a 25% chance from the gem, the passive does something different.With athe basic attack you have 0% chance thats wy it doesnt work.</p>

<p>For the passive to work you to have fork(like form a gem or passive), and if you have it, it gives a 75% to create 3 instead of 2 projectiles when forking. BUT thats not splitting.</p>

<p>forkin is different from split, fork creates projectiles behind the target and doesn&rsquo;t targets other enemies. its like peierce, you just get an extra pojectile.</p>
</label>

  </label>

<div class="commentAndChildren">
  <input id="p0w4lt3" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>sykotikpro</div>
        <div>1 | 9 minutes ago </div>
      </div>
      <label for="p0w4lt3" class="commentText"><p>Firstly, you are not speccing into split, you are speccing into fork. Split will force a projectile to &ldquo;split&rdquo; in two and target the 2 closest enemies, carrying the full damage with them.</p>

<p>For will cause the projectile to &ldquo;fork&rdquo; once hitting an enemy, creating 2 projectiles thst travel at a 45 degree from their original incoming angle. They do not automatically target enemies.</p>

<p>Secondly, the projectile needs to have the ability to fork in the first place. What you currently have specced will add a 3rd projectile that basically pierces through and continues the line of travel. But from what you&rsquo;ve shown, there doesn&rsquo;t seem to be any nodes allocated to make it fork, only create an extra projectile WHEN IT DOES fork.</p>

<p>Add fork support on the skill and you will see it spawn 3 projectiles traveling behind an enemy.</p>

<p>Again, fork is different than split.</p>
</label>

<p>Ideally, the notable should not be named &ldquo;split&rdquo; shot because that&rsquo;s not what it does, but they often use terms like that in a general sense.</p>
