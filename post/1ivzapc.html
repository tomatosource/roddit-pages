

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
}

.selfPostContainer * {
  color: white;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/6d85ahquqske1.jpeg"><p>Help with resistances</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img src="https://i.redd.it/6d85ahquqske1.jpeg" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="me9ur7k" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Sinikal-_-</div>
        <div>2 | an hour ago </div>
      </div>
      <label for="me9ur7k" class="commentText"><p>75% is the soft cap. Occasionally you&rsquo;ll get mods on waystones that reduce your max resist.</p>

<p>Say you have a soft cap of 75%</p>

<p>The number in parenthesis is your uncapped resist. That is how much you have total through all bonuses active for that particular resistance.</p>

<p>Say you have Cold: 75%(100%)   This means that if a waystone(or some kind of effect or curse) reduces your resist by 25% you&rsquo;ll still sit at 75%.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="me9vbqz" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Dashiznit364</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="me9vbqz" class="commentText"><p>So I’m in act 2 cruel so not at waystone level yet. Does it make sense to have more than 75% or should I add armor and energy shield runes to gear instead of resistance runes?</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="me9vtpm" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>stumpoman</div>
        <div>3 | an hour ago </div>
      </div>
      <label for="me9vtpm" class="commentText"><p>your resistances will drop 10% at the end of each act</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="me9w47m" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Dashiznit364</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="me9w47m" class="commentText"><p>So I guess stack resistances until I reach end game and then as long as capped to stack energy shield using runes instead of resistance runes?</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="me9xqgw" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Penguin_Poacher</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="me9xqgw" class="commentText"><p>In endgame there will be mechanics that lower your uncapped resistance. The most common example being elemental curses. It&rsquo;s a good idea to have your resistance over capped by about 25% in endgame.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="mea024r" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Dashiznit364</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="mea024r" class="commentText"><p>Good to know. Thanks man.</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="me9uucc" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Civil-Amphibian-3962</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="me9uucc" class="commentText"><p>That’s what the res is. Only 75 is working though?</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="me9uxsu" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>mtthefirst</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="me9uxsu" class="commentText"><p>The number in parenthesis are you combine total resistances of all your gears. Anything above that is not counted when the calculate for damage you take.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="me9v8e7" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Pr0pper</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="me9v8e7" class="commentText"><p>The number in parentheses is your uncapped resistance (whatever you got in total regardless of your cap). It&rsquo;s not completely wasted since there are mechanics like curses as e.g. elemental weakness reduce your resistance from your uncapped value. If you have 100 uncapped resistance and it would be reduced by 20, you&rsquo;d still be over the cap of 75 and thus at maximum resistance. If you&rsquo;d only have 80 uncapped resistance then it would be reduced to 60 and you&rsquo;d take a huge bunch of more damage due to that.</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
