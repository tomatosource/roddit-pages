

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>

	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/boa6ky0j5kwe1.png" />

<div class="commentAndChildren">

      </div>
      <label for="mol4f6o" class="commentText"><p>It has about 3-4k base damage per projectile firing 3 at once in fast tempo. Its terrible mechanic. Even with 75 resist it does around 800 damage and cant be blocked/evaded.</p>

<div class="commentAndChildren">

        <div>jouzeroff</div>
        <div>2 | 3 hours ago </div>
      </div>
      <label for="mol8b47" class="commentText"><p>I have around 50 chaos res and it hurts. If I am fighting a pack of mob and got hit by one&hellip; I am in trouble. I can dodge because they are slow, but it is very annoying to play around that. If it does this kind of damage, it shouldnt track us imo. it should just be a projectile that you can roll dodge just like those purple proj from strongboxes</p>

<p>There is also some maps where they are very hard to see. Just like the mob that throw a small red grenade that can one shot you (they are almost invisible on a map with grass).</p>

    </div>
  </label>
  
</div>

    
  </div>
  
</div>

        <div>3 | 3 hours ago </div>

<p>But they are overtuned</p>

</div>

      <div class="commentHeader">
        <div>Silver_Breakfast_233</div>
        <div>1 | 3 minutes ago </div>
      </div>
      <label for="molsg9d" class="commentText"><p>99%, no. It is overtuned though. An aspect of monster modifiers that I find unenjoyable is that many of them bypass evasion, block, and dodge roll. At least let me play against them in a bit of back and forth.</p>

</div>

        
      
        
          
<div class="commentAndChildren">

    <div class="comment">
      <div class="commentHeader">
        <div>ConsistentAide8156</div>

</label>
    </div>

</div>

        
      
    </div>
  </body>
</html>
