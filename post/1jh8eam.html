    <h2>
      <a class="postTitle" href="https://www.reddit.com/gallery/1jh8eam"><p>With the 4 sockets and 3 ssupport ockets i have how do I make charged stuff shoot and make exploding ice?</p>
</a>
    </h2>

    

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="mj555g8" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>hiIaNotSam</div>
        <div>5 | 12 hours ago </div>
      </div>
      <label for="mj555g8" class="commentText"><p>Use the support gem with higher chance to shock your target on the charged staff.
It should trigger herald of thunder and ice as long as you have the heralds set up right.</p>

<p>Edit: I just looked at your skill gems, it seems like you are not using herald of thunder?
There is a lot to be fixed here, look up a good guide on YouTube.</p>

<p>Explaining all the mechanics will be difficult on Reddit.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="mj57aub" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>ShatteredCitadel</div>
        <div>3 | 11 hours ago </div>
      </div>
      <label for="mj57aub" class="commentText"><p>Herald of thunder freezes to prock herald of ice. Herald of ice shocks to prock herald of thunder. You need both. Look up the support gems needed on each to make it happen.</p>

<p>Your primary will shock and start the cascade.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="mj57b0i" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>droden</div>
        <div>2 | 11 hours ago </div>
      </div>
      <label for="mj57b0i" class="commentText"><p>you put ice stuff in herald of thunder and lighning effects in herald of ice so they proc each other.  there is also a ring you can get that explodes chilled enemies as if frozen which does a lot of map clearing early on.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="mj5m3jl" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>3613robert</div>
        <div>1 | 10 hours ago </div>
      </div>
      <label for="mj5m3jl" class="commentText"><p>Have a look at this:</p>

<p><a href="https://maxroll.gg/poe2/build-guides/lightning-arrow-deadeye" target="_blank">https://maxroll.gg/poe2/build-guides/lightning-arrow-deadeye</a></p>

<p>Try to follow the set up as much as you can. Most important are lightning infusion in Herald of ice and cold infusion in Herald of thunder. Innervate and ice bite on lightning arrow helps tremendously as well on what your looking for. You would need some form of ice damage on your bow / quiver though to proc freezes, once that gets going easily enough you will see it all in action quite often.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="mj6gdds" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>W00psiee</div>
        <div>1 | 7 hours ago </div>
      </div>
      <label for="mj6gdds" class="commentText"><p>OP is probably playing gemling or invoker. Unclear if he wants to go tempest flurry or ice strike though. Nevertheless he isn&rsquo;t doing LA Deadeye</p>
</label>
    </div>
  </label>
  
</div>

<div class="commentAndChildren">
  <input id="mj6lk7s" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>yepterrr</div>
        <div>1 | 7 hours ago </div>
      </div>
      <label for="mj6lk7s" class="commentText"><p>The exploding ice chain comes from using herald of ice and thunder together. Ice cannot freeze, and thunder cannot shock, so you make ice shock and thunder freeze so they propagate off each other.</p>

<p>Charged staff consumes power charges when used to make your attacks shoot out lightning. Most builds use combat frenzy to generate frenzy charges, and the resonance keystone to turn them into power charges.</p>

<p>Look up a standard ice strike/tempest flurry build, the setup is explained better there. I reccomend maxroll.gg</p>
</label>
