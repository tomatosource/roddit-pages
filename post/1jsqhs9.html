

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/5f3fooztq6te1.jpeg"><p>That didn&rsquo;t age well :D</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/5f3fooztq6te1.jpeg" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="mloi1g3" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">

        <div>1 | an hour ago </div>
      </div>
      <label for="mloi1g3" class="commentText"><p>Have you played launch? This is way better lol. There&rsquo;s actual loot, and the game is way easier.</p>
</label>

  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">

    <div class="comment">
      <div class="commentHeader">

</label>

  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="mlojebh" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>SlyAguara</div>
        <div>1 | 33 minutes ago </div>
      </div>
      <label for="mlojebh" class="commentText"><p>How is it bait? On launch i made it to level 50 while wearing 1 rare item, the rest of my stuff was blue. I had a white ring. That&rsquo;s what the loot was, vendors didn&rsquo;t have anything useful yet. Game difficulty wise that was much more substantial than mostly endgame skill changes.</p>

<p>Outside of some heavily nerfed outliers like minions early game skill power (what most people have experienced) isn&rsquo;t really different to what people have now. Nerfs were mostly applied to later stages, and acts 1-2 were already taking people 10 hours on launch.</p>

<p>People were just excited for the new thing when the game launched, but it was worse. If you repeated that launch now, with no changes, people would hate it even more.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="mlokmqp" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Asinine_</div>
        <div>1 | 21 minutes ago </div>
      </div>
      <label for="mlokmqp" class="commentText"><p>1 rare item at 50 sounds like you didnt use vendor at all, probably wasted all your orbs and also got insanely unlucky. I played launch, and if you checked the vendors on each level (esp if you checked vendor from previous acts), you could definetely find good upgrades in there. I was stuck using a weapon 10lvls lower than mine with some mid modifiers, but had good rare ring/neck, chest, and helm.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="mlom8no" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>SlyAguara</div>
        <div>1 | 5 minutes ago </div>
      </div>
      <label for="mlom8no" class="commentText"><p>You sure you didn&rsquo;t play after the loot fix? It happened relatively early, day or two into it. A lot of people around me had the same experience, I was not exceptionally unlucky. I was checking vendor at each level (actually vendors, going back to previous acts). Orbs didn&rsquo;t really exist outside of what you could disenchant for. My only rare came from a regal I got from disenchanting rares that were worse than my blues/for other classes.</p>
</label>
    </div>
  </label>
  
</div>

        <div>lasereule</div>

      </div>

  </body>
</html>
