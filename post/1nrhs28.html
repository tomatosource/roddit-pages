<div class="commentAndChildren">
  <input id="ngej122" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>deebo_samuel</div>
        <div>1 | 3 hours ago </div>
      </div>
      <label for="ngej122" class="commentText"><p>I&rsquo;m playing fire bloodmage with pretty high end gear and figured out how I could craft the perfect ring, with a bit of currency. Process.</p>

<ol>
<li><p>Buy/loot magic ring with +25% rarity on both suffix and prefix, mine cost 4D</p></li>

<li><p>Make rare, I used greater essence of ruin but honestly you could use anything.</p></li>

<li><p>Desecrate with suffix omen, ulaman omen and abyssal echoes omen, don’t unveil.</p></li>

<li><p>Fracture, you want suffix rarity – if you hit whatever you added with essence then its bricked. I hit prefix rarity and carried on, if you hit suffix rarity its best for rerolling mods later but prefix is fine.</p></li>

<li><p>Annul, its 1 in 2, you want to hit whatever mod you added when you made it rare. It’s a yolo. If you hit then the rest of the craft is just how much you are willing to dump into it really.</p></li>

<li><p>Unveil your desecrate and you want to hit increased skill speed.</p></li>

<li><p>Perfect Exalt with Homogenizing Omen and Suffix exalt omen to hit T1 cast speed.</p></li>

<li><p>Omen of light + annul.</p></li>

<li><p>Desecrate with suffix omen and abyssal echoes omen. You want chaos resistance. This is not guaranteed so you may need to reroll this a few times with omen of light / annul. This took me 6 attempts so its not cheap!</p></li>

<li><p>Perfect Exalt with Homogenizing Omen to hit T3-&amp;gt;T1 chaos damage.</p></li>

<li><p>Omen of light + annul.</p></li>

<li><p>The last mod  is up to you really, I chose mixed fire/chaos res via desecrate but you could pump loads of currency into it aiming for something specific.</p></li>

<li><p>To finish off the craft I divined it a couple of times with omen of the blessed to max out my implicit, then added fire quality as my resists were struggling. You could use caster quality here for more damage, especially if you crafted on a pearl ring.</p></li>
</ol>
</label>
