<div class="commentAndChildren">
  <input id="oetio9p" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>oldglassofmilk</div>
        <div>7 | 20 hours ago </div>
      </div>
      <label for="oetio9p" class="commentText"><p>Ideally you fracture the spirit/mana hybrid, it&rsquo;s Ilvl 70 to protect it while whittleing</p>

<p>Pure spirit is safe (Ilvl 82)</p>

<p>If you hit the hybrid you will suffix desecrate and light til high tier mana regen to block it from the mod pool</p>

<p>Then whittle til increased damage to ally prefix and 2 good suffix mods</p>

<p>Finally light omen the mana regen til you get good final mod</p>

<p>Idk if this is the best way, but that&rsquo;s what I would do for a perfect scepter craft, tho idk if you wanna invest that much into non exceptional base</p>

<p>There is no cheap way to go from here, bulk crafting a bunch of em at a time would be better for budget, so better sell it if you won&rsquo;t finish it</p>
</label>

  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="oewkqud" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>IamJashin</div>
        <div>1 | 11 hours ago </div>
      </div>
      <label for="oewkqud" class="commentText"><p>You don&rsquo;t fracture Spirit Hybrid =&amp;gt; that kind of fracture gives you nothing and with sceptre crafting it suffixes that are problematic not prefixes (prefixes are expensive but deterministic).</p>

<p>There is a mirror tier craft school and normal craft school.</p>

<p>For normal craft you are looking for <strong>MAGIC (blue) T2 Increased Spirit Base with +4 Minions.</strong><br>
You slam greater essence of command on top of it for T3 Allies Dmg. You desecrate a prefix and slam two perfect exalts onto suffixes (this is pure gamble). Than with reroll omen you reveal prefix in the well of souls looking for a decent tier of hybrid (you kind of hope for 180 total spirit).</p>

<p>For Mirror Tier crafting you want to establish first what kind of suffixes do you actually want.</p>

<p>Your Prefixes are always going to be:<br>
T1 Spirit<br>
T1 Allies Dmg<br>
T1 Hybrid Spirit</p>

<p>Suffixes<br>
T1 +4 Minions<br>
??<br>
??</p>

<p>The problem with suffixes is that T1 Mana Regeneration T1 Minion Life and T1 Elemental Resistances are of higher level than +4 (and unless you play infernal legion build you don&rsquo;t really want minion life) - which means if you roll onto them while whittling they will usually jeopardize your suffixes as they cannot be rerolled with a whittle.</p>

<p>The general idea is: If your two remaining prefixes are of a common tier (weighted at least <sup>800</sup>&frasl;<sub>1000</sub>) you should fracture either T1 Spirit or T1 Allies Damage.</p>

<p>If you want Critical Chance than you can fracture either T1 Spirit T</p>
</label>

      <label for="oewms76" class="commentText"><p>That&rsquo;s all true if you go from 0 but at the point where op Is fractured t1 spirit % does nothing (unless you plan to chaos spam for good suffix)  BC you can&rsquo;t whittle it off, while hybrid is protected later, I agree suffix is better to fracture but hitting anything on the scepter here is a bit unrealistic either way</p>
</label>

<p>The sad truth about the sceptres for minions is that either you are crafting mirror tier or you have to start with +4 &amp; Spirit.</p>

      <label for="oev39t2" class="commentText"><p>Honestly, whittles should be avoided til final 1-2 mods on any item, otherwise you are just sinking silly amounts of currency into an item this league.
Is this sceptre 2 socket? If yes, desecrate suffix, reveal with echo, if not minion levels, essence suffix with perfect essence that applies to sceptre, essence suffix essence of the abyss, fill up prefixes, regular jawbone, reveal with echo, repeat til you get minion levels, then slam and decide how you want to continue.</p>

<p>I&rsquo;ve been very lazy in crafting sceptres, fracture t1 spirit on a ilvl 82 2 socket base, chaos spam for either +4 minion or t1 spirit hybrid, fill all mods, if no desired mod (+4 or hybrid) jawbone prefix/suffix, check with echo. The moment I have t1 hybrid I consider it basically done regardless of desecration either way. Once I&rsquo;m that far I corrupt, if not spirit I double corrupt. Anything that survives gets dual or triple abbit idol. Big wins are third socket + spirit corrupt &amp;gt;16 (those are 250 spirit) or 2 sockets + &amp;gt;24 spirit, everything else is nice but not spectacular. Sold several 240+ spirit amulets for many thousand divines.</p>
