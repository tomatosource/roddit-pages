

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>

      <label for="mvae1km" class="commentText"><p>Noone knows for a fact, but the general assumption is that (as it were in 0.1) waystone% is the only thing that affects it, we just have access to less of it compared to 0.1</p>

<p>I&rsquo;d love to know if it&rsquo;s additive or multiplicative in any way with the %waystone from boss that can be found in either the boss atlas or on the boss tablets since the numbers - at least on the tablets - are lower than regular irradiated tablets.</p>

<p>You can get waystone% :<br>
- On the map itself, coming from suffixes.<br>
- On the atlas tree as regular nodes<br>
- On the atlas tree through explicit % increase<br>
- On tablets<br>
- On the atlas tree by increasing the effect of tablets<br>
- On the boss atlas tree you can get a couple 4% boss waystone which may behave differently.<br>
- On the atlas tree through the Unstable Energy keystone which will act as a multiplier on top of the explicit% you can already get<br>
- On the map after applying Envy emotions (30% per)</p>

<p>That&rsquo;s a total of :<br>
- 21% explicit INCREASED<br>
- 3% explicit per tower INCREASED<br>
- 2% explicit per map mod (this may or may not count distilled emotions, not sure yet) INCREASED<br>
up to 20% per tablet, scaled up to 26% with all the tablet % effect, which may be scaled up to 52% if you&rsquo;re lucky (20% of the time) Important note since tablet% are calculated on each tablet individually, creating breakpoints for which tablet% gets scaled up by how much.<br>
- The %explicit increased will in fact multiply whatever you get from distilled emotions, hence why the number of different emotions may count in the Grueling Journey notable.<br>
- 8% from the boss atlas tree (increased or &ldquo;more&rdquo;, since the modifier reads differently, it may be a multiplier)<br>
- 25% MORE from the keystone<br>
- 3x30% from Envy emotions (this will get scaled by explicit%)<br>
- and finally a raw 32% from the atlas itself</p>
</label>
