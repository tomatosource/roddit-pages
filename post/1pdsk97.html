    <style>
       * {

*,

  box-sizing: border-box;
}

html {

}

body {

  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;

  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;

blockquote {

.postLink {

}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;

}

.commentList {

  flex-direction: column;
  width: 100%;
  padding-left: 32px;

body > .commentList {

}

.commentAndChildren {

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;

  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

      <label for="ns7gl2b" class="commentText"><p>I started HC SSF around 100 hours ago with almost all classes to check, and im gonna go contrarian but i think Warrior is great choice BUT i say dont look what is best/meta just pick the archetype you love the most bcs there are 100s of hours before you and in PoE everything can work. If u chceck ninja poe 2 in top 10 SSFHC there are at least 6-7 ascendancies and almost all the rest suit to follow. Keep in mind that this patch might shake meta. But goin back to the warrior, i did around 10-12 playthrus on warriors (bcs of deaths) and i now have 100 easier and better times on that class. I get to know class much better, what is best in which parts of campaign, what to craft and when, how much of defense i need to finish which Acts and do it quickly, my last 4 warrior went to maps and died there on things i didnt managed to experience before, but as i tried almost all avaiable builds i now have great blueprint how to be succesfull with warrior. And even in this ES meta warrior can be incredibly tanky, with block, armor stack, armor applying to elemental and different ascendancies warrior can really facetank a lot of shit, and ES have great one hits but warrior can really go toe to toe with mobs. I suggest u make decision only after today&rsquo;s stream. But my advise will be always pick coolest class, with best lookin skills and suiting your personality, i always play bulky melee str classes soo i wait for druid/templar/axestrsecond warrior/duelist. I hope i somehow helped. Cheers</p>
