

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/7ieegkw9zlze1.jpeg"><p>Weapon set skill points?</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/7ieegkw9zlze1.jpeg" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="mrareu7" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Calcifern0</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="mrareu7" class="commentText"><p>They are so you can have different passives, depending on the weapon you&rsquo;re holding.
So when you asign a skill to a particular weapon set you can multi spec your character.
For example, my crossbow is in my off hand with points into just totems.
Then my spear is obviously spear damage and lightning damage.
The totems snapshot from when they are summoned. So you can double your damage and usefulness.
Depending what&rsquo;s on the path of your main points.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="mrarrlh" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>One-Note-9362</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="mrarrlh" class="commentText"><p>in theory, you use your (entire) passive point capacity to invest into a cluster so as to not have to invest points into both trees</p>

<p>example. if you have a dagger in your first and quarterstaff as your secondary weapon swap, you’d use ws1 for the dagger cluster and ws2 for quarterstaff cluster, or if you use a chaos wand and a lightning wand, you’d invest ws1 into chaos clusters and ws2 into lightning clusters</p>

<p>10 weapon set points mean you can use 10 <em>unused</em> passive points to invest into weapon set 1 (your chaos wand or dagger) and 2 (your quarterstaff or lightning wand)</p>

<p>it’s super niche and not that useful compared to just sticking with 1 weapon/build</p>

<p>on keyboard&amp;mouse you just click the arrows next to the “weapon set”, no idea how to do it on controller</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">

      <div class="commentHeader">
        <div>AskMeWhyIFish</div>
        <div>1 | 17 minutes ago </div>
      </div>
      <label for="mraztvt" class="commentText"><p>God I suck at this game. The only time I&rsquo;ve double-weaponed with my monk was a a quarterstaff with a wand that had power siphon so I could get power charges from across the screen. It wasn&rsquo;t all that useful&hellip;</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

  <input id="mrayvrw" type="checkbox" checked/>

      <div class="commentHeader">
        <div>jaymo_busch</div>

      </div>
      <label for="mrayvrw" class="commentText"><p>Is the “Shapeshift” from the Demon Form thing? Or is bro playing Druid early</p>

    </div>
  </body>
</html>
