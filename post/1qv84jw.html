        <div>1 | 32 minutes ago </div>
      </div>
      <label for="o3h2pb8" class="commentText"><p>Long story short-250d is not enough for bow craft for top tier bow. Like others said, sell this base, or settle for T2s and possible dead suffix.</p>

<p>For a cheaper craft that maybe stays under 250d, it’s: 1) finish suffix NOW with essences; +3 skills and attack speed. Then 2) omen T1 accuracy with essence of abyss until you hit, cost roughly 20d. Then 3) exalt/sinistral annul for T1 phys or light, cost 55d/attempt. If you hit T2, you’ll have to waste an omen and find accuracy again, which is 90d.</p>

<p>So you only have 3-4 slams to hit with 250d budget. Weapons are very expensive to craft. I did a similar spear for 1500d to hit all T1’s, sold for 4000d.</p>
</label>

      <label for="o3fqfd5" class="commentText"><p>I mean, cheapest way right now to make a usable phys bow off it?</p>

<p>Slam a suffix, essence of abrasion with deztral crystallization so it eats the suffix.</p>

<p>Slam two suffix, essence of battle &amp; essence of haste. If lucky with more crit stat off the slam just essence of battle and pray. Still doing dextral crystals to ensure you don’t remove phys%.  Do both essences until you have both (second could remove first. If so just use first and hope it now removes the other. Lol)</p>

<p>Then slam a final prefix and pray for phys damage.</p>

<p>That’s kinda the only determinative way I know of to get something useful.</p>

<p>As far as getting +5 skill and phys% you’re kinda boned unless you go and start burning 100-1000+ div</p>

      <label for="o3fu9vf" class="commentText"><p>Well, first step, if you wanted to, is to max quality &amp; sockets.</p>

<p>It’s a pretty good base, with a good fracture.  I think the best fracture would be flat phys or + levels for a generic bow, but I’m not certain &amp; haven’t gotten into higher level crafting yet since I don’t have the budget.</p>

<p>This crit mod adds a lot of value to bows that are already at t1/t2 increased + high flat phys, decent + levels to attack/projectile skills, etc.</p>

<p>That being said to realistically create one of those bows it’s going to be most if not all of your budget, unless you get lucky.</p>

<p>Ideally you would have these mods on a magic base iirc since essences can be used to guarantee an ok rolled 3rd mod which can be cleared off with some more budget or luck.</p>

<p>I don’t have much budget so I would sell, but if you don’t need the currency or just want to craft it later, I’d stash it or put a stupid high price on it so you could still buy or craft something with the currency you get if you do sell.</p>
