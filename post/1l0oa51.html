

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/ik5so8ddfa4f1.png"><p>Can you guys help me list this at a fair price?</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/ik5so8ddfa4f1.png" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="mvepkab" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>neoh666x</div>
        <div>1 | 28 minutes ago </div>
      </div>
      <label for="mvepkab" class="commentText"><p>Just eyeballing this a div or two, <em>maybe</em>. And I&rsquo;m 100 percent positive someone in the comments will tell me this guess is trash.</p>

<p>To get an accurate price of an item, go to the trade site, essentially copy and paste the item mods into a search and compare your item with similar items and their listed prices.</p>

<p>A big hint, if you see an item similar to yours and it has been listed for more than a couple days it is priced too high! You are going to generally want to undercut all similar listings if you want to sell the item at a good pace.</p>

<p>Pay very close attention to the numbers of your mods and theirs.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="mveqwnb" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>xReaperedx</div>
        <div>1 | 19 minutes ago </div>
      </div>
      <label for="mveqwnb" class="commentText"><p>Stop checking for every stat. 5 Life per Enemy hit with attacks is shit and nobody cares about.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="mveq4o2" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>KDoTsV33T</div>
        <div>1 | 24 minutes ago </div>
      </div>
      <label for="mveq4o2" class="commentText"><p>I doubt this is gonna help you at all, but I have issues with items like this all the time… I think as far as the league has progressed already even dads like me have better gear than this so the willingness to buy something like that for more than a Div kinda falls off dramatically. I personally think those are great and the best way to make sure you know what you got is getting a third party tool like exile exchange (I think that’s what it’s called I’m a noob too) I use that all the time. Just pay attention to how long a certain item has been on market cuz that also speaks volumes. I hope this helps in some capacity man.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">

</label>

        <div>japhar</div>

      <label for="mvernpg" class="commentText"><p>I doubt you can even get 10D for that at that stage.</p>

  </label>

  </div>
  
</div>

        
      
        
          
<div class="commentAndChildren">

      <div class="commentHeader">
        <div>thechallenge23</div>

</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="mverr84" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Educational-Charge54</div>
        <div>1 | 14 minutes ago </div>
      </div>
      <label for="mverr84" class="commentText"><p>Not worth whitling.</p>

<p>Do a count filter and put 1 on it then put cold, fire and phys dmg on what would be their t9 range.</p>

<p>Put the attack speed, light dmg and rarity on an and filter. The other mods are kinda useless so i wouldnt really mind about them, life can be useful but its far from meta as the other ones so i would check for gear without them anyway</p>

<p>Also, in the filter put all the values on a slightly or rounded down number. Usually people looking to buy stuff write rounded numbers, and if the difference is low in the values between an item and another but they gonna save a couple divs, people usually prefer to save those divs. So your item is competing with others slightly inferiors but still in the same &ldquo;braket&rdquo;</p>
</label>

</div>

  </body>
</html>
