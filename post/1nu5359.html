

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/sn1mn3y0o8sf1.png"><p>Crafting help - Best way to get a spirit on this + 3 amulet</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/sn1mn3y0o8sf1.png" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="ngyn1j4" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Vulpix0r</div>
        <div>3 | 2 hours ago </div>
      </div>
      <label for="ngyn1j4" class="commentText"><p>Spirit has no tag so there&rsquo;s no real way to target it. Best to get a fractured spirit base to do this.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="ngymztz" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>PoGD1337</div>
        <div>5 | 2 hours ago </div>
      </div>
      <label for="ngymztz" class="commentText"><p>The easiest way is to <sup>1</sup>&frasl;<sub>3</sub> fracture +3proj and chaos till +spirit</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="ngyndg6" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Slowpre</div>
        <div>2 | 2 hours ago </div>
      </div>
      <label for="ngyndg6" class="commentText"><p>I feel like most of the amulet builds that go for +3 proj and spirit tend to start with a fracture of either of those mods. You might want to consider mark of abyssal lord/crystallization to desecrate one of the existing mods that’s not in the pool with +3 proj and try for a <sup>1</sup>&frasl;<sub>4</sub> fracture.  To take this a step further you could first yolo annul and hope it doesn’t hit the proj skills but it’s not guaranteed. That could bring your fracture odds to <sup>1</sup>&frasl;<sub>3</sub> assuming you use mark of abyssal lord. </p>

<p>There are quite a few YouTube vids of crafters that deterministically put on exactly the required mods you are looking for. </p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
