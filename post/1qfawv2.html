

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/817zgjweawdg1.png"><p>How much would this be worth? - New to the game</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/817zgjweawdg1.png" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="o038jt5" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Isallonda88 | Ice Shot Machine Gun</div>
        <div>3 | 2 hours ago </div>
      </div>
      <label for="o038jt5" class="commentText"><p>It depends if you play SC or HC.</p>

<p>Best to use an addon for trade. I used exiled exchange 2: <a href="https://kvan7.github.io/Exiled-Exchange-2/download" target="_blank">https://kvan7.github.io/Exiled-Exchange-2/download</a></p>

<p>You put in your settings the right league you are playing and then with Strg + D on the item you see how much similar items are worth.</p>

<p>Just to the item: for the level a +4 is nice and crit to as you play physical spells with crit. Cast speed is good too. The spell dmg is a bit low.</p>

<p>When you go with alt over the item you see tier lists of each stat. T1 is the best and the higher the number here the lower the tier.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="o03bw5z" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>miloicesedap</div>
        <div>1 | 2 hours ago </div>
      </div>
      <label for="o03bw5z" class="commentText"><p>feels like a good early mapping gear to me. something you&rsquo;d use on earlier tiers then save up some currencies to get better gear.</p>

<p>i&rsquo;d reckon may sell for a couple of exalts, 20-ish i&rsquo;d feel</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="o03dj1t" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>ApatheticSkyentist</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="o03dj1t" class="commentText"><p>The +4 really needs to be higher for it to compete with high end staves.</p>

<p>That being this is a stellar weapon right up until you buy or craft something higher end.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="o03fr3w" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>DIEDPOOL</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="o03fr3w" class="commentText"><p>you can get +5 all spells with essence, so the desecration isn&rsquo;t actually good</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
