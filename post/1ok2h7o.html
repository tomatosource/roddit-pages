      <label for="nm7eoib" class="commentText"><p>From Chris Forsberg:</p>

<p>The weather in New England is turning cold and raw. Days are getting shorter. You might soon feel the urge to rearrange your shed and rotate the winter equipment toward the front.</p>

<p>But let’s be very clear: It’s most definitely Lawn Mower season in Boston.</p>

<p>Newcomer Josh Minott, the man who <a href="https://www.nbcsportsboston.com/nba/boston-celtics/josh-minott-energy-nickname-lawn-mower/718082/" target="_blank">inadvertently nicknamed himself after a grass trimmer</a> while trying to describe his relentless energy early in his NBA career, has lived up to his self hype since joining the Celtics. Jaylen Brown may lay claim as the Energy Shifter on the Celtics’ roster, but Boston has undeniably kicked into a different gear since Minott elevated to the starting lineup two games ago.</p>

<p>On Wednesday night, in a showdown against an Eastern Conference favorite in the Cleveland Cavaliers, Minott didn’t just produce a double-double while pulling down a career-high 15 rebounds to go along with his 11 points. He also played some inspired defense against Evan Mobley to <a href="https://www.nbcsportsboston.com/nba/boston-celtics/live-updates-cavaliers-td-garden/743125/" target="_blank">fuel the Celtics to a 125-105 triumph at TD Garden</a>.</p>

<p>In two starts &ndash; both of Boston’s wins this season &ndash; Minott is averaging 13 points on 55.6 percent shooting to go along with 12.0 rebounds, two steals, and one block over 30.5 minutes per game. The Celtics are a +50 in his time on the floor in those two wins.</p>

<p>Dispatched to hound Mobley against the Cavaliers, Minott showed the reigning Defensive Player of the Year he can defend a bit, too.</p>

<p>NBA tracking data suggested that Minott limited Mobley to 1 point on 0-for-6 shooting. The Cavaliers as a whole generated just 4 points on 1-of-12 shooting when Minott was deemed the primary defender.</p>

<p><a href="https://www.nbcsportsboston.com/nba/boston-celtics/josh-minott-nickname-impact-starting-lineup/743284/" target="_blank">Read more here</a>.</p>
