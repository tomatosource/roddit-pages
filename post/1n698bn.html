       * {
  margin: 0;
  padding: 0;
  text-indent: 0;

*,

}

}

h2 {

}

input[type="checkbox"] {

blockquote {
  border-left: 10px solid #ccc;

}

.subName {

}

.postList {
  display: flex;

}

.post {

}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {

}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

<div class="commentAndChildren">

      </div>
      <label for="nbyezra" class="commentText"><p>My build:</p>

<p><a href="https://maxroll.gg/poe2/planner/pbyyu0gx" target="_blank">https://maxroll.gg/poe2/planner/pbyyu0gx</a></p>

<p>DISCLAIMER: You <em>need</em> Thunderfist to get the gameplay showcased in the video, and it&rsquo;s a very expensive item (I bought mine for 9 divs). How the build works is Siphoning Strike dashes toward the target and causes an AoE explosion if the enemy is shocked, and the Crackling Palm skill from Thunderfist is our main way of applying Shock without relying on pressing another button. The build is still playable without Thunderfist but you need to dodge roll into enemies with the Wake of Destruction boots, so it&rsquo;s a lot slower until you get it.</p>

<p>Tips for the build:</p>

<ul>
<li><p>Start as Ritualist and path towards the Monk start area and then Hollow Palm. Hollow Palm is really OP so grab it as early as possible (I think I got it at around lvl 25).</p></li>

<li><p>Lightning penetration, attack speed, damage, crit chance/crit dmg on the tree are great for increasing your DPS. Focus mainly on energy shield for defense, evasion and deflection are good later but bad during the campaign.</p></li>

<li><p>Ritualist is great because you get increased flat damage + item rarity from your rings. Get as much flat damage on your rings/gloves and evasion+energy shield on your gear as possible to increase your damage. Evasion on your gear offers more damage but Energy Shield is better defensively, so I did about a 40% evasion 60% energy shield gear ratio.</p></li>

<li><p>Before Wake of Destruction I used three main skills: Storm Wave to apply shock, Siphoning Strike as main DPS, and Falling Thunder to make use of the power charges that Siphoning generates. After you get a way to apply shocked ground like Wake of Destruction you can remove Storm Wave. Link your damage skills with anything that increases lightning penetration/lightning damage/elemental attack damage.</p></li>

<li><p>Use your Spirit on Blasphemy + (Ele Weakness or Temp Chains), Ghost Shroud, and Wind Dancer. Herald of Thunder is nice for clear later when you get a necklace with +Spirit.</p></li>

<li><p>Early on you need to kite because you are very squishy. I did Frozen Locus+Glacial Cascade in act 1.</p></li>
</ul>
</label>
