

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://www.reddit.com/r/PathOfExile2/comments/1mvjicm/i_wish_they_remove_spell_level_on_weapons_in_03/"><p>I wish they remove +spell level on weapons in 0.3</p>
</a>
    </h2>

    
    <div class="selfPostContainer">
      <p>Unless weapon has +level to X spells it is complete garbage in most of the cases.</p>

    </div>
    

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="n9qjd4q" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Acrobatic-Manager726</div>
        <div>1 | 4 minutes ago </div>
      </div>
      <label for="n9qjd4q" class="commentText"><p>In poe 1 the extra level was not that impactfull, but on poe2 you want it on every slot<br>
It feels bad</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="n9qjhut" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Bezi2598</div>
        <div>1 | 3 minutes ago </div>
      </div>
      <label for="n9qjhut" class="commentText"><p>Spell level is fine, they just need to find add alternative ways to scale spells. This is a problem for all weapons honestly, they all stack the same stats. There needs to be more variety in what mods you want on your gear.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="n9qjs88" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>ApprehensiveWorry393</div>
        <div>1 | 2 minutes ago </div>
      </div>
      <label for="n9qjs88" class="commentText"><p>By this logic we should remove every other thing as you will be looking for the next best thing anyways.</p>

<p>For instance for a bow if you dont have extra physical damage percentage it is going to be the next complete garbage, should we remove those mods too?</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
