

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>

    <h2>
      <a class="postTitle" href="https://i.redd.it/z9dv1owkm7sf1.jpeg"><p>How do I finish this quiver</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/z9dv1owkm7sf1.jpeg" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="ngy8xji" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>shenaniganizer1776</div>
        <div>1 | 32 minutes ago </div>
      </div>
      <label for="ngy8xji" class="commentText"><p>Omen of light
Desecrate+prefix omen block accuracy
 homo + double exaltation
 Greater exalt for a flat damage and then a <sup>50</sup>&frasl;<sub>50</sub> for crit chance/crit damage
Omen of light
Desecrate roll for flat damage</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="ngy9zxi" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>LeonTheTaken</div>
        <div>1 | 23 minutes ago </div>
      </div>
      <label for="ngy9zxi" class="commentText"><p>You already got speed, attack tags on your prefix, now if you homo + pefect + dextral exaltation slam on suffix, it might be crit damage or crit chance, that&rsquo;s <sup>50</sup>&frasl;<sub>50</sub>. Flat damage can be fished by doing omen of light + annul, but that might be costly.</p>

<p>Also you want increased damage with bow skills. You can get that by using essence of hysteria, but since all 4 of your tags is useful and none is fractured, it&rsquo;s kinda risky. You can try to homo + perfect slam, but the chance might be <sup>1</sup>&frasl;<sub>4</sub> since there is already adds phys damage which has damage tag, so not a great way either.</p>

<p>So you can try to fracture one of the tags, best case scenario: 1. you hit projectile speed and use sinistral crystalization + hysteria to trade abyssal modifier for increased damage with bow skills or 2. you hit +2 level of all projectile skills, dextral crystalization + hysteria to trade attack speed for increased damage with bow skills. I think 2 is better, which gives you one more chance to hit critc chance since the chance will be <sup>1</sup>&frasl;<sub>3</sub> to hit with homo + pefect + dextral + greater exaltation slam on suffix, but I don&rsquo;t know if you want attack speed or not. The outcom will likely pick 2 modifers from attack speed, crit chance and crit damage.</p>

<p>Personally I&rsquo;d buy a visceral quiver with T1 lightning damage and try to fracture T1 lightning and chaos spam to get +2 level proj skills, the chaos chance is 0.4%, which is better than fracture +2 and get T1 lightning, which is 0.3%.</p>

<p>After fracture and chaos spam, we have 2 open prefix and 2 open suffix, just add one random prefix with sinistral exaltation + exalt, and use hysteria + sinistral crystalization to get T2 increased damage with bow skills. Now we have 1 open prefix + 2 open suffix.</p>

<p>Then homo + pefect + dextral + greater exaltation slam on suffix, suffix will be picked from attack speed + crit chance + crit damage. Now we only have 1 open prefix.</p>

<p>I&rsquo;d then go ancient jawbone + omen of abyssal echo to fish for increased projectile speed. Now the quiver is done.</p>
</label>
    </div>
  </label>

      <label for="ngya7sm" class="commentText"><p>That&rsquo;s assuming you are crafting a quiver for LA, so lightning flat is better, if not, buy T1 phys flat instead.</p>
