      </div>
      <label for="nq5l2jq" class="commentText"><p>Might seem weird to post this of all plays, but I&rsquo;ve got two good reasons for this.</p>

<p>A. I spent half an hour making this clip (and most of the effort was from just trying to download the clip and shorten it down).</p>

<p>B. This is probably one of my favorite hidden gem playoff moments, and probably my favorite moment overall from the 2014 Giants run. There are so many interesting aspects to this play:</p>

<p>-With a 2-run lead through 8 <sup>1</sup>&frasl;<sub>2</sub> innings, the Giants needed to score to keep Bumgarner in the game. And with runners at 1st and 2nd, and probably the least suspecting hitter in the Giants lineup at the plate and the nearly unhittable Wade Davis on the mound, Juan Pérez hits a deep line drive into left center, barely missing a 3-run homer, and scoring both runners to add on some insurance. As a result, this all but solidified a masterpiece from Madbum, going the distance with a shutout.</p>

<p>-The crowd went from hopeful that it was gonna fly out, to slightly nervous that it didn&rsquo;t, and then absolutely elated when Pence scored on the errant throw home. They knew how clutch that hit was.</p>

<p>-And this was the same night Oscar Taveras lost his life in a car crash in the Dominican Republic, and Pérez was good friends with him. So this play was not only insanely pivotal, but an extremely unexpected tribute to his lost friend.</p>

<p>Just a cinematic play overall.</p>
</label>
