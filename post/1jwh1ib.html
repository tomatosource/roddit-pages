

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://www.reddit.com/r/PathOfExile2/comments/1jwh1ib/portals_disappearing_maps/"><p>Portals disappearing - maps</p>
</a>
    </h2>

    
    <div class="selfPostContainer">
      <p>Since the new update, if you warp anywhere, all the portals for the maps disappearing, do not warp out. I just wasted 2 high rarity waystones…</p>

    </div>
    

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="mmiccrp" type="checkbox" checked/>
    <div class="comment">

        <div>Argonanth</div>
        <div>8 | 6 hours ago </div>
      </div>
      <label for="mmiccrp" class="commentText"><p>This is happening to me during the campaign. If I try to portal out of an area to sell stuff or check the shop my portal often just disappears a after I talk to the vendors.</p>

<p>EDIT: I&rsquo;m pretty sure it&rsquo;s the vendors, just putting items in stash is fine. As soon as I talk to Servi in Act3 the portal closes.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="mmic05j" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>ResidentAttitude6775</div>
        <div>6 | 6 hours ago </div>
      </div>
      <label for="mmic05j" class="commentText"><p>Same for me.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">

      <div class="commentHeader">
        <div>iamishbu</div>
        <div>1 | 2 hours ago </div>
      </div>
      <label for="mmiyvu5" class="commentText"><p>Happened to me too. What are you suggesting triggers it? Using a waypoint in the map then going back to hideout?</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="mmj0r6s" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>NotCoolFool</div>
        <div>1 | 2 hours ago </div>
      </div>
      <label for="mmj0r6s" class="commentText"><p>Dang I noticed this last night when portaging out to try and trade in campaign, thought I’d done something wrong.</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
