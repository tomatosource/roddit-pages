

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/1xfghja7mbah1.jpeg"><p>So I just picked this up, how do I not mess it up?</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/1xfghja7mbah1.jpeg" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="oumans6" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>S6hundred</div>
        <div>1 | 6 minutes ago </div>
      </div>
      <label for="oumans6" class="commentText"><p>There&rsquo;s some targeted crafting videos on yt. </p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="oumb0gf" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Scoelscoult</div>
        <div>1 | 4 minutes ago </div>
      </div>
      <label for="oumb0gf" class="commentText"><p>I would essence crit chance, then desecrate prefix and go for a fracture. Ideally fracturing spell damage in this case.</p>

<p>If you fracture spell skills you could sell it, or spend a bunch of currency getting t1 crit chance.</p>

<p>After fracture you would astrids creativity in a rune socket-&amp;gt; sinistral crystallization transcendent alloy, ideally removing the desecration, which would be guaranteed if spell dmg fractures. That finishes your suffixes. Then unveil mana on prefix, perfect exalt for last prefix, omen of light and redesecrate for a gain as mod.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="oumb8w9" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>--Shake--</div>
        <div>1 | 3 minutes ago </div>
      </div>
      <label for="oumb8w9" class="commentText"><p>Sell the base as is</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="oumbc5p" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Cyknis</div>
        <div>1 | 2 minutes ago </div>
      </div>
      <label for="oumbc5p" class="commentText"><p>Make sure you don’t sell it for exalts</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
