      <label for="ogctqi2" class="commentText"><p>From Chris Forsberg:</p>

<p>The 2025-26 NBA regular season is in the rearview mirror, and the Boston Celtics outkicked most outsider expectations as part of their 56-win season.</p>

<p>With a long ramp to Sunday’s Game 1 of a first-round series, it felt like a good time to both revisit our seven bold preseason predictions and deliver a fresh batch of seven predictions for the postseason trek ahead.</p>

<p>&hellip; These aren’t just predictions; these are also probably needs to happen for Boston to have a long and prosperous run. Check some of these boxes and the Celtics might just be back on the Finals stage.</p>

<p><strong>1. Baylor Scheierman’s defense becomes vital.</strong></p>

<p>Scheierman’s tongue-waging, mullet-flowing scoring outburst in the regular-season finale against Orlando was highly entertaining. But while knocking down open looks will be important in the postseason, Scheierman’s biggest impact will be his defensive versatility. </p>

<p>If higher seeds were to win out in the play-in game and beyond, the Celtics would see many of the All-Stars they have confidently assigned Scheierman to defend this season. Some of his biggest matchup time totals this season have come against Tyrese Maxey and Cade Cunningham, with Jalen Brunson not far behind. And Scheierman has made them work for their points.</p>

<p>Scheierman contested 20 shots per 100 possessions during his floor time this season (80th percentile at his position) and held opponents to 1.1 percent below expected output. He’s a relentless rebounder on both ends of the floor and has a knack for drawing offensive fouls.</p>

<p>Perhaps even more important, he can defend without fouling, committing infractions on just 8.4 percent of his contested shots (81st percentile for his position).</p>

<p>Scheierman is becoming Derrick White-like at breaking up odd-man rushes in transition and simply making good things happen defensively. His basketball IQ has been on full display this season and him being in all the right spots is a big reason that he earned Joe Mazzulla’s trust.</p>
