

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/0vynbqcg90bg1.png"><p>I just crafted this talisman in SSF and I love that I was able to do it</p>
</a>
    </h2>

    
	<div class="selfPostContainer">

	</div>

<div class="commentAndChildren">

  </label>
  
</div>

<p>Nice weapon tho, gl on the light omens</p>
</label>
    </div>
  </label>
  
</div>

        <div>1 | 13 minutes ago </div>
      </div>
      <label for="nxbzmcm" class="commentText"><blockquote>
<p>Now to just get my hands on some omen of light</p>
</blockquote>

<p>remember they are most likely to drop (or only drop) from amanamu rares when you lure them outside of their black cloud and then kill them. that&rsquo;s how i got all of mine. currently found five of them at lvl 98 SSF. they are very rare but if you do this on every amanamu&rsquo;s void rare mob you will get one eventually.</p>

    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nxc0gaa" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>stuffbud</div>
        <div>1 | 9 minutes ago </div>
      </div>
      <label for="nxc0gaa" class="commentText"><p>I thought recombinating never worked? Is there anything that gives you higher percentage chance of it going through? Would love to know how to craft a good crossbow in SSF</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nxbuu5j" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>ImpiusEst</div>
        <div>1 | 37 minutes ago </div>
      </div>
      <label for="nxbuu5j" class="commentText"><p>Yeah, SSF has the perfect level of progression right now.</p>

<p>In 0.2 I was using a ilvl56 focus until the end because I never got a better +2Focus. This season I can target farm most things for crafting so upgrades are somewhat regular. Ribs, essences, Omens. I love it.</p>

    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
