

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/vkk3kme28rjg1.jpeg"><p>Tiara Changing DPS Stats?</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/vkk3kme28rjg1.jpeg" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="o5lryw0" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>stonedjackson110</div>
        <div>2 | 7 hours ago </div>
      </div>
      <label for="o5lryw0" class="commentText"><p>Due to accuracy</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="o5lsp9k" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>FearYmir</div>
        <div>2 | 7 hours ago </div>
      </div>
      <label for="o5lsp9k" class="commentText"><p>Sometimes you need to hit the Well to get an accurate number. Although I have heard that the dps number does not necessarily indicate which is better</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="o5ltq9w" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>PlaneWeek1855</div>
        <div>2 | 7 hours ago </div>
      </div>
      <label for="o5ltq9w" class="commentText"><p>Thank you! Hitting the well just changed the DPS back to 293k+. I did not know that was a mechanic lol.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="o5m26ua" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>AdmiralUpboat</div>
        <div>2 | 6 hours ago </div>
      </div>
      <label for="o5m26ua" class="commentText"><p>The new tiara has a max life roll, your old one doesn&rsquo;t. You likely have some node somewhere in your tree that has increased damage when on full life. Which is why your DPS was fixed by hitting the well and topping off your HP.</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

    
  </div>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="o5ltrw1" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Akaigenesis</div>
        <div>2 | 7 hours ago </div>
      </div>
      <label for="o5ltrw1" class="commentText"><p>You probably have some passive nodes that require you to have full hp, when you change the helmet you gain 25 max hp and your passive deactivate until you fill your health</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="o5lwrsc" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>yepterrr</div>
        <div>1 | 7 hours ago </div>
      </div>
      <label for="o5lwrsc" class="commentText"><p>Killer instinct notable. Make sure youre at full hp before checking.</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
