    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
}

.selfPostContainer * {
  color: white;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>

      <a class="postTitle" href="https://youtube.com/watch?v=Hhar0jKsak8&amp;amp;si=sdXNTxghiuAhkX3W"><p>No Hit Sekhemas Run w/ The Desperate Alliance Relic</p>

<div class="commentAndChildren">

      <div class="commentHeader">
        <div>National_Example9295</div>
        <div>1 | 3 hours ago </div>
      </div>
      <label for="mcv5txn" class="commentText"><p>I practice no-hit runs while farming Time-Lost Diamonds in Softcore trade league and this was my 18th run. I never tried to farm sanctum in PoE1 but here I had to do it because I want to drop my own Temporalis eventually and fill my SSF Unique Tab (need Kalandra&rsquo;s as well, but one step at a time). People hate Sanctum that&rsquo;s why I was hesitant to try but my learning curve was quite steep as I do amateur speedruns in the game called &ldquo;Hades&rdquo;.</p>

<p>So basically this was test run and that&rsquo;s why I didn&rsquo;t use The Last Flame (for Temporalis) but had a desperate alliance jewel (for the time-lost diamond drop), which obviously makes the boss fight much harder than the Last Flame. Yet, I was very lucky with the last boss fight and stunned him milliseconds before hit me.  If it was the last flame it would be probably way easier at the end.</p>

<p>Build is my own craft, but it is basically STR/Life stacking Gemling w/ storm wave, nothing too special. Could be much easier with Sparkwave or a dedicated build, maybe QotF, but I wanted to farm with my own build.</p>

<p>Here is the link for full video: <a href="https://youtu.be/Hhar0jKsak8?si=1a94j9w-NapM3FiK" target="_blank">https://youtu.be/Hhar0jKsak8?si=1a94j9w-NapM3FiK</a></p>
