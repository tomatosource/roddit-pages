.post {

.postLink {

  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>

      <label for="nkdxly5" class="commentText"><p>For those wondering how this works: It’s Herald of Ice chaining with itself, by getting it to break armor and achieve high damage armor explosions. It’s not easy to set up because Herald of Ice innately does no physical damage.</p>

<p>Edit: To clarify you have to do enough physical damage to then be able to use some form of ‘gain extra damage as physical’ to get Herald of ice to fully break armor and then you also have to have armor explosion in turn freeze whatever it hits. I forget the exact physical damage threshold to make it work. Technically it can also be made to work with chaos damage but it’s more wonky and even more expensive.</p>

<p>I’ve seen a lot of people posting variations of this that didn’t actually understand the interaction and thought other Heralds were were contributing to it, etc. But they don’t. This can also be set up with Herald of Plague.</p>

<p>I was playing around on my Invoker Monk and set this up for fun but then specced back out of it because my normal build is much stronger.</p>

<p>That’s being said I wish they would bring back Heralds being able to chain with each other like they could in the initial beta release. That was a lot of fun.</p>
