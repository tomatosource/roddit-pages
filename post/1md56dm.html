

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/lnih87ne80gf1.png"><p>Will we get a Mageblood in PoE2 for permanently active charms?</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/lnih87ne80gf1.png" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="n5yu6v7" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>StalksYouEverywhere</div>
        <div>1 | 4 minutes ago </div>
      </div>
      <label for="n5yu6v7" class="commentText"><p>Despite what people often say, charms <strong>if they could be active all the time</strong> would be quite powerful.</p>

<p>The most powerful charm with a charm mageblood is probably Silver Charm since it makes you <strong>immune no temporal chains</strong> as &ldquo;your speed is unaffected by Slows&rdquo; which turns off temporal chains.</p>

<p>The 2nd most powerful charms are probably &ldquo;Cannot be stunned&rdquo; since currently the charm only activates after you get stunned and does not prevent the 1st stun, but a charm mageblood would keep it active permanently for <strong>full stun immunity</strong></p>

<p>Tied for 2nd would probably also be &ldquo;Immunity to Freeze&rdquo; from the thawing charm. We saw how powerful freeze immunity was with Dream Fragments in 0.1 and a permanentt freeze immunity would be nice.</p>

<p>After that I think 100% Immunity to Bleeding and Poison are incredibly powerful as they are one of the few damage types that are not &ldquo;Hits&rdquo;, they could perhaps even be tied for 2nd place.</p>

<p>Immunity to ignite and to shock would be alright, but probably only used in specific scenarios, for example permanent <strong>immunity to Ignite would allow you to do burning ground maps easily</strong></p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
