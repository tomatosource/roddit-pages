      <label for="o82p60p" class="commentText"><p><strong>Some improvements to help your comet COC sustain as it costs too much life:</strong><br>
- Remove the 2nd comet in COC, replace with Uhtred&rsquo;s Augury<br>
- If using Uhtred&rsquo;s Augury: use Comet, boundless energy II, spell cascade, augury, atalui&rsquo;s<br>
- Replace your Covenant with one that removes the base life mana cost mod (this is the mod that increases your life costs way too much) <strong>(Most important change imo)</strong><br>
- Go for a covenant that has life cost efficiency (most important, anything about 30% is sufficient and cheap)<br>
- Get rid of sacrificial blood, it adds too much life cost (when you get your updated covenant, you can add it back in, it currently adds 139 life to your comet costs)<br>
- Put snap/living bomb into COEA and add Harmonic II, arbiter&rsquo;s ignition, lifetap (this will auto generate your fire infusions for comet)</p>

<p><strong>Item recommendations:</strong><br>
- I highly recommend getting more mana, you need at least 3k+ if you want your build to feel &ldquo;good&rdquo;<br>
- stack as much mana as you can, the more, the better for your archmage damage output. Get mods that give % maximum mana on your rings and amulet.<br>
- When you change your covenant to a proper one, you can get more maximum mana mods on your gear.<br>
- swap to a frozen/stun/ignite charm this will help you survive much easier in maps/temple<br>
- Cap your resistances, including chaos, you are too squishy, 7k EHP is far too low to survive in majority of areas.<br>
- swap to a vertex (maybe 3 or 4 skills with some spirit, depending on your budget)<br>
- grab a time-lost-sapphire (crit damage/crit rate, maximum mana, large radius) and place it in the top right corner of your passive tree and allocate conduit, this will allow you to grab alot of powerful notables, this is a common strategy for spellcasters, very stat-efficient jewel slot/notable location)<br>
- work on getting 2 or 3 socket gloves with 60% socketed item effect, you can add cost efficiency here + cast speed (this will improve your comet sustain significantly aswell as add damage output)<br>
- heart of the well diamond with gain fire/light/cold + crit damage/rate + leech is instant (most important mod, this will help you leech much quicker in order to sustain comets at lower damage numbers)</p>

<p><strong>Some knowledge points:</strong></p>

<p>- Your damage output is also very low, so you don&rsquo;t start your COC triggers that quickly. I would highly recommend stacking more crit damage from the crit damage wheel, you don&rsquo;t need to be getting every node within a node cluster. Just enough to get the notable passives. Alot of wasteful passives.</p>

<p>- COC triggers require high crit AND high damage output. It is a misconception to stack crit only. As you use inevitable crit (ascendancy), this means you need to stack more damage in order to rapid trigger COC.</p>

<p>- Currently, your comet costs 1068 life, but you only have 1751 (meaning your second comet won&rsquo;t trigger because you don&rsquo;t have enough life to sustain both comets in a single trigger). This means you have to have insane life leech on your very first trigger of your spells in order to sustain the COC triggers rapidly. Which is unlikely if your damage output or cast speed isn&rsquo;t high enough.</p>

<p>I have 2 characters at level 100, with two fully built maxed temples. A bloodmage and a stormweaver both using COC/COEA comet triggers and I can farm 6-man juiced temples.</p>

<p>There&rsquo;s a misconception about rapid trigger COC that people think you only need 100% crit rate. That is false. My bloodmage only has 75% crit rate and she rains down comets like no tomorrow.<br>
Vice versa, my stormweaver doesn&rsquo;t even use COC, only COEA and she also rains down comets, probably even faster than my bloodmage lol.</p>

<p>Hopefully that helps!</p>
