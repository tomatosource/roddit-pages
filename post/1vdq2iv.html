      <label for="p1b0b9s" class="commentText"><p><strong>Ideal</strong>:
The best essences to use would be either of the expedition ones, the cast speed + gain as, or the spell level + mana hybrid prefix, since it blocks mana. But that would involve removing your prefix. In an ideal world youd have an astrids creativity and essence crit chance or cast speed -&amp;gt; remove prefix with spell skill essence + sinistral crystallization -&amp;gt; desecrate suffix and greater ex slam the rest. Probably hard to achieve in ssf. (The full ideal is crit essence, cast speed + gain as removed from prefix, desecrate prefix to block mana, slam other two prefixes, omen of light and redesecrate for not mana)</p>

<p><strong>SSF Reality</strong>:
If you can get your hands on a celestial alloy, then id greater/perfect regal -&amp;gt; sinistral crystallization celestial alloy (this will remove a prefix, but it also blocks mana so you should end up with 3 strong prefixes) -&amp;gt; id desecrate suffix unless you hit cast speed/crit chance from the regal -&amp;gt; greater/perfect ex the rest of the mods.</p>

<p><strong>Craft right now</strong>:
Take off painters gloves (and ring if its lightning to cold - so that your % inc lightning dmg will actually do good work for you), spell damage essence, desecrate prefix for gain as extra (ideally lightning, and with a reroll), gamba on suffixes. Swap rings to cast speed. I’d recommend breach, the wombgifts can be absurdly easy to get spell damage + cast speed on them.</p>

<p>I actually played lightning bolt as my st skill last league, it was fun and its decent.</p>

<p>I see you are using painter’s gloves, so % lightning damage isnt too great for you at the moment, spell damage will be much stronger. If you arent a low life build I wouldnt use execute 2. Deliberation or lightning mastery are better. Spell cascade is great for lightning bolt because on large hitbox enemies the lightning bolt will hit them multiple times.</p>

<p>If you do my above steps, then perhaps while farming ritual for a sinistral crystallization you can also pick up a maligaros, which would be great for you.</p>
</label>

      <label for="p1b4lo4" class="commentText"><p>I added a craft right now option which should be easier. Tbh going lightning to cold conversion is just a bad idea. Maybe a bit better defensively, but you lose two to four ascendancy points to regain your shock. And with lightning having such a wide range you really want to take advantage of lucky lightning rolls - which is more aspirational for you, but a good annoint gives 30%, and if you farm heart of the well that can give 15% i believe.</p>

<p>I wouldnt invest much in crit without farming maligaros, but swapping your gloves out for doedres should be pretty strong assuming you get high gain as extra on staff. The main thing about your conversion is just that since your new staff has lightning damage only, any conversion away from lightning is a massive loss. I’m not sure whether painters or call of the brotherhood takes priority on conversion. Its worth noting that gain as extra is never converted.</p>

<p>I hadnt heard of the spell cascade being changed, and it would make little sense for it to, as its not super easy make it hit the same enemy multiple times anyway.</p>
