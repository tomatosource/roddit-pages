

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/0th41pyb739g1.jpeg"><p>I just got a rite of passage charm of a t1 map.</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/0th41pyb739g1.jpeg" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="nvobt5v" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Kalistri</div>
        <div>4 | 6 hours ago </div>
      </div>
      <label for="nvobt5v" class="commentText"><p>If you&rsquo;re not going to use it I&rsquo;d say sell it and buy better gear. Generally, if you have better gear you can kill things quicker and get more stuff.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nvodfh3" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>privatedanger</div>
        <div>3 | 6 hours ago </div>
      </div>
      <label for="nvodfh3" class="commentText"><p>Don&rsquo;t hold divines, either sell item to upgrade gear, or hold it and use it.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nvovv6o" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>drsatan1</div>
        <div>2 | 3 hours ago </div>
      </div>
      <label for="nvovv6o" class="commentText"><p>Valuable items hold their value better than any currency item really, so if you&rsquo;re not sure just hold onto the item instead of selling it and sitting with 30 div for multiple days</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nvp9bvt" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Frangipane33</div>
        <div>1 | 12 minutes ago </div>
      </div>
      <label for="nvp9bvt" class="commentText"><p>Sell it, keep some divs for later and use some for your gear. Good rule of thumb is to set a limit at 1d per slot so you only spend ~10d total right now. It should get you to T15s</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
