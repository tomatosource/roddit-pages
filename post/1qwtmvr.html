

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/3syexll01qhg1.jpeg"><p>Help finishing quiver</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/3syexll01qhg1.jpeg" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="o3roctq" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>b1LLydabeast</div>
        <div>1 | 18 minutes ago </div>
      </div>
      <label for="o3roctq" class="commentText"><p>I wouldn&rsquo;t fracture this. The item is only going to be good for leveling, so I wouldn&rsquo;t bother since it&rsquo;s not worth it.</p>

<p>I would only think about fracturing if it had + 2 projectiles.</p>

<p>For now, I would Omen of greater exaltation + Greater/perfect exalt and call it a day.</p>

<p>If you really want to try fracturing, I would buy another base with +2 projectiles and another good suffix. Flat phys tends to be expensive. Around 7 to 12 divs per base.</p>

<p>Let&rsquo;s say, you buy a base with only +2 proj, you need 4 affix to be able to fracture. One tip, at 3 affix, you can desecrate for a 4th affix. Do not reveal it, the fracturing will then only affect the 3 affix since you can&rsquo;t fracture a hidden affix.</p>

<p>Continuing, you hit the +2 proj fracture, the best option is that you will need to orb of annulment until you have the fractured affix and 1 random affix. Then you chaos spam to try and hit flat phys or another affix in T1. You can desecrate either prefix or suffix depending on what you&rsquo;d like and then omen of greater exaltation + perfect exalt to try and hit good affixes. Still an expensive route.</p>

<p>I think the best way, would be buying multiple bases with +2 and try to craft the best one.</p>

<p>Remember, affix tier level is dependent on the item level. Example: you can only get T1 damage with bow skills if the item level is 81 or higher. You can check on path of crafting 2 for all item level and affixes. Hope this helps because, this helped me a lot.</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
