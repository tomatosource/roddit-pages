    <h2>
      <a class="postTitle" href="https://i.redd.it/3syexll01qhg1.jpeg"><p>Help finishing quiver</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/3syexll01qhg1.jpeg" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="o3roctq" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>b1LLydabeast</div>
        <div>2 | 4 hours ago </div>
      </div>
      <label for="o3roctq" class="commentText"><p>I wouldn&rsquo;t fracture this. The item is only going to be good for leveling, so I wouldn&rsquo;t bother since it&rsquo;s not worth it.</p>

<p>I would only think about fracturing if it had + 2 projectiles.</p>

<p>For now, I would Omen of greater exaltation + Greater/perfect exalt and call it a day.</p>

<p>If you really want to try fracturing, I would buy another base with +2 projectiles and another good suffix. Flat phys tends to be expensive. Around 7 to 12 divs per base.</p>

<p>Let&rsquo;s say, you buy a base with only +2 proj, you need 4 affix to be able to fracture. One tip, at 3 affix, you can desecrate for a 4th affix. Do not reveal it, the fracturing will then only affect the 3 affix since you can&rsquo;t fracture a hidden affix.</p>

<p>Continuing, you hit the +2 proj fracture, the best option is that you will need to orb of annulment until you have the fractured affix and 1 random affix. Then you chaos spam to try and hit flat phys or another affix in T1. You can desecrate either prefix or suffix depending on what you&rsquo;d like and then omen of greater exaltation + perfect exalt to try and hit good affixes. Still an expensive route.</p>

<p>I think the best way, would be buying multiple bases with +2 and try to craft the best one.</p>

<p>Remember, affix tier level is dependent on the item level. Example: you can only get T1 damage with bow skills if the item level is 81 or higher. You can check on path of crafting 2 for all item level and affixes. Hope this helps because, this helped me a lot.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="o3rs4er" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Taxachusetts</div>
        <div>2 | 3 hours ago </div>
      </div>
      <label for="o3rs4er" class="commentText"><p>This is a level 81 base, crit damage and bow damage are tier 1.  Do you feel it’s only good for leveling because of the lack of + projectiles?</p>

<p>I’ve been using Trans and Augs on all Visceral Quiver bases I’ve found, this has been the best result so far.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="o3rwvy7" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>b1LLydabeast</div>
        <div>2 | 3 hours ago </div>
      </div>
      <label for="o3rwvy7" class="commentText"><p>No sorry, I will take back what I&rsquo;ve said, it&rsquo;s a great craft. I just prefer having a +2 proj and feel that it&rsquo;s more worthy of a fracturing. I also like the crit and the dmg with bow skills.</p>

<p>You can try fracturing the crit or the dmg with bow skills, but it&rsquo;s a big gamble. I wouldn&rsquo;t want to hit the low tier flat phys. For better chances, you could omen of light + annulment, and  redesecrate without revealing. But that&rsquo;s really expensive.</p>

<p>I&rsquo;ll still say for your last affixes that you use omen of greater exaltation + perfect exalt. It&rsquo;s still an awesome craft even without the +2. Pretty sure you&rsquo;ll deal a lot a dmg.</p>

<p>I wonder what would be the chances with the recombinator and another visceral quiver with +2 and some lucky omens. But I doubt that would work. Never really tried it. But I would do it for fun hahaha</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="o3s0tei" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Taxachusetts</div>
        <div>2 | 3 hours ago </div>
      </div>
      <label for="o3s0tei" class="commentText"><p>I guess I’m just confused — all the crafting guides say to fracture, but does that actually help me here, or is it so I can annul down to just the fracture?  That seems silly when the other affixes (besides the desecrate) are already what I’m looking for.</p>

<p>I don’t know how the recombinator works, I haven’t played since 0.1.</p>

<p>For reference, here is my Pathfinder: <a href="https://poe.ninja/poe2/profile/BillyDee4lyf-8603/character/Werdsss" target="_blank">https://poe.ninja/poe2/profile/BillyDee4lyf-8603/character/Werdsss</a></p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="o3sdrbk" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>b1LLydabeast</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="o3sdrbk" class="commentText"><p>It helps for a more deterministic route and for chaos spamming for T1 flat phys, crit, dmg bow skills for example. It sucks, it&rsquo;s not my favorite mechanic but it&rsquo;s the easiest way to assure a T1 of your liking</p>

<p>You have a great build, and a nice quiver already. I&rsquo;d test the damage with your new one. Pretty sure the new quiver has a better floor dmg but with less crit damage.</p>

<p>If it we&rsquo;re me, I&rsquo;d test it and if I&rsquo;m not pleased, I would do another quiver with a +2 and either affix that you like as a base.</p>

<p>Sorry it&rsquo;s not much of help. Even omen of light and redesecrate a suffix, the chances to hit +2 proj are very low. Best of luck 🤞</p>
