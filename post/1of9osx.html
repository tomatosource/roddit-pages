

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>

      <label for="nl7fuh8" class="commentText"><p>Also I don’t know why the video quality is so ass I recorded it in 4K but Reddit destroyed it. As for things that would improve this build for me more. I’d need a 3 socket viper cap and 2 socket shankgonne boots as 3 sockets don’t exist on the market for the boots. But it’s way out of my price range the viper cap.</p>

      </div>
      <label for="nl7p8qt" class="commentText"><p>Merc line on the passive tree lacks ES nodes so you would lose a lot of defences just there as it’s all EV and Armour. I use atalui on the build and I can’t use tecrod as I have no keystones near jewel sockets. <a href="https://poe.ninja/poe2/profile/oppsijustkilledu-1682/character/HairyHippo" target="_blank">https://poe.ninja/poe2/profile/oppsijustkilledu-1682/character/HairyHippo</a> here is the build now it’s let me refresh</p>

      <label for="nl7xc6n" class="commentText"><p>I could probably manage it with armour and energy shield gear but having 2 uniques on the setup kinda makes it tough to get enough survivability hence why I went with armour with armour also applies to elemental damage on it as getting resistances is kinda tough to on this build as you need cooldown recovery on rings for the dodge ability so you get extra survivability from life leech, scavenged plating and wind dancer etc if I had the spirit capability I’d probably put stuff like vitality into some of gems</p>

<p><a href="https://poe.ninja/poe2/profile/Phuxe-0986/character/MercWorkForMire" target="_blank">https://poe.ninja/poe2/profile/Phuxe-0986/character/MercWorkForMire</a></p>

      </div>
      <label for="nl7zgkf" class="commentText"><p>Tactician is fun I used mortars at beginning of league. I thought about using tactician but decided to go with gemling for the extra quality of skills and skill levels trying to get as much cooldown potential as I could and increased effect of berserk. Berserk is currently at 89% with my 44 stacks of rage I’m getting 84% increased damage when under effects of rage idk how I would push it further at this point tho. I’ll have a glance over your tree see if there is any things I could borrow from how youve patched to make improvements. Also is that 3 socket boom boom boots with lvl 20 black powder blitz? If that is im jealous 😭 I’ve corrupted like 10 pairs of lvl 20 boots and can’t even get a second socket. My boots dodge is at 1.13 cooldown currently I can get it down to 1.01 with darkness enthroned belt but losing headhunter is to big a hit. Also I see your using a standard amulet as it has benefits for defences but I highly fireflower amulet buffs majority of all attack skills as nearly all the grenades have fire tag. I’ve got a +4 fire skill with +1 all skill corrupt on mine but you can get a +6 fire skill fire flower it’s just finding one with correct annoint.</p>
