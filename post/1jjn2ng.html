

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/88b5d5h51vqe1.gif"><p>Made a GIF of DPS Tooltip Rolling Over to -21Mil</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/88b5d5h51vqe1.gif" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="mjobujy" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>GL1TCH3D</div>
        <div>1 | 16 minutes ago </div>
      </div>
      <label for="mjobujy" class="commentText"><p>Using Font of Rage + War Banner and some tooltip boosting supports, able to push the tooltip DPS from positive to negative.</p>

<p>And building the rage after war banner shows us the moment it rolls over.</p>

<p>This is due to the 32bit nature of the tooltip calc, so the max positive value is likely 2^31 /100</p>

<p>Interestingly it doesn&rsquo;t keep climbing once it hits the negative value.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="mjocyn4" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Unclearcarcass7</div>
        <div>1 | 11 minutes ago </div>
      </div>
      <label for="mjocyn4" class="commentText"><p>Build link?</p>
</label>
    </div>
  </label>
  
</div>

    
      
<div class="commentAndChildren">
  <input id="mjocz7w" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>DormantEnigma</div>
        <div>1 | 11 minutes ago </div>
      </div>
      <label for="mjocz7w" class="commentText"><p>Very cool. Does this actually change the damage output, or is this a display only bug?</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="mjoe4bm" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>GL1TCH3D</div>
        <div>1 | 5 minutes ago </div>
      </div>
      <label for="mjoe4bm" class="commentText"><p>I imagine it&rsquo;s display only bug as it&rsquo;s an estimated tooltip but hit values should still be correct on mobs. Otherwise it wouldn&rsquo;t make sense when mobs are pushing hundreds of millions to a billion EHP if single hits couldn&rsquo;t surpass 21mil.</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

    
  </div>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="mjodguy" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>d3vg3n</div>
        <div>1 | 8 minutes ago </div>
      </div>
      <label for="mjodguy" class="commentText"><p>So what happens with the mobs then? They start resurrecting?</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
