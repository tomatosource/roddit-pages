

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>

    <h2>

      <label for="nh046tt" class="commentText"><p>Catalyst omens are pretty shit though. I’ve used it 30+ times and hit 3 chaos res. There’s no guarantee to get it</p>

<div class="commentAndChildren">
  <input id="ngzufik" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Angelbot5000</div>
        <div>2 | an hour ago </div>
      </div>
      <label for="ngzufik" class="commentText"><p>I wouldn&rsquo;t invest much on this base to be honest. You can try a cheap method, that is not very deterministic but will increase your odds of getting something decent with the cost of about half a divine. You can spend a couple of life catalysts to get this thing&rsquo;s life mods to 20% and use an omen of catalysing exaltation and an omen of sinistral exaltation with a greater exalt to try to hit life on the prefix, and if you don&rsquo;t, just throw it away. Chances of that working are not very high, because for some reason it can also hit mana, and catalysing exaltation is flimsy at best.</p>

<p>Alternatively, if you are ok with getting 20-30% global defences instead of life, you could use an omen of dextral crystallization to shave off the low cold res with a perfect essence of enhancement. Then you can use one of the abyssal omens that guarantee a Krugal, Amanamu, or Ulaman mod and use a preserved collarbone on it. That gives you a chance to hit one of the hybrid elemental-chaos resistances. I would only use an echo only if I hit a very high max life on the catalysing exaltation, or if the global defences mod is not a dealbreaker. That should leave you with either:</p>

<p>Prefixes: Armour, Life, Rarity / Suffixes: Hybrid elemental-chaos res + shitty cold res<br>
or<br>
Prefixes: Armour, Global Defences, Rarity / Suffixes: Hybrid elemental-chaos res</p>

<p>In the first case, you can&rsquo;t homogenising exalt, because there&rsquo;s a high chance to hit shitty life suffixes, so I wouldn&rsquo;t waste the exalts to buy one. I would probably just use a greater exalt and pray to RNGeezus.<br>
In the second case, your prefixes only have the defence tag and since there are no defence suffixes, that means the homogenizing exalts will get you suffixes with a tag from your desecrated mod and that means two guaranteed resistances.</p>

<p>All in all, for under a divine, you can get an amulet with<br>
Prefixes: Armour, Global Defences, Rarity / Suffixes: Hybrid elemental-chaos res + 2 more resistances in a relatively deterministic manner or you can wing it and hope for the life roll and keep the shitty cold res.</p>
</label>
