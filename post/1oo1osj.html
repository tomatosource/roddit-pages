

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://www.reddit.com/gallery/1oo1osj"><p>Blackblooded Elite Spectre Had Auras?</p>
</a>
    </h2>

    

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="nn139lb" type="checkbox" checked/>

      <div class="commentHeader">
        <div>Arelloo</div>
        <div>2 | a day ago </div>
      </div>
      <label for="nn139lb" class="commentText"><p>Don&rsquo;t the bigger abyssal mobs just have the green halo thing by default?</p>

    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="nn1c8be" type="checkbox" checked/>

      <div class="commentHeader">

        <div>1 | a day ago </div>
      </div>
      <label for="nn1c8be" class="commentText"><p>nope it should not. by default it does not have the green halo if you spectre it. Because patch says any mobs would be their base self once spectred and they should not carry their mods when we were killing them in maps. but I&rsquo;ve tested in abyss mods and all rare mobs have this. fascinating</p>
</label>

</div>

    
  </div>
  
</div>

        
      
        
          
<div class="commentAndChildren">

        <div>PuzzleheadedPair2512</div>
        <div>1 | a day ago </div>
      </div>
      <label for="nn16a4r" class="commentText"><p>What&rsquo;s level is your gem? Seemingly, the aura is level-gated. In Truditoru&rsquo;s video, his gem was only at level 21 (level 15 from the gem). It&rsquo;s pretty low so the summoned Blackblooded Elite won&rsquo;t have the high level ability.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="nn1citg" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Material-Hamster-220</div>
        <div>1 | a day ago </div>
      </div>
      <label for="nn1citg" class="commentText"><p>mine is level 7</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="nn78o48" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>PuzzleheadedPair2512</div>
        <div>1 | 7 hours ago </div>
      </div>
      <label for="nn78o48" class="commentText"><p>Mine also has the same green arrow thing on their head and it&rsquo;s high level so I can&rsquo;t tell.</p>
</label>
    </div>
  </label>
  
</div>

    
      
<div class="commentAndChildren">
  <input id="nn7cd0e" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>PuzzleheadedPair2512</div>
        <div>1 | 6 hours ago </div>
      </div>
      <label for="nn7cd0e" class="commentText"><p>I&rsquo;ve checked the AI script of <a href="https://poe2db.tw/us/Blackblooded_Elite" target="_blank">https://poe2db.tw/us/Blackblooded_Elite</a></p>

<p>It seems that the halo is attached only</p>

<pre><code>on_event_halo_appear_for_abyss_emerge_01
</code></pre>

<p>This suggests that only those that emerge from the abyss would have this. I&rsquo;m not sure if those spawned via Expedition or other mechanism have the halo or not.</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

</div>
