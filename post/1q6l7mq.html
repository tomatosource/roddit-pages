      <label for="ny8d4mh" class="commentText"><p>From Chris Forsberg:</p>

<p>The Celtics, winners of four straight and eight of their last nine overall, have routinely leaned on a 10-man rotation in recent weeks, and that’s with early season starter Josh Minott struggling to break free from the land of DNPs. </p>

<p>The C&rsquo;s are now 17-3 whenever their bench generates 35+ points this season (and 6-9 when they don’t). What’s more, Boston is 18-2 when the bench makes at least seven 3-pointers (and 5-10 when they don’t). </p>

<p>Over the last eight games, Boston’s bench production is up to 41.9 points per game, with bench players shooting 48.9 percent from the field and 42.6 percent beyond the 3-point arc. Celtics reserves are averaging 7.9 3-point makes per game over that span.</p>

<p>Boston’s bench players are a combined +80 in that span. The next-closest bench unit is Detroit&rsquo;s at +44.</p>

<p>Boston’s recent bench boost coincidences with <a href="https://www.nbcsportsboston.com/nba/boston-celtics/luka-garza-stats-highlights-kings-raptors/757597/" target="_blank">the resurgence of Luka Garza</a>, who overcame his own DNP stretch to reenergize the Celtics’ reserve groups. Offseason addition Anfernee Simons looks more comfortable in his bench role and shoulders the offensive burden, while Garza, Hugo Gonzalez, and Jordan Walsh fly around injecting a little bit of chaos into every possession.</p>
