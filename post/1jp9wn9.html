

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://streamable.com/zp3j80"><p>Zach Lowe on the rise of Evan Mobley</p>
</a>
    </h2>

    
    <div class="streamableContainer">
      <iframe
        src="https://streamable.com/e/zp3j80?loop=0"

        style="
          width: 100%!;(MISSING)
          position: absolute;
          left: 0px;
          top: 0px;
          right: 0px;
          margin: 0;
          overflow: hidden;
        "></iframe>
      </div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="mky1yyd" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Bzmode | Cavaliers</div>
        <div>1 | 26 minutes ago </div>
      </div>
      <label for="mky1yyd" class="commentText"><p>One of Mobley or Donovan will probably get 2nd team. I wonder what most people think about which. Mobley is the most important and irreplaceable player on the team but Donovan is still the best player.</p>

<p>The stats this season really aren&rsquo;t eye popping for Evan or Don 19/9/3 on 64ts%. Within the context of the amount of blowouts against bad teams that deflated the stats which has Mobley sitting around only 30 minutes a game hopefully helps his case though.</p>

<p>If I had to be greedy I&rsquo;d prefer Mitchell to get the nod over Evan because of the amount he&rsquo;s sacrificed this season, in terms of stats and minutes for everyone else to shine. Should also help that Evan will be even more pissed off on top of losing DPOY.</p>
</label>
    </div>
  </label>
  
</div>

    <div class="comment">
      <div class="commentHeader">
        <div>TwoTalentedBastidz | Lakers</div>
        <div>1 | 17 minutes ago </div>
      </div>
      <label for="mky3gw4" class="commentText"><p>Babe wake up! New Bill &amp; Lowe just dropped!</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
