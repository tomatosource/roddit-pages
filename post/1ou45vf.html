

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://www.reddit.com/gallery/1ou45vf"><p>Are These 3 amulets i crafted Priced fairly ?</p>
</a>
    </h2>

    

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="no939dz" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>undercoverconsultant</div>
        <div>4 | 4 hours ago </div>
      </div>
      <label for="no939dz" class="commentText"><p>If priced fairly all 3 would have sold by now. If not you might lower the price in small steps every now and then.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="no928ay" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Shariela | customflair</div>
        <div>1 | 5 hours ago </div>
      </div>
      <label for="no928ay" class="commentText"><p>Second one has 25% spell damage on full energy shield</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="no93c58" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Creepy_Secret2793</div>
        <div>1 | 4 hours ago </div>
      </div>
      <label for="no93c58" class="commentText"><p>Honest answer, when it&rsquo;s this late in the league and anything good is a few dozen divines, splitting hairs over 5 or 10 is pointless. I&rsquo;ve seen worse ones for 50 and double rarity ones for 10 but maybe in another week this can be double.<br>
I&rsquo;d say at this point just price them up and drop down each day if they don&rsquo;t sell, if what you&rsquo;re trying to do is cash out before the league ends.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="no94rsn" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Makeunameless89</div>
        <div>1 | 4 hours ago </div>
      </div>
      <label for="no94rsn" class="commentText"><p>All on the worst bases lol</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="no98vbp" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Frangipane33</div>
        <div>1 | 3 hours ago </div>
      </div>
      <label for="no98vbp" class="commentText"><p>Fair price probably closer to 10d, and even then this late in the season it’s going to be tough to sell</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="no99hxw" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>getstoopid-AT</div>
        <div>1 | 3 hours ago </div>
      </div>
      <label for="no99hxw" class="commentText"><p>I think they are priced ok. The question is if the players that are active this late in the league are wealthy enough&hellip; I for example am not. I usually have around 1-5 divs, having more to sit on would mean I don&rsquo;t need new equipment ;)</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
