      <label for="o8gnc0j" class="commentText"><p>From Chris Forsberg:</p>

<p>Rookie Hugo Gonzalez produced the loudest night of his first NBA season Monday while stacking up 18 points, 16 rebounds, three steals, two blocks and an assist over 35 minutes, 20 seconds of floor time for the shorthanded Celtics in their 108-81 triumph over the Milwaukee Bucks.</p>

<p>Gonzalez has only scratched the surface on his offensive potential, generating most of his offense off cuts and putbacks. But the numbers don’t lie: He’s impacting winning in his age-19 season and hardly looks like a first-year player on the defensive side of the ball. </p>

<p>Let’s crunch some of our favorite Hugo numbers from this season: </p>

<p><strong>Rookie leaders</strong></p>

<p>Gonzalez owns the best raw plus/minus among all rookies with the Celtics outscoring opponents by 283 total points in his 864.2 minutes of floor time. That’s 80 points better than the next closest rookie (San Antonio’s Dylan Harper, +203). Charlotte’s Kon Knueppel (+188) is the only other rookie in the neighborhood.</p>

<p>Aided by finishing +27 against the Bucks, Gonzalez is lingering near the top of the all-time best rookie plus/minus per game. The top of that chart from our stats guru Dick Lipe: </p>

<p><strong>Player</strong>				<strong>Season</strong>		<strong>+/- per game</strong><br>
Tim Duncan, SAS	 	1987-88 		+5.18<br>
Chet Holmgren, OKC	2023-24		+5.15<br>
Hugo Gonzalez, BOS	2025-26 		+5.05<br>
Ben Simmons, PHI		2017-18		+4.8<br>
Donovan Mitchell, UTA	2017-18		+4.5<br>
Jayson Tatum, BOS	        2017-18		+4.3</p>

<p><a href="https://www.nbcsportsboston.com/nba/boston-celtics/hugo-gonzalez-stats-impact-rookie-leaders/773809/" target="_blank">Read more here</a>.</p>
</label>
