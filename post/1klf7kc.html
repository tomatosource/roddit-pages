

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/6cklkxhgvh0f1.jpeg"><p>Tangletounge drop and successful corruption</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/6cklkxhgvh0f1.jpeg" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="ms1vayf" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>No_Bar_7084</div>
        <div>2 | 2 hours ago </div>
      </div>
      <label for="ms1vayf" class="commentText"><p>Successful would be 29,5% Critchance or 1 Rage on Melee Hit</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="ms1zg36" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Narrow_Ad1134</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="ms1zg36" class="commentText"><p>Quick question. For what build would 1 Rage on Meele Hit be good?</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="ms21gr6" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Re8tart</div>
        <div>1 | 30 minutes ago </div>
      </div>
      <label for="ms21gr6" class="commentText"><p>Any WSF with Infernal Cry will love the +# rage on XYZ</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

    
  </div>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="ms1zq2j" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Deqnkata</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="ms1zq2j" class="commentText"><p>What do people do with these things? Some cast on crit shenanigans? Isn&rsquo;t the low damage an issue?</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="ms20oih" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Zigamata</div>
        <div>1 | 38 minutes ago </div>
      </div>
      <label for="ms20oih" class="commentText"><p>You want as much flat damage and crit as possible. You get most, if not all, crit dmg and crit chance from the tree, and you get the flat damage on gloves and rings.</p>
</label>
    </div>
  </label>
  
</div>

    
      
<div class="commentAndChildren">
  <input id="ms209kl" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Various_Swimming5745</div>
        <div>1 | 42 minutes ago </div>
      </div>
      <label for="ms209kl" class="commentText"><p>If you played 0.1 this is the pillar of the caged god of 0.2, pretty common floor unique that can be used to play the strongest build/easiest build to get going right now, lightning spear.</p>

<p>Pillar had way less base damage and was way more broken tbh, it&rsquo;s the high crit chance and forking passive that are strong though.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="ms20l0r" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Deqnkata</div>
        <div>1 | 39 minutes ago </div>
      </div>
      <label for="ms20l0r" class="commentText"><p>I just play some scuffed ssf builds so not too aware with meta stuff hence my questions. Doesn&rsquo;t LS need high dmg?</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="ms223uf" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Dysss</div>
        <div>1 | 24 minutes ago </div>
      </div>
      <label for="ms223uf" class="commentText"><p>Damage can be obtained from rings/gloves, and this unique can scale that damage extremely well.</p>

<p>Forking crits mean your crits roll twice and will double your crit damage of both rolls crit, meaning crit damage scaling (already one of the best scaling vectors) is doubly effective.</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

    
  </div>
  
</div>

    
  </div>
  
</div>

        
      
    </div>
  </body>
</html>
