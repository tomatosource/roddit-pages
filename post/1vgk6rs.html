    <h2>
      <a class="postTitle" href="https://poe.ninja/poe2/profile/tim-2680/runesofaldur/character/timdruidss"><p>Any tips to get more tanky, or tips in general</p>
</a>
    </h2>

    

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="p1xsqqi" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Streetwind</div>
        <div>9 | 7 hours ago </div>
      </div>
      <label for="p1xsqqi" class="commentText"><p>Defenses need to be layered, and &ldquo;defense&rdquo; can mean many more things than just the default armour/evasion/energy shield. Rapid shield recharge and life leech are defenses too. Deflection and Block are defenses too. And so on. Not everything will fit your build, but I guarantee you, every build has a few things it can layer.</p>

<p>Look for gear with good defense rolls, particularly on body armours and helmets. If you don&rsquo;t have uniques in those slots, you should have at least two tier 1 defense or health prefixes on each piece.</p>

<p>Look for ways to redirect physical damage to elemental, and/or to take damage with mana before life (Greatwolf Rune of Willpower is an easy one).</p>
</label>
    </div>
  </label>
  
  <div class="commentList">

  <div class="commentList">
    
      
<div class="commentAndChildren">

<div class="commentAndChildren">

      </div>

<div class="commentAndChildren">
  <input id="p1xsrx7" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>TeamLaw</div>
        <div>3 | 7 hours ago </div>
      </div>
      <label for="p1xsrx7" class="commentText"><p>Need to know your build to give real advice. There&rsquo;s usually an optimal item set focusing on health/armour or evasion/deflection or shield. I like shield with that node that reduces health to 1 but gives immunity to chaos. Let me buy gear without chaos res which made it cheaper and allowed me to stack more other defensive rolls.</p>

<p>Edit - totally missed the link, lmao.</p>

<p>On the face of it your life seems low for an armour build. You could probably push that a little higher. I would also swap your pillar for the one that gives elemental res as that seems to be an issue, especially if you&rsquo;re running tablets that give -resistance.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="p1y0bqe" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>flippygen</div>
        <div>2 | 6 hours ago </div>
      </div>
      <label for="p1y0bqe" class="commentText"><p>Bigger helm, more life rolls on gear, a vitalic ring to replace your iron ring</p>

<p>I would swap out Cannibalism 2 and put in charge regulation.  You can get recover 2% of max life on kill from a single suffix on a sapphire jewel</p>

<p>Edit: Might as well pick up Iron Reflexes since you&rsquo;re right there and you have some evasion on your gear.  Unless I&rsquo;m missing something I think your anoint is really out of place.  Can always opt for a defensive anoint</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="p1xx961" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Konikmiejski</div>
        <div>1 | 6 hours ago </div>
      </div>
      <label for="p1xx961" class="commentText"><p>My questions that I focus to answer when upgrading my build: Do I use multiple layers of defense, not just one? Do I have immunity or easy access to recover from being ignited, frozen, poisoned, bleeding, corrupted blood? Did I upgrade charms and flasks? Are there any build bricking mods on waystones that I need to avoid? Did I do all four transcendent limbs? Do I have resistances not only at cap, but also with some reserve to cover curses? I am not doing one after another but checklist like that gives clearer goals to upgrade my defence. Actually this league it is less than usually for me because of loyalty stacking on my minions, but still imo it&rsquo;s a good start to do it like that.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="p1xydey" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Thirteenera</div>
        <div>1 | 6 hours ago </div>
      </div>
      <label for="p1xydey" class="commentText"><p>The key to being tanky is LAYERS.</p>

<p>Just getting a lot of armor isnt enough. Just getting a lot of life isnt enough. Just getting a lot of evasion isnt enough.</p>

<p>You need layers. So multiple defensive parts stacked.</p>

<p>For example, block chance AND armor. Or evasion AND deflection. Or even more.</p>

<p>Mathematically, stacking multiple layers gives a lot more defences than just having one layer very high.</p>

<p>So get resist capped, then get a decent amount of either red or blue life, then go for a combination of armor, evasion, deflection, block and damage conversion.</p>
</label>
    </div>
  </label>
  
</div>
