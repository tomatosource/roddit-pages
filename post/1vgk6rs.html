

<html>

    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,

  box-sizing: border-box;
}

html {

}

body {
  display: flex;
  flex-direction: column;
  align-items: center;

h1 {
  font-size: 4em;

}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {

}

blockquote {
  border-left: 10px solid #ccc;

.subName {

.postList {

.post {

}

.postLink {

  font-size: 42px;
  color: wheat;

  position: relative;
}

.postLink:visited {
  color: #806a42;

}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;

}

.commentList {

}

.commentAndChildren {

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;

.selfPostImage {

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

  <body>
    <h2>
      <a class="postTitle" href="https://poe.ninja/poe2/profile/tim-2680/runesofaldur/character/timdruidss"><p>Any tips to get more tanky, or tips in general</p>
</a>
    </h2>

    

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="p1xsqqi" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Streetwind</div>
        <div>1 | 11 minutes ago </div>
      </div>
      <label for="p1xsqqi" class="commentText"><p>Defenses need to be layered, and &ldquo;defense&rdquo; can mean many more things than just the default armour/evasion/energy shield. Rapid shield recharge and life leech are defenses too. Deflection and Block are defenses too. And so on. Not everything will fit your build, but I guarantee you, every build has a few things it can layer.</p>

<p>Look for gear with good defense rolls, particularly on body armours and helmets. If you don&rsquo;t have uniques in those slots, you should have at least two tier 1 defense or health prefixes on each piece.</p>

<p>Look for ways to redirect physical damage to elemental, and/or to take damage with mana before life (Greatwolf Rune of Willpower is an easy one).</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">

</label>
    </div>
  </label>
  
</div>

</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="p1xsrx7" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>TeamLaw</div>
        <div>1 | 11 minutes ago </div>
      </div>
      <label for="p1xsrx7" class="commentText"><p>Need to know your build to give real advice. There&rsquo;s usually an optimal item set focusing on health/armour or evasion/deflection or shield. I like shield with that node that reduces health to 1 but gives immunity to chaos. Let me buy gear without chaos res which made it cheaper and allowed me to stack more other defensive rolls.</p>

<p>Edit - totally missed the link, lmao.</p>

</div>
