<p>I bought the item with fractured spirit, T1 increased ES, and garbage for the rest of mods for 50d. Not as good of value as yesterdays post, but fracturing 61 spirit is very expensive/hard so I went for it because it had another good lvl 82 mod.</p>

<p>After that things got muddled. I removed two suffixes with double suffix annul combo, exalted once, and then repeated the double annul. I did this until I spiked T1 chaos. Then I whittled my garbage prefix, and it rolled T1 thorns. I actually liked this roll cuz it’s high Ilvl and allowed me to go focus on suffixes. So then I went and finished my suffixes one at a time with whittle.</p>

<p>After that, I have to come back and finish the prefixes with whittle spam. If I roll T1 life like I said I have to <sup>50</sup>&frasl;<sub>50</sub> prefix annul :/. What’s nice though is that my lowest ilvl/highest value prefix is protected by fracture this time.</p>
