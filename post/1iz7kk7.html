       * {

*,

html {

body {

  flex-direction: column;
  align-items: center;

  padding: 32px;
}

  padding: 32px;
  color: #c39429;
}

h2 {

  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;

.subName {

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
}

.selfPostContainer * {
  color: white;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>

      </div>
      <label for="mf1b599" class="commentText"><p>Good crossbows will usually have those prefixes:</p>

<ul>
<li>%physical damage - good if above 100%,</li>
<li>flat physical - the higher the better</li>
<li>flat lightning - same</li>
<li>%increased elemental damage with attacks</li>
</ul>

<p>3 high rolls on those mods are required.</p>

<p>For suffixes:</p>

<ul>
<li>%to crit chance,</li>
<li>%to crit multi,</li>
<li>+level to all projectile skills,</li>
<li>attack speed.</li>
</ul>

<p>Crit stats are the most important, because they allow you to scale the damage better.</p>

<p>Attack speed is really good.</p>

<p>+Level to skills may be problematic for some builds and that&rsquo;s why it&rsquo;s not always optimal.</p>

<p>Int, strength or dex are ok, but not really desirable on a crossbow.</p>

<p>For the runes - %crit multi.</p>

<p>I&rsquo;d be glad to discuss this if somebody has a different take on the topic, because I&rsquo;m looking for a crossbow upgrade and the next Xbox that would increase my damage costs between 500 div and a mirror, and I&rsquo;m stuck.</p>

<p>In PoB you can check directly how a weapon will change your DPS. I&rsquo;m aware that you just want to sell though.</p>
