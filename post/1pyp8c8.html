

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://v.redd.it/gcbm61whw5ag1"><p>Druid is undoubtedly the most fun i&rsquo;ve had with PoE2 so far</p>
</a>
    </h2>

    

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="nwk63ht" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Beneficial_Split_649</div>
        <div>6 | 8 hours ago </div>
      </div>
      <label for="nwk63ht" class="commentText"><p>Druid is a pretty strict archetype, which is really where I see the complaints with it. Outside of how strict the builds are, it definitely feels the best of any archetype I think.</p>

<p>Outside of that, I would say it&rsquo;s just not very &ldquo;PoE&rdquo; of them to have so many restrictions on every interaction from limited rate of fire of volcano and storms, storms not overlapping, rolling magma not benefitting like Poe1&rsquo;s rolling magma from something like Salvo for random directions. It&rsquo;s just extremely limited and I hope this isnt a sign of what is to come when we finally get dual wielding and we get away from some of the attack/spell/proj/melee tagged effects.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="nwm14lm" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>throwaway857482</div>
        <div>1 | 3 hours ago </div>
      </div>
      <label for="nwm14lm" class="commentText"><p>Does volcano have a rate limit? I thought it just had a proc limit of 10.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="nwm1q1c" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Beneficial_Split_649</div>
        <div>2 | 3 hours ago </div>
      </div>
      <label for="nwm1q1c" class="commentText"><p>It has a rate limit for 0.5 per eruption, which i think is a separate limit from the slam procs. The slam procs also have a limit of 10 total slams. Those slam procs I believe also have a further internal CD of something, but they single proc when you use splinter totems.</p>

<p>The most hyped skill for me quickly fell through the gap with 5 different layers of limits. It doesn&rsquo;t even scale with cast speed and tornados don&rsquo;t even overlap. Then it has channeling tag for whatever reason making it less supportable and it&rsquo;s just so unfortunately a deeply overdesigned skill.</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

    
      
<div class="commentAndChildren">
  <input id="nwmgg4z" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>IronwristFighter</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="nwmgg4z" class="commentText"><p>it&rsquo;s absolutely going to be like that all the way. It&rsquo;s too late to remove this many restrictions this deep into development.</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nwk6xoz" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Skin_Ankle684</div>
        <div>1 | 8 hours ago </div>
      </div>
      <label for="nwk6xoz" class="commentText"><p>Both druid and warrior feel amazing on their own. I really hope GGG works on how to make them feel OK compared to other classes you may have in yout party.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nwmpqhm" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Acemont</div>
        <div>1 | 29 minutes ago </div>
      </div>
      <label for="nwmpqhm" class="commentText"><p>I&rsquo;d say for me it&rsquo;s Varashta followed by Demon Druid. While yes, bear is fun, worgen is WoW spec and Wyvern I will play a bit later - having 10K+ ES with 5,8K+ recharge and 1 sec delay, while your minions rip and tear feels really good. So far Varashata is my top pick as a league starter until Templar/RF are out.</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
