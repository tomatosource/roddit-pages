

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/l07obxddxvng1.jpeg"><p>What is a good passive skill tree ?</p>
</a>

	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/l07obxddxvng1.jpeg" />

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="o9dnmti" type="checkbox" checked/>

      <label for="o9dnmti" class="commentText"><p>Make a spear in the passive tree. Insta win.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="o9do0cs" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>kanox72</div>
        <div>0 | 10 hours ago </div>
      </div>
      <label for="o9do0cs" class="commentText"><p>What do you mean ? I did the spear no?</p>
</label>

  </label>
  
</div>

    
  </div>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="o9dqo65" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>striker879</div>
        <div>2 | 10 hours ago </div>
      </div>
      <label for="o9dqo65" class="commentText"><p>Since you are familar with poe.ninja, check out other high level lightning spear / explosive spear builds and see what they do.</p>

<p>Adapt what you learn to what you are running. Test and adjust.</p>

<p>There isn&rsquo;t a 1 size fit all passive tree setup.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="o9dr3zu" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>kanox72</div>
        <div>2 | 10 hours ago </div>
      </div>
      <label for="o9dr3zu" class="commentText"><p>Ok
I&rsquo;m lvl 81 so I only look for the same lvl so I can copy the passive tree ?
Or do I also look at 90+lvl</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="o9dxnyu" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Cobalt_Wolf_</div>
        <div>2 | 9 hours ago </div>
      </div>
      <label for="o9dxnyu" class="commentText"><p>The lvl shouldn’t matter since heat map gives you a general bright red line of popular paths. You can adjust the filter to keep ascendancy, skill gems, and/or gear you want. The passive heat map will show popular nodes and you can check the character to see specific info.</p>
</label>
    </div>
  </label>
  
</div>

    
      
<div class="commentAndChildren">
  <input id="o9e8m22" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>striker879</div>
        <div>1 | 8 hours ago </div>
      </div>
      <label for="o9e8m22" class="commentText"><p>I would look at both. With say, 20 points available sometimes it is better to go one route until you get 25 points available to go a different route.</p>

<p>Respecing is pretty cheap and gold is easy to come by, so by no means do any choices have to be permanent.</p>

    </div>

</div>
