

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/qb70ebsma8we1.jpeg"><p>&ldquo;Crafting&rdquo;</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/qb70ebsma8we1.jpeg" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="moanpiq" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>NaturalCard</div>
        <div>1 | 12 minutes ago </div>
      </div>
      <label for="moanpiq" class="commentText"><p>Crafting feels like it could end up really good, but they still have a ton of mechanics to add.</p>

<p>I also think they could do with really expanding on the socket system to add an easily level of deterministic crafting into the game. Like what if we had 6 sockets on a bow and not just 2.</p>

<p>What if a good white item with all its sockets was as strong as a good rare?</p>

<p>Obviously this would require a bunch of rebalancing, including upping the drop rate of various socketables, but it feels like a potential direction.</p>

<p>Then make having really good bases to put all your socketables into from ground items and endgame crafting with omens.</p>

<p>Also saw a really interesting idea of making omens into currency sinks, where all omens are equally common, but they cost more than one exalt or chaos to use at a time. Would also help to fix the current inflation problems.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="moap82c" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Kadabradario</div>
        <div>1 | 4 minutes ago </div>
      </div>
      <label for="moap82c" class="commentText"><p>For years some players have been complaining that poe crafting is too rng heavy and equated it to gambling.</p>

<p>Once again poe2 is making poe look good by comparison.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="moamtup" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>pm_15spicy</div>
        <div>1 | 16 minutes ago </div>
      </div>
      <label for="moamtup" class="commentText"><p>If crafting is that easy and accessible, then everyone would just have the same items, same attributes, same stats and etc. The concept of having RNG into the items makes it unfair, true, but if it&rsquo;s unfair to everyone, then it is, by design is universally fair.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="moankmo" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>nbrooks7</div>
        <div>1 | 12 minutes ago </div>
      </div>
      <label for="moankmo" class="commentText"><p>What you just described isn’t fun. It doesn’t matter if something is fair or not, it’s an ARPG not a ranked ladder.</p>
</label>
    </div>
  </label>
  
</div>

    
      
<div class="commentAndChildren">
  <input id="moaod4o" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Competitive-Law-5167</div>
        <div>1 | 9 minutes ago </div>
      </div>
      <label for="moaod4o" class="commentText"><p>It wasn&rsquo;t easy or accessible. That&rsquo;s why new players complained so much about it in POE 1. It required planning,  preperation, and knowledge. It appeared convoluted and comlicated at first glance. So instead of creating a better on-boarding process, training new player, or leaving it for players who enjoy it, they just deleted it.</p>
</label>
    </div>
  </label>
  
</div>

    
      
<div class="commentAndChildren">
  <input id="moap012" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>SMTYHVH</div>
        <div>1 | 5 minutes ago </div>
      </div>
      <label for="moap012" class="commentText"><p>It&rsquo;s okay to admit you know absolutely nothing about crafting in poe1. </p>
</label>
    </div>
  </label>
  
</div>

    
      
<div class="commentAndChildren">
  <input id="moapcl1" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>TrayShade</div>
        <div>1 | 4 minutes ago </div>
      </div>
      <label for="moapcl1" class="commentText"><p>Variety should be enforced more through build diversity imo. If everyone wants the same items that&rsquo;s an issue in and of itself, irrespective of the crafting process.</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

        
      
    </div>
  </body>
</html>
