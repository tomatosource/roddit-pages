

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://www.reddit.com/gallery/1vjgfwt"><p>Decent undying hate jewel</p>
</a>
    </h2>

    

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="p2ltno1" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Difficult_Setting140</div>
        <div>1 | 2 hours ago </div>
      </div>
      <label for="p2ltno1" class="commentText"><p>Just those 3?  Completely useless.  I wouldn&rsquo;t even bother with that jewel, especially if you are using minions.  Trust me, I tried.  I found 4x4&rsquo;s, 3x5&rsquo;s, 3x4x4(minion cd).  In the end the math just doesn&rsquo;t check out.  Not even with other useable nodes.  You&rsquo;ll have to spend literally like half of your passive points inside that jewel.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="p2l8mtg" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Atsuma100</div>
        <div>-10 | 5 hours ago </div>
      </div>
      <label for="p2l8mtg" class="commentText"><p>As far as I know you can&rsquo;t double dip on notables with the same name</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="p2la10d" type="checkbox" checked/>

        <div>Federal_Dimension744 [OP]</div>
        <div>1 | 5 hours ago </div>
      </div>
      <label for="p2la10d" class="commentText"><p>That makes sense thanks for the info</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="p2lm4dp" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>DjObamax</div>
        <div>7 | 3 hours ago </div>
      </div>
      <label for="p2lm4dp" class="commentText"><p>Guy above is wrong. Same undying hate notables absolutely DO stack.</p>
</label>
    </div>
  </label>
  
</div>

    
      
<div class="commentAndChildren">
  <input id="p2lpsnl" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Tkmisere</div>
        <div>7 | 3 hours ago </div>
      </div>
      <label for="p2lpsnl" class="commentText"><p>Timeless jewels DO stack the same notable. That&rsquo;s their whole thing</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

    
      
<div class="commentAndChildren">
  <input id="p2lte3q" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>PoisoCaine</div>
        <div>1 | 2 hours ago </div>
      </div>
      <label for="p2lte3q" class="commentText"><p>True of keystones only</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

        
      
    </div>
  </body>
</html>
