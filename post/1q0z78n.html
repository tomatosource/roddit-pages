

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/qjgsob5i4pag1.png"><p>Why am I moving in slow motion on this map?</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/qjgsob5i4pag1.png" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">

      </div>
      <label for="nx1vwzn" class="commentText"><p>My only guess is either cold attacking enemies chilling you, or a bug. Had a weird bug last league, was in slow motion until i went to hideout, back into the map it was fixed. could try that</p>

    </div>
  </label>

</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

      </div>
      <label for="nx1wdam" class="commentText"><p>It’s the bug, I’ve had it a few times this league and going to hideout does fix it</p>
</label>

  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="nx1wqd8" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Nickflix132</div>
        <div>1 | 4 hours ago </div>
      </div>
      <label for="nx1wqd8" class="commentText"><p>Thanks for confirming! glad im not crazy</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

  <input id="nx27gdi" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>0rigin4l</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="nx27gdi" class="commentText"><p>On druid I had this and shapeshifting fixed it</p>

<p>Did you try swapping weapon sets to see if it also fixed?</p>

<p>Can&rsquo;t guarantee it works, but it is easier than going to hideout, so give it a try next time</p>

    </div>
  </label>
  
</div>

    
  </div>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nx1wv65" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>XRuecian</div>
        <div>3 | 4 hours ago </div>
      </div>
      <label for="nx1wv65" class="commentText"><p>Bug. Re-equip your weapon to fix it. You don&rsquo;t need to portal out. Just re-equip if it happens again. Happened to me a few times this league.</p>

</div>

        
      
    </div>
  </body>
</html>
