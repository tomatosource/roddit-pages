      <a class="postTitle" href="https://i.redd.it/22aqtozms5of1.png"><p>Shader cache file size</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/22aqtozms5of1.png" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="nda6tcm" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>CarloFaBordello</div>
        <div>3 | 3 hours ago </div>
      </div>
      <label for="nda6tcm" class="commentText"><p>I have the same problem since the start of this league too, tried everything posted online but nothing solved this issue.</p>

<p>Remember me in 1 week of this post hoping for solutions</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nda8tdj" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>aceCrasher</div>
        <div>2 | 3 hours ago </div>
      </div>
      <label for="nda8tdj" class="commentText"><p>The green shader bar „maxing out“ just means that your CPU is compiling shaders when seeing a visual effect for the first time, which is necessary, but costs performance for the moment. Cashing them is good, because that way they dont need to be compiled again when you see that visual effect the next time. A big game like PoE2 can cache multiple gigabytes, this is normal.</p>

<p>Clearing the cache is detrimental to performance, because your CPU will have to compile them again during runtime instead of pulling them from the cache. </p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="ndaejb8" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Louisepicsmith</div>
        <div>1 | 3 hours ago </div>
      </div>
      <label for="ndaejb8" class="commentText"><p>Thanks for the reply, the issue I&rsquo;m having with the caching (which I should&rsquo;ve said in my original post) is that they&rsquo;re caching every time I enter any zone. Like when I boot into my hideout it maxes my shaders every time, like they should&rsquo;ve already been cached right?</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="ndavi6u" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>crashtested97</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="ndavi6u" class="commentText"><p>The files in your screenshot are the Nvidia driver&rsquo;s shader cache. You&rsquo;ll most likely find that the GGG ones that you really need to delete to reset the game&rsquo;s cache are located at C:\Users\justi\AppData\Roaming\Path of Exile 2\ShaderCacheD3D12</p>

<p>I&rsquo;m not actually certain how these interact with each other but I have found in the past that if I try to delete the Nvidia ones it won&rsquo;t let me because the files are in use. If you want to really start from scratch and see what happens you might have to boot into safe mode and delete the Nvidia ones in there.</p>

<p>Also try going into your Nvidia driver control panel and set the Shader Cache Size to Unlimited. I&rsquo;ve read that this helps but I&rsquo;ve never personally had it set any other way so I can&rsquo;t confirm.</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

    
  </div>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="ndaceag" type="checkbox" checked/>

      <div class="commentHeader">
        <div>CMDR_Lina_Inv</div>
        <div>1 | 3 hours ago </div>
      </div>
      <label for="ndaceag" class="commentText"><p>I use a software to use 2GB RAM to create a RAM disk. Then I set POE to write its shader into that RAM disk.<br>
Faster read write, and the content auto deleted after I turn off my computer.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="ndadj2m" type="checkbox" checked/>
    <div class="comment">

        <div>jynxxedcat</div>

      </div>
      <label for="ndadj2m" class="commentText"><p>How old is this PC&rsquo;s hardware?  This was a thing many years ago, but is it still relevant for newer hardware?</p>
</label>

  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="ndagts4" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>CMDR_Lina_Inv</div>
        <div>1 | 2 hours ago </div>
      </div>
      <label for="ndagts4" class="commentText"><p>It&rsquo;s a 5 years old PC. SSD is much faster than HDD, but RAM is still even faster.</p>
</label>
    </div>
  </label>
  
</div>

<div class="commentAndChildren">
  <input id="ndatogm" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>crashtested97</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="ndatogm" class="commentText"><p>I think this is actually a terrible strategy, it means you will be streaming new shaders every time you play, and since 2GB is basically nothing, anything you cache will be soon overwritten so it&rsquo;s hardly doing anything. In fact it would be actively hurting your performance since your shader will be maxed in out in almost every map.</p>

<p>If you have an extremely fast computer and internet connection then you might get away with it but it&rsquo;s not helping you in any way.</p>

<p>For the record I once tested a 16GB Ramdisk that wrote its contents to the SSD after each session so the caching was actually saved. It made no discernable difference to performance. This was also trying multiple ramdisk solutions and various tweaks.</p>

<p>That said, if you have stumbled upon something that actually works and you have concrete numbers, I&rsquo;m all ears.</p>
</label>
    </div>
  </label>
  
</div>
