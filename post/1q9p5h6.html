

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/vahhbti28ncg1.jpeg"><p>What’s my next move?</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/vahhbti28ncg1.jpeg" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="nywwgq7" type="checkbox" checked/>

      <div class="commentHeader">

        <div>1 | 3 hours ago </div>
      </div>
      <label for="nywwgq7" class="commentText"><p>Why not battle essence instead of the melee? It’s +5 to all attack skill and you can desecrate again for something else, like hybrid phys? Maybe too much investment for this item now. But you can slam ex if you can’t do the other thing</p>

    </div>
  </label>
  
</div>

        <div>1 | 3 hours ago </div>
      </div>
      <label for="nywxdpu" class="commentText"><p>So you risk losing the crit of you want to deterministic craft this.</p>

<p>Perfect essence of abrasion + target suffix.  That fills your prefixes.</p>

<p>3 prefix/1 suffix ideally you kept crit.  </p>

<p>Now you can omen of greater exaltation + perfect exalt.</p>

<p>Fills <sup>3</sup>&frasl;<sub>3</sub>.  If your yolo slam gets good mods.  Well fuck you, it never did for me.</p>

<p>If you got garbage thats fine.</p>

<p>Now you essence cycle.  Perfect haste perfect battle.  If you lost crit along the way thats fine.  You can desecrate with omens targeting suffix and add attack speed.</p>

<p>You will at minimum end up with </p>

<p>%phys, phys, dmg as phys - prefix
+5 skills, onslaught, as - suffix</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nyx0c6d" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Itwarin</div>
        <div>1 | 3 hours ago </div>
      </div>
      <label for="nyx0c6d" class="commentText"><p>I would just dextral crystallization plus perfect of abrasion here to finish prefixes, then ex slam to full suffixes cycle between perfect essence of haste, perfect essence of battle and desecrate suffix with omen of liege to finish suffixes with onslaught, attack speed, +all attack.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nyx5pwk" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>VolunteerPin</div>
        <div>1 | 2 hours ago </div>
      </div>
      <label for="nyx5pwk" class="commentText"><p>This is my first go at crafting.   I messed up when did not activate my omen to get the suffice desecrate and got the choice of basically attack speed or +5 melee skills and took the +5. I will give these ideas a whirl.</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
