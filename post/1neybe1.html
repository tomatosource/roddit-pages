

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/39cgksa0apof1.jpeg"><p>Always loot chests no matter what because you may strike gold randomly.</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/39cgksa0apof1.jpeg" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="ndsgzmq" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>titebeewhole</div>
        <div>5 | 3 hours ago </div>
      </div>
      <label for="ndsgzmq" class="commentText"><p>No, I don&rsquo;t think I will.</p>

<p>But also grats</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="ndsijez" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>BoltNWheel</div>
        <div>1 | 3 hours ago </div>
      </div>
      <label for="ndsijez" class="commentText"><p>Well you see i probably wouldnt get the div anyway, because 15 seconds prior to opening this chest I&rsquo;d be frantically running from abyss degen puddles while the rare teleports on top of me 6 times. Just desperately trying to get my ES regened so I can finish the rare off, then I&rsquo;d get hit by temp chains, and I&rsquo;d have a server ping spike, and then gear wheel crash as he teleports onto me, and when the game unfreezes I&rsquo;d be dead.</p>

<p>Yeah. Yeah im salty.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="ndsj7jg" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Amescent</div>
        <div>1 | 2 hours ago </div>
      </div>
      <label for="ndsj7jg" class="commentText"><p>That&rsquo;s a divine, not gold&hellip;</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="ndsnvmb" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>therestlessone</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="ndsnvmb" class="commentText"><p>There&rsquo;s always more chests ahead of you than behind you. Don&rsquo;t go out of your way for this shit.</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
