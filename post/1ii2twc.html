      <label for="mb2i869" class="commentText"><p>Not enough credit is going to KP tonight.</p>

<p>On defense, this was a DPOY-level performance like his old Knicks days. The paint was his, and his size was a massive factor.</p>

<p>And on offense, he was superb on an off night. He had easily 8 shots that he normally makes, yet he never let that affect his aggression/confidence. He coulda bailed out the defense when his shot wasn’t falling, yet he stayed aggressive and continued to open up the floor for our shooters.</p>

<p>If a KP mismatch in the post is the shot Cleveland is willing to give up, you have to agave supreme confidence in our team. It won’t be the shot they give up in a 7 game series, but still they haven’t shown a way to beat us in 7 yet.</p>
</label>

      </div>
      <label for="mb37vh4" class="commentText"><p>Great win and lots of things to take away from this game. Perhaps the biggest takeaway (s) from me are two things:</p>

<p>•We’re a complete mismatch for Cleveland when they’re on defense. At the beginning of the game their zone defense looked effective on some occasions but by the 3rd we began to pick on Garland and Strus more. The Cavs lack a true wing with size who can defend. Keep an eye on them acquiring DeAndre Hunter at the deadline.</p>

<p>•Evan Mobley won’t play like this every game, he was pretty rough. If he has even an average game then I think Cleveland makes the game a lot closer.</p>
