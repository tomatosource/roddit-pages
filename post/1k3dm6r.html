

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://www.reddit.com/gallery/1k3dm6r"><p>PLEASE, I can&rsquo;t take it anymore!</p>
</a>
    </h2>

    </div>
  </label>
  
</div>

    
  </div>

</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="mo1qv9b" type="checkbox" checked/>

        <div>Objective_Lie_1928</div>

      </div>

</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="mo1xqvq" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>ZeuS_3219</div>
        <div>1 | 3 hours ago </div>
      </div>
      <label for="mo1xqvq" class="commentText"><p>My GPU sufferss a lot with this game too, when open boxes, delirium, beyond fps go down to 45 or even less. Some skills make my GPU explode, I have 3080 and 5700x3d. They should focus on performance and make visual effects lighter, maybe with some option like other games. We need smooth game play, this game fells terrible when screen starts to freeze and GPU usage goes to 100% 😓</p>

    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="mo1ze1v" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>-crtr</div>
        <div>1 | 3 hours ago </div>
      </div>
      <label for="mo1ze1v" class="commentText"><p>Did you try deleting your GPU drivers with DDU and reinstalling? Also, set windows mode to balanced (probably not gonna help with your issue, but it&rsquo;s recommended)</p>

  </body>
</html>
