

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/ejw4sotug4cg1.jpeg"><p>I came prepared for those chests</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/ejw4sotug4cg1.jpeg" />

    <div class="commentList">
      
        
          
<div class="commentAndChildren">

<p>Run %relic and discover that&rsquo;s where the loot is.</p>

  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="nye3j6o" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Jimthepirate</div>
        <div>1 | 5 hours ago </div>
      </div>
      <label for="nye3j6o" class="commentText"><p>I have some relic quantity mods. Still farming to get some t1 mods, but I haven&rsquo;t gotten anything great in many runs despite filling 2+ tabs worth of relics every run. My main income is from the Against the Darkness jewel. All this chest is just a bonus. Sometimes I get lucky with time-lost or standard jewels.</p>

</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nye323k" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Skin_Ankle684</div>
        <div>1 | 5 hours ago </div>
      </div>
      <label for="nye323k" class="commentText"><p>Damn, thats like&hellip; 150k gold.</p>

<p>Edit: Maybe a div if you get a lucky relic.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="nyf41dp" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>acetylyne</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="nyf41dp" class="commentText"><p>The divs are in the jewels, open all the royal, time lost, &amp; spectrum chests.</p>

<p>Identify the jewels, there&rsquo;s almost always a couple div worth just in the reveal, then for the crap ones reforge 3:1 for a new roll.</p>

<p>Made 30 div with a time lost sapphire the other day</p>
</label>

  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="nyf5tf9" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Skin_Ankle684</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="nyf5tf9" class="commentText"><p>How do i check what the good modifiers are? I have exiled exchange, but it doesn&rsquo;t help much</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="nyf9f76" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>acetylyne</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="nyf9f76" class="commentText"><p>On Sapphires, anything with minion anything is garbage. Good rolls are Max ES and anything crit. Elemental damage and damage while shapeshifted are worth checking, so is anything with magnitude.</p>

<p>Rubies, damage (global, melee, or attack) &amp; defense (global or armour), shapeshifted as well are all worth checking.</p>

<p>Emeralds, anything mismatched - quarterstaff / crossbow / bow rolls that don&rsquo;t synergize are garbage. Damage, Crit, &amp; Magnitude are worth checking.</p>

<p>What I&rsquo;ll do then with those base guidelines, is copy and paste anything I think might be worth into trade and search. Takes a minute to churn through them all but once you do it a couple times, you get a feel for what might be good and what&rsquo;s not. Plus you&rsquo;ll find better jewels for your own build this way without paying a ton.</p>
</label>
