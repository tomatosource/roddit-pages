      <label for="nfwetb0" class="commentText"><p>REALLY happy with how this craft turned out even though it&rsquo;s not the best and I settled on certain mods. Overall, I&rsquo;m not sure how much it cost to get to this point since I gambled on lots of magic bases and lost the fracturing odds on too many staves to count but generally I was pretty frugal and bought most bases &amp;lt; 30 ex to save currency with around a 30-40d budget give or take. Now the only question is how many divs to spend to get better Ele and phys rolls&hellip; and vaal is definitely out of the question since I&rsquo;m a poor man just like most of the players out here. Here&rsquo;s the steps as per reddit rules and hope it helps since there are no helpful quarterstaff videos out there since there&rsquo;s much more RNG compared to other weapons</p>

<hr>

<p>Step 1: Find a T2 Phys% and CD magic base [40ex] for insanely cheap by stalking the trade site for the past week</p>

<p>Step 2: Greater Essence of Seeking and got near max crit (3.<sup>77</sup>&frasl;<sub>3</sub>.8%)</p>

<p>Step 3: Preserved Jawbone + Omen of Sinistral Necromancy [10ex] to guarantee desecrated prefix (DO NOT REVEAL FOR BETTER FRACTURING ODDS)</p>

<p>Step 4: <strong>[RNG]</strong> -&amp;gt; Fracture [90ex] and hit the prefix for <sup>1</sup>&frasl;<sub>3</sub> odds</p>

<p>Step 5: Omen of Dextral Crystallization [80ex] + Perfect Battle Essence [40ex] to guarantee +6 attack skills and fill out suffixes</p>

<p>Step 6A:<strong>[RNG]</strong> -&amp;gt; Perfect Ex [~3d] once and got a lucky T2 Ele Damage</p>

<p>Step 6B: <strong>[OPTIONAL BUDGET OPTION FOR STEP 6]</strong> -&amp;gt; Preserved Jawbone + Omen of Abyssal Echoes[100ex]. If the result is BAD, use a Perfect Essence for Gain [Ele/Cold/Fire/Phys] Damage + Omen of Dextral Crystallization to remove it. Then, greater ex and/or desecrate again for final steps</p>

<p>Step 7: Ancient Jawbone [~3d] + Omen of Abyssal Echoes [100ex] got trash so had to Omen of Light [~3d] and repeat step 7. Got T2 added phys and called it a day because its was a solid upgrade and all the other quarterstaves on the market were so dang expensive</p>
