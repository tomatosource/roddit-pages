

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>

    <h2>
      <a class="postTitle" href="https://www.reddit.com/gallery/1odja2o"><p>I feel like I&rsquo;ve been getting trolled this league, what do you think?</p>
</a>
    </h2>

    

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="nkua5rz" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>BeMyBrutus</div>
        <div>1 | 8 minutes ago </div>
      </div>
      <label for="nkua5rz" class="commentText"><p>Honestly you need like 30+ maps to really get a sense of what&rsquo;s going on. Five maps has too high of variance.</p>

<p>That being said; I&rsquo;d get rid of the rogue exiles and put it into more % of increased precursor tablets and/or packsize.</p>
</label>

</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nkuas0q" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>MTosti92</div>
        <div>1 | 6 minutes ago </div>
      </div>
      <label for="nkuas0q" class="commentText"><p>Community seems to be running on the idea that 150 is the soft cap for rarity, and that once you hit it on your character, diminishing returns thereafter. So, once you hit 150, focus on other affixes.</p>

<p>Its a tale as old as D2: the only rarity that matters is hitting a soft cap, then it’s all about blasting. Someone with 300% rarity who runs 2 maps will probably not find as much stuff as someone with 150 who can run 3x the amount of content in the same time.</p>

<p>If you’re getting burnt out after 5 maps, maybe take a break from POE? You said it yourself..really low N number.</p>
</label>
    </div>
  </label>

</label>

  </label>
  
  <div class="commentList">

</label>

</div>

</div>

        <div>CoreyJK</div>

      </div>
      <label for="nkub1zn" class="commentText"><p>At the same time if you’re already blasting what else is there to build for besides more rarity, might as well</p>

<div class="commentAndChildren">

        <div>1 | 3 minutes ago </div>

      <label for="nkub9he" class="commentText"><p>Pew pew faster! Lol, idk. I guess it’s a balance, but if I had to <em>choose</em> I’d choose speed with rarity softcap vs stacking rarity.</p>
