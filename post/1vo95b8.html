

<html>

    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>

<div class="commentAndChildren">
  <input id="p3o1bua" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Statcall</div>
        <div>1 | 27 minutes ago </div>
      </div>
      <label for="p3o1bua" class="commentText"><p>Concussive Runes has a weird interaction with Leap Slam and Sunder</p>

<p>Usually, those two skills can’t break armour because they have innate “consume armour” gimmicks, however Concussive Runes procced by Leap Slam/Sunder is apparently exempt from that limitation, and can still armour break normally</p>

<p>BUT, said Concussive Runes will still counts as part of Leap Slam/Sunder, meaning all support gems on the Leap Slam/Sunder also applies to Concussive Runes</p>

<p>And yes, Leap Slam and Sunder can consume the Armour Break that its own Concussive Rune caused, no external skill needed, this is especially OP with aftershocks, the initial slam causes armour break. The second aftershock consumes it right after, so you can break AND consume broken armour in one hit</p>
</label>

      </div>
      <label for="p3no05y" class="commentText"><p>TL;DW: Sunder has above-average gem level scaling and HotG has below-average for mace skills.</p>

<p>Gemling&rsquo;s quality closes the attack speed gap between them and then when you reach gem level 31, there&rsquo;s basically no damage multiplier difference between them when clearing, though HotG will be higher for single-target.</p>

<p>Even if you&rsquo;re not on Gemling, you&rsquo;re going from 50% attack speed to 40% attack speed in exchange for not needing to use the Zerphi&rsquo;s infamy setup, which may or may not be valuable.</p>

<p>Maybe someday HotG will be allowed to return to its former glory 😔</p>
