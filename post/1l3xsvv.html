

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/rnfh53izp35f1.png"><p>Ascencion Questions</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/rnfh53izp35f1.png" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="mw4g9oc" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>TheHavollHive</div>
        <div>1 | 7 minutes ago </div>
      </div>
      <label for="mw4g9oc" class="commentText"><ul>
<li>8 points max</li>
<li>Nope</li>
<li>You can do your first ascension in act 2, when getting the coin from Balbala. After that you can ascend again in act 3 when you get your ultimatum, which counts as your second ascension. That gives you four points. Getting your third ascension, and you fifth and sixth points, take a lot more time</li>
</ul>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="mw4gepv" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>dr_binaryV1</div>
        <div>1 | 6 minutes ago </div>
      </div>
      <label for="mw4gepv" class="commentText"><p>The first sekhemas is fairly easy. And you get 2 points. The first chaos is easy too just 4 trials and you get 2 points. If you do sekhemas with 2 trial after chaos you won’t get points</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="mw4h2aa" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Leberzirrhose</div>
        <div>1 | a minute ago </div>
      </div>
      <label for="mw4h2aa" class="commentText"><p>In order:</p>

<p>There are 4 ascensions at 2 points each so 4x2=8 points.<br>
You only get the points the first time you do them.</p>

<p>Some people say to do ascensions later because there is a chance of failure (which may mean waste of time depending on your view on efficiency). 1st and 2nd ascencion can be repeated at will, for 3rd and 4th you need the equivalent baryas/ultimatium dropping from anywhere.</p>

<p>You could skip 2nd ascension and do 3rd one straight away, granting you points 3,4,5 and 6. This advice probably comes from someone who hates the trials of chaos (which is the campaign-related way to do 2nd ascension)</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
