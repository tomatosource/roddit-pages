

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://youtu.be/V5ms1Hg0kI0?si=ZCrvwZwh8CjMLR7Z"><p>Every hit-for-the-cycle in the last three seasons</p>
</a>
    </h2>

    

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="nqfvl8b" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>cod_gurl94 | Chicago Cubs • Mariners Bandwagon</div>
        <div>5 | 6 hours ago </div>
      </div>
      <label for="nqfvl8b" class="commentText"><p>Never gonna forget the magic of our backup catcher deciding to hit like a god at the start of the season</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nqfx4d5" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>MohnJilton | Texas Rangers</div>
        <div>1 | 6 hours ago </div>
      </div>
      <label for="nqfx4d5" class="commentText"><p>Wyatt Langford</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nqg4ixd" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>OnlyForBaseball | Pittsburgh Pirates</div>
        <div>1 | 5 hours ago </div>
      </div>
      <label for="nqg4ixd" class="commentText"><p>Some observations:</p>

<ul>
<li><p>Sadak is a hell of an announcer</p></li>

<li><p>Saving the triple for last is objectively the most exciting way to get a cycle</p></li>

<li><p>The Red Sox were at home for the Altuve cycle and it looks like none of them have ever played balls off the monster or even the regular outfield wall before</p></li>

<li><p>The way Alvarez stared at it, I assumed that was his double even with Rodriguez getting hurt. How the hell did he get to third? Should he have had an inside the parker?</p></li>

<li><p>Buxton is so fucking cool. Can’t even be mad it was against the Pirates</p></li>
</ul>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
