<div class="commentAndChildren">

    <div class="comment">
      <div class="commentHeader">
        <div>Eclune</div>
        <div>5 | 3 hours ago </div>
      </div>
      <label for="md889x7" class="commentText"><p>If you were wondering what pure Shattering Palm gameplay looked like, here you go. I don&rsquo;t think a build guide is necessary, just scale gem levels and get survivability. I&rsquo;m using a controller so I don&rsquo;t know if it works as well on KBM. Some things like mana can still be optimized. I also suspect there&rsquo;s an abusable interaction with Ice Wall but I didn&rsquo;t really bother since targeting on controller is (or was?) wonky to say the least. I&rsquo;m posting this to get it out of the way before next patch hits (I haven&rsquo;t played in like 2 weeks now).</p>

<p>As for the mechanics behind Shattering Palm, there is a hit followed by an outward wave that applies an explosion debuff, which triggers an explosion that does damage after the target has taken enough damage. This threshold scales with gem levels up to 22, after which it stays constant. This means that a second Shattering Palm can trigger the explosion debuff applied by the first Shattering Palm, then reapply the debuff so you can have constant explosions. This is where the single target comes from. However, if you do not do enough damage to trigger the explosion, the debuff will reapply and restart the damage count. In other words, the build is not really functional until your Shattering Palm initial hit exceeds the explosion debuff threshold (you can use something like Killing Palm to trigger the debuff before you reach that point).</p>
</label>
