      <label for="nzm1n1j" class="commentText"><p>Great moment, but not #8 all time IMHO.</p>

<p>Also, Cal was undoubtedly a first-ballot HOFer, but I take issue with any statement that implies he was playing at an elite level throughout his streak:</p>

<blockquote>
<p>Ripken showed up to play every single day. And more than that, he played well, racking up offense at a level rarely before seen from a shortstop.</p>
</blockquote>

<p>Yes, he showed up to play every single day, and he played at an elite level from 1982 through 1991, but he may have benefited from some time off during the last seven years of his streak, as his offense dropped off significantly after 1991. In fact, he was a slightly below average hitter from that point forward, whether you look at 1992–1995 (when he broke Lou&rsquo;s record), 1992–1998 (when his streak ended), or 1992–2001 (when he retired).</p>

<p>And yes, I understand that Cal&rsquo;s defense played a big part in his value, but those numbers tailed off dramatically after his broke Lou&rsquo;s record, and he pushed the streak for three more seasons despite all signs pointing to him needing time off more regularly as he got older.</p>

<p>Lou&rsquo;s offensive numbers blow Cal&rsquo;s out of the water, and while his defense was not good, he still finished his streak with an approximately 22% higher WAR than Cal had during his streak.</p>

<p>Again, a great moment and accomplishment for a sure fire HOFer, but I think it&rsquo;s overrated simply because of whom Cal passed – one of the greatest hitters and inspiring characters to ever play the game.</p>
</label>
