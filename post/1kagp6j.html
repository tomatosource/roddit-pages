

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/jlrk57vbppxe1.jpeg"><p>I think my companion almost killed me</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/jlrk57vbppxe1.jpeg" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="mpm55zy" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>[deleted]</div>
        <div>1 | 3 hours ago </div>
      </div>
      <label for="mpm55zy" class="commentText"><p>[deleted]</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="mpm5ymd" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>icantswim2</div>
        <div>0 | 3 hours ago </div>
      </div>
      <label for="mpm5ymd" class="commentText"><p>I posted context, it took me a moment to type up.</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="mpm5wlf" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>icantswim2</div>
        <div>-1 | 3 hours ago </div>
      </div>
      <label for="mpm5wlf" class="commentText"><p>So, here I am running this pretty little map, my happy little idiot running around making friends with the monsters as they show up, buffing me so I can move on to finding new friends for my goofball companion.  Once in a while, my buddy shows off by detonating a leftover corpse that didn&rsquo;t get turned into a herald of blood fountain.</p>

<p>I&rsquo;m thinking nothing of it, me and my buddy are having a grand time exploring this new map, when he gets scared and jumps back into his pokeball mid-explosion.  Again, nothing new, he gets overstimulated sometimes and will come back after a brief break, but this time I was standing atop the corpse-turned-firecracker when he scurries away, and the strangest thing happened, I went from full health to a sliver as that corpse blew up.</p>

<p>I&rsquo;m thinking there&rsquo;s no way my companion tried to blow me up, is there?  But in the back of my mind I&rsquo;m thinking when he zips back to his gem for a break, maybe the game no longer registers the exploding corpse as something caused by an ally.  No other monsters in this map detonate corpses, and there are no rares anywhere near me, but try as I might, I can&rsquo;t quite replicate the scenario without endangering my life and the shiny waystone + unique map.</p>

<p>So&hellip;. has anyone else ever heard of this happening?  A companion exploding a nearby corpse, and the explosion turning hostile to the player when the companion is slain and yet to respawn?</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
