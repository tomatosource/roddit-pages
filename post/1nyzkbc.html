

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>

    <h2>
      <a class="postTitle" href="https://i.redd.it/wg1yprjtuctf1.jpeg"><p>Deadeye cheap bow craft for endgame</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/wg1yprjtuctf1.jpeg" />

    <div class="commentList">
      
        
          
<div class="commentAndChildren">

        <div>IVLimitless</div>

      </div>
      <label for="nhyhjer" class="commentText"><p>Isnt obliterator a better choice dps wise? If you dont mind the implicit on it.</p>

  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="nhyim6j" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Noctis32</div>
        <div>0 | 2 hours ago </div>
      </div>
      <label for="nhyim6j" class="commentText"><p>Obliter bow is a high phys damage bow but I don&rsquo;t like the implicit. Many bow&rsquo;s have a trade off so high aps bow have lower phys damage. Since the bow craft I&rsquo;m using has so little physical damage is not very relevant. Though shortbow is the biggest aps bow in the game. Warmonger seems to be the most popular choice for a phys bow as it has good aps at 1.2 and higher phys than Gemini bow for example. After obliterator bow warmonger had the biggest phys. Since this is a pure ele bow you can get surprisingly good numbers with shortbow.</p>
</label>

  </label>
  
</div>

    
  </div>
  
</div>

        
      
        
          
<div class="commentAndChildren">

        <div>1 | an hour ago </div>
      </div>
      <label for="nhypgl6" class="commentText"><p>Quiver bonus does alot of heavy lifting. People don&rsquo;t realize it but, quiver bonus actually does more damage than prime lines like Flat phys if you have a perfect quiver which isn&rsquo;t hard to make.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="nhyq1w8" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Noctis32</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="nhyq1w8" class="commentText"><p>Yup running lv31 LA. I don&rsquo;t have the perfect quiver but 5x t1 + T2 bow dmg from essence of hysteria. Still a great quiver.</p>
</label>

  </label>
  
</div>

    
  </div>
  
</div>

</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nhyhr2c" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Noctis32</div>
        <div>-2 | 2 hours ago </div>
      </div>
      <label for="nhyhr2c" class="commentText"><p>I don&rsquo;t wanna break the rules but the how to craft this bow is already out there. This thread isn&rsquo;t about how to craft a bow just w general discussion but anyways:</p>

<p>Get either a buy that has the stats you want and gamba on fracturing either crit or flat light or get a fractured crit bow.</p>

<p>Chaos spam for t1 light</p>

<p>Use omen of dex and exalt for a suffix</p>

<p>Use omen of dextral crystal and essence of electricity for extra light.</p>

<p>Fill the remaining suffixes with omen of dextral and fill the prefix with an preserved jawbone, if you want quiver then use kurgal. With 6 affixes spam battle and haste until both are filled. Then reveal for quiver bonus.</p>
