

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/d6g31sa6bmxe1.png"><p>What catalyst should I use?</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/d6g31sa6bmxe1.png" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="mpix7ew" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>panofsteel</div>
        <div>1 | 4 minutes ago </div>
      </div>
      <label for="mpix7ew" class="commentText"><p>Nothing will be removed. Catalysts just improve the affixes. Go attribute if you need it, it doesn&rsquo;t matter much.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="mpix9xi" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Minthussy</div>
        <div>1 | 3 minutes ago </div>
      </div>
      <label for="mpix9xi" class="commentText"><p>“Replaces other qual types” mean you can’t stack catalysts. So if you had attribute catalysts and threw on say a life catalyst, the attribute catalysts would be overwritten by the life one. In this instance the attribute would be a good idea, will end up with a good amount of INT.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="mpixc6l" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>atasuke10</div>
        <div>1 | 3 minutes ago </div>
      </div>
      <label for="mpixc6l" class="commentText"><p>If you add another type of catalyst it will replace any existing one yeah and no it won&rsquo;t be removed</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="mpixdv7" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Intrepid-Degree-7913</div>
        <div>1 | 3 minutes ago </div>
      </div>
      <label for="mpixdv7" class="commentText"><p>It means if, for e.g. you use catalists to improve life stats, if you use a catalist which improves attributes, the life catalist will be removed. I.e. only 1 catalist is applicable on an item. As for which to use - depends on what you need - attributes look nice and if you apply that ypu will get (max) +20% on both int and all attributes.</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
