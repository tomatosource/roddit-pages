    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;

.subName {
  text-decoration: none;

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>

      <label for="o2ew7pb" class="commentText"><p>Use this tool to see the interactions and plan out strats (or use pre-made layouts):</p>

<p><a href="https://sulozor.github.io/#/atziri-temple" target="_blank">https://sulozor.github.io/#/atziri-temple</a></p>

<p>To unbrick your temple, path towards the special reward rooms and run them so that they go away. Do not place new special rooms (by special rooms i&rsquo;m referring to the reward ones that you can place after killing the architect). Once those are gone, simply run architect and/or atziri over and over until your temple is clean enough to start your snake. If you have architect in a desirable spot and don&rsquo;t want him to move / don&rsquo;t want to kill him, then simply open/close the temple without running anything and you will still have some rooms destabilize each time. This will also clean up your temple over time, it&rsquo;s just a bit slower. Killing Atziri removes the most rooms.</p>

<p>Having rooms in the center is fine since all snake strats use random garbage (bait rooms) in the center, these will be used as bait for the random destabilizations so that your snake stays intact (because you won&rsquo;t have enough lock medallions at the start). Only later when your first snake is mostly done and you need to start on your 2nd snake do you stop placing bait rooms in the center, at that point you&rsquo;ll have lock medallions anyway.</p>
</label>

      <label for="o2ex57e" class="commentText"><p>Ok, its quite fucked. But it&rsquo;s fixable. Start from clearing all reward rooms(those that you get to place after you kill architect). Place roads or snake rooms towards them untill are reward rooms are gone. Afterwards you want to kill architect until he moves to a correct position [0;0 is center of the board and x axis is on start-atziri line] - either (2;0) or (2;3)/(2;-3) depending on what layout do you want to follow.<br>
Killing architect over and over again will clear most of your rooms, in the meantime try to place every single spymaster you see to stock up on locks (if you can get all 6 it will really help you start your snake). Clear all other medals for now.</p>

<p>To see what room interacts with what room and can/cant be connected you can hover over tile while holding alt. Or use <a href="https://sulozor.github.io/" target="_blank">Temple planner</a> - also you have all popular layouts there, some require russian tech<br>
In game if you are about to connect to other non road tile the square will have bright green border - it can help you avoid looping</p>
