

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/v7t63s3njhwg1.jpeg"><p>Toxic growth attack damage</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/v7t63s3njhwg1.jpeg" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="oheeyix" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>MildStallion</div>
        <div>1 | 25 minutes ago </div>
      </div>
      <label for="oheeyix" class="commentText"><p>Checking poe2db, the value at level 14 is supposed to be 47% on the hit, 74% on the explosion, where level 18 matches the new numbers shown. I don&rsquo;t know what&rsquo;s causing the discrepancy though.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="ohehg0b" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Gibberish-Jack</div>
        <div>1 | 2 minutes ago </div>
      </div>
      <label for="ohehg0b" class="commentText"><p>I have +1 to skills and increased dam with bow skills. So maybe thats why the original value is higher and the new value is unbuffed. Ill upgrade and see what happens</p>

<p>Thank you</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="ohef2bl" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Wendigo120</div>
        <div>1 | 24 minutes ago </div>
      </div>
      <label for="ohef2bl" class="commentText"><p>Those lvl18 numbers look correct, it&rsquo;s the lvl14 numbers that look way higher than they should be.</p>

<p>I&rsquo;m guessing the lvl 14 gem isn&rsquo;t actually doing that much more damage than intended, and probably looks normal if you look at it outside of the gem leveling menu.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="oheg8sh" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Quirky-Perception159</div>
        <div>1 | 13 minutes ago </div>
      </div>
      <label for="oheg8sh" class="commentText"><p>Maybe you have + skill lvl, and the tool tip is comparing current buffed VS future raw?</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
