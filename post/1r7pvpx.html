    <h2>
      <a class="postTitle" href="https://www.reddit.com/r/PathOfExile2/comments/1r7pvpx/how_to_keep_going/"><p>how to keep going</p>
</a>
    </h2>

    
    <div class="selfPostContainer">
      <p><a href="https://preview.redd.it/p85ewja6t5kg1.png?width=1312&amp;format=png&amp;auto=webp&amp;s=79741d83f5926e1bffcac03923ad697201e6e4a7" target="_blank">https://preview.redd.it/p85ewja6t5kg1.png?width=1312&amp;format=png&amp;auto=webp&amp;s=79741d83f5926e1bffcac03923ad697201e6e4a7</a></p>

<p>so from right top corner, how to keep going with Russian tech  ?</p>

    </div>
    

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="o5zaiq8" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Skaitavia</div>
        <div>1 | 8 hours ago </div>
      </div>
      <label for="o5zaiq8" class="commentText"><p>You can still do armory next to architect, garrison next to that, and then spymaster in the corner. But then your next part will be forced to have an armory in your chain since you can’t russian tech a spymaster next to the architect.</p>

<p>But what you can do is a roman road tech to do so. You would build a path to 2 squares southwest of the architect, then place a final path southeast of that square. Then to the northeast of that path you would place a garrison, and when you have the sacrifice room option and a spymaster option in the same roll, you would place a spymaster northeast of the garrison so it’s the the southeast of the architect, then sacrifice the path that’s southwest of the garrison to disconnect it from your chain. You then lock the garrison.</p>

<p>Once the path destabilizes you can continue the russian tech, but you will have to continue to lock the garrison since it’d be at risk to destabilize when you place an armory down.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="o5zlkym" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Hypalite</div>
        <div>1 | 7 hours ago </div>
      </div>
      <label for="o5zlkym" class="commentText"><p>As other commenter said Roman road is likely the only option to get the optimal spymaster chain in with the architect where he is currently. I would suggest pausing on the snake building and only locking your last garrison each run, while also building up to the architect with your other rooms so you can kill and move him to the optimal spot in the center.  4 spots south west of atziri. It would be the spot in front of where your main road ends. It would take a few runs to achieve, but if you’re going through all the Russian techs it makes more sense to actually have everything lined up before moving forward.</p>

<p>If you do try to move the architect, be aware it won’t move to a spot unless the 9 squares surrounding it are empty. One strategy is to build a large box around those spots with other rooms/road so that he has less possible locations to move to.</p>
</label>
    </div>
  </label>
  
</div>
