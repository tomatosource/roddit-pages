</a>
    </h2>

    

    <div class="commentList">

      <label for="m8qnzay" class="commentText"><p>From <a href="http://Globe.com" target="_blank">Globe.com</a></p>

<p>By Gary Washburn</p>

<p>INGLEWOOD, Calif. – Two and half years into the Joe Mazzulla era in Boston, trust has been established in this regime. The Celtics players may not always agree with the decisions of their head coach, but they respect them because as eccentric of a personality as Mazzulla possesses, they know his only concern is victory.</p>

<p>Mazzulla appeared to hint of his concern when the Los Angeles Clippers announced their top four scorers would all miss Wednesday’s matchup at the sparkling and sometimes overwhelming new Intuit Dome.</p>

<p>The Celtics struggle with shorthanded teams. And those teams are often more dangerous because their complementary players get an unlikely opportunity to play major minutes and become primary parts of the offense.</p>

<p>That was the case here, when the trio of Amir Coffey, Derrick Jones Jr., and Kevin Porter Jr. took turns gashing the Celtics&rsquo; defense for the first three quarters.</p>

<p>The Celtics needed a spark and Mazzulla had no issue perhaps bruising the ego of his regulars, who looked befuddled at times against the Clippers upstarts. He pulled Jaden Springer out of moth balls to check Porter Jr., who scored 13 of his 26 points in a third period that saw both teams combine for 19 turnovers.</p>

<p>Springer, who had yet to gain traction in Mazzulla’s rotation after nearly a full year in Boston, changed the game with his defense and perhaps offered the coach another game-changing defensive option in the second half of the season. Springer held Porter scoreless in the fourth period and then added a key 3-pointer in overtime to ensure the Celtics would prevail, <a href="https://www.bostonglobe.com/2025/01/23/sports/celtics-clippers-jaden-springer/?p1=Article_Inline_Text_Link" target="_blank">117-113 in overtime</a>, on a night they didn’t play well.</p>

<p>Springer played a season-high 20 minutes, just the second time this season he’s played more than 8 minutes, and scored 8 points with 4 steals and 2 rebounds as the Celtics avoided yet another late-game collapse.</p>

<p>Those fourth-quarter and overtime bumbles were overshadowed by Mazzulla’s choice of using Springer as a game changer. He took somebody’s minutes in his stint, perhaps some from Payton Pritchard and Sam Hauser with Jrue Holiday sitting out with a shoulder injury. But Mazzulla was hardly concerned with bruised feelings.</p>

<p>Springer’s teammates cheered vigorously from the bench when he nailed a corner three with 34.4 seconds left for a 115-110 lead. It was his time, and they had to acknowledge that.</p>

<p>“I think I’ve said this before, I think one of the greatest gifts a locker room can give a coach is the freedom to do what he thinks is best to win a game,” Mazzulla said. “There’s a hierarchy, a process, but at the same time, on every given night there’s an opportunity to go to something that could give us a chance to win.</p>

<p>“It’s a credit to the guys for that trust and that communication. I think that’s on them. They trust each other. They know we’re trying to win. I like the fact that they were cheering for him. He did take someone’s minutes but he did it because he was helping us win.”</p>

<p>Springer’s presence changed the game completely. Porter Jr. was picking apart the Boston defense with contested fadeaways. No previous defender even impacted his shot. He was completely comfortable. Porter, the former first-round pick who has had a troubled career because of off-court issues, has always been a gifted scorer and he was toying with the Celtics before the burly, physical Springer entered late in the third quarter.</p>

<p>His size and aggressiveness forced Porter off of his preferred spots. He passed or forced shots. He couldn’t overcome Springer’s strength.</p>
