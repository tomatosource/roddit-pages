

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/6ay5jew9rpmf1.png"><p>Today on &ldquo;Why is my map bricked&rdquo;</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/6ay5jew9rpmf1.png" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="nbzdxgx" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Positive-Builder-807</div>
        <div>7 | 11 hours ago </div>
      </div>
      <label for="nbzdxgx" class="commentText"><p>Yeah.. same thing happened to me lol. I’ve had a ton of bugs like this that have bricked maps. It’s super frustrating. A lot of them seem to be related to normal mobs spawning where bosses should.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="nbzg4tb" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>GM43RD</div>
        <div>2 | 11 hours ago </div>
      </div>
      <label for="nbzg4tb" class="commentText"><p>From what I can tell they are spawning a rare in the same location as the boss to guide the player to that location. The “deadly” boss map require you to deactivate three items in surrounding maps, and these items are located in the boss arena.</p>

<p>Since some bosses spawn in an opening that we cannot access it’s an auto bricked map if you are melee or they have the proximity modifier</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nbzxqhz" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>LordAlfrey</div>
        <div>3 | 8 hours ago </div>
      </div>
      <label for="nbzxqhz" class="commentText"><p>I think this is happening because of the new boss maps, some of them spawn their beacons in boss rooms, so maps need to have boss rooms even if the map doesn&rsquo;t have a boss. I guess they solved this by always spawning the boss room, and they probably solved that by spawning a rare in the same way they would otherwise have spawned a boss, which is what spawns the room.</p>

<p>Just a guess though.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nc0a4od" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>qualitygoon</div>
        <div>3 | 7 hours ago </div>
      </div>
      <label for="nc0a4od" class="commentText"><p>Blooming field rare in the boss area also bricks the map if you kill it before other rares</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nc0ugty" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Kalleh03</div>
        <div>1 | 5 hours ago </div>
      </div>
      <label for="nc0ugty" class="commentText"><p>I was able to shoot it with crossbow shot, so if you have any skill or spell that goes straight forward, try that.</p>

<p>Ran around trying to hit with totems and siege cascade, that didn&rsquo;t work at all.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nc13hw5" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Professional_Realist</div>
        <div>1 | 4 hours ago </div>
      </div>
      <label for="nc13hw5" class="commentText"><p>Did this on the Blooming Fields map and a rare will spawn where the Crowbell arena is, and if you fight that rare the door wont reopen. So you have to do it last.</p>

<p>Additionally I cant do my first Dangerous Boss map, says the instance isnt valid cant access the map.</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
