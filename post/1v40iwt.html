      <label for="oz7b8f0" class="commentText"><p>Hey guys!</p>

<p><a href="https://poe.ninja/poe2/profile/Zoia-0314/runesofaldur/character/KallTrapAssassin" target="_blank">https://poe.ninja/poe2/profile/Zoia-0314/runesofaldur/character/KallTrapAssassin</a></p>

<p>Really fun and wacky build. For those wanting to try it out a lot of ascendancies work. Ritualist, Pathfinder, and Titan seem very good. Lich obviously has potential as well. You can play this on whatever you want I think.</p>

<p>Conductive Runes is weird in that it detonates when enemies touch it. This is very bad an inconsistent but delayed reaction solved this by making all the runes explode. Scaling reduced skill effect duration makes these pop very fast. I do not think titan is needed to scale this down further for those asking.</p>

<p>It doesn&rsquo;t scale off your weapon so we gotta use weird things to scale it. Olrovasara and Mjonir have potential. So does tangletongue with palm of the dreamer. I dont think anything is beating widowhail cheese though in terms of flat damage. I was pretty all in on the bow tech so never got around to testing the other techs though.</p>

<p>Build plays a lot like d2 trap assassin for those that liked that vibe. In general this isn&rsquo;t the best build out there for what it costs. It&rsquo;s a fun off meta build though.</p>

<p>Damage - <sup>4</sup>&frasl;<sub>5</sub></p>

<p>Cost - <sup>4</sup>&frasl;<sub>5</sub> (1.5k divs final setup)</p>

<p>Speed - <sup>4</sup>&frasl;<sub>5</sub></p>

<p>AoE - 2.<sup>5</sup>&frasl;<sub>5</sub></p>

<p>D2 Vibes - <sup>6</sup>&frasl;<sub>5</sub></p>

<p><a href="https://www.youtube.com/watch?v=jugMp2EfrOI" target="_blank">Video Guide</a></p>

<p>Cheers!</p>
