

<html>

    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;

}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>

    <h2>

    </h2>

    

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="nattopp" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Complete-Value7658 | customflair</div>
        <div>1 | 5 minutes ago </div>
      </div>
      <label for="nattopp" class="commentText"><p>Dude you literally have all info on screen. Your network spikes up. Problem is your internet or game server. If you want to get rid of it, change network type in settings in main menu to predictive (wasd movement won&rsquo;t work with it)</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="natbyr1" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>TheGreatandMightyMe</div>
        <div>0 | 2 hours ago </div>
      </div>
      <label for="natbyr1" class="commentText"><p>My gaming group are all having this as well.  Happens pretty frequently when you go from no monsters onscreen to a medium or larger pack onscreen.  It tends to alternate between cpu and network spikes.  Only solution we&rsquo;ve found is to try and keep enemies onscreen all the time, and approach new packs carefully.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="natcll7" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>thatsrealneato</div>
        <div>0 | an hour ago </div>
      </div>
      <label for="natcll7" class="commentText"><p>The thing that worked for me and fixed most of my shader issues including frequent crashes was this: <a href="https://www.reddit.com/r/pathofexile/comments/165h4pv/constant_shader_recompilation_steps_to_clear_the/" target="_blank">https://www.reddit.com/r/pathofexile/comments/165h4pv/constant_shader_recompilation_steps_to_clear_the/</a></p>

<p>Basically, there&rsquo;s a separate directx shader cache shared between games. Clearing this cache as well as the PoE2 shader cache in %APPDATA% fixed everything for me (note that it will need to recompile all shaders the first time you encounter them so you will get some slow loading times at first, but should be smooth after that).</p>
</label>
    </div>
  </label>

</label>

      <label for="natfzwd" class="commentText"><p>What I&rsquo;m about to say may sound stupid: Have you tried V-Sync on/off/adaptive? Full-screen / Windowed / Windowed Full-screen? Change the upscale? Buffering? Do you have another monitor or TV to try on and see if it still happens?</p>
