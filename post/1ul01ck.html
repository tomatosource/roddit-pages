

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/ntsl6awh1pah1.jpeg"><p>Any advice to level 100 faster?</p>

<div class="commentAndChildren">

    <div class="comment">
      <div class="commentHeader">
        <div>mukhaliniov</div>
        <div>1 | 20 minutes ago </div>
      </div>
      <label for="ov077pa" class="commentText"><p>Increased xp, monster effectiveness, pack size, and deliriousness all directly impact XP gain. Combine 3 of them and you should be able to speed up your leveling by twice. Same goes for map. Always go for pack size and effectiveness. T15. Corrupted. Run the judo node that adds a mod and increased tablet effect. If you have the money, go for t16s. T16 gives almost double the XP.</p>
</label>

      </div>

</label>

<div class="commentAndChildren">

        <div>mukhaliniov</div>
        <div>1 | 16 minutes ago </div>
      </div>
      <label for="ov082hq" class="commentText"><p>That works too. Judo gives you 0-40 increased tablet effect. That’s like 0.66 extra tablet. Also the additional mod could very well add 10% effectiveness or pack size. It is more random but more rewarding on average.</p>

<div class="commentAndChildren">
  <input id="ov07y7l" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Inside_Page_7706</div>
        <div>1 | 16 minutes ago </div>
      </div>
      <label for="ov07y7l" class="commentText"><p>I was using 4 different tablets with 18% increase experience and 30-35% increased rare monsters, effectivnes then does not matter. (You are getting around 134% increased xp per map) Just pick hilda 8% inc effect per diff tablet. Also try to max out shrines per map and pick xp shrine on atlas, then you are getting like 1-2 xp shrines per map which is huge. I was getting 17-18mln xp/h doing 98-99. Going to 100 is tedious task that grants nothing really and even with 18mln xp/h would take over 40-48 hours of non-stop farm. 98-99 you can do in 18-22 hours.</p>

</div>

  </body>
</html>
