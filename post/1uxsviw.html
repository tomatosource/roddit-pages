

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/ak3nu5txpidh1.png"><p>Hit this while spamming, worth to proceed &lsquo;as normal&rsquo;?</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/ak3nu5txpidh1.png" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">

    <div class="comment">
      <div class="commentHeader">

      </div>
      <label for="oxtw38v" class="commentText"><p>Why are you doing all of this on a one socket wand?</p>
</label>
    </div>

  <div class="commentList">
    
      
<div class="commentAndChildren">

</label>

  </label>
  
</div>

    
  </div>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="oxtxef9" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Earthboundplayer</div>
        <div>3 | an hour ago </div>
      </div>
      <label for="oxtxef9" class="commentText"><p>Its a one socket wand and people seem to really be gravitating towards runeseekers call so idk if it&rsquo;s worth fishing for T1 crit chance. Do the rest of the craft for sure but maybe just settle for the first Crit chance or Crit bonus mod you see for the desecration. Its a 1750 weight for T3 and above for both of those mods so your chances of getting it are decent. I wouldn&rsquo;t do more than a few decorations.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="oxttdvw" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>sakaloko</div>
        <div>2 | 2 hours ago </div>
      </div>
      <label for="oxttdvw" class="commentText"><p>How many thousands of divs you have to burn on this?</p>

<p>I&rsquo;d say you can make a pretty decent wand out of it in under 3-4k</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="oxtxtvs" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>zethras</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="oxtxtvs" class="commentText"><p>There is a couple from 120div for what you are ttying to craft (cheapest is a 80div santified).</p>

<p>10 omen is like 150div? Im not saying you shouldnt craft it. But just be sure not to go over spaming the omen of light. Normally crafts in which you want to spam omen of light are 2 socket or around 400div.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="oxtyiee" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Eustia_Astraea</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="oxtyiee" class="commentText"><p>If this wand is what your build needs, it’s totally fair to just drop some omen of light into it. Just remember to put in celestial alloy before perfect exalt since the alloy act as a mana mod and block it from exalting at prefix. You might want to whittle a few times if you didn’t get the prefix you want.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="oxu1lfo" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Equanimous_Ape</div>
        <div>1 | 44 minutes ago </div>
      </div>
      <label for="oxu1lfo" class="commentText"><p>Wait, what were you looking for if it’s not this specific affix?</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="oxu2kw1" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>DIEDPOOL</div>
        <div>1 | 37 minutes ago </div>
      </div>
      <label for="oxu2kw1" class="commentText"><p>you can try perfect exalt slam for suffix, if it misses overwrite with suffix essence for cast speed. Then ancient jawbone. If that fails, annul and pray it hits a suffix
last time I tried for t1 or t2 crit on a wand it took me 2100 chaos btw</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
