

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://v.redd.it/6h2rwvdg3ceh1"><p>Acolyte of Madness</p>
</a>
    </h2>

    

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="oyn59cy" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>FattestRabbit | 💀 Minion Enjoyer</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="oyn59cy" class="commentText"><p>PoB? </p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="oyn98a2" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>laFleuere</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="oyn98a2" class="commentText"><p>I did build something similar - <a href="https://poe.ninja/poe2/pob/260cc" target="_blank">https://poe.ninja/poe2/pob/260cc</a> (I sold all the gear already, but this is the last snapshot from pob). It&rsquo;s more of a min-max setup and I&rsquo;ve managed to reach 100K average hit on Harbinger with that.</p>

<p>The point is - it&rsquo;s very hard to scale Harbinger&rsquo;s damage. It&rsquo;s not attack nor spell nor melee. Only tags we&rsquo;ve got are Physical and AoE. And we have quite a low flat dmg most of the time (cause % of enemy&rsquo;s life apparitions are spawned only on enemy&rsquo;s death). So the only way to circumvent this limitation is to spawn hell ton of them. And Acolyte of Chayula do solve this and it&rsquo;s kinda broken - the tornado have a fixed aps meaning we don&rsquo;t need to scale Attack speed at all. We can instead focus on duration and CD so that tornadoes last longer.</p>

<p>And because there are low amount of scalers - we can go full focus on rarity without losing DPS OR Defence (I reached 300% IIR easily with this setup).</p>

<p>For defence - I took Runeforged Brass Dome (For big flat Ward), Runeforged Svallin (Ward + lucky block + ward on block) and Refutation (with ~72% effective block chance, putting it in Cast on Block automate it enough. Plus, cause we&rsquo;re focusing on CD and duration - it upped Refutation to 10 seconds duration with 4 seconds CD, which is very good).</p>

<p>The rest are optional.</p>

<p>Edit: updated pob (it had 2 additional jewels allocated by error)</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
