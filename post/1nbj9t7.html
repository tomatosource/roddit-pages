

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/2h8ebq2dvwnf1.png"><p>Seriously tho is it just me, or do I feel like I do more damage without the tempest-bell.</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/2h8ebq2dvwnf1.png" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="nd26ecl" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>YangXiaoLong69</div>
        <div>5 | an hour ago </div>
      </div>
      <label for="nd26ecl" class="commentText"><p>I mean, that darned bell is just mad wonky overall</p>

<p><a href="https://preview.redd.it/bzam6xcx1xnf1.jpeg?width=216&amp;format=pjpg&amp;auto=webp&amp;s=2e82fd020ceae44da3d3b37e08133acc90e5c8ce" target="_blank">https://preview.redd.it/bzam6xcx1xnf1.jpeg?width=216&amp;format=pjpg&amp;auto=webp&amp;s=2e82fd020ceae44da3d3b37e08133acc90e5c8ce</a></p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="nd2792u" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>blastedgun</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="nd2792u" class="commentText"><p>I think it might be due to the ice-strike normal-strike(s) using the same functionality as a normal punch, and the normal punch seems to only hit 1 entity at a time sooo <strong>maybe</strong>. But yea the bell is mad wonky.</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nd267zo" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>blastedgun</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="nd267zo" class="commentText"><p>Speculation mainly because during the campaign when I tried using the tempest-bell even if it was <strong>in</strong> the boss my character hollow-palm couldn&rsquo;t hit it with ice-strike; only the last-strike was hitting both the boss and tempest-bell but to hit the bell you need to put it infront of the boss/you.</p>

<p>But tempest flurry can hit both no problem and during some tanky boss I&rsquo;ve ran into, despite me hitting the tempest-bell with ice-strike it felt like I was only hitting the tempest-bell and not the boss even tho the tempest-bell was in the same position; and like I stated earlier it leads me to think that ice-strike normal strikes seems to only hit 1 &ldquo;entity&rdquo; at a time. (Maybe because the ice-strike normal-strike is using the same functionality as the normal punch hence that)</p>

<p>Anyways I&rsquo;m just wondering so that maybe it can be changed by GGG to hit both since tempest flurry can hit both without worries, but I could be wrong and ice-strike &ldquo;normal&rdquo; strikes <strong>might</strong> be hitting both; and I do hope someone can debunk it.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nd2e7bq" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Kaldakai</div>
        <div>1 | 5 minutes ago </div>
      </div>
      <label for="nd2e7bq" class="commentText"><p>With hollow palm and ice strike (and other skills) there are reach/range problems, i tried ice strike with concentrated effect and certainly i could not hit some mobs and i cant hit the boss and the bell, or even if i attack a moving monster i fail to even hit it.</p>

<p>For me what mostly fixed those problems was the node that added +2 to melee strike range &ldquo;reaching strike&rdquo; notable node.</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
