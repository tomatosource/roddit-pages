      <label for="p05xbur" class="commentText"><p>first things first, always price check. you can do it ingame or with a third party app. (but make sure to check it with searching with corruption OFF as people are looking to con you, making you believe something is worth little.)</p>

<p>Typically for us to know how good it is, you have to press alt and hover over it and look at the top where it sais &ldquo;item level&rdquo;. If its 80 or higher its worth something.</p>

<p>If not it’s not worth much.<br>
I say typically because in this case, the type of bow (cavalry) is not a desirable crafting base so it’s not worth much in any case as is. However if you are not in the end game yet(like around character level 70-85) you can still craft it for a decent bow for yourself, if you are a bow user of course.</p>

<p>next how much currency do you have? end game crafting takes alot of currency, mostly lots(sometimes 100s) of chaos orbs, but also expensive omens. the final gear you are aiming for will be dictated on how much you can afford to throw at it, with a bit of luck. You can also do a cheap craft where the final outcome is less deterministic and you can get a great to bricked item depending on rng.</p>

<p>for the sake of teaching you VERY basic crafting, you would greater transmute to get a mod, greater augment to get another mod, greater regal for a third mod and make your item rare.  (dont bother crafting with normal currency unless you are still in campaign or jewel crafting)  Then you would use a preserved jawbone/rib/collarbone/cranium to desecrate it, go to well of souls to choose a desireable mod.  This desecration part depending on the item can be very deterministic (like for bows you can 100% get a desireable mod, attack speed) or can be very rng.  finally activate omen of greater exaltation and use a greater exalt to get the final 2 mods.  if its a good craft you will use the corresponding currency to get the quality to 20% and if it didnt have rune slots use artificer orbs to add slots and then your done.  socket in runes for your liking.</p>

<p>I have no clue if you know about prefixes/suffixes and other things that go into crafting so best to go on youtube search for a very noob friendly guide (diztoh and xthefarmerx are the most popular crafter youtubers i think, not sure if they are the best for beginners.  but much better for noobs then fubgun imo)  and learn more from there.</p>

<p>let me know after all that you want to know more.</p>
