<p>We run Malice (Cost 0 spirit), Mana remnants, Blasphamy 2x enfeeble/temp chains, Convelescence, Blink, Time of Need. Correct me if I&rsquo;m wrong but I don&rsquo;t really see much benefit adding more aura&rsquo;s, this game doesn&rsquo;t have aura&rsquo;s like Haste/Grace/Determination as a gem. Haste is available as minion aura but unreliable when you move too fast. Stacking so many dps modifiers on the mace you&rsquo;re essentially doubling the damage of your carry which is pretty good considering PoE2 has almost no real dps aura buffs. So in PoE1 an aurabot can essentially triple or een quadruple a carry damage the last time i played.</p>
