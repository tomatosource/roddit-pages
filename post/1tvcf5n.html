

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://v.redd.it/1sveepsldz4h1"><p>Long map should get more checkpoints</p>
</a>
    </h2>

    

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="opg734b" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>SniperSAKH</div>
        <div>7 | 3 hours ago </div>
      </div>
      <label for="opg734b" class="commentText"><p>Long map should be smaller</p>

<p>Change my mind</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="opgb3dp" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Admins_Always_Badmin</div>
        <div>3 | 2 hours ago </div>
      </div>
      <label for="opgb3dp" class="commentText"><p>All maps should be smaller and less like mazes.</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="opfy3yo" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>convolutionsimp</div>
        <div>6 | 4 hours ago </div>
      </div>
      <label for="opfy3yo" class="commentText"><p>Agree, but also checkpoints are such a bandaid. They&rsquo;ll never be able to place checkpoints at exactly the right places with how maps are dynamically generated. Unless you want your whole map littered with 50 checkpoints.</p>

<p>I think more checkpoints are fine for the few &ldquo;long straight&rdquo; maps, but for many other maps they need to fix the damn layouts so that we don&rsquo;t need dozens of checkpoints to make moving around not feel miserable.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="opg0uiz" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>1CEninja</div>
        <div>3 | 3 hours ago </div>
      </div>
      <label for="opg0uiz" class="commentText"><p>Lack of player mobility is a huge factor in this too.</p>

<p>I&rsquo;m not asking for Mageblood quicksilver flasks plus shield charge plus frostblink level mobility, but someone accurately described the first half of the campaign as &ldquo;ice skating through mud&rdquo;, and the game basically requires 30%+ movement speed on your boots to feel <em>just okay</em> if you aren&rsquo;t playing deadeye.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="opg319s" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>convolutionsimp</div>
        <div>3 | 3 hours ago </div>
      </div>
      <label for="opg319s" class="commentText"><p>Yup, but it seems like they are really against PoE1-like movement skills, so I doubt we&rsquo;ll ever get that. In PoE1 even if a layout sucks you can quite quickly move from one end of the map to the other with your movement skills so the bad layouts aren&rsquo;t much of an issue.</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

    
  </div>
  
</div>

        
      
    </div>
  </body>
</html>
