

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/hjyi7wfrtzte1.png"><p>Is it just me?</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/hjyi7wfrtzte1.png" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="mmde9tz" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>convolutionsimp</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="mmde9tz" class="commentText"><p>Already specced out of the wisps, feels like a waste of time. After seeing the footage and knowing GGG I already knew that&rsquo;s how it&rsquo;s gonna be. Who thought it&rsquo;s a good idea to lead the player across half of a huge zone at a snails pace? By the time I follow a wisp I can complete another whole map.</p>

<p>If they want to keep it, the wisp should just go inside the player and jump out when you encounter a rare.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="mmdeo3m" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>brylex1</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="mmdeo3m" class="commentText"><p>definitely a waste of time</p>
</label>
    </div>
  </label>
  
</div>

    
      
<div class="commentAndChildren">
  <input id="mmdh8x7" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>NotCoolFool</div>
        <div>1 | 31 minutes ago </div>
      </div>
      <label for="mmdh8x7" class="commentText"><p>Omg this is so true 😂😂😂 no chance I’m deviating from my already massively too long treck to find an exit to go chase a monster that moves 3 x faster than me and will drop me absolutely nothing of any use 🤮🤣🤣🤣</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="mmdibkj" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>90kg185iq5cm | Zana-Enjoyer</div>
        <div>1 | 23 minutes ago </div>
      </div>
      <label for="mmdibkj" class="commentText"><p>That 95% of the drops from wisps are trash doesn&rsquo;t bother me that much, we don&rsquo;t get much loot anyway, BUT the range these wisps disappear is a joke. You follow one - it &ldquo;touches&rdquo; monsters - you want/need to fight them, that includes sometimes to &ldquo;kite&rdquo; in another direction - and the wisp is gone.</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
