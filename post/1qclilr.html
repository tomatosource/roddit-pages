

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://www.reddit.com/gallery/1qclilr"><p>Invoker Ascendancy point - &ldquo;&hellip;and Protect me from Harm.&rdquo; and For Utopia Stun Charm interaction</p>
</a>
    </h2>

    

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="nziy6k1" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>mcbuckets21</div>
        <div>6 | an hour ago </div>
      </div>
      <label for="nziy6k1" class="commentText"><p>Doesn&rsquo;t work. Node lets your evasion rating apply to the armour dr calculation. It doesn&rsquo;t give you armour which the charm increases.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="nziysuj" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>tommydelo</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="nziysuj" class="commentText"><p>Wouldn&rsquo;t it work if you scaled Armour a lot? Like hybrid Armour/Evasion items?</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nzixunv" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>dampas450</div>
        <div>5 | an hour ago </div>
      </div>
      <label for="nzixunv" class="commentText"><p>It should not work since evasion is a seperate stat. If you convert evasion to armor rating, like with Iron Will keystone, then the charm or the Goregirdle belt work as expected</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nzj0sca" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Bigboysama</div>
        <div>2 | an hour ago </div>
      </div>
      <label for="nzj0sca" class="commentText"><p>200% of 0 armor is 0. Evasion and armor are still separated in calculation. This passive node do not combine them into 1 stat, it&rsquo;s still separate. It just modifies evasion to also work like armor, nothing more. </p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nzj9ph0" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Parcyvaal</div>
        <div>1 | 8 minutes ago </div>
      </div>
      <label for="nzj9ph0" class="commentText"><p>Doesnt work and you should never pick that node anyway</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
