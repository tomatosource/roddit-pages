      <label for="nxbzimv" class="commentText"><p>From Chris Forsberg:</p>

<p>Perhaps the most surprising recent storyline as the Boston Celtics flip the calendar to 2026: The Luka Garza resurgence.</p>

<p>There was a point in mid-December where it felt like Garza might stay glued to the Boston bench. The team had struggled so mightily in his floor time through the first 15 games of the season that, even with rebounding woes and a lack of pure size, the Celtics elected to simply go small when Neemias Queta wasn’t on the court. Garza logged just 27 total minutes while piling up seven DNPs over an 11-game stretch.</p>

<p>But <a href="https://www.nbcsportsboston.com/nba/boston-celtics/live-updates-raptors-highlights-score-2/755099/" target="_blank">on Dec. 20 in Toronto</a>, Joe Mazzulla went back to Garza. And the 27-year-old big man was ready for his opportunity.</p>

<p>Garza is averaging 10.7 points and 5.8 rebounds over 22 minutes per game in his last six games while Boston has posted a 5-1 record in that span. Garza is shooting 55.6 percent beyond the 3-point arc, and 72 percent inside of it, all while making good things happen with a heavy helping of hustle and grit.</p>

<p>Now it feels like Mazzulla is struggling to take Garza <em>off</em> the court. The Celtics’ best basketball in this stretch has often featured Garza alongside an energy-gushing bench unit.</p>
