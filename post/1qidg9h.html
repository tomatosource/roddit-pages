.commentList {

.commentAndChildren {

.comment {

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>

      <label for="o0qsn7q" class="commentText"><p>This is a good staff and good crafting introduction. Sadly crafts are relatively predictive and profitable so many people have been crafting them and +5 just doesn’t do it anymore. I’m pretty sure this craft  won’t hit any desired value without hitting spell damage t1 with a +5. Even a successful sanctify to 6 won’t sell with that desecration.</p>

<p>Now that you understand the craft id only recommend starting from +7. Staffs are really only selling with 7 or 6 all, crit and cast speed for suffix.</p>

<p>This is a good craft but it’s just not done. Also I’ve learned that since redos are so expensive this league that the goal is more quantity. Knowing mana will hit 7:10 times, you need to do 10 to have 3 be gg.</p>

<p>Either way, I think you need to keep rolling at well of souls, even a 3rd gain as will be better than this. Keep up the good work though you’re getting there!</p>
