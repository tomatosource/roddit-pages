

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://youtu.be/EXf-jQPWnSw"><p>Archdemon Infernalist, the boss one-shot specialist</p>
</a>
    </h2>

    

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="nvridim" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>swedg3</div>
        <div>2 | 2 hours ago </div>
      </div>
      <label for="nvridim" class="commentText"><p>This is a 100% crit archmage demon form infernalist that one-shots even the most juiced bosses in the game. For defenses we run Mind over Matter and mana stack, which provides huge damage with Archmage.</p>

<p>The Black Doubt turns our huge mana regen into life recovery that can be scaled by life recovery mods. I&rsquo;m using an Undying Hate setup to attain 1k passive life recovery that means I only start to degen at 50+ stacks of Demonflame and can maintain it while mapping comfortably up to 65-70 stacks for a 2.5x more damage multiplier on top of everything else.</p>

<p>Current character investment is probably around 20-30 divines, still has a ton of room to scale, final version would have 6.5k mana or so. I probably won&rsquo;t run this undying hate setup in the final version.</p>

<p>The build functions without demon form at all and taking Beidat&rsquo;s Will is a solid choice, but demon form is really fun and mobile so trialing this out.</p>

<p>Full guide once I figure out the build some more!</p>

<p>Current character: <a href="https://poe.ninja/poe2/profile/swedgelord-0701/character/Swedgeferno" target="_blank">https://poe.ninja/poe2/profile/swedgelord-0701/character/Swedgeferno</a></p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
