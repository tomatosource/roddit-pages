

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/dy3zvn46k5bf1.jpeg"><p>Is there a way to unlock this node?</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/dy3zvn46k5bf1.jpeg" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="n1k8k6p" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Riven-DY</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="n1k8k6p" class="commentText"><p>You can path there, but if your class doesn’t start there it will be far from an ideal use of points.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="n1k8qej" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Ragnapocageddoclysm</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="n1k8qej" class="commentText"><p>Each class has only their own two starting nodes next to each other to choose from. You&rsquo;d have to go all the way around, which is not practical.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="n1k8lbm" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>dannynoonanmke</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="n1k8lbm" class="commentText"><p>Ye sit is just not a starting point you can access from your chose class. There will bet better nodes you can get in your class though or you can pick nodes that come around to
That.  There are also gems that let you reach farther out to get nodes you can’t normally access</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="n1kb828" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>RimGz</div>
        <div>1 | 40 minutes ago </div>
      </div>
      <label for="n1kb828" class="commentText"><p>not a single class start there yet, should be for druid and templar</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="n1k8j35" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>HeyThereZac</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="n1k8j35" class="commentText"><p>If that’s not your starting point you’ll either have to go all the way around or anoint an amulet with it. (And there are much better ones to anoint if that’s what you are wanting to do.)</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="n1k9xka" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Zyskow</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="n1k9xka" class="commentText"><p>Look up how to instil an amulet, you can get the node with delirium drop &ldquo;enchants&rdquo; recipies typically for one node.</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
