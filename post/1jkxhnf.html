

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://v.redd.it/d19vqpqvc6re1"><p>I think Rathbreaker might be broken lol</p>
</a>
    </h2>

    

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="mjz3xlf" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>tooncake</div>
        <div>4 | 3 hours ago </div>
      </div>
      <label for="mjz3xlf" class="commentText"><p>This sometimes happens to random bosses. The common one for me is Mektul (Molten Vault). If you managed to spam too much damage or continuous, speeding damage, he&rsquo;d randomly just stop and stand there &lsquo;til you kill it.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="mjzbfba" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Insila</div>
        <div>1 | 42 minutes ago </div>
      </div>
      <label for="mjzbfba" class="commentText"><p>I had this happen to that guy as well. It makes the fight a tad bit easier.</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="mjyyhtl" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>grayjacanda</div>
        <div>2 | 4 hours ago </div>
      </div>
      <label for="mjyyhtl" class="commentText"><p>He doesn&rsquo;t want to fight down there; in fact I think if he falls down he can become invulnerable. Game wants you to fight him on his home turf&hellip;<br>
I did notice that he was regenerating pretty fiercely during your fight. Not sure what would have caused that.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="mjyyxhc" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>pushamanplunder7</div>
        <div>2 | 3 hours ago </div>
      </div>
      <label for="mjyyxhc" class="commentText"><p>Yeah I know he&rsquo;s normally territorial. He usually wont even follow behind as far as he did on this occasion if you try to flee. He actually made it to the bottom of the path, nearly stepping foot on the lower level before his ai finally followed standard protocol and turned back.</p>

<p>It seemed as if once I ran back up there he was locked in a neutral state and no matter what I did I couldn&rsquo;t get him to trigger aggro. I&rsquo;m assuming that&rsquo;s why he kept regenerating. Idk tho. Just found this a bit strange and kinda funny too lol figured I&rsquo;d post it n see if anyone else has encountered this</p>
</label>
    </div>
  </label>
  
</div>

    
      
<div class="commentAndChildren">
  <input id="mjz1n4c" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>heresdustin</div>
        <div>2 | 3 hours ago </div>
      </div>
      <label for="mjz1n4c" class="commentText"><p>He will regenerate health if you “leave the arena” but that didn’t seem to be the case here. Although the game sure thought it was!</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="mjz498p" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>pushamanplunder7</div>
        <div>1 | 3 hours ago </div>
      </div>
      <label for="mjz498p" class="commentText"><p>That&rsquo;s what I thought was most likely the case here lol for whatever reason I couldn&rsquo;t trigger aggro to reinitiate the fight so homie just kept healing up with incredible speed 😂</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

    
  </div>
  
</div>

        
      
    </div>
  </body>
</html>
