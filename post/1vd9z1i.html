      <label for="p17n8rh" class="commentText"><p>Ruetoo has a despair build at multiple budgets which is the one I&rsquo;m running: <a href="https://mobalytics.gg/poe-2/profile/ruetoo/builds/gemling-impending-doom" target="_blank">link</a></p>

<p>Otherwise <a href="https://mobalytics.gg/poe-2/profile/ichigo-wnrmf9/builds/e88a81d3-3bec-4f42-b27d-48193371c7ce" target="_blank">Ichigo</a> and <a href="https://mobalytics.gg/poe-2/profile/cyclon-definitiv/builds/doomcaster-gemling" target="_blank">Definitiv</a> are the other 2 builds I&rsquo;m aware of. Can look up poe ninja otherwise.</p>

<p>Based on my experience, this is what I&rsquo;d recommend:</p>

<ul>
<li>Selling your Runeseeker&rsquo;s (assuming it&rsquo;s uncorrupted) then buying a corrupted 5 socket one with the +3 curse Legacy rune. If you can, try get one with the +1 chaos corruption. This should give you a few hundred more divs for the build.</li>
<li>Get a 5% life cost, dmg/crit per 100 mana Rathpith. It is manageable with Vitality support gems, Life on Kill (on jewel or support gem), Vigorous Remnants node, Time of Need, etc. Don&rsquo;t need all to make it sustainable.</li>
<li>Start with Morior body armour, +Chaos/+Ele Res/+Spirit, preferably 5 socket but 4 is fine</li>
<li>Ring, Amulet, Jewels, Belt (Mageblood, hopefully you have one already) will be the other costly items</li>
<li>For rare jewels, can start with cheaper ones before crafting or buying 5 mod/inc effect jewels</li>
</ul>

<p>Good luck, build is a lot of fun and so clean. Scaling crit is quite difficult though.</p>
