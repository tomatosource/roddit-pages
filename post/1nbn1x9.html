

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/vpte6wg3vxnf1.png"><p>These 6 boys are my new best friends</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/vpte6wg3vxnf1.png" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="nd2tp8h" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>neoxx1</div>
        <div>6 | 8 hours ago </div>
      </div>
      <label for="nd2tp8h" class="commentText"><p>For me it&rsquo;s the weapon essences that are top. Perfect Essence of Battle, Haste, Flames, the phys one etc&hellip; Not that expensive and guaranteed profit.</p>

<p><a href="https://imgur.com/a/19HBMe9" target="_blank">https://imgur.com/a/19HBMe9</a></p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="nd3nuzh" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>jmsGears1</div>
        <div>1 | 5 hours ago </div>
      </div>
      <label for="nd3nuzh" class="commentText"><p>What are you doing to generate money with them? Like how are you crafting? I’ve been farming and I have had a few decent drops and have an ok amount of money but really not that much and wanted to get into crafting but so not have enough to really start the crafts I want to do :(</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="nd3v3su" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Concillian</div>
        <div>1 | 5 hours ago </div>
      </div>
      <label for="nd3v3su" class="commentText"><p>I don&rsquo;t profit craft, but the most obvious one to me (and how I made the weapon I use) is buy a weapon with good prefixes, fill suffixes and haste + battle to add onslaught and +skills.  Took me &amp;lt;2 div to make something that easily would have cost 5+.  I did win the 2 out of 3 to not remove the perfect haste mod with perfect battle, you can have to do a couple times if you get unlucky.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="nd3ycut" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>neoxx1</div>
        <div>1 | 4 hours ago </div>
      </div>
      <label for="nd3ycut" class="commentText"><p>Yep, crafting good maces specifically is rather cheap and very easy and deterministic.</p>

<p>Woolie made a good video about how to start from pure #% increased phys mod base, but you can also start from hybrid or flat if you know what you&rsquo;re doing.</p>

<p>I&rsquo;m at a point where I&rsquo;m buying high tier mace bases with T1/T2 phys, fully crafting them, corrupting and selling for A LOT if corrupt hits. Last one I sold for 100 div as visible on the image, I&rsquo;m also using a better one than the 100 div one myself. And there are 3 waiting to be sold, though probably for around 50-80 div each.</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

    
      
<div class="commentAndChildren">
  <input id="nd3yr79" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>neoxx1</div>
        <div>1 | 4 hours ago </div>
      </div>
      <label for="nd3yr79" class="commentText"><p>I craft maces, basically the same process as in Woolie&rsquo;s latest craft video.</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

</div>

        
      
    </div>
  </body>
</html>
