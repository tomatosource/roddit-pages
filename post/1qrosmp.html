

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>

<div class="commentAndChildren">
  <input id="o2puwu1" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>WhichWolfEats | customflair</div>
        <div>2 | 3 hours ago </div>
      </div>
      <label for="o2puwu1" class="commentText"><p>It’s a good modifier though like the best tor armour users. Are you using armour or just trying to get the spirit and es?</p>

<p>If you really wanted to remove armour the only way is the get lucky with anul or remove desecrate and force it onto suffix. Also you could 1:3 for essence for hits have reduced crit damage.</p>

<p>I wouldn’t change my suffix, the only thing I’d do here is omen of light cycle at the well for t1 armor/es #. Since you’re using spirit and have a good rolled % you cannot finish this without it. Flat es/ar should almost double your stats.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="o2px4k5" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>sdirie</div>
        <div>1 | 2 hours ago </div>
      </div>
      <label for="o2px4k5" class="commentText"><p>I actually just switched to a full ES Plant Druid but this thing is definitely making me think about a switch to Armour/ES but would need a full set to take advantage of the Armour increases to elemental damage so I’m just trying for this best outcome atm.  I was thinking I definitely want to get that armor percentage off with the omen of light.  What’s the best way to get the flat Armour/ES?  Do I need an Ancient Rib to have a chance for the flat Armour/ES because I’ve personally never seen it with a preserved rib desecration.  I really appreciate the input, thanks.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="o2pzrqj" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>WhichWolfEats | customflair</div>
        <div>2 | 2 hours ago </div>
      </div>
      <label for="o2pzrqj" class="commentText"><p>So it’s pretty much finished and I would only mess around with your desecration. So omen of light then rib and repeat. Only take flat #. You can use preserved and it’s sometimes the right move but these rolls are pretty good so I would probably try 1 or 2 ancients as they are cheapest of the ancient bones. Always always use echoes every time.</p>

<p>You can probably land t3+ flat in 3 preserved 3 lights. It could be less or more. Ancient should hit it in 2 and likely a higher tier. Could be more or less. I would probably use 2 ancients as flat is what scales all your other rolls.</p>

<p>I will say pure es is usually way better. Though armor is there and people do use it. The spirit will be nice and ele and res too. Just go for flat ok desecration and then maybe ancient orb or the one that increases quality gl</p>
</label>
    </div>
  </label>

      </div>
      <label for="o2q2w9b" class="commentText"><pre><code>I want to thank you again because your suggestion was definitely the way to go.  1 Omen of Light and an Ancient Rib followed by the Abyssal Echoes made this beauty.
</code></pre>

<p><a href="https://preview.redd.it/l45smu52mlgg1.jpeg?width=1300&amp;format=pjpg&amp;auto=webp&amp;s=0795b93de70e42cc183ac208e2d00d10d1ddf4f5" target="_blank">https://preview.redd.it/l45smu52mlgg1.jpeg?width=1300&amp;format=pjpg&amp;auto=webp&amp;s=0795b93de70e42cc183ac208e2d00d10d1ddf4f5</a></p>
</label>
    </div>

      </div>
      <label for="o2q3k8y" class="commentText"><p>Heck ya man congrats! Depending on how many divs you got you can probably push this up to 1k, it is super nice though!</p>

<p>Lastly you can use architect or the quality orb and squeeze a few more quality out of it. Sanctify could be nice and it won’t ruin the armour completely if unlucky. Otherwise corrupt and pray.</p>

<p>Congrats enjoy the plants I liked mine</p>
