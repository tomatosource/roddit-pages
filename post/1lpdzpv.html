

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/xjw9oymzybaf1.jpeg"><p>Any point in crafting this?</p>

	<div class="selfPostContainer">

<div class="commentAndChildren">

      </div>
      <label for="n0u3qxm" class="commentText"><p>It’s fine as is, a whittle would target the fire resistance first, which is already a decently rolled stat. High chance you get a worse stat, low chance to get anything better (crit chance or a better res maybe only better suffix to begin with)</p>

        <div>1 | 20 hours ago </div>
      </div>
      <label for="n0u3ycw" class="commentText"><p>But in terms of market value, probably somewhat low because it is not a pure ES helmet like other commenter said. Some people are playing with full evasion helmets, but not nearly as much as are using full ES</p>

<div class="commentAndChildren">

        <div>Melatonine_blyat</div>
        <div>1 | 20 hours ago </div>
      </div>
      <label for="n0u6esf" class="commentText"><p>Random question since you seem knowledgeable about poe but i doubled my evasion from 3k to 6k and i only went up like 10% evasion rate how does evasion work  And how evasion would i nees for like 90%+ evasion rate?</p>
</label>

      <label for="n0u7r0k" class="commentText"><p>Sarge2’s video about defenses, watch it on repeat, super helpful <a href="https://youtu.be/ggC5mxG5wgo?si=Ddvo9NkI7-R3vrQI" target="_blank">https://youtu.be/ggC5mxG5wgo?si=Ddvo9NkI7-R3vrQI</a></p>
</label>
    </div>
  </label>
  
</div>

    
      
<div class="commentAndChildren">

      <div class="commentHeader">
        <div>jaymo_busch</div>
        <div>1 | 20 hours ago </div>
      </div>
      <label for="n0u6ztj" class="commentText"><p>It is not a linear scale. I don’t know the exact formula, but the evasion% is an estimate based on your total evasion value (you can see the numerical value lower on your character screen) and it has diminishing returns, the more you get the less the % increases. I think the sweet spot for most builds is around 60-70% - on my build I am at 68% with 6708 evasion value</p>
