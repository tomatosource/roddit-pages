

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/3ejsup9fd0gg1.jpeg"><p>Bow craft help</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/3ejsup9fd0gg1.jpeg" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="o25fijl" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>ChokolatThundah</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="o25fijl" class="commentText"><p>Are you crafting for max profit or personal use? If I were using it on my SSF I&rsquo;d be happy with it, just quality+double socket, maybe throw a greater rune of lightning and a 30% increased ele damage soul core. Idk someone with more experience would know more, but if you really wanted to change the lightning damage, then yeah just omen of light and pray.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="o25h07i" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Stankchickenyo</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="o25h07i" class="commentText"><p>This is just for personal use , and I guess for profit try and mirror it or something. I kinda only want physical damage on this bow the desecration will change at the end of the craft. So I guess I just want to remove/reroll the increased elemental damage.</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="o25ilil" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>tenshosei</div>
        <div>1 | 39 minutes ago </div>
      </div>
      <label for="o25ilil" class="commentText"><p>Whittle with prefix erasure omen.</p>

<p>Elemental % and lightning flat are both 81, so its 50% chance to keep the flat lightning.</p>

<p>If i was to craft this, I would annul suffix away since they can be added pretty easily.</p>

<p>Then whittle until u get t1 hybrid or flat phys, then desecrate for the other. Then swap suffix with perfect battle and haste essence.</p>

<p>If at any point I get t1 surpassing/proj level I would invest more and get full t1 mirror level bow.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="o25lg55" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Stankchickenyo</div>
        <div>1 | 22 minutes ago </div>
      </div>
      <label for="o25lg55" class="commentText"><p>Ok! Two things, do I get rid of suffixes now or just let them be. Also if and when I do hit the desecration modifier what then? Do  I have one more <sup>50</sup>&frasl;<sub>50</sub> to not have to start over? Sorry this is my first attempt at crafting anything good.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="o25me5b" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>tenshosei</div>
        <div>1 | 17 minutes ago </div>
      </div>
      <label for="o25me5b" class="commentText"><p>Phys% is 82. Very safe.</p>

<p>I would just get rid of both suffix now with suffix annul omen.</p>

<p>Then whittle, it will pick either desecrated mod(lightning flat) or elemental% and give u another prefix or suffix.</p>

<p>Depends wat u want to keep or don&rsquo;t keep it will change ur craft steps as well.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="o25n5q4" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Stankchickenyo</div>
        <div>1 | 12 minutes ago </div>
      </div>
      <label for="o25n5q4" class="commentText"><p>OK, I kept the two suffixes ( I was impatient that’s on me) rolled it and hit the desecrated mod.  It was changed to T4 phys and accuracy. Kinda worst case scenario there. So what now? I appreciate your help.</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

    
  </div>
  
</div>

    
  </div>
  
</div>

        
      
    </div>
  </body>
</html>
