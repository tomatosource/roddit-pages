.commentText,

.commentHeader {

  color: #c39429;

.postTitle {

.commentAndChildren > .commentList {

}

.commentAndChildren > input:checked ~ .commentList {

}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {

  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

}

.selfPostImage {

}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}
