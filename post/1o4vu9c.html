

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/rd4e60exypuf1.png"><p>I will never play HC, how big is your number?</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/rd4e60exypuf1.png" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">

      </div>
      <label for="nj54wtz" class="commentText"><p>96 this league, at lvl 96. The majority of my deaths were weird one shots from ground exploisions near abyssal chests. I had 3 deaths when I completed the campaign, which is the real reason I don&rsquo;t play HC. The economy comparison is really tempting me, though. If I can fix up my play style to survive the campaign I&rsquo;m sure I could just play the rest of the game safer and not die in preventable situations&hellip; not sure how I feel about testing it out on new content, though. No idea how/why the abyss ground explosions were one shotting me through max res and 8000es/3000hp</p>
</label>
    </div>
  </label>
  
</div>

      <div class="commentHeader">

      <label for="nj540dj" class="commentText"><p>Kinda 800 times, not sure, season ended for me)</p>

</div>

      <div class="commentHeader">
        <div>Flying_Mage</div>
        <div>1 | 3 minutes ago </div>
      </div>
      <label for="nj56hf6" class="commentText"><p>85.</p>

<p>But I was more careful lately. Trying to hit that lvl98.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nj5275t" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Bigboysama</div>
        <div>1 | 24 minutes ago </div>
      </div>
      <label for="nj5275t" class="commentText"><p>Playing hardcore also change the way you play in general. I still think you should have a try once</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
