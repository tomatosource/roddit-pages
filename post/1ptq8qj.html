

<html>

    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>

    <h2>
      <a class="postTitle" href="https://www.reddit.com/r/PathOfExile2/comments/1ptq8qj/doing_trials_of_sekhemas_as_a_druid_bear_aint_fun/"><p>Doing Trials of Sekhemas as a Druid Bear ain&rsquo;t fun&hellip;</p>
</a>
    </h2>

    
    <div class="selfPostContainer">
      <p>Made a tanky build when I remembered that this game still has this shitty game mode.</p>

    </div>
    

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="nvis4g3" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Kind_Objective_5411</div>
        <div>1 | 24 minutes ago </div>
      </div>
      <label for="nvis4g3" class="commentText"><p>No matter how tanky you are when 1 hit doing 500 honor points damage. Chaos temple it is.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nvis46h" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>kh4z_z</div>
        <div>1 | 24 minutes ago </div>
      </div>
      <label for="nvis46h" class="commentText"><p>Brother it&rsquo;s not that hard anymore. You maybe cant stand in all shit without care and have to move between skills, but stack 75res and max honor+, even if you fail a few times to get relics, get to the merchant as often as you can and its ez as long as you&rsquo;re not unlucky as fuck. Else, overlevel a little bit and go again.</p>

<p>Trial, in comparison to poe1 lab, and by extension your ascendancy points is not a &ldquo;free thing&rdquo;. You gotta work for it, its by design like this. And you know what? I prefer this versus poe1 lab 1000 times. Very unpopular opinion, probably.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="nvishgi" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Madzai</div>
        <div>1 | 21 minutes ago </div>
      </div>
      <label for="nvishgi" class="commentText"><p>Ah, yes. 75% honor res. A Holy Grail. That shatters when you have to choose between No Armor, - Speed, Lower Effect from Relics and Seeing Less room ahead Afflictions.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="nviszeo" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>spyrhdwnas</div>
        <div>1 | 16 minutes ago </div>
      </div>
      <label for="nviszeo" class="commentText"><p>Not really. Depending if you do t4 trial or not you can pick something different. -speed is ok if you don&rsquo;t need to do the last fight.</p>

<p>Else go go for the seeing less rooms which then you need to make sure you are picking the path with most connections possible so you can at least have more options. It is a roguelite mode. It is intended.</p>

<p>There is always chaos trial if you want but need the fragments.</p>
</label>
    </div>
  </label>
  
</div>
