      <div class="commentHeader">

      <label for="mhwiz8d" class="commentText"><p>The build is based on 2 things that make it work:</p>

<ol>
<li>High critical hit chance - this procs CoC Profane Ritual to keep up your power charges as you spam Falling Thunder</li>
<li>High maximum power charges - With the Powertread boots each power charge gives 15% crit damage, which is 135% crit damage. In addition to this, <strong>each power charge consumed gives Falling Thunder projectiles 25% more damage</strong> which is absolutely bonkers for scaling. (see the post 1 shotting Xesht <a href="https://www.reddit.com/r/PathOfExile2/comments/1jawpmr/falling_thunder_vs_32_million_hp/" target="_blank">https://www.reddit.com/r/PathOfExile2/comments/1jawpmr/falling_thunder_vs_32_million_hp/</a> )</li>
</ol>

<p>Maxroll/POB if you want to try it out: <a href="https://maxroll.gg/poe2/pob/1yaw0uvc" target="_blank">https://maxroll.gg/poe2/pob/1yaw0uvc</a> <a href="https://pobb.in/MpbEjyKjCSi_" target="_blank">https://pobb.in/MpbEjyKjCSi_</a></p>

<p>Longer video of a delirious T15 map: <a href="https://youtu.be/RP8mY7OFC-o" target="_blank">https://youtu.be/RP8mY7OFC-o</a></p>

<p>For people that want zoom (not shown in the video), I have killing palm which has triple duty - movement speed (when there are mobs to teleport to), gaining power charges on kill (works best when you can 1shot mobs), and applying shock on bosses (with increased magnitude).</p>

<p>For when you&rsquo;re not zooming around at the speed of sound, Falling Thunder has double duty of screen clearing and also boss killing.</p>

<p>At this point close to end of league I&rsquo;m experimenting a little bit, so my gear is strong (but absolutely not mirror-tier). But I&rsquo;ve tried the build with some of my earlier gear and it works pretty well too.</p>

<p>Survivability is very good, with very high stun threshold. This build won&rsquo;t work on simulacrum (unless you have mirror-tier gear)</p>

<p>Mobility: <sup>7</sup>&frasl;<sub>10</sub></p>

<p>Crowd control: <sup>7</sup>&frasl;<sub>10</sub></p>

<p>Bossing: <sup>7</sup>&frasl;<sub>10</sub></p>

<p>FPS: definitely hard on the GPU, you might have to lower your graphics settings</p>

<p>EDIT: if you already have an attribute stacking invoker/gemling this should be a pretty cheap and easy switch for you</p>
