    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {

}

body {
  display: flex;
  flex-direction: column;
  align-items: center;

h1 {

}

h2 {

  font-weight: bold;
}

input[type="checkbox"] {

}

blockquote {

.subName {

.post {

.postLink {

  text-decoration: none;
  font-size: 42px;

}

.postLink:visited {

}

.postHeader {

  font-size: 24px;
  font-weight: bold;

.commentList {

  flex-direction: column;

.commentAndChildren {

.comment {
  padding: 16px 0;

.commentText,
.commentText * {
  font-size: 38px;

  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;

.selfPostContainer * {

}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    <h2>
      <a class="postTitle" href="https://youtu.be/JN3CJhMPv9U"><p>With all the posts about Abyss, I decided to make a full endgame guide for anyone looking to min-max Omen drops</p>
</a>
    </h2>

    

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="ny3fg0b" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>0xsl4ck3r</div>
        <div>2 | 2 hours ago </div>
      </div>
      <label for="ny3fg0b" class="commentText"><p>For Abyss rares in particular would the tablet mod the grants &ldquo;+rares spawn from Abyss pits&rdquo; be more valuable than flat increase rare percentage on tablets?</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="ny3hhnp" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Caliath</div>
        <div>2 | 2 hours ago </div>
      </div>
      <label for="ny3hhnp" class="commentText"><p>That&rsquo;s a suffix mod but you could use it instead of the &ldquo;%Increased Abyss Monsters&rdquo; mod. Personally I didn&rsquo;t really think it was worth it because the unique abyss tablet already gives plenty of additional rare monsters and they don&rsquo;t spawn from every single abyss, rather as a flat total in the entire map. And since the unique tablet also gives a ton of additional abysses, I figured the %increased abyss monsters mod is more overall juice to the entire map because that one gets applied to all the abysses and it can get pretty crazy when the Atlas Passive &ldquo;Remnants of Power&rdquo; procs and doubles up the effects of the tablets.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="ny3k75d" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>0xsl4ck3r</div>
        <div>2 | 2 hours ago </div>
      </div>
      <label for="ny3k75d" class="commentText"><p>Cool, I&rsquo;ve been running a similar strat, I&rsquo;ll give the increase Abyss Monster mod a shot. Thanks for your efforts, homie!</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

    
  </div>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="ny3zbzp" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Volitar</div>
        <div>1 | 16 minutes ago </div>
      </div>
      <label for="ny3zbzp" class="commentText"><p>I tried this last week after reading the post as well. I was getting no where as many lights as you but I have 0 rarity on gear.</p>

<p>God damn it rarity. got me again.</p>
</label>

  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="ny3kxbk" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Kokkuwi_Gaming</div>
        <div>1 | 2 hours ago </div>
      </div>
      <label for="ny3kxbk" class="commentText"><p>I am in SSF and have collected a good chunk of omens, but I can&rsquo;t get the bones to drop, do you have recommendations for getting these?</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="ny3sadq" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Caliath</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="ny3sadq" class="commentText"><p>Since you&rsquo;re in SSF and you&rsquo;re looking for bones, I would say probably focus on using 3x Abyss tablets with &ldquo;Additional abysses&rdquo; mods, &ldquo;Increased chance for desecrated currency&rdquo; and 1x &ldquo;Abyss pits in map are twice as likely to have rewards&rdquo;. The bones can only drop from the abyss chests so all the other mods would be useless if you&rsquo;re trying to target farm them. And the additional Abysses would provide way more value since you can&rsquo;t have the Unique Abyss tablet on every map because it&rsquo;s pretty rare.</p>

<p>You should use the standard Abyss Atlas tree that everyone else recommends. I think it&rsquo;s better for SSF because Stir the Swarm gives an additional Abyss and also gives you a chance to actually get maps to be overrun by the Abyssal.</p>

<p>That&rsquo;s pretty much it for bones. Just have to keep doing more Abyss maps and don&rsquo;t skip Abyssal Depths when they appear.</p>
</label>
