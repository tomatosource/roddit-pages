       * {
  margin: 0;
  padding: 0;

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {

  color: #ddd;

body {
  display: flex;

  width: 100%;
  padding: 32px;

h1 {

  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;

  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;

.subName {
  text-decoration: none;

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>

      <div class="commentHeader">

        <div>3 | 7 hours ago </div>
      </div>
      <label for="nh72zmd" class="commentText"><p>Note this is not disabled because of mod numbers (that&rsquo;s different icon/text) - this is a 6 mod map.  I&rsquo;ve been running 1x overseer, 1x default irradiated precursors (because the boss atlas +1 area level for powerful boss zones doesn&rsquo;t seem to proc in overseer maps without the powerful boss icon, despite allegedly having a powerful boss), and 1x expedition tablet.  Just to come to my first citadel of the patch and see that it doesn&rsquo;t think using an expedition on a citadel is a good idea, which is extremely weird given citadels were definitely beneficiaries of extra content types from Tower tablets pre-patch.  This means I have to utilize another overseer/default precursor tablet, which would put the 2 I&rsquo;ve been using out of sync with the expedition tablet.  Or I could get 3 additional unused overseer/default tablets&hellip;but they&rsquo;d all drop to 9, meaning if I wanted to continue to use an expedition (or any other content) tablet as my third, then they will be out of sync when I next use those.  Which leaves me with what - using a set of 3 tablets for specifically citadels that I stash between citadels and have to micromanage in every time I reach one?  That&rsquo;s clearly the &ldquo;best&rdquo; option (and is probably even optimal if you consider how waystone chance impacts citadel fragments), but I fucking HATE that kind of intense micromanagement, even if it&rsquo;s profitable.</p>
</label>
