

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/nlpyvdes5luf1.jpeg"><p>What do I do?!</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/nlpyvdes5luf1.jpeg" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="nj1cws1" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Straikkeri</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="nj1cws1" class="commentText"><p>Only one real choice. Elemental damage it is. Your wand is already plagued by intelligence so you might still get it sold with the ele dmg.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nj1c6lz" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Party-Artichoke3</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="nj1c6lz" class="commentText"><p>Depends on the build, no? Me I’m going elemental damage all day long. That’s a T1 roll I think</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nj1c94e" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>randomlygenerated03</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="nj1c94e" class="commentText"><p>I think elemental is for fire, ice, and lightning. Spell includes Chaos. So if you&rsquo;re trying to sell or upgrade your gear (if you arent using chaos) then go elemental.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nj1ee23" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Outrageous-Owl-9700</div>
        <div>1 | 44 minutes ago </div>
      </div>
      <label for="nj1ee23" class="commentText"><p>Destroy on cursor</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nj1gcv5" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>MiniMik</div>
        <div>1 | 31 minutes ago </div>
      </div>
      <label for="nj1gcv5" class="commentText"><p>How are people supposed to know what you should pick when you give zero information about your build or  the purpose of this item?</p>

<p>Either way, ele damage is pointless if you&rsquo;re using bloodletting.</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
