

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/lyzt8le93qkf1.png"><p>MS PAINT : Infernalist Ancestral Cry HollowPalm</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/lyzt8le93qkf1.png" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="na8h8r9" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>TimeToEatAss</div>
        <div>2 | 3 hours ago </div>
      </div>
      <label for="na8h8r9" class="commentText"><p>So your going CI-ES without a shield item equipped? Thats a significant loss of ES, not a big deal if your hybrid, but full CI?</p>

<p>What physical dmg does hollow palm get per skill level?</p>

<p>You realize you also need increased critical strike chance? 1500 ES on your gear is going to translate to a %15 crit rate. Also remember its ES on gear, not overall ES for crit chance.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="na8ifvp" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>VoidInsanity</div>
        <div>1 | 3 hours ago </div>
      </div>
      <label for="na8ifvp" class="commentText"><p>The +crit from es on gear is flat crit and will be boosted by inc crit. I agree with the CI though.</p>
</label>
    </div>
  </label>
  
</div>

    
      
<div class="commentAndChildren">
  <input id="na8sovd" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>rohithkun</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="na8sovd" class="commentText"><p>Going with Evasion/CI hybrid with CI is way to go. You should get Deflect to as high as you can. I did the similar thing as Monk in previous patch. Monk gets no shield or Focus but still able to run Evasion+CI builds. Witch will have easy access to Monk section. they reduced some of the attributes nodes in skill tree so that traversal to off class part of tree is easier.</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="na8iae7" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>levyb</div>
        <div>2 | 3 hours ago </div>
      </div>
      <label for="na8iae7" class="commentText"><blockquote>
<p>Ancestral cry will last 8*2.5 = 20sec.</p>
</blockquote>

<p>It&rsquo;ll be way longer. Have a weapon swap skill tree for Ancestral Cry that has skill effect duration, and you should be able to triple the duration over that. You might even be OK without endurance charge generation - depends on glory gain rate, ultimately. And if so, then you can use it for <em>power</em> charge generation, and use charge staff+flickerstrike.</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
