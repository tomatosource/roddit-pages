    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {

}

body {
  display: flex;
  flex-direction: column;

}

h1 {

  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {

.subName {

.postList {

.post {

.postLink {

  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

      <label for="o5qjzqe" class="commentText"><p>You definitely should’ve prioritized placing the architect in the right spot before getting that far. If you understand that he won’t move into a spot that will connect to what you’ve placed down, you can create roads to make him move exactly where you want him to. At this point, what I’ve drawn below is your best shot at getting him to move to the middle blue star location. Red is what you should let die so you can build roads/chains in yellow (faster with roads than rooms but you can do a few rooms as you get closer if you have enough that will connect to each other).</p>

<p>Killing him with what you have now gives him way too many potential spots to move to. I got burned by RNG in my first temple killing him way too many times before he moved where I needed him to go. That was before I understood how to make it deterministic</p>

<p><a href="https://preview.redd.it/o44n3nwdqwjg1.jpeg?width=1164&amp;format=pjpg&amp;auto=webp&amp;s=83bd1f8c28eb0d9d44d2b6ef5a57877a2166080c" target="_blank">https://preview.redd.it/o44n3nwdqwjg1.jpeg?width=1164&amp;format=pjpg&amp;auto=webp&amp;s=83bd1f8c28eb0d9d44d2b6ef5a57877a2166080c</a></p>
