

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
}

.selfPostContainer * {
  color: white;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/xsw5zegde6ke1.jpeg"><p>Omen Of Resurgence</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img src="https://i.redd.it/xsw5zegde6ke1.jpeg" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="mdpmpr1" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Ok-Engineering-5527</div>
        <div>3 | 3 hours ago </div>
      </div>
      <label for="mdpmpr1" class="commentText"><p>Resurgence only works if you reach low life.  It doesn&rsquo;t help one shots or big hits that delete you.  I&rsquo;m also not certain if dots will trigger it either.  Honestly I only use amelioration but I&rsquo;m SC.</p>

<p>Also, do not try to use both at once.  Only one omen per instance can be used.  I still lost 10% with one turned on and thought it bugged but it&rsquo;s just how it works.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="mdpncsx" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Untuchabl</div>
        <div>1 | 3 hours ago </div>
      </div>
      <label for="mdpncsx" class="commentText"><p>I got froze in a mob not sure how big the killing blow was but most of it was small hits. I deserved it tbh</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="mdq03ch" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>alexisaacs</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="mdq03ch" class="commentText"><p>So it basically happens where you get tickled to death without hitting low life.</p>

<p>You go from 31% hp and then one shot from there.</p>

<p>It’s annoying but it makes sense.</p>

<p>I take more issue with them bringing back invisible on death effects. 99% of deaths are from those purple chaos balls that I can’t see.</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

    
  </div>
  
</div>

        
      
    </div>
  </body>
</html>
