

<html>

    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

<div class="commentAndChildren">

<div class="commentAndChildren">

    <div class="comment">
      <div class="commentHeader">

<div class="commentAndChildren">
  <input id="oxdlu9q" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>zethras</div>
        <div>1 | 19 minutes ago </div>
      </div>
      <label for="oxdlu9q" class="commentText"><p>For a 5 mod jewel. You start planning with the mods that you want. Lets say you hsve 3 mods in mind. Lets say its suffixes. You go and buy a jewel with 2 of them. It cant have a crafted, corrupted or sanct. Then go slam the emotion that gives you a +1 to suffixes (its a 50-50), if you get the +1 prefix. Start again.</p>

<p>When you have the +1 suffixes. Now desecrate suffix. Omen of light until you find the one you like. Now. Annul with omen that targets prefixes. It might take 1-2 tries to remove the +1 suffix mod.</p>

<p>Exalt adding 2 prefix that you like and chaos until happy. The chaos orb cannot target the suffix. Add the increase suffix mod. It will add the mod (if it fails to add it, it will consume the emotion but will not brick the item, keep trying until it works).</p>

<p>This all work because the chaos orb and increased of suffix can only target preffix and cant target suffix (due to a bug).</p>

<p>The same can be done with prefix just do the inverse.</p>
</label>

<p>This all work because the chaos orb and increased of suffix can only target preffix and cant target suffix (due to a bug).</p>
</blockquote>

<p>supposedly this isn&rsquo;t a bug. As people have said it works the same way in PoE1. But I guess we won&rsquo;t know until we get a comment from GGG</p>

<div class="commentAndChildren">
  <input id="oxdgrn6" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>varbaveri</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="oxdgrn6" class="commentText"><p>Use delulu that can gamble you either +1 suffix or prefix, try to get +1 prefix, desecrate that extra prefix (omen to guarantee) and aim to get a good mod, one tap annul + omen to remove that +1 prefix mod away (it&rsquo;s a suffix), exalt again, chaos until you get 2 good suffixes, divine it if you have to, slam increased effect of prefixes and pray it hits the worse suffix mod, quality it up, vaal if big balls. Np np</p>

<p>edit: but i think you&rsquo;re in a pickle as you already have a crafted mod, anyway</p>

<div class="commentAndChildren">
  <input id="oxdiirc" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>LordLorek</div>
        <div>1 | 37 minutes ago </div>
      </div>
      <label for="oxdiirc" class="commentText"><p>First double check that the one you saw isn&rsquo;t a hybrid affix. There are a few desecrated prefixes that give two lower tier affixes as one. That&rsquo;s probably where one of them is coming from.</p>

<p>The other comes from the ancient emotion that gives the crafted modifier +1 prefix or suffix.  You&rsquo;ll need to remove your prefix enhancer mod before you can add that. Then you add the extra mod, annul off the +1 modifier, and re-add your prefix enhancer mod.</p>
</label>
    </div>
  </label>

<div class="commentAndChildren">
  <input id="oxdltej" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>itsthe_implication_</div>
        <div>1 | 20 minutes ago </div>
      </div>
      <label for="oxdltej" class="commentText"><p>I would love to see which jewels have 6 modifiers without being corrupted. I could definitely be missing something but I don&rsquo;t think that&rsquo;s possible.</p>

<p>The meta for crafting these jewels is to get an extra prefix or suffix, then roll two good affixes for whichever type can only hold two, then slam on the extra effect emotion. To do that from scratch do the following:</p>

<p>(It seems like a lot when you type it all out but it makes sense once you do it yourself)</p>

<ol>
<li><p>If the jewel isn&rsquo;t rare, get it to rare.</p></li>

<li><p>Annul down to one good roll (if you can annul down to two good rolls with both being either prefix or suffix then that&rsquo;s great, but unlikely).</p></li>

<li><p>With one good affix on the jewel, use dextral/sinistral exaltation and hope for another good roll.</p></li>

<li><p>If you hit a bad roll, <sup>50</sup>&frasl;<sub>50</sub> annul and hope it takes the bad roll away.</p></li>
</ol>

<p>5a. If it hits the good roll and you&rsquo;re left with only one bad roll, chaos until you hit a good roll and return to step 3.</p>

<p>5b. If it hits the bad roll, return to step 3.</p>

<ol>
<li><p>Once you have two good prefixes or suffixes, exalt slam the two remaining affixes on, and now you <sup>50</sup>&frasl;<sub>50</sub> the emotion that gives an extra prefix or suffix.</p></li>

<li><p>If it hits, use a Desecrated Cranium to add a third prefix/suffix. From this point on you basically can&rsquo;t brick the jewel, but if you&rsquo;re really unlucky you might have to use Omen of Light a few times.</p></li>

<li><p>Using Abyssal Echoes, hope for a good third affix.</p></li>

<li><p>If you miss at this point you are using Omen of Light and Abyssal Echoes until you are satisfied with the third roll.</p></li>

<li><p>Once you have 3 good prefixes/suffixes, use Dextral/Sinistral Annulment to get rid of the extra slot modifier. Hopefully you only need to use one, but you might need to do it twice.</p></li>
</ol>

<p>11.Exalt until there are 5 mods total on the jewel.</p>

<ol>
<li><p>Chaos spam until you have two acceptable rolls on whichever type of affix can only hold two. This is the important tech because no amount of chaos spamming at this point will hit the affixes that you have three of.</p></li>

<li><p>Once you have two good rolls on the type of affix that can hold two, just use the emotion that gives extra effect of prefixes/suffixes. It will guarantee roll on whichever type only has room for two, and effects the type that has room for three.</p></li>
</ol>

<p>GG</p>
</label>
