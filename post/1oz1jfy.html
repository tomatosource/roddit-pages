    <h2>
      <a class="postTitle" href="https://www.reddit.com/gallery/1oz1jfy"><p>Ring crafting advice</p>
</a>
    </h2>

    

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="np9fhp7" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>WhichWolfEats</div>
        <div>2 | 3 hours ago </div>
      </div>
      <label for="np9fhp7" class="commentText"><p>I haven’t crafted dps rings but my crafting knowledge would say this. Maybe recomb on a few bases as youll probably want the best chance. I’m guessing life leech would be best. Homo tags are shot for suffix so this is probably the easiest way to go. Then you’ll have 2 flat and life leech? Then homo sinister ex to fill prefix with damage tag. Could be flat. Then you want to collarbone until you get all res or rarity. Then yolo your last suffix. This would be hard because the suffix are all different mod tags.</p>

<p>I just considered and you may want to double check but I think life leech has attack tag so if you from where you are dextral homo ex you can roll that then either yolo the others same as above or whittle. Honestly this will be a shitty start to crafting as it isn’t an easy one. Gl</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="np9q3kn" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>VeryStruong</div>
        <div>1 | 2 hours ago </div>
      </div>
      <label for="np9q3kn" class="commentText"><p>Yea I figured it wouldn&rsquo;t be easy since it needs very specific mods.  And not worth trying to craft for profit this late either.</p>

<p>According to craft of exile, Homo exalting the suffixes would give a chance of life or mana leech, aside from all the other elemental resist tags.  So not a bad chance but can get really expensive.  Appreciate the input!</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="np9amuh" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Serious-Ebb-4669</div>
        <div>1 | 4 hours ago </div>
      </div>
      <label for="np9amuh" class="commentText"><p>My guild started with one like this and, I will warn you, crafting rings like this is <em>very</em> expensive and relies on a lot of luck.</p>

<p>If you do want rarity on suffix, I would advise to use the recombinator to get a T1 flat damage and T1 rarity suffix.</p>

<p>Single slam perfect exalt homogenizing prefix and pray. Then homo exalt suffixes and whittle for res. Desecrate final T1 flat.</p>

<p>I wouldn’t start with this ring because of the fire damage (unless you really want it). It’s only worth the money to craft if you hit T1 phys/cold/lightning with the rarity and res</p>

<p>We spent hundreds of divs, landed on t1 fire on the desecrate, called it a day and gave up.</p>

<p>Someone probably has a step by step to craft a perfect ring, but again it’s very RNG heavy, and there are points where you can brick it. That’s why they are so expensive to buy.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="np9p36j" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>VeryStruong</div>
        <div>1 | 2 hours ago </div>
      </div>
      <label for="np9p36j" class="commentText"><p>Thanks for the input!  Even before I posted, I never tried to craft for an upgrade and was playing around with craft of exile.  Had no idea what I was doing lol</p>

<p>I only need a rarity suffix but honestly at this point in the league, it&rsquo;s whatevers.  It really needs the triple flat, res, and leech to be useable for my build.</p>

<p>Seems I can either desecrate for the 3rd cold or phy flat dmg or quality + catalyse + homo exalt and pray.  The rest is even more RNG.  I&rsquo;ll just use this as practice.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="np9u9y0" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Serious-Ebb-4669</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="np9u9y0" class="commentText"><p>Getting the rarity on is the hard part. Recombinator is the easiest IMO- but you can also fracture and chaos spam.</p>

<p>Once you get the 2 T1 flats and the rarity suffix, desecrate and fracture. If you hit the rarity you can perfect homo exalt prefix, if you miss you can whittle it over to a suffix and then remove it guaranteed with abyssal omen and desecrate from there.</p>

<p>We were going for the T1 lightning on the desecrate, probably made 30 attempts with rerolls before (with perfect collarbones) we hit the T1 fire and called it a day.</p>

<p>This craft <em>sucks</em>, wouldn’t recommend it to anyone who values their sanity or currency. It’s a good league end craft- but yeah we sank everything we had. We crafted armor that sold for a mirror but was on the market for a month before someone bought it haha.</p>
</label>
