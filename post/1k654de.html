

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/c91so71qdmwe1.jpeg"><p>Please consider adding guardskills to the game</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/c91so71qdmwe1.jpeg" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="monb2hq" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Dyyrin</div>
        <div>17 | 10 hours ago </div>
      </div>
      <label for="monb2hq" class="commentText"><p>Sorry but this would put white mobs at a disadvantage.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="moncal6" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>ezikeo</div>
        <div>6 | 10 hours ago </div>
      </div>
      <label for="moncal6" class="commentText"><p>Man I wish we had some active mitigation.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="monfibl" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>BlueMerchant</div>
        <div>1 | 10 hours ago </div>
      </div>
      <label for="monfibl" class="commentText"><p>I wish they actually fixed melee like they said they were going to before ea launch.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="moni0sy" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Lost-Basil5797</div>
        <div>1 | 10 hours ago </div>
      </div>
      <label for="moni0sy" class="commentText"><p>You mean, mace skills? Both spears and shields skills are fine, imo.</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

    
  </div>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="monnm7p" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Nearby_Squash_6605</div>
        <div>2 | 9 hours ago </div>
      </div>
      <label for="monnm7p" class="commentText"><p>There is a guard skill in the game.  Unfortunately it&rsquo;s locked behind warbringer acendency so it&rsquo;s not easily accessible.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="moozu20" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>HouseRoKKa</div>
        <div>1 | 5 hours ago </div>
      </div>
      <label for="moozu20" class="commentText"><p>Guard skills exist in PoE2, but they appear as prefix mods on charms rather than as active skills. These guards activate when the charm&rsquo;s trigger condition is met, and remain active until either the charm effect ends or the guard absorbs its maximum damage.</p>

<p>The maximum roll for guard effects is only 500 (much lower than PoE1), with good rolls being 350+. An important note is that you can stack guards from 3 different charms, making a 3-charm slot belt valuable if you want to use this defensive strategy.</p>

<p>Example of a thawing charm with a guard mod: <a href="https://www.pathofexile.com/trade2/search/poe2/Dawn%20of%20the%20Hunt/rnjmP9RSQ" target="_blank">https://www.pathofexile.com/trade2/search/poe2/Dawn%20of%20the%20Hunt/rnjmP9RSQ</a></p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
