.postLink:visited {

.postHeader {

  font-size: 24px;

.commentList {

.commentAndChildren {

.comment {

.commentText,
.commentText * {

.commentHeader {

  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;

.selfPostContainer * {

}

.selfPostImage {

}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

</a>
    </h2>

<div class="commentAndChildren">

    <div class="comment">
      <div class="commentHeader">
        <div>Casexcasey | Philadelphia Phillies</div>
        <div>3 | 2 hours ago </div>
      </div>
      <label for="nxev595" class="commentText"><p>For those like me who were curious how it went for Mary, I&rsquo;m sad but not surprised to report that she didn&rsquo;t last long in her role, getting pulled before season&rsquo;s end. It was said she struggled a bit due to inexperience, and there were some statements that her voice might not have been ideal for radio, but her broadcast partner Jimmy Piersall believed the answer was simpler than that:</p>

<blockquote>
<p>“She never had a chance,” Piersall recalled. “Even a bad baseball player gets at least one full season to see if he’ll come around. But because of all the in-bred prejudice against a woman covering a baseball team, Mary didn’t even get that. It was a real shame, because I think she had what it takes to make it, and some day the idea of a woman bringing a woman’s perspective to baseball broadcasting will be a tremendous innovation somewhere.”</p>
</blockquote>

<p>While Mary&rsquo;s dream of calling games for a major league club had come and gone, she didn&rsquo;t let the experience chase her away from sports, moving to Worchester, Massachusetts and becoming a beat reporter for the Boston Celtics. Sadly, she had been plagued with heart problems for years, and she passed away from heart failure on November 1, 1987 at the age of just 42.</p>

<p><a href="https://sabr.org/bioproj/person/Mary-Shane/" target="_blank">https://sabr.org/bioproj/person/Mary-Shane/</a></p>
</label>

  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="nxf6wa9" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>brokenlampPMW2 | San Francisco Giants • Toronto Blue Jays</div>
        <div>2 | 8 minutes ago </div>
      </div>
      <label for="nxf6wa9" class="commentText"><p>Sports media is still archaic when it comes to women in key roles. We still are only at <sup>1</sup>&frasl;<sub>30</sub> for English-speaking MLB TV pxp roles, and 0/30 for english full-time radio pxp. If you start thinking about opportunities for non-white or queer women in sports media, it gets even more depressing.</p>

<p>Say what you will about the Yankees, they&rsquo;ve got a great booth on radio with a black man and a woman in the seats, and that&rsquo;s noteworthy (even though in 2025, it shouldn&rsquo;t be). And they both worked their asses to be there.</p>
</label>
