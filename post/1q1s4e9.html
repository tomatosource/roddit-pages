

<html>

    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;

.subName {
  text-decoration: none;

.postList {

}

.post {
  width: 100%;

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    <h2>
      <a class="postTitle" href="https://v.redd.it/8gq15e13zvag1"><p>Thorns needs another passthrough.</p>
</a>
    </h2>

    

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="nx7u522" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Glittering_Leader689</div>
        <div>3 | an hour ago </div>
      </div>
      <label for="nx7u522" class="commentText"><p>Is this campaign? Thorns really wouldn’t take off except when you’re mapping in my experience. It also requires a specific setup of unique/runes to work properly. Support gems to apply your thorns is also very important.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="nx7ul5p" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Rechulas</div>
        <div>2 | an hour ago </div>
      </div>
      <label for="nx7ul5p" class="commentText"><p>No, you&rsquo;re correct! This is the end of Act 3. Thorns takes off real well once you get the Anvil&rsquo;s Weight Ascendancy for Warbringer and some specific supports, generally mid Act 2.</p>

<p><em>Most</em> enemies die extremely quickly to my Thorns, but there are a shocking amount of enemies that are or have moves that are completely unaffected by them.</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nx7u1w8" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Rechulas</div>
        <div>2 | an hour ago </div>
      </div>
      <label for="nx7u1w8" class="commentText"><p>Thorns is one of my favorite archetypes in games that allow it, and PoE2 only barely does. It&rsquo;s held up entirely by one helmet, the Crown of the Pale King, and the Briarpatch boots, which is WAY too much reliance on something in order to make something <em>begin</em> to be functional.</p>

<p>Then there&rsquo;s the problem of the fact that it doesn&rsquo;t work all the time? Desiccated Liches&rsquo; tornado spells count for thorns, so they can be killed with thorns. Bahlahk the Sky Seer (Tornado Bird in the Temple of Chaos) summons a tornado, but it is not counted.</p>

<p>The Jamanra has an attack where he glasses sand at two points and causes lightning to charge between them, which counts for thorns damage. Zicoatl, Warden of the Core in Act 3 has a move that is almost identical: It has two orbs of light that spawn a connected damaging beam between them, but does not count for thorns damage.</p>

<p>Here, you can see that Archer Transcendent enemies fire simple arrows, but are not being affected by thorns.</p>

<p>This also applies to many other machine enemies, such as the (Forgive me, the exact name of it is escaping me at the moment, so I will fill in the blanks as much as I can) Vaal Cyclosword or whatever, the mechanical enemy with two blades that spins, they are unaffected by thorns when they spin on you.</p>

<p>I like thorns, and it&rsquo;s a great archetype to play as, but to be so locked in on helmet and boots options that don&rsquo;t really give much else is rough, I&rsquo;m not sure if there&rsquo;s any other archetype in the game that&rsquo;s so strict.</p>

<p>I know the game&rsquo;s not finished yet but it&rsquo;s a real mood killer when these things all come together.</p>
</label>
    </div>
  </label>
  
</div>
