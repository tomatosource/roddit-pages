      <label for="nnvz28t" class="commentText"><p>Nice mace you made there.</p>

<p>Couple tips for anyone following his method.</p>

<p>%phys and desecrated %phys/-AS are mutually exclusive affixes.   If you fracture or chaos spam into a high tier %phys,  that&rsquo;s great,  but your desecration step will be much more difficult and expensive.  If you have the currency for it,  it&rsquo;s spamming jawbones and omen of lights looking for hybrid phys only.   A cheaper deterministic option can be exalting a suffix on, then using a perfect essence for gain % as x damage with a dextral crystallization.  This option also let&rsquo;s you fish for attack speed at the end with desecrations instead of exalt slams.</p>

<p>Second, on the last exalt slam, congrats on getting lucky.   There are seven possible mods you can hit,  and the weighting for attack speed is very low.  On ilvl 81+ bases you have just over 3% chance to hit attack speed with a perfect exalt and homog,  and only 1% chance for tier 1. Lvl 80 bases have about 4% chance.</p>

<p>Mace crafting is great, wish there was a mod with just a physical tag though.   Would make crafting these monsters cheaper and more deterministic.</p>
