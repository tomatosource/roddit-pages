.commentList {

.commentText,

.tweetContainer {
  width: 100%;

        <div>3 | 11 hours ago </div>
      </div>
      <label for="no37lgm" class="commentText"><p>Get homo exalt suffix and pray for crit dmg and perfect essence the suffix using omen for attack levels, the homo exalt suffix again and pray for crit rate or dmg depending what was removed</p>
</label>
    </div>
  </label>

<div class="commentAndChildren">
  <input id="no3d7ut" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>norielukas</div>
        <div>2 | 10 hours ago </div>
      </div>
      <label for="no3d7ut" class="commentText"><p>Finishing this will be rng.</p>

<p>Either add 1 prefix and remove random prefix with omen of sinistral crystalization and essence of battle and then repeat with onslaught essence and pray you dont remove the flat phys both times.</p>

<p>Second options is even bigger of a gamble and less likely to succeed, you add 2 suffixes and use omen of dextral crystalization and pray you hit back to back +4 and onslaught with out removing the crit chance.</p>

<p>I would do the first option and then desecrate for flat phys and then just perfect exalt and pray for something not shit if you end up losing the 2 50/50’s</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="no3nv58" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>mukhaliniov</div>
        <div>2 | 9 hours ago </div>
      </div>
      <label for="no3nv58" class="commentText"><p>First add a prefix with perfect exalt. If it’s trash, gamble on +4 by removing the trash prefix. If gamble succeeds, try again for onslaught. If you like the prefix, you gotta fill the suffixes with perfect exalt and gamble for +4 from suffix side. <sup>2</sup>&frasl;<sub>3</sub> chance it wont break. If you get to this bow with good prefixes, crit chance and +4, i would not gamble more. Just take it as is. If you remove the crit, you gotta annul down and start again. If the first gamble fails and you remove flat phys, just add onslaught as well and come back to fix the prefixes. First fill the prefixes with perfect exalt and then use abys essence to get one desecration. You gotta whittle the non desecrated prefix and omen of light for the desecrated one until you get the desired mods.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="no3x7hs" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Debates7</div>
        <div>1 | 8 hours ago </div>
      </div>
      <label for="no3x7hs" class="commentText"><p>I also have a similiar question, what is the best way to go about crafting these high phsyical bows/spears? Buy random rares with high crit, try to fracture it, chaos orb till %phsyical, and then what? Suffixes i understand that you do essences, but how do you get the rest of the prefixes?</p>
</label>
    </div>
  </label>

<div class="commentAndChildren">
  <input id="no3xqos" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>tenshosei</div>
        <div>1 | 8 hours ago </div>
      </div>
      <label for="no3xqos" class="commentText"><p>Depends how much you want to invest.
If you dont plan to invest more than 50divines:</p>

<p>I would just desecrate prefix, if its an affix u want to keep, then homo double ex for the 2 remaining suffix then perf essence the +4 and pray crit chance stays. Craft done.</p>

<p>If you dont hit the prefix u want with the desecrate,prefix crys for +4 esssence and pray the descrate mod is removed, then homo suffix and des prefix + omen light until u get desired prefix. Craft done.</p>

<p>If the t1 flat phys gets removed, then prefix crys again for onslaught. Suffix is done. P ex slam for 1x prefix if its a shit mod use abyss + prefix crys to des it then remove with omen light and slam again until u hit ur mod, then desecrate omen light for last prefix. Craft done.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="no377au" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>A9Carlos</div>
        <div>0 | 11 hours ago </div>
      </div>
      <label for="no377au" class="commentText"><p>Depends if you want the companion damage prefix desecration or not.  If so, it&rsquo;s generally easy from here.  Desecrate the prefix with an Amanamu mod and it&rsquo;s guaranteed.</p>

<p>Note, the tooltip doesn&rsquo;t generally seem to account for this near 100% increase in damage.</p>

<p>Of course you can always use the desecrate for a flat damage type, omen of light off if it doesnt work.</p>

<p>With the suffixes not fractured, and a good prefix you can&rsquo;t afford to lose, you can&rsquo;t risk using a perfect essence or you could lose the crit.  I doubt you&rsquo;ll want to be burning Locks on that.</p>

<p>I&rsquo;d probably double suffix exalt with homogenising at this point, given the damage and crit tags youve got, and desecrate the prefix as above</p>
</label>
    </div>
  </label>
