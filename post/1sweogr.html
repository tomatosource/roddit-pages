

<html>

    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>

    <h2>

      </div>
      <label for="oij2nkj" class="commentText"><p>Hybrid entangle/Coc Comet/sparc.. and yes I did spend approx 800 divs&hellip;</p>

<p><a href="https://poe.ninja/poe2/profile/stephbib-1031/vaal/character/egaMdoolBcixelsyD" target="_blank">https://poe.ninja/poe2/profile/stephbib-1031/vaal/character/egaMdoolBcixelsyD</a></p>

<div class="commentAndChildren">
  <input id="oikz5rz" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>OfStarStuff</div>
        <div>1 | 9 hours ago </div>
      </div>
      <label for="oikz5rz" class="commentText"><p>Shaman with cloak of flame, gore girdle belt, 85 percent of phys damage converted to fire and then a ton of armour and armour applying to ele on all other pieces as well as the tree plus a helm that has armour applies to chaos. Get 100 percent reduced effects of ignite on you from like 3 nodes on the tree. Then I used both flame breath and oil barrage as my high damage skills. I could tank basically everything. Monkey slams barely take away any health. And flame breath absolutely melts all bosses. I loosely copied Carnarius&rsquo; bear build but did it with the dragon instead.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">

        <div>1 | 6 hours ago </div>
      </div>

<p><a href="https://poe.ninja/poe2/builds/vaalssf/character/DAWSOKJ1988-7370/Theo_Vaal_Witch?timemachine=week-18&amp;i=6&amp;search=class%3DLich%26timemachine%3Dweek-12" target="_blank">https://poe.ninja/poe2/builds/vaalssf/character/DAWSOKJ1988-7370/Theo_Vaal_Witch?timemachine=week-18&amp;i=6&amp;search=class%3DLich%26timemachine%3Dweek-12</a></p>
</label>

</div>
