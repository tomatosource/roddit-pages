

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/55oj9rz26exe1.jpeg"><p>I got my first Perfect AND Greater Jeweller’s Orbs at level 90.</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/55oj9rz26exe1.jpeg" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="mpbnuu3" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>aphen1</div>
        <div>1 | 17 minutes ago </div>
      </div>
      <label for="mpbnuu3" class="commentText"><p>I reached 90 not a single Perfect jew :) i find game boring and masochism so i left only if others with similar experience would quit they might think again about direction, but this is utopia</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="mpbpg5i" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Salehzahrani7</div>
        <div>1 | 8 minutes ago </div>
      </div>
      <label for="mpbpg5i" class="commentText"><p>I understand the rarity behind the Perfect Jewel, and how you might need the extra strategies to enhance your chance to get one (which worked for me.) But the Greater one…come on GGG.</p>
</label>
    </div>
  </label>
  
</div>

    
      
<div class="commentAndChildren">
  <input id="mpbquz8" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Aromatic-Fee-4952</div>
        <div>1 | a few seconds ago </div>
      </div>
      <label for="mpbquz8" class="commentText"><p>Someone burnt them all i guess</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="mpbpg46" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>elmahk</div>
        <div>1 | 8 minutes ago </div>
      </div>
      <label for="mpbpg46" class="commentText"><p>I got my first greater jeweler and level 92, and I did not get perfect yet (lvl 95 now). I don&rsquo;t care because it&rsquo;s trade league and I bought them long time ago, but in general it&rsquo;s not a good drop rate for such essential item. Btw I still didn&rsquo;t drop a single level 20 uncut get, same story here.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="mpbpzph" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Salehzahrani7</div>
        <div>1 | 5 minutes ago </div>
      </div>
      <label for="mpbpzph" class="commentText"><p>If you are hunting for a Perfect one, then going for Local Knowledge and doind grass maps will help you out.</p>

<p>As for level 20 gems, I am pretty sure I read that they are locked behind a certain area level. Can’t remember if it was 81 or 82.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="mpbqhsj" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>elmahk</div>
        <div>1 | 3 minutes ago </div>
      </div>
      <label for="mpbqhsj" class="commentText"><p>Oh I cleared basically all content already (T4 pinnacle bosses, T3 simulacrum, maps with craziest mods etc), plenty of 81 maps too. That gem doesn&rsquo;t drop anyway, but as I said I bought all that long time ago (level 20 gems and perfect orb).</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

    
  </div>
  
</div>

        
      
    </div>
  </body>
</html>
