       * {
  margin: 0;
  padding: 0;
  text-indent: 0;

*,

  box-sizing: border-box;

html {

body {
  display: flex;

  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;

}

blockquote {

.subName {

.postList {

.post {

}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>

      </div>
      <label for="o1cbskk" class="commentText"><p>If you end up losing out to lock rng, alc alc corruption chamber on your main chain is not too bad. It looks like you also still have another sacrifice card so you can go back to that step.</p>

<p>I had your version of min max temple for 2 days (dropped 2 mirrors with it) before i hit a bad rng streak and lost the corruption x3 setup on the main chain. I think you can also set it back up with giga locks, but i didn’t bother.</p>

<p>Replaced it with alc alc corruption. It still drops 70-100d per run (solo) and is less stressful to rebuild in case I hit another bad streak. Haven’t had that happen though. The alc lvl 3 can drop locks too so it increases the chances of not going dry.</p>

      </div>
      <label for="o1ccbsc" class="commentText"><p>Go a little slower; usually the medallion drops when you see room complete so check around every room; you will lose 3 sec per room time 70 room it is 210 sec so you temple will take 3 min and something more to run, far from being catastrophic.</p>

<p>When you get out of this situation, always put your lock before you run to free slots.</p>

<p>I always run with 5-6 medallions so if I am unlucky, I have 1 or even 2 extra chance (runs). Most run I leave locks on the ground. Because locks are so important the only medallion I pick up are the Waystone ones (if I&rsquo;m due) and of course the +1 upgrade. Any other I will not pick up.</p>

<p>I have 8 spy and never ran out of locks.</p>
