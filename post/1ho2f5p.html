      <p>So I was thinking and if we were gonna trade anybody on the roster it’s gonna most likely be Tillman and Springer and maybe some picks.</p>

<p>What do you think we could get for them/who we should target with this value?</p>

      <label for="m46j9kv" class="commentText"><p>I broke it down recently and the answer is: Basically no one.</p>

<p>We can&rsquo;t combine salaries. The most money we can get back in a single trade is $4,018,363. If you want to see who&rsquo;s available, it&rsquo;s pretty simple, just go to <a href="https://www.basketball-reference.com/contracts/players.html" target="_blank">this list of player contracts and look at any players making less than Jaden Springer.</a></p>

<p>A lot of the players we could afford are on teams that won&rsquo;t want to trade for picks.</p>

<p>The options at that price point are pretty limited.</p>

<ul>
<li><p>Dwight Powell / Dante Exum - Dallas won&rsquo;t want to sell right now.</p></li>

<li><p>Day&rsquo;Ron Sharpe / Shake Milton - Brooklyn are sellers. Sharpe could be an interesting player but he probably doesn&rsquo;t play for the same reason as Tillman. Milton probably struggles to make the cut as well.</p></li>

<li><p>Santo Aldama - Memphis won&rsquo;t want to sell right now.</p></li>

<li><p>Amir Coffey - LAC won&rsquo;t want to sell right now.</p></li>

<li><p>Dalton Knecht - LA will want to make trades, but they won&rsquo;t include Knecht.</p></li>

<li><p>Tari Eason - Houston won&rsquo;t want to sell right now.</p></li>

<li><p>Jaime Jaquez Jr. / Kevin Love / Josh Richardson - I wouldn&rsquo;t expect any team to sell Jaquez Jr right now. Love and Richardson should be on the market but Miami generally doesn&rsquo;t sell at all.</p></li>

<li><p>Brandin Podziemski - Golden State just spent the entire offseason keeping him out of trade talks.</p></li>

<li><p>Christian Braun / Russell Westbrook - Denver won&rsquo;t want to sell right now.</p></li>

<li><p>Julian Champagnie - Decent player on a cheap contract, I don&rsquo;t see San Antonio letting him go.</p></li>

<li><p>Walker Kessler - Maybe could be available&hellip; but he&rsquo;s having a decent year and Utah might want to keep him.</p></li>

<li><p>etc. etc.</p></li>
</ul>

<p>Sharpe, Milton and Kessler might genuinely be the only 3 NBA players we could think about, 2 of them likely don&rsquo;t make the cut and the 3rd might not even be on available.</p>
