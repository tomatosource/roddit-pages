

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/1inc10ug855f1.jpeg"><p>if only it had higher %phys..</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/1inc10ug855f1.jpeg" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="mw67eo1" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>No-Rooster6994</div>
        <div>6 | 6 hours ago </div>
      </div>
      <label for="mw67eo1" class="commentText"><p>This is still pretty good.  You get an additional flat 111 phys damage running an Amazon.  The extra flat from accuracy does not get increased by the %phys on weapon</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="mw6acd7" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>jamieduh</div>
        <div>4 | 6 hours ago </div>
      </div>
      <label for="mw6acd7" class="commentText"><p>Can this compete with Tangletogue even at a higher physical %? Would it need to have elemental damage as well?</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="mw6csyg" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>StrayDogPhotography</div>
        <div>6 | 6 hours ago </div>
      </div>
      <label for="mw6csyg" class="commentText"><p>This thing isn’t even close to Tangletongue. That thing is basically broken. I’ve had spears with 500+ physical damage do less damage. Once you get one with 20% critical hit and two sockets for critical hit damage souls cores it’s virtually impossible to match it.</p>
</label>
    </div>
  </label>
  
</div>

    
      
<div class="commentAndChildren">
  <input id="mw6ol3n" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>NaturalCard</div>
        <div>1 | 5 hours ago </div>
      </div>
      <label for="mw6ol3n" class="commentText"><p>On an Amazon I think so.</p>

<p>On anything else no, tangletounge is BiS.</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="mw6fx0u" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>colcardaki</div>
        <div>1 | 6 hours ago </div>
      </div>
      <label for="mw6fx0u" class="commentText"><p>This is a worthless spear unfortunately in the current meta.</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
