

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/twtjxzbc4c4h1.jpeg"><p>The &ldquo;reworked&rdquo; campaign experience</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/twtjxzbc4c4h1.jpeg" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="ootqtj3" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Drakore4</div>
        <div>1 | 2 minutes ago </div>
      </div>
      <label for="ootqtj3" class="commentText"><p>For the record, a lot of it isn’t exactly shortened so much as reoriented. There are basically signs everywhere that you have to look out for, and things are much more linear. Act 3 is a really good example of this. Snakes lead you to the venom crypts if you look out for them. Once you get into the waterways, which are much better with pressure plates now, it’s a linear zone that leads you right to the corpse quest that used to be in a whole different zone, and that gives you the quest to go into the bog which is literally right there instead of again being in a whole different zone. So in waterways you basically complete 3 different quests by simply walking through when before you had to go looking for them in random places. It’s so much better.</p>

<p>Oh and another one, in act 3 the whole molten vault zone where you used to have to look for it and it would take 20 minutes now it’s super easy to find and the zone itself is super linear as well with a couple of guaranteed loot boxes that have been added. So it’s not that it’s shortened, it’s more like they made it make a lot more sense and you don’t have to go looking as much.</p>
</label>
    </div>
  </label>
  
</div>

      </div>
      <label for="ootqvg9" class="commentText"><p>They never said rework lol, it&rsquo;s all QoL shit.</p>
</label>
    </div>
  </label>
  
</div>

    <div class="comment">
      <div class="commentHeader">
        <div>Shaltilyena</div>
        <div>1 | a minute ago </div>
      </div>
      <label for="ootqxow" class="commentText"><p>I mean it&rsquo;ll be shorter on subsequent characters where you presumably won&rsquo;t need to do the runestones &amp; stuff again</p>

</div>

      <label for="ootpwkg" class="commentText"><p>i&rsquo;m not even gonna play past act 2 lol</p>

    </div>
  </body>
</html>
