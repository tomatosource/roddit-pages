

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/frjsm1wtxkve1.png"><p>The problem with essences</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/frjsm1wtxkve1.png" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="mnr2dhq" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>mcswayer</div>
        <div>8 | 2 hours ago </div>
      </div>
      <label for="mnr2dhq" class="commentText"><p>That&rsquo;s the only problem? Everything is a problem with them, from how much they drop, to their usefulness.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="mnrewt1" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Aitaou</div>
        <div>1 | 21 minutes ago </div>
      </div>
      <label for="mnrewt1" class="commentText"><p>I’m extremely confused on how you think they aren’t useful. This league they’re fairly cheap, you can toss a stack in your inventory of the relevant stat you’re looking for and use them as transmutes  to ensure a proper affix pool start that you can then leverage in the recombinator, or if the Aug goes well use that as a basis of the craft and THEN buy/farm/use a greater.</p>

<p>I’ll agree that they might be uncommon for the greater variants but usefulness? I’m sorry, that is the basis of most crafts if you want to craft well and efficiently.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="mnriat7" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>mcswayer</div>
        <div>1 | 3 minutes ago </div>
      </div>
      <label for="mnriat7" class="commentText"><p>If you think the following loop is useful, I just suppose you haven&rsquo;t met an actually useful system and have no idea what actual crafting really is (even poe1 is much better than this):</p>

<ul>
<li>find white base</li>
<li>use an essence of x, to hope for a high tier (out of 7-10 total tiers), for the mod you want (out of 3-4 mods, usually) - this is already <em>extremely</em> unlikely, since there are maybe 30 total tiers and the higher tiers have lower chances, so you&rsquo;re looking at, maybe, 5-10% chance for a good mod?</li>
<li>augment, hoping the second is good</li>
<li>upgrade it with a regal or another essence</li>
<li>exalt/chaos</li>
<li>use omens in there somewhere, which are expensive as hell</li>
<li>if, at any point you fail, start all over, especially in the early steps</li>
</ul>

<p>If you really think this loop is useful&hellip; I&rsquo;m at a loss of words. I won&rsquo;t even mention that the first 3 steps are literally identifying a magic item, but several extra steps, just to <em>very slightly</em> increase your chances of targeting what you want.</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

</html>
