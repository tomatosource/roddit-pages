    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;

}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>

    <h2>
      <a class="postTitle" href="https://v.redd.it/mx9zs11pvhpf1"><p>Arbiter&rsquo;s ball phase still has the same issues it had at launch&hellip;</p>

    </h2>

    

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="nei1tms" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Bigboysama</div>
        <div>4 | 4 hours ago </div>
      </div>
      <label for="nei1tms" class="commentText"><p>In your defense, sometimes it can be annoying when it&rsquo;s out of your field of vision. More than once, he raygunned me out of nowhere while I was running for my life. The visibility still needs some work due to situations like that. Unfairness shouldn&rsquo;t be so prevalent, especially regarding visibility. Your case is really a sad one though.</p>

<p>In your situation, a bit more movement speed could have helped you turn around him easily. Extra movespeed can also reduce reliance on dodge rolling constantly.</p>

<p>It&rsquo;s meant to be a pinnacle boss, so you shouldn&rsquo;t expect to perform well with random gear. You don&rsquo;t need 85% movement speed. About 20-30% movement speed on your boots is more than enough.</p>

<p>Dodge rolling also slows you down significantly at the end of the dodge. A helpful tip is to stay super chill as possible, only dodge rolling when absolutely necessary.</p>
</label>
    </div>
  </label>

      </div>
      <label for="nei72l7" class="commentText"><p>On the video you can see 30% movement speed boots, it&rsquo;s just that Warrior has a lot of penalties from armour.</p>

<p>EDIT: Also dodge rolling is the necessary evil to the stupid sprint end animation :p I try to dodge roll as  little as possible.</p>
