

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/71s6c2s9b49f1.jpeg"><p>Is this any good?</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/71s6c2s9b49f1.jpeg" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="mzqvdh7" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>8CupChemex</div>
        <div>1 | 39 minutes ago </div>
      </div>
      <label for="mzqvdh7" class="commentText"><p>This might be acceptable at level 79, the minimum required level.  The thing about crossbows is that all crossbow skills rely on converting physical damage to elemental. Having additional elemental damage is usually not helpful to me.  I would rather have a flat increase to physical damage since that gets converted. Accuracy rating is beneficial for Amazon builds, but less helpful for merc-based builds.  For Amazons, with specific ascendency skills, this gives 48 more physical damage, which helps with the low phys damage, and also an increase to critical hit chance.  That sort of duplicates the 3.4% increased critical hit chance, though. Leech is very high.  The big thing here is the +7 to skill level.  At level 79, you&rsquo;re probably getting level 17-18 gems, so you can get up to level 25 skills.  It&rsquo;s really hard for me to judge how that turns out.  It&rsquo;s possible it outweighs the low phys damage, but I think as you get to higher levels the +7 will be outweighed by higher phys damage.  I would be mildly disappointed with this.</p>

<p>I could be wrong.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="mzqwhjr" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Acceptable-Put6542</div>
        <div>1 | 33 minutes ago </div>
      </div>
      <label for="mzqwhjr" class="commentText"><p>Try to fracture the +7. If it hits then yes</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="mzr02m3" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Bill_Door_8</div>
        <div>1 | 16 minutes ago </div>
      </div>
      <label for="mzr02m3" class="commentText"><p>You need to replace something in there with flat physical damage for it to be an endgame xbow.</p>

<p>From someone who played a lot of xbow</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="mzqvqic" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Lucalus</div>
        <div>1 | 37 minutes ago </div>
      </div>
      <label for="mzqvqic" class="commentText"><p>Not bad at all. It could be much worse. The +accuracy and leech could be replaced with more damage or attack speed to make it op, but for a random drop, it is solid.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="mzqv2rp" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Raizel999</div>
        <div>1 | 40 minutes ago </div>
      </div>
      <label for="mzqv2rp" class="commentText"><p>as a casual, idk anything about crossbows but it looks dope haha</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
