      <label for="p351yay" class="commentText"><p>I would go check out some other builds who do high damage and redo your passive tree.</p>

<p>You need to get a lvl 1-3 whriling slash, it saves lots of mana. You only need whirling slash to spin up twisters, not do damage.</p>

<p>Your ring should be triple flat damage, unless you really need the rarity, then 2x damage, but  make sure its great rolls.</p>

<p>your gloves can be either 3x flat damage, or more $$$ +2 proj.</p>

<p>Try and get t2-t3 flat damage rolls at least on your ring and gloves, not sure what kind of budget your working with so all t1 is probably out the question.</p>

<p>replacing those will give you the biggest damage boost for the least cost.</p>

<p>Amulet can be better, if your able to make money I would buy the amulet with trinity, either a blank base or a magic one and just chaos spam until +proj skills (It takes me like 100-200 chaos to hit, but it can take way longer.) Its only a 4 mod amulet so its really easy to craft yourself, I think the last one I sold was 100+ div not sure what the market is looking like now.</p>

<p>(The trinity amulet gives you the skill without needing the 100 spirit)</p>

<p>Your jewels I would redo. Its easy to craft 5 mod jewels, if you want I can send you a link to a youtube video that gives you step by step directions.</p>

<p>I would skip palm of the dreamer its not worth the money, I went back to using the scepter that gives you the fire shrine buff.</p>

<p>Id get the same spear but with a better crit roll.</p>

<p>Rikkatas does make a big difference but for the 100-150 div you can get a ring, gloves, spear and maybe an amulet.</p>

<p>The Crit support is also another huge upgrade but for the cost I think its not worth getting until you have all other gear dialed in.</p>

<p>I would just check the market and see what deals you can find, dont rush to buy stuff. I know rings and gloves can get super expensive, but also can find some great deals, same with jewels and amulets.</p>
