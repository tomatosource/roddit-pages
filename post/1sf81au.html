    <h2>
      <a class="postTitle" href="https://www.youtube.com/watch?v=s5_ysUr9iEk&amp;amp;t=100s"><p>[Thinking Basketball] When the solution doesn&rsquo;t address the problem (on the 65 game rule)</p>
</a>
    </h2>

    

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="oevtu9b" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Tarrot469</div>
        <div>10 | 38 minutes ago </div>
      </div>
      <label for="oevtu9b" class="commentText"><p>Summary from those who didn&rsquo;t watch the video:</p>

<p>1: Comparing across eras following specific players, the number of steps has stayed relatively the same, but the number of hard plants has increased greatly.</p>

<p>2: League-wide, the best scorers used to play between 85-95% of the time until 2015, when there was a sharp drop-off in % of games played that has continued until this year, where it&rsquo;s sub-75% (60ish games).</p>

<p>3: The 65 game rule has only resulted in a marginal increase in total games played (maybe 2%) and has not done anything substantial to make it like the 90s when top stars routinely played 90% of their games.</p>

<p>4: Possible solutions to the injury issues, and thus, played games issues:</p>

<ul>
<li><p>A: Rules changes to make the game slower (ie: 90s iso basketball, no one wants that)</p></li>

<li><p>B: Rules changes that limit gather steps (too much stress on the lower body changing directions) or push-offs (Jokic and Murray both being injured by other players being pushed into them)</p></li>

<li><p>C: Eliminate back-to-backs since those are shown to cause more injury.</p></li>

<li><p>D: Consider lowering the total games played (comparable to Baseball when pitchers changed to starting only every 5th game and having pitch counts to reduce stress on arms and lower injuries).</p></li>
</ul>

<p>5: Top stars in the modern era only play about 60 games a season, so playing 65 games is above average, when there have been plenty of MVP seasons where the winner played under or very close to that number (Obviously Walton, but AI in 2001 as well, along with Harden and Giannis both times).  So all the 65 game rule does is take choice/nuance out of the voter&rsquo;s hands in exchange for a marginal increase in games played and increased discussion on players due to the rule.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="oevugi0" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>herroyung | Warriors</div>
        <div>3 | 35 minutes ago </div>
      </div>
      <label for="oevugi0" class="commentText"><p>To save people some time, the video just argues that the 65 game rule does not significantly address the problem it was meant to solve: getting top players to play as many games as they used to, like 79 games. Yes, you have some potential award winners playing more games than they would have, but that&rsquo;s just a few players who will play like 10 more games to pass that 65 game threshold.</p>

<p>If you maintain that the 65 game rule exists to get top players to play 65 games, then take a look at their average of about 62 games played in the past 3 seasons where the rule has existed. &ldquo;Top&rdquo; is defined as a top 40 scorer to include most of the players we&rsquo;d consider among the top. Clearly, the rule is simply not that effective.</p>
</label>
    </div>
  </label>
  
</div>
