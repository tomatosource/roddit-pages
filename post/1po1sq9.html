

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/70krbxukhk7g1.jpeg"><p>Size matters</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/70krbxukhk7g1.jpeg" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="nubvla6" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>pathoftolik</div>
        <div>3 | an hour ago </div>
      </div>
      <label for="nubvla6" class="commentText"><p>True</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nubvyj0" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>PurchaseVegetable532</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="nubvyj0" class="commentText"><p>I spend more time traveling maps than combat, crafting, and my 37 years of being alive combined.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nuc1p6l" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>ChuddingeMannen</div>
        <div>1 | 27 minutes ago </div>
      </div>
      <label for="nuc1p6l" class="commentText"><p>campaign areas should be half as big and its monsters should give twice the experience.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nuc41w0" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>BuktaLako</div>
        <div>1 | 13 minutes ago </div>
      </div>
      <label for="nuc41w0" class="commentText"><p>i think the size is more than okay, once you start having some dps you can complety maps in 5 minutes, or 10 if it’s really big.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nuc49z2" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Additional_Law_492</div>
        <div>1 | 12 minutes ago </div>
      </div>
      <label for="nuc49z2" class="commentText"><p>If you make everything smaller, it just makes it feel like the game is an amusement park.</p>

<p>Part of what lends an impression of it being a world is that areas are expansive, and open.  If you cut the size of act 3, for instance, the whole thing would just feel like youre visiting facades at Disney world - two minutes in each theme, and done.</p>

<p>As is, it only takes about 3-5 minutes per zone&hellip; even Matlan Waterways, the worst zone in Act 3, isnt really that bad.</p>

<p>Like, I sympathize&hellip; but im 99% sure getting what you want here will make the game worse.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nuc4ow6" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Realistic_Task_7740</div>
        <div>1 | 10 minutes ago </div>
      </div>
      <label for="nuc4ow6" class="commentText"><p>I kinda like the big maps for endgame. It just means a juiced map lasts longer and you can just walk around the edge of a map to get to the boss if your trying to path somewhere</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
