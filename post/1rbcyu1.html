

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/ubl47sum4zkg1.png"><p>Finished my Atziri-able temple (with architect on the top right)</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/ubl47sum4zkg1.png" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="o6q28wh" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>nivvy19</div>
        <div>1 | 2 hours ago </div>
      </div>
      <label for="o6q28wh" class="commentText"><p>Learned about russian tech and optimal architect placement bit late and didn&rsquo;t want to completely redo. Worked out well as it leaves room for the royal access chamber, which in my planning I had left room for at the bottom right. Yeh, that 3rd chain is vulnerable but I&rsquo;ve been able to sustain 3 locks avg per run so far.</p>

<p>There is that one armoury in the golem chain because at the time it was hard to sustain the 3 locks needed to pull it off and after I gave up on it was smooth sailing from there. Not optimal but good for ~45 raw divs per run and nice to be able to run atziri every other run.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="o6q8uo8" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>milafosi</div>
        <div>1 | 36 minutes ago </div>
      </div>
      <label for="o6q8uo8" class="commentText"><p>how many divs per run?</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="o6qaizc" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>MinimumExperience102</div>
        <div>1 | 22 minutes ago </div>
      </div>
      <label for="o6qaizc" class="commentText"><p>Those bottom 4 may be better off as 2x commander, not positive though. Have you tried that? Just curious. Using 3 locks a run is hard to sustain a lot of 2 lock runs and a single <sup>1</sup>&frasl;<sub>0</sub> can really hurt.</p>

<p>But the extra effectiveness may do more for you than some extra mods/monster drop rarity. Give a shot. Can’t hurt since I’m sure you lose those 4 every now and then.</p>

<p>Cool set up man. Good work!</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="o6qbcw5" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>draxor_666</div>
        <div>1 | 14 minutes ago </div>
      </div>
      <label for="o6qbcw5" class="commentText"><p>Is this perfection?</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
