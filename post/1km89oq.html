      <div class="commentHeader">

        <div>1 | 2 hours ago </div>
      </div>
      <label for="ms948in" class="commentText"><p>I had a few minutes before heading out, so I wanted to ask a few things.</p>

<p>Is Elemental Focus on Frostbolt mainly because you&rsquo;re critting often enough to consistently trigger Cold Snap, so the lack of it being able to freeze isn&rsquo;t really an issue?</p>

<p>Also, I noticed you have Glaciation linked to Cold Snap. Am I right in thinking that&rsquo;s to help make up for Frostbolt&rsquo;s inability to freeze due to Elemental Focus? Just want to make sure I&rsquo;m understanding the setup correctly.</p>

<p>Right now, my build is in a ROUGH spot since I don’t yet have Snakepit or the Maligaro gloves. I’m managing T1 and T2 maps but struggling a bit. It might just be a skill issue. I’m working on getting Snakepit as soon as possible. At the moment, I’m leaning on the Mana Tempest and Frost Wall interaction to multiply Frostbolts and clear packs, while CoC Cold Snap takes care of bosses.</p>

<p>If you have any tips for the early game before getting Snakepit, I’d really appreciate it. But I figure that’s the main turning point for the build.</p>

<p>Sorry for the word vomit. I&rsquo;m really loving this build and am just enjoying the process of testing and finding out things about it.</p>
</label>

<div class="commentAndChildren">
  <input id="ms9acit" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>PrintfReddit</div>
        <div>2 | an hour ago </div>
      </div>
      <label for="ms9acit" class="commentText"><blockquote>
<p>Is Elemental Focus on Frostbolt mainly because you&rsquo;re critting often enough to consistently trigger Cold Snap, so the lack of it being able to freeze isn&rsquo;t really an issue?</p>
</blockquote>

<p>At my stage they just melt so I don&rsquo;t care as much about Freezing, in which case Elemental Focus is essentially free DPS. I will admit though I&rsquo;ve tried it with and without and to be entirely honest I&rsquo;m split either way. If you&rsquo;re struggling, I&rsquo;d keep it off and use Deliberation, Cold Mastery etc to boost Frostbolt&rsquo;s DPS as high as possible.</p>

<blockquote>
<p>Also, I noticed you have Glaciation linked to Cold Snap. Am I right in thinking that&rsquo;s to help make up for Frostbolt&rsquo;s inability to freeze due to Elemental Focus? Just want to make sure I&rsquo;m understanding the setup correctly.</p>
</blockquote>

<p>That is probably a mistake because I like Glaciation with Frost Bomb or Frost Wall.  Cold Snap isn&rsquo;t dealing enough damage on it&rsquo;s own to really Freeze anyone.</p>

<blockquote>
<p>At the moment, I’m leaning on the Mana Tempest and Frost Wall interaction to multiply Frostbolts and clear packs, while CoC Cold Snap takes care of bosses.</p>
</blockquote>

<p>What do you have on CoC? What&rsquo;s your energy build up like?</p>

<blockquote>
<p>If you have any tips for the early game before getting Snakepit, I’d really appreciate it. But I figure that’s the main turning point for the build.</p>
</blockquote>

<p>Fork and Pinpoint Critical on Frostbolt are mandatory in your case. Then pump up Frostbolt&rsquo;s DPS as high as possible through Considered Casting, Deliberation, Cold Mastery, Elemental Focus (try with and without) or whatever else you can get your hands on for DPS. Do not focus on Cast Speed at first until you can get CoC to proc against even mobs reliably.</p>

<p>On your atlas pickup the CD over Elemental Damage nodes since you don&rsquo;t have Maligrove. The build will be rough until Snakepit + Maligrove honestly but I can see it working at least in early mapping.</p>

<p>Also anoint Split Shot on your amulet, it&rsquo;s really cheap and makes a huge difference mapping.</p>
