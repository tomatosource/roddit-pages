

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/00wyoncb6g4f1.png"><p>Does this look like 3 additional rooms revealed to you (2+1 from relics)? Or am I missing something?</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/00wyoncb6g4f1.png" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="mvjhdq5" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Dustalis</div>
        <div>10 | an hour ago </div>
      </div>
      <label for="mvjhdq5" class="commentText"><p>&ldquo;additional Rooms are revealed&rdquo; doesn&rsquo;t mean that you see more rooms ahead on the path, it means that three of the rooms on the entire floor will be revealed via random selection.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="mvjjmow" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>shamberra</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="mvjjmow" class="commentText"><p>Thanks for that! I started to wonder if it might be something along those lines.</p>
</label>
    </div>
  </label>
  
</div>

    
      
<div class="commentAndChildren">
  <input id="mvjiepz" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>xPepegaGamerx</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="mvjiepz" class="commentText"><p>Ding</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="mvjgvqs" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>andriantcarl</div>
        <div>2 | an hour ago </div>
      </div>
      <label for="mvjgvqs" class="commentText"><p>Did you get an affliction that reduce relic effect?</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="mvjipyv" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>EnvyKo767</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="mvjipyv" class="commentText"><p>Additional rooms ahead does not mean what you think it does.</p>

<p>They can be any 3 random rooms per floor</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="mvjgfiv" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>shamberra</div>
        <div>0 | an hour ago </div>
      </div>
      <label for="mvjgfiv" class="commentText"><p>And I&rsquo;m sure I should have way more total honour resistance than 45%. Something&rsquo;s fishy.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="mvjhs2t" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Dustalis</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="mvjhs2t" class="commentText"><p>I&rsquo;m pretty sure that the list just shows the raw numbers on the relics without any other factors. I don&rsquo;t think that boons that increase relic effects are reflected there, I also don&rsquo;t believe it modifies the number when you reach the soft or hard cap for honour resistance.</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

        
      
    </div>
  </body>
</html>
