      <label for="nu5jncg" class="commentText"><p>From Chris Forsberg:</p>

<p>The Celtics have now played 217 total minutes without a pure center on the court. Boston owns a +8.7 net rating in that span while putting up a video game-like offensive rating of 133.6. That’s 12.2 points per 100 possessions higher than Boston’s No. 3 ranked offensive rating for the season. </p>

<p>The question is whether that’s sustainable, and whether Boston is OK just trying to outgun opponents whenever Neemias Queta isn’t on the floor. The Celtics have leaned into the luxury of having Josh Minott and Jordan Walsh play center-like roles with their length and athleticism. But a 124.8 defensive rating in those minutes is less than ideal. </p>

<p>Maybe the solution for Boston is as simple as letting president of basketball operations Brad Stevens tinker with the roster <a href="https://www.nbcsportsboston.com/nba/boston-celtics/brad-stevens-nba-trade-deadline-approach/752889/" target="_blank">when trade season formally launches on December 15</a> (the day most players signed this offseason can officially be moved). </p>

<p>We suspect Boston’s other veteran big men &ndash; Chris Boucher, Luka Garza, and Xavier Tillman &ndash; will get their occasional chances, and they must be ready to maximize them. Rookie two-way center Amari Williams could get time once he’s healed from a hand fracture. </p>

<p>The bottom line is that, with Queta averaging 24 minutes per game, there’s another 24 minutes for this team to fill at the center spot. Going small has produced Boston’s best non-Queta basketball, but it gets clunky when the Celtics are struggling with their own offensive efficiency.</p>

<p><a href="https://www.nbcsportsboston.com/nba/boston-celtics/storylines-schedule-joe-mazzulla-sam-hauser/753483/" target="_blank">Read more here</a>.</p>
