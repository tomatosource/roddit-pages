      <label for="nsmotsn" class="commentText"><p>I have two connections to big deal baseball, the first is that I was born in the same hospital and wing if not the same exact room as Terry Francona (the first is certain, the second probably legend but it was a small hospital) and the second is that I&rsquo;m distantly related to Tony Oliva&rsquo;s wife, and my mom&rsquo;s family were neighbors and on the same party phone line as them as well when they met, only months after he won this batting title.</p>

<p>I&rsquo;ll quote from <a href="https://www.startribune.com/class-trip-brings-tony-oliva-and-bride-together-53-years-and-counting/600008799" target="_blank">this article</a> for some things, <a href="https://sabr.org/bioproj/person/tony-oliva/" target="_blank">SABR</a> confirms most of it, and some is just minor details I know from mom and my grandparents. He&rsquo;s kinda the most important thing to ever happen in that town, other than a 70&rsquo;s bank robbery (also involving my grandmother. Very, very small town). It is also extremely &lsquo;of it&rsquo;s time&rsquo;, in that those events happening now would be of concern (he was a bit older than her, and there was a power dynamic at play) but at the time was not viewed that way, other than the racism aspect.</p>

<p>She met Tony when she and her classmates were on a school trip to the Twin Cities, and happened to be staying in the same hotel as the Twins were staying (this is before free agency, players did not have funds to have nice apartments at least in the city they played in, Tony is not a rich man in this scenario, at least not in the context of modern baseball.) and decided to stay for autographs. At the time, the Hitchcock Blue Jays were a powerhouse in what was then the extremely popular sport of SD townball, their HS and Legion teams were dominant, and baseball was king of sports.</p>

<p>Tony saw her and it was love at first sight, something they maintain to this day (on his end at least). She thought it was a random pass from a handsome young ball player who couldn&rsquo;t have wanted more than a night, he took the fairly dramatic step of calling her and maintaining a long-distance relationship as a black man from Cuba courting a white german (people still actually spoke german in casual conversation, Hitchcock was still an ethno-enclave to some degree until the 80&rsquo;s) in an extremely white area.</p>

<p>They dated for a few years, she had eventually gone to school in the Twin Cities as well, but his first visit to town is still somewhat famous in local lore. It was Christmas in 65, and my grandfather was part of the contingent that was pretty upset with the situation, part of the people who were picking up that party line phone to &lsquo;chaperone&rsquo; their conversations. They do a great job of downplaying exactly how poorly they were treated at first, but, over time and once people met Tony, this quote became a reality in the minds of most:</p>

<blockquote>
<p>They soon realized, however, that they had much in common. Both bride and groom had grown up on family farms with a large contingent of brothers and sisters. Gordette had seven siblings, including her twin Gordon; Tony had nine brothers and sisters. Both had daily chores on the farm, a labor-intensive operation that required a contribution from everyone in the family. At the same time, they enjoyed the simple pleasures of farm life.</p>
</blockquote>

<p>Their wedding eventually occurred in a church in Hitchcock, which I attended and later helped tear down. By that point, it was only the bitterest of racists who still had an issue with him, and that didn&rsquo;t include my very racist grandfather because Tony would take time out to go teach hitting skills with the kids in town anytime he visited, he also helped out with anything that needed doing by anyone around. After he played, he quietly ran a hitting camp for years and years every single time he came to town.</p>

<p>As mentioned elsewhere, he&rsquo;s stayed very close to the Twins in recent years, lives in MN, is a fixture. Iirc, he hasn&rsquo;t been out to Hitchcock in some years, since covid at least and even before that he wasn&rsquo;t teaching anymore, not that there are more than 3 kids to learn anymore. But for me at least, being far too young to have watched him play or appreciate exactly who that dude who my dad and grandpa made me go listen to was at the time, my first thought is always about how he managed to win over that town as a non-english speaking person of color in the 60&rsquo;s. He downplays the problems, a lot, and I also always want to mention that, just having the local story from my family.</p>
