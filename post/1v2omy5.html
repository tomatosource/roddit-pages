

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/hu5nz4g58meh1.jpeg"><p>Late to the party but creating a hollow form whirling assault build, any options besides just perfect exalt slamming the rest of these affixes?</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/hu5nz4g58meh1.jpeg" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="oywri0j" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Shaz_berries</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="oywri0j" class="commentText"><p>Yeah, at the very least, you can get quality on there and use an omen to influence which mods your exalt is likely to hit</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="oywtfxb" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>HairyCan5652 [OP]</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="oywtfxb" class="commentText"><p>It&rsquo;s the reaver catalyst to increase attack quality correct? And do you have any suggestions for which omens?</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="oywvfhs" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Shaz_berries</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="oywvfhs" class="commentText"><p>Just go to Ange and type omen in the search bar. You&rsquo;re gonna need to learn available omens each league because it changes. Last league I played was 0.3 and a bunch of stuff is removed which makes it harder to get what you want (more gamble) but I guess a little less complicated since there&rsquo;s less you can do.</p>

<p>To be honest, usually these ammys are high end crafts, so you&rsquo;ll probably want to do more than just ex slam, but you could get lucky. I would recommend trying to get two good prefixes on there (using purple omens if needed) then desecrate the prefix to finish. Light as needed.</p>

<p>If you&rsquo;re just going to slam, then use omen of crystalization with a greater exalt omen and sinistral exalt after adding attack quality (if you were trying to target two prefix attack modifiers for example)</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

    
  </div>
  
</div>

        
      
    </div>
  </body>
</html>
