

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>

      <label for="o045avh" class="commentText"><p>let the sac chamber destabilise. get a new sac chamber so u can get the sac tiles again. connect the perimeter at the top with spymaster garrison. then use sac tile to disconnect the loop. clean up the middle with destabilisations and go from there</p>

      </div>
      <label for="o049uff" class="commentText"><p>This is my take on it. Maybe others can improve.</p>

<p>1st the chain as is is not that damaged and salvageable. However 2 big components are missing in this temple chain: Golem work (Multiply effect of good rooms) and Commanders (More loot from rares).</p>

<p>So check this screenshot</p>

<p><a href="https://imgur.com/a/MG1CpGZ" target="_blank">https://imgur.com/a/MG1CpGZ</a></p>

<p>1-Obviously if you run it you will lock no1 and no2.</p>

<p>2-You need to open the temple tool and see if you can squeeze Golems and Commander on the yellow line I made. If you cannot, your temple will not reward a lot. Look at optimized temple: They have a lot of golems and commanders. If this is the case you might want to destabilize more room before no2 (so you lock before no2). Maybe all the way down the wall up to no3. This is your homework, you need to utilize the Temple tool and reproduce your temple and see if you can add Golem and Commanders.</p>

<p>3-When you use the tool, do put the Xs tiles (and let them destabilize anyway) so you have more room to path and try to squeeze Golems and Commander.</p>

<p>If you can get Golems and Commander, then your temple will not have the maximum amount of room with you will have salvaged it. If you cannot then you will need to destabilize much more rooms. Mine has 3 golems lvl2 and 2 commanders (so far from optimized) and I get 20-30 raw divs per 72 rooms depending on the roll on the waystone.</p>

<p>Hope this helps.</p>
</label>
    </div>
  </label>
  
</div>

  </body>
</html>
