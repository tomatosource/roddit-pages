

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/zw654fgj6bof1.jpeg"><p>dropped this off one of my many runs dying to the 150 shard breach boss. Do i slam with a homogeneous omen, and it will guarantee a 3rd flat damage?</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/zw654fgj6bof1.jpeg" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="ndf46dd" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>TheMagicGinge</div>
        <div>1 | 34 minutes ago </div>
      </div>
      <label for="ndf46dd" class="commentText"><p>No, you won&rsquo;t be guaranteed flat damage as there is also % increased damage for lightning, fire and cold. You could desecrate and omen of echos until you get a third flat damage though if that is what you are wanting.</p>

<p>You could also use the catalyst omen and quality it to whatever % you wanted if you did want a % to damage as this will give you a better chance to get that specific % damage type. For example, use Esh catalyst on it for lightning modifiers and then use the catalyst omen, with a homo omen and there is a higher chance you get % increased lightning damage, but not guaranteed.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="ndf4c41" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>TheInnsanity</div>
        <div>1 | 33 minutes ago </div>
      </div>
      <label for="ndf4c41" class="commentText"><p>I believe it could also roll % increased lightning and accuracy, might be better to use an omen, but accuracy is really the only whiff, getting % lightning then qualing lightning for flat, %, and resists is not bad.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="ndf4paw" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>SnooMuffins4560</div>
        <div>1 | 29 minutes ago </div>
      </div>
      <label for="ndf4paw" class="commentText"><p>Catalyst omen to increase your chances</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
