      <label for="onpzf8n" class="commentText"><blockquote>
<p>With the Sacred Unity notable</p>
</blockquote>

<p>The notable that requires you to get 3 notables before you can allocate it? I don&rsquo;t think we should take this into account when making this comparison.</p>

<blockquote>
<p>This would bring the Infernalist&rsquo;s in line with the Huntress&rsquo;s design</p>
</blockquote>

<p>I don&rsquo;t think there&rsquo;s an issue with the Companion-centric ascendancy getting a free extra companion with one of its nodes. Infernalist builds don&rsquo;t typically desire or use any other companions.</p>

<p>I also don&rsquo;t think Maim and Intimidate are &lsquo;insane&rsquo; utility, they&rsquo;re just solid bonuses for the value of one ascendancy notable. The leech should only apply to the Bear since it doesn&rsquo;t specify you leeching from it.</p>

<p>The ignite aura from the hound is solid; More than half of Infernalists in 0.4 were taking Loyal Hellhound so they&rsquo;re certainly happy with the value it&rsquo;s bringing.</p>
