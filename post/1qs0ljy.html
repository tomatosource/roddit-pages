

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://www.reddit.com/r/PathOfExile2/comments/1qs0ljy/scouring_orbs/"><p>scouring orbs</p>
</a>
    </h2>

    
    <div class="selfPostContainer">
      <p>We need them in POE2, maybe make them as rare as divine orbs but please implement them</p>

    </div>
    

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="o2rzis2" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>kierz_r</div>
        <div>1 | 25 minutes ago </div>
      </div>
      <label for="o2rzis2" class="commentText"><p>I think it&rsquo;s an intentional design decision so that white bases are valuable and encourage crafting. Chris Wilson talked about it in a recent interview with mrllamasc and how he thinks it&rsquo;s a good thing</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="o2s07mg" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Alive_Tip_6748</div>
        <div>1 | 20 minutes ago </div>
      </div>
      <label for="o2s07mg" class="commentText"><p>They won&rsquo;t do this. It would tank the value for white bases, which are actually a great way to farm currency in the first few weeks of the league without building into rarity farming. Right now it&rsquo;s exciting to drop bases that are good for crafters. ilvl 83 white bases take intentional effort and strategies to farm. Introducing scours would ruin that.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="o2s1q01" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Independent-Bat9797</div>
        <div>1 | 8 minutes ago </div>
      </div>
      <label for="o2s1q01" class="commentText"><p>As rare as divine? no way.</p>

<p>As rare as hinekoras lock? maybe</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
