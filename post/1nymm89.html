

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/3op3yfowaatf1.png"><p>Im in need of crafting advice</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/3op3yfowaatf1.png" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="nhvozzv" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>MegabyteBeagle</div>
        <div>2 | 3 hours ago </div>
      </div>
      <label for="nhvozzv" class="commentText"><p>Only has 1 prefix left, desecration might be the best option, you&rsquo;ll at least get a few options to choose from. If you get &ldquo;% increased physical damage&rdquo; or &ldquo;% increased elemental damage&rdquo; you could after use a perfect essence and gamble a &ldquo;gain % physical&rdquo; or &ldquo;gain % lightning&rdquo; and  hope it removes the one that isn&rsquo;t affected by the modifier in the desecration, but this is just for the gamble.</p>

<p>I&rsquo;d either do that or sell as is, but I&rsquo;m unsure how much it is worth given the saturation of bows in the market and the ability to craft really good ones.</p>

<p>Additionally, you could guarantee a desecration by using the correct omen, like Amanamu, to get the &ldquo;% increased damage while companion is in your presence&rdquo; or other that  you like (from the prefixes).</p>

<p>Last option could be to use the abyss essence with omen to remove a prefix and see which one gets removed from both T4s, in an attempt to get a higher tier.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nhvoq7b" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>whyaremaggotsmad</div>
        <div>1 | 3 hours ago </div>
      </div>
      <label for="nhvoq7b" class="commentText"><p>Desecrate and use an echo to look twice. Pray to God you see phys %. If you don&rsquo;t, you need to think about If it&rsquo;s worth it to omen of light or will buying a non crit bow be cheaper this late in the league.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="nhvqm1h" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>mishkamans</div>
        <div>1 | 2 hours ago </div>
      </div>
      <label for="nhvqm1h" class="commentText"><p>Also use the abyss omens to increase your chance of the correct one</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nhvwdxg" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>laeriel_c</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="nhvwdxg" class="commentText"><p>How much currency do you wanna spend on this? That will really change the advice people give you. It&rsquo;s expensive to craft with suffixes done first because you end up having to use whittles to hit higher tier prefixes but suffixes can be easily solved with essences if you have your most important suffix fractured (like crit chance or +2 arrows lets say). +4 attack skills from the essence unfortunately is better than +5 proj because it applies to skills like herald and wind dancer.</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
