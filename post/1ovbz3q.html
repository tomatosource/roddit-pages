

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>

<div class="commentAndChildren">

    <div class="comment">
      <div class="commentHeader">

        <div>1 | 12 minutes ago </div>
      </div>
      <label for="nohviqz" class="commentText"><p>Like others have said, if you are enjoying the game, you are doing it right. :) but also like other&rsquo;s have said your stats seem fairly low for that part in the campaign. Check the vendors every time to level up they change out what they are selling. Also be sure to at minimum exalt orb every piece of gear you wear so it has 6 mods.</p>

<p>Also, checking out a leveling guide for your class might not hurt.</p>

<p>There is a site called poe.ninja that you can connect your GGG account to and it will show your character in a form that you can link here so people can give specific advice.</p>

<div class="commentAndChildren">
  <input id="nohvy4r" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>throwaway857482</div>
        <div>1 | 10 minutes ago </div>
      </div>
      <label for="nohvy4r" class="commentText"><p>I can’t speak for stat numbers, but I think you could improve in the skill usage. A lot of players make a mistake of investing too widely.</p>

<p>The doryani boss footage is much rougher than your later one. One thing is that for Doryani you are mostly using armour piercing rounds and lightning spear. Breaking armour makes the enemy take more physical damage. Lightning spear mostly does lightning damage so it doesn’t really benefit. By contrast for Omniphobia you used the base spear throw which deals phys damage usually, so that does work together.</p>

<p>It seems like you’re are using living lightning support on lightning spear. That creates minions, but minions do not use your stats so they don’t scale with your increases to lightning damage.</p>

<p>I’m curious what your passive tree is like.</p>
</label>

  </label>

</html>
