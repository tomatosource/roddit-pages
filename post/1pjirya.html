

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://www.reddit.com/r/PathOfExile2/comments/1pjirya/can_we_do_something_about_support_gems_and_rune/"><p>Can we do something about support gems and rune drops?</p>
</a>
    </h2>

    
    <div class="selfPostContainer">
      <p>Low tier supports and runes should be available for trying out stuff. Picking a bad support or lacking attributes early game feels so bad.</p>

    </div>
    

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="ntduiv5" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>AllaValhallaBalla</div>
        <div>1 | 19 minutes ago </div>
      </div>
      <label for="ntduiv5" class="commentText"><p>Pleeeeeaaaaaassseeeee!!!!</p>

<p>Just did a practice run and was overloaded on skill gems of each level, by like 3 or 4x what I needed. Hitting the necessary bosses and a few lucky drops got half of my skills fully supported on the base 3-link.</p>

<p>Runes are even worse off. Not only can you not reuse them, and upgrades are necessary every few levels. But they are so few and far between, AND there are so many of them you&rsquo;d be lucky to see 2 of the same kind to cover any real holes in early builds. Then face the problem all over again when you find a nice upgrade.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="ntduxou" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>zethras</div>
        <div>1 | 17 minutes ago </div>
      </div>
      <label for="ntduxou" class="commentText"><p>I have been watching some speed runs and it seemd they get most of their skill ans support gems and rune drops (or at least can get 2 of the basic one) from doing optional mini boses.</p>

<p>Its very interesting how they can do 4hr to end game and know all the optional boses and rares for the things they need.</p>

<p>But I believe you should be able to buy them after a certain point. Maybe you can buy lvl 1 support after act 1. Apply this to skill gems and runes.</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
