

<html>

    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,

*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;

  font-family: arial;
}

body {

  flex-direction: column;
  align-items: center;

}

h1 {

}

h2 {
  padding: 24px;

  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {

}

.postList {
  display: flex;

}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/1riucilvup9f1.png"><p>What Azmeri Wisps should have been [Atlas Redesign]</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/1riucilvup9f1.png" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="n0ae3ys" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>StalksYouEverywhere</div>
        <div>1 | 10 minutes ago </div>
      </div>
      <label for="n0ae3ys" class="commentText"><p>Did a small project to redesign the Azmeri Wisp section of the Atlas. The entire bottom right corner becomes &ldquo;the wisp corner&rdquo; and essences would be moved to its own section of the atlas.</p>

<p>The general idea was to give players more agency in altering what the wisps do and creating more emergent situations where depending on how you specced your tree the wisps can do many cool things when the stars align and you get combinations of them.</p>

<p>And for the crazy person who invests all their points into wisps and has some luck, they can encounter chaining cascades of wisps that influence multiple normal/magic monsters that automatically seek out their rares and proliferate their influence across the normal and magic monsters in the map.</p>

<p>The top section is the &ldquo;QoL&rdquo;  section:</p>

<ul>
<li><p>Flat number of guaranteed wisps (2) so you always see at least 2 in your maps if you specced into them</p></li>

<li><p>Seeing wisps and their pathing on the minimap at all times so you never miss a wisp and know where they went</p></li>

<li><p>The influence on normal and magic monsters caused by Azmeri wisps pathing through them can now proliferate to other normal and magic monsters. So if the wisp just barely touches a pack, the entire pack will get prolifed and influenced.</p></li>

<li><p>Automatic pathing for Azmeri spirits so that as soon as you trigger a wisp it goes off and does its thing, and you can clear the influenced monsters and the possesed rare at your own pace</p></li>
</ul>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
