    </h2>

<div class="commentAndChildren">

      <div class="commentHeader">

      <label for="n0ae3ys" class="commentText"><p>I did a small project to redesign the Azmeri Wisp section of the Atlas to make the mechanic more interesting, because in its current state the Wisps and the Wisp atlas Nodes are very bland and there is 0 reason to spec into them.</p>

<p>The general idea was twofold: (1) More QoL so the mechanic feels better and (2) To give players more agency and more &ldquo;epic moments&rdquo; where you get groups of wisps creating chaotic cascades and altering what the wisps do/how they behave, thus creating more emergent situations where depending on how you speced your tree the wisps can do many cool things when the stars align and you get combinations of them.</p>

<p>For the crazy person who invests all their points into wisps and has some good luck, they can encounter chaining cascades of reviving wisps that have a small chance to upgrade to unique wisps, they potentially keep multiplying and influencing more and more normal/magic monsters that can proliferate their mods to other normal/magic monsters and wisps that can automatically seek out their rares and proliferate their influence around the map without you having to do &ldquo;NPC escort missions&rdquo; that everybody in gaming hates already.</p>

<p>(The entire bottom right corner of the Atlas becomes &ldquo;the wisp corner&rdquo; and essences would be moved to its own section of the atlas.)</p>

<hr>

<p>The top section is the more QoL &ldquo;hands off&rdquo; section:</p>

<ul>
<li><p><strong>Morning and Midnight Vigil</strong> give a flat number of guaranteed wisps (2) so you always see at least 2  guaranteed wisps in your maps if you like the mechanic and spec into them</p></li>

<li><p><strong>Peer Through</strong> Makes you see wisps and their pathing on the minimap at all times so you never miss a wisp hiding in a faraway corner and you know where they pathed too so you can plan your pathing and skip backtracking</p></li>

<li><p><strong>Refraction</strong> - The influence on normal and magic monsters can now proliferate to other normal and magic monsters. So if the wisp just barely touches a pack, the entire pack will get prolifed and influenced, drag that pack with you into another pack? Now that pack is influenced too!</p></li>

<li><p><strong>Radiant Pursuit</strong> - Automatic pathing for Azmeri spirits so that as soon as you trigger a wisp it goes off and does its thing, and you can clear the influenced monsters and the possesed rare at your own pace - <strong>No more annoying NPC escort missions!</strong></p></li>
</ul>

<hr>

<p>The middle section with its only new node:</p>

<ul>
<li><strong>Second Dawn</strong> is meant as a low chance high payoff node that makes some epic moments. You need to first naturally find a Sacred Wisp (be it Fox or Hare) and when it possesses a monster it will also automatically get the 2nd unique wisp buff on the same monster for some truly epic reviving-boss battles. (It also has some synergy with Luminous Echoes (bottom section) that gives a small chance to upgrade a spirit to unique when its released. Spirits can get released via the already existing node &ldquo;shining trail&rdquo; that has a 25% chance to revive a spirit, or using the Azmeri Omen that revives a spirit upon death thats also already in the game</li>
</ul>

<hr>

<p>The bottom crazy &ldquo;wisp chain&rdquo; section:</p>

<ul>
<li><p><strong>Azmeri Trinity</strong> allows normal and magic monsters to be influenced by 3 wisps at the same time and empower them. Currently on live it works only for 1 wisp at a time, so even if multiple wisps path through, nothing happens, only 1 wisp &ldquo;charges up&rdquo; on live. With this node you can empower multiple wisps and have multiple modifiers on packs of white or blue monsters from the wisps, creating some crazy situations if you can get 1+ wisps to go through a pack together.</p></li>

<li><p><strong>Luminous Echoes</strong> This node plays off the previous one behind it that&rsquo;s already in the current game, that gives a 25% chance when you kill a Azmeri possesed rare, that it releases all its spirits. When it does so, this proposed <strong>Luminous echoes</strong> has a 10% chance to duplicate one of the released spirits, a 5% chance to triplicate it and a 1% chance to upgrade a random released spirit into a Sacred Spirit (Fox / Hare). You can also trigger a release of a spirit with the Azmeri Spirit Omen thats already in the game. This node (if lucky enough) can create chaining cascades of multiple Azmeri spirits that create some truly juiced up rares. And with the previous Azmeri Trinity node, if you get lucky and get multiple spirits from duplicating/triplicating on a release &ldquo;proc&rdquo; now you get 3 azmeri spirit mod normal/magic packs as well, all 3 wisps charging up at the same time with every normal/magic you kill.</p></li>
</ul>
