

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://www.reddit.com/gallery/1qk2uhc"><p>Can this two work together?</p>
</a>
    </h2>

    

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="o13i17d" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Volitar</div>
        <div>1 | 33 minutes ago </div>
      </div>
      <label for="o13i17d" class="commentText"><p><a href="https://www.youtube.com/watch?v=2d646c8_m0k" target="_blank">https://www.youtube.com/watch?v=2d646c8_m0k</a></p>

<p>TLDR works don&rsquo;t use Sacred Flame sceptre if you do this tech.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="o13fbm6" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>beyond_autism</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="o13fbm6" class="commentText"><p>From how I understand, they don&rsquo;t work together. It&rsquo;ll likely be a net negative in damage as ignore occurs first, so rakiatas will only ever swap negatives into positives lowering damage you do</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="o13fvma" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>PaleozoicFrogBoy</div>
        <div>1 | 43 minutes ago </div>
      </div>
      <label for="o13fvma" class="commentText"><p>No, IIUC Heavy Frost will do nothing for the skill supported by Rakiata&rsquo;s.</p>

<p>Rakiata&rsquo;s will take a res like 50% cold, flip it to -50% cold. After that, penetration is applied, but cannot lower below 0%. Because we&rsquo;re already at -50% from Rakiata&rsquo;s, pen does nothing.</p>

<p>Heavy frost is similar here, except it actually explicitly says &ldquo;hits ignore NON-NEGATIVE res of frozen enemies&rdquo;, so no Heavy Frost won&rsquo;t be useful for your Rakiata skill (except for the freeze buildup but meh).</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="o13kieh" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Bigboysama</div>
        <div>1 | 22 minutes ago </div>
      </div>
      <label for="o13kieh" class="commentText"><p>If you have both, it will be like Heavy frost would do nothing except just 20% inc freeze buildup. Rakiata will make you treat res to the negative side, and Heavy frost would ignore any positive value.</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
