

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/5mmprkkrdkmf1.png"><p>The new trade system is such a massive QOL improvement but I have just one request</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/5mmprkkrdkmf1.png" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="nbuh7gi" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Kvicksilver</div>
        <div>1 | 37 minutes ago </div>
      </div>
      <label for="nbuh7gi" class="commentText"><p>This and a way to save searches </p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="nbulsz4" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>aY227</div>
        <div>1 | 14 minutes ago </div>
      </div>
      <label for="nbulsz4" class="commentText"><p>For now try this - <a href="https://chromewebstore.google.com/detail/better-pathofexile-tradin/fhlinfpmdlijegjlpgedcmglkakaghnk" target="_blank">https://chromewebstore.google.com/detail/better-pathofexile-tradin/fhlinfpmdlijegjlpgedcmglkakaghnk</a></p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nbugwy7" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>PhabioRants</div>
        <div>1 | 38 minutes ago </div>
      </div>
      <label for="nbugwy7" class="commentText"><p>It&rsquo;s my first time playing in trade in PoE2 and I was shocked that this isn&rsquo;t a thing, and that no one seems to have made a third-party trade side to remedy this. </p>

<p>To remove the friction from buying, while keeping such extreme friction on actually finding items to buy seems insane to me. </p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="nbukbjg" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>UncleSecco</div>
        <div>1 | 21 minutes ago </div>
      </div>
      <label for="nbukbjg" class="commentText"><p>Third-party trade website was a thing before GGG decided to make their own. We have the pseudo searching in PoE1, I think it&rsquo;s just a matter of time before they implement it in poe2. Nobody will do a third-party website because GGG will strike it down in two seconds just like they did when they made the trade site in poe1.</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nbuj94s" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>LtCobra</div>
        <div>1 | 27 minutes ago </div>
      </div>
      <label for="nbuj94s" class="commentText"><p>And maybe you know, letting us open our inventory to look at our items mods without having to close the market and open it again</p>

<p>Seems like something quite obvious but somehow they miss these things</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="nbuh0vx" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>iceandfire215</div>
        <div>1 | 38 minutes ago </div>
      </div>
      <label for="nbuh0vx" class="commentText"><p>Yeah I don&rsquo;t get that. It can&rsquo;t be a very difficult thing to add. It&rsquo;s annoying to search things up with multiple and/or/count sections just to find some resistances.</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
