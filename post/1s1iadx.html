    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;

*,

*:after {
  box-sizing: border-box;
}

html {

  color: #ddd;
  font-family: arial;
}

body {

  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {

  padding: 32px;
  color: #c39429;
}

h2 {

  font-weight: bold;
}

input[type="checkbox"] {

blockquote {

}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;

.commentList {
  border-left: none;

  flex-direction: column;
  width: 100%;
  padding-left: 32px;

body > .commentList {

.commentAndChildren {

.comment {

  border-bottom: 1px solid #555;

.commentText,
.commentText * {

  color: wheat;

.commentHeader {

  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}
