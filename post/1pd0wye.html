

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/cx8kphp0xy4g1.jpeg"><p>Wittling help</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/cx8kphp0xy4g1.jpeg" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="ns1orqm" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>KnightOnlineGOATED</div>
        <div>2 | 12 hours ago </div>
      </div>
      <label for="ns1orqm" class="commentText"><p>As far as i know it targets lowest ilvl mod - t3 crit chance is ilvl44 so you can whittle now, but once you hit higher tier mod instead of fire and it can be some shit mod like t1 accuracy then the bow is bricked</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="ns20xg1" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Xarastos</div>
        <div>1 | 10 hours ago </div>
      </div>
      <label for="ns20xg1" class="commentText"><p>Why would it be bricked can just remove  the desecrated mod</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="ns2a9fo" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>PathOfSpinning</div>
        <div>1 | 9 hours ago </div>
      </div>
      <label for="ns2a9fo" class="commentText"><ol>
<li><p>when you use an omen of whittling it will highlight the mod that will be removed before you click</p></li>

<li><p><a href="https://poe2db.tw/" target="_blank">https://poe2db.tw/</a> check the item levels of your mods before investing in an omen of whittling</p></li>

<li><p>t5 flat fire is ilv 54 and t3 crit is ilvl 44, so your omen of whittling would remove the crit again. you would need to omen of light -&amp;gt; desecrate for t2 crit or better first</p></li>

<li><p>this weapon is not worth spending whittles on, you have about a 5% chance of rolling a better mod than t5 fire, and there are way too many shit mods that can brick your craft because even t1 crit is only level 73</p></li>
</ol>

<p>if you wanted to whittle, you should have first fractured t1 crit</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
