

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/eqmhezkh3gig1.jpeg"><p>Craft Help</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/eqmhezkh3gig1.jpeg" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="o4exxnr" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Merdurone</div>
        <div>1 | 30 minutes ago </div>
      </div>
      <label for="o4exxnr" class="commentText"><p>To get rid of global defences use an omen of sinistral annulment. But the chance to hit t1 spirit is really low, if I’m not totally wrong it’s ~0.25%. You could check that at poedb. That would average at about 2k div for omens, if you’re unlucky it’s even more.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="o4eytco" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>UnSigNed123</div>
        <div>1 | 22 minutes ago </div>
      </div>
      <label for="o4eytco" class="commentText"><p>Edit: Just scrolled down and realized this process was already brought up, sorry.</p>

<p>Because you don’t already have a desecrated modifier, you can «rotate» your not-fractured prefix with a Prefix targeted Essence of the Abyss, which you can then desecrate and reveal with an echo to look for spirit. If you miss, you can prefix target an Enhancement Essence to return to your current state, and then retry, but do not take an All Defenses desecration.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="o4f128p" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>sdirie</div>
        <div>1 | 2 minutes ago </div>
      </div>
      <label for="o4f128p" class="commentText"><p>Yeah it’s not letting me use essence of the abyss anymore.  I’m not sure but I think I already used it.  The best I can come up with is Dextral annul global defense  off and then I was thinking of catalysing mana, prefix desecrate and consuming the catalyst with a perfect exalt for hopefully #mana.  If I hit Mana I’ll just need to hit T1 spirit on desecration but I know it’s very hard to hit that as it could become very expensive.</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="o4eu4ox" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>sauce_and_coffee</div>
        <div>1 | an hour ago </div>
      </div>
      <label for="o4eu4ox" class="commentText"><p>You can use omen of sinistral crystallization (if that is the one that targets prefixes) along with essence of the abyss to remove the global defences and add a desecration. Then you can reveal (use omen of echoes if you want) to see if you get spirit, or for instance mana. Then if you miss, you can use essence of defence (?) along with the same prefix-omen to get global defence back, and the use the prefix-omen with a new essence of abyss to try desecrating again. This is a cheap way to desecrate spirit. But remember; if you at any point chose global defence as a desecrated mod, you will have to use an omen of light to remove it again, since if blocks the use of global defence essence.<br>
Hope this helps. I can&rsquo;t remember all the names of the essences and omens atm, and since I&rsquo;m at work I can&rsquo;t check, but hopefully you understand :)</p>

<p>Edit: The only reason this works is because you have fractured % mana as a prefix, so that&rsquo;s safe, and you have full suffixes, so the mark of the abyssal lord will always land on a prefix.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="o4ezqkx" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Merdurone</div>
        <div>1 | 14 minutes ago </div>
      </div>
      <label for="o4ezqkx" class="commentText"><p>Shouldn’t he sinistral annul and perfect exalt, because the pool of mods is even bigger with desecration? He only has 1 mod which could be deleted, I think I would only use this option for the last modifier.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="o4f05t5" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>sauce_and_coffee</div>
        <div>1 | 10 minutes ago </div>
      </div>
      <label for="o4f05t5" class="commentText"><p>Sure, but then you always risk removing the extra modifier and not the desecrated one with the global def essence, so you have to omen of light it off&hellip;</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="o4f0ap5" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Merdurone</div>
        <div>1 | 9 minutes ago </div>
      </div>
      <label for="o4f0ap5" class="commentText"><p>But he only has 1 prefix that could be targeted with sinistral annul.</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

</div>

    
  </div>
  
</div>

  <input id="o4euf0s" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Infinite-Ad5464</div>
        <div>2 | an hour ago </div>
      </div>
      <label for="o4euf0s" class="commentText"><p>Dextral Annul</p>

</div>

        
      
    </div>
  </body>
</html>
