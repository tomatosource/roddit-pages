.commentList {

.commentText,
.commentText * {

.commentHeader {

  color: #c39429;

.postTitle {

.commentAndChildren > .commentList {

.commentAndChildren > input:checked ~ .commentList {

.commentAndChildren label .comment .commentText {
  white-space: nowrap;

  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;

.selfPostContainer {

.streamableContainer {

  left: 0;

  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}
