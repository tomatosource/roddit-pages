      <label for="oi1ku61" class="commentText"><p>From Chris Forsberg:</p>

<p>Neemias Queta’s NBA future was murky at best when the Sacramento Kings cut him in September of 2023.</p>

<p>The Boston Celtics, despite an overstocked frontcourt that would soon deliver the franchise’s 18th title, were convinced they could mold Queta into the sort of player who could aid a championship quest.</p>

<p>“They told me right away, like, ‘OK man, you’re here, we got these guys ahead of you, they&rsquo;re really good, and you can become one of them. But you&rsquo;ve got to put in the work,’” said Queta. “We&rsquo;ve got to put you through these situations where we can develop you and try to get the best version of yourself.”</p>

<p>A dramatic frontcourt overhaul this past summer cleared a pathway for Queta to elevate to a starting role. But it was Queta’s relentless desire to improve, <a href="https://www.nbcsportsboston.com/nba/boston-celtics/celtics-superlatives-awards-2025-2026/781618/" target="_blank">including over the course of the 2025-26 season</a>, that confirmed Boston&rsquo;s decision and helped Queta emerge as one of the best value contracts in the league.</p>

<p>&hellip; Joe Mazzulla said it was a series of spot starts that Queta made last season when Celtics’ veteran big men were resting that helped Queta earn the trust of the coaching staff. After Al Horford, Kristaps Porzingis and Luke Kornet all departed this offseason, Mazzulla made sure Queta knew he was going to be the starting big man for the 2025-26 Celtics.</p>

<p>“We had guys out [last season] and he won a game for us,” said Mazzulla. &ldquo;There’s been a bunch of times where Al or KP had sat, or guys were out, and Neemi played, and the minutes that you give are so impactful. And I thought it was important to empower him to be the starting center of the Celtics after what he did for us over the last couple years in Maine, [and] in those games where guys are out. And he&rsquo;s taken that responsibility and ownership very seriously.”</p>
