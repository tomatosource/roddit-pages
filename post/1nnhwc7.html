

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://v.redd.it/hcfalr64poqf1"><p>His Vile Intrusion -Physical warp that does not make your eyes bleed</p>
</a>
    </h2>

    

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="nfmos4w" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>RebellionWasTaken</div>
        <div>1 | 5 hours ago </div>
      </div>
      <label for="nfmos4w" class="commentText"><p>Been looking at the skill too! Thinking it might be good with poison/bleed to start the prolifs, and then switch to something else for single target.</p>

<p>Obvious it would mean not being bloodmage which is a downside. But the staff does come with a magnitude modifier to damaging ailments that can be useful</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="nfnab2w" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Ordinary_Durian</div>
        <div>1 | 3 hours ago </div>
      </div>
      <label for="nfnab2w" class="commentText"><p>The thing is, no such thing is needed for regular clear, maybe for the rare that is around the exploding normal mobs. It does however leave impales, so raking the surviving rares uses the impales and helps with magnitude of bleeding.</p>

<p>For bleeding and poisoned bosses, I tried His Foul Emergence, which has a beautifl animation, but takes forever, cannot be scaled with levels and cannot be triggered.</p>

<p>Hopefully Blood Mage will be more specialized in physical spells in 0.4</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="nfngppu" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>RebellionWasTaken</div>
        <div>1 | 3 hours ago </div>
      </div>
      <label for="nfngppu" class="commentText"><p>Ah that sucks, I was leveling a character to test out His Foul Emergence, but if it can&rsquo;t be scaled with levels then that makes things way worse</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="nfnwsiq" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Ordinary_Durian</div>
        <div>1 | 35 minutes ago </div>
      </div>
      <label for="nfnwsiq" class="commentText"><p>Sorry, I should have been more specific. You can scale it in theory, but in practice you are limted to +3 on amulet and +1 physical mastery support. There is also the socketable +1 but that is expensive as all hell.</p>

<p>There is no Prism of belief, no level on staff. If there were and it was triggerable, it would be magnificient.</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

    
  </div>
  
</div>

    
  </div>
  
</div>

        
      
    </div>
  </body>
</html>
