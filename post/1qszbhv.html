

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/acbb48l44wgg1.jpeg"><p>Is this Talisman a steal ?</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/acbb48l44wgg1.jpeg" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="o2z0bth" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Salty_Ad_7940</div>
        <div>1 | 19 minutes ago </div>
      </div>
      <label for="o2z0bth" class="commentText"><p>In my opinion no. You can actually craft one far far better but as far as one that dropped randomly it isn’t the worst. Plus if it helps you in the short term more power to you. </p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="o2z1iyi" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Kesman90</div>
        <div>1 | 12 minutes ago </div>
      </div>
      <label for="o2z1iyi" class="commentText"><p>You can craft a better one than this for 8div?
Do you know that the base with t1 light+7skills is like 10div+</p>
</label>
    </div>
  </label>
  
</div>

    
      
<div class="commentAndChildren">
  <input id="o2z1lpb" type="checkbox" checked/>

      <div class="commentHeader">
        <div>Distinct-Race-2471</div>
        <div>1 | 12 minutes ago </div>
      </div>
      <label for="o2z1lpb" class="commentText"><p>Crafting it would cost 100 div.</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="o2z1wd7" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Legitimate_Bit_2496</div>
        <div>1 | 10 minutes ago </div>
      </div>
      <label for="o2z1wd7" class="commentText"><p>Isn’t elemental damage fake on a talisman? Since all wolf skills are scaling off physical damage converting to cold? Low physical damage with high elemental wouldn’t do anything since the converted damage is too low to begin with.</p>

<p>Idk I could be wrong, but on my bear while leveling I spent a div on one giving 125% elemental damage and it did nothing.</p>
</label>
    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="o2z2vab" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Kesman90</div>
        <div>1 | 5 minutes ago </div>
      </div>
      <label for="o2z2vab" class="commentText"><p>It 100% works on a elemental build, my build is all centred around elemental attack. You can clearly see that it stacks by looking at the dps.</p>

<p>Id say for a elemental attack build its a better prefix than flat phys.</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="o2z28yo" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>BeefarmRich</div>
        <div>1 | 8 minutes ago </div>
      </div>
      <label for="o2z28yo" class="commentText"><p>Look at it&rsquo;s DPS u get your answer.</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
