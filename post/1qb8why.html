      <label for="nz8rgnd" class="commentText"><p>Sorry for the paywall, this is the only outlet reporting on it as I type this. Some details from the article:</p>

<blockquote>
<p>The first step toward a Tampa Bay Rays stadium in Tampa could unfold as early as next week.</p>

<p>The Hillsborough College District Board of Trustees is expected to hold a special meeting Jan. 20 to vote on a deal that would make way for the Rays to turn the college’s North Dale Mabry campus into a 110-acre mixed-use district with a new ballpark, according to sources with knowledge of the deal.</p>

<p>The Dale Mabry campus has been eyed as a top contender for the Rays’ new home since the first public appearance of the team’s new ownership, led by Jacksonville homebuilder Patrick Zalupski. Zalupski said at an Oct. 7 news conference that his group will be seeking a property of around 100 acres to build a stadium-anchored district inspired by The Battery, home of the Atlanta Braves.</p>

<p>Hillsborough College’s Dale Mabry campus is one of the few properties that meet the criteria Zalupski outlined. The college is adjacent to Steinbrenner Field, the New York Yankees’ spring training facility and across North Dale Mabry Highway from Raymond James Stadium, home of the Tampa Bay Buccaneers. The college’s board of trustees controls over 100 acres between its parking lots and educational buildings, Hillsborough County property records show.</p>

<p>Rays representatives met with county staff on Monday, sources said, though it’s not known if the team has struck a deal for county funding. A spokesperson for Tampa Mayor Jane Castor said the HC meeting is not on the mayor’s calendar.</p>
</blockquote>
