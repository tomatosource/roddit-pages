

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>

<div class="commentAndChildren">

        <div>7 | 3 hours ago </div>

      <label for="ne1cv4n" class="commentText"><p>Yup. I feel like 30% of my corrupted stones were added Chilled ground. Still works as visioned: slow players as much as possible.</p>

<div class="commentAndChildren">
  <input id="ne1hdev" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>No_Atmosphere_3282</div>
        <div>3 | 3 hours ago </div>
      </div>
      <label for="ne1hdev" class="commentText"><p>This league I put 80% reduced curse on you on my chest instead of increased energy shield since I kept getting temp chains.  I took 53% freeze duration decrease on boots with 50% freeze duration decrease on spirit support for freeze immune and here&rsquo;s the trick for chilled ground ruining all that time you spent juicing your maps.</p>

<p>Create two expensive necklaces.  One for normal gameplay with your standard +skills and spirit and all that, then annoint it for DPS or whatever build enabler.  Then craft a second one and annoint it to be immune to chill if you have more blue support gems.  it&rsquo;s expensive and of course you&rsquo;d need blue support gems not green or red to be in the lead.</p>

<p>But since I was serious about end game mapping this time I got tired of temp chains and chilled ground costing me so much wasted opportunity and fixed it with in game solutions.  Now I run every map.  I still don&rsquo;t like the usual rippy suspects like lower resist plus gain elemental damage plus crit and all that and occasionally die to those if I run them in abyss overrun maps but map mods don&rsquo;t need to be read at this point on my Arc Stormweaver and that was my goal I just had to invest in it.</p>

<p>I had a stash tab full of just chilled ground I wouldn&rsquo;t run until I fixed it now it&rsquo;s a free mod like any curse mod.  I don&rsquo;t even notice temp chains at just 80% reduction and it makes elemental weakness and enfeeble do basically nothing worth noticing.  I keep just an amulet on swap and sacrificed some energy shield that&rsquo;s all.</p>
</label>
    </div>
  </label>
