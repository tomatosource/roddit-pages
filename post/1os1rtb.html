        <div>Informal_Aioli_857</div>
        <div>1 | a day ago </div>
      </div>
      <label for="nnu57xh" class="commentText"><p>I&rsquo;m so bad at crafting. I got an exceptional cbow with 3 sockets and I want to craft it since my next upgrade would cost me too many divs that I don&rsquo;t have.</p>

<p>I have no idea how to craft it</p>

  <input id="nny3em9" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Exaveus</div>
        <div>1 | 5 hours ago </div>
      </div>
      <label for="nny3em9" class="commentText"><p>Hopefully its still normal or magic. Assuming it is then you&rsquo;ll want to annul and perfect aug until you have a T1 elemental or phys % increase. If its not ilvl 82 you cannot get T1 phys %</p>

<p>If you&rsquo;re using bolts for your primary damage you&rsquo;ll want to make it rare with the Haste essence. Rolled T1 attack speed is limited to 19% while the essence is 25%</p>

<p>Next you&rsquo;ll use a desecrate on the prefix. Do not reveal.</p>

<p>Fracture for desired mod to save it. Hopefully your attack speed as you cant get it back, or the primary mod you want. You have a 66% chance of choosing a valuble mod with an unrevealed desecrate.</p>

<p>Reveal your desecrate look for accuracy to block it.</p>

<p>Next you&rsquo;ll do greater perfect homo exalt for an additional prefix and suffix. You&rsquo;ll get a flat attack mod and a suffix you wont need.</p>

<p>Now your fracture matters. If you hit attack speed then suffixes are no brainer just perfect essence of battle and haste if you want it. But use omens of crystallization to only hit your suffixes.</p>

<p>If you hit your main mod with the fracture you gotta risk your attack speed but plus 6 levels is way more important than the attack speed so its necessary.</p>

<p>Omen of light your accuracy desecrate and use a perfect homogenized exalt for your last prefix or desecrate to dig for your desired damage mod.</p>

<p>Dont forget to Vaal for the 4th socket lol</p>

<p>If you get lower than tier 1 flats or heaven forbid accuracy dont panic. Flat damage mods have the highest probability if you use a perfect chaos whittle.</p>

<p>If its not magic you&rsquo;re gonna have a hard time getting that %dmg. You&rsquo;ll have to chaos spam for it, desecrate dig, and or perfect homo exalt slams on every matching tag you get. Which is way less reliable and more expensive than annul aug spam. If its rare id just use it in the recombination bench and pray.</p>
</label>
    </div>

<p>Option one.</p>

<p>Option two.</p>

<p>Step 1.</p>

<p>You can exalt to add an affix use abyss omen desecrate for T1.</p>

<p>Step 2.</p>

<p>If that doesnt work then use a single chaos orb.</p>

<p>Repeat step 1.</p>

<p>expensive but might save time: You&rsquo;re obviously looking for T1 % phys but you can also hit flat phys with the desecrate or chaos spam then do perfect homo exalt using the prefix omen. You got a 50% chance of hitting %phys but not garunteed T1.)</p>

<p>This gives you the ability to omen your desecrate as well so you have more flexibility on other affixes.</p>

<p>Option 3 sell it.</p>

<p>Option 4. Do not reccomend Yolo recombination. Find a cheap uncorrupted unsanctified xbow being sold with T1 %phys. Get a T1 suffix on your exceptional. Slot your exceptional in the right slot because recombination table favors the right side when selecting bases lucky recombination omen and pray. Id only do this if I was convinced the base was cursed.</p>
