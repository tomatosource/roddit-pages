

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/l5hr3kolz07f1.jpeg"><p>Thoughts on Against the Anvil passive</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/l5hr3kolz07f1.jpeg" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="mxv6721" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>dsturbd85</div>
        <div>3 | 14 hours ago </div>
      </div>
      <label for="mxv6721" class="commentText"><p>I think the easiest method to make it work would be to make your attacks to have a chance ( 25-50% ) to retemper the weapon on hitting rare and unique monsters.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="mxvc4wc" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>jaymo_busch</div>
        <div>2 | 13 hours ago </div>
      </div>
      <label for="mxvc4wc" class="commentText"><p>I haven’t played with Temper myself yet, but the Invoker’s Unbound Avatar has some similar problems. Takes ages to stack up, by the time it’s ready I’m 3 minutes into a map and forgot I even have the skill, and if you use it before the boss and then don’t have enough monsters left to stack it up again, don’t get to use it on boss. 5% uptime. Ass skill, the 10% extra damage nodes the monk has in ascend are probably better</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="mxwkgai" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>FartsMallory</div>
        <div>1 | 7 hours ago </div>
      </div>
      <label for="mxwkgai" class="commentText"><p>So this ability actually scales with Cast speed you can make it do the full animation super quickly with the right items.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="mxx0yuz" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>EmperorMagikarp</div>
        <div>1 | 5 hours ago </div>
      </div>
      <label for="mxx0yuz" class="commentText"><p>I suppose a timer could work, could also be useful for buffing rhe skill to last longer. What I really want is for them to add an increasing AOE  damage component to the actual smithing. With this new component they could keep letting you temper at max stacks too. The sound is so satisfying and the animation is so cool. Would be neat to have the possibility of working the forge itself  be a build someone could do.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="mxx2cx4" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>BostonAndy24</div>
        <div>1 | 5 hours ago </div>
      </div>
      <label for="mxx2cx4" class="commentText"><p>I just think the other passives offer so much more value</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
