

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/zdx19t68px1g1.jpeg"><p>Kicked in the Vaals</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/zdx19t68px1g1.jpeg" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">

      </div>

    </div>
  </label>
  
  <div class="commentList">

      </div>

  </label>

        <div>1 | 16 hours ago </div>
      </div>
      <label for="npfr5aw" class="commentText"><p>Yeah some times the &ldquo;next step&rdquo; is a doozy. I remember I had a good main hand that I got for a couple Div, and the next step was hundreds of Div lol</p>

    </div>
  </label>
  
</div>

    
  </div>
  
</div>

        <div>Mirkorama</div>
        <div>1 | 15 hours ago </div>
      </div>
      <label for="npg0w77" class="commentText"><p>Sometimes you have to go for it.
I vaaled my big, irreplaceable chest 1 month in, ready to quit, but I hit it big. Still playing now.</p>
</label>
    </div>
  </label>
  
</div>

    
  </div>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="npg1jb4" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Mirkorama</div>
        <div>1 | 15 hours ago </div>
      </div>
      <label for="npg1jb4" class="commentText"><p>Addicted to vaaling and sanctifying.
Whole gear got vaaled to &ldquo;perfection&rdquo;, except one ring is missing. Deleted over 1k divine getting a decent enchant on one ring (the other already has one), bricked 3 rings and one got &ldquo;chaos resistance - enchant&rdquo;, I am CI.</p>

<p>Not sure if I have the power to go on, but I am so close!
So I feel your pain. I hate it that locks are so expensive, really want to try it on my current, last ring, since it has all attack modifiers max rolled.</p>

  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="npgnvlb" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>d-crow</div>
        <div>1 | 11 hours ago </div>
      </div>
      <label for="npgnvlb" class="commentText"><p>Ring sanctify is better than vaal generally. The actual chase vaaals are so low odds</p>

    </div>
  </label>
  
  <div class="commentList">
    
      
<div class="commentAndChildren">
  <input id="npgs3z7" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Mirkorama</div>
        <div>0 | 11 hours ago </div>
      </div>
      <label for="npgs3z7" class="commentText"><p>the odds of getting a good sanctification on an attack ring are also very slim.<br>
I did sanctify my rings before and getting overrolls on all attacks is not very likely. If you overroll one and underroll the other you are kinda at the same endresult again. I rather have them divine&rsquo;d to an good state I like and then gamble on the corruption. I am also fine with attributes as enchant, since my build needs 157 on all attributes.</p>

<p>Sanctification only feels really worth it if you can overroll an +skill rank, which I did with my amulet.</p>

  </label>
  
</div>

    
  </div>
  
</div>

    
  </div>
  
</div>

    <div class="comment">
      <div class="commentHeader">
        <div>na_ka_th</div>
        <div>1 | 5 hours ago </div>
      </div>
      <label for="npi2sy6" class="commentText"><p>I only Vaal if I can replace the item. If the outcome is good, you Vaal the second one too. Sometimes you end up with two insane items that both hit the extra socket, and you just insta-sell the one you don’t need for 200 or 300 div.</p>

    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
