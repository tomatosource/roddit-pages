      <label for="n337ju8" class="commentText"><p>From Chris Forsberg:</p>

<p>The 24-year-old Bassey has a very obvious skill set. He uses a 7-foot-3 wing span to disrupt shot attempts and is a rebounding fiend. He can subsist on putbacks and has excellent finishing ability around the basket.</p>

<p>As Bassey reintroduces himself to the NBA world in Vegas, the question is whether the Celtics might be able to extend this look at him.</p>

<p>The Celtics already have a fully stocked 15-man roster and Celtics president of basketball operations Brad Stevens said last week that the team is comfortable carrying this group into the 2025-26 season. There is some flexibility, however, as players like Neemias Queta and JD Davison are on non-guaranteed deals.</p>

<p>The Celtics still have some maneuvering to do to get back off the second apron after signing Garza and Josh Minott to minimum deals this offseason. That maneuvering could open another spot to add a player to the parent roster before the season tips.</p>
