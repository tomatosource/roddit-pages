

<html>
  <head>
    <link rel="manifest" href="/manifest.json" />
    <style>
       * {
  margin: 0;
  padding: 0;
  text-indent: 0;
  list-style-type: none;
}

*,
*:before,
*:after {
  box-sizing: border-box;
}

html {
  background-color: #111;
  color: #ddd;
  font-family: arial;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 32px;
}

h1 {
  font-size: 4em;
  padding: 32px;
  color: #c39429;
}

h2 {
  padding: 24px;
  font-size: 50px;
  font-weight: bold;
}

input[type="checkbox"] {
  position: absolute;
  top: -9999px;
  left: -9999px;
}

blockquote {
  border-left: 10px solid #ccc;
  margin-top: 32px;
  margin-bottom: 32px;
  padding-left: 24px;
  quotes: "\201C" "\201D" "\2018" "\2019";
}

.subName {
  text-decoration: none;
}

.postList {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.post {
  width: 100%;
}

.postLink {
  border-bottom: 1px solid #555;
  padding: 32px 0;
  text-decoration: none;
  font-size: 42px;
  color: wheat;
  display: block;
  position: relative;
}

.postLink:visited {
  color: #806a42;
  top: 100px;
}

.postHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.commentList {
  border-left: none;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding-left: 32px;
}

body > .commentList {
  padding-left: 0px;
}

.commentAndChildren {
  margin-top: 40px;
  width: 100%;
}

.comment {
  padding: 16px 0;
  border-bottom: 1px solid #555;
}

.commentText,
.commentText * {
  font-size: 38px;
  line-height: 1.5;
  word-wrap: break-word;
  color: wheat;
}

.commentHeader {
  display: flex;
  font-size: 24px;
  font-weight: bold;
  justify-content: space-between;
  color: #c39429;
}

.postTitle {
  text-decoration: none;
  color: #c39429;
}

.commentAndChildren > .commentList {
  display: none;
}

.commentAndChildren > input:checked ~ .commentList {
  display: block;
}

.commentAndChildren label .comment .commentText {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.commentAndChildren input:checked ~ label .comment .commentText {
  white-space: break-spaces;
  overflow: auto;
  text-overflow: unset;
}

.selfPostContainer {
  font-size: 38px;
  line-height: 1.5;
  color: white;
  word-break: break-word;
  max-width: 100%;
}

.selfPostContainer * {
  color: white;
}

.selfPostImage {
  width: 100%;
  height: auto;
}

.streamableContainer {
  max-height: 30vh;
  width: 100vw;
  left: 0;
  position: sticky;
  top: 0;
  background: #111;
  padding-bottom: 24px;
  overflow: visible;
}

.tweetContainer {
  width: 100%;
  display: flex;
  justify-content: center;
}

    </style>
  </head>
  <body>
    <h2>
      <a class="postTitle" href="https://i.redd.it/3w111c62bfgh1.jpeg"><p>Store Weapon</p>
</a>
    </h2>

    
	<div class="selfPostContainer">
		<img class="selfPostImage" src="https://i.redd.it/3w111c62bfgh1.jpeg" />
	</div>
  

    <div class="commentList">
      
        
          
<div class="commentAndChildren">
  <input id="p0qlxz9" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Sudden-Pineapple-793</div>
        <div>1 | 30 minutes ago </div>
      </div>
      <label for="p0qlxz9" class="commentText"><p>Really solid mods but unfortunately very low tiers.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="p0qlsqg" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>OGSin</div>
        <div>1 | 30 minutes ago </div>
      </div>
      <label for="p0qlsqg" class="commentText"><p>For T1 maps, around level 62-66, sure it&rsquo;ll absolutely get you by!</p>

<p>You&rsquo;ll quickly hit a wall around T8-T10. However 5-10d would probably net you an overall upgrade. Take my words with a grain of salt however, I refuse to play melee builds, and rarely play a build with martial weapons in general.</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="p0qm3o3" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Salem_Alvian</div>
        <div>1 | 29 minutes ago </div>
      </div>
      <label for="p0qm3o3" class="commentText"><p>The +4 is good but that’s about it. I’m no expert but all those ele mod numbers are really low. You’d want those numbers to be about double do get past t1 maps</p>
</label>
    </div>
  </label>
  
</div>

        
      
        
          
<div class="commentAndChildren">
  <input id="p0qqitp" type="checkbox" checked/>
    <div class="comment">
      <div class="commentHeader">
        <div>Customer-Useful</div>
        <div>1 | 10 minutes ago </div>
      </div>
      <label for="p0qqitp" class="commentText"><p>pretty bad dps, because of the base item and the bad prefix tiers. maybe use an essence with &ldquo;gain % of damage as extra&rdquo; for prefixes and then desecrate a prefix with reroll omen. very cheap and very likely to improve it.</p>

<p>+4 is the saving grace but the crit is super low and lower attribute req. is useless.</p>

<p>honestly can prolly buy better ones for 5 exalts and slam a +3 attack skills essence</p>
</label>
    </div>
  </label>
  
</div>

        
      
    </div>
  </body>
</html>
